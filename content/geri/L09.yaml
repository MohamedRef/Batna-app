      - ["Live-attenuated VZV with >10 times the titre of chickenpox vaccine", More antigen available]
      - ["Subunit glycoprotein E vaccine with AS01 adjuvant", "Robust, persistent VZV-specific antibody and CD4+ T-cell responses"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 162, quote: "Major Ag with adjuvants" }
    status: unverified
  - id: geri.L09.036
    kind: cloze
    topic: vaccination
    text: "The live-attenuated shingles vaccine has more than {{c1::10 times}} higher viral titres than the chickenpox vaccine; the subunit vaccine uses glycoprotein {{c2::E}} with adjuvant {{c3::AS01}}."
    src: { page: 162, quote: "Subunit glycoprotein E vaccine with AS01" }
    status: unverified
    tags: [numbers]
  - id: geri.L09.037
    kind: mcq
    topic: vaccination
    stem: Which is NOT a strategy the lecture lists for making vaccines work better in the elderly?
    options:
      - Giving a lower antigen dose to avoid reactions
      - Adding adjuvants such as MF59 or AS03
      - Quadrivalent instead of trivalent influenza strains
      - Microneedle intradermal delivery
      - Viral vector-based vaccines
    answer: 0
    why:
      - "Correct: the strategy is to increase the dose and antigen, not lower it (p161-162)."
      - Adjuvants enhance immunogenicity.
      - Quadrivalent vaccines add antigen and avoid mismatch.
      - Intradermal delivery improves antigen presentation.
      - Viral vectors are a novel approach.
    src: { page: 161, quote: "Increasing vaccine dosage." }
    status: unverified
  # ---------- p162-164: COVID ----------
  - id: geri.L09.038
    kind: card
    topic: covid
    front: How is SARS-CoV-2 transmitted and how does it present?
    back: Mainly by respiratory droplets; fever, cough, myalgia and fatigue.
    src: { page: 162, quote: "SARS-CoV-2 is transmitted predominantly via respiratory droplets. Clinically, patients frequently present with fever, cough, myalgia, and fatigue" }
    status: unverified
  - id: geri.L09.039
    kind: order
    topic: covid
    prompt: Order the course of severe COVID-19 in an elderly patient.
    steps:
      - Bilateral diffuse alveolar damage
      - Acute respiratory distress syndrome
      - Cytokine storm
      - Endothelial injury and coagulation activation
      - DIC with consumption of clotting factors
      - Organ damage and death
    src: { page: 163, quote: "The uncontrolled systemic inflammation causes endothelial injury and activation of coagulation cascade." }
    status: unverified
  - id: geri.L09.040
    kind: card
    topic: covid
    front: How does SARS-CoV-2 enter human cells?
    back: Its spike (S) protein binds ACE2; entry needs priming of S by TMPRSS2, a human serine protease.
    src: { page: 163, quote: "The successful entry needs the priming of the S protein by TMPRSS2, a human cellular serine protease" }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.041
    kind: card
    topic: covid
    front: Why may the elderly develop worse COVID-19 inflammation?
    back: Elderly lung macrophages may produce more IL-6 and other pro-inflammatory cytokines.
    src: { page: 163, quote: "Macrophages from elderly lungs may have a more pronounced production of IL-6 and other pro-inflammatory cytokines" }
    status: unverified
  - id: geri.L09.042
    kind: cloze
    topic: covid
    text: "Severe COVID-19 has a higher {{c1::IL-6/interferon-γ}} ratio and fewer interferon-γ producing {{c2::CD4+}} T cells than moderate disease; rising IL-6 causes a relative {{c3::immunoparalysis}}."
    src: { page: 163, quote: "Patients with severe COVID-19 have a higher IL-6/Interferon-γ ratio than those who present with a moderate disease" }
    status: unverified
  - id: geri.L09.043
    kind: mcq
    topic: covid
    stem: An 82-year-old with COVID-19 deteriorates on day 9 with ARDS, high IL-6, falling platelets and prolonged clotting times. Which mechanism does the lecture describe?
    options:
      - Cytokine storm causing endothelial injury and DIC
      - Isolated bacterial superinfection only
      - Increased interferon-γ producing CD4+ T cells
      - Direct TMPRSS2 deficiency
      - Overactive NK cytotoxicity
    answer: 0
    why:
      - "Correct: uncontrolled inflammation injures endothelium and activates coagulation, giving DIC, organ damage and death (p163)."
      - Secondary bacterial infection can occur but does not explain DIC here.
      - Severe disease has fewer IFN-γ producing CD4+ T cells.
      - TMPRSS2 primes viral entry; a deficiency would not cause this.
      - NK cytotoxicity is reduced in old age.
    src: { page: 163, quote: "The consequence is an explosive process of disseminated intravascular coagulation and consumption of coagulation factors" }
    status: unverified
  - id: geri.L09.044
    kind: card
    topic: covid
    front: In the lecture's age figure, what rises and what falls in the immune system with chronological age in COVID-19?
    back: Pro-inflammatory cytokines and terminally differentiated memory T and B cells rise; the naive T-cell amount falls, shifting from an adaptive response towards cytokine storm and organ failure.
    src: { page: 164, quote: "Physical activity &Immune System" }
    status: unverified
  # ---------- p164-166: boosting ----------
  - id: geri.L09.045
    kind: enumerate
    topic: boosting
    prompt: Which benefits of exercise and physical activity on ageing immunity does the lecture show?
    points:
      - Lower risk of chronic age-related disease and all-cause mortality
      - Lower cardiometabolic risk factors
      - Better muscle mass and function
      - Lower systemic inflammation, anti-inflammatory profile
      - Better vaccine responses
    pass: 4
    src: { page: 164, quote: "Physical activity &Immune System" }
    status: unverified
  - id: geri.L09.046
    kind: table
    topic: boosting
    title: Isolation (COVID-19) with and without physical activity
    columns: [Feature, Without activity, With activity]
    rows:
      - [Behaviour, "More inactivity, physical dysfunction and mental distress", "Activity kept; less dysfunction and distress"]
      - [Immunity, "Dysfunctional innate and adaptive function", "Maintained or enhanced function"]
      - [Results, "Pro-inflammatory, latent virus reactivation, higher infection risk", "Anti-inflammatory, effective antiviral and antibacterial responses, lower risk"]
    blanks: [[1, 1], [1, 2], [2, 1]]
    src: { page: 164, quote: "Potential Impact of Isolation" }
    status: unverified
  - id: geri.L09.047
    kind: card
    topic: boosting
    front: How does the Mediterranean diet help ageing immunity?
    back: It down-regulates inflammatory mediators such as ICAM-1, VCAM-1, CRP and IL-6.
    src: { page: 165, quote: "The Mediterranean diet down-regulates the levels of inflammatory mediators" }
    status: unverified
  - id: geri.L09.048
    kind: card
    topic: boosting
    front: Which dietary approach may reverse immunosenescence, and how?
    back: Caloric restriction; it down-regulates IL-1β, IL-6 and TNF-α genes and the pro-inflammatory state.
    src: { page: 165, quote: "A new interesting approach related to the possible reversion of immunosenescence is caloric restriction." }
    status: unverified
  - id: geri.L09.049
    kind: card
    topic: boosting
    front: Main micronutrient studied for immune function in the elderly, and its roles?
    back: Zinc; it is involved in signal transduction, apoptosis, proliferation and differentiation of immune cells.
    src: { page: 165, quote: "One of the main micronutrients related to physiologic processes associated with immune system, and one of the main studied factors, is zinc." }
    status: unverified
  - id: geri.L09.050
    kind: table
    topic: boosting
    title: Vitamins and ageing immunity
    columns: [Vitamin, Effect in older adults]
    rows:
      - [Vitamin E, "↑ IL-2 production and activation-induced proliferation of naive (not memory) T cells; variable"]
      - [Vitamin C, "Counters oxidative stress (inflamm-aging); ↑ antibody generation; T-cell and NK maturation"]
      - [Vitamin D, "↓ pro-inflammatory cytokines, ↑ antimicrobial peptides (cathelicidin, defensin), ↑ macrophage autophagy"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 165, quote: "vitamin E in the production of IL-2 as well as the activation induced T cell proliferation in naive but not in memory T cells" }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.051
    kind: card
    topic: boosting
    front: Why is vitamin C intake so much higher than other vitamins?
    back: It is water-soluble and humans store little, so regular intake is up to 100-fold higher than for many other vitamins.
    src: { page: 165, quote: "Because vitamin C is water-soluble and humans have low storage capacity, its regular intake is up to 100-fold higher" }
    status: unverified
    tags: [numbers]
  - id: geri.L09.052
    kind: order
    topic: boosting
    prompt: Order vitamin D activation as drawn in the lecture.
    steps:
      - 7-dehydrocholesterol in skin
      - Cholecalciferol (UV light)
      - Calcidiol, 25-hydroxyvitamin D3 (liver, CYP27A1)
      - Calcitriol, 1,25-dihydroxyvitamin D3 (kidney or immune cell, CYP27B1)
    src: { page: 166, quote: "Vitamin D" }
    status: unverified
  - id: geri.L09.053
