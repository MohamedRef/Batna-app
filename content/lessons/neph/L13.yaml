      - kind: explain
        remind: [neph.L13.101]
        page: 445
        title: "المستقبل"
        quote: "ETA-selective antagonists (Atrasentan) have been shown to provide renoprotective effects, supplying a rationale for clinical trials involving administration of ETA-receptor antagonists in addition to RAAS blockade in patients with diabetic nephropathy."
        text: |
          - **Growth factors:** IGF-1، growth hormone، **TGF-β**، anti-VEGF، **endothelin-1 (ETA) antagonists** زي ==atrasentan== فوق الـ renin–angiotensin–aldosterone system (RAAS) blockade.
          - **Anti-TGF-β:** الـ TGF-β **fibrogenic** ومهم في الـ DKD (نجح في الحيوانات).
          - **Biochemical:** protein kinase C inhibitors، منع تكوين الـ **advanced glycation end-products (AGE)**، AGE cross-link breakers، blockade للـ receptor بتاع الـ AGE.
      - kind: aside
        tone: tip
        page: 446
        quote: "Holistic approach for improving outcomes in patients with diabetes and chronic kidney disease\n| Layer | Box | Colour |\n|---|---|---|\n| Lifestyle | Healthy diet; Physical activity; Smoking cessation; Weight management | |\n| First-line drug therapy | SGLT2i (Initiate eGFR ≥20; continue until dialysis or transplant) | T2D only |\n| First-line drug therapy | Metformin (if eGFR ≥30) | T2D only |\n| First-line drug therapy | RAS inhibitor at maximum tolerated dose (if HTN*) | All patients (T1D and T2D) |\n| First-line drug therapy | Moderate- or high-intensity statin | All patients (T1D and T2D) |\n| Additional risk-based therapy | GLP-1 RA if needed to achieve individualized glycemic target | T2D only |\n| Additional risk-based therapy | Nonsteroidal MRA† if ACR ≥30 mg/g [≥3 mg/mmol] and normal potassium | T2D only |\n| Additional risk-based therapy | Dihydropyridine CCB and/or diuretic* if needed to achieve individualized BP target | All patients (T1D and T2D) |\n| Additional risk-based therapy | Antiplatelet agent for clinical ASCVD | All patients (T1D and T2D) |\n| Additional risk-based therapy | Ezetimibe, PCSK9i, or icosapent ethyl if indicated based on ASCVD risk and lipids | All patients (T1D and T2D) |\n| Additional risk-based therapy | Other glucose-lowering drugs if needed to achieve individualized glycemic target | T2D only |\n| Additional risk-based therapy | Steroidal MRA if needed for resistant hypertension if eGFR ≥45 | All patients (T1D and T2D) |\nRegular reassessment of glycemia, albuminuria, BP, CVD risk, and lipids\nRegular risk factor reassessment (every 3-6 months)"
        text: |
          **الـ holistic approach** في سطرين: lifestyle للكل، وبعدين **SGLT2i + metformin** (T2D)، **renin–angiotensin system (RAS) inhibitor** بأقصى جرعة لو hypertension (HTN)، و **statin**.

          بعدها حسب الحاجة: GLP-1 RA، **nonsteroidal MRA** (ACR ≥30 و K طبيعي)، calcium channel blocker (CCB) أو diuretic، steroidal MRA للـ resistant HTN (eGFR ≥45)، antiplatelet للـ atherosclerotic cardiovascular disease (ASCVD). وراجع كل **3-6 شهور**.
