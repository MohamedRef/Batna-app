        why: "الـ cholangiocyte = القنوات، الـ endothelium = الأوعية (VOD، peliosis)، الـ stellate = الـ fibrosis (افتكر L01)، والـ hepatocyte = الباقي."
      - kind: explain
        page: 128
        quote: "Direct toxic reactions. Idiosyncratic reactions. Combined toxic/Allergic reactions. Allergic hepatitis. Cholestatic reactions. Granulomatous reactions. Chronic hepatitis and cirrhosis. Fatty liver /NASH. Veno-Occlusive disease. Neoplastic."
        title: "خريطة المحاضرة: 10 أنواع reactions"
        text: |
          الكتاب بيقسّم حسب **type of reaction** لعشرة، وهي خريطة باقي الدروس:

          - **Direct toxic**، **idiosyncratic**، **combined toxic/allergic**، **allergic hepatitis**.
          - **Cholestatic**، **granulomatous**، **chronic hepatitis and cirrhosis**، **fatty liver / non-alcoholic steatohepatitis (NASH)**.
          - **Veno-occlusive disease**، **neoplastic**.
