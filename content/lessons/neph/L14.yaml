  - id: neph.L14.lesson5
    title: "TMA: خريطة بسؤالين"
    hook: "كل TMA شكلها واحد في الدم. الـ ADAMTS13 والـ Shiga toxin هما اللي بيفرّقوا."
    minutes: 7
    pages: [467, 470]
    topics: [tma]
    goals:
      - "تعرف تعريف الـ TMA بالأرقام"
      - "تمشي في الـ algorithm من ADAMTS13 لحد aHUS"
      - "تعرف أسباب الـ secondary TMA وإزاي تشتغل عليها"
    status: unverified
    steps:
      - kind: explain
        page: 470
        title: "التعريف"
        quote: "The triad of thrombocytopenia, hemolytic anemia, and ischemic end-organ damage defines thrombotic microangiopathy."
        text: |
          ==TMA== = تلاتة مع بعض:
          - "**Microangiopathic hemolytic anemia**: Hb واطي، LDH عالي، haptoglobin واطي، **schistocytes**"
          - "**Thrombocytopenia**: أقل من **150,000** أو نزول **>25%** من الـ baseline"
          - "**End-organ damage**: كلية، مخ، قلب، رئة، GI"

          الأصل: endothelial damage ← thrombi في الـ microvasculature ← الكرات الحمرا بتتقطع (Coombs **negative**).
      - kind: figure
        page: 468
        quote: "ADAMTS13 activity"
        title: "الـ algorithm"
        alt: "Decision tree. Thrombotic microangiopathy at the top. ADAMTS13 activity below 10 percent leads to TTP. Above 10 percent leads to non-TTP TMA, which splits by co-existing disease: yes gives secondary TMA; no leads to a Shiga toxin test: positive gives STEC-HUS, negative gives atypical HUS."
        caption: "السؤال الأول: ==ADAMTS13 <10%==؟ يبقى TTP. لو لأ: فيه مرض تاني؟ (secondary). لو لأ: Shiga toxin؟ (STEC-HUS)، ولو سلبي يبقى aHUS."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L14h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
