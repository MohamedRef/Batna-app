[package]
name = "batna-server"
description = "Batna Cloud: a Cloudflare Worker (workers-rs) with a Durable Object sync hub per account. Separate from Kabar Cloud."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
batna-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
rsa = { version = "0.9", default-features = false, features = ["std", "sha2", "pem"] }
sha2 = "0.10"

# Only the Worker build talks to the Cloudflare runtime. Everything else is
# plain Rust and tested natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
worker = "0.8"

[dev-dependencies]
rand = "0.8"
rsa = { version = "0.9", features = ["sha2", "pem"] }
# Same version as batna-app: libsqlite3-sys links only once per workspace.
rusqlite = { version = "0.37", features = ["bundled"] }

[lints]
workspace = true
