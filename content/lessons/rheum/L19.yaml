      - kind: table
        page: 316
        quote: "Physician-observed mouth (oral) or throat (nasopharyngeal) ulcers. Such ulcers are usually painless."
        title: "التعريفات الدقيقة"
        columns: [Criterion, Definition]
        rows:
          - ["Malar", "Red over cheek bones, spares nasolabial folds"]
          - ["Discoid", "Raised red-violet patches; may scar"]
          - ["Photosensitive", "Rash after sun, by history or exam"]
          - ["Oral ulcers", "Physician-observed, usually painless"]
