        text: |
          الـ **PVD** مع ACEi أو ARB مش مانع في حد ذاته؛ الخوف إن عنده ==renovascular disease== كمان، فالكلى تقع لما تقفل الـ AT II. علشان كده تابع الـ electrolytes والـ creatinine.
      - kind: explain
        page: 94
        title: "الطوارئ: drug of choice"
        quote: "Aortic dissection Beta blocker+ nitroprusside 120 mm Hg systolic in 20 minutes (if possible)"
        text: |
          - ==Aortic dissection==: **beta-blocker + nitroprusside**، SBP **120 في 20 دقيقة** لو ينفع.
          - **Ischemia/MI:** nitroglycerin، nitroprusside، nicardipine أو clevidipine حتى يقف الـ ischemia.
          - **HF/pulmonary edema:** nitroprusside و/أو nitroglycerin؛ غالبًا **10–15%** كفاية.
          - **Bleeding** (epistaxis، hematuria، suture lines): أي دوا ± anxiolytic، 10–15% في 1–2 ساعة.
          - **Eclampsia:** MgSO4، hydralazine، methyldopa؛ DBP <90.
          - **Pheo، cocaine:** ==phentolamine==.
          - **Renal** (hematuria أو acute renal impairment): **fenoldopam**، 0–25% MAP في 1–12 ساعة.
          - **Encephalopathy:** nitroprusside، **25% في 2–3 ساعات**. **Head injury:** nitroprusside، 0–25% (controversial).
      - kind: reveal
        page: 94
        quote: "Hypertensive encephalopathy Nitroprusside 25% reduction over 2-3 hours"
        prompt: "ليه في الـ dissection بننزل بسرعة لـ 120، وفي الـ encephalopathy 25% بس؟"
        answer: |
          في الـ **dissection** كل ضربة قلب بضغط عالي بتشقّ الـ aorta أكتر، فلازم تقلل الـ shear بسرعة (والـ beta-blocker الأول علشان الـ reflex tachycardia من الـ nitroprusside).

          في المخ، الـ **autoregulation** اتنقل لفوق في العيان المزمن؛ لو نزّلت بسرعة المخ يعمل **ischemia**. علشان كده **25% في 2–3 ساعات**. (الشرح فسيولوجي؛ الأرقام من الكتاب.)
      - kind: check
        page: 94
        quote: "Major hematuria or acute renal impairment Fenoldopam 0% to 25% reduction in mean arterial pressure over 1-12 hours"
        question: "Hypertensive emergency with acute renal impairment: drug of choice?"
