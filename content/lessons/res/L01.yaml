      - kind: order
        page: 17
        quote: "Identifying The Problem"
        prompt: "رتّب الـ research process زي slide 17:"
        steps:
          - "Identifying the problem"
          - "Reviewing literature"
          - "Setting questions, objectives, hypotheses"
          - "Choosing the study design"
          - "Deciding on the sample design"
          - "Collecting data"
          - "Processing and analyzing data"
          - "Writing the report"
        why: "منطقي: مشكلة ← تعرف اتعمل فيها إيه ← تصيغ سؤالك ← تختار design يجاوبه ← تحدد مين هتدرس ← تجمع ← تحلل ← تكتب."
      - kind: mnemonic
        page: 17
        quote: "Identifying The Problem"
        word: "PLQ DS CAR"
        parts:
          - { key: "P", text: "Problem: identify it" }
          - { key: "L", text: "Literature review" }
          - { key: "Q", text: "Questions, objectives, hypotheses" }
          - { key: "D", text: "Design of the study" }
          - { key: "S", text: "Sample design" }
          - { key: "C", text: "Collect data" }
          - { key: "A", text: "Analyze (process and analyze data)" }
          - { key: "R", text: "Report writing" }
        hook: |
          «**PLQ** (بلّق) عينك في الـ **DS** (الـ Data Sheet)، وبعدين اركب الـ **CAR** وروّح اكتب التقرير». تلات حتت: تخطيط (PLQ)، تصميم (DS)، تنفيذ وخلاص (CAR).
      - kind: explain
        page: 22
        quote: "Process of Concluding Review of Literature Methodology"
        title: "نفس الخطوات في 3 مراحل"
        text: |
          slide 22 بيقسم نفس الرحلة لـ 3 مراحل:

          - ==Planning==: define the research problem, review of literature, methodology.
          - ==Execution==: data collection for pretest, then data collection.
          - **Process of concluding**: analysis, inferences, reporting.

          لاحظ إن الـ **pretest** (pilot) جزء من الـ execution وبيحصل **قبل** جمع الداتا الأساسي: بتجرب الـ questionnaire على 10 عيانين قبل ما توزعه على 300.
      - kind: explain
        page: 21
        quote: "Prioritizing and selecting a research topic • Review of literature and other existing information • Development of a research proposal • Getting formal institutional approval"
        title: "وفي الواقع: موافقة قبل الشغل"
        text: |
          slide 21 بيدّي خطوات health research عملية:

          - **Prioritizing and selecting a topic**.
          - **Review of literature** والمعلومات الموجودة.
          - **Development of a research proposal**.
          - ==Getting formal institutional approval== (الـ ethics committee والإدارة).
          - **Data collection** (field work).
          - **Data processing and analysis**.
          - **Final report** (manuscript writing).
          - **Recommendations** لتنفيذ النتائج.

          الفرق المهم عن الدايرة: هنا فيه **approval** قبل الـ field work، وفيه **recommendations for implementation** في الآخر.
      - kind: check
        page: 21
        quote: "Development of a research proposal • Getting formal institutional approval • Data collection (field work)"
        question: "In the steps of conducting health research, what comes between developing the proposal and data collection?"
        options:
          - "Getting formal institutional approval"
          - "Review of literature"
          - "Data processing and analysis"
          - "Prioritizing the research topic"
        answer: 0
        why:
          - "صح: من غير approval مفيش field work."
          - "الـ literature review قبل الـ proposal."
          - "التحليل بعد جمع الداتا."
          - "اختيار الموضوع أول خطوة خالص."
      - kind: explain
        page: 18
        quote: "What is the problem and why should it be studied? What information is available?"
        title: "الـ proposal: كل سؤال وله خطوة"
        text: |
          الجدول ده بيقولك تكتب الـ **research proposal** إزاي. كل خطوة بتجاوب سؤال:

          - **Statement of the problem**: what is the problem and why study it?
          - **Literature review**: what information is available?
          - ==Research objectives==: why do the research, what do we hope to achieve? (general, specific, hypotheses)
          - ==Research methodology==: what data do we need, and how will we collect them?
          - **Work plan**: who will do what, and when?
          - **Budget**: what resources do we need, and what do we have?
          - **Administration and utilisation**: how will the project be run and its results used?
          - **Proposal summary**: how will we present it to authorities, community and funders?
      - kind: match
        page: 18
        quote: "Who will do what, and when?"
        prompt: "وصّل السؤال بالخطوة اللي بتجاوبه:"
        pairs:
          - ["Who will do what, and when?", "Work plan"]
          - ["What resources do we need?", "Budget"]
          - ["What information is available?", "Literature review"]
          - ["Why carry out the research?", "Research objectives"]
          - ["How will we collect the data?", "Research methodology"]
        why: "الـ work plan = human resources + timetable. الـ budget = material, equipment, money. الـ methodology = variables, study type, sampling, data collection, ethics, pilot."
      - kind: aside
        tone: trap
        page: 18
        quote: "ethical considerations pre-test or pilot study"
        text: |
          فخ معروف: الـ ==ethical considerations== والـ **pre-test/pilot study** مكانهم في الـ proposal تحت **research methodology**، مش في الـ work plan ولا الـ administration.
      - kind: try
        items: [res.L01.016, res.L01.022, res.L01.014, res.L01.025]
    recap:
      - "Characteristics: clear problem، clear objectives وplan، بيبني على positive وnegative findings، داتا جديدة systematic."
      - "الدايرة: **PLQ DS CAR**."
      - "3 مراحل: planning (problem، literature، methodology)، execution (pretest ثم data)، concluding (analysis، inferences، report)."
      - "Institutional approval بين الـ proposal والـ field work."
      - "Ethics والـ pilot جوه الـ methodology."
    practice: [res.L01.014, res.L01.015, res.L01.016, res.L01.017, res.L01.018, res.L01.019, res.L01.020, res.L01.021, res.L01.022, res.L01.023, res.L01.024, res.L01.025, res.L01.026]
