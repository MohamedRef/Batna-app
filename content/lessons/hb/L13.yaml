        why: "I = florid duct lesion. II = الـ lesion انتشرت، ducts مشوّهة، portal fibrosis. III = زي II بس الـ septa بتعمل **portal-to-portal bridges**. IV = cirrhosis، والـ **paucity of bile ducts** في الـ scars بتلمّح للـ PBC."
      - kind: explain
        page: 218
        title: "الأعراض والعلامات"
        text: |
          - **48–60%** مالهمش أعراض وقت التشخيص. والأعراض كلها من الـ **long-standing cholestasis**.
          - **Fatigue:** **most common** symptom.
          - **Pruritus:** **earliest specific** complaint.
          - **Malabsorption:** vitamins **A، D، E، K** و calcium (الصفرا مش واصلة للمصران).
          - **Osteopenic bone disease** في **25%** على الأقل (pathogenesis مش واضح). الـ **osteomalacia** نادرة: بس في المريض الـ **home-bound** المتأخر اللي مش بيشوف شمس.
          - **Exam:** hepatomegaly 43–70%، splenomegaly 16–35%.
          - **Skin:** **hyperpigmentation** شبه الـ tan من **melanin مش bilirubin** في البدري، excoriations من الهرش، **jaundice متأخر**، xanthelasma و xanthomata (مع **hypercholesterolemia**؛ xanthomata في أقل من 5%: palms، soles، elbows، knees، tendons، buttocks).
          - **Eyes:** **Kayser-Fleischer rings** نادرة، من **copper retention**.
      - kind: check
        page: 218
        question: "Which is the earliest specific complaint of PBC?"
        options:
          - "Pruritus"
          - "Fatigue"
          - "Jaundice"
          - "Bone pain"
        answer: 0
        why:
          - "صح: الـ **pruritus** هو **earliest specific** complaint."
          - "الـ fatigue هو **most common**، بس مش specific."
          - "الـ jaundice بيظهر **later** في المرض."
          - "الـ osteopenia موجودة، بس مش أول عرض specific."
      - kind: aside
        tone: trap
        page: 219
        text: |
          فخّين:

          - الجلد «المتشمّس» في البدري = **melanin** مش bilirubin. يعني ممكن تشوف لون غامق والـ bilirubin طبيعي.
          - **Kayser-Fleischer rings** مش حكر على Wilson: ممكن تظهر (نادرًا) في الـ PBC من **copper retention**، لأن الـ copper بيخرج في الصفرا.
      - kind: explain
        page: 221
        title: "العلاج"
        text: |
          - **General advice:** وقف التدخين، أكل متوازن، وقف الكحول أو قلّله، و **تجنّب NSAIDs** (aspirin، ibuprofen).
          - **UDCA:** **main treatment**. بيأخّر الـ liver damage، خصوصًا لو بدأ بدري، بس **مش بيحسّن الـ fatigue**. ويتاخد **مدى الحياة**. Side effects: diarrhoea و nausea/vomiting.
          - **Obeticholic acid (OCA):** بيحسّن الـ bile flow ويقلّل الالتهاب. مع UDCA لو مش كفاية، أو لوحده لو UDCA مش مناسب. Side effect: **itching** (قلّل الجرعة أو عالج الهرش). وجرعة أقل في الـ advanced disease.
          - **Elafibranor:** بيقلّل إنتاج الـ bile acid ويخليه أقل ضررًا. نفس الـ indications بتاعة OCA. Side effects: constipation، diarrhoea، headache، nausea.
      - kind: aside
        tone: analogy
        page: 222
        text: |
          الـ **colestyramine** (للهرش) زي **إسفنجة** في المصران: بتشفط الـ bile acids... وبتشفط الـ UDCA كمان لو اتقابلوا.

          علشان كده: **UDCA قبلها بساعة على الأقل، أو بعدها بـ 4–6 ساعات**. وعلى المدى الطويل بتشفط vitamins **A، D، K** و **folic acid**، فممكن تحتاج supplements. وأشهر side effect: **constipation**.
      - kind: check
        page: 222
        question: "A woman with PBC takes UDCA and starts colestyramine for itching. How should she time them?"
        options:
          - "UDCA at least 1 hour before, or 4–6 hours after, colestyramine"
          - "Take both together with breakfast"
          - "UDCA 30 minutes after colestyramine"
          - "Stop UDCA while on colestyramine"
        answer: 0
        why:
          - "صح: الكتاب بيقول ساعة قبل، أو 4–6 ساعات بعد."
          - "مع بعض = الإسفنجة هتشفط الـ UDCA."
          - "نص ساعة بعد قليل جدًا؛ لازم 4–6 ساعات."
          - "الـ UDCA بيتاخد مدى الحياة، مبنوقفوش."
      - kind: explain
        page: 222
        title: "الـ fatigue والـ transplant"
        text: |
          - **Fatigue:** مفيش دوا specific. استبعد أسباب تانية (iron deficiency anaemia، sleep apnoea، depression)، رياضة على قد الطاقة، وظبّط اليوم حوالين التعب (بيبقى أوحش آخر اليوم)، و sleep hygiene.
          - **Dry mouth and eyes:** **artificial tears**.
          - **Liver transplant:** التخطيط يبدأ **قبل** ما الضرر يكبر، لأن الانتظار ممكن يعدّي **3 شهور**. الـ transplant **بيشفي الهرش بس ممكن الـ fatigue يفضل**. أغلب الناس بيعيشوا **أكتر من 10 سنين**. والـ PBC ممكن يرجع في الكبد الجديد (**recurrent PBC**).
      - kind: update
        ref: "FDA approvals and EMA review, 2024"
        text: |
          في 2024 اتعمد في أمريكا **elafibranor** و **seladelpar** (PPAR agonists) للـ PBC كـ second-line، وأوروبا سحبت الترخيص المشروط بتاع **OCA**. في الامتحان اكتب قايمة الكتاب: UDCA ثم OCA أو elafibranor.
      - kind: try
        items: [hb.L13.077, hb.L13.083, hb.L13.089, hb.L13.100, hb.L13.107]
