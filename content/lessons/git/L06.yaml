      - kind: explain
        remind: [git.L06.118]
        page: 216
        title: "المضاعفات والـ CRC"
        quote: "Colorectal cancer: is the most feared long-term complication for ulcerative colitis. Risk factors include duration and extent of disease, severity of inflammation, family history of CRC, and concomitant primary sclerosing cholangitis (PSC). Early age of onset has been suggested to be a risk factor."
        text: |
          - **life-threatening hemorrhage**
          - **acute severe UC**: ممكن يحتاج colectomy لو حصل perforation أو toxic megacolon
          - **pouchitis**: بس عند اللي عمل **ileal pouch-anal anastomosis (IPAA)**
          - ==Colorectal cancer==: أكتر حاجة بنخاف منها على المدى البعيد

          **Risk factors:** duration، extent، severity of inflammation، family history of CRC، **PSC**، وغالبًا early onset.

          الـ excess risk بيبان بعد **8–10 سنين**، فالكتاب: **screening colonoscopy بعد 8 سنين** في الـ extensive colitis، و **surveillance كل 1–2 سنة**.

          يعني كل مضاعفة هنا ليها توقيت: النزيف والـ toxic megacolon في النوبة الحادة، والسرطان بعد سنين، والـ pouchitis بعد العملية.
      - kind: explain
        page: 216
        quote: "Colorectal cancer: is the most feared long-term complication for ulcerative"
        title: "ليه عوامل خطر الـ CRC في الـ UC هي دي بالذات؟"
        text: |
          الكتاب: الـ **colorectal cancer** هو ==most feared long-term complication==. عوامل الخطر: **duration** و **extent** المرض، **severity of inflammation**، **family history of CRC**، و **concomitant PSC**، وممكن **early age of onset**. الخطر الزيادة بيبان بعد **8-10 سنين**، فالـ screening colonoscopy بعد **8 سنين** للـ extensive colitis، و surveillance **كل 1-2 سنة**.

          التفسير المقبول (مش في الكتاب): نفس منطق الـ IBD اللي في محاضرة سرطان القولون: التهاب أكتر (severity) في مساحة أكبر (extent) لمدة أطول (duration) = خلايا بتموت وتتجدد أكتر = فرص mutation أكتر. والـ early onset معناه سنين أكتر من الالتهاب في عمر المريض. والـ PSC بيغيّر الـ bile acids اللي بتوصل للقولون فبيزوّد الخطر، علشان كده مريض UC و PSC بيبدأ surveillance من يوم تشخيص الـ PSC.
      - kind: update
        page: 216
        quote: "The excess risk of CRC appears after 8–10 years of disease. Hence, a screening colonoscopy is recommended after 8 years for patients with extensive colitis, with surveillance examinations every 1–2 years."
        text: "الـ European Crohn's and Colitis Organisation (ECCO) والـ British Society of Gastroenterology (BSG) بيقولوا screening colonoscopy بعد حوالي 8 سنين من الأعراض **لكل** عيان UC (علشان نعيد تحديد الـ extent)، وبعدين surveillance حسب الـ risk كل 1 أو 3 أو 5 سنين، والـ PSC كل سنة من التشخيص. في الامتحان اكتب إجابة الكتاب."
