        text: |
          الكتاب بيقول الـ DILI **complex aetiology with several risk factors**، ورسمة صفحة 130 بتقسمهم:

          - ==Host== (العيان نفسه): age، race، sex، genetics، immunology، pregnancy، underlying disease، metabolic syndrome، microbiota، NAFLD.
          - ==Environmental== (اللي حواليه): alcohol، lifestyle، chemical exposure، workplace.
          - ==Drug== (الدوا نفسه): dose > 50 mg، greater lipophilicity، > 50% hepatic metabolism، drug و herbal interactions، special chemical moieties.

          والتفسير المقبول إن خصائص الدوا التلاتة ماشية مع بعض: جرعة كبيرة + دوا بيدوب في الدهون + الكبد بيكسّر أغلبه = metabolites أكتر جوه الكبد.
