  - id: geri.L05.lesson2
    title: "الجلطة في أنهي حتة؟ اقرأ الأعراض"
    hook: "مريض صاحي ومش قادر يحرّك غير عينيه لفوق وتحت. ده مش غيبوبة، ده locked-in."
    minutes: 8
    pages: [87, 88]
    topics: [syndromes]
    goals:
      - "تعرف أشهر cerebral infarction وأعراضه"
      - "توصّل كل مستوى في الـ brain stem بالـ syndrome بتاعه"
      - "تفرّق lacunar وMID والـ PCA والـ border zone"
    status: unverified
    steps:
      - kind: explain
        page: 87
        quote: "The most common is infarction of the internal capsule due to thrombosis or embolism of the middle cerebral artery"
        title: "الأشهر: الـ internal capsule"
        text: |
          أشهر **cerebral infarction** هو ==internal capsule== بسبب thrombosis أو embolism في الـ **middle cerebral artery**.

          - **contralateral hemiplegia** و**facial paralysis**.
          - الوعي غالبًا موجود.
          - **aphasia** لو الـ dominant hemisphere هو اللي اتصاب.
          - الضعف **maximal at first** والتحسن **gradual**.
      - kind: reveal
        page: 87
        quote: "The most common is infarction of the internal capsule due to thrombosis or embolism of the middle cerebral artery"
        prompt: "ليه جلطة صغيرة في الـ internal capsule بتشل نص الجسم كله؟"
        answer: "لأن الـ **internal capsule** ممر ضيق كل الـ motor fibers بتاعة الوش والدراع والرجل معدّية فيه متلمّمة. سدّة صغيرة هناك = **hemiplegia** كاملة في الناحية التانية، عكس الـ cortex اللي الألياف فيه متفرّشة على مساحة كبيرة."
      - kind: figure
        page: 87
        quote: "Brain stem lesion at level of 3rd cranial nerve Weber Syndrome."
        title: "الـ brain stem من فوق لتحت"
        alt: "A vertical brain stem drawn as three stacked boxes: midbrain at the top with the 3rd nerve level labelled Weber syndrome, pons in the middle labelled locked-in below the 3rd nerve nuclei, and medulla at the bottom labelled Wallenberg from the posterior inferior cerebellar artery. A side bar says main basilar artery gives tetraparesis and sensory loss."
        caption: "Weber عند مستوى العصب التالت، الـ locked-in تحت أنويته، والـ Wallenberg من الـ PICA تحت خالص. وسد الـ basilar نفسه = tetraparesis وsensory loss."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="20" width="120" height="60" rx="10" class="fg-acc"/>
            <text x="38" y="46" class="t-b">Midbrain</text>
            <text x="38" y="64" class="t-sm t-mut">3rd nerve level</text>
            <rect x="20" y="90" width="120" height="70" rx="10" class="fg-box"/>
            <text x="38" y="120" class="t-b">Pons</text>
            <text x="38" y="138" class="t-sm t-mut">below 3rd nuclei</text>
            <rect x="20" y="170" width="120" height="60" rx="10" class="fg-bad"/>
            <text x="38" y="196" class="t-b">Medulla</text>
            <text x="38" y="214" class="t-sm t-mut">PICA</text>
            <text x="160" y="56" class="t-b t-acc">Weber</text>
            <text x="160" y="130" class="t-b">Locked-in</text>
            <text x="160" y="148" class="t-sm t-mut">vertical eye moves only</text>
            <text x="160" y="206" class="t-b t-bad">Wallenberg</text>
            <rect x="150" y="236" width="170" height="20" rx="4" class="fg-thin"/>
            <text x="156" y="250" class="t-sm">Main basilar: tetraparesis</text>
          </svg>
      - kind: match
        page: 87
        quote: "Posterior inferior cerebellar artery (Wallenberg Syndrome). - Brain stem lesion at level of 3rd cranial nerve Weber Syndrome."
        prompt: "وصّل كل lesion بالـ syndrome:"
        pairs:
          - ["Posterior inferior cerebellar artery", "Wallenberg"]
          - ["3rd cranial nerve level", "Weber"]
          - ["Massive damage below 3rd nerve nuclei", "Locked-in"]
          - ["Bilateral pyramidal, lower brain stem", "Pseudobulbar"]
          - ["Main basilar artery", "Tetraparesis, sensory loss"]
        why: "ده ترتيب الكتاب في ص 87: الـ vertebrobasilar system هو اللي بيغذي الـ brain stem، والأعراض بتعتمد على أنهي فرع."
      - kind: aside
        tone: analogy
        page: 87
        quote: "he has functioning cerebral cortex, but can not move or communicate except by vertical eye movements."
        text: "الـ **locked-in** زي واحد قاعد في أوضة بابها اتقفل عليه: المخ (الـ cortex) شغال ١٠٠٪ وسامع كل حاجة، بس الكابلات اللي نازلة اتقطعت. اللي فاضل له **vertical eye movements** بس. اوعى تتكلم قدامه كأنه مش فاهم."
      - kind: explain
        page: 87
        quote: "Occlusion of small penetrating branch of the major cerebral arteries (to the basal ganglia, thalamus, internal capsule & pons)"
        title: "الـ lacunar والـ hypertensive encephalopathy"
        text: |
          **الـ lacunar infarct**: سدّة في ==small penetrating branch== من الشرايين الكبيرة، رايحة للـ basal ganglia، thalamus، internal capsule، pons.
          - السبب: atherosclerosis، أو تغيّرات في جدار الشريان من الـ **hypertension**، وممكن الـ diabetes.

          **الـ hypertensive encephalopathy**: severe headache، TIA، stroke، ونادرًا subarachnoid Hge.
      - kind: explain
        page: 88
        quote: "Dementia that may follow a succession of cerebrovascular events or less commonly a single stroke."
        title: "لما الجلطات تتراكم: MID"
        text: |
          الـ ==multi-infarct dementia==: dementia بعد سلسلة **cerebrovascular events** (أو أقل: stroke واحدة)، لأن أوعية كتير بتغذي الـ cortex والـ subcortical اتصابت.

          ومعاها غالبًا **pseudobulbar syndrome** و**parkinsonism**.
      - kind: explain
        page: 88
        quote: "Multiple cortical infarcts following prolonged periods of very low perfusion memory loss, intellectual impairment & cortical blindness."
        title: "الـ PCA والـ border zone"
        text: |
          - **Posterior cerebral artery infarction**: hemianopic visual loss و**cortical blindness** (الـ PCA بتغذي الـ occipital).
          - ==Border zone infarction==: cortical infarcts كتير بعد فترات طويلة من **very low perfusion**، فيحصل memory loss، intellectual impairment، وcortical blindness.
      - kind: reveal
        page: 88
        quote: "Multiple cortical infarcts following prolonged periods of very low perfusion memory loss, intellectual impairment & cortical blindness."
        prompt: "ليه الـ low perfusion بيضرب الـ border zone بالذات؟"
        answer: "الـ **border zone** هي آخر الخط بين منطقتين شريانين. لما الضغط يقع، الدم بيوصل للقريب الأول، والأطراف البعيدة (زي آخر بيت في آخر الشارع لما الميه تضعف) هي اللي تجوع. علشان كده بتشوفها بعد **cardiac arrest** أو hypotension طويل."
      - kind: check
        page: 88
        quote: "Posterior cerebral artery infarction: Hemianopic visual loss & cortical Blindness."
        question: "A 78-year-old woman suddenly cannot see the left half of the visual field. Strength is normal. Which artery?"
        options: ["Posterior cerebral artery", "Middle cerebral artery", "Posterior inferior cerebellar artery", "Small penetrating artery to the pons"]
        answer: 0
        why:
          - "صح: الـ PCA بتعمل hemianopic visual loss وcortical blindness."
          - "الـ MCA (internal capsule) بتعمل hemiplegia وشلل الوش."
          - "الـ PICA = Wallenberg."
          - "الـ lacune في الـ pons مش هتعمل hemianopia."
      - kind: try
        items: [geri.L05.020, geri.L05.022, geri.L05.025, geri.L05.030]
    recap:
      - "الأشهر: internal capsule من الـ MCA ← contralateral hemiplegia + facial paralysis، الوعي موجود."
      - "PICA = Wallenberg، 3rd nerve level = Weber، تحت أنويته = locked-in، bilateral pyramidal = pseudobulbar."
      - "Lacunar: small penetrating branch، hypertension وممكن DM."
      - "MID: جلطات متتالية، ومعاها pseudobulbar + parkinsonism."
      - "PCA: hemianopia + cortical blindness. Border zone: very low perfusion."
    practice: [geri.L05.020, geri.L05.021, geri.L05.022, geri.L05.023, geri.L05.024, geri.L05.025, geri.L05.026, geri.L05.027, geri.L05.028, geri.L05.029, geri.L05.030, geri.L05.048, geri.L05.049, geri.L05.050, geri.L05.051]
