  - id: rheum.L20.lesson1
    title: "الصدفية لما تنزل على المفاصل: مين وليه"
    hook: "من كل 100 عيان صدفية، 5 لـ 20 بيجيلهم arthritis. والجينات بتقول مين وإزاي."
    minutes: 8
    pages: [326, 327]
    topics: [definition, genetics]
    goals:
      - "تعرّف الـ PsA وتعرف ليه مش مرض خفيف"
      - "تفهم ليه جينات الـ PsA مش هي جينات الصدفية"
      - "توصّل كل HLA بالـ phenotype بتاعه، وتربط الـ non-HLA بالعلاج"
    status: unverified
    steps:
      - kind: explain
        page: 326
        title: "التعريف"
        quote: "PsA is an inflammatory arthropathy occurring in 5-20% of patients with psoriasis. It is a chronic immune-mediated disease involving axial and peripheral joints, nails, skin and enthesis. Although previously considered to be a relatively mild form of arthritis, there has been a growing appreciation that PsA can be progressive, destructive, and deforming."
        text: |
          الـ **psoriatic arthritis** (PsA) هو inflammatory arthropathy بيحصل في ==5–20%== من عيانين الصدفية.

          مرض **chronic immune-mediated** بيمسك: الـ **axial** والـ **peripheral joints**، الـ **nails**، الـ **skin**، والـ **entheses**.

          زمان كانوا فاكرينه خفيف، دلوقتي معروف إنه ممكن يبقى **progressive, destructive, deforming**.

          ليه الكلمة دي مهمة؟ لأنها هي اللي غيّرت العلاج: لو المرض بيدمّر المفصل، يبقى لازم تبدأ بدري وتقيس النشاط وتوصل لهدف (هتشوفها في درس الاستراتيجية).
      - kind: explain
        page: 326
        title: "الوراثة"
        quote: "Approximately 33 to 50% of PsA patients have at least one first-degree relative who also has PsO or PsA."
        text: |
          - **33–50%** عندهم قريب درجة أولى عنده psoriasis (PsO) أو PsA.
          - جينات الـ PsA و الـ PsO ==مش متطابقة==، وفيه جينات بتحدد **phenotype** معين.
          - **human leukocyte antigen (HLA) genes:** antigen presentation. **Non-HLA genes:** immune activation، cytokine signaling، T-cell function.

          يعني الـ HLA بيحدد «إيه» اللي المناعة بتشوفه، والـ non-HLA بيحدد «قد إيه» بتولّع. علشان كده الاتنين لازمين.
      - kind: reveal
        page: 326
        quote: "The genetic associations between PsA and PsO are not identical."
        prompt: "لو الـ PsA مجرد صدفية نزلت على المفاصل، ليه جيناتها مش هي نفس جينات الصدفية؟"
        answer: |
          لأن الكتاب بيقول تلات حاجات مع بعض:
          - جينات الـ PsA والـ PsO ==not identical==.
          - فيه جينات للـ PsA مش موجودة في الـ PsO، **والعكس**.
          - وفيه جينات بتحدد **phenotype** معين جوه الـ PsA نفسه (axial، erosions، symmetric).

          يعني الـ PsA مش «درجة أشد» من الصدفية؛ هو مرض ليه استعداد خاص بيه. وده بيفسّر الجملة اللي في الدرس الجاي: مفيش marker يتوقّع مين من عيانين الصدفية هيجيله arthritis، ومفيش علاقة كبيرة بين شدة الجلد وشدة المفاصل.
      - kind: check
        page: 326
        quote: "Approximately 33 to 50% of PsA patients have at least one first-degree relative who also has PsO or PsA."
        question: "Which statement about the genetics of PsA is TRUE per the lecture?"
        options: ["33–50% have a first-degree relative with PsO or PsA", "PsA and PsO share identical genes", "A genetic marker predicts which psoriasis patients get arthritis", "Only HLA genes are involved"]
        answer: 0
        why:
          - "صح: تلت لنص العيانين عندهم قريب درجة أولى بالصدفية أو الـ PsA."
          - "الكتاب بيقول not identical."
          - "مفيش marker لحد دلوقتي (clinical ولا genetic)."
          - "فيه non-HLA genes كمان (cytokines و signaling)."
      - kind: match
        page: 327
        quote: "Genetic associations: HLA genes\n| Disease Susceptibility Genes | Disease Susceptibility Hapolotyes | Gene or Haplotype | Disease expression |\n|---|---|---|---|\n| HLA-B*08:01 | HLA-B*08:01-C*07:01 | HLA-B*08:01 | Peripheral arthritis, joint damage, ankylosis, asymmetric sacroiliitis |\n| HLA-B*27:05 | HLA-B*27:05-C*02:02 | HLA-B*27:05 | Axial involvement, symmetric sacroiliitis, enthesitis, dactylitis |\n| HLA-B*38:01 | HLA-B*27:05-C01:02 | HLA-B*27:05-C*01:02:01 | Bone erosions |\n| HLA-B*39:01 | HLA-B*37:01-C*06:02 | HLA-B*44:02/03 | Milder disease |\n| HLA-B*44:02 (protective) | HLA-B*35:01-C*06:02 | HLA-C*01:02:01 | Bone erosions |\n| HLA-C*06:02, HLA-DR4 | HLA-B*39:01-C*12:03 | HLA-C*06:02 | Milder disease, longer delay of arthritis after psoriasis; Symmetric polyarthritis |"
        prompt: "وصّل الـ HLA بالشكل اللي بيعمله (جدول p327):"
        pairs:
          - ["HLA-B*27:05", "Axial, symmetric sacroiliitis, dactylitis"]
          - ["HLA-B*08:01", "Joint damage, asymmetric sacroiliitis"]
          - ["HLA-C*06:02", "Milder, long delay after psoriasis"]
          - ["HLA-DR4", "Symmetric polyarthritis"]
          - ["HLA-B*44:02", "Protective, milder disease"]
        why: "الـ B27 بيجيب الـ axial والـ enthesitis، الـ B8 بيجيب الـ damage، والـ C*06:02 (جين الصدفية الأشهر) بيأخر الـ arthritis ويخففه."
      - kind: figure
        page: 327
        quote: "involved in immune activation and inflammation, including intracellular signaling, cytokine expression and signaling, and T cell effector function."
        title: "نوعين جينات، شغلانتين"
        alt: "Two boxes. HLA genes: antigen presentation and immune recognition; examples HLA-B27 (axial, enthesitis, dactylitis), HLA-B8 (joint damage), HLA-C*06:02 (milder, psoriasis first). Non-HLA genes: immune activation and inflammation; examples IL-23 receptor (IL-17 pathway), TNF alpha-induced protein 3 (TNF inflammation), protein tyrosine phosphatase 22 (immune regulation)."
        caption: "الـ **HLA genes** بتحدد ==إيه اللي المناعة تشوفه== (antigen presentation)، والـ **non-HLA genes** بتحدد **قد إيه بتولّع** (cytokines و signaling). ولاحظ إن جين الـ **IL-23 receptor** في القايمة: نفس الـ pathway اللي الأدوية بتضربه."
        svg: |
