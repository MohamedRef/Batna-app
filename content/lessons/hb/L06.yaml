        text: |
          الكتاب حط لك **صينية العصاري المصرية** كلها في قايمة الـ antioxidants: **قهوة**، **شاي أخضر**، **توم**، **جنزبيل**، و**عنب أحمر** 😄

          بس خلي بالك: دول **مذكورين** كـ dietary agents، مش «recommended» زي vitamin E. ماتكتبش في الامتحان «العلاج: قهوة وتوم».
      - kind: explain
        page: 106
        title: "Supplements: anti-inflammatory و insulin sensitizers"
        text: |
          المجموعة التانية: **anti-inflammatory agents**.

          - **PUFA و MUFA**: بيساعدوا في نزول الوزن ويقللوا الـ hepatic TG.
          - **Vitamin D**: نقصه ممكن يعمل IR و metabolic syndrome و NAFLD.
          - **Probiotic و prebiotic و synbiotic**: لأن الـ ==gut-liver axis== طريق مهم في الـ NAFLD. الدم اللي جاي من الأمعاء بيروح للكبد الأول عن طريق الـ portal vein، فاللي بيحصل في الأمعاء بيوصل للكبد.

          المجموعة التالتة: **insulin sensitizers and lipid-lowering agents**.

          - ==Cinnamon==: بيقلل امتصاص الجلوكوز بعد الأكل، بتثبيط الـ pancreatic enzymes.
          - **Curcumin**: antioxidant و anti-inflammatory قوي. بيقلل الـ lipids والـ steatosis، ويمنع التقدم لـ steatohepatitis.
          - ==Carnitine==: essential component في الـ mitochondrial beta-oxidation، يعني بيدخّل الدهون الميتوكوندريا علشان تتحرق.
