  - id: geri.L08.lesson6
    title: "PMR و GCA: الكتاف المتخشبة والعين اللي في خطر"
    hook: "تيبس الصبح في الكتفين ممكن يكون أول خيط لمرض ياخد النظر لو اتأخرت."
    minutes: 7
    pages: [152, 154]
    topics: [pmr]
    goals:
      - "تعرف صورة الـ polymyalgia rheumatica (PMR) وتشخيصه وجرعته"
      - "تربط PMR بـ giant cell arteritis (GCA) بالأرقام"
      - "تعرف علاج الـ GCA الفوري"
    status: unverified
    steps:
      - kind: explain
        page: 152
        title: "Polymyalgia rheumatica"
        quote: "The main symptom is muscle stiffness in the morning that lasts longer than 45 minutes. It may also cause other symptoms, including:\n  High temperature (fever) and sweating.\n  Extreme tiredness (fatigue).\n  Loss of appetite.\n  Weight loss.\n  Depression."
        text: |
          Pain و stiffness و inflammation في عضلات **الكتفين والرقبة والوراك**.

          - العَرَض الأساسي: ==morning stiffness أكتر من 45 دقيقة==.
          - كمان: سخونية وعرق، fatigue، anorexia، weight loss، depression.
          - السبب مش معروف (genetic + environmental).

          ليه الـ morning stiffness **أكتر من 45 دقيقة** بالذات؟ التفسير المقبول (مش في الكتاب): ده علامة **التهاب**، لأن سوائل الالتهاب بتتجمع والإنسان نايم وبتاخد وقت تتصرف. الـ OA تيبّسها قصير (دقايق)، فالـ 45 دقيقة بتفرّق مرض التهابي من مرض ميكانيكي.

          وليه السخونية والـ weight loss والـ depression؟ عشان الالتهاب **systemic** مش في العضل بس.
      - kind: aside
        tone: exam
        page: 152
        quote: "Polymyalgia rheumatica isage-related. Most people who are diagnosed with the condition are over 70. It's extremely rare in people younger than 50. It's also more common in women than men."
        text: "أغلبهم **فوق 70**، و ==نادر جدًا تحت 50==، وفي الستات أكتر. يعني شاب عنده 35 بتيبس كتاف؟ دوّر على حاجة تانية."
      - kind: explain
        page: 153
        title: "التشخيص والعلاج"
        quote: "Prednisone 10 to15 mg/day can relief pain and stiffness.\nIf symptoms improve patient can take the drug for one year."
        text: |
          **مفيش test specific**. اطلب: **erythrocyte sedimentation rate (ESR) و C-reactive protein (CRP)**، rheumatoid factor (RF) و anti-CCP، thyroid، kidney و liver functions (علشان تستبعد).

          العلاج: ==prednisone 10–15 mg/day==، ولو تحسّن ياخده **سنة**.

          ليه التحاليل دي لو مفيش test specific؟ التفسير المقبول (مش في الكتاب): كل واحد بيستبعد حاجة ممكن تعمل نفس الشكل:
          - **ESR و CRP**: بيثبتوا إن فيه التهاب.
          - **RF و anti-CCP**: الـ **rheumatoid arthritis** ممكن تبدأ في الكبير بكتاف متيبسة.
          - **Thyroid**: الـ hypothyroidism بيعمل وجع وتيبّس في العضل (افتكر محاضرة الغدة).
          - **Kidney و liver**: قبل الـ steroids، ولاستبعاد أسباب تانية.

          وليه الجرعة الصغيرة (10–15 mg) كفاية؟ التفسير المقبول (مش في الكتاب): الـ PMR بتستجيب للـ steroids بسرعة وبشكل واضح، لدرجة إن الاستجابة نفسها بتأكد التشخيص.
      - kind: update
        page: 153
        quote: "Prednisone 10 to15 mg/day can relief pain and stiffness."
        text: "**EULAR/ACR 2015**: البداية prednisone **12.5–25 mg/day** وبعدين taper، و methotrexate ممكن يتضاف لو خطر relapse أو side effects عالي. في الامتحان 10–15 بتاع الكتاب."
        ref: "EULAR/ACR PMR recommendations 2015"
      - kind: figure
        page: 153
        quote: "Polymyalgia rheumatica (PMR) is a rare inflammatory disease that affects older adults, causing widespread muscle pain and stiffness, especially around the shoulders and hips. Most people who develop PMR are in their 60s or 70s. PMR is closely linked with giant cell arteritis (GCA), a type of vasculitis characterized by inflammation of the arteries in the head (temples) and of the aorta, resulting in headaches and vision problems. Left untreated, GCA can lead to blindness and stroke. The two diseases can occur at the same time in the same person. Approximately 15 percent to 20 percent of people with PMR will develop GCA, while about half of patients with GCA also have symptoms of PMR."
        title: "الاتنين متداخلين"
        alt: "Two overlapping circles: PMR on the left and GCA on the right. An arrow from PMR says 15 to 20 percent develop GCA; an arrow from GCA says about half have PMR symptoms."
        caption: "==15–20%== من الـ PMR يعملوا GCA، و **نص** الـ GCA عندهم أعراض PMR، وممكن ييجوا مع بعض."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="120" cy="100" r="75" class="fg-acc"/>
            <circle cx="210" cy="100" r="75" class="fg-bad"/>
            <text x="85" y="95" text-anchor="middle" class="t-b">PMR</text>
            <text x="245" y="95" text-anchor="middle" class="t-b">GCA</text>
            <text x="85" y="118" text-anchor="middle" class="t-sm">15–20%</text>
            <text x="85" y="134" text-anchor="middle" class="t-sm">get GCA</text>
            <text x="245" y="118" text-anchor="middle" class="t-sm">~50% have</text>
            <text x="245" y="134" text-anchor="middle" class="t-sm">PMR</text>
            <text x="245" y="150" text-anchor="middle" class="t-sm">symptoms</text>
            <text x="165" y="104" text-anchor="middle" class="t-sm t-b">both</text>
          </svg>
      - kind: explain
        remind: [geri.L08.118]
        page: 153
        title: "Giant cell arteritis"
        quote: "The most common symptom of GCA is a new headache, usually around the temples, but headache can occur anywhere. Other symptoms include fatigue, loss of appetite, weight loss, or flu-like feeling. There may be pain in the jaw from chewing. If GCA spreads to the blood supply of the eye, eyesight can be affected. Permanent loss of vision in GCA can occur suddenly, but proper treatment can prevent this complication."
        text: |
          **Vasculitis** في شرايين الراس (الصدغ) و **الـ aorta**.
          - أشهر عرض: ==new headache== غالبًا temporal.
          - fatigue، anorexia، weight loss، flu-like.
          - **Jaw pain on chewing**.
          - النظر: ممكن **فقد مفاجئ ودائم**؛ والعلاج الصح بيمنعه. ومن غير علاج: **blindness و stroke**.

          ليه العين بالذات؟ التفسير المقبول (مش في الكتاب): الالتهاب بيقفل الشرايين الصغيرة اللي بتغذي العصب البصري، والعصب لما يموت ما يرجعش. عشان كده الكتاب بيقول الفقد **sudden** و **permanent**، والعلاج الصح بيمنعه. وألم الفك وقت المضغ: شريان الفك ضيق فالعضلة مش واخدة دم كفاية وهي شغالة، زي الـ angina بس في الفك.
      - kind: case
        page: 154
        quote: "GCA treatment should start immediately after diagnosis to prevent vision loss. First-line treatment usually is 40-60 mg per day of prednisone. Headaches and other symptoms often ease quickly with treatment."
        stem: "76-year-old woman with PMR on prednisone 10 mg. New left temporal headache, jaw pain while eating, ESR 90."
        steps:
          - question: "ESR 90. Is GCA proven?"
            options: ["No: high ESR alone is not proof", "Yes: ESR >50 confirms GCA", "Yes, if CRP is also high", "No: ESR is never raised in GCA"]
            answer: 0
            why: "الكتاب: مفيش blood test بيأكد؛ الـ **high ESR لوحده مش دليل**. التأكيد غالبًا **temporal artery biopsy**، وأحيانًا ultrasound."
          - question: "Treatment now?"
            options: ["Prednisone 40–60 mg/day immediately", "Keep 10 mg and wait for biopsy", "NSAIDs", "Colchicine"]
            answer: 0
            why: "العلاج يبدأ **فورًا** بعد التشخيص علشان النظر: **40–60 mg/day**، وبعد شهر taper لـ 5–10 mg على كام شهر، ويوقف بعد **1–2 سنة**."
      - kind: explain
        page: 154
        quote: "GCA treatment should start immediately after diagnosis to prevent vision loss. First-line treatment usually is 40-60 mg per day of prednisone. Headaches and other symptoms often ease quickly with treatment."
        title: "ليه الجرعة الكبيرة وعلى طول؟"
        text: |
          الكتاب بيقول العلاج **immediately** بعد التشخيص عشان ==prevent vision loss==، بـ **40–60 mg/day** prednisone، وبعد حوالي **شهر** تبدأ تنزّل لـ **5–10 mg** على كام شهر، وغالبًا يوقف خالص بعد **سنة لسنتين**.

          قارن بالـ PMR (10–15 mg): الـ GCA جرعتها **أربع أضعاف**. ليه؟ لأن الـ PMR خطرها وجع وتيبّس، لكن الـ GCA خطرها **عمى** و **stroke**. يعني الجرعة على قد الخطر.

          والتفسير المقبول (مش في الكتاب) للتنزيل البطيء: الالتهاب بيرجع لو وقفت فجأة، والجسم اللي واخد steroids شهور الـ adrenal بتاعته نامت ومحتاجة وقت تصحى.
      - kind: update
        page: 154
        quote: "GCA treatment should start immediately after diagnosis to prevent vision loss. First-line treatment usually is 40-60 mg per day of prednisone. Headaches and other symptoms often ease quickly with treatment."
        text: "**American College of Rheumatology (ACR) 2021** بينصح (conditional) بإضافة **tocilizumab** للـ steroids في الـ GCA الجديد علشان يقلل الـ steroid. في الامتحان 40–60 mg بتاع الكتاب."
        ref: "ACR/Vasculitis Foundation GCA guideline 2021"
