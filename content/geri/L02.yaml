  # ---------- p33: CKD ----------
  - id: geri.L02.034
    kind: card
    topic: ckd
    front: Which conditions raise the age-related risk of ESRD and death in CKD?
    back: Diabetes, cardiovascular disease and hyperuricemia.
    src: { page: 33, quote: "These risks are higher when associated with DM, CVD, and hyperuricemia." }
    status: unverified
    tags: [high-yield]
  - id: geri.L02.035
    kind: card
    topic: ckd
    front: How do the incidence of ESRD and mortality change with aging?
    back: Both increase with aging. The book's graph (Yamagata 2007) shows the incidence of CKD stage I–II rising by age decade.
    src: { page: 33, quote: "The incidence of ESRD and mortality has increased with aging." }
    status: unverified
