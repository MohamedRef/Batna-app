          الكتاب بيدّيك لكل regimen المريض اللي يناسبه، والسبب في نفس الجملة:

          - **IV cyclophosphamide** للي ==may have difficulty adhering to an oral regimen==: لأن الحقن بتتاخد قدامك.
          - **MPAA** للي ==at high risk of infertility== أو خد cyclophosphamide قبل كده (moderate-to-high): لأن الـ cyclophosphamide بيضر المبيض وجرعته بتتجمع.
