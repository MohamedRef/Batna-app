  - id: geri.L11.lesson5
    title: "البخاخة المناسبة للإيد المناسبة"
    hook: "أحسن دوا في الدنيا مالوش لازمة لو الحاج مش عارف يشده. في الكبار، الجهاز نص العلاج."
    minutes: 10
    pages: [206, 209]
    topics: [stable, devices, nonpharm]
    goals:
      - "تعرف الـ short و long-acting bronchodilators وإمتى"
      - "تعرف مكان الـ ICS وآثاره"
      - "تختار الجهاز المناسب للكبير"
      - "تعرف الـ add-ons والـ nonpharmacologic"
    status: unverified
    steps:
      - kind: explain
        page: 206
        quote: "Caution: (glaucoma ,urine retention,CVS)."
        title: "الـ short-acting"
        text: |
          - **SABA** (albuterol/salbutamol): inhaler أو nebulizer للكبار اللي صعب عليهم البخاخة. ==rescue== (prn)، مش بمواعيد.
          - **SAMA** (ipratropium): MDI أو nebulizer. **Caution**: glaucoma، urine retention، CVS.
      - kind: explain
        page: 206
        quote: "Persons whose symptoms are Not adequately controlled with one or both classes of short-acting bronchodilator(s)."
        title: "الـ long-acting"
        text: |
          - **LABA**: indacaterol، olodaterol، vilanterol.
          - **LAMA**: aclidinium، tiotropium، umeclidinium.

          **إمتى maintenance؟**
          - الأعراض مش متظبطة على الـ short-acting.
          - ==Frequent exacerbators== (2 أو أكتر في السنة).
          - Moderate-to-severe obstruction.

          الـ long-acting متاحة بالـ handheld inhalers بس؛ الـ nebulized منها **LABA مرتين في اليوم** (arformoterol، formoterol)، ومش للـ acute. الـ anticholinergic الـ nebulized short-acting بس (ipratropium 4 مرات).
      - kind: aside
        tone: trap
        page: 207
        quote: "NOTE when LAMA is prescribed the short acting anticholinergic is discontinued."
        text: "فخ: لما تبدأ LAMA (tiotropium)، **وقّف** الـ ipratropium. اتنين anticholinergic مع بعض = side effects مضاعفة على نفس الـ glaucoma والـ prostate."
      - kind: explain
        page: 207
        quote: "NOTE Single therapy with ICS is not recommended in COPD as it is less effective than ICS + LABA."
        title: "الـ ICS"
        text: |
          **لمين؟** obstruction أشد، أو frequent exacerbators مش متظبطين على LABA أو LAMA.

          - ==ICS لوحده لأ==: أضعف من ICS + LABA.
          - غالبًا مدى الحياة، فالتعرّض طويل.
          - **Local**: ترسيب في الـ oropharynx؛ اللي بينسى يشطف ويغرغر ويتف بيجيله **dysphonia**، **candidiasis**، contact dermatitis للبق والمناخير والعين.
          - **Systemic**: bone density أقل، **posterior subcapsular cataract**، **pneumonia**.
      - kind: check
        page: 207
        quote: "Systemic adverse effects of ICS : decreased bone mineral density ,cataract ( posterior subcapsular) and pneumonia."
        question: "Which is a systemic adverse effect of inhaled corticosteroids in the book?"
        options: ["Pneumonia", "Dysphonia", "Oral candidiasis", "Contact dermatitis of the mouth"]
        answer: 0
        why:
          - "صح: مع الـ bone density والـ cataract."
          - "دي local من الترسيب في الزور."
          - "دي local؛ بتتمنع بالشطف."
          - "دي local."
      - kind: table
        page: 208
        quote: "SMI: This is a newer form of inhaler that delivers the medication in a slow mist."
        title: "التلات بخاخات"
        columns: ["Device", "What", "Breath"]
        rows:
          - ["MDI", "Liquid + propellant, bursts; spacer helps", "Deep fast, synchronized"]
          - ["DPI", "Dry powder, no propellant, no spacer", "Deep fast; hard in severe disease"]
          - ["SMI", "Slow mist", "Speed does not matter"]
        hide: [[0, 2], [1, 2], [2, 2]]
      - kind: explain
        page: 208
        quote: "However, a nebulizer may take up to 10 -20 minutes to dispense the medication. Nebulizers are not as portable as inhalers."
        title: "Nebulizer ولا inhaler؟"
        text: |
          الـ ==nebulizer== بيحوّل الدوا لـ mist بيتنفس براحة (من غير شهيق سريع عميق)، فهو أسهل.

          بس: بياخد **10-20 دقيقة**، مش portable، ولازم تقيس الجرعة وتحطها في الجهاز. الـ inhaler فيه جرعة محددة في كل puff.
      - kind: mnemonic
        page: 208
        quote: "Prioritization is given to Once-daily administration, Self-containedinhaler devices, educating the patient/caregiver on medication administration."
        word: "OSE"
        parts:
          - { key: "O", text: "Once-daily administration" }
          - { key: "S", text: "Self-contained inhaler devices" }
          - { key: "E", text: "Educate the patient and caregiver" }
        hook: |
          في الكبار افتكر **OSE**، زي ما تقول للحاج «أوسَع لنفسك»: جرعة واحدة، جهاز واحد، وعلّم اللي بيرعاه. والـ stepwise ممكن يوصل لـ **triple therapy** (LABA + LAMA + ICS) في جهاز واحد (Ellipta) + SABA للإنقاذ.
      - kind: explain
        page: 209
        quote: "Goal serum level in older adults of 8 to 12 mcg/mL."
        title: "الـ add-ons"
        text: |
          - **Theophylline**: nonselective PDE inhibitor، **third-line** بعد الـ β-agonists والـ anticholinergics. الـ level في الكبار ==8-12 mcg/mL==.
          - **Roflumilast**: oral PDE-4 inhibitor مرة في اليوم.
          - **Azithromycin 250 mg** يوميًا: بيقلل الـ exacerbations. لمين؟ frequent exacerbators على triple therapy، من غير ضعف سمع أو resting tachycardia أو خطر QTc. المخاطر: resistance و hearing decrements.
          - **Mucolytics** (NAC): مش routine؛ بس لبلغم لزج مقاوم للعلاج.
      - kind: check
        page: 209
        quote: "Considered maintenance therapy for frequent exacerbators who are maximized on triple-inhaler therapy and do nothave a hearing impairment"
        question: "Which patient should NOT get azithromycin maintenance?"
        options: ["A frequent exacerbator with prolonged QTc", "A frequent exacerbator on triple therapy with normal ECG and hearing", "One with 3 exacerbations a year on LABA + LAMA + ICS", "One whose hearing test is normal"]
        answer: 0
        why:
