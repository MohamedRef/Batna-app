  # ---------- p288: lower is better, pleiotropic ----------
  - id: dm.L23.026
    kind: card
    topic: lower
    front: Is there an LDL-C level below which benefit stops or harm starts?
    back: "None has been defined: the lower the achieved LDL-C, the lower the CV risk, with no lower limit or J-curve (\"lower is better\"). Safety data on very low LDL-C are reassuring, though longer monitoring is needed."
    src: { page: 288, quote: "No level of LDL-C below which benefit ceases or harm occurs has been defined." }
    status: unverified
    tags: [high-yield]
