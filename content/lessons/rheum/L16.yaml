            <text x="225" y="185" class="t-sm t-bad">PIP ↓ flex</text>
            <text x="270" y="125" class="t-sm">DIP ↑ ext</text>
          </svg>
      - kind: mnemonic
        page: 247
        quote: "Boutonniere deformity: Flexion at the PIP with extension at DIP."
        word: "BPF"
        parts:
          - { key: "B", text: "Boutonniere:" }
          - { key: "P", text: "PIP" }
          - { key: "F", text: "Flexed (and the DIP goes the other way: extended)" }
        hook: "**B**outonniere = **P**IP **F**lexed. الزرار (button) بيعدّي في العروة لما الـ PIP ينطوي لقدّام. والـ swan neck هو العكس."
      - kind: check
        page: 247
        quote: "Swan neck deformity: Hyperextension at PIP with flexion at DIP."
        question: "Hyperextension at PIP and flexion at DIP. What is it?"
        options: ["Swan neck", "Boutonniere", "Z-shaped thumb", "Trigger finger"]
        answer: 0
        why:
          - "صح: رقبة البجعة، الـ PIP لفوق والـ DIP لتحت."
          - "الـ boutonniere هو العكس: PIP flexed و DIP extended."
          - "الـ Z deformity في الصباع الكبير (thumb)."
          - "الـ trigger finger = الصباع بيقفل وهو مثني بسبب nodule في الـ tendon sheath."
      - kind: explain
        page: 247
        title: "باقي الإيد"
        quote: "Ulnar deviation of fingers at MCP joint associated with deviation at radiocarpal Joints Zig Zag deformity of the hand."
        text: |
          - **Ulnar deviation** عند الـ MCP + انحراف عند الـ radiocarpal = ==zig-zag deformity==.
          - **Z-shaped thumb** و **MCP subluxation**.
          - **Piano-key (caput) ulna**: الـ ulnar styloid بيطلع لفوق (dorsal subluxation)، تدوس عليه ينزل ويطلع زي زرار البيانو.
          - **Trigger finger**: tendon sheath ملتهب فيه nodule، الصباع يقفل وهو مثني.
      - kind: explain
        page: 247
        title: "التشوّه بيحصل إزاي؟"
        quote: "Ulnar deviation of fingers at MCP joint associated with deviation at radiocarpal Joints  Zig Zag deformity of the hand."
        text: |
          القاعدة جات في ص 243: ==inflammatory destruction of soft tissues== ← الـ ligaments والـ tendons ترتخي ← deformities. الـ capsule والأربطة هما اللي ماسكين العضم في خط مستقيم؛ علشان كده لما يرتخوا، الشد بتاع العضلات يسحب الصباع لأي اتجاه أقوى.

          التفسير المقبول (مش في الكتاب) لكل شكل:
          - **Zig-zag**: الـ wrist يميل ناحية الـ radius، والصوابع تتعوّض وتزوغ ناحية الـ ==ulna== عند الـ MCP (الـ extensor tendons بتزحلق من على راس الـ MCP)، فالإيد تبقى زي حرف Z.
          - **Swan neck**: الـ PIP بيرتخي من قدّام فيتفرد زيادة (hyperextension)، والـ DIP يتشد لتحت.
          - **Boutonniere**: الوتر اللي فوق الـ PIP يتقطع أو يرتخي، فالـ PIP "يخرم" بين الشريطين الجانبيين زي الزرار في العروة (boutonnière = عروة)، فيتثني، والـ DIP يتفرد.
      - kind: reveal
        page: 247
        quote: "Trigger finger: Inflamed flexor tendon sheath that prevents extension of finger from a flexed position. A nodule formed in the tendon sheath  locking"
        prompt: "ليه الـ trigger finger بيقفل وهو مثني ومش بيقفل وهو مفرود؟"
        answer: |
          الكتاب بيقولك السبب: ==nodule== في الـ flexor tendon sheath الملتهب.

          التفسير المقبول (مش في الكتاب): لما تقفل إيدك، الـ nodule بيعدّي من النفق الضيق بالعافية (الـ flexors قوية)، بس وانت بتفرد الـ extensors أضعف ومش قادرة ترجّعه، فالصباع **يتمسك** مثني، ولما تزقه يفلت فجأة زي زناد المسدس (trigger).
      - kind: figure
        page: 248
        title: "إيد الـ RA في الكتاب"
        image: { file: rheum/L16-hands-deformities.webp, book: true }
        alt: "Book photograph of both hands of a patient with rheumatoid arthritis resting on the thighs: swollen MCP joints, ulnar deviation of the fingers and finger deformities."
        caption: "بص على الـ **MCP** المنفوخة وانحراف الصوابع ناحية الـ ulna. دي الإيد اللي هتشوفها في الامتحان العملي."
      - kind: explain
        page: 247
        title: "علامات صغيرة بتفرق"
        quote: "Palmer erythema and prominent veins on the dorsum of hand indicating increased blood flow."
        text: |
          - **Muscle atrophy** و grip ضعيف.
          - **Boggy synovium** على ضهر الـ wrist (طري زي الإسفنجة).
          - ==Dorsiflexion== الـ wrist بيتحدّ **بدري**.
          - **Palmar erythema** وعروق بارزة على ضهر الإيد: الدم زايد علشان الالتهاب.
          - جلد رفيع atrophic فوق الـ synovitis.
      - kind: explain
        page: 249
        title: "القدم والركبة"
        quote: "MTP subluxation and flexion at PIP cock-up deformity of toe (hammer toe)"
        text: |
          **القدم**: زي الإيد. **Metatarsophalangeal (MTP) subluxation** + flexion عند الـ PIP = ==cock-up (hammer) toe== مع callosities، و hallux valgus، و fibular deviation للصوابع، والـ arch بيفطس، و valgus في الكاحل.

          **الركبة**: ورم (synovial hypertrophy + effusion)، و quadriceps atrophy.

          والـ quadriceps بيضمر، والتفسير المقبول (مش في الكتاب) لأن العيان بيبطّل يفرد ركبته اللي بتوجعه، زي العضلات جنب أي مفصل ملتهب (ص 243).
      - kind: figure
        page: 249
        title: "رجلين الـ RA"
        image: { file: rheum/L16-feet.webp, book: true }
        alt: "Both feet from above: the big toes angle outwards under the other toes, the second toes ride up over them, and red swellings sit over the joints at the base of the toes."
        caption: |
          القدمين من فوق:

          - الصباع الكبير مايل لبرّه وداخل تحت الصوابع التانية: ==hallux valgus==.
          - الصباع التاني طالع فوق، والمفاصل عند قاعدة الصوابع منفوخة وحمرا: **MTP subluxation** مع **cock-up (hammer) toe**.

          يعني نفس اللي بيحصل في الإيد بيحصل في القدم: الأربطة بتسيب، والصوابع بتتزق من مكانها.
      - kind: reveal
        page: 249
        quote: "MTP subluxation and flexion at PIP  cock-up deformity of toe (hammer toe)\n  callosities."
        prompt: "ليه عيان RA بيشتكي إنه ماشي على \"زلط\" وعنده callosities تحت القدم؟"
        answer: |
          الكتاب: **MTP subluxation** مع flexion عند الـ PIP = ==cock-up (hammer) toe== ومعاها **callosities**.

          التفسير المقبول (مش في الكتاب): لما الصباع يطلع لفوق عند الـ MTP، راس الـ metatarsal تنزل وتبرز تحت باطن القدم من غير الوسادة الدهنية اللي كانت بتحميها، فيمشي على عضم، والجلد يدافع عن نفسه بـ **callus**. ونفس الضغط فوق الصباع المرفوع مع الجزمة يعمل callus تاني.
      - kind: explain
        page: 249
        title: "الـ Baker's cyst"
        quote: "Backer's cyst: effusion in semimembranous bursa at back of knee. This cyst may dissect in the calf and rupture mimics DVT."
        text: |
          ==Baker's cyst==: effusion في الـ **semimembranosus bursa** ورا الركبة.

          ممكن يزحف في الـ calf **وينفجر**، فالسمانة تورم وتوجع: شبه الـ ==deep vein thrombosis (DVT)== بالظبط.

          التشخيص: **Doppler ultrasound (US)** أو arthrography، ودلوقتي الـ **US أو MRI** (non-invasive) بيغنوا عن الـ arthrography.

          علشان كده أي عيان RA بسمانة وارمة لازم تتأكد بالتصوير قبل ما تحكم إنها DVT.
      - kind: aside
        tone: joke
        page: 249
        quote: "Doppler ultrasound or arthrography for diagnosis."
        text: "الـ Baker's cyst ده ممثل شاطر: بيعمل دور **DVT** لدرجة إن ناس بتديله anticoagulant. اعمل **Doppler** الأول قبل ما تمنحه الأوسكار."
      - kind: check
