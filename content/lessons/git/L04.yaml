          - **Previous mediastinal radiation**، **HPV**، و **coeliac disease**.
          - الـ molecular pathogenesis مش متعرّفة كلها، بس فقدان **tumor suppressor genes** زي p53 و p16 داخل فيها.

          التفسير المقبول (مش في الكتاب): لاحظ إن **الفقر** في القايمة: ده بيلمّ عوامل كتير مع بعض (أكل أقل تنوعًا، نقص فيتامينات، أكل مخزّن غلط فيه فطريات). وعلشان كده الـ SCC لسه أشهر في البلاد الفقيرة، والـ adenocarcinoma زاد في البلاد الغنية مع السمنة.
