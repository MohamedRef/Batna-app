      - kind: explain
        page: 22
        quote: "The major concern about acromegaly during pregnancy is the potential tumor expansion leading to neurological or visual complications."
        title: "العلاج: إيه اللي بنخاف منه؟"
        text: |
          الخوف الأساسي ==tumor expansion== اللي يعمل مضاعفات **neurological أو visual**، مش الـ GH نفسه (لأنه مش بيعدّي المشيمة).

          - **Dopamine agonists**: بتتحكم في **10%** بس، وأحسن لو الورم بيعمل ==GH و PRL مع بعض==. ليه؟ التفسير المقبول (مش في الكتاب): الخلايا اللي بتعمل prolactin عليها dopamine receptors كتير، فالورم المختلط بيرد أحسن.
          - **Somatostatin analogues**: 36 حامل من غير malformations، بس الـ octreotide بيعدّي المشيمة وبيرتبط بالـ receptors في مخ الجنين، فالقاعدة: ==وقّفه لو بتخطط للحمل== واستخدمي contraception وهي عليه.
          - ليه الإيقاف آمن؟ لأن الـ acromegaly مرض بطيء جدًا، فـ **9–12 شهر** من غير علاج مش هيفرقوا على المدى البعيد.
