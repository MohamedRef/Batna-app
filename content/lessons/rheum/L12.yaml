  - id: rheum.L12.lesson1
    title: "JIA: مفاصل صغيرة ومشكلة كبيرة"
    hook: "طفل ركبته وارمة من شهرين ومش بيعيط. ده مش دلع، ده أشهر روماتيزم مزمن في الأطفال."
    minutes: 8
    pages: [197, 198]
    topics: [definition, epidemiology]
    goals:
      - "تعرف تعريف الـ JIA والتلات شروط وليه كل شرط"
      - "تحفظ نسب الأنواع والسن والجنس"
    status: unverified
    steps:
      - kind: explain
        page: 197
        quote: "Juvenile idiopathic arthritis (JIA) is a heterogeneous group of disorders characterized by childhood-onset chronic arthritis of unknown cause."
        title: "التعريف"
        text: |
          الـ ==juvenile idiopathic arthritis (JIA)== مش مرض واحد. هو **heterogeneous group of disorders**: chronic arthritis بيبدأ في الطفولة، وسببه unknown (عشان كده idiopathic).

          - **أشهر chronic inflammatory rheumatic disease** في الأطفال.
          - الـ prevalence: **50–200 لكل 100,000 طفل**.
          - اتوصف من **1890** ولسه السبب مش واضح.
      - kind: reveal
        page: 197
        quote: "Juvenile idiopathic arthritis (JIA) is a heterogeneous group of disorders characterized by childhood-onset chronic arthritis of unknown cause."
        prompt: "الكتاب بيقول heterogeneous group of disorders. ليه مش بيعتبره مرض واحد؟"
        answer: |
          لأن تحت الاسم ده أنواع ==مختلفة جدًا==: طفلة عندها ركبة واحدة وعين ساكتة، وطفل بحمى كل يوم و serositis، وولد كبير عنده enthesitis و HLA-B27. هتشوفهم كلهم في المحاضرة.

          التفسير المقبول (مش في الكتاب): الحاجة الوحيدة اللي بتجمعهم هي الشكل من برا: ==chronic arthritis== في طفل من غير سبب معروف. علشان كده التعريف كله شروط "استبعاد" ومدة، مش تحليل.
      - kind: mnemonic
        page: 197
        quote: "All three conditions must be met\n  Arthritis persisting for longer than 6 weeks.\n  Arthritis beginning before 16 years of age.\n  Exclusion of other conditions associated with or mimicking arthritis."
        word: "SIX"
        parts:
          - { key: "S", text: "Sixteen: arthritis begins before 16 years" }
          - { key: "I", text: "In place for more than 6 weeks" }
          - { key: "X", text: "eXclude other causes that mimic arthritis" }
        hook: |
          التلات شروط لازم **كلهم** يتحققوا. افتكر **SIX**: الـ 6 أسابيع هي قلب التعريف، و 16 سنة بتبدأ بـ six-teen.
      - kind: explain
        remind: [rheum.L12.003]
        page: 197
        title: "ليه الشروط دي بالذات؟"
        quote: "All three conditions must be met\n  Arthritis persisting for longer than 6 weeks.\n  Arthritis beginning before 16 years of age.\n  Exclusion of other conditions associated with or mimicking arthritis."
        text: |
          الكتاب بيقول التلاتة **must be met**. والسبب ورا كل واحد (التفسير المقبول، مش في الكتاب):
          - **أكتر من 6 أسابيع**: عشان أغلب الـ arthritis العابر في الأطفال (بعد فيروس مثلًا) بيخف قبل كده، فالمدة بتفصل المزمن عن العابر
          - **قبل 16 سنة**: ده الحد اللي بيفصل الـ juvenile عن أمراض الكبار زي الـ RA
          - ==Exclusion==: لأن مفيش تحليل بيأكد (هتشوفها في ص 203)، فلازم تشيل الـ infection والـ trauma والـ malignancy وغيرهم الأول. ركبة طفل وارمة ممكن تكون septic arthritis أو leukaemia، ودول ما يستنوش 6 أسابيع
      - kind: check
        page: 197
        quote: "All three conditions must be met\n  Arthritis persisting for longer than 6 weeks.\n  Arthritis beginning before 16 years of age.\n  Exclusion of other conditions associated with or mimicking arthritis."
        question: "A 5-year-old has had a swollen knee for 3 weeks; infection excluded. JIA?"
        options: ["Not yet: needs more than 6 weeks", "Yes, if ANA is positive", "Yes, any arthritis under 16", "No, too young"]
        answer: 0
        why:
          - "صح: لازم الـ arthritis يكمل أكتر من 6 أسابيع."
          - "الـ antinuclear antibodies (ANA) مش من الشروط، ومفيش diagnostic test."
          - "ناقص شرط المدة."
          - "الـ peak أصلًا من سنة لـ 3 سنين."
      - kind: figure
        page: 197
        quote: "Epidemiology\n  Systemic Onset: 10% to 15% of cases\n  Polyarticular: 15% to 20% of new cases.\n  Pauciarticular: 65% to 75% of new cases."
        title: "مين أشهر نوع؟"
        alt: "Three horizontal bars of JIA onset types. Pauciarticular is the longest bar, 65 to 75 percent. Polyarticular 15 to 20 percent. Systemic onset 10 to 15 percent."
        caption: "الـ pauciarticular (oligo) لوحده تقريبًا تلت أرباع الحالات."
        svg: |
          <svg viewBox="0 0 330 170" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="22" class="t-sm t-mut">share of new JIA cases</text>
            <rect x="10" y="35" width="230" height="30" class="fg-acc"/>
            <text x="18" y="55" class="t-sm t-b">Pauciarticular</text>
            <text x="248" y="55" class="t-sm t-b">65-75%</text>
            <rect x="10" y="80" width="60" height="30" class="fg-good"/>
            <text x="78" y="100" class="t-sm">Polyarticular 15-20%</text>
            <rect x="10" y="125" width="45" height="30" class="fg-bad"/>
            <text x="63" y="145" class="t-sm">Systemic onset 10-15%</text>
          </svg>
      - kind: explain
        page: 197
        title: "ليه الـ oligo هو الأشهر؟"
        quote: "Epidemiology\n  Systemic Onset: 10% to 15% of cases\n  Polyarticular: 15% to 20% of new cases.\n  Pauciarticular: 65% to 75% of new cases."
        text: |
          الأرقام من الكتاب: ==pauciarticular 65–75%==، polyarticular **15–20%**، systemic onset **10–15%**.

          الكتاب ما بيقولش ليه. اللي يساعدك تفتكر (مش في الكتاب): الـ pauciarticular و oligoarticular **نفس النوع** باسمين، "pauci" يعني قليل. فلو سألك "most common onset type" اكتب **oligo/pauciarticular**، وافتكر إن ده نفس النوع اللي عينه في خطر.
      - kind: explain
        page: 198
        quote: "In a series from the United States, the peak incidence of JRA occurred at one to three years of age, with a preponderance of girls in this age group."
        title: "السن والجنس"
        text: |
          - **Peak أول**: من **1 لـ 3 سنين**، أغلبهم **بنات**.
          - **Peak تاني** أصغر: **8–10 سنين**، فيه ولاد أكتر بـ oligoarticular JIA.
          - الـ ==female-to-male== عمومًا **2:1 لـ 3:1**.
          - الـ oligo تحت 8 سنين ممكن يوصل **8:1**، خصوصًا لو فيه iridocyclitis.
          - الـ **HLA-B27** late-onset: ولاد أكتر.
          - الـ **Systemic JIA**: مفيش فرق بين الجنسين.

          التفسير المقبول (مش في الكتاب): كل نوع ليه جيناته وسنه، عشان كده النسبة العامة متوسط لأنواع مختلفة، والسؤال اللي جاي بيوضح ده.
      - kind: reveal
        page: 198
        quote: "As an example, oligoarticular JIA affecting children under eight years old may have a female preponderance as high as 8:1, especially if iridocyclitis is present.\n  In contrast, late-onset human leukocyte antigen (HLA) B27-related disease occurs more commonly in males."
        prompt: "الـ female:male العام 2:1 لـ 3:1. ليه الرقم ده بيتغير كده (8:1 في نوع، وولاد أكتر في نوع)؟"
        answer: |
          الكتاب بيقول السبب: النسبة ==depend upon the age at onset and the type of disease==. يعني الرقم العام متوسط لأنواع مختلفة:
          - **Oligo تحت 8 سنين** (خصوصًا مع iridocyclitis): بنات لحد **8:1**
          - **HLA-B27 late-onset**: ==ولاد== أكتر (ده الـ ERA اللي هتقابله بعدين)
          - **Systemic**: مفيش فرق

          علشان كده الـ peak التاني (8 لـ 10 سنين) فيه ولاد أكتر.
      - kind: aside
        tone: joke
        page: 198
        quote: "Systemic JIA shows little or no discrimination between sexes."
        text: "الـ systemic JIA هو الوحيد اللي عنده مساواة كاملة بين الولاد والبنات. أعدل نوع في المحاضرة، بس للأسف أخطرهم."
      - kind: check
        page: 197
        quote: "It begins before the age of 16 years and persist for more than 6 weeks."
        question: "A 7-year-old girl has had a swollen right knee for 4 weeks. Infection and trauma are excluded. What is the next step?"
        options:
          - "Follow up: JIA needs arthritis for more than 6 weeks"
          - "Diagnose JIA now"
          - "Diagnose JIA if ANA is positive"
          - "Diagnose adult-type RA"
        answer: 0
        why:
          - "صح: الـ JIA لازم أكتر من 6 أسابيع، فلسه بدري. تابعها."
          - "ناقص شرط المدة."
          - "الـ ANA مش من الشروط (ومفيش diagnostic test، ص 203)."
          - "تحت 16 سنة = juvenile."
      - kind: try
        items: [rheum.L12.003, rheum.L12.004, rheum.L12.006, rheum.L12.009, rheum.L12.091]
    recap:
      - "JIA = chronic arthritis قبل 16 سنة، أكتر من 6 أسابيع، بعد استبعاد غيره. أشهر روماتيزم مزمن في الأطفال، 50 لـ 200 لكل 100,000."
      - "Pauci 65–75%، poly 15–20%، systemic 10–15%."
      - "Peak 1–3 سنين بنات، وpeak تاني 8–10 فيه ولاد (oligo). F:M من 2:1 لـ 3:1؛ oligo تحت 8 لحد 8:1؛ B27 ولاد؛ systemic مفيش فرق."
    practice: [rheum.L12.001, rheum.L12.002, rheum.L12.003, rheum.L12.004, rheum.L12.005, rheum.L12.006, rheum.L12.007, rheum.L12.008, rheum.L12.009, rheum.L12.010, rheum.L12.011, rheum.L12.091]
