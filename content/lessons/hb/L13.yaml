        answer: |
          الكتاب: الـ dominant stricture بتخلي متوسط البقاء **14 سنة** بدل **27**، وبتزوّد خطر الـ **cholangiocarcinoma (CCA)**. وعشان كده لما يحصل **subacute worsening** في الألم أو التحاليل، فكّر فيها وفي الـ CCA.

          العلاج: **balloon dilatation** هو الـ standard therapy of choice، والـ stenting لسه فيه خلاف.

          ليه السد الواحد بيفرق كده؟ التفسير المقبول (مش في الكتاب): ضيق واحد شديد بيحبس الصفرا ورا كل اللي فوقه، فيزوّد الـ cholangitis والضرر، والالتهاب المزمن في المكان ده نفسه أرض خصبة للورم.
      - kind: explain
        page: 229
        quote: "UDCA is a hydrophilic bile acid and a chemical derivative of chenodeoxycholate that has been extensively studied for the treatment of PSC. It is commonly used in the therapy of cholestatic liver disorders because of its protective effects on cholangiocytes, stimulation of hepatobiliary secretion, and ability to protect liver cells against bile acid-induced apoptosis. Moreover, UDCA has been found to have genotoxic and aneugenic activity. It also inhibits enzyme activity and important biochemical pathways, including DNA repair and phagocytosis. Previous studies have demonstrated that treatment with UDCA leads to a substantial improvement in liver function tests for patients with PSC. The first randomized controlled trial of UDCA in PSC, conducted by Beuers et al in 1992, demonstrated that UDCA (13-15 mg/kg) was effective in reducing disease activity compared to placebo after 1 year of treatment. Subsequent studies have examined the impact of UDCA at different dosages in PSC. Although biochemical parameters have improved in most studies, more data are needed to conclusively demonstrate improvements in \"hard endpoints\" such as patient survival, liver transplantation outcomes or progression to CCA."
        title: "قصة الـ UDCA في الـ PSC"
        text: |
          الـ ==UDCA== هو **hydrophilic bile acid** (مشتق من الـ chenodeoxycholate). بيعمل 3 حاجات:

          - بيحمي الـ **cholangiocytes**.
          - بيزوّد الـ hepatobiliary secretion.
          - بيحمي الـ liver cells من الـ bile acid-induced apoptosis.

          بس الدراسات في الـ PSC مش متفقة:

          - Beuers 1992: أول randomized controlled trial (RCT)، بجرعة 13–15 mg/kg، وقلّل الـ disease activity بعد سنة.
          - **Mitchell**: 26 مريض بجرعة 20 mg/kg/day، وحسّن الـ tests والـ cholangiogram والـ fibrosis.
          - Randomized controlled trial (RCT) بـ 219 مريض (17–23 mg/kg/day): مفيش فرق significant في «death or transplant».
          - ==High dose== (28–30 mg/kg/day): ضرر. cirrhosis progression، و varices، و CCA، و transplant، أو death.
          - 3 meta-analyses: مفيش effect على الـ mortality أو الـ transplant.
          - **British Society of Gastroenterology**: ضد الـ long-term UDCA في الـ PSC الجديد.

          الدرس هنا: الـ biochemistry بتتحسن، بس الـ hard endpoints (survival و transplant) ما اتحسنتش.

          **UDCA + metronidazole** (80 مريض، 3 سنين): Alkaline phosphatase (ALP) أقل، و **New Mayo Risk Score** نزل، ومفيش progression في الـ endoscopic retrograde cholangiopancreatography (ERCP)، والـ histology أحسن.

          ليه التحاليل تتحسن والـ survival لأ؟ التفسير المقبول (مش في الكتاب): الـ ALP مقياس للـ cholestasis النهارده، مش للـ fibrosis والـ strictures اللي بتتكوّن على سنين. يعني ممكن الرقم ينزل والمرض يكمّل تحت، وعشان كده الـ British Society of Gastroenterology بتقول **against** الـ long-term UDCA في الـ PSC الجديد.
