  # ------------------------------------------------------------------
  - id: hem.L09.lesson5
    title: "الـ PMF: من الـ dry tap لحد الـ ruxolitinib"
    hook: "الإبرة بتطلع ناشفة، والـ IPSS بيقولك فاضل قد إيه، وعلاج واحد بس اللي بيشفي."
    minutes: 10
    pages: [149, 155]
    topics: [pmf-tests, pmf-prognosis, pmf-treatment]
    goals:
      - "تعرف الـ blood film والـ trephine في الـ PMF"
      - "تحسب الـ IPSS"
      - "ترتب علاج الأنيميا والطحال (سؤال كتاب)"
    status: unverified
    steps:
      - kind: explain
        page: 149
        title: "الـ film"
        quote: "Other causes of a leukoerythroblastic blood film include BM infiltration, severe sepsis, severe hemolysis."
        text: |
          في الـ PMF الـ film فيه:
          1. ==Leukoerythroblastic picture== (myeloid و erythroid precursors)
          2. **Teardrop poikilocytes (dacryocytes)**
          3. **Macrocytosis** (يمكن من folate deficiency ويمكن لأ)
          4. **Giant platelets** و megakaryocyte fragments

          وخد بالك: الـ leukoerythroblastic film كمان في **BM infiltration** و **severe sepsis** و **severe hemolysis**.
      - kind: aside
        tone: analogy
        page: 149
        quote: "Teardrop poikilocytes (dacryocytes)"
        text: "الـ **teardrop cell** زي معجون أسنان اتعصر من فتحة ضيقة: كرة الدم الحمرا بتتزنق وهي طالعة من نخاع مليان ألياف أو من طحال كبير، فتطلع بذيل. (ده تفسير شائع؛ الكتاب بيذكر الـ dacryocytes بس.)"
      - kind: explain
        page: 150
        title: "النخاع: الإبرة بتطلع ناشفة"
        quote: "Bone marrow trephine biopsy is essential to make a diagnosis of PMF."
        text: |
          - ==Bone marrow trephine biopsy== أساسي للتشخيص.
          - الـ **aspiration** غالبًا **dry tap** أو hemodiluted.
          - الـ **karyotype** (من النخاع أو الدم) بيستبعد **CML**. وفيه abnormalities تانية في لحد **60%**؛ الـ **5 و 7** بعد genotoxic agents و **poor prognosis**.
          - في الأول: النخاع **hypercellular** و megakaryocytes كبيرة في **clusters**. بعدين الـ fibrosis تكسب.
          - **Silver impregnation** = reticulin، و **trichrome** = collagen.
          - في الحالات الـ advanced بيحصل **osteosclerosis**، يعني trabeculae تخينة، ويبان في X-ray و MRI.
      - kind: check
        page: 150
        quote: "Collagen fibers are best demonstrated using a trichrome stain."
        question: "Best stain for collagen fibres in a PMF trephine?"
        options: ["Trichrome", "Silver impregnation", "Perls", "Congo red"]
        answer: 0
        why:
          - "صح: الـ collagen بالـ trichrome."
          - "الـ silver للـ reticulin."
          - "الـ Perls للحديد."
          - "الـ Congo red للـ amyloid."
      - kind: explain
        page: 151
        title: "الـ prognosis"
        quote: "patients with CALR mutations may have fewer thrombotic events, but more myelofibrotic transformation"
        text: |
          - Median survival **3–5 سنين** (range واسع)، واتحسّن بالـ **ruxolitinib** والرعاية.
          - أشهر scores: **IPSS** و **DIPSS** و **DIPSS-plus**.
          - **CALR**: ==fewer thrombotic events but more myelofibrotic transformation==.
          - طفرات **worse prognosis**: **ASXL-1، EZH2، IDH1/2، SRSF2**.
      - kind: table
        page: 151
        quote: "Risk assignment: Low = 0; Intermediate 1 = 1; Intermediate 2 = 2; High = 3+"
        title: "IPSS: نقطة لكل واحدة"
        columns: [Variable, "1 point if"]
        rows:
          - ["Age", ">65 years"]
          - ["WBC", ">25 × 10⁹/L"]
          - ["Hemoglobin", "<100 g/L"]
          - ["Peripheral blasts", ">1%"]
          - ["Constitutional symptoms", "Yes"]
          - ["0 / 1 / 2 / ≥3", "Low / Int-1 / Int-2 / High"]
          - ["Median survival", "135 / 95 / 48 / 27 months"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [6, 1]]
      - kind: check
        page: 151
        quote: "Median survivals are 135, 95, 48 and 27 months, respectively"
        question: "70-year-old, Hb 92 g/L, WBC 14, no blasts, night sweats and weight loss. IPSS?"
        options: ["High (3), 27 months", "Int-2 (2), 48 months", "Int-1 (1), 95 months", "Low (0), 135 months"]
        answer: 0
        why:
          - "صح: السن (1) + Hb <100 (1) + symptoms (1) = 3 = high."
          - "نسيت نقطة: عدّ السن والـ Hb والأعراض."
          - "دي نقطة واحدة بس."
          - "هي عندها نقط أكيد."
      - kind: explain
        page: 152
        title: "الشفا الوحيد: allogeneic SCT"
        quote: "The long-term survival of patients ≤45 years is approx. 50%, with a 30% transplant-related mortality."
        text: |
          ==The only curative treatment for PMF is allogeneic SCT==، بس مناسب لعدد قليل (حوالي **10%**، الصغيرين والـ fit).
          - **≤45 سنة**: long-term survival حوالي **50%**، و transplant-related mortality **30%**.
          - **≥45**: survival **10–20%** بس.

          الباقي العلاج **supportive** للأعراض، وتأثيره قليل على الـ survival.
      - kind: explain
        page: 152
        title: "Ruxolitinib"
        quote: "ruxolitinib delivers benefit in control of symptoms and reduces splenomegaly, as well as improving survival for patients with intermediate-risk-2 and high-risk PMF"
        text: |
          الـ **COMFORT trials**: الـ ==ruxolitinib== (JAK1/2 inhibitor) بيحسّن الأعراض، وبيصغّر الطحال، وبيحسّن الـ survival في **intermediate-2 و high-risk**، **regardless of JAK mutation status**.

          أعراضه:
          - **Anemia**: Hb بينزل حوالي **10%**، أقصاه في **12–16 أسبوع** وبعدين يتحسن.
          - **Thrombocytopenia**: الصفائح تنزل حوالي **40%**.
          - العلاج: dose modification، و EPO أو androgens.
          - **Rebound** للأعراض والطحال لو وقّفته فجأة.
          - **Herpes reactivation** و opportunistic infections.
      - kind: figure
        page: 152
        quote: "a predictable fall in hemoglobin levels by 10%, peaking at 12–16 weeks and gradually resolving thereafter)"
        title: "الـ Hb على الـ ruxolitinib"
        alt: "A line graph of hemoglobin over 30 weeks on ruxolitinib. It falls by about 10 percent to a lowest point at 12 to 16 weeks, shaded, then slowly recovers toward baseline."
        caption: "النزول ==متوقع== وبيرجع. ما توقفش الدوا بسببه؛ عدّل الجرعة."
        svg: |
          <svg viewBox="0 0 330 210" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 20 V170 H320" class="fg-ink"/>
            <rect x="128" y="20" width="44" height="150" class="fg-thin"/>
            <path d="M40 50 C80 55 110 95 150 100 C200 104 250 70 315 58" class="fg-arrow-acc" stroke-width="3"/>
            <path d="M40 50 H315" class="fg-thin"/>
            <text x="44" y="42" class="t-sm t-mut">baseline Hb</text>
            <text x="150" y="122" text-anchor="middle" class="t-sm t-b">−10%</text>
            <text x="150" y="160" text-anchor="middle" class="t-sm">12–16 wk</text>
            <text x="40" y="190" text-anchor="middle" class="t-sm">0</text>
            <text x="315" y="190" text-anchor="end" class="t-sm">weeks on ruxolitinib</text>
            <text x="300" y="80" text-anchor="end" class="t-sm t-good">recovers</text>
          </svg>
      - kind: update
        page: 152
        quote: "These studies led to its FDA approval in PMF."
        text: "بعد الـ FDA approval بتاع الـ ruxolitinib، دلوقتي فيه 3 JAK inhibitors تانيين للـ myelofibrosis: **fedratinib**، و **pacritinib** (لو الصفائح أقل من 50)، و **momelotinib** (لو فيه أنيميا). الكتاب بيقول ruxolitinib، فاكتبه في الامتحان."
        ref: "NCCN Myeloproliferative Neoplasms guideline 2024"
      - kind: mnemonic
        page: 153
        quote: "Despite these treatments, most patients become transfusion- dependent eventually."
        word: "PASTE"
        parts:
          - { key: "P", text: "Pomalidomide: also reported to work" }
          - { key: "A", text: "Androgens: up to one third respond (oxymetholone 50–150 mg, danazol 400–600 mg); best with no massive spleen and a normal karyotype" }
          - { key: "S", text: "Steroids: if red cell survival is reduced" }
          - { key: "T", text: "Thalidomide: 20–30% respond; poorly tolerated, thrombocytosis, VTE, teratogenic" }
          - { key: "E", text: "Erythropoietin: when endogenous EPO is low" }
        hook: "علاج الأنيميا في الـ PMF **PASTE** بتلزّقه، وفي الآخر أغلبهم بيبقوا **transfusion-dependent**."
      - kind: explain
        page: 154
        title: "الطحال: cytoreduction، splenectomy، irradiation"
        quote: "Problems include perioperative bleeding, infection and thrombosis, as well as rebound thrombocytosis and progressive hepatomegaly."
        text: |
          - **Cytoreduction**: للـ hepatosplenomegaly والأعراض والـ thrombocytosis. **Hydroxycarbamide** الأشهر، و anagrelide للصفائح. الـ **interferon** ممكن في الأول، ومرات بيرجّع التليف.
          - ==Splenectomy== دواعيه: splenic pain، constitutional symptoms، portal hypertension، transfusion-dependent anemia. **مش** للـ thrombocytopenia. Mortality حوالي **10%**، ومشاكله: bleeding، infection، thrombosis، rebound thrombocytosis، progressive hepatomegaly.
          - **Splenic irradiation**: بيصغّر الطحال **مؤقتًا**، وممكن **life-threatening cytopenias**. وكمان للـ EMH في أعضاء مهمة.
          - الـ **ruxolitinib** بيعالج الـ EMH برا الطحال والكبد، فالـ splenectomy والـ irradiation هيبقوا **last resort**.
      - kind: check
        page: 154
        quote: "In contrast, there is no good evidence that thrombocytopenia responds to splenectomy."
        question: "PMF, platelets 35, painless moderate spleen. He wants splenectomy to raise platelets. Answer?"
        options: ["No good evidence thrombocytopenia responds", "It reliably normalizes platelets", "It is low risk (<1% mortality)", "It cures PMF"]
        answer: 0
        why:
          - "صح: الكتاب بيقول مفيش evidence كويسة."
          - "عكس كلام الكتاب."
          - "الـ mortality حوالي 10%."
          - "الشفا الوحيد هو الـ allogeneic SCT."
      - kind: try
        items: [hem.L09.124, hem.L09.137, hem.L09.148, hem.L09.156, hem.L09.159]
