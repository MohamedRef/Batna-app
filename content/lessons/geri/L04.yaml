  - id: geri.L04.lesson4
    title: "الـ delirium: المخ بيفصل فجأة"
    hook: "تيتا كانت كويسة الصبح، دخلت المستشفى بليل ونزعت الكانيولا وبتشوف ناس على الحيطة. ده مش زهايمر نزل فجأة."
    minutes: 9
    pages: [65, 69]
    topics: [delirium, delirium-causes]
    goals:
      - "تعرّف الـ delirium وتعرف هو شائع قد إيه"
      - "تفرّق الـ hyperactive والـ hypoactive"
      - "تعرف الـ predisposing والـ precipitating والـ 5 independent risk factors"
    status: unverified
    steps:
      - kind: explain
        page: 65
        quote: "An acute disorder of attention and cognitive function."
        title: "التعريف"
        text: |
          الـ ==delirium== هو **acute disorder of attention and cognitive function**.

          وهو **the most frequent complication of hospitalization** عند الكبار، ومشكلة ممكن تبقى devastating.
      - kind: figure
        page: 66
        quote: "Intensive care unit: 70-87%"
        title: "شائع قد إيه؟"
        alt: "Horizontal bars of delirium rates by setting: on admission 14 to 24 percent, postoperative 15 to 53 percent, nursing home 20 to 60 percent, palliative up to 80 percent, ICU 70 to 87 percent. Below: one-year mortality 35 to 40 percent."
        caption: "كل ما المريض يبقى أتعب (ICU، palliative)، الـ delirium يقرّب من القاعدة مش الاستثناء. وبعد سنة، من 35 لـ 40% بيموتوا."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="18" class="t-sm t-mut">Delirium rate (upper end of range)</text>
            <rect x="110" y="28" width="43" height="22" class="fg-acc"/>
            <text x="10" y="44" class="t-sm">Admission</text>
            <text x="160" y="44" class="t-sm">14-24%</text>
            <rect x="110" y="58" width="95" height="22" class="fg-acc"/>
            <text x="10" y="74" class="t-sm">Post-op</text>
            <text x="212" y="74" class="t-sm">15-53%</text>
            <rect x="110" y="88" width="108" height="22" class="fg-acc"/>
            <text x="10" y="104" class="t-sm">Nursing home</text>
            <text x="225" y="104" class="t-sm">20-60%</text>
            <rect x="110" y="118" width="144" height="22" class="fg-bad"/>
            <text x="10" y="134" class="t-sm">Palliative</text>
            <text x="260" y="134" class="t-sm">≤80%</text>
            <rect x="110" y="148" width="157" height="22" class="fg-bad"/>
            <text x="10" y="164" class="t-sm t-b">ICU</text>
            <text x="272" y="164" class="t-sm t-b">70-87%</text>
            <rect x="10" y="186" width="310" height="36" rx="6" class="fg-thin"/>
            <text x="20" y="209" class="t-sm">Mortality: hospital 22-76%, 1-year 35-40%</text>
          </svg>
      - kind: sort
        page: 66
        quote: "Concurrent or sequential appearance of some features of both hyperactive and hypoactive delirium"
        prompt: "صنّف العلامة: hyperactive ولا hypoactive؟"
        bins: ["Hyperactive", "Hypoactive"]
        cards:
          - { text: "Agitation", bin: 0 }
          - { text: "Pulling out catheters", bin: 0 }
          - { text: "Hitting, biting", bin: 0 }
          - { text: "Emotional lability", bin: 0 }
          - { text: "Withdrawal", bin: 1 }
          - { text: "Flat affect", bin: 1 }
          - { text: "Lethargy", bin: 1 }
          - { text: "Decreased responsiveness", bin: 1 }
        why: "والـ **mixed** فيها الاتنين مع بعض أو ورا بعض."
      - kind: aside
        tone: trap
        page: 66
        quote: "Withdrawal Flat affect Apathy Lethargy Decreased responsiveness"
        text: "الفخ الكبير: الـ **hypoactive delirium**. المريض الهادي النعسان اللي «مش عامل مشاكل» ممكن يكون delirious (**lethargy**، **flat affect**، **withdrawal**)، والتمريض يقولك «تعبان بس». الهدوء مش دايمًا خبر حلو."
      - kind: figure
        page: 67
        quote: "Incident factors: Toxic Metabolic Brain lesion Delirium Predisposing factors: Age Dementia"
        title: "الأرضية والشرارة"
        alt: "Two arrows meeting at a box labelled delirium. From the left, predisposing factors: age and dementia. From the right, incident factors: toxic, metabolic, brain lesion."
        caption: "مخ ضعيف (سن، dementia) محتاج شرارة صغيرة. مخ قوي محتاج ضربة كبيرة. الـ delirium هو المجموع."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="D04b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="10" y="20" width="140" height="70" rx="8" class="fg-acc"/>
            <text x="20" y="40" class="t-sm t-b">Predisposing</text>
            <text x="20" y="60" class="t-sm">Age</text>
            <text x="20" y="78" class="t-sm">Dementia</text>
            <rect x="180" y="20" width="140" height="70" rx="8" class="fg-bad"/>
            <text x="190" y="40" class="t-sm t-b">Incident</text>
            <text x="190" y="60" class="t-sm">Toxic, metabolic</text>
            <text x="190" y="78" class="t-sm">Brain lesion</text>
            <path d="M80 92L150 140" class="fg-arrow-acc" marker-end="url(#D04b)"/>
            <path d="M250 92L180 140" class="fg-arrow-acc" marker-end="url(#D04b)"/>
            <rect x="105" y="145" width="120" height="40" rx="8" class="fg-ink"/>
            <text x="133" y="170" class="t-b">Delirium</text>
          </svg>
      - kind: explain
        page: 68
        quote: "Medications, the most common remediable cause of delirium, contribute to delirium in 40% of cases."
        title: "الأسباب"
        text: |
          - ==Medications==: **the most common remediable cause**، بتشارك في **40%**.
          - **Organ failure** (كلى وكبد بالذات).
          - **Hypoxaemia** و**hypercarbia**، **MI** أو **HF**.
          - **Occult infection**: سبب مهم جدًا.
          - **Metabolic**: Na، Ca، acid-base، glucose، thyroid، adrenal.
          - **Dehydration**، **drug/alcohol withdrawal**، **environment**.
      - kind: aside
        tone: exam
        page: 68
        quote: "Medications that May Cause Delirium"
        text: "جدول الأدوية في الكتاب: **anticholinergics**، **antihistamines** (H1 وH2 كمان، يعني حتى الـ cimetidine)، **benzodiazepines**، **opiates**، **corticosteroids**، **digitalis**، **NSAIDs**، **quinolones**، **beta-blockers**، antiarrhythmics، antiparkinson. أول سؤال قدام أي delirium: **إيه الدوا الجديد؟**"
      - kind: explain
        page: 69
        quote: "Use of physical restraints Malnutrition Use of a bladder catheter Any iatrogenic event Use of 3 or more medications"
        title: "الـ 5 independent risk factors"
        text: |
          دراسة حددت 5 ==independent risk factors==، وكلهم إحنا اللي بنعملهم في المستشفى:
          - **Physical restraints**.
          - **Malnutrition**.
          - **Bladder catheter**.
          - **Any iatrogenic event**.
          - **3 or more medications**.

          و**dementia** أقوى risk factor ثابت: موجودة في **25-50%** من مرضى الـ delirium.
      - kind: mnemonic
        page: 69
        quote: "Use of physical restraints Malnutrition Use of a bladder catheter Any iatrogenic event Use of 3 or more medications"
        word: "RMCI3"
        parts:
          - { key: "R", text: "Restraints (physical)" }
          - { key: "M", text: "Malnutrition" }
          - { key: "C", text: "Catheter (bladder)" }
          - { key: "I", text: "Iatrogenic event (any)" }
          - { key: "3", text: "3 or more medications" }
        hook: "**«رَمْكي 3»**: كل حرف حاجة احنا اللي عملناها للمريض. يعني الـ delirium ده كتير «صناعة مستشفى»."
      - kind: check
        page: 69
        quote: "Common Risk Factors for Delirium"
        question: "In the book's table, which is a PRECIPITATING (not predisposing) factor for delirium?"
        options: ["Urine retention or faecal impaction", "History of stroke", "Male sex", "Impaired hearing"]
        answer: 0
        why:
          - "صح: الـ urine retention والـ fecal impaction شرارة (precipitating)."
          - "الـ history of stroke أرضية (predisposing)."
          - "الـ male sex predisposing."
          - "الـ impaired hearing predisposing."
      - kind: try
        items: [geri.L04.051, geri.L04.055, geri.L04.061, geri.L04.062]
    recap:
      - "Delirium: acute disorder of attention والـ cognition؛ أشهر complication في المستشفى."
      - "ICU 70-87%، palliative لحد 80%؛ 1-year mortality 35-40%."
      - "Hyperactive (agitation، يشد الأنابيب) / hypoactive (هادي، lethargic) / mixed."
      - "Medications أشهر سبب يتعكس (40%)؛ occult infection مهم."
      - "RMCI3: restraints، malnutrition، catheter، iatrogenic، 3+ drugs؛ dementia في 25-50%."
    practice: [geri.L04.048, geri.L04.049, geri.L04.050, geri.L04.051, geri.L04.052, geri.L04.053, geri.L04.054, geri.L04.055, geri.L04.056, geri.L04.057, geri.L04.058, geri.L04.059, geri.L04.060, geri.L04.061, geri.L04.062, geri.L04.063, geri.L04.120, geri.L04.121, geri.L04.122]
