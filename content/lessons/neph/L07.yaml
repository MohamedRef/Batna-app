            <text x="80" y="24" text-anchor="middle" class="t-sm t-b">Vasopressin → V2R</text>
            <text x="80" y="40" text-anchor="middle" class="t-sm">(tolvaptan blocks)</text>
            <rect x="175" y="5" width="150" height="44" rx="8" class="fg-good"/>
            <text x="250" y="24" text-anchor="middle" class="t-sm t-b">Somatostatin → SSTR</text>
            <text x="250" y="40" text-anchor="middle" class="t-sm">(octreotide mimics)</text>
            <path d="M80 50 L150 82" class="fg-arrow-bad" marker-end="url(#L07b)"/>
            <path d="M250 50 L180 82" class="fg-arrow" marker-end="url(#L07a)"/>
            <text x="225" y="74" class="t-sm t-good">inhibits</text>
            <rect x="85" y="84" width="160" height="36" rx="8" class="fg-ink"/>
            <text x="165" y="107" text-anchor="middle" class="t-b">cAMP ↑ (Ca²⁺ low)</text>
            <path d="M165 120 L165 140" class="fg-arrow" marker-end="url(#L07a)"/>
            <rect x="115" y="142" width="100" height="32" rx="16" class="fg-acc"/>
            <text x="165" y="163" text-anchor="middle" class="t-b">PKA</text>
            <path d="M140 174 L80 204" class="fg-arrow" marker-end="url(#L07a)"/>
            <path d="M190 174 L250 204" class="fg-arrow" marker-end="url(#L07a)"/>
            <rect x="5" y="206" width="150" height="58" rx="8" class="fg-box"/>
            <text x="80" y="228" text-anchor="middle" class="t-sm t-b">CFTR Cl⁻ secretion</text>
            <text x="80" y="248" text-anchor="middle" class="t-sm">cyst fills with fluid</text>
            <rect x="175" y="206" width="150" height="58" rx="8" class="fg-box"/>
            <text x="250" y="228" text-anchor="middle" class="t-sm t-b">Src → MAPK → mTOR</text>
            <text x="250" y="248" text-anchor="middle" class="t-sm">cell proliferation</text>
            <rect x="60" y="274" width="210" height="30" rx="8" class="fg-bad"/>
            <text x="165" y="294" text-anchor="middle" class="t-b">Cyst grows</text>
