  - id: hb.L01.lesson6
    title: "العلاج: من طبق الأكل لغرفة الزرع"
    hook: "إيه اللي يعمله، إيه اللي يبعد عنه، وإمتى نفكر في كبد جديد."
    minutes: 10
    pages: [15, 19]
    topics: [treatment, specific-treatment, transplant, aclf]
    goals:
      - "تكتب الـ general measures بالأرقام"
      - "تربط كل سبب بعلاجه، وتعرّف الـ recompensation"
      - "تعرف إمتى تحوّل للزرع، وتفرق absolute من relative contraindications"
    status: unverified
    steps:
      - kind: explain
        page: 15
        title: "General measures"
        text: |
          - **Calories**: ==35–40 kcal/kg/day== حسب الـ BMI ووجود malnutrition.
          - **Protein**: ==1.2–1.5 g/kg/day==، وما يتقللش **إلا** في **acute episode of HE**، ومش أقل من **60–80 g/day**.
          - **Sodium restriction** لو فيه sodium و fluid retention. و **vitamin supplementation**.
          - **Abstinence from alcohol**، وابعد عن **sedatives** و **hepatotoxic drugs**.
          - ==Avoid PPIs==: بتعمل **dysbiosis** و ↑ risk of **infection** و **HE**.
          - **Infections** تتعالج بسرعة بالـ antibiotics، و **electrolytes** تتظبط.
          - **Vaccines**: **HAV**، **HBV**، **pneumococcal**، **influenza** كل سنة، و **COVID-19** لو متاح.
          - **Surgery**: لأ إلا لو الـ indication قوية والزرع مش قريب. وعمليات **upper abdominal** على الـ **biliary tract** أو الـ **peptic ulcer** prognosis وحش جدًا.
      - kind: aside
        tone: joke
        page: 15
        text: |
          الـ omeprazole في مصر بيتاخد زي فيتامين الصبح «علشان المعدة». في مريض الـ cirrhosis ده بالظبط اللي الكتاب بيقول **avoid**: dysbiosis، infection، و HE. 💊🚫
      - kind: update
        page: 15
        text: |
          الكتاب بيقول الـ protein يتقلل في الـ acute HE لحد 60–80 g/day. الجايدلاين الأحدث بتقول **ما تعملش protein restriction** في الـ HE. ولاحظ إن محاضرة 20 في نفس الكتاب ماشية مع الجايدلاين. في سؤال محاضرة 1 اكتب كلام محاضرة 1.
        ref: "EASL Clinical Practice Guidelines on nutrition in chronic liver disease, 2019"
      - kind: figure
        page: 15
        title: "العلاج على أربع أدوار"
        alt: "A four-step ladder for treating cirrhosis. Step 1, for everyone: general measures (diet 35-40 kcal/kg and protein 1.2-1.5 g/kg a day, sodium restriction, no alcohol, sedatives or PPIs, vaccines). Step 2: specific treatment of the cause, which can lead to recompensation. Step 3: prevent and treat complications (varices, ascites, HE, HRS, SBP, HCC screening). Step 4: liver transplantation after the first signs of decompensation; absolute contraindications are malignancy (except a relatively small HCC), advanced cardiopulmonary disease (except hepatopulmonary syndrome) and sepsis."
        caption: "كل مريض بيبدأ من الدور الأول، وكل ما الكبد يتعب بيطلع دور. أهم دورين بيغيّروا المسار: علاج ==السبب== (ممكن يرجّعه compensated)، والـ ==liver transplantation== اللي بيتفكّر فيه من أول علامة decompensation. خلي بالك من الاستثناءين في الـ contraindications (ص18): small HCC والـ HPS مش بيمنعوا الزرع."
        svg: |
          <svg viewBox="0 0 330 398" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L01t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="10" y="314" width="290" height="74" rx="10" class="fg-good"/>
            <text x="22" y="336" class="t-b t-good">1 · General measures: everyone</text>
            <text x="22" y="356" class="t-sm">35–40 kcal/kg · protein 1.2–1.5 g/kg · less Na⁺</text>
            <text x="22" y="374" class="t-sm">No alcohol, sedatives, PPIs · vaccines · treat infection</text>
            <rect x="10" y="224" width="290" height="74" rx="10" class="fg-acc"/>
            <text x="22" y="246" class="t-b t-acc">2 · Treat the cause</text>
            <text x="22" y="266" class="t-sm">Antivirals (HBV, HCV) · steroids (AIH) · UDCA (PBC)</text>
            <text x="22" y="284" class="t-sm">Chelation (Wilson) · venesection · lifestyle (MASH)</text>
            <rect x="10" y="134" width="290" height="74" rx="10" class="fg-box"/>
            <text x="22" y="156" class="t-b">3 · Prevent and treat complications</text>
            <text x="22" y="176" class="t-sm">Varices: NSBB (carvedilol) + endoscopy</text>
            <text x="22" y="194" class="t-sm">Ascites · HE · HRS · SBP · HCC screening</text>
            <rect x="10" y="26" width="290" height="92" rx="10" class="fg-bad"/>
            <text x="22" y="48" class="t-b t-bad">4 · Liver transplantation</text>
            <text x="22" y="68" class="t-sm">Refer at the first sign of decompensation</text>
            <text x="22" y="86" class="t-sm">Absolute CI: malignancy (except small HCC),</text>
            <text x="22" y="104" class="t-sm">advanced cardiopulmonary (except HPS), sepsis</text>
            <path d="M318 378V40" class="fg-arrow-acc" marker-end="url(#L01t)"/>
            <text x="326" y="16" text-anchor="end" class="t-sm t-mut">sicker</text>
          </svg>
      - kind: sort
        page: 15
        prompt: "يعمل ولا يبعد؟"
        bins: ["Do", "Avoid"]
        cards:
          - { text: "Hepatitis A and B vaccines", bin: 0 }
          - { text: "Yearly influenza vaccine", bin: 0 }
          - { text: "Protein 1.2–1.5 g/kg/day", bin: 0 }
          - { text: "Prompt antibiotics for infection", bin: 0 }
          - { text: "Long-term PPIs", bin: 1 }
          - { text: "Sedatives", bin: 1 }
          - { text: "Elective biliary surgery", bin: 1 }
          - { text: "Alcohol", bin: 1 }
      - kind: explain
        page: 16
        title: "علاج المضاعفات"
        text: |
          **Compensated**: الهدف **prevention of variceal bleeding and decompensation** و **early detection of HCC**.
          - Variceal bleeding: **endoscopic therapy + NSBBs**. والـ **carvedilol** مفضّل على propranolol و nadolol.
          - الـ NSBBs كمان ممكن تمنع الـ decompensation في الـ compensated لو فيه indication.

          **Decompensated**: علاج المضاعفات (ascites، HE، HRS، SBP) ومنع الـ further decompensation.
          - نزيف الـ varices: **endoscopic therapy**.
          - **Correction of coagulopathy** بس **بعد فشل** الـ PH-lowering agents والـ local hemostasis.
          - عالج الـ **precipitating factors**: ممكن ترجّعه compensated.
          - **Thrombocytopenia** قبل invasive procedure و platelets **< 50,000**: platelet transfusion أو **TPO receptor agonists** (avatrombopag، lusutrombopag).
      - kind: aside
        tone: trap
        page: 16
        text: |
          في النزيف، أول رد فعل عند ناس كتير «اديله plasma علشان الـ INR». الكتاب بيقول: الـ coagulopathy تتصلح **بعد** ما الـ PH-lowering agents والـ local hemostasis يفشلوا، مش قبلهم.
      - kind: match
        page: 17
        prompt: "كل سبب وعلاجه الـ specific:"
        pairs:
          - ["Hepatitis C", "Antivirals to eliminate the virus"]
          - ["Hepatitis B", "Antivirals to suppress the virus"]
          - ["Autoimmune liver disease", "Steroids and immunosuppressives"]
          - ["PBC", "Ursodeoxycholic acid, early and long term"]
          - ["Wilson disease", "Chelation"]
          - ["Hemochromatosis", "Venesection and iron chelators"]
        why: "وكمان: alcohol = **long-term abstinence**، و MASH = lifestyle (weight loss، diet، exercise)، statins، antidiabetics، antioxidants، و bariatric surgery."
      - kind: explain
        page: 17
        title: "Recompensation: التليف ممكن يرجع لورا؟"
        text: |
          **Recompensation** = **at least partial regression** للتغيرات الـ structural والـ functional بعد ما السبب يتشال. المعايير التلاتة:

          - **a.** السبب اتشال أو اتكبت: **viral elimination** في HCV، **sustained viral suppression** في HBV، **sustained abstinence** في الـ alcohol.
          - **b.** الـ decompensating events اختفت: ascites **off diuretics**، encephalopathy **off lactulose/rifaximin**، و **no recurrent variceal hemorrhage for ≥ 12 months**.
          - **c.** تحسن مستمر في الـ **albumin، INR، bilirubin**.
      - kind: check
        page: 17
        question: "HCV cured, no bleeding for 18 months, albumin/INR/bilirubin improved. Which detail stops you calling it **recompensation**?"
        options:
          - "He still needs spironolactone to keep the ascites away"
          - "His HCV RNA is undetectable"
          - "His albumin rose from 2.9 to 3.6 g/dL"
          - "He has had no hepatic encephalopathy"
        answer: 0
        why:
          - "صح: الـ ascites لازم تختفي **off diuretics**."
          - "ده المعيار (a) نفسه."
          - "ده المعيار (c)."
          - "ده كويس، ومش ضد الـ recompensation."
      - kind: explain
        page: 18
        title: "الزرع"
        text: |
          - **Refer for LT** بعد **first signs of hepatic decompensation**.
          - مريض الـ alcohol: **abstinent 6 months** قبل الزرع.
          - **HCV**: الـ DAAs تتأجل لبعد الزرع لو **MELD ≥ 21**.
          - **HBV** مستني زرع: **oral nucleos(t)ide analogs** بـ **high barrier to resistance**.
          - ممكن يرجع في الكبد الجديد: **HCC، HBV، HCV، Budd-Chiari، autoimmune**.
          - Immunosuppression: cyclosporine، tacrolimus، sirolimus، steroids، azathioprine، MMF.
          - أكبر مشكلة: **organ shortage**. الحلول: **adult living donor LT** و **extended-criteria donors**.
      - kind: sort
        page: 18
        prompt: "Contraindications للزرع: absolute ولا relative؟"
        bins: ["Absolute", "Relative"]
        cards:
          - { text: "Malignancy (except small HCC in a cirrhotic liver)", bin: 0 }
          - { text: "Advanced cardiopulmonary disease (except HPS)", bin: 0 }
          - { text: "Sepsis", bin: 0 }
          - { text: "Age over 70", bin: 1 }
          - { text: "Morbid obesity", bin: 1 }
          - { text: "Portal and mesenteric vein thrombosis", bin: 1 }
          - { text: "Active alcohol or drug abuse", bin: 1 }
          - { text: "Severe malnutrition", bin: 1 }
          - { text: "Lack of patient understanding", bin: 1 }
        why: "الـ absolute تلاتة بس: **malignancy، advanced cardiopulmonary disease، sepsis**، واتنين منهم ليهم استثناء (small HCC، HPS)، والـ sepsis مالهاش."
      - kind: explain
        page: 19
        title: "ACLF: العلاج"
        text: |
          - المكان: **ICU**.
          - الأساس: **early recognition**، علاج الـ **precipitating factors** والمضاعفات، و **organ support**.
          - **HBV reactivation**: **tenofovir** أو **entecavir** **as early as possible**.
          - **LT early** في مرضى مختارين **ACLF grade 2 و 3**، لأنها rapidly evolving والزرع بيحسّن الـ survival.
          - LT **contraindicated** لو **organ failures ≥ 4** أو **CLIF-C ACLF > 64**.
      - kind: aside
        tone: exam
        text: |
          أرقام الدرس في سطر: **35–40 kcal**، **1.2–1.5 g protein**، **≥ 60–80 g** في الـ HE، **platelets < 50,000**، **12 months** من غير نزيف، **6 months** abstinence، **MELD ≥ 21**، **OF ≥ 4**، **CLIF-C > 64**.
      - kind: try
        items: [hb.L01.063, hb.L01.072, hb.L01.077]
