  # ---------- p234: definition and epidemiology ----------
  - id: git.L08.001
    kind: card
    topic: celiac-epi
    front: Define celiac disease.
    back: A permanent dietary disorder caused by an immunologic response to gluten that damages the proximal small intestinal mucosa diffusely, with malabsorption of nutrients.
    src: { page: 234, quote: "permanent dietary disorder caused by an immunologic response to gluten, a storage protein found in certain grains, that results in diffuse damage" }
    status: unverified
    tags: [high-yield]
  - id: git.L08.002
    kind: card
    topic: celiac-epi
    front: Other names for celiac disease?
    back: Sprue, celiac sprue, and gluten enteropathy.
    src: { page: 234, quote: "Celiac disease (also called sprue, celiac sprue, and gluten enteropathy)" }
    status: unverified
  - id: git.L08.003
    kind: card
    topic: celiac-epi
    front: What is the most common genetically related food intolerance worldwide?
    back: Celiac disease.
    src: { page: 234, quote: "celiac disease is the most common genetically related food intolerance worldwide" }
    status: unverified
  - id: git.L08.004
    kind: cloze
    topic: celiac-epi
    text: "Celiac disease has a bimodal age distribution: the first peak at {{c1::8–12 months}} and the second in the {{c2::3rd–4th}} decade; the prevalence in Egypt is {{c3::0.53%}}."
    src: { page: 234, quote: "Bimodal age distribution; First 8-12 months and the Second 3rd – 4th Decade with a mean age 8.4 years." }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L08.005
    kind: card
    topic: celiac-epi
    front: Sex distribution of celiac disease?
    back: Slightly more common in females.
    src: { page: 234, quote: "It is Slightly more in females" }
    status: unverified
  - id: git.L08.006
    kind: enumerate
    topic: celiac-epi
    prompt: Mention the high-risk groups for celiac disease.
    points:
      - Type 1 diabetes (5–10% of children)
