  - id: endo.L07.lesson5
    title: "الـ adrenal crisis: shock مش راضي يستجيب"
    hook: "مريض في shock والـ fluids والـ pressors مش نافعين؟ اسأل نفسك: فين الـ cortisol؟"
    minutes: 9
    pages: [128, 132]
    topics: [adrenal]
    goals:
      - "تعرف الأسباب وإمتى تشك"
      - "تقرا الـ SST والـ long ACTH test"
      - "تعالج فورًا وتعلّم المريض الـ sick-day rules"
    status: unverified
    steps:
      - kind: explain
        page: 128
        quote: "patients on steroid replacement with intercurrent infection or acute stress with failure to increase the steroid dose."
        title: "مين بيعمل crisis؟"
        text: |
          - **Addison's** مش متشخّص، أو مريض على replacement جاله infection أو stress ==ومزوّدش الجرعة==.
          - مريض **وقّف الـ steroids فجأة**.
          - نادر: bilateral adrenal infarction أو haemorrhage.

          **Primary**: autoimmune، **TB**، metastases، أدوية زي الـ antifungals.

          **Secondary** يعني pituitary: glucocorticoid بس، والـ mineralocorticoid سليم، فالـ crisis نادرة، وممكن تيجي بـ **hypoglycaemia**.
      - kind: explain
        page: 129
        quote: "particularly if there is coexisting unexplained severe hypo- glycemia or hyponatremia."
        title: "إمتى تشك؟"
        text: |
          ==Shock== مع حاجات مش محددة: anorexia، nausea، vomiting، **abdominal pain**، fever، lethargy.

          فكّر فيها في **أي** مريض في shock حتى من غير تاريخ adrenal، خصوصًا لو فيه **severe hypoglycaemia** أو **hyponatraemia** مش مفهومين.
      - kind: table
        page: 130
        quote: "Intravenous glucocorticoid (100 mg hydrocortisone six hourly) should be initiated immediately and not delayed, pending the short synacthen test."
        title: "العلاج الفوري"
        columns: ["Step", "Detail"]
        rows:
          - ["Fluids", "2-3 l 0.9% saline IV"]
          - ["Bloods", "Cortisol + ACTH, on ice, lab in 30 min"]
          - ["Steroid", "Hydrocortisone 100 mg IV 6-hourly now"]
          - ["Fludrocortisone", "Not needed acutely"]
          - ["Then", "Find and treat the precipitant"]
        hide: [[0, 1], [2, 1], [3, 1]]
      - kind: reveal
        page: 130
        quote: "replacement in acute adrenal crisis is not required as sodium and volume replacement with 0.9% saline is sufficient."
        prompt: "الـ hypotension أساسًا من نقص الـ mineralocorticoid. طب ليه منديش fludrocortisone في الـ crisis؟"
        answer: "عشان الـ **0.9% saline** بيعوّض الـ sodium والـ volume، وده كفاية. وكمان الـ **hydrocortisone** بجرعة 100 mg ليه تأثير mineralocorticoid. الـ fludrocortisone للـ maintenance بعدين."
      - kind: figure
        page: 130
        quote: "but in primary hypoadrenalism there is no response at either time."
        title: "الـ ACTH tests"
        alt: "Two charts. Top: short synacthen test, cortisol at 0 and 30 minutes, with a dashed line at 550 nmol per litre; a normal response crosses it, a failed one does not. Bottom: long ACTH test over 48 hours; normal rises above 1000 at 4 hours then flat; secondary rises slowly and is much higher at 24 and 48 hours; primary stays flat."
        caption: "الـ long test بيفرّق: الـ secondary غدة كسلانة بتصحى ببطء، والـ primary غدة مش موجودة."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="18" class="t-b">Short test (0 and 30 min)</text>
            <path d="M40 130H310M40 130V30" class="fg-ink"/>
            <path d="M40 70H310" class="fg-thin"/>
            <text x="230" y="64" class="t-sm t-mut">550 nmol/l</text>
            <path d="M60 110L200 45" class="fg-arrow-acc" stroke-width="3"/>
            <text x="205" y="44" class="t-sm t-good t-b">normal</text>
            <path d="M60 115L200 100" class="fg-arrow-bad" stroke-width="3"/>
            <text x="205" y="104" class="t-sm t-bad t-b">fails</text>
            <text x="10" y="170" class="t-b">Long test (24-48 h)</text>
            <path d="M40 310H310M40 310V180" class="fg-ink"/>
            <path d="M40 300L80 200L310 200" class="fg-arrow-acc" stroke-width="3"/>
            <text x="230" y="194" class="t-sm t-good t-b">normal</text>
            <path d="M40 300L80 285L180 240L310 215" class="fg-arrow" stroke-width="3"/>
            <text x="200" y="250" class="t-sm t-b">secondary</text>
            <path d="M40 300L310 298" class="fg-arrow-bad" stroke-width="3"/>
            <text x="230" y="292" class="t-sm t-bad t-b">primary</text>
            <text x="74" y="326" class="t-sm t-mut">4 h</text>
            <text x="280" y="326" class="t-sm t-mut">48 h</text>
          </svg>
      - kind: explain
        page: 129
        quote: "a basal cortisol value greater than 400 nmol/l (14.5 mg/dl) invariably indicates an intact HPA axis."
        title: "الأرقام"
        text: |
          - **Basal cortisol** ممكن يطلع low-normal، فميستبعدش. بس لو ==أكتر من 400 nmol/l== يبقى الـ HPA axis سليم.
          - **SST**: 250 µg tetracosactide، cortisol عند 0 و 30 دقيقة؛ الطبيعي peak ==أكتر من 550 nmol/l==.
          - **Long test**: الطبيعي أكتر من 1000 nmol/l عند 4 ساعات.
          - **Primary**: الـ ACTH عالي جدًا بالنسبة للـ cortisol.
      - kind: update
        page: 130
        quote: "a normal response is defined by a peak plasma cortisol of greater than 550 nmol/l (>20 mg/dl)."
        text: "الكتاب كاتب الوحدات mg/dl و 250 mg، والصح µg/dl و 250 µg. وكتير من المعامل الحديثة بتستخدم cut-off أقل، حوالي 400-450 nmol/l، مع الـ assays الجديدة. في الامتحان: 550 زي الكتاب."
        ref: "Endocrine Society primary adrenal insufficiency guideline, 2016"
      - kind: check
        page: 130
        quote: "Intravenous glucocorticoid (100 mg hydrocortisone six hourly) should be initiated immediately and not delayed, pending the short synacthen test."
        question: "A shocked patient with suspected adrenal crisis. What is right?"
        options: ["Take cortisol and ACTH, give hydrocortisone now, SST later", "Do the SST first, then treat", "Wait for the cortisol result", "Give fludrocortisone alone"]
        answer: 0
        why:
          - "صح: اسحب الدم، وادّي الـ hydrocortisone فورًا، والـ SST لما يستقر."
          - "متأخرش العلاج عشان التحليل."
          - "نفس الغلطة."
          - "مش محتاجه في الحاد، ومش كفاية لوحده."
      - kind: mnemonic
        page: 131
        quote: "In minor illnesses such as upper respiratory tract infection, patients need to double the usual steroid dosage until they are well"
        word: "CDIE"
        hook: "نصايح المريض: \"Card, Double, IV, Emergency shot\"."
        parts:
          - { key: "C", text: "Steroid Card or medic-alert bracelet" }
          - { key: "D", text: "Double the dose in minor illness, then taper" }
          - { key: "I", text: "Can't take oral: admission for IV steroid" }
          - { key: "E", text: "Emergency IM hydrocortisone for self-injection" }
      - kind: explain
        page: 131
        quote: "hydrocortisone 10 mg twice a day (taken first thing in the morning and at 17:00)"
        title: "الـ maintenance والمتابعة"
        text: |
          - **Hydrocortisone** 10 mg الصبح و 10 mg الساعة 5، أو 10 + 5 + 5.
          - **Fludrocortisone** 50-200 µg/day حسب الأعراض والـ postural BP.
          - الـ glucocorticoid كفاية لو: well-being، وزن طبيعي مش زيادة، cortisol طبيعي مع hydrocortisone بس.
          - الـ fludrocortisone كفاية لو: electrolytes طبيعية، الـ systolic ميقعش أكتر من **10 mmHg** بعد دقيقتين وقوف، و renin طبيعي.
          - **العمليات**: 100 mg IV عند الـ induction، وبعدين 50 mg tds.
      - kind: try
        items: [endo.L07.065, endo.L07.068, endo.L07.071, endo.L07.074, endo.L07.078]
    recap:
      - "السبب الأشهر: Addison's مش متشخص أو مريض مزوّدش الجرعة في stress، أو وقّف فجأة."
      - "Shock + hypoglycaemia أو hyponatraemia مش مفهومين = فكّر adrenal."
      - "Saline 2-3 l + hydrocortisone 100 mg IV كل 6 ساعات فورًا؛ مفيش fludrocortisone في الحاد."
      - "Basal > 400 = سليم؛ SST peak > 550؛ long test بيفرّق primary من secondary."
      - "Sick-day: card، double، IV لو مش قادر، IM shot؛ surgery 100 ثم 50 tds."
    practice: [endo.L07.065, endo.L07.066, endo.L07.067, endo.L07.068, endo.L07.069, endo.L07.070, endo.L07.071, endo.L07.072, endo.L07.073, endo.L07.074, endo.L07.075, endo.L07.076, endo.L07.077, endo.L07.078, endo.L07.079, endo.L07.080, endo.L07.081, endo.L07.082, endo.L07.104]
