      - kind: reveal
        page: 165
        quote: "Women with T1 or T2DM should be prescribed low-dose aspirin 60–150\n   mg/day (usual dose 81 mg/day) from the end of the 1st trimester until the baby\n   is born to lower the risk of preeclampsia."
        prompt: "ليه الأسبرين للست السكرية، وليه يبدأ من آخر الـ 1st trimester؟"
        answer: |
          الكتاب: **low-dose aspirin 60–150 mg/day** (المعتاد ==81==) لكل T1 أو T2DM، من آخر الـ 1st trimester للولادة، عشان يقلل الـ **preeclampsia**.

          التفسير المقبول (مش في الكتاب): السكر بيأذي الأوعية، والـ preeclampsia أصلها مشيمة أوعيتها ما اتكوّنتش كويس. الأسبرين بجرعة صغيرة بيقلل الـ **thromboxane** فالأوعية الصغيرة في المشيمة تفضل مفتوحة. وبيبدأ بعد الـ 1st trimester لأن ده وقت ما المشيمة بتكمّل تكوين أوعيتها، وقبل ما الـ preeclampsia تظهر.
