  - id: hem.L09.lesson2
    title: "مضاعفات الـ ET: تجلط، نزيف، وطحال بيتغير"
    hook: "الـ ET بتجلّط وبتنزّف في نفس الوقت، والطحال لو بدأ يكبر بيقولك إن المرض بيتحول."
    minutes: 9
    pages: [136, 138]
    topics: [et-complications]
    goals:
      - "تعرف مضاعفات الـ ET وعوامل خطر التجلط، وكل عامل بيجلّط ليه"
      - "تفهم ليه الصفائح فوق 1000 بتنزّف"
      - "تعرف الـ ET بتتحول لإيه، وبكام في المية، وإيه دور الأدوية"
    status: unverified
    steps:
      - kind: explain
        page: 136
        title: "التجلط: العدو رقم 1"
        quote: "Thrombotic complications: The main cause of morbidity and mortality in ET. Thromboses are present in around 15–20% of patients at presentation and may be arterial or venous. The range of clinical syndromes is similar to PV, but the frequency of splanchnic thromboses is probably lower and strongly correlated with presence of the JAK2 V617F mutation."
        text: |
          ==Thrombosis== هو **the main cause of morbidity and mortality in essential thrombocythaemia (ET)**.

          - موجود في **15–20%** وقت التشخيص، **arterial أو venous**.
          - نفس أشكال الجلطات اللي في الـ polycythaemia vera (PV)، بس الـ **splanchnic thrombosis** (portal، hepatic، mesenteric) أقل غالبًا، ومرتبط جامد بـ **Janus kinase 2 (JAK2) V617F**.

          يعني لو شفت **Budd-Chiari** أو portal vein thrombosis في واحد صفايحه عالية، فكّر في MPN واطلب الـ JAK2. ده كمان سبب إن العلاج كله في الـ ET هدفه **منع الجلطة**، مش تجميل رقم الصفائح.
      - kind: explain
        page: 136
        title: "عوامل الخطر: كل واحد بيجلّط ليه؟"
        quote: "Several risk factors are associated with increase in the risk of thrombosis in patients with ET.\n  Age over 60 years\n  Prior history of thrombosis.\n  Cardiovascular risk factors including diabetes, hyperlipidemia, hypertension and cigarette smoking.\n  White cell count at diagnosis"
        text: |
          الكتاب بيعدّ عوامل الخطر. التفسير المقبول (مش في الكتاب) لكل واحد:
          - **Age over 60**: الأوعية نفسها عجّزت؛ الـ endothelium أقل قدرة يمنع التجلط.
          - **Prior thrombosis**: أحسن دليل إن الشخص ده بالذات **بيجلّط**. اللي جلّط مرة غالبًا يجلّط تاني.
          - **Cardiovascular risk factors** (diabetes، hyperlipidemia، hypertension، smoking): بيعوّروا الـ endothelium، فالصفائح الكتير تلاقي مكان تمسك فيه.
          - **White cell count at diagnosis**: كرات بيضا كتير ومتنشّطة بتلزق في الصفائح وفي جدار الوعاء وبتساعد الجلطة تبدأ.
          - **Reticulin at diagnosis** (أول ص 137): علامة إن المرض متقدّم أكتر.

          خد بالك: **عدد الصفائح نفسه مش في القايمة**. وده هيرجع في التقسيم: الـ 1500 داخلة كـ high-risk feature، مش الـ 450.
      - kind: mnemonic
        page: 136
        quote: "Several risk factors are associated with increase in the risk of thrombosis in patients with ET.\n  Age over 60 years\n  Prior history of thrombosis.\n  Cardiovascular risk factors including diabetes, hyperlipidemia, hypertension and cigarette smoking.\n  White cell count at diagnosis"
        word: "CRAWP"
        parts:
          - { key: "C", text: "Cardiovascular risk factors: diabetes, hyperlipidemia, hypertension, smoking" }
          - { key: "R", text: "Reticulin level at diagnosis" }
          - { key: "A", text: "Age over 60 years" }
          - { key: "W", text: "White cell count at diagnosis" }
          - { key: "P", text: "Prior history of thrombosis" }
        hook: "الجلطة بتـ **crawl** (تزحف) في الأوعية: **CRAWP** = خمس عوامل خطر للتجلط في الـ ET."
      - kind: explain
        page: 137
        title: "والنزيف؟ لما الصفائح تعدّي 1000"
        quote: "Bleeding is more common in patients with platelet counts above 1000 X10⁹/L and, in at least some cases, this is due to an acquired von Willebrand disease, with a decrease in circulating high-molecular-weight multimers caused by adsorption to the surface of the excessive platelets."
        text: |
          الـ bleeding بيزيد مع **platelets >1000 × 10⁹/L**، وجزء منه سببه ==acquired von Willebrand disease==: الـ **high-molecular-weight multimers** بتقل في الدم لأنها بتلزق (adsorption) على سطح الصفائح الزيادة.

          النتيجة العملية: كل ما الصفائح تزيد قوي، النزيف يبقى أقرب من التجلط. فـ **aspirin** على صفائح فوق 1000 = تزوّد نزيف فوق نزيف، وده سبب إنه contraindication في الـ low risk.
      - kind: reveal
        page: 137
        quote: "Bleeding is more common in patients with platelet counts above 1000 X10⁹/L and, in at least some cases, this is due to an acquired von Willebrand disease, with a decrease in circulating high-molecular-weight multimers caused by adsorption to the surface of the excessive platelets."
        prompt: "إزاي صفائح أكتر تعمل نزيف أكتر؟ مش المفروض العكس؟"
        answer: |
          الـ **high-molecular-weight vWF multimers** (أهم جزء في الـ vWF) بتلزق على **سطح الصفائح الكتير** وتختفي من الدم.

          فيبقى عندك صفائح كتير بس **مفيش vWF كفاية** يلزّقها في جدار الوعاء. النتيجة: **acquired vWD**.
      - kind: aside
        tone: joke
        page: 137
        quote: "Bleeding is more common in patients with platelet counts above 1000 X10⁹/L and, in at least some cases, this is due to an acquired von Willebrand disease, with a decrease in circulating high-molecular-weight multimers caused by adsorption to the surface of the excessive platelets."
        text: "الـ von Willebrand factor (vWF) في الـ ET زي الموظف الوحيد في شباك فيه 1000 platelet واقفين طابور: كله ماسك فيه، ومحدش بيخلّص حاجة."
      - kind: explain
