            <text x="165" y="168" text-anchor="middle" class="t-sm">ROS, cytokines</text>
            <text x="165" y="184" text-anchor="middle" class="t-sm">proteases</text>
            <text x="165" y="200" text-anchor="middle" class="t-sm t-b">danger signal</text>
            <rect x="225" y="150" width="100" height="58" rx="6" class="fg-box"/>
            <text x="275" y="168" text-anchor="middle" class="t-sm">Re-exposure:</text>
            <text x="275" y="184" text-anchor="middle" class="t-sm">antibodies,</text>
            <text x="275" y="200" text-anchor="middle" class="t-sm">cytotoxic T cells</text>
            <path d="M55 208L140 252M165 208v40M275 208L190 252" class="fg-arrow" marker-end="url(#L08a)"/>
            <rect x="95" y="254" width="140" height="36" rx="8" class="fg-bad"/>
            <text x="165" y="277" text-anchor="middle" class="t-b">Liver injury</text>
            <path d="M130 290L80 334" class="fg-arrow" marker-end="url(#L08a)"/>
            <path d="M200 290L250 334" class="fg-arrow-bad" marker-end="url(#L08b)"/>
            <rect x="5" y="336" width="150" height="50" rx="8" class="fg-good"/>
            <text x="80" y="356" text-anchor="middle" class="t-sm t-b">Adaptation, recovery</text>
            <text x="80" y="374" text-anchor="middle" class="t-sm">Normal liver</text>
            <rect x="175" y="336" width="150" height="50" rx="8" class="fg-bad"/>
            <text x="250" y="366" text-anchor="middle" class="t-b t-bad">Liver failure</text>
          </svg>
      - kind: table
        page: 126
        title: "Predictable ولا unpredictable؟"
        columns: ["", "Predictable", "Unpredictable"]
        rows:
          - ["Dose", "Dose related", "Not dose related"]
          - ["Drug", "Intrinsically hepatotoxic", "Idiosyncratic"]
          - ["Onset", "Acute (hours)", "Weeks to months"]
          - ["How common", "With the dose", "Rare: 0.01–1.0%"]
          - ["Picture", "Necrosis; fulminant acute hepatitis", "Immune or metabolic idiosyncrasy"]
          - ["Example", "Acetaminophen", "Phenytoin; INH"]
        hide: [[0, 1], [0, 2], [2, 1], [2, 2], [3, 2], [5, 1]]
      - kind: aside
        tone: joke
        page: 126
        text: |
          الـ **acetaminophen** زي الشطة: معلقة صغيرة تحلّي الأكل، إزازة كاملة تولّع الدنيا. ده معنى **predictable = dose related**. 🌶️

          أما الـ idiosyncratic فزي الحساسية من الفراولة: مش بالكمية، بالحظ.
      - kind: mnemonic
        page: 127
        word: "FARE"
        parts:
          - { key: "F", text: "Fever" }
          - { key: "A", text: "Arthralgia" }
          - { key: "R", text: "Rash" }
          - { key: "E", text: "Eosinophilia" }
        hook: |
          الـ immune idiosyncrasy (hypersensitivity) بيدفّعك **FARE**: تمن التذكرة = حمى، مفاصل، طفح، و eosinophils.
      - kind: sort
        page: 127
        prompt: "حط كل دوا في النوع اللي الكتاب حاطه فيه:"
        bins: ["Immune idiosyncrasy", "Metabolic idiosyncrasy", "Predictable (dose)"]
        cards:
          - { text: "Phenytoin", bin: 0 }
          - { text: "Sulfonamides", bin: 0 }
          - { text: "Valproate", bin: 0 }
          - { text: "INH", bin: 1 }
          - { text: "Ketoconazole", bin: 1 }
          - { text: "Diclofenac", bin: 1 }
          - { text: "Acetaminophen", bin: 2 }
        why: "Immune (hypersensitivity): **phenytoin، sulfonamides، valproate**. Metabolic (toxic metabolites): **INH، ketoconazole، diclofenac**. Predictable: **acetaminophen**."
      - kind: explain
        page: 128
        title: "كل خلية وإصابتها"
        text: |
          رسمة الـ cells في صفحة 128:

          - **Hepatocyte**: acute و chronic hepatitis، cholestasis، cirrhosis، steatosis، phospholipidosis، steatohepatitis، granulomatous hepatitis.
          - **Cholangiocyte**: acute و chronic cholangitis، sclerosing cholangitis.
          - **Endothelial cell**: veno-occlusive disease، sinusoidal dilation، peliosis hepatis، Budd-Chiari.
          - **Ito (stellate) cell**: perisinusoidal fibrosis.

          و **histologically** 3 أنواع: **hepatocellular** (hepatocytes)، **cholestatic** (bile ducts or canaliculi)، و **mixed**.
      - kind: match
        page: 128
        prompt: "وصّل الخلية بالإصابة:"
        pairs:
          - ["Cholangiocyte", "Sclerosing cholangitis"]
          - ["Endothelial cell", "Veno-occlusive disease"]
          - ["Ito (stellate) cell", "Perisinusoidal fibrosis"]
          - ["Hepatocyte", "Steatohepatitis"]
        why: "الـ cholangiocyte = القنوات، الـ endothelium = الأوعية (VOD، peliosis)، الـ stellate = الـ fibrosis (افتكر L01)، والـ hepatocyte = الباقي."
      - kind: explain
        page: 128
        title: "خريطة المحاضرة: 10 أنواع reactions"
        text: |
          الكتاب بيقسّم حسب **type of reaction** لعشرة، وهي خريطة باقي الدروس:

          - **Direct toxic**، **idiosyncratic**، **combined toxic/allergic**، **allergic hepatitis**.
          - **Cholestatic**، **granulomatous**، **chronic hepatitis and cirrhosis**، **fatty liver / NASH**.
          - **Veno-occlusive disease**، **neoplastic**.
      - kind: try
        items: [hb.L08.004, hb.L08.008, hb.L08.010, hb.L08.014, hb.L08.016]
    recap:
      - "أهم خطوة: **identify and stop** الدوا بسرعة. العلاج = withdrawal + supportive."
      - "WHO: **< 2.5×** و **2.5–5×** mild، **5–10×** moderate، **> 10×** (ALT > 500) severe."
      - "DILI = **25–40%** من الـ fulminant hepatic failure."
      - "Predictable: dose related، hours، necrosis (acetaminophen). Idiosyncratic: rare **0.01–1%**، weeks–months."
      - "Immune: phenytoin، sulfonamides، valproate (+ **FARE**). Metabolic: INH، ketoconazole، diclofenac."
      - "Histology: hepatocellular، cholestatic، mixed."
    practice: [hb.L08.001, hb.L08.002, hb.L08.003, hb.L08.004, hb.L08.005, hb.L08.006, hb.L08.007, hb.L08.008, hb.L08.009, hb.L08.010, hb.L08.011, hb.L08.012, hb.L08.013, hb.L08.014, hb.L08.015, hb.L08.016, hb.L08.077, hb.L08.094]

  # ------------------------------------------------------------------
  - id: hb.L08.lesson2
    title: "إزاي تمسك الدوا متلبّس"
    hook: "رقم واحد اسمه R بيقولك تدوّر فين. وأسبوعين بعد وقف الدوا بيقولولك إذا كنت صح."
    minutes: 9
    pages: [129, 130]
    topics: [diagnosis]
    goals:
      - "تحسب الـ R value وتعرف كل band بيودّي على أنهي workup"
      - "تعرف عناصر الـ drug history والأمراض اللي لازم تستبعدها"
      - "تحكم على الـ dechallenge بالأرقام"
    status: unverified
    steps:
      - kind: explain
        page: 129
        title: "التشخيص = شك + استبعاد"
        text: |
          الكتاب:

          - **High index of suspicion**، و enzymes متلخبطة، و **hepatitis-like symptoms**، و **jaundice**.
          - **Drug history**: **dose**، **duration of therapy**، و **latency** (الوقت من بداية الدوا لحد الإصابة). والـ workflow بيسأل عن الأدوية والـ supplements في آخر **6 months**.
          - **Exclusion of other causes**: **hepatitis B**، **hepatitis C**، **alcoholic liver disease**، **NAFLD**، و **hemochromatosis**.
      - kind: reveal
        page: 129
        prompt: "ليه الاستبعاد ده مهم أوي، مش كفاية إن العيان بياخد دوا؟"
        answer: |
          الكتاب كاتب جنب القايمة دي إنها مع بعض **2–5% of general population**.

          يعني عيان من كل 20–50 ممكن يكون عنده مرض كبد أصلًا، فلو لقيت ALT عالي على دوا، ممكن يكون الدوا بريء خالص. DILI تشخيص **بالاستبعاد**.
      - kind: explain
        page: 129
        title: "الـ R value"
        text: |
          **R = (ALT ÷ ALT ULN) ÷ (ALP ÷ ALP ULN)**

          - **R > 5** → **hepatocellular**.
          - **R 2–5** → **mixed**.
          - **R < 2** → **cholestatic**.

          المنطق: بنقارن "قد إيه الـ hepatocytes بتنزف ALT" بـ "قد إيه القنوات بتطلّع ALP"، كل واحد منسوب لـ ULN بتاعه.
      - kind: figure
        page: 129
        title: "الـ R بيوديك فين؟"
        alt: "A horizontal R scale from 0 to 8 with bands: below 2 cholestatic, 2 to 5 mixed, above 5 hepatocellular. Below it two work-up boxes. For R below 2: abdominal ultrasound, then MRI or MRCP, then liver biopsy. For R of 2 or more (mixed or hepatocellular): abdominal ultrasound and hepatitis A, B, C, E; then other viruses (CMV, EBV, HSV), autoimmune hepatitis, Budd-Chiari syndrome, ischemic hepatitis and Wilson disease."
        caption: "الـ cholestatic بيدوّر على **انسداد** (صور). الـ hepatocellular/mixed بيدوّر على **فيروسات وأمراض الخلية**."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L08c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <text x="165" y="18" text-anchor="middle" class="t-sm t-b">R = (ALT ÷ ALT ULN) ÷ (ALP ÷ ALP ULN)</text>
            <rect x="20" y="32" width="72" height="34" class="fg-acc"/>
            <rect x="92" y="32" width="109" height="34" class="fg-box"/>
            <rect x="201" y="32" width="109" height="34" class="fg-bad"/>
            <text x="56" y="54" text-anchor="middle" class="t-sm t-b">Cholestatic</text>
            <text x="146" y="54" text-anchor="middle" class="t-sm t-b">Mixed</text>
            <text x="255" y="54" text-anchor="middle" class="t-sm t-b">Hepatocellular</text>
            <text x="20" y="82" text-anchor="middle" class="t-sm t-mut">0</text>
            <text x="92" y="82" text-anchor="middle" class="t-sm t-b">2</text>
            <text x="201" y="82" text-anchor="middle" class="t-sm t-b">5</text>
            <text x="56" y="98" text-anchor="middle" class="t-sm">R &lt; 2</text>
            <text x="146" y="98" text-anchor="middle" class="t-sm">R 2–5</text>
            <text x="255" y="98" text-anchor="middle" class="t-sm">R &gt; 5</text>
            <path d="M56 104v20" class="fg-arrow" marker-end="url(#L08c)"/>
            <path d="M146 104L200 124M255 104L230 124" class="fg-arrow" marker-end="url(#L08c)"/>
            <rect x="5" y="126" width="120" height="34" rx="6" class="fg-box"/>
            <text x="65" y="148" text-anchor="middle" class="t-sm">Ultrasound</text>
            <path d="M65 160v14" class="fg-arrow" marker-end="url(#L08c)"/>
            <rect x="5" y="176" width="120" height="34" rx="6" class="fg-box"/>
            <text x="65" y="198" text-anchor="middle" class="t-sm">MRI or MRCP</text>
            <path d="M65 210v14" class="fg-arrow" marker-end="url(#L08c)"/>
            <rect x="5" y="226" width="120" height="34" rx="6" class="fg-acc"/>
            <text x="65" y="248" text-anchor="middle" class="t-sm t-b">Liver biopsy</text>
            <rect x="135" y="126" width="190" height="50" rx="6" class="fg-box"/>
            <text x="230" y="146" text-anchor="middle" class="t-sm">Ultrasound +</text>
            <text x="230" y="164" text-anchor="middle" class="t-sm t-b">hepatitis A, B, C, E</text>
            <path d="M230 176v14" class="fg-arrow" marker-end="url(#L08c)"/>
            <rect x="135" y="192" width="190" height="104" rx="6" class="fg-bad"/>
            <text x="230" y="212" text-anchor="middle" class="t-sm t-b">Then look for:</text>
            <text x="230" y="230" text-anchor="middle" class="t-sm">CMV, EBV, HSV</text>
            <text x="230" y="246" text-anchor="middle" class="t-sm">Autoimmune hepatitis</text>
            <text x="230" y="262" text-anchor="middle" class="t-sm">Budd-Chiari syndrome</text>
            <text x="230" y="278" text-anchor="middle" class="t-sm">Ischemic hepatitis, Wilson</text>
            <text x="165" y="334" text-anchor="middle" class="t-sm t-mut">History first: drugs and supplements, last 6 months</text>
          </svg>
      - kind: aside
        tone: trap
        page: 129
        text: |
          الـ R بيتحسب بالـ **multiples of ULN**، مش بالأرقام الخام. اقسم كل إنزيم على الـ ULN بتاعه الأول، وبعدين اقسم الناتجين على بعض.

          وخلي بالك من الحدود: الكتاب بيقول **mixed (R 2–5)**، فلو طلعت **R 5.0** أو **R 2.0** بالظبط يبقى **mixed**.
      - kind: check
        page: 129
        question: "ALT 600 U/L (ULN 40), ALP 150 U/L (ULN 120). What is R and the pattern?"
        options:
          - "R = 12: hepatocellular"
          - "R = 4: mixed"
          - "R = 1.25: cholestatic"
          - "R = 15: cholestatic"
        answer: 0
        why:
          - "صح: ALT = 600/40 = **15×**، ALP = 150/120 = **1.25×**، و R = 15 ÷ 1.25 = **12** > 5."
          - "دي 600/150 بالأرقام الخام من غير ULN، وده الفخ."
          - "1.25 ده الـ ALP multiple لوحده، مش الـ R."
          - "15 ده الـ ALT multiple، و R > 5 يعني hepatocellular مش cholestatic."
      - kind: order
        page: 129
        prompt: "R < 2 (cholestatic). رتّب الـ workup:"
        steps:
          - "Abdominal ultrasound"
          - "MRI or MRCP"
          - "Liver biopsy"
        why: "الـ cholestatic بيبدأ بالـ **ultrasound** يدوّر على obstruction، وبعدين **MRI/MRCP**، وآخر حاجة **liver biopsy**."
      - kind: explain
        page: 130
        title: "التوقيت والـ dechallenge"
        text: |
          - أغلب الـ **acute DILD** بيحصل خلال **1 week to 3 months** من التعرّض.
          - **Positive dechallenge** يعني الإنزيمات تتحسن لما توقف الدوا.
          - في الـ **acute hepatocellular**: **50% reduction** بعد **2 weeks**، و **normal by 4 weeks**.
          - في الـ **cholestatic**: ممكن **prolonged recovery**، فبطء التحسن مش بينفي الـ DILI.
      - kind: aside
        tone: analogy
        page: 130
        text: |
          الـ dechallenge زي ما تشيل صباعك من على الجرس: لو الصوت (الإنزيمات) **وطي للنص في أسبوعين** و **سكت خالص في 4**، يبقى إنت اللي كنت بترن.

          افتكرها: **2 → النص، 4 → صفر**.
      - kind: case
        page: 130
        stem: "A 50-year-old man started a new drug 5 weeks ago. ALT 760 U/L (ULN 40), ALP 140 U/L (ULN 120). No alcohol."
        steps:
          - question: "Which pattern is this?"
            options:
              - "Hepatocellular (R > 5)"
              - "Mixed (R 2–5)"
              - "Cholestatic (R < 2)"
            answer: 0
            why: "ALT = 19×، ALP ≈ 1.17×، فـ R ≈ 16: **hepatocellular**."
