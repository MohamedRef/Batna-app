    topics: [g6pd, aiha]
    goals:
      - "تشرح ليه نقص الـ G6PD بيخلي الكرة ضعيفة قدام الـ oxidants"
      - "تعرف الـ favism والأعراض والتحاليل والعلاج"
      - "تفرّق الـ warm من الـ cold AIHA في الـ antibody والسبب والعلاج"
    status: unverified
    steps:
      - kind: explain
        page: 35
        title: "الـ G6PD بيحمي الكرة إزاي؟"
        quote: "G6PD enzyme catalyses the first step in the hexose monophosphate (HMP) shunt. It generates NADPH from NADP."
        text: |
          الـ ==G6PD== أول إنزيم في الـ **HMP shunt**. بيعمل **NADPH** من NADP.

          الـ NADPH بيخلّي الـ **glutathione** في الحالة الـ reduced (**GSH**)، والـ GSH بيحوّل الـ **H2O2** لميه.

          لو الـ G6PD ناقص: الـ H2O2 يتراكم ← الـ Hb يتأكسد ← الـ globin يترسب (==Heinz bodies==) ← الكرة تتكسر في الطحال **و** جوّه الأوعية.
      - kind: order
        page: 35
        quote: "NADPH is required for continuous supply of reduced glutathione (GSH)."
        prompt: "رتّب سلسلة الحماية:"
        steps:
          - "G6PD (first step of HMP shunt)"
          - "NADPH from NADP"
          - "Reduced glutathione (GSH)"
          - "H2O2 detoxified to water"
        why: "لو أول حلقة وقعت، كل اللي بعدها يقع. والـ H2O2 يفضل يأكسد الـ Hb."
      - kind: explain
        page: 36
        title: "الصورة والـ favism"
        quote: "Favism (precipitation of haemolysis by ingestion of fava beans) is a unique feature occurring in individuals in Mediterranean and Arab countries."
        text: |
          الوراثة ==X-linked==، والكتاب بيقول بيحصل في **الرجالة** بس.

          بعد **oxidant stress** (أدوية، عدوى): فجأة **شحوب**، **صفار**، و**بول غامق** (haemoglobinuria)، وممكن **acute renal failure**.

          الـ ==Favism==: haemolysis بعد أكل **الفول** (fava beans) اللي فيه oxidants، بعد ساعات أو أيام، وممكن يموّت. منتشر في **البحر المتوسط والدول العربية**.
      - kind: aside
        tone: joke
        page: 36
        quote: "Fava beans contain oxidants that cause haemolysis hours or days following ingestion; it may be fatal."
        text: "في مصر الفول مش أكلة، ده **أسلوب حياة**. 😄 بس لعيان الـ G6PD، الفول الأخضر بالذات ممكن يبقى خطر حقيقي. فكّر فيه في أي طفل جه ببول غامق بعد الفطار."
      - kind: explain
        page: 36
        title: "الصور الإكلينيكية والتحاليل"
        quote: "Peripheral blood smear shows fragmented red cells, bite cells"
        text: |
          الصور: **neonatal jaundice**، **drug-induced** haemolysis، **chronic** haemolytic anaemia، **favism**، و**بعد العدوى**.

          **التحاليل**: علامات الـ haemolysis، والفيلم فيه **fragmented cells** و ==bite cells== (الطحال «قضم» الـ Heinz body)، unconjugated hyperbilirubinaemia، haemoglobinuria.

          **تشخيص الإنزيم**: ==fluorescent spot test== (screening)، و **quantitative assay**.

          **العلاج**: ابعد عن الـ oxidant drugs، عالج العدوى بسرعة، supportive في الأزمة، نقل في الشديد، و**بول كفاية** يحمي الكلية.
      - kind: check
        page: 36
        quote: "Fluorescent spot test"
        question: "Screening test for G6PD deficiency?"
        options:
          - "Fluorescent spot test"
          - "Osmotic fragility"
          - "EMA binding"
          - "Sucrose haemolysis test"
        answer: 0
        why:
