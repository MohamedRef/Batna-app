    stem: A 70-year-old diabetic man has absent dorsalis pedis and posterior tibial pulses, rest pain and an ABI of 0.32. What does this mean?
    options: [Severe PAD, Moderate PAD, Mild PAD, Normal, Calcified vessels with falsely low ABI]
    answer: 0
