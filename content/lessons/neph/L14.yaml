        caption: "==Glomerulus==: light-chain amyloidosis (AL) و light-chain deposition disease. ==Proximal==: Fanconi. ==Distal==: cast nephropathy (myeloma kidney)، أشهر سبب لـ GFR واطي في الـ myeloma."
