  - id: res.L11.083
    kind: card
    topic: population
    front: Participation (response rate) affects how representative a sample is. What response rate did the lecturer give as a common target, and is a high rate enough?
    back: >-
      About 80% is a common target. But the rate alone does not rule out bias: what matters is whether responders differ from
      non-responders in ways that affect the results. A bigger sample does not fix a biased one, and inviting the whole
      population does not mean everyone will respond.
