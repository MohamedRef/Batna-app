  kind: mcq
  topic: apply
  stem: When adopting an EBM approach in clinical practice, which statement is CORRECT?
  options:
  - PICO format is a good approach for answering a clinical question
  - Textbooks could be a suitable source for evidence
  - We cannot depend on expert opinion in the absence of a suitable source of evidence
  - When applying the evidence, the doctor should decide whatever the patient's preferences
  - Critical appraisal should be done to the filtered evidence
  answer: 0
  why:
  - PICO structures the question so the evidence can be found and the question answered.
  - Textbooks serve background questions; they can be opinion-based and out of date for focused questions.
  - Expert opinion (grade C) is used when no directly applicable good studies exist.
  - Patient values and expectations are one of the three components of EBM.
  - Filtered evidence is already appraised; you appraise unfiltered (primary) articles.
