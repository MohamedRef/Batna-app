    title: Table of association
    text: |-
      بيوري **علاقة** بين condition وcharacteristic، زي smoking والـ lung cancer.

      - **2 × 2**: كل متغير ليه احتمالين (smoker/non-smoker × cancer yes/no).
      - **c × r**: واحد منهم أو الاتنين ليه ==أكتر من احتمالين== (Drug A/B/C × cured/improved/worsened).
