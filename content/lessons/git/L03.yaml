      - kind: explain
        page: 117
        quote: "5-HT key mediator of visceral hypersensitivity & abnormal bowel motility"
        title: "ليه بيحصل؟"
        text: |
          الـ IBS **biopsychosocial** و multifactorial: dysregulation في الـ central والـ peripheral.

          - **Motility:** transit بطيء = constipation، سريع = diarrhea، و **spasms** = ألم.
          - **Visceral hyperalgesia:** ألم مع distension وكمية غاز طبيعية.
          - **Stress:** الـ limbic system، و **CRF** من الـ hypothalamus بيزوّد الـ motility disturbance.
          - ==Serotonin (5-HT)==: الـ key mediator للـ visceral hypersensitivity والحركة الغلط.
          - **Post-infectious:** lymphocytes و enteroendocrine cells أكتر، serotonin أعلى. والـ risk factors: مدة أطول للعدوى، نوع الميكروب، smoking، female، young، و ==absence of vomiting== أثناء العدوى.
          - **Food:** الدسم، الـ fructose، و broccoli و cauliflower.
      - kind: explain
        page: 118
        quote: "This is usually colicky or cramping in nature, felt in the lower abdomen and relieved by defecation."
        title: "شكله في العيادة"
        text: |
          - **Pain:** colicky أو cramping، تحت في البطن، و ==relieved by defecation==.
          - **Bloating** بيزيد على مدار اليوم.
          - الـ constipation: براز **pellety** قليل. الـ diarrhea: مرات كتير بس **low-volume**، ونادرًا بالليل.
          - **Mucus** عادي، بس ==rectal bleeding does not occur==.
          - الوزن ثابت والمريض constitutionally well، والكشف طبيعي غير شوية tenderness.
          - ومعاه ممكن أعراض برّه البطن: fatigue، urinary urgency، sexual dysfunction.
      - kind: table
        page: 120
        quote: "Recurrent abdominal pain on average at least 1 day per week in the last 3 months"
        title: "Rome III ولا Rome IV؟"
        columns: ["Feature", "Rome III", "Rome IV (2016)"]
        rows:
          - ["Symptom", "Pain or discomfort", "Pain only"]
          - ["Frequency", "At least 3 days a month", "At least 1 day a week"]
          - ["Link to defecation", "Improves with defecation", "Related to defecation"]
        hide: [[0, 2], [1, 2], [2, 2]]
      - kind: check
        page: 120
        quote: "Recurrent abdominal pain on average at least 1 day per week in the last 3 months"
        question: "Which patient meets the Rome IV criteria for IBS"
        options:
          - "Pain 1 day a week for 3 months, related to defecation and to a change in stool form, starting 7 months ago"
          - "Abdominal discomfort without pain 3 days a month for 6 months"
          - "Pain 1 day a week related to defecation, starting 2 months ago"
          - "Painless loose stools in more than 25% of bowel movements"
        answer: 0
        why:
          - "صح: pain مرة في الأسبوع على الأقل آخر 3 شهور، مع 2 من التلاتة (defecation، frequency، form)، و onset من 6 شهور أو أكتر."
          - "ده كلام Rome III. الـ Rome IV شال كلمة discomfort وبقى pain بس."
          - "لازم symptom onset من 6 شهور على الأقل."
          - "من غير ألم ده functional diarrhea مش IBS."
      - kind: explain
        page: 126
        quote: "IBS subtypes related to bowel habit abnormalities (IBS-C, IBS-D and IBS-M) can only be confidently established when the patient is evaluated off medications"
        title: "الـ subtypes بالـ 25%"
        text: |
          بنبص بس على أيام فيها **abnormal bowel movement**، ونعدّ الـ Bristol types:

          - **IBS-C:** types 1–2 أكتر من ==25%==، و 6–7 أقل من 25%.
          - **IBS-D:** types 6–7 أكتر من 25%، و 1–2 أقل من 25%.
          - **IBS-M:** الاتنين أكتر من 25%.
          - **IBS-U:** مفيش type بيعدّي 25%.

          والـ subtype يتحدد ==off medications== اللي بتعالج الـ bowel habit. وفي الـ clinical trials بيستعملوا **2 weeks of daily diary**.
      - kind: sort
        page: 126
        quote: "IBS-C Types 1,2 not 6,7 >25%"
        prompt: "حدّد الـ subtype من نسب الـ abnormal bowel movements:"
        bins: ["IBS-C", "IBS-D", "IBS-M", "IBS-U"]
        cards:
          - { text: "Hard 40%, loose 10%", bin: 0 }
          - { text: "Hard 5%, loose 50%", bin: 1 }
          - { text: "Hard 30%, loose 35%", bin: 2 }
          - { text: "Hard 10%, loose 15%", bin: 3 }
        why: "الحد السحري **25%**: اللي يعدّيه بس hard = C، بس loose = D، الاتنين = M، ولا واحد = U."
      - kind: explain
        page: 121
        quote: "Onset of first symptom after 50 yr of age"
        title: "إمتى ما تقولش IBS على طول"
        text: |
          حتى لو الـ Rome criteria موجودة، الـ **warning signs** دي محتاجة evaluation الأول:

          - ==Rectal bleeding==، anemia، weight loss، fever.
          - **Family history of colon cancer**.
          - ==Onset after 50 years==، أو تغيّر كبير في الأعراض.

          ومن الجدول: anemia، platelets أو ESR عالي، albumin واطي، perianal disease، bloody stools و tenesmus، fecal WBC أو occult blood كلها مع **IBD** مش IBS.

          الـ tests: CBC، **celiac serology**، **TSH**، وكولونوسكوبي حسب السن والـ red flags. والـ DDx: Crohn's، UC، coeliac، colon cancer، و giardiasis.
      - kind: check
        page: 121
        quote: "Family history of colon cancer"
        question: "A patient fulfils the Rome IV criteria for IBS. Which extra finding means you must investigate further first"
        options:
          - "First symptoms started at age 58"
          - "Mucus in the stool"
          - "Bloating that worsens through the day"
          - "Pain relieved by defecation"
        answer: 0
        why:
          - "صح: **onset after 50** red flag، لازم تستبعد colon cancer."
          - "الـ mucus شائع في IBS ومش red flag."
          - "الـ bloating اللي بيزيد على مدار اليوم ده شكل IBS العادي."
          - "ده جزء من التشخيص نفسه."
      - kind: explain
        page: 123
        quote: "The addition of fibre to the diet is usually the first step in patients with IBS"
        title: "الأساس قبل أي دوا"
        text: |
          - **Therapeutic relationship**، education، و reassurance.
          - شيل المحفّزات المحتملة: **caffeine**، **lactose**، **fructose**.
          - ==Fibre== أول خطوة عادةً، بس ممكن يعمل flatulence و bloating.
          - **Probiotics:** ==Bifidobacterium infantis== هو المفضّل.
          - **Low FODMAP diet** لو فيه pain أو bloating.
      - kind: table
        page: 123
        quote: "lubiprostone or linaclotide"
        title: "الأدوية حسب الـ subtype"
        columns: ["Subtype", "No pain or bloating", "With pain or bloating"]
        rows:
          - ["IBS-C", "Ispaghula, lactulose or PEG; then lubiprostone or linaclotide", "Add antispasmodics; then SSRI (citalopram, paroxetine) + linaclotide"]
          - ["IBS-D", "Loperamide or colestyramine; then alosetron or eluxadoline", "Add antispasmodics; then TCA (amitriptyline, desipramine, doxepin)"]
          - ["IBS-M", "Laxatives and loperamide as adjuncts", "Antispasmodics; then TCA or SSRI"]
        hide: [[0, 1], [1, 1], [1, 2]]
      - kind: reveal
        page: 124
        quote: "Desipramine/amitriptyline/doxepin"
        prompt: "ليه في IBS-D الـ second line هو TCA، وفي IBS-C هو SSRI؟"
        answer: |
          الاتنين بيهدّوا الـ visceral pain، بس ليهم أثر جانبي مختلف على المصران:

          - الـ **TCAs** (desipramine، amitriptyline، doxepin) ليها anticholinergic effect، فبتبطّأ الـ transit وبتمسك. ده عيب في IBS-C وميزة في ==IBS-D==.
          - الـ **SSRIs** بتسرّع الـ transit شوية، فبتنفع أكتر في ==IBS-C==.

          ودايمًا **CBT** أو **hypnotherapy** كـ adjunct. وجديد: **ramosetron** و **ondansetron** في IBS-D (الـ ramosetron بيعمل constipation في حوالي 10%).

          (الـ pharmacology دي عامة، والكتاب بيدّي الـ ladder من غير ما يشرح السبب.)
