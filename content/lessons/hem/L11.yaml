            <path d="M10 215 H320" class="fg-ink"/>
            <path d="M15 215 C30 215 35 165 50 165 C65 165 70 215 85 212 C100 208 105 202 115 204 C125 206 130 210 145 206 C160 202 170 206 200 210 C215 212 222 140 230 140 C238 140 245 212 260 212 C280 213 300 214 315 214" class="fg-arrow-bad" stroke-width="2"/>
            <text x="50" y="228" text-anchor="middle" class="t-sm t-mut">Alb</text>
            <text x="230" y="134" text-anchor="middle" class="t-sm t-bad t-b">M spike</text>
          </svg>
      - kind: explain
        remind: [hem.L11.044]
        page: 180
        quote: "Conventional radiographs- punched-out lytic lesions, osteoporosis or fractures. The vertebrae, skull, thoracic cage, pelvis, proximal humeri and femora are most frequently involved.\nCT or MRI in patients who have bone pain but no abnormalities on radiograms."
        title: "الأشعة"
        text: |
          - X-ray: ==punched-out lytic lesions==، osteoporosis أو كسور.
          - الأماكن: **vertebrae، skull، thoracic cage، pelvis، proximal humeri و femora**.
          - وجع عضم والأشعة سليمة؟ اعمل **computed tomography (CT) أو magnetic resonance imaging (MRI)**.

          لاحظ القايمة: هي بالظبط أماكن الـ **red marrow** في الكبير (المحاضرة 1: axial skeleton وأول الـ femur والـ humerus). الـ myeloma بيعيش في النخاع، فبياكل العضم اللي حوالين النخاع الشغال.
      - kind: explain
        page: 180
        quote: "Tests to establish tumour burden and prognosis\nSerum β2-microglobulin\nSerum albumin\nSerum C-reactive protein Surrogate measure of IL-6"
        title: "الـ tumour burden: تلات تحاليل"
        text: |
          عشان تعرف الـ **tumour burden** والـ **prognosis**:
          - **Serum β2-microglobulin**
          - **Serum albumin**
          - **Serum CRP**: ==surrogate measure of IL-6==

          ليه الـ CRP؟ لأن الـ IL-6 (وقود الـ myeloma، ص 178) هو اللي بيخلّي الكبد يعمل CRP، فالـ CRP بيقيس الـ IL-6 بشكل غير مباشر. والتفسير المقبول (مش في الكتاب) للاتنين التانيين: الـ **β2-microglobulin** بيتقشّر من سطح الخلايا، فكل ما الـ clone يكبر يعلى (وكمان بيعلى لو الكلية تعبانة)، والـ **albumin** بيقل لأن الـ IL-6 بيقول للكبد يعمل بروتينات التهاب بدل الـ albumin. والتلاتة هيرجعوا في الـ ISS.
      - kind: check
        page: 180
        quote: "Serum C-reactive protein Surrogate measure of IL-6"
        question: "Why is serum CRP measured at diagnosis of myeloma?"
        options: ["Surrogate measure of IL-6", "To detect bacterial infection only", "To measure the paraprotein", "To diagnose amyloidosis"]
        answer: 0
        why:
          - "صح: الكتاب بيقول CRP = surrogate measure of IL-6، جزء من الـ tumour burden و prognosis."
          - "ممكن يعلى مع العدوى، بس ده مش سبب قياسه هنا."
          - "الـ paraprotein بيتقاس بالـ electrophoresis."
          - "الـ amyloidosis بيتشخص بحاجات تانية."
      - kind: try
        items: [hem.L11.038, hem.L11.040, hem.L11.042, hem.L11.044, hem.L11.046]
    recap:
      - "Normocytic anaemia 70% (marrow failure)، platelets واطية 15%، plasma cells في الدم = PCL."
      - "Rouleaux و ESR عالي (البروتين بيرصّ الكرات)؛ Ca عالي 30%؛ ALP طبيعي (osteoblasts مكتومة)."
