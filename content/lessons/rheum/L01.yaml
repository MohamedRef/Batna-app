  - id: rheum.L01.lesson7
    title: "العائلات من جوه: مين أول واحد يوصل، ومين الأحدث"
    hook: "IL-1 بيوصل الأول ويولّع الحرارة، والـ interferons بتحمي من الفيروسات، والـ chemokines بتشاور على الطريق."
    minutes: 10
    pages: [8, 10]
    topics: [families]
    goals:
      - "تعرف IL-1 بيعمل إيه في الجسم كله، وليه الحرارة مفيدة"
      - "تفرّق تلات أنواع الـ interferons ومين بيعمل كل نوع"
      - "تعرف TNF-α من TNF-β، وشغل IL-17 والـ chemokines"
    status: unverified
    steps:
      - kind: explain
        page: 8
        quote: "Cytokines of the interleukin 1 (IL-1) family are typically secreted very early in the immune response by dendritic cells, monocytes, and macrophages following recognition by innate receptors of viral, parasitic, or bacterial antigens."
        title: "IL-1: أول واحد يوصل"
        text: |
          الـ ==IL-1 family== بيتفرز **بدري جدًا** من الـ dendritic cells والـ monocytes والـ macrophages بعد ما الـ innate receptors تشوف الميكروب.

          - **Proinflammatory**.
          - **Systemic**: بيخلي الكبد يعمل type I interferons (IFNs) و IL-6 و chemokine ligand 8 (CXCL8) ← بيكسروا الـ viral RNA ويعملوا **fever**.
          - الحرارة مفيدة: بتقتل الـ temperature-sensitive bacteria.
          - **Bridge**: بيساعد ينشّط الـ T والـ B cells.
      - kind: reveal
        page: 8
        quote: "In addition, IL-1 serves as an intermediary between the innate and adaptive immune systems by helping to activate both T and B cells."
        prompt: "ليه بيقولوا على IL-1 إنه «كوبري»؟"
        answer: |
          عشان بيتفرز من خلايا **innate** (dendritic cells و monocytes و macrophages) بعد ما تشوف الميكروب، وفي نفس الوقت بيساعد ينشّط الـ **T والـ B cells** (adaptive).

          يعني نفس الرسالة اللي بتعلن الخطر في الأول، هي اللي بتصحّي الجيش المتخصص بعدها.
      - kind: explain
        page: 8
        quote: "The cellular origins and target cells of class 1 cytokines are extremely diverse."
        title: "Class 1: أكبر عيلة، وأكتر عيلة متنوعة"
        text: |
          الكتاب بيقول إن مصادر الـ class 1 والخلايا اللي بتأثر عليها **متنوعة جدًا**، وبيدّي أمثلة:

          - **IL-2**: بداية تكاثر الـ T والـ B cells.
          - **IL-4**: بينظّم شغل الـ helper T cells.
          - **IL-6**: بيحوّل الـ B cell لـ ==plasma cell== تفرز antibodies.
          - **GM-CSF و G-CSF**: بيبدأوا تمايز lineages معينة من الـ leukocytes.

          ليه هي الأكبر؟ التفسير المقبول (مش في الكتاب): اسمها التاني **hematopoietin**، يعني شغلتها الأساسية "تكبير وتمايز" الخلايا، ودي حاجة كل lineage محتاجها، فكل lineage ليه cytokine أو أكتر من العيلة دي.
      - kind: reveal
        page: 9
        quote: "{The class 1 cytokine family is the largest family of cytokines, and members mediate diverse effects, including proliferation, differentiation, and antibody secretion}."
        prompt: "أنهي عيلة هي الأكبر؟ وأنهي عيلة هي الأحدث؟"
        answer: "الأكبر: **class 1 (hematopoietin)**، وبتعمل proliferation و differentiation و antibody secretion. الأحدث اكتشافًا: **IL-17 family** (صفحة 10)."
      - kind: table
        page: 9
        quote: "The class 2 cytokine (interferon) family includes the following:\n  Type I interferons (IFN-α and IFN-β), which mediate early antiviral response.\n  Type II interferons (such as IFN-γ), which activate macrophages, interact with cells of the adaptive immune system, and support the generation of TH1 cells.\n  Type III interferons (IFN-λ), which are secreted by plasmacytoid dendritic cells (pDC) and regulate viral replication and host cell proliferation."
        title: "تلات أنواع interferon"
        columns: ["Type", "Members", "Job"]
        rows:
          - ["I", "IFN-α, IFN-β", "Early antiviral response"]
          - ["II", "IFN-γ", "Activates macrophages, supports TH1"]
          - ["III", "IFN-λ", "From pDCs; viral replication, host proliferation"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 9
        quote: "Type I interferons (IFN-α and IFN-β), which mediate early antiviral response."
        title: "ليه تلات أنواع interferons؟"
        text: |
          كل نوع ليه وقت ومكان. التفسير المقبول (مش في الكتاب) هنا مبني على اللي في الجدول:

          - **Type I (α و β)**: ==early antiviral==. أي خلية بيدخلها فيروس تقدر تطلّعه، وده بيخلّي الخلايا اللي جنبها تجهز نفسها قبل ما الفيروس يوصلها.
          - **Type II (γ)**: ده مش antiviral أساسًا، ده "منشّط الـ ==macrophage==" وبيدعم الـ TH1. عشان كده بتلاقيه من الـ TH1 والـ NK cells.
          - **Type III (λ)**: من الـ ==plasmacytoid dendritic cells== (pDCs)، وبينظّم تكاثر الفيروس وتكاثر خلايا الجسم.

          فخ: IFN-γ هو الوحيد في العيلة اللي بتطلّعه الخلايا المناعية المتخصصة بشكل أساسي، والباقي أقرب للـ innate.
      - kind: explain
        page: 9
        quote: "TNF-α: is a proinflammatory cytokine, produced in response to infection, inflammation, and environmental stressors by activated macrophages, and also by lymphocytes, fibroblasts, and keratinocytes."
        title: "TNF-α: مين بيعمله وإمتى"
        text: |
          الـ ==TNF-α== **proinflammatory**، وبيتعمل كرد فعل على 3 حاجات: infection، inflammation، و environmental stressors.

          - المصدر الأساسي: **activated macrophages**.
          - وكمان: lymphocytes و fibroblasts و keratinocytes.

          ليه ده مهم في الروماتيزم؟ عشان الـ fibroblasts موجودة في الـ synovium، والـ keratinocytes في الجلد. يعني التفسير المقبول (مش في الكتاب) إن الالتهاب مش محتاج macrophage بس عشان يكمّل: خلايا النسيج نفسه بتشارك، وده يفسّر ليه الـ anti-TNF بيفيد في المفصل (RA) والجلد (psoriasis) الاتنين.
      - kind: explain
        page: 10
        quote: "TNF-β is produced by activated lymphocytes and can deliver a variety of signals. On binding to neutrophils, endothelial cells lead to increased expression of MHC and adhesion molecules."
        title: "TNF و IL-17 والـ chemokines"
        text: |
          - **TNF family**: soluble أو membrane-bound (وأحيانًا الاتنين). بتنظّم الـ skeletal والـ neuronal والـ immune systems. ==TNF-α== من الـ activated macrophages أساسًا؛ **TNF-β** من الـ activated lymphocytes. ومساراتها هدف لأقوى الأدوية.
          - **IL-17**: من الـ **T helper 17 (TH17)** cells، receptors على الـ neutrophils والـ keratinocytes، ونتيجتها inflammation.
          - **Chemokines**: بتسحب الـ leukocytes على الـ gradient ناحية المصدر (**chemotaxis**).
      - kind: explain
        page: 10
        quote: "Leukocytes change their pattern of expression of chemokine receptors during the course of an immune response."
        title: "ليه الـ leukocytes بتغيّر الـ receptors بتاعتها؟"
        text: |
          الكتاب بيقول إن الـ leukocytes **بتغيّر نمط الـ chemokine receptors** خلال الـ immune response.

          التفسير المقبول (مش في الكتاب): الـ chemokine receptor هو "الخريطة" بتاعة الخلية. لو غيّرت الـ receptor، بتغيّر **العنوان** اللي هتمشي له:
          - خلية لسه naive بتروح الـ lymph node عشان تقابل الـ antigen.
          - بعد ما تتنشّط، بتغيّر الـ receptors فتطلع وتروح **مكان الالتهاب**.

          وده بيكمّل كلام صفحة 10: الـ chemokines بتسحب الخلية **لفوق الـ gradient**، ناحية المصدر، وده اسمه ==chemotaxis==.
      - kind: figure
        page: 10
        quote: "Structurally related family of small cytokines that bind to cell surface receptors and induce the movement of leukocytes up a chemokine concentration gradient and toward the chemokine source."
