    topic: prevalence
    front: When does P = I × D hold?
    back: "In a steady state: incidence and duration stable over time, the same units (e.g. per 1000 per year × years), and it is closest when the disease is rare (low prevalence). It is an approximation, not an identity for every population (Freeman and Hutchison 1980)."
    src: { page: 37, quote: "Prevalence = Incidence x Mean Duration\nExample:\n  Incidence = 10 cases per 1000 population per year\n  Mean Duration of Disease = 5 years\n  Prevalence = 10 x 5 = 50 per 1000 population" }
