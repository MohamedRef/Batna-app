            <text x="165" y="228" text-anchor="middle" class="t-sm t-mut">Front view: the patient's right is on your left</text>
          </svg>
      - kind: aside
        tone: tip
        page: 325
        quote: "Select optimal surgical approach by an experienced surgeon Respect donor autonomy during all phases of evaluation and donation. Perform annual postdonation follow-up care including:"
        text: |
          المتبرع ما بيتنساش بعد العملية: ==annual postdonation follow-up== (BP، BMI، creatinine و eGFR، albuminuria، ونمط حياة صحي). والجراحة: mini-open أو laparoscopic أو hand-assisted، بجراح متمرّس.
      - kind: try
        items: [neph.L09.127, neph.L09.128, neph.L09.130, neph.L09.133, neph.L09.135]
    recap:
      - "Living: related أو unrelated عاطفي؛ التجاري ممنوع. Cadaveric: beating أو non-beating heart."
      - "الحي: متاح فورًا، cold ischaemia قصير، وظيفة ممتازة."
      - "GFR ≥ 90، ACR، haematuria، حصوات، gout، BP مرتين، metabolic، infections، cancer، β-hCG، و psychosocial."
      - "الشمال عادةً (وريد أطول)، ومتابعة سنوية للمتبرع."
    practice: [neph.L09.127, neph.L09.128, neph.L09.129, neph.L09.130, neph.L09.131, neph.L09.132, neph.L09.133, neph.L09.134, neph.L09.135, neph.L09.136, neph.L09.173]

  - id: neph.L09.lesson7
    title: "الـ HLA والـ rejection"
    hook: "6 أرقام على الـ HLA بتحدد الكلية هتعيش قد إيه. وست عندها 4 ولادات ممكن تكون عاملة antibodies من غير ما تعرف."
    minutes: 10
    pages: [325, 330]
    topics: [hla, rejection]
    goals:
      - "تعرف الـ HLA classes وأهم 3 في الـ matching وإزاي بيتكتبوا"
      - "تفهم الـ cross-match والـ acceptable mismatch وطرق الـ typing"
      - "تفرّق الـ hyperacute والـ acute والـ chronic rejection"
    status: unverified
    steps:
      - kind: explain
        page: 325
        title: "الـ HLA"
        quote: "Humans have three class I HLA (A, B, C) that are present on all nucleated cells and six class II HLA (DPA1, DPB1, DQA1, DQB1, DRA, DRB1) that are present only on antigen-presenting cells and lymphocytes . Nucleic Acids Research, 2013, Vol. 41, Database issue"
        text: |
          - **Class I** (A، B، C): على ==كل الخلايا اللي فيها نواة==.
          - **Class II** (DP، DQ، DR): على الـ **antigen-presenting cells (APCs)** والـ lymphocytes بس.

          أهم 3 في الـ mismatch: ==HLA-A، -B، -DRB1==. والـ human leucocyte antigens (HLA) متنوّع جدًا: حوالي 6000 class I وأكتر من 1500 class II alleles.

          الاسم زي **HLA-DRB1*0401**: أول رقمين serological، وآخر رقمين الـ PCR subtype.

          ليه class I وclass II مختلفين في المكان؟ التفسير المقبول (مش في الكتاب): الـ **class I** بيعرض اللي **جوّه** الخلية (لو فيروس، الخلية تتقتل بالـ CD8)، فلازم يكون على كل خلية. الـ **class II** بيعرض اللي اتلم من **بره** علشان ينبّه الـ CD4، فعلى الخلايا اللي شغلتها تعرض (APCs). وفي الزراعة الكلية نفسها فيها APCs من المتبرع (passenger leucocytes) بتحمل class II، ودي اللي بتشعل الـ direct pathway في الأول.
      - kind: figure
        page: 326
        title: "الـ HLA على chromosome 6"
        image: { file: neph/L09-hla-region.webp, book: true }
        caption: "الـ class II (**DP و DQ و DR**) والـ class I (**B و C و A**) جنب بعض على chromosome 6، وكل واحد بيعمل بروتين على سطح الخلية."
        alt: "Book diagram of the HLA region on the short arm of chromosome 6, with class II genes DP, DQ, DR and class I genes B, C, A, and drawings of the class II alpha-beta heterodimer and the class I heavy chain with beta-2 microglobulin on the cell membrane."
      - kind: explain
        page: 326
        title: "ليه A و B و DR بالذات؟"
        quote: "Three of the HLA heterodimers (HLA-A, -B, and -DRB1) contribute to the majority of the immunogenicity of mismatched antigens"
        text: |
          الكتاب: ==HLA-A و -B و -DRB1== عليهم أغلب الـ immunogenicity، فالـ typing التقليدي بيركز عليهم. والـ HLA **polymorphic** جدًا. والاسم زي ==HLA-DRB1*0401==: أول رقمين = اللي كان بيتحدد serologically، وآخر رقمين = الـ subtype بالـ PCR (high resolution DNA).

          ليه التلاتة دول؟ التفسير المقبول (مش في الكتاب): هما الأكثر تنوعًا والأكثر ظهورًا للـ T cells. كل واحد ليه نسختين (واحدة من الأب وواحدة من الأم)، فـ 3 × 2 = ==6 antigens==، وعشان كده بنقول match «5/6» أو «4/6» زي ما شفت في cases الـ transplant في محاضرة 8.

          وليه الـ siblings؟ لأن الـ HLA بيتورث **haplotype** كامل (حتة chromosome فيها A و B و DR سوا). فكل أخ عنده فرصة 25% يبقى HLA-identical، و 50% نص match (one haplotype)، و 25% ولا حاجة.

          وليه الأخ الـ HLA-identical أحسن متبرع؟ التفسير المقبول (مش في الكتاب): الـ 6 antigens زي بعض، فالـ T cells عند العيان تقريبًا مش شايفة حاجة غريبة إلا الـ minor antigens. فالكلية بتعيش أطول، وأحيانًا الـ immunosuppression بيبقى أخف. أما الأب أو الأم فدايمًا one haplotype (3/6)، لأن كل واحد ادّى نص بس.
      - kind: figure
        page: 327
        title: "الإخوات والـ haplotypes"
        image: { file: neph/L09-hla-siblings.webp, book: true }
        caption: "الأب والأم كل واحد بيدّي **haplotype** (A و B و DR سوا). الإخوات ممكن يطلعوا ==HLA identical==، أو **single haplotype match**، أو **complete mismatch**."
        alt: "Book family diagram: the mother and father each carry two HLA haplotypes (A, B, DR numbers); their children are shown as the patient, an HLA-identical sibling, a completely mismatched sibling, and a single-haplotype-matched sibling."
      - kind: figure
        page: 327
        title: "إزاي بندوّر على الـ antibodies"
        image: { file: neph/L09-hla-methods.webp, book: true }
        caption: "**Cell-based**: الـ CDC cross-match والـ flow cytometry cross-match. **Solid-phase**: ELISA و ==Luminex== (أحسن sensitivity، وبيقيس كمية الـ antibody)."
        alt: "Book figure of HLA antibody methods: cell-based assays (CDC cross-match with complement and donor lymphocytes, flow cytometry cross-match) and solid-phase assays (ELISA, Luminex microbeads), with a table of their strengths."
      - kind: explain
        page: 327
        title: "ليه أكتر من طريقة؟"
        quote: "Methods for HLA typing, detection of HLA Abs."
        text: |
          الكتاب بيقارن: الـ **CDC-XM** ==قلّل الـ hyperacute rejection==، بس **مش بيقول** أنهي antigen سبب الإيجابية. والـ **solid-phase** حساس جدًا و specific للـ donor antigens، والـ **Luminex** أحسن من الـ ELISA، وبيقيس **مستوى** الـ anti-HLA antibodies.

          ليه نحتاج الاتنين؟ التفسير المقبول (مش في الكتاب):
          - الـ **CDC** بيقيس اللي بيهم فعلًا: هل دم العيان **بيقتل** خلايا المتبرع مع الـ complement؟ لو آه، الكلية هتموت في دقايق. بس هو مش حساس للكميات القليلة.
          - الـ **flow** بيشوف الـ antibody اللي **لازق** حتى لو مش بيقتل.
          - الـ **Luminex** بيقولك بالظبط ضد أنهي HLA، فتقدر تختار متبرع تاني أو تعمل desensitization.
          يعني من الأخشن للأدق: CDC، flow، Luminex.

          وإيه اللي يحصل لو الـ flow موجب والـ CDC سالب؟ التفسير المقبول (مش في الكتاب): فيه antibodies ضد المتبرع، بس كميتها مش كفاية تقتل الخلايا في الأنبوبة. في الجسم ممكن تعمل AMR بعد أيام أو أسابيع، عشان كده الكتاب بيقول خطرها 83%. الحل يا متبرع تاني، يا desensitization (plasma exchange و IVIG) قبل الزراعة.
      - kind: explain
        page: 328
        title: "الـ cross-match والـ mismatch"
        quote: "Mismatch acceptability known as acceptable HLA-mismatch. These are mismatched HLA antigens that do not result in a positive complement dependent cytotoxicity (CDC) crossmatch. Not lead to hyper acute rejection."
        text: |
          الـ ==acceptable mismatch== = HLA مختلف بس **ما بيعملش complement dependent cytotoxicity (CDC) cross-match موجب**، فمش هيعمل hyperacute rejection. وكل الـ **cross-match لازم يبقى سالب** قبل الزراعة.

          الـ mismatch بيأثر على ==long-term survival== مش على الـ early rejection. الأحسن HLA-identical (خصوصًا living related)، والأوحش cadaver عشوائي.

          **CDC-XM** قلّل الـ hyperacute بس ما بيقولش أنهي antigen. الـ **solid-phase** (ELISA، Luminex أحسن) حساس ويقيس كمية الـ antibodies.

          ليه الـ mismatch بيأثر على المدى البعيد مش البدري؟ التفسير المقبول (مش في الكتاب): الـ rejection البدري الأدوية بتسيطر عليه حتى مع mismatch. بس كل HLA غريب هو هدف ممكن الجسم يعمل ضده **antibodies جديدة (de novo DSA)** على سنين، وده سبب أساسي للـ chronic ABMR. يعني كل mismatch زيادة = فرصة زيادة لرفض بطيء. وليه الـ acceptable mismatch؟ لأن مش كل اختلاف خطير؛ لو العيان ما عندوش antibodies ضده، الـ CDC هيطلع سالب.
      - kind: figure
        page: 328
        quote: "In the indirect pathway the incompatible MHC molecules of donor are processed into peptides and presented by recipient (self) to self lymphocytes. Steps in allograft rejection: (Sayegh Mh, krensky AM. Transplantation immunology. In: Dialysis and transplantation A companion to Brenner&Rector"
        title: "Direct ضد indirect"
        alt: "Two stacked panels. Direct: a donor APC shows intact donor MHC; a recipient T cell binds it directly (class II to CD4, class I to CD8). Indirect: a recipient APC takes up donor MHC, cuts it into peptides and shows a donor peptide on self MHC to a recipient CD4 T cell."
        caption: "**Direct**: الـ T cell بتاع العيان شايف major histocompatibility complex (MHC) المتبرع ==كامل== على خلية المتبرع. **Indirect**: خلايا العيان بتقطّع MHC المتبرع وتعرضه على ==self MHC==."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="320" height="115" rx="10" class="fg-box"/>
            <text x="15" y="26" class="t-b">Direct</text>
            <circle cx="62" cy="75" r="32" class="fg-acc"/>
            <text x="62" y="72" text-anchor="middle" class="t-sm">Donor</text>
            <text x="62" y="86" text-anchor="middle" class="t-sm">APC</text>
            <rect x="100" y="66" width="28" height="18" rx="3" class="fg-bad"/>
            <text x="114" y="60" text-anchor="middle" class="t-sm t-bad">MHC</text>
            <circle cx="170" cy="75" r="30" class="fg-good"/>
            <text x="170" y="79" text-anchor="middle" class="t-sm">T cell</text>
            <text x="210" y="62" class="t-sm">II → CD4</text>
            <text x="210" y="80" class="t-sm">I → CD8</text>
            <text x="210" y="98" class="t-sm t-mut">intact donor MHC</text>
            <rect x="5" y="135" width="320" height="120" rx="10" class="fg-box"/>
            <text x="15" y="156" class="t-b">Indirect</text>
            <circle cx="62" cy="205" r="32" class="fg-good"/>
            <text x="62" y="201" text-anchor="middle" class="t-sm">Recip.</text>
            <text x="62" y="215" text-anchor="middle" class="t-sm">APC</text>
            <rect x="100" y="196" width="28" height="18" rx="3" class="fg-acc"/>
            <circle cx="114" cy="190" r="5" class="fg-dot-bad"/>
            <text x="114" y="176" text-anchor="middle" class="t-sm t-mut">self MHC</text>
            <circle cx="170" cy="205" r="30" class="fg-good"/>
            <text x="170" y="209" text-anchor="middle" class="t-sm">CD4</text>
            <text x="210" y="198" class="t-sm">donor MHC</text>
            <text x="210" y="216" class="t-sm">as peptide</text>
          </svg>
      - kind: explain
        remind: [neph.L09.148]
        page: 329
        title: "خطوات الـ rejection وأنواعه"
        quote: "s The kidney .Owen WF, Jr., Pereira BJG, Sayegh MH. W.B.Saunders Company 1st ed 2000, chapter 25, page 487-498.) Recognition of the alloantigen (direct, indirect). CD4+activation: cytokine production and clonal expansion. CD4+ t cell helper function to CD8 + cytotoxic cells, monocytes and macrophages and B cells. Effetor mechanisms of graft rejection: delayed type hypersensitivity, cell-mediated cytotoxicity,and alloantibody-mediated cytotoxicity."
        text: |
          الـ alloimmune response **قوي ومش محتاج priming**: T cells كتير جاهزة تتعرف على MHC غريب.

          **الخطوات**: recognition (direct أو indirect) ← **CD4 activation** (cytokines و clonal expansion) ← CD4 يساعد CD8 والـ macrophages والـ B cells ← effector: ==delayed-type hypersensitivity، cell-mediated cytotoxicity، alloantibody==.

          **قبل الزراعة**: ABO، cross-match، HLA typing، و **panel reactive antibodies (PRA)**.

          ليه الـ alloimmune response قوي كده؟ التفسير المقبول (مش في الكتاب): مع العدوى، نسبة صغيرة جدًا من الـ T cells بتتعرف على الميكروب. مع الـ MHC الغريب، نسبة كبيرة (حوالي 1–10%) بتتعرف عليه مباشرة، لأن الـ MHC الغريب بيشبه «self MHC + حاجة غريبة» لكتير من الـ T cells. عشان كده الرفض بيحصل من غير تطعيم سابق، ولازم immunosuppression قوي من أول يوم. وليه الـ PRA؟ لأنه بيقول نسبة الناس اللي العيان عنده antibodies ضدهم: PRA عالي = صعب تلاقي متبرع.
      - kind: figure
        page: 329
        title: "الـ direct والـ indirect زي ما الكتاب رسمهم"
        image: { file: neph/L09-allorecognition.webp, book: true }
        alt: "Two-panel diagram. A, direct allorecognition: a recipient alloreactive T cell recognises an intact allogeneic MHC molecule on a donor antigen-presenting cell from the graft. B, indirect alloantigen presentation: a recipient professional antigen-presenting cell takes up and processes allogeneic MHC, then presents the derived peptide on self MHC to an alloreactive T cell."
        caption: |
          الأصل اللي الرسمة اللي فوق مبسّطاه، لوحتين:

          - **A فوق (Direct allorecognition)**: خلية APC من الـ graft (الخضرا) عليها **allogeneic MHC**، والـ T cell بتاعة العيان (الحمرا) بتمسكه ==زي ما هو من غير processing==.
          - **B تحت (Indirect)**: الـ **APC بتاعة العيان** (الصفرا) بتاكل الـ MHC الغريب، تكسّره، وتعرض الـ peptide على ==self MHC== للـ T cell.

          اللي تاخده: الـ direct هو اللي بيشيل الـ acute rejection بدري (الـ donor APCs لسه موجودة)، والـ indirect بيفضل شغال طول العمر وبيرتبط بالـ chronic rejection.
      - kind: table
        page: 330
        quote: "Minutes to hours Preexisting antibodies (IgG) Intravascular thrombosis Hx of blood transfusion, transplantation or multiple pregnancies. Acute Rejection:"
        title: "أنواع الـ rejection"
        columns: [Type, Timing, Mechanism]
        rows:
          - ["Hyperacute", "Minutes–hours", "Pre-existing IgG, thrombosis"]
          - ["Acute", "Days–weeks", "CD4 + CD8, antibodies"]
          - ["Chronic", "6 months–years", "Fibrosis, arteriosclerosis"]
        hide: [[0, 1], [0, 2], [1, 1], [2, 2]]
      - kind: figure
        page: 330
        title: "الـ rejection تحت الميكروسكوب"
        image: { file: neph/L09-rejection-histology.webp, book: true }
        alt: "Two photomicrographs printed under the rejection types: on the left a glomerulus with red blood cells and fibrin filling its capillaries; on the right a low-power field of cortex with dense interstitial inflammatory cells between tubules."
        caption: |
          صورتين الكتاب حاططهم تحت أنواع الـ rejection من غير label:

          - **على الشمال**: glomerulus الـ capillaries بتاعته مليانة دم أحمر و fibrin: ده شكل الـ ==intravascular thrombosis== اللي في الـ hyperacute.
          - **على اليمين**: تكبير صغير: الـ interstitium مليان خلايا التهاب بين الـ tubules: ده شكل الـ ==cellular infiltrate== في الـ acute rejection.

          اللي تاخده: الـ hyperacute = antibodies جاهزة بتسد الأوعية في دقايق، والـ acute = T cells بتدخل النسيج في أيام لأسابيع (تفسير الصور مقبول، مش مكتوب تحتها في الكتاب).
      - kind: case
        page: 330
        quote: "Minutes to hours Preexisting antibodies (IgG) Intravascular thrombosis Hx of blood transfusion, transplantation or multiple pregnancies. Acute Rejection:"
        stem: "A woman with 4 pregnancies and many transfusions gets a kidney. One hour after reperfusion it turns blue and stops."
        steps:
          - question: "Type of rejection?"
            options: ["Hyperacute", "Acute cellular", "Chronic", "Recurrence"]
            answer: 0
            why: "دقايق لساعات + antibodies موجودة قبل كده (حمل ونقل دم) + thrombosis = hyperacute."
          - question: "Which pre-transplant test is meant to prevent this?"
            options: ["CDC cross-match", "Kt/V", "PET", "Doppler of the fistula"]
            answer: 0
            why: "الـ CDC cross-match قلّل الـ hyperacute rejection، ولازم يبقى سالب."
      - kind: try
        items: [neph.L09.137, neph.L09.140, neph.L09.142, neph.L09.148, neph.L09.151]
    recap:
      - "Class I (A، B، C) على كل الخلايا؛ class II على الـ APCs والـ lymphocytes. أهم 3: A و B و DRB1."
      - "HLA-DRB1*0401: أول رقمين serological، آخر رقمين PCR."
      - "CDC لازم سالب؛ acceptable mismatch = مش بيعمل CDC موجب. Luminex بيقيس الكمية."
      - "Hyperacute دقايق (antibodies موجودة)، acute أيام لأسابيع، chronic شهور لسنين."
    practice: [neph.L09.137, neph.L09.138, neph.L09.139, neph.L09.140, neph.L09.141, neph.L09.142, neph.L09.143, neph.L09.144, neph.L09.145, neph.L09.146, neph.L09.147, neph.L09.148, neph.L09.149, neph.L09.150, neph.L09.151, neph.L09.152, neph.L09.154, neph.L09.178]

  - id: neph.L09.lesson11
    title: "الـ immunosuppression وتمنه"
    hook: "تلات إشارات لازم توصل للـ T cell علشان يهاجم الكلية. كل دوا بيقطع واحدة، وكل قطع ليه تمن."
    minutes: 10
    pages: [331, 336]
    topics: [immunosuppression, is-complications]
    goals:
      - "تعرف مراحل الـ IS وأهداف الـ induction"
      - "تربط كل دوا بالإشارة اللي بيقطعها، وتعرف علاج الـ rejection"
      - "تعرف التمن: toxicity، عدوى حسب الشهر، وسرطانات"
    status: unverified
    steps:
      - kind: aside
        tone: exam
        page: 331
        quote: "Clinical significance of anti-HLA donor-specific antibodies: renal transplant recipients with positive flowcytometry cross-match but negative CDC cross-match have a significantly greater risk of antibody-mediated rejection (AMR) and early graft loss with a positive predictive value for predicting AMR of 83%. transplantation 2009; 87 (7): 1052. J Am Soc Nephrol 2001; 12 (12): 2807."
        text: |
          **Flow cross-match موجب + CDC سالب** = خطر ==antibody-mediated rejection (AMR)== و early graft loss أعلى بكتير، بـ positive predictive value (PPV) 83%. يعني الـ CDC السالب لوحده مش ضمان.
      - kind: figure
        page: 331
        quote: "Chronic rejection"
        title: "الـ chronic rejection"
        image: { file: neph/L09-chronic-rejection.webp, book: true }
        alt: "Low-power photomicrograph of graft cortex labelled chronic rejection: shrunken, atrophic tubules separated by widened pink fibrous interstitium."
        caption: |
          الصورة اللي مكتوب تحتها **Chronic rejection**:

          - **في كل الصورة**: tubules صغيرة ومنكمشة (==tubular atrophy==)، وبينها مسافات وردي واسعة: ==interstitial fibrosis==.
          - مفيش التهاب حاد كتير زي الـ acute.

          اللي تاخده: ده الـ chronic graft dysfunction اللي الكتاب بيقول إنه أساس فقدان الكلية على المدى الطويل: fibrosis و tubular atrophy و vasculopathy.
      - kind: explain
        remind: [neph.L09.155, neph.L09.156]
        page: 331
        title: "الـ immunosuppression"
        quote: "Sparing cyclosporine and tacrolimus nephrotoxicisty."
        text: |
          3 مراحل: **induction**، **maintenance**، و **anti-rejection**.

          **ليه induction؟** rejection prophylaxis، علاج subclinical rejection أو rejection مستخبي ورا الـ early graft dysfunction، ==تقليل الـ calcineurin inhibitor (CNI) nephrotoxicity==، و tolerance.

          **Kidney Disease: Improving Global Outcomes (KDIGO) 2011**: ==IL-2RA== (basiliximab) first-line (1B)؛ **lymphocyte-depleting** (ATG) لو high immunologic risk (2B).

          **البروتوكول**: CNI (ciclosporin، tacrolimus) + steroids + adjuvant (azathioprine، mycophenolate mofetil (MMF)، sirolimus) + induction antibody + calcium channel blocker (CCB) + prophylaxis (TMP-SMX، cytomegalovirus (CMV) antivirals). والـ **mechanistic target of rapamycin (mTOR) inhibitor (mTORi)** ما يبدأش إلا بعد ما الكلية تشتغل والجرح يلم (1B).

          ليه الـ induction في الأول بالذات؟ التفسير المقبول (مش في الكتاب): الأيام الأولى بعد الزراعة أخطر وقت: الـ APCs من المتبرع لسه موجودة، والكلية متعورة من الـ ischaemia فبتطلع إشارات خطر، والـ CNI لسه ما وصلش مستواه. فالـ induction بيغطي الفترة دي. وليه بيقلل الـ CNI toxicity؟ لأن الـ antibody بيحمي، فتقدر تأخر الـ CNI أو تديه بجرعة أقل لحد ما الكلية تشتغل. وليه ATG للـ high risk؟ لأنه بيمسح الـ T cells كلها، أقوى من الـ IL-2RA اللي بيقفل مستقبل واحد بس.
      - kind: figure
        page: 332
        title: "الـ three-signal model ومكان كل دوا"
        image: { file: neph/L09-three-signal.webp, book: true }
        caption: "**Signal 1** (antigen على الـ TCR ← calcineurin)، **signal 2** (costimulation CD28)، **signal 3** (IL-2 ← mTOR ← cell cycle). وكل دوا مكتوب جنب الخطوة اللي بيقفلها."
