  - id: geri.L01.lesson5
    title: "الـ heart failure: مين ومنين وإزاي تتأكد"
    hook: "نص العيانين بيموتوا في 5 سنين، حتى اللي شكلهم كويسين. يبقى لازم تشخّص صح وبدري."
    minutes: 9
    pages: [14, 19]
    topics: [hf-causes, hf-signs, hf-diagnosis]
    goals:
      - "تفرّق الـ systolic من الـ diastolic وأسبابهم"
      - "تعرف أرقام الـ prognosis"
      - "تمشي على الـ European Society of Cardiology (ESC) 2016 algorithm بالـ natriuretic peptides"
    status: unverified
    steps:
      - kind: explain
        page: 14
        title: "Systolic ضد diastolic"
        quote: "a. Systolic dysfunction: is present when the ejection fraction is less than 40% (normal ejection fraction: 55-60%)\n  Coronary artery disease (most common )\n  Hypertensive heart disease\n  Valvular heart disease:\n    Calcific degenerative aortic stenosis\n    Calcification of the mitral annulus\n    Cor pulmonale\n    Myocarditis\n    Thyroid disease\n    Tachy –or bradyarrhythmias\n    Idiopathic (diagnosis of exclusion )"
        text: |
          **6–10%** من اللي فوق 65 عندهم heart failure.

          **Systolic dysfunction:** ejection fraction (EF) ==أقل من 40%== (الطبيعي 55–60%). الأسباب:
          - **coronary artery disease (CAD)**: أشهر سبب
          - Hypertensive heart disease
          - Valves: **calcific aortic stenosis (AS)** و **mitral annulus calcification**
          - Cor pulmonale، myocarditis، thyroid
          - Tachy- أو brady-arrhythmias
          - Idiopathic، وده تشخيص بالاستبعاد

          **Diastolic heart failure (HF):** **30–50%** من الـ congestive heart failure (CHF) عندهم systolic function طبيعية. أكتر مع ==السن== وفي **الستات**، والـ asymptomatic أكتر من الـ symptomatic.
      - kind: update
        page: 14
        quote: "a. Systolic dysfunction: is present when the ejection fraction is less than 40% (normal ejection fraction: 55-60%)\n  Coronary artery disease (most common )\n  Hypertensive heart disease\n  Valvular heart disease:\n    Calcific degenerative aortic stenosis\n    Calcification of the mitral annulus\n    Cor pulmonale\n    Myocarditis\n    Thyroid disease\n    Tachy –or bradyarrhythmias\n    Idiopathic (diagnosis of exclusion )"
        text: "الـ ESC 2021 بيقسّم: **heart failure with reduced ejection fraction (HFrEF) ≤40%**، **heart failure with mildly reduced ejection fraction (HFmrEF) 41–49%**، **heart failure with preserved ejection fraction (HFpEF) ≥50%**. في الامتحان: الكتاب بيقول systolic = EF أقل من 40%."
        ref: "ESC heart failure guidelines, 2021"
      - kind: table
        page: 15
        quote: "Causes of Diastolic Dysfunction\nStructural Abnormalities\n  Hypertrophy\n  Fibrosis\n  Constriction\nFunctional Abnormalities\n  Ischemia\n  Calcium overload\n  ATP depletion"
        title: "أسباب الـ diastolic dysfunction"
        columns: [Type, Causes]
        rows:
          - [Structural, "Hypertrophy, fibrosis, constriction"]
          - [Functional, "Ischemia, calcium overload, ATP depletion"]
        hide: [[0, 1], [1, 1]]
      - kind: reveal
        page: 15
        quote: "Functional Abnormalities\n  Ischemia\n  Calcium overload\n  ATP depletion"
        prompt: "ليه الـ ischemia والـ ATP depletion بيبوّظوا الـ diastole نفسها، مش بس الـ systole؟"
        answer: |
          الـ **relaxation** عملية بتصرف طاقة: الـ calcium لازم يترجع للـ sarcoplasmic reticulum بمضخة (SERCA) شغالة بالـ **ATP**. من غير ATP، الكالسيوم يفضل جوه الخلية (**calcium overload**) والعضلة ما ترتخيش ← stiff ventricle.

          (تفسير فسيولوجي؛ الأسباب نفسها من الكتاب.)
      - kind: explain
        page: 15
        title: "الـ prognosis: ما تتخدعش"
        quote: "When heart failure symptoms are stabilised by current treatments, it may seem that patients are doing well, but the neurohormonal imbalance underlying heart failure is still silently occurring, resulting in disease progression."
        text: |
          - حوالي ==50%== بيموتوا خلال **5 سنين** من التشخيص، حتى مع أحسن علاج.
          - في رسمة الكتاب: **34%** من New York Heart Association (NYHA) I–II و **42%** من NYHA III–intravenous (IV) ماتوا.
          - السبب: الـ ==neurohormonal imbalance== شغال في السر حتى لو الأعراض اتظبطت.
          - الـ **sudden death** أشهر سبب للوفاة القلبية في الـ systolic HF (حوالي **45%**).
      - kind: aside
        tone: analogy
        page: 16
        quote: "The neurohormonal imbalance that causes the disease to progress is present in all heart failure patients, even in those who are considered asymptomatic (NYHA class I) or mildly symptomatic (NYHA class II)."
        text: "زي حنفية بتنقّط في شقة مقفولة: انت شايف الصالة نضيفة (NYHA I)، بس الميه بتبوّظ الأرضية من تحت. الحنفية دي هي الـ **neurohormonal imbalance**. علشان كده العلاج اللي بيقفل الحنفية، زي angiotensin-converting enzyme inhibitor (ACEI) و beta-blocker (BB) و mineralocorticoid receptor antagonist (MRA)، مهم حتى لو العيان مرتاح."
      - kind: table
        page: 16
        quote: "Classic physical findings of congestive heart failure\n  Vital signs:\n    Tachypnea.\n    Cheyne -Stokes Respiration\n  Heart:\n    S3 Gallop.\n    Normal Heart Sounds.\n  Neck:\n    Jugular venous distention.\n    Hepato -jugular reflux.\n  Chest:\n    Bibasilar rales.\n    Diffuse bubbling rales of pulmonary edema"
        title: "الكشف في الـ CHF"
        columns: [Region, Findings]
        rows:
          - [Vitals, "Tachypnea, Cheyne-Stokes"]
          - [Heart, "S3 gallop (or normal sounds)"]
          - [Neck, "Raised JVP, hepatojugular reflux"]
          - [Chest, "Bibasal rales, pulmonary edema, wheeze, effusion"]
          - [Abdomen, "Tender liver, ascites, sacral edema"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: figure
        page: 18
        title: "Kerley B lines من الكتاب"
        image: { file: geri/L01-kerley-b.webp, book: true }
        caption: "خطوط أفقية قصيرة عند الـ costophrenic angle: ده interstitial edema في الـ interlobular septa. واحدة من علامات الـ CHF على الـ X-ray."
        alt: "The book's chest X-ray close-up of the right lower zone showing short horizontal Kerley B lines at the lung periphery."
      - kind: explain
        page: 17
        title: "الـ chest X-ray"
        quote: "Classic finding of congestive heart failure on chest X-ray\n  Increased heart size-cardiothoracic ratio > 0.50.\n  Large hila with indistinct margins.\n  Prominence of superior pulmonary veins; cephalization of flow.\n  Fluid in interlobar fissures.\n  Pleural effusion.\n  Kerley's B lines.\n  Alveolar edema.\n  Peribronchial cuffing."
        text: |
          - **cardiothoracic ratio (CTR) >0.50**
          - Large hila with indistinct margins
          - ==Cephalization== (الأوردة اللي فوق باينة)
          - سوايل في الـ interlobar fissures
          - Pleural effusion
          - **Kerley B lines**
          - Alveolar edema
          - Peribronchial cuffing
      - kind: check
        page: 16
        quote: "Classic physical findings of congestive heart failure\n  Vital signs:\n    Tachypnea.\n    Cheyne -Stokes Respiration\n  Heart:\n    S3 Gallop.\n    Normal Heart Sounds.\n  Neck:\n    Jugular venous distention.\n    Hepato -jugular reflux.\n  Chest:\n    Bibasilar rales.\n    Diffuse bubbling rales of pulmonary edema"
        question: "PS (4): A 68-year-old woman with CHF stops breathing for ~10 s during sleep, then hyperventilates for ~10 s. Diagnosis?"
        options:
          - "Cheyne-Stokes breathing"
          - "Sleep apnea"
          - "Normal breathing"
          - "Biot's breathing"
        answer: 0
        why:
          - "صح: apnea بالتبادل مع hyperventilation بتعلى وتنزل في CHF = Cheyne-Stokes."
          - "الـ OSA فيه شخير ونوم مش مريح؛ هي صاحية مرتاحة."
          - "الـ apnea المتكررة مش طبيعية."
          - "الـ Biot's عشوائي، في إصابات الـ brainstem."
      - kind: figure
        page: 18
        quote: "Patient with suspected HF (non-acute onset) (ESC Guidelines 2016)\nAssessment of HF probability\n  1. Clinical history:\n    History of CAD (MI, revascularization)\n    History of arterial hypertension\n    Exposition to cardiotoxic drug/radiation\n    Use of diuretics\n    Orthopnoea / paroxysmal nocturnal dyspnoea\n  2. Physical examination:\n    Rales\n    Bilateral ankle oedema\n    Heart murmur\n    Jugular venous dilatation\n    Laterally displaced/broadened apical beat\n  3. ECG:\n    Any abnormality\nAll absent: HF unlikely: consider other diagnosis\n≥1 present: Natriuretic peptides\n  NT-proBNP ≥125 pg/mL\n  BNP ≥35 pg/mL\n  No: HF unlikely: consider other diagnosis\n  Yes: Echocardiography (assessment of natriuretic peptides not routinely done in clinical practice)\nEchocardiography normal: HF unlikely: consider other diagnosis\nIf HF confirmed (based on all available data): determine aetiology and start appropriate treatment"
        title: "الـ ESC 2016: إزاي تتأكد"
        alt: "Algorithm: suspected HF; assess probability by history, examination and ECG; if all normal HF unlikely; if one or more abnormal, measure natriuretic peptides; NT-proBNP at least 125 or BNP at least 35 pg/ml leads to echocardiography; if HF confirmed, find the cause and treat."
        caption: "لو الـ history والكشف والـ electrocardiogram (ECG) كلهم سليمين، الـ HF ==unlikely==. لو في حاجة واحدة، اعمل natriuretic peptides، ولو عاليين ← echo."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L01b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
