        page: 36
        quote: "Results\nIllustrations\nFor purposes of publication:\nIf a figure has been published, the original source has to be acknowledged and a written permission from the copyright holder to reproduce the material should be submitted.\nIf photographs of people are used, either the subjects must not be identifiable or their pictures must be accompanied by written permission to use the photographs."
