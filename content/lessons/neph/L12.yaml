          - **الأخضر (المية)**: الكتاب بيقول الـ hydration بيحافظ على ==tubular flow==، فاللي اتعمل يتخفف ويتغسل قبل ما يترسب.

          ولو الكلية وقفت خلاص: الـ hemodialysis بيشيله من الدم مباشرة.
