          - "الـ monocyte activation رقم 4، وبيطلّع IL-1 و IL-6."
          - "الـ mast cell degranulation رقم 5، وبيعمل permeability وانقباض smooth muscle."
      - kind: figure
        page: 117
        quote: "Terminal components of the complement cascade: C5b, C6, C7, C8, and C9 bind to each other and form a MAC (membrane attack complex). A large transmembrane channel is created that disrupts the membrane and enables ions and small molecules to diffuse freely and results in cell lysis."
        title: "بناء الـ MAC"
        alt: "Four stages along a membrane. C5b binds the surface. C6 and C7 join. C8 inserts into the membrane. Many C9 molecules polymerise into a ring, poly-C9, forming a channel; water and ions flow in and the cell lyses."
        caption: "==C5b + C6 + C7 + C8 + poly-C9== = ماسورة في الغشا. المية والأيونات تدخل، والخلية تنفجر."
