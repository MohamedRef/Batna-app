  # ---------- cases ----------
  - id: hem.L04.064
    kind: case
    topic: blood-film
    stem: A 66-year-old man has had weight loss and back pain for 2 months. He looks pale.
    steps:
      - reveal: "CBC: Hb 9 g/dL, WBC 13,000/mm³, platelets 110,000/mm³. Film: band forms, myelocytes and nucleated red cells."
        question: What is this blood picture?
        options: [Leukoerythroblastic picture, Simple shift to the left, Leukemoid reaction only, Toxic granulation]
        answer: 0
        why: "Left shift plus nucleated RBCs = leukoerythroblastic (p66). A simple left shift has no nucleated RBCs. A leukemoid reaction is an excessive leukocytosis; 13,000 is modest. Toxic granulation is a granule change."
      - reveal: "Bone scan shows many sclerotic spots in the spine. PSA is very high."
        question: Which cause of a leukoerythroblastic film fits?
        options: [Metastatic neoplasm in the marrow, Osteopetrosis, Severe hemolysis, Miliary tuberculosis]
        answer: 0
        why: "Marrow infiltration by metastatic cancer is the first listed cause (p66). Osteopetrosis is a congenital bone disease. There is no evidence of hemolysis. No TB features."
      - reveal: "In another patient, a film shows WBC 55,000/mm³ with promyelocytes and myelocytes during severe pneumonia, which settles with antibiotics."
        question: What was that?
        options: [Leukemoid reaction, Chronic myeloid leukemia, Leukoerythroblastic picture, Pseudo-Pelger-Huët]
        answer: 0
        why: "A reactive excessive leukocytosis with immature cells is a leukemoid reaction; severe infection is its first cause (p66). CML would not settle with antibiotics. No nucleated RBCs. Pseudo-Pelger is a myelodysplasia change."
    src: { page: 66, quote: "Leukoerythroblastic picture: a presence of a shift to left plus nucleated RBC in the peripheral blood." }
    status: unverified
