- id: res.L19.016
  kind: card
  topic: why
  front: What is information mastery, and how is the usefulness of medical information calculated?
  back: Information mastery is the search for sources of information that are high in relevance and validity and low in work.
    Usefulness of medical information = (relevance × validity) / work. Relevance is the extent to which the research paper
    matches your information need for the care of your patient.
