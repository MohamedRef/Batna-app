        answer: |
          ارجع لـ ص 280: الكتاب قالك إن الستات عندهم ==less new bone formation==، فالـ AS عندهم صعب يتشخّص بالـ X-ray.

          يعني ست عندها نفس المرض بس العضم ما اتغيّرش في الصورة، فتتصنّف **nr-axSpA** مش AS. وده يفسّر كمان ليه الـ nr-axSpA فيه **structural changes أقل**، و **CRP و MRI inflammation أقل** من الـ AS (الكتاب)، ومع ذلك الـ **disease burden زي الـ AS**: الوجع موجود حتى لو الصورة سليمة.
      - kind: reveal
        page: 295
        quote: "Some studies consider them as two possible stages of one disease. However, it is also known that not all nr-axSpA patients progress to AS."
        prompt: "هل الـ nr-axSpA هو early AS وخلاص؟"
        answer: |
          الكتاب بيقول الاتنين: فيه دراسات بتعتبرهم ==two possible stages of one disease==، بس كمان معروف إن ==not all nr-axSpA patients progress to AS==؛ اللي بيتحولوا **5–30%** على 2–30 سنة.

          يعني ما تقولش للعيان "انت هتبقى AS أكيد"، ولا "انت مش عندك حاجة لأن الصورة سليمة". العلاج **نفس علاج الـ AS** لأن الوجع والـ burden واحد. ونفس الفكرة في الـ **uSpA**: الكتاب بيقول ممكن يكون early AS، والـ data الأحدث بتقول ممكن يكون مرض لوحده.
      - kind: explain
        page: 296
        title: "علاجه"
        quote: "In March 2019, the US Food and Drug Administration (FDA) approved certolizumab (Cimzia) for treatment of nr-axSpA. Other TNFi are used off label."
        text: |
          ==نفس علاج الـ AS==.

          الـ US Food and Drug Administration (FDA) وافقت على ==certolizumab== في **مارس 2019** (والـ TNF inhibitor (TNFi) التانيين off label)، وبعدين ixekizumab و secukinumab و upadacitinib.

          ليه نفس العلاج؟ لأن الـ signs والـ symptoms مش مختلفة عن الـ AS (ص 295)، والـ burden زيه.
      - kind: explain
        page: 296
        title: "الـ undifferentiated SpA"
        quote: "Undifferentiated spondyloarthropathy is a syndrome with features consistent with the spondyloarthropathies, but affected patients do not fulfill criteria for any specific spondyloarthropathy."
        text: |
          عنده ملامح SpA بس ==مش بيكمّل criteria== أي نوع. ممكن يكون early AS أو entity لوحده.

          **الأرقام**: Inflammatory back pain (IBP) **90%**، buttock pain 80%، **enthesitis 75%**، fatigue 55%، peripheral arthritis 40%، erythrocyte sedimentation rate (ESR) 32%، **HLA-B27 25% بس**، dactylitis 20%، uveitis 1-2%.

          **العلاج**: أكتر من 75% محتاجين علاج طويل؛ أغلبهم بيستجيبوا للـ non-steroidal anti-inflammatory drugs (NSAIDs)، والباقي زي الـ AS.

          يعني ده مش AS ناقص صورة: الـ HLA-B27 هنا 25% بس، وأغلبهم بيرتاحوا بالـ NSAIDs.
