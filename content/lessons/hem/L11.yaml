      - kind: explain
        page: 178
        quote: "Bone pain\n  In the back or chest\n  In more than two thirds of patients.\n  Usually worsened by movement\n  Pathological fracture\n  Kyphosis and loss of height may occur from vertebral compression fractures.\nAnemia\n  Pallor is the most frequent physical finding.\n  Weakness and fatigue are common"
        title: "B و A: العضم والدم"
        text: |
          - ==Bone pain== في **الضهر أو الصدر**، عند **أكتر من تلتين** المرضى، و**بيزيد مع الحركة**.
          - **Pathological fracture**، و **vertebral compression fractures** بتعمل **kyphosis** ونقص في الطول.
          - **Anaemia**: الـ **pallor** أشهر علامة في الكشف، ومعاها weakness و fatigue.

          ليه الضهر والصدر؟ التفسير المقبول (مش في الكتاب): الـ myeloma بيعيش في الـ **red marrow**، وفي الكبير الـ red marrow في الـ axial skeleton (الفقرات، الضلوع، القص، الحوض)، زي ما شفت في المحاضرة 1. وليه بيزيد بالحركة؟ لأن العضم المخروم بيشيل وزن، وكل حركة بتضغط على كسور صغيرة. ده عكس وجع الـ metastasis اللي غالبًا بيزيد بالليل.
      - kind: explain
        page: 179
        quote: "Fever\nUpper respiratory tract and sinus infections are the most common\nencapsulated organisms such as Streptococcus pneumoniae predominate\nresults from impairment of antibody response, reduction of normal immunoglobulins (immune paresis), neutropenia, and treatment with glucocorticoids"
        title: "الحرارة: ليه العدوى؟"
        text: |
          المفارقة: الـ immunoglobulin عالي جدًا، بس المريض ==immune paresis==. الـ clone واخد المكان، والـ antibodies الطبيعية قليلة.

          - أشهر حاجة: **upper respiratory tract و sinus infections**.
          - الـ **encapsulated organisms** (زي Streptococcus pneumoniae) بتغلب، لأن الـ capsule محتاجة antibodies علشان تتشال.
          - كمان neutropenia و glucocorticoids.
      - kind: check
        page: 179
        quote: "Upper respiratory tract and sinus infections are the most common\nencapsulated organisms such as Streptococcus pneumoniae predominate"
        question: "Why do myeloma patients get pneumococcal infections despite a very high total immunoglobulin?"
        options: ["Normal polyclonal antibodies are reduced (immune paresis)", "The paraprotein attacks and destroys neutrophils", "Complement is consumed by amyloid deposits", "T cells are destroyed by high IL-6 levels"]
        answer: 0
        why:
          - "صح: البروتين العالي كله من clone واحد، والـ antibodies الطبيعية قليلة."
          - "الـ paraprotein مش بيهاجم الـ neutrophils؛ الـ neutropenia من فشل النخاع."
          - "الكتاب مذكرش complement consumption."
          - "الـ IL-6 بيغذي الـ myeloma، مش بيقتل T cells."
      - kind: explain
        page: 179
        quote: "The major causes of renal failure are dehydration, and hypercalcemia, precipitated monoclonal light chains in the distal and collecting tubules."
        title: "R: الكلية"
        text: |
          الـ **myeloma kidney** (light-chain nephropathy). الأسباب الأساسية:

          - **Dehydration** و ==hypercalcemia==.
          - الـ **light chains** بتترسب في الـ ==distal and collecting tubules== وتسدها (casts).
          - **Hyperuricemia** بتساعد.
          - **Amyloidosis**: nephrotic syndrome أو renal insufficiency أو الاتنين.
          - **Acquired Fanconi's syndrome**.

          التفسير المقبول (مش في الكتاب) للربط: الـ calcium العالي بيخلّي الكلية ما تعرفش تركّز البول، فالمريض يتبوّل كتير ويتجفف. والجفاف بيركّز الـ light chains في الـ tubules فتترسب أسرع. يعني الـ C والـ dehydration والـ light chains بيشتغلوا مع بعض.
      - kind: reveal
        page: 179
        quote: "\"Myeloma kidney\" (light-chain nephropathy),\nThe major causes of renal failure are dehydration, and hypercalcemia, precipitated monoclonal light chains in the distal and collecting tubules."
        prompt: "ليه بنقول لمريض الـ myeloma اللي عنده Bence Jones يشرب كتير (3 لتر بول في اليوم)؟"
        answer: |
          الكتاب في الـ supportive care بيقول **high urine output (3 L/day)** عشان **prevent renal failure in patients with Bence Jones proteinuria** (ص 184).

          والسبب من الصفحة دي: الـ light chains بتترسب في الـ ==distal and collecting tubules==، والـ dehydration من أهم أسباب الفشل. بول كتير = light chains **مخففة** ومش واقفة في الأنبوبة، فما تلحقش تترسب.
      - kind: explain
        page: 179
        quote: "Radiculopathy (the most frequent neurologic complication). It results from compression of the nerve by the expansion of the vertebral lesion or by the collapse of bone. usually in the thoracic or lumbosacral area. Peripheral neuropathy due to amyloidosis."
        title: "الأعصاب والـ viscosity"
        text: |
          - ==Radiculopathy== أشهر neurologic complication: الـ vertebral lesion بتكبر أو العضمة بتقع وتضغط على العصب، غالبًا **thoracic أو lumbosacral**.
          - **Peripheral neuropathy** من الـ amyloidosis.
          - **Hyperviscosity** نادر جدًا: mental slowing، visual upset، purpura، haemorrhage. الكتاب بيقول مع Immunoglobulin A (IgA) و Immunoglobulin G subclass 4 (IgG4).

          ليه الـ hyperviscosity نادر رغم إن البروتين عالي؟ التفسير المقبول (مش في الكتاب): الـ IgG العادي جزيء صغير نسبيًا ومش بيلزق في بعضه، فمحتاج كميات ضخمة عشان يتقّل الدم. أما الـ IgA فبيتجمّع (polymers)، فبيتقّل بكمية أقل.
      - kind: update
        page: 179
        quote: "Symptomatic hyperviscosity (mental slowing, visual upset, purpura, haemorrhage), in (IgA and IgG4)."
        text: "معظم المراجع بتقول IgG3 (مش IgG4) هو الـ subclass اللي بيعمل hyperviscosity، مع IgA و Immunoglobulin M (IgM). في الامتحان اكتب إجابة الكتاب: IgA و IgG4."
        ref: "Hoffbrand's Essential Haematology, 8th ed. (2019)"
      - kind: check
