      - kind: explain
        page: 36
        quote: "Clinical manifestations of chronic kidney disease\nIntegumentary: Bruises, pruritus, dry skin, skin color changes ashen gray to yellowish, dry brittle hair and nails\nCardiovascular: High blood pressure, increased heart rate, dysrhythmias, electrocardiographic changes, abnormal heart sounds, retinopathy, fluid retention with peripheral edema and/or pulmonary edema\nImmune: Increased risk of infection\nRespiratory: Increased respiratory rate, Kussmaul respirations, crackles, decreased PO2\nMusculoskeletal: Renal osteodystrophy, decreased calcium, vitamin D impairment, hyperparathyroidism, pathological fractures\nRenal: Decreased urine output, azotemia, proteinuria, hematuria, hyperuricemia\nGastrointestinal: Anorexia, nausea, vomiting, halitosis, metallic taste in mouth, bleeding in gastrointestinal tract\nNeurological: Peripheral neuropathy, restless legs, change in level of consciousness, lethargy, confusion, encephalopathy, altered motor function\nHematological: Anemia, weakness, fatigue, pallor, lethargy, bleeding due to impaired platelet aggregation"
        title: "كل علامة ليها سبب"
        text: |
          رسمة ص 36 بتلف على الجسم كله. التفسير المقبول (مش في الكتاب) للعلامات الكبيرة:

          - **Kussmaul respiration**: الـ metabolic acidosis، والرئة بترمي CO2 تعوّض (فاكر L01؟).
          - **Pruritus** و **ashen-yellow skin**: phosphate و PTH عاليين وسموم الـ uremia، ولون الجلد من صبغات البول المحبوسة مع الأنيميا.
          - **Metallic taste** و **halitosis**: الـ urea في اللعاب بتتكسر لـ ammonia.
          - **Bleeding tendency**: الـ uremia بتبوّظ شغل الـ platelets.
          - **Renal osteodystrophy** و **fractures**: phosphate محبوس و vitamin D قليل، فالـ PTH يعلى.
          - **Anemia**: الكلية هي مصنع الـ ==erythropoietin==.
          - **Infection**: الـ ==uremia== بتضعف المناعة.
          - **Peripheral neuropathy** و **restless legs**: سموم الـ uremia على الأعصاب.
