  - id: res.L12.033
    kind: card
    topic: control
    front: "What is stratification (stratified analysis)?"
    back: "Dividing the subjects into categories (strata) of the possible confounder and calculating the measure of risk for each stratum as well as the overall one."
    src: { page: 23, quote: "1. Stratification\nDivide up the subjects into different categories (strata) of the possible confounders. Calculate the measure of risk for each stratum as well as the overall one.\nIf sex is might be a confounder: Calculate the overall risk in the study group the calculate the risk among males and that among females. If the are widely different, then sex act as a potential confounder." }
    status: unverified
    tags: [high-yield]
  - id: res.L12.034
    kind: mcq
    topic: control
    stem: "The overall risk in a study is calculated, then the risk among males and among females. The two are widely different. This means:"
    options:
      - "Sex acts as a potential confounder"
      - "Sex is the exposure"
      - "There is selection bias"
      - "The sample size is too small"
    answer: 0
    why:
      - "The slide: if they are widely different, sex acts as a potential confounder."
      - "Sex is the stratifying (third) variable here, not the exposure."
