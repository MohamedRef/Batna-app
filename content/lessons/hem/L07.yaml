  - id: hem.L07.lesson4
    title: "علاج AML وAPL: 3 + 7 وما بعدها"
    hook: "تلات أيام anthracycline وسبعة Ara-C، وبعدين المعركة الحقيقية: إن المرض ما يرجعش."
    minutes: 10
    pages: [111, 114]
    topics: [aml-induction, aml-postremission, apl, supportive]
    goals:
      - "تكتب الـ 3 + 7 بالجرعات"
      - "تعرف الـ post-remission options ومين ياخد allogeneic"
      - "تعرف علاج الـ APL من الـ induction للـ maintenance"
    status: unverified
    steps:
      - kind: explain
        page: 111
        title: "الـ 3 + 7"
        quote: "Cytosine-anabinoside 100 mg/m2/day, IVI for 7 days."
        text: |
          الـ **remission induction** في AML:
          - ==Cytosine arabinoside== **100 mg/m2/day** IV infusion لمدة **7 أيام**
          - ==Adriamycin== **25–30 mg/m2** أيام 1، 2، 3 (أو 5، 6، 7)

          ممكن بدل الـ Adriamycin: **daunorubicin 45**، **idarubicin 8–12**، أو **mitoxantrone 12 mg/m2** أيام 1–3.
      - kind: aside
        tone: tip
        page: 111
        quote: "Adriamycin 25-30 mg/rn2. Days 1, 2, and 3 or days 5, 6, and 7."
        text: "**3** = أيام الـ anthracycline، **7** = أيام الـ Ara-C. والـ Ara-C جرعتها **100**: رقم سهل، ولمدة أسبوع."
      - kind: update
        page: 111
        quote: "Cytosine-anabinoside 100 mg/m2/day, IVI for 7 days."
        text: "النهارده الـ 7 + 3 بتستخدم daunorubicin **60–90 mg/m2** أو idarubicin 12. في الامتحان اكتب جرعات الكتاب."
        ref: "ELN 2022 AML recommendations"
      - kind: table
        page: 112
        quote: "Oral hydroxyurea or etoposide or low dose cytarabine 10 mg/m2 S.C. daily."
        title: "Induction حسب العيان"
        columns: [Patient, Induction]
        rows:
          - ["Standard", "3 + 7"]
          - ["Alternative (modified ICE)", "Ara-C × 7 + Adriamycin days 1, 3, 5 + etoposide 100 mg/m2 days 1–5"]
          - ["Elderly", "Ara-C 100 mg/m2 × 5 days + Adriamycin 25 mg/m2 once"]
          - ["High WBC or high-risk elderly", "Oral hydroxyurea, etoposide, or low-dose Ara-C 10 mg/m2 SC daily"]
        hide: [[2, 1], [3, 1]]
      - kind: figure
        page: 112
        quote: "Patients under the age of 60 have three main options"
        title: "خريطة علاج الـ AML"
        alt: "A vertical flow: induction 3 + 7, then a day-14 marrow. If there is no complete remission, a day-28 marrow and a second induction. Once in complete remission, three options for patients under 60: intensive consolidation, autologous HSCT, or allogeneic HSCT for unfavourable cytogenetics."
        caption: "الـ induction بيوصلك للـ CR، والـ ==post-remission== هو اللي بيمنع الرجوع."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L07d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="75" y="10" width="180" height="40" rx="10" class="fg-acc"/>
            <text x="165" y="35" text-anchor="middle" class="t-sm t-b">Induction 3 + 7</text>
            <path d="M165 50 L165 72" class="fg-arrow" marker-end="url(#L07d)"/>
            <rect x="75" y="75" width="180" height="40" rx="10" class="fg-box"/>
            <text x="165" y="100" text-anchor="middle" class="t-sm t-b">Day-14 marrow</text>
