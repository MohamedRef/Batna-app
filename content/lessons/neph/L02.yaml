        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 53
        quote: "Glucose-lowering therapies in patients with T2D and CKD"
        title: "أدوية السكر: ليه الأرقام دي؟"
        text: |
          الرسمة في ص 53 (**glucose-lowering therapies**): **lifestyle** الأول، وبعدين **metformin + SGLT2i** first-line، والـ **GLP-1 RA** المفضّل لو محتاج دوا زيادة.

          التفسير المقبول (مش في الكتاب):

          - الـ ==metformin== بيطلع من الكلية. لما الـ eGFR يقل بيتجمع ويزوّد خطر الـ **lactic acidosis**، علشان كده **قلّل تحت 45 ووقّف تحت 30**.
          - الـ **SGLT2i** مابيتبدأش تحت 20 لأن فايدته على السكر والكلية مااتثبتتش هناك، بس لو بدأ قبلها يكمّل.
          - الـ **GLP-1 RA** بينزّل السكر والوزن ومالوش خطر hypoglycaemia كبير ومابيتجمّعش في الكلية.
          - كل الاختيارات حسب رأي المريض، الأمراض التانية، الـ eGFR والتكلفة (الكتاب).
