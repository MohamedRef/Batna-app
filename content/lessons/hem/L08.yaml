        text: |
          - **Ph-negative CML**: مفيهاش basophilia ولا blasts، فيها **dysplasia**، والـ survival ==أوحش== من الـ Ph-positive.
          - **Chronic myelomonocytic leukaemia (CMML)**: رجالة كبار، **monocytosis**، platelets واطية، ومفيش basophils ولا eosinophils.
