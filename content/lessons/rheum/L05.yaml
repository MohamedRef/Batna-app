      - kind: explain
        page: 81
        title: "ليه الـ relative risk مش يقين؟"
        quote: "The incidence of a particular autoimmune disease is often greater in individuals who inherit a particular HLA allele(s) than in the general population. This increased incidence is called relative risk of HLA disease association."
        text: |
          الكتاب بيعرّف الـ relative risk إنها **incidence أعلى** في اللي ورثوا الـ allele، مش إن كلهم هيجيلهم المرض.

          التفسير المقبول (مش في الكتاب): حتى الـ B27 بـ RR 90، أغلب اللي شايلين الـ B27 عمرهم ما بيجيلهم ankylosing spondylitis. يعني الجين بيفتح الباب بس، ومحتاج حاجة تزقّك منه. وده بالظبط اللي الكتاب قاله في صفحة 79: **susceptibility genes** + **environmental triggers** مع بعض.

          وعشان كده الـ HLA test لوحده مايشخّصش، هو بيرجّح تشخيص في مريض عنده الصورة الإكلينيكية.
      - kind: explain
        remind: [rheum.L05.033]
        page: 81
        title: "العدوى"
        quote: "Infections may activate self reactive lymphocytes and lead to the development of autoimmune diseases."
        text: |
          الـ ==infections== بتعمل autoimmunity بأكتر من طريقة:
          - **تنشّط self-reactive lymphocytes**.
          - **تعوّر الأنسجة** وتطلّع **sequestered antigens** عمر المناعة ما شافتها، زي **العين والـ testis**.
          - تعمل **inflammation** و **aberrant expression of costimulators**.
          - **Cross-reaction** بين الـ microbial antigens والـ self antigens.
