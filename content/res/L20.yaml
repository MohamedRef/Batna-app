- id: res.L20.011
  kind: enumerate
  topic: structure
  prompt: What are the four main elements of the introduction in critical appraisal?
  points:
  - Article identifiers
  - Study type / PICO(T)
  - A review of the medical literature
  - Methods (study design)
  hook: '«مين، إيه، ليه، إزاي»: مين كتبها (identifiers)، إيه نوعها (study type/PICO)، ليه اتعملت (literature review)، وإزاي اتعملت (methods).'
  pass: 4
  tags:
  - high-yield
  src:
    page: 7
    quote: "In order to dissect a journal article, one should divide it into three main sections: the introduction, discussion, and conclusion.\nThe introduction should further encompass four main elements:\n\
      Article identifiers\nstudy type/PICO(T)\nA review of the medical literature"
  status: unverified
- id: res.L20.012
  kind: mcq
  topic: structure
  stem: In critical appraisal of a journal article, which of the following is NOT an element of the introduction section?
  options:
  - Article identifiers
  - PICO question
  - Results
  - A review of the medical literature
  - Methods (study design)
  answer: 2
  why:
  - Identifiers open the introduction.
  - The study type and PICO(T) are the second element of the introduction.
  - 'Right: results belong to the discussion.'
  - The literature review is the third element.
  - Methods (study design) close the introduction.
  src:
    page: 8
    quote: "In critical appraisal of a journal article, which of the following is NOT an element of the introduction section?\nA. Article identifiers\nB. PICO question\nC. Results\nD. A review of the medical\
      \ literature\nE. Methods (study design)\nC"
  status: unverified
