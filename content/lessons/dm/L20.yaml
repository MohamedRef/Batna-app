  - id: dm.L20.lesson3
    title: "أدوية تعلّي الـ HDL: نجاحات وفضايح"
    hook: "دوا علّى الـ HDL 106% وزوّد الوفيات 60%. قصة الـ HDL therapy فيها دروس أكتر من الأرقام."
    minutes: 9
    pages: [256, 259]
    topics: [drugs, apoa1, efflux, cetp]
    goals:
      - "تحفظ جدول niacin و fibrates و statins"
      - "تقسم العلاجات الجديدة لـ 3 طرق"
      - "تعرف مشاكل الـ glitazars والـ CETP inhibitors"
    status: unverified
