ing Sunitinib |\n|  | Immune modulators | 1. ↓TSH, ↑FT4 | Graves' disease has been reported in patients receiving: (i) Alemtuzumab (a humanised monoclonal antibody directed against CD52) for multiple sclerosis; (ii) HAART for HIV infection; (iii) INFα for chronic hepatitis C |\n|  |  | 2. ↑TSH, ↓FT4 | Hashimoto's thyroiditis may complicate INFα therapy (± prodromal thyrotoxic phase) |" }
