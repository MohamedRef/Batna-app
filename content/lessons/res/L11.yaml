      - "Proportional allocation: n(h) = n × N(h)/N. Equal allocation محتاجة weighting في التحليل."
      - "Cluster: مجموعات كاملة random؛ كل cluster mini-population. أرخص، بس sampling error أعلى."
      - "Multistage: مراحل متداخلة (محافظة ← مركز ← قرية ← شخص)، وميزته الـ flexibility."
