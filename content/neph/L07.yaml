  - id: neph.L07.150
    kind: enumerate
    topic: alport
    prompt: State the major features of Alport syndrome.
    points:
      - Hematuria
      - Progressive nephritis with proteinuria and declining renal function
      - Sensorineural deafness
      - Ocular abnormalities
    pass: 4
    hook: "Alport = «بول، كلية، ودن، عين»: hematuria، progressive nephritis (proteinuria والوظايف بتقع)، sensorineural deafness، وocular abnormalities."
    src: { page: 178, quote: "Alport syndrome (AS) is a generalized, inherited disorder of basement membranes caused by mutations affecting specific proteins of the type IV (basement membrane) collagen family. The major features of AS are hematuria, progressive nephritis with proteinuria and declining renal function, sensorineural deafness, and ocular abnormalities. AS is a rare disease, affecting approximately 1 in 50,000 people and is seen in all ethnicities and races. AS accounts for approximately 0.5% of adults and 1.7% of children with end-stage renal disease (ESRD) in the United States.¹" }
    status: unverified
    tags: [high-yield]
