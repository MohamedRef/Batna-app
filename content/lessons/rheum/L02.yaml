        alt: "Book figure from page 50. Left: a needle-shaped monosodium urate crystal inside a neutrophil under compensated polarized light, labelled yellow, with the planes of the polariser, analyser and slow vibration marked. Middle: many yellow and blue needles on a pink background. Right: a single blue rhomboid crystal."
      - kind: table
        page: 49
        quote: "In acute pseudogout examination of synovial fluid using compensated polarized microscopy demonstrates CPPD crystals-weakly positive birefringent rhomboid shaped crystals."
        title: "Gout ضد pseudogout"
        columns: ["", "Gout", "Pseudogout"]
        rows:
          - ["Crystal", "MSU", "CPPD"]
          - ["Birefringence", "Negative", "Weakly positive"]
          - ["Shape", "Needle", "Rhomboid"]
          - ["Joint", "First MTP", "Knee"]
          - ["Patient", "Man 40-50", "Woman 65-75"]
          - ["Attack", "5-14 days", "1-3 weeks"]
        hide: [[1, 2], [2, 2], [3, 2]]
      - kind: aside
        tone: tip
        page: 49
        quote: "In acute pseudogout examination of synovial fluid using compensated polarized microscopy demonstrates CPPD crystals-weakly positive birefringent rhomboid shaped crystals."
        text: "Pseudogout = «P» لـ Positive و Pyrophosphate و Parallelogram (rhomboid). Gout = Needle و Negative. وفي الـ pseudogout الـ fluid بيكون turbid و blood stained، فماتتلخبطش وتقول haemarthrosis."
      - kind: explain
        page: 49
        quote: "Gram stain and culture of the fluid to exclude sepsis."
        title: "التحاليل: كل واحد ليه"
        text: |
          - **Synovial fluid تحت compensated polarized microscopy**: البلورة weakly positive rhomboid. ده **التأكيد**.
          - السايل **turbid و blood stained**.
          - ==Gram stain و culture==: عشان الـ DD الأول هو الـ sepsis، والمريض كبير وعنده fever، فماينفعش تكتفي بالبلورة.
          - **Radiographs**: chondrocalcinosis.
          - **Metabolic screening** (calcium، alkaline phosphatase، liver function)، **خصوصًا في الـ early-onset polyarticular disease**.

          ليه الصغير بالذات؟ عشان الـ primary شائع في الكبار. لو مريض صغير عنده CPPD في مفاصل كتير، الأقرب إن فيه **سبب metabolic** (hyperparathyroidism، haemochromatosis) لازم يتلاقى.
      - kind: case
        page: 49
        quote: "Metabolic screening (serim calcium, alkaline phosphatase, liver function-esp in early onset polyarticular disease."
        stem: "A 46-year-old man has recurrent acute arthritis of both knees and a wrist. X-ray: chondrocalcinosis of the menisci and the triangular ligament."
        steps:
          - question: "What does early-onset polyarticular CPPD call for?"
            options: ["A metabolic screen", "Urate-lowering therapy", "HLA-B27"]
            answer: 0
            why: "Metabolic screening (calcium، alkaline phosphatase، liver function) خصوصًا في الـ early-onset polyarticular."
          - reveal: "Ferritin and transferrin saturation are very high."
            question: "Likely cause?"
            options: ["Haemochromatosis", "Wilson's disease", "Hypothyroidism"]
            answer: 0
            why: "الحديد العالي = haemochromatosis، واحد من الأسباب الـ metabolic."
      - kind: explain
        remind: [rheum.L02.135]
        page: 50
        quote: "Management\n  For acute pseudogout = aspiration reduces pain and alone may be sufficient.\n  Intra-articular steroid injection.\n  Oral NSAID.\n  Early mobilization.\n  Chronic arthropathy same as OA."
        title: "العلاج"
        text: |
          - ==Aspiration==: بيخفف الوجع، وممكن **لوحده يكفي**.
          - **Intra-articular steroid**.
          - **Oral non-steroidal anti-inflammatory drugs (NSAID)**.
          - **Early mobilization**.
          - الـ chronic arthropathy: **زي الـ OA**.

          ومفيش «urate-lowering therapy (ULT)» للـ CPPD: مفيش دوا بيشيل البلورة دي.

          التفسير المقبول (مش في الكتاب): ليه الـ aspiration لوحده ممكن يكفي؟ عشان بيطلّع السائل المليان بلورات و neutrophils، فالضغط والالتهاب ينزلوا مع بعض. والـ NSAIDs بحذر عشان المريض غالبًا كبير وكليته أضعف. ومفيش ULT عشان مفيش دوا بيذوّب بلورات الـ CPP، فالعلاج كله للالتهاب والوظيفة.
