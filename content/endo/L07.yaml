  - id: endo.L07.090
    kind: table
    topic: pheo
    title: Nitroprusside in resistant hypertension of pheochromocytoma
    columns: [Point, Detail]
    rows:
      - [Action, Arteriolar and venous dilator]
      - [Dose, "0.25-0.5 µg/kg/min; max 8-10 µg/kg/min"]
      - [Duration, "Under 5 min, so hypotension reverses on stopping"]
      - [Target, "Diastolic about 100 mmHg; systolic drop ≤25%"]
      - [Limit, "Brief use only, due to possible cyanide toxicity"]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 136, quote: "Treatment of resistant hypertension is with intravenous infusion of nitroprusside (arteriolar and venous dilator), at a dose of 0.25–0.5 μg/kg per minute; maximum dose: 8–10 μg/ kg per minute.\nIts duration of action is less than 5 minutes.\n  Thus, hypotension can be easily reversed by temporarily discontinuing the infusion.\n  The aim is to reduce diastolic blood pressure to around 100 mm Hg and systolic should be dropped by not more than 25%.\n  The use of nitroprusside should be brief, due to possible cyanide toxicity." }
