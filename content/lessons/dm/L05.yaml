  # ------------------------------------------------------------------
  - id: dm.L05.lesson4
    title: "العلاج على سلم Wagner"
    hook: "من نصيحة «اقطع ضوافرك مستقيم» لحد «احفظ الركبة»: كل درجة في Wagner ليها خطة."
    minutes: 10
    pages: [60, 65]
    topics: [investigations, prevention, treatment, amputation]
    goals:
      - "تعرف الـ investigations"
      - "تحفظ نصايح الـ foot care"
      - "تعالج كل Wagner grade"
      - "تعرف دواعي البتر واللي بعده"
    status: unverified
    steps:
      - kind: explain
        page: 60
        title: "الـ investigations"
        quote: "Wound Swab, Tissue biopsy for M/C/S"
        text: |
          - **Blood sugar** و long-term control: **FBS، HbA1c**
          - ==Wound swab== or **tissue biopsy** for M/C/S
          - **Doppler / duplex US**
          - **X-rays** و **angiography**
          - وغيرهم: urea و electrolytes و creatinine، CXR، ECG
      - kind: explain
        page: 61
        title: "الوقاية"
        quote: "Optimize glucose control to prevent or delay the development of neuropathy in patients with T1DM"
        text: |
          - ظبط السكر: في **T1DM** بيمنع أو يأخّر الـ ==neuropathy== (A)، وفي **T2DM** بيبطّأ تقدمها (B).
          - عالج ألم الـ **DPN** وأعراض الـ autonomic neuropathy علشان الـ quality of life.
      - kind: mnemonic
        page: 61
        quote: "Inspect his feet every day &after prolonged walking."
        word: "FEETCARE"
        parts:
          - { key: "F", text: "Feet inspected every day and after long walks" }
          - { key: "E", text: "Ever barefoot? Never" }
          - { key: "E", text: "Every shoe with socks" }
          - { key: "T", text: "The right size shoes" }
          - { key: "C", text: "Change shoes 2–3 times a day" }
          - { key: "A", text: "A new shoe: no more than 1 hour a day" }
          - { key: "R", text: "Rinse (wash) and dry feet daily, moisturize dry skin" }
          - { key: "E", text: "Edges straight: cut nails straight" }
        hook: "**FEETCARE**: تمن نصايح للـ foot care، كل حرف نصيحة."
      - kind: reveal
        page: 61
        quote: "Avoid wearing new shoes for1 > h per day"
        prompt: "ليه الجزمة الجديدة ما تتلبسش أكتر من ساعة في اليوم؟"
        answer: |
          الجزمة الجديدة لسه ناشفة ومش واخدة شكل الرجل، فبتعمل نقط ضغط واحتكاك. الرجل الـ **neuropathic** مش هتحس بالـ blister لحد ما تبقى قرحة.

          علشان كده الكتاب بيقول **new shoes أقل من 1 h per day**، و **change shoe 2–3 times a day** علشان نقط الضغط تتغير.
      - kind: explain
        page: 62
        title: "العلاج لكل الدرجات"
        quote: "Either pregabalin, duloxetine, or gabapentin is recommended as an initial pharmacologic treatment for neuropathic pain in diabetes."
        text: |
          العلاج **multidisciplinary**:
          - **Good glycemic control**
          - **Control co-morbidities** و **infection**
          - ألم الـ neuropathy: ==pregabalin، duloxetine، أو gabapentin== كـ initial treatment (A)
      - kind: update
        page: 62
        quote: "Either pregabalin, duloxetine, or gabapentin is recommended as an initial pharmacologic treatment for neuropathic pain in diabetes."
        text: "الـ ADA 2025 بتضيف لـ pregabalin و duloxetine و gabapentin كمان الـ tricyclic antidepressants والـ sodium-channel blockers كـ initial options. في الامتحان: التلاتة بتوع الكتاب."
        ref: "ADA Standards of Care in Diabetes 2025, section 12"
      - kind: figure
        page: 62
        quote: "Prophylactic bypass surgery"
        title: "الخطة حسب Wagner"
        alt: "A vertical flow from Wagner 0 to 5, each with its treatment: 0 treat risk factors, prevention, prophylactic bypass, osteotomy; 1-2 debridement, dressing, antibiotic, graft, offloading; 3 incision and drainage, serial debridement, irrigation, sequestrectomy; 4 revascularization and conservative two-stage amputation; 5 major amputation, preserve the knee."
        caption: "كل ما الدرجة تعلى، العلاج يبقى جراحي أكتر. ==Offloading== هو قلب علاج الـ 1–2، و **two-stage amputation** للـ 4."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L05w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fg-head"/></marker></defs>
            <rect x="10" y="10" width="310" height="44" rx="8" class="fg-good"/>
            <text x="20" y="29" class="t-sm t-b">0 at risk</text>
            <text x="20" y="46" class="t-sm">risk factors, prevention, bypass, osteotomy</text>
            <path d="M165 54 V66" class="fg-arrow" marker-end="url(#L05w)"/>
            <rect x="10" y="68" width="310" height="58" rx="8" class="fg-box"/>
            <text x="20" y="86" class="t-sm t-b">1–2 ulcer</text>
            <text x="20" y="102" class="t-sm">debridement, dressing, antibiotic, graft</text>
            <text x="20" y="118" class="t-sm t-acc t-b">OFFLOADING: total contact cast</text>
            <path d="M165 126 V138" class="fg-arrow" marker-end="url(#L05w)"/>
            <rect x="10" y="140" width="310" height="44" rx="8" class="fg-acc"/>
            <text x="20" y="159" class="t-sm t-b">3 abscess / OM</text>
            <text x="20" y="176" class="t-sm">I&amp;D, serial debridement, sequestrectomy</text>
            <path d="M165 184 V196" class="fg-arrow" marker-end="url(#L05w)"/>
            <rect x="10" y="198" width="310" height="44" rx="8" class="fg-bad"/>
            <text x="20" y="217" class="t-sm t-b">4 forefoot gangrene</text>
            <text x="20" y="234" class="t-sm">revascularize, two-stage conservative amp.</text>
            <path d="M165 242 V254" class="fg-arrow" marker-end="url(#L05w)"/>
            <rect x="10" y="256" width="310" height="44" rx="8" class="fg-bad"/>
            <text x="20" y="275" class="t-sm t-b">5 hindfoot gangrene</text>
            <text x="20" y="292" class="t-sm">major amputation, save the knee</text>
          </svg>
      - kind: explain
        page: 62
        title: "Grade 0 و 1–2"
        quote: "Surgical, Autolytic, larval"
        text: |
          **Grade 0 (foot at risk):** حدد الـ risk factors وعالجها، الوقاية، **prophylactic bypass**، و **osteotomies** للـ deformity.

          **Grade 1–2 (superficial و deep ulcer):**
          - **Debridement:** surgical، autolytic، **larval** (دود!)
          - **Dressing:** honey، iodine، film، foam، hydrocolloids، hydrogel، alginates
          - **Prophylactic antibiotic**
          - **Skin graft** أو flap
          - ==Pressure offloading==: **total contact cast**، removable total contact splint، **Scotch cast boot**
          - **Therapeutic footwear**
      - kind: aside
        tone: joke
        page: 62
        quote: "Surgical, Autolytic, larval"
        text: "الـ **larval debridement** = دود بياكل الأنسجة الميتة بس ويسيب السليمة. أشطر من أي intern في الاستقبال الساعة 3 الفجر 🪱"
      - kind: explain
        page: 63
        title: "Grade 3، 4، 5"
        quote: "Two-stage amputation is recommended"
        text: |
          **Grade 3 (deep infection، abscess، OM):** **I&D**، serial surgical debridement، wound irrigation بالـ antibiotics، **sequestrectomy**.

          **Grade 4 (forefoot gangrene):** conservative amputations، **revascularization**، و ==two-stage amputation is recommended==.

          **Grade 5 (hindfoot أو جزء كبير من الرجل):** مفيش conservative amputation؛ **major amputation**، و ==preserve the knee== قد ما تقدر.
      - kind: explain
        page: 63
        title: "دواعي تانية للبتر"
        quote: "Ischemic rest pain that cannot be managed by analgesia or revascularization"
        text: |
          - ألم ما بيتسيطرش عليه بالـ analgesia أو الـ revascularization: **ischemic rest pain**
          - **Life-threatening foot infection**
          - **Non-healing ulcer** مع burden of disease أعلى
          - ==Malignant transformation== للقرحة
      - kind: case
        page: 63
        quote: "Serial surgical debridement"
        stem: "A diabetic woman has a deep heel ulcer with a fluctuant abscess. X-ray shows a calcaneal sequestrum. Pulses are present."
        steps:
          - question: "Wagner grade?"
            options: ["3", "2", "4", "5"]
            answer: 0
            why: "Deep ulcer + abscess/osteomyelitis = 3. الـ 2 من غير abscess، والـ 4 و 5 gangrene."
          - reveal: "Surgery is planned."
            question: "Which plan fits?"
            options: ["I&D, serial debridement, antibiotic irrigation, sequestrectomy", "Major amputation", "Honey dressing only", "Prophylactic bypass"]
            answer: 0
            why: "ده علاج الـ grade 3 في الكتاب. الـ major amputation للـ 5، الـ dressing لوحده مش هيصرّف صديد، والـ bypass للـ grade 0."
      - kind: explain
        page: 64
        title: "بعد البتر"
        quote: "Most patients develop DFU on the contralateral limb within 18 ms of amputation"
        text: |
          الرجل التانية في خطر: أغلب العيانين بيعملوا **DFU في الرجل التانية** خلال ==18 months==، والـ mortality توصل **20–50% في 3 سنين**.

          - **Multi-specialist foot care team**
          - **Foot care education**
          - **Follow up كل 1–3 months**
          - كل زيارة: **foot inspection, PVD assessment**
          - كل الـ preventive measures
      - kind: check
        page: 65
        quote: "The cornerstones that can help with reducing the rate of diabetes- related lower extremity amputation may include"
        question: "Cornerstones to reduce diabetes-related amputation include (book question):"
        options: ["All of the above", "Periodic foot examination", "Education of patients and providers", "Early treatment of foot ulcers"]
        answer: 0
        why:
          - "صح: كلهم، وكمان treatment of pre-ulcerative lesions."
          - "صح بس مش لوحده."
          - "صح بس مش لوحده: poor education من أكبر المشاكل في الـ conclusion."
          - "صح بس مش لوحده."
      - kind: try
        items: [dm.L05.085, dm.L05.091, dm.L05.096, dm.L05.098, dm.L05.111]
    recap:
      - "Investigations: FBS/HbA1c، swab أو biopsy، Doppler، X-ray، angiography."
      - "Foot care: FEETCARE. جزمة جديدة أقل من ساعة، غيّر الجزمة 2–3 مرات، قص الضوافر مستقيم."
      - "ألم الـ neuropathy: pregabalin أو duloxetine أو gabapentin."
