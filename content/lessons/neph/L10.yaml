  - id: neph.L10.lesson3
    title: "Chronic TIN والمسكنات اللي بتاكل الـ papilla"
    hook: "ست بتاخد مسكنات للصداع كل يوم من سنين. الكلية بتصغر في صمت لحد ما الـ papilla تقع."
    minutes: 8
    pages: [341, 344]
    topics: [ctin, nephrotox, analgesic]
    goals:
      - "تعرف أسباب الـ chronic TIN وعوامل خطر الـ nephrotoxicity"
      - "تفهم ليه المسكنات بتضرب الـ papilla بالذات"
      - "تعرف علاج الـ analgesic nephropathy والوقاية من الـ nephrotoxicity"
    status: unverified
    steps:
      - kind: explain
        page: 341
        title: "أسباب الـ chronic TIN"
        quote: "Sickle cell disease or trait"
        text: |
          **الشائعة**:
          - ==Reflux nephropathy==
          - NSAIDs
          - Diabetes mellitus
          - Sickle cell disease أو trait
          - Cadmium أو lead

          **النادرة**: Alport's، irradiation، Sjögren's، hyperuricaemic nephropathy.
      - kind: explain
        page: 342
        title: "مين أكتر واحد هيتأذي من الدوا؟"
        quote: "Hepatorenal syndrome"
        text: |
          **من ناحية المريض**: ==old age==، مرض كلى قديم، الستات، نقص Mg أو K أو Ca، نقص الـ volume، hypotension، hepatorenal syndrome، السكر، multiple myeloma.

          **من ناحية الدوا**: كورسات قريبة ومتكررة، جرعة كبيرة، مدة طويلة، نظام الجرعات، ودوا nephrotoxic تاني معاه.
      - kind: sort
        page: 342
        quote: "Recent recurrent therapy"
        prompt: "عامل الخطر ده من المريض ولا من الدوا؟"
        bins: ["Patient related", "Drug related"]
        cards:
          - { text: "Old age", bin: 0 }
          - { text: "Multiple myeloma", bin: 0 }
          - { text: "Volume depletion", bin: 0 }
          - { text: "Large dose", bin: 1 }
          - { text: "Long therapy", bin: 1 }
          - { text: "Another nephrotoxic drug", bin: 1 }
        why: "المريض: السن، الـ myeloma، الجفاف، الستات، مرض كلى قديم. الدوا: الجرعة، المدة، التكرار، والخلط مع nephrotoxic تاني."
      - kind: explain
        page: 342
        title: "الـ analgesic nephropathy: مين وليه؟"
        quote: "More common in women 30-50 ys."
        text: |
          **Aspirin و acetaminophen**. أكتر في ==الستات 30–50 سنة== اللي عندهم صداع متكرر وآلام عضلات ومفاصل.

          الـ chronic TIN عمومًا ممكن يكون **من غير أعراض**، أو يظهر بأعراض السبب، أو بأعراض الـ **CKD**.
      - kind: figure
        page: 343
        quote: "Concentrated in the medulla and papilla."
        title: "ليه الـ papilla بالذات؟"
        alt: "Four stacked boxes joined by arrows: analgesic is concentrated in the medulla and papilla; aspirin reduces the cells' reducing substances; patchy papillary necrosis then calcification; larger foci and slough of the whole papilla (acute papillary necrosis)."
        caption: "الدوا ==بيتركّز== في الـ papilla زي ما البول بيتركّز هناك، والـ aspirin بيشيل حماية الخلية. النتيجة necrosis وبعدين الـ papilla كلها تقع."
        svg: |
          <svg viewBox="0 0 330 280" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="N10c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="5" y="5" width="320" height="52" rx="8" class="fg-acc"/>
            <text x="15" y="26" class="t-b">Concentrated in medulla and papilla</text>
            <text x="15" y="45" class="t-sm t-mut">Cumulative dose matters (book: 10 kg)</text>
            <path d="M165 57 L165 72" class="fg-arrow-bad" marker-end="url(#N10c)"/>
            <rect x="5" y="74" width="320" height="52" rx="8" class="fg-box"/>
            <text x="15" y="95" class="t-b">Aspirin lowers reducing substances</text>
            <text x="15" y="114" class="t-sm t-mut">Epithelial cells lose their protection</text>
            <path d="M165 126 L165 141" class="fg-arrow-bad" marker-end="url(#N10c)"/>
            <rect x="5" y="143" width="320" height="52" rx="8" class="fg-box"/>
            <text x="15" y="164" class="t-b">Patchy necrosis, then calcification</text>
            <text x="15" y="183" class="t-sm t-mut">Sterile pyuria, poor concentration, dRTA</text>
            <path d="M165 195 L165 210" class="fg-arrow-bad" marker-end="url(#N10c)"/>
            <rect x="5" y="212" width="320" height="60" rx="8" class="fg-bad"/>
            <text x="15" y="234" class="t-b">Whole papilla sloughs</text>
            <text x="15" y="254" class="t-sm">Acute papillary necrosis</text>
          </svg>
      - kind: explain
        page: 343
        title: "الصورة المتأخرة والباثولوجي"
        quote: "Anemia and peptic ulcer symptoms."
        text: |
          **بدري**: مفيش أعراض. **متأخر**:
          - ==Sterile pyuria==، ضعف تركيز البول، و distal acidification defects.
          - الـ proximal defects بتيجي متأخر مع الـ renal failure، ومعاها ضعف الحفاظ على الـ Na.
          - **Anaemia** وأعراض **peptic ulcer** (الأسبرين بيضرب المعدة كمان).
          - كلية **صغيرة**، nodular، فيها calcification، والحتت اللي جنبها بتكبر.

          **الباثولوجي**: كلية صغيرة منكمشة، سطحها مش منتظم و ==asymmetric==؛ infiltrate و fibrosis و tubular atrophy متقطعة. الـ glomeruli عادية في الأول، وبعدين sclerosis و periglomerular fibrosis.
      - kind: check
        page: 343
        quote: "slough of the whole papilla (acute papillary necrosis)"
        question: "A woman on daily analgesic combinations for years has sudden loin pain and passes tissue in her urine. What happened?"
        options:
          - "Acute papillary necrosis"
          - "Uric acid stone"
          - "Acute allergic TIN"
          - "Bladder tumour"
        answer: 0
        why:
          - "صح: الـ necrotic foci كبرت والـ papilla كلها وقعت."
          - "الكتاب مش بيربط المسكنات بحصوات uric acid."
          - "الـ allergic TIN حاد بعد 2–14 يوم من دوا جديد، مش بعد سنين."
          - "الحتة اللي نزلت papilla، والصورة دي analgesic nephropathy."
      - kind: explain
        page: 344
        title: "العلاج والوقاية"
        quote: "Psychological support to stop analgesics."
        text: |
          **علاج الـ analgesic nephropathy** (stop the drug, psychological support to stop analgesics): وقّف الدوا، اشرب ميّه كتير، ابعد عن الجفاف من diuretics أو laxatives، ==دعم نفسي== علشان يبطّل المسكنات، وابعد عن **خلطات** المسكنات.

          **الوقاية من الـ nephrotoxicity**: اعرف عوامل الخطر، **single daily dose**، كورس أقصر، ما تجمعش nephrotoxics، سيب فترة بين الكورسات، hydration كويس، احسب الـ ==GFR== من الـ S.Cr، **non-ionic contrast**، وقيس مستوى الدوا في الدم.
      - kind: aside
        tone: exam
        page: 344
        quote: "aspirin alone does not impair renal function in normal kidney"
        text: |
          الكتاب واضح: ==الأسبرين لوحده== مش بيبوّظ وظيفة الكلية **السليمة**. المشكلة في الـ **combinations**.
      - kind: check
        page: 344
        quote: "Single daily dose"
        question: "An elderly diabetic needs gentamicin. Which plan prevents nephrotoxicity best?"
        options:
          - "Single daily dose, short course, hydration, drug levels"
          - "Divided doses for a long course"
          - "Give with IV contrast the same day"
          - "Keep her a little dry"
        answer: 0
        why:
          - "صح: كل ده من قايمة الوقاية في الكتاب."
          - "الكورس الطويل عامل خطر؛ الكتاب بيقول قصّر الكورس."
          - "ما تجمعش nephrotoxics مع بعض."
          - "الجفاف عامل خطر؛ الـ hydration الكويس بيحمي."
      - kind: try
        items: [neph.L10.041, neph.L10.043, neph.L10.051, neph.L10.056, neph.L10.058]
    recap:
      - "Chronic TIN: reflux، NSAIDs، DM، sickle cell، cadmium أو lead؛ ونادرًا Alport، irradiation، Sjögren، urate."
      - "عوامل خطر من المريض (سن، كلى، ستات، جفاف، myeloma) ومن الدوا (جرعة، مدة، تكرار، خلط)."
      - "Analgesic nephropathy: ستات 30–50، الدوا بيتركّز في الـ papilla، و papillary necrosis."
