      - [DR3, "SLE, Sjögren syndrome, Graves disease, type 1 DM"]
      - [DR4, "RA, type 1 DM"]
      - [DR5, "Pauciarticular juvenile RA, Hashimoto thyroiditis"]
      - [DQ, "SLE, type 1 DM"]
    blanks: [[0, 1], [1, 1], [2, 1], [4, 1], [5, 1], [6, 1], [7, 1]]
    src: { page: 92, quote: "HLA-DR2: Multiple sclerosis, Good pasture's syndrome." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.039
    kind: cloze
    topic: hla-disease
    text: "HLA-{{c1::A29}} is linked to birdshot choroidoretinitis; HLA-{{c2::B5}} to Behçet disease."
    src: { page: 92, quote: "HLA-A29: Bird shot choroid retinitis." }
    status: unverified
  - id: rheum.L06.040
    kind: mcq
    topic: hla-disease
    stem: A woman with Goodpasture syndrome is typed for HLA. Which allele does the lecture associate with her disease?
    options: [HLA-DR2, HLA-DR3, HLA-B27, HLA-DR5, HLA-A29]
    answer: 0
    why:
      - "Correct: DR2 = multiple sclerosis and Goodpasture syndrome (p92)."
      - DR3 = SLE, Sjögren, Graves, type 1 DM.
      - B27 = seronegative spondyloarthritis.
      - DR5 = pauciarticular JRA and Hashimoto thyroiditis.
      - A29 = birdshot choroidoretinitis.
    src: { page: 92, quote: "HLA-DR2: Multiple sclerosis, Good pasture's syndrome." }
    status: unverified
  - id: rheum.L06.041
    kind: mcq
    topic: hla-disease
    stem: Which HLA allele does the lecture link to both SLE and Sjögren syndrome, as well as Graves disease and type 1 DM?
    options: [HLA-DR3, HLA-DR4, HLA-DR1, HLA-B5]
    answer: 0
    why:
      - "Correct: DR3 = SLE, Sjögren, Graves, type 1 DM (p92)."
      - DR4 = RA and type 1 DM.
      - DR1 = rheumatoid arthritis.
      - B5 = Behçet, UC, polycystic kidney disease.
    src: { page: 92, quote: "HLA-DR3: SLE, Sjogren's syndromes Grave's disease, type 1 DM." }
    status: unverified
  # ---------- p92-93: macrophages ----------
  - id: rheum.L06.042
    kind: card
    topic: macrophages
    front: Describe the life of a monocyte.
    back: Produced in the bone marrow, it circulates in blood for one day, then settles in tissues as a tissue macrophage (histiocyte).
    src: { page: 92, quote: "one day then settle in tissues as tissue macrophage or histocytes." }
    status: unverified
  - id: rheum.L06.043
    kind: enumerate
    topic: macrophages
    prompt: What activates macrophages?
    points:
      - Direct contact with organisms
      - Endotoxins
      - Breakdown products
      - Complement
      - Coagulation products
      - IFN-γ from TH1 cells
    pass: 4
    src: { page: 92, quote: "Macrophages are activated by direct contact with organisms, by endotoxins," }
    status: unverified
  - id: rheum.L06.044
    kind: enumerate
    topic: macrophages
    prompt: Enumerate the functions of macrophages.
    points:
      - Phagocytosis (slower than neutrophils)
      - "Secretory products: IL-1, TNF, IL-6, IFN, prostaglandins, leukotrienes, enzymes, superoxides"
      - "Affect lymphocyte responses through mediators (IL-1, TNF)"
      - Act as antigen-presenting cells
    pass: 3
    src: { page: 93, quote: "Macrophage function as phagocytes (slower than neutrophils)" }
    status: unverified
    tags: [high-yield]
  # ---------- p93-94: lymphocytes ----------
  - id: rheum.L06.045
    kind: card
    topic: lymphocytes
    front: How are T cells identified, and what share of circulating lymphocytes are they?
    back: They express the T cell receptor and are picked out with monoclonal antibodies to CD3, a TCR component. Most circulating lymphocytes are T cells (about 70%).
    src: { page: 93, quote: "monoclonal antibodies that recognize CD3, a component of T cell receptor." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.046
    kind: card
    topic: lymphocytes
    front: What are B cells, and what do they carry on their surface?
    back: Bone marrow-derived, antibody-secreting cells expressing surface immunoglobulin.
    src: { page: 93, quote: "B lymphocytes or B cells are bone manow-derived-antibody secreting cells." }
    status: unverified
  - id: rheum.L06.047
    kind: table
    topic: lymphocytes
    title: "Humoral versus cellular immunity"
    columns: [Feature, Humoral, Cellular]
    rows:
      - [Mediated by, Antibody from B cells, T cells secreting cytokines that direct effector cells]
      - [Most important against, "Bacteria, especially encapsulated", "Viruses, parasites, fungi, mycobacteria"]
      - [Deficiency example, "Hypogammaglobulinemia: recurrent sinopulmonary infections (pneumococcus, H. influenzae)", "AIDS (T-cell dysfunction)"]
    blanks: [[1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 93, quote: "Humoral immunity is most important against bacteria, especially those" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.048
    kind: mcq
    topic: lymphocytes
    stem: >-
      A 24-year-old man has had pneumococcal pneumonia twice and recurrent Haemophilus sinusitis. Serum IgG,
      IgA and IgM are very low. Which arm of immunity is defective?
    options: [Humoral (antibody) immunity, Cellular (T cell) immunity, Complement only, NK cell function, Neutrophil phagocytosis]
    answer: 0
    why:
      - "Correct: severe antibody deficiency gives recurrent sinopulmonary infection with encapsulated organisms (p93)."
      - T-cell defects (AIDS) give viral, parasitic, fungal and mycobacterial infections.
      - His immunoglobulins are low, pointing to B cells, not complement.
      - NK defects are linked to viruses and tumours, not low immunoglobulins.
      - Neutrophil defects do not lower immunoglobulins.
    src: { page: 93, quote: "encapsulated organism (e.g pneumococcus, Haemophilus influenza)." }
    status: unverified
  - id: rheum.L06.049
    kind: card
    topic: lymphocytes
    front: Against which organisms is cellular immunity most important?
    back: Viruses, parasites, fungi and mycobacteria; AIDS patients (T-cell dysfunction) suffer these infections.
    src: { page: 94, quote: "Cellular immunity is most important against virus, parasites, fungi," }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.050
    kind: card
    topic: lymphocytes
    front: Which surface antibodies do mature B cells carry, and how specific are they?
    back: Surface IgM and IgD, which act as antigen receptors; each B cell is specific for one antigen only.
    src: { page: 94, quote: "Mature B cells vary in their surface antibody molecules (sIgM, SIgD) which" }
    status: unverified
  - id: rheum.L06.051
    kind: card
    topic: lymphocytes
    front: What happens when a B cell meets its antigen?
    back: It differentiates into an antibody-secreting plasma cell or a memory cell; full activation needs T-cell help. Plasma cells form a clone secreting the parent's antibody, and memory cells give the secondary response.
    src: { page: 94, quote: "When a B cell is exposed to an antigen it differentiates to antibody secreting" }
    status: unverified
  # ---------- p95-96: immunoglobulins ----------
  - id: rheum.L06.052
    kind: card
    topic: immunoglobulins
    front: Which parts of the immunoglobulin molecule bind antigen and which bind Fc receptors and complement (p95 figure)?
    back: The variable domains (VH, VL) at the N-terminal tips form the antigen-binding site; CH2 and CH3 below the hinge carry the Fc receptor and complement-binding sites.
    src: { page: 95, quote: "Structure of Immunoglobulin Molecule" }
    status: unverified
  - id: rheum.L06.053
    kind: table
    topic: immunoglobulins
    title: "Immunoglobulin classes"
