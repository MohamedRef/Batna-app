  - id: rheum.L06.lesson2
    title: "الـ HLA: بطاقة الرقم القومي للخلية"
    hook: "ليه زرع الكلية صعب؟ لأن كل واحد فينا شايل HLA مختلف، و DRB1 لوحده فيه 60 شكل."
    minutes: 9
    pages: [87, 91]
    topics: [hla]
    goals:
      - "تفرّق بين class I و class II في المكان والتركيب والوظيفة"
      - "تقرا اسم allele زي DRB1*0101"
      - "تعرّف الـ codominance والـ linkage disequilibrium"
    status: unverified
    steps:
      - kind: explain
        page: 87
        title: "يعني إيه HLA؟"
        quote: "The human MHC is known as HLA and the genes are found on"
        text: |
          الـ **MHC** مجموعة جينات أغلبها ليه وظيفة مناعية، وفي الإنسان اسمها ==HLA==، وجيناتها على **chromosome 6**.

          جزيئات **class I و II** دي **glycoproteins** على سطح الخلية، بتمسك **short processed peptides** وتعرضها على الـ **T cell receptor**. وفي ناس الـ HLA بتاعها بيخليها أكثر عرضة لأمراض معيّنة.
      - kind: figure
        page: 88
        quote: "Schematic illustration of the structure of class I and class II molecules."
        title: "Class I و class II"
        alt: "Side-by-side drawing. Class I: a long alpha chain with three domains, alpha 1, alpha 2, alpha 3, crossing the membrane, with a small separate beta-2 microglobulin beside alpha 3; found on all nucleated cells, presents to CD8 cytotoxic T cells. Class II: two transmembrane chains, alpha with domains alpha 1 and 2 and beta with domains beta 1 and 2; found on macrophages, dendritic cells and B cells, presents to CD4 helper T cells."
        caption: "Class I = ==α chain + β2-microglobulin==، وجين الـ β2m على chromosome 15. أما class II فسلسلتين α و β، الاتنين transmembrane."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <text x="80" y="20" text-anchor="middle" class="t-b">Class I</text>
            <text x="245" y="20" text-anchor="middle" class="t-b">Class II</text>
            <rect x="50" y="35" width="50" height="36" rx="16" class="fg-acc"/>
            <text x="75" y="58" text-anchor="middle" class="t-sm">α1</text>
