  - id: geri.L02.lesson2
    title: "الكرياتينين بيكدب على الكبار"
    hook: "ست عندها 70 سنة وشاب عنده 25، الاتنين كرياتينين 1.2. واحد كليته نص التانية."
    minutes: 9
    pages: [29, 35]
    topics: [gfr, presentation, ckd, drugs]
    goals:
      - "تحسب الـ CrCl بـ Cockcroft-Gault"
      - "تعرف ليه الـ cystatin C أحسن عند الكبار"
      - "تعدّ طرق ظهور أمراض الكلى وفحوصاتها"
      - "تعرف مخاطر الأدوية على الكلية العجوزة"
    status: unverified
    steps:
      - kind: explain
        page: 29
        title: "ليه الكرياتينين بيكدب؟"
        quote: "(↓ Body mass, debilitation, muscle atrophy) Standard measures of GFR or renal functions as s.cr, may be inappropriate"
        text: |
          الكرياتينين بييجي من ==العضلات==. الحاج عضلاته قليلة، فالكرياتينين اللي بيتعمل أصلًا قليل.

          يعني الـ **GFR** ممكن يكون واطي جدًا والـ **serum creatinine** شكله "طبيعي". علشان كده الكتاب بيقول الـ s.Cr ممكن يكون ==inappropriate== لمتابعة وظيفة الكلى عند الكبار.
      - kind: explain
        page: 30
        title: "Cockcroft-Gault"
        quote: "(140-age) x body weight (Kg) CG equation= ------------------------- - (85% if female) 72x s.creatinine (mg/dl)"
        text: |
          الـ GFR = **creatinine clearance**: يا تقيسه **U × V / P**، يا تحسبه:

          ==CrCl = (140 − age) × weight ÷ (72 × s.Cr)==

          والست **× 0.85**.

          شوف المعادلة: السن بيتطرح، والوزن بيضرب. يعني العجوز الرفيع هو أكتر واحد الكرياتينين بيضحك عليه.
      - kind: figure
        page: 34
        title: "نفس الكرياتينين، كلية مختلفة"
        quote: "S.Cr. Does not accurately reflect kidney function"
        alt: "Two patient cards side by side, both with serum creatinine 1.2 mg/dL: a 70-year-old 60 kg woman with creatinine clearance 41.3 ml/min and a 25-year-old 70 kg man with 93.2 ml/min."
        caption: "جدول الكتاب في ص 34: الـ S.Cr does not accurately reflect kidney function. الاتنين ==s.Cr 1.2==، بس الست الكبيرة CrCl حوالي **41** والشاب حوالي **93**. احسبها بنفسك بالمعادلة، هتطلع نفس الأرقام."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="10" width="150" height="180" rx="12" class="fg-bad"/>
            <text x="83" y="38" text-anchor="middle" class="t-sm t-b">70 y woman</text>
            <text x="83" y="56" text-anchor="middle" class="t-sm">60 kg</text>
            <text x="83" y="92" text-anchor="middle" class="t-sm">s.Cr</text>
            <text x="83" y="112" text-anchor="middle" class="t-lg t-b">1.2</text>
            <text x="83" y="148" text-anchor="middle" class="t-sm">CrCl</text>
            <text x="83" y="172" text-anchor="middle" class="t-lg t-b t-bad">41.3</text>
            <rect x="172" y="10" width="150" height="180" rx="12" class="fg-good"/>
            <text x="247" y="38" text-anchor="middle" class="t-sm t-b">25 y man</text>
            <text x="247" y="56" text-anchor="middle" class="t-sm">70 kg</text>
            <text x="247" y="92" text-anchor="middle" class="t-sm">s.Cr</text>
            <text x="247" y="112" text-anchor="middle" class="t-lg t-b">1.2</text>
            <text x="247" y="148" text-anchor="middle" class="t-sm">CrCl</text>
            <text x="247" y="172" text-anchor="middle" class="t-lg t-b t-good">93.2</text>
          </svg>
      - kind: check
        page: 30
        quote: "(140-age) x body weight (Kg) CG equation= ------------------------- - (85% if female) 72x s.creatinine (mg/dl)"
        question: "80-year-old woman, 50 kg, creatinine 1.0 mg/dl. CrCl by Cockcroft-Gault?"
        options:
          - "About 35 ml/min"
          - "About 42 ml/min"
          - "About 60 ml/min"
          - "About 100 ml/min"
        answer: 0
        why:
          - "صح: 60 × 50 ÷ 72 = 41.7، × 0.85 = 35.4."
          - "نسيت الـ 0.85 بتاع الستات."
          - "60 ده (140 − age) بس."
          - "الكرياتينين 1.0 مش معناه كلية طبيعية."
      - kind: explain
        page: 34
        title: "Cystatin C: الـ marker اللي ما بيتأثرش"
        quote: "Synthesized by all nucleated cells, not affected by inflammation. Cleared by glomerular filtration, no tubular secretion."
        text: |
          **Cystatin C** = protease inhibitor، single-chain protein حجمه **13 kD**:
          - بيتعمل من ==كل الـ nucleated cells== بمعدل ثابت، ومش بيتأثر بالـ inflammation.
          - بيتفلتر بالـ glomerulus، **من غير tubular secretion**، ومش بيرجع للدم.
          - مستواه ثابت، و**بيعلى لما الـ GFR يقل**.
          - ==Independent of gender, age, body mass==: ده بالظبط اللي الكرياتينين بيفشل فيه.

          وفي دراسة Fliser: الكبار CrCl حوالي **74** مقابل **114** للشباب، والـ cystatin **0.84** مقابل **0.69** mg/L.
      - kind: sort
        page: 34
        quote: "Ideal marker for GFR. It increases as GFR decreases. Independent of gender, age or body mass."
        prompt: "مين بيتأثر بإيه؟"
        bins: ["Creatinine", "Cystatin C"]
        cards:
          - { text: "Falls with muscle atrophy", bin: 0 }
          - { text: "Misleading in a thin old woman", bin: 0 }
          - { text: "Made by all nucleated cells", bin: 1 }
          - { text: "Independent of age, gender, body mass", bin: 1 }
          - { text: "No tubular secretion, constant level", bin: 1 }
        why: "الكرياتينين بييجي من العضلات، فبيتأثر بكتلة الجسم والسن. الـ cystatin بييجي من كل الخلايا بمعدل ثابت."
      - kind: explain
        page: 30
        title: "أمراض الكلى بتظهر إزاي؟"
        quote: "1- With disorder of micturition: frequency, nocturia , hesitancy, terminal dribbling , dysuria , or enuresis"
        text: |
          يا **asymptomatic**، يا **بأعراض كلى**، يا **مع مرض systemic** معروف إنه بيمس الكلى.

          الأعراض سبع مجموعات:
          1. **Micturition:** frequency، nocturia، hesitancy، terminal dribbling، dysuria، enuresis
          2. **Volume:** oliguria، anuria، polyuria
          3. **Urine components:** hematuria، pigmenturia، proteinuria، pyuria، calculi، pneumaturia
          4. **Pain:** renal colic أو flank pain
          5. **Renal mass**
          6. **Edema**
          7. **Uremia** وضعف وظايف الكلى
      - kind: mnemonic
        page: 31
        quote: "Investigations of renal diseases Biochemical investigations Microbiological investigations. Immunological investigations."
        word: "BMIHR"
        parts:
          - { key: "B", text: "Biochemical" }
          - { key: "M", text: "Microbiological" }
          - { key: "I", text: "Immunological" }
          - { key: "H", text: "Histopathological" }
          - { key: "R", text: "Radiological" }
        hook: "الفحوصات الخمسة: **BMI** و **HR**. «وزن ونبض»، زي أي كشف."
      - kind: figure
        page: 32
        title: "Radiological: ultrasound من الكتاب"
        image: { file: geri/L02-kidney-us.webp, book: true }
        caption: "الـ ultrasound بتاع الكلية اليمين في الكتاب، وطولها **9.74 cm**. الـ US أسهل radiological investigation للكبار: من غير contrast ولا إشعاع."
        alt: "The book's ultrasound of the right kidney with a length caliper reading 9.74 cm."
      - kind: explain
        page: 33
        title: "الـ CKD والأدوية"
        quote: "These risks are higher when associated with DM, CVD, and hyperuricemia."
        text: |
          **CKD:** الـ ESRD والوفيات بيزيدوا مع السن، وأكتر مع ==DM و CVD و hyperuricemia==.

          **الأدوية في الكلية العجوزة:**
          - Polypharmacy، interactions، errors
          - **Pharmacokinetics:** الإخراج الكلوي يقل ← ==half-life أطول== ← toxicity أكتر
          - **Pharmacodynamics:** الـ diuretics تعمل glucose intolerance، والـ metformin يعمل diarrhea
      - kind: try
        items: [geri.L02.024, geri.L02.025, geri.L02.027, geri.L02.032, geri.L02.036]
    recap:
      - "الكرياتينين بيقل مع العضلات، فبيخبّي الـ GFR الواطي."
      - "CG = (140 − age) × weight ÷ (72 × s.Cr)، والست × 0.85."
      - "Cystatin C: 13 kD، من كل الخلايا، ثابت، independent of age و gender و body mass."
      - "الفحوصات: Biochemical، Microbiological، Immunological، Histopathological، Radiological."
      - "الـ CKD أخطر مع DM و CVD و hyperuricemia. الأدوية: half-life أطول و toxicity."
    practice: [geri.L02.022, geri.L02.023, geri.L02.024, geri.L02.025, geri.L02.026, geri.L02.027, geri.L02.028, geri.L02.029, geri.L02.030, geri.L02.031, geri.L02.032, geri.L02.033, geri.L02.034, geri.L02.035, geri.L02.036, geri.L02.037, geri.L02.060, geri.L02.061, geri.L02.066]
