  - id: rheum.L02.017
    kind: enumerate
    topic: hyperuricemia
    prompt: Enumerate the specific enzyme defects that cause uric acid over-production.
    points: ["Hypoxanthine-guanine phosphoribosyl transferase (HGPRT) deficiency (Lesch-Nyhan)", Phosphoribosyl pyrophosphate synthetase overactivity, Glucose-6-phosphatase deficiency]
    pass: 3
    src: { page: 26, quote: "Hypoxanthine- guanine phosphoribosyl transferase deficiency Lesch-Nyhan." }
    status: unverified
  - id: rheum.L02.018
    kind: cloze
    topic: hyperuricemia
    text: "Over-producers are {{c1::20%}} of primary gout; a specific enzyme defect explains {{c2::< 1%}}, and most have an {{c3::unidentified abnormality}}."
    src: { page: 26, quote: "Increased de novo synthesis (\"over-producers)=20% of 1ry gout patients." }
    status: unverified
    tags: [numbers]
  - id: rheum.L02.019
    kind: table
    topic: hyperuricemia
    title: Mechanisms of hyperuricaemia (p26)
    columns: [Mechanism, Examples]
    rows:
      - [Hyperproduction, "Diet rich in purines or alcohol; myeloproliferative diseases"]
      - [Decreased GFR, CKD]
      - [Increased reabsorption, "Volume depletion (diuretics); metabolic syndrome"]
      - [Decreased secretion, "Raised lactate (exercise, alcohol) and ketoacids (fasting)"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 26, quote: "Reabsorption increase: - Volume depletion (diuretics). - Metabolic syndrome." }
    status: unverified
  - id: rheum.L02.020
    kind: mcq
    topic: hyperuricemia
    stem: "A man develops a gout flare after a weekend of heavy drinking and a long fast. By which mechanism do lactate and ketoacids raise serum urate?"
    options: [Decreased renal urate secretion, Increased purine production only, Decreased GFR, Increased gut excretion]
    answer: 0
    why:
      - "Correct: lactates (exercise, alcohol) and ketoacids (fasting) decrease urate secretion."
      - "Purine-rich diet and alcohol also add production, but lactate and ketoacids act on secretion."
      - "Decreased GFR is the CKD mechanism."
      - "More gut excretion would lower urate."
    src: { page: 26, quote: "Secretion decreased: - Lactates increased (exercise, alcohol) and ketoacids (fasting)." }
    status: unverified
  # ---------- p27-30: associations ----------
  - id: rheum.L02.021
    kind: enumerate
    topic: associations
    prompt: What does hyperuricaemia precede, predict or participate in (p27)?
    points: [Hypertension, Type 2 diabetes, Cardio-renal disease]
    pass: 3
    src: { page: 27, quote: "Precedes and predicts hypertension. Precedes and predicts Type 2 diabetes." }
    status: unverified
  - id: rheum.L02.022
    kind: cloze
    topic: associations
    text: "Hyperuricaemia is present in {{c1::26%}} of hypertensives, rising to {{c2::58%}} in those on antihypertensives, and develops in {{c3::1/3}} of patients on a diuretic."
    src: { page: 27, quote: "Is presented by 26% of the hypertensive population (the figure rose to 58% in those receiving antihypertensive drugs)." }
    status: unverified
    tags: [numbers]
  - id: rheum.L02.023
    kind: order
    topic: associations
    prompt: Order the disease progression of gout (book figure, p27).
    steps:
      - Normouricaemia
      - Hyperuricaemia
      - MSU crystal deposition
      - Recurrent gout flares
      - Chronic gouty arthritis and tophaceous gout
    src: { page: 27, quote: "Disease progression in gout" }
    status: unverified
  - id: rheum.L02.024
    kind: table
    topic: associations
    title: What drives each step of gout progression (p27 figure)
    columns: [Step, Risk factor or cause]
    rows:
      - [Normouricaemia → hyperuricaemia, "Genes (urate transporter SNPs), diet and BMI, impaired kidney function, age, male sex, medications, high cell turnover"]
      - [Hyperuricaemia → MSU deposition, "Reduced urate solubility, increased nucleation and growth of MSU crystals"]
      - [Deposition → recurrent flares, Acute inflammatory response to deposited MSU crystals]
      - [Flares → chronic tophaceous gout, Chronic granulomatous inflammatory response to deposited crystals]
    blanks: [[1, 1], [2, 1], [3, 1]]
    src: { page: 27, quote: "Chronic granulomatous inflammatory response to deposited crystals" }
    status: unverified
  - id: rheum.L02.025
    kind: table
    topic: associations
    title: Urate transporters (p28)
    columns: [Transporter, Site, Role]
    rows:
      - [GLUT9, Basolateral membrane of proximal tubule, Renal urate reabsorption]
      - [URAT1, Apical membrane of proximal tubule, Renal urate reabsorption]
      - [NPT1, Apical membrane of proximal tubule, "Urate excretion; gain-of-function lowers gout risk"]
      - [ABCG2, Apical surface of proximal tubule and enterocytes, "Urate export in gut and kidney; dysfunctional variants raise urate and gout risk"]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 2]]
    src: { page: 28, quote: "The urate transporters GLUT9, URATI, NPT1 and ABCG2 regulate serum urate levels in humans." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L02.026
    kind: mcq
    topic: associations
    stem: "A dysfunctional variant of which transporter, found in both enterocytes and proximal tubule cells, raises serum urate and gout risk?"
    options: [ABCG2, URAT1, GLUT9, NPT1]
    answer: 0
    why:
      - "Correct: ABCG2 exports urate in both intestine and kidney; dysfunctional variants raise urate."
      - "URAT1 is apical in the tubule and reabsorbs urate; it is not in the gut."
      - "GLUT9 is basolateral in the tubule and reabsorbs urate."
      - "NPT1 excretes urate; its gain-of-function mutation lowers gout risk."
    src: { page: 28, quote: "Dysfunctional variants of ABCG2 increase serum urate levels and the risk of gout." }
    status: unverified
  - id: rheum.L02.027
    kind: card
    topic: associations
    front: What does a gain-of-function mutation in NPT1 do?
    back: It increases renal urate excretion and can decrease the risk of gout.
    src: { page: 28, quote: "a gain-of-function mutation in the gene encoding NPT1 results in increased renal urate excretion and can decrease the risk of gout." }
    status: unverified
  - id: rheum.L02.028
    kind: enumerate
    topic: associations
    prompt: Enumerate the risk factors for gout (p29).
    points: [Age, Obesity, High-protein diet, High alcohol consumption, Type IV hyperlipidaemia, Diabetes mellitus/insulin resistance, Metabolic syndrome, IHD/smoking, Hypertension, Family history of gout]
    pass: 7
    src: { page: 29, quote: "Risk factors - Age. - Obesity. - High-protein diet. - High alcohol consumption. - Type IV Hyperlipidaemia." }
    status: unverified
  - id: rheum.L02.029
    kind: card
    topic: associations
    front: Which hyperlipidaemia type is a gout risk factor in the book?
    back: Type IV hyperlipidaemia.
    src: { page: 29, quote: "Type IV Hyperlipidaemia." }
    status: unverified
  - id: rheum.L02.030
    kind: card
    topic: associations
    front: How may insulin resistance and hyperuricaemia be linked in the kidney (p29 figure)?
    back: Insulin resistance and hyperinsulinaemia increase urate reabsorption in the kidney, causing hyperuricaemia, which feeds endothelial dysfunction.
    src: { page: 29, quote: "A possible association between hyperuricemia and insulin resistance in the kidney" }
    status: unverified
  - id: rheum.L02.031
    kind: card
    topic: associations
    front: Mechanisms by which uric acid may cause diabetic nephropathy (p30 figure)?
    back: Raised uric acid drives inflammation (NF-κB, CRP, MCP-1), endothelial dysfunction (low NO), RAAS activation and extracellular matrix deposition, leading to progressive diabetic nephropathy.
    src: { page: 30, quote: "Mechanisms by which uric acid may cause diabetic nephropathy" }
    status: unverified
  - id: rheum.L02.032
    kind: card
    topic: associations
    front: Why do transplant patients get gout?
    back: Renal toxicity of calcineurin inhibitors (ciclosporin and tacrolimus).
    src: { page: 30, quote: "Due to renal toxicity of calcineurin inhibitors (ciclosporine and tacrolimus)." }
    status: unverified
  - id: rheum.L02.033
    kind: card
    topic: associations
    front: Which drug combination is hazardous in transplant gout, and why?
    back: Azathioprine with a xanthine oxidase inhibitor (allopurinol or febuxostat).
    src: { page: 30, quote: "Coprescription of azathiorine and xanthine oxydase (allopurinol and febuxostat) inhibitors is hazardous." }
    status: unverified
    tags: [high-yield, exam-trap]
  - id: rheum.L02.034
    kind: enumerate
    topic: associations
    prompt: How is gout managed in renal transplant patients (p30-31)?
    points: [Replace calcineurin inhibitors with mycophenolate mofetil, "Replace azathioprine with mycophenolate mofetil, allowing XO inhibitors", "If impossible: benzbromarone", "If impossible: amlodipine in ciclosporin-induced hypertension"]
    pass: 3
    src: { page: 30, quote: "Replacement of azathioprine with mycophenolate mofetil, allowing use of XO inhibitors." }
    status: unverified
  - id: rheum.L02.035
    kind: mcq
    topic: associations
    stem: "A kidney transplant recipient on ciclosporin and azathioprine has recurrent gout and needs urate-lowering therapy. What is the book's preferred step?"
    options:
      - "Replace azathioprine with mycophenolate mofetil, then use an XO inhibitor"
      - "Add allopurinol and keep azathioprine"
      - "Add febuxostat at full dose"
      - "Stop all immunosuppression"
    answer: 0
    why:
      - "Correct: switching azathioprine to MMF allows XO inhibitors safely."
      - "Allopurinol with azathioprine is hazardous."
      - "Febuxostat is also an XO inhibitor: same hazard with azathioprine."
      - "The book changes the immunosuppressant, never stops it."
    src: { page: 30, quote: "Replacement of azathioprine with mycophenolate mofetil, allowing use of XO inhibitors." }
    status: unverified
  - id: rheum.L02.036
    kind: card
    topic: associations
    front: Which antihypertensive reduces ciclosporin-induced hyperuricaemia in transplant patients?
    back: Amlodipine.
    src: { page: 31, quote: "Amlodipine in ciclosporine-induced hypertension." }
    status: unverified
  # ---------- p31-32: syndromes ----------
  - id: rheum.L02.037
    kind: enumerate
    topic: clinical
    prompt: Enumerate the four clinical syndromes caused by hyperuricaemia.
    points: [Acute urate synovitis (acute gout), Chronic polyarticular gout, Chronic tophaceous gout, Urate renal stones and chronic urate nephropathy]
    pass: 4
    src: { page: 31, quote: "Hyperuricaemia causes 4 clinical syndromes Acute urate synovitis- acute gout. Chronic polyarticular gout. Chronic tophaceous gout." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L02.038
    kind: card
    topic: clinical
    front: Natural history of gout (p31 figure)?
    back: High uric acid with no symptoms (could be 5 years or longer), then recurrent acute flares with intercritical periods that grow shorter and flares that grow longer and more severe, then advanced gout as crystal load rises.
    src: { page: 31, quote: "Natural History of Gout: Crystal Load Worsens if Uricemia Remains High" }
    status: unverified
  - id: rheum.L02.039
    kind: card
    topic: clinical
    front: Where do MSUM crystals preferentially deposit first?
    back: Peripheral connective tissues in and around synovial joints, lower limbs before upper; especially the first MTP and small joints of the feet and hands.
    src: { page: 32, quote: "Especially targeting the first metatarsophalangeal and small joints feet and hands." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L02.040
    kind: card
    topic: clinical
    front: Other common sites of gout besides the first MTP?
    back: Knee, ankle, midtarsal joints, small hand joints, wrist and elbow.
    src: { page: 32, quote: "Other common sites: knee, ankle, midtarsal joints, small hand joints, wrist and elbow." }
    status: unverified
  - id: rheum.L02.041
    kind: card
    topic: clinical
    front: Why does gout have a long asymptomatic phase?
    back: MSUM crystals take months to years to grow to detectable sizes.
    src: { page: 32, quote: "MSUM crystals take months-years to grow to detectable sizes - a long asymptomatic phase." }
    status: unverified
  - id: rheum.L02.042
    kind: card
    topic: clinical
    front: How does secondary osteoarthritis develop in gout?
    back: Growing crystal deposits involve more proximal sites and damage cartilage and bone through both inflammation and mass pressure effects.
    src: { page: 32, quote: "cartilage + bone damage from both inflammation and mass pressure effects and development of 2ry osteoarthritis." }
    status: unverified
