        why:
          - "صح: ده high risk (DLBCL bulky + LDH أكتر من 1500)، فـ IV fluids + xanthine oxidase inhibitor."
          - "ده للـ low risk بس."
          - "الكتاب بيقول لأ: بيرسّب calcium phosphate."
          - "الـ dialysis للـ established AKI، مش للوقاية."
      - kind: explain
        page: 416
        title: "لما الكلية تقف"
        quote: "Hemodialysis is efficient in removing uric acid; and serum uric acid levels fall by approximately 50% with each 6-hour treatment."
        text: |
          لو فيه **established AKI** خصوصًا **oliguric أو anuric**: ==emergent hemodialysis== بيصلح الـ electrolytes بسرعة وأمان.

          - الـ uric acid بينزل حوالي **50%** في كل جلسة **6 ساعات**.
          - الـ **continuous renal/kidney replacement therapy (CRRT)** مفيد لأنه بيمنع الـ **rebound** metabolic disturbances.
      - kind: reveal
        page: 416
        quote: "Continuous renal replacement may be particularly effective, avoids the risks of rebound metabolic disturbances."
        prompt: "ليه الـ uric acid بينزل 50% في جلسة الـ HD، وليه الـ CRRT بيمنع الـ rebound؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ **uric acid** والـ K والـ phosphate جزيئات صغيرة بتدوب في المية، فبتعدي من الـ dialyzer بسهولة. عشان كده النزول سريع (حوالي **50%** في كل **6 ساعات**، ده من الكتاب).

          بس الخلايا لسه **بتتكسر** بعد ما الجلسة تخلص، فالأرقام بتطلع تاني (rebound). الـ CRRT شغال **طول الوقت**، فبيشيل أول بأول.
