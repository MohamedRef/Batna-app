    front: What is first-line therapy for asymptomatic growing AMLs in TSC?
    back: "mTOR inhibitors (rapalogs: sirolimus, everolimus) for growing AMLs larger than 3 cm, since defective mTORC1 signaling is central to TSC."
    src: { page: 175, quote: "Defective mTORC1 signaling is a central feature of TSC. Recent international TSC guidelines recommend mTOR inhibitors (rapalogs) as the first-line therapy for the treatment of asymptomatic, growing AMLs larger than 3 cm in diameter.28 Sirolimus and everolimus are effective in reducing AML volume and/or postembolization response rates, with an acceptable safety profile, although they have a range of" }
