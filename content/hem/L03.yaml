  - id: hem.L03.160
    kind: mcq
    topic: pnh
    stem: A 28-year-old man has dark morning urine, pancytopenia, Coombs-negative haemolysis with LDH 1400 U/L, low ferritin, and new ascites with hepatomegaly. Which test is diagnostic?
    options:
      - Flow cytometry for CD59 and CD55 on red cells
      - Eosin-5-maleimide binding
      - ADAMTS13 activity
      - Fluorescent spot test
      - Direct antiglobulin test
    answer: 0
    why:
      - "Correct: PNH (haemolysis, pancytopenia, Budd-Chiari); flow cytometry for GPI-anchored CD59 and CD55 identifies the abnormal cells (p53)."
      - EMA binding confirms hereditary spherocytosis.
      - ADAMTS13 is for TTP, which does not cause Budd-Chiari.
      - The fluorescent spot test screens for G6PD.
      - The DAT is negative here and diagnoses immune haemolysis.
    src: { page: 53, quote: "The simplest method is to analyze expression of MIRL (CD59) on erythrocytes." }
    status: unverified
    tags: [high-yield]
