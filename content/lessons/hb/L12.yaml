        title: "المرض في سطور"
        text: |
          - **Rare genetic disorder**: **excessive accumulation of copper**، خصوصًا في **الكبد والمخ**.
          - **Autosomal recessive**، بسبب mutations في **ATP7B gene**، اللي بيبوّظ قدرة الجسم إنه **يطلّع النحاس** (يعمله excretion).
          - من غير علاج ممكن يموّت: **liver failure**، **neurological complications**، أو **psychiatric disturbances**.
          - بيصيب حوالي **1 في 30,000**، وأكتر في اللي عندهم family history.
          - الـ **carriers** مالهمش أعراض، فصعب نعرف عددهم في الناس.
      - kind: figure
        page: 200
        title: "رحلة النحاس"
        alt: "Copper from food enters the gut, where zinc blocks absorption. It goes to the liver. Normally ATP7B sends copper out into bile; in Wilson disease that exit is blocked, so copper builds up in the liver, causing hepatitis, acute liver failure or cirrhosis. Copper then spills into the blood and reaches the brain, eyes, red cells, kidneys, heart and bones. Chelators, penicillamine and trientine, pull copper out."
        caption: "الطريق الطبيعي: أمعاء → كبد → **bile**. في Wilson الـ **ATP7B** مقفول، فالنحاس بيتكوّم في الكبد وبعدين يطفح على كل حتة. الـ **zinc** بيقفل الباب في الأمعاء، والـ **chelators** بتشفط اللي اتراكم."
