items:
  # ---------- p57-58: composition of blood ----------
  - id: hem.L04.001
    kind: card
    topic: blood
    front: What kind of tissue is blood, and what is it made of?
    back: A specialized connective tissue of blood cells (formed elements) suspended in plasma.
    src: { page: 57, quote: "Specialized connective tissue Blood cells (formed elements) suspended in plasma" }
    status: unverified
  - id: hem.L04.002
    kind: cloze
    topic: blood
    text: "Blood volume is {{c1::5–6 liters}} in males and {{c2::4–5 liters}} in females."
    src: { page: 57, quote: "Blood volume: 5-6 liters (approx 1.5 gal) in males and 4-5 liters in females" }
    status: unverified
    tags: [numbers]
  - id: hem.L04.003
    kind: cloze
    topic: blood
    text: "The hematocrit is the % of blood volume made of {{c1::erythrocytes}}; the average is {{c2::47}} in males and {{c3::42}} in females."
    src: { page: 57, quote: "% of blood volume consisting of erythrocytes (red blood cells) – Male average 47; female average 42" }
    status: unverified
    tags: [numbers]
  - id: hem.L04.004
    kind: enumerate
    topic: blood
    prompt: Name the three important protein types in plasma.
    points: [Albumin, Globulins, Fibrinogen]
    pass: 3
    src: { page: 57, quote: "Water with many ions, molecules, and 3 types of important proteins: – Albumin – Globulins – Fibrinogen" }
    status: unverified
  - id: hem.L04.005
    kind: card
    topic: blood
    front: What is serum?
    back: The clear fluid left after blood is allowed to stand and clot; it is plasma without the clotting factors.
    src: { page: 58, quote: "Clear fluid serum is left = plasma without the clotting factors" }
    status: unverified
    tags: [high-yield]
  - id: hem.L04.006
    kind: card
    topic: blood
    front: What is the buffy coat, and where does it lie in a centrifuged tube?
    back: The layer of leukocytes and platelets, lying between the red cells and the plasma (under 1% of whole blood).
    src: { page: 58, quote: "When spun in centrifuge, buffy coat lies between RBCs and plasma: of leukocytes (white blood cells) and platelets" }
    status: unverified
  - id: hem.L04.007
    kind: table
    topic: blood
    title: A centrifuged tube of blood
    columns: [Layer, Contents, Share of whole blood]
    rows:
      - [Top, Plasma, "55%"]
      - [Middle, "Buffy coat: leukocytes and platelets", "<1%"]
      - [Bottom, Erythrocytes, "45%"]
    blanks: [[0, 2], [1, 1], [2, 2]]
    src: { page: 58, quote: "Plasma (55% of whole blood) Buffy coat: leukocytes and platelets (<1% of whole blood)" }
    status: unverified
    tags: [numbers]
  - id: hem.L04.008
    kind: card
    topic: blood
    front: Why does the lecture call the formed elements "not truly cells"?
    back: RBCs lack nuclei and organelles, platelets are only fragments, and most of them cannot divide.
    src: { page: 58, quote: "RBCs lack nuclei and organelles Platelets are fragments Most cannot divide" }
    status: unverified
  # ---------- p59-62: hematopoiesis and the CBC ----------
  - id: hem.L04.009
    kind: card
    topic: hematopoiesis
    front: Where does hematopoiesis mostly occur, and from which cell do all blood cells arise?
    back: Mostly in red bone marrow; all cells arise from the same pluripotent hematopoietic stem cell.
    src: { page: 59, quote: "Occurs mostly in red bone marrow All cells arise from same blood stem cell (pluripotent hematopoietic stem cells)" }
    status: unverified
  - id: hem.L04.010
    kind: enumerate
    topic: hematopoiesis
    prompt: Besides blood cells, what can adult mesenchymal stem cells form?
    points: [Fat cells, Osteoblasts, Chondrocytes, Fibroblasts, Muscle cells]
    pass: 4
    src: { page: 59, quote: "mesenchymal stem cells, which can also form fat cells, osteoblasts, chondrocytes, fibroblasts and muscle cells" }
    status: unverified
  - id: hem.L04.011
    kind: card
    topic: hematopoiesis
    front: Which blood cells do NOT arise from the myeloid stem cell?
    back: Lymphocytes; they come from the lymphoid stem cell. All other blood cells arise from myeloid stem cells.
    src: { page: 61, quote: "All except for lymphocytes arise from myeloid stem cells" }
    status: unverified
    tags: [high-yield]
  - id: hem.L04.012
    kind: card
    topic: hematopoiesis
    front: What does "committed" mean for a dividing stem cell, and what are these cells also called?
    back: As they divide they can only become one kind of cell; they are also called colony-forming units (CFUs).
    src: { page: 61, quote: "As the cells divide they become ―committed,‖ that is, they can only become one kind of cell Also called CFU‘s (colony-forming units)" }
    status: unverified
  - id: hem.L04.013
    kind: card
    topic: hematopoiesis
    front: What does a bone marrow section show between the bone trabeculae (Figure, p60)?
    back: Fat cells, immature blood cells outside the sinusoids, megakaryocytes on a reticular fiber network, and erythrocytes in the blood sinusoids.
    src: { page: 60, quote: "Immature blood cells outside sinusoids Erythrocytes in sinusoids" }
    status: unverified
  - id: hem.L04.014
    kind: table
    topic: hematopoiesis
    title: Normal CBC values (p62)
    columns: [Test, Normal range]
    rows:
      - [WBC, "4,000–10,000 /mm³"]
      - [RBC, "4.2–5.9 million /mm³"]
      - [Hemoglobin, "Males 14–18 g/dL; females 12–16 g/dL"]
      - [Hematocrit, "Males 40–54%; females 37–47%"]
      - [MCV, "86–98 µm³ per cell"]
      - [MCH, "27–32 pg per RBC"]
      - [RDW, "11.5–14.5"]
      - [Platelets, "150,000–400,000 /mm³"]
    blanks: [[0, 1], [2, 1], [4, 1], [7, 1]]
    src: { page: 62, quote: "WBC: White Blood Cells: 4,000 - 10,000 / mm" }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L04.015
    kind: table
    topic: hematopoiesis
    title: Normal WBC differential (p62)
    columns: [Cell, Share of WBCs]
    rows:
      - [Neutrophils, "40–75%"]
      - [Lymphocytes, "15–45%"]
      - [Monocytes, "1–10%"]
      - [Eosinophils, "1–6%"]
      - [Basophils, "0–2%"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 62, quote: "Neutrophils: 40-75% Lymphocytes: 15-45% Monocytes: 1-10% Eosinophils: 1-6% Basophils: 0-2%" }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L04.016
    kind: card
    topic: hematopoiesis
    front: What does the CBC report, and what is the WBC differential?
    back: Hemoglobin, hematocrit, RBC count, WBC count and platelet count; the differential (if ordered) breaks the WBC count down into each cell type.
    src: { page: 62, quote: "WBC in thousands/cumm – Differential if ordered: broken down to amount of each type WBC Platelet count in thousands/cumm" }
    status: unverified
  # ---------- p63-64: leukocytes ----------
  - id: hem.L04.017
    kind: card
    topic: leukocytes
    front: Which cells make up the phagocytes?
    back: The granulocytes (neutrophils, eosinophils and basophils) together with monocytes.
    src: { page: 63, quote: "Granulolcytes, which include three types of cells: neutrophils, eosinophils & basophils; together with monocyte comprise the phagocytes." }
    status: unverified
    tags: [high-yield]
  - id: hem.L04.018
    kind: card
    topic: leukocytes
    front: Which cells make up the immunocytes?
    back: Lymphocytes, their precursor cells, and plasma cells.
    src: { page: 63, quote: "Lymphocyte, their precursor cells and plasma cells make up the immunocytes." }
    status: unverified
  - id: hem.L04.019
    kind: card
    topic: leukocytes
    front: Which white cells are normally found in the peripheral blood?
    back: Only mature phagocytic cells and lymphocytes.
    src: { page: 63, quote: "Normally only mature phagocytic cells and lymphocytes are found in the peripheral blood." }
    status: unverified
  - id: hem.L04.020
    kind: card
    topic: leukocytes
    front: How do T cells attack, and what is their main killer type?
    back: They attack foreign cells directly; cytotoxic (CD8+) killer cells are a main type. The T cell binds the target, secretes proteins that lyse its membrane, signals it to die, then detaches.
    src: { page: 64, quote: "T cells attack foreign cells directly - Killer cells (―cytotoxic‖), or CD8+ is a main type" }
    status: unverified
  - id: hem.L04.021
    kind: order
    topic: leukocytes
    prompt: Order how B cells lead to the destruction of bacteria.
    steps:
      - B cells differentiate into plasma cells
      - Plasma cells secrete antibodies
      - Antibodies bind antigens on the bacteria
      - Macrophages avidly phagocytose the antibody-coated bacteria
    src: { page: 64, quote: "Differentiate into plasma cells Plasma cells secrete antibodies Antibodies flag cells for destruction by macrophages" }
    status: unverified
  - id: hem.L04.022
    kind: cloze
    topic: leukocytes
    text: "Monocytes are {{c1::4–8%}} of WBCs; in connective tissue they transform into {{c2::macrophages}}."
    src: { page: 64, quote: "Monocytes 4-8% of WBCs In connective tissue they transform into macrophages (phagocytic cells with pseudopods)" }
    status: unverified
    tags: [numbers]
  - id: hem.L04.023
    kind: enumerate
    topic: leukocytes
    prompt: Name the three lymphocyte types in the lecture.
    points: [T cells, B cells, Natural killer cells]
    pass: 3
    src: { page: 64, quote: "B cells plus ―natural killer cells‖" }
    status: unverified
  # ---------- p64-65: classification and morphology ----------
  - id: hem.L04.024
    kind: enumerate
    topic: morphology
    prompt: Enumerate the ways leukocyte disorders are classified.
    points: [Benign or malignant, Hereditary or acquired, Functional or numerical, Morphological]
    pass: 4
    src: { page: 64, quote: "Classification of Leukocyte Disorders Benign or Malignant Hereditary or Acquired" }
    status: unverified
  - id: hem.L04.025
    kind: card
    topic: morphology
    front: What is the Barr body on a female neutrophil?
    back: A drumstick appendage of the nucleus; it represents the inactive X chromosome.
    src: { page: 65, quote: "Barr bodies: Drumstick appendage in females, it represents inactive X chromosome." }
    status: unverified
  - id: hem.L04.026
    kind: card
    topic: morphology
    front: "Pelger-Huët anomaly: what does the neutrophil look like?"
    back: Bilobed. (Congenital; the acquired pseudo-Pelger-Huët form is seen in myelodysplasia.)
    src: { page: 65, quote: "Pelger Huet anomaly: bilobed neutrophil" }
    status: unverified
    tags: [high-yield]
  - id: hem.L04.027
    kind: card
    topic: morphology
    front: How is congenital neutrophil hypersegmentation inherited?
    back: Autosomal dominant.
    src: { page: 65, quote: "Neutrophil Hypersegmentation: Autosomal Dominant" }
    status: unverified
  - id: hem.L04.028
    kind: card
    topic: morphology
    front: "Chediak-Higashi syndrome: inheritance and the hallmark on the blood film?"
    back: Rare autosomal recessive disorder; giant blue-grey granules in the cytoplasm of granulocytes, monocytes and lymphocytes.
    src: { page: 65, quote: "a rare autosomal recessive disorder characterized by oculocutaneous albinism, recurrent and severe bacterial infections, giant blue-grey granules" }
    status: unverified
    tags: [high-yield]
  - id: hem.L04.029
    kind: enumerate
    topic: morphology
    prompt: Enumerate the clinical features of Chediak-Higashi syndrome.
    points:
      - Oculocutaneous albinism (photophobia, sun sensitivity)
      - Recurrent severe bacterial infections, especially Staph aureus
      - Giant blue-grey cytoplasmic granules in granulocytes, monocytes and lymphocytes
      - Mild bleeding diathesis
      - Progressive peripheral neuropathy
      - Cranial nerve abnormalities
    pass: 5
    src: { page: 65, quote: "a mild bleeding diathesis, progressive peripheral neuropathy and cranial nerve abnormalities." }
    status: unverified
  - id: hem.L04.030
    kind: card
    topic: morphology
    front: Treatment of Chediak-Higashi syndrome?
    back: Bone marrow transplantation (BMT).
    src: { page: 65, quote: "Infections, esp Staph aureus TX: BMT" }
    status: unverified
  - id: hem.L04.031
    kind: table
    topic: morphology
    title: Acquired variations in neutrophil morphology
    columns: [Finding, Cause]
    rows:
      - [Toxic granulation, Infection]
      - [Hypersegmented neutrophils, "Megaloblastic anemia; cytotoxic drugs"]
      - [Pseudo-Pelger-Huët (acquired), Myelodysplasia]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 65, quote: "Toxic Granulation: Infection Hypersegmented Neutrophils: megaloblastic anemia, cytotoxic drugs Pseudo-Pelger Huet(acquired): myelodysplasia" }
    status: unverified
    tags: [high-yield]
  - id: hem.L04.032
    kind: mcq
    topic: morphology
    stem: A 4-year-old boy with silvery hair and light skin has had repeated Staph aureus skin abscesses and photophobia. His film shows giant blue-grey granules in neutrophils and lymphocytes. Which treatment does the lecture give for this condition?
    options:
      - Bone marrow transplantation
      - Long-term vitamin B12
      - G-CSF alone
      - Splenectomy
      - No treatment; it is a harmless variant
    answer: 0
    why:
      - "Correct: this is Chediak-Higashi syndrome, and the lecture's treatment is BMT (p65)."
      - "B12 treats megaloblastic anemia, which causes hypersegmentation, not giant granules."
      - "G-CSF raises the count but does not fix the granule defect; the lecture lists BMT."
      - "Splenectomy is not the lecture's treatment for Chediak-Higashi."
      - "Harmless variants are Pelger-Huët and hereditary hypersegmentation; this child has severe infections."
    src: { page: 65, quote: "Infections, esp Staph aureus TX: BMT" }
    status: unverified
  - id: hem.L04.033
    kind: mcq
    topic: morphology
    stem: A 74-year-old man with macrocytic anemia and thrombocytopenia has many bilobed neutrophils on his film. He had a normal film 5 years ago. What does this finding suggest?
    options:
      - Myelodysplasia (pseudo-Pelger-Huët)
      - Congenital Pelger-Huët anomaly
      - Severe bacterial infection
      - Chediak-Higashi syndrome
      - Inactive X chromosome
    answer: 0
    why:
      - "Correct: an acquired bilobed neutrophil is pseudo-Pelger-Huët, seen in myelodysplasia (p65)."
      - "The congenital anomaly would have been present on his earlier film."
      - "Infection gives toxic granulation."
      - "Chediak-Higashi shows giant granules in a child with albinism."
      - "The inactive X is the Barr body (drumstick) in females."
    src: { page: 65, quote: "Pseudo-Pelger Huet(acquired): myelodysplasia" }
    status: unverified
  # ---------- p66: shift to the left, leukoerythroblastic, leukemoid ----------
  - id: hem.L04.034
    kind: card
    topic: blood-film
    front: Define "shift to the left".
    back: An increase in band forms, with occasional more primitive cells, in the peripheral blood.
    src: { page: 66, quote: "Shift to the left: increase in the number of band forms and the occasional presence of more primitive cells in the peripheral blood." }
    status: unverified
    tags: [high-yield]
  - id: hem.L04.035
    kind: card
    topic: blood-film
    front: Define the leukoerythroblastic picture.
    back: A shift to the left plus nucleated RBCs in the peripheral blood.
    src: { page: 66, quote: "Leukoerythroblastic picture: a presence of a shift to left plus nucleated RBC in the peripheral blood." }
    status: unverified
    tags: [high-yield]
  - id: hem.L04.036
    kind: enumerate
    topic: blood-film
    prompt: Enumerate the causes of a leukoerythroblastic blood film.
    points:
      - Metastatic neoplasm in the marrow
      - Primary myelofibrosis
      - Acute and chronic myeloid leukemia
      - Myeloma, lymphoma
      - Miliary tuberculosis
      - Severe megaloblastic anemia
      - Severe hemolysis
      - Osteopetrosis
    pass: 6
    src: { page: 66, quote: "Metastatic neoplasm in the marrow Primary myelofi brosis Acute and chronic myeloid leukaemia Myeloma, lymphoma Miliary tuberculosis" }
    status: unverified
    tags: [high-yield]
  - id: hem.L04.037
    kind: card
    topic: blood-film
    front: Define the leukemoid reaction.
    back: A reactive excessive leukocytosis with immature cells (myeloblasts, promyelocytes, myelocytes) in the peripheral blood; in other words, leukocytosis plus left shift. Usually neutrophilic, but it can be lymphoid.
    src: { page: 66, quote: "a reactive excessive leukocytosis with the presence of immature cells (myeloblasts, promyelocytes and myelocyte) in the peripheral blood." }
    status: unverified
    tags: [high-yield]
  - id: hem.L04.038
    kind: enumerate
    topic: blood-film
    prompt: Causes of a leukemoid reaction?
    points: [Severe infection, Severe hemolysis, Metastatic cancer]
    pass: 3
    src: { page: 66, quote: "Causes : 1. Severe infection 2. Severe haemolysis 3. Metastatic cancer" }
    status: unverified
  - id: hem.L04.039
    kind: cloze
    topic: blood-film
    text: "Leukemoid reaction = {{c1::leukocytosis}} + {{c2::left shift}}; leukoerythroblastic picture = left shift + {{c3::nucleated RBCs}}."
    src: { page: 66, quote: "In other words (leukocytosis + left shift). Usually it is a neutrophil leukocytosis. It can be lymphoid" }
    status: unverified
  - id: hem.L04.040
    kind: mcq
    topic: blood-film
    stem: A 60-year-old woman treated for breast cancer 4 years ago has bone pain. Her film shows myelocytes, a few myeloblasts and nucleated red cells. What is this picture called?
    options:
      - Leukoerythroblastic picture
      - Simple shift to the left
      - Toxic granulation
      - Pseudo-Pelger-Huët anomaly
      - Basophilia
    answer: 0
    why:
      - "Correct: a left shift plus nucleated RBCs is leukoerythroblastic; marrow metastasis is its first listed cause (p66)."
      - "A plain left shift has no nucleated RBCs."
      - "Toxic granulation is a granule change of infection."
      - "Pseudo-Pelger-Huët is a bilobed nucleus in myelodysplasia."
      - "Basophilia is a raised basophil count, not immature cells."
    src: { page: 66, quote: "Leukoerythroblastic picture: a presence of a shift to left plus nucleated RBC in the peripheral blood." }
    status: unverified
  - id: hem.L04.041
    kind: mcq
    topic: blood-film
    stem: Which of these is listed by the lecture as a cause of BOTH a leukoerythroblastic film and a leukemoid reaction?
    options:
      - Severe hemolysis
      - Osteopetrosis
      - Primary myelofibrosis
      - Miliary tuberculosis
      - Severe megaloblastic anemia
    answer: 0
    why:
      - "Correct: severe hemolysis (and metastatic cancer) appear in both lists (p66)."
      - "Osteopetrosis is only in the leukoerythroblastic list."
      - "Primary myelofibrosis is only in the leukoerythroblastic list."
      - "Miliary TB is in the leukoerythroblastic list, not the leukemoid one."
      - "Severe megaloblastic anemia is only in the leukoerythroblastic list."
    src: { page: 66, quote: "Causes : 1. Severe infection 2. Severe haemolysis 3. Metastatic cancer" }
    status: unverified
  # ---------- p67-68: neutrophilia and neutropenia ----------
  - id: hem.L04.042
    kind: enumerate
    topic: neutrophils
    prompt: Enumerate the causes of neutrophilia.
    points:
      - Bacterial infection
      - Inflammatory conditions
      - Neoplasia
      - Metabolic conditions
      - Hemorrhage, hemolysis
      - Myeloproliferative disorders
      - Drugs (corticosteroids, lithium, tetracycline)
      - Myeloid growth factors (G-CSF)
      - Rare inherited disorders
      - Asplenia
    pass: 7
    src: { page: 67, quote: "Infection (bacterial) 2. Inflammatory conditions 3. Neoplasia 4. Metabolic conditions 5. Hemorrhage, Hemolysis 6. MPD" }
    status: unverified
    tags: [high-yield]
  - id: hem.L04.043
    kind: card
    topic: neutrophils
    front: How do corticosteroids cause neutrophilia?
    back: They inhibit margination, so neutrophils stay in the circulating pool.
    src: { page: 67, quote: "Drugs (e.g. corticosteroid therapy (inhibits margination): lithium, tetracycline)" }
    status: unverified
  - id: hem.L04.044
    kind: cloze
    topic: neutrophils
    text: "The lower limit of the normal neutrophil count is {{c1::2.5 × 10⁹/L}}, except in black people and in the Middle East, where {{c2::1.5 × 10⁹/L}} is normal."
    src: { page: 67, quote: "lower limit of the normal neutrophil count is 2.5 *10 9 /L except in black people and in the Middle East" }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L04.045
    kind: cloze
    topic: neutrophils
    text: "When the absolute neutrophil count falls below {{c1::0.5 × 10⁹/L}}, the patient is likely to have {{c2::recurrent infections}}."
    src: { page: 67, quote: "When the absolute neutrophil level falls below 0.5 *10 9/L the patient is likely to have recurrent infections" }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L04.046
    kind: enumerate
    topic: neutrophils
    prompt: Enumerate the causes of neutropenia.
    points:
      - Congenital (Kostmann syndrome)
      - Cyclical neutropenia
      - Marrow aplasia
      - Megaloblastic anemia
      - Infections (typhoid, miliary TB, viral hepatitis)
      - Drugs
      - Irradiation
      - Immune disorders
      - Hypersplenism
    pass: 7
    src: { page: 68, quote: "Infections (typhoid, miliary TB, viral hepatitis) 6. Drugs 7. Irradiation 8. Immune disorders 9. Hypersplenism" }
    status: unverified
    tags: [high-yield]
  - id: hem.L04.047
    kind: card
    topic: neutrophils
    front: Name the congenital cause of neutropenia given in the lecture.
    back: Kostmann syndrome.
    src: { page: 67, quote: "Congenital (kostmann‘s syndrome) 2. Cyclical neutropenia" }
    status: unverified
  - id: hem.L04.048
    kind: enumerate
    topic: neutrophils
    prompt: Which infections cause neutropenia (not neutrophilia), per the lecture?
    points: [Typhoid, Miliary TB, Viral hepatitis]
    pass: 3
    src: { page: 68, quote: "Infections (typhoid, miliary TB, viral hepatitis)" }
    status: unverified
  - id: hem.L04.049
    kind: mcq
    topic: neutrophils
    stem: A healthy 30-year-old Egyptian man has a routine CBC before surgery. WBC 3,600/mm³ with an absolute neutrophil count of 1.6 × 10⁹/L. He has never had serious infections. How should this be read?
    options:
      - Normal for someone from the Middle East
      - Severe neutropenia with high infection risk
      - Kostmann syndrome until proven otherwise
      - Leukemoid reaction
      - Indication for granulocyte transfusion
    answer: 0
    why:
      - "Correct: in black people and in the Middle East, 1.5 × 10⁹/L is the normal lower limit (p67)."
      - "Recurrent infections are likely below 0.5 × 10⁹/L, not at 1.6."
      - "Kostmann is a congenital neutropenia with infections from childhood."
      - "A leukemoid reaction is an excessive leukocytosis."
      - "Granulocytes are for ANC below 0.5 with documented infection."
    src: { page: 67, quote: "except in black people and in the Middle East where 1.5 *10 9/L is normal." }
    status: unverified
  - id: hem.L04.050
    kind: mcq
    topic: neutrophils
    stem: A 45-year-old man on high-dose prednisolone for asthma has WBC 14,000/mm³ with 85% mature neutrophils. He is well, afebrile, and has no focus of infection. What best explains the count?
    options:
      - Corticosteroids inhibit neutrophil margination
      - Hidden bacterial infection is certain
      - Chronic myeloid leukemia
      - Leukoerythroblastic reaction
      - Hypersplenism
    answer: 0
    why:
      - "Correct: corticosteroid therapy causes neutrophilia by inhibiting margination (p67)."
      - "Infection is a cause, but a well, afebrile patient on steroids has an obvious drug cause."
      - "CML would show basophilia and a left shift with immature cells."
      - "There are no nucleated RBCs or primitive cells."
      - "Hypersplenism lowers the neutrophil count."
    src: { page: 67, quote: "Drugs (e.g. corticosteroid therapy (inhibits margination): lithium, tetracycline)" }
    status: unverified
  - id: hem.L04.051
    kind: mcq
    topic: neutrophils
    stem: Which of the following causes neutrophilia rather than neutropenia, according to the lecture?
    options:
      - Asplenia
      - Hypersplenism
      - Typhoid fever
      - Megaloblastic anemia
      - Irradiation
    answer: 0
    why:
      - "Correct: asplenia is the 10th cause of neutrophilia (p67)."
      - "Hypersplenism is a cause of neutropenia (p68)."
      - "Typhoid causes neutropenia (p68)."
      - "Megaloblastic anemia causes neutropenia (p67)."
      - "Irradiation causes neutropenia (p68)."
    src: { page: 67, quote: "Rare inherited disorders 10. Asplenia" }
    status: unverified
  # ---------- p68-69: eosinophils, basophils, monocytes, lymphocytes ----------
