    stem: A 50-year-old woman has intermittent chest pain and dysphagia, worse at exam time for her children. Barium shows a corkscrew esophagus. Manometry shows repetitive contractions of 200 mmHg lasting 7 seconds with rapid propagation at onset. Diagnosis?
    options: [Diffuse esophageal spasm, Achalasia type I, Spastic nutcracker with normal peristaltic onset, Eosinophilic esophagitis, Peptic stricture]
