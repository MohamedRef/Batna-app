            <text x="56" y="227" class="t-sm t-b">Mesangium</text>
            <text x="250" y="218" class="t-sm t-good t-b">I / II</text>
            <text x="250" y="234" class="t-sm t-mut">mesangial</text>
          </svg>
      - kind: table
        page: 449
        quote: "Figure 3: Histopathology classification of lupus nephritis according to the criteria established by the International Society of Nephrology and the Renal Pathology Society (ISN/RPS) in 2003 revised in 2018\n| Class | Name | Description |\n| Class I | Minimal Mesangial Lupus Nephritis | Deposition of imune complexes detectable by immunofluorescence techniques. |\n| Class II | Mesangial Proliferative Lupus Nephritis | Mesangial hipercelularity of any degree or mesangial matrix expansion with immune deposits detectable by light microscopy. |\n| Class III | Focal Lupus Nephritis | Active or inactive focal, segmental or global endo/extracapillary glomerulonephritis involving <50% of all glomeruli. |\n| | | Manifestations include active lesions (A), chronic inactive lesions (C) or active and chronic lesions (A/C) |\n| Class IV | Diffuse Lupus Nephritis | Active or inactive diffuse, segmental or global endo/extracapillary glomerulonephritis involving ≥50% of all glomeruli. Subendothelial diffuse immune deposits, with or without mesangial alterations, are common. |\n| | | This class is also divided in: diffuse segmental (IV-S), when ≥ 50% of the involved glomeruli have segmental lesions, and diffuse global (IV-G), when ≥ 50% of the involved glomeruli have global lesions. |\n| | | It can also manifest A, C or A/C lesions. |\n| Class V | Membranous Lupus Nephritis | Global or segmental subepithelial immune deposition or their morphologic sequelae detectable by light, immunofluorescence or electron microscopy, with or without mesangial alterations. |\n| | | It can occur in combination with class III or IV and it can manifest advanced sclerosis. |\n| Class VI | Advanced Sclerosis Lupus Nephritis | Lupus Nephritis with terminal prognosis. |\n| | | ≥90% of the glomeruli in global sclerosis. |"
        title: "ISN/RPS histopathology classification of lupus nephritis"
        columns: [Class, Name, Key]
        rows:
          - [I, Minimal mesangial, "Normal on LM; mesangial deposits on IF"]
          - [II, Mesangial proliferative, "Mesangial hypercellularity or matrix"]
          - [III, Focal, "<50% of glomeruli"]
          - [IV, Diffuse, "≥50% of glomeruli; IV-S or IV-G"]
          - [V, Membranous, "Subepithelial; may combine with III/IV"]
          - [VI, Advanced sclerosing, "≥90% globally sclerosed"]
        hide: [[2, 2], [3, 2], [4, 1], [5, 2]]
      - kind: mnemonic
        page: 449
        quote: "Figure 3: Histopathology classification of lupus nephritis according to the criteria established by the International Society of Nephrology and the Renal Pathology Society (ISN/RPS) in 2003 revised in 2018\n| Class | Name | Description |\n| Class I | Minimal Mesangial Lupus Nephritis | Deposition of imune complexes detectable by immunofluorescence techniques. |\n| Class II | Mesangial Proliferative Lupus Nephritis | Mesangial hipercelularity of any degree or mesangial matrix expansion with immune deposits detectable by light microscopy. |\n| Class III | Focal Lupus Nephritis | Active or inactive focal, segmental or global endo/extracapillary glomerulonephritis involving <50% of all glomeruli. |\n| | | Manifestations include active lesions (A), chronic inactive lesions (C) or active and chronic lesions (A/C) |\n| Class IV | Diffuse Lupus Nephritis | Active or inactive diffuse, segmental or global endo/extracapillary glomerulonephritis involving ≥50% of all glomeruli. Subendothelial diffuse immune deposits, with or without mesangial alterations, are common. |\n| | | This class is also divided in: diffuse segmental (IV-S), when ≥ 50% of the involved glomeruli have segmental lesions, and diffuse global (IV-G), when ≥ 50% of the involved glomeruli have global lesions. |\n| | | It can also manifest A, C or A/C lesions. |\n| Class V | Membranous Lupus Nephritis | Global or segmental subepithelial immune deposition or their morphologic sequelae detectable by light, immunofluorescence or electron microscopy, with or without mesangial alterations. |\n| | | It can occur in combination with class III or IV and it can manifest advanced sclerosis. |\n| Class VI | Advanced Sclerosis Lupus Nephritis | Lupus Nephritis with terminal prognosis. |\n| | | ≥90% of the glomeruli in global sclerosis. |"
        word: "MM FD MS"
        parts:
          - key: "M M"
            text: "I Minimal mesangial, II Mesangial proliferative"
          - key: "F D"
            text: "III Focal (<50%), IV Diffuse (≥50%)"
          - key: "M S"
            text: "V Membranous, VI Sclerosing (≥90%)"
        hook: "اقراها **2-2-2**: أزواج من الأخف للأتقل. والأرقام **50** و **90** هما الحدود الوحيدة اللي محتاج تحفظها."
      - kind: explain
        page: 449
        title: "IV-S ولا IV-G؟ و A ولا C؟"
        quote: "Figure 3: Histopathology classification of lupus nephritis according to the criteria established by the International Society of Nephrology and the Renal Pathology Society (ISN/RPS) in 2003 revised in 2018\n| Class | Name | Description |\n| Class I | Minimal Mesangial Lupus Nephritis | Deposition of imune complexes detectable by immunofluorescence techniques. |\n| Class II | Mesangial Proliferative Lupus Nephritis | Mesangial hipercelularity of any degree or mesangial matrix expansion with immune deposits detectable by light microscopy. |\n| Class III | Focal Lupus Nephritis | Active or inactive focal, segmental or global endo/extracapillary glomerulonephritis involving <50% of all glomeruli. |\n| | | Manifestations include active lesions (A), chronic inactive lesions (C) or active and chronic lesions (A/C) |\n| Class IV | Diffuse Lupus Nephritis | Active or inactive diffuse, segmental or global endo/extracapillary glomerulonephritis involving ≥50% of all glomeruli. Subendothelial diffuse immune deposits, with or without mesangial alterations, are common. |\n| | | This class is also divided in: diffuse segmental (IV-S), when ≥ 50% of the involved glomeruli have segmental lesions, and diffuse global (IV-G), when ≥ 50% of the involved glomeruli have global lesions. |\n| | | It can also manifest A, C or A/C lesions. |\n| Class V | Membranous Lupus Nephritis | Global or segmental subepithelial immune deposition or their morphologic sequelae detectable by light, immunofluorescence or electron microscopy, with or without mesangial alterations. |\n| | | It can occur in combination with class III or IV and it can manifest advanced sclerosis. |\n| Class VI | Advanced Sclerosis Lupus Nephritis | Lupus Nephritis with terminal prognosis. |\n| | | ≥90% of the glomeruli in global sclerosis. |"
        text: |
          - "**IV-S**: ≥50% من الـ glomeruli **المصابة** فيها lesions **segmental**."
          - "**IV-G**: ≥50% منها **global**."
          - **A** = active، **C** = chronic inactive، **A/C** = الاتنين.

          الـ A معناه فيه حاجة تتعالج، الـ C معناه scar مش هيرجع.
      - kind: check
        page: 449
        quote: "Figure 3: Histopathology classification of lupus nephritis according to the criteria established by the International Society of Nephrology and the Renal Pathology Society (ISN/RPS) in 2003 revised in 2018\n| Class | Name | Description |\n| Class I | Minimal Mesangial Lupus Nephritis | Deposition of imune complexes detectable by immunofluorescence techniques. |\n| Class II | Mesangial Proliferative Lupus Nephritis | Mesangial hipercelularity of any degree or mesangial matrix expansion with immune deposits detectable by light microscopy. |\n| Class III | Focal Lupus Nephritis | Active or inactive focal, segmental or global endo/extracapillary glomerulonephritis involving <50% of all glomeruli. |\n| | | Manifestations include active lesions (A), chronic inactive lesions (C) or active and chronic lesions (A/C) |\n| Class IV | Diffuse Lupus Nephritis | Active or inactive diffuse, segmental or global endo/extracapillary glomerulonephritis involving ≥50% of all glomeruli. Subendothelial diffuse immune deposits, with or without mesangial alterations, are common. |\n| | | This class is also divided in: diffuse segmental (IV-S), when ≥ 50% of the involved glomeruli have segmental lesions, and diffuse global (IV-G), when ≥ 50% of the involved glomeruli have global lesions. |\n| | | It can also manifest A, C or A/C lesions. |\n| Class V | Membranous Lupus Nephritis | Global or segmental subepithelial immune deposition or their morphologic sequelae detectable by light, immunofluorescence or electron microscopy, with or without mesangial alterations. |\n| | | It can occur in combination with class III or IV and it can manifest advanced sclerosis. |\n| Class VI | Advanced Sclerosis Lupus Nephritis | Lupus Nephritis with terminal prognosis. |\n| | | ≥90% of the glomeruli in global sclerosis. |"
        question: "A biopsy shows subendothelial deposits in 30% of glomeruli with active lesions. Which class?"
        options:
          - "Class III (A)"
          - "Class IV-S (A)"
          - "Class V"
          - "Class VI"
        answer: 0
        why:
          - "صح: subendothelial في أقل من 50% = focal = III."
          - "الـ class IV محتاج ≥50% من الـ glomeruli."
          - "الـ V يعني subepithelial deposits."
          - "الـ VI يعني ≥90% global sclerosis."
      - kind: explain
        page: 451
        title: "Class I و II"
        quote: "Patients with Class I or Class II LN generally have normal kidney function, or at most, low- grade proteinuria that is well below the nephrotic-range, and sometimes microscopic hematuria. For these patients, no specific immunosuppressive therapy beyond what is being given for nonrenal lupus is needed."
        text: |
          عادةً الـ kidney function **normal** والـ proteinuria قليلة، وساعات microscopic hematuria.

          **مفيش immunosuppression خاص بالكلية**: العلاج على حسب الـ **extrarenal** manifestations.
      - kind: explain
        page: 452
        title: "Lupus podocytopathy"
        quote: "Although there have been no RCTs, observational data showed that over 90% of patients given glucocorticoid monotherapy achieved remission within a median time of 4 weeks."
        text: |
          Class **I أو II** على الـ biopsy بس معاه **nephrotic syndrome**؟ ده ==lupus podocytopathy==.
          - الـ electron microscopy (EM) بيبين **diffuse podocyte effacement**.
          - شبه **minimal change disease (MCD)** أو **focal segmental glomerulosclerosis (FSGS)**، فبيتعالج زي الـ **MCD**.
          - أكتر من **90%** بيعملوا remission على glucocorticoids لوحدها في متوسط **4 أسابيع**.
          - "بس بيرجع بعد الـ taper، فاعمل maintenance: **low-dose steroid** + mycophenolic acid analogues (MPAA) أو azathioprine أو calcineurin inhibitor (CNI)."
      - kind: aside
        tone: exam
        text: "سؤال مشهور: class II مع nephrotic range proteinuria. الإجابة مش \"زوّد الـ immunosuppression\"، الإجابة \"lupus podocytopathy، اعمل EM وعالجه زي MCD\"."
      - kind: try
        items: [neph.L14.009, neph.L14.011, neph.L14.012, neph.L14.028, neph.L14.030]
    recap:
      - "I/II mesangial، III focal <50%، IV diffuse ≥50% (IV-S/IV-G)، V membranous، VI ≥90% sclerosis."
      - "Subendothelial = III/IV، subepithelial = V."
      - "Class I/II: علاج الـ extrarenal بس."
      - "Lupus podocytopathy: I/II + nephrotic؛ عالجه زي MCD، >90% remission في 4 أسابيع."
