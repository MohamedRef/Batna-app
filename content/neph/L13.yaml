    text: "FIDELIO-DKD: finerenone {{c1::10 mg}} if eGFR <60 and {{c2::20 mg}} if eGFR ≥60, added to ACEi or ARB (not both)."
    src: { page: 440, quote: "What's the Design of the \"Finerenone in Reducing Kidney Failure and Disease Progression in Diabetic Kidney Disease\" Trial (FIDELIO-DKD)?\nFIDELIO-DKD: 47 countries; Randomized, double-blind, placebo-controlled, parallel-group, event-driven trial; 5.5 years (expected duration); 5.734 patients; eGFR ≥25–<75 mL/min/1.73 m2; Urinary ACR ≥30–≤5,000 mg/g\n4-12 w Run In Period, then randomized to Finerenone or Placebo:\n  Finerenone 10mg if eGFR <60mL/min/1.73m2\n  Finerenone 20mg if eGFR ≥60mL/min/1.73m2\n  Dose titration (K+, eGFR)\n  Treatment with either ACEi or ARB but not both\n  Monthly visits\nPrimary Outcome: Time to renal composite event:\n  ↓ eGFR >40% from baseline\n  eGFR <15mL/min/1.73m2\n  ESRD (HD, PD or KTx)\nSecondary Outcome: Time to cardiovascular composite event:\n  CV death\n  Non-fatal myocardial infarction\n  Non-fatal stroke\n  Hospitalization for heart failure\n  All-cause mortality\n  All cause hospitalization\n  ΔUACR\nThe overall trial population is predominately male (70.2%) and white (65.9%), with a mean age of 65.6 years and a mean duration of diabetes of 16.6 years. Mean eGFR 44.3 mL/min/1.73 m2, mean serum potassium 4.4 mEq/L, and median UACR 851 mg/g.\nConclusion: The results of FIDELIO-DKD will determine whether an optimally treated cohort of T2D patients with CKD at high risk of progression of their renal disease and CV events will experience cardiorenal benefits with the addition of finerenone to their treatment regimen. Results are expected in 2020." }
    status: unverified
    tags: [numbers]
