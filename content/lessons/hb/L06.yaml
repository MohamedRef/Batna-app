ensated cirrhosis: insulin only; Avoid use of resmetirom in cirrhosis; CV risk reduction, same as for MASLD with stage F0-F1; caution with lipid-lowering medications in decompensated cirrhosis | Tailored to cirrhosis severity and presence of its complications. Screen for HCC |"
