  - id: hem.L11.lesson4
    title: "المريض هيعيش قد إيه، وهنعالجه بإيه؟"
    hook: "الـ β2-microglobulin هو البطل هنا. بعده الـ cytogenetics بتحدد هتدّي VRd ولا KRd."
    minutes: 10
    pages: [182, 186]
    topics: [prognosis, supportive, treatment]
    goals:
      - "تعمل ISS و R-ISS staging"
      - "تعرف الـ high-risk cytogenetics (mSMART)"
      - "تعرف الـ supportive care والـ regimens حسب الـ risk والـ fitness"
    status: unverified
    steps:
      - kind: table
        page: 183
        quote: "International Prognostic Index Stage 1 β2-M <3.5mg/L ALB=35g/L 62 mo"
        title: "الـ ISS: International Staging System"
        columns: ["Stage", "Criteria", "Median OS"]
        rows:
          - ["1", "β2-M < 3.5 mg/L, albumin ≥ 35 g/L", "62 mo"]
          - ["2", "Neither 1 nor 3", "41 mo"]
          - ["3", "β2-M > 5.5 mg/L", "29 mo"]
        hide: [[0, 1], [2, 1], [0, 2], [2, 2]]
      - kind: aside
        tone: tip
        page: 183
        quote: "International Prognostic Index Stage 1 β2-M <3.5mg/L ALB=35g/L 62 mo"
        text: "احفظ رقمين: 3.5 و 5.5 للـ β2-M، و 35 للـ albumin. والـ survival بيقل: 62 ← 41 ← 29 شهر."
      - kind: explain
        page: 183
        quote: "Revised ISS Staging System Normal LDH No t(4;14), t(14;16), or del(17p)"
        title: "R-ISS: زوّد LDH والـ cytogenetics"
        text: |
          الـ ==Revised ISS== أخد الـ ISS وزوّد عليه حاجتين:

          - **LDH**.
          - **High-risk cytogenetics**: t(4;14)، t(14;16)، del(17p).

          **Stage I**: albumin ≥ 3.5 g/dL و β2-M < 3.5، LDH طبيعي، ومفيش high-risk cytogenetics.
          **Stage III**: β2-M ≥ 5.5 **+** LDH عالي **أو** high-risk cytogenetics.
          **Stage II**: أي حاجة مش I ولا III.
      - kind: check
        page: 183
        quote: "High LDH, OR t(4;14), t(14;16), or del(17p)"
        question: "β2-M 6.0 mg/L, normal LDH, standard-risk FISH. R-ISS stage?"
        options: ["II", "III", "I", "Cannot tell"]
        answer: 0
        why:
          - "صح: β2-M عالي بس مفيش LDH عالي ولا high-risk cytogenetics، فمش III. ومش I. يبقى II."
          - "الـ III محتاج β2-M ≥ 5.5 **مع** LDH عالي أو cytogenetics وحشة."
          - "الـ I محتاج β2-M < 3.5."
          - "عندك كل اللي محتاجه."
      - kind: explain
        page: 184
        quote: "Cytogenetic status (the most important prognostic factor) particularly hypodiploidy, t (4;14) and p53 deletion."
        title: "الـ prognostic factors"
        text: |
          الـ median survival حوالي **3 سنين**، والفرق بين مريض والتاني من:

          - **Host**: السن والـ performance status.
          - **Clone**: plasmablastic morphology، proliferation، و ==cytogenetics== (أهم prognostic factor): hypodiploidy، t(4;14)، p53 deletion.
          - **Mass and complications**: ==β2-microglobulin== (most powerful)، Hb، circulating plasma cells، الكلى، CRP.
      - kind: sort
        page: 185
        quote: "Mayo Stratification of Myeloma and Risk-Adapted Therapy (mSMART) High Risk (25% of Patients) FISH: Deletion of 17p t(4;14) t(14;16)"
        prompt: "صنّف حسب الـ mSMART:"
        bins: ["High risk (25%)", "Standard risk (75%)"]
        cards:
          - { text: "del(17p)", bin: 0 }
          - { text: "t(4;14)", bin: 0 }
          - { text: "t(14;16)", bin: 0 }
          - { text: "Hypodiploidy", bin: 0 }
          - { text: "Labelling index ≥ 3%", bin: 0 }
          - { text: "Hyperdiploid", bin: 1 }
          - { text: "t(11;14)", bin: 1 }
          - { text: "t(6;14)", bin: 1 }
        why: "High (25%): del(17p)، t(4;14)، t(14;16)، deletion 13، hypodiploidy، PCLI ≥ 3%. Standard (75%): hyperdiploid، t(11;14)، t(6;14) وكل الباقي."
      - kind: mnemonic
        page: 185
        quote: "Mayo Stratification of Myeloma and Risk-Adapted Therapy (mSMART) High Risk (25% of Patients) FISH: Deletion of 17p t(4;14) t(14;16)"
        word: "BAD"
        parts:
          - { key: "B", text: "Both 14s: t(4;14) and t(14;16) = high risk" }
          - { key: "A", text: "Absent 17p: del(17p) = high risk (p53 lost)" }
          - { key: "D", text: "Diploidy low: hypodiploidy (and deletion 13) = high risk" }
        hook: "اللي يبدأ بـ 4 أو ينتهي بـ 16 مع الـ 14 وحش؛ الـ 11;14 و 6;14 كويسين."
      - kind: explain
        page: 184
        quote: "Epo for Hb persistently <10g/dL"
        title: "الـ supportive care"
        text: |
          - **أنيميا**: transfusion لو symptomatic، و **Epo** لو Hb أقل من 10 باستمرار.
          - **عضم**: local radiotherapy ==8-20 Gy== للوجع، تثبيت الكسور، و **bisphosphonate** long term.
          - **كلية**: urine output **3 L/day** مع الـ Bence Jones، allopurinol، dialysis، و plasmapheresis في الـ acute renal failure.
          - **Antibiotic prophylaxis**.
      - kind: order
        page: 185
        quote: "Hypercalcaemia: rehydration (3-6L/day IV), loop diuretics, IV bisphosphonate, (pamidronate or zoledronate)"
        prompt: "رتّب علاج الـ hypercalcaemia زي الكتاب:"
        steps: ["Rehydration 3-6 L/day IV", "Loop diuretic", "IV bisphosphonate (pamidronate or zoledronate)"]
        why: "مية الأول (المريض dehydrated والـ calcium بيزوّد الـ dehydration)، بعدين loop علشان يطلع calcium في البول، وبعدين bisphosphonate يوقف الـ osteoclasts."
      - kind: figure
