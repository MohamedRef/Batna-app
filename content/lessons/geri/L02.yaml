  - id: geri.L02.lesson6
    title: "أمراض الكلى بتظهر إزاي، والأدوية بتأذيها إزاي"
    hook: "سبع طرق يقولك بيها الجسم إن الكلية تعبانة، وخمس فحوصات تأكد بيها، وكام دوا ممكن يقلب الحكاية."
    minutes: 8
    pages: [30, 35]
    topics: [presentation, drugs]
    goals:
      - "تعدّ طرق ظهور أمراض الكلى وتعرف كل مجموعة جاية منين"
      - "تعدّ الفحوصات الخمسة"
      - "تعرف مخاطر الأدوية على الكلية العجوزة"
    status: unverified
    steps:
      - kind: explain
        remind: [geri.L02.032]
        page: 30
        title: "أمراض الكلى بتظهر إزاي؟"
        quote: "Symptomatic Patients\n  1- With disorder of micturition: frequency, nocturia , hesitancy, terminal dribbling , dysuria , or enuresis\n  2- With disorder of urine volume: oliguria , anuria, or polyuria\n  3- With alteration of urine components: hematuria , pigmenturia , proteinuria , pyuria , calculi , pneumaturia\n  4- With pain: renal colic, or flank pain\n  5- With renal mass\n  6- With edema\n  7- With symptoms or signs of impaired renal functions and uremia"
        text: |
          يا **asymptomatic**، يا **بأعراض كلى**، يا **مع مرض systemic** معروف إنه بيمس الكلى.

          الأعراض سبع مجموعات:
          1. **Micturition:** frequency، nocturia، hesitancy، terminal dribbling، dysuria، enuresis
          2. **Volume:** oliguria، anuria، polyuria
          3. **Urine components:** hematuria، pigmenturia، proteinuria، pyuria، calculi، pneumaturia
          4. **Pain:** renal colic أو flank pain
          5. **Renal mass**
          6. **Edema**
          7. **Uremia** وضعف وظايف الكلى

          إزاي تحفظهم من غير ما تصمّ؟ امشي مع البول من أوله لآخره: **طلوعه** (micturition) ← **كميته** (volume) ← **محتواه** (components) ← **الوجع** على طريقه ← **الكلية نفسها** (mass) ← **الميه اللي ما خرجتش** (edema) ← **السموم اللي ما خرجتش** (uremia).

          وليه عند الكبار كتير يجي **asymptomatic**؟ لأن الـ GFR بيقل ببطء والـ nephrons الباقية بتعوّض، فمفيش أعراض لحد ما الخسارة تبقى كبيرة. علشان كده بتكتشفه في تحليل روتيني.
      - kind: mnemonic
        page: 31
        quote: "Investigations of renal diseases\n  Biochemical investigations\n  Microbiological investigations.\n  Immunological investigations.\n  Histopathological investigations.\n  Radiological investigations"
