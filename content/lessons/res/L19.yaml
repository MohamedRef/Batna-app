    caption: 20% بس من الممارسات effective، و50% unevaluated، والأبحاث بتنزل بالآلاف كل يوم.
    alt: Bar of clinical practices (20% effective, 30% uncertain or harmful, 50% unevaluated) and articles per day (5,000
      biomedical, 2,000 MEDLINE, 75 trials).
  - kind: explain
    page: 16
    quote: |-
      Reality: Providers Don't Practice EBM...
      "The Quality of Health Care Delivered to Adults in the United States" NEJM June 26, 2003
    title: 'الحقيقة: الدكاترة مش بيطبّقوا'
    text: |
      دراسة في ==NEJM سنة 2003== قاست المرضى الكبار في أمريكا خدوا قد إيه من الـ ==recommended care==:

      | الحالة | % من الرعاية الموصى بيها |
      |---|--:|
      | Senile cataract | 78.7 |
      | Hypertension | 64.7 |
      | Asthma | 53.5 |
      | Diabetes mellitus | 45.4 |
      | Atrial fibrillation | 24.7 |
      | Alcohol dependence | 10.5 |

      (الجدول الكامل فيه 25 حالة؛ دي عيّنة منه.)

      ليه المحاضرة بتعرضها؟ لأنها بتورّي ==الفجوة بين الـ evidence والممارسة==: حتى أعلى حالة ما وصلتش 80%. التفسير المقبول (مش في الكتاب).
