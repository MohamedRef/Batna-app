        quote: "Cell cycle inhibitor marker (TIMP-2)x(IGFBP7)"
        title: "ليه الـ TIMP-2 × IGFBP7 بيسبق؟"
        text: |
          الكتاب: **cell cycle inhibitor marker**؛ الـ **AKI risk score = [TIMP-2]×[IGFBP7]**. **> 0.3** positive: ممكن يحصل moderate to severe AKI **خلال 12 ساعة**؛ **≤ 0.3** negative. والـ **KIM-1** marker للـ severity، والـ **NGAL** بيطلع خلال **ساعتين**.

          التفسير المقبول (مش في الكتاب): خلية الـ tubule لما تتعرّض لـ stress **بتوقف الانقسام** (cell cycle arrest) كإنها بتقول "استنى، مش وقت شغل". الـ TIMP-2 والـ IGFBP7 هما **إشارة الوقفة** دي، **فـ** بيطلعوا **قبل** ما الخلية تموت، يعني تحذير قبل الضرر مش بعده. والـ NGAL زي الـ troponin **لأن** بيطلع من الخلية المجروحة بسرعة.
      - kind: explain
        page: 122
        title: "الـ biomarker بيغيّر العلاج"
        quote: "Preventive strategy performed in high risk on pump cardiac surgery patients-single center trial Cell cycle inhibitor marker (TIMP-2)x(IGFBP7) levels are associated with adverse outcomes in ICU with AKI"
        text: |
          في عيانين cardiac surgery الـ **[TIMP-2]×[IGFBP7] ≥0.3** اتعملهم ==Kidney Disease: Improving Global Outcomes (KDIGO) care bundle==:
          - وقف ACE inhibitor (ACEi)/angiotensin II receptor blockers (ARBs) لـ 48 ساعة
          - optimize volume و perfusion لـ 12 ساعة، و pulse index continuous cardiac output (PiCCO) لو لزم
          - راقب serum creatinine (SCr) و urine output (UO)، وامنع hyperglycemia لـ 72 ساعة، وبدائل للـ contrast

          الـ AKI نزل من **71% لـ 55.1%**، والـ moderate–severe من **44.9% لـ 29.7%**.

          الخطوة الجاية بتشرح **ليه** كل بند في الـ bundle.
      - kind: explain
        page: 122
        quote: "Preventive strategy performed in high risk on pump cardiac"
        title: "ليه كل بند في الـ KDIGO bundle؟"
        text: |
          التفسير المقبول (مش في الكتاب) لبنود الـ bundle اللي في الكتاب (**preventive strategy** في **high risk on-pump cardiac** surgery):

          - **وقف ACEi/ARB 48 ساعة:** عشان الـ efferent يفضل مضيّق والـ GFR يتماسك في وقت الخطر.
          - **Volume و perfusion pressure:** الـ tubule الـ stressed محتاج دم وأكسجين.
          - **Monitoring بالـ SCr و UO:** عشان تلحق أي نزول بدري.
          - **Avoid hyperglycemia:** السكر العالي بيزوّد الـ oxidative stress على الخلية.
          - **Alternatives to contrast:** ضربة تانية على خلية أصلًا تعبانة.

          والنتيجة في الكتاب: الـ AKI نزل من **71% لـ 55.1%**. ورسمة ص 122 كمان بتقول إن الـ marker العالي من غير AKI بالـ creatinine (**subclinical AKI**) ليه outcomes أوحش من الـ negative، **يعني** الضرر حقيقي حتى لو الرقم ما اتحركش.
      - kind: figure
        page: 122
        quote: "Cell cycle inhibitor marker (TIMP-2)x(IGFBP7) levels are associated with adverse outcomes in ICU with AKI"
        title: "الـ marker والـ creatinine مع بعض: رسمة الكتاب"
