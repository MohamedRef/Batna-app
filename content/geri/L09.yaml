    status: unverified
    tags: [high-yield, book-question]
  - id: geri.L09.013
    kind: card
    topic: innate
    front: What happens to NK cells with age?
    back: Their number increases but their cytotoxicity falls (antibody-dependent cytotoxicity does not change).
    src: { page: 157, quote: "Natural killer cells (NK): increase number of NK, reduced cytotoxicity." }
    status: unverified
    tags: [high-yield]
