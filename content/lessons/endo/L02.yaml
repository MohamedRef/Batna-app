  - id: endo.L02.lesson6
    title: "العقد، الـ postpartum thyroiditis والـ pheo في الحمل"
    hook: "عقدة في الغدة وهي حامل: نعمل عملية دلوقتي ولا نستنى؟ الإجابة في الـ FNAB."
    minutes: 7
    pages: [28, 29]
    topics: [nodules-ppt, pheo]
    goals:
      - "تعرف امتى نعمل FNAB وامتى نعمل جراحة في الحمل"
      - "تتعرف على الـ postpartum thyroiditis"
      - "تعرف علاج الـ pheo في الحمل حسب الكتاب"
    status: unverified
    steps:
      - kind: explain
        page: 28
        quote: "Nodule >1cm. Enlarging during gestation. Associated with palpable cervical lymph nodes."
        title: "العقدة في الحمل"
        text: |
          ممكن عقدة تتكشف لأول مرة في الحمل. التقييم: ==ultrasound و FNAB==.

          **FNAB لكل حامل عندها:**
          1. Nodule أكبر من **1 cm**.
          2. بتكبر أثناء الحمل.
          3. معاها palpable cervical lymph nodes.
      - kind: table
        page: 28
        quote: "If FNAB result shows a possible follicular neoplasm / mildly suspicious – surgery is deferred until after pregnancy & breastfeeding periods."
        title: "نتيجة الـ FNAB"
        columns: ["FNAB", "Action"]
        rows:
          - ["Highly suggestive of malignancy", "Surgery even in pregnancy (2nd trimester if found early)"]
          - ["Possible follicular / mildly suspicious", "Defer until after pregnancy and breastfeeding"]
        hide: [[0, 1], [1, 1]]
      - kind: reveal
        page: 28
        quote: "If FNAB is highly suggestive of malignancy, THYROID SURGERY should be performed even though the patient is pregnant."
        prompt: "لو الحمل مش بيغيّر مسار سرطان الغدة، ليه نعمل جراحة أثناء الحمل أصلًا للـ highly suspicious؟"
        answer: "الكتاب بيقول نعمل الجراحة لو الـ FNAB highly suggestive، وفي التاني لو اتكشف بدري. التاني أأمن trimester لأي جراحة. أما الـ mildly suspicious فمفيش داعي نعرّض الحمل للخطر، نستنى لحد ما الحمل والرضاعة يخلصوا."
      - kind: explain
        page: 29
        quote: "Probably due to goitrogenic stimulus associated with pregnancy."
        title: "الحمل بيعمل عقد"
        text: "في الـ euthyroid اللي عندها diffuse أو nodular goiter، الحمل بيعمل ==nodules جديدة== والقديمة بتكبر وتزيد في العدد، غالبًا من الـ **goitrogenic stimulus** بتاع الحمل."
      - kind: explain
        page: 29
        quote: "Develops in women between 3-9 months after delivery (5-10 %), it follows the stages seen in patients with sub acute thyroiditis."
        title: "Postpartum thyroiditis"
        text: |
          - بيظهر بعد الولادة بـ ==3-9 شهور==، في **5-10%**.
          - بيمشي في نفس مراحل الـ subacute thyroiditis.
          - بس: ==no pain==، **ESR normal**، و **thyroid antibodies عالية**.
          - **20%** بيفضلوا hypothyroid على طول.
          - الـ TPO antibodies العالية = خطر أكبر. و **25%** من الـ type 1 DM بيعملوه.
