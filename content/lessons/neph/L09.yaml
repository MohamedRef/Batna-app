        page: 299
        quote: "Volume overload not responding to medical R( Isolated UF could be used for1-2h prior to dialysis if exessive fluid removal is needed in first dialysis session. if hyperkalmia present isolated UF should be after not before dialysis.) Metabolic acidosis not responding to medical treatment or with associated oliguria/ anuria."
        question: "First session: pulmonary oedema plus K+ 7.0. When is isolated UF done?"
        options:
          - "After dialysis"
          - "1–2 h before dialysis"
          - "Instead of dialysis"
          - "Never in a first session"
        answer: 0
        why:
          - "صح: مع الـ hyperkalaemia اغسل الأول ونزّل الـ K، والـ isolated ultrafiltration (UF) بعدين."
          - "ده المعتاد لو مفيش hyperkalaemia."
          - "الـ isolated UF بيشيل مية بس، مش K."
          - "الكتاب بيسمح بيه في أول جلسة لو المية كتير."
      - kind: explain
        remind: [neph.L09.054]
        page: 300
        title: "السموم والـ indications غير الكلوية"
        quote: "For toxin or dialysable drug removal and for basic supportive care. The most logical therapeutic approach is specific antidotes, when available and/or applicable. Indication of dialysis:deteriorating vital signs despite intensive supportive care, significant metabolic acidosis and renal failure or electrolyte imbalances nonresponsive to conventional therapy Many chemicals and drugs, such as antimicrobials, barbiturates, sedatives and hypnotics, anticonvulsants, cardiovascular agents, alcohols, analgesics, antirheumatics, solvents insecticides, herbicides, metals, inorganics, and various compounds that can be removed from the body by means of hemodialysis or hemoperfusion while correcting vital signs and electrolyte and acid-base disturbances of the patients. Hemodialysis is more efficient for removal of lithium, ethanol, methanol, bromide, ethylene glycol, and salicylates .American Journal of Therapeutics (2006) 13(5)"
        text: |
          - **Intractable heart failure (HF)** و oedema شديدة: UF أو slow low efficiency dialysis (SLED).
          - **التسمم**: الـ ==antidote== الأول. نغسل لو الـ vital signs بتقع رغم الـ supportive care، أو acidosis شديدة، أو renal failure، أو electrolytes مش بتتظبط.

          الـ haemodialysis (HD) أشطر حاجة مع: ==lithium، ethanol، methanol، bromide، ethylene glycol، salicylates==.

          ليه السموم دي بالذات بتتغسل؟ التفسير المقبول (مش في الكتاب): التلات شروط: **صغيرة** (تعدّي الغشا)، **بتدوب في المية** (مش مستخبية في الدهون)، و **مش لازقة في البروتين** (حرة في البلازما)، ومعاها **volume of distribution قليل** (في الدم مش في الأنسجة). الـ lithium والـ methanol والـ ethylene glycol كلهم كده. والـ HD كمان بيصلّح الـ acidosis اللي بتعملها السموم دي (methanol و ethylene glycol و salicylates). أما الـ digoxin مثلًا ففي الأنسجة، فالغسيل ما يفيدش.
