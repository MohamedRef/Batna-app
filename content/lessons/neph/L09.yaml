  - id: neph.L09.lesson4
    title: "Haemofiltration و CKRT: الغسيل للعيان التعبان"
    hook: "عيان على ventilator و inotropes، والـ potassium طالع. الـ HD العادي هيوقّع ضغطه. الحل فلتر شغال 24 ساعة بهدوء."
    minutes: 10
    pages: [302, 307]
    topics: [hf-hdf, ckrt]
    goals:
      - "تفرّق haemofiltration و haemodiafiltration و isolated UF بالـ mechanism"
      - "تعرف امتى CKRT، وكسبنا إيه وخسرنا إيه"
      - "تعرف المطلوب لـ CKRT ومكونات الـ dialysate"
    status: unverified
    steps:
      - kind: explain
        page: 302
        title: "الـ haemofiltration"
        quote: "Hemofiltration Hemofiltration is an exclusively ultrafiltration/convection treatment in which high-flux membranes are utilized in the absence of dialysis fluid. Infusion of a sterile solution into the blood circuit reconstitutes the reduced plasma volume and reduces solute concentration. Infusion of a sterile solution (replacement fluid) can replace totally or partially the filtered volume. Replacement fluid can be infused pre-filter (pre-dilution) or post-filter (post- dilution)."
        text: |
          ==Convection بس==: high-flux membrane ومفيش dialysate. بنسحب مية كتير ونرجّع **replacement fluid** معقّم.

          الـ replacement ممكن **pre-filter** (pre-dilution) أو **post-filter** (post-dilution). الـ ==post-dilution أكفأ== بس بيسد الغشا أسرع (haemoconcentration).

          ليه post-dilution أكفأ وبيسد أسرع؟ التفسير المقبول (مش في الكتاب): في الـ **pre-dilution** المحلول بيخفف الدم قبل الفلتر، فالمية اللي بتتسحب جزء منها المحلول نفسه، والـ solutes المتشالة أقل. في الـ **post-dilution** الدم بيوصل الفلتر مركّز، فكل لتر مسحوب شايل toxins أكتر. بس الدم المركّز (haemoconcentration) لزج، والـ RBCs والبروتين بيسدوا المسام والفلتر يتجلط أسرع. فالاختيار توازن بين الكفاءة وعمر الفلتر.
      - kind: explain
        page: 303
        title: "الـ haemodiafiltration والـ isolated UF"
        quote: "The main goal of ultrafiltration is to remove fluid using semipermeable membranes without volume replacement, thus achieving volume but not solute control in the patient."
        text: |
          - **Haemodiafiltration (HDF)**: بيجمع الـ ==diffusion و convection==. بـ high-flux membrane. الـ online HDF بماكينة HD بـ dual blood pumps و **endotoxin filter** بيحوّل الـ dialysate نفسه لـ substitution fluid (3–4 ساعات). وفي الـ CKRT بنستعمل محلول معقّم تجاري وماكينة خاصة.
          - **Isolated ultrafiltration**: ==remove fluid without volume replacement==: بيظبط الـ **volume** بس، مش الـ solutes.

          ليه الـ endotoxin filter مهم؟ التفسير المقبول (مش في الكتاب): في الـ HD العادي المحلول على الناحية التانية من الغشا، فلو فيه شوية بكتيريا مش بتدخل الدم بسهولة. في الـ HDF المحلول ده **بيدخل الدم مباشرة** كـ replacement، فلازم يبقى معقّم زي المحلول الوريدي.
          وليه الـ isolated UF ما بيظبطش الـ K؟ لأن المية اللي بتتسحب تركيزها زي البلازما، فالـ K بيطلع بنفس نسبته، والتركيز في الدم ما بيتغيرش.
      - kind: figure
        page: 305
        title: "Diffusion ضد convection في الرسم"
        image: { file: neph/L09-diffusion-convection.webp, book: true }
        caption: "فوق: الـ **haemodialysis** = الـ solutes بتنزل مع الـ gradient للمحلول (==diffusion==). تحت: الـ **haemofiltration** = الضغط بيزق المية والـ solutes سوا (==convection==)."
        alt: "Book diagrams: haemodialysis with blood and dialysate on two sides of a semipermeable membrane and solutes diffusing across, and haemofiltration with positive hydrostatic pressure on the blood side pushing water and solutes into the filtrate (convection)."
      - kind: sort
        page: 303
        quote: "Isolated ultrafiltration The main goal of ultrafiltration is to remove fluid using semipermeable membranes without volume replacement, thus achieving volume but not solute control in the patient."
        prompt: "كل modality بتشتغل بإيه؟"
        bins: ["Diffusion", "Convection", "Both", "Fluid only"]
        cards:
          - { text: "Conventional HD", bin: 0 }
          - { text: "Haemofiltration", bin: 1 }
          - { text: "Haemodiafiltration", bin: 2 }
          - { text: "Isolated UF", bin: 3 }
        why: "haemodialysis (HD) = diffusion أساسًا. haemofiltration = convection بس. haemodiafiltration = الاتنين (online بـ endotoxin filter). Isolated ultrafiltration (UF) = مية من غير replacement: volume control بس، مفيش solute control."
      - kind: explain
        remind: [neph.L09.068]
        page: 303
        title: "امتى CKRT؟"
        quote: "CKRT blood purification techniques intended to run for 24 hours or longer without interruption.Continuous treatment allows for a lower ultrafiltration rate, slower rate of solute clearance than is possible with intermittent KRT. Indicated in Critically ill AKI specially on ventilator.Specially if Heodynamically unstable on inotrope. Patients with cerebral edema or liver failure. Severe acidosis pH < 7.1 to 7.2 or serum bicarbonate level < 12 to 15 mmol/L. Earlier initiation of RRT may be necessary in patients receiving lung-protective ventilation, as severe acidemia can result from the combination of metabolic and respiratory acidosis."
        text: |
          الـ ==continuous kidney replacement therapy (CKRT)== شغال 24 ساعة أو أكتر من غير وقفة، بـ UF rate أقل و clearance أبطأ. مناسب لـ:
          - **Critically ill acute kidney injury (AKI)**، خصوصًا على ventilator.
          - **Haemodynamically unstable** على inotropes.
          - ==Cerebral oedema== أو **liver failure**.
          - **Severe acidosis**: pH أقل من 7.1–7.2 أو bicarbonate أقل من 12–15.

          ولو على **lung-protective ventilation**، ابدأ بدري: metabolic + respiratory acidosis مع بعض.

          ليه الـ CKRT للعيانين دول؟ التفسير المقبول (مش في الكتاب): نفس كمية المية والـ toxins بتتشال على 24 ساعة بدل 4، فالسحب في الساعة صغير والضغط ما يقعش، وده مهم لعيان على inotropes. وفي الـ **cerebral oedema** والـ **liver failure**: الـ HD العادي بينزّل الـ osmolality فجأة فالمخ يورم أكتر (زي الـ disequilibrium)، والـ CKRT بيغيّرها ببطء. وعلى الـ **lung-protective ventilation** الـ CO2 عالي عن قصد، فلو فيه metabolic acidosis كمان الـ pH يقع جامد، فنبدأ بدري.
      - kind: aside
        tone: trap
        page: 303
        quote: "Clinical trials have not demonstrated survival benefits or improvements in kidney function recovery with CKRT compared with intermittent KRT modalities in patients with acute kidney injury (AKI). Gaudry et al. Critical Care (2022) 26:93 ."
        text: |
          الـ CKRT أهدى على الضغط، بس ==مش بيحسّن الـ survival== ولا رجوع الكلية مقارنة بالـ intermittent. السؤال ممكن يقولك "CKRT improves survival": غلط.
      - kind: table
        page: 304
        quote: "Increased need for circuit anticoagulation due to extended treatment time. • Increased risk of hypophosphatemia."
        title: "CKRT: كسبنا إيه وخسرنا إيه"
        columns: [Gain, Cost]
        rows:
          - ["Less hypotension", "Slower clearance"]
          - ["Less ICP effect", "More anticoagulation"]
          - ["Better volume and solutes", "Hypophosphataemia"]
          - ["Free nutrition", "Catheter, immobility, cost"]
        hide: [[1, 1], [2, 1], [3, 0]]
      - kind: explain
        page: 304
        title: "الـ CKRT محتاج إيه؟"
        quote: "a well-functioning vascular access (ie, dual lumen intravenous hemodialysis catheter);"
        text: |
          الـ basic requirements زي أي extracorporeal KRT:
          1. ==vascular access== شغال كويس: **dual lumen** haemodialysis catheter.
          2. **semipermeable membrane** (dialyzer أو haemofilter).
          3. **roller pumps** زيادة غير الـ blood pump، علشان الـ dialysate أو الـ replacement solution.
          4. **fluid-balancing** و pressure monitoring.
          وأنواع الـ CKRT بتتعرف بـ ==mechanism بتاع الـ solute clearance== (diffusion، convection، أو الاتنين).

          ليه الـ fluid balancing بالذات؟ التفسير المقبول (مش في الكتاب): في 24 ساعة الماكينة بتسحب وترجّع عشرات اللترات. غلطة صغيرة 50 mL في الساعة تبقى أكتر من لتر في اليوم، وعيان الـ ICU ما يستحملش. وليه catheter مش fistula؟ لأن العيان ده غالبًا AKI مالوش fistula، والـ CKRT محتاج flow ثابت طول اليوم.

          وليه الـ anticoagulation مشكلة أكبر في الـ CKRT؟ التفسير المقبول (مش في الكتاب): الدايرة شغالة 24 ساعة، فالدم بيقابل البلاستيك وقت أطول بكتير، والفلتر بيتجلط. والـ heparin لعيان ICU (نزيف، عمليات، platelets واطية) خطر. عشان كده بيستعملوا **regional citrate**: الـ citrate في الدايرة بس يمسك الـ Ca، وبعدين نرجّع Ca للعيان، فالدايرة متسيّلة والعيان مش متسيّل. بس لازم مراقبة الـ Ca، خصوصًا في الـ liver failure لأن الكبد هو اللي بيكسّر الـ citrate.
      - kind: check
        page: 304
        quote: "Increased need for circuit anticoagulation due to extended treatment time. • Increased risk of hypophosphatemia."
        question: "Day 3 of CKRT: phosphate is very low. Why?"
        options:
          - "A known disadvantage of CKRT"
          - "Dialyser blood leak"
          - "Disequilibrium syndrome"
          - "Too much heparin"
        answer: 0
        why:
          - "صح: الـ CKRT بيشيل phosphate باستمرار، والكتاب بيقول hypophosphataemia من عيوبه."
          - "الـ blood leak بيدي alarm، مش hypophosphataemia."
          - "الـ disequilibrium cerebral oedema، والـ CKRT أصلًا بيقلله."
          - "الـ heparin مالوش علاقة بالـ phosphate."
      - kind: figure
        page: 306
        title: "الأوردة الكبيرة وطقم الـ catheter"
        image: { file: neph/L09-central-veins.webp, book: true }
        caption: "الـ **internal jugular** والـ subclavian والـ innominate فوق، والـ **femoral/iliac** تحت: دي أماكن الـ dual lumen catheter. وجنبها طقم التركيب."
        alt: "Book diagram of the central veins of the upper body and legs (internal jugular, subclavian, innominate, superior and inferior vena cava, iliac vein) with two boxed insertion regions, beside a photograph of a dual lumen catheter insertion pack."
      - kind: table
        page: 307
        quote: "Bicarbonate containing dialysate after reconstitution:"
        title: "الـ dialysate بعد الخلط"
        columns: [Component, mEq/L]
        rows:
          - ["Sodium", "135–145"]
          - ["Potassium", "2"]
          - ["Calcium", "2.5–3.5"]
          - ["Magnesium", "0.5–1"]
          - ["Chloride", "100–124"]
          - ["Bicarbonate", "30–38"]
          - ["Acetate", "2–4"]
          - ["Glucose", "0–11"]
        hide: [[1, 1], [5, 1]]
      - kind: explain
        page: 307
        title: "ليه الأرقام دي بالذات؟"
        quote: "Bicarbonate containing dialysate after reconstitution:"
        text: |
          الـ **bicarbonate dialysate** بعد الخلط: Na 135–145، ==K 2==، Ca 2.5–3.5، Mg 0.5–1، Cl 100–124، ==bicarbonate 30–38==، acetate 2–4، glucose 0–11، osmolarity نظري 297، و pH 7.1–7.3. والكتاب حاطط صورة الـ **Prisma flex** للـ CKRT جنب ماكينة الـ HD.

          ليه؟ التفسير المقبول (مش في الكتاب):
          - الـ **K 2** أقل من الدم، فالـ potassium العالي بينزل بالـ diffusion.
          - الـ **bicarbonate 30–38** أعلى من دم العيان الـ acidotic، فبيدخله ويصلّح الـ acidosis.
          - الـ **Na** قريب من الطبيعي علشان ما يحصلش تغيير osmolality بسرعة (افتكر الـ disequilibrium).
          - الـ **Ca** متظبط علشان ما ينزلش الـ calcium ويعمل arrhythmia.
          يعني كل رقم معمول علشان يشد الدم ناحية الطبيعي، مش علشان يبقى زيه.

          وليه الـ glucose في المحلول؟ التفسير المقبول (مش في الكتاب): محلول من غير glucose ممكن يشيل glucose من دم عيان سكر واخد insulin، فيحصل hypoglycaemia أثناء الجلسة. فالمحلول فيه glucose قريب من الطبيعي علشان ما يسحبش. وليه الـ acetate قليل؟ لأنه بيستعمل كـ acid في الخلط، وكان زمان الـ buffer الأساسي بس كان بيعمل vasodilation وهبوط ضغط، فبقى الـ bicarbonate هو الأساس.
      - kind: try
        items: [neph.L09.064, neph.L09.068, neph.L09.072, neph.L09.074, neph.L09.075]
    recap:
      - "Haemofiltration = convection بس؛ post-dilution أكفأ بس بيسد أسرع."
      - "HDF = diffusion + convection؛ isolated UF = مية بس."
      - "CKRT: critically ill، unstable، cerebral oedema أو liver failure، acidosis شديدة. مش بيحسّن الـ survival."
      - "مكاسب: ضغط أهدى، volume و solutes أحسن. تمن: clearance أبطأ، anticoagulation، hypophosphataemia، تكلفة."
      - "Dialysate: K 2 و bicarbonate 30–38 علشان يشدوا الدم للطبيعي."
