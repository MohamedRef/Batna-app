  - id: res.L07.lesson2
    title: "القرعة: simple و block و stratified"
    hook: "إزاي توزّع ١٠٠٠ عيان على علاجين وتضمن إن الستات والكبار متقسّمين بالعدل؟"
    minutes: 8
    pages: [22, 34]
    topics: [conduct, randomization]
    goals:
      - "تعرف المطلوب في step 6 و step 7"
      - "تعدّ فوايد الـ randomization"
      - "تفرّق بين simple و block و stratified randomization وتحسب مثال"
    status: unverified
    steps:
      - kind: explain
        page: 22
        quote: "Detailed protocols of clinical procedures, laboratory investigations"
        title: "Step 6: كل variable ليه بروتوكول"
        text: |
          قبل ما تبدأ، اكتب **detailed protocols** للـ clinical procedures والـ lab والـ questionnaire. ولكل variable (intervention، co-intervention، confounders، outcomes) جاوب:

          - **مين** هيقيس؟ و**إمتى**؟
          - بأنهي **equipment** وأنهي **technique**؟
          - إزاي الأجهزة والطرق والناس هيكونوا ==standardized and validated==؟
      - kind: explain
        page: 24
        quote: "Recruitment and Participation Flow Chart"
        title: "Step 7: الـ flow chart"
        text: |
          في الـ enrolment لازم تعرض ==Recruitment and Participation Flow Chart== فيه **n عند كل خطوة**: اتعرض عليهم كام، اتقيّموا كام، اتوزّعوا كام، خدوا العلاج كام، ضاعوا كام، واتحلّلوا كام.

          مثال المحاضرة: برنامج **web** ضد **print**. حوالي 247 في الـ web، و 233 في الـ print، ومن كل جروب ناس ماخدوش العلاج وناس ضاعت في الـ follow-up. وده بالظبط شكل الـ **CONSORT flow diagram** اللي هنشوفه في آخر المحاضرة.
      - kind: explain
        page: 26
        quote: "Only way to control for unknown factors"
        title: "Step 8: الـ randomization بتمنع الـ bias إزاي؟"
        text: |
          - بتخلي **الـ assignment الجاي مش متوقع**.
          - بتقلّل **الفروق في الـ baseline risk** بين الجروبين.
          - هي ==the only way to control for unknown factors==: حتى الحاجات اللي إنت مش عارف إنها confounders.

          وكل ما الجروبات **أكبر**، فرصة إن الـ baseline risks تتساوى بتزيد.
      - kind: reveal
        page: 27
        quote: "It permits the use of probability theory to express the likelihood that any difference in outcome between treatment groups merely indicates chance"
        prompt: "المحاضرة بتقول للـ randomization **3 فوايد**. افتكرهم قبل ما تفتح."
        answer: |
          1. بتلغي الـ **bias in treatment assignment**: الـ selection bias والـ confounding.
          2. بتسهّل الـ **blinding**: الدوا والـ placebo بيتوزّعوا بأرقام، محدش عارف مين خد إيه.
          3. بتسمح نستخدم **probability theory**: نقدر نحسب احتمال إن الفرق ده مجرد صدفة (الـ p value).
      - kind: explain
        page: 29
        quote: "given a block size of 4, there are 6 possible ways to equally assign participants to a block"
        title: "Block randomization: علشان الجروبات تبقى بنفس الحجم"
        text: |
          الـ simple randomization زي رمي العملة: ممكن تطلع 12 ضد 8 في 20 عيان. الـ ==block randomization== بتضمن **equal sample sizes**.

          مع علاجين A و B و **block size = 4**، فيه **6 طرق** يتقسّم فيها البلوك بالتساوي:
          AABB، BBAA، ABAB، BABA، ABBA، BAAB.

          تختار البلوكات **عشوائيًا**: 20 عيان = **5 blocks** كل واحد فيه 4. وفي آخر كل بلوك، الجروبين متساويين.
      - kind: aside
        tone: trap
        page: 29
        quote: "it should be short enough to prevent imbalance, and long enough to prevent guessing allocation"
        text: |
          حجم البلوك: **قصير كفاية** يمنع الـ imbalance، و**طويل كفاية** يمنع إن حد **يخمّن** الـ allocation.

          لو البلوك 2 والدكتور عارف، أول عيان خد A يبقى التاني أكيد B: الـ concealment باظ.
      - kind: explain
        page: 31
        quote: "Stratified randomization is achieved by generating a separate block for each combination of covariates"
        title: "Stratified randomization: وازن الـ covariates المهمة"
        text: |
          لما فيه **prognostic variable** مهمة (السن، النوع، شدة المرض) وعايز تضمن إنها متوزعة بالعدل:

          - اعمل ==separate block for each combination of covariates==.
          - جوه كل block اعمل **simple randomization** للجروبين.

          مثال المحاضرة: تجربة **zidovudine** في الحوامل اتقسّمت حسب **gestational age**: 14 لـ 26 أسبوع وأكتر من 26، وبعدين قرعة جوه كل واحدة.
      - kind: figure
        page: 32
        quote: "Stratify By Sex"
        title: "١٠٠٠ عيان: sex ثم age ثم قرعة"
        alt: "Tree: 1,000 patients split by sex into 600 males and 400 females. Males split by age into 360 young and 240 old; females into 300 young and 100 old. Each of the four sub-groups is randomized in half, giving 180 plus 120 plus 150 plus 50, which is 500, in the new treatment and the same 500 in the current treatment."
        caption: "كل **stratum** بيتقسم نصّين بالقرعة، فالجروبين بيطلعوا **500 و 500** وفيهم نفس نسبة الرجالة والستات والكبار والصغار."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R07s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="115" y="6" width="100" height="30" rx="6" class="fg-ink"/>
            <text x="165" y="26" text-anchor="middle" class="t-sm t-b">1,000 patients</text>
            <path d="M140 36L90 62" class="fg-arrow" marker-end="url(#R07s)"/>
            <path d="M190 36L240 62" class="fg-arrow" marker-end="url(#R07s)"/>
            <text x="165" y="58" text-anchor="middle" class="t-sm t-mut">sex</text>
            <rect x="40" y="66" width="100" height="30" rx="6" class="fg-box"/>
            <text x="90" y="86" text-anchor="middle" class="t-sm">600 males</text>
            <rect x="190" y="66" width="100" height="30" rx="6" class="fg-box"/>
            <text x="240" y="86" text-anchor="middle" class="t-sm">400 females</text>
            <text x="165" y="118" text-anchor="middle" class="t-sm t-mut">age</text>
            <path d="M75 96L45 126M105 96L125 126M225 96L205 126M255 96L285 126" class="fg-arrow" marker-end="url(#R07s)"/>
            <rect x="5" y="130" width="72" height="40" rx="6" class="fg-thin"/>
            <text x="41" y="148" text-anchor="middle" class="t-sm">360</text>
            <text x="41" y="163" text-anchor="middle" class="t-sm t-mut">young</text>
            <rect x="85" y="130" width="72" height="40" rx="6" class="fg-thin"/>
            <text x="121" y="148" text-anchor="middle" class="t-sm">240</text>
            <text x="121" y="163" text-anchor="middle" class="t-sm t-mut">old</text>
            <rect x="173" y="130" width="72" height="40" rx="6" class="fg-thin"/>
            <text x="209" y="148" text-anchor="middle" class="t-sm">300</text>
            <text x="209" y="163" text-anchor="middle" class="t-sm t-mut">young</text>
            <rect x="253" y="130" width="72" height="40" rx="6" class="fg-thin"/>
            <text x="289" y="148" text-anchor="middle" class="t-sm">100</text>
            <text x="289" y="163" text-anchor="middle" class="t-sm t-mut">old</text>
            <text x="165" y="194" text-anchor="middle" class="t-sm t-acc t-b">randomize each half and half</text>
            <rect x="5" y="210" width="155" height="56" rx="6" class="fg-good"/>
            <text x="82" y="232" text-anchor="middle" class="t-sm t-b">New treatment</text>
            <text x="82" y="254" text-anchor="middle" class="t-sm">180+120+150+50</text>
            <rect x="170" y="210" width="155" height="56" rx="6" class="fg-acc"/>
            <text x="247" y="232" text-anchor="middle" class="t-sm t-b">Current treatment</text>
            <text x="247" y="254" text-anchor="middle" class="t-sm">180+120+150+50</text>
            <text x="82" y="288" text-anchor="middle" class="t-sm t-b">= 500</text>
            <text x="247" y="288" text-anchor="middle" class="t-sm t-b">= 500</text>
          </svg>
      - kind: match
        page: 28
        quote: "How to Do Random Allocation of subjects"
        prompt: "وصّل كل هدف بطريقة الـ randomization المناسبة:"
        pairs:
          - ["Just give each patient a fair coin toss", "Simple randomization"]
          - ["Keep the two arms equal in size as patients arrive", "Block randomization"]
          - ["Balance age and sex between the arms", "Stratified randomization"]
        why: "**Simple** = قرعة لكل واحد. **Block** = بلوكات متوازنة فالعدد يفضل متساوي. **Stratified** = بلوك لكل combination من الـ covariates، وقرعة جوّاه."
      - kind: check
        page: 34
        quote: "Randomization guarantee that all participants will receive the intervention"
        question: "Which statement about the advantages of randomization is INCORRECT?"
        options:
          - "It removes selection bias in allocation"
          - "It guarantees that all participants will receive the intervention"
          - "It tends to balance measured and unmeasured confounders"
          - "It lets probability theory judge the role of chance"
        answer: 1
        why:
          - "دي ميزة حقيقية."
          - "صح، دي الغلط: القرعة بتحدد مين ياخد إيه، والـ control مش هياخد الـ intervention أصلًا."
          - "دي ميزة حقيقية، وأهم واحدة."
          - "دي ميزة حقيقية، من شريحة 27."
      - kind: try
        items: [res.L07.035, res.L07.037, res.L07.038]
    recap:
      - "Step 6: بروتوكول لكل variable: مين، إمتى، بإيه، وإزاي standardized و validated."
      - "Step 7: flow chart فيه n عند كل خطوة."
      - "الـ randomization: الـ assignment مش متوقع، الـ baseline متوازن، والطريقة الوحيدة للـ unknown confounders."
      - "Block = عدد متساوي (block of 4 = 6 ترتيبات). Stratified = block لكل combination من الـ covariates وقرعة جوّاه."
    practice: [res.L07.021, res.L07.022, res.L07.023, res.L07.030, res.L07.031, res.L07.032, res.L07.033, res.L07.034, res.L07.035, res.L07.036, res.L07.037, res.L07.038, res.L07.039, res.L07.040]
