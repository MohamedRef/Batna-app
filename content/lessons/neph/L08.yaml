  - id: neph.L08.lesson15
    title: "Case 10: nephrotic بيقاوم كل علاج، والسر في الدهون"
    hook: "ست اتعالجت immunosuppression ومفيش فايدة. الـ biopsy التاني مليان foam cells، وعينها شكلها عين سمكة."
    minutes: 9
    pages: [267, 271]
    topics: [lcat]
    goals:
      - "تقرا labs و biopsy الـ case 10 وتعرف ليه الـ IS فشل"
      - "تفهم الـ LCAT بيعمل إيه وليه نقصه بيوصل للكلى والقرنية"
      - "تعرف الـ Ix اللي بتأكد التشخيص والقرار بعدها"
    status: unverified
    steps:
      - kind: explain
        page: 267
        title: "Case 10: nephrotic والـ IS مانفعش"
        quote: "The patient was previously biopsied and received IS without any improvement."
        text: |
          ست مالهاش past history، جاية بـ **nephrotic syndrome**:
          - uPCR **8.9**، albumin **1.9**، creatinine 1.5
          - virology و immunology سلبيين
          - cholesterol 208، ==triglycerides 260==، **VLDL 52**

          اتعمل لها biopsy قبل كده وأخدت **immunosuppression (IS)** ==without any improvement== (من غير أي تحسن)، فاتعمل biopsy جديد. والـ IH كلها: IgA و IgG و IgM و C3 **no specific findings**.

          ليه ده مهم؟ التفسير المقبول (مش في الكتاب): nephrotic مش بيرد على الـ IS والـ IF فاضي يعني غالبًا المرض **مش immune** أصلًا. لما الـ steroid يفشل اسأل نفسك: هل فيه حاجة **بتترسب** في الـ glomerulus (دهون، amyloid، light chains، enzyme deficiency) بدل ما تكون antibodies؟
      - kind: explain
        page: 268
        title: "الـ LM: غشا تخين ودهون جوّه الـ mesangium"
        quote: "into the capillary lumina with segmental basement membrane peripheral duplication."
        text: |
          الـ LM: 15 glomeruli، 4 obsolescent. الـ patent فيهم:
          - ==segmental marked capillary basement membrane thickening== بـ **subendothelial hyaline deposits** داخلة في الـ capillary lumina
          - **segmental basement membrane peripheral duplication**
          - الـ mesangium متمدد بـ ==large foamy histiocytes==، ومعاه **intracapillary foam cells** كتير
          - tubules: moderate injury، interstitium fibrosis 30%، arterioles moderate hyalinosis

          ليه الـ foam cells هي المفتاح؟ التفسير المقبول (مش في الكتاب): الـ foam cell = macrophage بلع دهون لحد ما بقى شكله رغوة. يعني فيه **دهون غلط** بتترسب في الـ glomerulus نفسه. والـ duplication جاي من إن الـ deposits تحت الـ endothelium بتخلي الـ GBM يعمل طبقة جديدة، زي الـ MPGN، فممكن يتلخبط معاه.

          إزاي تفرّقها عن الـ MPGN اللي شبهها؟ التفسير المقبول (مش في الكتاب): الاتنين فيهم duplication و subendothelial deposits. بس في الـ MPGN الـ IF فيه C3 أو Ig، والـ cells اللي زيادة mesangial و inflammatory. في الـ LCAT الـ IF «no specific findings»، والـ cells اللي زيادة **foam cells** مليانة دهون، والـ deposits **hyaline** مش immune. فلو شفت شكل MPGN والـ IF فاضي، اسأل عن الدهون.
      - kind: figure
        page: 268
        title: "Case 10 تحت الميكروسكوب"
        image: { file: neph/L08-lcat-lm.webp, book: true }
        caption: "Glomerulus فيه جدران تخينة و ==foamy histiocytes== مالية الـ mesangium والـ capillaries."
        alt: "Two book light-microscopy images of a glomerulus with thickened capillary walls, subendothelial hyaline deposits and pale foamy cells filling the mesangium and capillary loops."
      - kind: check
        page: 269
        quote: "Picture is Compatible with Lecithin- Cholesterol Acyltransferase Deficiency."
        question: "Steroid-resistant nephrotic syndrome, negative IF, subendothelial hyaline deposits, foamy histiocytes in the mesangium, high triglycerides. Spot diagnosis?"
        options:
          - "Lecithin–cholesterol acyltransferase (LCAT) deficiency"
          - "Type I MPGN"
          - "Membranous GN"
          - "Amyloidosis"
        answer: 0
        why:
          - "صح: الكتاب: «Picture is Compatible with ==LCAT deficiency==»، مع global sclerosis 30% و IFTA 30%."
          - "الـ MPGN type I فيه duplication بس الـ IF بيبقى فيه C3 ± Ig، وهنا الـ IF فاضي ومفيش foam cells."
          - "الـ membranous فيه IgG granular و spikes."
          - "الـ amyloid بيبان Congo red موجب ومش foamy."
      - kind: figure
        page: 269
        title: "عين السمكة"
        image: { file: neph/L08-fish-eye.webp, book: true }
        caption: "==Corneal opacity==: القرنية معتمة رمادي. ده الـ «fish eye» اللي هيقفل التشخيص."
        alt: "Book photograph of an eye with a diffusely cloudy grey cornea (corneal opacity), the fish-eye appearance."
      - kind: explain
        page: 269
        title: "Case 10: nephrotic مش بيرد على أي حاجة"
        quote: "Picture is Compatible with Lecithin- Cholesterol Acyltransferase Deficiency. Additional Features: Focal Global Glomerulosclerosis (30%), Moderate Interstitial Fibrosis and Tubular Atrophy (30%), Moderate Arteriolar Hyalinosis."
        text: |
          ست **29 سنة** بـ nephrotic (uPCR 8.9)، أخدت immunosuppression من غير فايدة. triglycerides 260، **very low-density lipoprotein (VLDL) 52**.

          الـ biopsy: subendothelial hyaline deposits، glomerular basement membrane (GBM) duplication، و ==foamy histiocytes== مالية الـ mesangium والـ capillaries.

          التشخيص: ==lecithin–cholesterol acyltransferase (LCAT) deficiency==.

          ليه الـ triglycerides والـ VLDL مهمين؟ التفسير المقبول (مش في الكتاب): أي nephrotic بيرفع الدهون، فالـ TGs العالية لوحدها مش بتفرق. اللي بيفرق هو **الـ HDL**: في الـ nephrotic العادي مش بيقع بالشكل ده، وفي الـ LCAT بيقع جامد **لأن** الـ HDL ما بيكبرش من غير الإنزيم. فلما تشوف foam cells + IS فشل، اطلب الـ HDL والـ ApoA1، وبص في عين العيان.
      - kind: explain
        page: 270
        title: "LCAT بيعمل إيه؟"
        quote: "Lecithin-cholesterol acyltransferase (LCAT) is involved in the esterification of free cholesterol and in the cholesterol esters transport from peripheral tissues to the liver."
        text: |
          الـ **LCAT** بيعمل **esterification** للـ free cholesterol، وبيساعد ينقل الـ cholesterol esters من الأنسجة للكبد (جوّه الـ **high-density lipoprotein (HDL)**).

          - **Partial** = ==fish eye disease== (القرنية بس)
          - **Complete** = **familial LCAT deficiency** (أنسجة كتير منها الكلى)

          أشهر complication: **renal failure** في العقد الرابع. والتشخيص النهائي: **gene analysis** و functional activity.

          ليه ده بيخلي الـ HDL واطي؟ التفسير المقبول (مش في الكتاب): الـ HDL بيبدأ قرص فاضي (pre-beta HDL) بيلم free cholesterol من الخلايا. الـ LCAT بيحوّل الـ cholesterol ده لـ **ester**، والـ ester بيدخل جوّه القرص فيتنفخ ويبقى **كورة** (alpha-HDL) تروح للكبد. من غير الإنزيم القرص بيفضل فاضي ويتكسر بسرعة، فالـ HDL في التحليل يقع، والـ free cholesterol يفضل في الأنسجة يترسب.
      - kind: explain
        page: 270
        title: "ليه الكلى والقرنية بالذات؟"
        quote: "There are specific abnormalities of plasma lipids and lipid deposits in multiple tissues (familial LCAT deficiency) or in corneal tissues only (Fish Eye Disease)."
        text: |
          الكتاب: في الـ **familial** فيه lipid deposits في ==multiple tissues==، وفي الـ **fish eye disease** في الـ ==corneal tissues only==. وأشهر complication الـ **proteinuria**، في العقد الرابع.

          ليه؟ التفسير المقبول (مش في الكتاب):
          - من غير LCAT الـ cholesterol بيفضل **free** (مش esterified)، فالـ HDL ما يكبرش ويفضل صغير وقليل، عشان كده الـ HDL بيقع.
          - الـ free cholesterol والـ lipoproteins الغلط دي بتترسب في أماكن فيها filtration أو شفافية: الـ **glomerulus** (فيعمل foam cells و proteinuria) والـ **cornea** (فتعتم).
          - في الـ partial لسه فيه شوية activity بتكفي الدم، فالقرنية بس اللي بتتأثر.
      - kind: explain
        page: 271
        title: "إيه الـ Ix اللي تأكّد؟"
        quote: "What other Ix can help in Dx?"
        text: |
          الكتاب بيسأل ==What other Ix can help in Dx?==:
          - **CBC**: normochromic normocytic anemia
          - **urinalysis**: proteinuria في young adults
          - **chemistry**: BUN و creatinine عاليين
          - **lipid panel**: ==HDL واطي==، VLDL و triglycerides عاليين، و **unesterified cholesterol عالي مع cholesterol ester واطي**

          وفي الـ case بتاعتنا: corneal opacity، HDL **11**، VLDL 52، و **ApoA1 52** (الطبيعي للستات < 140 حسب الكتاب).

          ليه الـ unesterified عالي والـ ester واطي؟ لأن ده بالظبط شغل الإنزيم الناقص: هو اللي بيحوّل الـ free لـ ester. فالنسبة دي هي «بصمة» الـ LCAT في الدم. والـ ApoA1 بيقع **عشان** الـ HDL الصغير بيتكسر بسرعة وبياخد الـ ApoA1 معاه (التفسير المقبول، مش في الكتاب).

          ليه الـ anemia؟ التفسير المقبول (مش في الكتاب): الـ free cholesterol الزيادة بيدخل غشا الـ RBCs ويغير شكلها (target cells)، فبتتكسر أسرع، وده جزء من الـ normochromic normocytic anemia. وليه «proteinuria in young adults»؟ لأن المرض وراثي، فالكلية بتبدأ تتعب في الشباب، وده يفرّقه عن السكر والضغط عند الكبار.
      - kind: mnemonic
        page: 271
        quote: "Patient had a fish eye appearance (corneal opacity). Her HDL level was very low 11 mg/dl, high VLDL 52 mg/dl."
        word: "FISH"
        parts:
          - { key: "F", text: "Foam cells in the glomeruli" }
          - { key: "I", text: "Immunosuppression fails" }
          - { key: "S", text: "Sight: corneal opacity (fish eye)" }
          - { key: "H", text: "HDL very low (11), apolipoprotein A1 (ApoA1) low" }
        hook: "عيانة nephrotic عينها شكل عين السمكة وHDL واطي = LCAT. «الكلى بتغرق في الكوليسترول.»"
      - kind: check
        page: 271
        quote: "Withdraw immunosuppression and control BP using an ACEi."
        question: "Case 10 is confirmed LCAT deficiency. What does the book do?"
        options:
          - "Withdraw immunosuppression, ACEi for BP"
          - "Add rituximab"
          - "Pulse steroids again"
          - "Plasma exchange"
        answer: 0
        why:
          - "صح: المرض مش immune؛ ==supportive== بـ ACE inhibitor (ACEi)، و transplant لو وصل end-stage kidney disease (ESKD)."
          - "Rituximab للأمراض الـ immune، مش enzyme deficiency."
          - "الـ steroids فشلت قبل كده ومش هتصلّح enzyme."
          - "Plasma exchange مش في خطة الكتاب."
      - kind: explain
        page: 271
        title: "ليه نوقف الـ IS؟"
        quote: "Although rare, LCAT deficiency should be included in the DD of NS for all persons with a low HDL."
        text: |
          الكتاب: ==withdraw immunosuppression== و control BP بـ **ACEi**. حالتها دلوقتي creatinine 1.3 و proteinuria 6 g. والعلاج **supportive**، و **kidney transplant (KT)** لو وصلت ESKD. وأهم سطر: الـ LCAT لازم يبقى في الـ ==DD of nephrotic syndrome لأي حد HDL بتاعه واطي==.

          ليه؟ التفسير المقبول (مش في الكتاب):
          - الـ IS بيعالج مناعة، والمرض هنا **إنزيم ناقص**، فالـ IS ضرر من غير فايدة (عدوى، سكر، عظام).
          - الـ ACEi بيقلل الضغط جوّه الـ glomerulus، فالـ proteinuria تقل والـ sclerosis تبطّأ، وده كل اللي نقدر نعمله دلوقتي.
          - وليه الـ HDL الواطي جرس؟ لأن الـ nephrotic العادي بيرفع الدهون كلها؛ HDL **واطي جدًا** مع nephrotic مش متوقع، فده اللي يخليك تفكر في LCAT.

          وإيه المتابعة؟ التفسير المقبول (مش في الكتاب): الـ creatinine 1.3 والـ proteinuria 6 g، فالكلية لسه شغالة، والهدف تطويل الوقت ده: ضغط مظبوط، ACEi، ومتابعة الـ creatinine والـ proteinuria. ولو وصلت ESKD، الكلية المزروعة ممكن الدهون ترجع تترسب فيها مع الوقت، لأن الإنزيم لسه ناقص في الدم؛ وده سبب إن الـ transplant حل مش علاج.
      - kind: try
        items: [neph.L08.163, neph.L08.164, neph.L08.166, neph.L08.168, neph.L08.171]
    recap:
      - "Nephrotic مش بيرد على IS + IF فاضي = دوّر على حاجة بتترسب، مش antibody."
      - "Foamy histiocytes + subendothelial hyaline deposits + duplication = LCAT."
      - "LCAT: free cholesterol عالي، ester واطي، HDL و ApoA1 واطيين، corneal opacity."
      - "وقّف الـ IS، ACEi، و KT لو ESKD. وأي nephrotic بـ HDL واطي فكّر في LCAT."
    practice: [neph.L08.163, neph.L08.164, neph.L08.165, neph.L08.166, neph.L08.167, neph.L08.168, neph.L08.169, neph.L08.170, neph.L08.171, neph.L08.172]
  - id: neph.L08.lesson16
    title: "Case 11: podocytes شكلها دانتيل، و Fabry"
    hook: "شاب 29 سنة، proteinuria بسيطة، والـ IF كله سلبي حتى الـ kappa والـ lambda. بس الـ podocytes منفوخة وشاحبة زي الدانتيل."
    minutes: 10
    pages: [272, 277]
    topics: [fabry]
    goals:
      - "تقرا case 11 وتعرف ليه الـ IF السلبي ما بيستبعدش مرض كلى خطير"
      - "تفهم Fabry: الإنزيم، الدهن اللي بيتخزن، والوراثة"
      - "تعرف الـ clinical features والمتابعة ووقت الـ ERT"
    status: unverified
    steps:
      - kind: explain
        page: 272
        title: "Case 11: كل الـ stains سلبية"
        quote: "Examination revealed IgA: Negative, IgG: Negative, IgM: Negative, C3: Negative, Kappa: Negative, Lambda: Negative."
        text: |
          شاب **29 سنة** مالوش past history:
          - creatinine **1.9**، uPCR **2**
          - immunology و virology سلبيين
          - الـ **EM**: الـ semi-thin sections ==ما فيهاش glomeruli==
          - الـ **IH**: IgA و IgG و IgM و C3 و ==kappa و lambda== كلهم negative

          ليه الكتاب حاطط الـ kappa والـ lambda؟ التفسير المقبول (مش في الكتاب): عشان يقفل باب الـ light chain disease (زي case 9). يعني IF سلبي بالكامل = لا immune complex ولا complement ولا paraprotein. فالسؤال يبقى: إيه اللي بيأذي الكلية من غير ما يتصبغ؟ الإجابة هتكون في **شكل الخلايا** نفسها.

          وليه الـ EM ما ساعدش؟ التفسير المقبول (مش في الكتاب): الـ semi-thin sections ما كانش فيها glomeruli، فالـ EM ما اتعملش على الـ podocytes. ده بيحصل لما العينة صغيرة أو الـ glomeruli في الجزء اللي راح للـ LM. والدرس: ساعات الـ LM لوحده بيكفي يقول «highly suggestive»، بس التأكيد بييجي من الدم (الإنزيم) أو الجين، مش من EM تاني.
      - kind: explain
        page: 273
        title: "Case 11: podocytes شكلها دانتيل"
        quote: "43 glomeruli were seen, in all serial sections examined, out of which 36 were globally sclerosed. The patent glomeruli showed ischemic changes with thickened capillary basement membranes. The overlying visceral podocytes showed a swollen pale lacy cytoplasm. Three of the (6) patent ones showed segmental tuft sclerosis. Tubules showed diffuse moderate injury and diffuse moderate atrophy. Distal tubules both in cortex and medulla showed markedly vacuolated foamy cytoplasm. Focal dilatation with hyaline casts were also noted. Interstitium showed patchy mild lymphocytic infiltrate on a background of moderate interstitial fibrosis (35% of submitted tissue). Arteries and arterioles were unremarkable."
        text: |
          شاب **29 سنة**، creatinine 1.9، uPCR 2. الـ biopsy: 36 من 43 glomeruli sclerosed، و ==swollen pale lacy podocytes==، و distal tubules فيها **vacuolated foamy cytoplasm**، والـ immunofluorescence (IF) سلبي.

          التشخيص: ==advanced Fabry disease==.

          ليه الـ distal tubules كمان؟ التفسير المقبول (مش في الكتاب): الإنزيم ناقص في **كل** خلايا الجسم، بس الخلايا اللي بتعيش طويل وبتشتغل كتير (podocytes، distal tubules، عضلة القلب، endothelium) هي اللي بيبان فيها التخزين. والـ **isosthenuria** في الرسم بعدين جاية من نفس الـ tubules دي: لما تتملي دهون، الكلية ما تعرفش تركّز البول.
      - kind: figure
        page: 273
        title: "Case 11 بالـ LM"
        image: { file: neph/L08-fabry-lm.webp, book: true }
        caption: "Glomeruli معظمها **sclerosed**، والـ patent فيها ==podocytes منفوخة شاحبة== فوق الـ tuft."
        alt: "Book panel of nine light-microscopy images from case 11: many sclerosed glomeruli, and patent glomeruli whose overlying podocytes are swollen with pale vacuolated cytoplasm."
      - kind: figure
        page: 274
        title: "الـ vacuoles في الـ podocytes والـ tubules"
        image: { file: neph/L08-fabry-podocytes.webp, book: true }
        caption: "**Lacy** cytoplasm في الـ podocytes و ==vacuolated foamy== distal tubules."
        alt: "Four book images in a blue trichrome stain showing tubules and glomerular cells with clear, vacuolated, lacy cytoplasm."
      - kind: explain
        page: 274
        title: "ليه الـ cytoplasm شكله دانتيل؟"
        quote: "Picture is Highly Suggestive of Advanced Fabry Disease, Global Glomerulosclerosis (80%), Moderate Interstitial Fibrosis and Tubular Atrophy (35%)."
        text: |
          التشخيص: ==Highly Suggestive of Advanced Fabry Disease==، مع **global glomerulosclerosis 80%** و IFTA 35%.

          ليه الشكل ده؟ التفسير المقبول (مش في الكتاب):
          - الـ podocyte خلية **ما بتتجددش**، فأي دهن بيتخزن في الـ lysosomes بتاعتها بيتراكم سنين.
          - الدهن ده بيدوب في الكحول وقت تحضير الشريحة، فيسيب **فراغات** فاضية مكانه. الفراغات الكتير دي هي اللي بتعمل الشكل الـ **lacy** أو الـ foamy.
          - وفي الـ EM التقليدي الدهن ده بيبان دوائر متطبّقة زي البصلة (zebra bodies)، بس في الـ case دي الـ semi-thin ما كانش فيها glomeruli.
          - والـ 80% sclerosis معناها إن المرض **advanced**، عشان كده الـ creatinine طالع والـ proteinuria بسيطة: الـ glomeruli اللي كانت هتسرّب بروتين خلاص اتقفلت.
      - kind: check
        page: 274
        quote: "Picture is Highly Suggestive of Advanced Fabry Disease, Global Glomerulosclerosis (80%), Moderate Interstitial Fibrosis and Tubular Atrophy (35%)."
        question: "Negative IF (including kappa and lambda), swollen pale lacy podocytes, vacuolated foamy distal tubules, 80% global sclerosis. Diagnosis?"
        options:
          - "Advanced Fabry disease"
          - "LCAT deficiency"
          - "Light chain cast nephropathy"
          - "Minimal change disease"
        answer: 0
        why:
          - "صح: الـ lacy podocytes و الـ foamy tubules = ==Fabry==، و 80% sclerosis = advanced."
          - "الـ LCAT فيه foam cells في الـ mesangium و subendothelial deposits، مش podocytes دانتيل."
          - "الـ cast nephropathy فيه casts متكسرة، والـ kappa والـ lambda هنا سلبيين."
          - "الـ MCD الـ LM فيه طبيعي، ومش بيعمل 80% sclerosis."
      - kind: explain
        page: 275
        title: "Fabry في سطرين"
        quote: "Fabry disease is a rare genetic X-linked disease with a deficiency of the enzyme alpha-galactosidase A (a-Gal A) that causes a buildup of a type of fat called globotriaosylceramide (Gb3, or GL-3) in the body. Fabry disease is classified as a type of lysosomal storage disorder."
        text: |
          **X-linked lysosomal storage disorder**: نقص ==alpha-galactosidase A==، فالـ **Gb3** (globotriaosylceramide) يتراكم في الخلايا. وفيه **early onset** و **late onset**.

          ليه «lysosomal storage»؟ التفسير المقبول (مش في الكتاب): الـ lysosome هو «مطحنة» الخلية. الإنزيم ده شغلته يكسّر الـ Gb3، فلو ناقص، الـ Gb3 بيدخل المطحنة ومايطلعش، والـ lysosomes تتملي وتتنفخ. ده نفس اللي شفناه: فراغات في الـ podocytes. وليه early و late onset؟ لأن **كمية** الإنزيم الباقية بتفرق: صفر = أعراض من الطفولة (ألم وقلة عرق وجلد)، شوية = المرض بيستخبى لحد ما القلب أو الكلى يتعبوا في سن كبير.
      - kind: explain
        page: 275
        title: "ليه X-linked بيفرق في الوراثة؟"
        quote: "Can you expect the pattern of inheritance in our case?"
        text: |
          الكتاب بيسأل ==Can you expect the pattern of inheritance in our case?==، وبيقسم Fabry لـ **early onset** و **late onset**.

          ليه الوراثة كده؟ التفسير المقبول (مش في الكتاب):
          - الجين على الـ **X**. الأب بيدّي الـ X بتاعه لكل بناته والـ Y لكل ولاده، فكل البنات حاملين وولا ولد.
          - الأم عندها X سليم و X مصاب، فكل طفل عنده فرصة 50% ياخد المصاب.
          - الراجل عنده X واحد بس، فلو مصاب مفيش نسخة سليمة تعوّض، عشان كده الرجالة غالبًا أشد. والست ممكن تتأثر بدرجة لأن جزء من خلاياها شغّال بالـ X المصاب.
          فالشاب بتاعنا غالبًا واخدها من **مامته**، وبناته في المستقبل كلهم هيبقوا حاملين.

          وليه ده يفرق مع العيلة؟ التفسير المقبول (مش في الكتاب): لما تشخّص راجل، **أمه** غالبًا حاملة، فممكن **إخواته وأخواته** يكونوا مصابين، ولازم يتعمل لهم screening. وبناته كلهم حاملين، فلما يكبروا ويخلفوا، أولادهم هيبقى عندهم 50%. يعني التشخيص في واحد بيفتح شجرة عيلة كاملة محتاجة فحص.
      - kind: figure
        page: 275
        quote: "Hereditary: Depending on which parent contributes the X chromosome containing the genetic mutation, Fabry disease is passed to children differently.\n  An affected father (XY) will pass the mutation to all of his daughters, but none of his sons.\n  An affected mother (XX) will have a 50% chance of passing the mutation to any of her children."
