      - "تعرف دور الـ plantar pressure والـ insoles والـ footwear"
    status: unverified
    steps:
      - kind: explain
        page: 70
        title: "النبض بيكدب"
        quote: "Foot Pulses:\n  Absent foot pulses: Severe PAD.\n  Palpable foot pulses: Can NOT exclude PAD.\n  Screening for mild-to-moderate PAD: by measuring the ABI."
        text: |
          - **Absent foot pulses** = ==severe peripheral artery disease (PAD)==
          - **Palpable foot pulses** = ==can NOT exclude PAD==
          - الـ **mild-to-moderate PAD** بيتكشف بالـ **ankle–brachial index (ABI)**

          يعني النبض الغايب بيقولك حاجة أكيدة، والموجود ما بيقولكش حاجة.

          ليه؟ التفسير المقبول (مش في الكتاب): النبض بيفضل يتحس لحد ما الشريان يضيق جامد أو يتقفل. الضيق الخفيف والمتوسط بيقلل الدم الواصل من غير ما يخفي النبضة، وصباعك مش جهاز قياس. عشان كده محتاجين رقم: الـ **ABI**.
      - kind: figure
        page: 70
        title: "صور الكتاب ص 70: فين تحس النبض؟"
        image: { file: dm/L06-foot-pulses.webp, book: true }
        alt: "Book photos, two feet. Left: the examiner's fingers rest flat on the top of the foot. Right: the examiner's fingers curl behind the inner ankle."
        caption: |
          - **الشمال**: الصوابع على **ضهر الرجل**: ده الـ ==dorsalis pedis==.
          - **اليمين**: الصوابع ورا **الكعب الداخلي** (medial malleolus): ده الـ ==posterior tibial==.

          ولو الاتنين متحسّين، لسه ما تقدرش تستبعد الـ PAD.
