      - kind: explain
        page: 317
        title: "الكفاية والـ PET"
        quote: "The PET peritoneal equilibration test: is to define the rates of the equilibration of solutes (e.g. glucose, creatinine and urea) between the peritoneal capillary blood and dialysate. The ratio of solute concentrations in dialysate and plasma (D/P ratio) at specific times (t) during the dwell signifies the extent of solute equilibration."
        text: |
          الهدف: ==Kt/V urea 2== أسبوعيًا و **creatinine clearance 60 L**/أسبوع/1.73 m² في الـ CAPD، وأعلى شوية في الـ APD. بيعتمد على عدد وحجم وقوة الـ exchanges والـ dwell time.

          الـ ==peritoneal equilibration test (PET)== بيقيس سرعة الـ equilibration بالـ **D/P ratio**:
          - **Fast transporter**: exchanges أكتر و dwell أقصر (cycler).
          - **Low transporter**: حجم أكبر (3 لتر بدل 2.5).

          الـ technique survival كانت 30–50% في 5 سنين. الفشل: **ultrafiltration (UF) failure**، clearance مش كفاية، و **peritonitis**. والـ PD بيكسب بدري (residual renal function).
