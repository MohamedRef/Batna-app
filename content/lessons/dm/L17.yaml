      - kind: explain
        page: 225
        title: "مين بيمنع الـ hip fracture؟"
        quote: "Other available antiresorptives include the selective estrogen receptor modulator (SERM) raloxifene and the bisphosphonate ibandronate. Although both reduce vertebral fractures, neither has yet been shown to reduce hip fractures in randomized trials."
        text: |
          - **Alendronate، risedronate، estrogen**: بيمنعوا ==vertebral, non-vertebral, and hip fractures==.
          - **Raloxifene** و **ibandronate**: بيقللوا الـ vertebral، بس **لسه ما اتثبتش** إنهم بيمنعوا الـ hip.

          ليه الفرق ده مهم؟ عشان الـ hip fracture هو الكسر اللي بيقعّد الكبير ويموّته، فالدوا اللي اتثبت إنه بيمنعه بيتقدّم في الاختيار (الدرس الجاي).
      - kind: table
        page: 225
        quote: "Alendronate (10 mg/day or 70 mg once weekly [orally]) or risedronate (5 mg/day or 35 mg once weekly [orally]), and ibandronate (150 mg once-"
        title: "جرعات الـ bisphosphonates"
        columns: [Drug, Daily, Intermittent]
        rows:
          - ["Alendronate", "10 mg", "70 mg weekly"]
          - ["Risedronate", "5 mg", "35 mg weekly"]
          - ["Ibandronate", "–", "150 mg monthly oral, 3 mg IV q3 months"]
          - ["Zoledronic acid", "–", "5 mg IV yearly"]
        hide: [[0, 2], [1, 1], [2, 2], [3, 2]]
      - kind: aside
        tone: tip
        page: 225
        quote: "Alendronate (10 mg/day or 70 mg once weekly [orally]) or risedronate (5 mg/day or 35 mg once weekly [orally]), and ibandronate (150 mg once-"
        text: "الأسبوعي = اليومي **× 7**: alendronate **10 × 7 = 70**، و risedronate **5 × 7 = 35**. مش محتاج تحفظ أربع أرقام، اتنين بس."
      - kind: explain
        page: 226
        title: "عيوب الـ bisphosphonates"
        quote: "One rare side effect, osteonecrosis of the jaw (ONJ, also known as avascular necrosis of the jaw), has been reported in patients receiving bisphosphonate therapy. However, the majority of cases have been observed in cancer patients treated with high-dose intravenous bisphosphonates."
        text: |
          - الـ oral: خلي بالك من ==esophagitis==.
          - **Osteonecrosis of the jaw (ONJ)**: نادر، وأغلبه في **cancer patients على high-dose IV**.

          يعني مريضة الـ osteoporosis على حباية أسبوعية خطرها قليل جدًا، وده مش سبب تمنع عنها الدوا.
      - kind: explain
        page: 226
        title: "الـ bisphosphonates: بتشتغل إزاي، وليه الحذر ده؟"
        quote: "When bisphosphonates are taken orally, precautions should be taken to avoid esophagitis."
        text: |
          الكتاب: بتزوّد الـ bone mass وبتقلل الكسور، والـ oral محتاج ==احتياطات تمنع الـ esophagitis==، والـ ONJ نادر وأغلبه في مرضى السرطان على جرعات IV عالية.

          التفسير المقبول (مش في الكتاب):
          - **بتشتغل إزاي؟** بتلزق في سطح العضم، والـ osteoclast اللي بياكل العضم بيبلعها فبيتشل. يعني السحب بيقف.
          - **ليه الـ esophagitis؟** الحباية لو قعدت في المريء بتهيّجه، فبتتاخد ==بكوباية مية كاملة والمريض واقف أو قاعد== ومش بينام بعدها.
          - **ليه الـ ONJ في مرضى السرطان؟** الجرعات هناك أعلى بكتير، فالـ turnover في الفك بيقف خالص.
      - kind: explain
        page: 226
        title: "الـ raloxifene: SERM بوشّين"
        quote: "Raloxifene is a tissue-selective estrogen receptor modulator (SERM) that is used for the prevention and treatment of osteoporosis. It increases bone mineral density and reduces the risk of vertebral fractures. Raloxifene also appears to lower the risk of breast cancer, does not stimulate endometrial hyperplasia or vaginal bleeding, and increases the risk of venous thromboembolism. Although it decreases serum total and low-density- lipoprotein (LDL) cholesterol concentrations, raloxifene does not appear to affect the risk of coronary heart disease."
        text: |
          ==Raloxifene== بيتصرف زي الـ estrogen على العضم، وعكسه على الثدي والرحم:
          - Bone mineral density (BMD) ↑، **vertebral fractures** ↓
          - **Breast cancer risk** ↓
          - مفيش **endometrial hyperplasia** ولا vaginal bleeding
          - **Venous thromboembolism risk ↑** (ده الفخ)
          - Total و low-density lipoprotein (LDL) ↓، بس من غير تأثير على الـ coronary heart disease (CHD)

          الكتاب بيعتبره **first-line for prevention**، بس أضعف من الـ estrogen والـ bisphosphonates.

          ليه "بوشّين"؟ الـ SERM بيقعد على مستقبل الـ estrogen، وفي العضم بيشغّله، وفي الثدي والرحم بيقفله. أما الـ VTE فده نفس عيب الـ estrogen نفسه على الكبد وعوامل التجلط (التفسير المقبول، مش في الكتاب).
      - kind: check
        page: 226
        quote: "Raloxifene is a tissue-selective estrogen receptor modulator (SERM) that is used for the prevention and treatment of osteoporosis. It increases bone mineral density and reduces the risk of vertebral fractures. Raloxifene also appears to lower the risk of breast cancer, does not stimulate endometrial hyperplasia or vaginal bleeding, and increases the risk of venous thromboembolism. Although it decreases serum total and low-density- lipoprotein (LDL) cholesterol concentrations, raloxifene does not appear to affect the risk of coronary heart disease."
        question: "Which is a risk of raloxifene?"
