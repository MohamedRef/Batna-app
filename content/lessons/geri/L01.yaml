        hook: "**«ساكت، دايخ، ملخبط، واقع، بطنه، وقلبه بيقطّع»**: Silent، Dyspnea، Confusion، Syncope، GI، Conduction. ده Q2."
      - kind: update
        page: 12
        quote: "Cardinal signs of MI 1- Suggestive pain > 30 min 2- ECG 3- Increased cardiac enzymes"
        text: "الـ **Fourth Universal Definition** بيشترط **troponin** يعلى أو ينزل، وقيمة منه فوق الـ 99th percentile، **+** دليل ischemia: أعراض، أو ECG جديد، أو Q waves، أو imaging، أو thrombus. في الامتحان: الـ cardinal signs التلاتة بتوع الكتاب."
        ref: "Fourth Universal Definition of Myocardial Infarction, 2018"
