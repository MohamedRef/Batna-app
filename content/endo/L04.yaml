    topic: crf-reproductive
    front: What does CRF do to children's growth and puberty, and what reverses it?
    back: Impaired sexual maturation and stunted growth, which improve or reverse with successful renal transplantation.
    src: { page: 50, quote: "In children\n  Impaired sexul maturation.\n  Stunted growth.\n  These abnormalities improve or reverse with successful R.T." }
