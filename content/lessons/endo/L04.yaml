  # ------------------------------------------------------------------
  - id: endo.L04.lesson1
    title: "القلب كغدة: هرمونات القلب والأوعية"
    hook: "القلب مش بس طرمبة. ده بيفرز هرمونات بتتحكم في الضغط والكلية."
    minutes: 7
    pages: [43, 45]
    topics: [cv-hormones, oestrogen, heart-failure]
    goals:
      - "تعدّ عائلات الـ cardiovascular hormones ومصدر كل واحد"
      - "تعرف تأثير الـ oestrogen على الـ CVS، الكويس والوحش"
      - "تعدّ الهرمونات اللي بتتنشط في الـ heart failure"
    status: unverified
    steps:
      - kind: explain
        page: 43
        quote: "three families of cardiovascular hormones have proven to be potent regulators of cardiovascular and renal function"
        title: "القلب بيفرز هرمونات"
        text: |
          زمان كانوا فاكرين القلب مجرد ==muscular pump==. دلوقتي معروف إن فيه **three families of cardiovascular hormones** بتنظّم الـ cardiovascular و الـ renal function.

          وبتشتغل يا إما **endocrine** حقيقي، يا إما **autocrine/paracrine**.
      - kind: figure
        page: 43
        quote: "Natriuretic peptides Adrenomedullin Endothelins Nitric oxide(NO)"
        title: "شجرة الهرمونات"
        alt: "Tree diagram. Cardiovascular hormones branch into natriuretic peptides, endothelins with nitric oxide, and adrenomedullin. Natriuretic peptides split into ANP and BNP, secreted by the heart, and C-type natriuretic peptide, secreted by the endothelium. Endothelins split into ET-1, ET-2 and ET-3."
        caption: "الـ ANP والـ BNP من القلب، والـ CNP والـ endothelins والـ NO من الـ endothelium."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="E04a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="85" y="8" width="160" height="28" rx="8" class="fg-acc"/>
            <text x="165" y="27" text-anchor="middle" class="t-sm t-b">Cardiovascular hormones</text>
            <path d="M120 36L60 64" class="fg-arrow" marker-end="url(#E04a)"/>
            <path d="M165 36V64" class="fg-arrow" marker-end="url(#E04a)"/>
            <path d="M210 36L272 64" class="fg-arrow" marker-end="url(#E04a)"/>
            <rect x="8" y="66" width="104" height="28" rx="6" class="fg-box"/>
            <text x="60" y="84" text-anchor="middle" class="t-sm t-b">Natriuretic</text>
            <rect x="120" y="66" width="90" height="28" rx="6" class="fg-bad"/>
            <text x="165" y="84" text-anchor="middle" class="t-sm t-b">Endothelins</text>
            <rect x="218" y="66" width="104" height="28" rx="6" class="fg-good"/>
            <text x="270" y="84" text-anchor="middle" class="t-sm t-b">Adrenomedullin</text>
            <path d="M40 94L28 120" class="fg-arrow" marker-end="url(#E04a)"/>
            <path d="M60 94V120" class="fg-arrow" marker-end="url(#E04a)"/>
            <path d="M82 94L96 120" class="fg-arrow" marker-end="url(#E04a)"/>
            <text x="22" y="134" text-anchor="middle" class="t-sm t-b">ANP</text>
            <text x="60" y="134" text-anchor="middle" class="t-sm t-b">BNP</text>
            <text x="100" y="134" text-anchor="middle" class="t-sm t-b">CNP</text>
            <rect x="6" y="144" width="76" height="22" rx="5" class="fg-thin"/>
            <text x="44" y="159" text-anchor="middle" class="t-sm">heart</text>
            <rect x="84" y="144" width="40" height="22" rx="5" class="fg-thin"/>
            <text x="104" y="159" text-anchor="middle" class="t-sm">endo</text>
            <text x="165" y="118" text-anchor="middle" class="t-sm">ET-1 · ET-2 · ET-3</text>
            <text x="165" y="136" text-anchor="middle" class="t-sm t-bad">↑ BP on VSMCs</text>
            <text x="168" y="160" text-anchor="middle" class="t-sm">+ NO</text>
            <text x="270" y="118" text-anchor="middle" class="t-sm">adrenal medulla</text>
            <text x="270" y="136" text-anchor="middle" class="t-sm">brain, kidney, VSMC</text>
            <text x="270" y="160" text-anchor="middle" class="t-sm t-acc">↓ BP: sepsis</text>
            <rect x="8" y="186" width="314" height="54" rx="8" class="fg-thin"/>
            <text x="165" y="206" text-anchor="middle" class="t-sm t-b">Endothelium makes: endothelins, CNP, NO</text>
            <text x="165" y="226" text-anchor="middle" class="t-sm t-mut">heart makes: ANP, BNP</text>
          </svg>
      - kind: check
        page: 43
        quote: "C-type natriuretic Secreted by endothelium"
        question: "Which natriuretic peptide comes from the endothelium?"
        options: ["C-type natriuretic peptide", "ANP", "BNP", "Endothelin-1"]
        answer: 0
        why:
          - "صح: الـ CNP من الـ endothelium."
          - "الـ ANP من القلب."
          - "الـ BNP من القلب."
          - "الـ ET مش natriuretic peptide."
      - kind: explain
        page: 44
        quote: "The ETs are potent hypertensive agents that exert their effects directly on the VSMCs"
        title: "Endothelins و Adrenomedullin"
        text: |
          - ==Endothelins== (ET-1، ET-2، ET-3): **potent hypertensive agents** بتشتغل مباشرة على الـ VSMCs.
          - ==Adrenomedullin (AM)==: من الـ **chromaffin cells** في الـ adrenal، ومن المخ والكلية والـ endothelium والـ VSMCs. ممكن تكون سبب الـ **hypotension** في الـ inflammation والـ **septic shock** والـ atherosclerosis. وغالبًا شغلها autocrine أو paracrine.
      - kind: aside
        tone: analogy
        page: 44
        quote: "AM may be responsible for the hypotension of inflammation, septic shock, and atherosclerosis."
        text: "الـ endothelin زي اللي بيقفل الحنفية (يرفع الضغط)، والـ adrenomedullin زي اللي بيفتحها على الآخر في الـ septic shock (يوقّع الضغط)."
      - kind: sort
        page: 44
        quote: "Increases HDL cholesterol. Decreases LDL cholesterol."
        prompt: "صنّف تأثير الـ oestrogen على الـ CVS:"
        bins: ["Protective", "Opposite effect"]
        cards:
          - { text: "↑ HDL", bin: 0 }
          - { text: "↓ LDL", bin: 0 }
          - { text: "Vasodilation", bin: 0 }
          - { text: "Calcium-channel blocking", bin: 0 }
          - { text: "Antioxidant", bin: 0 }
          - { text: "Promotes blood clotting", bin: 1 }
          - { text: "↑ TG slightly", bin: 1 }
        why: "الـ oestrogen بيحمي بالـ lipids والـ vasodilation والـ antioxidant، بس بيزوّد الـ coagulability وبيرفع الـ TG شوية (ص 72)."
      - kind: aside
        tone: trap
        page: 44
        quote: "Soaks up free radicals, naturally occurring particles in the blood that can damage the arteries and other tissues."
        text: "الكتاب حاطط الـ «soaks up free radicals» تحت «opposite effect»، بس هو في الحقيقة antioxidant يعني protective، والكتاب نفسه بيكتب anti-oxidant تحت الـ cardioprotective. لو اتسألت، الـ opposite effect هو الـ **clot formation**."
      - kind: explain
        page: 45
        quote: "Plasma noradrenaline levels, which are often taken as an index of \"global sympathetic outflow\" have been shown to predict prognosis."
        title: "الهرمونات في الـ heart failure"
        text: |
          1. ==RAS activation==: renin عالي في الـ renal venous blood.
          2. **Aldosterone**.
          3. ==Sympathetic==: الـ venous **noradrenaline** مقياس للـ global sympathetic outflow. كل ما يعلى، الـ **prognosis أوحش**.
          4. **Neuropeptide Y**: vasoconstrictor قوي في الـ coronaries، ومستواه ماشي مع الـ noradrenaline.
      - kind: mnemonic
        page: 45
        quote: "1- Activation of the renin-angiotensin system"
        word: "RASN"
        parts:
          - { key: "R", text: "Renin–angiotensin system" }
          - { key: "A", text: "Aldosterone" }
          - { key: "S", text: "Sympathetic (noradrenaline = prognosis)" }
          - { key: "N", text: "Neuropeptide Y" }
        hook: "الـ heart failure بيـ «RASN» الجسم كله: أربع هرمونات بالترتيب بتاع الكتاب."
      - kind: try
        items: [endo.L04.004, endo.L04.008, endo.L04.010, endo.L04.013, endo.L04.020]
    recap:
      - "3 عائلات: natriuretic peptides، endothelins (+ NO)، adrenomedullin."
      - "ANP و BNP من القلب؛ CNP والـ ET والـ NO من الـ endothelium."
      - "ET = hypertensive على الـ VSMCs؛ AM = hypotension الـ sepsis."
      - "Oestrogen: ↑HDL ↓LDL، vasodilator، antioxidant، Ca blocker؛ بس بيزوّد الـ clotting."
      - "HF: renin، aldosterone، sympathetic (noradrenaline تتنبأ بالـ prognosis)، NPY."
    practice: [endo.L04.001, endo.L04.002, endo.L04.003, endo.L04.004, endo.L04.005, endo.L04.006, endo.L04.007, endo.L04.008, endo.L04.009, endo.L04.010, endo.L04.011, endo.L04.012, endo.L04.013, endo.L04.014, endo.L04.015, endo.L04.016, endo.L04.017, endo.L04.018, endo.L04.019, endo.L04.020, endo.L04.021, endo.L04.022, endo.L04.185, endo.L04.186, endo.L04.187, endo.L04.188, endo.L04.189, endo.L04.238, endo.L04.239, endo.L04.240]
