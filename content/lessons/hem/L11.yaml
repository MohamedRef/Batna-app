      - kind: explain
        page: 186
        quote: "Table 22.5: Treatment of myeloma\n| Modality | Examples or indications |\n| Corticosteroids | Dexamethasone, prednisolone, prednisone |\n| Alkylating agents | Cyclophosphamide, melphalan |\n| Proteasome inhibitors | Bortezomib, carfilzomib, ixazomib (oral) |\n| Immunomodulators (IMID) | Lenalidomide, pomalidomide, thalidomide |\n| Monoclonal antibodies / Bi-specific antibodies | Daratumumab, isatuximab (both anti-CD38), elotuzumab (anti-SLAM7); belantamab-mafodotin (anti-BCMA); Teclistamab, elranatamab (both anti-CD3, anti-BCMA); talquetamab (anti-CD3, anti-GPRC5D) |\n| Nuclear export | Selinexor |\n| BCL2 inhibitor | Venetoclax |\n| Cell therapy | Autologous SCT; CAR-T cells (ide-cel, ciltacel) anti-BCMA or other myeloma antigens |\n| Radiotherapy | External beam therapy used for painful local lytic lesions or spinal cord/nerve root compression; unstable lesions at risk for fracture, e.g. femoral neck may also require orthopaedic surgery |\n| Plasmapheresis | Used for acute treatment of hyperviscosity, and for monoclonal gammopathies with clinical consequences, e.g. acquired coagulation factor inhibitors, severe neuropathy |\n| Supportive care | Bisphosphonates, e.g. pamidronate, zoledronic acid; denosumab (RANKL inhibitor); Intravenous immunoglobulin for patients with low gamma globulins and recurrent infection; Haemodialysis for severe renal failure |"
        title: "جدول الأدوية"
        text: |
          - **Corticosteroids**: dexamethasone، prednisolone.
          - **Alkylating**: cyclophosphamide، **melphalan**.
          - ==Proteasome inhibitors==: bortezomib، carfilzomib، ixazomib (oral).
          - **IMiDs**: lenalidomide، pomalidomide، thalidomide.
          - **Antibodies**: anti-CD38 (daratumumab، isatuximab)، anti-SLAMF7 (elotuzumab)، anti-BCMA (belantamab)، و bispecifics (teclistamab، elranatamab، talquetamab).
          - **Selinexor** (nuclear export)، **venetoclax** (BCL2)، **ASCT** و **CAR-T** (anti-BCMA).
          - **Radiotherapy**: lytic lesions بتوجع، أو **spinal cord/nerve root compression**.
          - **Plasmapheresis**: الـ **hyperviscosity** الحادة، وأحيانًا acquired factor inhibitors و severe neuropathy.
          - **Supportive**: bisphosphonates، **denosumab** (RANKL inhibitor)، **IVIG** لو الـ gamma globulins واطية مع عدوى متكررة، و dialysis.

          التفسير المقبول (مش في الكتاب) للـ targets: الـ **CD38** والـ **BCMA** و الـ **SLAMF7** بروتينات قاعدة على سطح الـ plasma cell بكثافة، فالـ antibody بيلاقي الهدف بسهولة. والـ bispecific بيمسك الـ myeloma بإيد والـ **T cell (CD3)** بالإيد التانية ويقرّبهم.
