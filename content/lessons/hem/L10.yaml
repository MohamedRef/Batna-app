  - id: hem.L10.lesson5
    title: "Hb عالي بس مش PV: دوّر على السبب"
    hook: "رئة تعبانة، جبل عالي، سيجارة، كلية، ورم، أو مجرد بلازما قليلة."
    minutes: 10
    pages: [169, 175]
    topics: [secondary]
    goals:
      - "تصنّف أسباب الـ polycythemia غير الـ PV"
      - "تفهم الـ high-affinity Hb والـ met-Hb والـ Chuvash"
      - "تتعامل مع الـ apparent polycythemia"
    status: unverified
    steps:
      - kind: explain
        page: 169
        title: "الخريطة"
        quote: "Causes of polycythemia other than polycythemia vera"
        text: |
          - **Primary**: ==primary familial and congenital polycythemia== (عيب في الـ progenitors نفسها).
          - **Secondary مع systemic hypoxia**:
          - **Chronic hypoxia**: lung disease، hypopnea، **high altitude**، cyanotic heart disease.
          - **Defective O2 transport**: **high-affinity Hb**، **low 2,3-BPG**، **met-Hb**، **heavy smoking** (CO-Hb).
          - **Secondary من غير hypoxia**: **Chuvash**، **abnormal EPO secretion** (كلى، cerebellar hemangioma، HCC)، **endocrine** (androgens، Cushing، Conn، pheo، Bartter).
      - kind: sort
        page: 169
        quote: "Causes of polycythemia other than polycythemia vera"
        prompt: "فيه hypoxia ولا لأ؟"
        bins: ["With systemic hypoxia", "Without systemic hypoxia"]
        cards:
          - { text: "COPD", bin: 0 }
          - { text: "High altitude", bin: 0 }
          - { text: "High-affinity hemoglobin", bin: 0 }
          - { text: "Heavy smoking", bin: 0 }
          - { text: "Chuvash polycythemia", bin: 1 }
          - { text: "Renal transplantation", bin: 1 }
          - { text: "Cerebellar hemangioma", bin: 1 }
          - { text: "Cushing syndrome", bin: 1 }
        why: "الـ hypoxia يا إما الأكسجين ما بيدخلش (رئة، جبل، قلب cyanotic) يا إما الـ Hb ماسك فيه وما بيسيبوش للأنسجة (high-affinity، met-Hb، CO). من غير hypoxia: الـ EPO بيعلى من غير سبب (Chuvash، كلى، أورام) أو androgens."
      - kind: explain
        page: 170
        title: "Primary familial و الـ hypoxic"
        quote: "Isolated erythrocytosis, normal WBC and platelet count, no splenomegaly. No evolution to leukemia."
        text: |
          **Primary familial**: نادر، **autosomal dominant**، ==isolated erythrocytosis== (WBC و platelets طبيعيين، مفيش طحال)، ومفيش leukemia. الـ EPO **واطي أو normal**، والـ Hb–O2 curve طبيعي. السبب: **EPO receptor** mutation أو truncation.

          **Hypoxic**: COPD، sleep apnea، hypoventilation. الـ polycythemia بتزوّد شيل الأكسجين بس كمان اللزوجة؛ **venesection لو Hct >0.55**.
      - kind: explain
        page: 171
        title: "فوق الجبل وفي القلب"
        quote: "Excessive altitude polycythemia (PCV>0.65) in some cases with hyperuricemia and proteinuria."
        text: |
          - فوق **4000 م**: mild polycythemia + perfusion و diffusion أحسن + enzymes و myoglobin.
          - **Excessive altitude polycythemia**: PCV ==>0.65== (ممكن hyperuricemia و proteinuria).
          - **Chronic mountain sickness**: PCV **>0.75** مع بطء تفكير، صداع، lethargy، dyspnea، كحة ناشفة، و **right HF**. العلاج **ACE inhibitor**.
          - **Cyanotic CHD** (R→L shunt): PCV ممكن **>0.8**. صلّح الـ defect لو ينفع؛ venesection عند **PCV >0.60** أو للأعراض.
      - kind: explain
        page: 171
        title: "Hb ماسك في الأكسجين"
        quote: "Pathognomonic anomaly is left shift of oxygen dissociation curve."
        text: |
          ==High-affinity Hb==: بيسيب O2 أقل للأنسجة، فالكلى تحس بـ hypoxia وتطلع **EPO**.
          - **Pathognomonic**: **left shift** في الـ O2 dissociation curve (P50 واطي).
          - الطفرات في المنطقة اللي بتتحكم في التحول بين **T (tense)** و **R (relaxed)**.
          - أكتر من **40 variant**، أغلبها β-globin، كلها **dominant**.
          - أغلبهم أصحاء، plethoric، ومفيش CV risk زيادة.

          **Red cell metabolic defects**: 2,3-BPG قليل، **autosomal recessive**، P50 واطي.
      - kind: figure
        page: 171
        quote: "Pathognomonic anomaly is left shift of oxygen dissociation curve."
        title: "الـ left shift"
        alt: "Two oxygen dissociation curves on pO2 versus saturation axes. The normal curve has P50 marked at 50% saturation. A second curve sits to the left, labelled high-affinity Hb, met-Hb, CO-Hb and low 2,3-BPG, with a lower P50: hemoglobin holds oxygen more tightly and releases less to tissue."
        caption: "منحنى على الشمال = الـ Hb **ماسك** في الـ O2. الأنسجة بتجوع، الكلى تطلع EPO، والكرات تزيد. وده يحصل في ==high-affinity Hb== و met-Hb و CO-Hb وقلة الـ 2,3-BPG."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 15 V205 H320" class="fg-ink"/>
            <text x="180" y="235" text-anchor="middle" class="t-sm">pO2</text>
            <text x="12" y="110" class="t-sm">Sat</text>
