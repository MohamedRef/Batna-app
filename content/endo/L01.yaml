  # ---------- p1: definition and MEN 1 contents ----------
  - id: endo.L01.001
    kind: card
    topic: definition
    front: Define multiple endocrine neoplasia (MEN).
    back: A group of genetically determined disorders with a predisposition to tumours in two or more components of the endocrine system.
    src: { page: 1, quote: "(MEN) comprises various genetically determined disorders with a predisposition to tumor development within two or more components of the endocrine system." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.002
    kind: card
    topic: definition
    front: What are the two major forms of MEN, and what characterises each?
    back: MEN 1 and MEN 2; each type develops tumours within specific endocrine organs.
    src: { page: 1, quote: "There are two major forms of MEN\nType 1 (MEN 1). Type 2 (MEN 2).\nAnd each type is characterized by the development of tumors within specific endocrine organs." }
    status: unverified
  - id: endo.L01.003
    kind: cloze
    topic: definition
    text: MEN 1 is also called {{c1::Wermer's}} syndrome and is the {{c2::most common}} form of MEN.
    src: { page: 1, quote: "MEN 1 (Wermer's Syndrome)\nThe most common\n  The syndrome becomes clinically manifest in the 4th decade.\n  However biochemical testing is identified by the age of 14 – 18 years.\n  Contents of MEN 1 (Wermer's Syndrome).\n    1- Parathyroid disease.\n    2- Anterior Pituitary Adenomas.\n    3- Entero-pancreatic tumors:\n      Insulinomas.\n      Gastrinomas.\n      Glucagonomas.\n      VIPomas.\n      Somatostatinomas." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.004
    kind: cloze
    topic: definition
    text: MEN 1 becomes clinically manifest in the {{c1::4th}} decade, but biochemical testing identifies it by age {{c2::14–18}} years.
    src: { page: 1, quote: "The most common\n  The syndrome becomes clinically manifest in the 4th decade.\n  However biochemical testing is identified by the age of 14 – 18 years.\n  Contents of MEN 1 (Wermer's Syndrome).\n    1- Parathyroid disease.\n    2- Anterior Pituitary Adenomas.\n    3- Entero-pancreatic tumors:\n      Insulinomas.\n      Gastrinomas.\n      Glucagonomas.\n      VIPomas.\n      Somatostatinomas." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.005
    kind: enumerate
    topic: definition
    prompt: Enumerate the components of MEN 1 (Wermer's syndrome).
    points:
      - Parathyroid disease (primary hyperparathyroidism)
      - Anterior pituitary adenomas
      - "Entero-pancreatic tumours: insulinoma, gastrinoma, glucagonoma, VIPoma, somatostatinoma, PP-producing and rare islet cell tumours"
      - Other tumours
    pass: 3
    hook: "الـMEN 1 = «3 P + شنطة الباقي»: Parathyroid (primary hyperparathyroidism)، anterior Pituitary adenomas، وentero-Pancreatic tumours (insulinoma، gastrinoma، glucagonoma، VIPoma، somatostatinoma، PP-producing، وislet cell نادرة)… والرابعة «أورام تانية» (other tumours). 3 + 1 = 4."
    src: { page: 1, quote: "The most common\n  The syndrome becomes clinically manifest in the 4th decade.\n  However biochemical testing is identified by the age of 14 – 18 years.\n  Contents of MEN 1 (Wermer's Syndrome).\n    1- Parathyroid disease.\n    2- Anterior Pituitary Adenomas.\n    3- Entero-pancreatic tumors:\n      Insulinomas.\n      Gastrinomas.\n      Glucagonomas.\n      VIPomas.\n      Somatostatinomas." }
    status: unverified
    tags: [high-yield]
  # ---------- p2-3: primary hyperparathyroidism ----------
  - id: endo.L01.006
    kind: card
    topic: men1-pth
    front: What is the earliest and most common manifestation of MEN 1, and what is its penetrance?
    back: Primary hyperparathyroidism, with about 100% penetrance.
    src: { page: 2, quote: "Primary Hyperparathyroidism\n~ 100% penetrance – earliest / most common manifestation." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.007
    kind: card
    topic: men1-pth
    front: How does hyperparathyroidism in MEN 1 differ anatomically from sporadic primary hyperparathyroidism?
    back: MEN 1 involves multiple glands; sporadic disease is usually a single-gland adenoma.
    src: { page: 2, quote: "Multiglandular involvement (unlike sporadic hyper PTH w/single\ngland adenoma)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.008
    kind: card
    topic: men1-pth
    front: How is primary hyperparathyroidism in MEN 1 diagnosed (clinical, lab, imaging)?
    back: "Clinically: stones and bones. Lab: hypercalcaemia with high serum PTH. Imaging: sestamibi scan and bone densitometry."
    src: { page: 2, quote: "Diagnosing\n  Clinically - Stones, bones.\n  Lab diagnosis :hypercalcemia w/ high serum PTH.\n  Imaging – sestamibi & bone densitometry." }
    status: unverified
  - id: endo.L01.009
    kind: enumerate
    topic: men1-pth
    prompt: Indications for parathyroid surgery in MEN 1.
    points:
      - Symptomatic or marked hypercalcaemia
      - Nephrolithiasis
      - Diminished bone density (osteopenia)
      - Severe gastric ulcers secondary to gastrinoma
    pass: 3
    hook: "عملية الـparathyroid في MEN 1 ليها 4 «كالسيوم، حصوة، عضم، قرحة»: hypercalcaemia بأعراض أو شديدة، nephrolithiasis، bone density قلّت (osteopenia)، وقرحة معدة شديدة من gastrinoma."
    src: { page: 2, quote: "Indications for surgery\n  Symptomatic or marked hypercalcemia.\n  Nephrolithiasis.\n  Diminished bone density / osteopenia.\n  Presence of severe gastric ulcers 2ry to gastrinoma (hypercalcemia increase release of gastrin & worsens hypergastrinemia and parathyroidectomy reduces gastrin secretion.**" }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.010
    kind: card
    topic: men1-pth
    front: Why do severe gastrinoma ulcers count as an indication for parathyroidectomy in MEN 1?
    back: Hypercalcaemia increases gastrin release and worsens hypergastrinaemia; parathyroidectomy reduces gastrin secretion.
    src: { page: 2, quote: "Indications for surgery\n  Symptomatic or marked hypercalcemia.\n  Nephrolithiasis.\n  Diminished bone density / osteopenia.\n  Presence of severe gastric ulcers 2ry to gastrinoma (hypercalcemia increase release of gastrin & worsens hypergastrinemia and parathyroidectomy reduces gastrin secretion.**" }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.011
    kind: cloze
    topic: men1-pth
    text: "After parathyroid surgery in MEN 1: temporary hypocalcaemia is {{c1::common}}; risk of permanent hypoparathyroidism is {{c2::4%}} and of persistent or recurrent hyperparathyroidism {{c3::30%}}."
    src: { page: 2, quote: "Complications of Parathyroid Surgery\n  Temporary hypocalcemia common.\n  4% risk permanent hypoPTH, 30% risk persistent/recurrent hyperPTH.\n  Graft function successful in >90% of autotransplantations.\n  High rate of recurrence after successful surgical therapy unlike sporadic 67% after 8years." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.012
    kind: cloze
    topic: men1-pth
    text: Parathyroid autotransplant grafts function successfully in {{c1::more than 90%}} of cases; recurrence after successful surgery in MEN 1 is high, about {{c2::67% after 8 years}}, unlike sporadic disease.
    src: { page: 2, quote: "Complications of Parathyroid Surgery\n  Temporary hypocalcemia common.\n  4% risk permanent hypoPTH, 30% risk persistent/recurrent hyperPTH.\n  Graft function successful in >90% of autotransplantations.\n  High rate of recurrence after successful surgical therapy unlike sporadic 67% after 8years." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.013
    kind: card
    topic: men1-pth
    front: Surgical therapy for primary hyperparathyroidism in MEN 1?
    back: Subtotal parathyroidectomy (removal of 3.5 glands), leaving a remnant in situ or implanting an autograft in the forearm (successful in more than 90%).
    src: { page: 3, quote: "Therapy for Primary Hyperparathyroidism\n  Subtotal parathyroidectomy (removal of 3.5).\n  Parathyroid remnants in situ OR autograft implanted into forearm succesful in >90% of cases." }
    status: unverified
    tags: [high-yield]
  # ---------- p3: pituitary ----------
  - id: endo.L01.014
    kind: cloze
    topic: men1-pituitary
    text: Anterior pituitary tumours occur in {{c1::15–60%}} of MEN 1 patients and are the first clinical manifestation in up to {{c2::25%}}; {{c3::two-thirds}} are microadenomas (under 1 cm).
    src: { page: 3, quote: "Anterior Pituitary tumors\n  Prevalence in MEN-1 ranges 15-60% in different series.\n  First clinical manifestation in up to 25% of cases.\n  Two-thirds are microadenomas (<1cm).\n  Prolactinomas 60%, somatotropinomas 20%, corticotrophinomas and null cell tumors 15%.\n  Female patient may complain from amenorrhea, galactorrhea, infertility, impotence in men; acromegaly or cushing's disease.\n  Monitor PRL, IGF-1.\n  CT/MRI.\n  Trans-sphenoidal resection of pituitary tumor." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.015
    kind: table
    topic: men1-pituitary
    title: Types of pituitary tumour in MEN 1
    columns: [Tumour, Share]
    rows:
