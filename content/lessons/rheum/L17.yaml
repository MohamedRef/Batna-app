      - kind: explain
        page: 286
        title: "الـ spine والـ US والـ MRI"
        quote: "May reveal evidence of early sacroiliitis (bone marrow edema), or chronic changes including bone erosions, sclerosis"
        text: |
          **Spine**: squaring (periostitis)، ==bamboo spine== (syndesmophytes)، و **railway appearance** في الـ lateral (تكلّس الـ anterior و lateral ligaments).

          **US**: يثبت الـ active enthesitis.

          **MRI**: الـ early = ==bone marrow oedema==؛ الـ chronic = erosions، sclerosis، periarticular fat.
      - kind: check
        page: 286
        quote: "May reveal evidence of early sacroiliitis (bone marrow edema)"
        question: "Which MRI finding best indicates early AS?"
        options: ["Bone marrow oedema of the SI joints", "Periarticular fat accumulation", "Vertebral erosions", "Spinal ankylosis"]
        answer: 0
        why:
          - "صح: ده سؤال الكتاب نفسه (ص 300). الـ bone marrow oedema = early sacroiliitis."
          - "الـ fat accumulation تغيير chronic."
          - "الـ erosions تغيير chronic."
          - "الـ ankylosis آخر مرحلة."
      - kind: explain
        page: 287
        title: "الـ modified New York 1984"
        quote: "Define AS if radiologic criterion is associated with at least one clinical criterion."
        text: |
          **Clinical**:
          1. Low back pain و stiffness **3 شهور**، تتحسّن بالرياضة ومش بالراحة
          2. حركة الـ lumbar محدودة في الـ sagittal والـ frontal
          3. الـ chest expansion محدود (حسب السن والجنس)

          **Radiological**: sacroiliitis **grade 2 أو أكتر bilateral** أو **3-4 unilateral**.

          ==AS = radiological + clinical واحد على الأقل==.
      - kind: aside
        tone: trap
        page: 288
        quote: "definite radiographic disease at grade 2 bilateral or grade 3 to 4 unilateral (according to modified NY criteria 1984)"
        text: "خلي بالك: ص 287 في الكتاب مكتوب \"grade 1 - 2 bilaterally\"، بس ص 288 بيقول **grade 2 bilateral** وده المعروف في الـ modified NY. اكتب **grade 2 bilateral أو 3-4 unilateral**."
      - kind: reveal
        page: 287
        quote: "Lack of a pathognomonic clinical feature or laboratory test."
        prompt: "ليه التشخيص بالـ New York بيتأخر 8-11 سنة؟"
        answer: "مفيش علامة أو تحليل **pathognomonic**، والـ low back pain منتشر جدًا فبيتقال mechanical، والأهم إن الـ **radiographic sacroiliitis بياخد سنين** عشان يظهر. الحل: **MRI** و **ASAS criteria** جديدة."
      - kind: figure
        page: 288
        quote: "HLA-B27 Plus 2 or more other SpA features."
        title: "الـ ASAS axial: بابين"
        alt: "Entry box: back pain 3 months or more, onset before 45. Two arms below. Imaging arm: sacroiliitis on X-ray or MRI plus one or more SpA feature. Clinical arm: HLA-B27 plus two or more other SpA features. A list of SpA features sits underneath: inflammatory back pain, arthritis, enthesitis, uveitis, dactylitis, psoriasis, Crohn or UC, good NSAID response, family history, raised CRP, HLA-B27."
        caption: "يا **sacroiliitis في الصورة + feature واحد**، يا **HLA-B27 + 2 features**. الـ clinical arm ما محتاجش صورة خالص."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R17b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="40" y="10" width="250" height="40" rx="8" class="fg-acc"/>
            <text x="165" y="35" text-anchor="middle" class="t-b">Back pain ≥ 3 months</text>
            <path d="M110 50 L80 78" class="fg-arrow" marker-end="url(#R17b)"/>
            <path d="M220 50 L250 78" class="fg-arrow" marker-end="url(#R17b)"/>
            <rect x="10" y="80" width="150" height="70" rx="8" class="fg-box"/>
            <text x="20" y="100" class="t-b">Imaging arm</text>
            <text x="20" y="120" class="t-sm">Sacroiliitis (X-ray/MRI)</text>
            <text x="20" y="138" class="t-sm t-acc">+ ≥ 1 SpA feature</text>
            <rect x="170" y="80" width="150" height="70" rx="8" class="fg-box"/>
            <text x="180" y="100" class="t-b">Clinical arm</text>
            <text x="180" y="120" class="t-sm">HLA-B27</text>
            <text x="180" y="138" class="t-sm t-acc">+ ≥ 2 SpA features</text>
            <rect x="10" y="165" width="310" height="125" rx="8" class="fg-thin"/>
            <text x="20" y="185" class="t-b">SpA features</text>
            <text x="20" y="205" class="t-sm">IBP · arthritis · enthesitis · uveitis</text>
            <text x="20" y="225" class="t-sm">dactylitis · psoriasis · Crohn/UC</text>
            <text x="20" y="245" class="t-sm">good NSAID response · family history</text>
            <text x="20" y="265" class="t-sm">raised CRP · HLA-B27</text>
          </svg>
      - kind: explain
        page: 288
        title: "الـ inflammatory back pain والـ peripheral SpA"
        quote: "Age at onset < 45 yr, insidious onset, duration more than 3mths, pain at night, alternating buttock pains"
        text: |
          **IBP**: بداية ==قبل 45==، insidious، أكتر من 3 شهور، **وجع بالليل**، ==alternating buttock pain==، stiffness أكتر من نص ساعة، يتحسّن بالرياضة مش بالراحة، ويتحسّن بالـ NSAIDs.

          **ASAS peripheral**: arthritis أو enthesitis أو dactylitis، و:
          - **1 أو أكتر** من: psoriasis، IBD، infection قبلها، HLA-B27، uveitis، sacroiliitis في الصورة
          - **أو 2 أو أكتر** من: arthritis، enthesitis، dactylitis، IBP زمان، family history.
      - kind: explain
        page: 289
        title: "نقيس الـ activity إزاي؟"
        quote: "The cutoffs selected for ‗clinically important improvement‘ is a change of at least 1.1 units"
        text: |
          **BASDAI**: الـ gold standard، سهل. عيوبه: expert-driven، فيه أسئلة مكررة، و**الـ fibromyalgia بتبوّظ نتيجته**.

          **ASDAS**: composite (back pain، patient global، peripheral pain، morning stiffness، و **CRP**).
          - أقل من **1.3** inactive، لحد **2.1** moderate، لحد **3.5** high، أكتر = very high
          - تحسّن ==1.1== = clinically important، و ==2.0== = major

          عيوب الـ ASDAS: مش بيحسب الـ enthesitis والـ uveitis، ولا الـ function، ولا الـ MRI.
      - kind: update
        page: 289
        quote: "Inactive disease Moderate disease activity High disease activity Very high disease activity"
        text: "الـ ASAS سنة 2018 غيّرت اسم الخانة بين 1.3 و 2.1 لـ \"low disease activity\" بدل \"moderate\"، والأرقام زي ما هي. في الامتحان اكتب زي الكتاب."
        ref: "ASAS ASDAS cut-off update, Machado et al., Ann Rheum Dis 2018"
      - kind: case
        page: 289
        quote: "a change of at least 1.1 units, and a change of at least 2.0 units for major improvement."
        stem: "An AS patient starts a TNF inhibitor with ASDAS 4.1."
        steps:
          - question: "Activity band at baseline?"
            options: ["Very high", "High", "Moderate", "Inactive"]
            answer: 0
            why: "Above 3.5 = very high disease activity."
          - reveal: "After 12 weeks ASDAS is 2.9."
            question: "How is the response graded?"
            options: ["Clinically important improvement", "Major improvement", "No meaningful change", "Inactive disease"]
            answer: 0
            why: "A fall of 1.2: at least 1.1 but under 2.0."
      - kind: try
        items: [rheum.L17.051, rheum.L17.052, rheum.L17.058, rheum.L17.063, rheum.L17.072]
    recap:
      - "X-ray مش sensitive؛ AS sacroiliitis symmetrical bilateral، iliac side."
      - "Grades 0–IV: blurring، pseudo-widening، erosions شديدة، ankylosis."
      - "Squaring، bamboo spine (syndesmophytes رأسية)، railway. MRI early = bone marrow oedema."
      - "Modified NY: grade 2 bilateral أو 3–4 unilateral + clinical واحد. تأخير 8–11 سنة."
      - "ASAS axial: imaging + 1 feature، أو HLA-B27 + 2 features. IBP قبل 45."
