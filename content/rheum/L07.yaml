  # ---------- p117-118: MAC ----------
  - id: rheum.L07.044
    kind: card
    topic: mac
    front: Which components form the membrane attack complex, and how does it kill?
    back: C5b, C6, C7, C8 and C9 bind each other into a large transmembrane channel that disrupts the membrane, letting ions and small molecules diffuse freely, causing cell lysis.
    src: { page: 117, quote: "Terminal components of the complement cascade: C5b, C6, C7, C8, and C9 bind to each other and form a MAC (membrane attack complex). A large transmembrane channel is created that disrupts the membrane and enables ions and small molecules to diffuse freely and results in cell lysis." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.045
    kind: order
    topic: mac
    prompt: Order the assembly of the membrane attack complex.
    steps:
      - C5b binds the cell surface
      - C6 and C7 bind C5b
      - C8 binds and inserts into the membrane
      - Many C9 molecules polymerise (poly-C9) into a pore
      - Water and ions rush in and the cell lyses
    src: { page: 117, quote: "Terminal components of the complement cascade: C5b, C6, C7, C8, and C9 bind to each other and form a MAC (membrane attack complex). A large transmembrane channel is created that disrupts the membrane and enables ions and small molecules to diffuse freely and results in cell lysis." }
    status: unverified
  - id: rheum.L07.046
    kind: card
    topic: mac
    front: What forms the pore of the MAC (p118)?
    back: Poly-C9 inserted around C5b678 in the phospholipid bilayer, letting fluids rush in.
    src: { page: 118, quote: "Formation of MAC\nFigure: C9 joins C5b678 in the membrane and polymerises into Poly-C9: the Membrane attack complex.\nPoly-C9\nFigure: complement proteins form a pore in the phospholipid bilayer; inrushing fluids pass into the cytoplasm." }
    status: unverified
  - id: rheum.L07.047
    kind: mcq
    topic: mac
    stem: Which complement component polymerises to form the pore of the membrane attack complex?
    options: [C9, C5a, C3b, C1q, Factor B]
    answer: 0
    why:
      - "Correct: poly-C9 forms the channel on C5b678 (p118)."
      - C5a is a soluble anaphylatoxin.
      - C3b is an opsonin and part of the convertases.
      - C1q starts the classical pathway.
      - Factor B is part of the AP convertase.
    src: { page: 118, quote: "Formation of MAC\nFigure: C9 joins C5b678 in the membrane and polymerises into Poly-C9: the Membrane attack complex.\nPoly-C9\nFigure: complement proteins form a pore in the phospholipid bilayer; inrushing fluids pass into the cytoplasm." }
    status: unverified
  # ---------- p119-122: activities ----------
  - id: rheum.L07.048
    kind: enumerate
    topic: activities
    prompt: Enumerate the biological activities of complement.
    points:
      - Production of opsonins
      - Production of anaphylatoxins
      - Lysis of cells
      - Enhancing B cell response to antigens
      - Controlling formation and clearance of immune complexes
      - Removing dead and dying cells
    pass: 5
    hook: "الـ complement بيعمل 6 «يلزّق، يولّع، يخرم، يساعد الـ B، ينضّف الكومبلكسات، وينضّف الميتين»: opsonins، anaphylatoxins، cell lysis، B cell response، immune complexes، وremoving dead cells."
    src: { page: 119, quote: "Biological Activities of Complement\n  Production of Opsonins.\n  Production of Anaphylatoxins.\n  Lysis of Cells.\n  Enhancing B Cell Response to Antigens.\n  Controlling the Formation and Clearance of Immune Complexes.\n  Removing Dead and Dying Cells." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.049
    kind: card
    topic: activities
    front: Define opsonization.
    back: Coating a bacterium with antibody and/or a complement component (an opsonin), leading to enhanced phagocytosis.
    src: { page: 119, quote: "It is the coating of a bacterium, with antibody and/or a complement component (an opsonin that leads to enhanced phagocytosis by phagocytic cells). C3b – primary opsonin, also C4b. C3b coats immune complexes or antigen which are quickly taken up and destroyed by phagocytic cells (neutrophils, macrophages). Bound by complement receptors (CR1, CR3, CR4) on phagocytes." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.050
    kind: cloze
    topic: activities
    text: "{{c1::C3b}} is the primary opsonin (also C4b); it is bound by complement receptors {{c2::CR1, CR3 and CR4}} on phagocytes."
    src: { page: 119, quote: "It is the coating of a bacterium, with antibody and/or a complement component (an opsonin that leads to enhanced phagocytosis by phagocytic cells). C3b – primary opsonin, also C4b. C3b coats immune complexes or antigen which are quickly taken up and destroyed by phagocytic cells (neutrophils, macrophages). Bound by complement receptors (CR1, CR3, CR4) on phagocytes." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.051
    kind: card
    topic: activities
    front: How do anaphylatoxins enhance the response to a pathogen?
    back: C5a, C3a and C4a release histamine from mast cells and basophils, increasing vascular permeability and the influx of phagocytes and antibodies; they are chemotactic for neutrophils and induce smooth muscle contraction.
    src: { page: 120, quote: "Substances such as C5a, C3a, and C4a capable of releasing histamine from mast cells and basophils. This increases vascular permeability influx of phagocytic cells (macrophages) and antibodies, which enhance the response to the pathogens." }
    status: unverified
  - id: rheum.L07.052
    kind: card
    topic: activities
    front: How does complement lyse cells?
    back: By forming the MAC on the cell surface, the final stage of all three pathways.
    src: { page: 120, quote: "This is done by the formation of MAC on the surface of the cell, which is the final stage in all three pathways." }
    status: unverified
  - id: rheum.L07.053
    kind: card
    topic: activities
    front: How does complement help memory responses?
    back: C3d covalently bound to antigen in immune complexes is taken up by germinal-centre dendritic cells expressing CR2, giving a long-lasting deposit of antigen.
    src: { page: 120, quote: "Complement plays a part in the induction of memory responses: C3d covalently bound to antigen in immune complexes is taken up by germinal center dendritic cells that express CR2. This provides a long-lasting deposit of antigen." }
    status: unverified
  - id: rheum.L07.054
    kind: cloze
    topic: activities
    text: "Binding of {{c1::C3d}} on a microbial antigen to {{c2::CR2}} makes the B cell response more rapid, because it enhances uptake and processing of the antigen."
    src: { page: 120, quote: "Interactions of the complement fragment C3d and CR2 with a microbial antigen enhance the B cell response to the antigen i.e: B cell response is more rapid when the antigen is bound to C3d than when it is not (binding enhances uptake and processing of antigen)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.055
    kind: card
    topic: activities
    front: How does C3b help remove immune complexes?
    back: C3b deposited on large complexes disrupts the bonds holding them, breaking them into smaller pieces macrophages can clear. C3b also lets complexes bind CR1 on red cells, which carry them to the spleen for removal by macrophages.
    src: { page: 121, quote: "Deposition of C3b on large antigen-antibody complexes disrupt the bonds that hold the complex together. Thus, Complex breaks up into smaller pieces that can be cleared by macrophages. Deposition of C3b on IC allows also their binding to RBCs (which express the CR1 receptor on their surface). RBCs clear the complexes from the circulation through the spleen via phagocytic macrophages that destroy them." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.056
    kind: mcq
    topic: activities
    stem: Which cells carry C3b-coated immune complexes through the circulation to the spleen, and by which receptor?
    options: ["Red blood cells, CR1", "Neutrophils, CR3", "Dendritic cells, CR2", "Platelets, CR4"]
    answer: 0
    why:
      - "Correct: RBCs express CR1 and take complexes to splenic macrophages (p121)."
      - CR3 on phagocytes is an opsonin receptor; the lecture's carrier is the RBC.
      - CR2 on dendritic cells binds C3d for memory, not clearance from blood.
      - The lecture does not give platelets this role.
    src: { page: 121, quote: "Deposition of C3b on large antigen-antibody complexes disrupt the bonds that hold the complex together. Thus, Complex breaks up into smaller pieces that can be cleared by macrophages. Deposition of C3b on IC allows also their binding to RBCs (which express the CR1 receptor on their surface). RBCs clear the complexes from the circulation through the spleen via phagocytic macrophages that destroy them." }
    status: unverified
  - id: rheum.L07.057
    kind: card
    topic: activities
    front: How does complement clear necrotic cells and subcellular membranes?
    back: Subcellular membranes (mitochondria, endoplasmic reticulum) activate the classical and alternative pathways and are cleared like immune complexes; complement removes dead or dying cells and helps maintain homeostasis.
    src: { page: 122, quote: "Removal of Necrotic cells and Subcellular Membranes Necrotic cell-- Necrotic tissue is dead tissue. Subcellular membranes– mitochondria and endoplasmic reticulum - activate classical and alternative pathways and are cleared in the same manner. Complement cells removes dead or dying from the tissues and helps in maintaining homeostasis." }
    status: unverified
