        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [7, 1]]
      - kind: reveal
        page: 131
        prompt: "ليه الـ alcohol والصيام والـ INH بالذات بيزوّدوا خطر الـ acetaminophen؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ acetaminophen بيطلع منه metabolite سام (**NAPQI**) عن طريق الـ CYP، والـ **glutathione** هو اللي بيطفّيه.

          - **Alcohol** و **INH** بيزوّدوا الـ CYP2E1 → metabolite سام أكتر.
          - **Fasting** بيقلّل الـ glutathione → مفيش حد يطفّي.

          فالسكران الصايم = ولّاعة أكبر وطفاية فاضية.
      - kind: aside
        tone: tip
        page: 132
        text: |
          كلمة **slow acetylators** بتتكرر مع: **sulfonamide**، **rifampicin**، و **pyrazinamide**. ولاحظ إن الـ **INH** نفسه risk factor للـ rifampicin والـ pyrazinamide، يعني الـ anti-TB combination بيقوّي بعضه في الأذى.
      - kind: figure
