  - id: res.L17.lesson2
    title: "Alpha والـ critical value والـ P value: إزاي نحكم؟"
    hook: "قبل ما تبدأ البحث بتحط خط أحمر (α). بعد الحساب بتشوف رقمك عدّى الخط ولا لأ. بس كده."
    minutes: 9
    pages: [10, 19]
    topics: ["significance"]
    goals:
      - "تعرّف α والـ rejection region والـ critical value"
      - "تحسب الـ degrees of freedom"
      - "تاخد قرار رفض أو قبول الـ H0"
    status: unverified
    steps:
      - kind: explain
        page: 10
        quote: |
          Alpha : level of significance
          Rejection region
          Your decision before you conduct a research
        title: "Alpha: قرارك قبل البحث"
        text: |
          ==Alpha (α)== هي الـ **level of significance**، وهي اللي بتحدد الـ **rejection region**.

          ودي قرار بتاخده ==قبل ما تعمل البحث==، مش بعد ما تشوف النتيجة.
      - kind: figure
        page: 10
        quote: |
          Alpha : level of significance
          Rejection region
          Your decision before you conduct a research
          Critical Value
          Critical Value
          Rejection Region
          Nonrejection Region
          Rejection Region
          α /2
          α /2
        title: "منحنى الـ H0 ومنطقتين الرفض"
        alt: "A bell-shaped curve. Both tails beyond two vertical lines marked critical value are shaded as rejection regions, each labelled alpha over 2 equals 0.025. The middle area is the non-rejection region, 1 minus alpha equals 0.95."
        caption: "في الـ two-sided test الـ α بتتقسم نصين: ==α/2== في كل طرف بعد الـ **critical value**."
        svg: |
          <svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 160 C80 160 100 30 170 30 C240 30 260 160 320 160" class="fg-ink" fill="none"/>
            <path d="M20 160 C45 160 60 152 78 138 L78 160 Z" class="fg-dot-bad"/>
            <path d="M320 160 C295 160 280 152 262 138 L262 160 Z" class="fg-dot-bad"/>
            <line x1="78" y1="125" x2="78" y2="165" class="fg-arrow-bad"/>
            <line x1="262" y1="125" x2="262" y2="165" class="fg-arrow-bad"/>
            <line x1="10" y1="160" x2="330" y2="160" class="fg-arrow"/>
            <text x="38" y="104" text-anchor="middle" class="t-sm t-bad">critical</text>
            <text x="38" y="120" text-anchor="middle" class="t-sm t-bad">value</text>
            <text x="302" y="104" text-anchor="middle" class="t-sm t-bad">critical</text>
            <text x="302" y="120" text-anchor="middle" class="t-sm t-bad">value</text>
            <text x="170" y="110" text-anchor="middle" class="t-sm t-b">Non-rejection region</text>
            <text x="170" y="128" text-anchor="middle" class="t-sm">1 − α = 0.95</text>
            <text x="40" y="182" text-anchor="middle" class="t-sm t-bad">α/2 = 0.025</text>
            <text x="300" y="182" text-anchor="middle" class="t-sm t-bad">α/2 = 0.025</text>
            <text x="170" y="182" text-anchor="middle" class="t-sm t-mut">rejection regions in both tails</text>
          </svg>
      - kind: explain
        page: 13
        quote: |
          Level of significance
          Usually a small value for α is chosen as 0.01, 0.05. In medicine, α is 0.05 or smaller.
          Choosing a value for α of 0.05 means that we are 95% sure that we made the correct decision
        title: "بنختار α كام؟"
        text: |
          عادةً قيمة صغيرة: **0.01** أو **0.05**. في الطب الـ α = ==0.05 أو أقل==.

          والسلايد بتقول إن α = 0.05 معناها إننا ==95% متأكدين== إن قرارنا صح.
      - kind: update
        page: 13
        quote: "Choosing a value for α of 0.05 means that we are 95% sure that we made the correct decision"
        text: "بالدقة: choosing α = 0.05 معناه إننا قابلين type I error بنسبة 5%، يعني نرفض H0 وهي صح حوالي 5 مرات من 100؛ مش إن القرار ده بالذات صح بنسبة 95%. في الامتحان اكتب جملة السلايد (correct decision)."
        ref: "Altman, Practical Statistics for Medical Research, 1991"
      - kind: check
        page: 10
        quote: |
          Alpha : level of significance
          Rejection region
          Your decision before you conduct a research
        question: "When is the level of significance (α) decided?"
        options:
          - "Before conducting the research"
          - "After seeing the P value"
          - "After calculating the test value"
          - "Only if the result is not significant"
        answer: 0
        why:
          - "صح: «Your decision before you conduct a research»."
          - "كده إنت بتفصّل القاعدة على النتيجة."
          - "الـ test value بيتقارن بـ critical value الـ α حددتها قبل كده."
          - "الـ α ثابتة مهما كانت النتيجة."
      - kind: explain
        page: 14
        quote: |
          Degree of freedom
          Degree of freedom is the number of data values that are free to vary, in other terms, degree of freedom is a measure of the number of independent pieces of information on which the parameter estimate is based.
          D.f = n – 1.
          D.f.= n1 + n2 – 2.
          D.f. = (c-1) (r-1)
        title: "Degrees of freedom"
        text: |
          ==Degrees of freedom (df)== = عدد القيم اللي «حرة» تتغير، يعني عدد قطع المعلومات المستقلة اللي التقدير مبني عليها.

          - **n − 1**: عينة واحدة (one-sample أو paired t).
          - **n1 + n2 − 2**: مجموعتين مستقلتين (Student's t).
          - **(c − 1)(r − 1)**: جدول الـ chi-square.
      - kind: table
        page: 14
        quote: |
          D.f = n – 1.
          D.f.= n1 + n2 – 2.
          D.f. = (c-1) (r-1)
        title: "الـ df لكل test"
        columns: ["Test", "df"]
        rows: [["One-sample or paired t", "n − 1"], ["Student's t (two independent)", "n1 + n2 − 2"], ["Chi-square", "(c − 1)(r − 1)"]]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 15
        quote: |
          The critical value is the tabulated value of the test that indicates whether the results obtained by the appropriate statistical test lies in the non-rejection area of the curve according to the chosen value of (α).
          The critical value is compared to the value obtained by the test statistics.
        title: "الـ critical value"
        text: |
          الـ ==critical value== رقم **من الجدول** (tabulated)، بيقولك نتيجة الـ test واقعة في منطقة عدم الرفض ولا لأ حسب الـ α اللي اخترتها.

          وبنقارنه بالرقم اللي طلع من الحساب (الـ ==test statistic==).
