schema: batna.lesson/v1
lecture: hem.L11
lessons:
  # ------------------------------------------------------------------
  # Three topics on purpose (#828): the book's p176 puts the WHO list and
  # the IMWG CRAB criteria on the lecture's first page, before the
  # definition on p177; one lesson keeps them in book order.
  - id: hem.L11.lesson1
    title: "الـ plasma cell اللي اتجننت: إيه هو الـ myeloma؟"
    hook: "خلية وظيفتها تعمل antibodies تحميك، فجأة بقت تعمل نسخة واحدة بس من antibody ملهوش لازمة، وبتقرص زي الكابوريا."
    minutes: 9
    pages: [176, 177]
    topics: [classification, diagnosis, definition]
    goals:
      - "تعرف عيلة الـ plasma cell neoplasms"
      - "تحفظ الـ CRAB بالأرقام وتعرف كل حرف جاي منين"
      - "تعرّف الـ multiple myeloma وتعرف الـ paraprotein بيبقى إيه"
    status: unverified
    steps:
      - kind: explain
        remind: [hem.L11.001]
        page: 176
        quote: "Table 22.3 Plasma cell neoplasms.\nIgM Monoclonal gammopathy of undetermined significance (MGUS)\nNon-IgM monoclonal gammopathy of undetermined significance (MGUS)\nMonoclonal gammopathy of renal significance (MGRS)\nPlasma cell myeloma\nVariants:\nAsymptomatic (smouldering) myeloma\nNon-secretory myeloma\nPlasma cell leukaemia\nPlasmacytoma:\nSolitary plasmacytoma of bone\nExtraosseous (extramedullary) plasmacytoma\nMonoclonal immunoglobulin deposition diseases\nHeavy chain deposition diseases"
        title: "العيلة كلها في صفحة واحدة"
        text: |
          الـ WHO (2022) بيحط الـ **plasma cell neoplasms** في قايمة واحدة:
          - **MGUS** (IgM و non-IgM)، و **monoclonal gammopathy of renal significance (MGRS)**
          - ==Plasma cell myeloma== و variants: **smouldering**، **non-secretory**، **plasma cell leukaemia**
          - **Plasmacytoma**: solitary of bone و extraosseous
          - **Monoclonal immunoglobulin deposition diseases** و **heavy chain diseases**

          إزاي تقرا القايمة دي؟ التفسير المقبول (مش في الكتاب): كلهم **نفس الـ clone** من plasma cells، والفرق في سؤالين: الـ clone **كبير قد إيه** (MGUS صغير، myeloma كبير)، و**البروتين بيعمل إيه** (MGRS بيأذي الكلية وهو صغير، والـ deposition diseases بتترسب في الأنسجة). عشان كده هتلاقي في آخر المحاضرة «سلّم» من MGUS لحد الـ myeloma.
      - kind: figure
        page: 176
        quote: "Table 22.3 Plasma cell neoplasms."
        title: "Table 22.3 في الكتاب: الـ plasma cell neoplasms"
        image: { file: hem/L11-plasma-cell-neoplasms.webp, book: true }
        alt: "Book table printed as a picture, Table 22.3 Plasma cell neoplasms, in shaded groups. First: IgM and non-IgM monoclonal gammopathy of undetermined significance (MGUS). Second: monoclonal gammopathy of renal significance (MGRS); plasma cell myeloma with variants asymptomatic (smouldering) myeloma, non-secretory myeloma and plasma cell leukaemia. Third: plasmacytoma, solitary plasmacytoma of bone and extraosseous (extramedullary) plasmacytoma; monoclonal immunoglobulin deposition diseases; heavy chain diseases (mu, gamma and alpha). Footnote: Ig, immunoglobulin; source World Health Organization 2022."
        caption: |
          الجدول اللي الخطوة اللي فوق بتلخّصه، زي ما الكتاب طابعه. المجموعات مفصولة بالضل، من فوق لتحت:

          - **أول مجموعة**: الـ ==MGUS==، نوعين: **IgM** و **non-IgM**. ده الـ clone الصغير الهادي.
          - **التانية**: **MGRS** (الكلية بتتأذي من clone صغير)، وبعدين ==plasma cell myeloma== وتحته الـ **variants** بالمايل: smouldering، non-secretory، plasma cell leukaemia.
          - **التالتة**: الـ **plasmacytoma** (solitary of bone و extraosseous)، والـ **monoclonal immunoglobulin deposition diseases**، والـ **heavy chain diseases** (μ و γ و α).
          - **تحت خالص**: Ig = immunoglobulin، والمصدر **WHO 2022**.

          الترتيب ده هو نفسه ترتيب المحاضرة: هتبدأ بالـ myeloma، وتقارنه بالـ MGUS والـ smouldering، وتخلص بالـ variants والـ plasmacytoma.
      - kind: explain
        page: 177
        quote: "Clonal B-cell malignancy characterised by proliferation of plasma cells that accumulate mainly within bone marrow and usually secrete paraprotein mainly IgG (55%) or IgA (20%) and rarely IgD. The paraproteinaemia may be associated with excretion of light chains in the urine (Bence Jones protein), either kappa or lambda. In approximately 20% there is no paraproteinaemia, only light chains in the urine."
        title: "التعريف"
        text: |
          الـ ==multiple myeloma== هو **clonal B-cell malignancy**: plasma cells من clone واحد بتتكاثر وتتجمع أساسًا في الـ **bone marrow**.

          - معظمها بتفرز **paraprotein** (M protein): نفس الـ immunoglobulin بالظبط، نسخ ورا نسخ.
          - الأشهر **IgG (55%)**، بعده **IgA (20%)**، ونادرًا Immunoglobulin D (IgD).

          ليه «B-cell» وهي plasma cell؟ لأن الـ plasma cell هي **آخر محطة** في حياة الـ B cell، اللي اتخصصت تعمل antibody واحد. وليه الـ IgG الأشهر؟ التفسير المقبول (مش في الكتاب): لأنه أصلًا أكتر antibody الجسم بيعمله، فأغلب الـ plasma cells اللي ممكن تتعيّب هي اللي بتعمل IgG.
      - kind: explain
        page: 177
        quote: "Clonal B-cell malignancy characterised by proliferation of plasma cells that accumulate mainly within bone marrow and usually secrete paraprotein mainly IgG (55%) or IgA (20%) and rarely IgD. The paraproteinaemia may be associated with excretion of light chains in the urine (Bence Jones protein), either kappa or lambda. In approximately 20% there is no paraproteinaemia, only light chains in the urine."
        title: "Bence Jones"
        text: |
          الـ paraprotein ممكن يجي معاه **light chains** في البول، اسمها ==Bence Jones protein==، يا kappa يا lambda.

          وفي حوالي **20%** مفيش paraprotein في الدم خالص، بس light chains في البول. علشان كده لو عملت electrophoresis للسيرم بس، ممكن تفوّت الحالة.

          ليه الـ light chains بتظهر في البول والـ IgG الكامل لأ؟ التفسير المقبول (مش في الكتاب): الـ light chain **صغيرة** فبتعدّي من الـ glomerulus، والـ immunoglobulin الكامل كبير فبيفضل في الدم. ونفس الحجم الصغير ده هو اللي هيوصّلها للـ tubules ويسدّها (myeloma kidney).
      - kind: figure
        page: 177
        quote: "Clonal B-cell malignancy characterised by proliferation of plasma cells that accumulate mainly within bone marrow and usually secrete paraprotein mainly IgG (55%) or IgA (20%) and rarely IgD. The paraproteinaemia may be associated with excretion of light chains in the urine (Bence Jones protein), either kappa or lambda. In approximately 20% there is no paraproteinaemia, only light chains in the urine."
        title: "مين بيفرز إيه"
        alt: "A bar chart of myeloma paraprotein types: IgG 55 percent, IgA 20 percent, light chain only about 20 percent, IgD rare."
        caption: "IgG الأكتر بفارق كبير. الـ light-chain only قريب من الـ IgA."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="22" class="t-b">Paraprotein in myeloma</text>
            <rect x="110" y="40" width="200" height="28" class="fg-acc"/>
            <text x="10" y="59" class="t-sm t-b">IgG</text>
            <text x="270" y="59" class="t-sm t-b">55%</text>
            <rect x="110" y="80" width="73" height="28" class="fg-good"/>
            <text x="10" y="99" class="t-sm t-b">IgA</text>
            <text x="190" y="99" class="t-sm">20%</text>
            <rect x="110" y="120" width="73" height="28" class="fg-box"/>
            <text x="10" y="139" class="t-sm t-b">Light chain</text>
            <text x="190" y="139" class="t-sm">~20% (urine)</text>
            <rect x="110" y="160" width="8" height="28" class="fg-bad"/>
            <text x="10" y="179" class="t-sm t-b">IgD</text>
            <text x="125" y="179" class="t-sm">rare</text>
          </svg>
      - kind: check
        page: 177
        quote: "Clonal B-cell malignancy characterised by proliferation of plasma cells that accumulate mainly within bone marrow and usually secrete paraprotein mainly IgG (55%) or IgA (20%) and rarely IgD. The paraproteinaemia may be associated with excretion of light chains in the urine (Bence Jones protein), either kappa or lambda. In approximately 20% there is no paraproteinaemia, only light chains in the urine."
        question: "A patient with myeloma has a normal serum electrophoresis. What is the most likely explanation?"
        options: ["Light-chain myeloma: only Bence Jones protein in urine", "IgG myeloma, the commonest type", "Smoldering myeloma without end-organ damage", "MGUS with a small M band"]
        answer: 0
        why:
          - "صح: حوالي 20% مفيش paraprotein في الدم، بس light chains في البول."
          - "الـ IgG كان هيبان spike واضح في السيرم."
          - "الـ smoldering تعريفه M protein ≥ 3 g/dL، يعني لازم يبان."
          - "الـ monoclonal gammopathy of undetermined significance (MGUS) برضه تعريفه وجود paraprotein في السيرم."
      - kind: explain
        page: 177
        quote: "Myeloma is a disease of the elderly. Median age at presentation > 60 years. Rare under 40 years of age. Annual incidence is 4/100 000. Commoner in males and in black africans but less common in asians. Approximately 1% of all the malignant diseases and 10% of hematologic malignancies."
        title: "مين بيجيله؟"
        text: |
          - مرض ==كبار السن==: median age **> 60**، ونادر تحت 40.
          - **4/100 000** في السنة. أكتر في الرجالة والـ black Africans، وأقل في الآسيويين.
          - **1%** من كل السرطانات، و**10%** من الـ hematologic malignancies.
      - kind: mnemonic
        page: 176
        quote: "Updated IMWG Criteria for Diagnosis of Multiple Myeloma\n*C: Calcium elevation (> 11 mg/dL or > 1 mg/dL higher than ULN)\nR: Renal insufficiency (creatinine clearance < 40 mL/min or serum creatinine > 2 mg/dL)\nA: Anemia (Hb < 10 g/dL or 2 g/dL < normal)\nB: Bone disease (≥ 1 lytic lesions on skeletal radiography, CT, or PET/CT)"
        word: "CRAB"
        parts:
          - { key: "C", text: "Calcium > 11 mg/dL (or > 1 above upper limit of normal (ULN))" }
          - { key: "R", text: "Renal: creatinine clearance (CrCl) < 40 mL/min or creatinine > 2 mg/dL" }
          - { key: "A", text: "Anaemia: Hb < 10 g/dL or 2 g/dL below normal" }
          - { key: "B", text: "Bone: ≥ 1 lytic lesion on X-ray, computed tomography (CT) or PET/CT" }
        hook: "الكابوريا بتمشي بالعرض وبتقرص في العضم والكلية والدم."
      - kind: figure
        page: 176
        quote: "Updated IMWG Criteria for Diagnosis of Multiple Myeloma\n*C: Calcium elevation (> 11 mg/dL or > 1 mg/dL higher than ULN)\nR: Renal insufficiency (creatinine clearance < 40 mL/min or serum creatinine > 2 mg/dL)\nA: Anemia (Hb < 10 g/dL or 2 g/dL < normal)\nB: Bone disease (≥ 1 lytic lesions on skeletal radiography, CT, or PET/CT)"
        title: "الكابوريا بالأرقام"
        alt: "A crab drawn with four legs, each labelled: C calcium over 11 mg/dL, R creatinine clearance under 40 or creatinine over 2, A haemoglobin under 10, B one or more lytic lesions."
        caption: "تخيل الكابوريا ماسكة في كل رجل رقم: 11، 40 أو 2، 10، و lesion واحدة كفاية."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="165" cy="120" rx="70" ry="45" class="fg-bad"/>
            <circle cx="140" cy="88" r="7" class="fg-dot-bad"/>
            <circle cx="190" cy="88" r="7" class="fg-dot-bad"/>
            <text x="138" y="128" class="t-lg t-b">CRAB</text>
            <path d="M100 100L50 60" class="fg-ink"/>
            <path d="M230 100L280 60" class="fg-ink"/>
            <path d="M100 145L50 185" class="fg-ink"/>
            <path d="M230 145L280 185" class="fg-ink"/>
            <rect x="5" y="20" width="110" height="40" rx="6" class="fg-box"/>
            <text x="12" y="37" class="t-sm t-b">C: Ca &gt; 11</text>
            <text x="12" y="53" class="t-sm t-mut">or &gt; 1 above ULN</text>
            <rect x="215" y="20" width="110" height="40" rx="6" class="fg-box"/>
            <text x="222" y="37" class="t-sm t-b">R: CrCl &lt; 40</text>
            <text x="222" y="53" class="t-sm t-mut">or Cr &gt; 2 mg/dL</text>
            <rect x="5" y="185" width="110" height="40" rx="6" class="fg-box"/>
            <text x="12" y="202" class="t-sm t-b">A: Hb &lt; 10</text>
            <text x="12" y="218" class="t-sm t-mut">or 2 below normal</text>
            <rect x="215" y="185" width="110" height="40" rx="6" class="fg-box"/>
            <text x="222" y="202" class="t-sm t-b">B: ≥ 1 lytic</text>
            <text x="222" y="218" class="t-sm t-mut">X-ray, CT, PET/CT</text>
          </svg>
      - kind: explain
        page: 176
        quote: "Updated IMWG Criteria for Diagnosis of Multiple Myeloma\n*C: Calcium elevation (> 11 mg/dL or > 1 mg/dL higher than ULN)\nR: Renal insufficiency (creatinine clearance < 40 mL/min or serum creatinine > 2 mg/dL)\nA: Anemia (Hb < 10 g/dL or 2 g/dL < normal)\nB: Bone disease (≥ 1 lytic lesions on skeletal radiography, CT, or PET/CT)"
        title: "كل حرف في الكابوريا جاي منين؟"
        text: |
          الـ **CRAB** مش أربع حاجات منفصلة؛ هم أربع نتايج لنفس الـ clone. والربط ده بيتشرح في صفحات 178–179:
          - **B** (bone): الـ myeloma بيشغّل الـ **osteoclasts** تاكل العضم ← lytic lesions.
          - **C** (calcium): الـ calcium اللي في العضم المهدود بيطلع الدم ← ==> 11 mg/dL==.
          - **R** (renal): الـ **light chains** بتسدّ الـ tubules، والـ calcium العالي والـ dehydration بيكمّلوا.
          - **A** (anaemia): النخاع **اتملى** plasma cells فمفيش مكان للمصنع الطبيعي (bone marrow failure).

          يعني العضم بيجيب الـ C، والـ C بيساعد في الـ R. لو فهمت السلسلة دي مش هتنسى الحروف.
      - kind: check
        page: 176
        quote: "Updated IMWG Criteria for Diagnosis of Multiple Myeloma\n*C: Calcium elevation (> 11 mg/dL or > 1 mg/dL higher than ULN)\nR: Renal insufficiency (creatinine clearance < 40 mL/min or serum creatinine > 2 mg/dL)\nA: Anemia (Hb < 10 g/dL or 2 g/dL < normal)\nB: Bone disease (≥ 1 lytic lesions on skeletal radiography, CT, or PET/CT)"
        question: "Which result meets the IMWG 'R' (renal) criterion?"
        options: ["Serum creatinine 2.4 mg/dL", "Creatinine clearance 55 mL/min", "Proteinuria 300 mg/day with normal creatinine", "Serum creatinine 1.6 mg/dL"]
        answer: 0
        why:
          - "صح: الـ R = creatinine > 2 mg/dL أو clearance < 40 mL/min."
          - "الـ 55 فوق الـ 40."
          - "الـ proteinuria لوحدها مش الـ R."
          - "الـ 1.6 أقل من 2."
      - kind: try
        items: [hem.L11.001, hem.L11.004, hem.L11.005, hem.L11.009, hem.L11.011]
    recap:
      - "WHO 2022: MGUS، MGRS، myeloma (smouldering، non-secretory، PCL)، plasmacytoma، deposition diseases: نفس الـ clone، حجم وأثر مختلف."
      - "CRAB: Ca > 11، CrCl < 40 أو Cr > 2، Hb < 10، ≥ 1 lytic lesion. العضم يجيب الـ C، والـ C والـ light chains يجيبوا الـ R."
      - "MM = clonal plasma cells في النخاع، بتفرز paraprotein: IgG 55%، IgA 20%."
      - "20% light chains بس في البول (Bence Jones): صغيرة فبتعدّي الـ glomerulus."
      - "> 60 سنة، 4/100 000، 1% من السرطانات، 10% من الـ hematologic malignancies."
