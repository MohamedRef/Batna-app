schema: batna.lesson/v1
lecture: neph.L05
lessons:
  # ------------------------------------------------------------------
  - id: neph.L05.lesson1
    title: "الكرياتينين علي: يبقى AKI ولا لأ؟"
    hook: "زمان كان فيه أكتر من 30 تعريف للـ AKI. النهارده تعريف واحد بتلات أرقام، وتلات مراحل. خلّيهم في جيبك."
    minutes: 10
    pages: [98, 101]
    topics: [definition]
    goals:
      - "تعرّف الـ AKI بمعايير KDIGO وتعرف ليه الأرقام دي"
      - "تفرّق RIFLE و AKIN و KDIGO"
      - "تعرف عيوب التعريف وليه مش كل creatinine طالع وحش"
    status: unverified
    steps:
      - kind: explain
        page: 98
        title: "يعني إيه AKI؟"
        quote: "Acute kidney injury (AKI) is abrupt reduction in kidney functions as evidenced by changed in laboratory values; serum creatinine, blood urea nitrogen (BUN) and urine output."
        text: |
          الـ **acute kidney injury (AKI)** = نزول ==مفاجئ== في وظيفة الكلى، باين في الـ lab: **serum creatinine** و **blood urea nitrogen (BUN)** و **urine output**.

          سنة 1900 كان التشخيص **إكلينيكي** بس: oliguria، تعب، ترجيع، و gastrointestinal (GI) bleeding. وأول وصف حقيقي كان من **Bywaters** في عيانين الـ **crush injuries** في قصف لندن.

          التفسير المقبول (مش في الكتاب): الـ **crush injuries** بتعمل AKI **لأن** العضل المهروس بيطلّع myoglobin بيسد الـ tubules ويأذيها، وده نفس اللي هنشوفه في الـ rhabdomyolysis.
      - kind: explain
        page: 98
        quote: "Acute kidney injury (AKI) is abrupt reduction in kidney functions as"
        title: "ليه التعريف بقى بالـ lab؟"
        text: |
          الكتاب: الـ AKI = **abrupt reduction in kidney functions**. سنة 1900 الـ ARF كان بيتشخّص من **signs and symptoms** (oliguria، تعب، ترجيع، GI bleeding). النهارده التعريف بالـ **lab**: serum creatinine و BUN و urine output.

          التفسير المقبول (مش في الكتاب): الأعراض بتيجي **متأخر**، بعد ما الكلية تخسر كتير، **فـ** الكشف بالأعراض بيلاقي الحالات المتأخرة بس. والـ lab رقم، **يعني** دكتورين في مستشفيين يقدروا يحكموا على نفس العيان بنفس الطريقة، وده اللي الدراسات محتاجاه.
      - kind: explain
        remind: [neph.L05.006]
        page: 99
        title: "من 30 تعريف لتعريف واحد"
        quote: "Over 30 definitions of AKI/ ARF existed in the literature"
        text: |
          كان فيه **أكتر من 30 definition** للـ AKI/acute renal failure (ARF). بعدين:
          1. **Risk, Injury, Failure, Loss, End-stage (RIFLE)** من الـ ADQI (مايو 2004)
          2. كلمة **AKI** بدل ARF (سبتمبر 2004)
          3. **Acute Kidney Injury Network (AKIN)** وحّد المعايير
          4. ==Kidney Disease: Improving Global Outcomes (KDIGO)== جمع RIFLE و AKIN في تعريف واحد

          الخطوة الجاية بتشرح **ليه** التعريفات الكتير كانت مشكلة.
      - kind: figure
        page: 99
        quote: "Evolving Definition and Classification of AKI"
        title: "من 1941 لـ KDIGO: رسمة الكتاب"
        image: { file: neph/L05-definitions-timeline.webp, book: true }
        alt: "Book timeline 'Evolving definition and classification of AKI': a red arrow from 1941 to 2013. Below: 1941, ARF described by E.G. Bywaters in patients with crush injuries from the London bombings of the Second World War; May 2004, ADQI introduces the RIFLE staging for ARF; 2012, KDIGO unifies the definitions of AKI using RIFLE and AKIN as the basis. Above: September 2004, the term AKI is proposed; 2007, AKIN develops uniform standards for defining and classifying AKI."
        caption: |
          سهم أحمر من **1941** لـ **2013**، والأحداث فوقه وتحته:

          - **تحت شمال، 1941**: **ARF described**: Bywaters وصف الـ acute renal failure (ARF) في عيانين **crush injuries** من قصف لندن في الحرب العالمية التانية.
          - **تحت، مايو 2004**: الـ Acute Dialysis Quality Initiative (ADQI) عملت الـ **RIFLE staging**.
          - **فوق، سبتمبر 2004**: **AKI proposed**: اسم acute kidney injury (AKI) بدل ARF.
          - **فوق، 2007**: الـ **AKIN classification**.
          - **تحت يمين، 2012**: ==KDIGO unifies== التعريفات على أساس RIFLE و AKIN.

          يعني التعريف الواحد اللي بنستخدمه ==جه متأخر جدًا==، وقبله كل دراسة كانت بتقيس الـ AKI بمسطرة مختلفة.
      - kind: explain
        page: 99
        quote: "Over 30 definitions of AKI/ ARF existed in the literature"
        title: "ليه 30 تعريف كانوا مشكلة؟"
        text: |
          الكتاب: أكتر من **30 definition**، وبعدين **RIFLE** (2004) و **AKIN** (2007) و **KDIGO** (2012) اللي وحّد الاتنين.

          التفسير المقبول (مش في الكتاب): لو كل دراسة بتعرّف الـ AKI بطريقة، **مش هتعرف تقارن** نتايجها: دراسة تقول الـ mortality 10% وتانية 60% **لأن** العيانين أصلًا مختلفين. التعريف الواحد بيخلّي الأرقام تتجمع، والعلاج يتبني على evidence حقيقي. وكلمة **AKI** بدل **ARF** **عشان** تغطي الطيف كله، من ارتفاع بسيط لحد الـ failure.
      - kind: explain
        page: 100
        title: "التلات معايير (أي واحد يكفي)"
        quote: "Increase in serum creatinine (SCr) of at least 0.3 mg/dL within 48 hours"
        text: |
          - **serum creatinine** يعلى ==≥0.3 mg/dL في 48 ساعة==
          - أو يعلى **50%** عن الـ baseline في **7 أيام**
          - أو **urine output <0.5 mL/kg/h** لمدة ==6 ساعات== على الأقل

          الخطوة الجاية بتشرح **ليه** الأرقام دي بالذات.
      - kind: explain
        page: 100
        quote: "A urine output of less than 0.5 mL/kg/hour for at least 6 hours."
        title: "ليه الأرقام دي بالذات؟"
        text: |
          الكتاب: **0.3 mg/dL في 48 ساعة**، أو **50% في 7 أيام**، أو **UO < 0.5 mL/kg/h لـ 6 ساعات**.

          التفسير المقبول (مش في الكتاب):

          - **0.3 بس؟** العلاقة بين الـ creatinine والـ GFR **مش خطية**: في الكلية الطبيعية، ارتفاع صغير معناه إن الـ GFR وقع كتير. وارتفاع 0.3 لوحده بيرتبط بـ mortality أعلى.
          - **48 ساعة و 7 أيام:** الأول بيلقط الضربة السريعة، والتاني بيلقط اللي بيعلى بالراحة.
          - **البول:** بيتغيّر **قبل** الـ creatinine، **فـ** هو أبدر علامة، بس بيتأثر بالـ diuretics والجفاف.
          - **خد أسوأ معيار** في الـ staging **لأن** الخطر بيمشي ورا الأوحش.
      - kind: figure
        page: 100
        quote: "TABLE 28-1: RIFLE, AKIN, and KDIGO Classification Schemes for Acute Kidney Injurya"
        title: "مراحل KDIGO"
        alt: "Three stacked bars for KDIGO stages. Stage 1: creatinine up 0.3 or 1.5 to 1.9 times, urine under 0.5 for 6 to 12 hours. Stage 2: 2 to 2.9 times, under 0.5 for 12 hours or more. Stage 3: 3 times, or at least 4 mg/dL, or RRT; anuria for 12 hours or more."
        caption: "خد ==أسوأ معيار==: لو الكرياتينين stage 1 والبول stage 3، يبقى stage 3."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <text x="100" y="20" text-anchor="middle" class="t-sm t-mut">SCr</text>
            <text x="255" y="20" text-anchor="middle" class="t-sm t-mut">Urine output</text>
            <rect x="10" y="30" width="310" height="60" rx="8" class="fg-acc"/>
            <text x="20" y="54" class="t-sm t-b">Stage 1</text>
            <text x="20" y="76" class="t-sm">↑≥0.3 or ×1.5–1.9</text>
            <text x="310" y="76" text-anchor="end" class="t-sm">&lt;0.5 × 6–12 h</text>
            <rect x="10" y="100" width="310" height="60" rx="8" class="fg-bad"/>
            <text x="20" y="124" class="t-sm t-b">Stage 2</text>
            <text x="20" y="146" class="t-sm">×2–2.9</text>
            <text x="310" y="146" text-anchor="end" class="t-sm">&lt;0.5 × ≥12 h</text>
            <rect x="10" y="170" width="310" height="72" rx="8" class="fg-bad"/>
            <text x="20" y="194" class="t-sm t-b t-bad">Stage 3</text>
            <text x="20" y="214" class="t-sm">×3, or ≥4 mg/dL, or RRT</text>
            <text x="20" y="232" class="t-sm t-mut">(eGFR &lt;35 if &lt;18 y)</text>
            <text x="310" y="214" text-anchor="end" class="t-sm">Anuria ≥12 h</text>
          </svg>
      - kind: table
        page: 100
        quote: "TABLE 28-1: RIFLE, AKIN, and KDIGO Classification Schemes for Acute Kidney Injurya"
        title: "RIFLE في سطر لكل حرف"
        columns: [Category, SCr or GFR, Urine output]
        rows:
          - ["Risk", "×1.5 or GFR ↓>25%", "<0.5 × ≥6 h"]
          - ["Injury", "×2 or GFR ↓>50%", "<0.5 × ≥12 h"]
          - ["Failure", "×3, GFR ↓>75%, or ≥4 mg/dL", "Anuria ≥12 h"]
          - ["Loss", "RRT >4 weeks", "-"]
          - ["ESKD", "RRT >3 months", "-"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
      - kind: check
        page: 100
        quote: "TABLE 28-1: RIFLE, AKIN, and KDIGO Classification Schemes for Acute Kidney Injurya"
        question: "Creatinine 0.8 → 1.3 mg/dL in 36 hours; urine output 0.4 mL/kg/h for 14 hours. KDIGO stage?"
        options:
          - "Stage 1"
          - "Stage 2"
          - "Stage 3"
        answer: 1
        why:
          - "الكرياتينين لوحده stage 1 (↑0.5)، بس الـ urine output أسوأ."
          - "صح: <0.5 mL/kg/h لمدة ≥12 ساعة = stage 2، وبناخد الأسوأ."
          - "Stage 3 محتاج anuria ≥12 h أو ×3 أو ≥4 mg/dL أو renal replacement therapy (RRT)."
      - kind: explain
        page: 101
        title: "عيوب التعريف ده"
        quote: "Use of urine output as a sole criterium of AKI"
        text: |
          - ما بيفرّقش بين ==الأسباب== الكتير للـ AKI.
          - الاعتماد على الـ **urine output** لوحده.
          - الـ **serum creatinine (SCr) kinetics** متأخرة عن الـ glomerular filtration rate (GFR).
          - الـ **baseline** نفسه: أول قراءة في المستشفى ولا القديمة؟
          - التغييرات الصغيرة في الـ SCr ممكن تدي ==misdiagnosis== كتير.

          الخطوة الجاية بتشرح **السبب** ورا كل عيب.
      - kind: explain
        page: 101
        quote: "Problems with SCr kinetics reflecting GFR"
        title: "ليه التعريف ده ليه عيوب؟"
        text: |
          التفسير المقبول (مش في الكتاب) لعيوب الكتاب:

          - **Kinetics:** الـ creatinine بيتراكم بالراحة بعد ما الـ GFR يقع، **فـ** بيوصل متأخر يوم أو اتنين.
          - **Baseline:** لو مفيش تحليل قديم، أول قراءة في المستشفى ممكن تكون **أصلًا عالية**، **يعني** هتفوّت الـ AKI.
          - **البول لوحده:** الـ diuretic بيعلّيه والقسطرة المقفولة بتوطّيه، فمش دايمًا بيعكس الكلية.
          - **تغييرات صغيرة:** الـ lab نفسه بيتهز شوية، **فـ** 0.3 ممكن تكون noise.
          - **مش بيفرّق الأسباب:** نفس الـ stage ممكن تكون prerenal بترجع بالمحاليل أو ATN، والعلاج مختلف خالص.
      - kind: explain
        page: 101
        quote: "Acute elevations of serum creatinine: Implications are context-"
        title: "مش كل creatinine طالع وحش"
        text: |
          الكتاب: **acute elevations of serum creatinine: implications are context-dependent**. الرسمة بتحط في ناحية الـ **good**: الـ **decongestion in HF**، الـ **RAAS inhibitor**، والـ **intensive BP control**، وفي الناحية التانية الـ AKI الحقيقي.

          التفسير المقبول (مش في الكتاب): في الحالات "الكويسة" دي الـ creatinine بيعلى **لأن** الضغط جوه الـ glomerulus قل (مية أقل، efferent مفتوح، ضغط أوطى)، مش **لأن** الخلايا اتجرحت. والضغط الأقل ده هو نفسه اللي بيحمي الكلية على المدى الطويل. يعني لو وقّفت الـ ACEi أو الـ diuretic عشان الرقم علي شوية، ممكن تضيّع الفايدة.
      - kind: figure
        page: 101
        quote: "Acute elevations of serum creatinine: Implications are context-"
        title: "Good ولا Bad: رسمة الكتاب"
        image: { file: neph/L05-creatinine-context.webp, book: true }
        alt: "Book diagram split by a dashed blue line. Left, green 'Good': 'Induced AKI' from diuresis or decongestion in heart failure, RAAS inhibition, intensive blood pressure control and SGLT2 inhibitors leads to 'Outcomes better', with a thumbs-up. Right, red 'Bad': 'Spontaneous AKI' from untreated cardiorenal syndrome, hepatorenal syndrome, sepsis-induced and nephrotoxin-induced injury leads to 'Outcomes worse', with a frightened face."
        caption: |
          خط أزرق متقطع بيقسم الرسمة نصين:

          - **شمال، Good**: البيضاوي الأخضر **"Induced AKI"**: الـ creatinine علي بسبب علاج إحنا اديناه: diuresis/decongestion في الـ heart failure، renin–angiotensin–aldosterone system (**RAAS**) inhibition، intensive blood pressure control، و sodium–glucose cotransporter-2 inhibitor (**SGLT2i**). السهم بيوصل لـ **Outcomes Better** وجنبه إيد بتقول تمام.
          - **يمين، Bad**: البيضاوي الأحمر **"Spontaneous AKI"**: cardiorenal أو hepatorenal مش متعالج، sepsis، أو nephrotoxin. السهم بيوصل لـ **Outcomes Worse** وجنبه وش خايف.

          يعني نفس الطلعة في الـ creatinine ليها معنيين، و==السبب هو اللي بيحدد== هتكمّل العلاج ولا تدوّر على ==AKI حقيقي==.
      - kind: sort
        page: 101
        quote: "Acute elevations of serum creatinine: Implications are context-dependent"
        prompt: "الكرياتينين علي. صنّفه:"
        bins: ["Induced AKI (outcome better)", "Spontaneous AKI (outcome worse)"]
        cards:
          - { text: "Decongestion in heart failure", bin: 0 }
          - { text: "Starting an sodium–glucose cotransporter 2 (SGLT2) inhibitor", bin: 0 }
          - { text: "Intensive blood pressure (BP) control", bin: 0 }
          - { text: "Hepatorenal syndrome", bin: 1 }
          - { text: "Sepsis", bin: 1 }
          - { text: "Nephrotoxin", bin: 1 }
        why: "الـ **serum creatinine** اللي بيعلى من علاج مقصود (diuresis، renin–angiotensin–aldosterone system (RAAS) inhibition، blood pressure (BP) control، SGLT2 inhibitor (SGLT2i)) نتيجته أحسن. اللي بيعلى لوحده من cardiorenal syndrome (CRS) أو hepatorenal syndrome (HRS) مش متعالجين، أو sepsis، أو nephrotoxin، نتيجته أوحش."
      - kind: check
        page: 101
        quote: "Determination of baseline serum creatinine"
        question: "A patient with no previous labs has creatinine 2.1 mg/dL on admission and 2.2 the next day. Which KDIGO limitation does this show?"
        options:
          - "Determination of baseline serum creatinine"
          - "Use of urine output as a sole criterion"
          - "Many etiologies cause AKI"
          - "Overdiagnosis from intensive BP control"
        answer: 0
        why:
          - "صح: مفيش **baseline**، وأول قراءة ممكن تكون أصلًا AKI، فالتغيير الصغير بعدها مش هيوصل للمعيار."
          - "مفيش بول هنا؛ المشكلة في الرقم اللي نقارن بيه."
          - "دي حقيقة، بس المشكلة في السؤال هي نقطة البداية."
          - "مفيش حاجة عن الضغط في الحالة."
      - kind: try
        items: [neph.L05.007, neph.L05.001, neph.L05.002, neph.L05.003]
    recap:
      - "AKI: SCr ≥0.3 في 48 ساعة، أو 50% في 7 أيام، أو UO <0.5 mL/kg/h لـ 6 ساعات."
      - "خد أسوأ معيار للـ stage."
      - "العيوب: الأسباب، البول لوحده، kinetics، baseline، تغييرات صغيرة."
      - "الـ creatinine الطالع مع decongestion أو RAASi أو BP control ممكن يكون كويس."
    practice: [neph.L05.001, neph.L05.002, neph.L05.003, neph.L05.004, neph.L05.005, neph.L05.006, neph.L05.007, neph.L05.008, neph.L05.009, neph.L05.010, neph.L05.011, neph.L05.012, neph.L05.013, neph.L05.014, neph.L05.015, neph.L05.016, neph.L05.017, neph.L05.018, neph.L05.019, neph.L05.020, neph.L05.021, neph.L05.130, neph.L05.133, neph.L05.134]
  # ------------------------------------------------------------------
  - id: neph.L05.lesson5
    title: "AKD، الأرقام، و azotemia ولا uremia"
    hook: "الـ AKI مش حدث يوم واحد: ليه مرحلة بعده، وأرقامه في الـ ICU مخيفة، والأعراض ليها اسم."
    minutes: 8
    pages: [102, 103]
    topics: [epidemiology, etiology]
    goals:
      - "تعرف الـ AKI والـ AKD والـ CKD بالأيام وليه"
      - "تعرف أرقام الـ AKI وليه الـ ICU أخطر"
      - "تفرّق الـ azotemia من الـ uremia وتعرف العناوين التلاتة"
    status: unverified
    steps:
      - kind: figure
        page: 102
        quote: "The conceptual overlap among AKI, AKD and CKD (KDIGO AKI guideline 2012)"
        title: "من AKI لـ AKD لـ CKD: رسمة الكتاب"
        image: { file: neph/L05-aki-akd-ckd.webp, book: true }
        alt: "Book diagram. Top: a yellow circle AKD containing a smaller red circle AKI, both overlapping a blue circle CKD. Bottom, 'ADQI model': a red lightning bolt marks the injury at day 0 on an arrow of days post injury; AKI runs from 0 to 7 days with a mark at day 2 (48 h), AKD from 7 to 90 days and CKD from 90 days on, the axis running to 180."
        caption: |
          الرسمة جزئين:

          - **فوق، الدواير**: الدايرة الصفرا **acute kidney disease (AKD)** جواها دايرة حمرا أصغر **AKI**، والاتنين داخلين جوه الدايرة الزرقا **chronic kidney disease (CKD)**. يعني الـ AKI ==جزء من الـ AKD==، والاتنين ممكن ييجوا فوق CKD قديم.
          - **تحت، الـ Acute Dialysis Quality Initiative (ADQI) model**: البرق الأحمر = **Injury** عند يوم 0. الـ **AKI** من 0 لـ **7** أيام (وعلامة عند يوم 2 = **48h**)، الـ **AKD** من 7 لـ **90**، والـ **CKD** بعد ==90 يوم==.

          يعني ==الوقت من الإصابة== هو اللي بيسمّي المرحلة.
      - kind: explain
        page: 102
        quote: "The conceptual overlap among AKI, AKD and CKD (KDIGO AKI"
        title: "ليه فيه مرحلة اسمها AKD؟"
        text: |
          الكتاب (KDIGO 2012): **AKI** و **AKD** و **CKD** بيتداخلوا؛ الـ AKI لحد **7 أيام**، الـ AKD لحد **90 يوم**، وبعدها CKD.

          التفسير المقبول (مش في الكتاب): الكلية ما بتختارش بين "رجعت" و"باظت" في أسبوع. الفترة من 7 لـ 90 يوم هي اللي فيها الـ **repair** بيحصل، كويس أو وحش، **فـ** دي فرصتك تتابع وتمنع الـ nephrotoxins. ولو العيان عدّى 90 يوم ولسه الوظيفة ناقصة، **يبقى** دخل الـ CKD ولازم متابعة الـ CKD كلها.
      - kind: table
        page: 102
        quote: "Between 5% and 7% of all hospitalized patients develop AKI."
        title: "الأرقام"
        columns: [Group, Figure]
        rows:
          - ["Hospitalized patients with AKI", "5–7%"]
          - ["ICU patients with AKI", "20–60%"]
          - ["Non-ICU AKI mortality", "Up to 10%"]
          - ["ICU AKI mortality", "Over 50%"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 102
        quote: "Despite improvements in the medical care of individuals with AKI, mortality"
        title: "ليه الـ ICU AKI بيموّت أكتر؟"
        text: |
          الكتاب: **5–7%** من عيانين المستشفى، **20–60%** في الـ ICU، والـ mortality **فوق 50%** رغم التقدم. الـ **non-ICU** AKI الكلية غالبًا لوحدها والـ mortality **لحد 10%**، والـ **ICU** AKI غالبًا مع **sepsis** و multi-organ failure والـ mortality **فوق 50%**.

          التفسير المقبول (مش في الكتاب): العيان مش بيموت من الـ creatinine، بيموت من **المرض اللي ضرب الكلية** ومعاها أعضاء تانية. في الـ ICU الكلية واحدة من كذا عضو فاشل، **فـ** الـ AKI علامة على مرض شديد. وكمان الـ AKI نفسه بيزوّد الـ volume والـ K والـ acidosis، **يعني** بيصعّب علاج الباقي.
      - kind: reveal
        page: 102
        quote: "Despite improvements in the medical care of individuals with AKI, mortality"
        prompt: "عيانين الاتنين الـ creatinine بتاعهم 3 mg/dL: الأول في القسم بعد NSAIDs لوحدها، والتاني في الـ ICU بـ septic shock وعلى جهاز تنفس. مين خطره أعلى، وليه؟"
        answer: "التاني. الكتاب: الـ **non-ICU AKI** الكلية غالبًا العضو الوحيد الفاشل والـ mortality **لحد 10%**، والـ **ICU AKI** مع **sepsis** و multi-organ failure والـ mortality **فوق 50%**. **السبب** (مش في الكتاب): نفس الرقم، بس في التاني الـ AKI علامة على جسم كله بيفشل، والأول سببه معروف ويتشال."
      - kind: aside
        tone: tip
        page: 102
        quote: "Non-oliguric has better prognosis than oliguric one"
        text: |
          الـ **non-oliguric** AKI أحسن في الـ prognosis، وغالبًا في المستشفى بيكون من ==nephrotoxic agents==. ولما العيان الـ AKI يبقى في الـ intensive care unit (ICU) مع sepsis و multi-organ failure، الـ mortality بتعدّي 50%.
      - kind: explain
        page: 102
        quote: "Non-oliguric has better prognosis than oliguric one."
        title: "ليه الـ non-oliguric أحسن؟"
        text: |
          الكتاب: الـ **non-oliguric** غالبًا في المستشفى من **nephrotoxic agents**، والـ prognosis بتاعه **أحسن**. وفي ص 107: الـ **oliguria** poor prognostic indicator وبتصعّب الـ fluid balance.

          التفسير المقبول (مش في الكتاب): لو الكلية لسه بتطلّع بول، **يعني** فيه nephrons شغالة وضرر أقل. والبول ده بيطلّع مية و K، **فـ** الـ overload والـ hyperkalemia أقل، والعيان أسهل في المحاليل والأكل والأدوية.
      - kind: explain
        page: 103
        title: "Azotemia ولا uremia؟"
        quote: "Symptomatic AKI (eg MS changes, loss of appetite, tremors)"
        text: |
          - **Azotemia** = ==تراكم nitrogenous waste== بس.
          - **Uremia** = AKI ==بأعراض==: تغيّر في الوعي، فقدان شهية، و **tremors**.

          الخطوة الجاية بتشرح **ليه** الـ uremia بتعمل الأعراض دي.
      - kind: explain
        page: 103
        quote: "Accumulation of nitrogenous waste"
        title: "ليه الـ uremia بتعمل الأعراض دي؟"
        text: |
          الكتاب: **azotemia** = تراكم nitrogenous waste بس، و **uremia** = AKI **بأعراض** (تغيّر في الوعي، فقدان شهية، tremors).

          التفسير المقبول (مش في الكتاب): الـ urea نفسها مش هي السم الأساسي؛ هي **علامة** على مئات الـ toxins اللي الكلية كانت بتطلّعها. التوكسينات دي بتأثر على **المخ** (وعي، رعشة)، والمعدة (غثيان وقلة أكل)، والصفايح (نزيف). **عشان** كده الـ uremia أعراض، والـ azotemia رقم. والفرق مهم **لأن** الـ uremia بأعراض واحدة من indications الغسيل.
      - kind: check
        page: 103
        quote: "Accumulation of nitrogenous waste"
        question: "BUN is high, creatinine is high, and the patient is alert, eating well and has no tremor. What is the right term?"
        options:
          - "Azotemia"
          - "Uremia"
          - "Postrenal AKI"
          - "Acute kidney disease"
        answer: 0
        why:
          - "صح: **azotemia** = تراكم nitrogenous waste من غير أعراض."
          - "الـ uremia لازم يبقى فيه أعراض (وعي، شهية، tremors)."
          - "مفيش حاجة عن انسداد."
          - "الـ AKD بيتعرّف بالمدة (7–90 يوم)، مش بالأعراض."
      - kind: explain
        page: 103
        title: "تلات عناوين"
        quote: "Etiology of AKI\nPre-Renal: Hypoperfusion in which the integrity of renal parenchyma is preserved\nIntra-Renal: Intrinsic AKI. Involving renal parenchymal tissue\nPost-Renal: Obstructive AKI. Acute obstruction of urinary flow"
        text: |
          - **Prerenal:** ==hypoperfusion== والنسيج سليم.
          - **Intrinsic:** الضرر في ==renal parenchyma== نفسه.
          - **Postrenal:** ==acute obstruction== لسريان البول.

          التفسير المقبول (مش في الكتاب): التقسيم ده مفيد **لأن** كل عنوان ليه علاج: الـ prerenal محاليل، الـ postrenal فك الانسداد، والـ intrinsic حسب السبب. يعني أول سؤال في أي AKI: العنوان فين؟
      - kind: try
        items: [neph.L05.022, neph.L05.023, neph.L05.024, neph.L05.025]
    recap:
      - "AKI لحد 7 أيام، AKD لحد 90، وبعدها CKD."
      - "5–7% في المستشفى، 20–60% في الـ ICU؛ mortality فوق 50% في الـ ICU و لحد 10% برّاه."
      - "Non-oliguric أحسن. Azotemia = رقم، uremia = أعراض."
      - "التلات عناوين: prerenal، intrinsic، postrenal."
    practice: [neph.L05.022, neph.L05.023, neph.L05.024, neph.L05.025, neph.L05.026, neph.L05.027, neph.L05.028, neph.L05.029, neph.L05.030]
  # ------------------------------------------------------------------
  - id: neph.L05.lesson2
    title: "قبل، جوّه، ولا بعد الكلية؟"
    hook: "كل AKI ليه عنوان: قبل الكلية، جوّاها، أو بعدها. وكل عنوان ليه أسبابه ومضاعفاته."
    minutes: 10
    pages: [104, 106]
    topics: [etiology, complications]
    goals:
      - "تحط كل سبب في عنوانه وتعرف ليه"
      - "تفهم ليه NSAIDs و ACEi بيعملوا prerenal وليه الـ tubule بيموت"
      - "تعد المضاعفات وتعرف سبب كل واحدة"
    status: unverified
    steps:
      - kind: sort
        page: 104
        quote: "Classification of AKI (ARF)"
        prompt: "حط كل سبب AKI في عنوانه (classification):"
        bins: ["Prerenal", "Intrinsic", "Postrenal"]
        cards:
          - { text: "Cyclosporine", bin: 0 }
          - { text: "Liver failure", bin: 0 }
          - { text: "Rhabdomyolysis", bin: 1 }
          - { text: "Malignant hypertension", bin: 1 }
          - { text: "Amphotericin B", bin: 1 }
          - { text: "Benign prostatic hypertrophy", bin: 2 }
          - { text: "Obstruction of a solitary kidney", bin: 2 }
        why: "الـ cyclosporine بيبوّظ الـ autoregulation والـ liver failure بيقلل الـ effective volume، يبقوا prerenal. الـ rhabdo والـ amphotericin بيضربوا الـ tubules، والـ malignant hypertension (HT) بيضرب الأوعية، فالتلاتة intrinsic. والـ benign prostatic hyperplasia والـ solitary kidney المسدودة postrenal."
      - kind: explain
        page: 104
        quote: "Classification of AKI (ARF)"
        title: "الخريطة الكاملة للأسباب"
        text: |
          الرسمة في ص 104 (**Classification of AKI (ARF)**، من Harrison) بتقسم:

          - **Prerenal:** hypovolemia، cardiac output قليل، effective circulating volume قليل (CHF، liver failure)، و **impaired renal autoregulation** (NSAIDs، ACE-I/ARB، cyclosporine).
          - **Intrinsic:** **glomerular** (acute GN)، **tubules and interstitium** (ischemia، sepsis/infection، nephrotoxins)، و **vascular** (vasculitis، malignant hypertension، TTP-HUS).
          - **Postrenal:** bladder outlet obstruction، أو **bilateral** pelvoureteral obstruction، أو unilateral في **solitary functioning kidney**.

          التفسير المقبول (مش في الكتاب): الـ postrenal لازم يبقى **الاتنين** أو كلية وحيدة **لأن** كلية واحدة سليمة بتكفي تشيل الشغل، فانسداد ناحية واحدة مش بيعلّي الـ creatinine كتير.
      - kind: figure
        page: 104
        quote: "Classification of AKI (ARF)"
        title: "خريطة الأسباب: رسمة الكتاب"
        image: { file: neph/L05-classification-causes.webp, book: true }
        alt: "Book flowchart from Harrison: acute kidney injury splits into prerenal, intrinsic and postrenal. Prerenal: hypovolemia, decreased cardiac output, decreased effective circulating volume (congestive heart failure, liver failure), impaired renal autoregulation (NSAIDs, ACE inhibitor or ARB, cyclosporine). Intrinsic: glomerular (acute glomerulonephritis), tubules and interstitium, and vascular (vasculitis, malignant hypertension, TTP-HUS); tubules and interstitium lead to ischemia, sepsis or infection, and nephrotoxins (exogenous: iodinated contrast, aminoglycosides, cisplatin, amphotericin B; endogenous: hemolysis, rhabdomyolysis, myeloma, intratubular crystals). Postrenal: bladder outlet obstruction, bilateral pelvoureteral obstruction, or unilateral obstruction of a solitary functioning kidney."
        caption: |
          شجرة بخطوط حمرا، وكل عمود عنوان:

          - **شمال، Prerenal**: hypovolemia، cardiac output قليل، effective circulating volume قليل (heart failure، liver failure)، و impaired renal autoregulation (non-steroidal anti-inflammatory drugs، ACE inhibitor أو angiotensin receptor blocker، cyclosporine).
          - **النص، Intrinsic**: 3 صناديق: **Glomerular** (acute glomerulonephritis)، **Tubules and interstitium**، و **Vascular** (vasculitis، malignant hypertension، thrombotic thrombocytopenic purpura–hemolytic uremic syndrome). ومن الـ tubules نازل 3: **Ischemia**، **Sepsis/infection**، والصندوق الكبير **Nephrotoxins**: ==exogenous== (iodinated contrast، aminoglycosides، cisplatin، amphotericin B) و ==endogenous== (hemolysis، rhabdomyolysis، myeloma، intratubular crystals).
          - **يمين، Postrenal**: bladder outlet obstruction، أو bilateral pelvoureteral obstruction، أو unilateral على ==solitary functioning kidney==.

          يعني كل AKI ليه عنوان من التلاتة، والـ nephrotoxin يا حاجة دخلت من برّه يا حاجة الجسم نفسه طلّعها.
      - kind: figure
        page: 104
        quote: "Classification of AKI (ARF)"
        title: "الأسباب بالنسب: رسمة الكتاب"
        image: { file: neph/L05-classification-percent.webp, book: true }
        alt: "Book slide on a dark blue background: acute kidney injury splits into pre-renal 50%, intrinsic 40% and post-renal 10%; intrinsic splits into glomerular under 5%, interstitial 10%, tubular 85% and vascular under 5%."
        caption: |
          شجرة على خلفية زرقا، والنسب مكتوبة جنب الأسهم:

          - **الصف الأول**: **Pre-renal 50%**، **Intrinsic 40%**، **Post-renal 10%**.
          - **الصف التاني** (تحت الـ intrinsic بس): **Glomerular <5%**، **Interstitial 10%**، **Tubular 85%**، **Vascular <5%**.

          يعني ==نص الـ AKI prerenal==، وجوه الـ intrinsic ==الـ tubule هو الضحية== في أغلب الحالات (acute tubular necrosis). عشان كده أول سؤالين قدام أي AKI: فيه hypoperfusion؟ وفيه tubular necrosis؟
      - kind: explain
        page: 105
        title: "Prerenal"
        quote: "Prerenal AKI: is characterized by reduced blood delivery to the kidney"
        text: |
          الدم اللي واصل للكلية **قليل**:
          - **Volume depletion:** نزيف، جفاف، gastrointestinal (GI) losses.
          - **Effective volume ↓:** congestive heart failure (CHF)، myocardial infarction (MI)، hypotension، liver failure، sepsis.
          - **Functional:** ACE inhibitors (ACEIs)، **non-steroidal anti-inflammatory drugs (NSAIDs)**، angiotensin II receptor blockers (ARBs)، cyclosporine و tacrolimus.

          صلّح الـ volume بسرعة ترجع الكلية ==طبيعية==، لأن مفيش structural damage. لو اتأخرت، ممكن تتحول لـ intrinsic.
      - kind: explain
        page: 105
        quote: "ACEIS, NSAIDS, ARBS, Cyclosporine and tacrolimus"
        title: "ليه الأدوية دي بتعمل prerenal؟"
        text: |
          الكتاب بيحط **ACEIs، NSAIDs، ARBs، cyclosporine و tacrolimus** تحت الـ **functional** prerenal، ويقول إن تصليح الـ volume بسرعة **بيرجّع** الكلية **لأن** مفيش structural damage.

          التفسير المقبول (مش في الكتاب): لما الدم قليل، الكلية بتحافظ على الـ GFR بحيلتين: **توسّع الـ afferent** (بالـ prostaglandins) و**تضيّق الـ efferent** (بالـ angiotensin II).

          - الـ **NSAIDs** بتشيل الحيلة الأولى.
          - الـ **ACEi/ARB** بيشيلوا التانية.
          - الـ **cyclosporine/tacrolimus** بيضيّقوا الـ afferent مباشرة.

          **فـ** في عيان جاف، الدوا ده بيوقّع الـ GFR من غير ما الخلايا تموت. ولو الحال طوّل، الخلايا نفسها تبدأ تموت (ATN)، **عشان** كده الكتاب بيقول الـ prerenal ممكن يتحول intrinsic.
      - kind: check
        page: 105
        quote: "Functional"
        question: "A dehydrated man on ramipril (an ACEI) takes ibuprofen (an NSAID) for back pain and his creatinine doubles. Which mechanism fits the book's 'functional' prerenal AKI?"
        options:
          - "Loss of afferent dilatation and efferent constriction"
          - "Tubular cast obstruction"
          - "Bilateral ureteral obstruction"
          - "Immune-complex glomerulonephritis"
        answer: 0
        why:
          - "صح: الـ NSAID بيقفل توسيع الـ afferent، والـ ACEi بيقفل تضييق الـ efferent (التفسير مش في الكتاب). والكتاب بيحطهم الاتنين تحت الـ functional prerenal."
          - "الـ casts بتاعة الـ myoglobin أو الـ myeloma، مش الأدوية دي."
          - "مفيش انسداد في القصة."
          - "مفيش علامات GN."
      - kind: explain
        remind: [neph.L05.037, neph.L05.039]
        page: 105
        title: "Intrinsic"
        quote: "Acute tubular necrosis (ATN) (it accounts for 40% of all cases of AKI)"
        text: |
          - **Vascular:** renal thrombosis.
          - **Glomerular:** rapidly progressive glomerulonephritis (RPGN).
          - ==acute tubular necrosis (ATN)== (40% من كل الـ acute kidney injury (AKI)): ischemia (hypotension، sepsis)، endogenous toxins (uric acid، hemoglobin، myoglobin)، exogenous toxins (aminoglycosides، **contrast**، amphotericin B).
          - **Acute interstitial nephritis:** NSAIDs، infections.

          الخطوة الجاية بتشرح **ليه** الـ tubule بالذات بيموت.
      - kind: explain
        page: 105
        quote: "Acute tubular necrosis (ATN) (it accounts for 40% of all cases of AKI)"
        title: "ليه الـ tubule بالذات بيموت؟"
        text: |
          الكتاب: الـ **ATN** = **40%** من الـ AKI، من ischemia (hypotension، sepsis)، أو endogenous toxins (uric acid، hemoglobin، myoglobin)، أو exogenous (aminoglycosides، contrast، amphotericin B).

          التفسير المقبول (مش في الكتاب):

          - خلايا الـ tubule بتشتغل طول الوقت تمص صوديوم، **فـ** محتاجة أكسجين كتير، وأول ما الدم يقل بتموت.
          - الـ **aminoglycosides** بتتمص وتتراكم جوه خلايا الـ proximal tubule.
          - الـ **myoglobin** والـ **hemoglobin** بيعملوا casts بتسد الـ tubule، وبيأذوا الخلية مباشرة.
          - الـ **contrast** بيضيّق أوعية الكلية وكمان سام للخلية.
      - kind: explain
        remind: [neph.L05.041]
        page: 106
        title: "Postrenal"
        quote: "Postrenal AKI accounts for less than 10% of cases of AKI"
        text: |
          ==أقل من 10%== من الـ AKI:
          - **Bladder outlet:** benign prostatic hyperplasia، prostate cancer، **anticholinergic drug**.
          - **Ureteral:** malignancy.
          - **Pelvic / renal** obstruction.

          فكّها بسرعة ترجع الوظيفة.

          الخطوة الجاية بتشرح **ليه** بيرجع لو لحقته.
      - kind: explain
        page: 106
        quote: "Postrenal AKI accounts for less than 10% of cases of AKI"
        title: "ليه الـ postrenal بيرجع لو لحقته؟"
        text: |
          الكتاب: الـ postrenal **أقل من 10%**، أسبابه BPH، prostate cancer، **anticholinergic drugs**، ureteral malignancy، و pelvic/renal obstruction، و**الفك السريع** بيرجّع الوظيفة.

          التفسير المقبول (مش في الكتاب): البول المحبوس بيرجّع ضغط على الـ tubule والـ glomerulus، **فـ** الفلترة تقف، بس الخلايا لسه عايشة. لو فكّيت بدري الضغط ينزل والفلترة ترجع. لو طوّل، الضغط والـ ischemia بيعملوا fibrosis. والـ **anticholinergics** بترخّي عضلة المثانة **فـ** البول يتحبس، خصوصًا في راجل كبير عنده بروستاتا.
      - kind: table
        page: 106
        quote: "Uremia Hypervolemia and Hypovolemia Hyponatremia Hyperkalemia"
        title: "المضاعفات: uremia والـ fluid والـ electrolytes"
        columns: [Group, Complications]
        rows:
          - ["Toxins", "Uremia"]
          - ["Fluid", "Hypervolemia and hypovolemia"]
          - ["Electrolytes", "Hyponatremia, hyperkalemia, hyperphosphatemia and hypocalcemia"]
          - ["Others", "Bleeding, infections, cardiac complications, malnutrition"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 106
        quote: "Hyperphosphatemia and Hypocalcemia"
        title: "ليه كل مضاعفة بتحصل؟"
        text: |
          الكتاب: uremia، hypervolemia و hypovolemia، hyponatremia، **hyperkalemia**، hyperphosphatemia و hypocalcemia، bleeding، infections، cardiac complications، malnutrition.

          التفسير المقبول (مش في الكتاب):

          - **Hyperkalemia:** الكلية هي اللي بتطلّع الـ K، والـ acidosis بيطلّعه من الخلايا كمان.
          - **Hyperphosphatemia ← hypocalcemia:** الـ phosphate مش بيطلع، وبيمسك الكالسيوم ويرسّبه.
          - **Hyponatremia:** الكلية مش بتطلّع مية حرة، **فـ** الصوديوم يتخفف.
          - **Bleeding:** الـ uremic toxins بتبوّظ شغل الصفايح.
          - **Infections:** المناعة بتضعف مع الـ uremia، وكمان القساطر.
          - **Malnutrition:** الجسم في catabolism، والعيان مش بياكل.
      - kind: try
        items: [neph.L05.031, neph.L05.032, neph.L05.033, neph.L05.034]
    recap:
      - "Prerenal: volume، effective volume، functional (NSAIDs، ACEi/ARB، cyclosporine)؛ بيرجع لو لحقته."
      - "Intrinsic: vascular، glomerular، ATN (40%)، AIN."
      - "Postrenal < 10%: لازم الاتنين أو كلية وحيدة؛ فكّه بسرعة."
      - "المضاعفات: uremia، fluid، Na، K، PO4/Ca، bleeding، infection، القلب، malnutrition."
    practice: [neph.L05.031, neph.L05.032, neph.L05.033, neph.L05.034, neph.L05.035, neph.L05.036, neph.L05.037, neph.L05.038, neph.L05.138, neph.L05.039, neph.L05.040, neph.L05.041, neph.L05.042, neph.L05.043, neph.L05.044, neph.L05.045]
