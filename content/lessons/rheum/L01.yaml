            <text x="128" y="280" class="t-b">Osteoclast</text>
            <text x="15" y="312" class="t-sm t-mut">red = promote, green = block</text>
          </svg>
      - kind: explain
        page: 19
        quote: "Cytokines and the osteoclast (figure)\nTH17 cells:\n  IL-17, IL-1, TNF → RANKL, M-CSF → Osteoclast precursor cell → Osteoclast\nSynovial fibroblast:\n  IL-7, RANKL, M-CSF → Osteoclast precursor cell → Osteoclast\nTH1 cells:\n  RANKL, M-CSF (promote)\n  IFNγ, GM-CSF (inhibit), induced by IL-18\nTH2 cells:\n  IL-4, IL-10 (inhibit)"
        title: "ليه العضم بيتآكل في الـ RA؟"
        text: |
          الرسمة في صفحة 19 بتقول مين بيدفع الـ **osteoclast precursor** يبقى osteoclast، ومين بيوقفه:

          - **بيدفعوا**: الـ TH17 (IL-17 و IL-1 و TNF) والـ synovial fibroblast (IL-7). كلهم بيزوّدوا ==RANKL== و M-CSF.
          - **بيوقفوا**: TH2 (IL-4 و IL-10)، و TH1 بـ IFN-γ و GM-CSF (اللي IL-18 بيحفّزهم).

          التفسير المقبول (مش في الكتاب): الـ osteoclast هو الخلية الوحيدة اللي **بتاكل العضم**، و RANKL هو "الإذن" اللي بيخليها تتكوّن. فلما الـ TH17 والـ fibroblasts يزوّدوه، العضم جنب المفصل بيتآكل، وده اللي بيظهر في الأشعة كـ **erosions**.
      - kind: explain
        page: 21
        quote: "The synovial milieu contains IL-12, IL-23, IL-6 and TGFβ, and as such promotes the differentiation of TH1 and TH17 cells."
        title: "جوه المفصل"
        text: |
          الـ synovium مليان IL-12 و IL-23 و IL-6 و TGF-β ← بيعمل **T helper 1 (TH1)** و **T helper 17 (TH17)**.

          الـ ==Tregs== موجودة بس **مش شغالة كويس**.

          الـ activated T cells بتأذي بـ:
          - cytokines تنشّط الـ leukocytes والـ mesenchymal cells.
          - مساعدة الـ B cells.
          - cytotoxicity (CD8+).
          - **direct contact** مع الـ macrophages والـ fibroblasts والـ endothelium.
      - kind: check
        page: 21
        quote: "Regulatory T cells, although present, may not exhibit optimal regulatory activity."
        question: "What is true of regulatory T cells in the RA synovium?"
        options: ["Present but may not regulate optimally", "Completely absent", "Overactive, causing joint damage", "Replaced by Th2 cells"]
        answer: 0
        why:
          - "صح: موجودين بس الشغل مش مظبوط."
          - "الكتاب بيقول although present، يعني موجودين."
          - "المشكلة إنهم أضعف من اللازم مش أقوى."
          - "الـ milieu بيدفع ناحية Th1 و Th17، مش Th2."
      - kind: explain
        page: 21
        quote: "CLASSIFICATIONS OF CYTOKINES\nACCORDING TO DIVISION OF LABOR\n  T- helper 1 type of cytokines e.g IL-2, IL-12, TNF-α, IFN-γ\n  T- helper 2 type of cytokines e.g IL-3, IL-4, IL-5, IL-13\n  T- helper 3 type of cytokines e.g IL-10, TGF-β\nSTRUCTURAL CLASSIFICATION OF CYTOKINES\n  IL-2/IL-4 family e.g IL-2, IL-4, IL-5, granulocyte-macrophage colony stimulating factor\n  TNF family TNF-α, lymphotoxin-α, LT-β, FasL, CD40L, TRAIL, LIGHT\n  IL-1 family IL-1α, IL-1β, IL-1, IL-18\nSTRUCTURAL CLASSIFICATION BASED ON RECEPTORS\n  Heamatopoitin family receptors (class I receptors): Growth hormone, Prolactin, Erythropoitin, Interleukin (2, 3, 4, 5, 6, 7, 9, 11, 12, 13, 15, 16, 17, 25), Granulocyte macrophage colony stimulating factor, Granulocyte colony stimulating factor\n  Interferon/ IL-10family receptors (class II receptors): Type I interferons (IFNα, β, δ, κ, ω, I, IL-28A, IL-28), Interferons γ, Interleukin (10, 19, 20, 22, 24)\nRECEPTOR CLASSIFICATION BASED ON POSITION OF CYSTEINE RESIDUES NEAR THE N-TERMINUS\n  CC\n  CXC\n  C\n  CX3C\nFUNCTIONAL CLASSIFICATION\n  Those produced after inflammatory stimuli (inflammatory chemokines)\n  Those produced consecutively in tissues (homing chemokines)"
        title: "أربع طرق تصنّف بيها، وكل طريقة بتسأل سؤال"
        text: |
          صفحة 21 فيها كذا تصنيف. افتكر كل واحد بالسؤال اللي بيجاوبه:

          - **Division of labor**: مين بيعمله؟ TH1 و TH2 و TH3.
          - **Structural**: شكله إيه؟ IL-2/IL-4 family، TNF family، IL-1 family.
          - **Based on receptors**: بيمسك أنهي receptor؟ **class I** (hematopoietin: GH و prolactin و EPO وكتير من الـ ILs و GM-CSF و G-CSF) و **class II** (interferons و IL-10 family).
          - **Cysteine residues near the N-terminus** (للـ chemokines): CC و CXC و C و CX3C.
          - **Functional** (للـ chemokines): ==inflammatory chemokines== بتطلع بعد منبّه التهابي، و **homing chemokines** بتطلع على طول في الأنسجة.

          التفسير المقبول (مش في الكتاب) لفرق آخر نوعين: الـ inflammatory بتنادي الخلايا للالتهاب لما يحصل، والـ homing بترجّع الخلايا لبيوتها (زي الـ lymph node) طول الوقت.
