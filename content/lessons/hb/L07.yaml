      - kind: explain
        page: 123
        quote: "Screen for HBsAg and anti-HBc prior to initiation of IS; HBsAg+, +HBcAb (CHB): Start antiviral PPX"
        title: "قبل أي immunosuppression"
        text: |
          الـ immunosuppression بيشيل الفرامل اللي المناعة حاطاها على الفيروس. علشان كده: **screen for HBsAg and anti-HBc** قبل ما تبدأ.

          النتيجة بتقسم العيانين 3 مجموعات:

          - **HBsAg+ (CHB)**: start antiviral prophylaxis.
          - **HBsAg−, anti-HBc+ (exposed)**: القرار حسب قوة الـ IS (تحت).
          - **HBsAg−, anti-HBc−**: لو الـ anti-HBs موجب فهو vaccinated. لو سالب يبقى naïve، و vaccinate if indicated.

          والـ exposed بالتفصيل:

          - ==High-risk IS==: يعني B cell-depleting therapy أو SCT. ياخد antiviral prophylaxis.
          - ==Moderate-risk IS==: monitor every 1–3 months بالـ ALT والـ HBV DNA والـ HBsAg، و treat if reactivation. والرسمة كمان فيها سهم من الـ moderate risk لـ start antiviral PPX.
