      - kind: explain
        page: 274
        title: "الـ JAK-STAT في 4 خطوات"
        quote: "JAK inhibitors are small molecules that bind to JAKs preventing ATP binding and subsequent intracellular signalling"
        text: |
          1. الـ cytokine يمسك الـ receptor.
          2. الـ **JAK** يتفعّل ويتعمله phosphorylation، ويعمل phosphorylation للـ receptor.
          3. الـ **STAT** يتعمله phosphorylation ويبقى dimer.
          4. الـ dimer يدخل النواة ويشغّل genes.

          الـ ==JAK inhibitors== جزيئات صغيرة بتقعد مكان الـ **ATP** في الـ JAK، فالسلسلة كلها تقف. 4 JAKs: **JAK1، JAK2، JAK3، TYK2**.

          ميزتهم: **oral**، مش protein فمفيش neutralizing antibodies ولا allergy، وبيوقفوا cytokines كتير مرّة واحدة.
