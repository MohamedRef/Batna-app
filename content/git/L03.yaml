    topic: globus-dysphagia
    front: In the dysphagia algorithm, what is done for proximal dysphagia after a negative motility study?
    back: Video swallow to exclude a cricopharyngeal bar, Zenker's diverticulum and so on.
    src: { page: 99, quote: "Diagnostic Algorithm for Dysphagia.\nDysphagia:\n  Rule out non-esophageal causes as indicated\n  EGD ± barium swallow\nEGD ± barium swallow:\n  Intrinsic structural lesions (stricture, web, tumor, and so on)\n  Negative: Associated reflux symptoms?\nAssociated reflux symptoms?\n  Yes: PPI trial: Response: GERD, titrate PPI; No response: Motility study\n  No: Motility study\nMotility study:\n  Achalasia or DES or absent peristalsis\n  Negative: Proximal dysphagia?\nProximal dysphagia?\n  Yes: Video swallow to exclude cricopharyngeal bar, Zenker's, and so on\n  No: Functional dysphagia" }
    status: unverified
  - id: git.L03.102
    kind: enumerate
    topic: globus-dysphagia
    prompt: How is functional dysphagia treated?
    points:
      - Reassurance, careful chewing and avoiding trigger foods
      - Low-dose trazodone, TCAs or SSRIs
      - Empiric dilation with 14-18 mm dilators
      - Botulinum toxin for a localized non-achalasia motility disorder with slow bolus transit (temporary benefit)
    pass: 3
    hook: "علاج functional dysphagia سلّمة من 4: طمأنة + مضغ كويس + بعد عن الأكل اللي بيهيّج، low-dose trazodone أو TCAs أو SSRIs، empiric dilation بـ 14 لـ 18 mm، وBotox لو في non-achalasia motility disorder موضعي مع bolus transit بطيء (فايدة مؤقتة)."
    src: { page: 99, quote: "Empiric dilation with 14–18 mm dilators has been described in patients with nonobstructive dysphagia with relatively good outcomes ." }
    status: unverified
  - id: git.L03.103
    kind: mcq
    topic: globus-dysphagia
    stem: >-
      A 40-year-old woman feels a lump in her throat between meals. It eases when she eats and she has no
      dysphagia or pain. ENT laryngoscopy and EGD are normal; no inlet patch is seen. What is the diagnosis?
    options:
      - Globus
      - Functional dysphagia
      - Zenker's diverticulum
      - Rumination syndrome
      - Achalasia
    answer: 0
    why:
      - "Correct: a non-painful lump between meals, better with swallowing, no structural lesion and no dysphagia."
      - Functional dysphagia is food sticking on swallowing, which she does not have.
      - Zenker's causes dysphagia and regurgitation of undigested food.
      - Rumination is regurgitation of recently eaten food.
      - Achalasia causes dysphagia and would be excluded by manometry.
    src: { page: 97, quote: "A4. Globus\nDiagnostic criteria* - Must include all of the following:\n  1. Persistent or intermittent, non-painful sensation of a lump or foreign body in the throat with no structural lesion identified on physical examination, laryngoscopy, or endoscopy\n    a. Occurrence of the sensation between meals\n    b. Absence of dysphagia or odynophagia\n    c. Absence of a gastric inlet patch in the proximal esophagus\n  2. Absence of evidence that gastroesophageal reflux or eosinophilic esophagitis is the cause of the symptom\n  3. Absence of major esophageal motor disorders**\n*Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis with a frequency of at least once a week.\n**Achalasia/EGJ outflow obstruction, diffuse esophageal spasm, jackhammer esophagus, absent peristalsis" }
    status: unverified
