# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: new
  ar_eg: «＋ ملاحظة» تحت أي كارت أو سؤال أو خطوة في درس أو صفحة كتاب، وكل ملاحظاتك في صفحة واحدة «ملاحظاتك» مترتبة بالمادة والصفحة وفيها بحث، وبتتزامن بين أجهزتك
  en: Write a note on any card, question, lesson step or book page; all your notes in one searchable list by course and page, synced across your devices
- kind: new
  ar_eg: لو غلطت في حاجة، الدرس بيكتبلك «راجعها تاني» تحت الخطوة اللي من نفس الصفحة، وصفحة الكتاب بتعرض الحاجات دي وزرار تذاكرها، والعلامة بتمشي أول ما تجاوب صح (تقفلها من الإعدادات › المذاكرة)
  en: Missed facts mark their book page: lesson steps on that page say «راجعها تاني», the page sheet lists them with a button to study them, and a right answer clears the mark
- kind: new
  ar_eg: «روح لصفحة» (أو Ctrl/⌘ + G): اختار المادة واكتب رقم الصفحة اللي فاتحها في كتابها، أو المحاضرة ورقم السلايد في الريسيرش، وتفتحلك صفحتها في باطنة. والبحث السريع بيفهم «ص 30» كمان
  en: Go to page (Ctrl/⌘ + G): pick the course and type a printed page (or a research lecture and slide) to open that page's sheet; quick search understands «ص 30» too
