lessons:
  # ------------------------------------------------------------------
  - id: dm.L12.lesson1
    title: "الكلية والسكر: إزاي تعرف الـ DKD"
    hook: "السكر هو السبب الأول للـ renal failure. نعرف شكله المعتاد، والشكل اللي من غير albuminuria، وإمتى نشك في حاجة تانية."
    minutes: 8
    pages: [142, 143]
    topics: [ckd-burden, dkd-diagnosis]
    goals:
      - "تعرّف الـ CKD وتعرف ليه السكر مع الكلية صعب"
      - "تعرف شكل الـ DKD المعتاد وليه هو كده"
      - "تعرّف الـ non-albuminuric DKD (سؤال كتاب) وتعرف سببه"
    status: unverified
    steps:
      - kind: explain
        page: 142
        title: "الحجم الحقيقي للمشكلة"
        quote: "CKD, regardless of its underlying etiology, is defined as either kidney damage or decreased kidney function for ≥ 3 months."
        text: |
          الـ **chronic kidney disease (CKD)** = kidney damage أو decreased kidney function لمدة ==≥ 3 months==، أيًا كان السبب.

          - ==Diabetes is the most common cause== of renal failure.
          - في أمريكا الـ end-stage renal disease (ESRD) عند الـ diabetics **اتضاعف 3 مرات** بين 1989 و1998، والـ hypertension فضل ثابت تقريبًا.
          - في الـ Native Americans السكر الأول، وفي الـ African Americans الضغط الأول.

          وليه صعب؟ glycemic control مش كويس، وcomorbidities، والأقراص لازم تتختار بحذر.
      - kind: explain
        page: 143
        title: "ليه السكر مع الكلية الضعيفة صعب؟"
        quote: "Consideration & caution in choosing Oral anti diabetics due to:\n        2. Problem in Insulin Metabolism\n        3. Reduce Gluconeogenesis\n        4. Incidence of Hypoglycemia"
        text: |
          الكتاب بيدّيك تلات أسباب للحذر في اختيار الأقراص، وكلهم بيصبّوا في نتيجة واحدة: ==hypoglycemia== أكتر. التفسير المقبول (مش في الكتاب) لكل واحد:

          - **Problem in insulin metabolism**: الكلية بتكسّر جزء من الـ insulin، فلما تضعف الـ insulin (اللي الجسم بيطلّعه أو اللي بتحقنه) بيفضل في الدم أطول.
          - **Reduced gluconeogenesis**: الكلية نفسها بتعمل glucose وقت الصيام، فلما تتعب بيقل المصدر اللي بينقذ العيان لما السكر يوطى.
          - **Incidence of hypoglycemia**: نتيجة الاتنين اللي فوق، وزيادة عليهم إن أقراص كتير (أو الـ metabolites بتاعتها) بتخرج في البول، فبتتراكم.

          وكمان الكتاب بيقول المريض ده محتاج **dietary restrictions** و**teamwork** بين الدكاترة، لأن الأكل والضغط والدهون والكلى كلهم بيتعالجوا في نفس الوقت.
      - kind: check
        page: 143
        quote: "2. Problem in Insulin Metabolism\n3. Reduce Gluconeogenesis\n4. Incidence of Hypoglycemia"
        question: "Why must oral antidiabetics be chosen carefully in renal impairment?"
        options:
          - "Insulin metabolism changes, gluconeogenesis falls, hypoglycemia rises"
          - "The kidney makes more insulin in CKD"
          - "CKD raises gluconeogenesis and causes hyperglycemia only"
          - "Oral drugs stop working when eGFR falls"
        answer: 0
        why:
          - "صح: التلاتة بتوع الكتاب (p143)، وكلهم بيزوّدوا الـ hypoglycemia."
          - "بالعكس: الكلية بتكسّر الـ insulin، مش بتعمله."
          - "الـ gluconeogenesis بيقل مش بيزيد."
          - "مش بيبطلوا يشتغلوا، بس جرعاتهم بتتغيّر."
      - kind: mnemonic
        page: 143
        quote: "The typical presentation of diabetic kidney disease is considered to include a long-standing duration of diabetes, retinopathy, albuminuria without gross hematuria, and gradually progressive loss of eGFR."
        word: "DRAG"
        parts:
          - { key: "D", text: "Duration: long-standing diabetes" }
          - { key: "R", text: "Retinopathy" }
          - { key: "A", text: "Albuminuria without gross hematuria" }
          - { key: "G", text: "Gradually progressive loss of estimated glomerular filtration rate (eGFR)" }
        hook: "الـ DKD المعتاد بيـ**DRAG**: بيمشي ببطء. لو حاجة منهم ناقصة أو المشي بقى سريع، افتكر الـ non-DKD."
      - kind: explain
        page: 143
        title: "ليه ده الشكل المعتاد؟"
        quote: "The typical presentation of diabetic kidney disease is considered to include a long-standing duration of diabetes, retinopathy, albuminuria without gross hematuria, and gradually progressive loss of eGFR."
        text: |
          كل حرف في **DRAG** ليه منطق، والتفسير المقبول (مش في الكتاب) كده:

          - **Duration**: الـ glomerulus بيتأذي من السكر العالي سنين، فالـ DKD ما بيظهرش في أول السكر.
          - **Retinopathy**: نفس الـ microvascular damage اللي في العين بيحصل في الكلية، فوجودها بيأكّد إن السبب السكر.
          - **Albuminuria without gross hematuria**: الـ basement membrane بتتسرّب منها بروتين، بس مفيش التهاب يكسر الـ glomerulus ويطلّع دم، وده الفرق عن الـ glomerulonephritis.
          - **Gradual eGFR loss**: الـ scarring بيمشي ببطء، فالـ eGFR بينزل على سنين مش على أسابيع.

          والكتاب بينبّه: في الـ type 2 ممكن الـ CKD يبان من وقت التشخيص أو من غير retinopathy، لأن السكر كان موجود ومش متشخّص سنين.
      - kind: figure
        page: 143
        quote: "Non-albuminuric DKD\n  1. Prevalence of NADKD varies from 14.29 to 56.6% among diabetic patients with different ethnicities\n  2. Macroangiopathy is found to be more prevalent in patients with NADKD (increasing age, hypertension, atherosclerosis, dyslipidemia)\n  3. Intra renal arteriosclerosis is the main cause of renal impairment"
        title: "نوعين DKD"
        alt: "Two kidneys side by side. The left, albuminuric DKD, leaks albumin drops into the urine. The right, non-albuminuric DKD, has narrowed thickened arteries inside it and no albumin drops, labelled intrarenal arteriosclerosis."
        caption: "الـ ==non-albuminuric diabetic kidney disease (DKD)==: الـ eGFR ناقص من غير albuminuria، والسبب الأساسي **intrarenal arteriosclerosis**."
        svg: |
          <svg viewBox="0 0 330 190" xmlns="http://www.w3.org/2000/svg">
            <path d="M60 30 C20 30 15 110 55 125 C80 132 92 110 84 90 C78 75 90 62 92 52 C96 36 80 30 60 30 Z" class="fg-box"/>
            <circle cx="62" cy="150" r="4" class="fg-dot-bad"/>
            <circle cx="74" cy="162" r="4" class="fg-dot-bad"/>
            <circle cx="52" cy="168" r="4" class="fg-dot-bad"/>
            <text x="60" y="20" text-anchor="middle" class="t-sm t-b">Albuminuric</text>
            <text x="100" y="160" class="t-sm t-bad">albumin</text>
            <path d="M230 30 C190 30 185 110 225 125 C250 132 262 110 254 90 C248 75 260 62 262 52 C266 36 250 30 230 30 Z" class="fg-box"/>
            <path d="M200 60 C215 70 225 80 240 78" class="fg-arrow-bad" fill="none" stroke-width="5"/>
            <path d="M205 95 C218 98 228 105 245 100" class="fg-arrow-bad" fill="none" stroke-width="5"/>
            <text x="230" y="20" text-anchor="middle" class="t-sm t-b">Non-albuminuric</text>
            <text x="230" y="150" text-anchor="middle" class="t-sm t-acc">intrarenal</text>
            <text x="230" y="165" text-anchor="middle" class="t-sm t-acc">arteriosclerosis</text>
            <text x="230" y="182" text-anchor="middle" class="t-sm t-mut">↓eGFR, no albuminuria</text>
          </svg>
      - kind: explain
        remind: [dm.L12.012]
        page: 143
        title: "الـ NADKD: سؤال كتاب"
        quote: "Non-albuminuric DKD\n  1. Prevalence of NADKD varies from 14.29 to 56.6% among diabetic patients with different ethnicities\n  2. Macroangiopathy is found to be more prevalent in patients with NADKD (increasing age, hypertension, atherosclerosis, dyslipidemia)"
        text: |
          - ==reduced eGFR without albuminuria== بيتشاف كتير في type 1 وtype 2، وممكن من غير retinopathy.
          - الـ prevalence من **14.29 لـ 56.6%** حسب الـ ethnicity.
          - الـ **macroangiopathy** أكتر فيه: age أكبر، hypertension، atherosclerosis، dyslipidemia.
          - السبب الأساسي ==intrarenal arteriosclerosis==.

          علشان كده الـ albumin-to-creatinine ratio (ACR) لوحده مش كفاية: لازم eGFR كمان.
      - kind: reveal
        page: 143
        quote: "Macroangiopathy is found to be more prevalent in patients with NADKD\n         (increasing age, hypertension, atherosclerosis, dyslipidemia)"
        prompt: "ليه الـ NADKD بيجي مع الـ macroangiopathy، ومن غير albuminuria؟"
        answer: |
          الكتاب بيقول السبب الأساسي **intrarenal arteriosclerosis**، وإن الـ macroangiopathy أكتر فيه (age، hypertension، atherosclerosis، dyslipidemia).

          التفسير المقبول (مش في الكتاب): المشكلة هنا في **الشرايين** اللي بتغذّي الكلية، مش في فلتر الـ glomerulus. الشريان بيضيق، فالكلية بتاخد دم أقل والـ eGFR بينزل، بس الـ **basement membrane** نفسها سليمة نسبيًا، فمفيش albumin بيتسرّب. يعني ده نفس مرض الـ atherosclerosis اللي في القلب والرجلين، بس جوه الكلية.
      - kind: check
        page: 143
        quote: "Intrarenal arteriosclerosis is the main cause of renal impairment"
        question: "An older type 2 diabetic with hypertension, dyslipidemia and carotid plaque has eGFR 48 and a normal ACR. Most likely mechanism?"
        options:
          - "Intrarenal arteriosclerosis (non-albuminuric DKD)"
          - "Glomerulonephritis with active sediment"
          - "Classic albuminuric DKD"
          - "Prerenal azotemia from dehydration"
        answer: 0
        why:
          - "صح: eGFR ناقص من غير albuminuria مع macroangiopathy = NADKD، وسببه الأساسي intrarenal arteriosclerosis."
          - "مفيش sediment ولا hematuria في الحالة."
          - "الـ classic DKD فيه albuminuria، وهنا الـ ACR طبيعي."
          - "مفيش ما يقول إنه ناشف، والـ eGFR ناقص بشكل مزمن."
      - kind: try
        items: [dm.L12.001, dm.L12.006, dm.L12.008, dm.L12.010, dm.L12.013]
    recap:
      - "CKD = damage أو ↓function ≥3 months. السكر السبب الأول للـ renal failure."
      - "الكلية الضعيفة: insulin بيفضل أطول، gluconeogenesis أقل، أدوية بتتراكم ← hypoglycemia."
      - "DKD المعتاد = **DRAG**: duration، retinopathy، albuminuria من غير hematuria، gradual eGFR loss."
      - "NADKD: ↓eGFR من غير albuminuria، 14.29–56.6%، macroangiopathy، intrarenal arteriosclerosis (المشكلة في الشريان مش الفلتر)."
    practice: [dm.L12.001, dm.L12.002, dm.L12.003, dm.L12.004, dm.L12.005, dm.L12.006, dm.L12.007, dm.L12.008, dm.L12.009, dm.L12.010, dm.L12.011, dm.L12.012, dm.L12.013, dm.L12.110]
