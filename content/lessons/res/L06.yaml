    recap:
      - "الـ blinding بيحافظ على مكاسب الـ randomization: بيمنع biased assessment of outcomes (measurement bias)."
      - "Randomization ← confounding bias. Concealment ← selection bias. Blinding ← measurement bias."
      - "المستويات: patients، caregivers، outcome collectors، data analyst. وبيتغلب على ascertainment bias."
      - "Single: subject. Double: + observer. Triple: + data analyst. Open label: مفيش blinding."
