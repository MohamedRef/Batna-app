  - id: res.L09.lesson6
    title: "٦ طرق تبعدك عن الـ plagiarism"
    hook: "مش ممنوع تستخدم شغل غيرك. الممنوع إنك تخبّي إنه شغل غيرك."
    minutes: 8
    pages: [115, 139]
    topics: [avoid]
    goals:
      - "تعرف الـ plagiarism بيتكشف إزاي ونسبة الـ match المرفوضة"
      - "تطبق الـ 6 طرق: paraphrasing، citing، quoting، citing quotes، citing yourself، referencing"
      - "تحكم على أمثلة: plagiarism ولا لأ"
    status: unverified
    steps:
      - kind: explain
        page: 116
        quote: "Recently,\nMany software-based services for detection of plagiarism in scientific publications have become available.\nSome of these software services are free (eTBLAST) while others are commercial (iThenticate)\n\"percentage of match between 20 % and 30 % above which a manuscript can be rejected because of plagiarism"
        title: "بيتكشف إزاي؟"
        text: |
          - **زمان**: الـ editors بخبرتهم؛ كل كاتب ليه أسلوب، والـ copy-paste من كذا كاتب بيبان (slide 115).
          - **دلوقتي**: برامج. فيه **free** زي **eTBLAST**، و**commercial** زي **iThenticate**.
          - نسبة ==match بين 20% و 30%== هي الحد اللي فوقه المقالة ممكن تترفض.
      - kind: figure
        page: 118
        quote: "6 Ways to Avoid Plagiarism in Research Papers\n  1) Paraphrasing\n  2) Citing & in-text citation\n  3) Quoting\n  4) Citing quotes\n  5) Citing your own material\n  6) Referencing"
        title: "الـ ٦ طرق"
        alt: "Six numbered tiles: 1 paraphrasing, 2 citing and in-text citation, 3 quoting, 4 citing quotes, 5 citing your own material, 6 referencing."
        caption: "قول بكلامك، اذكر المصدر، انقل بين علامات، اذكر الصفحة، اذكر نفسك، واعمل reference list."
        svg: |
          <svg viewBox="0 0 330 170" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="10" width="102" height="66" rx="6" class="fg-acc"/>
            <text x="56" y="38" text-anchor="middle" class="t-lg t-b">1</text>
            <text x="56" y="60" text-anchor="middle" class="t-sm">Paraphrasing</text>
            <rect x="114" y="10" width="102" height="66" rx="6" class="fg-acc"/>
            <text x="165" y="38" text-anchor="middle" class="t-lg t-b">2</text>
            <text x="165" y="60" text-anchor="middle" class="t-sm">Citing</text>
            <rect x="223" y="10" width="102" height="66" rx="6" class="fg-acc"/>
            <text x="274" y="38" text-anchor="middle" class="t-lg t-b">3</text>
            <text x="274" y="60" text-anchor="middle" class="t-sm">Quoting</text>
            <rect x="5" y="90" width="102" height="66" rx="6" class="fg-good"/>
            <text x="56" y="118" text-anchor="middle" class="t-lg t-b">4</text>
            <text x="56" y="140" text-anchor="middle" class="t-sm">Citing quotes</text>
            <rect x="114" y="90" width="102" height="66" rx="6" class="fg-good"/>
            <text x="165" y="118" text-anchor="middle" class="t-lg t-b">5</text>
            <text x="165" y="140" text-anchor="middle" class="t-sm">Citing yourself</text>
            <rect x="223" y="90" width="102" height="66" rx="6" class="fg-good"/>
            <text x="274" y="118" text-anchor="middle" class="t-lg t-b">6</text>
            <text x="274" y="140" text-anchor="middle" class="t-sm">Referencing</text>
          </svg>
      - kind: explain
        page: 119
        quote: "1) Paraphrasing\n  It is a restatement of the meaning of a text or passage using other words.\n  If you find information that is perfect for your research paper. Read it then summarize and put it into your own words. Make sure that you do not copy more than two words in a row from the text you have found.\n  If you are using an idea from another sources, you have to cite it even if you paraphrase it\n  If you do use more than two words together, you will have to use quotation marks."
        title: "1. Paraphrasing"
        text: |
          إنك تقول **معنى** النص **بكلام تاني**: اقرا، لخّص، واكتب بكلامك.

          - ==ماتنقلش أكتر من كلمتين ورا بعض== من النص.
          - لو استخدمت أكتر من كلمتين مع بعض: **علامات تنصيص**.
          - والفكرة لازم **citation** حتى لو عملتلها paraphrase.
      - kind: case
        page: 121
        quote: "Is this plagiarism?\nNOT plagiarism\n  - paraphrased the original text to put in their own words\n  - indicated the source of the original ideas by providing a citation in the text\n  - full reference in the bibliography."
        stem: "النص الأصلي (Ure and Harris 2003) بيتكلم عن قياس الـ C-reactive protein (CRP) في اللعاب كـ sensor. طالبين كتبوا نفس المعنى بكلامهم."
        steps:
          - question: "Student A paraphrased well but gave no citation in the text. Plagiarism?"
            options: ["Yes", "No, because it is paraphrased"]
            answer: 0
            why: "**أيوه** (slide 120): مافيش citation جوه النص، فهو بيقدّم أفكار غيره كأنها بتاعته."
          - question: "Student B paraphrased, wrote \"as suggested by Ure and Harris (2003)\" and added the bibliography entry. Plagiarism?"
            options: ["No", "Yes, because the idea is not his"]
            answer: 0
            why: "**مش plagiarism** (slide 121): بكلامه + citation في النص + full reference في الـ bibliography."
      - kind: explain
        page: 124
        quote: "3) Quoting\n  It is the exact repetition or copying out of words from a text or speech written or spoken by another person.\n  When quoting a source, use the quote exactly the way it appears.\n  You need to put quotation marks when quoting verbatim text\n  When quoting more than 40 words, you need to put them as \"block quotes\""
        title: "2 لـ 4: citing و quoting"
        text: |
          - **Citing** (slide 122): تذكر المصدر كدليل على كلامك: **المؤلف والتاريخ**. واتبع نظام مؤسستك: **Vancouver**، American Psychological Association (APA)، Modern Language Association (MLA)، Chicago. والـ citation الغلط ممكن تبقى plagiarism.
          - **Quoting**: نسخ **حرفي** بالظبط زي ما هو، بين **علامات تنصيص**. ولو أكتر من ==40 كلمة==: **block quote**.
          - **Citing quotes** (slide 126): بتزود **رقم الصفحة**، أو رقم الفقرة في المواقع.
      - kind: table
        page: 125
        quote: "Block quote style:\n  No quotation marks\n  1 inch from left\n  Double spaced"
        title: "شكل الـ block quote"
        columns: ["", "الـ block quote"]
        rows:
          - ["Quotation marks", "No quotation marks"]
          - ["Indent", "1 inch from the left"]
          - ["Spacing", "Double spaced"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 128
        quote: "5) Citing your own material\n  If some of the material you are using for your research paper was used by you in your current class, a previous one, or anywhere else you must cite yourself. Treat the text the same as you would if someone else wrote it.\n  Using material you have used before is called self-plagiarism, and it is not acceptable."
        title: "5 و 6: نفسك والـ references"
        text: |
          - **Citing your own material**: لو استخدمت حاجة كتبتها قبل كده (في كورس، أو بحث قديم، أو أي مكان) لازم **تذكر نفسك**، وتعامل النص كأن حد تاني كتبه. غير كده = **self-plagiarism**.
          - **Referencing** (slide 129): صفحة references في الآخر حسب نظام المؤسسة، فيها **المؤلف، التاريخ، العنوان، والمصدر**.
      - kind: aside
