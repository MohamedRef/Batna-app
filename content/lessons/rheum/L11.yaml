  - id: rheum.L11.lesson2
    title: "الفحوصات: من الرخيص للدقيق"
    hook: "CBC و ESR وجلد بيتحقن: قبل الـ flow cytometry، فيه فحوصات بقروش بتقول كتير."
    minutes: 7
    pages: [182, 187]
    topics: [evaluation, tests]
    goals:
      - "ترتب الـ screening لكل ذراع"
      - "تعرف دلالة الـ ESR وعدد الـ lymphocytes"
      - "تحفظ مين الخلايا الغايبة في كل SCID"
    status: unverified
    steps:
      - kind: table
        page: 182
        quote: "Quantitative immunoglobulins - IgG, IgM, IgA. Specific antibodies - anti-tetanus, polio virus, rubella, isohemagglutinins (anti-A, anti-B)."
        title: "الـ screening حسب الذراع"
        columns: [Arm, First tests]
        rows:
          - ["B cell", "IgG, IgM, IgA; specific antibodies (tetanus, isohemagglutinins)"]
          - ["T cell", "Lymphocyte count; delayed skin tests"]
          - ["Complement", "CH50"]
          - ["Phagocyte", "Neutrophil count and function"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 184
        title: "أرقام تفتكرها"
        quote: "Absolute lymphocyte counts below 1500/cu.mm. in adults and 4000/cu.mm. in children less than 1 year of age are abnormal."
        text: |
          - الـ **T cells** حوالي **75%** من الـ lymphocytes، فلو الـ ==absolute lymphocyte count== قل يبقى غالبًا T
          - الحد: **<1500** في الكبار و **<4000** في الطفل تحت سنة = abnormal
          - ==Normal ESR== تقريبًا بينفي **chronic bacterial infection**
          - **Skin tests** للـ delayed hypersensitivity: طريقة **inexpensive** للـ T cell
      - kind: check
        page: 185
        quote: "patients with AIDS and AIDS-related complex are often hypergammaglobulinemic, but form specific antibodies poorly."
        question: "An AIDS patient has a high total IgG. What does it tell you about antibody function?"
        options:
          - "Little: specific antibody responses are often poor"
          - "Antibody function is normal"
          - "It rules out B cell dysfunction"
          - "It means IVIG is harmful"
        answer: 0
        why:
          - "صح: الـ AIDS غالبًا hypergammaglobulinemic بس الـ specific antibodies ضعيفة، فاعمل specific antibodies after immunization."
          - "الرقم الكلي ما بيقيسش الوظيفة."
          - "مش بينفي، بالعكس الـ specific response ضعيف."
          - "ملوش علاقة بالـ IVIG."
      - kind: table
        page: 186
        quote: "T cells are absent in XSCID. B cells and T cells are absent in autosomal recessive SCID."
        title: "مين الغايب؟"
        columns: [Disease, Missing]
        rows:
          - ["XLA", "B cells"]
          - ["X-linked SCID", "T cells"]
          - ["Autosomal recessive SCID", "B and T cells"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 186
        title: "الصور والـ biopsy"
        quote: "HRCT scans may be considered the criterion standard test to study lung abnormalities in these patients."
        text: |
          - **Chest X-ray:** ==غياب الـ thymic shadow== شائع في الـ **SCID**
          - **HRCT** هو الـ ==criterion standard== للرئة: fibrosis، **bronchiectasis**، scarring، pleural thickening
          - **ADA level** في كل عيان **SCID**
          - **Lymph node biopsy** مش لازم، وممكن تلم وحش وتلتهب
          - **Rectal biopsy** ممكن تفيد في CVID و IgA deficiency (plasma و lymphoid infiltrate)
      - kind: mnemonic
        page: 186
        quote: "ADA levels should be measured in patients with SCID."
        word: "ADA"
        parts:
          - { key: "A", text: "Always measure ADA in SCID" }
          - { key: "D", text: "Don't do lymph node biopsy (poor healing, infection)" }
          - { key: "A", text: "Absent thymic shadow on chest X-ray" }
        hook: "**ADA** للـ SCID: اطلبه دايمًا، ما تعملش node biopsy، ودوّر على thymus غايب."
      - kind: try
        items: [rheum.L11.019, rheum.L11.020, rheum.L11.025, rheum.L11.030, rheum.L11.031]
    recap:
      - "B: IgG/IgM/IgA و specific antibodies. T: lymphocyte count و skin tests. Complement: CH50."
      - "Lymphocytes <1500 كبار، <4000 تحت سنة. Normal ESR بينفي chronic bacterial infection."
      - "SCID: thymic shadow غايب، ADA دايمًا. HRCT للرئة. ما تعملش lymph node biopsy."
    practice: [rheum.L11.007, rheum.L11.008, rheum.L11.019, rheum.L11.020, rheum.L11.021, rheum.L11.024, rheum.L11.025, rheum.L11.026, rheum.L11.027, rheum.L11.028, rheum.L11.029, rheum.L11.030, rheum.L11.031, rheum.L11.032, rheum.L11.033, rheum.L11.034, rheum.L11.089]
