  # ---------- p44-45: risk categories ----------
  - id: dm.L04.041
    kind: card
    topic: risk-categories
    front: ESC/EASD very high CV risk in diabetes?
    back: Diabetes with target organ damage (proteinuria, eGFR <30, LVH or retinopathy), or ≥3 major risk factors (age, hypertension, dyslipidemia, smoking, obesity), or established CVD, or early-onset type 1 of long duration (>20 years).
    src: { page: 44, quote: "very high CV risk defined as DM with other target organ damage (proteinuria, eGFR < 30 mL/min/1.73 m2, left ventricular hypertrophy, or retinopathy)" }
    status: unverified
    tags: [high-yield]
    update:
      text: "ESC 2023 diabetes guidelines grade risk in type 2 diabetes without ASCVD or severe target organ damage with the SCORE2-Diabetes calculator."
      ref: "ESC Guidelines for CVD in patients with diabetes 2023"
  - id: dm.L04.042
    kind: card
    topic: risk-categories
    front: ESC/EASD high CV risk in diabetes?
    back: Diabetes duration ≥10 years without target organ damage, plus any other additional risk factor.
