          لو مامي (الـ **PBC**) ست في الخمسينات بتهرش وعندها **antimitochondrial antibody (AMA)**، فابنها (الـ **PSC**) راجل في الأربعينات عنده **ulcerative colitis** و **ANCA**، وقنواته شكلها زي سبحة جده. عيلة كاملة في الـ hepatology clinic. 😄
      - kind: reveal
        page: 227
        quote: "PSC is associated with inflammatory bowel disease in over 75% of\n cases, most commonly chronic ulcerative colitis."
        prompt: "ليه الـ PSC ماشي مع الـ ulcerative colitis في أكتر من 75%؟ وتعمل إيه بالمعلومة دي؟"
        answer: |
          الكتاب: **IBD في أكتر من 75%**، وأشهرها **chronic ulcerative colitis**. وفي جزء الأدوية الجديدة (p238) بيشرح فكرة الـ **gut–liver** crosstalk: نظرية الـ **leaky gut** إن مكونات البكتيريا بتعدّي للـ portal circulation وتولّع الالتهاب في القنوات، والأبحاث الأحدث بتقول إن فيه تفاعل محدد بين الكبد والـ microbiota.

          التفسير المقبول (مش في الكتاب): الـ lymphocytes اللي اتعلمت في المصران الملتهب ممكن تروح للكبد وتهاجم القنوات (ده نفس منطق الـ **vedolizumab** اللي بيمنع الـ leukocytes تتنقل بين المصران والكبد).

          عمليًا: مريض UC بـ ALP عالي، اطلب MRCP. ومريض PSC من غير أعراض مصران، دوّر على الـ UC، لأن الاتنين مع بعض بيعلّوا خطر **colon cancer**.
