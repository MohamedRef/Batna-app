    quote: |-
      A Hierarchy of Preprocessed Evidence
      | Studies | Preprocessing involves selecting only those studies that are both highly relevant and characterized by study designs that minimize bias and thus permit a high strength of inference |
      | Systematic reviews | Reviews involving the identification, selection, appraisal, and summary of primary studies addressing a focused clinical question using methods to reduce the likelihood of bias |
      | Synopses | Brief summaries that encapsulate the key methodologic details and results of a single study or systematic review |
      | Systems | Practice guidelines, clinical pathways, or evidence-based textbook summaries that integrate evidence-based information about specific clinical problems and provide regular updates to guide the care of individual patients |
    title: الـ evidence المتجهّز مسبقًا
    text: |
      السلايد بترتب الـ ==preprocessed evidence== في 4 مستويات:

      | المستوى | يعني إيه |
      |---|---|
      | ==Studies== | دراسات relevant وبـ designs بتقلل الـ bias |
      | Systematic reviews | تجميع وتقييم الـ primary studies على سؤال واحد بطرق بتقلل الـ bias |
      | ==Synopses== | ملخص قصير لـ methods ونتايج دراسة أو review واحد |
      | Systems | guidelines و clinical pathways و evidence-based textbook summaries بتتحدث باستمرار |

      ليه الترتيب ده؟ كل ما تطلع لفوق الشغل بيتعمل بدالك أكتر، فتلاقي الإجابة أسرع. التفسير المقبول (مش في الكتاب).
