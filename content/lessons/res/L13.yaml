          - "In the introduction, highlighted"
          - "Buried at the end of the discussion"
          - "Only in the reference list, not in the text"
          - "Nowhere, since it lowers the novelty of your paper"
        answer: 0
        why:
          - "صح: السلايد بتقول الـ citation دي أحسن تتبرز في الـ introduction."
          - "دفنها في الـ discussion هو اللي السلايد بتقول تتجنبه."
          - "أي reference في الـ list لازم يتذكر في النص."
          - "إخفاءها مش أمين، والقارئ لازم يعرف إن السؤال اتجاوب قبل كده."
      - kind: check
        page: 44
        quote: "Discussion\nConclusion\nGood discussion should be structured to include the following six components:\n3. Strengths and weaknesses in relation to other studies:\nIn particular, any differences in results should be discussed and possible explanations offered. If the authors do not know why their results are different from other studies, they should say so, but not imply that their results are better."
        question: "Your results differ from three earlier studies and you can't explain why. What do you write?"
        options:
          - "That you don't know why, without implying yours are better"
          - "That the earlier studies were probably flawed"
          - "Nothing; leave the difference out"
          - "That yours is the first reliable study"
        answer: 0
        why:
