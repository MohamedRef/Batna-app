  - id: dm.L06.lesson1
    title: "4 طرق للقرحة: خريطة الـ diabetic foot"
    hook: "عصب حسي، عصب حركي، عصب autonomic، وشريان: كل واحد بيوصل للقرحة بطريقته."
    minutes: 8
    pages: [66, 67]
    topics: [why, pathway]
    goals:
      - "تعرف ليه الـ neuropathy مهمة وأرقامها"
      - "ترسم الـ pathway من DM لـ DFU بأربع أذرع"
      - "تفهم كل ذراع بيعمل القرحة إزاي"
    status: unverified
    steps:
      - kind: explain
        page: 66
        title: "ليه نهتم؟"
        quote: "Up to 40-60% of those with diabetes will develop PN."
        text: |
          الـ **neuropathy** من أشهر complications السكر: لحد ==40–60%== من مرضى السكر هيعملوا **peripheral neuropathy**.

          - الألم: **burning، tingling، prickling، dull-aching**
          - بيبدأ في **الرجلين** ويطلع لفوق مع الوقت (stocking pattern)

          ليه الرجلين الأول؟ التفسير المقبول (مش في الكتاب): العصب اللي رايح لصوابع الرجل هو **أطول عصب** في الجسم، حوالي متر من الـ spinal cord. السكر بيأذي العصب على طوله، فالأطول بيتعب الأول، وبعد كده الأقصر في الساق، وفي الآخر الإيدين. عشان كده بنسميها **length-dependent**، والشكل بيطلع زي **الشراب** (stocking).
      - kind: explain
        page: 66
        title: "من الوجع للتنميل"
        quote: "Due to intractable pain, decreased mobility & sleep disorders."
        text: |
          الـ **painful neuropathy** بتبوّظ الـ **quality of life**: **intractable pain**، حركة أقل، ومشاكل نوم.

          وبعدين الأخطر: ==loss of sensation==، والرجل تبقى **insensate**. الوجع كان جرس إنذار، ولما يسكت الرجل تبقى من غير حماية.

          يعني تحسّن الوجع مع الوقت مش دايمًا خبر حلو: ممكن يكون معناه إن الألياف نفسها ماتت. العيان اللي كان بيشتكي وبطّل يشتكي محتاج تفحص رجله أكتر، مش أقل.
      - kind: aside
        tone: analogy
        page: 66
        quote: "Later on, there is ―Loss of Sensation‖."
        text: "زي جرس الحريق: الأول بيزمّر طول الليل ويضايقك (الألم). لما البطارية تخلص بيسكت، بس ده مش معناه إن الحريقة خلصت. الرجل الـ **insensate** هي البيت اللي جرسه فاصل."
      - kind: check
        page: 66
        quote: "Later on, there is ―Loss of Sensation‖."
        question: "A man with 15 years of diabetes says his burning feet have stopped hurting this year. What worries you most?"
        options:
          - "Loss of sensation: an insensate foot"
          - "Nothing: the neuropathy has healed"
          - "Insulin neuritis"
          - "A drug side effect"
        answer: 0
        why:
          - "صح: الكتاب بيقول بعد الألم بييجي loss of sensation، والرجل تبقى insensate من غير جرس إنذار."
          - "الـ diabetic neuropathy مش بتخف لوحدها؛ الوجع اللي سكت غالبًا عصب مات."
          - "الـ insulin neuritis وجع بيزيد بعد ما تبدأ insulin، مش وجع بيختفي."
          - "مفيش دوا في السؤال، والصورة بتاعة تطوّر المرض نفسه."
      - kind: figure
        page: 67
        quote: "Diabetes Mellitus → Diabetic Foot Ulcer (DFU):\n  PVD (with smoking, hypertension, dyslipidemia) → Ischaemia → Trauma → DFU\n  Neuropathy:\n    Somatic, sensory → Loss of Protective Sensation → Trauma → DFU\n    Somatic, motor → Intrinsic muscles Imbalance & Wasting → Foot Deformities → High Pressure Points → DFU\n    Autonomic → Reduced Sweating → Dry Skin → Cracks & Fissures → DFU"
        title: "من DM لـ DFU"
        alt: "Pathway diagram. Diabetes splits into PVD and neuropathy. PVD leads to ischaemia then trauma then ulcer, driven by smoking, hypertension and dyslipidemia. Neuropathy splits into sensory (loss of protective sensation, trauma), motor (intrinsic muscle imbalance and wasting, foot deformities, high pressure points) and autonomic (reduced sweating, dry skin, cracks and fissures). All four arms end in diabetic foot ulcer."
        caption: "أربع أذرع بتنتهي في نفس المكان: ==diabetic foot ulcer (DFU)==. الـ peripheral vascular disease (PVD) عليه smoking و hypertension (HTN) و dyslipidemia، والـ neuropathy ليها 3 أذرع: sensory و motor و autonomic."
        svg: |
