lessons:
  # ------------------------------------------------------------------
  - id: endo.L02.lesson1
    title: "الـ pituitary في الحمل، والـ prolactinoma قبل الحمل"
    hook: "الغدة بتكبر لوحدها في الحمل لحد الضعف تقريبًا. تخيل لو جواها ورم أصلًا."
    minutes: 8
    pages: [13, 15]
    topics: [pituitary-physiology, prolactinoma]
    goals:
      - "تفهم ليه الـ pituitary بتكبر والـ prolactin بيعلى في الحمل"
      - "تعرف أرقام علاج الـ prolactinoma بالجراحة والأدوية"
      - "تعرف تجهّز ست عندها prolactinoma للحمل"
    status: unverified
    steps:
      - kind: explain
        page: 13
        quote: "The pituitary enlarges throughout pregnancy and may become hyperintense on scan."
        title: "الغدة بتكبر"
        text: |
          الـ ==pituitary enlarges throughout pregnancy==، وممكن تبان **hyperintense** في الأشعة.

          في رسمة الكتاب الحجم بيزيد كل trimester عن اللي قبله، وأكبر حاجة في التالت.
      - kind: figure
        page: 13
        quote: "PRL axis during pregnancy"
        title: "ليه الـ prolactin بيعلى؟"
        alt: "Flow diagram. The placenta makes estrogen, which drives lactotroph hyperplasia in the maternal pituitary, so pituitary prolactin rises. TRH stimulates and dopamine inhibits the pituitary. Separately the decidua makes prolactin that dopamine does not inhibit, and amniotic fluid prolactin rises."
        caption: "الـ estrogen بتاع المشيمة بيكبّر الـ lactotrophs. وكمان الـ decidua بتعمل prolactin مش بيسمع كلام الـ dopamine."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="E02a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="E02b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="105" y="10" width="120" height="30" rx="8" class="fg-box"/>
            <text x="122" y="30" class="t-sm t-b">Hypothalamus</text>
            <text x="40" y="70" class="t-sm t-good">TRH (+)</text>
            <text x="240" y="70" class="t-sm t-bad">Dopamine (−)</text>
            <path d="M140 40L150 85" class="fg-arrow" marker-end="url(#E02a)"/>
            <path d="M190 40L180 85" class="fg-arrow-bad" stroke-dasharray="4 3" marker-end="url(#E02b)"/>
            <rect x="95" y="88" width="140" height="44" rx="10" class="fg-acc"/>
            <text x="110" y="106" class="t-sm t-b">Maternal pituitary</text>
            <text x="110" y="124" class="t-sm">lactotroph hyperplasia</text>
            <path d="M165 132V160" class="fg-arrow" marker-end="url(#E02a)"/>
            <text x="140" y="178" class="t-b">PRL ↑</text>
            <rect x="10" y="220" width="120" height="40" rx="10" class="fg-box"/>
            <text x="22" y="238" class="t-sm t-b">Placenta</text>
            <text x="22" y="254" class="t-sm">estrogen</text>
            <path d="M70 220L105 135" class="fg-arrow-acc" marker-end="url(#E02a)"/>
            <rect x="170" y="210" width="150" height="62" rx="10" class="fg-bad"/>
            <text x="180" y="230" class="t-sm t-b">Decidual PRL</text>
            <text x="180" y="246" class="t-sm">not inhibited by dopamine</text>
            <text x="180" y="262" class="t-sm">amniotic fluid PRL ↑</text>
          </svg>
      - kind: explain
        page: 14
        quote: "Pituitary adenomas are quite common, being found at autopsy in about 11% and clinically in 0.1% of persons."
        title: "الـ pituitary adenomas والحمل"
        text: |
          - موجودة في **11%** في الـ autopsy، و **0.1%** clinically.
          - بتأثر على الخصوبة بطريقتين: ==over-secretion== للهرمون، أو **hypopituitarism**.
          - الحمل نفسه بيغيّر الهرمونات، فالتقييم بيبقى صعب، والعلاج لازم نفكر في تأثيره على الجنين.
          - الـ ==hyperprolactinemia== سبب **ثلث** الـ female infertility.
      - kind: table
        page: 14
        quote: "Surgical therapy is initially curative in approximately 80-90% of patients with microadenomas and rarely causes hypopituitarism."
        title: "الجراحة للي عايزة تحمل"
        columns: ["Tumour", "Cure", "Hypopituitarism"]
        rows:
          - ["Microadenoma", "80-90%", "Rare"]
          - ["Macroadenoma", "30%", "Rises dramatically"]
          - ["Both", "Recurrence ~20%", "-"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 14
        quote: "generally dopamine agonists are the initial choice of therapy, including those planning pregnancy"
        title: "الأدوية أولًا"
        text: |
          الـ ==dopamine agonists== هي العلاج الأول، حتى للي بتخطط للحمل.
          - الأشهر: **bromocriptine** و **cabergoline**.
          - **50-75%** من الـ macroadenomas بتصغر **50%**.
      - kind: check
        page: 15
        quote: "Cabergoline is dosed once to twice weekly and is more effective and better tolerated than bromocriptine"
        question: "Compared with bromocriptine, cabergoline is:"
        options: ["Weekly dosing, more effective, better tolerated", "Daily dosing, less effective", "Equal but worse tolerated", "Contraindicated before pregnancy"]
        answer: 0
        why:
          - "صح: مرة أو مرتين في الأسبوع، أحسن وأريح، وبيرجّع الـ ovulation في أكتر من 90%."
          - "العكس."
          - "الكتاب بيقول أحسن في الاتنين."
          - "بيتستخدم، بس خد بالك من الـ half-life."
      - kind: explain
        page: 15
        quote: "contraception should be used for 2-3 cycles to establish the intermenstrual interval prior to pregnancy"
        title: "قبل ما تحمل"
        text: |
          - ==Contraception لمدة 2-3 cycles== علشان نعرف الـ intermenstrual interval بتاعها، فنكتشف الحمل بدري لما الدورة تتأخر.
          - الـ cabergoline ليه ==long half-life==: الجنين بيتعرض له **أسبوع أو أكتر** بعد ما نوقفه.
      - kind: reveal
        page: 15
        quote: "contraception should be used for 2-3 cycles to establish the intermenstrual interval prior to pregnancy"
        prompt: "ليه معرفة ميعاد الدورة مهمة هنا بالذات؟"
        answer: "لأننا هنوقف الـ dopamine agonist أول ما نعرف إنها حامل. لو الدورة منتظمة ومعروفة، أي تأخير يبان على طول، فالجنين يتعرض للدوا أقل وقت ممكن."
      - kind: aside
        tone: analogy
        page: 13
        quote: "The pituitary enlarges throughout pregnancy and may become hyperintense on scan."
        text: "الـ sella زي أوضة صغيرة. في الحمل الـ pituitary بتتخن، ولو في ورم جوا كمان، الأوضة تضيق والـ optic chiasm اللي فوقها هو أول واحد يتزنق."
      - kind: try
        items: [endo.L02.001, endo.L02.007, endo.L02.009, endo.L02.012, endo.L02.014]
    recap:
      - "الـ pituitary بتكبر طول الحمل؛ estrogen ← lactotroph hyperplasia ← PRL ↑."
      - "الـ decidual PRL مش بيتقفل بالـ dopamine."
      - "Hyperprolactinemia = ثلث الـ female infertility."
      - "جراحة: micro 80-90%، macro 30%، recurrence 20%."
      - "Dopamine agonists أولًا؛ cabergoline أحسن؛ contraception 2-3 cycles قبل الحمل."
    practice: [endo.L02.001, endo.L02.002, endo.L02.003, endo.L02.004, endo.L02.005, endo.L02.006, endo.L02.007, endo.L02.008, endo.L02.009, endo.L02.010, endo.L02.011, endo.L02.012, endo.L02.013, endo.L02.014, endo.L02.101, endo.L02.102]
  # ------------------------------------------------------------------
  - id: endo.L02.lesson2
    title: "الـ prolactinoma أثناء الحمل والرضاعة"
    hook: "أول ما تحمل وقّف الدوا. بس امتى نرجّعه؟ وامتى نولّد؟ وامتى نفتح؟"
    minutes: 8
    pages: [15, 17]
    topics: [prolactinoma]
    goals:
      - "تعرف امتى نوقف وامتى نكمّل الـ dopamine agonist"
      - "تعرف تتابع حسب حجم الورم"
      - "تعرف تتصرف لو الورم كبر، وفي الرضاعة"
    status: unverified
    steps:
      - kind: explain
        page: 15
        quote: "discontinue dopamine agonist therapy as soon as they discover that they are pregnant"
        title: "القاعدة"
        text: |
          ==Stop the dopamine agonist== أول ما تعرف إنها حامل.

          **الاستثناء:** macroadenoma حملت وهي على العلاج، ومعملتش surgery أو radiation قبل كده، وخصوصًا لو الورم **invasive** أو لازق في الـ **optic chiasm**: ممكن نكمّل طول الحمل.
      - kind: explain
        page: 15
        quote: "The stimulatory effect of the hormonal milieu of pregnancy and the withdrawal of the dopamine agonist may result in significant prolactinoma enlargement."
        title: "بنوازن بين حاجتين"
        text: |
          1. الـ ==tumor enlargement== المتوقع: هرمونات الحمل بتنبّه الورم، ووقف الدوا بيشيل الفرامل.
          2. أمان تعرض الجنين للدوا في أول كام أسبوع.
      - kind: sort
        page: 16
        quote: "Large tumors and those with extrasellar extension: formal visual field testing should be done each trimester."
        prompt: "إيه المتابعة المناسبة؟"
        bins: ["Clinical review each trimester", "Formal visual fields each trimester"]
        cards:
          - { text: "Microadenoma", bin: 0 }
          - { text: "Intrasellar macroadenoma", bin: 0 }
          - { text: "Large tumour", bin: 1 }
          - { text: "Extrasellar extension", bin: 1 }
        why: "الصغير والـ intrasellar مش محتاجين serial MRI ولا visual fields، بس clinical review كل trimester. الكبير أو اللي طالع برا الـ sella: visual fields كل trimester."
      - kind: aside
        tone: trap
        page: 16
        quote: "It is not necessary to measure serum prolactin throughout pregnancy."
        text: "فخ: متقيسش الـ serum prolactin في الحمل. هو أصلًا بيعلى طبيعي (الـ lactotrophs والـ decidua)، فمش هيقولك حاجة عن الورم."
      - kind: order
        page: 16
        quote: "Reinstitution of bromocriptine or cabergoline therapy generally is successful in reducing tumor size."
        prompt: "الورم كبر في الحمل. رتّب الخطوات:"
        steps:
          - "Restart bromocriptine or cabergoline"
          - "Deliver if pregnancy is advanced enough"
          - "Surgical decompression if these fail"
        why: "الدوا غالبًا بيصغّر الورم. لو الحمل متقدم كفاية، نولّد. الجراحة آخر حل (زي أي جراحة، بس خطر الـ hypopituitarism أعلى)."
      - kind: table
        page: 17
        quote: "Cabergoline has been utilized in the first trimester in more than 600 human pregnancies."
        title: "الدوا والجنين"
        columns: ["Drug", "Pregnancy fact"]
        rows:
          - ["Bromocriptine", "Crosses placenta; not continuously through gestation; early weeks safe"]
          - ["Cabergoline", ">600 first-trimester pregnancies, no rise in abortion or anomalies"]
          - ["Cabergoline", "Long half-life: exposure 1+ week after stopping"]
        hide: [[0, 1], [1, 1]]
      - kind: explain
        page: 17
        quote: "Therapeutic options for tumors extending outside the sella include pre- pregnancy surgical debulking"
        title: "ورم طالع برا الـ sella وعايزة تحمل؟"
        text: |
          3 اختيارات:
          - **Pre-pregnancy surgical debulking**.
          - متابعة أكتر من غير dopamine agonist.
          - ==Continuous bromocriptine== طول الحمل لو في severe visual symptoms.
      - kind: explain
        page: 17
        quote: "dopamine agonists must be withheld until the period of breastfeeding is over, as they will cause a reduction in PRL and cessation of milk production"
        title: "الرضاعة"
        text: |
          - الرضاعة بتعلّي الـ prolactin طبيعي، بس ==مفيش دليل إن الـ suckling بيكبّر الورم==.
          - الـ dopamine agonists **ممنوعة** طول الرضاعة، لأنها بتوقف اللبن.
          - نعيد التقييم بعد **شهرين** من الولادة أو من وقف الرضاعة. الـ PRL ممكن يقل أو يرجع طبيعي.
      - kind: case
        page: 15
        quote: "especially if the tumor is invasive or is abutting the optic chiasm"
        stem: "A woman with a 2 cm invasive macroprolactinoma abutting the chiasm conceives on cabergoline. No prior surgery or radiotherapy."
        steps:
          - question: "What about cabergoline?"
            options: ["Continuing it through pregnancy may be prudent", "Stop it at once like everyone", "Switch to octreotide", "Urgent surgery"]
            answer: 0
            why: "ده بالظبط الاستثناء: macroadenoma invasive أو لازق في الـ chiasm من غير surgery أو radiation قبل كده."
          - question: "Monitoring?"
            options: ["Formal visual fields each trimester", "Monthly prolactin", "No monitoring", "Weekly MRI"]
            answer: 0
            why: "الورم الكبير: visual fields كل trimester، والـ prolactin مش مفيد."
      - kind: try
        items: [endo.L02.015, endo.L02.016, endo.L02.019, endo.L02.021, endo.L02.027]
    recap:
      - "وقّف الـ dopamine agonist أول ما تحمل؛ إلا macroadenoma invasive/جنب الـ chiasm."
      - "Micro/intrasellar: clinical كل trimester. Large/extrasellar: visual fields كل trimester. مفيش PRL."
      - "الورم كبر: رجّع الدوا ← ولّد لو متقدمة ← جراحة لو فشلوا."
      - "Bromocriptine بيعدّي المشيمة؛ cabergoline آمن في >600 حمل."
      - "الرضاعة مسموحة؛ الدوا ممنوع لحد ما تخلص؛ تقييم بعد شهرين."
    practice: [endo.L02.015, endo.L02.016, endo.L02.017, endo.L02.018, endo.L02.019, endo.L02.020, endo.L02.021, endo.L02.022, endo.L02.023, endo.L02.024, endo.L02.025, endo.L02.026, endo.L02.027, endo.L02.028, endo.L02.103, endo.L02.104, endo.L02.105, endo.L02.106, endo.L02.125, endo.L02.128]
  # ------------------------------------------------------------------
  - id: endo.L02.lesson3
    title: "Cushing في الحمل: الحمل نفسه بيقلّد Cushing"
    hook: "تخن، ضغط، سكر، و striae. ده Cushing ولا حمل عادي؟ الفرق في اللون."
    minutes: 9
    pages: [18, 20]
    topics: [pituitary-physiology, cushing]
    goals:
      - "تفهم ليه الـ cortisol عالي في الحمل الطبيعي"
      - "تعرف الـ clues والتحاليل اللي تنفع واللي متنفعش"
      - "تعرف العلاج حسب الـ trimester"
    status: unverified
    steps:
      - kind: figure
        page: 18
        quote: "Cortisol Cortisone"
        title: "الـ HPA axis في الحمل"
        alt: "Diagram. Placental CRH and placental ACTH drive the maternal adrenal, so cortisol rises. Estrogen raises CBG, so bound cortisol rises; free and urinary cortisol rise; progesterone causes cortisol resistance. Placental 11-beta HSD2 converts cortisol to cortisone and protects the fetus."
        caption: "المشيمة بتعمل CRH و ACTH بنفسها، فالـ cortisol بيعلى طبيعي. الجنين محمي بالـ 11β-HSD2."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="E02c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="200" y="10" width="120" height="50" rx="10" class="fg-acc"/>
            <text x="212" y="30" class="t-sm t-b">Placenta</text>
            <text x="212" y="48" class="t-sm">CRH, ACTH</text>
            <rect x="10" y="10" width="140" height="50" rx="10" class="fg-box"/>
            <text x="22" y="30" class="t-sm t-b">Maternal pituitary</text>
            <text x="22" y="48" class="t-sm">ACTH (set point altered)</text>
            <path d="M80 60L120 100" class="fg-arrow" marker-end="url(#E02c)"/>
            <path d="M250 60L190 100" class="fg-arrow-acc" marker-end="url(#E02c)"/>
            <rect x="95" y="102" width="140" height="40" rx="10" class="fg-box"/>
            <text x="108" y="127" class="t-sm t-b">Maternal adrenal</text>
            <path d="M165 142V170" class="fg-arrow" marker-end="url(#E02c)"/>
            <text x="130" y="188" class="t-b">Cortisol ↑</text>
            <text x="10" y="222" class="t-sm">Estrogen → CBG ↑ → bound cortisol ↑</text>
            <text x="10" y="242" class="t-sm">Free cortisol ↑ → urinary cortisol ↑</text>
            <text x="10" y="262" class="t-sm">Progesterone → cortisol resistance</text>
            <rect x="10" y="280" width="310" height="40" rx="10" class="fg-good"/>
            <text x="20" y="298" class="t-sm t-b">11β-HSD2 (placenta): cortisol → cortisone</text>
            <text x="20" y="313" class="t-sm">protects the fetus from maternal hypercortisolism</text>
          </svg>
      - kind: explain
        page: 18
        quote: "Half of the reported gestational CS cases have adrenal causes, and about 40% are Cushing’s disease (CD)"
        title: "Cushing's والحمل"
        text: |
          - الحمل ==نادر== في Cushing's (الـ cortisol بيعطّل الخصوبة).
          - الأسباب زي غير الحوامل، بس: **نص** الحالات ==adrenal==، و **40%** Cushing's disease.
          - في كمان **cyclical CD** بـ ACTH متذبذب.
          - المضاعفات: gestational diabetes، hypertension، pre-eclampsia، eclampsia، CHF، pulmonary edema.
      - kind: reveal
        page: 19
        quote: "In normal pregnancy, the striae are usually white in contrast to large purple striae in CS."
        prompt: "ست حامل عندها تخن وضغط وسكر و striae. إزاي تفرّق Cushing من الحمل العادي؟"
        answer: |
          الحمل العادي بيعمل weight gain، hypertension، glucose intolerance، و striae كمان. الـ clues اللي تقول Cushing:
          - **Hypokalemia**.
          - **Muscle weakness**.
          - **Pathological fractures**.
          - **Large purple** striae (الحمل العادي striae **بيضا**).
          - Hirsutism و acne = androgen زيادة.
      - kind: table
        page: 19
        quote: "UFC has been suggested as the best choice for screening of CS during pregnancy."
        title: "التحاليل في الحمل"
        columns: ["Test", "In pregnancy"]
        rows:
          - ["Dexamethasone suppression", "Avoid: false positive (blunted response)"]
          - ["Circadian rhythm", "Preserved; loss is a clue, nadir higher"]
          - ["24-h UFC", "Best screen; >3x upper limit in 2nd/3rd trimester"]
          - ["Plasma ACTH", "ACTH-dependent or not; mind adrenal majority"]
          - ["IPSS", "Not routine"]
        hide: [[0, 1], [2, 1], [4, 1]]
      - kind: check
        page: 19
        quote: "UFC levels are unchanged during the first trimester, but levels are increased up to threefold in the second and third trimesters."
        question: "At 30 weeks, UFC is 2 times the upper limit. Interpretation?"
        options: ["Not diagnostic; normal pregnancy raises UFC up to threefold", "Diagnostic of Cushing's", "Proves adrenal Cushing's", "Ignore UFC in pregnancy"]
        answer: 0
        why:
          - "صح: في التاني والتالت الـ UFC بيعلى لـ 3 أضعاف طبيعي؛ اللي يتحسب أكتر من 3 أضعاف."
          - "لسه جوه حدود الحمل الطبيعي."
          - "الـ UFC مش بيفرّق السبب."
          - "بالعكس، هو أحسن screening."
      - kind: aside
        tone: exam
        page: 19
        quote: "the use of a dexamethasone suppression test should not be used during pregnancy"
        text: "Endocrine Society 2008: متعملش dexamethasone suppression test في الحمل. الـ low dose مش بيكبت الـ cortisol أصلًا في الحمل، فهتطلع false positive."
      - kind: explain
        page: 20
        quote: "Adrenal computerized tomography (CT) scans should be avoided, and pituitary MRI should be reserved for patients for whom pituitary surgery is planned."
        title: "الأشعة"
        text: |
          - ==Adrenal CT ممنوعة== (radiation).
          - الـ **pituitary MRI** بس لو هنعمل جراحة.
          - مشكلة: الـ CD غالبًا **microadenoma**، والغدة الكبيرة في الحمل ممكن تخبيه.
      - kind: figure
        page: 20
        quote: "Surgery is the treatment of choice for pregnant women with CD during the second trimester."
        title: "العلاج على خط الـ trimesters"
        alt: "A horizontal timeline of three trimesters. First trimester: medical therapy by severity, then surgery in the second. Second trimester: surgery is the treatment of choice. Late third trimester: medical therapy and surgery after delivery. Below: metyrapone is the drug of choice; watch for adrenal insufficiency."
        caption: "الـ trimester التاني هو شباك الجراحة. قبله وبعده metyrapone."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="20" width="100" height="40" class="fg-box"/>
            <rect x="110" y="20" width="110" height="40" class="fg-good"/>
            <rect x="220" y="20" width="100" height="40" class="fg-box"/>
            <text x="38" y="45" class="t-sm t-b">1st</text>
            <text x="148" y="45" class="t-sm t-b">2nd</text>
            <text x="255" y="45" class="t-sm t-b">3rd</text>
            <text x="14" y="82" class="t-sm">Medical by</text>
            <text x="14" y="98" class="t-sm">severity, then</text>
            <text x="14" y="114" class="t-sm">surgery in 2nd</text>
            <text x="116" y="82" class="t-sm t-b t-good">SURGERY</text>
            <text x="116" y="98" class="t-sm">treatment of</text>
            <text x="116" y="114" class="t-sm">choice</text>
            <text x="224" y="82" class="t-sm">Late: medical,</text>
            <text x="224" y="98" class="t-sm">surgery</text>
            <text x="224" y="114" class="t-sm">postpartum</text>
