  # ---------- p347-348: MSK and lung ----------
  - id: rheum.L21.019
    kind: enumerate
    topic: msk-lung
    prompt: List the musculoskeletal features of systemic sclerosis.
    points:
      - Arthritis of the hands (>50%) with swelling, stiffness and pain
      - Carpal tunnel syndrome
      - Contractures from skin thickening
      - Polymyositis (in MCTD or overlap)
    pass: 3
    src: { page: 347, quote: "In > 50% with swelling, stiffness, and pain in the joints of the hands." }
    status: unverified
  - id: rheum.L21.020
    kind: card
    topic: msk-lung
    front: What is the leading cause of death in systemic sclerosis, and why?
    back: Pulmonary involvement, because renal disease is now better controlled.
    src: { page: 347, quote: "Leading cause of death:  Since we are better at control of renal disease." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L21.021
    kind: card
    topic: msk-lung
    front: Main lung symptom and the two types of lung involvement in SSc?
    back: Exertional dyspnea; interstitial lung disease and isolated pulmonary hypertension.
    src: { page: 348, quote: "Exertional dyspnea. • Types of lung Involvement:  Interstitial lung disease.  Isolated pulmonary hypertension." }
    status: unverified
  # ---------- p348: renal crisis ----------
  - id: rheum.L21.022
    kind: card
    topic: renal
    front: Define the hypertension of scleroderma renal crisis.
    back: Abruptly developing severe hypertension, with a rise in SBP by more than 30 mmHg or DBP by more than 20 mmHg.
    src: { page: 348, quote: "Abruptly developing severe hypertension: – Rise in SBP by > 30 mmHg, DBP by > 20 mm Hg." }
    status: unverified
    tags: [high-yield, numbers]
  - id: rheum.L21.023
    kind: enumerate
    topic: renal
    prompt: Besides the hypertension, scleroderma renal crisis needs one of which findings?
    points:
      - Creatinine up 50% over baseline, or above 120% of the upper limit
      - Proteinuria >2+ on dipstick
      - Hematuria >2+ or >10 RBC/HPF
      - Platelets <100
      - Hemolysis (schistocytes, low platelets, high reticulocytes)
    pass: 4
    src: { page: 348, quote: "Increase in serum creatinine by 50% over baseline or creatinine > 120% of upper limit. – Proteinuria > 2+ by dipstick." }
    status: unverified
  - id: rheum.L21.024
    kind: cloze
    topic: renal
    text: "In renal crisis {{c1::90%}} have BP above 150/90; crisis with BP below {{c2::140/90}} carries a {{c3::worse}} prognosis."
    src: { page: 348, quote: "90% with blood pressure > 150/90. • Can occur also with lower blood pressures < 140/90 and this confers worse prognosis." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L21.025
    kind: card
    topic: renal
    front: What complications can scleroderma renal crisis cause?
    back: Headache, encephalopathy, seizures and left ventricular failure.
    src: { page: 348, quote: "Can cause headache, encephalopathy, seizures, LV failure." }
    status: unverified
  - id: rheum.L21.026
    kind: enumerate
    topic: renal
    prompt: List the risk factors for scleroderma renal crisis.
    points:
      - Rapidly progressive skin thickening in the first 2–3 years
      - Steroid use (prednisone >15 mg)
      - Anti-RNA polymerase III antibody
      - Pericardial effusion
    pass: 4
    src: { page: 348, quote: "Rapidly progressive skin thickening within the first 2-3 years. • Steroid use (prednisone > 15 mg). • Anti-polymerase III Ab." }
    status: unverified
    tags: [high-yield]
