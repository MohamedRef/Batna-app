- kind: improved
  ar_eg: باطنة مبقاش ينزّل ملف محتوى عنده نسخة منه، ولو نسختك مقدرتش تقرأ ملف محتوى بيستنى تحديث التطبيق بدل ما ينزّله كل شوية، ولو التنزيل اتقطع بيحاول تاني
  en: Batna no longer downloads a content pack it already keeps, waits for an app update instead of re-fetching one it can't read, and retries a cut download
