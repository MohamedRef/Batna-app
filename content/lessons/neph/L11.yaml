    status: unverified
    steps:
      - kind: explain
        page: 378
        title: "ليه الغسيل المكثف؟"
        quote: "To achieve a predialysis blood urea of less than 50mg/dL, 4-6 sessions of 4-6 hours of dialysis per week are usually needed. Frequent dialysis is aimed at maintaining adequate uteroplacental flow without compromising on net fluid removal."
        text: |
