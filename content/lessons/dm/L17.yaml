    title: "الأدوية: نوقف الحرامي ولا نزوّد الإيداع؟"
    hook: "Antiresorptive بيوقف السحب، و anabolic بيزوّد الإيداع. كل دوا ليه جرعة وفخ."
    minutes: 10
    pages: [224, 228]
    topics: [drugs]
    goals:
