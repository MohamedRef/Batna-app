  - id: hem.L12.lesson3
    title: "Hodgkin: عين البومة"
    hook: "خلية واحدة خبيثة وسط جيش من الخلايا الطيبة. والخلية دي شكلها بيبصلك زي البومة."
    minutes: 9
    pages: [194, 195]
    topics: [hl-basics, hl-subtypes]
    goals:
      - "تعرف أصل الـ RS cell والـ markers بتاعتها، وليه هي B cell من غير B markers"
      - "تحفظ الـ epidemiology والـ risk factors"
      - "تفرّق الأربع classic subtypes"
    status: unverified
    steps:
      - kind: explain
        page: 194
        quote: "PCR for Immunoglobulin gene amplification demonstrates that the neoplastic cells in Hodgkin's Lymphoma are clonal B-cells originating in a lymph node germinal centre with a crippled immunoglobulin gene caused by mutations that prevent synthesis of full-length immunoglobulin."
        title: "الخلية الخبيثة"
        text: |
          بالـ polymerase chain reaction (PCR) اكتشفوا إن الخلايا الخبيثة في الـ Hodgkin هي ==clonal B-cells== من الـ **germinal centre**، بس عندها **crippled immunoglobulin gene**: mutations بتمنع إنها تعمل immunoglobulin كامل.

          - أول من وصفه **Thomas Hodgkin سنة 1832**.
          - الـ **Epstein–Barr virus (EBV) genome** موجود في **50% أو أكتر** من الحالات.

          ليه ده غريب؟ التفسير المقبول (مش في الكتاب): الـ B cell في الـ germinal centre اللي ما تعرفش تعمل antibody سليم المفروض **تموت** فورًا (دي رقابة الـ germinal centre). فالخلية دي عاشت رغم إنها «فاشلة»، وده معناه إن حاجة تانية (زي الـ EBV) أنقذتها من الموت.
      - kind: explain
        page: 194
        quote: "It is made by histological examination of an excised lymph- node. RS-cell is central to the diagnosis of the four classic types and RS- cells are also part of the malignant clone. These cells stain with CD 30 and CD 15 but are usually negative for B-cell antigen expression. Besides, inflammatory cells consist of lymphocytes, neutrophils, eosinophils, plasma cells and variable fibrosis."
        title: "الـ Reed-Sternberg"
        text: |
          التشخيص بـ histology لغدة **excised**. الـ ==Reed–Sternberg (RS) cell== أساس تشخيص الأربع classic types، وهي جزء من الـ malignant clone.

          - بتاخد صبغة **CD30** و **CD15**.
          - وغالبًا **negative** للـ B-cell antigens (رغم إنها B cell أصلًا، لأن الـ Ig gene بايظ).
          - حواليها: lymphocytes، neutrophils، eosinophils، plasma cells، و fibrosis.

          ليه الكتاب بيقول **excised** مش needle؟ لأن الخلايا الخبيثة قليلة جدًا وسط الزحمة (شوف الرسمة)، فالإبرة ممكن تجيب lymphocytes بس وتفوّت الـ RS. الغدة كاملة بتديك فرصة تلاقيها وتشوف الـ pattern.
      - kind: figure
        page: 195
        quote: "Histopathologic / Clinical Features of Classic Hodgkin's Disease\n| Subtype | Frequency | Features |\n| Lymphocyte predominance | 10% | Younger patients; Rare RS cells; Many lymphocytes; Usually stage 1 or 2 |\n| Nodular sclerosis | +50% | Young adults, only type more common in women, presence of Lacunar RS variants, fibrosis surrounding nodules. |\n| Mixed cellularity | +30% | More abundant RS, richer infiltrate of inflammatory cells |\n| Lymphocyte depletion | Uncommon | Numerous RS-cells, decreased lymphocyte percentage, atypical cells |"
        title: "الـ RS cell وسط الزحمة"
        alt: "A large binucleate Reed-Sternberg cell with two big nucleoli like owl eyes in the centre, labelled CD30 and CD15 positive. Around it many small lymphocytes, an eosinophil, a plasma cell and a histiocyte labelled host response."
        caption: "خلية خبيثة واحدة كبيرة بنواتين (owl eye) والباقي كله host response."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="165" cy="110" rx="70" ry="55" class="fg-acc"/>
