  - id: rheum.L18.023
    kind: mcq
    topic: glandular
    stem: "A 45-year-old woman has had a dry mouth for a year. Which oral finding is part of Sjögren syndrome in the lecture?"
    options:
      - Dental caries with loss of teeth
      - Gingival hypertrophy
      - Macroglossia
      - Hairy leukoplakia
      - Excess drooling at night
    answer: 0
    why:
      - "Correct: without saliva teeth decay; the book lists dental caries and loss of teeth (p303)."
      - Gingival hypertrophy is a drug effect (phenytoin, cyclosporine), not in the book's list.
      - The book describes a dry fissured tongue, not a large one.
      - Hairy leukoplakia is an EBV lesion of immunosuppression, not a Sjögren sign.
      - Sjögren is dryness; drooling is the opposite.
    src: { page: 303, quote: "Dry fissured tongue, oral candidiasis. * Dental caries and loss of teeth." }
    status: unverified
