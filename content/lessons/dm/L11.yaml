            <text x="165" y="48" text-anchor="middle" class="t-sm">titrated basal, or basal &gt;0.7–1.0 IU/kg, or FPG at target</text>
            <path d="M85 67 V95" class="fg-arrow" marker-end="url(#L11b)"/>
            <path d="M245 67 V95" class="fg-arrow" marker-end="url(#L11b)"/>
            <text x="165" y="88" text-anchor="middle" class="t-sm t-mut">either / or</text>
            <rect x="10" y="100" width="150" height="120" rx="10" class="fg-bad"/>
            <text x="20" y="122" class="t-sm t-b">Premix 2–3 times daily</text>
            <text x="20" y="150" class="t-sm t-bad">Caution:</text>
            <text x="20" y="168" class="t-sm">more hypoglycemia</text>
            <text x="20" y="186" class="t-sm">and/or weight gain</text>
            <rect x="170" y="100" width="150" height="120" rx="10" class="fg-good"/>
            <text x="180" y="122" class="t-sm t-b">✓ Add prandial</text>
            <text x="180" y="150" class="t-sm">One dose with the</text>
            <text x="180" y="168" class="t-sm">largest meal, or meal</text>
            <text x="180" y="186" class="t-sm">with biggest PPG rise</text>
          </svg>
      - kind: table
        page: 137
        quote: "Prandial Insulin:\n  INITIATION FOR PRANDIAL:\n    4 IU a day or 10% of basal dose\n    If HbA1c <64 mmol/mol (8%) consider lowering the total dose by 4 IU a day or 10% of basal dose\n  TITRATION FOR PRANDIAL:\n    Increase dose by 1–2 IU or 10–15% twice weekly\n    For hypoglycemia determine cause, if no clear reason lower corresponding dose by 10–20%"
        title: "Prandial: البداية والـ titration"
        columns: [Step, Rule]
        rows:
          - [Start, "4 IU a day or 10% of basal"]
          - ["If HbA1c <8%", "Lower total dose by 4 IU or 10% of basal"]
          - [Titrate, "+1–2 IU or 10–15%, twice weekly"]
          - [Unexplained hypo, "Lower that dose 10–20%"]
        hide: [[0, 1], [2, 1], [3, 1]]
      - kind: reveal
        page: 137
        quote: "Prandial Insulin:\n  INITIATION FOR PRANDIAL:\n    4 IU a day or 10% of basal dose\n    If HbA1c <64 mmol/mol (8%) consider lowering the total dose by 4 IU a day or 10% of basal dose\n  TITRATION FOR PRANDIAL:\n    Increase dose by 1–2 IU or 10–15% twice weekly\n    For hypoglycemia determine cause, if no clear reason lower corresponding dose by 10–20%"
        prompt: "ليه لو الـ HbA1c أقل من 8% بنقلّل الجرعة الكلية لما نضيف prandial؟"
        answer: |
          لأن العيان قريب من الهدف. لو ضفت prandial فوق نفس الـ basal، المجموع يزيد مرة واحدة ويقع في **hypoglycemia**.

          علشان كده بنشيل ==4 IU or 10%== من الـ basal ونحطهم prandial: نفس الإجمالي تقريبًا، بس متوزّع صح.
      - kind: check
        page: 137
        quote: "Prandial Insulin:\n  INITIATION FOR PRANDIAL:\n    4 IU a day or 10% of basal dose\n    If HbA1c <64 mmol/mol (8%) consider lowering the total dose by 4 IU a day or 10% of basal dose\n  TITRATION FOR PRANDIAL:\n    Increase dose by 1–2 IU or 10–15% twice weekly\n    For hypoglycemia determine cause, if no clear reason lower corresponding dose by 10–20%"
        question: "A patient has a hypoglycemia after lunch on his new prandial dose, with no missed meal or extra exercise. Per the lecture?"
        options:
          - "Lower that prandial dose by 10–20%"
          - "Stop all insulin"
          - "Lower the basal dose by 4 units"
          - "Keep the dose and add a snack"
        answer: 0
        why:
          - "صح: دوّر على السبب الأول، ولو ما فيش سبب واضح قلّل الجرعة المسؤولة بـ 10–20%."
          - "ده مبالغة؛ المشكلة في جرعة واحدة."
          - "الـ hypo بعد الغدا سببه جرعة الغدا، مش الـ basal."
          - "الـ snack بيزوّد الوزن ومش بيصلّح الجرعة الغلط."
      - kind: explain
        page: 137
        title: "Premixed insulin"
        quote: "Twice-daily injections, a mixture of short and intermediate, before breakfast and the evening meal"
        text: |
          ==Twice-daily injections==: خليط **short + intermediate** في نفس القلم، **قبل الفطار** و**قبل العشا**.

          مثال الكتاب **biphasic insulin aspart (BIAsp) 30** (30% aspart، 70% intermediate):
          - **30 U** الصبح = **9 U** سريع + **21 U** intermediate
          - **10 U** بالليل = **3 U** + **7 U**
      - kind: figure
        page: 138
        title: "رسمة الكتاب ص 138: الـ 30 U والـ 10 U على الساعة"
        image: { file: dm/L11-premix-doses.webp, book: true }
        alt: "Book chart of a twice-daily premixed insulin over 24 hours, with meals and snacks marked under the time axis. At 8 am, 30 units split into a short blue curve of 9 units and a long red curve of 21 units. At 8 pm, 10 units split into 3 units blue and 7 units red."
        caption: |
          **الأزرق** = الجزء السريع، و**الأحمر** = الـ intermediate.

          - **الشمال** (8 الصبح): **30 U** = ==9 أزرق + 21 أحمر==.
          - **اليمين** (8 بالليل): **10 U** = 3 أزرق + 7 أحمر.

          الحروف تحت (B, S, L, S, D, S) = الفطار والغدا والعشا والـ snacks بينهم.
      - kind: explain
        page: 136
        title: "ليه الـ premix عليه caution؟"
        quote: "Caution higher risk\nof hypoglycemia\nand/or weight gain"
        text: |
          الكتاب بيحط على الـ premix تحذير: ==higher risk of hypoglycemia== و/أو **weight gain**. التفسير المقبول (مش في الكتاب):

          - **النسبة ثابتة** (30/70 مثلًا): لو زوّدت الجزء السريع عشان وجبة كبيرة، الـ intermediate بيزيد معاه غصب عنك.
          - الـ **intermediate** ليه peak (زي الـ NPH في رسمة ص 133)، فلازم العيان ياكل في مواعيد ثابتة، ولو أخّر وجبة يقع.
          - عشان يتجنّب الـ hypo بياكل **snacks** زيادة، فالوزن بيطلع.

          يعني الـ premix سهل في عدد الحقن، بس تمنه إن اليوم كله لازم يمشي على الساعة.
      - kind: explain
        page: 138
        title: "ظبط الـ premix"
        quote: "Titrate once weekly, based on the lowest SMPG value over the previous 3 days before titration."
        text: |
          - ==once weekly==
          - على **أقل قراية self-monitored plasma glucose (SMPG)** في آخر **3 أيام** (مش المتوسط، ومش أعلى رقم: الأقل علشان الأمان).
          - قراية **قبل الفطار** بتظبط **جرعة العشا**، وقراية **قبل العشا** بتظبط **جرعة الفطار** (الـ intermediate بتاع كل حقنة هو اللي بيوصل للوجبة اللي بعدها).
      - kind: table
        page: 138
        quote: "Adjusting the dose of Premixed insulin: Titrate once weekly, based on the lowest SMPG value over the previous 3 days before titration.\n| Pre-meal blood glucose level (mg/dl) | BIAsp 30 dose adjustment (Units) |\n|---|---|\n| < 80 | -2 |\n| 80-120 | 0 |\n| 121-140 | +2 |\n| 141-180 | +4 |\n| > 180 | +6 |"
        title: "BIAsp 30 adjustment"
        columns: [Pre-meal mg/dl, Units]
        rows:
          - ["<80", "−2"]
          - ["80–120", "0"]
          - ["121–140", "+2"]
          - ["141–180", "+4"]
          - [">180", "+6"]
        hide: [[0, 1], [2, 1], [3, 1], [4, 1]]
      - kind: aside
        tone: tip
        page: 138
        quote: "Titrate once weekly, based on the lowest SMPG value over the previous 3 days before titration."
        text: "عشان تعمل **titrate** صح، الجدول بيمشي كل **2**: −2، 0، +2، +4، +6. والحدود: **80، 120، 140، 180**. افتكر إن **80–120** هو «المنطقة الآمنة» اللي ما تلمسش فيها الجرعة."
      - kind: check
        page: 138
        quote: "Titrate once weekly, based on the lowest SMPG value over the previous 3 days before titration."
        question: "Pre-breakfast SMPG over 3 days: 190, 176, 202. Change the evening BIAsp 30 dose by?"
        options:
          - "+4 (lowest is 176)"
          - "+6 (two readings >180)"
          - "+2"
          - "No change"
        answer: 0
        why:
          - "صح: أقل قراية 176 ← 141–180 ← +4."
          - "الكتاب بياخد أقل قراية، مش الأغلبية."
          - "+2 لـ 121–140."
          - "لسه فوق 120."
      - kind: explain
        page: 139
        title: "مشاكل الـ premix في الـ curves"
        quote: "III. Basal-bolus regimen"
        text: |
          الـ curves في ص 139 بتوضّح مشاكل الحقنتين:
          - الـ intermediate بتاع العشا يعمل ==nocturnal hypoglycemia== حوالي 2–3 الفجر، فالعيان محتاج **snack** قبل النوم.
          - لو الغدا اتأخر أو اتلغى: **hypoglycemia** الضهر.
          - وبعد الغدا ممكن **hyperglycemia** العصر.
          - الحل في آخر رسمة: جرعة **سريعة مستقلة للغدا** (حقنة تالتة).

          وده بالظبط اللي بيوصّلنا للـ **basal-bolus**.
      - kind: figure
        page: 139
        title: "رسمة الكتاب ص 139: مشاكل الـ premix واحدة واحدة"
        image: { file: dm/L11-premix-problems.webp, book: true }
        alt: "Book figure of six stacked premixed-insulin charts, blue short-acting and red intermediate curves over 24 hours. 1: a green arrow down after midnight, hypoglycaemia. 2: a teal block before the night peak, a bedtime snack. 3: the same day without the arrow. 4: a green arrow down near noon, hypoglycaemia before lunch. 5: a green arrow up in the afternoon, hyperglycaemia. 6: a third blue curve added at lunch."
        caption: |
          ست رسومات من **فوق لتحت**:
          1. **الأولى**: سهم أخضر لتحت **بعد نص الليل** = ==nocturnal hypoglycemia==.
          2. **التانية**: المربع الأخضر = **snack** قبل النوم يغطي القمة دي.
          3. **التالتة**: نفس اليوم من غير مشكلة.
          4. **الرابعة**: سهم لتحت **قبل الغدا** = hypoglycemia لو الغدا اتأخر.
          5. **الخامسة**: سهم لفوق **العصر** = hyperglycemia بعد الغدا.
          6. **الأخيرة**: قمة زرقا **تالتة عند الغدا** = حقنة سريعة للغدا، والطريق للـ basal-bolus.
