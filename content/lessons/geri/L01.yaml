        options:
          - "Evaluate for CRT"
          - "Ivabradine"
          - "Stop bisoprolol"
          - "No further action"
        answer: 0
        why:
          - "صح: sinus و QRS ≥130 ← CRT."
          - "الـ ivabradine محتاج HR ≥70؛ ده 64."
          - "الـ BB أساسي، ما نوقفوش."
          - "لسه symptomatic و EF ≤35%."
      - kind: table
        page: 21
        quote: "Bisoprolol 1.25 o.d. 10 o.d."
        title: "الجرعات اللي تحفظها"
        columns: [Drug, Start, Target]
