    steps:
      - kind: explain
        page: 178
        title: "الـ type IV collagen"
        quote: "Alport syndrome (AS) is a generalized, inherited disorder of basement membranes caused by mutations affecting specific proteins of the type IV (basement membrane) collagen family. The major features of AS are hematuria, progressive nephritis with proteinuria and declining renal function, sensorineural deafness, and ocular abnormalities. AS is a rare disease, affecting approximately 1 in 50,000 people and is seen in all ethnicities and races. AS accounts for approximately 0.5% of adults and 1.7% of children with end-stage renal disease (ESRD) in the United States.¹"
        text: |
          الاتنين **basement membrane defect**، والعَرَض الرئيسي **persistent hematuria**.

          الـ **type IV collagen** موجود في الـ glomerular basement membrane (GBM) و Bowman capsule و distal tubule و الجلد و ==العين والودن== والـ testis، وفيه 6 chains (α1–α6).

          الـ ==Alport== = **hematuria + progressive nephritis + sensorineural deafness + eye**. نادر (1 في 50,000)، و **1.7%** من الأطفال على end-stage renal disease (ESRD).
