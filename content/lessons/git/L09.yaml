      - kind: explain
        remind: [git.L09.076]
        page: 254
        title: "أشعة ومناظير"
        quote: "Wirelessintestinalcapsulecanvisualizeallthesmallintestines."
        text: |
          **أشعة**: Endoscopic retrograde cholangiopancreatography (ERCP)، magnetic resonance cholangiopancreatography (MRCP)، computed tomography (CT)، magnetic resonance imaging (MRI)، و abdominal أو endoscopic ultrasound (للبنكرياس والقنوات).

          **مناظير**:
          - **Upper endoscopy (EGD)** + biopsies من الـ duodenum (celiac، lymphangiectasia)، بس مش specific.
          - **Enteroscopy** (double balloon، single balloon، spiral): يشوف ويـbiopsy الـ small bowel.
          - ==Wireless capsule==: يشوف الـ small bowel **كله**.

          ليه الـ capsule مميز؟ لأنه الوحيد اللي **بيشوف الـ small bowel كله**، بس ما يقدرش ياخد biopsy. والـ EGD biopsy **مش specific** لأن الـ villous atrophy بتحصل في أمراض كتير، فلازم تقراها مع الـ serology والصورة.
