schema: batna.content/v1
lecture: dm.L03
title: "Chronic Microvascular Complications"
author: "Assist. Prof. Dr. Reem Fathallah"
book: { chapter: 6, pages: [27, 36] }
topics:
  - { id: control, title: "Tight glycemic control targets" }
  - { id: dkd, title: "Diabetic kidney disease: definition and risk factors" }
  - { id: dkd-screening, title: "DKD screening: albuminuria, eGFR and referral" }
  - { id: dkd-management, title: "DKD management" }
  - { id: neuropathy, title: "Diabetic neuropathy: features and complications" }
  - { id: neuropathy-screening, title: "Neuropathy screening, diagnosis and treatment" }
  - { id: retinopathy, title: "Diabetic retinopathy: stages" }
  - { id: retinopathy-care, title: "Retinopathy screening and treatment" }
items:
  # ---------- p27: control ----------
  - id: dm.L03.001
    kind: card
    topic: control
    front: What does tight glycemic control do to microvascular complications?
    back: It prevents their development and/or ameliorates their progression, in both type 1 and type 2 diabetes.
    src: { page: 27, quote: "Tight glycemic control would prevent the development and/or ameliorate the progression of diabetes-associated microvascular complications" }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.002
    kind: cloze
    topic: control
    text: "Tight control: A1C below or around {{c1::7%}}, preprandial FPG {{c2::80–130 mg/dl}}, peak 2-h postprandial glucose below or around {{c3::180 mg/dl}}."
    src: { page: 27, quote: "A1C should be lowered to below or around 7%. 8- FPG (preprandial) should be lowered to (80-130 mg/dl)." }
    status: unverified
    tags: [numbers, high-yield]
  # ---------- p27-28: DKD ----------
  - id: dm.L03.003
    kind: card
    topic: dkd
    front: Define diabetic kidney disease.
    back: Persistent albuminuria >30 mg/g creatinine and/or GFR <60 ml/min/1.73 m², without signs or symptoms of another primary cause of kidney damage.
    src: { page: 27, quote: "Persistent albuminuria >30 mg/ g creatinine and/or decrease in GFR < 60 ml/min/1.73m2 in the absence of signs or symptoms of other primary causes" }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.004
    kind: cloze
    topic: dkd
    text: "DKD occurs in {{c1::20–40%}} of people with diabetes and is the leading cause of {{c2::ESRD}}."
    src: { page: 27, quote: "DKD occurs in 20–40% of patients with diabetes and is the leading cause of ESRD." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L03.005
    kind: card
    topic: dkd
    front: Is DKD risk different in type 2 vs type 1 diabetes?
    back: It seems similar.
    src: { page: 27, quote: "The risk of DKD in type 2 diabetes seems to be similar to that in type 1 diabetes." }
    status: unverified
  - id: dm.L03.006
    kind: card
    topic: dkd
    front: What do most patients with DKD actually die of?
    back: Cardiovascular disease, before they need kidney replacement therapy.
    src: { page: 27, quote: "the majority of patients actually die from CVD before needing kidney replacement therapy." }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.007
    kind: card
    topic: dkd
    front: Strongest factor influencing the onset of albuminuria in diabetes?
    back: The level of glycemia and glycosylated hemoglobin.
    src: { page: 28, quote: "The level of glycemia and glycosylated hemoglobin seems to be the strongest factor influencing the onset of albuminuria." }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.008
    kind: enumerate
    topic: dkd
    prompt: Besides hyperglycemia, which factors influence the development of diabetic nephropathy?
    points: [Hypertension, Cigarette smoking, Hyperlipidemia, Genetic susceptibility]
    pass: 3
    src: { page: 28, quote: "Hypertension. 4- Cigarette smoking. 5- Hyperlipidemia. 6- Genetic susceptibility." }
    status: unverified
  # ---------- p28-29: screening ----------
  - id: dm.L03.009
    kind: card
    topic: dkd-screening
    front: Who is screened for DKD, how often, and with what?
    back: Type 1 after ≥5 years of diabetes, and all type 2 regardless of treatment; at least annually, with urine albumin (spot ACR) and eGFR.
    src: { page: 28, quote: "patients with type 1 diabetes who have had the condition for at least 5 years, and in all patients with type 2 diabetes," }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.010
    kind: cloze
    topic: dkd-screening
    text: "Albuminuria is confirmed when {{c1::two of three}} specimens collected within {{c2::3–6 months}} are abnormal."
    src: { page: 28, quote: "two of three specimens collected within a 3- to 6- month period should be abnormal before considering a patient to have developed albuminuria." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L03.011
    kind: enumerate
    topic: dkd-screening
    prompt: What can raise urinary albumin excretion above baseline?
    points: [Exercise within 24 h, Infection, Fever, Congestive heart failure, Marked hyperglycemia, Marked hypertension]
    pass: 4
    src: { page: 28, quote: "Exercise within 24 h, infection, fever, congestive heart failure, marked hyperglycemia, and marked hypertension may elevate UAE over baseline values." }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.012
    kind: table
    topic: dkd-screening
    title: "Albumin excretion (Table 9.1, spot mg/g creatinine)"
    columns: [Category, Spot ACR]
    rows:
      - [Normal, "<30"]
      - [Increased urinary albumin excretion, "≥30"]
      - ["Old name: microalbuminuria", "30–299"]
      - ["Old name: macroalbuminuria (clinical)", ">300"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 28, quote: "Historically, ratios between 30 and 299 mg/g have been called microalbuminuria" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L03.013
    kind: table
    topic: dkd-screening
    title: GFR equations in the lecture
    columns: [Equation, Accuracy]
    rows:
      - [Cockcroft-Gault, Overestimates]
      - [MDRD, Underestimates]
      - [CKD-EPI, "More accurate (GFR >60); generally preferred"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 29, quote: "Cockcroft-Gault formula: overestimate. - MDRD: underestimate. - CKD-EPI: more accurate." }
    status: unverified
  - id: dm.L03.014
    kind: enumerate
    topic: dkd-screening
    prompt: When should a person with diabetes and kidney disease be referred to a nephrologist (possible biopsy)?
    points:
      - "Active urinary sediment (RBCs, WBCs or cellular casts)"
      - Rapidly increasing albuminuria or nephrotic syndrome
      - Rapidly decreasing eGFR
      - Absence of retinopathy (in type 1 diabetes)
    pass: 3
    src: { page: 29, quote: "An active urinary sediment (containing red or white blood cells or cellular casts)." }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.015
    kind: card
    topic: dkd-screening
    front: Why does absent retinopathy in type 1 diabetes with kidney disease prompt referral?
    back: It suggests another cause of kidney disease; the lecture lists it as a reason for nephrology referral and possible biopsy.
    src: { page: 29, quote: "Absence of retinopathy (in type 1 diabetes)." }
    status: unverified
  - id: dm.L03.016
    kind: card
    topic: dkd-screening
    front: On what three things is CKD classified (the ADA heat map)?
    back: Cause (C), GFR (G) and albuminuria (A).
    src: { page: 29, quote: "CKD is classified based on: Cause (C) GFR (G) Albuminuria (A)" }
    status: unverified
  - id: dm.L03.017
    kind: table
    topic: dkd-screening
    title: GFR categories (heat map)
    columns: [Category, GFR (mL/min/1.73 m²)]
    rows:
      - ["G1 normal to high", "≥90"]
      - ["G2 mildly decreased", "60–89"]
      - ["G3a mildly to moderately decreased", "45–59"]
      - ["G3b moderately to severely decreased", "30–44"]
      - ["G4 severely decreased", "15–29"]
      - ["G5 kidney failure", "<15"]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 29, quote: "G3a Mildly to moderately decreased 45-59" }
    status: unverified
    tags: [numbers]
  - id: dm.L03.018
    kind: table
    topic: dkd-screening
    title: Albuminuria categories (heat map)
    columns: [Category, Range]
    rows:
      - ["A1 normal to mildly increased", "<30 mg/g (<3 mg/mmol)"]
      - ["A2 moderately increased", "30–299 mg/g (3–29 mg/mmol)"]
      - ["A3 severely increased", "≥300 mg/g (≥30 mg/mmol)"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 29, quote: "A2 Moderately increased 30-299 mg/g 3-29 mg/mmol" }
    status: unverified
    tags: [numbers]
  - id: dm.L03.019
    kind: card
    topic: dkd-screening
    front: In the heat map, what do the numbers in each cell mean, and where does referral start?
    back: Suggested visits per year. Refer with A3 at any GFR, with G4–G5 in any albuminuria; G3 with A1–A2 is treated (1–3 visits/year).
    src: { page: 29, quote: "Risk of chronic kidney disease (CKD) progression, frequency of visits, and referral to nephrology according to glomerular filtration rate (GFR) and albuminuria." }
    status: unverified
  # ---------- p30-31: DKD management ----------
  - id: dm.L03.020
    kind: cloze
    topic: dkd-management
    text: "Protein in nondialysis CKD: about {{c1::0.8 g/kg/day}} (the RDA); on dialysis, {{c2::higher}} intake, because malnutrition is a major problem."
    src: { page: 30, quote: "protein intake should be approximately 0.8 g/kg body weight per day (the recommended daily allowance)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L03.021
    kind: cloze
    topic: dkd-management
    text: "Sodium restriction to {{c1::<2,300 mg/day}} may help BP and CV risk; {{c2::potassium}} restriction may be needed to control serum potassium."
    src: { page: 30, quote: "Restriction of dietary sodium (to <2,300 mg/day) may be useful to control blood pressure and reduce cardiovascular risk" }
    status: unverified
    tags: [numbers]
  - id: dm.L03.022
    kind: cloze
    topic: dkd-management
    text: "In type 2 diabetes with DKD, consider an {{c1::SGLT2 inhibitor}} if eGFR {{c2::≥20}} mL/min/1.73 m² and urine albumin {{c3::>300 mg/g}} creatinine."
    src: { page: 30, quote: "consider use of an SGLT inhibitor in patients with an estimated glomerular filtration rate ≥20 mL/min/1.73 m2 and urinary albumin >300 mg/g creatinine." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L03.023
    kind: enumerate
    topic: dkd-management
    prompt: Enumerate the lines of management of diabetic kidney disease.
    points:
      - "Nutrition: protein 0.8 g/kg/day, sodium <2,300 mg/day, potassium if needed"
      - "Glycemic control (A1C ~7%)"
      - SGLT2i for direct renal effect
      - Adjust doses of antidiabetic drugs
      - "BP <130/80"
      - "Renoprotection: ACEi or ARB"
    pass: 5
    src: { page: 30, quote: "Management of diabetic kidney disease: Nutrition" }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.024
    kind: card
    topic: dkd-management
    front: BP target in DKD per the lecture?
    back: <130/80 mmHg, considered on individual anticipated benefits and risks.
    src: { page: 30, quote: "Blood pressure control: <130/80 mmHg should be considered for patients based on individual anticipated benefits and risks." }
    status: unverified
  - id: dm.L03.025
    kind: card
    topic: dkd-management
    front: When are ACEi or ARBs used in DKD, and when strongly recommended?
    back: Used with modestly raised ACR (30–299 mg/g); strongly recommended with ACR ≥300 mg/g and/or eGFR <60.
    src: { page: 30, quote: "is strongly recommended for those with ACR≥300 mg/g creatinine and/or estimated glomerular filtration rate <60 mL/min/1.73 m2." }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.026
    kind: cloze
    topic: dkd-management
    text: "With albuminuria ≥300 mg/g, aim to cut urinary albumin by {{c1::30%}} or more to slow CKD progression."
    src: { page: 31, quote: "a reduction of 30% or greater in mg/g urinary albumin is recommended to slow chronic kidney disease progression." }
    status: unverified
    tags: [numbers]
  - id: dm.L03.027
    kind: cloze
    topic: dkd-management
    text: "Do not stop RAS blockade for a creatinine rise of less than {{c1::30%}} without {{c2::volume depletion}}."
    src: { page: 31, quote: "Do not discontinue renin-angiotensin system blockade for minor increases in serum creatinine (<30%) in the absence of volume depletion." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L03.028
    kind: card
    topic: dkd-management
    front: Should an ACEi or ARB be given for primary prevention of CKD in a normotensive diabetic with normal ACR and eGFR?
    back: No; it is not recommended.
    src: { page: 31, quote: "An ACE inhibitor or an angiotensin receptor blocker is not recommended for the primary prevention of chronic kidney disease" }
    status: unverified
    tags: [high-yield]
  # ---------- p31-32: neuropathy ----------
  - id: dm.L03.029
    kind: card
    topic: neuropathy
    front: Why is diabetic neuropathy called a diagnosis of exclusion?
    back: Non-diabetic neuropathies may be present in diabetics and may be treatable.
    src: { page: 31, quote: "Diabetic neuropathy is a diagnosis of exclusion. Nondiabetic neuropathies may be present in patients with diabetes and may be treatable." }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.030
    kind: cloze
    topic: neuropathy
    text: "Up to {{c1::50%}} of diabetic peripheral neuropathy may be {{c2::asymptomatic}}, risking injury to insensate feet without foot care."
    src: { page: 31, quote: "Up to 50% of diabetic peripheral neuropathy may be asymptomatic." }
    status: unverified
    tags: [numbers]
  - id: dm.L03.031
    kind: card
    topic: neuropathy
    front: Why recognize autonomic neuropathy?
    back: Treatment may improve symptoms, reduce sequelae and improve quality of life.
    src: { page: 31, quote: "Recognition and treatment of autonomic neuropathy may improve symptoms, reduce sequelae, and improve quality of life." }
    status: unverified
  - id: dm.L03.032
    kind: card
    topic: neuropathy
    front: Most common neurologic syndrome in diabetes?
    back: Distal symmetric sensorimotor polyneuropathy, with a strong predilection for the distal nerves of the feet and hands.
    src: { page: 31, quote: "Distal symmetric sensorimotor polyneuropathy: it is the most common neurologic syndrome seen in diabetes" }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.033
    kind: enumerate
    topic: neuropathy
    prompt: Diagnostic clinical criteria of diabetic (distal symmetric) neuropathy?
    points:
      - Stocking-glove paresthesia of the distal extremities
      - "Loss of deep sensation (joint and vibration sense)"
      - Loss of deep tendon reflexes in upper and lower limbs
      - Distal muscle wasting
      - Loss of coordination (sensory ataxia)
    pass: 4
    src: { page: 31, quote: "Diagnostic clinical criteria: Stocking-glove paresthesia of distal extremities. Loss of deep sensations" }
    status: unverified
    tags: [high-yield, book-question]
  - id: dm.L03.034
    kind: card
    topic: neuropathy
    front: Which deep sensations are lost in diabetic neuropathy?
    back: Joint (position) sense and vibration sense.
    src: { page: 31, quote: "Loss of deep sensations: Joint sense. 2. Vibration sense." }
    status: unverified
  - id: dm.L03.035
    kind: enumerate
    topic: neuropathy
    prompt: Complications of diabetic neuropathy?
    points: ["Charcot joint (neuropathic arthropathy)", Foot ulcers, Repeated minor injuries]
    pass: 3
    src: { page: 32, quote: "Complications of diabetic neuropathy: 3. Charcot joint (neuropathic arthropathy)" }
    status: unverified
  - id: dm.L03.036
    kind: card
    topic: neuropathy
    front: "Charcot joint in the lecture: when, where, and how does it look?"
    back: Late, with severe sensory loss; common in the knee and ankle; painless swelling with abnormal mobility.
    src: { page: 32, quote: "Characterized by painless swelling of the joint with abnormal degree of mobility." }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.037
    kind: card
    topic: neuropathy
    front: "Neuropathic foot ulcer: where and what is it like?"
    back: At pressure sites (under the heel and under the first and last metatarsal heads); completely painless and very hard to heal; commoner with advanced anesthesia.
    src: { page: 32, quote: "It appears at pressure sites; under heel and under head of first ,last metatarsal." }
    status: unverified
    tags: [high-yield]
  # ---------- p32-33: neuropathy screening and treatment ----------
  - id: dm.L03.038
    kind: cloze
    topic: neuropathy-screening
    text: "Screen for peripheral neuropathy at diagnosis of {{c1::type 2}} diabetes and {{c2::5 years}} after diagnosis of type 1, then at least {{c3::annually}}."
    src: { page: 32, quote: "starting at diagnosis of type 2 diabetes and 5 years after the diagnosis of type 1 diabetes and at least annually thereafter." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L03.039
    kind: table
    topic: neuropathy-screening
    title: Bedside tests for neuropathy
    columns: [Function, Test]
    rows:
      - [Small fiber, "Pinprick and temperature sensation"]
      - [Large fiber, "Vibration (128-Hz tuning fork)"]
      - [Protective sensation, "10-g monofilament (annual)"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 33, quote: "Small-fiber function: pinprick and temperature sensation. Large-fiber function: vibration perception. Protective sensation: 10-g monofilament." }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.040
    kind: card
    topic: neuropathy-screening
    front: Purpose of the annual 10-g monofilament test?
    back: To identify feet at risk of ulceration and amputation.
    src: { page: 32, quote: "All patients should have annual 10-g monofilament testing to identify feet at risk for ulceration and amputation." }
    status: unverified
  - id: dm.L03.041
    kind: card
    topic: neuropathy-screening
    front: In whom should autonomic neuropathy be assessed?
    back: Patients with microvascular complications.
    src: { page: 33, quote: "Symptoms and signs of autonomic neuropathy should be assessed in patients with microvascular complications." }
    status: unverified
  - id: dm.L03.042
    kind: card
    topic: neuropathy-screening
    front: Most common early symptoms of diabetic neuropathy, and which fibers cause them?
    back: Pain and dysesthesia (burning, tingling), from small-fiber involvement.
    src: { page: 33, quote: "The most common early symptoms are induced by the involvement of small fibers and include pain and dysesthesia" }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.043
    kind: card
    topic: neuropathy-screening
    front: What do large-fiber lesions cause, and why does LOPS matter?
    back: Numbness and loss of protective sensation (LOPS); LOPS means distal sensorimotor polyneuropathy and is a risk factor for foot ulcers.
    src: { page: 33, quote: "LOPS indicates the presence of distal sensorimotor polyneuropathy and is a risk factor for diabetic foot ulceration." }
    status: unverified
  - id: dm.L03.044
    kind: card
    topic: neuropathy-screening
    front: What does glucose control do for neuropathy in type 1 vs type 2?
    back: "Type 1: prevents or delays it. Type 2: slows progression. It does not reverse neuronal loss."
    src: { page: 33, quote: "Optimize glucose control to prevent or delay the development of neuropathy in patients with type 1 diabetes" }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.045
    kind: card
    topic: neuropathy-screening
    front: Initial drugs for painful diabetic neuropathy in the lecture?
    back: Pregabalin and duloxetine.
    src: { page: 33, quote: "Pregabalin, duloxetine, are recommended as initial pharmacologic treatments for neuropathic pain in diabetes." }
    status: unverified
    tags: [high-yield]
    update:
      text: "ADA Standards of Care also list gabapentinoids, SNRIs, tricyclic antidepressants and sodium-channel blockers as initial options."
      ref: "ADA Standards of Care in Diabetes 2025, section 12"
  # ---------- p33-34: retinopathy ----------
  - id: dm.L03.046
    kind: card
    topic: retinopathy
    front: Two factors most strongly related to retinopathy prevalence?
    back: Duration of diabetes and level of glycemic control.
    src: { page: 33, quote: "Its prevalence is strongly related to both the duration of diabetes and the level of glycemic control." }
    status: unverified
  - id: dm.L03.047
    kind: cloze
    topic: retinopathy
    text: "Diabetes is the most frequent cause of new blindness at age {{c1::20–74}} in developed countries."
    src: { page: 33, quote: "most frequent cause of new cases of blinding in persons aged 20 to 74 years in the developed countries." }
    status: unverified
    tags: [numbers]
  - id: dm.L03.048
    kind: card
    topic: retinopathy
    front: "Mild NPDR: when, first signs, and vision?"
    back: 3–5 years after diagnosis in type 1; microaneurysms first, then hemorrhages and hard exudates, and soft exudates (nerve fiber infarcts); vision usually unaffected.
    src: { page: 34, quote: "First signs are microaneurysms with subsequent retinal haemorrhages and hard exudates." }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.049
    kind: card
    topic: retinopathy
    front: What are soft exudates?
    back: Infarctions of the nerve fiber layer.
    src: { page: 34, quote: "Infarctions of nerve fiber layer, known as soft exudates." }
    status: unverified
  - id: dm.L03.050
    kind: table
    topic: retinopathy
    title: Stages of diabetic retinopathy
    columns: [Stage, Features]
    rows:
      - [Mild NPDR, "Microaneurysms, then hemorrhages and hard exudates; soft exudates; vision unaffected"]
      - [Moderate NPDR, "Venous beading and caliber changes; more capillary dilatation and permeability"]
      - [Severe NPDR, "Progressive ischemia; extensive hemorrhages, exudates, microaneurysms"]
      - [Early PDR, Neovascularization in the retina]
      - [High-risk PDR, "Neovascularization in the vitreous: detachment, hemorrhage, blindness"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 34, quote: "Neovascularization in the retina \"early PDR\" Neovascularization in the vitreous body \"High risk PDR\"" }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.051
    kind: cloze
    topic: retinopathy
    text: "At 5 years, mild, moderate and severe NPDR carry a {{c1::15%}}, {{c2::30%}} and {{c3::60%}} risk of progressing to PDR."
    src: { page: 34, quote: "At 5 years; mild, moderate and severe NPDR are associated with 15%, 30% and 60% risk of progression to PDR." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L03.052
    kind: card
    topic: retinopathy
    front: What marks moderate NPDR?
    back: Microvascular abnormalities such as venous beading and venous caliber changes, with more capillary dilatation and permeability.
    src: { page: 34, quote: "Venous beading, venous caliber changes. Increased capillary dilatation and permeability." }
    status: unverified
  - id: dm.L03.053
    kind: card
    topic: retinopathy
    front: Early vs high-risk PDR?
    back: "Early: new vessels in the retina. High-risk: new vessels in the vitreous, leading to retinal detachment, hemorrhage and blindness."
    src: { page: 34, quote: "Neovascularization in the retina \"early PDR\" Neovascularization in the vitreous body \"High risk PDR\"" }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.054
    kind: card
    topic: retinopathy
    front: How can PDR cause glaucoma?
    back: New vessels can invade the iris and anterior chamber, causing sight-threatening closed-angle glaucoma.
    src: { page: 34, quote: "new vessels can invade the iris and the anterior chamber, leading to sight threatening closed-angle glaucoma." }
    status: unverified
  # ---------- p35: retinopathy care ----------
  - id: dm.L03.055
    kind: table
    topic: retinopathy-care
    title: Retinopathy screening
    columns: [Situation, First exam / follow-up]
    rows:
      - [Type 1, "Within 3–5 years of diagnosis"]
      - [Type 2, At diagnosis]
      - [Both, Repeat annually]
      - [Pregnancy with pre-existing diabetes, "Before pregnancy or in the first trimester; then every trimester and for 1 year postpartum"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 35, quote: "fundus examination is recommended within 3 to 5 years of diagnosis of type 1 diabetes, and at the time of diagnosis in type 2 patients." }
    status: unverified
    tags: [high-yield]
  - id: dm.L03.056
    kind: card
    topic: retinopathy-care
    front: Eye exams in pregnancy with pre-existing diabetes?
    back: Before pregnancy or in the first trimester, then every trimester and for 1 year postpartum, depending on the degree of retinopathy.
    src: { page: 35, quote: "Eye examinations should occur before pregnancy or in the first trimester in patients with preexisting type 1 or type 2 diabetes" }
    status: unverified
  - id: dm.L03.057
    kind: card
    topic: retinopathy-care
    front: Besides glucose, what else should be optimized to slow retinopathy?
    back: Blood pressure and serum lipids.
    src: { page: 35, quote: "Optimize blood pressure and serum lipid control to reduce the risk or slow the progression of diabetic retinopathy." }
    status: unverified
  - id: dm.L03.058
    kind: card
    topic: retinopathy-care
    front: Indication for panretinal laser photocoagulation?
