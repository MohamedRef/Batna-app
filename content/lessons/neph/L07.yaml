      - kind: explain
        page: 182
        title: "تحت الـ light microscope"
        quote: "Pathology Alport syndrome (LM) There are no pathognomonic lesions by light microscopy or immuno- fluorescence in AS. In affected males, biopsies obtained before 5 years of age typically show no light microscopy changes. Mesangial hyper-cellularity and matrix expansion are typically observed in older children and adolescents. Glomeruli of affected males eventually show focal segmental glomerulosclerosis (FSGS), and interstitial fibrosis and tubular atrophy are often found in affected boys older than 10 years."
        text: |
          **Alport**:
          - light microscopy (LM) و immunofluorescence (IF) **مفيهمش حاجة pathognomonic**.
          - في الولاد: قبل 5 سنين الـ LM طبيعي، بعدين **mesangial hypercellularity و matrix expansion** في الأطفال الأكبر والمراهقين، وفي الآخر **focal segmental glomerulosclerosis (FSGS)**، و interstitial fibrosis و tubular atrophy بعد 10 سنين.
          - علشان كده ==الـ EM هو المفتاح== (الشكل الجاي).

          ليه الـ LM مش كفاية؟ التفسير المقبول (مش في الكتاب): الـ LM بيشوف الخلايا والـ matrix، بس عيب الـ Alport في **تركيب** الـ basement membrane نفسه، وده أرفع من إن الـ LM يشوفه. والتغييرات اللي بتبان على الـ LM (mesangial expansion و FSGS) مش خاصة بالـ Alport، بتحصل في أي كلية بتخسر nephrons. علشان كده محتاجين الـ EM اللي بيشوف طبقات الـ GBM.
      - kind: reveal
        page: 182
        quote: "In affected males, biopsies obtained before 5 years of age typically show no light microscopy changes."
        prompt: "ليه الـ biopsy في ولد Alport عنده 4 سنين ممكن تطلع طبيعية تحت الـ LM؟"
        answer: |
          الكتاب: قبل **5 سنين** الـ LM غالبًا طبيعي، بعدين mesangial hypercellularity، وفي الآخر **FSGS** و interstitial fibrosis بعد 10 سنين.

          التفسير المقبول (مش في الكتاب): الـ collagen الغلط بيتحط من الأول، بس الضرر الواضح (التشققات، الـ scarring) بيتراكم **سنة ورا سنة** مع الضغط والفلترة. الـ LM ما بيشوفش غير الضرر الكبير، إنما الـ ==EM== بيشوف الـ GBM نفسه، علشان كده هو المفتاح.
      - kind: figure
        page: 183
        quote: "Alport syndrome (EM) EM frequently reveals diagnostic abnormalities. In most patients with AS there is variable thickening, thinning, basket weaving, and lamellation of the GBM (Fig. 46.7). The thick segments measure up to 1200 nm in depth, usually have irregular outer and inner contours, and are found more frequently in males than in females. The lamina densa is transformed into a heterogeneous network of membranous strands, which enclose clear electron-lucent areas that may contain round granules of variable density measuring 20 to 90 nm in diameter. There are variable degrees of epithelial foot process fusion."
