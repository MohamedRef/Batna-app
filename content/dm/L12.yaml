items:
  # ---------- p142: CKD burden ----------
  - id: dm.L12.001
    kind: card
    topic: ckd-burden
    front: How is CKD defined, whatever its cause?
    back: Kidney damage or decreased kidney function for 3 months or more.
    src: { page: 142, quote: "defined as either kidney damage or decreased kidney function for ≥ 3 months" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.002
    kind: cloze
    topic: ckd-burden
    text: "Diabetes is the {{c1::most common cause}} of renal failure."
    src: { page: 142, quote: "Diabetes is The Most Common Cause of Renal Failure." }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.003
    kind: cloze
    topic: ckd-burden
    text: "ESRD incidence among diabetics in the United States {{c1::tripled}} between 1989 and 1998, while ESRD from hypertension stayed {{c2::relatively stable}}."
    src: { page: 142, quote: "Incidence of ESRD among diabetics in the United States tripled between 1989 and 1998" }
    status: unverified
    tags: [numbers]
  - id: dm.L12.004
    kind: card
    topic: ckd-burden
    front: Which cause of renal failure leads in Native American versus African American ESRD populations (book p142)?
    back: Diabetes leads in Native Americans; hypertension leads in African Americans.
    src: { page: 142, quote: "hypertension is the most common cause of renal failure in the African American ESRD population" }
    status: unverified
  - id: dm.L12.005
    kind: card
    topic: ckd-burden
    front: How do ESRD rates from diabetes and hypertension compare with glomerulonephritis?
    back: ESRD incidence from hypertension and diabetes stays substantially higher than from glomerulonephritis and other diseases.
    src: { page: 142, quote: "remain substantially higher than these rates for glomerulonephritis and other diseases" }
    status: unverified
  - id: dm.L12.006
    kind: enumerate
    topic: ckd-burden
    prompt: Challenges in managing diabetes in patients with renal impairment (book p142–143)?
    points:
      - Lack of adequate glycemic control
      - "Management of co-morbid conditions"
      - Caution in choosing oral antidiabetics
      - Problem in insulin metabolism
      - Reduced gluconeogenesis
      - Hypoglycemia
      - Dietary restrictions and teamwork among physicians
    pass: 5
    src: { page: 143, quote: "Consideration & caution in choosing Oral anti diabetics due to:" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.007
    kind: enumerate
    topic: ckd-burden
    prompt: Why must oral antidiabetics be chosen with caution in renal impairment (the three reasons listed)?
    points:
      - Problem in insulin metabolism
      - Reduced gluconeogenesis
      - Higher incidence of hypoglycemia
    pass: 3
    src: { page: 143, quote: "Problem in Insulin Metabolism 3. Reduce Gluconeogenesis 4. Incidence of Hypoglycemia" }
    status: unverified
  # ---------- p143: diagnosis ----------
  - id: dm.L12.008
    kind: enumerate
    topic: dkd-diagnosis
    prompt: The typical presentation of diabetic kidney disease?
    points:
      - Long-standing duration of diabetes
      - Retinopathy
      - Albuminuria without gross hematuria
      - Gradually progressive loss of eGFR
    pass: 4
    src: { page: 143, quote: "include a long-standing duration of diabetes, retinopathy, albuminuria without gross hematuria, and gradually progressive loss of eGFR" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.009
    kind: card
    topic: dkd-diagnosis
    front: How can DKD break the typical pattern in type 2 and type 1 diabetes?
    back: In type 2, CKD signs can be present at diagnosis or without retinopathy; reduced eGFR without albuminuria is frequently reported in both type 1 and type 2.
    src: { page: 143, quote: "reduced eGFR without albuminuria has been frequently reported in type 1 and type 2 diabetes" }
    status: unverified
  - id: dm.L12.010
    kind: card
    topic: dkd-diagnosis
    front: What is non-albuminuric DKD (NADKD)?
    back: Diabetic kidney disease with reduced eGFR but no albuminuria; the main cause of the renal impairment is intrarenal arteriosclerosis.
    src: { page: 143, quote: "Intrarenal arteriosclerosis is the main cause of renal impairment" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.011
    kind: cloze
    topic: dkd-diagnosis
    text: "The prevalence of NADKD varies from {{c1::14.29}} to {{c2::56.6%}} among diabetic patients of different ethnicities."
    src: { page: 143, quote: "Prevalence of NADKD varies from 14.29 to 56.6% among diabetic patients" }
    status: unverified
    tags: [numbers]
  - id: dm.L12.012
    kind: enumerate
    topic: dkd-diagnosis
    prompt: Which macroangiopathy features are more prevalent in NADKD?
    points:
      - Increasing age
      - Hypertension
      - Atherosclerosis
      - Dyslipidemia
    pass: 3
    src: { page: 143, quote: "Macroangiopathy is found to be more prevalent in patients with NADKD (increasing age, hypertension, atherosclerosis, dyslipidemia)" }
    status: unverified
  - id: dm.L12.013
    kind: mcq
    topic: dkd-diagnosis
    stem: "A 68-year-old man with type 2 DM for 6 years, hypertension, dyslipidemia and carotid plaques has eGFR 48 ml/min/1.73 m² on repeated tests. Urine ACR is 12 mg/g, fundi show no retinopathy, urine sediment is bland. What is the most likely lesion behind his kidney disease?"
    options:
      - Intrarenal arteriosclerosis (non-albuminuric DKD)
      - Classic albuminuric diabetic glomerulosclerosis
      - IgA nephropathy
      - Minimal change disease
      - Acute interstitial nephritis
    answer: 0
    why:
      - "Correct: reduced eGFR without albuminuria, with macroangiopathy (age, HTN, atherosclerosis, dyslipidemia), fits NADKD; intrarenal arteriosclerosis is its main cause (p143)."
      - "Classic DKD shows albuminuria and usually retinopathy (p143)."
      - "IgA nephropathy brings hematuria and active sediment, which he lacks."
      - "Minimal change presents with nephrotic-range proteinuria, not ACR 12 mg/g."
      - "Nothing points to a drug reaction or active sediment."
    src: { page: 143, quote: "Macroangiopathy is found to be more prevalent in patients with NADKD" }
    status: unverified
  # ---------- p143-144: screening and staging ----------
  - id: dm.L12.014
    kind: enumerate
    topic: screening
    prompt: "DKD screening: what to test, how often, and in whom?"
    points:
      - "At least once a year"
      - "Urinary albumin (spot urine albumin-to-creatinine ratio)"
      - eGFR
      - "Type 1 diabetes of ≥5 years' duration"
      - All patients with type 2 diabetes
    pass: 5
    src: { page: 143, quote: "At least once a year, assess urinary albumin (e.g., spot urinary albumin-to-creatinine ratio) and estimated glomerular filtration rate (eGFR)" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.015
    kind: cloze
    topic: screening
    text: "Screen for DKD in type 1 diabetes once duration is {{c1::≥5 years}}, and in type 2 diabetes {{c2::from diagnosis (all patients)}}."
    src: { page: 143, quote: "In patients with type 1 diabetes with a duration of ≥5 years 2. In all patients with type 2 diabetes" }
    status: unverified
    tags: [numbers]
  - id: dm.L12.016
    kind: cloze
    topic: screening
    text: "Patients with urinary albumin >{{c1::30}} mg/g creatinine and/or eGFR <{{c2::60}} ml/min/1.73 m² are monitored {{c3::twice annually}}."
    src: { page: 144, quote: "Patients with urinary albumin >30 mg/g creatinine and/or an eGFR <60 mL/min/1.73 m2 should be monitored twice annually" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L12.017
    kind: enumerate
    topic: screening
    prompt: When should you consider non-diabetic kidney disease and/or a kidney biopsy in a diabetic patient? (10 clues)
    points:
      - Atypical presentation of renal disease
      - Absence of retinopathy (type 1)
      - "Albuminuria developing <5 or >25 years after onset (type 1)"
      - Immunological markers or active urinary sediment
      - Acute or sudden-onset macroalbuminuria or nephrotic syndrome
      - Nephritic syndrome
      - Hematuria
      - Rapid decline in renal function
      - "eGFR falls >30% after starting a RAAS inhibitor"
      - Acute kidney injury
    pass: 7
    src: { page: 144, quote: "When to consider non-DKD and/or pursue a kidney biopsy" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.018
    kind: mcq
    topic: screening
    stem: "A 34-year-old woman with type 1 DM for 2 years has new heavy proteinuria, red cell casts and eGFR falling from 95 to 60 ml/min/1.73 m² over 6 weeks. Fundoscopy is normal. What is the best next step?"
    options:
      - Work up for non-diabetic kidney disease and consider a kidney biopsy
      - Label it DKD and start an ACE inhibitor only
      - Recheck ACR in one year
      - Start an SGLT2 inhibitor and review in 6 months
      - "Reassure: early DKD is often rapid in type 1"
    answer: 0
    why:
      - "Correct: albuminuria <5 years after onset in type 1, no retinopathy, active sediment and rapid decline are all non-DKD clues (p144)."
      - "Calling it DKD ignores several red flags for another disease."
      - "Yearly screening is for stable patients; this is an active process."
      - "Kidney-protective drugs do not replace a diagnosis."
      - "DKD in type 1 does not usually appear at 2 years with active sediment."
    src: { page: 144, quote: "Albuminuria developing <5 or >25 the onset of disease (T1D)" }
    status: unverified
  - id: dm.L12.019
    kind: card
    topic: screening
    front: "On what three things is CKD classified (staging figure, p144)?"
    back: "Cause (C), GFR category (G) and albuminuria category (A): the CGA classification."
    src: { page: 144, quote: "CKD is classified based on" }
    status: unverified
  - id: dm.L12.020
    kind: table
    topic: screening
    title: "Albuminuria categories (KDIGO grid, p144)"
    columns: [Category, Description, ACR]
    rows:
      - [A1, Normal to mildly increased, "<30 mg/g (<3 mg/mmol)"]
      - [A2, Moderately increased, "30–299 mg/g (3–29 mg/mmol)"]
      - [A3, Severely increased, "≥300 mg/g (≥30 mg/mmol)"]
    blanks: [[0, 2], [1, 2], [2, 2], [1, 1]]
    src: { page: 144, quote: "<30 mg/g 30-299 mg/g" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L12.021
    kind: table
    topic: screening
    title: "GFR categories (KDIGO grid, p144), ml/min/1.73 m²"
    columns: [Category, Description, GFR]
    rows:
      - [G1, Normal or high, "≥90"]
      - [G2, Mildly decreased, "60–89"]
      - [G3a, Mildly to moderately decreased, "45–59"]
      - [G3b, Moderately to severely decreased, "30–44"]
      - [G4, Severely decreased, "15–29"]
      - [G5, Kidney failure, "<15"]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [5, 2]]
    src: { page: 144, quote: "GFR categories" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L12.022
    kind: mcq
    topic: screening
    stem: "A man with type 2 DM has eGFR 38 ml/min/1.73 m² and ACR 420 mg/g on two tests 4 months apart. How is his CKD staged?"
    options:
      - G3b A3
      - G3a A2
      - G4 A3
      - G3b A2
      - G2 A3
    answer: 0
    why:
      - "Correct: eGFR 30–44 = G3b; ACR ≥300 mg/g = A3 (p144)."
      - "G3a is 45–59 and A2 is 30–299 mg/g."
      - "G4 is 15–29."
      - "420 mg/g is above 299, so A3, not A2."
      - "G2 is 60–89."
    src: { page: 144, quote: "<30 mg/g 30-299 mg/g" }
    status: unverified
    tags: [numbers]
  # ---------- p145-146: management of DKD ----------
  - id: dm.L12.023
    kind: card
    topic: dkd-management
    front: What is the goal of DKD management in type 2 diabetes?
    back: Cardiorenal risk reduction in high-risk patients, on top of comprehensive cardiovascular risk management.
    src: { page: 145, quote: "Goal: Cardiorenal Risk Reduction in High-Risk Patients with Type 2 Diabetes" }
    status: unverified
  - id: dm.L12.024
    kind: enumerate
    topic: dkd-management
    prompt: Main lines of treatment of DKD?
    points:
      - Lifestyle modification
      - Glycemic control
      - BP control
      - Control of dyslipidemia
    pass: 4
    src: { page: 145, quote: "Lifestyle modification 2. Glycemic control. 3. BP control. 4. Control of dyslipidemia" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.025
    kind: cloze
    topic: dkd-management
    text: "In non-dialysis DKD, dietary protein should be about {{c1::0.8 g/kg}} body weight per day, the {{c2::recommended daily allowance}}."
    src: { page: 145, quote: "dietary protein intake should be ~0.8 g/kg body weight per day (the recommended daily allowance)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L12.026
    kind: card
    topic: dkd-management
    front: Why may dialysis patients need more dietary protein?
    back: Malnutrition is a significant problem in some dialysis patients, so higher protein intake should be considered.
    src: { page: 145, quote: "malnutrition is a significant problem in some dialysis patients" }
    status: unverified
  - id: dm.L12.027
    kind: cloze
    topic: dkd-management
    text: "Restricting dietary sodium to <{{c1::2,300 mg/day}} may help control blood pressure and reduce cardiovascular risk."
    src: { page: 145, quote: "Restriction of dietary sodium (to <2,300 mg/day) may be useful to control blood pressure" }
    status: unverified
    tags: [numbers]
  - id: dm.L12.028
    kind: card
    topic: dkd-management
    front: On what are sodium and potassium advice in DKD individualized?
    back: Comorbid conditions, medication use, blood pressure and laboratory data.
    src: { page: 145, quote: "individualized based on comorbid conditions, medication use, blood pressure, and laboratory data" }
    status: unverified
  - id: dm.L12.029
    kind: card
    topic: dkd-management
    front: Which glucose-lowering classes should be considered in type 2 diabetes with CKD, and why?
    back: An SGLT2 inhibitor or a GLP-1 receptor agonist shown to reduce CKD progression, cardiovascular events, or both.
    src: { page: 145, quote: "consider use of a sodium–glucose cotransporter 2 inhibitor or glucagon-like peptide 1 receptor agonist" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.030
    kind: card
    topic: dkd-management
    front: Why optimize glucose and blood pressure control in DKD?
    back: Both reduce the risk or slow the progression of CKD.
    src: { page: 146, quote: "Optimize blood pressure control to reduce the risk or slow the progression of chronic kidney disease" }
    status: unverified
  - id: dm.L12.031
    kind: cloze
    topic: dkd-management
    text: "In nonpregnant diabetics with hypertension, an ACEi or ARB is {{c1::recommended}} for ACR 30–299 mg/g and {{c2::strongly recommended}} for ACR ≥300 mg/g and/or eGFR <60."
    src: { page: 146, quote: "It is strongly recommended for individuals with a urinary albumin-to-creatinine ratio of≥300 mg/g creatinine" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.032
    kind: card
    topic: dkd-management
    front: When should RAS blockade NOT be stopped after starting it?
    back: For a minor rise in serum creatinine (<30%) when there is no volume depletion.
    src: { page: 146, quote: "Do not discontinue renin-angiotensin system blockade for minor increases in serum creatinine (<30%) in the absence of volume depletion." }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.033
    kind: card
    topic: dkd-management
    front: What must be monitored periodically with ACE inhibitors, ARBs or diuretics in DKD?
    back: Serum creatinine and potassium, for rising creatinine or potassium changes.
    src: { page: 146, quote: "Periodically monitor serum creatinine and potassium levels" }
    status: unverified
  - id: dm.L12.034
    kind: mcq
    topic: dkd-management
    stem: "A 60-year-old woman with type 2 DM, BP 150/90 and ACR 450 mg/g starts ramipril. Two weeks later creatinine rose from 1.2 to 1.4 mg/dl (17%); she is not dehydrated and potassium is 4.8 mmol/L. What next?"
    options:
      - Continue ramipril and keep monitoring creatinine and potassium
      - "Stop ramipril: creatinine has risen"
      - Switch to an ARB plus ACE inhibitor
      - Halve the dose and stop monitoring
      - Refer for kidney biopsy
    answer: 0
    why:
      - "Correct: a rise <30% without volume depletion is not a reason to stop RAS blockade; monitor creatinine and K (p146)."
      - "Stopping loses renoprotection for an expected small rise."
      - "Dual RAS blockade is not in the lecture and raises K and AKI risk."
      - "Monitoring must continue with ACEi."
      - "A >30% eGFR fall after RAASi is the biopsy clue (p144); she is under it."
    src: { page: 146, quote: "Do not discontinue renin-angiotensin system blockade for minor increases in serum creatinine (<30%)" }
    status: unverified
  # ---------- p147-149: KDIGO, SGLT2i, GLP-1 RA ----------
  - id: dm.L12.035
    kind: enumerate
    topic: kdigo
    prompt: "KDIGO 2022 holistic approach in diabetes and CKD: the first-line drug therapy boxes?"
    points:
      - "SGLT2i: initiate at eGFR ≥20, continue until dialysis or transplant"
      - "Metformin if eGFR ≥30"
      - "RAS inhibitor at maximum tolerated dose if hypertensive"
      - Moderate- or high-intensity statin
    pass: 4
    src: { page: 147, quote: "KIDIGO 2022: Holistic approach for improving outcomes in patients with diabetes and CKD" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.036
    kind: enumerate
    topic: kdigo
    prompt: "KDIGO 2022 holistic approach: the targeted therapy boxes, and what guides each?"
    points:
      - "GLP-1 RA if needed for the glycemic target or persistent albuminuria (HbA1c, CGM)"
      - "Nonsteroidal MRA if persistent albuminuria and normal potassium (urine ACR)"
      - "Dihydropyridine CCB and/or diuretic for the BP target (BP)"
      - "Antiplatelet agent for clinical ASCVD (ASCVD risk, lipids)"
    pass: 4
    src: { page: 147, quote: "Targeted therapy" }
    status: unverified
  - id: dm.L12.037
    kind: card
    topic: kdigo
    front: "KDIGO 2022 figure: what comes after targeted therapy, and how often are risk factors reassessed?"
    back: "Other glucose-lowering drugs for the glycemic target; a steroidal MRA for resistant hypertension if eGFR ≥45; ezetimibe, PCSK9i or icosapent ethyl by ASCVD risk and lipids. Reassess every 3–6 months. The base stays healthy diet, physical activity, smoking cessation and weight management."
    src: { page: 147, quote: "Healthy diet Physical activity Smoking cessation Weight management" }
    status: unverified
  - id: dm.L12.038
    kind: card
    topic: kdigo
    front: "KDIGO 2022 lifestyle base for diabetes with CKD?"
    back: Healthy diet, physical activity, smoking cessation and weight management.
    src: { page: 147, quote: "Healthy diet Physical activity Smoking cessation Weight management" }
    status: unverified
  - id: dm.L12.039
    kind: cloze
    topic: kdigo
    text: "In KDIGO 2022 an SGLT2 inhibitor is initiated at eGFR ≥{{c1::20}} and continued until {{c2::dialysis or transplant}}; metformin is used if eGFR ≥{{c3::30}}."
    src: { page: 147, quote: "KIDIGO 2022: Holistic approach for improving outcomes in patients with diabetes and CKD" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L12.040
    kind: mcq
    topic: kdigo
    stem: "A 63-year-old man with type 2 DM and hypertension has eGFR 26 ml/min/1.73 m², ACR 600 mg/g and HbA1c 7.6% on metformin 1 g twice daily and perindopril. Following the book's KDIGO 2022 figure, what is the best change?"
    options:
      - Stop metformin and start an SGLT2 inhibitor
      - Continue metformin and avoid SGLT2i below eGFR 30
      - Add a steroidal MRA now
      - Stop perindopril because of the low eGFR
      - Add glimepiride 4 mg
    answer: 0
    why:
      - "Correct: in first-line drug therapy, metformin is only for eGFR ≥30; an SGLT2i can be initiated at eGFR ≥20 and continued to dialysis (p147)."
      - "Metformin is below its eGFR threshold; SGLT2i can start from 20."
      - "A steroidal MRA is for resistant hypertension and only if eGFR ≥45."
      - "The RAS inhibitor stays at maximum tolerated dose."
      - "Glimepiride is started at only 1 mg in CKD (p150) and brings hypoglycemia."
    src: { page: 147, quote: "First-line drug therapy" }
    status: unverified
  - id: dm.L12.041
    kind: order
    topic: kdigo
    prompt: "How do SGLT2 inhibitors protect the kidney? Put the steps of the book's figure in order."
    steps:
      - "SGLT2 inhibition: less sodium and glucose reabsorbed in the proximal tubule"
      - More sodium reaches the distal tubule (macula densa)
      - More adenosine is produced
      - Afferent arteriole constricts
      - Intraglomerular pressure falls
      - Hyperfiltration is attenuated
    src: { page: 148, quote: "Nephroprotective Effect of SGLT2 Inhibitors" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.042
    kind: card
    topic: kdigo
    front: "How do SGLT2 inhibitors and RAAS blockade each lower intraglomerular pressure (p148 figure)?"
    back: "SGLT2 inhibition constricts the afferent arteriole; RAAS blockade dilates the efferent arteriole. Together they add up."
    src: { page: 148, quote: "Afferent vasomodulation (constriction)" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.043
    kind: enumerate
    topic: kdigo
    prompt: Putative DIRECT renoprotective effects of GLP-1 receptor agonists (p149 table)?
    points:
      - Proximal tubular natriuresis
      - Modulation of cAMP/PKA signaling
      - Inhibition of the renin–angiotensin system
      - Less renal hypoxia
      - Less glomerular atherosclerosis (?)
      - Renal endothelium-dependent vasodilation
      - "More tubuloglomerular feedback (less NHE3 activity)"
      - More ANP (?)
    pass: 5
    src: { page: 149, quote: "Putative renoprotective actions and effects of GLP-1R agonists on kidneys." }
    status: unverified
  - id: dm.L12.044
    kind: enumerate
    topic: kdigo
    prompt: Putative INDIRECT renoprotective effects of GLP-1 receptor agonists (p149 table)?
    points:
      - Improved glycemic control
      - Improved blood pressure control
      - Weight loss
      - More insulin sensitivity
      - Less postprandial glucagon
      - Less intestinal lipid uptake
      - Brown adipose tissue activation
      - Effects on the microbiome (?)
    pass: 5
    src: { page: 149, quote: "Improved glycemic control" }
    status: unverified
  - id: dm.L12.045
    kind: table
    topic: kdigo
    title: "Renal excretion of DPP-4 inhibitors (p149)"
    columns: [Drug, Renal share, In renal impairment]
    rows:
      - [Linagliptin, "5%", No dose adjustment or extra monitoring]
      - [Sitagliptin, "87%", Dose adjustment needed]
