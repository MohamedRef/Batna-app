      - kind: explain
        page: 38
        quote: "An increase in gastrin of ≥120 pg within 15 min of secretin injection has a sensitivity and specificity of >90% for ZES."
        title: "الـ secretin test"
        text: |
          الـ provocative tests اتنين: **secretin stimulation** و **calcium infusion**، والـ ==secretin== هو **the most sensitive and specific**.

          - Positive = gastrin يزيد **≥120 pg** خلال **15 min** من الحقن ← sensitivity و specificity أكتر من **90%**.
          - **وقف الـ PPI أسبوع** قبله، لأن الـ hypochlorhydria بتاعته بتعمل **false positive**.
          - وفي الـ localization: **CT/MRI**، **EUS** (بيشوف الـ pancreas والـ LN بس **مش بيشوف الـ duodenal lesions**)، **octreotide scan**، و surgery.
      - kind: case
        page: 37
        quote: "Family history of pancreatic islet, pituitary, or parathyroid tumor"
        stem: "A 41-year-old woman has recurrent post-bulbar ulcers on standard PPI, watery diarrhea, and a calcium of 11.2 mg/dL. H. pylori negative; no NSAIDs."
        steps:
          - question: "First test?"
            options: ["Serum gastrin off PPI for one week", "Secretin test on PPI", "CT abdomen", "Octreotide therapy"]
            answer: 0
            why: "الـ algorithm بيبدأ بـ **serum gastrin off PPI (one week)**."
          - reveal: "Gastrin 1,450 pg/mL."
            question: "Next?"
            options: ["Gastric pH probe off PPI", "Secretin test", "Surgery now", "Repeat gastrin in a year"]
            answer: 0
            why: "≥1000 pg/mL ← **gastric pH probe**؛ لو ≤4.0 نروح للـ localization."
          - reveal: "pH 2.0. EUS finds a pancreatic tumor. No liver metastases."
            question: "What does her hypercalcemia make you evaluate?"
            options: ["MEN1 (calcium, pituitary imaging)", "Sarcoidosis", "Vitamin D toxicity", "Nothing more"]
            answer: 0
            why: "من غير liver mets ← **evaluate for MEN1**. والـ hypercalcemia أصلًا من علامات الشك."
      - kind: try
        items: [git.L01.132, git.L01.140, git.L01.149, git.L01.155]
    recap:
