          </svg>
      - kind: explain
        page: 377
        title: "الهدف والولادة"
        quote: "delivery is recommended at 37 weeks or later if no severe features such as hemolysis, thrombocytopenia, or liver dysfunction are observed"
        text: |
          - **CHIPS**: الضبط الشديد قلّل الـ severe hypertension بس من غير فرق في النتيجة. **CHAP**: ==<140/90== قلّل النتايج السيئة (30.2% مقابل 37%). فالهدف على الغسيل <140/90.
          - Preeclampsia من غير severe features: ولادة عند ==37 أسبوع==. مع severe features: استقرار وولادة عند **34** أو بعدها، و steroids لو قبل 34.
          - **Magnesium sulfate** بجرعة **أقل**: الكلية هي اللي بتطلّعه.
      - kind: explain
        page: 378
        title: "المتابعة"
        quote: "The incidence of cervical incompetence is high in women treated with dialysis, and screening is suggested between 18 and 20 weeks."
        text: |
          75-80% بس بيوصلوا الـ second trimester بطفل عايش، و **82%** منهم preterm.
          - **Cervical incompetence**: screening في ==18-20 أسبوع==.
          - **Preeclampsia**: ضغط و CBC و LFTs **مرتين في الشهر**.
          - قلل تقلبات الضغط في الجلسة (uteroplacental insufficiency)، واعمل **fetal anomaly scan**.
      - kind: figure
        page: 380
        quote: "Figure 4: Hemodialysis during pregnancy"
        title: "روشتة الـ HD للحامل (Fig 4)"
        alt: "A prescription card for hemodialysis in pregnancy: 4 to 6 sessions of 4 to 6 hours a week to keep predialysis blood urea under 50 mg/dL; dialysate potassium 3 to 3.5, bicarbonate 25 to 30, calcium 2.5; biocompatible single-use dialyzer; dry weight up by up to 0.5 kg a week in the second and third trimesters; 35 kcal per kg and 1.8 g protein per kg a day; low-dose aspirin from 12 weeks; nocturnal option 7 to 8 hours, 5 to 7 nights."
        caption: "احفظها كروشتة. الرقم الأهم: ==BUN <50 mg/dL== قبل الجلسة. والـ bicarbonate **أقل** من العادي."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="320" height="290" rx="10" class="fg-ink"/>
            <text x="165" y="28" text-anchor="middle" class="t-b">Rx: HD in pregnancy</text>
            <rect x="15" y="38" width="300" height="40" rx="6" class="fg-acc"/>
