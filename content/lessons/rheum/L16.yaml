        prompt: "ليه الـ scleritis بيوجع وممكن ياخد النظر، والـ episcleritis لأ؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ **episclera** طبقة رقيقة سطحية فوق الـ sclera، التهابها احمرار من غير ضرر، فالكتاب بيقولها **benign**. الـ ==sclera== نفسها هي جدار العين، أعمق ومليانة أعصاب، فالتهابها يوجع، ولو امتد للجوّه يعمل **uveitis** و **secondary glaucoma** والنظر يقل.

