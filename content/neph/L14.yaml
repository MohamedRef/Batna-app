    src: { page: 470, quote: "Figure 3: Management of patients with end-stage renal disease caused by atypical hemolytic uremic syndrome (aHUS). The decisions of renal transplantation could be made according to the molecular results from both recipients and donors. Prophylactic anti-C5 monoclonal antibody is determined by the relapse risk after transplantation by the molecular results." }
