items:
  # ---------- slides 2-11: definition and components ----------
  - id: res.L02.001
    kind: card
    topic: definition
    front: Define epidemiology.
    back: The study of the frequency, distribution and determinants of health-related phenomena in the human population.
    src: { page: 3, quote: "Epidemiology is the study of:\n  Frequency\n  Distribution\n  Determinants\nof health related phenomenon in the human population." }
    status: unverified
    tags: [high-yield]
  - id: res.L02.002
    kind: cloze
    topic: definition
    text: "The three components of epidemiology are disease {{c1::frequency}}, {{c2::distribution}} and {{c3::determinants}}."
    src: { page: 7, quote: "Components Of Epidemiology:\n  Disease frequency\n  Distribution of disease\n  Determinants of disease" }
    status: unverified
  - id: res.L02.003
    kind: table
    topic: definition
    title: The components of epidemiology
    columns: [Component, What it covers, Branch]
    rows:
      - [Frequency, Rates and ratios, "Measurement (this lecture)"]
      - [Distribution, "Who? When? Where?", Descriptive epidemiology]
      - [Determinants, Test hypotheses and identify causes or risk factors, Analytic epidemiology]
    blanks: [[0, 1], [1, 1], [1, 2], [2, 2]]
    src: { page: 8, quote: "Components:\n  1. Frequency: Rates & Ratios\n  2. Distribution: Who? When? Where? Descriptive epidemiology" }
    status: unverified
  - id: res.L02.004
    kind: card
    topic: definition
    front: What is "distribution" in epidemiology, and what is "determinants"?
    back: "Distribution: how disease distributes in the human population (who, when, where). Determinants: what determines differences in disease risk among different population subgroups."
    src: { page: 6, quote: "Epidemiology: What determines differences in disease risk among different population subgroups (\"Determinants\")" }
    status: unverified
  - id: res.L02.005
    kind: mcq
    topic: definition
    stem: A study maps hepatitis B virus (HBV) prevalence by country as low (<2%), intermediate (2-8%) and high (>8%) endemicity. Which component of epidemiology does it describe?
    options: [Distribution, Determinants, Frequency only, Intervention]
    answer: 0
    why:
      - Correct. Where the disease is, and how much in each place, is its distribution (slides 4-5).
      - Determinants would explain why risk differs between groups.
      - It does use frequency, but mapping it by place is distribution.
      - No intervention is tested.
    src: { page: 5, quote: "Hepatitis B endemicity map:\n  Low endemicity <2%\n  Intermediate endemicity 2-8%\n  High endemicity >8%\n  No data" }
    status: unverified
  - id: res.L02.006
    kind: card
    topic: definition
    front: How does knowledge of frequency and distribution lead to analytic epidemiology?
    back: Frequency and distribution let you formulate a hypothesis about possible causal or preventive factors. Analytic epidemiology then tests the hypothesis and identifies causes or risk factors (determinants).
    src: { page: 9, quote: "Knowledge of frequency and distribution leads to:\n  Formulate hypothesis\n  Possible causal or preventive factors\n3. Determinants: Analytic epidemiology. Test hypothesis and identify causes or risk factors" }
    status: unverified
  - id: res.L02.007
    kind: table
    topic: definition
    title: Descriptive vs analytic epidemiology
    columns: [Branch, What it does]
    rows:
      - [Descriptive, "Examines, identifies and reports the frequency and distribution of disease in a population"]
      - [Analytic, "Identifies factors underlying disease; tests a hypothesis by studying how exposures relate to outcomes"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 10, quote: "Broad Characterizations of Epidemiology Practices:\n  Descriptive Epidemiology: Examining, identifying, and reporting on the frequency and distribution of disease in a population. Learning the basic features of its distribution.\n  Analytic Epidemiology: Identifying factors underlying disease or health events. Testing a hypothesis by studying how exposures relate to outcomes" }
    status: unverified
  - id: res.L02.008
    kind: order
    topic: definition
    prompt: Put the logical sequence of epidemiology in disease prevention in order.
    steps: [Descriptive, Analytical, Interventions, Programs]
    src: { page: 11, quote: "There is a logical sequence to the practice of epidemiology in disease prevention:\n  Descriptive → Analytical → Interventions → Programs → Disease prevention" }
    status: unverified
  # ---------- slides 12-15: uses ----------
  - id: res.L02.009
    kind: enumerate
    topic: uses
    prompt: List the uses of epidemiology (5).
    points:
      - Natural history of disease
      - Classification of disease
      - Identify determinants (risk factors)
      - Planning and evaluation
      - Data on availability, accessibility and utilization (of services)
    pass: 4
    hook: "الإبيديميولوجي بتنفع في 5 «قصة المرض، ترتيبه، أسبابه، خطته، وخدماته»: natural history، classification، determinants (risk factors)، planning وevaluation، وdata عن availability وaccessibility وutilization للخدمات."
    src: { page: 12, quote: "Uses of Epidemiology:\n  1. Natural history of disease\n  2. Classification of disease\n  3. Identify determinants (risk factors)\n  4. Planning and evaluation\n  5. Data related to availability, accessibility and utilization" }
    status: unverified
    tags: [high-yield]
  - id: res.L02.010
    kind: order
    topic: uses
    prompt: Order the stages of the natural history of disease.
    steps:
      - Stage of susceptibility
      - Stage of subclinical disease
      - Stage of clinical disease
      - Stage of recovery, disability or death
    src: { page: 13, quote: "Natural history of disease timeline:\n  Exposure, then Pathologic Changes, then Onset of Symptoms, then Usual Time of Diagnosis\n  Stage of Susceptibility\n  Stage of Subclinical Disease\n  Stage of Clinical Disease\n  Stage of Recovery, Disability or Death\nSource: Centers for Disease Control and Prevention. Principles of epidemiology, 2nd ed. Atlanta: U.S. Department of Health and Human Services; 1992." }
    status: unverified
  - id: res.L02.011
    kind: mcq
    topic: uses
    stem: In the natural history timeline, which event marks the start of the stage of subclinical disease?
    options: [Pathologic changes, Exposure, Onset of symptoms, Usual time of diagnosis]
    answer: 0
    why:
      - Correct. Exposure happens in susceptibility; pathologic changes open the subclinical stage.
      - Exposure comes earlier, in the stage of susceptibility.
      - Onset of symptoms starts the stage of clinical disease.
      - Diagnosis usually comes after the onset of symptoms, within clinical disease.
    src: { page: 13, quote: "Natural history of disease timeline:\n  Exposure, then Pathologic Changes, then Onset of Symptoms, then Usual Time of Diagnosis\n  Stage of Susceptibility\n  Stage of Subclinical Disease\n  Stage of Clinical Disease\n  Stage of Recovery, Disability or Death\nSource: Centers for Disease Control and Prevention. Principles of epidemiology, 2nd ed. Atlanta: U.S. Department of Health and Human Services; 1992." }
    status: unverified
  - id: res.L02.012
    kind: card
    topic: uses
    front: How does epidemiology classify diseases, compared with clinicians?
    back: "Clinically: by presentation (diarrheal, respiratory, febrile diseases), which guides treatment. Epidemiologically: by mode of transmission (water-borne, food-borne, vector-borne), which guides prevention."
    src: { page: 14, quote: "Classification of diseases\n| Clinically | Epidemiology |\n|---|---|\n| diarrheal diseases; Respiratory diseases; Febrile diseases | By mode of transmission: Water born; Food borne; Vector born |\n| → Treatment | → prevention |\nExample: a man with high fever ---- malaria" }
    status: unverified
  - id: res.L02.013
    kind: card
    topic: uses
    front: Give examples of epidemiology used for planning and evaluation.
    back: Measuring the extent of a health problem to plan health services, evaluating an immunization program, and data on the availability, accessibility and utilization of services.
    src: { page: 15, quote: "Planning and evaluation. Example:\n  The extent of a health problem for planning health services\n  Evaluation of an immunization program\nData related to availability, accessibility and utilization" }
    status: unverified
  # ---------- slides 16-20: sources ----------
  - id: res.L02.014
    kind: enumerate
    topic: sources
    prompt: List the 9 sources of epidemiological data.
    points:
      - Census
      - Population estimates
      - Vital records (birth and death registration)
      - Notification of infectious diseases
      - Disease registers
      - Hospital records (inpatient and outpatient)
      - Special subgroups records
      - Morbidity surveys
      - Record linkage
    pass: 7
    hook: "مصادر الداتا 9 = «عدّ، سجلات، واستطلاع وربط»: census وpopulation estimates (2)؛ vital records (مواليد ووفيات)، notification of infectious diseases، disease registers، hospital records (inpatient وoutpatient)، special subgroups records (5)؛ وmorbidity surveys وrecord linkage (2). 2 + 5 + 2 = 9."
    src: { page: 16, quote: "Sources of epidemiological data:\n  1. Census\n  2. Population estimates: Planning services; Computing rates\n  3. Vital Records:\n    Birth registration\n    Death registration" }
    status: unverified
    tags: [high-yield]
  - id: res.L02.015
    kind: card
    topic: sources
    front: What is record linkage?
    back: "Linking records that belong to the same individual from different sources, e.g. their hospital, school and work records, for a fuller picture of their health (the lecturer's example in the recording)."
    src: { page: 20, quote: "7. Special subgroups records\n8. Morbidity Surveys\n9. Record Linkage: To link records that belong to the same individual from different sources" }
    status: unverified
  - id: res.L02.016
    kind: mcq
    topic: sources
    stem: The National Cancer Registry in Egypt is an example of which source of epidemiological data?
    options: [Disease registers, Vital records, Notification of infectious diseases, Census]
    answer: 0
    why:
      - Correct. Registers cover diseases of public health importance (cancer, tuberculosis (TB), hepatitis).
      - Vital records are birth and death registration.
      - Notification is for infectious diseases and shows their fluctuation.
      - The census counts the population; it is used to plan services and compute rates.
    src: { page: 18, quote: "5. Disease registers: Diseases of public health importance\nExamples:\n  National cancer registry in EGYPT\n  Tuberculosis\n  Hepatitis" }
    status: unverified
  - id: res.L02.017
    kind: card
    topic: sources
    front: What are the census and population estimates used for, and what does notification of infectious diseases show?
    back: "Census and population estimates: planning services and computing rates (they give the denominators). Notification: the fluctuation of infectious disease occurrence, for planning and evaluation."
    src: { page: 16, quote: "Sources of epidemiological data:\n  1. Census\n  2. Population estimates: Planning services; Computing rates\n  3. Vital Records:\n    Birth registration\n    Death registration" }
    status: unverified
  # ---------- slides 21-23: counts, proportions, rates ----------
  - id: res.L02.018
    kind: card
    topic: measures
    front: Give the lecture's example of counting cases (raw numbers).
    back: A health planner counts the cases of malaria seen last year to estimate how many chloroquine tablets to order for next year.
    src: { page: 21, quote: "Measures of Disease Frequency:\n  1. Counting cases (raw numbers). Example: A health planner may want to know the number of cases of malaria seen in the last year, so that they can estimate how many chloroquine tablets to order for the next year.\n  2. Proportions (%). Example: Of the 120 cases of malaria admitted to hospital X last year, 80 were children. The proportion (percentage) of children among cases is (80/120) x 100 or 66.7%." }
    status: unverified
  - id: res.L02.019
    kind: mcq
    topic: measures
    stem: Of 120 cases of malaria admitted to a hospital last year, 80 were children. What is the proportion of children among cases?
    options: ["66.7%", "40%", "80%", "150%"]
    answer: 0
    why:
      - Correct. 80/120 × 100 = 66.7%.
      - 40/120 would be 33%; 40% isn't from these numbers.
      - 80 is the count, not the percentage.
      - "That is 120/80: numerator and denominator are flipped."
    src: { page: 21, quote: "Measures of Disease Frequency:\n  1. Counting cases (raw numbers). Example: A health planner may want to know the number of cases of malaria seen in the last year, so that they can estimate how many chloroquine tablets to order for the next year.\n  2. Proportions (%). Example: Of the 120 cases of malaria admitted to hospital X last year, 80 were children. The proportion (percentage) of children among cases is (80/120) x 100 or 66.7%." }
    status: unverified
  - id: res.L02.020
    kind: card
    topic: measures
    front: Define a rate.
    back: The relative frequency of cases in a population during a specified period of time (usually one year). Usually expressed per 100 or per 1000 population. Examples are morbidity and mortality rates.
    src: { page: 22, quote: "3. Rates: the relative frequency of cases in a population during a specified period of time. e.g., Morbidity-Rates, Mortality-Rates" }
    status: unverified
  - id: res.L02.021
    kind: mcq
    topic: measures
    stem: What distinguishes a rate from a proportion?
    options:
      - A rate has a time dimension; a proportion does not
      - A proportion has a time dimension; a rate does not
      - A rate is always expressed as a percentage
      - A proportion's numerator is not part of its denominator
    answer: 0
    why:
      - Correct, slide 23.
      - The reverse is true.
      - Rates are usually per 100 or per 1000; attack rates are the ones usually given as percentages.
      - In a proportion the numerator is part of the denominator (80 children out of 120 cases).
    src: { page: 23, quote: "Rate:\n  Measures the occurrence of an event or disease in a given population during a given period (one Year). (Birth rate, growth rate, accident rate)\n  Usually expressed per 100 or per 1000 population.\n  It has a time dimension, whereas a PROPORTION does not." }
    status: unverified
    tags: [high-yield]
  # ---------- slides 24-29: incidence and attack rate ----------
  - id: res.L02.022
    kind: cloze
    topic: incidence
    text: "Incidence rate = number of {{c1::new}} cases during a specific period ÷ total {{c2::midperiod}} population {{c3::at risk}}."
    src: { page: 25, quote: "1. Incidence Rate = Number of new cases during a specific period / Total midperiod population at risk" }
    status: unverified
    tags: [high-yield]
  - id: res.L02.023
    kind: card
    topic: incidence
    front: Define the attack rate.
    back: A specific type of incidence rate, calculated for a narrowly defined population observed for a limited time, such as during an outbreak or epidemic, and usually expressed as a percentage (10ⁿ = 100).
    src: { page: 26, quote: "2. Attack Rate: An attack rate is a specific type of incidence rate. It is calculated for a narrowly defined population observed for a limited time, such as during an outbreak. It is usually expressed as a percentage, so 10ⁿ equals 100." }
    status: unverified
  - id: res.L02.024
    kind: cloze
    topic: incidence
    text: "Attack rate = {{c1::new cases among the population during the period}} ÷ population at risk at the {{c2::beginning}} of the period × 100. It measures the {{c3::probability or risk}} of becoming a case."
    src: { page: 28, quote: "For a defined population (the population at risk), during a limited time period. Remember, attack rates have some special characteristics:\n  Restricted to a special age group\n  Limited by \"place\" variables\n  Time period is usually brief: limited period of risk\n  Usually expressed as a percentage" }
    status: unverified
  - id: res.L02.025
    kind: enumerate
    topic: incidence
    prompt: List the special characteristics of attack rates.
    points:
      - Restricted to a special age group
      - Limited by "place" variables
      - Time period is usually brief (limited period of risk)
      - Usually expressed as a percentage
    pass: 3
    hook: "الـattack rate «ضيّق في كل حاجة» 4 «مين، فين، إمتى، وبكام في المية»: special age group، place variables، time period قصير (limited period of risk)، وبيتكتب percentage."
    src: { page: 28, quote: "For a defined population (the population at risk), during a limited time period. Remember, attack rates have some special characteristics:\n  Restricted to a special age group\n  Limited by \"place\" variables\n  Time period is usually brief: limited period of risk\n  Usually expressed as a percentage" }
    status: unverified
  - id: res.L02.026
    kind: calc
    topic: incidence
    calculator: attack_rate
    stem: Of 75 people who attended a wedding dinner, 46 developed gastroenteritis within the incubation period.
    question: What is the attack rate?
    inputs: { cases: 46, at_risk: 75 }
    expect: "61%"
    interpret: "46/75 × 100 = 61%. Among those at the dinner, the risk of gastrointestinal (GI) illness was 61%. The 29 who stayed well (39%) are not the rate."
    src: { page: 29, quote: "Example: Of 75 persons who attended a dinner, 46 subsequently developed a gastrointestinal illness. To calculate the attack rate of GI illness we first define the numerator and denominator:\n  x = Cases of GI illness occurring within the incubation period for GI illness among persons who attended the dinner = 46\n  y = Number of persons at the dinner = 75\nThen, the attack rate for GI illness is 46/75 x 100 = 61%\nIn this example, we could say that among persons who attended the dinner, the probability of developing GI illness was 61%, or the risk of developing GI illness was 61%." }
    status: unverified
    tags: [numbers]
  # ---------- slides 30-43: prevalence ----------
  - id: res.L02.027
    kind: table
    topic: prevalence
    title: Point vs period prevalence
    columns: [Measure, Numerator, Denominator]
    rows:
      - [Point prevalence, Existing cases at a specific point of time, Total midpoint population at risk]
      - [Period prevalence, Existing cases during a specific period of time, Total midperiod population at risk]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 31, quote: "Prevalence Rate:\n  Point prevalence = Number of existing cases at a specific point of time / Total midpoint population at risk\n  Period prevalence = Number of existing cases at a specific period of time / Total midperiod population at risk" }
    status: unverified
  - id: res.L02.028
    kind: enumerate
    topic: prevalence
    prompt: List the features of prevalence rates (slide 32).
    points:
      - Indicate the amount of illness requiring care
      - Affected by migration of diseased people
      - Easier to measure than incidence rate
    pass: 3
    hook: "الـ prevalence بتقولك 3: «قد إيه محتاجين رعاية، بتتأثر بالهجرة، وأسهل من الـ incidence» = amount of illness requiring care، affected by migration of diseased people، easier to measure than incidence."
    src: { page: 32, quote: "They indicate amount of illness requiring care.\nAffected by migration of diseased people.\nEasier to measure than incidence rate." }
    status: unverified
  - id: res.L02.029
    kind: table
    topic: prevalence
    title: Difference between incidence and prevalence
    columns: [Characteristic, Incidence, Prevalence]
    rows:
      - [What is measured, Rapidity of disease occurrence, Proportion of population with disease]
      - [Time of diagnosis, Newly diagnosed, Surviving cases diagnosed at any time]
      - [Period of time, Period of study that allows monitoring disease occurrence, Specific time]
      - [Denominator, Population at risk, Whole population]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [3, 1], [3, 2]]
    src: { page: 33, quote: "Difference between Incidence & Prevalence\n| Characteristic | What is measured | Time of disease diagnosis | Period of time | Denominator |\n|---|---|---|---|---|\n| Incidence | Rapidity of disease occurrence | Newly diagnosed | Period of study that allows monitoring disease occurrence | Population at-risk |\n| Prevalence | Proportion of population with disease | Surviving cases diagnosed at any time | Specific time | Whole population |" }
    status: unverified
    tags: [high-yield]
  - id: res.L02.030
    kind: case
    topic: prevalence
    stem: "A cohort of 30 people is followed for 3 years. In year 1, 5 develop the disease; in year 2, 7 more; in year 3, 4 more. Nobody recovers or dies."
    steps:
      - question: What is the prevalence of disease in year 2?
        options: ["40%", "23%", "28%", "53%"]
        answer: 0
        why: "Existing cases at year 2 = 5 + 7 = 12, over the whole sample of 30: 12/30 = 0.4 = 40%."
      - question: What is the incidence (risk) of disease in year 2?
        options: ["28%", "23%", "40%", "24%"]
        answer: 0
        why: "New cases in year 2 = 7. At risk = 30 − 5 already diseased = 25. 7/25 = 0.28 = 28%. Using 30 (23%) forgets that the 5 cases are no longer at risk."
      - question: "What is the incidence in year 3?"
        options: ["22%", "13%", "53%", "16%"]
        answer: 0
        why: "4 new cases over 30 − 12 = 18 still at risk: 4/18 = 22%."
    src: { page: 36, quote: "What is the incidence of disease in Year 2?\n  What is the numerator? 7 new cases in Year 2\n  What is the denominator? 25 people at risk (5 people already developed the disease in Year 1 and are thus not at risk)\n  Incidence = 7/25 = 0.28\nThe incidence (risk) of disease in Year 2 is 28%" }
    status: unverified
  - id: res.L02.031
    kind: cloze
    topic: prevalence
    text: "Prevalence = {{c1::incidence}} × {{c2::mean duration}}. With an incidence of 10 per 1000 per year and a mean duration of 5 years, prevalence = {{c3::50 per 1000}}."
    src: { page: 37, quote: "Prevalence = Incidence x Mean Duration\nExample:\n  Incidence = 10 cases per 1000 population per year\n  Mean Duration of Disease = 5 years\n  Prevalence = 10 x 5 = 50 per 1000 population" }
    status: unverified
    tags: [high-yield]
  - id: res.L02.032
    kind: card
    topic: prevalence
    front: How can a low-incidence disease become an important public health problem?
    back: If the disease is long (incurable and non-fatal), the prevalence becomes high relative to the incidence, as in diabetes.
    src: { page: 38, quote: "Notice the following: Low incidence diseases become important public health problems due to high prevalence. For example, if the incidence of a disease is low but the duration of disease (i.e. until recovery or death) is long (incurable disease and non fatal), the prevalence will be high relative to the incidence. For e.g diabetes" }
    status: unverified
  - id: res.L02.033
    kind: table
    topic: prevalence
    title: Incidence, duration and prevalence (slide 39)
    columns: [Disease, Incidence, Duration, Prevalence]
    rows:
      - [Cancer of the pancreas, Low, Short, Low]
      - [Common cold, High, Short, Low]
      - [Adult-onset diabetes, Low, Long, High]
      - [Essential hypertension, High, Long, High]
    blanks: [[0, 3], [1, 3], [2, 3], [3, 3], [1, 2]]
    src: { page: 39, quote: "Relationship Between Incidence and Prevalence (cont.)\n| Disease | Incidence | Duration | Prevalence |\n|---|---|---|---|\n| Cancer of the pancreas | low | short | low |\n| Common cold | high | short | low |\n| Adult onset diabetes | low | long | high |\n| Essential hypertension | high | long | high |" }
    status: unverified
  - id: res.L02.034
    kind: card
    topic: prevalence
    front: Explain the epidemiologist's bathtub.
    back: "Prevalence is the water in the tub. Incidence (new cases) is the tap filling it. Recovery (cure) and death (mortality) are the two drains emptying it. Prevalence = incidence × average duration, assuming constant incidence."
    src: { page: 40, quote: "Relationship Between Prevalence and Incidence: Prevalence = Incidence x Duration (avg), P = I x D\n  New/Incident Cases flow into the Prevalence \"Pot\"\n  Out migration: 1) cure (Recovery), 2) death (Mortality)\nNote: Assumes constant incidence (the epidemiologist's bathtub)" }
    status: unverified
  - id: res.L02.035
    kind: mcq
    topic: prevalence
    stem: If a drug prevents mortality but does not affect cure, which of the following will be true?
    options: [Prevalence will increase, Incidence will decrease, Incidence will increase, Prevalence will decrease]
    answer: 0
    why:
      - Correct, the slide's answer. Patients live longer with the disease, so the duration rises and the tub fills.
      - The drug acts after the disease starts; it does not prevent new cases.
      - Nothing creates new cases.
      - Closing the death drain without opening the cure drain raises prevalence.
    src: { page: 41, quote: "If a drug prevents mortality but does not affect cure, then which of the following will be true:\n  (a) Incidence will decrease\n  (b) Incidence will increase\n  (c) Prevalence will decrease\n  (d) Prevalence will increase" }
    status: unverified
    tags: [high-yield, slide-question]
  - id: res.L02.036
    kind: mcq
    topic: prevalence
    stem: "Annual incidence = 20 per 10,000,000, annual mortality = 4 per 10,000,000, point prevalence = 80 per 10,000,000. What is the average duration of the disease?"
    options: ["4 years", "1 year", "2 years", "5 years", Insufficient data]
    answer: 0
    why:
      - "Correct. P = I × D, so D = P/I = 80/20 = 4 years."
      - Using the mortality (4) instead of the duration mixes the drains.
      - No combination of the given numbers gives 2.
      - "80/4 = 20, and 20/4 = 5: both use mortality wrongly."
      - P and I are enough.
    src: { page: 42, quote: "P = I * D\n80 = 20 * D\nD = 80/20 = 4 years" }
    status: unverified
    tags: [slide-question]
  - id: res.L02.037
    kind: mcq
    topic: prevalence
    stem: "In children under five, pneumococcal pneumonia incidence stayed roughly flat at about 10 per 100,000 from 1981 to 1991 while prevalence fell steadily from about 50 to below 20 per 100,000. What can you conclude?"
    options:
      - Recovery from the disease is becoming rapid
      - Primary prevention is successful due to vaccination
      - The duration of the disease is increasing
      - Incidence is decreasing
      - The rate of recovery remains the same
    answer: 0
    why:
      - "Correct. With incidence constant, P = I × D means the fall in prevalence comes from a shorter duration: faster recovery."
      - Successful primary prevention would lower the incidence, which is flat.
      - A longer duration would raise prevalence.
      - The incidence line is flat.
      - If recovery were unchanged, prevalence would not fall with a flat incidence.
    src: { page: 43, quote: "The incidence and prevalence rates of pneumococcal pneumonia in children under five years of age in a defined community are illustrated in the following figure (Fig. 5.1 Pneumococcal Pneumonia in Children Under Age Five, rate per 100,000, 1981 to 1991).\nQ 42. Possible conclusions that can be obtained from the data include:\n  (A) Primary prevention is successful due to vaccination\n  (B) The duration of the disease is increasing\n  (C) Incidence is decreasing\n  (D) Recovery from the disease is becoming rapid\n  (E) The rate of recovery remains the same" }
    status: unverified
    tags: [slide-question]
  # ---------- slides 44-50: secondary attack rate, recovery rate ----------
  - id: res.L02.038
    kind: card
    topic: secondary
    front: Define the secondary attack rate (SAR) and give its formula.
