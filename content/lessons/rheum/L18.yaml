        title: "الريق على قد الغدة"
        alt: "A ladder of three steps linked to remaining salivary gland function. Mild dysfunction: non-pharmacological stimulation. Moderate dysfunction: pharmacological stimulation. Severe dysfunction: saliva substitution. A note at the top: measure baseline salivary function first."
        caption: "قيس الـ **baseline salivary function** الأول. غدة لسه شغالة: ==stimulation==. غدة خلصت: **substitution**."
