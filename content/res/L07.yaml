  - id: res.L07.114
    kind: mcq
    topic: practice
    stem: Which research method best suits comparing cognitive behavioural therapy with a selective serotonin reuptake inhibitor (SSRI) in anxiety disorder?
    options:
      - Double blind and placebo controlled
      - Randomization and open label
      - Randomization and placebo controlled (unblinded)
      - Randomization and triple blind
    answer: 1
    why:
      - A patient always knows whether they are getting psychotherapy, so double blinding is impossible.
      - Randomize, but the label stays open because therapy versus a pill cannot be hidden.
      - Both arms are active treatments; no placebo is being compared.
      - Triple blinding is impossible when patients can see their treatment.
    src: { page: 121, quote: "Which of the following research methods is best suited to comparing cognitive behavioural therapy with a selective reuptake inhibitor in anxiety disorder:\n  a. Double blind and placebo controlled\n  b. Randomization and open label\n  c. Randomization and placebo controlled (un blinded)\n  d. Randomization and triple blind" }
    status: unverified
