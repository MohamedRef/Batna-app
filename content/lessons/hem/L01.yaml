      - kind: check
        page: 1
        quote: "The fetal liver becomes the main site of hematopoiesis in the second trimester of pregnancy"
        question: "What is the main site of haematopoiesis in the second trimester?"
        options:
          - "Fetal liver"
          - "Yolk sac"
          - "Fetal bone marrow"
          - "Thymus"
        answer: 0
        why:
          - "صح: الـ fetal liver هو المصنع الرئيسي في الـ second trimester."
          - "الـ yolk sac بيبدأ بدري خالص، يوم 14–19 من عمر الجنين."
          - "الـ fetal marrow بيبدأ في الـ third trimester."
          - "الـ thymus بيدرّب الـ T cells، مش المصنع الرئيسي للدم."
      - kind: explain
        page: 1
        title: "الـ red marrow بتنكمش وانت بتكبر"
        quote: "During the first 4 years of life, nearly all the marrow cavities contain red hemopoietic marrow with very few fat cells."
        text: |
          في أول ==4 سنين== تقريبًا كل تجاويف النخاع **red marrow** (شغالة)، والدهن قليل جدًا.

          بالتدريج الدهن بياخد مكانها. وعلى ==18 سنة== يفضل الشغل في:
          - الـ **axial skeleton** (الحوض، الفقرات، الضلوع، القص، الجمجمة)
          - **الطرف القريب** من الـ femur والـ humerus

          وباقي التجاويف **yellow fatty marrow**.
      - kind: reveal
        page: 1
        quote: "By the age of 18 years, the only sites of active hematopoiesis are the axial skeleton"
        prompt: "ليه في الكبار بنعمل الـ bone marrow aspirate من الـ iliac crest أو الـ sternum، مش من عضمة الرجل؟"
        answer: "لأن بعد 18 سنة الـ **active marrow** في الـ **axial skeleton** بس (والطرف القريب للفخد والعضد). عضمة الرجل في الكبير مليانة **yellow fat**، هتسحب دهن مش خلايا."
      - kind: aside
        tone: joke
        page: 1
        quote: "All the remaining marrow cavities contain yellow fatty marrow."
        text: "الـ marrow زي أي مصري بعد الأربعين: الدهون بتزحف على الأطراف الأول. 😄 بس النخاع على الأقل بيسيب الحوض والضهر شغالين."
      - kind: figure
