  - id: hem.L06.lesson7
    title: "Platelets، plasma، cryo، والـ derivatives"
    hook: "الـ plasma بتتفصل وتتجمد وتدوب على البارد وتتكسّر في مصنع: كل خطوة بتطلّع منتج ليه عيانه."
    minutes: 10
    pages: [90, 93]
    topics: [components, derivatives]
    goals:
      - "تعرف إمتى platelets وليه بتفشل أحيانًا (refractoriness)"
      - "تعرف إمتى FFP وإمتى cryo، وليه الـ FFP مش للـ volume"
      - "تعرف الـ derivatives: Rh immune globulin و albumin و IVIG والـ factors"
    status: unverified
    steps:
      - kind: explain
        page: 90
        title: "Platelets و الـ refractoriness"
        quote: "Immune-mediated: repeated transfusions especially with non-leukocyte reduced PLT and multiparity (alloimmunization to HLA and human PLT antigens)."
        text: |
          الـ platelets: **random donor** من الـ whole blood، أو **apheresis** (single donor). الاستخدام: **bleeding with thrombocytopenia** و **qualitative defects**.

          لو الـ count ما بيعلاش (==refractoriness==):
          - **Non-immune**: fever، infection، splenomegaly، disseminated intravascular coagulation (DIC)، massive bleeding، أدوية
          - **Immune**: transfusions كتير (خصوصًا non-leukoreduced) و **multiparity** ← antibodies ضد **Human leukocyte antigen (HLA)** و **human platelet antigen (HPA)**
          - العلاج: **HLA-compatible** أو **cross-match compatible** platelets

          ليه الـ immune refractoriness بتيجي مع النقل الكتير والحمل الكتير؟ لأن كل مرة الجسم بيشوف **HLA** و **HPA** غريبة (من متبرع أو من الجنين) فبيعمل ==alloantibodies==، وبعدين أي platelets جديدة بتتكسّر على طول. ولأن الـ HLA أغلبه على الـ WBCs، الـ **non-leukocyte reduced** platelets بتحسّس أكتر (التفسير المقبول، مش في الكتاب).
      - kind: check
        page: 90
        quote: "Immune-mediated: repeated transfusions especially with non-leukocyte reduced PLT and multiparity (alloimmunization to HLA and human PLT antigens)."
        question: "A woman with five previous pregnancies and acute leukaemia gets no platelet rise after several transfusions. No fever, no splenomegaly. Best next product?"
        options: ["HLA-compatible or cross-match compatible platelets", "More random-donor platelets", "Fresh frozen plasma", "Cryoprecipitate"]
        answer: 0
        why:
          - "صح: الـ multiparity بتشاور على immune refractoriness (HLA/HPA)، فالحل platelets متوافقة."
          - "نفس الـ antibodies هتكسّرها تاني."
          - "الـ FFP factors مش platelets."
          - "الـ cryo للـ fibrinogen، مش للـ platelets."
      - kind: explain
        remind: [hem.L06.043, hem.L06.042]
        page: 91
        title: "Granulocytes و FFP و cryo"
        quote: "A unit of cryoprecipitate is a fraction of plasma and contains factor VIII, fibrinogen, factor XIII and vWF activity."
        text: |
          - **Granulocytes**: apheresis من متبرع واخد **G-CSF**. لـ **absolute neutrophil count (ANC) <0.5** مع **documented infection**، أو **chronic granulomatous disease (CGD)**.
          - **Fresh frozen plasma (FFP)**: نقص factors كتير (نزيف أو قبل procedure)، **DIC**، **liver disease**، **massive transfusion**، **plasma exchange (TTP)**، **warfarin reversal**. ==مش للـ volume== ولا للـ protein في سوء التغذية.
          - **Cryoprecipitate**: فيه **VIII** و **fibrinogen** و **XIII** و **von Willebrand factor (vWF)**. لـ fibrinogen deficiency، dysfibrinogenemia، XIII deficiency، DIC، و hemophilia A أو von Willebrand disease (vWD) لو مفيش concentrate.

          الأسباب:
          - المتبرع بياخد **G-CSF** عشان نخرج granulocytes كتير من النخاع للدم قبل الـ apheresis.
          - الـ FFP فيه **كل الـ factors**، عشان كده بيمشي مع أي نقص متعدد (DIC، liver، warfarin). وللـ **congenital** deficiency الكتاب بيفضّل الـ concentrate عشان يقلّل نقل الفيروسات.
          - ليه مش للـ volume؟ التفسير المقبول (مش في الكتاب): فيه crystalloids و albumin أأمن وأرخص، والـ FFP منتج دم بمخاطره (infection، reactions) من غير فايدة هنا.
