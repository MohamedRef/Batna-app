  - id: git.L06.lesson3
    title: "الـ Crohn: التحاليل والأشعة والمنظار"
    hook: "مفيش test واحد بيقولك Crohn. بس الـ calprotectin بيفرّقه عن الـ IBS، والـ creeping fat بيبان في الـ CT."
    minutes: 9
    pages: [210, 211]
    topics: [cd-labs, cd-imaging]
    goals:
      - "تعرف ليه مفيش test واحد بيشخّص الـ Crohn"
      - "تعرف دور الـ calprotectin والـ serology وحدودهم"
      - "تختار الأشعة والمنظار الصح لكل سؤال"
    status: unverified
    steps:
      - kind: explain
        page: 210
        title: "التحاليل: مفيش test سحري"
        quote: "No single laboratory test is diagnostic or specific for Crohn disease."
        text: |
          **No single laboratory test** بيشخّص الـ Crohn. اللي هتلاقيه:
          - **anemia**، غالبًا ==iron deficiency==
          - **leukocytosis** و **thrombocytosis** (systemic inflammation)
          - **low albumin**: protein-losing enterocolitis أو malnutrition
          - نقص **calcium، magnesium، B12، D، folate** من الـ malabsorption
          - **C-reactive protein (CRP)** عالي (والـ erythrocyte sedimentation rate (ESR) أقل منه)

          التفسير المقبول (مش في الكتاب): ليه iron deficiency بالذات؟ لأن النزيف المزمن من القرح بيضيّع حديد، والالتهاب نفسه بيقلل امتصاصه، فالاتنين بيصبّوا في نفس الاتجاه.
      - kind: reveal
        page: 210
        quote: "Malabsorption due to inflammation, bacterial overgrowth, or surgical"
        prompt: "عيان Crohn عنده B12 واطي و vitamin D واطي. إيه التلات أسباب اللي الكتاب بيقولها؟"
        answer: |
          الكتاب: الـ **malabsorption** بسبب ==inflammation، bacterial overgrowth، أو surgical resection== بيقلل الـ **minerals** (calcium، magnesium) والـ **vitamins** (B12، D، folate). والـ **albumin** ممكن يقل من **protein-losing enterocolitis** أو سوء التغذية.

          التفسير المقبول (مش في الكتاب): الـ B12 بيتمص في الـ **terminal ileum** بس، اللي هو أشهر مكان للـ Crohn وأشهر حتة بتتشال في العمليات. والـ vitamin D بيحتاج دهون علشان يتمص، فأي malabsorption للدهون بيقلله. والبكتيريا اللي بتكتر ورا الـ stricture بتاكل الـ B12 قبل ما يوصل. يعني كل سبب من التلاتة ليه مكان في القصة.
      - kind: explain
        page: 210
        title: "البراز والـ serology"
        quote: "Stool inflammatory markers like fecal lactoferrin and calprotectin, are available that can help distinguish IBD from irritable bowel syndrome (IBS) (conditions that often have overlapping symptoms), potentially gauge disease activity, predict flare, and monitor and/or assess response to treatment."
        text: |
          **البراز:** ممكن **excess fat** (malabsorption) أو **fecal leukocytes** (inflammation). ولازم يطلع **negative** للـ bacteria والـ C. difficile والـ ova and parasites.

          ==Fecal calprotectin== و **lactoferrin**: بيفرّقوا الـ inflammatory bowel disease (IBD) عن الـ **IBS**، وبيقيسوا الـ activity، ويتوقعوا الـ flare، ويتابعوا العلاج.

          **Serology:** **Anti-Saccharomyces cerevisiae antibodies (ASCA)**، **Omp-C**، **I2**، **CBir-1** مع الـ Crohn. والـ **P-ANCA** مع الـ ulcerative colitis (UC) والـ Crohn colitis. كلهم **limited diagnostic accuracy** لوحدهم.

          التفسير المقبول (مش في الكتاب): ليه الـ calprotectin بيفرّق IBD عن IBS؟ لأنه بروتين جوه الـ neutrophils، وما بيطلعش في البراز إلا لو فيه neutrophils داخلين جدار الأمعاء، يعني التهاب حقيقي، والـ IBS مفيهوش التهاب.
      - kind: check
        page: 210
        quote: "Stool inflammatory markers like fecal lactoferrin and calprotectin, are available that can help distinguish IBD from irritable bowel syndrome (IBS) (conditions that often have overlapping symptoms), potentially gauge disease activity, predict flare, and monitor and/or assess response to treatment."
        question: "Young woman, loose stools with cramps for months, normal exam. Best test to separate IBD from IBS?"
        options:
          - "Fecal calprotectin"
          - "Serum ASCA"
          - "Fecal fat"
          - "ESR"
        answer: 0
        why:
          - "صح: ده بالظبط استخدام الـ calprotectin في الكتاب."
          - "الـ serology لوحدها limited accuracy."
          - "الـ fecal fat بيقيس malabsorption مش inflammation."
          - "الـ ESR nonspecific."
      - kind: explain
        page: 210
        quote: "cytoplasmic antibodies (ANCA, P-subtype) are associated with both"
        title: "الـ serology: مساعد، مش حَكَم"
        text: |
          الكتاب: فيه **serologic markers** مرتبطة بالـ Crohn: antibodies للـ yeast **Saccharomyces cerevisiae (ASCA)**، وللـ bacterial proteins **Omp-C و I2**، وللـ clostridial flagellin **CBir-1**. والـ ==P-ANCA== مرتبط بالـ UC **و** الـ Crohn colitis. **كل واحد لوحده** دقته محدودة، بس في حالات مختارة بيساعد يفرّق الـ Crohn من التهابات تانية.

          التفسير المقبول (مش في الكتاب): ليه الـ antibodies دي بتطلع أصلًا؟ لأن المناعة في الـ Crohn بتتخانق مع البكتيريا والفطريات اللي في الأمعاء، فالجسم بيعمل antibodies ضدهم. يعني هي «أثر الخناقة» مش سبب المرض، وعلشان كده ممكن تطلع في ناس سليمة وما تطلعش في مرضى. استخدمها لما الصورة محيّرة، مش أول test.
      - kind: figure
        page: 211
        quote: "Common abnormalities of the gut include thickening and excessive mesenteric fat proliferation (so-called creeping fat). CT enterography, which uses a special low-density oral contrast, combines the advantages of CT and small bowel series by allowing detailed pictures of the small bowel mucosa."
        title: "اختار الأشعة المناسبة"
        alt: "Five stacked boxes pairing each imaging test with what it is best for: plain film for obstruction and megacolon; CT for wall thickening, creeping fat, abscess; MR enterography for mild disease without radiation; MRI pelvis for perianal fistula; intestinal ultrasound safe without radiation or contrast."
        caption: "كل أشعة ليها شغلانة: الـ **plain film** للـ obstruction، الـ **computed tomography (CT)** للـ creeping fat والـ abscess، الـ **magnetic resonance enterography (MRE)** أحسن في الـ mild disease، والـ **magnetic resonance imaging (MRI) pelvis** للـ perianal fistula."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="320" height="56" rx="8" class="fg-box"/>
            <text x="15" y="28" class="t-b">Plain abdominal film</text>
            <text x="15" y="48" class="t-sm t-mut">Obstruction, megacolon; otherwise limited</text>
            <rect x="5" y="70" width="320" height="56" rx="8" class="fg-acc"/>
            <text x="15" y="93" class="t-b">CT / CT enterography</text>
            <text x="15" y="113" class="t-sm">Wall thickening, creeping fat, abscess, mass</text>
            <rect x="5" y="135" width="320" height="56" rx="8" class="fg-good"/>
            <text x="15" y="158" class="t-b">MR enterography</text>
            <text x="15" y="178" class="t-sm">Better for mild disease than CTE; no radiation</text>
            <rect x="5" y="200" width="320" height="56" rx="8" class="fg-bad"/>
            <text x="15" y="223" class="t-b">MRI pelvis</text>
            <text x="15" y="243" class="t-sm">Perianal fistulae and abscesses</text>
            <rect x="5" y="265" width="320" height="56" rx="8" class="fg-box"/>
            <text x="15" y="288" class="t-b">Intestinal ultrasound</text>
            <text x="15" y="308" class="t-sm t-mut">Safe: no radiation, no contrast</text>
          </svg>
      - kind: explain
        page: 211
        quote: "Magnetic resonance enterography (MRE) has been increasingly used. Studies"
        title: "MRE ولا CTE، والـ US، والـ enteroscopy"
        text: |
          الكتاب:
          - الـ **MRE** بقى بيتستخدم أكتر، وبيلاقي ==mild disease أحسن من الـ CTE==، وأحسن شوية في wall thickening والـ enhancement. في الـ **moderate to severe** مفيش فرق كبير.
          - الـ **CT enterography** بيستخدم oral contrast خاص low-density، فبيجمع مزايا الـ CT والـ small bowel series.
          - الـ **US intestines**: آمن وجديد، بيشوف الأمعاء والقولون من غير radiation ولا contrast.
          - الـ **enteroscopy** بيشوف أجزاء من الـ small intestine.

          التفسير المقبول (مش في الكتاب): ليه نفضّل الـ MRE والـ US؟ لأن مريض الـ Crohn **شاب** وهيتصوّر عشرات المرات طول عمره، وكل CT بيزوّد جرعة الإشعاع المتراكمة. فالـ MRE للمتابعة الدورية، والـ CT للطوارئ (abscess، perforation) لأنه أسرع ومتاح.
      - kind: explain
        remind: [git.L06.058]
        page: 211
        title: "المنظار"
        quote: "Pseudopolyps may be present. Ileal ulceration and skip lesions help distinguish Crohn disease from ulcerative colitis. The rectum is often spared."
        text: |
          الـ **colonoscopy** هو الأساس: بتشوف وبتاخد biopsy. هتلاقي ulcerations، erythema، granularity، strictures، وممكن **pseudopolyps**.

          اللي بيفرّقه عن الـ UC: ==ileal ulceration== و **skip lesions**، والـ **rectum often spared**.

          - الـ **fistulae** صعب تتشاف بالمنظار: أحسن بالـ **contrast studies** أو **MRI**.
          - الـ **capsule endoscopy** بتشوف الـ small bowel، بس لو فيه **stricture** الكبسولة ممكن تتحبس ومحتاجة جراحة.

          التفسير المقبول (مش في الكتاب): ليه الـ rectum غالبًا سليم في الـ Crohn؟ لأن المرض بيمشي نُقَط ويحب الـ ileum، عكس الـ UC اللي لازم يبدأ من الـ rectum، وده من أسهل الفروق اللي تشوفها في المنظار.
      - kind: check
        page: 211
        quote: "Fistulae are often difficult to locate endoscopically and are best seen by"
        question: "A Crohn patient has an enterocutaneous fistula. Per the lecture, how is the fistula tract best shown?"
        options: ["Contrast studies or MRI", "Colonoscopy", "Capsule endoscopy", "Plain abdominal film"]
        answer: 0
        why:
          - "صح: الكتاب: fistulae are often difficult to locate endoscopically and are best seen by contrast studies or MRI."
          - "المنظار بيشوف الـ mucosa، والفتحة الداخلية للـ fistula غالبًا صغيرة ومستخبية في الالتهاب."
          - "الكبسولة بتشوف الـ lumen بس، وممنوعة لو فيه stricture."
          - "الـ plain film للـ obstruction والـ megacolon، ودوره محدود غير كده."
      - kind: try
        items: [git.L06.043, git.L06.047, git.L06.052, git.L06.056, git.L06.059]
    recap:
      - "مفيش test بيشخّص؛ anemia (iron)، leukocytosis، thrombocytosis، low albumin، CRP و ESR عاليين."
      - "Malabsorption (inflammation، bacterial overgrowth، resection): calcium، magnesium، B12، D، folate؛ calprotectin و lactoferrin: IBD ضد IBS والـ activity."
