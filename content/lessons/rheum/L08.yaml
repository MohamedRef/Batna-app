  - id: rheum.L08.lesson5
    title: "ANCA: GPA و MPA و EGPA"
    hook: "تلات أخوات من نفس العيلة: واحد بيحب الأنف، واحد بيحب الكلية، وواحد بيحب الـ eosinophils والربو."
    minutes: 10
    pages: [145, 150]
    topics: [aav]
    goals:
      - "تفرّق GPA و MPA و EGPA بالـ ANCA والـ pathology والأعضاء"
      - "تحسب الـ 2022 ACR/EULAR scores"
      - "تعرف الـ c-ANCA و PR3 ومعناهم"
    status: unverified
    steps:
      - kind: explain
        page: 145
        title: "الـ AAV spectrum: الخطر الأول"
        quote: "AVV Spectrum"
        text: |
          شكل ص 145 بيرتّب إصابات الـ AAV على خط واحد من الأخطر للأخف:
          - **Organ- or life-threatening**: ==alveolar haemorrhage==، **glomerulonephritis**، **mononeuritis multiplex**، **mesenteric ischaemia**.
          - **Nonorgan-threatening**: **sinusitis**، **lung nodule**، **arthralgia**، **purpura**.

          ليه تبدأ بالتقسيمة دي قبل الاسم؟ التفسير المقبول (مش في الكتاب): لأن **العلاج** بيتحدد بيها (هتشوفها في درس العلاج): الـ organ-threatening محتاج cyclophosphamide أو rituximab، والأخف ممكن methotrexate. فأول سؤال قدام عيان AAV: "فيه عضو هيروح؟"
      - kind: figure
        page: 145
        title: "الطرفين في الصورة"
        image: { file: rheum/L08-aav-dah.webp, book: true }
        alt: "Top, labelled Purpura: both feet and ankles with scattered dark red spots and patches. Bottom, labelled Lung alveolar hemorrhage: a coronal chest CT with patchy white shadowing filling much of both lungs."
        caption: |
          تحت شكل الـ AAV spectrum، صورتين من الطرفين:

          - **فوق (Purpura)**: بقع حمرا غامقة على الرجلين: **nonorgan-threatening**.
          - **تحت (Lung alveolar hemorrhage)**: CT للصدر، الرئتين مليانين بياض متقطع: دم في الـ alveoli، ==organ- or life-threatening==.

          يعني نفس المرض ممكن يبان في الجلد بس، أو يغرق الرئة. والعلاج بيتحدد بالصورة التانية.
      - kind: table
        page: 146
        quote: "| GPA | MPA |\n|---|---|\n| c-ANCA+ | p-ANCA+ |\n| PR-3+ | MPO+ |\n| Necrotizing vasculitis and granulomas | Necrotizing vasculitis |\nC-ANCA, cytoplasmic antineutrophil cytoplasmic antibody, GPA, granulomatosis with polyangiitis; MPA, microscopic polyanglitis, MPO, myeloperoxidase; p-ANCA, perinuclear antineutrophil Cytoplasmic antibody; PR-3, proteinase-3."
        title: "GPA ضد MPA"
        columns: [Feature, GPA, MPA]
        rows:
          - ["ANCA", "c-ANCA", "p-ANCA"]
          - ["Antigen", "PR-3", "MPO"]
          - ["Histology", "Vasculitis + granulomas", "Vasculitis only"]
          - ["Top organ", "ENT 80–90%", "Kidney 90–100%"]
        hide: [[0, 1], [1, 2], [2, 1], [3, 2]]
      - kind: figure
        page: 146
        title: "الـ c-ANCA والـ p-ANCA تحت الـ immunofluorescence"
        image: { file: rheum/L08-anca-if.webp, book: true }
        alt: "Two panels. Left, headed GPA (c-ANCA, PR-3, necrotizing vasculitis and granulomas): neutrophils with green, grainy staining spread through the cytoplasm. Right, headed MPA (p-ANCA, MPO, necrotizing vasculitis): neutrophils with a bright green rim hugging the nucleus."
        caption: |
          تحت كل عمود من الجدول، صورة الـ neutrophils بالـ immunofluorescence:

          - **شمال (GPA)**: الأخضر **محبّب ومالي الـ cytoplasm**: ده الـ ==c-ANCA== (c = cytoplasmic)، والـ antigen **PR-3**.
          - **يمين (MPA)**: الأخضر **حلقة لازقة حوالين النواة**: ده الـ ==p-ANCA== (p = perinuclear)، والـ antigen **MPO**.

          يعني الحرف في الاسم هو شكل الأخضر نفسه.
      - kind: aside
        tone: tip
        page: 146
        quote: "| GPA | MPA |\n|---|---|\n| c-ANCA+ | p-ANCA+ |\n| PR-3+ | MPO+ |\n| Necrotizing vasculitis and granulomas | Necrotizing vasculitis |\nC-ANCA, cytoplasmic antineutrophil cytoplasmic antibody, GPA, granulomatosis with polyangiitis; MPA, microscopic polyanglitis, MPO, myeloperoxidase; p-ANCA, perinuclear antineutrophil Cytoplasmic antibody; PR-3, proteinase-3."
        text: |
          **C** = **C**lassic Wegener = **c**-ANCA = PR3 (حرف الـ **P** في الـ PR3 بيقعد مع الـ **c**، مش منطقي بس بيتحفظ).
          **M**PA = **M**by mouth (PO) = p-ANCA: حرف **M** مع **M**.
      - kind: reveal
        page: 146
        quote: "Necrotizing vasculitis and granulomas"
        prompt: "الـ GPA و الـ MPA الاتنين necrotizing vasculitis. إيه اللي بيفرّقهم تحت الميكروسكوب، وده بيفسّر إيه؟"
        answer: |
          شكل ص 146: الـ **GPA** = necrotizing vasculitis **and granulomas**، والـ **MPA** = necrotizing vasculitis **بس** (من غير granulomas).

          التفسير المقبول (مش في الكتاب): الـ **granuloma** كتلة التهاب بتاكل النسيج حواليها، وبتحب **مجرى الهوا الفوقاني**. عشان كده الـ GPA بيعمل **sinusitis** و **septal perforation** و **saddle nose** و **subglottic stenosis** و **lung nodules** ممكن تتجوّف. الـ MPA مفيهوش الكتل دي، فالمرض كله **capillaritis**: كلية ورئة نازفة.
      - kind: explain
        page: 147
        title: "2022 ACR/EULAR: GPA ≥5"
        quote: "Sum scores for 10 items, if present. A score of ≥ 5 is needed for classification of granulomatosis with polyangiitis."
        text: |
          **+5** c-ANCA/PR3، **+3** nasal discharge/crusting/septal perforation، **+2** cartilage (saddle nose، stridor)، **+2** lung nodules/cavity، **+2** granuloma، **+1** hearing loss، **+1** sinusitis/mastoiditis، **+1** pauci-immune glomerulonephritis (GN).

          بالسالب: **−1** p-ANCA/myeloperoxidase (MPO)، و ==−4 eosinophils ≥1 × 10⁹/L== (علشان دي eosinophilic granulomatosis with polyangiitis (EGPA)).
      - kind: explain
        page: 147
        title: "MPA ≥5"
        quote: "Sum scores for 6 items, if present. A score of ≥ 5 is needed for classification of microscopic polyangiitis."
        text: |
          ==+6 p-ANCA/MPO==، **+3** fibrosis أو interstitial lung disease (ILD)، **+3** pauci-immune GN.
          بالسالب: **−3** nasal disease، **−1** c-ANCA، **−4** eosinophils.

          المنطق: الأنف علامة granulomatosis with polyangiitis (GPA)، فبتطرح من الـ microscopic polyangiitis (MPA).
      - kind: check
        page: 147
        quote: "Positive test for perinuclear antineutrophil cytoplasmic antibodies or antimyeloperoxidase antibodies ANCA positive +6"
        question: "MPO-ANCA +, ILD, pauci-immune GN, no nasal disease, normal eosinophils. MPA score?"
        options:
          - "12"
          - "9"
          - "6"
          - "15"
        answer: 0
        why:
          - "صح: 6 + 3 + 3 = 12، أكتر من 5."
          - "نسيت بند من الـ +3."
          - "عدّيت الـ MPO بس."
          - "مفيش بنود تانية بالموجب."
      - kind: explain
        page: 148
        title: "مين بيحب أنهي عضو؟"
        quote: "Kidneys 50-80 90-100"
        text: |
          جدول ص 148 (نسبة الإصابة):

          | | GPA | MPA |
          |---|---|---|
          | ENT | **80–90%** | 20–30% |
          | Lungs | **60–80%** | 20–60% |
          | Kidneys | 50–80% | **90–100%** |
          | Skin | 30–60% | 40–70% |

          والدواير في نفس الصفحة: **Wegener's** = necrotizing granuloma (sinusitis، subglottic stenosis، pulmonary nodules، orbital pseudotumor). **MPA** = pulmonary capillaritis، GN، sensory neuropathy، mononeuritis multiplex. **Churg–Strauss** = ==hypereosinophilia== (asthma، pulmonary infiltrates، myocarditis).

          يعني الـ ==GPA أنف وجيوب أولًا==، والـ **MPA كلية أولًا** (تقريبًا كلهم)، وده نفس سبب الـ +3 و −3 في الـ scores.
      - kind: explain
        page: 148
        title: "EGPA score (2022): ≥6"
        quote: "CLASSIFICATION CRITERIA FOR EOSINOPHILIC GRANULOMATOSIS WITH POLYANGIITIS"
        text: |
          الـ **EGPA** بيتحسب بعد ما يبقى فيه small- أو medium-vessel vasculitis، والـ mimics مستبعدة:
          - **+3** obstructive airway disease (الربو)، **+3** nasal polyps، **+1** mononeuritis multiplex.
          - ==+5 blood eosinophils ≥1 × 10⁹/L==، **+2** extravascular eosinophil-predominant inflammation على الـ biopsy.
          - بالسالب: **−3** c-ANCA أو anti-PR3، **−1** haematuria.
          - المجموع ==≥6==.

          ليه c-ANCA بالسالب؟ لأنه بيوديك لـ GPA. وليه الـ haematuria بالسالب؟ التفسير المقبول (مش في الكتاب): الكلية أقل في الـ EGPA، فوجود GN بيقرّبك لـ MPA أو GPA. نفس منطق الـ −4 eosinophils في scores الـ GPA و MPA بس معكوس.
      - kind: table
        page: 149
        quote: "Nasal polyposis. Pulm infilterate. Cardiomyopathy. Polyneuropathy. Esinophilic gastritis. Histopatholgy. Esinophil tissue infilteration."
        title: "EGPA: وشّين"
        columns: [Feature, ANCA +, ANCA −]
        rows:
          - ["Clinical", "Necrotizing GN, purpura, lung haemorrhage, mononeuritis", "Nasal polyps, lung infiltrate, cardiomyopathy, polyneuropathy, eosinophilic gastritis"]
          - ["Tissue", "Small vessel vasculitis", "Eosinophil infiltration"]
          - ["Mechanism", "ANCA", "Eosinophil toxic products"]
        hide: [[0, 2], [1, 2], [2, 2]]
      - kind: reveal
        page: 149
        quote: "Toxic products from eosinophil."
        prompt: "ليه الـ EGPA ليه «وشّين»: ANCA-positive و ANCA-negative؟"
        answer: |
          جدول ص 149 بيفرّق:
          - **ANCA positive**: الضرر من **الـ vasculitis** نفسه (ANCA related): **necrotizing GN**، purpura، pulmonary haemorrhage، **mononeuritis**.
          - **ANCA negative**: الضرر من **الـ eosinophils** وهي قاعدة في الأنسجة (**toxic products from eosinophil**): **nasal polyposis**، pulmonary infiltrates، ==cardiomyopathy==، polyneuropathy، eosinophilic gastritis.

          التفسير المقبول (مش في الكتاب): يعني مرض واحد بـ mechanism-ين. والمهم عمليًا: الـ **cardiomyopathy** في الوش الـ ANCA-negative هي أكتر حاجة بتموّت، فـ ANCA السلبي **مش معناه** إن المرض أخف.
      - kind: explain
        page: 150
        title: "الـ c-ANCA والـ PR3"
        quote: "PR3 ANCA associated with:\n  Fast decline of renal function.\n  Extra renal manifestations more frequent.\n  Granuloma formation.\n  Relapses more frequent."
        text: |
          - **Indirect immunofluorescence**، **90% sensitive** للـ GPA الـ active، الـ antigen = **proteinase 3**
          - ==PR3-ANCA== معناه: **fast** decline في الكلية، extra-renal أكتر، granulomas، و ==relapses أكتر==
      - kind: figure
        page: 150
        quote: "Recent Standard of Care"
        title: "الـ standard of care الأحدث"
        image: { file: rheum/L08-soc.webp, book: true }
        alt: "A slide. Left, Induction: rituximab, high-dose steroids, cyclophosphamide rarely, plasma exchange no. Maintenance: all patients do not need maintenance; rituximab for those who do. Right, Shortcomings: failure to achieve sound remission, high relapse rate in some subsets, and treatment-related toxicities (glucocorticoids, COVID concerns, continuous B-cell depletion)."
        caption: |
          مقدمة لدرس العلاج:

          - **شمال فوق (Induction)**: ==rituximab== + steroids جرعة عالية. الـ cyclophosphamide **rarely**، والـ plasma exchange **no**.
          - **شمال تحت (Maintenance)**: مش كل العيانين محتاجينها، واللي محتاجها ياخد **rituximab**.
          - **يمين (Shortcomings)**: remission مش كاملة، relapses كتير في بعض المجموعات، وسُمّية العلاج (**الـ steroids**، و COVID مع الـ B-cell depletion المستمر).

          خلي بالك: الـ EULAR statements في الدرس الجاي لسه بتقول **consider** plasma exchange في الـ creatinine العالي جدًا أو الـ alveolar haemorrhage الشديد.
      - kind: check
        page: 148
        quote: "Kidneys 50-80 90-100"
        question: "Per the book's table, which organ is involved in 90–100% of patients with MPA?"
        options: ["Kidneys", "Ear, nose and throat", "Lungs", "Skin"]
        answer: 0
        why:
          - "صح: الـ MPA small vessel من غير granulomas، والـ glomerular capillaries أكتر هدف."
          - "الـ ENT 80–90% في الـ GPA، و 20–30% بس في الـ MPA."
          - "الرئة في الـ MPA 20–60%."
          - "الجلد 40–70%."
      - kind: try
        items: [rheum.L08.120, rheum.L08.123, rheum.L08.126, rheum.L08.129, rheum.L08.132]
    recap:
      - "AAV spectrum: organ-threatening (DAH، GN، mononeuritis، mesenteric) ضد nonorgan (sinusitis، nodule، arthralgia، purpura)."
      - "GPA: c-ANCA/PR3، granulomas، ENT 80–90%؛ MPA: p-ANCA/MPO، من غير granulomas، كلية 90–100%."
      - "GPA ≥5 (c-ANCA +5)، MPA ≥5 (p-ANCA +6)، EGPA ≥6 (eosinophils +5، asthma +3، polyps +3)."
      - "EGPA: ANCA+ = vasculitis (GN، mononeuritis)؛ ANCA− = eosinophil toxicity (cardiomyopathy، polyps)."
      - "c-ANCA 90% sensitive في الـ active GPA؛ PR3 = كلية أسرع، extra-renal أكتر، granulomas، relapses أكتر."
    practice: [rheum.L08.120, rheum.L08.121, rheum.L08.122, rheum.L08.123, rheum.L08.124, rheum.L08.125, rheum.L08.126, rheum.L08.127, rheum.L08.128, rheum.L08.129, rheum.L08.130, rheum.L08.131, rheum.L08.132, rheum.L08.133]
  # ------------------------------------------------------------------
  # Split from lesson5 on 2026-11-13 (#828): treatment of ANCA-associated
  # vasculitis (EULAR statements).
  - id: rheum.L08.lesson10
    title: "علاج الـ ANCA vasculitis: الـ EULAR خطوة بخطوة"
    hook: "الـ steroids أنقذت العيانين دول 60 سنة، وبرضه هي اللي بتأذيهم أكتر في أول سنة. العلاج كله لعبة توازن."
    minutes: 10
    pages: [151, 156]
    topics: [aav-rx]
    goals:
      - "تعرف ليه الـ steroid-sparing بقى ضرورة"
      - "تختار الـ induction حسب الخطورة وتعرف ممنوعات الـ MTX"
      - "تعرف الـ maintenance والـ refractory والمتابعة"
    status: unverified
    steps:
      - kind: explain
        page: 151
        title: "ليه نوفّر الـ steroids؟"
        quote: "Steroids are the major contributor to serious adverse events, especially"
        text: |
          الكتاب بيدّي تلات حقائق من الـ EUVAS trials:
          - الـ **high-dose steroids** في قلب علاج الـ vasculitis من **60 سنة**.
          - الـ steroids هي ==the major contributor to serious adverse events==، خصوصًا **infection**، في **أول سنة**.
          - الـ **long-term damage** من الـ steroids **rivals that of the disease**.

          يعني العلاج اللي بيطفي المرض بيعمل ضرر قد المرض نفسه. التفسير المقبول (مش في الكتاب): steroids جرعة عالية + cyclophosphamide أو rituximab = مناعة **مقفولة جدًا**، فالـ pneumonia والـ sepsis بتموّت في أول سنة أكتر من الـ vasculitis نفسه. عشان كده الشكل في ص 152 بيقارن **target prednisolone doses** في الـ trials، والاتجاه كله لـ **جرعات أقل**.
      - kind: figure
        page: 151
        quote: "Long-Term Data EUVAS Trials: Treatment-Related Organ Damage"
        title: "الضرر بعد العلاج"
        image: { file: rheum/L08-euvas-damage.webp, book: true }
        alt: "Horizontal bar chart of treatment-related organ damage in EUVAS trials, from 0 to 20 percent. From the top: osteoporosis about 15 percent, malignancy 12, diabetes 11, angina or bypass 9, cataracts 9, atrophy or weakness 8, alopecia 8, cerebrovascular accident 6, premature gonadal failure 5, myocardial infarction 5, marrow failure 3, mouth ulcers 2, chemical cystitis 1, avascular necrosis under 1. Osteoporosis, diabetes, cataracts, atrophy or weakness and avascular necrosis are boxed in red as related to glucocorticoids."
        caption: |
          كل عمود = نسبة العيانين اللي حصلهم الضرر ده بعد العلاج في الـ EUVAS trials:

          - **أطول عمود**: ==osteoporosis== (حوالي 15%)، وبعدها malignancy و diabetes.
          - **المتعلّم بالأحمر** (osteoporosis، diabetes، cataracts، atrophy/weakness، avascular necrosis) = **Related to Glucocorticoids**.

          يعني أكبر ضرر طويل المدى جاي من الـ steroids نفسها، مش من المرض.
      - kind: figure
        page: 152
        quote: "Protocol target prednisolone dosages in the key induction trials of antineutrophil cytoplasmic antibody associated vasculitis."
        title: "الجرعة بتنزل إزاي"
        image: { file: rheum/L08-gc-taper.webp, book: true }
        alt: "Line chart: glucocorticoid dose on the vertical axis from 0 to 60, weeks after diagnosis from 1 to 26 on the horizontal axis, with mean and 95 percent confidence intervals. The dose stays at 60 for weeks 1 and 2, falls quickly to about 25 by week 10 and about 15 by week 15, then flattens near 7 to 10 by weeks 20 to 26."
        caption: |
          الـ target prednisolone في الـ induction trials:

          - **أول أسبوعين**: ==60 mg==.
          - بعدها **نزول سريع**: حوالي 25 في الأسبوع 10، و 15 في الأسبوع 15.
          - **من أسبوع 20 لـ 26**: ثابتة حوالي **7–10 mg**.

          يعني الجرعة العالية **قصيرة**، والهدف توصل لجرعة واطية في حوالي ==6 شهور==. ده الرد على الـ bar chart اللي فوق.
      - kind: figure
        page: 151
        quote: "Algorithm to describe the management of new antineutrophil cytoplasmic antibody (ANCA)-associated vasculitis."
        title: "خطة الـ AAV في الكتاب"
        alt: "Algorithm. New AAV splits into organ- or life-threatening disease treated with cyclophosphamide or rituximab plus glucocorticoid, and non-organ-threatening disease treated with methotrexate or mycophenolate plus glucocorticoid. Rapidly progressive renal failure or pulmonary haemorrhage adds consideration of plasma exchange. Both lead to remission, then maintenance with azathioprine, methotrexate or rituximab and a glucocorticoid taper, and after 2 years taper or stop."
        caption: "السؤال الأول: ==organ-threatening ولا لأ؟== وبعدين maintenance **≥24 شهر**."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L08a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="fg-head"/></marker></defs>
