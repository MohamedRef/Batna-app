  - id: res.L06.lesson1
    title: "التجربة: لما الباحث هو اللي يختار"
    hook: "في كل الدراسات اللي فاتت كنا بنتفرّج. النهارده الباحث هو اللي بيدّي الـ exposure بإيده."
    minutes: 8
    pages: [3, 12]
    topics: [design-tree, interventions]
    goals:
      - "تفرّق بين experimental و observational بسؤال واحد"
      - "تعرف مكان الـ randomized controlled trial (RCT) في هرم الـ evidence وليه هو فوق"
      - "تعرّف الـ RCT وتعدّ أنواع الـ control"
    status: unverified
    steps:
      - kind: explain
        page: 3
        quote: "EPIDEMIOLOGIC STUDY DESIGNS. Did investigator assign exposures?\n  Yes, Experimental study. Random allocation?\n    Yes: Randomised controlled trial\n    No: Non-randomised controlled trial\n  No, Observational study. Comparison group?\n    No: Descriptive study\n    Yes: Analytical study. Direction?\n      Exposure → Outcome: Cohort study\n      Exposure ← Outcome: Case-control study\n      Exposure and outcome at the same time: Cross-sectional study"
        title: "السؤال اللي بيقسم الشجرة نصين"
        text: |
          في المحاضرات اللي فاتت، الـ descriptive والـ analytic، الباحث كان **بيتفرّج** بس: الناس اختاروا بنفسهم يشربوا شيشة أو لأ، وهو بيقيس.

          النهارده السؤال الأول في الشجرة: هل الباحث هو اللي ==assigned the exposure==؟

          - **أيوه** ← **experimental study**: الباحث هو اللي قرّر مين ياخد الـ intervention.
          - **لأ** ← **observational study**: زي الـ cohort والـ case-control والـ cross-sectional والـ descriptive.

          مثال: عايز تعرف الشيشة بتعمل lung cancer؟ مش هتقدر تقول لنص الناس «اشربوا شيشة» علشان تشوف. فهتعمل observational. لكن عايز تعرف دوا جديد للضغط بينزّله؟ تقدر **تدّيه** بإيدك: experimental.
      - kind: figure
        page: 3
        quote: "EPIDEMIOLOGIC STUDY DESIGNS. Did investigator assign exposures?\n  Yes, Experimental study. Random allocation?\n    Yes: Randomised controlled trial\n    No: Non-randomised controlled trial\n  No, Observational study. Comparison group?\n    No: Descriptive study\n    Yes: Analytical study. Direction?\n      Exposure → Outcome: Cohort study\n      Exposure ← Outcome: Case-control study\n      Exposure and outcome at the same time: Cross-sectional study"
        title: "شجرة الـ study designs"
        alt: "Decision tree. Did the investigator assign exposures? Yes leads to experimental study, then random allocation: yes is a randomised controlled trial, no is a non-randomised controlled trial. No leads to observational study, then comparison group: no is descriptive, yes is analytical, which splits by direction into cohort, case-control and cross-sectional."
        caption: "السؤال الأول: مين اللي اختار الـ exposure؟ لو الباحث، يبقى السؤال التاني: اتوزّع **random** ولا لأ؟"
        svg: |
