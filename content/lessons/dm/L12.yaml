          - **أول صف**: الـ atorvastatin عليه شريط اسود = ==No Dose Adjustment== في كل الـ stages، ما عدا الـ transplant (10–20).
          - **الصف قبل الأخير**: الـ rosuvastatin بينزل ==من 5–40 لـ 5–10== في stages 4–5، و5 بس في الـ transplant.
