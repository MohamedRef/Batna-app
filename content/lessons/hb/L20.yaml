  - id: hb.L20.lesson5
    title: "عضم الـ cirrhotic"
    hook: "تلت عيانين الكبد عندهم osteoporosis. والـ T-score هنا بيبدأ من −1.5 مش −1."
    minutes: 7
    pages: [414, 415]
    topics: [bone]
    goals:
      - "تعرف مين يعمل DEXA وإمتى يكرّرها"
      - "تختار العلاج حسب الـ T-score"
    status: unverified
    steps:
      - kind: explain
        page: 414
        title: "حوالي 30%"
        text: |
          - حوالي ==30%== من مرضى الـ chronic liver disease عندهم **osteoporosis**، وأكتر في الـ **cholestasis**.
          - **Osteoporosis**: loss of bone mass and quality بتعمل ==fragility fractures==.

          عوامل الخطر في رسمة الكتاب:
          - **male hypogonadism**
          - **alcohol abuse**
          - **smoking**
          - **BMI < 19**
          - **early menopause**
          - **family history of osteoporotic fracture**
          - **corticosteroids**
          - **advanced age**
          - **secondary amenorrhoea > 6 months**

          لاحظ إن معظمهم إما قلة هرمونات أو سموم، والتمرين الجاي هيساعدك تحفظهم.
      - kind: figure
        page: 414
        title: "عوامل الخطر في رسمة الكتاب"
        image: { file: hb/L20-osteoporosis-risks.webp, book: true }
        alt: "Book figure: risk factors for osteoporosis in chronic liver disease, in boxes around a silhouette. Left: male hypogonadism, alcohol abuse, smoking, BMI under 19, early menopause. Right: family history of osteoporotic fracture, treatment with corticosteroids, advanced age, secondary amenorrhoea over 6 months."
        caption: |
          تسع مربعات، وكلهم بيتقسّموا لـ 4 مجموعات (هتشوفها في التمرين الجاي): هرمونات قليلة، سموم، نحافة، وسن ووراثة.

          خد بالك من ==BMI < 19==: النحافة هي الخطر، مش التخن.
      - kind: explain
        page: 414
        title: "التشخيص"
        text: |
          الـ **WHO gold standard**: ==bone densitometry (DEXA) of the lumbar spine and hip==.

          اعملها في:
          - **previous fragility fractures**
          - **corticosteroids**
          - **before liver transplantation**
          - **cholestatic diseases**
          - **cirrhosis**
          - أي **risk factor** تاني

          والـ **vertebral fractures**: **lateral X-rays of the dorsal and lumbar spine**. وكمان **lab tests** لاضطرابات الـ calcium والـ vitamin D.
      - kind: check
        page: 414
        question: "Which of these is NOT among the osteoporosis risk factors in the lecture's figure?"
        options:
          - "Obesity"
          - "Male hypogonadism"
          - "BMI < 19 kg/m²"
          - "Secondary amenorrhoea > 6 months"
        answer: 0
        why:
          - "صح: الرسمة فيها **BMI < 19** يعني النحافة هي الخطر، مش الـ obesity."
          - "موجود: **male hypogonadism** أول مربع في الرسمة."
          - "موجود، وده عكس الـ obesity بالظبط."
          - "موجود: **secondary amenorrhoea > 6 months**، ومعاه early menopause."
      - kind: aside
        tone: analogy
        page: 414
        text: |
          افتكر الـ risk factors كأنها 4 مجموعات: هرمونات قليلة + سموم + نحافة + سن.

          - **هرمونات قليلة**: male hypogonadism، early menopause، secondary amenorrhoea.
          - **سموم**: alcohol، smoking، corticosteroids.
          - **نحافة**: BMI < 19.
          - **سن ووراثة**: advanced age، family history of fracture.
      - kind: figure
        page: 415
        title: "الـ T-score بيقولك تعمل إيه"
        alt: "A T-score bar. Above minus 1.5 is normal: calcium and 25-hydroxy vitamin D, repeat DEXA in 2 to 3 years. From minus 1.5 down to above minus 2.5 is osteopenia: calcium and vitamin D, bisphosphonates depending on risk factors, repeat in 1 to 2 years. Minus 2.5 or below is osteoporosis: calcium, vitamin D and bisphosphonates or new agents, repeat in 1 year."
        caption: "الحدود في ملخص الكتاب: ==osteopenia== من −1.5 (مش −1 زي الـ WHO العام)، و ==osteoporosis ≤ −2.5==."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="30" width="93" height="34" class="fg-bad"/>
            <rect x="103" y="30" width="62" height="34" class="fg-acc"/>
            <rect x="165" y="30" width="155" height="34" class="fg-good"/>
            <text x="56" y="52" text-anchor="middle" class="t-sm t-b">Osteoporosis</text>
            <text x="134" y="52" text-anchor="middle" class="t-sm t-b">Penia</text>
            <text x="242" y="52" text-anchor="middle" class="t-sm t-b">Normal</text>
            <path d="M103 24V70M165 24V70" class="fg-ink"/>
            <text x="103" y="86" text-anchor="middle" class="t-sm t-b">−2.5</text>
            <text x="165" y="86" text-anchor="middle" class="t-sm t-b">−1.5</text>
            <text x="165" y="16" text-anchor="middle" class="t-sm t-mut">T-score (DEXA)</text>
            <rect x="4" y="100" width="322" height="66" rx="8" class="fg-good"/>
            <text x="14" y="122" class="t-sm t-b">Normal: T &gt; −1.5</text>
            <text x="14" y="140" class="t-sm">Ca + 25(OH)D</text>
            <text x="14" y="158" class="t-sm">Repeat DEXA in 2–3 years</text>
            <rect x="4" y="174" width="322" height="66" rx="8" class="fg-acc"/>
            <text x="14" y="196" class="t-sm t-b">Osteopenia: −1.5 to −2.5</text>
            <text x="14" y="214" class="t-sm">Ca + 25(OH)D ± bisphosphonates (risk factors)</text>
            <text x="14" y="232" class="t-sm">Repeat in 1–2 years</text>
            <rect x="4" y="248" width="322" height="76" rx="8" class="fg-bad"/>
            <text x="14" y="270" class="t-sm t-b">Osteoporosis: T ≤ −2.5</text>
            <text x="14" y="288" class="t-sm">Ca + 25(OH)D + bisphosphonates, new agents</text>
            <text x="14" y="306" class="t-sm">Repeat in 1 year</text>
          </svg>
      - kind: explain
        page: 415
        title: "العلاج"
        text: |
          - **Balanced diet** مع ==calcium (1,000–1,500 mg/day)== و ==vitamin 25(OH)D 400–800 IU/day== علشان المستويات تفضل طبيعية.
          - **Physical activity**، خصوصًا تمارين **mechanics of the spine**.
          - قلّل اللي بيزوّد الـ bone loss: **alcohol**، **tobacco**، **corticosteroids**.
          - الـ ==bisphosphonates== (etidronate, alendronate, ibandronate) بتزوّد الـ bone mass في الـ **PBC** من غير serious adverse events، رغم إن الدراسات قليلة.
          - كرّر الـ DEXA بعد 2–3 سنين لو طبيعية، وخلال سنة لو متوقع **rapid bone loss**.
      - kind: check
        page: 415
        question: "A 55-year-old woman with PBC has a lumbar T-score of **−2.8**. What is the plan?"
        options:
          - "Calcium + 25(OH)D + a bisphosphonate; repeat DEXA in 1 year"
          - "Calcium + 25(OH)D only; repeat DEXA in 2–3 years"
          - "No treatment; repeat DEXA in 5 years"
          - "Stop vitamin D because of cholestasis"
        answer: 0
        why:
          - "صح: **≤ −2.5** = osteoporosis → Ca + D + bisphosphonates وتكرار خلال سنة. والـ bisphosphonates اتجرّبت في الـ PBC بالذات."
          - "ده علاج الـ **normal** (> −1.5)."
          - "مفيش 5 سنين في الكتاب، وأطول فترة 2–3 سنين للطبيعي."
          - "بالعكس: الـ cholestasis بتعمل vitamin D deficiency، والمكملات جزء من العلاج."
      - kind: aside
        tone: exam
        page: 415
        text: |
          أي سؤال bone في الـ liver: ابدأ الإجابة بـ **Ca + 25(OH)D** للكل، وبعدين زوّد حسب الـ T-score. ولو العيان **PBC**، اذكر إن الـ bisphosphonates هي اللي ليها data فيه.
      - kind: try
        items: [hb.L20.066, hb.L20.069, hb.L20.072, hb.L20.104, hb.L20.111]
    recap:
      - "≈ 30% osteoporosis، أكتر في الـ cholestasis."
      - "Gold standard: DEXA lumbar spine + hip. Vertebral fractures: lateral X-ray dorsal + lumbar."
      - "DEXA في: fragility fracture، steroids، قبل الـ LT، cholestasis، cirrhosis، أي risk factor."
      - "T > −1.5 طبيعي (كرّر 2–3 سنين)؛ −1.5 لـ −2.5 osteopenia (1–2 سنة)؛ ≤ −2.5 osteoporosis (سنة)."
      - "Ca 1,000–1,500 mg + 25(OH)D 400–800 IU للكل؛ bisphosphonates في الـ PBC."
    practice: [hb.L20.066, hb.L20.067, hb.L20.068, hb.L20.069, hb.L20.070, hb.L20.071, hb.L20.072, hb.L20.073, hb.L20.074, hb.L20.075, hb.L20.104, hb.L20.111]
