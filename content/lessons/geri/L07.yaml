      - "تحفظ risk factors الـ malnutrition وتحسب الـ Malnutrition Universal Screening Tool (MUST)"
      - "تعرف bands الـ Mini Nutritional Assessment (MNA)"
      - "تعرف ليه الـ medication review قلب الـ comprehensive geriatric assessment (CGA)"
    status: unverified
    steps:
      - kind: explain
        page: 123
        title: "Malnutrition: خطير بس بيتعالج"
        quote: "Frequently used risk factors for malnutrition are:\n  Involuntary weight loss (more than 5% over the last month or more than 10% over the last six months).\n  BMI less than 20 for elderly (≥ 65y).\n  Decreased appetite or reduced food intake"
        text: |
          مشاكل التغذية في الكبير **poor prognosis** بس **potentially treatable**، وممكن تكون علامة لمرض تاني.

          Risk factors:
          - **Involuntary weight loss** ==>5% في شهر== أو **>10% في 6 شهور**
          - ==body mass index (BMI) <20== لو **≥65 سنة**
          - Decreased appetite أو reduced food intake

          ليه الأرقام دي؟ التفسير المقبول (مش في الكتاب):
          - **5% في شهر** أو **10% في 6 شهور**: الوزن اللي بيروح بسرعة كده في الكبير معظمه **عضل** مش دهن، والعضل هو الاحتياطي.
          - **BMI أقل من 20** (مش 18.5 زي الشباب): الكبير اللي وزنه على الحدود ما عندوش مخزون يستحمل بيه مرض.
          - **الشهية القليلة** غالبًا علامة لحاجة تانية: اكتئاب، أسنان، دوا، أو مرض مستخبي. وده اللي الكتاب قاله: التغذية **marker** لأمراض تانية.

          والكتاب بيقول إن أي frailty assessment لازم يسأل عن **diet، appetite، weight**.
