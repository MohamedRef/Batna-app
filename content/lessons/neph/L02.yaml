        title: "إيه اللي بيسرّع الـ CKD؟"
        text: |
          **مش بإيدك**: السبب، مستوى الـ glomerular filtration rate (GFR)، مستوى الـ ==albuminuria==، السن، النوع، العرق، low birth weight.

          **بإيدك**: الضغط العالي، السكر، الدهون، الـ ==acidosis==، التدخين، السمنة، الـ nephrotoxic agents، الأنيميا.

          والمحاضرة حاطة كلمة كبيرة في آخر القايمة: ==FASTING==.
      - kind: explain
        page: 37
        quote: "PREDICTORS OF PROGRESSION"
        title: "ليه الحاجات دي بتسرّع المرض؟"
        text: |
          قايمة الـ **predictors of progression** من الكتاب. التفسير المقبول (مش في الكتاب) للي بإيدك:

          - **Elevated BP**: الضغط بيوصل للـ glomerulus اللي أصلًا مضغوط من الـ hyperfiltration.
          - **Hyperglycemia**: بتشغّل الـ hyperfiltration من ناحية الـ macula densa.
          - **Acidosis**: كل nephron باقي بيعمل ammonia أكتر علشان يرمي الحمض، والـ ammonia بتشغّل التهاب وتليّف (هتشوفها في درس الحموضة).
          - **Smoking** و **dyslipidemia**: بيأذوا الأوعية الصغيرة جوه الكلية.
          - **Obesity**: حمل فلترة أكبر.
          - **Anemia**: الـ tubules بتاخد أكسجين أقل.
          - **Nephrotoxic agents**: ضربة جديدة على كلية ضعيفة.
          - **Fasting**: نقص مية وملح، فالدم الواصل للكلية يقل.

          يعني كل واحدة بتزوّد الضغط على النفرونات الباقية أو بتموّت منهم.
