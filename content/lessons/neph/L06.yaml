      - kind: explain
        page: 141
        title: "الأعراض: عضلات، كلى، سكر"
        quote: "Hypokalemia can present with polyuria and polydipsia due to decreased concentrating ability of the kidney."
        text: |
          - **Weakness و fatigue** (الأشهر)؛ تظهر dyspnea، constipation، distension، exercise intolerance، ونادرًا **paralysis**.
          - الشديدة: cramps و ==rhabdomyolysis==.
          - **Polyuria و polydipsia**: الكلية مش قادرة تركّز البول.
          - نفسي: psychosis، delirium، hallucinations، depression.
          - المزمنة: ==kaliopenic nephropathy==: chronic tubulointerstitial nephritis (TIN) مع **cysts صغيرة**، tubular atrophy، macrophages و fibrosis.
          - **Glucose intolerance**: السكر يعلى **10 mg/dL لكل 1 mEq/L** نقص في الـ K (الـ K بيظبط إفراز الـ insulin).

          الـ K هو اللي ماسك الـ resting voltage (ص 135)، **علشان كده** العضلات أول حاجة تتأثر.
      - kind: reveal
        page: 141
        quote: "Glucose intolerance can occur because insulin release is regulated partially by plasma K+. In general, there is an average 10-mg/dL increase in glucose concentration for every 1-mEq/L decrease in plasma K+ concentration."
        prompt: "ليه الـ K الواطي بيعلّي السكر، وليه بيعمل polyuria؟"
        answer: |
          **السكر** من الكتاب: إفراز الـ insulin بيتظبط جزئيًا بالـ K في الدم، فلما الـ K يقل الـ insulin يقل، والسكر يعلى حوالي ==10 mg/dL لكل 1 mEq/L==. يعني عيان على thiazide وسكره بيعلى: شوف الـ K.

          **الـ polyuria** من الكتاب: الكلية **مش قادرة تركّز** البول. والتفسير المقبول (مش في الكتاب): الـ collecting duct في الـ hypokalemia مش بيستجيب كويس للـ ADH، زي nephrogenic DI خفيف (وده سبب ظهورها في Table 2 بتاع الـ hypernatremia).
      - kind: reveal
        page: 141
        quote: "In acidemic patients. K+ should be given before HCO3 therapy because correction of metabolic acidosis will cause an intra cellular shift of K+, leading to a further decrease in the extra cellular fluid concentration."
        prompt: "عيان عنده hypokalemia و metabolic acidosis. تدي bicarbonate ولا K الأول؟"
        answer: "==K الأول==. لو صلّحت الـ acidosis، الـ K هيدخل الخلايا والـ K في الدم هينزل أكتر (ممكن arrhythmia أو شلل). بعد ما يستقر، اديله HCO3 مع الـ K."
      - kind: explain
        page: 141
        title: "إزاي تدي K في الوريد"
        quote: "IV 0.9% saline 1L with 20-40mmol KCl at no more than 10-20mmol KCl/h through peripheral cannula. (Avoid glucose-containing solutions or sodium bicarbonate)."
        text: |
          **0.9% saline لتر** فيه **20–40 mmol KCl**، بسرعة **ما تعدّيش 10–20 mmol/h** في وريد طرفي.

          ==ابعد عن الـ glucose والـ bicarbonate== **لأن** الـ glucose بيطلّع insulin، والاتنين بيدخّلوا الـ K الخلايا.
