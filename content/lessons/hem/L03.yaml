  - id: hem.L03.lesson9
    title: "الـ sickle cell: التشخيص والعلاج"
    hook: "مش هتقدر تغيّر الجين، بس تقدر تمنع الكرة تتمنجل: دفّي، رطّب، أكسجين، ورفّع الـ HbF."
    minutes: 8
    pages: [34, 35]
    topics: [scd-rx]
    goals:
      - "تعرف تحاليل الـ sickle cell وتفرّقها عن الثلاسيميا"
      - "تربط كل خطوة في علاج الـ crisis بالـ CHOCA"
      - "تعرف إزاي الـ hydroxyurea والأدوية الجديدة بتشتغل"
    status: unverified
    steps:
      - kind: explain
        page: 34
        title: "التحاليل"
        quote: "Laboratory features\n  1) Peripheral blood examination: Anaemia is usually moderate with haemoglobin concentration ranging between 6 and 9 gm/dl. Anaemia is normocytic and normochromic. sickled cells on the blood smear.\n  2) Reticulocyte count is increased.\n  3) Unconjugated S. bilirubin is increased.\n  4) Identification of HbS: haemoglobin electrophoresis."
        text: |
          - Hb ==6–9 g/dL==، **normocytic normochromic** (مش microcytic زي الثلاسيميا)، و sickled cells في الفيلم.
          - **Reticulocytes** عالية، و unconjugated bilirubin عالي.
          - التأكيد: ==Hb electrophoresis== (HbS).

          ليه normocytic مش microcytic؟ لأن المشكلة في **شكل** الـ Hb مش في **كميته**؛ الكرة مليانة Hb عادي، بس النوع غلط. والـ retics والـ bilirubin عاليين عشان فيه haemolysis والنخاع بيعوّض.
      - kind: check
        page: 34
        quote: "Anaemia is normocytic and normochromic. sickled cells on the blood smear."
        question: "Which result separates sickle cell anaemia from β-thalassaemia major?"
        options:
          - "Normocytic anaemia with sickled cells"
          - "Raised HbF"
          - "High reticulocytes"
          - "Raised unconjugated bilirubin"
        answer: 0
        why:
          - "صح: الـ sickle normocytic normochromic، والثلاسيميا microcytic hypochromic."
          - "الـ HbF ممكن يعلى في الاتنين."
          - "فيه haemolysis في الاتنين، والـ retics في الثلاسيميا modest بس عالية."
          - "الـ bilirubin عالي في الاتنين من الـ haemolysis."
      - kind: explain
        page: 34
        title: "العلاج"
        quote: "Hydroxyurea increases production of HbF and reduces number and severity of crises. As HbF does not participate with HbS in sickling process, polymerization of HbS is retarded."
        text: |
          **الوقاية**: علاج العدوى بدري، **pneumococcal** و**influenza vaccines**، و**penicillin prophylaxis** في الطفولة، لأن الطحال اللي اتليّف مش بيصطاد البكتيريا.

          **الـ crisis**: مسكنات، **تدفئة**، **سوايل**، **أكسجين**، وعلاج العدوى. ليه دول بالذات؟ عشان كل واحدة بتعكس حرف من الـ CHOCA: الدفا ضد الـ cold، السوايل ضد الـ dehydration، الأكسجين ضد الـ hypoxia، والعدوى بتعمل حرارة و acidosis.

          **قبل العمليات**: ==exchange transfusion== تقلل نسبة الـ HbS.

          **Hydroxyurea**: يرفع الـ ==fetal haemoglobin (HbF)==، والـ HbF مش بيدخل مع الـ HbS في الـ polymer، فالـ crises تقل.
      - kind: reveal
        page: 34
        quote: "Pneumococcal vaccine, influenza vaccine and penicillin prophylaxis are indicated during early childhood."
        prompt: "ليه الـ penicillin والـ pneumococcal vaccine في الطفولة بالذات؟"
        answer: |
          لأن الأطفال تحت 5 سنين في الـ sickle cell معرضين لعدوى **fulminant**، والسبب في الكتاب إن **وظيفة الطحال في الـ phagocytosis** بايظة.

          التفسير المقبول (مش في الكتاب): الطحال هو المصفاة اللي بتشيل البكتيريا المغلّفة زي الـ **pneumococcus** من الدم. لما يتليّف من الـ infarctions، البكتيريا دي تعدّي من غير ما حد يوقفها، وفي الطفل الصغير المناعة لسه ما كملتش. فبنسد الطريق من ناحيتين: **تطعيم** يعلّم الجسم، و**penicillin** يمنع البكتيريا تبدأ.
      - kind: reveal
        page: 34
        quote: "Exchange transfusion has been advised prior to surgery to reduce the risk of vaso-occlusive episodes by decreasing the percentage of HbS."
        prompt: "قبل العملية بنعمل exchange transfusion. ليه مش نقل عادي وخلاص؟"
        answer: |
          الكتاب بيقول الهدف ==نقلّل نسبة الـ HbS==، عشان الـ vaso-occlusion يقل وقت العملية (برد، dehydration، hypoxia، كلها CHOCA).

          التفسير المقبول (مش في الكتاب): النقل العادي بيضيف كرات فوق كرات العيان، فالـ Hb يعلى بس الـ HbS لسه موجود، والدم يتقل (**viscosity** أعلى) فالسدد ممكن يزيد. الـ **exchange** بيشيل دم العيان ويحط مكانه دم سليم، فالنسبة نفسها تنزل من غير ما الدم يتقل.
