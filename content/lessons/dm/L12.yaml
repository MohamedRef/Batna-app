      - kind: explain
        page: 159
        title: "ليه الاحتياج بيطلع وبعدين ينزل؟"
        quote: "In patients with decompensated CLD; the requirement for insulin may be\n    decreased due to reduced capacity for gluconeogenesis and reduced hepatic\n    breakdown of insulin."
        text: |
          الكتاب بيدّيك السببين بنفسه، وده سؤال بيتسأل:

          - **Compensated** ← الاحتياج ==increased== بسبب الـ **insulin resistance**، خصوصًا في الـ NAFLD والـ NASH: الكبد المليان دهون مش بيسمع كلام الـ insulin.
          - **Decompensated** ← الاحتياج ==decreased== لسببين: **reduced capacity for gluconeogenesis** (الكبد مش بيعمل سكر كفاية) و **reduced hepatic breakdown of insulin** (الكبد كان بيكسّر الـ insulin، فدلوقتي بيقعد أطول).

          النتيجة: نفس الجرعة اللي كانت مظبوطة ممكن تعمل hypo لما الكبد يتدهور، عشان كده الكتاب بيقول **frequent dose adjustments** و **close monitoring**، وإن العيان لازم يعرف علامات الـ hypoglycemia.
      - kind: explain
        page: 159
        title: "إزاي تديه"
        quote: "A twice-daily mixed regimen or a basal-bolus regimen may be indicated."
        text: |
          - ==twice-daily mixed== أو ==basal-bolus==.
          - علّم العيان علامات الـ hypoglycemia.
          - عنده **hepatic encephalopathy** وأكل عالي الـ carbohydrate (CHO)؟ الـ **rapid-acting analogues** (lispro، aspart، glulisine) بتمسك الـ postprandial.

          ليه الـ rapid بالذات هنا؟ لأن الـ high-carbohydrate diet بيعمل قمة كبيرة بعد الأكل، والـ rapid analogue بيطلع وينزل بسرعة مع الوجبة، فيمسك القمة من غير ما يفضل بعدها ويعمل hypo بالليل.
