lecture: geri.L06
lessons:
  # ------------------------------------------------------------------
  - id: geri.L06.lesson1
    title: "الغدة بتكبر في السن: الـ TSH بيكدب أحيانًا"
    hook: "TSH = 7 في واحدة عندها 92 سنة؟ ممكن يكون ده طبيعي ليها. قبل ما تكتب levothyroxine، افهم الغدة العجوزة."
    minutes: 8
    pages: [91, 94]
    topics: [aging, epidemiology]
    goals:
      - "تعرف التغيرات في الغدة والهرمونات مع السن، والفرق بين الراجل والست"
      - "تفرّق الـ age-related TSH من الـ euthyroid sick syndrome"
      - "تحفظ أرقام الـ epidemiology"
    status: unverified
    steps:
      - kind: explain
        page: 91
        quote: "the thyroid gland undergoes moderate atrophy and develops nonspecific histo-pathologic abnormalities: fibrosis, increase interfollicular connective tissues"
        title: "الغدة مع السن"
        text: |
          الغدة بيحصلها ==moderate atrophy== ومعاها:
          - **fibrosis** وconnective tissue أكتر بين الـ follicles.
          - **colloid** أقل.
          - شوية **lymphocytic infiltration**.

          والـ **auto-antibodies** بتوصل لـ **20%** في الستات فوق 60، والهرمونات بتقل حوالي **30%**.
      - kind: table
        page: 91
        quote: "In the old women the free thyroid hormones do not change but the TSH"
        title: "الراجل غير الست"
        columns: ["", "Free hormones", "TSH"]
        rows:
          - ["Old men", "↓", "No change"]
          - ["Old women", "No change", "↑"]
        hide: [[0, 1], [1, 2]]
      - kind: explain
        page: 92
        quote: "Aging is characterized by a reduced iodine absorption and organification and a lower response to TSH, leading to reduced thyroid hormone production."
        title: "ليه الإنتاج بيقل؟"
        text: |
          - ==reduced iodine absorption and organification==.
          - **lower response to TSH**.
          - في الـ oldest old: الـ **nocturnal TSH surge** بيروح جزئيًا أو كليًا.
          - **reduced response to TRH** و**reduced TSH circadian variation**.
          - والـ **clearance** بتاع الهرمون أبطأ.
      - kind: figure
        page: 92
        quote: "in the population >80 years of age, the upper limit at the 95% interval of confidence was >6.0 mIU/L, reaching 8.0 mIU/L in over-90s."
        title: "الحد الأعلى للـ TSH بيطلع مع السن"
        alt: "A rising staircase of TSH upper limits: about 4 mIU/L in younger adults, over 6 mIU/L after 80, 8 mIU/L after 90."
        caption: "في دراسات السكان، الحد الأعلى (95%) فوق 80 سنة أكتر من 6، وفوق 90 يوصل 8 mIU/L. يعني 7 عند تسعيني ممكن تبقى طبيعية."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="30" y="120" width="80" height="60" class="fg-good"/>
            <text x="44" y="112" class="t-sm">~4</text>
            <text x="40" y="196" class="t-sm">Adults</text>
            <rect x="125" y="90" width="80" height="90" class="fg-acc"/>
            <text x="140" y="82" class="t-sm t-b">&gt;6.0</text>
            <text x="140" y="196" class="t-sm">&gt;80 y</text>
            <rect x="220" y="60" width="80" height="120" class="fg-bad"/>
            <text x="240" y="52" class="t-sm t-b">8.0</text>
            <text x="235" y="196" class="t-sm">&gt;90 y</text>
            <text x="30" y="24" class="t-sm t-mut">Upper TSH limit (mIU/L), 95%</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 92
        quote: "centrally mediated way to avoid excessive catabolism and promote \"physiological aging.\""
        text: "الغدة العجوزة زي عربية قديمة بتمشي على **سرعة أهدى** علشان تعيش أطول. الـ low thyroid function عند الكبير ممكن يكون **protective** ضد الـ **catabolism**، مش دايمًا مرض. ولسه ده محل جدل."
      - kind: explain
        page: 92
        quote: "euthyroid sick syndrome\", where circulating levels of TSH and T3 are reduced, whereas reverse T3 is increased"
        title: "اوعى تتلخبط: euthyroid sick"
        text: |
          الـ ==euthyroid sick syndrome==: في المرض الحاد أو الـ systemic:
          - **TSH ↓** و**T3 ↓**.
          - **reverse T3 ↑**.

          ده رد فعل للمرض، مش thyroid disease ولا شيخوخة.
      - kind: check
        page: 92
        quote: "euthyroid sick syndrome\", where circulating levels of TSH and T3 are reduced, whereas reverse T3 is increased"
        question: "An 84-year-old with pneumonia: TSH low, T3 low, reverse T3 high. Most likely?"
        options: ["Euthyroid sick syndrome", "Hyperthyroidism", "Normal ageing", "T4 toxicosis"]
        answer: 0
        why:
          - "صح: TSH وT3 واطيين وreverse T3 عالي مع مرض حاد."
          - "الـ hyperthyroidism بيرفع الـ T3 أو الـ T4."
          - "الشيخوخة مابتعملش reverse T3 عالي فجأة."
          - "الـ T4 toxicosis فيها T4 عالي."
      - kind: explain
        page: 93
        quote: "could be the expression of actual thyroid pathology, especially in the case of positive TΡΟ Ab and TBG Ab titters."
        title: "الدراسات بتختلف، فما تتسرعش"
        text: |
          - Cohorts كبيرة (منها **Ashkenazi**): الـ TSH بيطلع مع السن، والـ longevity مع TSH أعلى.
          - **Rotterdam** (أكتر من 9000): العكس، الـ TSH بينزل والـ **TPOAb** بيطلع.
          - لو الـ **TPO Ab** أو الـ TBG Ab positive، فكّر في ==actual thyroid pathology==.

          الخلاصة: **avoid a superficial diagnosis** وinappropriate treatment، وعلاج الـ subclinical hypothyroidism بـ TSH أقل من 10 لسه **under debate**.
      - kind: explain
        page: 94
        quote: "the overall prevalence of hypothyroidism is 4.6%, with 0.3% for the overt and 4.3% for the subclinical type."
        title: "الأرقام"
        text: |
          - **مصر**: primary hypothyroidism في ==10% من الستات== و**2% من الرجالة** فوق 60.
          - **10-15%** من مرضى الـ hyperthyroidism فوق 60.
          - البلاد الغنية باليود: hypothyroidism **1-2%**، أكتر في الستات الكبار.
          - **NHANES III**: 4.6% (0.3% overt + 4.3% subclinical). الـ hypothyroidism أشهر thyroid disease عند الكبار.
      - kind: try
        items: [geri.L06.003, geri.L06.007, geri.L06.009, geri.L06.014]
    recap:
      - "Atrophy، fibrosis، colloid أقل؛ antibodies لحد 20% في الستات فوق 60؛ الهرمونات ↓30%."
      - "رجالة: free hormones ↓، TSH ثابت. ستات: free ثابت، TSH ↑."
      - "Upper TSH limit: أكتر من 6 فوق 80، 8 فوق 90."
      - "Euthyroid sick: TSH ↓، T3 ↓، reverse T3 ↑."
      - "مصر: 10% ستات، 2% رجالة فوق 60؛ NHANES III 4.6%."
    practice: [geri.L06.001, geri.L06.002, geri.L06.003, geri.L06.004, geri.L06.005, geri.L06.006, geri.L06.007, geri.L06.008, geri.L06.009, geri.L06.010, geri.L06.011, geri.L06.012, geri.L06.013, geri.L06.014, geri.L06.015, geri.L06.016, geri.L06.017, geri.L06.080, geri.L06.081]
