  # ---------------- discussion (slides 39-51) ----------------
  - id: res.L13.042
    kind: order
    topic: discussion
    prompt: Put the six components of a good discussion in order.
    steps:
      - Statement of principal findings
      - Strengths and weaknesses of the study
      - Strengths and weaknesses in relation to other studies
      - Meaning of the study, possible mechanisms and implications for clinicians and policymakers
      - Unanswered questions and future research
      - Conclusion
    src: { page: 39, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.043
    kind: card
    topic: discussion
    front: How should the discussion open?
    back: >-
      With the answer to the research question, normally in no more than a few sentences, ideally starting with a
      sentence that clearly shows the paper includes new information, because reviewers often start with a "null
      hypothesis" that the paper adds nothing new.
    src: { page: 39, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.044
    kind: mcq
    topic: discussion
    stem: How should strengths and weaknesses of the study be handled in the discussion?
    options:
      - Equal emphasis on both; a subheading like "limitations of the study" helps
      - Mostly strengths, since reviewers look for reasons to accept
      - Weaknesses only in the cover letter
      - Hide weaknesses so the paper isn't rejected
    answer: 0
    why:
      - Right; and reviewers are more interested in seeing that the author is aware of the weaknesses.
      - Reviewers care more that you know the weaknesses.
      - They belong in the discussion.
      - Hiding them is what reviewers look for.
    src: { page: 40, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.045
    kind: cloze
    topic: discussion
    text: "Findings that have not been described in the {{c1::results}} section should not be discussed."
    src: { page: 40, quote: "@" }
    status: unverified
  - id: res.L13.046
    kind: enumerate
    topic: discussion
    prompt: How do you discuss strengths and weaknesses in relation to other studies?
    points:
      - Consider all evidence bearing on the argument, with or against; take a "devil's advocate" position
      - Give full credit for supporting evidence
      - Don't bury a previous paper that reached the same answer in the discussion; highlight it in the introduction
      - Don't just summarize published papers; critically evaluate their methods, findings and conclusions
      - Discuss differences in results with possible explanations; if unknown, say so, without implying yours are better
    pass: 4
    hook: "المقارنة 5 «اسمع الطرف التاني، اِدّي حق، ماتدفنش، انقد، وفسّر الاختلاف بأدب»: devil's advocate، full credit، the same-answer paper in the introduction، critical evaluation، differences explained."
    src: { page: 41, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.047
    kind: mcq
    topic: discussion
    stem: An earlier paper on the same question reached the same answer as yours. Where should you cite it?
    options:
      - In the introduction, highlighted
