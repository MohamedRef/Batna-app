  - id: neph.L06.lesson9
    title: "الماغنسيوم: المفتاح اللي بيفتح الـ K والـ Ca"
    hook: "K مش راضي يتصلح؟ Ca بيقع تاني؟ غالبًا الـ Mg هو اللي ناقص. وزيادته بتهدّي كل حاجة لحد ما النفس يقف."
    minutes: 9
    pages: [142, 144]
    topics: [mg]
    goals:
      - "تعرف أسباب الـ hypomagnesemia وليه كل واحد بيفقد Mg"
      - "تفهم ليه الـ Mg الواطي بييجي مع K و Ca واطيين"
      - "تعالج الـ hypo والـ hyper بالأرقام وتعرف ليه الـ calcium هو الترياق"
    status: unverified
    steps:
      - kind: explain
        page: 142
        title: "الماغنسيوم"
        quote: "Normal range: 1.5-2.3 mg/dl. 60% stored in bone. 1% in extracellular space."
        text: |
          الطبيعي **1.5–2.3 mg/dL**؛ **60% في العضم** و **1% بس برّه الخلايا**. Cofactor لإنزيمات كتير، والكلية هي اللي بتظبطه.

          **Hypomagnesemia**:
          - **Renal**: loop أو thiazide، recovery من obstruction أو acute tubular necrosis (ATN)، nephrotoxins (**aminoglycosides، cisplatin، ciclosporin، amphotericin، foscarnet**)، hypercalciuria، Gitelman و Bartter.
          - **Gut**: إسهال، nasogastric (NG) suction، جراحة، malabsorption، **pancreatitis**، **alcohol**.

          وده **السبب** إن الـ serum Mg ممكن يبقى طبيعي والمخزون ناقص: الـ 1% اللي برّه بس هو اللي بنقيسه (التفسير المقبول، مش في الكتاب).
      - kind: explain
        page: 142
        title: "ليه الأسباب دي بتفقد Mg؟"
        quote: "Diuretic use (loop or thiazide) or prolonged natriuresis."
        text: |
          الكتاب بيقول الكلية هي اللي بتظبط الـ Mg، فطبيعي أغلب الأسباب **renal**. **ليه** كل واحد، بالتفسير المقبول (مش في الكتاب):

          - **Loop diuretics و Bartter**: الـ thick ascending limb هو أكبر مكان بيرجّع Mg، والاتنين بيعطّلوه.
          - **Thiazide و Gitelman**: بيعطّلوا رجوع الـ Mg في الـ DCT.
          - **Recovery phase من الـ obstruction أو الـ ATN**: الـ tubules لسه ما رجعتش تشتغل، والبول كتير، فالـ Mg بيتسرّب.
          - **Nephrotoxins** (aminoglycosides، cisplatin، ciclosporin، amphotericin، foscarnet): بتأذي الـ tubules اللي بترجّع الـ Mg.
          - **Gut**: الـ Mg بيتمص من الأمعاء، فالإسهال والـ NG suction والـ malabsorption بيضيّعوه.
          - **Pancreatitis**: الـ Mg بيترسّب في الدهون المتكسّرة حوالين البنكرياس، زي الـ Ca بالظبط.
          - **Alcohol**: أكل قليل، وكمان الكحول بيزوّد خروج الـ Mg في البول.
      - kind: aside
        tone: exam
        page: 142
        quote: "Low Mg occurs in conjunction with low K (50% of cases), low Ca and a metabolic alkalosis."
        text: "الـ Mg الواطي بييجي مع ==low K (50%)== و **low Ca** و metabolic alkalosis. أي K أو Ca **مش راضي يتصلح**: قيس الـ Mg."
      - kind: reveal
        page: 142
        quote: "Low Mg occurs in conjunction with low K (50% of cases), low Ca and a metabolic alkalosis."
        prompt: "ليه الـ K والـ Ca بيرفضوا يتصلحوا لحد ما تصلّح الـ Mg؟"
        answer: |
          الكتاب بيقول الـ Mg الواطي بييجي مع ==low K في 50%== ومع **low Ca**. التفسير المقبول (مش في الكتاب):

          - **الـ K**: الـ Mg جوّه خلايا الـ tubule بيقفل جزئيًا قناة الـ K اللي بتطلّعه في البول. لو الـ Mg قليل، القناة مفتوحة على الآخر والـ K يهرب، فأي K تدّيه بيخرج.
          - **الـ Ca**: الـ parathyroid محتاج Mg علشان يفرز الـ **PTH**، والعضم والكلية محتاجينه علشان يستجيبوا له. من غير Mg، الـ PTH ضعيف والـ Ca يقع.

          علشان كده في الكتاب: الـ symptomatic أو مع **low Ca أو low K** ياخد **IV MgSO4** على طول.
      - kind: explain
        page: 143
        title: "أعراض الـ Mg الواطي وعلاجه"
        quote: "Symptomatic Or with hypocalcaemia or hypokalaemia: 10mmol MgSO 4 IVI bolus over 5min, then 20mmol MgSO 4 in 100mL 0.9% saline IV over 4 hours. Repeat, as required."
        text: |
          **أعراض**: weakness، cramps، carpopedal spasm، **Chvostek و Trousseau**، tetany، تشنجات، delirium، nystagmus، و **arrhythmias** (supraventricular أو ventricular).

          **العلاج**:
          - Asymptomatic و Mg **فوق 0.4**: oral slow-release **6–18 mmol/day** على 4 جرعات.
          - Symptomatic أو مع low Ca أو K: ==10 mmol magnesium sulfate (MgSO4) في 5 دقايق==، بعدين **20 mmol في 100 mL saline على 4 ساعات**، وكرر لو محتاج.
          - ارجع للـ oral لما يعدّي **0.5**؛ الإسهال ممكن يحدّ من الـ oral.

          وبيتدّي IV مع الـ low Ca أو low K **علشان** من غير Mg مش هيتصلحوا (الخطوة اللي فاتت).
      - kind: check
        page: 143
        quote: "Modest low (>0.4mmol/L): oral slow-release Mg 6-18mmol/day in four divided doses."
        question: "Mg 0.6 mmol/L found on routine labs. No symptoms; K and Ca normal. Plan?"
        options:
          - "Oral slow-release Mg 6–18 mmol/day in four divided doses"
          - "10 mmol MgSO4 IV over 5 minutes"
          - "Calcium gluconate 10%"
          - "No treatment ever needed"
        answer: 0
        why:
          - "صح: asymptomatic و modest (فوق 0.4)، يبقى oral."
          - "الـ IV للـ symptomatic أو مع low Ca أو low K."
          - "الـ calcium علاج الـ Mg العالي، مش الواطي."
          - "الكتاب بيعالج حتى الـ modest بالـ oral."
      - kind: explain
        page: 143
        title: "Hypermagnesemia: كل حاجة بتهدى"
        quote: "Occurs usually if excess Mg administered IV (as in treating pre-eclampsia) or in patients with impaired renal function given exogenous Mg."
        text: |
          نادرة لأن الكلية بتطلّع الزيادة. بتحصل مع **intravenous (IV) Mg زيادة** (زي الـ **pre-eclampsia**) أو Mg لعيان كليته تعبانة (**antacids**، MgSO4 enemas).

          الـ Mg بيهدّي الـ central nervous system (CNS) وبيقلل استجابة الـ neuromuscular junction للـ acetylcholine. الترتيب: ==hyporeflexia== و paresthesia ← weakness ← صعوبة بلع ← **respiratory depression**. فوق **3.5**: bradycardia و blood pressure (BP) واطي.
