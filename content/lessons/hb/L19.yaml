      - kind: explain
        page: 381
        quote: "Gallstone migration, into cystic duct which, even if transient, causes biliary colic. Biliary Pain characteristically begins in the right upper quadrant but may occur elsewhere in the upper abdomen. It is often poorly localized, particularly in diabetics and the elderly.The pain may radiate into the back or down the arm. Episodes begin suddenly, become intense within 15 min to 1 h, remain at a steady intensity for up to 12 h (usually < 6 h), and then gradually disappear over 30 to 90 min, leaving a dull ache. The pain is usually severe enough to send patients to the emergency department for relief."
        title: "الوجع بيروح فين؟"
        text: |
          **Site**: بيبدأ عادةً في الـ **right upper quadrant (RUQ)**، بس ممكن يبقى في أي حتة في الـ upper abdomen.

          **Localisation**: غالبًا ==poorly localized==، وخصوصًا في الـ **diabetics** والـ **elderly**. ودول بالذات اللي ممكن نفوّت عندهم التشخيص.

          **Radiation**: ممكن للـ **back** أو **down the arm**. والدراع دي اللي بتلخبطه مع القلب، وده السبب إن الـ myocardial infarction (MI) في الـ differential diagnosis.

          **Associated**: nausea شائعة، وأحيانًا vomiting.

          **Fever and chills**: مش بيحصلوا إلا لو حصل **cholecystitis**.

          **Exam**: ممكن mild RUQ or epigastric tenderness، بس ==no peritoneal findings==. وبين النوبات العيان كويس خالص.
