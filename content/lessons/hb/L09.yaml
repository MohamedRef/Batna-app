          - "الحسبة صح بس التفسير غلط: high SAAG = portal HTN."
          - "الـ TB لوحدها بتدي **low** SAAG (إلا لو فيه portal HTN معاها)."
          - "الـ SAAG لوحده بيقول portal HTN ولا لأ؛ الـ protein بيساعد بعد كده."
      - kind: aside
        tone: trap
        page: 151
        text: |
          فخ مشهور: مريض cirrhosis **و** TB peritonitis. الـ SAAG هيطلع **≥1.1** لأن الـ portal hypertension موجودة. يعني الـ high SAAG **مش بينفي** سبب تاني. الكتاب كاتبها صريحة.
