  - id: rheum.L03.lesson5
    title: "Type III و IV: الزبالة في المواسير والجيش المتأخر"
    hook: "Type III زي زبالة بتسد مواسير ضيقة. Type IV زي جيش بيوصل بعد 3 أيام، بس لما يوصل بيبني قلعة (granuloma)."
    minutes: 7
    pages: [63, 67]
    topics: [type3, type4]
    goals:
      - "تشرح ليه الـ immune complexes بتترسب وفين"
      - "تفرّق Arthus عن serum sickness"
      - "تعرف توقيت ومثال الـ type IV وتحل أسئلة الكتاب"
    status: unverified
    steps:
      - kind: explain
        page: 63
        quote: "The damaging inflammatory reaction is triggered by a soluble antigen capable of forming large insoluble immune complexes"
        title: "Immune complex-mediated injury"
        text: |
          - **Soluble antigen** + IgG أو IgM ← ==large insoluble immune complexes== في الدم.
          - كبيرة على الـ phagocytosis ← بدل ما تتشال **بتترسب**، غالبًا في **جدار الأوعية**.
          - Complement و Fc receptors ← neutrophils ← granule enzymes و reactive oxygen ← ==vasculitis== و tissue necrosis.
      - kind: figure
        page: 64
        quote: "Neutrophil granule enzymes, reactive oxygen intermediates"
        title: "من الدم لجدار الوعاء"
        alt: "A blood vessel in cross-section on the left with small antigen-antibody complexes floating in it and some stuck to the wall. An arrow labelled complement and Fc receptor recruitment leads to the right, where the same vessel wall is inflamed, neutrophils sit on the deposits and release enzymes and oxygen radicals, labelled vasculitis."
        caption: "Complexes بتلزق في الجدار ← complement و Fc ← neutrophils ← vasculitis."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R03c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <circle cx="62" cy="95" r="52" class="fg-thin"/>
            <circle cx="62" cy="95" r="40" class="fg-box"/>
            <circle cx="50" cy="80" r="5" class="fg-bad"/>
            <circle cx="74" cy="96" r="5" class="fg-bad"/>
            <circle cx="58" cy="126" r="5" class="fg-bad"/>
            <circle cx="68" cy="128" r="5" class="fg-bad"/>
            <text x="62" y="170" text-anchor="middle" class="t-sm">immune complexes</text>
            <path d="M126 95h44" class="fg-arrow-acc" marker-end="url(#R03c)"/>
            <text x="160" y="80" text-anchor="middle" class="t-sm t-mut">complement</text>
            <text x="160" y="116" text-anchor="middle" class="t-sm t-mut">Fc receptors</text>
            <circle cx="268" cy="95" r="52" class="fg-bad"/>
