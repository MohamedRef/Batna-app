  - id: hb.L20.lesson4
    title: "العضل بيكنس الأمونيا"
    hook: "سؤال الامتحان: role of sarcopenia in HE. هنا الإجابة كاملة، ومعاها الفيتامينات والملح."
    minutes: 9
    pages: [412, 413]
    topics: [micronutrients, he]
    goals:
      - "تشرح العلاقة بين الـ sarcopenia والـ ammonia والـ HE"
      - "تعرف توصيات الأكل في الـ HE ومين ياخد NG tube"
      - "تحفظ أرقام vitamin D والصوديوم"
    status: unverified
    steps:
      - kind: explain
        page: 412
        title: "الفيتامينات"
        text: |
          ليه الـ vitamin deficiencies شائعة في أمراض الكبد؟
          - **Hepatic dysfunction** و diminished reserves.
          - **Inadequate intake** و **malabsorption**، والاتنين بيزيدوا مع شدة المرض.

          أهم الأرقام:
          - أغلب المرشحين للـ LT عندهم نقص ==vitamin A and D==.
          - ==Vitamin D < 20 ng/ml== في الـ chronic cholestatic conditions، وبيقل كل ما الـ severity والـ Child–Pugh يزيدوا. منطقي: الـ cholestasis بتقلل الـ bile، والـ bile لازمة لامتصاص الـ fat-soluble vitamins.
          - الـ vitamin D كمان بيرتبط بالـ treatment response في **HCV** و **NAFLD** و **HCC**.

          التوصيات:
          - عالج أي نقص confirmed or clinically suspected.
          - قيس الـ vitamin D.
          - لو **< 20 ng/ml**: اديه oral vitamin D لحد ==serum 25(OH)D > 30 ng/ml==.
      - kind: explain
        page: 413
        title: "الملح: قلّله، بس مش لدرجة إنه ما ياكلش"
        text: |
          - الـ **hyponatraemia** شائعة. وبتحصل أكتر لما الصوديوم اللي بياكله يقل والمية زي ما هي أو زيادة، فالصوديوم بيتخفف. راقب الاتنين.
          - في الـ **ascites** تحت sodium restriction: حوالي ==80 mmol/day = 2 g sodium = 5 g added salt==.
          - وخلّي بالك من ==palatability==: الأكل المسلوق من غير ملح ممكن يخلي العيان ما ياكلش، والـ calorie intake يقل. وانت كده كسبت ملح وخسرت عضل.
      - kind: match
        page: 413
        prompt: "وصّل الأرقام:"
        pairs:
          - ["Sodium in ascites", "≈ 80 mmol/day (5 g salt)"]
          - ["Vitamin D deficiency", "< 20 ng/ml"]
          - ["Vitamin D target", "25(OH)D > 30 ng/ml"]
          - ["Energy and protein in HE", "Same as cirrhotics without HE"]
        why: "80 mmol Na = 2 g sodium = 5 g ملح. الـ vitamin D: عالج تحت 20 لحد ما يعدّي 30. والـ HE مش بتغيّر الاحتياجات."
      - kind: figure
        page: 413
        title: "Sarcopenia ↔ ammonia ↔ HE"
        alt: "A loop. Sarcopenia, meaning low muscle mass, leads to less ammonia cleared by muscle, so blood ammonia rises. High ammonia impairs muscle function and adds to muscle loss, closing the loop. High ammonia also leads to hepatic encephalopathy. A green box at the bottom lists how to break the loop: assess nutrition and sarcopenia, avoid protein restriction, prefer vegetable and dairy protein, consider BCAA, and feed orally, by nasogastric tube, or parenterally."
        caption: "الكتاب: ==inverse relationship between muscle mass and blood ammonia==، والـ hyperammonaemia بتضعّف العضل. وإن العضل بيشيل الـ ammonia عن طريق الـ glutamine ده physiology مقبولة، مش نص الكتاب."
        svg: |
