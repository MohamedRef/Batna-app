  - id: geri.L10.lesson5
    title: "ليه الندبة مش بتقف؟ الـ pathogenesis"
    hook: "الـ IPF مش التهاب. هو جرح بيتصلّح غلط كل مرة، والخلايا اللي المفروض تموت بعد الشغل رافضة تموت."
