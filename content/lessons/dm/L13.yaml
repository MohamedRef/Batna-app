        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 166
        quote: "In pregnant individuals with diabetes & chronic hypertension, a blood pressure threshold of 140/90 mmHg for initiation or titration of therapy is associated with better pregnancy outcomes than reserving treatment for severe hypertension, with no increase in the risk of small-for-gestational-age birth weight."
        title: "ليه 140/90 مش بس الضغط الشديد؟"
        text: |
          العلاج من **140/90** أحسن للحمل من إنك تستنى الـ **severe hypertension**، و==من غير زيادة في الـ small-for-gestational-age== birth weight. والـ target **110-135/85** عشان يقلل الـ accelerated maternal hypertension.

          طب ليه فيه حد تحتاني (**de-intensify تحت 90/60**)؟ التفسير المقبول (مش في الكتاب): المشيمة ما بتعرفش تنظّم الدم الداخل لها، فهي عايشة على ضغط الأم. لو نزّلت الضغط زيادة، الدم الواصل للجنين يقل ونموه يتأثر. وده كان الخوف القديم اللي خلّى الناس تستنى الضغط الشديد، والـ ADA 2025 بيقول إن العلاج من 140/90 ما زوّدش الـ SGA.
