items:
  # ---------- p23: epidemiology ----------
  - id: neph.L02.001
    kind: card
    topic: epidemiology
    front: Roughly how many people had CKD worldwide in 2017, and what fraction of the population is that?
    back: "About 843.6 million people, roughly 1 in 10: extremely common."
    src: { page: 23, quote: "Extremely common Increasing death rate" }
    status: unverified
  - id: neph.L02.002
    kind: cloze
    topic: epidemiology
    text: CKD deaths rose by about {{c1::41.5%}} (1990–2017), and CKD is projected to be the {{c2::5th}} leading cause of death.
    src: { page: 23, quote: "843,6m: +41.5%" }
    status: unverified
  - id: neph.L02.003
    kind: card
    topic: epidemiology
    front: What is the main cause of death in CKD patients?
    back: Cardiovascular disease (CVD).
    src: { page: 23, quote: "Main cause of death in CKD" }
    status: unverified
    tags: [high-yield]
  # ---------- p24: definition and hyperfiltration ----------
  - id: neph.L02.004
    kind: card
    topic: definition
    front: How does KDIGO 2012 define CKD?
    back: Abnormalities of kidney structure or function, present for more than 3 months, with implications for health.
    src: { page: 24, quote: "CKD is defined as abnormalities of kidney structure or function, present for > 3 months, with implications for health" }
    status: unverified
    tags: [high-yield]
  - id: neph.L02.005
    kind: cloze
    topic: definition
    text: CKD is classified by {{c1::Cause}}, {{c2::GFR}} category and {{c3::Albuminuria}} category (CGA).
    src: { page: 24, quote: "CKD is classified based on cause, GFR category, and albuminuria category (CGA)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L02.006
    kind: enumerate
    topic: definition
    prompt: List the markers of kidney damage that define CKD (one or more for > 3 months).
    points:
      - "Albuminuria (AER ≥ 30 mg/24 h; ACR ≥ 30 mg/g [≥ 3 mg/mmol])"
      - Urine sediment abnormalities
      - Electrolyte and other abnormalities due to tubular disorders
      - Abnormalities detected by histology
      - Structural abnormalities detected by imaging
      - History of kidney transplantation
    pass: 4
    src: { page: 24, quote: "Criteria for CKD (either of the following present for > 3 months)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L02.007
    kind: cloze
    topic: definition
    text: The albuminuria criterion for CKD is AER ≥ {{c1::30}} mg/24 hours or ACR ≥ {{c1::30}} mg/g (≥ {{c2::3}} mg/mmol).
    src: { page: 24, quote: "Albuminuria (AER > 30mg/24 hours; ACR > 30 mg/g" }
    status: unverified
  - id: neph.L02.008
    kind: cloze
    topic: definition
    text: "Decreased GFR alone defines CKD when GFR is < {{c1::60}} mL/min/1.73 m² (GFR categories {{c2::G3a–G5}})."
    src: { page: 24, quote: "Decreased GFR GFR <60 ml min/1.73" }
    status: unverified
  - id: neph.L02.009
    kind: card
    topic: hyperfiltration
    front: What is hyperfiltration in CKD?
    back: Single-nephron hyperfiltration due to adaptive responses to the progressive decrease in the number of functional units.
    src: { page: 24, quote: "Single-nephron hyperfiltration due to adaptive responses to the progressive decrease in the number of functional units." }
    status: unverified
  - id: neph.L02.010
    kind: enumerate
    topic: hyperfiltration
    prompt: List the causes of renal hyperfiltration.
    points:
      - Increased sympathetic activity
      - Increased renin–angiotensin–aldosterone activity
      - Hyperglycaemia and insulin resistance
      - Obesity
      - Increased autoimmune activation
      - Impaired glomerular haemodynamics
      - Inhibition of tubuloglomerular feedback (macula densa signals)
    pass: 5
    src: { page: 24, quote: "Causes of Renal Hyperfiltration" }
    status: unverified
  - id: neph.L02.011
    kind: card
    topic: hyperfiltration
    front: What happens to afferent and efferent arteriolar resistance in glomerular hyperfiltration?
    back: Afferent arteriolar resistance falls and efferent arteriolar resistance rises.
    src: { page: 24, quote: "Reduced arterial resistance Increased arterial resistance" }
    status: unverified
  - id: neph.L02.012
    kind: enumerate
    topic: hyperfiltration
    prompt: How does glomerular hyperfiltration lead to cardiovascular disease and death (book p24 chain)?
    points:
      - Increased oxidative stress and inflammation
      - Endothelial dysfunction
      - Increased arterial stiffness
      - Increased blood pressure and impaired BP variation
      - Increased cardiovascular disease and mortality
    pass: 3
    src: { page: 24, quote: "Increased cardiovascular disease and mortality" }
    status: unverified
  # ---------- p25: pathogenesis and screening ----------
  - id: neph.L02.013
    kind: card
    topic: hyperfiltration
    front: After how many nephrons are lost does CKD progress similarly whatever the cause?
    back: Once about half of the total nephrons are lost.
    src: { page: 25, quote: "lost, CKD progresses similarly" }
    status: unverified
    tags: [high-yield]
  - id: neph.L02.014
    kind: order
    topic: hyperfiltration
    prompt: Put the pathogenesis of CKD progression in order.
    steps:
      - Loss of nephron number
      - Adaptive hyperfiltration at the glomerulus (↑ single-nephron GFR)
      - RAAS activation and proteinuria
      - Angiotensin II and tubular protein uptake cause inflammation
      - Glomerular and tubulointerstitial fibrosis (2° FSGS)
      - Progressive GFR decline and systemic complications
    src: { page: 25, quote: "hyperfiltration activates RAAS and" }
    status: unverified
  - id: neph.L02.015
    kind: card
    topic: screening
    front: In whom is CKD screening cost-effective?
    back: In populations at risk for CKD.
    src: { page: 25, quote: "Screening → cost-effective in populations at risk for CKD" }
    status: unverified
  - id: neph.L02.016
    kind: table
    topic: screening
    title: Prevalence of CKD in at-risk groups (book p25)
    columns: [Group, CKD prevalence]
    rows:
      - ["General population", "12–14%"]
      - ["Diabetes", "40%"]
      - ["Cardiovascular disease", "40%"]
      - ["Age ≥ 65 years", "33%"]
      - ["Hypertension", "22%"]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 25, quote: "40% Cardio- vascular diseases" }
    status: unverified
  # ---------- p26: screening ----------
  - id: neph.L02.017
    kind: enumerate
    topic: screening
    prompt: List the risk-factor conditions that call for CKD screening.
    points:
      - Hypertension
      - Diabetes
      - Cardiovascular disease
      - AKI or hospitalization history
      - Family history of kidney disease
      - Obesity
      - "Other high-risk comorbidities (SLE, environmental exposures, nephrotoxic drugs, genetic factors, preeclampsia, low birth weight)"
    pass: 5
    src: { page: 26, quote: "Hypertension; diabetes; Cardiovascular disease; AKI/hospitalization history; FH kidney disease; obesity" }
    status: unverified
    tags: [high-yield]
  - id: neph.L02.018
    kind: order
    topic: screening
    prompt: Put the CKD screening algorithm in order (Figure 2).
    steps:
      - Test GFR and ACR in a person with a risk factor
      - "GFR < 60 or ACR ≥ 30 mg/g found: exclude AKI"
      - Confirm after 3 months (or earlier if evidence of chronicity)
      - Measure eGFRcr-cys if not done and available
      - Stage by GFR and ACR
      - Establish the cause, estimate risk of progression, start treatment
    src: { page: 26, quote: "Figure 2: Screening algorithm for diagnosis and staging of chronic kidney disease (CKD)." }
    status: unverified
  - id: neph.L02.019
    kind: card
    topic: screening
    front: A first screen shows GFR 50 or ACR 40 mg/g. What must be done before calling it CKD?
    back: Exclude AKI and confirm that GFR < 60 and/or ACR ≥ 30 mg/g persists after 3 months (or earlier if there is evidence of chronicity).
    src: { page: 26, quote: "Figure 2: Screening algorithm for diagnosis and staging of chronic kidney disease (CKD)." }
    status: unverified
  # ---------- p27: prevention, eGFR ----------
  - id: neph.L02.020
    kind: enumerate
    topic: screening
    prompt: List the World Kidney Day "golden rules" for healthy kidneys shown in the lecture.
    points:
      - Test your kidney function regularly
      - Keep regular control of blood sugar
      - Eat healthy and keep your weight in check
      - Maintain a healthy fluid intake
    pass: 3
    src: { page: 27, quote: "Golden Rules for healthy kidneys" }
    status: unverified
  - id: neph.L02.021
    kind: card
    topic: egfr
    front: Which eGFR equation showed more linear associations with long-term outcomes?
    back: eGFRcr-cys (creatinine plus cystatin C).
    src: { page: 27, quote: "eGFRcr-cys demonstrated much more linear associations with log term outcome measures." }
    status: unverified
  - id: neph.L02.022
    kind: card
    topic: egfr
    front: In the approach to GFR evaluation (Figure 8), what do you do if the creatinine-based eGFR is not thought to be accurate?
    back: Consider sources of error and measure cystatin C (eGFRcr-cys); if a more accurate assessment is still needed, measure GFR.
    src: { page: 27, quote: "Consider sources of error and need for more accurate assessment." }
    status: unverified
  # ---------- p28: non-GFR determinants ----------
  - id: neph.L02.023
    kind: table
    topic: egfr
    title: Non-GFR determinants of creatinine (book p28)
    columns: [Group, Examples]
    rows:
      - ["Body habitus / muscle mass", "Anorexia nervosa, body builders, amputation, paraplegia, class III obesity"]
      - ["Lifestyle (diet)", "Low-protein, keto, vegetarian, high-protein diet and creatine supplements"]
      - ["Illness other than CKD", "Cancer, heart failure, cirrhosis, catabolic and muscle-wasting diseases"]
      - ["Medication effects", "Steroids, drugs decreasing tubular secretion, broad-spectrum antibiotics"]
    blanks: [[1, 1], [2, 1], [3, 1]]
    src: { page: 28, quote: "Anorexia nervosa" }
    status: unverified
  - id: neph.L02.024
    kind: mcq
    topic: egfr
    stem: Which of these lowers serum creatinine independently of GFR, so the creatinine-based eGFR overestimates GFR?
    options:
    - High-protein diet
    - Drugs that decrease tubular creatinine secretion
    - Creatine supplements
    - Body building
    - Above-knee amputation
    answer: 4
    why:
    - High protein intake raises creatinine.
    - Reduced tubular secretion raises creatinine.
    - Creatine supplements raise creatinine, so eGFR reads falsely low.
    - Large muscle mass raises creatinine.
    - Low muscle mass (amputation) lowers creatinine generation, so eGFR reads falsely high.
    src:
      page: 28
      quote: Above knee amputation
    status: unverified
