  # ------------------------------------------------------------------
  - id: hb.L08.lesson2
    title: "إزاي تمسك الدوا متلبّس"
    hook: "رقم واحد اسمه R بيقولك تدوّر فين. وأسبوعين بعد وقف الدوا بيقولولك إذا كنت صح."
    minutes: 9
    pages: [129, 130]
    topics: [diagnosis]
    goals:
      - "تحسب الـ R value وتعرف كل band بيودّي على أنهي workup"
      - "تعرف عناصر الـ drug history والأمراض اللي لازم تستبعدها"
      - "تحكم على الـ dechallenge بالأرقام"
    status: unverified
    steps:
      - kind: explain
        page: 129
        title: "التشخيص = شك + استبعاد"
        text: |
          التشخيص في الكتاب بيتبني على 3 حاجات:

          - **High index of suspicion**: enzymes متلخبطة، hepatitis-like symptoms، أو jaundice في عيان بياخد أدوية.
          - **Drug history**: الـ dose، الـ duration of therapy، والـ ==latency== (الوقت من بداية الدوا لحد الإصابة). والـ workflow بيسأل عن الأدوية والـ supplements في آخر 6 months.
          - ==Exclusion of other causes==: hepatitis B، hepatitis C، alcoholic liver disease، NAFLD، و hemochromatosis.

          الـ latency مهمة: دوا بدأ امبارح صعب يكون السبب، ودوا بقاله سنين من غير مشاكل أقل احتمالًا من دوا جديد.
      - kind: reveal
        page: 129
        prompt: "ليه الاستبعاد ده مهم أوي، مش كفاية إن العيان بياخد دوا؟"
        answer: |
          مفيش test واحد يثبت الـ DILI. الأمراض دي (HBV، HCV، alcohol، NAFLD، hemochromatosis) شائعة وبتعمل نفس الإنزيمات العالية، فلو لقيت ALT عالي على دوا، ممكن يكون الدوا بريء خالص وفيه مرض كبد قديم.

          علشان كده DILI تشخيص بالاستبعاد: الخمسة دول لازم يتشالوا من الحسبة الأول.
      - kind: explain
        page: 129
        title: "الـ R value"
        text: |
          ==R = (ALT ÷ ALT ULN) ÷ (ALP ÷ ALP ULN)==

          - **R > 5** → **hepatocellular**.
          - **R 2–5** → **mixed**.
          - **R < 2** → **cholestatic**.

          المنطق: بنقارن "قد إيه الـ hepatocytes بتنزف ALT" بـ "قد إيه القنوات بتطلّع ALP"، كل واحد منسوب لـ ULN بتاعه.
      - kind: figure
        page: 129
        title: "الـ R بيوديك فين؟"
        alt: "A horizontal R scale from 0 to 8 with bands: below 2 cholestatic, 2 to 5 mixed, above 5 hepatocellular. Below it two work-up boxes. For R below 2: abdominal ultrasound, then MRI or MRCP, then liver biopsy. For R of 2 or more (mixed or hepatocellular): abdominal ultrasound and hepatitis A, B, C, E; then other viruses (CMV, EBV, HSV), autoimmune hepatitis, Budd-Chiari syndrome, ischemic hepatitis and Wilson disease."
        caption: "الـ cholestatic بيدوّر على انسداد (صور). الـ hepatocellular/mixed بيدوّر على فيروسات وأمراض الخلية."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L08c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <text x="165" y="18" text-anchor="middle" class="t-sm t-b">R = (ALT ÷ ALT ULN) ÷ (ALP ÷ ALP ULN)</text>
            <rect x="20" y="32" width="72" height="34" class="fg-acc"/>
            <rect x="92" y="32" width="109" height="34" class="fg-box"/>
            <rect x="201" y="32" width="109" height="34" class="fg-bad"/>
            <text x="56" y="54" text-anchor="middle" class="t-sm t-b">Cholestatic</text>
            <text x="146" y="54" text-anchor="middle" class="t-sm t-b">Mixed</text>
            <text x="255" y="54" text-anchor="middle" class="t-sm t-b">Hepatocellular</text>
            <text x="20" y="82" text-anchor="middle" class="t-sm t-mut">0</text>
            <text x="92" y="82" text-anchor="middle" class="t-sm t-b">2</text>
