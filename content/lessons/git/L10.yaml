  - id: git.L10.lesson3
    title: "الـ manometry وعلاج الـ achalasia"
    hook: "ألوان الـ HRM شكلها خريطة طقس، بس لو فهمت 3 رسومات هتعرف الـ type والعلاج."
    minutes: 9
    pages: [274, 279]
    topics: [manometry, achalasia-tx]
    goals:
      - "تحفظ الضغوط الطبيعية ومعايير الانقباضة الطبيعية"
      - "تفرّق بين types I و II و III"
      - "تختار العلاج وتعرف أرقام كل واحد"
    status: unverified
    steps:
      - kind: explain
        page: 274
        quote: "entails positioning a pressure sensing catheter within the esophagus and then observing the contractility following test swallows."
        title: "الـ manometry بتعمل إيه"
        text: |
          بنحط **pressure-sensing catheter** في المريء ونخلي المريض يبلع، ونشوف الضغوط:
          - الـ UES والـ LES بيبانوا **high-pressure zones** بترتخي مع البلع.
          - الـ body بيعمل **peristaltic contractions**.

          ودلوقتي الـ ==high-resolution manometry== (12-36 channel، مع impedance) هي **the gold standard** لتشخيص الـ motility disorders. والـ impedance بيستخدم catheter فيه **paired electrodes**.
      - kind: table
        page: 276
        quote: "Resting pressure = 100 mmHg"
        title: "الضغوط الطبيعية (mmHg)"
        columns: ["Site", "Resting", "With a swallow"]
        rows:
          - ["UES", "100", "Zero or below"]
          - ["Body", "-5", "Contracts 30-180"]
          - ["LES", "20-40", "Relaxes to 5"]
          - ["Gastric fundus", "5", "-"]
        hide: [[0, 1], [1, 2], [2, 1], [2, 2]]
      - kind: aside
        tone: trap
        page: 276
        quote: "Resting pressure = 20-40 mmHg"
        text: |
          في الكتاب البند التالت مكتوب **"Body of the Esophagus"** تاني، بس الأرقام (resting 20-40، relaxation 5) واضح إنها بتاعة الـ **LES**. ولاحظ إن صفحة 284 بتقول LES pressure **10-35**. لو اتسألت عن الجدول ده، اكتب أرقام الجدول.
      - kind: explain
        page: 277
        quote: "Amplitude of 30-180 mmHg. 3. Duration of 2-6 seconds. 4. Single and occasionally double peaked."
        title: "الانقباضة الطبيعية"
        text: |
          أربع معايير:
          - **Sequential (peristaltic)** من فوق لتحت.
          - ==Amplitude 30-180 mmHg==.
          - **Duration 2-6 seconds**.
          - **Single** وأحيانًا double peaked.

          احفظ الـ 180 والـ 6 كويس: الـ DES في الدرس الجاي بيعدّيهم.
      - kind: explain
        page: 277
        quote: "Elevated resting lower esophageal sphincter (LES) pressure (above 45 mmHg)."
        title: "الـ manometry في الـ achalasia"
        text: |
          - **Resting LES pressure** عالي: هنا مكتوب ==above 45 mmHg== (وصفحة 272 قالت 40، الاتنين في الكتاب).
          - **Incomplete LES relaxation** بعد البلع.
          - **Aperistalsis** في الجزء الـ smooth من الـ body.
          - لو الانقباضات الـ simultaneous أعلى من **60 mmHg** يبقى اسمها **vigorous achalasia**.
      - kind: figure
        page: 277
        quote: "Type II is characterized by panesophageal pressurizations"
        title: "الـ 3 types على الـ HRM"
        alt: "Three stacked simplified pressure-topography panels. Type I: a closed LES bar at the bottom and no pressure in the body. Type II: a closed LES bar and a uniform band of pressure filling the whole esophageal body. Type III: a closed LES bar and a short, steep spastic contraction in the distal body."
        caption: "الخط التقيل تحت = LES مش بيرتخي في التلاتة. الفرق في الـ body: Type I فاضي، Type II ضغط مالي المريء كله، Type III انقباضة spastic في الجزء اللي تحت."
        svg: |
          <svg viewBox="0 0 330 420" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="18" class="t-b">Type I</text>
            <text x="80" y="18" class="t-sm t-mut">no pressure waves in the distal esophagus</text>
            <rect x="10" y="26" width="310" height="96" rx="6" class="fg-thin"/>
            <rect x="10" y="30" width="310" height="8" class="fg-dot-acc"/>
            <rect x="10" y="106" width="310" height="12" class="fg-dot-bad"/>
            <text x="16" y="100" class="t-sm t-mut">LES does not relax</text>
            <text x="10" y="150" class="t-b">Type II</text>
            <text x="80" y="150" class="t-sm t-mut">panesophageal pressurization</text>
            <rect x="10" y="158" width="310" height="96" rx="6" class="fg-thin"/>
            <rect x="10" y="162" width="310" height="8" class="fg-dot-acc"/>
            <rect x="10" y="172" width="310" height="66" class="fg-acc"/>
            <text x="165" y="210" text-anchor="middle" class="t-sm t-b">whole body pressurized at once</text>
            <rect x="10" y="238" width="310" height="12" class="fg-dot-bad"/>
            <text x="10" y="282" class="t-b">Type III</text>
            <text x="80" y="282" class="t-sm t-mut">spastic, ≥20% of swallows</text>
            <rect x="10" y="290" width="310" height="96" rx="6" class="fg-thin"/>
            <rect x="10" y="294" width="310" height="8" class="fg-dot-acc"/>
            <path d="M120 340l25-10 25 10v28h-50z" class="fg-dot-bad"/>
            <text x="190" y="350" class="t-sm t-b">spastic segment</text>
            <rect x="10" y="370" width="310" height="12" class="fg-dot-bad"/>
            <text x="10" y="412" class="t-sm t-mut">Top bar = UES, bottom bar = LES, time runs left to right.</text>
          </svg>
      - kind: mnemonic
        page: 277
        quote: "Type III, at least 20% of swallows reveal rapidly propagating or spastic simultaneous contractions."
        word: "NPS"
        parts:
          - { key: "N", text: "Type I: Nothing in the distal esophagus (no pressure waves)" }
          - { key: "P", text: "Type II: Pressurization of the whole esophagus (panesophageal)" }
          - { key: "S", text: "Type III: Spasm in at least 20% of swallows" }
        hook: |
          **N-P-S** بالترتيب 1-2-3: Nothing، Pressurization، Spasm. سهلة زي الـ **NPS** في الـ survey.
      - kind: check
        page: 277
        quote: "Type II is characterized by panesophageal pressurizations"
        question: "HRM: LES fails to relax, and each swallow pressurizes the whole esophagus at once. Which type?"
        options:
          - "Type II"
          - "Type I"
          - "Type III"
          - "Normal study"
        answer: 0
        why:
          - "صح: panesophageal pressurization = P = Type II."
          - "Type I = Nothing، مفيش ضغط في الـ distal esophagus."
          - "Type III = Spasm في 20% على الأقل من البلعات."
          - "الـ LES مش بيرتخي، يبقى مش طبيعي."
      - kind: table
        page: 278
        quote: "Botulinum toxin, injected into the LES under endoscopic guidance, inhibits acetylcholine release from nerve endings"
        title: "سلّم العلاج"
        columns: ["Option", "How", "Number to remember"]
        rows:
          - ["Nitrates / CCB", "Before meals, lower LES pressure", "Medical, weakest"]
          - ["Botulinum toxin", "Blocks acetylcholine release", "~66%, at least 6 months"]
          - ["Pneumatic dilation", "Balloon 3-4 cm tears circular muscle", "32-98%; perforation 1-5%"]
          - ["Heller myotomy", "Cut LES muscle + partial fundoplication", "62-100% good"]
          - ["POEM", "Submucosal tunnel, cut circular muscle", "Length fits type III"]
        hide: [[1, 2], [2, 1], [2, 2], [3, 2], [4, 2]]
      - kind: explain
        page: 278
        quote: "If the pressure after dilation is less than 10 mmHg, the outcome usually excellent. If it is more than 20 mmHg"
        title: "بعد الـ balloon: قيس الضغط"
        text: |
          الـ ==pneumatic dilation== هي الـ **standard endoscopic therapy**، وأخطر مضاعفة **perforation** في 1-5%.

          وبعدها الضغط بيتنبأ بالنتيجة:
          - أقل من **10 mmHg** = excellent.
          - أكتر من **20 mmHg** = poor.

          ولو الحالة **refractory**: resection مع gastric pull-up أو colon interposition، أو gastrostomy.
      - kind: aside
        tone: tip
        page: 279
        quote: "In patients with type III achalasia, the length of the myotomy can be adjusted to the length of the spastic segment"
        text: |
          ليه الـ **POEM** حلو في **type III**؟ لأن الـ spasm مش في الـ LES بس، طالع في الـ distal body. والـ POEM بيخليك تطوّل الـ myotomy على قد الـ **spastic segment** اللي شفته على الـ HRM. الـ balloon مش هيوصل هناك.
      - kind: case
        page: 278
        quote: "If it is more than 20 mmHg, the clinical outcome usually is poor"
        stem: "A 40-year-old with type II achalasia has pneumatic dilation."
        steps:
          - question: "Which complication must you watch for in the first hours?"
            options: ["Perforation", "Barrett esophagus", "Aspiration of the balloon", "Hypercalcaemia"]
            answer: 0
            why: "الـ major complication هي perforation في 1-5%."
          - reveal: "Six weeks later the LES pressure is 23 mmHg and she still regurgitates."
            question: "What does this pressure predict?"
            options: ["A poor outcome", "An excellent outcome", "Nothing; pressure does not matter", "Conversion to type III"]
            answer: 0
            why: "أكتر من 20 mmHg بعد الـ dilation = poor outcome. أقل من 10 = excellent."
      - kind: try
        items: [git.L10.044, git.L10.045, git.L10.047, git.L10.052, git.L10.059]
    recap:
      - "HRM = gold standard. الانقباضة الطبيعية: sequential، 30-180 mmHg، 2-6 ثواني، single peak."
      - "Achalasia على الـ manometry: LES عالي (فوق 45)، ما بيرتخيش، aperistalsis. فوق 60 mmHg simultaneous = vigorous."
      - "Types: N-P-S = Nothing، Pressurization، Spasm (≥20%)."
      - "Botox 66% لمدة 6 شهور. Balloon 3-4 cm، perforation 1-5%، بعده أقل من 10 ممتاز وفوق 20 وحش. Heller + partial fundoplication 62-100%. POEM لطول الـ spasm في type III."
