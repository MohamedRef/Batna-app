  - id: neph.L05.lesson7
    title: "الـ diuretics والأسباب الخاصة والغسيل"
    hook: "الـ diuretic بيعلّي البول مش الـ GFR. وبعض الأسباب ليها علاج خاص، والغسيل ليه خمس indications."
    minutes: 10
    pages: [113, 115]
    topics: [treatment, dialysis]
    goals:
      - "تعرف إمتى الـ diuretic وإمتى لأ، وتقرأ الـ stress test"
      - "تعالج الـ rhabdo والـ scleroderma crisis والـ postrenal وتعرف ليه"
      - "تعد AEIOU وتختار الـ mode وتعرف الـ prognosis"
    status: unverified
    steps:
      - kind: table
        page: 113
        quote: "KDIGO recommend not using diuretics to prevent AKI. (1B)"
        title: "الـ diuretics في الـ AKI"
        columns: [Use, KDIGO, Grade]
        rows:
          - ["Prevent AKI", "Not recommended", "1B"]
          - ["Treat AKI", "Not suggested, except volume overload", "2C"]
        hide: [[0, 2], [1, 1], [1, 2]]
      - kind: explain
        page: 113
        quote: "KDIGO suggest not using diuretics to treat AKI, except in the management of"
        title: "ليه الـ diuretic مش علاج للـ AKI؟"
        text: |
          الكتاب: الـ diuretic **ممكن** يكون renoprotective، **وممكن** يأذي، ومفيش evidence إنه بيقلّل الـ incidence. الـ KDIGO: لا للـ prevention (**1B**)، ولا للـ treatment إلا للـ **volume overload** (**2C**). استخدامه بس للـ **fluid balance** والـ **hyperkalemia** والـ **hypercalcemia**.

          التفسير المقبول (مش في الكتاب): الـ diuretic بيعلّي **البول**، مش الـ **GFR**. البول الكتير بيطمّن بس الخلايا لسه مجروحة. ولو العيان مش overloaded، الـ diuretic ممكن يجففه ويعمل prerenal فوق الـ ATN. أما الـ K والـ Ca فبيطلعوا مع البول، **عشان** كده ليه مكان هناك.
      - kind: figure
        page: 113
        quote: "Use of furosemide stress test to guide resuscitation"
        title: "Furosemide stress test: رسمة الكتاب"
        image: { file: neph/L05-furosemide-stress-test.webp, book: true }
        alt: "Book flowchart in yellow boxes. Appropriate candidate: felt to be adequately resuscitated, persistent oliguria, doubtful that a fluid, vasopressor or inotrope challenge would help. Furosemide stress test: furosemide-naive 1 mg/kg IV bolus, not naive 1.5 mg/kg. Urine output over 200 ml in two hours: passed, pre-renal oliguria; replace urine output, attempt further hemodynamic manipulation, urine output may be a useful measure of organ perfusion. Under 200 ml: failed, intrinsic renal failure; more fluid, vasopressors or inotropes are unlikely to improve urine output, which is not a meaningful measure of perfusion."
        caption: |
          صناديق صفرا من فوق لتحت:

          1. **Appropriate candidate**: felt to be adequately resuscitated، **persistent oliguria**، ومش متأكدين إن fluid/vasopressor/inotrope challenge هيفيد.
          2. **Furosemide stress test**: **1 mg/kg** intravenous (IV) bolus لو **furosemide naive**، و **1.5 mg/kg** لو مش naive.
          3. **شمال**: urine output (UOP) **>200 ml في ساعتين** = passed ← **Pre-renal oliguria** ← عوّض البول اللي نزل وكمّل hemodynamic manipulation، والبول هنا ==مقياس مفيد== للـ perfusion.
          4. **يمين**: **<200 ml** = failed ← **Intrinsic renal failure** ← زيادة fluids أو pressors ==مش هتعلّي البول==، والبول ==مش مقياس perfusion==.

          يعني اختبار واحد بيقولك تكمّل resuscitation ولا تقف قبل ما تعمل overload.
      - kind: explain
        page: 113
        quote: "Use of furosemide stress test to guide resuscitation"
        title: "مين يتعمله الـ stress test، وليه؟"
        text: |
          الكتاب (الرسمة): العيان المناسب **adequately resuscitated**، عنده **persistent oliguria**، ومش متوقع إن fluid/vasopressor/inotrope هيفيد. الجرعة **1 mg/kg** لو أول مرة ياخد furosemide، و **1.5 mg/kg** لو واخده قبل كده. **> 200 ml في ساعتين** = passed (pre-renal oliguria)؛ **< 200** = failed (intrinsic renal failure).

          التفسير المقبول (مش في الكتاب): الـ furosemide **بيتفرز** من الـ tubule علشان يشتغل، **فـ** الاستجابة بتقيس إن الـ tubules عايشة. الجرعة أعلى في اللي واخده قبل كده **لأن** الـ nephron اتعوّد. ولو فشل، يبقى زيادة المحاليل **مش هتعلّي** البول، وهتعمل overload بس.
      - kind: explain
        page: 114
        title: "Fenoldopam و rhabdo"
        quote: "Aggressive volume repletion (may require 10 L of fluid per day)"
        text: |
          - **Fenoldopam:** pure **D1 agonist** من غير adrenergic stimulation. الدراسات مش حاسمة، وفي الـ critically ill الـ infusion أحسن من الـ low-dose dopamine.
          - **Rhabdomyolysis:** ==fluids كتير (لحد 10 L/day)==، والـ alkaline fluids مفيدة. diuretics بس لو الـ fluids كفاية ومفيش بول، و dialysis، وراقب الـ **calcium و phosphate**.

          الخطوة الجاية بتشرح **ليه** المحاليل الكتير والقلوية في الـ rhabdo.
      - kind: update
        page: 114
        quote: "Fenoldopam mesylate is a pure dopamine type-1 receptor agonist"
        text: "الكتاب كاتب الجرعة **0.1 mg/kg/min**، والجرعة المعروفة **0.1 µg/kg/min** (micrograms). والـ **KDIGO 2012** بيقترح ما تستخدمش الـ fenoldopam للـ prevention أو الـ treatment (2C)."
        ref: "KDIGO AKI guideline 2012"
      - kind: explain
        page: 114
        quote: "Alkaline fluids are beneficial."
        title: "ليه المحاليل الكتير والقلوية في الـ rhabdo؟"
        text: |
          الكتاب: **aggressive volume** (ممكن **10 L/day**)، **alkaline fluids** مفيدة، diuretics بس لو المحاليل كفاية ومفيش بول، dialysis، وركّز على الـ **calcium والـ phosphate** **because of precipitation in damaged tissue**.

          التفسير المقبول (مش في الكتاب):

          - المحاليل بتخفف الـ **myoglobin** وتعدّيه بسرعة قبل ما يعمل casts.
          - في البول **الحمضي** الـ myoglobin بيترسّب أكتر وبيبقى أسمّ، **فـ** القلوي بيقلّل ده.
          - الكالسيوم بيترسّب في العضلة المضروبة **فـ** يقل في الدم في الأول، ولما العضلة تتعافى ممكن يطلع تاني ويعلى.
      - kind: explain
        page: 114
        title: "أسباب ليها علاج خاص"
        quote: "AKI due to scleroderma (scleroderma renal crisis) should be treated with ACE inhibitors"
        text: |
          - **glomerulonephritis (GN) / vasculitis:** immunosuppression و/أو plasmapheresis.
          - **Allergic interstitial nephritis (AIN):** وقّف الدوا.
          - **Scleroderma renal crisis:** ==ACE inhibitors==، الاستثناء اللي بنديه فيه رغم الـ AKI.
          - **Postrenal:** فكّ الانسداد بسرعة، وجهّز fluids و electrolytes للـ diuresis اللي بعدها.
      - kind: explain
        page: 114
        quote: "AKI due to scleroderma (scleroderma renal crisis) should be treated with"
        title: "ليه ACEi في الـ scleroderma crisis بالذات؟"
        text: |
          الكتاب: الـ **scleroderma renal crisis** بيتعالج بالـ **ACE inhibitors**، والـ allergic interstitial nephritis بوقف الدوا، والـ GN/vasculitis بالـ immunosuppression أو plasmapheresis.

          التفسير المقبول (مش في الكتاب): في الـ scleroderma الشرايين الصغيرة في الكلية بتضيق، الكلية تحس بقلة الدم وتطلّع **renin** كتير جدًا، **فـ** ضغط عالي جدًا يضيّق الشرايين أكتر: دايرة. الـ ACEi بيقطع الدايرة دي من نصها، **عشان** كده هو الاستثناء اللي بنديه رغم الـ AKI. والـ AIN بيقف لما الدوا يقف **لأن** هو اللي مشغّل الحساسية.
      - kind: mnemonic
        page: 115
        quote: "Intoxications (lithium, ethylene glycol, etc)"
        word: "AEIOU"
        parts:
          - { key: "A", text: "Acidosis" }
          - { key: "E", text: "Electrolytes, usually hyperkalemia" }
          - { key: "I", text: "Intoxications (lithium, ethylene glycol)" }
          - { key: "O", text: "Overload (volume)" }
          - { key: "U", text: "Uremia (symptoms, signs)" }
        hook: "الحروف المتحركة الخمسة بالإنجليزي. لو العيان قال أيّ واحد فيهم ومش بيتصلّح بالعلاج، يبقى محتاج dialysis."
      - kind: explain
        page: 115
        quote: "Intoxications (lithium, ethylene glycol, etc)"
        title: "ليه كل indication، وليه CRRT في الـ unstable؟"
        text: |
          الكتاب: **AEIOU** (acidosis، electrolytes غالبًا hyperkalemia، intoxications زي lithium و ethylene glycol، overload، uremia)، والـ **IHD** للمستقر، والـ **CRRT** أو **PD** أو **SLED** للـ unstable.

          التفسير المقبول (مش في الكتاب):

          - كل indication هو حاجة **ممكن تموّت** والكلية مش قادرة تطلّعها، والأدوية فشلت.
          - الـ **lithium** والـ **ethylene glycol** جزيئات صغيرة ومش مربوطة بالبروتين، **فـ** الغسيل بيشيلها كويس.
          - الـ **IHD** بيشيل مية كتير في 4 ساعات، والضغط ممكن يقع. الـ **CRRT** والـ **SLED** بيشيلوا نفس الكمية **على وقت أطول**، **يعني** الضغط يتماسك في عيان على pressors.
      - kind: check
        page: 115
        quote: "Hemodynamically stable- IHD"
        question: "AKI with K 7.0 refractory to treatment, BP 80/50 on norepinephrine. Mode?"
        options:
          - "Intermittent hemodialysis"
          - "CRRT, PD or SLED"
          - "No dialysis while on pressors"
        answer: 1
        why:
          - "الـ intermittent hemodialysis (IHD) للـ hemodynamically stable."
          - "صح: الـ unstable ياخد continuous renal/kidney replacement therapy (CRRT) أو peritoneal dialysis (PD) أو slow low efficiency dialysis (SLED)."
          - "الـ hyperkalemia الـ refractory دي indication، والـ mode بس هو اللي بيتغير."
      - kind: check
        page: 115
        quote: "Hemodynamically unstable"
        question: "AKI, hemodynamically unstable on norepinephrine, with refractory hyperkalemia. Which dialysis mode fits the book?"
        options:
          - "CRRT, PD or SLED"
          - "Intermittent hemodialysis"
          - "No dialysis until the BP is normal"
          - "Diuretics instead of dialysis"
        answer: 0
        why:
          - "صح: الـ **hemodynamically unstable** ← CRRT أو PD أو SLED."
          - "الـ IHD للـ **hemodynamically stable**."
          - "الـ K المقاوم indication؛ مينفعش نستنى."
          - "الـ diuretics مش بديل للغسيل في الـ indication."
      - kind: explain
        page: 115
        title: "الـ prognosis"
        quote: "10% of cases requiring dialysis develop ckd"
        text: |
          - الـ **prerenal** والـ **postrenal** أحسن.
          - الكلى ممكن ترجع حتى بعد AKI محتاج dialysis.
          - ==10%== من اللي احتاجوا dialysis بيبقى عندهم chronic kidney disease (CKD).
          - ممكن يحصل death بدري حتى بعد ما الوظيفة ترجع كاملة.

          الخطوة الجاية بتشرح **ليه** الـ AKI بيسيب أثر.
      - kind: figure
        page: 115
        quote: "AKI Outcomes"
        title: "الـ AKI بيسيب إيه: رسمة الكتاب"
        image: { file: neph/L05-aki-outcomes.webp, book: true }
        alt: "Book diagram 'AKI outcomes'. A green box of risk factors (age, race or ethnic group, genetic factors, hypertension, diabetes mellitus, metabolic syndrome) points into a loop in which acute kidney injury and chronic kidney disease lead to each other, around a beige box of disease modifiers (severity of acute kidney injury, stage of chronic kidney disease, number of episodes, duration of acute kidney injury, proteinuria). An arrow leads to a blue box of outcomes: cardiovascular events, kidney events, end-stage renal disease, disability, diminished quality of life, death."
        caption: |
          3 أعمدة:

          - **شمال، الأخضر: Risk factors**: age، race/ethnic group، genetic factors، hypertension، diabetes mellitus، metabolic syndrome.
          - **النص**: دايرة أسهم بين **Acute kidney injury** فوق و **Chronic kidney disease** تحت: كل واحد ==بيجيب التاني==. وجوه الدايرة الصندوق البيج **Disease modifiers**: severity of acute kidney injury، stage of chronic kidney disease، ==number of episodes==، duration، proteinuria.
          - **يمين، الأزرق: Outcomes**: cardiovascular events، kidney events، end-stage renal disease، disability، diminished quality of life، death.

          يعني الـ AKI ==مش حدث بيخلص== لما الـ creatinine يرجع: كل نوبة بتقرّب من الـ CKD ومن الـ outcomes دي.
      - kind: explain
        page: 115
        quote: "10% of cases requiring dialysis develop ckd."
        title: "ليه الـ AKI بيسيب أثر؟"
        text: |
          الكتاب (رسمة ص 115): الـ **risk factors** (السن، العرق، HTN، DM، metabolic syndrome، CKD) والـ **disease modifiers** (شدة الـ AKI، stage الـ CKD، **عدد المرات**، **المدة**، proteinuria) بيحددوا الـ **outcomes**: cardiovascular events، kidney events، ESRD، disability، quality of life أقل، و death.

          التفسير المقبول (مش في الكتاب): الـ nephrons اللي ماتت **مبترجعش**. الباقي بيشتغل زيادة علشان يعوّض (hyperfiltration)، **فـ** الـ creatinine يرجع طبيعي والـ reserve يكون خلص. ومع كل AKI جديد، العدد بيقل أكتر. **عشان** كده الكتاب بيقول الموت ممكن ييجي بدري حتى بعد ما الوظيفة ترجع، والمتابعة مهمة.
      - kind: try
        items: [neph.L05.084, neph.L05.085, neph.L05.086, neph.L05.087]
    recap:
      - "Diuretics: لا للـ prevention (1B)، ولا للـ treatment إلا الـ overload (2C)."
      - "FST: 1 mg/kg (أو 1.5)؛ <200 ml في ساعتين = intrinsic."
      - "Rhabdo: محاليل لحد 10 L وقلوية، وراقب Ca و PO4. Scleroderma crisis: ACEi."
      - "AEIOU؛ stable = IHD، unstable = CRRT أو PD أو SLED."
      - "10% من اللي اتغسلوا يبقوا CKD؛ والموت ممكن ييجي حتى بعد الـ recovery."
    practice: [neph.L05.084, neph.L05.085, neph.L05.086, neph.L05.087, neph.L05.088, neph.L05.089, neph.L05.090, neph.L05.091, neph.L05.092, neph.L05.093, neph.L05.094, neph.L05.095, neph.L05.096, neph.L05.097, neph.L05.098, neph.L05.099, neph.L05.127, neph.L05.128]
