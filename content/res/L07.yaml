    topic: concealment
    stem: Which is NOT an issue with randomized controlled trials (RCTs)?
    options: [Contamination, Losses to follow-up, Recall bias, Bias in assessment of outcome]
    answer: 2
    why:
      - Controls can pick up the intervention, which is a real RCT problem.
      - Losses to follow-up can seriously bias the results.
      - Recall bias comes from asking about past exposure, as in case-control studies; in an RCT the exposure is assigned and recorded.
