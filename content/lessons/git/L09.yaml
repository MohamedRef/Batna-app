  # ------------------------------------------------------------------
  - id: git.L09.lesson1
    title: "رحلة الأكل: هضم وامتصاص في 3 مراحل"
    hook: "عشان تفهم الـ malabsorption لازم تعرف الأكل بيتهضم ويتمص إزاي الأول. كل مرحلة ليها أمراضها."
    minutes: 7
    pages: [246, 249]
    topics: [defs, fat, protein-cho, mucosal]
    goals:
      - "تعرّف الـ malabsorption وتفرّق الـ pan من الـ specific"
      - "تمشي مع الدهون والبروتين والسكريات من البُق لحد الدم"
      - "تعرف كل nutrient بيتمص فين في الأمعاء"
    status: unverified
    steps:
      - kind: explain
        page: 246
        title: "يعني إيه malabsorption؟"
        quote: "This term defines as disorders in which there is a disruption of digestion and nutrient absorption."
        text: |
          الـ ==malabsorption== هو أي مرض بيبوّظ **الهضم** أو **امتصاص** الأكل.

          نوعين:
          - **Pan malabsorption** (GLOBAL): كل الأكل مش بيتمص.
          - **Specific malabsorption** (PARTIAL): nutrient واحد أو نوع واحد، زي اللاكتوز.
      - kind: figure
        page: 246
        quote: "In general, the digestion and absorption of food materials can be divided into three major phases: luminal, mucosal, and postabsorptive."
        title: "3 مراحل، 3 أنواع أمراض"
        alt: "Three boxes left to right joined by arrows: luminal phase in the gut lumen (pancreatic enzymes and bile; diseases are pancreatic insufficiency, low bile salts and gastric surgery), mucosal phase in the enterocyte (brush border enzymes and surface area; diseases are celiac disease, lactase deficiency and resection), postabsorptive phase in the lymphatics and portal blood (diseases are lymphangiectasia and lymphoma)."
        caption: "الأكل بيعدّي على **3 محطات**: الـ lumen، بعدين الـ mucosa، بعدين الـ lymphatics والدم. اسأل نفسك دايمًا: العطل في أنهي محطة؟"
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L09a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="5" y="10" width="320" height="80" rx="8" class="fg-acc"/>
            <text x="15" y="32" class="t-b">1 Luminal (intraluminal)</text>
            <text x="15" y="52" class="t-sm">Pancreatic enzymes + bile salts</text>
            <text x="15" y="72" class="t-sm t-mut">Pancreatic insufficiency, low bile salts, gastric surgery</text>
            <path d="M165 90 L165 108" class="fg-arrow" marker-end="url(#L09a)"/>
            <rect x="5" y="110" width="320" height="80" rx="8" class="fg-box"/>
            <text x="15" y="132" class="t-b">2 Mucosal</text>
            <text x="15" y="152" class="t-sm">Intact surface + brush border enzymes</text>
            <text x="15" y="172" class="t-sm t-mut">Celiac, lactase deficiency, resection</text>
            <path d="M165 190 L165 208" class="fg-arrow" marker-end="url(#L09a)"/>
            <rect x="5" y="210" width="320" height="80" rx="8" class="fg-bad"/>
            <text x="15" y="232" class="t-b">3 Postabsorptive</text>
            <text x="15" y="252" class="t-sm">Lymphatics (chylomicrons) + portal blood</text>
            <text x="15" y="272" class="t-sm t-mut">Lymphangiectasia, lymphoma</text>
          </svg>
      - kind: explain
        page: 246
        title: "الدهون: أصعب أكلة"
        quote: "the fat digestion starts by the action of pancreatic lipase at the duodenum on the food bolus"
        text: |
          الـ ==pancreatic lipase== بيبدأ في الـ **duodenum**: يكسّر الـ long-chain triglycerides لـ **monoglycerides** و **free fatty acids**.

          دول يتجمعوا مع الـ **bile acids** والـ phospholipids ويعملوا ==micelles== تدخل الـ jejunal enterocytes. جوّه الخلية يتعاد تركيبهم لـ **chylomicrons** تمشي في الـ **lymphatics**.
      - kind: order
        page: 246
        quote: "combine with bile acids and phospholipids to form micelles that pass through jejunal enterocytes"
        prompt: "رتّب رحلة الدهون (long-chain):"
        steps:
          - "Lipase splits triglycerides"
          - "Micelles form with bile acids"
          - "Micelles enter jejunal enterocytes"
          - "Chylomicrons are built"
          - "Lymphatics carry them away"
        why: "Lipase الأول، بعدين bile salts تعمل micelles، تدخل الخلية، تتحول chylomicrons، وتمشي في الـ lymph. أي خطوة تقع = steatorrhea."
      - kind: aside
        tone: exam
        page: 247
        quote: "Medium chain triglycerides MCT absorbed directly into portal blood without the need of miceller formation."
        text: |
          الـ **MCT** (medium-chain triglycerides) بيتمص **مباشرة في الـ portal blood** من غير micelles ولا chylomicrons.

          علشان كده الـ MCT oil بينفع عيان عنده نقص bile أو **lymphatic obstruction**.
      - kind: explain
        page: 247
        title: "أرقام وفخاخ الدهون"
        quote: "a person may lose nearly 90% of lipase output from the pancreas before the efficiency of fat digestion and absorption is affected"
        text: |
          - الـ lipase شغال أحسن على **pH 8** (alkaline)، والـ **hyperacidity** بتقفله.
          - البنكرياس لازم يخسر حوالي ==90%== من الـ lipase قبل ما الدهون تتأثر.
          - نقص الـ bile salts (biliary obstruction أو liver disease) = **mild steatorrhea** بس.
          - الـ **bacterial overgrowth** بيعمل deconjugation للـ bile salts، فمفيش micelles. والـ bile salts اللي ما اتمصّتش بتعمل **إسهال** في القولون.
          - الدهون اللي ما اتمصّتش بتاخد معاها الـ **A, D, E, K**.
      - kind: explain
        page: 247
        title: "البروتين والسكريات"
        quote: "Enterokinase, a brush border enzyme, activates trypsinogen into trypsin, which converts many pancreatic proteases into their active forms."
        text: |
          **البروتين**: الـ **pepsin** يبدأ في المعدة (pH 1–3، ويقف فوق 5)، ويطلّع **CCK** اللي بيشغّل البنكرياس. الـ ==enterokinase== في الـ brush border يحوّل **trypsinogen** لـ **trypsin**، والـ trypsin يشغّل باقي الإنزيمات. الناتج **oligopeptides** وأحماض أمينية.

          **السكريات**: الـ amylase (ريق وبنكرياس) يكسّر النشا، والـ brush border يكسّر الـ disaccharides لـ glucose و galactose و fructose.
      - kind: table
        page: 248
        quote: "Fructose is transported by facilitated diffusion, but glucose and galactose are transported by a sodium-dependent active transporter (SGLT-1)."
        title: "السكر بيدخل الخلية إزاي؟"
        columns: [Sugar, Transport]
        rows:
          - ["Fructose", "Facilitated diffusion"]
          - ["Glucose", "SGLT-1 (sodium-dependent, active)"]
          - ["Galactose", "SGLT-1 (sodium-dependent, active)"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 248
        quote: "Colonic bacteria ferment unabsorbed carbohydrates into carbon dioxide, methane, hydrogen, and short-chain fatty acids"
        prompt: "عيان عنده lactase deficiency شرب كوباية لبن. ليه بيتنفخ وبيجيله إسهال؟"
        answer: "اللاكتوز ما اتكسرش فوصل القولون. الـ **colonic bacteria** خمّرته لـ **CO2 و methane و hydrogen** (انتفاخ وغازات) و **short-chain fatty acids** (إسهال)."
      - kind: explain
        page: 248
        title: "الـ mucosal phase والـ lactase"
        quote: "Lactase deficiency, either primary or secondary, is the most common form of disaccharidase deficiency"
        text: |
          الـ mucosal phase محتاج **مساحة سليمة** و **brush border enzymes** سليمة.

          ==Lactase deficiency== (primary أو secondary) هو **أشهر disaccharidase deficiency**. الـ secondary بييجي بعد **rotavirus أو giardia**، **alcoholism**، **celiac**، **radiation**، **Crohn**، و **AIDS enteropathy**.

          وبعد الـ mucosa، الـ **postabsorptive phase**: الـ lymphatics والـ portal blood. لو الـ lymphatics اتسدت، الـ chylomicrons ما تمشيش.
      - kind: figure
        page: 248
        quote: "Site of absorption of each element: at the Proximal small intestine: fat, iron, and calcium."
        title: "خريطة الامتصاص"
        alt: "A vertical small bowel strip from duodenum to colon with labels: proximal part absorbs fat, iron and calcium; proximal and middle parts absorb carbohydrate, folic acid and water-soluble vitamins; middle part absorbs protein; terminal ileum absorbs bile salts and vitamin B12; the whole gut and colon absorb water and electrolytes."
        caption: "الحديد والكالسيوم **فوق**، الـ ==B12== والـ bile salts **تحت** في الـ terminal ileum. عشان كده الـ celiac بيعمل anemia حديد، والـ Crohn في الـ ileum بيعمل نقص B12."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="10" width="40" height="250" rx="16" class="fg-acc"/>
            <rect x="20" y="10" width="40" height="70" rx="16" class="fg-good"/>
            <rect x="20" y="200" width="40" height="60" rx="16" class="fg-bad"/>
            <rect x="10" y="266" width="60" height="28" rx="8" class="fg-box"/>
            <text x="40" y="285" text-anchor="middle" class="t-sm t-b">Colon</text>
            <path d="M62 40 L84 40" class="fg-thin"/>
            <text x="90" y="36" class="t-sm t-b">Proximal</text>
            <text x="90" y="52" class="t-sm">fat, iron, calcium</text>
            <path d="M62 100 L84 100" class="fg-thin"/>
            <text x="90" y="96" class="t-sm t-b">Proximal + middle</text>
            <text x="90" y="112" class="t-sm">carbohydrate, folic acid,</text>
            <text x="90" y="128" class="t-sm">water-soluble vitamins</text>
            <path d="M62 160 L84 160" class="fg-thin"/>
            <text x="90" y="156" class="t-sm t-b">Middle</text>
            <text x="90" y="172" class="t-sm">protein</text>
            <path d="M62 230 L84 230" class="fg-thin"/>
            <text x="90" y="226" class="t-sm t-b">Terminal ileum</text>
            <text x="90" y="242" class="t-sm">bile salts, vitamin B12</text>
            <text x="90" y="284" class="t-sm t-mut">Whole gut + colon: water, electrolytes</text>
          </svg>
      - kind: check
        page: 249
        quote: "at the distal part of terminal ileum absorption of bile salt, Vit. B 12 occurs"
        question: "After terminal ileal resection, which pair is lost?"
        options:
          - "Vitamin B12 and bile salts"
          - "Iron and calcium"
          - "Folic acid and glucose"
          - "Protein only"
        answer: 0
        why:
          - "صح: الـ terminal ileum بيمص الـ B12 والـ bile salts."
          - "دول proximal."
          - "دول proximal و middle."
          - "البروتين middle، ومش هو اللي بيضيع هنا."
      - kind: try
        items: [git.L09.003, git.L09.007, git.L09.012, git.L09.018, git.L09.026]
    recap:
      - "Malabsorption = عطل في الهضم أو الامتصاص؛ pan (global) أو specific (partial)."
      - "3 مراحل: luminal، mucosal، postabsorptive."
      - "الدهون: lipase ← micelles (bile) ← chylomicrons ← lymph. الـ MCT على الـ portal blood مباشرة."
      - "Lipase pH 8، لازم يضيع 90% قبل الـ steatorrhea؛ الـ SIBO بيبوّظ الـ bile salts."
      - "Fructose diffusion؛ glucose و galactose بالـ SGLT-1. Lactase deficiency أشهر disaccharidase deficiency."
      - "حديد وكالسيوم فوق، B12 و bile salts في الـ terminal ileum."
    practice: [git.L09.001, git.L09.002, git.L09.003, git.L09.004, git.L09.005, git.L09.006, git.L09.007, git.L09.008, git.L09.009, git.L09.010, git.L09.011, git.L09.012, git.L09.013, git.L09.014, git.L09.015, git.L09.016, git.L09.017, git.L09.018, git.L09.019, git.L09.020, git.L09.021, git.L09.022, git.L09.023, git.L09.024, git.L09.025, git.L09.026, git.L09.027]
