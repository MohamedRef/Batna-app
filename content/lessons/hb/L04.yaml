        text: |
          ==Recent thrombus== في الـ portal vein و/أو الـ right أو left branches، وممكن يمتد للـ **mesenteric** أو **splenic veins**.

          ومهم: الـ guidelines هنا بتتكلم عن الـ acute PVT من غير **malignancy** ولا **cirrhosis**. الـ PVT في الـ cirrhosis له درس لوحده.

          فكّر فيه في أي عيان عنده **abdominal pain**.
      - kind: reveal
        page: 74
        quote: "SIRS is present in 85% of patients with mild non-specific symptoms … PVT is recognised only at the stage of cavernomatous transformation"
        prompt: "ليه الـ acute PVT بيتشخّص متأخر جدًا في عيانين كتير؟"
        answer: |
          لأن **85%** عندهم **SIRS** مع أعراض خفيفة ومش **specific** (شوية وجع وسخونية). فالتشخيص بيفوت، والـ PVT بيتكشف بس في مرحلة الـ ==cavernomatous transformation==، يعني بعد ما الفرصة راحت.
      - kind: explain
