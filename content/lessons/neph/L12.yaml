          الأسماء من الكتاب: **mucinous gastric**، **ovarian**، **lymphomas**، **AML**، خصوصًا ==especially when metastatic==.

          التفسير المقبول (مش في الكتاب): الورم المنتشر بيبعت خلايا صغيرة بتقعد في الأوعية الدقيقة وتعمل microthrombi، والـ mucin بيحرّك التجلط. وكمان الكتاب بيقول إن **therapies** نفسها سبب secondary مهم، يعني TMA في عيان على chemo ممكن تكون من الدوا مش من الورم.
