          - "الـ IVIG ما بيخليهاش آمنة."
          - "مش BCG بس: polio، measles، rubella، mumps كمان."
          - "الكتاب ذكر XLA بالاسم في المنع."
      - kind: explain
        remind: [rheum.L11.064]
        page: 190
        title: "الجرعة والمآل"
        quote: "Adult Dose 200-400 mg/kg IV q3-4wk to achieve a level of >400 mg/dL Prognosis has improved significantly since the introduction of IVIG therapy to routine practice."
        text: |
          - **IVIG:** بيرفع الـ antibody titres لمدة **شهر**. الجرعة **200–400 mg/kg** كل **3–4 أسابيع** عشان الـ IgG يبقى ==>400 mg/dL==. فوق **500** مش بالضرورة أحسن (إلا في بعض الـ infections المزمنة) وبيغلّي التكلفة جدًا
          - **المآل** اتحسن جدًا مع الـ IVIG، بس لسه: الوفاة من **overwhelming infections**، و ==chronic lung و liver disease==
          - اللي بيعيش كفاية: ==autoimmune diseases و cancers== بنسبة **several-fold higher**
          - **SCID** بيموت في **أول سنة** من غير BMT، ولو اتعمل في **أول 3 شهور** النجاة حوالي **93%**

          ليه كل 3–4 أسابيع؟ لأن الكتاب بيقول التأثير شهر، والتفسير المقبول (مش في الكتاب): ده تقريبًا عمر الـ IgG في الدم.
      - kind: aside
        tone: exam
        page: 190
        quote: "For those who survive long enough, autoimmune diseases and cancers become a serious threat because the incidence of these diseases is several-fold higher in these patients than in matched controls."
        text: |
          في الـ essay: لما الـ infections تتسيطر عليها، ==autoimmune diseases و cancers== بيبقوا الخطر الأكبر على المدى الطويل، لأن نسبتهم **several-fold higher**. ولو السؤال عن SCID: اكتب ==BMT في أول 3 شهور = 93%==.
      - kind: try
        items: [rheum.L11.052, rheum.L11.053, rheum.L11.055, rheum.L11.062, rheum.L11.084]
    recap:
      - "HAE: C1INH غايب (I) أو بايظ (II)، autosomal dominant، تورم 2–5 أيام من غير التهاب، بطن شبه جراحة. C4 واطي حتى بين النوبات."
