  - id: neph.L11.013
    kind: order
    topic: aki-epi
    prompt: Order the chain that lowers serum creatinine in normal pregnancy.
    steps:
      - Blood volume and cardiac output rise, systemic vascular resistance falls
      - Intrarenal vasodilation increases effective renal plasma flow
      - Hyperfiltration raises GFR by 40-60%
      - Serum creatinine falls to about 0.4-0.6 mg/dL
    src: { page: 354, quote: "While AKI in the general population is well defined by the RIFLE (Risk, Injury, Failure, Loss and End stage) criteria, the KDIGO (Kidney Disease Improving Outcomes) guidelines and the AKI Network (AKIN) criteria, pregnancy-related AKI is difficult to determine due to non-validation of these AKI diagnostic criteria in the pregnant population.(9) Pregnancy results in an increase in blood volume, a decrease in systemic vascular resistance, and an increase in cardiac output. In the setting of hyper filtration, intra renal vasodilation and an increase in effective plasma flow, glomerular filtration rate increases by 40–60%, resulting in a physiological reduction in serum creatinine.(10) The normal level of serum creatinine in pregnancy is lower than the baseline usually ranging between 0.4 and 0.6 mg/dL range. Due to the lower baseline creatinine in pregnancy, the detection of AKI is further confounded.(11) Often, a serum creatinine value is unavailable prior to pregnancy. This, along with limited accuracy of the current AKI diagnostic criteria in the general population, makes the early and accurate diagnosis of AKI in pregnancy challenging. Since routine monitoring of kidney function is not a standard of care in pregnant women, a comprehensive assessment of AKI, including differentials, is warranted." }
    status: unverified
  - id: neph.L11.014
    kind: mcq
    topic: aki-epi
    stem: "A 29-year-old at 26 weeks has a serum creatinine of 0.9 mg/dL. She has no earlier value. How should this be read?"
    options:
      - It is normal, because 0.9 mg/dL is within the adult reference range
      - It may reflect kidney injury, because normal creatinine in pregnancy is about 0.4-0.6 mg/dL
      - It is diagnostic of KDIGO stage 3 AKI
      - It can only be interpreted after a 24-hour urine collection
      - It is explained by hemoconcentration of late pregnancy
    answer: 1
    why:
      - The non-pregnant range does not apply; hyperfiltration lowers the baseline.
      - "Correct: the lower pregnancy baseline means a 'normal-looking' value can hide AKI."
      - Staging needs a baseline; none is available, and KDIGO is not validated in pregnancy.
      - The book stresses trends in creatinine, not a mandatory 24-hour collection.
      - Pregnancy causes hemodilution, not hemoconcentration.
    src: { page: 354, quote: "While AKI in the general population is well defined by the RIFLE (Risk, Injury, Failure, Loss and End stage) criteria, the KDIGO (Kidney Disease Improving Outcomes) guidelines and the AKI Network (AKIN) criteria, pregnancy-related AKI is difficult to determine due to non-validation of these AKI diagnostic criteria in the pregnant population.(9) Pregnancy results in an increase in blood volume, a decrease in systemic vascular resistance, and an increase in cardiac output. In the setting of hyper filtration, intra renal vasodilation and an increase in effective plasma flow, glomerular filtration rate increases by 40–60%, resulting in a physiological reduction in serum creatinine.(10) The normal level of serum creatinine in pregnancy is lower than the baseline usually ranging between 0.4 and 0.6 mg/dL range. Due to the lower baseline creatinine in pregnancy, the detection of AKI is further confounded.(11) Often, a serum creatinine value is unavailable prior to pregnancy. This, along with limited accuracy of the current AKI diagnostic criteria in the general population, makes the early and accurate diagnosis of AKI in pregnancy challenging. Since routine monitoring of kidney function is not a standard of care in pregnant women, a comprehensive assessment of AKI, including differentials, is warranted." }
    status: unverified
  # ---------- p354-356: causes by trimester ----------
  - id: neph.L11.015
    kind: card
    topic: aki-causes
    front: Which two factors are key determinants of the cause of AKI in a pregnant woman?
    back: The gestational age and the clinical presentation.
    src: { page: 354, quote: "Causes of acute kidney injury during pregnancy Like the general population, the causes of AKI in pregnant women can be divided into three groups: prerenal, intra renal, and postrenal causes. Age of gestation and clinical presentation are important determinants of AKI in a" }
    status: unverified
  - id: neph.L11.016
    kind: enumerate
    topic: aki-causes
    prompt: Mention the causes of AKI in the first trimester.
    points:
      - Hyperemesis gravidarum (volume depletion)
      - Septic abortion (acute tubular necrosis)
      - De novo or flare of glomerulonephritis such as lupus nephritis
      - Placental rupture and hemorrhage (prerenal)
    pass: 3
    hook: "التريمستر الأول: «ترجيع، إجهاض ملوث، لوبس، ونزيف» = hyperemesis gravidarum (volume depletion)، septic abortion (ATN)، GN جديد أو flare زي lupus nephritis، وplacental rupture وhemorrhage (prerenal)."
    src: { page: 355, quote: "pregnant woman (Fig1). In the first trimester, due to hormonal variations, women commonly experience \"morning sickness\" with an increase in nausea and vomiting as well as poor appetite. Hyperemesis gravidarum, with the associated volume depletion, can result in AKI. Septic abortion is another common cause of AKI, especially in developing counties, and can lead to acute tubular necrosis. Although rare, women may experience a denovo or a flare of glomerulonephritis such as lupus nephritis during pregnancy. Placental rupture and hemorrhage are other causes of prerenal AKI, while posing a considerable risk for maternal mortality. Due to the hypercoagulable nature of pregnancy, women have a high risk of acute cortical necrosis in the setting of severe hypotension. During the second and third trimesters, the causes of AKI are more specific to an isolated pregnancy-related complication. These include preeclampsia, hemolysis, elevated liver enzymes, low platelet count (HELLP) syndrome, acute fatty liver of pregnancy (AFLP), thrombotic microangiopathies like thrombotic thrombocytopenic purpura (TTP) and atypical hemolytic uremic syndrome (aHUS), and urinary tract infection and pyelonephritis. Post-obstructive AKI is more common in the second and third trimester due to the growing uterus (11) directly compressing the nearby ureters. We describe below the important causes of AKI during pregnancy." }
    status: unverified
    tags: [high-yield]
