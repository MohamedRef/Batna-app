items:
  # ---------- p23-24: definition ----------
  - id: rheum.L02.001
    kind: card
    topic: definition
    front: What are gout and pseudogout?
    back: Inflammatory arthritides (crystal-induced synovial inflammation) due to monosodium urate crystals (gout) or calcium pyrophosphate dihydrate crystals (pseudogout).
    src: { page: 23, quote: "Gout and pseudoguot are inflammatory arthitides (crystal – induced synovial inflammation) due to monosodium urate (MSU, gout) or calcium pyrophosphate" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L02.002
    kind: card
    topic: definition
    front: Patterns in which gout and pseudogout can present?
    back: Acute mono- or oligoarticular disease, or a chronic polyarthropathy resembling osteoarthritis or rheumatoid arthritis; they may coexist with other joint diseases.
    src: { page: 23, quote: "Can present as acute mono – or oligoarticular disease, or as a chronic polyarthropathy resemblimg osteoarthritis or rheumatoid arthritis." }
    status: unverified
  - id: rheum.L02.003
    kind: card
    topic: definition
    front: Define gout.
    back: A disease from deposition of monosodium urate monohydrate crystals in joint or peri-articular tissues as a result of hyperuricaemia (supersaturation of extracellular fluids).
    src: { page: 23, quote: "Gout is a disease resulting from deposition of monosodium urate monohydrate crystals in tissues (joint or peri-articular tissues) as a result of hyperuricaemia" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L02.004
    kind: card
    topic: definition
    front: Is gout curable, and what happens if it is neglected?
    back: Gout is a curable disease; neglected gout becomes severe and difficult to treat.
    src: { page: 24, quote: "Gout is a curable disease. Neglected gout becomes a severe and difficult to treat disease." }
    status: unverified
  - id: rheum.L02.005
    kind: cloze
    topic: definition
    text: "Gout is commoner in men than women ({{c1::10 : 1}}); peak onset in men is {{c2::40-50}} years, in women after {{c3::60}}."
    src: { page: 24, quote: "Gout commoner in men > women [10 : 1]. Peak age of onset in men 40 – 50 yrs. Females > 60 years." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L02.006
    kind: card
    topic: definition
    front: What is the commonest cause of inflammatory arthritis in men over 40?
    back: Gout.
    src: { page: 24, quote: "Gout is the commonest cause of inflammatory arthritis in men over 40 yrs of age." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L02.007
    kind: card
    topic: definition
    front: What does gout before young adulthood suggest?
    back: A specific enzyme defect.
    src: { page: 24, quote: "Rarely occurs before young adulthood {when it occurs suggests a specific enzyme defect}." }
    status: unverified
  - id: rheum.L02.008
    kind: card
    topic: definition
    front: Why is gout increasing in older women?
    back: Diuretic use.
    src: { page: 24, quote: "Prevalence of older women is increasing with diuretic use." }
    status: unverified
  - id: rheum.L02.009
    kind: cloze
    topic: definition
    text: "Only {{c1::15%}} of all patients with hyperuricaemia develop gout."
    src: { page: 24, quote: "Only 15% of all patients with hyperuricaemia develop gout." }
    status: unverified
    tags: [numbers, exam-trap]
  # ---------- p25-26: hyperuricemia ----------
  - id: rheum.L02.010
    kind: card
    topic: hyperuricemia
    front: Two ways to define hyperuricaemia (p25)?
    back: Serum uric acid above the theoretical solubility of MSUM in physiological conditions (6.0 mg/dl), or more than 2 standard deviations above the population mean.
    src: { page: 25, quote: "As a serum uric acid above the theoretical solubility of MSUM in physiological conditions 6.0 mg/dl." }
    status: unverified
    tags: [high-yield, numbers]
  - id: rheum.L02.011
    kind: cloze
    topic: hyperuricemia
    text: "About {{c1::one third}} of the body uric acid pool comes from diet and {{c2::two thirds}} from endogenous purine metabolism."
    src: { page: 25, quote: "About one third of the body uric acid pool is derived from dietary sources and two thirds from endogenous purine metabolism." }
    status: unverified
    tags: [numbers]
  - id: rheum.L02.012
    kind: cloze
    topic: hyperuricemia
    text: "Uric acid is eliminated via the {{c1::kidneys (two thirds)}} and the {{c2::gut (one third)}}."
    src: { page: 25, quote: "its elimination via the kidneys (two-thirds) and gut (one third)." }
    status: unverified
  - id: rheum.L02.013
    kind: card
    topic: hyperuricemia
    front: Which enzyme catalyses the end steps of uric acid formation, and what are they?
    back: Xanthine oxidase; hypoxanthine to xanthine, then xanthine to uric acid.
    src: { page: 25, quote: "xanthine oxidase catalyses the end conversion hypoxanthine to xanthine and then xanthine to uric acid." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L02.014
    kind: table
    topic: hyperuricemia
    title: Factors that predispose to chronic hyperuricaemia and gout (p26)
    columns: [Group, Causes]
    rows:
      - ["Diminished renal excretion (common)", "Inherited isolated tubular defect (under-excretors, 75% of primary gout); renal failure; drugs; lead toxicity; lactic acidosis (alcohol)"]
      - ["Increased production (uncommon)", "Increased purine turnover (myelo- and lymphoproliferative disorders); increased de novo synthesis (over-producers, 20% of primary gout)"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 26, quote: "Inherited isolated renal tubular defect (\"under- excretors\") =75% of 1ry gout." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L02.015
    kind: mcq
    topic: hyperuricemia
    stem: "What is the commonest mechanism of hyperuricaemia in primary gout?"
    options: [Inherited isolated renal tubular under-excretion, Increased de novo purine synthesis, HGPRT deficiency, Increased purine turnover from myeloproliferative disease]
    answer: 0
    why:
      - "Correct: under-excretors are 75% of primary gout; diminished renal excretion is the common group."
      - "Over-producers are 20% of primary gout."
      - "Specific enzyme defects are under 1% of primary gout."
      - "Increased purine turnover is a secondary, uncommon cause."
    src: { page: 26, quote: "Inherited isolated renal tubular defect (\"under- excretors\") =75% of 1ry gout." }
    status: unverified
  - id: rheum.L02.016
    kind: enumerate
    topic: hyperuricemia
    prompt: Enumerate the drugs that cause hyperuricaemia by reducing renal excretion (p26).
    points: [Thiazide diuretics, Loop diuretics, Low-dose aspirin, Cyclosporine, Pyrazinamide]
    pass: 4
    src: { page: 26, quote: "Chronic drug therapy: thiazide and loop diuretics, low-dose aspirin, cyclosporine, pyrazinamide." }
    status: unverified
