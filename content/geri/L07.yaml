  # ---------- p111-112: functional assessment ----------
  - id: geri.L07.027
    kind: card
    topic: function
    front: What can functional assessment encompass?
    back: Mobility, activities of daily living, and the ability to use technologies for telecare; sensory loss also affects function.
    src: { page: 111, quote: "Ordinary clinical examination\n  Functional assessment (ADL, IADL)\n    Functional assessment can encompass multiple factors like mobility, activities of daily living and the ability to interact with technologies used for telecare. Another factor impacting on function, is sensory loss, as someone with poor vision or hearing can still be as functional as anyone else but with very different coping strategies.\n    Sudden loss in function may indicate acute illness and guide towards active investigation and management; a slow-sustained loss of function may steer the patient to a more supportive care environment." }
    status: unverified
  - id: geri.L07.028
    kind: card
    topic: function
    front: Does poor vision or hearing make an older person non-functional?
    back: Not necessarily. They can be as functional as anyone else, but with very different coping strategies.
    src: { page: 111, quote: "Ordinary clinical examination\n  Functional assessment (ADL, IADL)\n    Functional assessment can encompass multiple factors like mobility, activities of daily living and the ability to interact with technologies used for telecare. Another factor impacting on function, is sensory loss, as someone with poor vision or hearing can still be as functional as anyone else but with very different coping strategies.\n    Sudden loss in function may indicate acute illness and guide towards active investigation and management; a slow-sustained loss of function may steer the patient to a more supportive care environment." }
    status: unverified
