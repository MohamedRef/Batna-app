  # ------------------------------------------------------------------
  - id: hb.L10.lesson5
    title: "نزرع ولا نستنى؟ الـ prognosis و King's College"
    hook: "القرار ده بيتاخد في ساعات. اعرف الأرقام اللي بتقول «اتصل بمركز الزرع دلوقتي»."
    minutes: 10
    pages: [183, 187]
    topics: [prognosis, transplant]
    goals:
      - "تعدّ الـ general prognostic indicators"
      - "تفرق بين primary و secondary ALF من ناحية الزرع"
      - "تحفظ King's College و Clichy criteria"
    status: unverified
    steps:
      - kind: explain
        page: 183
        title: "الزرع غيّر اللعبة"
        text: |
          ==Emergent liver transplantation== هو أهم تطور في علاج الـ ALF، و غيّر الـ survival تمامًا.

          قرار الزرع بيعتمد على سؤالين:
          - **هيعيش من غير زرع؟** يعني prediction of survival without transplant.
          - **هيعيش بعد الزرع؟** يعني مش too sick، ومستوفي الـ listing criteria، ومفيش comorbid contraindication.

          **ليه السرعة؟** الـ multi-organ failure بتتقدم وهو مستني، وكتير من المرضى بيسوءوا قبل ما الكبد ييجي.

          علشان كده الـ prognostic assessment لازم يحصل في مكانين مع بعض: المستشفى اللي وصلها أول، ومركز الزرع. وقرار النقل والزرع يتاخد في أقرب فرصة.
      - kind: mnemonic
        page: 184
        word: "HEAS"
        parts:
          - { key: "H", text: "Hepatic encephalopathy: any HE means critical care review and transfer to a liver center" }
          - { key: "E", text: "Extra-hepatic organ failure, especially renal" }
          - { key: "A", text: "Adverse etiology and presentation: subacute, indeterminate cause" }
          - { key: "S", text: "Severity of liver injury: coagulopathy, bilirubin" }
        hook: |
          الأربع domains بتوع الـ **early prognosis**: «**HEAS**» زي «هِيس!» اللي بتقولها لما حد يعمل دوشة في المحاضرة 🤫. لو واحد منهم ظهر، اسكت كده واتصل بمركز الزرع.
      - kind: explain
        page: 184
        title: "تفاصيل الـ domains"
        text: |
          **H: Hepatic encephalopathy**
          - ليها أهمية prognostic كبيرة، وعلشان كده هي في قلب تعريف الـ ALF.
          - في الـ subacute، حتى الـ low grade HE معناها prognosis وحش جدًا. أما في الـ hyperacute، نفس الدرجة ممكن تخف بالعلاج.
          - فاستخدام threshold واحد لكل المرضى **overly simplistic**.
          - القاعدة العملية: أي HE = critical care assessment و نقل لمركز كبد.
          - لو فيه أكتر من سبب لنقص الوعي: ==arterial ammonia== عالي = HE.

          **E: Extra-hepatic organ failure**
          - خصوصًا الكلية. marker للـ severity ومرتبط بـ mortality أعلى، ويستدعي نقاش مع المركز.

          **A: Adverse etiology and presentation**
          - الـ subacute والـ indeterminate etiology: survival وحش من غير زرع، وده سبب لنقاش فوري مع المركز.

          **S: Severity of liver injury**
          - الـ coagulation مهمة في كل الأسباب، بس الـ thresholds اللي تقلق بتختلف حسب السبب والتطور وسن المريض.
          - ومشكلة إضافية: الـ INR مش موحّد دوليًا.
      - kind: check
        page: 185
        question: "An INR of 2.5 would be of immediate concern in which setting, per the book?"
        options:
          - "Subacute ALF"
          - "Acetaminophen hepatotoxicity"
          - "Hepatitis A ALF"
          - "Every cause equally"
        answer: 0
        why:
          - "صح: الكتاب بيضرب المثل ده بالظبط: **INR 2.5** يقلق فورًا في الـ **subacute** مش في الـ acetaminophen."
          - "في الـ acetaminophen الـ INR ممكن يعلى جدًا ويخف."
          - "الـ HAV زي الـ acetaminophen، recovery >50%."
          - "الفكرة إن الـ thresholds بتختلف بالسبب."
      - kind: explain
        page: 186
        title: "علامات تقول «حوّله»"
        text: |
          **Markers تانية**:
          - في الـ DILI غير الـ acetaminophen، خصوصًا الـ subacute والـ acute: الـ **bilirubin** هو key predictor.
          - الـ etiology نفسه مهم للـ prognosis وللقرار، خصوصًا الحاجة للزرع العاجل.

          **الـ poor prognostic signs** اللي تقول «حوّله لمركز زرع»:
          - **Falling transaminases**
          - **Increasing bilirubin و INR**
          - ==Shrinking liver==

          **Prognostic models**: الهدف منها توقيت الزرع قبل ما المريض يبقى too sick، ومع ذلك نسيب وقت للـ spontaneous recovery. أشهرها:
          - ==King's College criteria==
          - **Beaujon-Paul Brousse (Clichy) criteria**
          - وكمان MELD أكبر من 32 مرتبط بـ poor transplant-free survival.

          **النتيجة بعد الزرع**:
          - الـ ALF = 6% من زراعات الكبد في أمريكا.
          - الـ 1-year survival أقل من باقي الـ indications، بس أحسن بكتير من الـ survival من غير زرع لما الـ King's College criteria تبقى موجودة.
          - والـ long-term survival بعد الزرع ممتاز.
      - kind: aside
        tone: trap
        page: 186
        text: |
          الـ ALT بينزل والـ bilirubin بيعلى؟ ده مش «الإنزيمات بتتحسن»! ده الكبد خلص خلاياه ومفيش حاجة تطلع إنزيمات أصلًا. 🚨 علامة وحشة مش كويسة.
      - kind: sort
        page: 185
        prompt: "مين ينفع له emergent transplant (primary) ومين لأ (secondary)؟"
        bins: ["Primary: LT may be an option", "Secondary: LT not an option"]
        cards:
