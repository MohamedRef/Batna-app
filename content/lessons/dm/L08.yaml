  - id: dm.L08.lesson2
    title: "الدهون والسكر والطبق المقسوم"
    hook: "مش كل الدهون شريرة: فيه واحدة بتعلّي الوحش وتنزّل الكويس."
    minutes: 7
    pages: [94, 96]
    topics: [fats, plate]
    goals:
      - "تفرّق الـ healthy fats عن الـ trans fats"
      - "تحفظ حدود الـ AHA والسكر المضاف"
      - "ترسم الطبق المقسوم"
    status: unverified
    steps:
      - kind: explain
        page: 95
        title: "الدهون"
        quote: "Healthy sources of fat can be found in fish, nuts, and certain fruits and vegetables, such as avocados."
        text: |
          الهرم بيقول الـ **fats** تتاكل ==sparingly== لأنها عالية السعرات.

          الدهون الكويسة: **fish**، **nuts**، و **avocado**.
      - kind: explain
        page: 95
        title: "الـ trans fat: الشرير الحقيقي"
        quote: "But unlike saturated fats, trans fats lower HDL cholesterol and may do more damage,"
        text: |
          الـ **trans fatty acids** بتتعمل صناعيًا بإضافة **hydrogen** للزيت السايل علشان يجمد. اسمها على العلبة: ==partially hydrogenated oils==.

          - فيه كميات صغيرة طبيعية في beef و lamb و full-fat dairy.
          - بتعلّي الـ **LDL** زي الـ saturated fat.
          - بس كمان بتنزّل الـ ==HDL==، فضررها أكبر.
      - kind: aside
        tone: analogy
        page: 95
        quote: "But unlike saturated fats, trans fats lower HDL cholesterol and may do more damage,"
        text: "الـ **saturated fat** زي واحد بيرمي زبالة في الشارع (يعلّي LDL). الـ **trans fat** بيرمي زبالة **ويضرب عامل النظافة** كمان (ينزّل HDL)."
      - kind: table
        page: 95
        quote: "advises limiting saturated fat consumption to less than 7% of daily calories and transfat consumption to less than 1%."
        title: "حدود الـ AHA والسكر المضاف"
        columns: [Item, Limit]
        rows:
          - ["Saturated fat", "<7% of calories"]
          - ["Trans fat", "<1% of calories"]
          - ["Sugar at 1,600 kcal", "6 tsp (22 g)"]
          - ["Sugar at 2,200 kcal", "12 tsp (44 g)"]
          - ["Sugar at 2,800 kcal", "18 tsp (66 g)"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: update
        page: 95
        quote: "advises limiting saturated fat consumption to less than 7% of daily calories and transfat consumption to less than 1%."
        text: "الـ AHA 2021 والـ ADA 2025: الـ saturated fat يفضل قليل (حوالي أقل من 6–10%) والـ trans fat **يتجنب خالص**. في الامتحان: **7% و 1%**."
        ref: "AHA Dietary Guidance 2021; ADA Standards of Care 2025, section 5"
      - kind: aside
        tone: tip
        page: 95
        quote: "1,600 calories - Limit sugar to 6 teaspoons per day or 22 grams per day"
        text: "السكر المضاف: **6 / 12 / 18** معلقة لـ **1600 / 2200 / 2800** سعر. كل 600 سعر زيادة = 6 معالق زيادة (حوالي 22 g)."
      - kind: check
        page: 95
        quote: "advises limiting saturated fat consumption to less than 7% of daily calories and transfat consumption to less than 1%."
        question: "2,000 kcal diet. Maximum saturated fat by the lecture's AHA figure?"
        options: ["Under 140 kcal", "Under 20 kcal", "Under 700 kcal", "No limit"]
        answer: 0
        why:
          - "صح: 7% من 2000 = 140 kcal (حوالي 15 g)."
          - "دي حدود الـ trans fat (1%)."
          - "ده 35%."
          - "فيه limit."
      - kind: explain
        page: 96
        title: "الرسايل الستة"
        quote: "Make half your grains whole."
        text: |
          - **Focus on fruits**
          - **Vary your veggies**
          - **Get your calcium-rich foods**
          - ==Make half your grains whole==
          - **Go lean with protein**
          - **Know the limits** on fats و salt و sugars
      - kind: figure
        page: 96
        quote: "fruits and vegetables take up half the plate, with the vegetable portion being a little bigger than the fruit section."
        title: "الطبق المقسوم"
        alt: "A round plate split in half. One half holds vegetables (the larger quarter) and fruit (the smaller quarter). The other half holds grains (larger) and protein (smaller). A small cup of dairy sits beside the plate."
        caption: "نص الطبق ==fruits و vegetables== (والخضار أكبر)، والنص التاني grains أكتر من protein. والطبق نفسه بيمنع الـ **super-big portions**."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <circle cx="140" cy="120" r="105" class="fg-box"/>
            <path d="M140 15 L140 225" class="fg-ink"/>
            <path d="M140 120 L45 75" class="fg-ink"/>
            <path d="M140 120 L240 160" class="fg-ink"/>
            <text x="70" y="150" class="t-sm t-b t-good">Vegetables</text>
            <text x="78" y="64" class="t-sm t-b t-good">Fruit</text>
            <text x="165" y="100" class="t-sm t-b">Grains</text>
            <text x="160" y="190" class="t-sm t-b t-acc">Protein</text>
            <circle cx="285" cy="55" r="28" class="fg-acc"/>
            <text x="285" y="60" text-anchor="middle" class="t-sm t-b">Dairy</text>
          </svg>
      - kind: check
        page: 96
        quote: "Nutrition experts recommend you eat more vegetables than fruit and more grains than protein foods."
        question: "Which plate follows the lecture's big message?"
        options: ["Half veg + fruit (veg bigger); grains more than protein", "Half protein", "Half fruit, no vegetables", "Grains fill three quarters"]
        answer: 0
        why:
          - "صح: نص الطبق خضار وفاكهة (الخضار أكبر)، والـ grains أكتر من الـ protein."
          - "الـ protein أصغر جزء."
          - "الخضار لازم يبقى أكبر من الفاكهة."
          - "الـ grains ربع الطبق تقريبًا مش تلاتة أرباع."
      - kind: try
        items: [dm.L08.030, dm.L08.032, dm.L08.033, dm.L08.038, dm.L08.037]
    recap:
      - "Healthy fat: fish، nuts، avocado. Trans fat = partially hydrogenated oils: ↑LDL و ↓HDL."
      - "AHA: saturated <7%، trans <1%. Sugar: 6/12/18 tsp لـ 1600/2200/2800."
      - "نص الطبق خضار وفاكهة (الخضار أكبر)، grains أكتر من protein."
    practice: [dm.L08.029, dm.L08.030, dm.L08.031, dm.L08.032, dm.L08.033, dm.L08.034, dm.L08.035, dm.L08.036, dm.L08.037, dm.L08.038, dm.L08.039, dm.L08.040, dm.L08.066]
  # ------------------------------------------------------------------
  - id: dm.L08.lesson3
    title: "عدّ الكارب و GI و GL"
    hook: "البطيخ GI بتاعه 72، يعني ممنوع؟ لأ: الـ GL بتاعه 3.6. تعالى نفهم ليه."
    minutes: 10
    pages: [96, 102]
    topics: [carbs, gi]
    goals:
      - "تعرّف الـ carb counting وتحسب حصص"
      - "تحفظ حدود الوجبة للرجالة والستات"
      - "تفرّق GI عن GL وتحسب GL"
    status: unverified
    steps:
      - kind: explain
        page: 96
        title: "Carb counting"
        quote: "It is a meal planning technique for managing blood glucose levels."
        text: |
          ==Carbohydrate counting== هو **meal planning technique** لظبط السكر:
          - تتابع قد إيه **carbohydrate** بتاكل
          - تحدد **maximum** لكل وجبة
          - ومع الـ **physical activity** والدوا (لو محتاج) السكر يفضل في الـ target
      - kind: explain
        page: 97
        title: "الوحدة: 15 جرام"
        quote: "One serving of carbohydrate is measured as 15 grams."
        text: |
          ==One carb serving = 15 g== carbohydrate.

          يعني **slice of bread** = **small fruit** = **ear of corn**: كل واحد حوالي 15 g.

          الـ **starches** في: starchy vegetables (بطاطس، ذرة، بسلة)، legumes، grains، ومنتجات الدقيق (مكرونة، عيش، بسكوت).
      - kind: table
        page: 98
        quote: "1 cup cooked pasta or 1 cup cooked rice 45g carbohydrate"
        title: "فيه كام جرام؟"
        columns: [Food, Carbs]
        rows:
          - ["1 cup rice or pasta", "45 g"]
          - ["Medium potato", "30 g"]
          - ["1 cup corn or peas", "30 g"]
          - ["Small fruit", "15 g"]
          - ["1 cup milk", "12 g"]
          - ["2 small cookies", "15 g"]
        hide: [[0, 1], [1, 1], [3, 1], [4, 1]]
      - kind: aside
        tone: joke
        page: 98
        quote: "1 cup cooked pasta or 1 cup cooked rice 45g carbohydrate"
        text: "كوباية رز واحدة (1 cup cooked rice) = **3 carb servings**. وطبق الكشري المصري المحترم؟ رز ومكرونة وعدس وعيش جنبه… ده مش وجبة، ده **أسبوع كارب** 😅"
      - kind: explain
        page: 99
        title: "الحد في الوجبة"
        quote: "If you are trying to lose weight, use the lower numbers in these ranges for your carb counts by meal."
        text: |
          - **Women:** ==30–60 g== في الوجبة، و 15–30 g في الـ snack
          - **Men:** ==45–75 g== في الوجبة، و 15–30 g في الـ snack
          - عايز تخس (lose weight)؟ استخدم **الأرقام الأقل**.

          وعلى الـ **Nutrition Facts label**: بص على الـ **serving size** و الـ **total carbohydrate per serving**.
      - kind: case
        page: 99
        quote: "If you are trying to lose weight, use the lower numbers in these ranges for your carb counts by meal."
        stem: "A woman with type 2 diabetes plans lunch: 1 cup cooked rice, a small orange, 1 cup milk."
        steps:
          - question: "Total carbohydrate?"
            options: ["72 g", "60 g", "45 g", "30 g"]
            answer: 0
            why: "45 + 15 + 12 = 72 g."
          - question: "Within her per-meal limit?"
            options: ["No: above 30–60 g", "Yes: within 45–75 g", "Yes: within 30–60 g", "No limit for women"]
            answer: 0
            why: "حد الستات 30–60 g؛ الـ 45–75 للرجالة."
          - reveal: "She wants to lose weight."
            question: "Simplest fix?"
            options: ["Half a cup of rice (about 22 g) instead of a full cup", "Add juice", "Swap milk for ice cream", "Skip lunch"]
            answer: 0
            why: "نص كوباية رز تنزّل حوالي 22 g فالمجموع حوالي 50 g، وعايزة تقرب من الحد الأقل. الـ juice والـ ice cream بيزوّدوا كارب."
      - kind: explain
        page: 100
        title: "Glycemic index"
        quote: "A value of 100 represents the standard, an equivalent amount of pure glucose."
        text: |
          الـ ==glycemic index (GI)== رقم بيقول الأكل ده بيعلّي السكر قد إيه، مقارنة بالـ **pure glucose = 100**.

          - كارب بيتهضم **بسرعة** ويطلق glucose بسرعة ← **high GI**
          - كارب بيتهضم **ببطء** ← **low GI**
      - kind: table
        page: 101
        quote: "Glycemic Index classification"
        title: "Glycemic index classification"
        columns: [Class, GI, Examples]
        rows:
          - ["High", "≥70", "Glucose, potato, cornflakes"]
          - ["Medium", "56–69", "Brown bread, white rice"]
          - ["Low", "≤55", "Banana, apple, lentils"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: sort
        page: 101
        quote: "Glycemic Index classification"
        prompt: "صنّف بالـ glycemic index (من جدول الكتاب):"
        bins: ["High ≥70", "Medium 56–69", "Low ≤55"]
        cards:
          - { text: "Baked potato (85)", bin: 0 }
          - { text: "White bread (70)", bin: 0 }
          - { text: "White rice (65)", bin: 1 }
          - { text: "Orange juice (57)", bin: 1 }
          - { text: "Brown rice (50)", bin: 2 }
          - { text: "Red lentils (26)", bin: 2 }
        why: "الـ white bread على الحد بالظبط (70 = high). العدس واطي جدًا لأن فيه fiber و protein بيبطّأوا الهضم."
      - kind: explain
        page: 101
        title: "Glycemic load"
        quote: "Glycemic Load (GL) is a measure of both the quality (the GI value) and quantity (grams per serve) of a carbohydrate in a meal."
        text: |
          الـ GI بيقول **نوع** الكارب، بس مش **كميته**. الـ ==glycemic load== بيجمع الاتنين:

          **GL = GI ÷ 100 × net carbs**
          (net carbs = total carbohydrate − **dietary fiber**)

          - **Low ≤10**، **medium 11–19**، **high ≥20**

          والـ **ADA** بتدعم الـ GI، بس بتقول إن ==total carbohydrate== هو أقوى مؤشر.
      - kind: figure
        page: 102
        quote: "calculation 5 × 72 / 100 = 3.6, so the GL is 3.6."
        title: "البطيخ: GI عالي، GL واطي"
        alt: "Two bars compare watermelon and cooked pasta. Watermelon: GI 72 but only 5 grams of carbohydrate per 100 grams, so GL 3.6, low. A GL scale shows low up to 10, medium 11 to 19, high 20 or more."
