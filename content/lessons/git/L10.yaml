  - id: git.L10.lesson6
    title: "مضاعفات الـ GERD: Barrett والـ stricture"
    hook: "Barrett مش مضاعفة بتوجع، بالعكس، الحرقان ممكن يخف وهو بيتكوّن. وده بالظبط اللي يخوّف."
    minutes: 9
    pages: [288, 292]
    topics: [gerd-complications]
    goals:
      - "تعرّف الـ Barrett وتعرف ليه بيتكوّن ومين يتعمله screening"
      - "تقرا درجات الـ dysplasia وتعرف تعمل إيه في كل درجة"
      - "تعرف الـ peptic stricture والـ bleeding"
    status: unverified
    steps:
      - kind: explain
        page: 288
        quote: "It is a condition in which the squamous epithelium of the esophagus is replaced by metaplastic columnar epithelium containing goblet and columnar cells (specialized intestinal metaplasia)."
        title: "Barrett esophagus"
        text: |
          الـ ==Barrett== = الـ **squamous epithelium** بيتغير لـ **metaplastic columnar** فيه **goblet cells** (specialized intestinal metaplasia).

          - **Endoscopy**: epithelium لونه **orange**، gastric-type، طالع فوق الـ esophagogastric (EG) junction، circumferential أو tongue-like.
          - **Biopsy** لازم علشان تأكد.
          - بيزوّد الـ **adenocarcinoma** حوالي ==11 مرة==، والـ reflux symptoms ممكن **تخف** وهو بيتكوّن.

          ليه الحرقان بيخف لما الـ Barrett يتكوّن؟ التفسير المقبول (مش في الكتاب): الـ **columnar** epithelium أتقل في مقاومة الحمض وأقل في الإحساس من الـ squamous، فده أصلًا **تكيّف**: الجسم بيلبّس المريء بطانة تستحمل. بس التكيّف ده هو اللي بيفتح الباب للـ dysplasia والـ adenocarcinoma.
      - kind: figure
        page: 289
        title: "Barrett في المنظار وتحت الميكروسكوب"
        image: { file: git/L10-barrett.webp, book: true }
        alt: "Book figure: A, squamous epithelium on histology; B, endoscopy of the lower esophagus with salmon-coloured columnar mucosa extending up from the gastro-oesophageal junction into the pale squamous lining; C, columnar epithelium with intestinal metaplasia and a goblet cell."
        caption: |
          **B** في النص: البطانة **البرتقالي** (columnar) طالعة من الـ GEJ لفوق جوه البطانة **الباهتة** (squamous).

          **A** الـ squamous الطبيعي، و**C** الـ columnar فيه ==goblet cell== = intestinal metaplasia.
      - kind: mnemonic
        page: 288
        quote: "The risk factors to develop Barrett and subsequently adenocarcinoma include age older than 50 years, truncal obesity, current or prior history of smoking, or male gender) or in adults with a family history of Barrett esophagus or esophageal adenocarcinoma."
        word: "FOMAS"
        parts:
          - { key: "F", text: "Family history of Barrett or esophageal adenocarcinoma" }
          - { key: "O", text: "Obesity (truncal)" }
          - { key: "M", text: "Male gender" }
          - { key: "A", text: "Age over 50 years" }
          - { key: "S", text: "Smoking, current or past" }
        hook: |
          **FOMAS**: راجل فوق الخمسين، بكرش، بيشرب سجاير، وأبوه كان عنده نفس الحكاية. ده اللي يتعمله **screening EGD** لو عنده GERD.
      - kind: reveal
        page: 288
        quote: "The risk factors to develop Barrett and subsequently adenocarcinoma include age older than 50 years, truncal obesity, current or prior history of smoking, or male gender) or in adults with a family history of Barrett esophagus or esophageal adenocarcinoma."
        prompt: "ليه الـ truncal obesity بالذات، وليه السن فوق الخمسين، في الـ risk factors بتاعة الـ Barrett؟"
        answer: |
          الكتاب بيعدّها: **age > 50**، **truncal obesity**، **smoking** (حالي أو قديم)، **male gender**، و **family history** للـ Barrett أو الـ adenocarcinoma.

          التفسير المقبول (مش في الكتاب): الكرش (truncal) بالذات بيعلّي ضغط البطن فيزوّد الـ reflux، والدهون دي نشطة وبتطلّع مواد التهابية. والسن = سنين أطول من التعرض للحمض، والـ Barrett بيحتاج سنين يتكوّن. والسجاير بتضر الـ DNA في الخلايا اللي بتتغير أصلًا. يعني كل عامل يا بيزوّد الحمض، يا بيطوّل مدته، يا بيسهّل التحول.
      - kind: explain
        page: 289
        quote: "Surveillance endoscopy every 3–5 years is recommended to look for low- or high-grade dysplasia or adenocarcinoma."
        title: "Screening و surveillance وعلاج"
        text: |
          - Gastroesophageal reflux disease (GERD) مع واحد أو أكتر من الـ risk factors = **screening esophagogastroduodenoscopy (EGD)**.
          - اللي معروف إن عنده **nondysplastic Barrett** مش محتاج screening تاني، محتاج ==surveillance every 3-5 years==.
          - **Endoscopic therapy** (RFA، cautery، resection، dissection) لما يبقى فيه **low-grade** أو **high-grade dysplasia** أو **adenocarcinoma**.

          ليه كل 3-5 سنين بس؟ التفسير المقبول (مش في الكتاب): الـ nondysplastic Barrett بيتقدم **ببطء شديد**، فالمنظار كل سنة مش بيلقط حاجة زيادة. لكن أول ما تظهر dysplasia، الخطر بيقرب، فالعلاج بالمنظار بيشيل البطانة الشاذة قبل ما تبقى cancer.
      - kind: figure
        page: 289
        title: "سلّم الـ Barrett: من البطانة للـ cancer"
        quote: "Surveillance endoscopy every 3–5 years is recommended to look for low- or high-grade dysplasia or adenocarcinoma."
        alt: "Five steps from left to right: normal squamous epithelium, non-dysplastic Barrett (surveillance every 3 to 5 years), low-grade dysplasia, high-grade dysplasia, adenocarcinoma. The last three are marked for endoscopic therapy: radiofrequency ablation, cautery, resection or dissection."
        caption: "الـ ==nondysplastic== ← surveillance كل 3-5 سنين. أي **dysplasia** (low أو high) أو adenocarcinoma ← endoscopic therapy."
