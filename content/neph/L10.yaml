  - id: neph.L10.016
    kind: mcq
    topic: drug-tubules
    stem: A man with bipolar disorder on long-term lithium passes large volumes of dilute urine. Water deprivation does not concentrate it and desmopressin does not help. Which tubular lesion explains this?
    options:
      - Distal tubular ADH resistance (nephrogenic diabetes insipidus)
      - Proximal tubular injury (Fanconi syndrome)
      - Distal failure to excrete K+ and H+
      - Membranous glomerulonephritis
      - Thrombotic microangiopathy
    answer: 0
    why:
      - "Correct: lithium causes distal ADH resistance, presenting as nephrogenic DI (p339)."
      - Fanconi syndrome gives glucosuria, aminoaciduria and phosphaturia, not ADH-resistant polyuria.
      - That causes hyperkalaemia and acidosis (amphotericin B, NSAIDs, K-sparing diuretics).
      - Membranous GN causes nephrotic proteinuria; lithium is linked to minimal change instead.
      - TMA follows mithramycin or ciclosporin and presents with AKI, not isolated polyuria.
    src: { page: 339, quote: "Clinical presentation: Nephrogenic diabetes insipidus, DRTA (Type I, IV)" }
    status: unverified
  - id: neph.L10.017
    kind: cloze
    topic: drug-tubules
    text: "Distal tubular failure to excrete K+ and H+ follows {{c1::amphotericin B}}, {{c2::NSAIDs}} and {{c3::K-sparing diuretics}}."
    src: { page: 339, quote: "Drugs: Amphotericin B, NSAIDS, K-sparing diuretics" }
    status: unverified
