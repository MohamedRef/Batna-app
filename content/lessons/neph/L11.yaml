  - id: neph.L11.lesson13
    title: "روشتة الـ hemodialysis للحامل: أكتر، أهدى، وأقل bicarbonate"
    hook: "36 ساعة غسيل في الأسبوع مش مبالغة. كل ساعة فوق الـ 20 بتكبّر البيبي."
    minutes: 9
    pages: [378, 380]
    topics: [hd-rx]
    goals:
      - "تعرف ليه الـ intensive HD وإزاي توصل لـ BUN أقل من 50"
      - "تظبط الـ dialysate والـ dialyzer وتعرف ليه كل رقم"
