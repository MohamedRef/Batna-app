  - id: rheum.L10.lesson3
    title: "أنواع الجزيئات و IL-17 و IL-12/23"
    hook: "-cept ولا -mab؟ الاسم لوحده بيقولك الدوا بيشتغل إزاي، وبيقولك ليه دوا الجلد مش دايمًا دوا المفصل."
    minutes: 9
    pages: [175, 176]
    topics: [molecules, il17-il23]
    goals:
      - "تفرّق soluble receptor و monoclonal antibody و receptor antagonist"
      - "تعرف ليه الـ TNF blocker مع methotrexate أحسن"
      - "تربط الـ IL-17 والـ IL-12/23 بأمراضهم وتعرف ليه"
    status: unverified
    steps:
      - kind: table
        page: 175
        quote: "Types of therapeutic molecules\n  Soluble receptor antagonists (Etanarcept).\n  Monoclonal antibodies to cytokines or their receptors (Infleximab, Adalimumab, Certolizumab, Golomumab, Secukinumab, and ustekinumab)."
        title: "أنواع الجزيئات"
        columns: [Type, Examples]
        rows:
          - ["Soluble receptor", "Etanercept"]
          - ["Monoclonal antibody", "Infliximab, adalimumab, certolizumab, golimumab, secukinumab, ustekinumab"]
          - ["Receptor antagonist proteins", "Anakinra, rilonacept, canakinumab, brodalumab, IL-6R antagonist"]
          - ["Oral small molecule", "JAK inhibitors"]
        hide: [[0, 1], [3, 1]]
      - kind: aside
        remind: [rheum.L01.lesson5:ACEGI]
        tone: tip
        page: 175
        quote: "Types of therapeutic molecules\n  Soluble receptor antagonists (Etanarcept).\n  Monoclonal antibodies to cytokines or their receptors (Infleximab, Adalimumab, Certolizumab, Golomumab, Secukinumab, and ustekinumab)."
        text: |
          الاسم بيقولك النوع: آخره **-cept** = receptor (==etanercept==)، آخره **-mab** = monoclonal antibody: **-ximab** chimeric (infliximab)، **-umab** human (adalimumab، golimumab، secukinumab). (قاعدة تسمية عامة، مش من الكتاب.)
      - kind: explain
        page: 175
        title: "الـ cell surface receptor antagonists: ليه تقفل المستقبل مش الـ cytokine؟"
        quote: "Brodalumab an anti IL-17 receptor antibody."
        text: |
          الكتاب بيعد **cell surface receptors antagonist proteins**: **anakinra**، **rilonacept**، **canakinumab**، **brodalumab** (==anti IL-17 receptor antibody==)، و **IL-6 receptor antagonist**.

          التفسير المقبول (مش في الكتاب): فيه طريقتين تمنع رسالة الـ cytokine:
          - تمسك **الرسالة نفسها** في الدم (زي الـ etanercept أو الـ antibody ضد الـ cytokine).
          - أو تقفل **صندوق البريد**: الـ receptor على الخلية. ده مفيد لما الـ cytokine ليه **أكتر من شكل** بيركب على نفس الـ receptor؛ قفل الـ receptor بيمنعهم كلهم مرة واحدة. عشان كده الـ brodalumab بيقفل الـ IL-17 **receptor**، مش الـ IL-17 زي الـ secukinumab.

          يعني نفس الـ pathway ممكن يتقفل من نقطتين، والاختيار بيفرق في القوة والأعراض الجانبية.
      - kind: explain
        page: 175
        title: "الـ JAK inhibitors: ليه «indirectly»؟ وليه TNF + MTX؟"
        quote: "The combination of a TNF blocker and methotrexate was superior to either"
        text: |
          الكتاب: فيه approach تاني **more indirectly targets an array of cytokines**: حبوب **small molecule** بتتعمل بالتصنيع العادي، بتقفل **cytoplasmic protein tyrosine kinases** زي الـ **Janus kinase (JAK)** اللي بتنقل الإشارة من الـ cytokine receptors. وبيقول ==TNF blocker + methotrexate أحسن من أي واحد لوحده==، والـ TNF blockers كانت **relatively safe** مقارنة بالـ methotrexate.

          التفسير المقبول (مش في الكتاب):
          - **Indirectly**: الـ JAK مش cytokine؛ ده **السلك** اللي جوه الخلية بعد الـ receptor. وسلك واحد بيخدم cytokines كتير، فقفله بيوقف **مجموعة** مرة واحدة، مش واحد بس.
          - **TNF + MTX**: كل واحد بيضرب نقطة مختلفة في الالتهاب، وكمان الـ MTX بيقلل الـ antibodies اللي الجسم بيعملها **ضد** الـ biologic نفسه، فالـ biologic يفضل شغال أطول.
      - kind: figure
        page: 175
        quote: "Types of therapeutic molecules\n  Soluble receptor antagonists (Etanarcept).\n  Monoclonal antibodies to cytokines or their receptors (Infleximab, Adalimumab, Certolizumab, Golomumab, Secukinumab, and ustekinumab)."
        title: "أربع طرق تقطع نفس الرسالة"
        alt: "Sketch of a cell. A cytokine floats outside, a receptor sits in the cell membrane, and inside the cell the receptor signals through JAK to the nucleus, which switches on inflammation genes. Labels on the left: -cept, a soluble receptor, soaks up the cytokine (etanercept); -mab, an antibody, grabs the cytokine (adalimumab, secukinumab). Labels on the right: a receptor antagonist blocks the receptor (anakinra, brodalumab); a JAK inhibitor pill blocks the signal inside the cell."
        caption: "الرسالة بتمشي من فوق لتحت: الـ **cytokine** بره، يركب على الـ **receptor** في الغشا، والـ receptor يبعت الإشارة جوه عن طريق الـ ==JAK== للنواة فتشغّل جينات الالتهاب. الأدوية بتقطعها في أماكن مختلفة: في الشمال اتنين بيمسكوا الـ cytokine نفسه قبل ما يوصل، الـ **-cept** (etanercept) receptor عايم بيشفطه، والـ **-mab** antibody بيمسكه. في اليمين الـ ==receptor antagonist== بيقفل الباب نفسه (anakinra، و brodalumab على الـ IL-17 receptor). وتحت الـ **JAK inhibitor** حباية بتقفل الإشارة **جوه** الخلية، وده معنى كلمة الكتاب «more indirectly targets an array of cytokines»: كذا cytokine بيعدّوا من نفس الـ JAK."
        svg: |
