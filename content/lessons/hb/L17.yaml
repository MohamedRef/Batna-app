        title: "القاعدة الذهبية"
        quote: "Surgical resection is the only potential cure, but only a small percentage of patients are successfully treated this way."
        text: |
          الـ management لازم يبقى بـ **multi-disciplinary team**: جرّاحين متخصصين، radiologists، oncologists و palliative care، ويُفضّل تحويله لـ **center فيه خبرة** في الـ hepatobiliary malignancies.

          **Surgical resection هي الـ potential cure الوحيدة**، بس نسبة صغيرة بس اللي بتتعالج كده. الباقي: transplant (لعدد قليل مختار)، chemo، immunotherapy، radiotherapy و palliation.

