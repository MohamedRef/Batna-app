          - "الكتاب ما ذكرش الـ carvedilol في الحمل."
          - "الـ atenolol أصلًا **selective**، مش NSBB."
          - "الكتاب ما ذكرهوش؛ الإجابة propranolol."
      - kind: explain
        page: 271
        title: "HBV و HCV"
        text: |
          **HBV**:

          - كل طفل مولود لأم HBV-infected ياخد ==HBIG== + **HBV vaccine** (active–passive immunoprophylaxis). ده بيمنع الـ perinatal transmission.
          - الأم اللي الـ viral load عندها أعلى من 200,000 IU/mL تاخد antiviral في الـ third trimester: ==tenofovir== أو telbivudine. الهدف تقليل الفيروس قبل الولادة.

          **HCV**:

          - افحص بـ **anti-HCV** الحوامل اللي عندهم risk factors.
          - قلّل الـ invasive procedures (amniocentesis و invasive fetal monitoring)، علشان تقلّل الـ vertical transmission.
          - ما تدّيش HCV treatment أثناء الحمل، لا لعلاج الأم ولا لحماية الجنين.
      - kind: update
        ref: "AASLD HBV guidance 2018; CDC HCV screening 2020"
        text: |
          - الـ **telbivudine** مبقاش بيُستخدم، والـ **tenofovir disoproxil (TDF)** هو المفضّل (AASLD 2018).
          - الـ CDC (2020) بقت توصي بـ HCV screening لكل حامل في كل حمل، مش بس اللي عندهم risk factors.

          في الامتحان: إجابة الكتاب.
      - kind: explain
        page: 271
        title: "AIH و PBC و Wilson: كمّل"
        text: |
          القاعدة: العلاج بيكمّل.

          - **AIH**: كمّل الـ corticosteroids و/أو الـ ==azathioprine==.
          - **PBC**: كمّل الـ ==UDCA==.
          - **Wilson's disease**: كمّل الـ penicillamine أو الـ trientine أو الـ zinc، مع تقليل الجرعة لو ممكن.
      - kind: aside
        tone: trap
        page: 271
        text: |
          الفخ إنك توقف العلاج «علشان الجنين». الكتاب بيقول **continue** في الـ AIH والـ PBC والـ Wilson. وقف الدوا ممكن يعمل flare أو decompensation، وده أخطر على الأم والجنين من الدوا.
      - kind: explain
        page: 272
        title: "الحمل بعد الـ transplant"
        text: |
          **Fertility**: بترجع غالبًا خلال سنة بعد الـ LT.

          التوقيت: الحمل مش recommended في أول سنة، بسبب خطر الـ **acute cellular rejection**.

          التخطيط: لازم تنسيق بين فريق الـ transplant والـ maternal-fetal medicine قبل الحمل.

          النتيجة:

          - عمومًا كويسة.
          - الـ preconception **renal function** بتتنبأ بالنتيجة.
          - فيه زيادة في الـ preterm delivery، و low birth weight، و hypertension، و pre-eclampsia.

          الأدوية:

          - ==Tacrolimus== monotherapy: الـ ideal.
          - **Cyclosporine** و azathioprine و prednisone: بدائل.
          - ==Mycophenolate==: ممنوع، بسبب الـ congenital malformations.

          **Monitoring** للـ graft function والـ **CNI** levels:

          - كل 4 أسابيع لحد الأسبوع 32.
          - كل أسبوعين لحد الأسبوع 36.
          - كل أسبوع لحد الولادة.
