  - id: hb.L04.lesson4
    title: "INCPH وSOS: لا تليف ولا جلطة كبيرة"
    hook: "واحد عنده varices وكبده طري، والتاني كبده اتنفخ بعد الـ chemo. اتنين بيلخبطوا الممتحنين، وانت هتفرّق بينهم."
    minutes: 9
    pages: [77, 82]
    topics: [incph, sos]
    goals:
      - "تحفظ الـ 5 diagnostic criteria بتوع INCPH بالـ mnemonic"
      - "تعرف تشخّص SOS بالـ Seattle/Baltimore criteria وتستبعد اللي بيقلّده"
      - "تعرف الـ risk factors والـ prophylaxis بالـ defibrotide"
    status: unverified
    steps:
      - kind: explain
        page: 77
        quote: "INCPH diagnosis requires the exclusion of cirrhosis and other causes of non-cirrhotic portal hypertension"
        title: "INCPH: portal hypertension من غير cirrhosis ومن غير سبب"
        text: |
          **Idiopathic non-cirrhotic portal hypertension (INCPH)** ليه أسماء تانية: hepatoportal sclerosis، non-cirrhotic portal fibrosis، idiopathic portal hypertension.

          التشخيص بالاستبعاد: لازم تستبعد الـ **cirrhosis** وكل أسباب الـ non-cirrhotic portal hypertension التانية:

          - Infiltrative diseases وvascular malignancies.
          - **Schistosomiasis**: افتكرها كويس، لأنها شائعة عندنا في مصر.
          - **Congenital hepatic fibrosis** و**sarcoidosis**.

          أدوات التشخيص:

          - ==Transient elastography==: الـ liver stiffness الواطية (< 12 kPa) clue.
          - ==Liver biopsy==: لازمة للتشخيص.
      - kind: figure
        page: 78
        quote: "All 5 criteria must be fulfilled: ≥1 clinical sign of portal hypertension, Exclusion of cirrhosis on liver biopsy, … Patent portal and hepatic veins."
        title: "التشخيص بالاستبعاد: قمع الـ INCPH"
        alt: "A funnel of five narrowing boxes. One: at least one sign of portal hypertension. Two: biopsy shows no cirrhosis. Three: no chronic liver disease such as HBV, HCV, NASH, ASH, autoimmune hepatitis, haemochromatosis, Wilson or PBC. Four: no other non-cirrhotic cause such as congenital fibrosis, sarcoidosis or schistosomiasis. Five: patent portal and hepatic veins. At the bottom: INCPH."
        caption: "العيان لازم يعدّي من الـ 5 مصافي كلهم علشان تقول INCPH. أي واحدة يقف عندها، يبقى فيه سبب تاني."
        svg: |
          <svg viewBox="0 0 330 420" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L04d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="5" y="8" width="320" height="56" rx="7" class="fg-box"/>
            <text x="165" y="30" text-anchor="middle" class="t-b">1. A sign of portal hypertension</text>
            <text x="165" y="50" text-anchor="middle" class="t-sm t-mut">spleen, varices, ascites, HVPG, collaterals</text>
            <path d="M165 64v14" class="fg-arrow" marker-end="url(#L04d)"/>
            <rect x="25" y="82" width="280" height="40" rx="7" class="fg-box"/>
            <text x="165" y="107" text-anchor="middle" class="t-b">2. Biopsy: no cirrhosis</text>
            <path d="M165 122v14" class="fg-arrow" marker-end="url(#L04d)"/>
            <rect x="40" y="140" width="250" height="56" rx="7" class="fg-box"/>
            <text x="165" y="162" text-anchor="middle" class="t-b">3. No chronic liver disease</text>
            <text x="165" y="182" text-anchor="middle" class="t-sm t-mut">HBV/HCV, NASH/ASH, AIH, HH, Wilson, PBC</text>
            <path d="M165 196v14" class="fg-arrow" marker-end="url(#L04d)"/>
            <rect x="55" y="214" width="220" height="56" rx="7" class="fg-box"/>
            <text x="165" y="236" text-anchor="middle" class="t-b">4. No other NCPH cause</text>
            <text x="165" y="256" text-anchor="middle" class="t-sm t-mut">congenital fibrosis, sarcoid, schisto</text>
            <path d="M165 270v14" class="fg-arrow" marker-end="url(#L04d)"/>
            <rect x="70" y="288" width="190" height="56" rx="7" class="fg-box"/>
            <text x="165" y="310" text-anchor="middle" class="t-b">5. Patent veins</text>
            <text x="165" y="330" text-anchor="middle" class="t-sm t-mut">portal + hepatic</text>
            <path d="M165 344v14" class="fg-arrow" marker-end="url(#L04d)"/>
            <rect x="105" y="362" width="120" height="44" rx="7" class="fg-good"/>
            <text x="165" y="390" text-anchor="middle" class="t-b t-good">INCPH</text>
          </svg>
      - kind: reveal
        page: 77
        quote: "A clue for the correct non-invasive diagnosis of INCPH might be low liver stiffness measurement by transient elastography (<12 kPa)."
        prompt: "عيان عنده varices وsplenomegaly وportal hypertension واضح... ليه الـ **liver stiffness** بتاعه واطية؟"
        answer: |
          لأن الـ stiffness بتقيس صلابة نسيج الكبد، واللي بيصلّبه هو الـ **fibrosis** والـ **cirrhosis**. في الـ INCPH المشكلة في الأوعية مش في النسيج، فالكبد طري والضغط عالي.

          علشان كده الكتاب بيقول إن الـ low stiffness (< 12 kPa) **clue**، بس الـ **biopsy** هي اللي بتستبعد الـ cirrhosis.
      - kind: mnemonic
        page: 78
        quote: "All 5 criteria must be fulfilled: ≥1 clinical sign of portal hypertension, Exclusion of cirrhosis on liver biopsy, … Patent portal and hepatic veins."
        word: "SNOOP"
        parts:
          - { key: "S", text: "≥ 1 clinical Sign of portal hypertension: splenomegaly/hypersplenism, varices, non-malignant ascites, minimally raised HVPG, portovenous collaterals" }
          - { key: "N", text: "No cirrhosis on liver biopsy" }
          - { key: "O", text: "Out: chronic liver diseases (HBV/HCV, NASH/ASH, AIH, haemochromatosis, Wilson, PBC)" }
          - { key: "O", text: "Out: other non-cirrhotic portal hypertension (congenital fibrosis, sarcoidosis, schistosomiasis)" }
          - { key: "P", text: "Patent portal and hepatic veins" }
        hook: |
          الـ INCPH تشخيص بالاستبعاد، فلازم تبقى **SNOOP**: بتتشمم وتستبعد. والـ 5 criteria كلهم لازم يتحققوا: **all 5 must be fulfilled**.
      - kind: check
        page: 78
        quote: "5- Patent portal and hepatic veins."
        question: "Why must the portal and hepatic veins be **patent** to diagnose INCPH?"
        options:
          - "A thrombosed vein would explain the portal hypertension, so it is no longer idiopathic"
          - "Patent veins are needed for the biopsy"
          - "Thrombosis is the first sign of INCPH"
          - "It is needed to measure liver stiffness"
        answer: 0
        why:
          - "صح: لو فيه PVT أو BCS، يبقى لقيت السبب: EHPVO أو Budd-Chiari، مش idiopathic."
          - "الـ biopsy مالهاش علاقة بالـ patency."
          - "بالعكس، الكتاب بيقول نعمل screen للـ PVT كل 6 شهور لأنه ممكن يحصل بعدين كمضاعفة."
          - "الـ elastography مش محتاجة patent veins."
      - kind: explain
        page: 79
        quote: "Endoscopic therapy controls acute variceal bleeding in 95% of patients and reduces risk of rebleeds."
        title: "علاج الـ INCPH"
        text: |
          - الـ portal hypertension زي **guidelines** الـ **cirrhosis**.
          - **Endoscopic therapy** بيسيطر على الـ acute variceal bleeding في **95%** ويقلل الـ rebleeding. **TIPS** لو النزيف uncontrolled.
          - ==Screen for PVT== كل 6 شهور على الأقل.
          - **Anticoagulation** مش **recommended** بشكل عام: بس لو فيه prothrombotic condition واضح أو حصل PVT.
          - **Liver transplant** لو حصل liver failure أو مضاعفات portal hypertension مش ممكن السيطرة عليها.
      - kind: explain
        page: 79
        quote: "Well-established complication of myeloablative regimens in Heamopoeitic stem cell transplantation (HSCT), cancer chemotherapy, immunosuppression in solid organ transplantation or IBD."
        title: "SOS: الـ sinusoid نفسه اتعوّر"
        text: |
          **Sinusoidal obstruction syndrome (SOS)** اسمه القديم **veno-occlusive disease (VOD)**، وبيتميز بـ ==loss of sinusoidal wall integrity==. يعني الإصابة في جدار الـ sinusoid نفسه، مش جلطة في وريد كبير زي الـ BCS.

          بيحصل كمضاعفة معروفة في:

          - **Myeloablative regimens** قبل الـ **HSCT**.
          - **Cancer chemotherapy**.
          - **Immunosuppression** في الـ solid organ transplant أو الـ **IBD**.

          وفيه drugs and toxins كتير مرتبطة بيه (p80)، وهنجمعهم في 3 عائلات في الخطوة الجاية.
      - kind: aside
        tone: tip
        page: 80
        quote: "Associated with a large number of drugs and toxins: Actinomycin D. Azathioprine. Busulfan. Carmustine. Cytosine arabinoside. Cyclophosphamide. Dacarbazine. Gemtuzumab ozogamicin. Melphalan."
        text: |
          ماتحفظش الـ 22 حاجة بالترتيب. افتكر 3 عائلات:

          - **Chemo/conditioning:** busulfan، cyclophosphamide، melphalan، carmustine، dacarbazine، oxaliplatin، actinomycin D...
          - **Thiopurines:** azathioprine، 6-MP، 6-thioguanine.
          - مش أدوية: post-BMT، **total-body irradiation**، high-dose hepatic irradiation، **pyrrolizidine alkaloids** وherbal remedies، platelet transfusion with **ABO-incompatible plasma**.

          الكارت بيطلب أي 8 بس.
      - kind: mnemonic
        page: 81
        quote: "two or more of the following criteria: (Seattle or Baltimore criteria) weight gain, ascites, tender hepatomegaly and jaundice within 20 days after BMT."
        word: "WAJH"
        parts:
