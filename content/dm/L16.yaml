  # ---------- Case 1, p196-200: euglycemic DKA ----------
  - id: dm.L16.001
    kind: case
    topic: eudka
    stem: A 34-year-old man with T1DM for 19 years has 4 days of nausea, vomiting and flu-like symptoms. He takes lispro 8 units with meals and raised his bedtime NPH from 12 to 15 units, without checking glucose.
    steps:
      - reveal: "HR 106, RR 30, dry mucosa, BMI 19. Glucose 105 mg/dL, pH 7.3, HCO3 10 mEq/L, anion gap 29, Na 134, K 5.7, Cl 101; urine ketones 4+, no glucosuria. Lactate 1.1; salicylate, alcohol and methanol undetectable."
        question: Diagnosis?
        options: [Euglycemic DKA, Lactic acidosis, Starvation ketosis without acidosis, Salicylate poisoning]
        answer: 0
        why: High-anion-gap ketoacidosis with near-normal glucose in type 1 diabetes mellitus (T1DM); lactate and toxins are normal.
      - question: Which treatment did he receive?
        options: ["0.9% saline, 10% dextrose and IV insulin", Insulin withheld because glucose is normal, Bicarbonate alone, Oral fluids only]
        answer: 0
        why: Dextrose lets insulin continue to clear the ketones without hypoglycemia.
      - reveal: His HbA1c was 11.5%. He showed anhedonia, no interest in food or his diabetes, and had barely eaten for 2-3 weeks.
        question: What was the underlying cause?
        options: ["Severe depression with prolonged poor intake", "Deliberate insulin overdose at home", "SGLT2 inhibitor use for diabetes", "Pancreatitis"]
        answer: 0
        why: Psychiatrists diagnosed severe depression; prolonged fasting caused the euglycemic picture.
    src: { page: 198, quote: "Euglycemic ketoacidosis\n  1. He was treated with 0.9% saline rehydration, 10% dextrose, & intravenous insulin\n  2. His acidosis gradually improved.\n  3. Later, his HbA1C was found to be 11.5%, suggesting poor control.\n  4. Upon further assessment it was noticed that he had anhedonia, & he appeared to have no interest in his food or the management of his DM despite having insight into the complications.\n  5. He also admitted to not having eaten for nearly 2 to 3 weeks prior to his presentation." }
    status: unverified
    tags: [high-yield]
  - id: dm.L16.002
    kind: card
    topic: eudka
    front: Why can a patient who keeps taking insulin but stops eating develop DKA with normal glucose?
    back: Insulin keeps glucose near normal but cannot stop ketone formation; fasting depletes glycogen, speeds lipolysis and free fatty acids (FFA) production, and insulin suppresses lipolysis and ketogenesis less well during a fast.
    src: { page: 198, quote: "2. During these times of decreased caloric intake, patients with DM who continue taking sufficient amounts of insulin may maintain euglycemia, but are unable to stop the ketone body formation & can present with DKA with only mild elevations of BG or even relative normoglycemia.\n3. In cases of prolonged fasting, near-total glycogen depletion contributes to the normoglycemia as metabolic acidosis continues to develop.\n4. Also, lipolysis & FFA production are accelerated during fasting, & insulin is less effective at suppressing lipolysis & ketogenesis during a fast, exacerbating the development of acidosis." }
    status: unverified
    tags: [high-yield]
  - id: dm.L16.003
    kind: card
    topic: eudka
    front: How does prolonged fasting keep glucose normal while acidosis develops?
    back: Near-total glycogen depletion.
    src: { page: 198, quote: "In cases of prolonged fasting, near-total glycogen depletion contributes to the normoglycemia as metabolic acidosis continues to develop." }
    status: unverified
  - id: dm.L16.004
    kind: card
    topic: eudka
    front: Why is reduced caloric intake so often linked to DKA?
    back: Nausea or vomiting from the precipitating illness, or from worsening ketoacidosis itself, cuts intake.
    src: { page: 198, quote: "Discussion\n  1. A decrease in caloric intake is frequently associated with the development of DKA, usually due to nausea or vomiting caused by a precipitating illness or by worsening ketoacidosis itself." }
    status: unverified
  - id: dm.L16.005
    kind: table
    topic: eudka
    title: Causes of euglycemic ketoacidosis (Case 1 discussion)
    columns: [Mechanism, Causes]
    rows:
      - ["Decreased circulating glucose", "Starvation; vomiting (ketoacidosis, gastroparesis); intentional dieting; depression and anhedonia; pregnancy; glycogen storage disorders; cirrhosis"]
      - ["H+ excess, endogenous", "Lactic acidosis; pancreatitis; sepsis; renal tubular acidosis"]
      - ["H+ excess, exogenous", "Salicylate overdose; methanol ingestion"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 199, quote: "Causes of Euglycemic Ketoacidosis *As a result of decreased circulating glucose concentration" }
