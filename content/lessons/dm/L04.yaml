          </svg>
      - kind: check
        page: 47
        quote: "Statin Treatment—Secondary Prevention\n  8) For people of all ages with diabetes and ASCVD, high-intensity statin therapy should be added to lifestyle therapy.\n  9) High-intensity statin therapy is recommended to target an LDL cholesterol reduction of ≥50% from baseline and an LDL cholesterol goal of <55 mg/dL\n  10) Addition of ezetimibe or a PCSK9 inhibitor is recommended if this goal is not achieved on maximum tolerated statin therapy."
        question: "Diabetes + prior stroke, on atorvastatin 80. LDL 72 mg/dL. Next?"
        options: ["Add ezetimibe or a PCSK9 inhibitor", "Nothing: LDL <100", "Lower the statin dose", "Add a fibrate"]
        answer: 0
        why:
          - "صح: الـ ASCVD هدفه <55 mg/dL (p47)."
          - "الهدف أقل من 55."
          - "عكس المطلوب."
          - "مش في المحاضرة."
      - kind: reveal
        page: 47
        quote: "Statin therapy is contraindicated in pregnancy."
        prompt: "ليه الـ statin ممنوع في الحمل، وليه فوق 75 الكتاب بيقول «may be reasonable» بس؟"
        answer: |
          الكتاب: **statin therapy is contraindicated in pregnancy**، وفوق **75** «may be reasonable» تبدأ moderate بعد نقاش، ولو بياخده **كمّل**.

          التفسير المقبول (مش في الكتاب): الجنين محتاج كوليسترول عشان يبني أغشية الخلايا والمخ والهرمونات، والـ statin بيقفل تصنيعه. وفوق 75 الفايدة محتاجة سنين عشان تبان، والآثار الجانبية والتداخلات مع أدوية تانية أكتر، فالقرار بيتاخد مع العيان. أما اللي بياخده خلاص فوقفه ممكن يرجّع الخطر.
      - kind: case
        page: 46
        quote: "For people with diabetes aged 40–75 at higher cardiovascular risk, including those with one or more ASCVD risk factors, it is recommended to use high-intensity statin therapy to reduce LDL cholesterol by ≥50% of baseline and to target an LDL cholesterol goal of <70 mg/dL."
