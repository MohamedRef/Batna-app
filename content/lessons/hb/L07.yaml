          - "HBeAg-negative chronic hepatitis"
          - "HBsAg loss"
        why: "ده ترتيب رسمة صفحة 117: e+ هدنة، e+ خناقة، e− هدنة، e− خناقة، وأخيرًا HBsAg loss."
      - kind: explain
        page: 117
        title: "مين بيدخل منين؟"
        text: |
          رسمة الـ Cleveland Clinic في الكتاب:

          - **Perinatal transmission** → يبدأ من **immune tolerant** (HBeAg+ chronic infection).
          - **Horizontal transmission** → يدخل على طول في **HBeAg+ immune active phase**.
          - بعدها **e loss ± anti-HBe seroconversion** → يا إما **inactive HBV** (وممكن منه **clearance of HBsAg**)، يا إما **anti-HBe immune active phase**.

          ومن الـ inactive ممكن يرجع يدخل الـ anti-HBe immune active، فالـ inactive carrier محتاج متابعة.
      - kind: reveal
        page: 117
        prompt: "الـ HBeAg اختفى، ومع ذلك في المرحلة 4 الـ DNA عالي والكبد بيتأذي. إزاي؟"
        answer: |
          اختفاء الـ HBeAg مش معناه إن الفيروس بطّل يتكاثر.

          التفسير المقبول (مش مكتوب في الكتاب): الفيروس بيعمل **mutations** (precore / core promoter) تخليه يوقف إنتاج الـ HBeAg بس يكمّل replication. فتلاقي **HBeAg−** و **DNA > 2,000** و **ALT elevated**.

          علشان كده الـ HBeAg سالب لوحده مش طمأنينة؛ لازم تبص على الـ DNA والـ ALT.
