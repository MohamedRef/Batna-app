        text: "احفظها كده: الكاميرا الكاملة (colonoscopy) كل 10، الصورة أو المنظار القصير (CT colonography, barium enema, flexible sigmoidoscopy) كل 5، البراز (FIT, guaiac fecal occult blood test (gFOBT)) كل سنة، والبراز بالـ DNA كل 3. وأي test positive لازم بعده colonoscopy."
      - kind: reveal
