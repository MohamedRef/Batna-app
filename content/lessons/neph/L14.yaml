          - "الـ Coombs-positive خاص بالـ pneumococcus."
          - "الـ eculizumab مش علاج الـ STEC-HUS أصلاً."
          - "مش السبب المذكور."
      - kind: explain
        page: 476
        title: "علاج aHUS"
        quote: "The cornerstones of treatment for aHUS are first-line treatment with eculizumab and second-line with plasma exchange."
        text: |
          - ==Eculizumab== (anti-**C5**) **first-line**، و **plasma exchange** second-line.
          - كل ما بدري كل ما أحسن.
          - "قلّل الـ end-stage renal disease (ESRD) أو الوفاة: أطفال من **30-50%** لـ **9%**، كبار من **60%** لـ **6-15%**."
          - "**Ravulizumab**: C5 inhibitor بنفس الفعالية و half-life **4 أضعاف**."

          ليه الـ C5 بالذات؟ التفسير المقبول (مش في الكتاب): الـ C5 هو أول خطوة في الـ membrane attack complex اللي بيخرّم الـ endothelium. فلما تقفله، العيب اللي فوق (factor H مثلًا) مش هيوصل للأذى. وليه بدري أحسن؟ لأن الـ glomeruli اللي ماتت مش هترجع.
      - kind: explain
        page: 477
        title: "الزرع والـ secondary HUS"
        quote: "Studies suggest that prophylactic administration of eculizumab in patients with a high risk of aHUS recurrence prolongs graft survival and may also be cost-effective in the high-risk groups despite the drug's high cost."
        text: |
          مشكلة الـ aHUS إن كتير بيوصلوا **ESRD** ومحتاجين زرع، وفيه ==high recurrence rate== في الكلية الجديدة. والحل في الكتاب: **prophylactic eculizumab** للي الـ recurrence risk عنده عالي، لأنه ==prolongs graft survival== وممكن يبقى ==cost-effective== رغم سعره.

          وده بيربط بالـ table: **CFH** و **CFI** recurrence عالي (بروتينات في الدم)، و **MCP** قليل (على الـ membrane بتاعة الكلية الجديدة).

          والـ **secondary HUS**: العلاج **largely dependent on the treatment of the underlying condition**. ودراسات صغيرة لقت الـ eculizumab بيفيد في الـ pregnancy-related، بس كتير منهم طلع عندهم **genetic component** أصلًا، وفي اللي الكلية بتسوء رغم علاج السبب.
      - kind: explain
