  - id: hem.L08.lesson5
    title: "CLL: مين هيعيش أطول ومين نعالجه؟"
    hook: "عيانين نفس الـ stage، واحد مستقر عشرين سنة والتاني بيتدهور. الفرق في الجينات."
    minutes: 9
    pages: [129, 132]
    topics: [cll-prognosis, mbl, cll-treatment]
    goals:
      - "تعدّ الـ prognostic factors الكلينيكية"
      - "تفهم الـ IGHV والـ CD38 والـ micro RNAs"
      - "تعرّف الـ MBL وتعرف امتى وإزاي نعالج"
    status: unverified
    steps:
      - kind: explain
        page: 129
        title: "علامات الخطر"
        quote: "Late stages (Rai or Benit)/ b. Diffuse pattern of lymphocytic infilteration in B.M. c. Advanced age. d. Male sex"
        text: |
          - **Late stage** (Rai أو Binet)
          - ==Diffuse== marrow infiltration
          - **سن كبير** و **ذكر**
          - **β2-microglobulin**، uric acid، **LDH**، alkaline phosphatase عالية
          - تحوّل لـ **PLL**
          - **Multiple chromosomal abnormalities** ← خطر ==Richter syndrome== (large cell lymphoma)
      - kind: explain
        page: 130
        title: "الـ IGHV: الـ B cell اتعلمت ولا لأ؟"
        quote: "the unmutated type, associated with all the features of poor prognosis and mutated type, associated with stable disease and good prognosis."
        text: |
          الـ **somatic hypermutation**: بعد الـ recombination، الـ B cell في الـ **germinal centre** بتعدّل جينات الـ immunoglobulin علشان تعمل antibodies أقوى، وتطلع منها **memory B cells** و **plasma cells**.

          - ==Mutated IGHV==: مستقر، **good prognosis**.
          - ==Unmutated IGHV==: كل صفات الـ **poor prognosis**.
      - kind: reveal
        page: 130
        quote: "a high percentage of CD38 positive cells predicts a short time to disease progression and bad outcome."
        prompt: "ليه الـ CD38 بيمشي مع الـ unmutated؟"
        answer: |
          الـ **CD38** (transmembrane glycoprotein) بيبقى ==highly expressed== في الحالات الـ **unmutated**.

          علشان كده نسبة عالية من خلايا CD38 positive = **progression أسرع** و outcome وحش، والنسبة الواطية = مرض مستقر. والـ **ZAP-70** (tyrosine kinase مهم في T-cell signaling) marker تاني.
      - kind: sort
        page: 130
        quote: "a high percentage of CD38 positive cells predicts a short time to disease progression and bad outcome."
        prompt: "صنّف: بيشاور على prognosis أحسن ولا أوحش؟"
        bins: ["Better", "Worse"]
        cards:
          - { text: "Mutated IGHV", bin: 0 }
          - { text: "Low CD38", bin: 0 }
          - { text: "Nodular marrow", bin: 0 }
          - { text: "Unmutated IGHV", bin: 1 }
          - { text: "High CD38", bin: 1 }
          - { text: "Diffuse marrow", bin: 1 }
          - { text: "Male, older age", bin: 1 }
          - { text: "Low MIR-34a", bin: 1 }
        why: "الـ mutated IGHV والـ CD38 الواطي = مستقر. الـ diffuse pattern أكتر في الـ advanced stage. الـ unmutated والـ CD38 العالي والسن والذكورة = أوحش. الـ MIR-34a بيبقى واطي جدًا في الحالات الـ refractory للـ chemo."
      - kind: explain
        page: 130
        title: "الـ micro RNAs والجينات"
        quote: "Two micro RNAs, MIR 15 and MR16 are located at 13q 14, a region frequently deleted in CLL"
        text: |
          الـ **micro RNAs** جزيئات قصيرة non-coding بتنظّم حوالي **تلت** جينات الإنسان.

          - ==MIR-15 و MIR-16== على **13q14** (بتتمسح كتير في الـ CLL)، وبيكتموا ==BCL2==. يعني لو اتمسحوا ← BCL2 يعلى ← الخلية ما تموتش.
          - **MIR-34a** واطي جدًا في الحالات الـ **refractory**.
          - أهم risk locus: **6p25.3** = جين **IRF4** (اسمه القديم MUM1).
      - kind: figure
        page: 130
        quote: "both micro RNAs target BCL2 which is overexpressed in CLL."
        title: "13q14 والـ BCL2"
        alt: "Two stacked pathways. Normal: the 13q14 region makes MIR-15 and MIR-16, which hold BCL2 down, so old B cells undergo apoptosis. CLL: 13q14 is deleted, MIR-15 and MIR-16 are lost, BCL2 rises and B cells survive and accumulate."
        caption: "لما الـ ==13q14== يتمسح، الفرامل على الـ **BCL2** تروح، والـ B cells ما تموتش."
        svg: |
          <svg viewBox="0 0 330 280" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L08c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <text x="15" y="20" class="t-sm t-b">Normal B cell</text>
            <rect x="10" y="30" width="70" height="40" rx="8" class="fg-box"/>
            <text x="45" y="55" text-anchor="middle" class="t-sm">13q14</text>
            <path d="M80 50 L100 50" class="fg-arrow" marker-end="url(#L08c)"/>
            <rect x="103" y="30" width="80" height="40" rx="8" class="fg-good"/>
            <text x="143" y="55" text-anchor="middle" class="t-sm">MIR-15/16</text>
            <path d="M183 50 L205 50" class="fg-arrow" stroke-width="2.5"/>
            <path d="M205 40 L205 60" class="fg-arrow" stroke-width="3"/>
            <rect x="212" y="30" width="56" height="40" rx="8" class="fg-box"/>
            <text x="240" y="55" text-anchor="middle" class="t-sm">BCL2 ↓</text>
            <text x="240" y="92" text-anchor="middle" class="t-sm t-good t-b">apoptosis</text>
            <text x="15" y="150" class="t-sm t-b">CLL cell</text>
            <rect x="10" y="160" width="70" height="40" rx="8" class="fg-thin"/>
            <text x="45" y="185" text-anchor="middle" class="t-sm t-bad">13q14 del</text>
            <rect x="103" y="160" width="80" height="40" rx="8" class="fg-thin"/>
            <text x="143" y="185" text-anchor="middle" class="t-sm t-mut">lost</text>
            <rect x="212" y="160" width="56" height="40" rx="8" class="fg-bad"/>
            <text x="240" y="185" text-anchor="middle" class="t-sm t-b">BCL2 ↑</text>
            <path d="M240 200 L240 228" class="fg-arrow-bad" marker-end="url(#L08c)"/>
            <text x="240" y="248" text-anchor="middle" class="t-sm t-bad t-b">cells survive</text>
            <text x="240" y="266" text-anchor="middle" class="t-sm t-bad">and accumulate</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 130
        quote: "both micro RNAs target BCL2 which is overexpressed in CLL."
        text: "الـ **BCL2** زي درع ضد الموت (apoptosis). الـ MIR-15/16 كانوا الإيد اللي بتشيل الدرع. لما الـ 13q14 يتمسح، الإيد تختفي، والخلايا تعيش وتتراكم. ده بالظبط معنى «CLL = خلايا نسيت تموت»."
      - kind: explain
        page: 131
        title: "الـ MBL: قبل الـ CLL"
        quote: "Is defined as the presence of less than 5000/dl of monoclonal B-lymphocytes in the peripheral blood"
        text: |
          ==Monoclonal B-cell lymphocytosis==: **أقل من 5,000/µL** monoclonal B cells في الدم، **من غير** غدد، طحال، cytopenias أو أعراض.

          - موجود في **5%** من الناس 60–80 سنة بـ WBC طبيعي.
          - بيتحول CLL بمعدل **1–2% في السنة**.
          - غالبًا فيه ==13q14 deletion== (اللي بتميّز الحالات الـ benign).
