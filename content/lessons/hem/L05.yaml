  - id: hem.L05.lesson2
    title: "PT ولا APTT؟ وبعدين الـ hemophilia"
    hook: "تلات تحاليل بسيطة بيقولولك العيب في أنهي نهر، وبعدين الولد اللي ركبته بتورم."
    minutes: 10
    pages: [73, 76]
    topics: [screening, deficiencies, hemophilia]
    goals:
      - "تقرا الـ TT والـ PT والـ APTT"
      - "تعرف وراثة الـ hemophilia A و B ودرجاتها"
      - "تجاوب سؤال الكتاب: management of hemophilia"
    status: unverified
    steps:
      - kind: table
        page: 73
        quote: "Screening tests used in the diagnosis of coagulation disorders"
        title: "الـ screening tests"
        columns: [Test, Long in]
        rows:
          - ["Thrombin time", "DIC, heparin (fibrinogen low or abnormal)"]
          - ["PT", "Low VII, X, II, I: liver disease, warfarin"]
          - ["APTT", "Low XII, XI, IX, VIII, X, V, II, I: hemophilia A and B"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: mnemonic
        page: 73
        quote: "Screening tests used in the diagnosis of coagulation disorders"
        word: "PET PITT"
        parts:
          - { key: "P", text: "PT" }
          - { key: "E", text: "Extrinsic pathway (VII)" }
          - { key: "T", text: "Tablets: warfarin, plus liver disease" }
          - { key: "P", text: "PTT (APTT)" }
          - { key: "I", text: "Intrinsic pathway (XII, XI, IX, VIII)" }
          - { key: "T", text: "The hemophilias (A and B)" }
          - { key: "T", text: "Thrombin time: heparin and DIC" }
        hook: "أسهل طريقة تقرا الـ screening tests: **PET** = PT + Extrinsic. **PITT** = PTT + Intrinsic + الـ Thrombin time. وكلهم بيطولوا لو العيب في الـ common pathway."
      - kind: check
        page: 73
        quote: "Screening tests used in the diagnosis of coagulation disorders"
        question: "Screening tests: PT normal, APTT long, TT normal, platelets normal. Most likely disorder?"
        options: ["Hemophilia", "Warfarin", "DIC", "Heparin"]
        answer: 0
        why:
          - "صح: APTT لوحده = intrinsic = hemophilia أو Christmas disease."
          - "الـ warfarin بيطوّل الـ PT الأول."
          - "الـ DIC بيطوّل التلاتة والـ platelets واطية."
          - "الـ heparin بيطوّل الـ thrombin time."
      - kind: explain
        page: 74
        title: "Deficiencies: وراثي ومكتسب"
        quote: "Acquired – due to: 1. Vitamin K deficiency 2. Liver disease 3. Consumption coagulopathy 4. Circulating inhibitors."
        text: |
          - **Congenital** (الأشهر): ==hemophilia A==، **von Willebrand disease**، **Christmas disease**، fibrinogen abnormalities.
          - **Acquired**: **vitamin K deficiency**، **liver disease**، **consumption coagulopathy** (DIC)، **circulating inhibitors**.
      - kind: explain
        page: 74
        title: "Hemophilia A"
        quote: "Haemophilia A is inherited as X-linbed recessive disorder affecting males and transmitted by female."
        text: |
          - ==X-linked recessive==: بتصيب الرجالة وبتنقلها الستات.
          - الـ **factor VIII gene** على طرف الـ long arm من الـ X.
          - **FVIII:C** واطي أو مش موجود، و **VWF** و **VWF Ag** طبيعيين.
      - kind: table
        page: 74
        quote: "VIII activity < 1% - sever bleeds after trival trauma. VIII activity 1-5% - moderate to sever post-traumatic bleeds."
        title: "الدرجة على قد الـ VIII"
        columns: [Bleeding, "VIII"]
        rows:
          - ["Severe after trivial trauma", "<1%"]
          - ["Moderate–severe after trauma", "1–5%"]
          - ["Mild; bleeds after surgery", "5–25%"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 74
        quote: "X-linbed recessive disorder affecting males and transmitted by female."
        prompt: "الـ hemophilia A ==X-linked recessive==: ليه الـ males بيتصابوا والـ female لأ في الغالب، مع إن الأم هي اللي شايلة الجين؟"
        answer: |
          الولد عنده **X واحد** بس (من أمه). لو فيه الجين المعطوب مفيش X تاني يعوّض.

          البنت عندها **اتنين X**: الطبيعي بيعمل VIII كفاية، فبتبقى ==carrier== وتنقله لنص ولادها الذكور. علشان كده الـ family history بتلاقيه في **خال** الولد.
      - kind: explain
        page: 75
        title: "فين بينزف وإيه المضاعفات؟"
        quote: "Arthritis, secondary to repeated haemorrhages 2. Peripheral nerve compression and pseudotumour. 3. FVIII antibodies/inhibitors in 5-10% of patients."
        text: |
          **النزيف**: في الـ ==synovial joints== (hemarthrosis، زي صورة الركبة في الكتاب)، في العضلات (في الـ severe)، من اللثة وخلع الأسنان، و epistaxis.

          **المضاعفات**:
          - **Arthritis** من النزيف المتكرر
          - **Nerve compression** و **pseudotumor**
          - **FVIII inhibitors** في **5–10%**
          - **Chronic liver disease** (HBV، HCV) و **AIDS** من concentrates أوائل الثمانينات
      - kind: explain
        page: 76
        title: "العلاج"
        quote: "Treatment consists of I.V injection of factor VIII in a concentrated form to maintain plasma factor VIII activity between 5 and 100%"
        text: |
          - قبل **أي عملية** (prophylactic)، ومع **أول علامة** نزيف.
          - **IV factor VIII concentrate** يخلّي الـ activity بين **5 و 100%** على حسب الإصابة أو العملية.
          - ==Desmopressin== في الـ **mild**: بيطلّع FVIII من الـ endothelial cells.

          **Hemophilia B (Christmas)**: عيب في **factor IX**، زي A في كل حاجة حتى الوراثة، بس أقل بكتير. العلاج **FFP** أو **factor IX concentrate**.
      - kind: update
        page: 76
        quote: "Treatment consists of I.V injection of factor VIII in a concentrated form to maintain plasma factor VIII activity between 5 and 100%"
        ref: "WFH Guidelines for the Management of Hemophilia, 3rd ed. 2020"
        text: "الكتاب بيدّي **factor VIII concentrate** وقت الحاجة. دلوقتي الـ **regular prophylaxis** هو الـ standard في الـ severe hemophilia (مش on demand بس)، و **emicizumab** (bispecific antibody بيقلّد FVIIIa) بيتاخد كل أسبوع لشهر، مع أو من غير inhibitors."
      - kind: case
        page: 74
        quote: "VIII activity 1-5% - moderate to sever post-traumatic bleeds."
        stem: "A 7-year-old boy has a hot swollen knee, a post-traumatic bleed after a small fall. His maternal uncle had the same."
        steps:
          - question: "PT normal, APTT long, FVIII:C 3%, VWF Ag normal. Diagnosis?"
            options: ["Moderate hemophilia A", "Severe hemophilia A", "Von Willebrand disease", "Hemophilia B"]
            answer: 0
            why: "**1–5%** = moderate. الـ VWF Ag طبيعي فمش VWD. والـ VIII واطي فمش B."
          - question: "Best treatment now?"
            options: ["IV factor VIII concentrate", "Desmopressin", "Vitamin K", "Platelets"]
            answer: 0
            why: "الـ desmopressin للـ **mild** بس. الـ vitamin K مالوش دعوة بـ VIII. والـ platelets طبيعية."
      - kind: try
        items: [hem.L05.020, hem.L05.025, hem.L05.028, hem.L05.030, hem.L05.087]
    recap:
      - "TT: heparin و DIC. PT: VII (extrinsic)، warfarin و liver. APTT: intrinsic، hemophilia A و B."
      - "Hemophilia A: X-linked recessive، VIII واطي، VWF طبيعي."
      - "<1% severe، 1–5% moderate، 5–25% mild."
      - "مضاعفات: arthritis، nerve compression/pseudotumor، inhibitors 5–10%، hepatitis، AIDS."
      - "العلاج: VIII concentrate (5–100%)، desmopressin في الـ mild. Hemophilia B: FFP أو IX."
    practice: [hem.L05.020, hem.L05.021, hem.L05.022, hem.L05.023, hem.L05.024, hem.L05.025, hem.L05.026, hem.L05.027, hem.L05.028, hem.L05.029, hem.L05.030, hem.L05.031, hem.L05.032, hem.L05.033, hem.L05.034, hem.L05.035, hem.L05.036, hem.L05.037, hem.L05.038, hem.L05.039, hem.L05.040, hem.L05.083, hem.L05.087, hem.L05.089]
