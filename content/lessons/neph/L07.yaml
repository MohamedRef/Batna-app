      - "ADTKD: AD، MUC1/UMOD/REN/HNF1B، UMOD = hyperuricemia؛ dipstick نضيف و salt loss و ESRD حوالي 60."
      - "Sponge kidney: developmental، Ca stones في شاب، calyceal brush، الكلى شغالة."
