        quote: "Categories of glucose intolerance I- Diabetes mellitus (Type 1, Type 2 & GDM). II- Prediabetes (IFG and IGT)."
        text: |
          بعد ما عرفنا الأرقام، الكتاب بيحط كل اللي سكره مش طبيعي في فئتين:

          1. ==Diabetes mellitus==: **type 1**، **type 2**، و **GDM**.
          2. **Prediabetes**: **IFG** و **IGT**.

          يعني الأرقام اللي حفظناها هي اللي بتحطك في الخانة: لو عدّيت حد الـ diabetes تبقى في الفئة الأولى، ولو وقفت في النص تبقى prediabetes. الدرس الجاي بيفتح كل فئة لوحدها.
