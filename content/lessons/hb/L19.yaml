  - id: hb.L19.lesson1
    title: "الحصوة بتتولد إزاي؟"
    hook: "من bile سايلة لحجر بيكبر 1–2 mm كل سنة: مصنع الحصوات من جوّه."
    minutes: 8
    pages: [375, 380]
    topics: [anatomy, epidemiology, pathogenesis]
    goals:
      - "تعرف المرارة بتعمل إيه وليه الأكل الدسم هو اللي بيحرّكها"
      - "تحفظ أرقام الانتشار في مصر والعالم وعوامل الخطر"
      - "تشرح الـ sludge والـ nucleation بالترتيب"
    status: unverified
    steps:
      - kind: explain
        page: 375
        title: "المرارة: مخزن مش مصنع"
        quote: "Bile aids in the digestion of fat, and is released from the gallbladder into the upper small intestine(duodenum) in response to food (especially fats)."
        text: |
          الـ **gallbladder** كيس صغير قاعد تحت الكبد. شغلته في جملة واحدة: مخزن مش مصنع.

          - **Liver**: هو اللي بيصنع الـ bile طول اليوم.
          - ==Gallbladder==: بتخزّنها وبتركّزها لحد ما نحتاجها.

          إمتى نحتاجها؟ لما الأكل يوصل الـ duodenum، وخصوصًا الدهون. ساعتها المرارة بتنقبض وتضخ الـ bile، لأن الـ bile هي اللي بتساعد في هضم الدهون.

          اربط الجملة دي بباقي المحاضرة: الأكل الدسم هو الزرار اللي بيشغّل انقباض المرارة. ولو فيه حصوة قاعدة على الباب، الانقباض ده هو اللي بيعمل الوجع.
      - kind: figure
        page: 375
        quote: "It stores and concentrates bile produced in the liver."
        title: "ليه الأكل الدسم بيوجّع؟"
        alt: "Three stacked panels. One: the liver makes bile all day and it flows down to the gallbladder, which stores and concentrates it. Two: fatty food reaches the duodenum and the gallbladder contracts, pushing bile into the duodenum. Three: a stone sits in the cystic duct, the gallbladder contracts against the blocked outlet, pressure rises and this is biliary pain."
        caption: "الكبد بيصنع، المرارة بتخزّن، والدهون بتخليها تنقبض. ولو فيه حصوة على الباب، نفس الانقباض ده هو المغص. (الهرمون اللي بيعمل كده، **CCK**، physiology مقبولة ومش مذكور في الكتاب.)"
