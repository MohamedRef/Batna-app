  - id: geri.L05.lesson1
    title: "الـ stroke عند الكبير: جلطة ولا نزيف؟"
    hook: "تمانين في المية من الـ strokes جلطات، والباقي نزيف. والفرق ده بيقلب العلاج."
    minutes: 7
    pages: [84, 84]
    topics: [definition, tia]
    goals:
      - "تعرّف الـ stroke والـ transient ischaemic attack (TIA) وتعرف ليه الـ 24 ساعة"
      - "تحفظ نسب الأنواع"
      - "تعرف ليه أول سؤال: ischemia ولا hemorrhage"
    status: unverified
    videos:
      - youtube: U2tostMxJbU
        at: 345
        label: "الـ TIA في الـ carotid"
        by: "د. محمود علام"
      - youtube: Vp6igUZqf9E
        at: 77
        label: "الـ TIA في الـ vertebrobasilar"
        by: "د. محمود علام"
      - youtube: fltywXV2ElQ
        at: 1605
        label: "تعريف الـ TIA"
        by: "د. محمود علام"
      - youtube: OuARCpzmny4
        at: 174
        label: "الـ focal: signs of lateralization"
        by: "د. محمود علام"
    steps:
      - kind: explain
        page: 84
        quote: "Stroke is a syndrome characterized by the acute onset of neurologic deficit that persists for at least 24 hours, reflects focal involvement of the CNS & is the result of a disturbance of cerebral circulation."
        title: "التعريف"
        text: |
          الـ cerebrovascular disease (CVD) من أكبر أسباب المرض والوفاة عند الكبار، وأشهر طريقة بيظهر بيها هي الـ ==stroke==.

          تعريف الكتاب فيه أربع حتت، احفظها كده:
          - **acute onset**: فجأة.
          - **neurologic deficit** بيفضل **at least 24 hours**.
          - **focal**: جزء معيّن من الـ central nervous system (CNS).
          - سببه **disturbance of cerebral circulation**.

          ليه **24 hours**؟ لأن ده الحد اللي بيفرق الـ stroke عن الـ TIA: لو الـ deficit راح قبلها يبقى TIA. وليه **focal**؟ لأن الشريان اللي اتسد بيغذي حتة معيّنة، فالعرض بيشاور على المكان (إيد، كلام، نظر)، مش تلخبط عام زي الـ delirium. وليه الكبير بالذات؟ التفسير المقبول (مش في الكتاب): الـ atherosclerosis والـ AF والضغط بيزيدوا مع السن، ودول أهم مصادر الجلطة.
        lecturer:
          - tone: exam
            text: |
              من شرح د. علام: الـ **focal** على السرير اسمه ==signs of lateralization==: علامة في ناحية واحدة بتقولك إن الـ lesion في مكان معيّن (مش في الكتاب).
              حتى لو المريض في coma هتشوفها: pupil واسعة في ناحية، العينين رايحين ناحية، **facial asymmetry** (الهوا بيطلع من جنب واحد من البق)، hemiplegia، أو hypotonia و hyperreflexia و **Babinski** في ناحية (مش في الكتاب).
              ولو العلامات في الناحيتين زي بعض، فكّر غالبًا في سبب systemic زي الأدوية أو الـ metabolic (مش في الكتاب).
      - kind: figure
        page: 84
        quote: "Thromboembolic infarction 80%\nCerebral & cerebellar Hge 10%\nSubarachnoid Hge 5%"
        title: "الـ stroke جاي منين؟"
        alt: "Three horizontal bars. Thromboembolic infarction is a long bar at 80 percent, cerebral and cerebellar hemorrhage a short bar at 10 percent, subarachnoid hemorrhage the shortest at 5 percent."
        caption: "الجلطة بتكسب بفرق كبير: 80% thromboembolic، 10% نزيف في المخ أو المخيخ، 5% subarachnoid."
        svg: |
          <svg viewBox="0 0 330 170" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="22" class="t-sm t-mut">Causes of stroke</text>
            <rect x="10" y="35" width="240" height="30" class="fg-acc"/>
            <text x="18" y="55" class="t-sm t-b">Thromboembolic infarction</text>
            <text x="260" y="55" class="t-lg t-b t-acc">80%</text>
            <rect x="10" y="80" width="30" height="30" class="fg-bad"/>
            <text x="50" y="100" class="t-sm">Cerebral + cerebellar Hge</text>
            <text x="260" y="100" class="t-lg t-b t-bad">10%</text>
            <rect x="10" y="125" width="15" height="30" class="fg-bad"/>
            <text x="50" y="145" class="t-sm">Subarachnoid Hge</text>
            <text x="260" y="145" class="t-lg t-b t-bad">5%</text>
          </svg>
      - kind: reveal
        page: 84
        quote: "Thromboembolic infarction 80%"
        prompt: "ليه مانديش aspirin لأي stroke على طول طالما 80% جلطات؟"
        answer: "لأن الـ 15% الباقيين نزيف (10% cerebral و cerebellar، 5% subarachnoid)، والـ aspirin هيزوّد النزيف. علشان كده الكتاب في الـ management بيقول **CT may detect Hge early** قبل علاج الـ infarction. التفسير المقبول (مش في الكتاب): من شكل المريض بس مش هتفرق كويس، فالـ CT هو اللي بيحسم."
      - kind: explain
        page: 84
        quote: "Sudden loss of function for seconds lasts for minutes or hours."
        title: "والـ TIA؟"
        text: |
          الـ ==transient ischemic attack (TIA)== في الكتاب: **sudden loss of function** بيبدأ في ثواني ويقعد دقايق أو ساعات، ويروح.

          والـ **recurrent transient ischaemic attacks (TIAs)** سببها غالبًا **thrombosis or embolism** جوه الـ cerebral circulation نفسها. يعني الـ TIA إنذار: نفس العملية اللي هتعمل الـ stroke بعدين.

          ليه بنهتم بيها لو بتروح؟ التفسير المقبول (مش في الكتاب): لأن الشريان اللي اتسد شوية ورجع، ممكن يتسد خالص المرة الجاية، فالـ TIA فرصة تعالج الـ risk factors قبل الـ stroke.
        lecturer:
          - tone: tip
            text: |
              من شرح د. علام: الـ TIA تشخيص ==بأثر رجعي==: ما تقدرش تسمّيها TIA غير بعد ما الـ deficit يروح. لو اتصلوا بيك إن أبوهم بقّه اتعوج ودراعه وقع، دي **stroke** لحد ما يثبت العكس، وخلّيهم يجيبوه المستشفى حتى لو قالوا في السكة إنه بقى كويس (مش في الكتاب).
              وبيسمّوها **mini-stroke**، وحوالي تلت اللي بيجيلهم TIA بيجيلهم stroke حقيقية بعد كده (مش في الكتاب).
      - kind: update
        page: 84
        quote: "Sudden loss of function for seconds lasts for minutes or hours."
        text: "الكتاب بيعرّف الـ TIA بالوقت (sudden loss of function لدقايق أو ساعات). دلوقتي بيتعرّف بالـ tissue مش بالوقت: أعراض عابرة من غير acute infarction على الأشعة، وأغلبها بيخلص في أقل من ساعة. في الامتحان اكتب تعريف الكتاب."
        ref: "AHA/ASA TIA definition statement, 2009"
        lecturer:
          - tone: exam
            text: |
              من شرح د. علام: شكل الـ TIA بيقولك أنهي شريان (مش في الكتاب):
              - **carotid**: weakness أو تنميل في نص الجسم التاني، **aphasia** لو الـ dominant، و**amaurosis fugax**: عمى مفاجئ في عين واحدة بيرجع، لأن الـ ophthalmic artery فرع من الـ internal carotid (مش في الكتاب).
              - **vertebrobasilar**: ==vertigo== وbulbar symptoms (بلع وكلام)، وممكن weakness في ناحية أو الناحيتين، لأن الـ brain stem فيه أنوية الأعصاب والـ tracts النازلة (مش في الكتاب).
              وفي الاتنين الـ deficit بيروح لوحده، وده اللي بيخليها TIA.
      - kind: explain
        page: 84
        quote: "Ischemia or hemorrhage."
        title: "آليتين بس"
        text: |
          الكتاب بيقول الـ ==pathogenesis== حاجة من اتنين: **ischemia** أو **hemorrhage**.
          - **Ischemia**: الدم مش واصل (جلطة مكانها أو جاية من بعيد)، فالخلايا تجوع وتموت.
          - **Hemorrhage**: الدم طلع بره الوعاء، فبيضغط على المخ ويعمل **secondary ischemia** و**edema** (في الدرس الجاي).

          ليه التقسيم ده أهم حاجة في المحاضرة؟ لأن العلاج عكس بعض: الـ ischemia محتاجة تسييل (aspirin، alteplase)، والنزيف السيولة بتزوّده. يعني أول سؤال قدام أي stroke: ischemia ولا hemorrhage؟
      - kind: check
        page: 84
        quote: "Sudden loss of function for seconds lasts for minutes or hours."
        question: "A 72-year-old had a sudden loss of function (left-arm weakness) that fully resolved after 40 minutes. By the book's definitions, this is:"
        options: ["Transient ischemic attack", "Stroke", "Lacunar infarct", "Subdural haematoma"]
        answer: 0
        why:
          - "صح: sudden loss of function لدقايق أو ساعات وراح = TIA."
          - "الـ stroke لازم الـ deficit يفضل at least 24 hours."
          - "الـ lacune نوع من الـ stroke، يعني deficit بيفضل."
          - "الـ subdural بييجي بعد head injury بأيام أو شهور."
      - kind: try
        items: [geri.L05.001, geri.L05.002, geri.L05.003, geri.L05.004, geri.L05.006]
    recap:
      - "Stroke: acute، focal، at least 24 hours، من الدورة الدموية للمخ."
      - "80% thromboembolic، 10% cerebral/cerebellar Hge، 5% SAH."
      - "TIA: sudden loss of function لدقايق أو ساعات؛ recurrent TIAs من thrombosis أو embolism."
      - "Pathogenesis: ischemia أو hemorrhage، والعلاج عكس بعض."
    practice: [geri.L05.001, geri.L05.002, geri.L05.003, geri.L05.004, geri.L05.005, geri.L05.006, geri.L05.044]
  # ------------------------------------------------------------------
  - id: geri.L05.lesson4
    title: "الجلطة: مكانها ولا مسافرة؟ ومين المعرّض؟"
    hook: "الجلطة يا إما اتعملت في مكانها على plaque قديم، يا إما جاية مسافرة من القلب. والأعراض بتقولك أنهي فيهم."
    minutes: 9
    pages: [85, 86]
    topics: [ischemic, risk]
    goals:
      - "تفرّق الـ thrombosis من الـ embolism ومين بيروح فين وليه"
      - "تعرف الـ giant cell arteritis (GCA) والنزيف بيأذي إزاي"
      - "تعدّ الـ risk factors بقسميها"
    status: unverified
    videos:
      - youtube: ZWIPQKWJ8jQ
        at: 930
        label: "الـ endocarditis والـ stroke"
        by: "د. محمود علام"
      - youtube: xNE0V1ZBDoE
        at: 1366
        label: "الـ AF بيعمل emboli إزاي"
        by: "د. محمود علام"
      - youtube: nbVrMgoNQPM
        at: 486
        label: "الـ thrombus والـ Virchow's triad"
        by: "د. محمود علام"
      - youtube: fltywXV2ElQ
        at: 649
        label: "thrombosis ولا embolism ولا نزيف"
        by: "د. محمود علام"
      - youtube: cMLimdYt9gc
        at: 3575
        label: "الـ GCA: شريان بيقفل"
        by: "د. محمود علام"
    steps:
      - kind: explain
        remind: [geri.L05.008]
        page: 85
        quote: "A-Ischemic stroke:\n  About 2/3 are due to thrombosis, 1/3 due to embolism."
        title: "الـ ischemic stroke: محلي ولا مسافر؟"
        text: |
          الـ ischemic stroke: حوالي ==2/3 thrombosis== و**1/3 embolism**.

          **الـ thrombosis** (الجلطة اتعملت مكانها) بتسد:
          - **large arteries**: internal carotid، middle cerebral، basilar.
          - **small penetrating arteries**: دي الـ lacunar.
          - **cerebral veins or venous sinuses**.

          وبيسبقها TIAs، وأكتر عند الكبير اللي عنده **atherosclerosis**.

          ليه الـ thrombosis بيسبقها TIAs؟ التفسير المقبول (مش في الكتاب): لأن الـ plaque بيضيّق الشريان بالتدريج، وجلطات صغيرة بتتكوّن وتدوب قبل ما واحدة تقفل خالص. وليه الـ atherosclerosis؟ لأن الكتاب بيقول إنها بتصيب الشرايين الكبيرة في الرقبة وعند قاعدة المخ، وبتمشي مع الـ hypertension والـ DM والـ cholesterol والتدخين والـ hyperhomocysteinemia.
      - kind: order
        page: 85
        quote: "Thrombosis occluding:-\n  a- large cerebral arteries internal carotid, middle cerebral or basilar arteries.\n  b- Small penetrating arteries(lacunar)\n  c- cerebral veins or venous sinuses.\n    Thrombosis is preceded by TIA's, it more common in elderly atherosclerotic pt's.\n    Atherosclerosis affects the large extra cerebral arteries in the neck & at the base of the brain as well as large and medium sized elastic & muscular arteries.\n    Atherosclerosis results from dysfunction of the vascular endothelial cells, subintimal deposition of lipoprotein, formation of an atheromatous plaque."
        prompt: "رتّب الـ atherosclerosis بتتكوّن إزاي:"
        steps:
          - "Endothelial cell dysfunction"
          - "Subintimal lipoprotein deposition"
          - "Atheromatous plaque"
        why: "الـ endothelium بيبوظ الأول، فالـ lipoprotein يعدّي ويترسّب تحت الـ intima، وبعدين يتكوّن الـ plaque."
      - kind: explain
        page: 85
        quote: "Passage of a thrombus from heart, aortic arch or large cerebral arteries."
        title: "الـ embolism: جلطة مسافرة"
        text: |
          الـ ==embolism== = **passage of a thrombus** من القلب، أو الـ aortic arch، أو الشرايين الكبيرة.
          - في الـ anterior circulation بيقفل غالبًا الـ **middle cerebral artery**.
          - في الـ posterior بيقف عند **apex of the basilar artery**.
          - و**maximal at the onset**.

          ليه maximal من أول لحظة؟ لأن الـ embolus بيوصل جاهز ويقفل الشريان مرة واحدة، مفيش تضييق تدريجي زي الـ thrombosis. وليه الـ MCA؟ لأنه بياخد **85% of hemispheric blood flow**، فالجلطة بتمشي مع أكبر تيار.
      - kind: figure
        page: 85
        quote: "Emboli in anterior cerebral circulation often occlude the middle cerebral artery (85% of hemispheric blood flow)., while emboli in posterior cerebral circulation lodge at the apex of the basilar artery."
        title: "الـ embolus بيروح فين؟"
        alt: "Diagram: the heart, aortic arch and neck arteries send an embolus upward. In the anterior circulation the arrow goes to the middle cerebral artery, labelled 85 percent of hemispheric flow. In the posterior circulation the arrow goes to the apex of the basilar artery."
        caption: "الـ embolus بيمشي مع أكبر تيار: في الـ anterior بيروح الـ middle cerebral artery (MCA) (85% من الدم)، وفي الـ posterior بيقف عند الـ apex بتاع الـ basilar."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R05a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
              <marker id="R05b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="95" y="200" width="140" height="38" rx="8" class="fg-box"/>
            <text x="108" y="215" class="t-sm t-b">Sources of emboli</text>
            <text x="102" y="231" class="t-sm">heart · aortic arch · neck</text>
            <path d="M140 198L80 120" class="fg-arrow-acc" marker-end="url(#R05a)"/>
            <path d="M190 198L250 120" class="fg-arrow-bad" marker-end="url(#R05b)"/>
            <rect x="10" y="50" width="145" height="66" rx="8" class="fg-acc"/>
            <text x="18" y="70" class="t-sm t-mut">Anterior circulation</text>
            <text x="18" y="90" class="t-b">Middle cerebral a.</text>
            <text x="18" y="108" class="t-sm t-acc">85% of hemisphere flow</text>
            <rect x="175" y="50" width="145" height="66" rx="8" class="fg-bad"/>
            <text x="183" y="70" class="t-sm t-mut">Posterior circulation</text>
            <text x="183" y="90" class="t-b">Apex of basilar a.</text>
            <text x="20" y="30" class="t-sm t-b">Embolic stroke: maximal at onset</text>
          </svg>
      - kind: check
        page: 85
        quote: "Embolic strokes are usually maximal at the onset."
        question: "ست عندها AF صحيت بـ hemiplegia كاملة من أول لحظة. ده يرجّح إيه؟"
        options: ["Embolism", "Thrombosis preceded by TIAs", "Lacunar infarct", "Subdural haematoma"]
        answer: 0
        why:
          - "صح: الـ embolic stroke بيبقى maximal at onset، والـ atrial fibrillation (AF) مصدر من القلب."
          - "الـ thrombosis غالبًا بيسبقها TIAs والكتاب ما قالش إنها maximal من الأول."
          - "الـ lacune من small penetrating artery، مش من القلب."
          - "الـ subdural بييجي بعد head injury بأيام أو شهور."
        lecturer:
          - tone: exam
            text: |
              من شرح د. علام: فرّق التلاتة من الحكاية:
              - **Thrombosis**: كبير عنده atherosclerosis، وقبلها TIAs، والوعي غالبًا سليم، وغالبًا من غير صداع (الصداع مش في الكتاب).
              - **Embolism**: فجأة و**maximal at onset**، وممكن ==في أي سن== طالما فيه مصدر زي الـ AF (مش في الكتاب).
              - **Hemorrhage**: بيكمل في دقايق، ومعاه صداع شديد وcoma، وترجيع وزغللة من الـ intracranial pressure العالي (الدقايق والترجيع والزغللة مش في الكتاب).
          - tone: tip
            text: |
              من شرح د. علام: ليه الـ **atrial fibrillation (AF)** بتبعت emboli؟ حوالي 70% من الدم بينزل من الـ atrium للـ ventricle لوحده (passive)، و30% مستني الـ **atrial contraction** (مش في الكتاب).
              في الـ AF الـ atrium بيرتعش بدل ما ينقبض، فجزء من الدم يفضل راكد جنب الجدار ويتجلط، وفي يوم يطلع منه ==shower of emboli==: للمخ، وكمان للـ spleen والـ mesentery وغيرهم (مش في الكتاب).
      - kind: explain
        page: 86
        quote: "Granulomatous arteritis of large arteries, in association with polymyolgia rheumatica (in the elderly), headache, tender scalp, claudication of the jaw, sudden temporary or permanent loss of vision."
        title: "وفيه سبب مايتنسيش عند الكبير: GCA"
        text: |
          الـ ==giant cell arteritis== هي **granulomatous arteritis of large arteries**، ومعاها **polymyalgia rheumatica** عند الكبار.

          - **headache** و**tender scalp** (المشط بيوجعه).
          - **jaw claudication**: فكه بيتعب وهو بياكل.
          - الخطر: **sudden loss of vision**، مؤقت أو دايم.

          ليه الـ GCA في محاضرة الـ stroke؟ لأن الالتهاب بيقفل الشرايين الكبيرة، ومنها اللي بتغذي العين والمخ. وليه الـ jaw claudication؟ التفسير المقبول (مش في الكتاب): الشرايين اللي بتغذي عضلات المضغ ملتهبة وضيقة، فالعضلة تجوع وهي شغالة، زي الـ angina بس في الفك.
      - kind: aside
        tone: joke
        page: 86
        quote: "Granulomatous arteritis of large arteries, in association with polymyolgia rheumatica (in the elderly), headache, tender scalp, claudication of the jaw, sudden temporary or permanent loss of vision."
        text: "جدّك اشتكى إن **الفتة** بتتعب فكّه (**claudication of the jaw**) وراسه بتوجعه لما يسرّح شعره (**tender scalp**)؟ ده مش دلع: دي **giant cell arteritis (GCA)** لحد ما يثبت العكس، والعين في خطر (**loss of vision**)."
      - kind: explain
        page: 86
        quote: "B- Hemorrhage:- Compression of brain tissue & vascular structure leads to secondary ischemia & edema according to its location, intra cerebral, subarachnoid or subdural or epidural (traumatic)."
        title: "والنزيف بيأذي إزاي؟"
        text: |
          الـ ==hemorrhage== بيضغط على **brain tissue** والأوعية، فيعمل **secondary ischemia** و**edema** حسب مكانه: intracerebral، subarachnoid، subdural، أو epidural (traumatic).

          ليه النزيف بيعمل **ischemia** مع إنه دم زيادة؟ لأن الدم المتجمع بيضغط على الأوعية اللي حواليه فتتقفل، والـ edema بيزوّد الضغط جوه الجمجمة. يعني الضرر مش بس من مكان النزيف، من الضغط حواليه كمان.
      - kind: sort
        page: 86
        quote: "Risk factors for stroke:-\n  A- Risk factors for atherosclerosis:-\n    Hypertension,\n    D.M.,\n    Hyperlipidemia,\n    Hyperhomocysteinemia,\n    Cigarette smoking.\n  B- Other risk factors:-\n    Polycythaemia,\n    Endocarditis,\n    Migraine,\n    Vasculitis (Giant cell arteritis, PAN, SLE)\n    Chronic use of coxII inhibitors.\n    Anticardiolipin\n    Thrombocythemia & thrombophilia (protein c deficiency, factor V --- Venous thrombosis rather than arterial)."
        prompt: "صنّف الـ risk factors زي الكتاب:"
        bins: ["Atherosclerosis risk factors", "Other risk factors"]
        cards:
          - { text: "Hypertension", bin: 0 }
          - { text: "Diabetes", bin: 0 }
          - { text: "Hyperlipidemia", bin: 0 }
          - { text: "Hyperhomocysteinemia", bin: 0 }
          - { text: "Smoking", bin: 0 }
          - { text: "Polycythaemia", bin: 1 }
          - { text: "Endocarditis", bin: 1 }
          - { text: "Migraine", bin: 1 }
          - { text: "Chronic COX-2 inhibitors", bin: 1 }
          - { text: "Anticardiolipin", bin: 1 }
