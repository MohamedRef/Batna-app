      - kind: explain
        page: 141
        title: "الـ mechanistic biomarkers"
        text: |
          - **GLDH**: **mitochondrial dysfunction**. **Specific to the liver**، **early detection**، وبيفرّق بين **muscle and hepatic injuries**.
          - **MDH**: **periportal** enzyme، **excellent association with ALT**، بس **مش liver-specific**.
          - **HMGB1 (hyperacetylated)**: **DAMP** و immune activation marker، **greater sensitivity، predicts outcome**؛ مرتبط بـ **APAP DILI**.
          - **GSTs و alpha-GST**: phase II detoxification، **increased earlier than ALT**؛ مرتبطين بـ **APAP DILI**.
          - **M-CSFR1**، **osteopontin**، و **AFP**: **prognostic indicators** للـ **death and transplant**، والـ **AFP أضعف من الـ osteopontin**.
      - kind: check
        page: 141
        question: "A marathon runner has raised AST and ALT after a race. Which biomarker best tells liver from muscle injury?"
        options:
          - "GLDH"
          - "AST"
          - "MDH"
