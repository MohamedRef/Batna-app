        quote: "Predisposing etiological factors in the development of Non-Hodgkin's Lymphoma\nPrimary congenital immunodeficiency syndromes\n  Ataxia-telangiectasia\n  Wiskott-Aldrich\n  Common variable immunodeficiency\n  x-linked lympho-proliferative\nSecondary therapy-induced immunodeficiency\n  Organ transplantation\n  Immuno-suppressive therapy\nAutoimmune disorders\n  Rheumatoid\n  Sjogren's syndrome\n  Hashimoto's thyroditis\nMicrobial agents\n  HIV\n  EBV (PTLD)\n  HTLV-1 (ATL / L)\n  HHV-8 (PEL)\n  Helicobacter pylori (MALT)\nEnvironmental factors\n  Pesticides\n  Benzene\n  Herbicides\n  Chemotherapy\n  Radiation\n  Fertilizers\nPLTD =post-transplantation lymphoproliferative disorder\nATLL =Adult T-cell Leukaemia / Lymphoma\nPEL=Primary effusion Lymphoma\nHHV-8= Human herpesvirus -8\nMALT=Mucosa-associated lymphoid tissue"
