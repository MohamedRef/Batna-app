  - id: res.L05.lesson4
    title: "الـ cohort: نبدأ من الـ exposure"
    hook: "تابع 200 مدخن و200 مش مدخن. كام واحد هيجيله cancer؟ ومن كل اللي جالهم، كام في المية بسبب السيجارة؟"
    minutes: 8
    pages: [38, 48]
    topics: [cohort]
    goals:
      - "تعرّف الـ cohort وترتب خطواته"
      - "تحسب Ie و Io و relative risk (RR) و attributable risk (AR) و attributable risk percent (ARP)"
      - "تفسّر كل رقم بجملة المحاضرة"
    status: unverified
    steps:
      - kind: explain
        page: 38
        quote: "Cohort studies:\n  In a COHORT STUDY, a group of individuals that is exposed to a risk factor (study group) is compared to a group of individuals not exposed to the risk factor (control group).\n  The researcher follows both groups over time and compares the occurrence of the problem that he expects to be related to the risk factor in the two groups to determine whether a greater proportion of those with the risk factor are indeed affected."
        title: "الـ cohort: نبدأ من الـ exposure"
        text: |
          في الـ ==cohort== بنبدأ بمجموعتين:

          - **Exposed** (study group).
          - **Not exposed** (control group).

          ونتابعهم ==over time== ونقارن مين بيجيله المرض أكتر. يعني **forward**: من الـ cause للـ effect.

          في الشرح: المجموعتين لازم يبدأوا خاليين من الـ outcome اللي بندرسه (مش من كل الأمراض). ومدة المتابعة على حسب الوقت اللي المرض محتاجه يظهر: شهور في الحمل، وسنين في مرض ليه latency طويلة.
      - kind: explain
        page: 39
        quote: "Timeframe of Studies: Prospective Study - looks forward, looks to the future, examines future events, follows a condition, concern or disease into the future (Study begins here, then time runs forward)"
        title: "Prospective = بنبص لقدّام"
        text: |
          الـ ==prospective study== بيبدأ النهارده ويبص للمستقبل: بيتابع الـ condition أو المرض لقدّام.

          والدراسة بتبدأ **قبل** ما الـ outcome يحصل، وده بالظبط اللي بيخليها تقدر تقول إن الـ exposure جه الأول.
      - kind: figure
        page: 40
        quote: "Diagram of a cohort study:\n  Group of interest (e.g. smokers): Follow over time\n  Comparison group (e.g. non-smokers): Follow over time\n  Compare outcomes"
        title: "الكاميرا اللي بتسجّل لقدّام"
        alt: "Diagram of a cohort study. Two rows. Top: group of interest, smokers, five people, arrow follow over time, then five people with two now diseased. Bottom: comparison group, non-smokers, arrow follow over time, then five people with one diseased. A bracket says compare outcomes."
        caption: "نبدأ **من غير مرض** في الاتنين، نختار على أساس الـ **exposure**، ونتابع لقدّام ونقارن الـ outcomes."
