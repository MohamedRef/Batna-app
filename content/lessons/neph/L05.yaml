        quote: "(b) To evaluate living kidney donors to make sure no problem will occur to the donor and the recipient after transplantation."
        text: |
          - **Silent disease** في الـ high risk: hypertension (HTN)، diabetes mellitus (DM)، polycystic kidney disease (PKD)، solitary kidney، chronic kidney disease (CKD).
          - ==Living kidney donors==.
          - قبل **high-risk surgery** أو **contrast**: RFR ≤15 = خطر AKI ==11.8 مرة== بعد cardiac surgery.
          - تقييم الـ recovery بعد الـ AKI.

          التفسير المقبول (مش في الكتاب): في كل الحالات دي الـ baseline GFR ممكن يبان طبيعي، **بس** اللي يهمنا، **يعني** السؤال الحقيقي، الكلية هتستحمل الضربة الجاية ولا لأ، وده اللي الـ reserve بيقيسه.
      - kind: figure
        page: 125
        quote: "Preoperative Renal Functional Reserve Predicts Risk of AKI Post Cardiac Surgery"
        title: "الـ RFR قبل عملية القلب: رسمة الكتاب"
        image: { file: neph/L05-rfr-cardiac-surgery.webp, book: true }
        alt: "Book figure with two charts. Left: box plots of preoperative renal functional reserve, higher in patients with no acute kidney injury (green) than in those with acute kidney injury (red). Right, titled 'Patients with preoperative RFR of 15 ml/min/1.73 m2 or less were 11.8 times more likely to develop AKI': paired bars of the proportion of patients without AKI (green) and with AKI (red) across bands of RFR; in the lowest band nearly all developed AKI, and AKI becomes rare as RFR rises."
        caption: |
          - **شمال، box plot**: الـ **preoperative renal functional reserve** في عيانين **No acute kidney injury** (أخضر) أعلى من اللي جالهم **Acute kidney injury** (أحمر).
          - **يمين، الأعمدة**: كل مجموعة RFR فيها عمود أخضر (ما جالهوش AKI) وأحمر (جاله). في ==أقل مجموعة RFR== الأحمر هو الطويل، وكل ما الـ RFR يعلى الأحمر بيقصر لحد ما يختفي.
          - **العنوان فوق**: اللي الـ RFR بتاعهم **≤15 ml/min/1.73m²** قبل العملية كانوا ==11.8 مرة== أكتر عرضة للـ AKI.

          يعني الـ reserve قبل العملية ==بيتنبأ بالـ AKI== بعدها، وده سبب إن الـ stress test مفيد قبل الـ high-risk surgery.
