      - kind: explain
        page: 206
        title: "ليه أكتر من صبغة؟"
        quote: "(Masson‘s trichrome, X400). Methenamine-silver, X.400"
        text: |
          أول صورتين للـ normal glomerulus في الكتاب بصبغتين: ==Masson's trichrome== (الـ lobules والـ mesangial nuclei)، و ==methenamine-silver== (بتفرّق **mesangial nuclei** في النص عن **endothelial nuclei** على الـ loops). وبعدها **PAS** في الصفحة الجاية.

          التفسير المقبول (مش في الكتاب)، كل صبغة بتبيّن حاجة:
          - **H&E**: الخلايا والـ nuclei، علشان تعد الـ cells.
          - **PAS**: الـ basement membranes والـ mesangial matrix بلون magenta، علشان تشوف الـ matrix زاد ولا لأ.
          - **Silver**: بيصبغ الـ GBM والـ matrix **أسود**، علشان تشوف شكل الغشا نفسه (وهتشوف بيه الـ spikes والـ double contour بعدين).
          - **Trichrome**: الـ collagen أزرق أو أخضر، علشان تقيس الـ **fibrosis**.

          يعني الـ pathologist ما بيبصش على صبغة واحدة؛ كل سؤال ليه صبغته، وعلشان كده التقرير بيكتب الصبغة جنب كل وصف.

          إزاي تختار الصبغة في الامتحان؟ التفسير المقبول (مش في الكتاب): اسأل نفسك عايز تشوف إيه:
          - **cells** والالتهاب ← H&E.
          - **matrix** والغشا والـ sclerosis ← PAS.
          - **الغشا لوحده** (spikes، double contour، thinning) ← silver.
          - **fibrosis** والـ deposits الحمرا ← Masson's trichrome.
          - **amyloid** ← Congo red.
          وده بالظبط اللي التقارير بتعمله: كل جملة في الـ LM جاية من صبغة معينة، فلما تقرا «GBM duplication» اعرف إنها من الـ silver.
