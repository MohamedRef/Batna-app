          التفسير المقبول (مش في الكتاب): التلاتة أذى **بطيء ومتكرر** على سنين (روماتيزم شغال، تراب كل يوم في الشغل، دوا كل يوم)، فالرئة بترد بنفس الطريقة: ندبة فوق ندبة. عشان كده الـ UIP لوحده ما يقولكش IPF، ولازم تدوّر على السبب.
      - kind: check
