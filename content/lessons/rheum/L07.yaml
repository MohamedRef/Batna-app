            <text x="240" y="116" text-anchor="middle" class="t-sm">= C3 convertase</text>
            <path d="M240 190 V128" class="fg-arrow" marker-end="url(#L07c)"/>
            <text x="165" y="262" text-anchor="middle" class="t-sm t-mut">C4a: weak inflammation mediator</text>
            <text x="165" y="282" text-anchor="middle" class="t-sm t-mut">C2a: precursor of C2 kinin</text>
          </svg>
      - kind: table
        page: 110
        quote: "Proteins of the classical pathway of complement activation\n| Native component | Active form | Function of the active form |\n|---|---|---|\n| C1 (C1q:C1r2:C1s2) | C1q | Binds directly to pathogen surfaces or indirectly to antibody bound to pathogens, thus allowing autoactivation of C1r |\n| C1 (C1q:C1r2:C1s2) | C1r | Cleaves C1s to active protease |\n| C1 (C1q:C1r2:C1s2) | C1s | Cleaves C4 and C2 |\n| C4 | C4b | Covalently binds to pathogen and opsonizes it. Binds C2 for cleavage by C1s |\n| C4 | C4a | Peptide mediator of inflammation (weak activity) |\n| C2 | C2b | Active enzyme of classical pathway C3/C5 convertase: cleaves C3 and C5 |\n| C2 | C2a | Precursor of vasoactive C2 kinin |\n| C3 | C3b | Many molecules of C3b bind to pathogen surface and act as opsonins. Initiates amplification via the alternative pathway. Binds C5 for cleavage by C2b |\n| C3 | C3a | Peptide mediator of inflammation (intermediate activity) |"
        title: "Proteins of the classical pathway"
        columns: [Fragment, Job]
        rows:
          - ["C1q", "Binds antibody or pathogen"]
          - ["C1r", "Cleaves C1s"]
          - ["C1s", "Cleaves C4 and C2"]
          - ["C4b", "Opsonizes; holds C2 for C1s"]
          - ["C2b", "Enzyme of the C3/C5 convertase"]
          - ["C2a", "Precursor of C2 kinin"]
          - ["C3b", "Opsonin; AP amplification; holds C5"]
          - ["C4a, C3a", "Weak and intermediate inflammation"]
