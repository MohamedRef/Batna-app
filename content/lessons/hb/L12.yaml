  - id: hb.L12.lesson3
    title: "Hemochromatosis في العيادة"
    hook: "الحديد بيتخزن من يوم الولادة، والأعراض بتستنى 20-30 سنة. هنا: إزاي تشخّص، مين تعمله screening، وإزاي تفضّي الحديد."
    minutes: 10
    pages: [198, 199]
    topics: [hh-clinical]
    goals:
      - "تقسّم الأعراض لـ typical و severe/early و late cirrhosis"
      - "تختار الفحص الأول وتعرف مكان الـ liver biopsy"
      - "تقول مين من العيلة يتعمله screening وليه الأخوات 25%"
      - "تعرف علاج الـ iron depletion وإن HCC surveillance مستمر"
    status: unverified
    steps:
      - kind: explain
        page: 198
        title: "مرض صبور"
        text: |
          الكبد بيبدأ يحتفظ بالحديد من الولادة، بس ممكن ياخد ==20-30 سنة== قبل ما الأعراض تبان. علشان كده غالبًا بنشوفه في سن متوسط.

          Typical symptoms and signs:

          - Weakness و fatigue
          - ==Greyish-brown discoloration of the skin==: الحديد بيترسب في الجلد وبيزوّد الـ melanin.
          - Diabetes: الحديد في الـ pancreas.
          - Osteoporosis
          - **Arthropathy**: وجع ومشاكل في المفاصل.

          في الـ severe or early onset: hypogonadotrophic hypogonadism، hypothyroidism، و heart failure.

          وفي الـ later stages أعراض الـ cirrhosis: abdominal pain or tenderness، jaundice، ascites، variceal bleeding.

          لاحظ إن كل عرض بيقولك الحديد وصل فين: الجلد، الـ pancreas، المفاصل، الـ pituitary، القلب، وفي الآخر الكبد اتليّف. ربط الأعضاء بالـ figure اللي فات منطق مقبول.
      - kind: mnemonic
        page: 198
        word: "HHH"
        parts:
          - { key: "H", text: "Hypogonadotrophic hypogonadism (iron in the pituitary)" }
          - { key: "H", text: "Hypothyroidism" }
          - { key: "H", text: "Heart failure (iron in the heart)" }
        hook: |
          الحالة الشديدة أو اللي بدأت بدري = **3H**. وافتكر إن الـ pituitary والقلب كانوا في الـ figure بتاع الدرس اللي فات: الحديد وصلهم بعد ما الكبد اتملى.
      - kind: sort
        page: 198
        prompt: "حط كل علامة في مكانها:"
        bins: ["Typical", "Severe / early onset", "Late: cirrhosis"]
        cards:
          - { text: "Greyish-brown skin", bin: 0 }
          - { text: "Arthropathy", bin: 0 }
          - { text: "Diabetes", bin: 0 }
          - { text: "Osteoporosis", bin: 0 }
          - { text: "Hypogonadotrophic hypogonadism", bin: 1 }
          - { text: "Heart failure", bin: 1 }
          - { text: "Hypothyroidism", bin: 1 }
          - { text: "Ascites", bin: 2 }
          - { text: "Variceal bleeding", bin: 2 }
          - { text: "Jaundice", bin: 2 }
        why: "الـ **3H** للحالات الشديدة/البدري. والـ ascites والـ jaundice والـ varices دي أعراض الـ cirrhosis في المراحل المتأخرة، مش علامات الحديد نفسه."
      - kind: explain
        page: 198
        title: "التشخيص"
        text: |
          - أشهر الفحوص: ==transferrin saturation== و ==serum ferritin==.
          - الجديد: genetic test للـ hemochromatosis.

          - **Serum ferritin**: بروتين بيخزّن الحديد، ومستواه في الدم بيعكس المخزون في الأنسجة.

          والـ liver biopsy؟

          - Liver biopsy ==is not recommended for the diagnosis== of hepatic iron overload.
          - ممكن نعمله علشان نقيّم وجود cirrhosis.
          - ولو الـ cirrhosis واضحة أصلًا، مش محتاجين biopsy.

          يعني الـ biopsy هنا سؤاله «فيه تليّف؟» مش «فيه حديد؟». الدم والجينات بيجاوبوا على الحديد.
      - kind: reveal
        page: 198
        prompt: "ليه بنبدأ بالـ transferrin saturation والـ ferritin مع بعض، مش واحد بس؟"
        answer: |
          - الـ transferrin saturation بيقيس الـ circulating iron pool، اللي الكتاب قال إنه بيكبر الأول في الـ pathogenesis.
          - الـ ferritin بيعكس المخزون في الأنسجة.

          يعني واحد بيقيس الحديد الماشي في الشارع، والتاني بيقيس الحديد اللي في المخزن.

          والـ ferritin لوحده ممكن يعلى في أي inflammation أو liver injury، فالاتنين مع بعض أدق. ده تفسير مقبول.
      - kind: figure
        page: 198
        title: "ليه الأخوات 25%؟"
        alt: "A Punnett square of two carrier parents, each with one normal and one defective gene. The four children boxes are: normal, carrier, carrier, and affected with two defective genes. The affected box is one in four, 25 percent."
        caption: "أب وأم **carriers**: كل طفل عنده **25%** يورث الجينين المعيوبين. علشان كده الأخوات أهم ناس في الـ screening."
