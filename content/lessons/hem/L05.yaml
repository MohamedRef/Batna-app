lecture: hem.L05
lessons:
  # ------------------------------------------------------------------
  - id: hem.L05.lesson1
    title: "نهرين بيصبّوا في thrombin"
    hook: "الـ cascade مش حفظ أرقام رومانية: هو نهرين بيتقابلوا عند factor X، وكل الحكاية بتخلص في thrombin."
    minutes: 9
    pages: [70, 73]
    topics: [cascade, factors, inhibitors, fibrinolysis]
    goals:
      - "ترسم الـ intrinsic والـ extrinsic والـ common pathway"
      - "تعرف أسامي الـ factors"
      - "تعرف مين بيوقف التجلط ومين بيدوّب الجلطة"
    status: unverified
    steps:
      - kind: explain
        page: 70
        title: "Amplification"
        quote: "Normal coagulation results from a series of amplification reactions in which procoagulant. Proteins (factors) circulate in plasma as inert precursors"
        text: |
          الـ factors بتلف في الـ plasma ==inert precursors==، ومحدش فيهم شغال لحد ما اللي قبله يشغّله.

          ده الـ **cascade theory**: كل factor بيتحوّل لـ active form بالـ factor اللي قبله، في **chain reactions** بتكبّر الإشارة (amplification). جرح صغير يطلع جلطة كبيرة.
      - kind: figure
        page: 71
        quote: "Eventually, both the extrinsic and internsic system lead to generation of the enzyme thrombin which converts fibrinogen to fibrin."
        title: "نهرين بيتقابلوا"
        alt: "Two streams. Intrinsic: XII to XI to IX, then IX with VIII. Extrinsic: tissue factor III with VII. Both meet at factor X. Common pathway: X with V converts prothrombin II to thrombin, thrombin converts fibrinogen I to fibrin, XIII cross-links it."
        caption: "الـ **intrinsic** (12 ← 11 ← 9 + 8) والـ **extrinsic** (3 + 7) بيتقابلوا في ==factor X==، وبعدين X + V يعملوا thrombin، والـ thrombin يحوّل fibrinogen لـ fibrin."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L05a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <text x="70" y="20" text-anchor="middle" class="t-sm t-b t-acc">INTRINSIC</text>
            <text x="250" y="20" text-anchor="middle" class="t-sm t-b t-good">EXTRINSIC</text>
            <rect x="35" y="30" width="70" height="26" rx="8" class="fg-acc"/><text x="70" y="48" text-anchor="middle" class="t-sm">XII</text>
            <path d="M70 56 V72" class="fg-arrow" marker-end="url(#L05a)"/>
            <rect x="35" y="74" width="70" height="26" rx="8" class="fg-acc"/><text x="70" y="92" text-anchor="middle" class="t-sm">XI</text>
            <path d="M70 100 V116" class="fg-arrow" marker-end="url(#L05a)"/>
            <rect x="20" y="118" width="100" height="26" rx="8" class="fg-acc"/><text x="70" y="136" text-anchor="middle" class="t-sm">IX + VIII</text>
            <rect x="200" y="30" width="100" height="40" rx="8" class="fg-good"/><text x="250" y="48" text-anchor="middle" class="t-sm">Tissue factor</text><text x="250" y="63" text-anchor="middle" class="t-sm">(III) + VII</text>
            <path d="M70 144 L150 180" class="fg-arrow" marker-end="url(#L05a)"/>
            <path d="M250 70 L180 180" class="fg-arrow" marker-end="url(#L05a)"/>
            <text x="225" y="200" class="t-sm t-mut">COMMON</text>
            <rect x="110" y="182" width="110" height="28" rx="8" class="fg-ink"/><text x="165" y="201" text-anchor="middle" class="t-b">X + V</text>
            <path d="M165 210 V228" class="fg-arrow" marker-end="url(#L05a)"/>
            <rect x="80" y="230" width="170" height="28" rx="8" class="fg-box"/><text x="165" y="249" text-anchor="middle" class="t-sm">Prothrombin (II) → Thrombin</text>
            <path d="M165 258 V276" class="fg-arrow" marker-end="url(#L05a)"/>
            <rect x="80" y="278" width="170" height="28" rx="8" class="fg-box"/><text x="165" y="297" text-anchor="middle" class="t-sm">Fibrinogen (I) → Fibrin</text>
            <path d="M165 306 V324" class="fg-arrow" marker-end="url(#L05a)"/>
            <rect x="80" y="326" width="170" height="28" rx="8" class="fg-bad"/><text x="165" y="345" text-anchor="middle" class="t-sm t-b">XIII: cross-linked fibrin</text>
          </svg>
      - kind: reveal
        page: 71
        quote: "this pathway is intiated where factor III (tissue thromboplastin), a substance not found in the blood enters the vascular system."
        prompt: "ليه اسمه extrinsic؟"
        answer: |
          لأنه بيبدأ بحاجة **من بره الدم**: ==factor III (tissue thromboplastin)== ماهوش موجود في الدم، وبيدخل الـ vascular system لما الأنسجة تتعوّر.

          الـ intrinsic بقى كل مكوّناته **جوه الدم** (XII بيتنشّط على collagen أو activators تانية).
      - kind: table
        page: 71
        quote: "The coagulation factors"
        title: "أسامي الـ factors"
        columns: [No., Name]
        rows:
          - ["I", "Fibrinogen"]
          - ["II", "Prothrombin"]
          - ["III", "Tissue factor"]
          - ["V", "Labile factor"]
          - ["VII", "Proconvertin"]
          - ["VIII", "Antihemophilic globulin"]
          - ["IX", "Christmas factor"]
          - ["X", "Stuart-Prower"]
          - ["XI", "Plasma thromboplastin antecedent"]
          - ["XII", "Hageman"]
          - ["XIII", "Fibrin-stabilizing"]
        hide: [[3, 1], [5, 1], [6, 1], [7, 1], [9, 1], [10, 1]]
      - kind: aside
        tone: joke
        page: 71
        quote: "The coagulation factors"
        text: |
          الـ **Christmas factor (IX)** اتسمّى على اسم أول عيان اتشخّص بيه، Stephen Christmas، مش على العيد. يعني لو عيان هيموفيليا B قالك "أنا عندي Christmas" ما تبعتلوش تهنئة.

          (المعلومة التاريخية مش من الكتاب، بس الاسم من جدول ص 71.)
      - kind: check
        page: 71
        quote: "Eventually, both the extrinsic and internsic system lead to generation of the enzyme thrombin which converts fibrinogen to fibrin."
        question: "Where do the intrinsic and extrinsic pathways meet?"
        options: ["Factor X", "Factor XII", "Factor VII", "Factor XIII"]
        answer: 0
        why:
          - "صح: الاتنين بيشغّلوا X، ومن هنا الـ common pathway."
          - "الـ XII أول الـ intrinsic بس."
          - "الـ VII في الـ extrinsic بس، مع الـ tissue factor."
          - "الـ XIII آخر خطوة: بيربط الـ fibrin (cross-linking)."
      - kind: explain
        page: 72
        title: "الفرامل: natural inhibitors"
        quote: "Antithrombin III, most potent. It inactivate seriene proteases by combining with them. Heparin potentiates its action markedly."
        text: |
          1. **TFPI** (tissue factor pathway inhibitor): في الـ plasma والـ platelets، بيوقف **Xa** و **VIIa** والـ tissue factor.
          2. ==Antithrombin III==: **الأقوى**، بيلزق في الـ serine proteases ويوقفها. والـ **heparin** بيقوّيه جدًا.
          3. **Protein C** و **protein S**.
          4. **Thrombomodulin**: الـ thrombin يلزق فيه على الـ endothelium، فيشغّل **protein C**، اللي مع **protein S** يكسّر **V** و **VIII**.
      - kind: aside
        tone: analogy
        page: 72
        quote: "Thrombin binds to an endothelial surface receptor thrombomodulin. The resulting complex activate the vitamin K dependent serine protease C"
        text: |
          الـ **thrombin** هنا زي الجهاز اللي بيقفل نفسه: طول ما هو في الجرح بيجلّط، ولما يوصل للـ endothelium السليم ويمسك في **thrombomodulin** يتحوّل لفرامل ويشغّل **protein C**. كده الجلطة ما تكبرش بره الجرح.
      - kind: explain
        page: 72
        title: "Fibrinolysis: المنظّف"
        quote: "The most important route follows the release of tPA (Tissue plasminogen activator) from endothelium."
        text: |
          - **Plasminogen** (globulin proenzyme) بيتحوّل لـ **plasmin** بـ activators من جدار الوعاء أو الأنسجة.
          - أهم طريق: ==tPA== من الـ endothelium، وهو serine protease بيلزق في الـ fibrin.
          - **Activated protein C** بيزوّد الـ fibrinolysis لأنه بيكسّر الـ tPA inhibitors.
          - الـ **plasmin** بيهضم fibrinogen و fibrin و factor V و VIII.
      - kind: figure
        page: 73
        quote: "Thrombin Fibrinogen Plasmin Fibrinolysis"
        title: "التجلّط والتدويب"
        alt: "Three panels left to right. Coagulation: thrombin converts fibrinogen to fibrin polymer. Clot. Fibrinolysis: thrombin also activates plasmin, which breaks the fibrin polymer into fibrin fragments."
        caption: "نفس الـ **thrombin** اللي بيبني الجلطة بيشغّل كمان الـ fibrinolysis: ==plasmin== بيكسّر الـ fibrin لـ **fibrin fragments** (FDPs)."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L05b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="110" y="10" width="110" height="30" rx="8" class="fg-bad"/><text x="165" y="30" text-anchor="middle" class="t-b">Thrombin</text>
            <rect x="10" y="80" width="100" height="30" rx="8" class="fg-box"/><text x="60" y="100" text-anchor="middle" class="t-sm">Fibrinogen</text>
            <path d="M110 95 H140" class="fg-arrow" marker-end="url(#L05b)"/>
            <path d="M150 40 V75" class="fg-arrow" marker-end="url(#L05b)"/>
            <rect x="140" y="78" width="80" height="36" rx="8" class="fg-acc"/><text x="180" y="100" text-anchor="middle" class="t-sm t-b">Fibrin</text>
            <path d="M200 40 Q270 50 270 135" class="fg-arrow-acc" marker-end="url(#L05b)"/>
            <text x="270" y="150" text-anchor="middle" class="t-sm t-b">Plasmin</text>
            <path d="M180 114 V170" class="fg-arrow" marker-end="url(#L05b)"/>
            <rect x="120" y="172" width="120" height="34" rx="8" class="fg-good"/><text x="180" y="194" text-anchor="middle" class="t-sm">Fibrin fragments</text>
            <path d="M260 158 L240 180" class="fg-arrow" marker-end="url(#L05b)"/>
          </svg>
      - kind: try
        items: [hem.L05.003, hem.L05.004, hem.L05.008, hem.L05.012, hem.L05.016]
    recap:
      - "Intrinsic XII ← XI ← IX + VIII. Extrinsic III + VII. الاتنين في X، وبعدين X + V ← thrombin ← fibrin، و XIII يربطه."
      - "Extrinsic = factor III من بره الدم."
      - "Inhibitors: TFPI (Xa، VIIa)، antithrombin III (الأقوى، heparin يقوّيه)، protein C/S (يكسّروا V و VIII) عن طريق thrombomodulin."
      - "Fibrinolysis: tPA من الـ endothelium ← plasmin يهضم fibrinogen و fibrin و V و VIII."
    practice: [hem.L05.001, hem.L05.002, hem.L05.003, hem.L05.004, hem.L05.005, hem.L05.006, hem.L05.007, hem.L05.008, hem.L05.009, hem.L05.010, hem.L05.011, hem.L05.012, hem.L05.013, hem.L05.014, hem.L05.015, hem.L05.016, hem.L05.017, hem.L05.018, hem.L05.019]
