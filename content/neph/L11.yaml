    blanks: [[0, 1], [2, 1]]
    src: { page: 366, quote: "Pregnancy Outcomes Receiving Maintenance Dialysis Pregnancy among women receiving maintenance dialysis is associated with a higher risk of adverse outcomes. The rate of premature birth is much higher among pregnant women receiving hemodialysis when compared with the general population, with a 2016 meta-analysis by Piccoli et al (34) noting that 88% of births were preterm among patients treated with dialysis. Another the Australia and New Zealand Dialysis and Transplant Registry study also reported that, between 1991 and 2013, premature births among pregnant women receiving hemodialysis were quite high, at 80%.(35) More recently, a United States registry study that included>300 pregnant hemodialysis women reported that 45% had preterm births.(36) As the incidence of preterm delivery may have changed over time, it is crucial to consider the era of the source data when considering the incidence of preterm delivery. Pregnant women receiving hemodialysis have a higher rate of cesarean section,>60%, and poorer peripartum outcomes, including a higher rate of blood transfusions, longer hospital stays with more than half of the patients staying>6 days in the hospital, and a higher risk of sepsis, which occurs in 6% of deliveries.(36)" }
    status: unverified
    tags: [numbers]
