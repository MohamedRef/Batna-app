          - "High transferrin saturation and ferritin"
          - "Low serum alpha-1 antitrypsin"
          - "High serum ceruloplasmin"
        answer: 0
        why:
          - "صح: ALF + **hemolytic anemia** في سن صغير = فكّر Wilson، والـ **ceruloplasmin often low**."
          - "دي صورة الـ hemochromatosis، وده بيظهر متأخر (20-30 سنة)."
          - "ده AATD، وأعراضه رئة (30-50 سنة) أو liver disease، مش hemolysis."
          - "العكس: في Wilson الـ ceruloplasmin **low**."
      - kind: explain
        page: 201
        title: "العلاج"
        text: |
          - **Chelating agents:** **Penicillamine** و **Trientine**: بيمسكوا النحاس اللي اتراكم.
          - **Zinc:** **Zinc prevents the intestines from absorbing copper**.

          يعني الـ chelators بيفضّوا المخزن، والـ zinc بيقفل الباب علشان مايتمليش تاني.
      - kind: reveal
        page: 201
        prompt: "سؤال المحاضرة: **What is the mechanism of action of zinc in Wilson's disease?**"
        answer: |
          **إجابة الكتاب:** الـ zinc **prevents the intestines from absorbing copper**.

          ولو عايز تزوّد سطر (تفسير مقبول مش من الكتاب): الـ zinc بيخلّي خلايا الأمعاء تعمل **metallothionein**، بروتين بيمسك النحاس جوه الخلية، والخلية لما تتقشّر بتنزل بالنحاس في البراز.
      - kind: aside
        tone: joke
        page: 201
        text: |
          مريض Wilson عنده نحاس متراكم يكفي يفتح **ورشة في خان الخليلي**. 😄

          الـ **penicillamine والـ trientine** هما عربية النقل اللي بتفضّي الورشة، والـ **zinc** هو البواب اللي واقف على باب الأمعاء: «ممنوع دخول نحاس جديد».
      - kind: try
        items: [hb.L12.034, hb.L12.038, hb.L12.040, hb.L12.044, hb.L12.070]
    recap:
      - "Wilson: **AR**، **ATP7B**، النحاس مش بيطلع؛ **1 في 30,000**."
      - "الكبد: hepatitis، **ALF**، أو cirrhosis. الـ CNS: كلام، بلع، tremor، stiffness. Mental: anxiety، mood، depression، psychosis."
      - "Other = **HEART**؛ و KF rings على حرف القرنية."
      - "التشخيص: **ceruloplasmin low**، copper **high أو low**، ALT/AST، RBCs، biopsy."
      - "العلاج: **penicillamine، trientine**، و **zinc** بيمنع امتصاص النحاس من الأمعاء."
