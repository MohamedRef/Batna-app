items:
  # ---------- p447-449: overview and classes ----------
  - id: neph.L14.001
    kind: enumerate
    topic: ln-overview
    prompt: The six systemic diseases on the agenda of Lecture 14 (kidney in systemic diseases)?
    points:
      - Lupus nephritis
      - Thrombotic microangiopathy (TMA)
      - Viral related GN
      - Hepatorenal syndrome
      - Dysproteinemia
      - Sarcoidosis
    pass: 5
    src: { page: 447, quote: "Lupus Nephritis. TMA. Viral related GN. Hepatorenal syndrome. Dysproteinemia. Sarcoidosis." }
    status: unverified
  - id: neph.L14.002
    kind: cloze
    topic: ln-overview
    text: "The lifetime incidence of lupus nephritis among patients with SLE is {{c1::20%-60%}}."
    src: { page: 448, quote: "the reported lifetime incidence of lupus nephritis (LN) is 20%–60%." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L14.003
    kind: card
    topic: ln-overview
    front: Which SLE patients have the highest mortality from kidney involvement?
    back: Those progressing to kidney failure.
    src: { page: 448, quote: "Kidney involvement in SLE has been associated with higher mortality, especially for patients progressing to kidney failure." }
    status: unverified
  - id: neph.L14.004
    kind: card
    topic: ln-overview
    front: What is the ultimate goal of treating lupus nephritis?
    back: Preserve kidney function and reduce CKD and kidney-failure morbidity and mortality, while minimizing medication toxicity.
    src: { page: 448, quote: "The ultimate goal of treating LN is to preserve kidney function and reduce the morbidity and mortality associated with chronic kidney disease" }
    status: unverified
  - id: neph.L14.005
    kind: card
    topic: ln-overview
    front: Why must SLE patients be monitored actively and regularly for nephritis?
    back: Kidney involvement can stay silent or asymptomatic for a long time.
    src: { page: 448, quote: "the clinical presentation of kidney involvement can remain silent or asymptomatic for a significant period of time." }
    status: unverified
  - id: neph.L14.006
    kind: enumerate
    topic: ln-overview
    prompt: In which ethnic groups should a high index of suspicion for lupus nephritis be kept?
    points:
      - Asian
      - African/Caribbean
      - Hispanic
    pass: 3
    src: { page: 448, quote: "A high index of suspicion should be maintained for patients of Asian, African/Caribbean, and Hispanic descent." }
    status: unverified
  - id: neph.L14.007
    kind: card
    topic: ln-overview
    front: How does childhood-onset SLE differ from adult-onset SLE in the kidney?
    back: Higher incidence of lupus nephritis and more severe disease.
    src: { page: 448, quote: "Childhood-onset SLE is associated with a higher incidence of LN and more severe disease than adult-onset SLE." }
    status: unverified
  - id: neph.L14.008
    kind: card
    topic: ln-overview
    front: What should inform clinical decisions in lupus nephritis, rather than a single test?
    back: A holistic assessment of clinical, urinary and laboratory parameters, repeated over time to follow the trend.
    src: { page: 449, quote: "A holistic assessment including clinical, urinary, and laboratory parameters, and repeated investigations to note the progression of abnormal findings over time" }
    status: unverified
  - id: neph.L14.009
    kind: table
    topic: ln-classes
    title: ISN/RPS classes of lupus nephritis (Figure 3, p449)
    columns: [Class, Name, Key finding]
    rows:
      - [I, Minimal mesangial, "Normal glomeruli on light microscopy; mesangial immune deposits on IF"]
      - [II, Mesangial proliferative, "Mesangial hypercellularity or matrix expansion with mesangial deposits"]
      - [III, Focal, "Endo/extracapillary GN in <50% of glomeruli; A, C or A/C lesions"]
      - [IV, Diffuse, "≥50% of glomeruli, subendothelial deposits; IV-S or IV-G"]
      - [V, Membranous, "Subepithelial deposits; may combine with class III or IV"]
      - [VI, Advanced sclerosing, "≥90% of glomeruli globally sclerosed"]
    blanks: [[0, 1], [2, 2], [3, 2], [4, 2], [5, 2]]
    src: { page: 449, quote: "Histopathology classification of lupus nephritis according to the criteria established by the international Society of Nephrology and the Renal Pathology Society" }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.010
    kind: cloze
    topic: ln-classes
    text: "The ISN/RPS lupus nephritis classification dates from {{c1::2003}} and was revised in {{c2::2018}}."
    src: { page: 449, quote: "Renal Pathology Society (ISN/RPS) in 2003 revised in 2018" }
    status: unverified
    tags: [numbers]
  - id: neph.L14.011
    kind: cloze
    topic: ln-classes
    text: "Class III lupus nephritis involves {{c1::<50%}} of glomeruli; class IV involves {{c2::≥50%}}."
    src: { page: 449, quote: "Active or inactive focal, segmental or global endo/extracapillary glomerulonephritis involving <50% of all glomeruli" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L14.012
    kind: card
    topic: ln-classes
    front: How is class IV lupus nephritis split into IV-S and IV-G?
    back: "IV-S (diffuse segmental): ≥50% of involved glomeruli have segmental lesions. IV-G (diffuse global): ≥50% have global lesions."
    src: { page: 449, quote: "diffuse segmental (IV-S), when ≥50% of the involved glomeruli have segmental lesions, and diffuse global (IV-G)" }
    status: unverified
  - id: neph.L14.013
    kind: card
    topic: ln-classes
    front: "In class III/IV lupus nephritis, what do A, C and A/C mean?"
    back: "Active lesions (A), chronic inactive lesions (C), or both active and chronic lesions (A/C)."
    src: { page: 449, quote: "Manifestations include active lesions (A), inactive lesions (C) or active and chronic lesions (A/C)" }
    status: unverified
  - id: neph.L14.014
    kind: card
    topic: ln-classes
    front: Which lupus nephritis class can occur together with class III or IV?
    back: Class V (membranous lupus nephritis).
    src: { page: 449, quote: "It can occur in combination with class III or IV" }
    status: unverified
  - id: neph.L14.015
    kind: cloze
    topic: ln-classes
    text: "Class VI (advanced sclerosing) lupus nephritis means {{c1::≥90%}} of glomeruli are globally sclerosed, with a {{c2::terminal}} prognosis."
    src: { page: 449, quote: "Lupus Nephritis with terminal prognosis ≥90% of the glomeruli in global sclerosis" }
    status: unverified
    tags: [numbers]
  - id: neph.L14.016
    kind: mcq
    topic: ln-classes
    stem: "A lupus biopsy shows endocapillary proliferation with subendothelial deposits in 60% of glomeruli; most involved glomeruli show segmental lesions. Which class?"
    options:
      - Class IV-S
      - Class IV-G
      - Class III
      - Class V
      - Class II
    answer: 0
    why:
      - "Correct: ≥50% of glomeruli = class IV; ≥50% of involved glomeruli segmental = IV-S (p449)."
      - IV-G needs ≥50% of involved glomeruli with global lesions.
      - Class III is <50% of glomeruli.
      - Class V is subepithelial (membranous) deposits.
      - Class II is mesangial only.
    src: { page: 449, quote: "This class is also divided in diffuse segmental (IV-S)" }
    status: unverified
  # ---------- p450: general measures ----------
  - id: neph.L14.017
    kind: enumerate
    topic: ln-general
    prompt: Urinary findings that count as abnormal when screening SLE patients for kidney involvement (Figure, p450)?
    points:
      - Dipstick protein ≥2+ (or 1+ at low specific gravity)
      - Spot PCR >500 mg/g (50 mg/mmol)
      - Glomerular hematuria with ≥5% acanthocytes
      - Red or white cell casts
    pass: 3
    src: { page: 450, quote: "Abnormal proteinuria assessed by dipstick protein ≥2+" }
    status: unverified
  - id: neph.L14.018
    kind: enumerate
    topic: ln-general
    prompt: Kidney-protective general measures in lupus nephritis (Figure, p450)?
    points:
      - Avoid a high-sodium diet
      - Optimize blood pressure
      - RAAS blockade and SGLT2 inhibitor in stable patients without AKI
      - Avoid nephrotoxic insults and prevent AKI
    pass: 3
    src: { page: 450, quote: "Renoprotective medications, such as RAAS blockade, SGLT2 inhibitor, etc, in stable patients without AKI" }
    status: unverified
  - id: neph.L14.019
    kind: enumerate
    topic: ln-general
    prompt: Infection-related measures before immunosuppression in lupus nephritis (Figure, p450)?
    points:
      - Ask about prior herpes zoster and tuberculosis
      - Screen for HBV, HCV and HIV, and vaccinate against HBV
      - Pneumocystis jirovecii prophylaxis
      - Influenza and pneumococcal vaccination
      - Consider recombinant zoster vaccine
    pass: 4
    src: { page: 450, quote: "Assess medical history of herpes zoster and tuberculosis" }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.020
    kind: enumerate
    topic: ln-general
    prompt: Bone protection measures in lupus nephritis (Figure, p450)?
    points:
      - Bone mineral density and fracture risk assessment
      - Calcium and vitamin D supplementation
      - Bisphosphonates when appropriate
    pass: 3
    src: { page: 450, quote: "Bone mineral density and fracture risk assessment" }
    status: unverified
  - id: neph.L14.021
    kind: card
    topic: ln-general
    front: Which cardiovascular and pregnancy measures does the general-care figure list for lupus nephritis?
    back: Dyslipidemia management, blood pressure control, and low-dose aspirin during pregnancy.
    src: { page: 450, quote: "Low-dose aspirin during pregnancy" }
    status: unverified
  - id: neph.L14.022
    kind: card
    topic: ln-general
    front: What skin measures are part of general care in lupus nephritis?
    back: Broad-spectrum sunscreen and limiting ultraviolet light exposure.
    src: { page: 450, quote: "Broad-spectrum sunscreen" }
    status: unverified
  - id: neph.L14.023
    kind: card
    topic: ln-general
    front: How is ovarian function protected during cyclophosphamide for lupus nephritis (Figure, p450)?
    back: With a GnRH agonist such as leuprolide.
    src: { page: 450, quote: "Gonadotropin-releasing hormone agonists (i.e. leuprolide)" }
    status: unverified
  - id: neph.L14.024
    kind: enumerate
    topic: ln-general
    prompt: When should an SLE patient have a kidney biopsy (Figure, p451)?
    points:
      - Proteinuria >0.5 g/24 h
      - Urinary sediment abnormalities (dysmorphic RBCs, RBC or leukocyte casts) with proteinuria
      - Impaired kidney function secondary to SLE
    pass: 2
    src: { page: 451, quote: "Proteinuria > 0.5 g/24-hours" }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.025
    kind: card
    topic: ln-general
    front: What must every lupus nephritis biopsy report include?
    back: The NIH activity and chronicity index, tubulo-interstitial and vascular involvement, and the types of deposits on IF.
    src: { page: 451, quote: "Activity and Chronicity Index (NIH)" }
    status: unverified
  # ---------- p451-452: class I/II and podocytopathy ----------
  - id: neph.L14.026
    kind: card
    topic: ln-class12
    front: How are class I or II lupus nephritis with low-grade proteinuria treated?
    back: No specific immunosuppression beyond what the nonrenal (extrarenal) lupus needs.
    src: { page: 451, quote: "no specific immunosuppressive therapy beyond what is being given for nonrenal lupus is needed." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.027
    kind: card
    topic: ln-class12
    front: What is the usual clinical picture of class I or II lupus nephritis?
    back: Normal kidney function, or at most low-grade sub-nephrotic proteinuria, sometimes with microscopic hematuria.
    src: { page: 451, quote: "low- grade proteinuria that is well below the nephrotic-range, and sometimes microscopic hematuria." }
    status: unverified
  - id: neph.L14.028
    kind: card
    topic: ln-class12
    front: What is lupus podocytopathy?
    back: Class I or II histology with nephrotic-range proteinuria or nephrotic syndrome; diffuse podocyte effacement on EM.
    src: { page: 452, quote: "Patients with Class I or II histology but with nephrotic-range proteinuria or NS are considered to have lupus podocytopathy." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.029
    kind: card
    topic: ln-class12
    front: Which primary glomerular diseases does lupus podocytopathy resemble?
    back: Minimal change disease (MCD) or FSGS, clinically and histologically.
    src: { page: 452, quote: "these patients are similar to those MCD or FSGS , often showing a good response to glucocorticoid treatment." }
    status: unverified
  - id: neph.L14.030
    kind: cloze
    topic: ln-class12
    text: "In lupus podocytopathy, over {{c1::90%}} of patients remit on glucocorticoid monotherapy, within a median of {{c2::4 weeks}}."
    src: { page: 452, quote: "over 90% of patients given glucocorticoid monotherapy achieved remission within a median time of 4 weeks." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.031
    kind: card
    topic: ln-class12
    front: What maintenance is suggested for lupus podocytopathy, especially after relapses?
    back: Low-dose glucocorticoid plus another agent such as an MPAA, azathioprine or a CNI.
    src: { page: 452, quote: "maintenance with low-dose glucocorticoid plus an additional agent such as mycophenolic acid analogues (MPAA), azathioprine, or a CNI is suggested" }
    status: unverified
  # ---------- p452-454: initial therapy of class III/IV ----------
  - id: neph.L14.032
    kind: enumerate
    topic: ln-initial
    prompt: "Recommendation 10.2.3.1.1: glucocorticoids plus any one of which four options for active class III or IV lupus nephritis?"
    points:
      - Mycophenolic acid analogs (MPAA)
      - Low-dose intravenous cyclophosphamide
      - Belimumab with either MPAA or low-dose IV cyclophosphamide
      - MPAA plus a calcineurin inhibitor, if eGFR is not severely impaired
    pass: 4
    src: { page: 452, quote: "be treated initially with glucocorticoids plus any one of the following" }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.033
    kind: card
    topic: ln-initial
    front: What eGFR limit applies to adding a CNI to MPAA for initial class III/IV therapy?
    back: Kidney function must not be severely impaired (the book quotes eGFR <45 as severe impairment).
    src: { page: 452, quote: "MPAA and a calcineurin inhibitor (CNI) when kidney function is not severely impaired" }
    status: unverified
  - id: neph.L14.034
    kind: card
    topic: ln-initial
    front: What is the starting dose of hydroxychloroquine in lupus nephritis?
    back: 4-5 mg/kg/day, maximum 400 mg daily; no more than 200 mg daily if eGFR <30.
    src: { page: 453, quote: "HCQ: initial dose 4-5 mg/kg/day (maximum 400 mg daily)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L14.035
    kind: card
    topic: ln-initial
    front: Which cyclophosphamide regimen is preferred in the initial-therapy figure for class III/IV?
    back: Euro-Lupus, six biweekly IV pulses of 500 mg (cumulative 3 g).
    src: { page: 453, quote: "Cyclophosphamide: Eurolupus regimen preferred (6 biweekly i.v. pulses of 500 mg each, cumulative dose 3 g)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L14.036
    kind: table
    topic: ln-initial
    title: Drug doses in initial lupus nephritis therapy (Figure 4, p453)
    columns: [Drug, Dose, Target level]
    rows:
      - [Hydroxychloroquine, "4-5 mg/kg/day, max 400 mg (200 mg if eGFR <30)", "—"]
      - [MPAA, "Equivalent to MMF 2 g/day", "—"]
      - [Cyclosporine, "100-200 mg/day", "60-100 ng/mL"]
      - [Tacrolimus, "0.05-0.07 mg/kg/day", "4-7 ng/mL"]
      - [Voclosporin, "23.7 mg twice daily for 1-2 years", "Not required"]
      - [Belimumab, "10 mg/kg IV on days 1, 15, 29, then every 28 days", "—"]
    blanks: [[2, 2], [3, 1], [3, 2], [4, 1], [5, 1]]
    src: { page: 453, quote: "tacrolimus (initial dose 0.05-0.07 mg/kg/day, blood target level 4-7 ng/ml)" }
    status: unverified
    tags: [numbers]
  - id: neph.L14.037
    kind: card
    topic: ln-initial
    front: What do you add if proteinuria has not fallen by ≥25% after 2-3 months of initial class III/IV therapy (Figure 4, p453)?
    back: Add belimumab or a CNI.
    src: { page: 453, quote: "If no reduction in proteinuria ≥25% after 2-3 months add" }
    status: unverified
  - id: neph.L14.038
    kind: card
    topic: ln-initial
    front: How long are MPAA and CNI continued in lupus nephritis (Figure 4, p453)?
    back: "MPAA: maintenance for 3-5 years. CNI: 12-18 months, then 6-12 months of gradual tapering."
    src: { page: 453, quote: "MPAA: maintenance treatment for 3-5 years." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.039
    kind: card
    topic: ln-initial
    front: When is IV cyclophosphamide the initial choice for active class III/IV lupus nephritis?
    back: When the patient may have difficulty adhering to an oral regimen.
    src: { page: 455, quote: "Intravenous cyclophosphamide should be used as the initial therapy for active Class III and Class IV LN in patients who may have difficulty adhering" }
    status: unverified
  - id: neph.L14.040
    kind: card
    topic: ln-initial
    front: When is an MPAA-based regimen the preferred initial therapy for proliferative lupus nephritis?
    back: In patients at high risk of infertility, such as those with moderate-to-high prior cyclophosphamide exposure.
    src: { page: 457, quote: "An MPAA-based regimen is the preferred initial therapy" }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.041
    kind: enumerate
    topic: ln-initial
    prompt: When may a CNI-containing initial regimen (voclosporin, tacrolimus or cyclosporine) be preferred?
    points:
      - Relatively preserved kidney function
      - Nephrotic-range proteinuria from extensive podocyte injury
      - Cannot tolerate standard-dose MPAA
      - Unfit for or unwilling to use cyclophosphamide
    pass: 3
    src: { page: 457, quote: "may be preferred in patients with relatively ved kidney function and nephrotic-range proteinuria" }
    status: unverified
  - id: neph.L14.042
    kind: card
    topic: ln-mpaa-cni
    front: Why do CNIs reduce proteinuria quickly in lupus nephritis?
    back: Besides blocking T-cell activation and IL-2 release, they stabilize the podocyte cytoskeleton.
    src: { page: 458, quote: "They also modulate the podocyte cytoskeleton" }
    status: unverified
  - id: neph.L14.043
    kind: card
    topic: ln-mpaa-cni
    front: When is triple therapy with belimumab, glucocorticoids and MPAA or reduced-dose cyclophosphamide considered?
    back: In repeated renal flares or high risk of progression to kidney failure.
    src: { page: 458, quote: "may be considered in patients with repeated renal flares or at high-risk for progression to kidney failure." }
    status: unverified
  - id: neph.L14.044
    kind: card
    topic: ln-mpaa-cni
    front: When may azathioprine or leflunomide with glucocorticoids replace the standard initial drugs, and at what cost?
    back: With intolerance, lack of availability or excessive cost of standard drugs; they may be less effective with more flares or toxicity.
    src: { page: 458, quote: "such as azathioprine or leflunomide combined with glucocorticoids, may be considered in lieu of the recommended initial drugs" }
    status: unverified
  - id: neph.L14.045
    kind: card
    topic: ln-mpaa-cni
    front: When may rituximab be considered in lupus nephritis?
    back: Persistent disease activity or inadequate response to initial standard-of-care therapy.
    src: { page: 458, quote: "Rituximab may be considered for patients with persistent disease activity or inadequate response to initial standard-of-care therapy." }
    status: unverified
  - id: neph.L14.046
    kind: cloze
    topic: ln-mpaa-cni
    text: "MMF for initial treatment of proliferative lupus nephritis targets {{c1::2-3 g/day}}."
    src: { page: 457, quote: "MMF for initial treatment of proliferative LN have targeted dosing of 2-3 g/d." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.047
    kind: card
    topic: ln-mpaa-cni
    front: What do you try if MMF causes gastrointestinal intolerance?
    back: Enteric-coated mycophenolic acid (MPA), which is better tolerated by the gut.
    src: { page: 457, quote: "a trial of enteric-coated mycophenolic acid (MPA)" }
    status: unverified
  - id: neph.L14.048
    kind: card
    topic: ln-mpaa-cni
    front: How does MMF compare with cyclophosphamide for induction in proliferative lupus nephritis?
    back: Comparable short-term efficacy (complete and partial renal responses) to oral or IV cyclophosphamide.
    src: { page: 457, quote: "MMF has comparable short-term efficacy to oral or i.v. cyclophosphat complete and partial renal responses" }
    status: unverified
  # ---------- p455: steroids ----------
  - id: neph.L14.049
    kind: table
    topic: ln-steroids
    title: Glucocorticoid schemes for lupus nephritis (Figure 7, p455)
    columns: [Scheme, IV methylprednisolone, "Oral prednisone weeks 0-2", "After week 25"]
    rows:
      - [High-dose, "Nil or 0.25-0.5 g/day up to 3 days", "0.8-1.0 mg/kg (max 80 mg)", "<5 mg"]
      - [Moderate-dose, "0.25-0.5 g/day up to 3 days, often", "0.6-0.7 mg/kg (max 50 mg)", "<5 mg"]
      - [Reduced-dose, "0.25-0.5 g/day up to 3 days, usually", "0.5-0.6 mg/kg (max 40 mg)", "<2.5 mg"]
    blanks: [[0, 2], [1, 2], [2, 2], [2, 3]]
    src: { page: 455, quote: "Examples of glucocorticoid regimens for lupus nephritis." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L14.050
    kind: card
    topic: ln-steroids
    front: When may the reduced-dose glucocorticoid scheme be used in active lupus nephritis?
    back: After a short course of methylprednisolone pulses, when both kidney and extrarenal manifestations improve satisfactorily.
    src: { page: 455, quote: "A regimen of reduced-dose glucocorticoids following a short course of methylprednisolone pulses may be considered" }
    status: unverified
  - id: neph.L14.051
    kind: cloze
    topic: ln-steroids
    text: "In the reduced-dose scheme, prednisone reaches {{c1::5 mg}} by weeks 11-12 and {{c2::2.5 mg}} by weeks 13-14."
    src: { page: 455, quote: "Week 11-12" }
    status: unverified
    tags: [numbers]
  # ---------- p455-457: cyclophosphamide ----------
  - id: neph.L14.052
    kind: table
    topic: ln-cyc
    title: Cyclophosphamide regimens for class III/IV lupus nephritis (Figure 7, p456)
    columns: [Regimen, Dose, Duration]
    rows:
      - ["Standard-dose IV (modified NIH)", "0.5-1 g/m² monthly", "6 months"]
      - ["Low-dose IV (Euro-Lupus)", "500 mg every 2 weeks", "3 months"]
      - ["Oral", "1.0-1.5 mg/kg/day (max 150 mg/day)", "2-6 months"]
    blanks: [[0, 1], [1, 1], [1, 2], [2, 1]]
    src: { page: 456, quote: "Cyclophosphamide dosing regimens, combined with glucocorticoids, in initial treatment for active Class III/IV lupus nephritis." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L14.053
    kind: card
    topic: ln-cyc
    front: What are the other names of standard-dose and low-dose cyclophosphamide in lupus nephritis?
    back: "Standard-dose = modified NIH (high-dose) regimen; low-dose = Euro-Lupus regimen."
    src: { page: 455, quote: "standard-dose (also known as the modified National Institutes of Health (NIH) regimen or high-dose regimen) or low-dose (also known as the Euro-Lupus" }
    status: unverified
  - id: neph.L14.054
    kind: enumerate
    topic: ln-cyc
    prompt: Four factors in choosing a cyclophosphamide regimen (p456)?
    points:
      - Efficacy
      - Cost
      - Convenience
      - Toxicity
    pass: 4
    src: { page: 456, quote: "The choice of which regimen to use depends on several factors and can be individualized" }
    status: unverified
  - id: neph.L14.055
    kind: card
    topic: ln-cyc
