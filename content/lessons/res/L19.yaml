schema: batna.lesson/v1
lecture: res.L19
lessons:
- id: res.L19.lesson1
  title: ليه EBM أصلًا؟
  hook: نص اللي بنعمله في الممارسة محدش قيّمه أصلًا، و30% ممكن يكون مضر. عايز تبقى أنهي دكتور؟
  minutes: 7
  pages: [2, 13]
  topics: [why]
  goals:
  - تعرف المحاضرة هتعلّمك إيه
  - تعرف ليه ممارسات كتير قديمة طلعت غلط
  - تعرف أهداف الـ evidence-based practice وليه صعب تفضل up to date
  status: unverified
  steps:
  - kind: explain
    page: 2
    quote: |-
      1. Recognize the concept of EBM
      2. Learn the steps of evidence-based practice
      3. Identify the importance of EBM in clinical practice
      4. Ask clinically relevant answerable questions
      5. Find the evidence by searching the medical literature
      6. Developed skills for critically appraising the evidence
      7. Synthesize a conclusion to present an evidence-based answer
    title: المحاضرة دي هتعلّمك إيه؟
    text: |
      السلايد بتدي ==7 objectives==، وماشيين على ترتيب الشغل نفسه:

      1. تعرف الـ **concept** بتاع الـ EBM.
      2. تتعلم **steps** الـ evidence-based practice.
      3. تعرف **أهميته** في الممارسة.
      4. ==تسأل== سؤال clinical ينفع يتجاوب.
      5. ==تدوّر== على الـ evidence في الـ medical literature.
      6. تكتسب مهارة الـ critical appraisal.
      7. تطلع بإجابة evidence-based.

      ليه الترتيب ده مهم؟ لأن 4 و5 و6 و7 هما نفسهم خطوات الـ EBM اللي هتيجي في نص المحاضرة: اسأل، دوّر، قيّم، وطبّق. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 3
    quote: |-
      History of EBM
      Al-Razi (Rhazes)
      Avicenna (Ibn Sina)
    title: التاريخ بيبدأ منين؟
    text: |
      المحاضرة بتفتح تاريخ الـ EBM باسمين: ==Al-Razi (Rhazes)== و==Avicenna (Ibn Sina)==.

      ليه بيبدأوا بيهم؟ لأن فكرة إنك تبني العلاج على ملاحظة وتجربة مش على رأي وبس فكرة قديمة، والـ EBM الحديث بيرتّبها في خطوات. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 6
    quote: |-
      1. Medical education (Textbooks)
      2. Continuous Medical Education (CME)
      3. Medical journals
      4. Expert/colleagues opinions
      5. One's personal experience
    title: بتبني قرارك على إيه؟
    text: |-
      المحاضرة بتبدأ بسؤال بسيط: لما عندك مريض، قرارك بييجي منين؟

      - **Medical education** (الكتب).
      - **CME** (continuous medical education).
      - **Medical journals**.
      - رأي **expert** أو زميل.
      - **خبرتك الشخصية**.

      كلهم مصادر، بس مش كلهم ==evidence== بنفس القوة. المحاضرة كلها عن إزاي تفرّق.
  - kind: table
    page: 7
    quote: |-
      Many Traditional Interventions are Out of Date: Ex. Infant Gastroesophageal reflux disease (GERD)
      | Intervention | Effective? |
      | Placing in elevated prone position | No |
      | Placing in infant seat | No |
      | Thickening formula with infant cereal | No |
      | Changing protein content of formula | No |
      | Use of pacifier | Unclear |
      | 5% vs. 10% dextrose water | Slightly |
    title: حاجات اتعملت سنين وطلعت ملهاش لازمة
    columns:
    - Infant GERD intervention
    - Effective?
    rows:
    - - Elevated prone position
      - 'No'
    - - Infant seat
      - 'No'
    - - Thickening formula with cereal
      - 'No'
    - - Changing formula protein
      - 'No'
    - - Pacifier
      - Unclear
    - - 5% vs 10% dextrose water
      - Slightly
    hide:
    - - 0
      - 1
    - - 2
      - 1
    - - 4
      - 1
  - kind: case
    page: 10
    quote: |-
      Three systematic reviews
      Strong evidence that pts with acute LBP should be advised
      to avoid bed rest if possible,
      to stay active, and
      to get on with their ordinary activities as normally as possible
    stem: Ahmed, 35, overweight, acute low back pain (LBP) with thigh pain, nothing below the knee, no red flags, normal neurology.
    steps:
    - question: What should you advise about resting or exercising his back?
      options:
      - Get on with ordinary activities as normally as possible
      - Rest it as much as possible
      - Let pain be his guide
      - X-ray the spine before any exercise
      answer: 0
      why: '**3 systematic reviews**: تجنّب الـ bed rest، خليك active، وارجع لنشاطك العادي. النصيحة اللي «كلنا عارفينها» (ريّح)
        طلعت غلط.'
  - kind: explain
    page: 11
    quote: |-
      1. To reduce the wide variations in individual clinician's practices
      2. Eliminating worst practices
      3. Enhancing best practices
      4. Reducing health care costs
      5. Improving quality of patient care.
    title: الـ EBM جاي يعمل إيه؟
    text: |-
      5 أهداف:

      - يقلل الـ ==wide variations== بين الدكاترة (كل واحد بيعالج نفس الحالة بطريقة).
      - يشيل الـ **worst practices**.
      - يقوّي الـ **best practices**.
      - يقلل الـ **costs**.
      - يحسّن الـ **quality** of care.
  - kind: aside
    page: 11
    quote: |-
      1. To reduce the wide variations in individual clinician's practices
      2. Eliminating worst practices
      3. Enhancing best practices
      4. Reducing health care costs
      5. Improving quality of patient care.
    tone: joke
    text: |-
      روح 3 عيادات بنفس الكحة، هتطلع بـ 3 روشتات مختلفة وروشتة رابعة من الصيدلي. 😄

      ده بالظبط الـ **wide variation** اللي الـ EBM عايز يقلله.
  - kind: explain
    page: 12
    quote: |-
      Good Clinical Practice
      Knowledge (up to date) from best external evidence based on clinical research
      Judgment from experience.
      Understanding of patient's beliefs, preferences, values, expectations.
    title: الممارسة الكويسة = 3 حاجات
    text: |-
      - **Knowledge** حديث من أحسن ==external evidence== مبني على clinical research.
      - **Judgment** من الـ experience.
      - فهم **المريض**: beliefs، preferences، values، expectations.

      خلي بالك منهم، هيرجعوا بعد شوية باسم الـ **3 Es**.
  - kind: check
    page: 13
    quote: |-
      Why it is hard to be up-to-date?
      Because there is an epidemic of evidence, we need to keep up with and we cannot do this without new skills
      Articles Per Year: Biomedical 5,000? per day; MEDLINE 2,000 per day; Trials 75 per day; Diagnostic?
    question: Why does the lecture say it is hard to stay up to date?
    options:
    - An epidemic of evidence that we cannot keep up with without new skills
    - Too few trials are published
    - Textbooks are updated every month
    - Guidelines forbid reading journals
    answer: 0
    why:
    - 'صح: حوالي 5,000 article في اليوم، ومحتاج **skills** جديدة عشان تلحق.'
    - بالعكس، 75 trial في اليوم.
    - الكتب بتتأخر، مش بتتحدث كل شهر.
    - مفيش حاجة زي كده.
  - kind: try
    items: [res.L19.003, res.L19.006, res.L19.008]
  recap:
  - '7 objectives: concept، steps، أهمية، ثم اسأل، دوّر، قيّم، واطلع بإجابة.'
  - التاريخ بيبدأ بالرازي وابن سينا.
  - ممارسات كتير قديمة طلعت غلط (infant GERD، الـ bed rest في الـ LBP).
  - 'أهداف الـ EBM: تقليل الـ variations، شيل الـ worst، تقوية الـ best، تقليل الـ costs، تحسين الـ quality.'
  - الـ literature بتزيد آلاف المقالات كل يوم، فصعب تلاحق.
  practice: [res.L19.001, res.L19.002, res.L19.003, res.L19.004, res.L19.005, res.L19.006, res.L19.007, res.L19.008, res.L19.009]
- id: res.L19.lesson8
  title: ليه محتاجين مهارات جديدة؟ والـ information mastery
  hook: 20% بس من اللي بنعمله ثبت إنه بيفيد، والدكاترة في أمريكا مش بيطبّقوا غير جزء من الموصى بيه. تعمل إيه؟
  minutes: 6
  pages: [14, 20]
  topics: [why]
  goals:
  - تعرف المهارات اللي الـ EBM محتاجها
  - تعرف الفجوة بين الـ evidence والممارسة
  - تفهم الـ information mastery ومعادلة الـ usefulness
  status: unverified
  steps:
  - kind: explain
    page: 14
    quote: |-
      What skills will you need to keep up to date with the best evidence?
      Knowledge & skills
      To find the evidence more efficiently
      To critically appraise the quality of the evidence more effectively
      To use good quality evidence more systematically
    title: الـ skills المطلوبة
    text: |-
      عشان تلحق أحسن evidence محتاج 3 مهارات:

      - **Find** الـ evidence بكفاءة.
      - **Critically appraise** جودته بفعالية.
      - **Use** الـ evidence الكويس بشكل منتظم (systematically).
    remind: [res.L19.010]
  - kind: figure
    page: 15
    quote: |-
      Types of Different Clinical Practices
      Effective 20%
      Uncertain or Harmful 30%
      Unevaluated 50%
    title: ليه محتاجين مهارات جديدة؟
    svg: |-
