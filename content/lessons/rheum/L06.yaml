  - id: rheum.L06.lesson5
    title: "مين بيقتل مين: T cells والـ NK"
    hook: "الـ virus يخبّي الـ class I علشان الـ CTL ما تشوفهوش، فالـ NK تقتله لأنه خبّاه."
    minutes: 9
    pages: [99, 104]
    topics: [t-cells, ctl, nk]
    goals:
      - "تشرح اختيار الـ CD4 والـ CD8 في الـ thymus"
      - "تشرح الـ B7–CD28 والـ CTLA-4"
      - "تعرف إزاي الـ CTL والـ NK بيقتلوا"
    status: unverified
    steps:
      - kind: explain
        page: 99
        title: "الـ thymus بيختار"
        quote: "Moderate affinity for MHC class I"
        text: |
          الـ T cell بتيجي من الـ bone marrow للـ thymus، وتبقى **double positive (CD4+CD8+)**، وبعدين تتختبر على الـ MHC:
          - **No affinity** ← تموت، لأنها مش هتعرف تشوف حاجة.
          - **High affinity** ← تموت، لأنها خطر autoimmunity.
          - ==Moderate affinity== لـ **class I** ← **CD8**، ولـ **class II** ← **CD4**.

          وعلى السطح: الـ **CD4** بيمسك في الـ class II، والـ **CD8** في الـ class I، والاتنين بيبعتوا إشارة عن طريق **p56lck**.
      - kind: figure
        page: 100
        quote: "During activation, CTLA-4 is induced and its binding to B7-1 on the APC is"
        title: "On ثم off"
        alt: "Two panels. Top: an APC and a T cell joined by the TCR–peptide–MHC contact and by B7-2 on the APC binding CD28 on the T cell, labelled activation. Arrow: activation of the T cell results in CTLA-4 expression. Bottom: the same pair, now B7-1 on the APC binds CTLA-4 on the T cell, labelled off signal."
        caption: "==B7-2 + CD28== = on. التنشيط نفسه بيطلّع **CTLA-4**، و **B7-1 + CTLA-4** = off. فرامل بتطلع أوتوماتيك."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L06a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fg-head"/></marker></defs>
            <circle cx="60" cy="75" r="45" class="fg-box"/>
            <text x="60" y="80" text-anchor="middle" class="t-b">APC</text>
            <circle cx="270" cy="75" r="45" class="fg-acc"/>
            <text x="270" y="80" text-anchor="middle" class="t-b">T cell</text>
            <path d="M105 60 H225" class="fg-ink" stroke-width="3"/>
            <text x="165" y="52" text-anchor="middle" class="t-sm">MHC–peptide : TCR</text>
            <path d="M105 95 H225" class="fg-arrow-acc" stroke-width="3"/>
            <text x="165" y="115" text-anchor="middle" class="t-sm t-good t-b">B7-2 : CD28 = ON</text>
            <path d="M165 125 V170" class="fg-arrow" marker-end="url(#L06a)"/>
            <text x="175" y="152" class="t-sm t-mut">CTLA-4 induced</text>
            <circle cx="60" cy="245" r="45" class="fg-box"/>
            <text x="60" y="250" text-anchor="middle" class="t-b">APC</text>
            <circle cx="270" cy="245" r="45" class="fg-acc"/>
            <text x="270" y="250" text-anchor="middle" class="t-b">T cell</text>
            <path d="M105 230 H225" class="fg-ink" stroke-width="3"/>
            <path d="M105 265 H225" class="fg-arrow-bad" stroke-width="3"/>
            <text x="165" y="290" text-anchor="middle" class="t-sm t-bad t-b">B7-1 : CTLA-4 = OFF</text>
            <text x="165" y="315" text-anchor="middle" class="t-sm t-mut">B7 = CD80/86</text>
          </svg>
      - kind: check
        page: 100
        quote: "presented antigen and the co-stimulation of the B7-2-CD28 interaction."
        question: "Which interaction delivers the 'off' signal to an activated T cell?"
        options: ["B7-1 with CTLA-4", "B7-2 with CD28", "CD4 with class II MHC", "TCR with peptide–MHC"]
        answer: 0
        why:
          - "صح: الـ CTLA-4 بيطلع بعد التنشيط، ولما يمسك B7-1 ← off."
          - "B7-2 مع CD28 ده الـ on (costimulation)."
          - "CD4 مع class II بيثبّت التعرّف، مش off."
          - "TCR مع الـ peptide هو signal 1."
      - kind: explain
        page: 101
        title: "الـ CTL بيقتل الـ virus"
        quote: "Virus particles excereted from a virally infected cell are endocytosed"
        text: |
          1. جزيئات الـ virus بتتبلع بالـ **APC** وتتعرض على **class II** للـ **TH1**.
          2. الـ TH1 يبعت للـ **CTL** إشارات تنشيط: **IFN-γ** و **IL-2**.
          3. الـ CTL يشوف الـ viral peptide على **class I** في الخلية المصابة.
          4. يقتلها بطريقتين: ==apoptosis== بالـ **lymphotoxin**، أو **ثقوب** بالـ **perforin**.
      - kind: order
        page: 101
        quote: "CTLs can kill target cells by (i) inducing suicide (apoptosis) through"
        prompt: "رتّب خطوات قتل الخلية المصابة بالـ virus:"
        steps:
          - "APC endocytoses virus particles"
          - "Viral peptide on class II to TH1"
          - "TH1 sends IFN-γ and IL-2 to the CTL"
          - "CTL sees viral peptide on class I"
          - "Lymphotoxin or perforin kills the target"
        why: "الـ helper الأول، وبعدين الـ killer. الـ CTL محتاج إذن الـ TH1، وبعدين يدوّر على الخلية اللي شايلة الـ peptide على class I."
      - kind: explain
        page: 102
        title: "الـ NK cells"
        quote: "NK cells kill tumour cells and virally infected cells without the need for prior sensitisation."
        text: |
          - شبه الـ lymphocytes بس ==separate lineage== عن الـ T و B.
          - بتقتل **tumour cells** و **virally infected cells** من غير **prior sensitisation**.
          - بتفرز **IFN-γ** يشغّل الـ phagocytes ويجيب الـ T cells.
          - بتتنشّط بـ **IFN-γ و IL-2 و IL-12**.
          - بتقتل بطريقتين: **ADCC**، والهدف متغطي IgG والـ NK بتمسكه بالـ **FcγRIII**؛ أو **cell–cell contact** بـ receptor للـ class I و receptor للـ carbohydrates.
      - kind: figure
        page: 104
        quote: "A tumour cell not expressing class I molecules, or expressing abnormal forms of them, is lysed by the NK cell."
        title: "الـ NK بتقرر إزاي؟"
        alt: "Two rows. Top: normal cell with class I MHC. NK cell receives a positive signal from NKR-P1 binding carbohydrate and a negative signal from p58 binding class I; the negative wins, no lysis. Bottom: tumour or virus-infected cell without class I. Only the positive NKR-P1 signal arrives, so the cell is lysed."
        caption: "الـ ==class I== هو «كلمة السر». موجود ← الـ NK تسيب الخلية. مختفي ← تقتلها."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <circle cx="60" cy="70" r="42" class="fg-box"/>
            <text x="60" y="66" text-anchor="middle" class="t-sm t-b">Normal</text>
            <text x="60" y="84" text-anchor="middle" class="t-sm">class I +</text>
            <circle cx="270" cy="70" r="42" class="fg-acc"/>
            <text x="270" y="75" text-anchor="middle" class="t-b">NK</text>
            <path d="M102 55 H228" class="fg-arrow-acc" stroke-width="3"/>
            <text x="165" y="47" text-anchor="middle" class="t-sm t-good">NKR-P1 + sugar: kill?</text>
            <path d="M102 88 H228" class="fg-arrow-bad" stroke-width="3"/>
            <text x="165" y="106" text-anchor="middle" class="t-sm t-bad">p58 + class I: STOP</text>
            <text x="165" y="135" text-anchor="middle" class="t-b t-good">No lysis</text>
            <circle cx="60" cy="215" r="42" class="fg-bad"/>
            <text x="60" y="211" text-anchor="middle" class="t-sm t-b">Tumour / virus</text>
            <text x="60" y="229" text-anchor="middle" class="t-sm">no class I</text>
            <circle cx="270" cy="215" r="42" class="fg-acc"/>
            <text x="270" y="220" text-anchor="middle" class="t-b">NK</text>
            <path d="M102 205 H228" class="fg-arrow-acc" stroke-width="3"/>
            <text x="165" y="197" text-anchor="middle" class="t-sm t-good">NKR-P1 + sugar: kill</text>
            <text x="165" y="240" text-anchor="middle" class="t-sm t-mut">no stop signal</text>
            <text x="165" y="285" text-anchor="middle" class="t-b t-bad">Lysis</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 104
        quote: "Certain viruses down-regulate MHC class I molecule expression: this may"
        text: |
          الـ virus زي حرامي قلع **البطاقة**، اللي هي الـ class I، علشان الـ CTL ما تعرفش تقرا اسمه.

          بس الـ ==NK== كمين: أي حد **من غير بطاقة** يتمسك على طول. ده الـ **fail-safe mechanism**.
      - kind: case
        page: 104
        quote: "avoid killing by CTLs, but NK cells can then kill the target cell, providing a"
        stem: "A virus down-regulates class I MHC on the cells it infects."
        steps:
          - question: "Which cell now kills the infected cells best?"
            options: ["NK cells", "CD8 CTLs", "CD4 helper T cells", "B cells"]
            answer: 0
            why: "من غير class I، مفيش إشارة الـ p58 اللي بتوقف الـ NK، فالـ NKR-P1 positive signal يكسب ← lysis. والـ CTL محتاج class I علشان يشوف."
          - question: "If the cells are also coated with IgG, which NK receptor joins in?"
            options: ["FcγRIII (ADCC)", "CD28", "CTLA-4", "TCR"]
            answer: 0
            why: "الـ **ADCC**: الـ NK بتمسك الـ Fc بتاع الـ IgG بالـ **FcγRIII** وتقتل الهدف."
      - kind: try
        items: [rheum.L06.072, rheum.L06.073, rheum.L06.076, rheum.L06.080, rheum.L06.082]
    recap:
      - "Thymus: no أو high affinity ← تموت. Moderate لـ class I ← CD8، لـ class II ← CD4."
      - "B7-2 + CD28 = on. التنشيط يطلّع CTLA-4، و B7-1 + CTLA-4 = off. B7 = CD80/86."
      - "CTL: محتاج TH1، يشوف class I، يقتل بالـ lymphotoxin (apoptosis) أو الـ perforin."
