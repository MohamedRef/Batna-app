      - kind: explain
        page: 30
        quote: "Used to categorize findings during endoscopic evaluation of bleeding peptic ulcers:"
        title: "Forrest بيقسّم على إيه؟"
        text: |
          الـ **Forrest classification** بتصنّف شكل الـ **bleeding peptic ulcer** في المنظار:

          - **High risk**: ==IA spurting==، **IB oozing**، **IIA** pigmented protuberance أو non-bleeding visible vessel، **IIB** adherent clot.
          - **Low risk**: **IIC** flat pigmented spot، و ==III clean base==.

          ليه الـ visible vessel high risk مع إنه مش بينزف؟ التفسير المقبول (مش في الكتاب): ده شريان مكشوف في قاع القرحة، والجلطة اللي سدّاه ممكن تقع في أي لحظة. أما الـ flat spot فده مجرد أثر دم قديم، والـ clean base مفيهوش وعاء أصلًا.
