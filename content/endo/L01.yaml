    update:
      text: "Current practice: germline genetic testing of every first-degree relative is the screening test (finds the mutation in more than 95% of MEN 2 families; pentagastrin is no longer available in most countries, calcium stimulation replaces it). Thyroidectomy timing follows the mutation's risk class (codon 918 in the first year of life, codon 634 at or before age 5, moderate risk when calcitonin rises). For progressive metastatic MTC, kinase inhibitors (vandetanib, cabozantinib, selpercatinib) replaced cytotoxic chemotherapy. In the exam give the book's answer."
