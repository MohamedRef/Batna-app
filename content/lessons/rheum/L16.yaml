  - id: rheum.L16.lesson8
    title: "جوّه المفصل: من الأوعية للـ pannus للـ ankylosis"
    hook: "المفصل بيتهدّ على مراحل، وكل مرحلة بتجيب اللي بعدها. لو فهمت السلسلة، الـ X-ray والتشوّهات هيبقوا منطقيين."
    minutes: 8
    pages: [243, 244]
    topics: [pathology]
    goals:
      - "ترتّب مراحل الـ pathology وتعرف ليه كل مرحلة بتجيب اللي بعدها"
      - "تعرف التشوّه والـ muscle atrophy جايين منين"
      - "توصف الـ rheumatoid nodule تحت الميكروسكوب"
    status: unverified
    steps:
      - kind: figure
        page: 243
        title: "مفصل سليم جنب مفصل RA في الكتاب"
        image: { file: rheum/L16-normal-vs-rheumatoid-joint.webp, book: true }
        alt: "Book diagram comparing a normal joint (thin synovial membrane, smooth cartilage) with a rheumatoid joint: inflamed synovial membrane full of lymphocytes, macrophages, plasma cells and new vessels, and pannus creeping over the cartilage edge, with neutrophils and immune complexes in the joint space."
        caption: "على الشمال مفصل سليم: غشاء رفيع وغضروف أملس. على اليمين: غشاء ملتهب مليان خلايا وأوعية جديدة (**angiogenesis**)، و ==pannus== بيزحف على حرف الغضروف."
      - kind: explain
        page: 243
        title: "كل مرحلة بتجيب اللي بعدها"
        quote: "Swelling and congestion of synovial membrane - infiltration with TH1 lymphocytes, macrophages and some plasma cells. Effusion of synovial fluid rich in polymorphs."
        text: |
          المراحل في الكتاب مش قايمة تتحفظ، دي **سلسلة**، وكل حلقة بتفسّر اللي بعدها:

          - **أول حاجة الـ microvasculature بتتأذى**: الأوعية تبقى بتسرّب، فالمية والخلايا تعدّي. علشان كده المفصل **يورم ويحتقن**، ويتملي **Th1 lymphocytes** و **macrophages** وشوية plasma cells.
          - الـ **effusion غني بالـ polymorphs**: دول اللي الـ IL-8 ندهلهم في الدرس اللي فات.
          - الغشاء **يتضخّم ويعمل villi**، وممكن **lymphoid follicles**. التفسير المقبول (مش في الكتاب): الـ villi بتكبّر مساحة النسيج الملتهب، والـ follicles دي مصنع antibodies جوّه المفصل نفسه.
          - الـ ==pannus== = granulation tissue ملتهب بيفرش **فوق وتحت** الغضروف فيتآكل.
          - في الآخر ممكن **fibrous أو bony ankylosis**: التفسير المقبول (مش في الكتاب) إن المفصل بيحاول "يلم الجرح" بنسيج ليفي أو عضم، فيلحم.
      - kind: order
        page: 243
        quote: "Formation of inflammatory granulation tissue (pannus) spreading over and under the articular cartilage which becomes eroded."
        prompt: "رتّب اللي بيحصل في المفصل من الأول للآخر:"
        steps:
          - "Synovial microvascular injury"
          - "Synovial swelling, cell infiltration, effusion"
          - "Villous synovial hypertrophy"
          - "Pannus erodes cartilage"
          - "Fibrous or bony ankylosis"
        why: "البداية في الأوعية الصغيرة، بعدين الغشاء يورم ويتملي خلايا، يتضخّم بـ villi، يطلع الـ **pannus** ياكل الغضروف، وفي الآخر المفصل ممكن يلحم (ankylosis)."
      - kind: aside
        tone: exam
        page: 243
        quote: "Early change: injury to synovial microvasculature."
        text: "لو اتسألت عن **أول** تغيير في الـ RA: هو **injury to synovial microvasculature**، مش الـ pannus. الـ pannus بييجي بعدين."
      - kind: check
        page: 243
        quote: "Formation of inflammatory granulation tissue (pannus) spreading over and under the articular cartilage which becomes eroded."
        question: "Which tissue spreads over and under the articular cartilage and erodes it?"
        options: ["Pannus", "Villous synovium", "Lymphoid follicle", "Fibrous ankylosis"]
        answer: 0
        why:
          - "صح: الـ pannus = inflammatory granulation tissue بياكل الغضروف من فوق ومن تحت."
          - "الـ villi تضخّم في الغشاء نفسه، قبل الـ pannus."
          - "الـ lymphoid follicles بتتكوّن جوّه الغشاء المتضخّم."
          - "الـ ankylosis آخر مرحلة، مش اللي بياكل الغضروف."
      - kind: explain
        page: 243
        title: "التشوّه جاي منين؟"
        quote: "Inflammatory destruction of soft tissues laxity of ligaments and tendons – deformities."
        text: |
          الالتهاب مش بياكل الغضروف بس. بيهدّ الـ **soft tissues** كمان، فالـ **ligaments** والـ tendons ترتخي، والمفصل يزوغ عن مكانه: دي ==deformities==.

          وكمان العضلات اللي جنب المفصل الملتهب بتضمر (**muscle atrophy**).

          يعني التشوّه في الـ RA سببه الأربطة اللي ارتخت أكتر من العضم نفسه، وده اللي هتفهم بيه الـ swan neck والـ boutonniere في درس الإيد.
      - kind: reveal
        page: 243
        quote: "Atrophy of muscles adjacent to inflamed joints."
        prompt: "ليه العضلات اللي جنب المفصل الملتهب بتضمر، مع إن الالتهاب مش فيها؟"
        answer: |
          التفسير المقبول (مش في الكتاب): العيان **مابيحرّكش** المفصل اللي بيوجعه، والعضلة اللي ما بتشتغلش بتضمر (disuse). وكمان الألم والورم بيبعتوا إشارة عصبية **بتطفّي** العضلة اللي حوالين المفصل (reflex inhibition).

          علشان كده هتقابل في الكتاب بعد كده **quadriceps atrophy** في الركبة، و **muscle atrophy with weak grip** في الإيد، وعلشان كده العلاج الطبيعي جزء من العلاج.
      - kind: explain
        page: 244
        title: "الـ nodule تحت الميكروسكوب"
        quote: "Subcutaneous nodules\n  Central area of fibrinoid necrosis.\n  Palisade of mononuclear cells."
        text: |
          الـ **rheumatoid nodule**: في النص ==fibrinoid necrosis==، وحواليها ==palisade== من الـ mononuclear cells (صف خلايا واقفة جنب بعض زي السور).

          ونفس الفكرة في الأنسجة التانية: mononuclear infiltrate مع fibrinoid necrosis بدرجات و nodules.
      - kind: reveal
        page: 244
        quote: "Extra-articular tissues\n Mononuclear cell infiltrate with varying degrees of fibrinoid necrosis and nodule formation."
        prompt: "الكتاب بيقول الأنسجة برّه المفصل فيها نفس الـ mononuclear infiltrate والـ fibrinoid necrosis. ده بيقولك إيه عن الـ RA؟"
        answer: |
          إن الـ RA **مرض جسم كله** بنفس الآلية، مش مرض مفاصل وبس. نفس الخلايا (mononuclear) ونفس الضرر (fibrinoid necrosis) بيروحوا الجلد والرئة والقلب والأوعية.

          وده اللي هيخلّي الـ **extra-articular features** (الدرس الجاي) منطقية: الـ nodule في الكوع، والـ nodule في الرئة، والـ vasculitis، كلهم نفس الحكاية في مكان تاني.
      - kind: check
        page: 244
        quote: "Subcutaneous nodules\n  Central area of fibrinoid necrosis.\n  Palisade of mononuclear cells."
        question: "A biopsy of an elbow nodule in RA shows what?"
        options: ["Central fibrinoid necrosis with a palisade of mononuclear cells", "Caseating granuloma with giant cells", "Urate crystals with foreign body reaction", "Lipid-laden macrophages"]
        answer: 0
        why:
          - "صح: نص ميّت (fibrinoid necrosis) وسور خلايا (palisade) حواليه."
          - "الـ caseation بتاع الـ TB، مش الـ RA."
          - "الـ urate في الـ gouty tophus."
          - "الـ lipid-laden macrophages في الـ xanthoma."
      - kind: try
