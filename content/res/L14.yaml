- id: res.L14.025
  kind: calc
  topic: validity
  calculator: diagnostic_accuracy
  stem: 'Screening 1,000 people: 80 true positives, 100 false positives, 20 false negatives, 800 true negatives.'
  question: What is the sensitivity?
  inputs:
    tp: 80
    fp: 100
    fn: 20
    tn: 800
    measure: sensitivity
  expect: 80%
  interpret: '80 of the 100 people with the disease test positive: 80/100 = 80%.'
  src:
    page: 14
    quote: |-
      Calculations of sensitivity and specificity
      | Screening Results | Disease | No Disease | Total |
      |---|---|---|---|
      | Positive | 80 | 100 | 180 |
      | Negative | 20 | 800 | 820 |
      | Total | 100 | 900 | 1,000 |
      Sensitivity = 80/100 = 80%
      Specificity = 800/900 = 89%
  status: unverified
  tags: [numbers, high-yield]
