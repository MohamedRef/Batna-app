  - id: hem.L06.103
    kind: card
    topic: massive
    front: Why does dilutional coagulopathy happen in hemorrhagic shock?
    back: Fluid shifts from the interstitium into vessels and dilutes the factors, worsened by replacing loss with factor-poor fluids; colloids and crystalloids cause more coagulopathy than dilution alone explains.
    src: { page: 101, quote: "Dilutional coagulopathy: During haemorrhagic shock, there is fluid shift from the interstitial to the intravascular compartment" }
    status: unverified
  - id: hem.L06.104
    kind: cloze
    topic: massive
    text: "Each blood bag has {{c1::80 ml}} of CPDA solution with about {{c2::3 g}} of citrate, which a healthy adult metabolizes in {{c3::5 min}}."
    src: { page: 102, quote: "80 ml of citrate phosphate dextrose adenine solution present in each blood bag contains approximately 3 g citrate." }
    status: unverified
    tags: [numbers]
  - id: hem.L06.105
    kind: card
    topic: massive
    front: Why does citrate toxicity occur in massive transfusion, and what does it cause?
    back: Hypoperfusion or hypothermia slows citrate metabolism by the liver; unmetabolized citrate causes hypocalcemia, hypomagnesemia and worse acidosis.
    src: { page: 102, quote: "Unmetabolised citrate can then lead to hypocalcaemia, hypomagnesemia and worsen the acidosis." }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.106
    kind: card
    topic: massive
    front: Which appears first in citrate-induced hypocalcemia, and what should alert you?
    back: Myocardial depression appears before hypocalcemic coagulopathy; hypotension not responding to fluids should alert you. Calcium is needed in most massive transfusions.
    src: { page: 102, quote: "Hypotension not responding to fluids should alert the physician to this complication." }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.107
    kind: card
    topic: massive
    front: How is citrate-induced hypocalcemia monitored?
    back: Watch the transfusion rate, BP and corrected QT; measure ionized calcium with the ion-specific electrode on a blood gas machine, especially in liver disease or poor hepatic perfusion.
    src: { page: 102, quote: "following physiologic markers such as the blood pressure and corrected QT interval." }
    status: unverified
  - id: hem.L06.108
    kind: card
    topic: massive
    front: In liver dysfunction, which calcium salt is preferred and why?
    back: Calcium chloride, because releasing ionized calcium from it does not need normal liver function (unlike gluconate).
    src: { page: 103, quote: "For individuals with abnormal liver function, саlϲium chloride may be preferable to саlcium gluconate since release of ionized ϲalсium" }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.109
    kind: cloze
    topic: massive
    text: "Potassium in stored PRBCs ranges from {{c1::7 to 77 mEq/L}}; transient hyperkalemia is frequent at transfusion rates above {{c2::100–150 ml/min}}."
    src: { page: 103, quote: "Potassium concentrations in PRBCs can range from 7 to 77 mEq/L depending on age of stored blood." }
    status: unverified
    tags: [numbers]
  - id: hem.L06.110
    kind: card
    topic: massive
    front: What makes hyperkalemia more dangerous in massive transfusion?
    back: Poor renal function, tissue injury, fast transfusion and acidosis raise it; its cardiac effects are accentuated by hypocalcemia.
    src: { page: 103, quote: "Cardiac effects of hyperkalemia are accentuated by hypocalcaemia." }
    status: unverified
  - id: hem.L06.111
    kind: card
    topic: massive
    front: Why does hypomagnesemia occur in massive transfusion?
    back: Citrate binds magnesium, and large volumes of magnesium-poor fluid are infused; it further accentuates hypocalcemia.
    src: { page: 103, quote: "Hypomagnesemia: Citrate also binds to magnesium and can lead to hypomagnesaemia which can further accentuate effects of hypocalcaemia." }
    status: unverified
  - id: hem.L06.112
    kind: card
    topic: massive
    front: Causes and effects of hypothermia in massive transfusion?
    back: Cold fluids and blood, opened body cavities and low heat production; it slows citrate metabolism and drug clearance and causes coagulopathy below 34°C.
    src: { page: 103, quote: "Slowing of enzyme activity and decreased platelet function individually have been shown to contribute to hypothermic coagulopathy at core temperatures below 34°C." }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.113
    kind: card
    topic: massive
    front: Why is hypothermic coagulopathy missed by lab tests?
    back: Samples are warmed during processing.
    src: { page: 103, quote: "Coagulopathy due to hypothermia is not reflected in laboratory tests as the samples are warmed during processing." }
    status: unverified
    tags: [high-yield]
