          - "الـ phentolamine للـ pheo والـ cocaine."
          - "الـ MgSO4 للـ eclampsia."
          - "ده الـ dissection."
      - kind: explain
        page: 95
        title: "Renal artery stenosis"
        quote: "Reno vascular HT (RVHT). Progressive loss of RF due to ischemic nephropathey Recurrent episodes of flash, pulmonary edema Asymptomatic"
        text: |
          **4 صور:** renovascular HT، **ischemic nephropathy**، **flash pulmonary edema** متكرر، أو asymptomatic.

          **الآلية:** stenosis significant ← ↓renal perfusion ← ==RAAS activation== ← RVHT.

          **السبب:**
          - **Atherosclerosis:** الشائع، في الكبار، و **15%** يوصلوا ESRD.
          - ==Fibromuscular dysplasia==: ستات صغيرين.
