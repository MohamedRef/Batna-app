      - kind: reveal
        page: 297
        quote: "Arthritis appears 2-6 weeks after the initiating infection."
        prompt: "ليه اسمه reactive arthritis، وليه بيستنى 2–6 أسابيع بعد العدوى؟"
        answer: |
          لأن المفصل **بيتفاعل** (react) مع عدوى في مكان تاني، مش لأن الميكروب جوّه المفصل. الكتاب: ==specific infections trigger== الـ arthritis في عيان **genetically susceptible** (HLA-B27).

          التفسير المقبول (مش في الكتاب): الـ 2–6 أسابيع هي الوقت اللي المناعة بتاخده علشان تعمل رد قوي ضد الميكروب. في العيان اللي عنده استعداد، الرد ده يغلط ويمسك المفصل والعين والـ urethra. علشان كده الـ culture من المفصل مش هتطلّع الميكروب، والـ urethral culture نفسه سالب أو chlamydia في 30% بس.
      - kind: aside
        tone: joke
        page: 297
        quote: "Musculoskeletal\n  Arthritis appears 2-6 weeks after the initiating infection.\n  Asymmetric poly- or oligoarthritis knees and ankles.\n  Any joint may be involved."
        text: "الـ Reiter زي الضيف التقيل: الإسهال أو الـ urethritis يمشي، وبعد **2-6 أسابيع** يرجع يخبط على الباب ومعاه ركبة وارمة وعين حمرا. **Can't see, can't pee, can't climb a tree**."
      - kind: reveal
        page: 297
        quote: "It is difficult to be diagnosed in women, because cervicitis is less symptomatic than urethritis."
        prompt: "ليه الـ Reiter بيتشخّص في الرجالة أكتر؟"
        answer: |
          الكتاب: ==cervicitis is less symptomatic than urethritis==.

          يعني الراجل بيحس بالـ urethritis (حرقان وإفرازات) فيتسأل عنه ويتربط بالمفصل. الست عندها **cervicitis** ممكن ما تحسش بيه خالص، فالـ "triad" بيبان ناقص ركن، والتشخيص يضيع. فلو قدامك ست بـ asymmetric arthritis في الركبة و conjunctivitis، اسأل واكشف كأن الركن التالت موجود.
      - kind: explain
        page: 298
        title: "الصورة الكاملة"
        quote: "Tenosynovitis, plantar fasciitis, Achillis tendinitis and dactylitis (sausage toe) are common."
        text: |
          **المفاصل**: ==asymmetric== oligoarthritis في الركب والكاحل، acute أو relapsing أو chronic. Sacroiliitis asymmetric في 20%. tenosynovitis، plantar fasciitis، Achilles، و **sausage toe**.

          **GU**: urethritis (ظاهر أو لأ) + prostatitis؛ الـ culture سالب أو chlamydia 30%.

          **الجلد**: buccal ulcers ==مش بتوجع== (10%)، **keratoderma blennorrhagica** (10%) على الكعب والكف والـ scrotum، nail hyperkeratosis، و **circinate balanitis** (25-50%).

          **العين**: conjunctivitis (40%)؛ أقل: iritis، uveitis.

          **غير كده**: AR، conduction defects، nervous system 15%.

          ليه asymmetric؟ التفسير المقبول (مش في الكتاب): الـ RA مرض جسم كله بنفس الدرجة فبيبقى symmetric؛ الـ reactive رد مناعي على حاجة جت مرة واحدة، فبيمسك مفصل أو اتنين في الرجلين.
      - kind: match
        page: 298
        quote: "Keratoderma blennorrhagica (10%) is a hyperkeratotic skin lesion occuring predominantly on the soles, the plams, the scrotum, or else where."
