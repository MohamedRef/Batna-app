        title: "مصنع في الكبد، درع للرئة"
        alt: "Top panel, the liver makes AAT and sends it in the blood to the lungs. Middle panel, in the lung, inflammatory cells release enzymes; AAT neutralises them. Bottom panel, with low AAT the enzymes damage the alveoli, giving COPD-like emphysema, mostly in the lower lungs. A side note says liver transplant gives a new source of healthy AAT."
        caption: "الكبد بيعمل الـ AAT ويبعته للرئة. لو قلّ، الإنزيمات بتاكل الـ alveoli (**emphysema**، خصوصًا في الـ **lower lungs**). الزرع بيدي **مصنع جديد سليم**."
