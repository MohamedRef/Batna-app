schema: batna.lesson/v1
lecture: hb.L06
lessons:
  # ------------------------------------------------------------------
  - id: hb.L06.lesson1
    title: "من NAFLD لـ MASLD: الأسامي الجديدة"
    hook: "الكبد الدهني غيّر اسمه. اعرف الشجرة الجديدة، وحسبة الـ alcohol اللي بتفرّق MASLD عن MetALD عن ALD."
    minutes: 9
    pages: [97, 98]
    topics: [nomenclature]
    goals:
      - "تعدّ الـ 3 pathological aspects والـ 5 فروع تحت SLD"
      - "تفرّق MASLD و MetALD و ALD بأرقام الـ alcohol"
      - "تعرف إن معيار واحد من 5 cardiometabolic criteria كفاية"
    status: unverified
    steps:
      - kind: explain
        page: 97
        title: "3 حاجات بتحصل في الكبد"
        text: |
          الكتاب بيبدأ بالـ **pathological aspects** التلاتة: **Steatosis**، **Inflammation**، **Fibrosis**.

          والـ spectrum في الصورة: **normal liver → simple steatosis → NASH**. والـ fibrosis بتبدأ حوالين الـ **central veins** والـ **portal tracts**، وبعدين تعمل **bridges**، وفي الآخر **nodules** (F4 = cirrhosis).
      - kind: reveal
        page: 97
        prompt: "ليه غيّروا اسم NAFLD أصلًا؟ ما كان ماشي!"
        answer: |
          سببين (الكتاب بيقولهم في الـ conclusions):

          - الاسم الجديد بيساعد الدكتور **يحدد السبب بدقة**، أو يعترف إن فيه **أسباب مختلطة** (metabolic + alcohol مثلًا).
          - وبيتجنب الـ **stigmatization**: كلمة «non-alcoholic» بتعرّف المرض باللي هو مش هو، وكلمة «fatty» فيها وصمة.
      - kind: figure
        page: 98
        title: "شجرة الـ SLD"
        alt: "A tree. Steatotic liver disease (SLD) at the top branches into five: MASLD with its steatohepatitis form MASH; MetALD, MASLD with increased alcohol intake; ALD, alcohol-associated liver disease; specific aetiology SLD with DILI, monogenic diseases and miscellaneous; and cryptogenic SLD."
        caption: "SLD هي المظلة. تحتها 5 فروع: **MASLD** (وجواها MASH)، **MetALD**، **ALD**، **Specific aetiology** (DILI، monogenic، misc)، و **Cryptogenic**."
        svg: |
          <svg viewBox="0 0 330 470" xmlns="http://www.w3.org/2000/svg">
            <rect x="40" y="8" width="250" height="44" rx="8" class="fg-good"/>
            <text x="165" y="28" text-anchor="middle" class="t-b">Steatotic Liver Disease</text>
            <text x="165" y="45" text-anchor="middle" class="t-sm t-mut">SLD: the umbrella</text>
            <path d="M24 52V436" class="fg-ink"/>
            <path d="M24 90h20M24 172h20M24 246h20M24 320h20M24 412h20" class="fg-ink"/>
            <rect x="44" y="66" width="280" height="76" rx="8" class="fg-acc"/>
            <text x="54" y="86" class="t-b">MASLD</text>
            <text x="54" y="104" class="t-sm">metabolic dysfunction-associated SLD</text>
            <rect x="64" y="112" width="250" height="24" rx="12" class="fg-thin"/>
            <text x="74" y="129" class="t-sm">MASH = its steatohepatitis form</text>
            <rect x="44" y="152" width="280" height="44" rx="8" class="fg-acc"/>
            <text x="54" y="171" class="t-b">MetALD</text>
            <text x="54" y="188" class="t-sm">MASLD + increased alcohol intake</text>
            <rect x="44" y="226" width="280" height="44" rx="8" class="fg-bad"/>
            <text x="54" y="245" class="t-b t-bad">ALD</text>
            <text x="54" y="262" class="t-sm">alcohol-associated liver disease</text>
            <rect x="44" y="290" width="280" height="76" rx="8" class="fg-box"/>
            <text x="54" y="310" class="t-b">Specific aetiology SLD</text>
            <text x="54" y="330" class="t-sm">DILI (drug-induced liver injury)</text>
            <text x="54" y="348" class="t-sm">monogenic diseases, miscellaneous</text>
            <rect x="44" y="392" width="280" height="44" rx="8" class="fg-thin"/>
            <text x="54" y="411" class="t-b">Cryptogenic SLD</text>
            <text x="54" y="428" class="t-sm t-mut">no criteria, no cause found</text>
            <text x="165" y="462" text-anchor="middle" class="t-sm t-mut">NAFLD → MASLD, NASH → MASH</text>
          </svg>
      - kind: match
        page: 98
        prompt: "وصّل كل وصف بالاسم الجديد:"
        pairs:
          - ["Old name NAFLD", "MASLD"]
          - ["Old name NASH", "MASH"]
          - ["Metabolic criteria plus moderate-heavy alcohol", "MetALD"]
          - ["Steatosis, no criteria, no cause", "Cryptogenic SLD"]
        why: "NAFLD بقت **MASLD** و NASH بقت **MASH**. لو فيه metabolic criteria + alcohol في الـ range المتوسط يبقى **MetALD**. ومن غير criteria ولا سبب: **cryptogenic**."
      - kind: explain
        page: 98
        title: "الـ alcohol: فين الحدود؟"
        text: |
          الـ **MetALD** واقعة في النص بين MASLD و ALD: أولها «MASLD predominant» وآخرها «ALD predominant». تحت الحد التحتاني يبقى **MASLD**، وفوق الحد الفوقاني يبقى **ALD**.
      - kind: table
        page: 98
        title: "MetALD alcohol range"
        columns: ["Alcohol intake", "Women", "Men"]
        rows:
          - ["Average daily", "20–50 g", "30–60 g"]
          - ["Weekly", "140–350 g", "210–420 g"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2]]
      - kind: aside
        tone: exam
        page: 98
        text: |
          ماتحفظش 8 أرقام. احفظ الـ **daily** بس واضرب في **7**:

          - Women: 20 × 7 = **140**، و 50 × 7 = **350**.
          - Men: 30 × 7 = **210**، و 60 × 7 = **420**.

          والستات دايمًا الحد أقل (20/50 مقابل 30/60).
      - kind: check
        page: 98
        question: "A 46-year-old man with steatosis, BMI 31 and TG 2.1 mmol/L drinks about 280 g of alcohol a week. Classification?"
        options:
          - "MetALD"
          - "MASLD"
          - "ALD"
          - "Cryptogenic SLD"
        answer: 0
        why:
          - "صح: عنده cardiometabolic criteria، و 280 g/week بين **210 و 420** للرجالة = MetALD (280 ÷ 7 = 40 g/day)."
          - "الـ MASLD الصرف للرجالة تحت **210 g/week**."
          - "الـ ALD فوق **420 g/week** للرجالة."
          - "عنده criteria (BMI و TG)، فمش cryptogenic."
      - kind: explain
        page: 98
        title: "الـ cardiometabolic criteria: واحد من 5 يكفي"
        text: |
          علشان steatosis تتسمّى **MASLD** لازم **at least 1 out of 5** من الـ **adult criteria**.

          الخمسة كلهم مكونات الـ metabolic syndrome: **الوزن أو الوسط**، **السكر**، **الضغط**، **الـ TG**، و **الـ HDL**. وأي واحد منهم يتحسب كمان لو المريض **بياخد علاجه** (antihypertensive أو lipid-lowering أو علاج سكر).

          الجدول الجاي فيه الأرقام. حاول تفتكرها قبل ما تكشف.
      - kind: table
        page: 98
        title: "Adult cardiometabolic criteria (any 1 of 5)"
        columns: ["Criterion", "Cut-off"]
        rows:
          - ["BMI", "≥ 25 kg/m² (≥ 23 in Asians)"]
          - ["Waist", "> 94 cm men, > 80 cm women"]
          - ["Fasting glucose", "≥ 5.6 mmol/L (100 mg/dL)"]
          - ["HbA1c", "≥ 5.7%"]
          - ["Blood pressure", "≥ 130/85 mmHg or treatment"]
          - ["Triglycerides", "≥ 1.70 mmol/L (150 mg/dL)"]
          - ["HDL", "≤ 1.0 mmol/L men, ≤ 1.3 mmol/L women"]
        hide: [[0, 1], [1, 1], [3, 1], [5, 1], [6, 1]]
      - kind: aside
        tone: analogy
        text: |
          فكّر في الـ criteria زي **كارنيه النادي**: معاك أي كارنيه من الخمسة (وزن، سكر، ضغط، TG، HDL) تدخل نادي **MASLD**. مش محتاج الخمسة، ومش محتاج تبقى metabolic syndrome كاملة.

          ومعاكش ولا كارنيه، ومفيش سبب تاني؟ يبقى **cryptogenic SLD**.
      - kind: check
        page: 98
        question: "Which of these is NOT an adult cardiometabolic criterion for MASLD?"
        options:
          - "Serum ferritin 600 ng/mL"
          - "HbA1c 5.8%"
          - "Waist 96 cm in a man"
          - "HDL 1.2 mmol/L in a woman"
        answer: 0
        why:
          - "صح: الـ ferritin مش من الخمسة."
          - "HbA1c ≥ **5.7%** معيار سكر."
          - "Waist > **94 cm** في الرجالة معيار."
          - "HDL ≤ **1.3 mmol/L** في الستات معيار."
      - kind: try
        items: [hb.L06.004, hb.L06.005, hb.L06.006, hb.L06.009, hb.L06.013]
    recap:
      - "Pathology: **steatosis، inflammation، fibrosis**."
      - "SLD = مظلة لـ **MASLD (MASH)، MetALD، ALD، specific aetiology (DILI، monogenic، misc)، cryptogenic**."
      - "الاسم الجديد: سبب أدق (أو مختلط) ومن غير **stigmatization**."
      - "MetALD daily: **20–50 g** ستات، **30–60 g** رجالة؛ اضرب × 7 تطلع الأسبوعي (140–350، 210–420)."
      - "MASLD = steatosis + **1 من 5** cardiometabolic criteria."
    practice: [hb.L06.001, hb.L06.002, hb.L06.003, hb.L06.004, hb.L06.005, hb.L06.006, hb.L06.007, hb.L06.008, hb.L06.009, hb.L06.010, hb.L06.011, hb.L06.012, hb.L06.013, hb.L06.071, hb.L06.072, hb.L06.082]

