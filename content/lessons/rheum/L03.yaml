  # ------------------------------------------------------------------
  - id: rheum.L03.lesson1
    title: "المناعة لما تزوّدها: أربع أنواع hypersensitivity"
    hook: "المناعة زي البوّاب: من غيرها البيت يتسرق، بس لو اتعصّب زيادة ممكن يكسّر باب الشقة نفسها."
    minutes: 6
    pages: [52, 55]
    topics: [definition, classification]
    goals:
      - "تعرّف الـ hypersensitivity وتعرف تلات أنواع triggers"
      - "تحفظ تقسيم Coombs and Gell والـ mechanism بتاع كل نوع"
      - "تفرّق بين antibody-mediated و cell-mediated"
    status: unverified
    steps:
      - kind: explain
        page: 52
        quote: "Hypersensitivity is an exaggerated or inappropriate immune response that causes tissue damage."
        title: "يعني إيه hypersensitivity؟"
        text: |
          الـ adaptive immunity بتحمينا من الميكروبات، بس نفس الـ immune response ممكن تعمل tissue injury.

          ==Hypersensitivity== = immune response **مبالغ فيها أو في غير محلها** وبتعمل tissue damage. والأمراض اللي بتعملها اسمها **hypersensitivity diseases**.
      - kind: match
        page: 52
        quote: "An infection that cannot be cleared (TB). A normally harmless exogenous substance (pollen). An autoantigen (eg DNA in SLE)."
        prompt: "وصّل كل trigger بمثال الكتاب:"
        pairs:
          - ["An infection that cannot be cleared", "TB"]
          - ["A normally harmless exogenous substance", "Pollen"]
          - ["An autoantigen", "DNA in SLE"]
        why: "دي التلات triggers في صفحة 52. لاحظ إن الـ SLE هيرجع معانا في type III."
      - kind: explain
        page: 52
        quote: "Hypersensitivity reactions are based on the classification of Coombs and Gell into 4 types I, II, III and IV."
        title: "تقسيم Coombs and Gell"
        text: |
          التقسيم على حسب **نوع الـ immune response** و **الـ effector mechanism** اللي بيأذي الخلايا.

          - ==Types I, II, III== = **antibody mediated**.
          - ==Type IV== = **cell mediated** (T cells).
      - kind: figure
        page: 53
        quote: "Type I - Immediate hypersensitivity caused by IgE antibodies and mast cells"
        title: "الأربع أنواع في صورة واحدة"
        alt: "Four columns. Type I: an allergen bridges two IgE on a mast cell, which degranulates. Type II: IgG bound to a target cell surface antigen, with complement and an NK cell attacking it. Type III: small antigen-antibody complexes stuck to a vessel wall, with neutrophils arriving. Type IV: a T cell meets antigen and releases cytokines that activate a macrophage."
        caption: "I: IgE على الـ mast cell. II: antibody على سطح خلية. III: complexes بتترسب في الأوعية. IV: T cell بتشغّل macrophage."
        svg: |
