  - id: geri.L08.lesson8
    title: "Gout ولا pseudogout؟"
    hook: "ركبة وارمة في ست عندها 80 سنة: الأغلب مش gout. بلورة تانية، وعلاج تاني."
    minutes: 8
    pages: [146, 147]
    topics: [pseudogout]
    goals:
      - "تفرّق الـ gout من الـ pseudogout في البلورة والعيان والمفصل والأكل"
      - "تعرف ليه التشخيص الصح مهم للعلاج"
      - "تعرف علاج الـ pseudogout ومنع النوبات"
    status: unverified
    steps:
      - kind: explain
        page: 146
        quote: "Gout and pseudogout, while both joint problems caused by crystals, are caused by different kinds of crystals. Gout is caused by sodium urate crystals and pseudogout is caused by calcium pyrophosphate crystals."
        title: "بلورتين مختلفتين"
        text: |
          الكتاب بيقول الاتنين **crystal arthritis**، بس البلورة مختلفة:
          - **Gout**: ==sodium urate== crystals.
          - **Pseudogout**: ==calcium pyrophosphate== (CPP) crystals.

          ومن هنا كل الفروق التانية بتطلع. التفسير المقبول (مش في الكتاب):
          - الـ urate جاي من **الدم** (الأكل والكلى)، فالـ gout بيتأثر **بالأكل** وبيتمنع لما تنزّل الـ uric acid.
          - الـ CPP بيتكوّن **جوه الغضروف** نفسه، وبيزيد مع **تقدم سن الغضروف**، عشان كده الـ pseudogout في **الأكبر سنًا**، وفي **الركبة** (أكبر غضروف بيشيل وزن)، و **مالوش علاقة بالأكل**، و **مفيش دوا يمنع** تكوينه.
      - kind: table
        page: 146
        quote: "Gout and pseudogout, while both joint problems caused by crystals, are caused by different kinds of crystals. Gout is caused by sodium urate crystals and pseudogout is caused by calcium pyrophosphate crystals."
