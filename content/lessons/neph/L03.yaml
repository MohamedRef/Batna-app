        quote: "Table 2: Biomarkers of Cardiac and Renal Dysfunction.\n| Biomarkers | Characteristics of presentation/site of origin |\n| Molecular biomarkers | |\n| Cardiac troponin I (cTnI) | Myocardial injury |\n| B-type natriuretic peptide (BNP) | Myocardial stretching |\n| sST2 | Member of interleukin (IL)-1 family of receptors |\n| Indoxyl sulfate | Extracellular signal-regulated kinase (ERK), p38 mitogen-activated protein kinase (MAPK) and nuclear factor-kappa B (NF-κB) |\n| N-terminal propeptide of type III collagen (PIIINP) | Connective tissue injury |\n| Physiological biomarkers | |\n| Echocardiogram | Abnormal left ventricular hypertrophy |\n| | Central venous pressure |\n| | Pericardial effusion |\n| | Valvular stenosis |\n| | Myocardial injury |\n| | Fluid overfill |\n| | Valvular calcification |\n| Doppler | Intraparenchymal blood flow |\n| Ultrasound | Fluid overload |\n| Chest radiograph | Cardiomegaly |\n| | Interstitial edema |\n| | Enlarged pulmonary artery |\n| | Pleural effusion |\n| | Prominent superior vena cava |\n| | Kerley line |\n| Kidney biomarkers | |\n| Serum creatinine | Skeletal muscle |\n| Albuminuria | Marker of glomerular integrity/ (PCT) disruption |\n| Kidney injury molecule (KIM-1) | Type 1 cell membrane glycoprotein expressed in regenerating PCT epithelium |\n| Liver type fatty acid binding protein | Tubular injury |\n| IL-18 | Cytokine mediating inflammation and AKI through the NF-κB pathway |\n| Advanced glycation end products (AGE) | Improper renal clearance |\n| Physiological biomarkers | |\n| Ultrasound | Kidney enlargement |\n| | Thin and hyperechogenic cortex |\n| | Small dilation of the urinary tract |\n| | Parapelvic and subcortical cysts |\n| Doppler | Intraparenchymal blood flow |"
        text: |
          **القلب:**
          - **Echo:** left ventricular hypertrophy (LVH)، central venous pressure، pericardial effusion، valvular stenosis و calcification، myocardial injury، fluid overfill.
          - **Doppler:** intraparenchymal blood flow. **Ultrasound:** fluid overload.
          - **Chest X-ray:** ==cardiomegaly==، interstitial edema، enlarged pulmonary artery، pleural effusion، prominent superior vena cava، **Kerley lines**.

          **الكلى (ultrasound):** kidney enlargement، **thin hyperechogenic cortex**، small dilation of the urinary tract، parapelvic و subcortical cysts، و Doppler للـ intraparenchymal flow.

          التفسير المقبول (مش في الكتاب): الـ **Kerley lines** والـ pleural effusion بيظهروا **لأن** الضغط في أوردة الرئة عالي فالمية بتطلع للـ interstitium. والـ **thin hyperechogenic cortex** معناه nephrons اتحولت لـ fibrosis، **يعني** مرض مزمن مش AKI.
