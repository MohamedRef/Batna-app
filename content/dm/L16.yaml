    pass: 4
    hook: "الـ HHS في الحالة: «عدوى، أدوية، مش ملتزم، سكر مش متشخص، مخدرات، وأمراض تانية»: gram-negative pneumonia وUTI وsepsis، medications، poor compliance، undiagnosed DM، substance abuse، وcoexisting diseases."
    src: { page: 204, quote: "Infections (pneumonia caused by gram-negative bacteria, UTI & sepsis), medications, poor compliance, undiagnosed DM, substance abuse, & coexisting diseases are precipitating factors for HHS" }
    status: unverified
  - id: dm.L16.023
    kind: card
    topic: child-hhs
    front: Why is there no ketoacidosis in HHS?
    back: Insulin action is too little for glucose use by insulin-sensitive tissues but enough to prevent lipolysis and ketogenesis.
    src: { page: 204, quote: "In HHS, insulin action may be inadequate to facilitate glucose utilization by insulin-sensitive tissues but sufficient for the prevention of lipolysis & ketogenesis" }
    status: unverified
    tags: [high-yield]
  - id: dm.L16.024
    kind: card
    topic: child-hhs
    front: Why do patients with HHS have profound dehydration and electrolyte loss?
    back: Prolonged, gradually increasing polyuria and polydipsia with a long osmotic diuresis.
    src: { page: 204, quote: "Severe electrolyte loss occurs due to prolonged duration of osmotic diuresis." }
    status: unverified
  - id: dm.L16.025
    kind: enumerate
    topic: child-hhs
    prompt: What must be watched for during treatment of HHS (Case 3)?
    points:
      - Shock and vascular collapse (lactic acidosis, rhabdomyolysis, renal failure, thrombosis) from massive early osmotic diuresis
      - Persistent hypernatremia
      - Hypokalemia
      - Hypophosphatemia
      - Rhabdomyolysis
      - Pancreatitis
      - Thrombosis
    pass: 5
    hook: "وانت بتعالج الـ HHS خاف من «الصدمة» (shock وvascular collapse من الـ osmotic diuresis البدري) + «الأملاح» (hypernatremia مستمرة، hypokalemia، hypophosphatemia) + «العضل والبنكرياس والجلطة» (rhabdomyolysis، pancreatitis، thrombosis). 1 + 3 + 3 = 7."
    src: { page: 204, quote: "Persistent hypernatremia, hypokalemia, hypophosphatemia, rhabdomyolysis, pancreatitis, & thrombosis must be watched for." }
    status: unverified
  - id: dm.L16.026
    kind: cloze
    topic: child-hhs
    text: "Pediatric HHS: insulin {{c1::0.1 U/kg/h}}; fluids start with {{c2::0.9% saline}} then 0.45-0.75% saline; dextrose is added when glucose drops to {{c3::300}} mg/dL."
    src: { page: 205, quote: "16. Management of HHS in pediatrics is the same for DKA; exogenous insulin infusion at a rate of 0.1 U/kg/h is recommended.\n17. Fluid resuscitation is best accomplished initially with isotonic fluid (0.9% saline), which will be hypotonic for these patients, followed by 0.45% to 0.75% saline.\n18. Dextrose is added to intravenous fluids when serum glucose drops to 300 mg/dl to avoid overly precipitous drops in glucose levels." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L16.027
    kind: card
    topic: child-hhs
    front: Why is 0.9% saline described as hypotonic in HHS?
    back: Because these patients' serum is markedly hyperosmolar, isotonic saline is relatively hypotonic for them.
    src: { page: 205, quote: "Fluid resuscitation is best accomplished initially with isotonic fluid (0.9% saline), which will be hypotonic for these patients, followed by 0.45% to 0.75% saline." }
    status: unverified
  # ---------- Case 4, p205-208: hypokalemic paralysis ----------
  - id: dm.L16.028
    kind: case
    topic: hypokalemia
    stem: A 45-year-old woman has 2 days of fever and cough, then 8 hours of rapidly progressive weakness of all four limbs and 1 hour of breathlessness. No sensory, visual or bulbar symptoms.
    steps:
      - reveal: "Alert; RR 28; pulse 118 irregular; left basal rales; flaccid 0/5 quadriparesis with absent reflexes; diaphragm involved; sensation normal."
        question: Which electrolyte disorder best explains a flaccid areflexic paralysis with normal sensation?
        options: [Severe hypokalemia, Hypercalcemia, Hypernatremia, Hypermagnesemia]
        answer: 0
        why: Severe hypokalemia causes marked skeletal weakness, even total paralysis with respiratory involvement.
      - reveal: "Glucose 474 mg/dL, K 1.3 mEq/L, phosphate 2.1 mg/dL, high anion gap, ketonuria, osmolality 320, HbA1c 9%. ECG: atrial fibrillation, ST depression, flat T waves, prominent U waves."
        question: What is the unifying diagnosis?
        options: ["DKA with severe hypokalemic paralysis in undiagnosed T2DM", "Guillain-Barré syndrome after an infection", "Thyrotoxic periodic paralysis with low K", "Myasthenic crisis"]
        answer: 0
        why: Ketoacidosis with K 1.3 and the classic electrocardiogram (ECG); thyroid, creatine phosphokinase and imaging were normal.
      - question: What about insulin?
        options: [Withhold it until potassium is corrected, Start 0.1 units/kg/h at once, Give an insulin bolus, Use s.c. insulin only]
        answer: 0
        why: Insulin shifts K into cells; it was withheld until K was corrected (the discussion says >3.3 mEq/L).
      - question: What else was needed urgently?
        options: ["ICU, intubation and ventilation, plus IV KCl and antibiotics", "Plasmapheresis for presumed Guillain-Barré", "IV immunoglobulin for 5 days", "Pyridostigmine for a myasthenic crisis"]
        answer: 0
        why: Pending respiratory failure needed ventilation; slow IV potassium chloride and a broad-spectrum antibiotic were started at once.
    src: { page: 207, quote: "Due to severe hypokalemia, treatment with insulin had to be withheld temporarily till her serum potassium levels were corrected." }
    status: unverified
    tags: [high-yield]
  - id: dm.L16.029
    kind: card
    topic: hypokalemia
    front: What is the most common manifestation of hypokalemia, and what can severe hypokalemia cause?
    back: "Most common: mild lower-limb weakness and easy fatigability. Severe: marked weakness up to total paralysis with respiratory, cranial and bulbar involvement, and fatal arrhythmias."
    src: { page: 207, quote: "Discussion\n  1. The clinical features of hypokalemia may vary with involvement of neuromuscular, CV & GIT systems, the most common manifestation being mild weakness of lower extremities & easy fatigability.\n  2. Patients with more severe hypokalemia may complain of marked weakness of skeletal muscles & in extreme cases, total paralysis involving respiratory, cranial & bulbar muscles has been reported with fatal outcome.\n  3. Deaths due to cardiac arrhythmia can also occur.\n  4. The coexistence of hypokalemia with metabolic acidosis is encountered in very few conditions, including proximal & distal renal tubular acidosis, DKA, amphotericin toxicity & acetazolamide overdose." }
    status: unverified
  - id: dm.L16.030
    kind: enumerate
    topic: hypokalemia
    prompt: In which conditions do hypokalemia and metabolic acidosis coexist?
    points:
      - Proximal renal tubular acidosis
      - Distal renal tubular acidosis
      - DKA
      - Amphotericin toxicity
      - Acetazolamide overdose
    pass: 4
    hook: "بوتاسيوم واطي مع حموضة: «2 RTA، DKA، و2 أدوية» = proximal RTA، distal RTA، DKA، amphotericin toxicity، وacetazolamide overdose."
    src: { page: 207, quote: "Discussion\n  1. The clinical features of hypokalemia may vary with involvement of neuromuscular, CV & GIT systems, the most common manifestation being mild weakness of lower extremities & easy fatigability.\n  2. Patients with more severe hypokalemia may complain of marked weakness of skeletal muscles & in extreme cases, total paralysis involving respiratory, cranial & bulbar muscles has been reported with fatal outcome.\n  3. Deaths due to cardiac arrhythmia can also occur.\n  4. The coexistence of hypokalemia with metabolic acidosis is encountered in very few conditions, including proximal & distal renal tubular acidosis, DKA, amphotericin toxicity & acetazolamide overdose." }
    status: unverified
    tags: [high-yield]
  - id: dm.L16.031
    kind: card
    topic: hypokalemia
    front: What is the most characteristic electrolyte abnormality of DKA, and how does it arise?
    back: Loss of total body potassium. K shifts out of cells in exchange for H+ in acidosis and is lost in urine by osmotic diuresis.
    src: { page: 208, quote: "5. The most characteristic abnormality associated with DKA is loss of total body potassium.\n6. Potassium loss is caused by a shift of K+ from the intracellular to the extracellular space in the exchange with H+ ions, which accumulate extracellularly in acidosis, and are then lost in urine because of osmotic diuresis." }
    status: unverified
    tags: [high-yield]
  - id: dm.L16.032
    kind: cloze
    topic: hypokalemia
    text: Total body potassium in DKA may fall by {{c1::300-600 mEq}}, yet serum K stays near normal or high because of the {{c2::extracellular shift}} from acidemia.
    src: { page: 208, quote: "Despite depletion of total body K+ stores to the range of 300-600 mEq, serum levels are maintained in the near normal or higher range, mainly due to the extra cellular shift of K+ owing to acidemia" }
    status: unverified
    tags: [numbers]
  - id: dm.L16.033
    kind: card
    topic: hypokalemia
    front: When does serum potassium fall precipitously in DKA?
    back: When insulin and volume replacement start, so K must be monitored and replaced carefully.
    src: { page: 208, quote: "Serum K+ levels can fall precipitously upon the initiation of insulin treatment & volume replacement, & hence, great caution must be exercised in monitoring serum K+ levels with adequate replacement during the course of treatment for DKA." }
