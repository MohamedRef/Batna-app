items:
  # ---------------------------------------------------------------- process
  - id: res.L03.001
    kind: card
    topic: process
    front: What is the first step in any research project?
    back: To clearly define the research question.
    src: { page: 8, quote: "Creating a good Research question: The first step in any research project is to clearly define the research question" }
    status: unverified
    tags: [definition]
  - id: res.L03.002
    kind: card
    topic: process
    front: Define a research question.
    back: >-
      A clear and concise question that expresses what the research project aims to address or answer.
      It defines the area of interest, and it leads to the study justification (rationale).
    src: { page: 9, quote: "What is the research question?\n\"A research question is a clear and concise question which expresses: \"what the research project aims to address/answer\" (defines the area of interest)\"\n→ Study Justification/Rationale" }
    status: unverified
    tags: [definition, high-yield]
  - id: res.L03.003
    kind: enumerate
    topic: process
    prompt: What three things does the research question do for a study?
    points:
      - Focuses the study
      - Determines the methodology
      - Guides all stages of inquiry, data analysis and reporting
    pass: 3
    hook: "سؤال البحث بيعمل 3 «يركّز، يختار، يقود»: focuses the study، determines the methodology، وguides كل المراحل (inquiry، data analysis، reporting)."
    src: { page: 10, quote: "Research Question: It focuses the study, determines the methodology and guides all stages of inquiry, data analysis, and reporting.\nMethodology:\n  variables\n  types of study\n  data collection techniques\n  sampling\n  plan for data collection\n  plan for data processing and analysis\n  ethical considerations\n  pre-test or pilot study" }
    status: unverified
    tags: [high-yield]
  - id: res.L03.004
    kind: enumerate
    topic: process
    prompt: What drives health research? (Where do research ideas come from?)
    points: [Curiosity-driven, Needs-driven, Profit-driven, Opportunity-driven]
    pass: 4
    hook: "فكرة البحث جاية منين؟ 4 «دوافع»: فضول، احتياج، فلوس، وفرصة = Curiosity، Needs، Profit، وOpportunity-driven."
    src: { page: 5, quote: "What drives health research? Where do research ideas come from?\n  Curiosity-driven\n  Needs-driven\n  Profit-driven\n  Opportunity-driven" }
    status: unverified
  - id: res.L03.005
    kind: order
    topic: process
    prompt: Order the steps of developing a research proposal, as in the lecture's framework.
    steps:
      - Selection, analysis and statement of the research problem
      - Literature review
      - Formulation of research objectives
      - Research methodology
      - Work plan
      - Budget
      - Plan for project administration and utilisation of results
      - Proposal summary
    src: { page: 3, quote: "How will the research proposal be developed?\n| Questions you must ask | Steps you will take | Important elements of each step |\n|---|---|---|\n| What is the problem and why should it be studied? | Selection, analysis and statement of the research problem | problem identification; prioritising problems; analysis; justification |\n| What information is available? | Literature review | literature and other available information |\n| Why do we want to carry out the research? What do we hope to achieve? | Formulation of research objectives | general and specific objectives; hypotheses |\n| What additional data do we need to meet our research objectives? How are we going to collect this information? | Research methodology | variables; types of study; data collection techniques; sampling; plan for data collection; plan for data processing and analysis; ethical considerations; pre-test or pilot study |\n| Who will do what, and when? | Work plan | human resources; timetable |\n| What resources do we need to carry out the study? What resources do we have? | Budget | material support and equipment; money |\n| How will the project be administered? How will utilisation of results be ensured? | Plan for project administration and utilisation of results | administration; monitoring; identification of potential users |\n| How will we present our proposal to relevant authorities, community and the funding agencies? | Proposal summary | briefing sessions and lobbying |" }
    status: unverified
    tags: [high-yield]
  - id: res.L03.006
    kind: mcq
    topic: process
    stem: >-
      In the research proposal framework, which step holds the general and specific objectives and the
      hypotheses?
    options:
      - Selection, analysis and statement of the research problem
      - Formulation of research objectives
      - Research methodology
      - Work plan
    answer: 1
    why:
      - "This step holds problem identification, prioritising problems, analysis and justification."
      - "Formulation of research objectives: general and specific objectives, and hypotheses."
      - "Methodology holds variables, types of study, data collection, sampling, analysis plan, ethics and the pilot study."
      - "The work plan holds human resources and the timetable."
    src: { page: 3, quote: "How will the research proposal be developed?\n| Questions you must ask | Steps you will take | Important elements of each step |\n|---|---|---|\n| What is the problem and why should it be studied? | Selection, analysis and statement of the research problem | problem identification; prioritising problems; analysis; justification |\n| What information is available? | Literature review | literature and other available information |\n| Why do we want to carry out the research? What do we hope to achieve? | Formulation of research objectives | general and specific objectives; hypotheses |\n| What additional data do we need to meet our research objectives? How are we going to collect this information? | Research methodology | variables; types of study; data collection techniques; sampling; plan for data collection; plan for data processing and analysis; ethical considerations; pre-test or pilot study |\n| Who will do what, and when? | Work plan | human resources; timetable |\n| What resources do we need to carry out the study? What resources do we have? | Budget | material support and equipment; money |\n| How will the project be administered? How will utilisation of results be ensured? | Plan for project administration and utilisation of results | administration; monitoring; identification of potential users |\n| How will we present our proposal to relevant authorities, community and the funding agencies? | Proposal summary | briefing sessions and lobbying |" }
    status: unverified
