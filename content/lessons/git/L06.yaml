  - id: git.L06.lesson5
    title: "الـ biopsy، وإزاي الـ UC والـ Crohn بيبانوا تحت الميكروسكوب"
    hook: "سؤال الكتاب: اكتب الـ histopathology بتاع الـ UC. وجرانيولوما واحدة بتقول Crohn، بس غيابها ما بيقولش حاجة."
    minutes: 9
    pages: [215, 224]
    topics: [histology]
    goals:
      - "تعرف بروتوكول الـ biopsy وليه"
      - "تكتب الـ histopathology of UC كإجابة كاملة (سؤال كتاب)"
      - "تفرّق الـ Crohn تحت الميكروسكوب وتفهم الـ healing"
    status: unverified
    steps:
      - kind: explain
        page: 215
        title: "الـ biopsy: إزاي وليه"
        quote: "The biopsies should be two biopsies from each 5 segments of the colon including the terminal ileum and rectum."
        text: |
          الـ histopathology مهمة لـ: **diagnosis**، **disease activity**، واكتشاف **early dysplasia and neoplasia**.

          البروتوكول: ==two biopsies from each of 5 segments==، ومنهم الـ **terminal ileum** والـ **rectum**.

          التفسير المقبول (مش في الكتاب): ليه من كل الـ segments حتى السليمة؟ لأن الـ UC والـ Crohn بيفترقوا في التوزيع: التهاب في حتة وحتة سليمة جنبها بيلمّح لـ Crohn، فلازم عينات من كل مكان علشان ترسم الخريطة.
      - kind: figure
        page: 224
        quote: "Figure 10: Histopathological findings in patients with UC:"
        title: "الطبيعي ضد الـ UC"
        image: { file: git/L06-uc-histology-diagram.webp, book: true }
        alt: "Diagram of normal colon crypts with goblet cells beside UC crypts that are distorted, lose goblet cells and contain crypt abscesses; a bracket shows UC affects the mucosal layer only. Below, two H&E panels: regular crypts versus distorted inflamed crypts."
        caption: "Figure 10 (histopathological findings in UC): في الـ UC الـ crypts **distorted** وفيها **crypt abscess**، والـ goblet cells بتقل، وكل ده في الـ **mucosal layer only**."
      - kind: order
        page: 216
        quote: "Widespread mucosal or crypt architectural distortion, mucosal atrophy, and an irregular or villous mucosal surface, with active inflammation causing cryptitis and crypt abscesses. Figure 5 Histological mucosal healing is characterized by the resolution of crypt architectural distortion and inflammatory infiltrate. However, the mucosa can still show some features of sustained damage, such as decreased crypt density with branching and atrophy of crypts."
        prompt: "رتّب الـ histology من الأول للأشد للشفا:"
        steps:
          - "Basal plasmacytosis (early)"
          - "Crypt architectural distortion and mucosal atrophy"
          - "Cryptitis and crypt abscesses (active severe disease)"
          - "Healing: distortion and infiltrate resolve"
        why: "الكتاب: early = **basal plasmacytosis**، الأشد = distortion و atrophy و villous surface مع **cryptitis و crypt abscesses**، والـ healing = resolution بس ممكن يفضل crypt density قليل و branching."
      - kind: mnemonic
        page: 216
        quote: "Widespread mucosal or crypt architectural distortion, mucosal atrophy, and an irregular or villous mucosal surface, with active inflammation causing cryptitis and crypt abscesses. Figure 5 Histological mucosal healing is characterized by the resolution of crypt architectural distortion and inflammatory infiltrate. However, the mucosa can still show some features of sustained damage, such as decreased crypt density with branching and atrophy of crypts."
        word: "BAD CV"
        parts:
          - { key: "B", text: "Basal plasmacytosis: the earliest sign" }
          - { key: "A", text: "Atrophy of the mucosa" }
          - { key: "D", text: "Distortion of crypt architecture" }
          - { key: "C", text: "Cryptitis and crypt abscesses" }
          - { key: "V", text: "Villous or irregular mucosal surface" }
        hook: "الـ UC تحت الميكروسكوب عنده **BAD CV**: سيرة ذاتية وحشة. اكتب الخمسة بالترتيب ده، وزوّد في الآخر الـ healing: الـ distortion والـ infiltrate بيروحوا، بس ممكن يفضل crypt density قليل مع branching."
      - kind: explain
        page: 216
        quote: "Histological mucosal healing is characterized by the resolution of crypt"
        title: "الـ healing تحت الميكروسكوب: الندبة بتفضل"
        text: |
          الكتاب: الـ ==histological mucosal healing== معناه إن الـ **crypt architectural distortion** والـ **inflammatory infiltrate** اختفوا. بس الـ mucosa ممكن تفضل فيها علامات **sustained damage**: crypt density أقل، و **branching** و **atrophy** للـ crypts.

          التفسير المقبول (مش في الكتاب): ده زي جرح اتقفل بس سايب ندبة: الالتهاب النشط (الـ neutrophils والـ crypt abscesses) راح، بس الشكل اللي اتغيّر ما رجعش 100%. وده مهم عمليًا لأن الـ crypt distortion هو اللي بيفرّق الـ UC المزمن عن الـ infectious colitis (اللي الـ crypts فيه بتفضل منتظمة)، فحتى biopsy مريض في remission ممكن تبيّن إنه كان عنده UC.
      - kind: explain
        page: 220
        title: "والـ Crohn تحت الميكروسكوب؟"
        quote: "Figure 5: Microscopic findings in Crohn's disease. The inflammatory infiltrate in Crohn's disease is patchy, often transmural and can lead to fissuring ulcers (marked by arrow). H&E), ×200 (A). Granulomas seen in relation to ruptured crypts are termed cryptolytic granulomas (marked by arrows) and are not specific for a diagnosis of CD. granulomas is a hallmark of Crohn's disease."
        text: |
          - ==Granulomas==: **pathognomonic** للـ Crohn، بس غيابها ما ينفيش.
          - الـ infiltrate **patchy** و **transmural**، وممكن **fissuring ulcers**.
          - الـ granulomas اللي جنب crypt مفتوحة (**cryptolytic**) مش specific.
          - **pyloric gland metaplasia** في الـ terminal ileum = التهاب قديم.

          التفسير المقبول (مش في الكتاب): ليه غياب الـ granuloma ما ينفيش؟ لأنه بيظهر في نسبة بس من المرضى وفي حتت صغيرة، والـ biopsy بتاخد ملّي واحد من الحيطة، فسهل تفوّته.
      - kind: check
        page: 216
        quote: "Granulomas (pathognomonic in CD but its absence doesn't exclude the diagnosis)."
        question: "Colonic biopsies of a suspected Crohn patient show no granulomas. What does that mean?"
        options:
          - "Crohn is still possible: absent granulomas do not exclude it"
          - "Crohn is excluded"
          - "It must be UC"
          - "Repeat with only one biopsy from the rectum"
        answer: 0
        why:
          - "صح: الكتاب قالها صريحة."
          - "الغياب ما ينفيش."
          - "مش لازم، الـ diagnosis clinical وبالمجموع."
          - "البروتوكول اتنين من كل segment من الخمسة، مش واحدة."
      - kind: reveal
        page: 220
        quote: "crypts are termed cryptolytic granulomas (marked by arrows) and are not"
        prompt: "الـ pathologist كتب «granuloma جنب crypt مكسور». ده Crohn أكيد؟"
        answer: |
          الكتاب (Figure 5): الـ granulomas اللي **بتظهر جنب crypts مكسورة** اسمها ==cryptolytic granulomas== و **not specific** للـ Crohn. أما الـ **histiocytic non-caseating granuloma** فهو hallmark للـ Crohn، وممكن يبقى vaguely defined وصعب يتلاقي. والـ infiltrate في الـ Crohn **patchy** وغالبًا **transmural** وممكن يعمل **fissuring ulcers**، والـ **pyloric gland metaplasia** في الـ terminal ileum علامة على التهاب مزمن طويل.

          التفسير المقبول (مش في الكتاب): لما الـ crypt يتكسر، الـ mucin اللي جواه بيتسرّب في النسيج، والجسم بيتعامل معاه كجسم غريب ويعمل حواليه granuloma. ده بيحصل في أي colitis شديد، حتى الـ UC. فالـ granuloma اللي بيقول Crohn هو اللي **بعيد** عن crypt مكسور، ومش caseating (علشان تستبعد الـ TB).
      - kind: try
        items: [git.L06.103, git.L06.104, git.L06.106, git.L06.109, git.L06.135]
    recap:
      - "Biopsy: اتنين من كل segment من الخمسة، منهم الـ terminal ileum والـ rectum؛ للتشخيص والـ activity والـ dysplasia."
      - "Early: basal plasmacytosis. Severe: crypt distortion، atrophy، villous surface، cryptitis و crypt abscesses (**BAD CV**)؛ الـ healing: الالتهاب يروح والـ crypts تفضل أقل ومتفرعة."
      - "Crohn: patchy transmural، fissuring ulcers، non-caseating granuloma (pathognomonic، وغيابه ما ينفيش)؛ الـ cryptolytic granuloma مش specific."
