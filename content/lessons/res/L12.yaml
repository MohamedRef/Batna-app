schema: batna.lesson/v1
lecture: res.L12
lessons:
  - id: res.L12.lesson1
    title: "النتيجة صح؟ وتنفع تتعمم؟ الـ internal والـ external validity"
    hook: "عملت بحث على 200 عيان في الميري وطلعت نتيجة حلوة. هل هي «الحقيقة»؟ وهل تنفع لكل مصر؟ سؤالين مختلفين خالص."
    minutes: 8
    pages: [2, 7]
    topics: [validity]
    goals:
      - "تفرّق بين الـ internal والـ external validity"
      - "تعدّ اللي بيهدد كل واحدة فيهم"
      - "تعرف الـ bias والـ confounding مكانهم فين في الحكاية"
    status: unverified
    steps:
      - kind: explain
        page: 2
        quote: "Research Process\nResearch question\nHypothesis\nIdentify research design\nData collection\nPresentation of data\nData analysis\nInterpretation of data"
        title: "إحنا فين في الـ research process؟"
        text: "المحاضرة دي عن حاجتين بيبوّظوا أي بحث: ==bias== و==confounders==.\n\nخطوات البحث من الأول: research question ← hypothesis ← research design ← data collection ← presentation، وبعدين **data analysis** و**interpretation** (المرحلتين البرتقاني في الشريحة).\n\nالـ bias بيدخل من التصميم وجمع الداتا، والـ confounding بنمسكه في التصميم **أو** في الـ analysis. هنشوف ده بالتفصيل."
      - kind: figure
        page: 3
        quote: "Population\nSample\n1. draw sample\n2. generalize back"
        title: "Sample ← population ← generalize back"
        alt: "A large box labelled target population at the top and a smaller box labelled study sample below it. A downward arrow labelled 1 draw sample; an upward arrow labelled 2 generalize back. Inside the sample box a tick reads internal validity: true inside the sample; beside the upward arrow a tick reads external validity: true for the population."
        caption: "بنسحب **sample** وبنرجع **نعمّم**. الـ **internal validity** = النتيجة صح جوّه الـ study population. الـ **external validity** = ينفع نرجّعها للـ target population."
        svg: "<svg viewBox=\"0 0 330 210\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs><marker id=\"L12a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"fg-head\"/></marker><marker id=\"L12b\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"fg-head-acc\"/></marker></defs>\n  <rect x=\"60\" y=\"8\" width=\"210\" height=\"50\" rx=\"8\" class=\"fg-box\"/>\n  <text x=\"165\" y=\"30\" text-anchor=\"middle\" class=\"t-b\">Target population</text>\n  <text x=\"165\" y=\"48\" text-anchor=\"middle\" class=\"t-sm t-mut\">all Egyptian nurses</text>\n  <rect x=\"95\" y=\"130\" width=\"140\" height=\"70\" rx=\"8\" class=\"fg-acc\"/>\n  <text x=\"165\" y=\"152\" text-anchor=\"middle\" class=\"t-b\">Study sample</text>\n  <text x=\"165\" y=\"172\" text-anchor=\"middle\" class=\"t-sm\">internal validity:</text>\n  <text x=\"165\" y=\"188\" text-anchor=\"middle\" class=\"t-sm\">true inside the sample?</text>\n  <path d=\"M110 60L110 126\" class=\"fg-arrow\" marker-end=\"url(#L12a)\"/>\n  <text x=\"104\" y=\"98\" text-anchor=\"end\" class=\"t-sm\">1 draw sample</text>\n  <path d=\"M220 128L220 62\" class=\"fg-arrow-acc\" marker-end=\"url(#L12b)\"/>\n  <text x=\"226\" y=\"88\" class=\"t-sm t-acc\">2 generalize back</text>\n  <text x=\"226\" y=\"104\" class=\"t-sm t-acc\">= external validity</text>\n</svg>"
      - kind: explain
        page: 4
        quote: "What is meant by?\nExternal validity of the research\nIt Refers to the extent to which the study results for the study population can be\nGeneralized to the whole target population."
        title: "1. External validity = ينفع يتعمم؟"
        text: "==External validity== = لأي درجة نتيجة الـ **study population** تنفع **تتعمم على الـ target population كلها**.\n\nمثال: درست الـ insomnia في ممرضات مستشفى في إسكندرية. لو النتيجة متنفعش لكل ممرضات مصر، يبقى الـ external validity ضعيفة."
      - kind: explain
        page: 5
        quote: "What is meant by?\nInternal validity of the research\nIt Refers to the extent to which the study results obtained\nReflect the 'truth' in the study population.\nThe relationship between dependent and independent variables"
        title: "2. Internal validity = النتيجة دي حقيقية؟"
        text: "==Internal validity== = لأي درجة النتيجة اللي طلعت **بتعكس «الحقيقة» جوّه الـ study population**.\n\nيعني العلاقة اللي شفناها بين الـ **dependent** (الـ outcome) والـ **independent** (الـ exposure) variables علاقة حقيقية، مش من غلطة في الاختيار ولا القياس ولا متغير تالت."
      - kind: check
        page: 5
        quote: "What is meant by?\nInternal validity of the research\nIt Refers to the extent to which the study results obtained\nReflect the 'truth' in the study population.\nThe relationship between dependent and independent variables"
        question: "A study's results truly reflect the relation in the nurses studied, but cannot be applied to all Egyptian nurses. This study has:"
        options:
          - "Good internal, poor external validity"
          - "Good external, poor internal validity"
          - "Poor internal and external validity"
          - "Good internal and external validity"
        answer: 0
        why:
          - "صح: الحقيقة جوّه العينة موجودة (internal)، بس التعميم لأ (external)."
          - "بالعكس: النتيجة صح جوّه، والتعميم هو المشكلة."
          - "الـ internal كويسة لأن النتيجة بتعكس الحقيقة جوّه."
          - "التعميم مش نافع، فالـ external ضعيفة."
      - kind: explain
        page: 6
        quote: "Threats to External validity:\n1. Selecting a convenient sample\n2. Participants characteristics (affects both internal and external validity)\n3. Timing of the research\n4. Setting of conducting the research"
        title: "اللي بيهدد الـ external validity: 4"
        text: "- **Selecting a convenient sample**: أخدت اللي قدامك (عيانين العيادة بتاعتك) بدل sample ممثلة.\n- **Participants characteristics**: وده ==بيأثر على الاتنين== internal وexternal.\n- **Timing of the research**: درست الإسهال في الصيف، النتيجة مش هتنفع للشتا.\n- **Setting**: مستشفى جامعي غير وحدة صحية في قرية."
        remind: [res.L12.005]
      - kind: explain
        page: 7
        quote: "Threats to internal validity:\n1. Potential confounding variables\n2. Bias (systematic errors)\n3. Pretest/post test design"
        title: "اللي بيهدد الـ internal validity: 3"
        text: "1. **Potential confounding variables**: متغير تالت بيلخبط العلاقة.\n2. ==Bias (systematic errors)==: غلط ثابت في اتجاه واحد.\n3. **Pretest/post test design**: نفس الـ questionnaire قبل وبعد التدخّل. الدكتورة شرحت إن الإجابة التانية ممكن تتأثر بإن الناس **فاكرة الأسئلة**، مش بأثر التدخّل بس."
        remind: [res.L12.006]
      - kind: check
        page: 6
        quote: "Threats to External validity:\n1. Selecting a convenient sample\n2. Participants characteristics (affects both internal and external validity)\n3. Timing of the research\n4. Setting of conducting the research"
        question: "Which threat affects both internal and external validity?"
        options:
          - "Participants characteristics"
          - "Timing of the research"
          - "Setting of the research"
          - "A convenient sample"
        answer: 0
        why:
          - "صح: الشريحة كاتباها جنبها بين قوسين."
          - "ده تهديد للـ external بس."
          - "ده تهديد للـ external بس."
          - "ده تهديد للـ external (التعميم)."
      - kind: aside
        page: 7
        quote: "Threats to internal validity:\n1. Potential confounding variables\n2. Bias (systematic errors)\n3. Pretest/post test design"
        tone: analogy
        text: "الـ **internal validity** زي إن الميزان يوزن صح جوّه العيادة. الـ **external validity** إن نفس الوزن ينفع يتقال على الناس اللي برّه العيادة.\n\nميزان بايظ (bias) يخلّي الاتنين يقعوا، لأن مفيش حاجة صح أصلًا تتعمم."
      - kind: try
        items: [res.L12.002, res.L12.003, res.L12.005, res.L12.006]
    recap:
      - "External validity = تعميم النتيجة على الـ target population."
      - "Internal validity = النتيجة بتعكس الحقيقة جوّه الـ study population."
      - "تهديدات الـ external: convenient sample، participants characteristics، timing، setting."
      - "تهديدات الـ internal: confounding، bias، pretest/post test design."
    practice:
      - res.L12.001
      - res.L12.002
      - res.L12.003
      - res.L12.004
      - res.L12.005
      - res.L12.006
      - res.L12.007
      - res.L12.008
      - res.L12.009
  - id: res.L12.lesson2
    title: "المتغير التالت: الـ confounder"
    hook: "اللي بيشربوا قهوة كتير عندهم lung cancer أكتر. القهوة السبب؟ ولا السجاير اللي معاها؟"
    minutes: 9
    pages: [8, 13]
    topics: [confounding]
    goals:
      - "تعرّف الـ confounding variable"
      - "تحفظ الـ 4 شروط بتوعه"
      - "تطلّعه في مثال الـ Down syndrome ومثال الـ beta carotene"
    status: unverified
    steps:
      - kind: explain
        page: 8
        quote: "1. Potential Confounding variables\nIs a factor (a variable ) causes distortion of the relationship between the outcome and the exposure of interest :\nMight alter the strength of an apparent relationship between the two variables (e.g. Incorrect odds ratio or relative risk)\nMight lead to incorrect association between E&D or disappearance of a real association between E&D."
        title: "الـ confounder بيعمل إيه؟"
        text: "==Confounding variable== = عامل (variable) بيعمل **distortion** للعلاقة بين الـ **outcome** والـ **exposure** اللي بندرسه.\n\nممكن:\n- **يغيّر قوة العلاقة**: odds ratio أو relative risk غلط.\n- **يخترع علاقة** مش موجودة بين الـ E والـ D (exposure وdisease).\n- **يخفي علاقة حقيقية** موجودة."
        remind: [res.L12.013]
      - kind: figure
        page: 11
        quote: "Confounding\nExposure\nOutcome\nThird variable\nConfounding variable"
        title: "المثلث: exposure، outcome، والمتغير التالت"
        alt: "A triangle. Top left exposure, top right outcome, with a dark arrow from exposure to outcome marked with a question mark. Below in the middle the confounding variable, with a double-headed arrow to exposure labelled associated and a single arrow to outcome labelled causes. A dashed note says it is not on the path between them."
        caption: "الـ **confounder** مربوط بالـ **exposure** وبيسبب الـ **outcome**، ومش واقع على الطريق بينهم. فالسهم اللي فوق ممكن يكون كله منه."
        svg: "<svg viewBox=\"0 0 330 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs><marker id=\"L12c\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"fg-head\"/></marker><marker id=\"L12d\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"fg-head-bad\"/></marker><marker id=\"L12e\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"fg-head-acc\"/></marker></defs>\n  <rect x=\"8\" y=\"14\" width=\"110\" height=\"36\" rx=\"6\" class=\"fg-box\"/>\n  <text x=\"63\" y=\"37\" text-anchor=\"middle\" class=\"t-b\">Exposure</text>\n  <rect x=\"212\" y=\"14\" width=\"110\" height=\"36\" rx=\"6\" class=\"fg-box\"/>\n  <text x=\"267\" y=\"37\" text-anchor=\"middle\" class=\"t-b\">Outcome</text>\n  <path d=\"M120 32L208 32\" class=\"fg-arrow\" marker-end=\"url(#L12c)\"/>\n  <text x=\"165\" y=\"24\" text-anchor=\"middle\" class=\"t-lg t-b\">?</text>\n  <rect x=\"95\" y=\"130\" width=\"140\" height=\"44\" rx=\"8\" class=\"fg-bad\"/>\n  <text x=\"165\" y=\"150\" text-anchor=\"middle\" class=\"t-b\">Third variable</text>\n  <text x=\"165\" y=\"166\" text-anchor=\"middle\" class=\"t-sm\">(confounder)</text>\n  <path d=\"M110 128L70 56\" class=\"fg-arrow-acc\" marker-end=\"url(#L12e)\" marker-start=\"url(#L12e)\"/>\n  <text x=\"60\" y=\"100\" text-anchor=\"middle\" class=\"t-sm t-acc\">associated</text>\n  <path d=\"M220 128L262 56\" class=\"fg-arrow-bad\" marker-end=\"url(#L12d)\"/>\n  <text x=\"275\" y=\"100\" text-anchor=\"middle\" class=\"t-sm t-bad\">causes</text>\n  <text x=\"165\" y=\"196\" text-anchor=\"middle\" class=\"t-sm t-mut\">not on the exposure → outcome path</text>\n</svg>"
      - kind: mnemonic
        page: 9
        quote: "1. Potential Confounding variables\nIt is associated with the outcome variable.\nIt is related to the exposure variable.\nIt does not lie in the chain of sequence between the exposure and outcome variable.\nIt is \"differentially\" distributed in the two groups."
        word: "CODE"
        parts:
          - { key: "C", text: "Connected to the outcome: associated with the outcome variable." }
          - { key: "O", text: "Of the exposure too: related to the exposure variable." }
          - key: "D"
            text: "Detour, not the road: does not lie in the chain of sequence between exposure and outcome."
          - { key: "E", text: "Even? No: differentially (unequally) distributed in the two groups." }
        hook: "الـ confounder عنده **CODE** من 4: مرتبط بالـ outcome، ومرتبط بالـ exposure، مش في الـ chain بينهم، وdifferentially distributed."
        remind: [res.L12.011]
      - kind: check
        page: 9
        quote: "1. Potential Confounding variables\nIt is associated with the outcome variable.\nIt is related to the exposure variable.\nIt does not lie in the chain of sequence between the exposure and outcome variable.\nIt is \"differentially\" distributed in the two groups."
        question: "A variable is caused by the exposure and in turn causes the outcome. It is:"
        options:
          - "Not a confounder: it lies in the chain between exposure and outcome"
          - "A confounder, as it is linked to both"
          - "A confounder only if equally distributed"
          - "A confounder only in case-control studies"
        answer: 0
        why:
          - "صح: ده جزء من الطريق نفسه (الشرط التالت)."
          - "الارتباط بالاتنين مش كفاية لو هو على الطريق."
          - "لازم يكون differentially distributed، مش متساوي."
          - "الشروط واحدة في كل الـ designs."
      - kind: explain
        page: 12
        quote: "Confounding factor\nBirth Order\nDown Syndrome\nMaternal Age\nMaternal age is correlated with birth order as usually high gravidity is associated with advanced maternal age\nadvanced maternal age is a known risk factor even if birth order is low\nIf the proportion of those with advanced age is more among cases (with Down syndrome) this leads to distortion of the relation between birth order and Down syndrome"
        title: "مثال 1: birth order والـ Down syndrome"
        text: "العلاقة اللي بندرسها: **birth order** (الطفل رقم كام) ← **Down syndrome**.\n\nبس **maternal age**:\n- مربوط بالـ birth order: الـ **high gravidity** بتيجي مع سن أكبر.\n- و**risk factor معروف** للـ Down syndrome حتى لو الـ birth order قليل.\n\nلو نسبة الأمهات الكبار **أعلى في الـ cases**، العلاقة بين الـ birth order والـ Down syndrome هتتشوّه. يبقى ==maternal age== هو الـ confounder."
      - kind: case
        page: 13
        quote: "Confounding\nBeta carotene intake\nlung cancer\nTobacco smoking\nBecause people who are less health conscious are more likely to smoke as well as to neglect dietary recommendations.\nIf a greater percentage of people smoke in the low beta carotene intake group than in the high beta carotene intake group\nThen smoking will confound the association between beta carotene intake and lung cancer"
        stem: "دراسة بتقول إن اللي بياكلوا beta carotene قليل عندهم lung cancer أكتر."
        steps:
          - question: "Which third variable could explain this?"
            options: ["Tobacco smoking", "Age at diagnosis", "Body weight", "Family history of diabetes"]
            answer: 0
            why: "التدخين مربوط بقلة الـ beta carotene وبيسبب الـ lung cancer."
          - question: "Why are smokers likely to eat less beta carotene?"
            options:
              - "People less health conscious smoke and neglect dietary advice"
              - "Smoking destroys beta carotene in food"
              - "Beta carotene causes smoking"
              - "No reason; it is chance"
            answer: 0
            why: "نفس الشخصية «مش واخد باله من صحته» بتدخّن وبتهمل الأكل."
          - question: "When does smoking confound the association?"
            options:
              - "When more people smoke in the low beta carotene group than in the high group"
              - "When smoking is equal in both groups"
              - "Only if beta carotene causes cancer"
              - "Never"
            answer: 0
            why: "الشرط الرابع: differentially distributed."
      - kind: explain
        page: 10
        quote: "% coronary artery narrowing\nSmoking\nAge\nSex\nLDL- C\nDM\nHTN\nUric acid\nObesity"
        title: "الدنيا مليانة confounders"
        text: "في الشريحة: عايزين نعرف علاقة **smoking** بـ **% coronary artery narrowing**. حواليهم 7 متغيرات كلها ممكن تلخبط العلاقة:\n\n- **Age** و**Sex**\n- **LDL-C**، **DM**، **HTN**\n- **Uric acid** و**Obesity**\n\nعشان كده لازم نفكّر فيهم **من الأول**، وده موضوع الدرس الجاي."
        remind: [res.L12.017]
      - kind: aside
        page: 13
        quote: "Then smoking will confound the association between beta carotene intake and lung cancer"
        tone: joke
        text: "لو عملت دراسة إن اللي بيلبسوا **ولاعة في جيبهم** عندهم lung cancer أكتر، متقولش إن الولاعة بتعمل cancer. 😄 دوّر على الـ **confounder** اللي في الجيب التاني: علبة السجاير."
      - kind: try
        items: [res.L12.010, res.L12.011, res.L12.013, res.L12.017]
    recap:
      - "الـ confounder بيشوّه العلاقة: يغيّر قوتها، يخترعها، أو يخفيها."
      - "CODE: مرتبط بالـ outcome، مرتبط بالـ exposure، مش في الطريق، differentially distributed."
      - "Maternal age يشوّه birth order ← Down syndrome."
      - "Smoking يشوّه beta carotene ← lung cancer."
    practice:
      - res.L12.010
      - res.L12.011
      - res.L12.012
      - res.L12.013
      - res.L12.014
      - res.L12.015
      - res.L12.016
      - res.L12.017
      - res.L12.018
  - id: res.L12.lesson3
    title: "نسيطر على الـ confounding إزاي؟ في التخطيط وفي التحليل"
    hook: "5 أدوات: 3 قبل ما تجمع الداتا، و2 بعد ما تجمعها. والسؤال المشهور: أنهي فيهم «the best»؟"
    minutes: 10
    pages: [14, 24]
    topics: [control]
    goals:
      - "ترتّب خطوات التحكم في الـ confounding"
      - "تفرّق بين أدوات الـ planning وأدوات الـ analysis"
      - "تعرف ثمن كل أداة"
    status: unverified
    steps:
      - kind: explain
        page: 14
        quote: "How do we control for confounding\nIdentify all potential confounding variables (PCV) right at the time when the research question is being developed. (literature review)\nCollect data about all possible confounders.\nOnce all PCV have been identified, action may be taken to control them either in planning stage or during analysis"
        title: "ابدأ قبل ما تجمع الداتا"
        text: "1. حدّد كل الـ ==potential confounding variables== (**PCV**) **وانت بتكتب الـ research question**، من الـ **literature review**.\n2. **اجمع داتا** عن كل الـ confounders المحتملة.\n3. بعدين اتحكم فيهم: في الـ **planning stage** أو أثناء الـ **analysis**.\n\nمتغير مجمعتش عنه داتا من الأول، مش هتعرف تظبطه بعدين."
      - kind: figure
        page: 15
        quote: "How do we control for confounding\nDuring planning :\n-Randomization (random allocation)\n-Restriction\n-Matching -\nDuring analysis :\n-by either \"Stratified Analysis\" or by \"Regression Analysis\""
        title: "خريطة الأدوات"
        alt: "A tree. Root: control of confounding. Left branch planning (design) with three leaves randomization, restriction, matching (pair or frequency). Right branch analysis with two leaves stratification and multivariate (regression) analysis. Stars mark randomization as best in planning and multivariate as best overall."
        caption: "**Planning**: randomization، restriction، matching. **Analysis**: stratification وmultivariate (regression). النجمة على الـ best في كل ناحية."
        svg: "<svg viewBox=\"0 0 330 220\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"85\" y=\"6\" width=\"160\" height=\"30\" rx=\"6\" class=\"fg-ink\"/>\n  <text x=\"165\" y=\"26\" text-anchor=\"middle\" class=\"t-b\">Control of confounding</text>\n  <path d=\"M130 36L70 64M200 36L260 64\" class=\"fg-arrow\"/>\n  <rect x=\"8\" y=\"64\" width=\"150\" height=\"28\" rx=\"6\" class=\"fg-acc\"/>\n  <text x=\"83\" y=\"83\" text-anchor=\"middle\" class=\"t-b\">Planning (design)</text>\n  <rect x=\"180\" y=\"64\" width=\"142\" height=\"28\" rx=\"6\" class=\"fg-good\"/>\n  <text x=\"251\" y=\"83\" text-anchor=\"middle\" class=\"t-b\">During analysis</text>\n  <rect x=\"8\" y=\"104\" width=\"150\" height=\"26\" rx=\"5\" class=\"fg-box\"/>\n  <text x=\"83\" y=\"122\" text-anchor=\"middle\" class=\"t-sm\">★ Randomization</text>\n  <rect x=\"8\" y=\"138\" width=\"150\" height=\"26\" rx=\"5\" class=\"fg-box\"/>\n  <text x=\"83\" y=\"156\" text-anchor=\"middle\" class=\"t-sm\">Restriction</text>\n  <rect x=\"8\" y=\"172\" width=\"150\" height=\"40\" rx=\"5\" class=\"fg-box\"/>\n  <text x=\"83\" y=\"189\" text-anchor=\"middle\" class=\"t-sm\">Matching</text>\n  <text x=\"83\" y=\"204\" text-anchor=\"middle\" class=\"t-sm t-mut\">pair or frequency</text>\n  <rect x=\"180\" y=\"104\" width=\"142\" height=\"26\" rx=\"5\" class=\"fg-box\"/>\n  <text x=\"251\" y=\"122\" text-anchor=\"middle\" class=\"t-sm\">Stratification</text>\n  <rect x=\"180\" y=\"138\" width=\"142\" height=\"40\" rx=\"5\" class=\"fg-box\"/>\n  <text x=\"251\" y=\"155\" text-anchor=\"middle\" class=\"t-sm\">★ Multivariate</text>\n  <text x=\"251\" y=\"170\" text-anchor=\"middle\" class=\"t-sm t-mut\">(regression) analysis</text>\n</svg>"
      - kind: explain
        page: 17
        quote: "1. Randomization\nThe best method to minimize the effect of confounders in planning phase\nAll study population will be randomly distributed into two groups, experimental group and control group\nIt help to distribute both known and unknown confounders equal in both groups"
        title: "1. Randomization: الملك في الـ planning"
        text: "==Randomization== (random allocation) = **the best method** في الـ **planning phase**.\n\nكل الـ study population بتتوزع **عشوائي** على experimental group وcontrol group، فـ **الـ confounders المعروفة والمجهولة** بيتوزعوا بالتساوي.\n\nدي الميزة اللي مفيش أداة تانية عندها: محدش يقدر يعمل restriction أو matching على حاجة **ميعرفهاش**."
        remind: [res.L07.030]
      - kind: explain
        page: 18
        quote: "2. Restriction (while designing the study)\n1. Restrict inclusion of subjects with certain confounders(e.g: smokers, alcoholics, obese, certain age group, females.......)\n2. Done while deciding the eligibility criteria (inclusion and exclusion criteria)\n3. Remember that you can't examine the effect of excluded variables on the outcome\n4. Too many restrictions will affect the generalizability of study results (generalize your results to subgroup of the population e.g non smokers)."
        title: "2. Restriction: اقفل الباب"
        text: "==Restriction== = تمنع دخول ناس عندهم confounder معيّن (smokers، alcoholics، obese، سن معيّن، females...).\n\n- بيتعمل وانت بتحدد الـ **eligibility criteria** (inclusion وexclusion).\n- **الثمن**: مش هتقدر تدرس تأثير المتغير اللي استبعدته على الـ outcome.\n- ولو قفلت كتير، النتيجة هتتعمم على **subgroup** بس (non-smokers مثلًا)، يعني الـ **generalizability** بتقل."
        remind: [res.L12.025]
      - kind: check
        page: 18
        quote: "2. Restriction (while designing the study)\n1. Restrict inclusion of subjects with certain confounders(e.g: smokers, alcoholics, obese, certain age group, females.......)\n2. Done while deciding the eligibility criteria (inclusion and exclusion criteria)\n3. Remember that you can't examine the effect of excluded variables on the outcome\n4. Too many restrictions will affect the generalizability of study results (generalize your results to subgroup of the population e.g non smokers)."
        question: "A trial enrols only non-smokers to remove smoking as a confounder. The cost is:"
        options:
          - "Smoking's effect can't be studied, and results apply only to non-smokers"
          - "Smoking will still confound"
          - "Unknown confounders become unequal"
          - "Randomization is no longer possible"
        answer: 0
        why:
          - "صح: ده الثمن اللي في الشريحة (نقطة 3 و4)."
          - "الـ restriction شالت التدخين كـ confounder."
          - "الـ restriction مبتلخبطش المجهول؛ ده شغل الـ randomization."
          - "ينفع تعمل الاتنين مع بعض."
      - kind: explain
        page: 19
        quote: "3. Matching\nIt is suitable in case control study\nIt ensures equal representation of subjects with known confounders in study groups (the groups could be made \"equal\" in respect of the confounder)\nMight need a long time to complete study sample.\nEither pair matching or frequency matching."
        title: "3. Matching: لكل case حد شبهه"
        text: "==Matching== مناسب في الـ **case control study**:\n- بيضمن إن الـ **known confounders** ممثلين بالتساوي في المجموعتين.\n- **عيبه**: ممكن ياخد **وقت طويل** لحد ما تكمّل الـ sample.\n- نوعين:\n  - **Pair matching**: «one for one»: لكل case، control شبهه في الـ confounder.\n  - **Group (frequency) matching**: توازن **النسب**. لو 25 من 100 case ستات 40–50 سنة بيستخدموا tobacco، تختار 25 control ستات أصحاء 40–50 سنة بيستخدموا tobacco."
        remind: [res.L12.029]
      - kind: match
        page: 20
        quote: "a. Pair matching\nThis method in which we match \"one for one\" (i.e. for every subject or case, we take a control who is similar to that case in respect of the confounding variable"
        prompt: "وصّل كل موقف بالأداة:"
        pairs: [["One control of the same age and sex for each case", "Pair matching"], ["25 of 100 cases are women 40-50 who use tobacco, so 25 such controls", "Frequency matching"], ["Only non-smokers are eligible", "Restriction"], ["Subjects split by chance into two arms", "Randomization"]]
        why: "Pair = واحد قصاد واحد. Frequency = نفس النسب. Restriction = منع. Randomization = قرعة."
      - kind: explain
        page: 23
        quote: "1. Stratification\nDivide up the subjects into different categories (strata) of the possible confounders. Calculate the measure of risk for each stratum as well as the overall one.\nIf sex is might be a confounder: Calculate the overall risk in the study group the calculate the risk among males and that among females. If the are widely different, then sex act as a potential confounder."
        title: "في الـ analysis: 1. Stratification"
        text: "==Stratification== = تقسّم الناس **strata** حسب الـ confounder المحتمل، وتحسب الـ **measure of risk** لكل stratum وكمان الـ overall.\n\nمثال: شاكك في الـ **sex**؟ احسب الـ risk الكلي، وبعدين في الـ males لوحدهم والـ females لوحدهم. لو **مختلفين جدًا**، يبقى sex ==potential confounder==."
      - kind: explain
        page: 24
        quote: "2. Multivariate analysis:\nComputer software has permitted the adjustment of associations simultaneously for a number of potential confounders\nExamine the simultaneous effect of many independent variables over one dependent variable\nIs the best way to control for the effect of confounding factors"
        title: "2. Multivariate analysis: الأقوى"
        text: "==Multivariate analysis== = الكمبيوتر بيظبط العلاقة **لكذا confounder في نفس الوقت**: بيدرس تأثير independent variables كتير مع بعض على **dependent variable واحد**.\n\nوالشريحة بتقول إنه **the best way to control for the effect of confounding factors**."
      - kind: aside
