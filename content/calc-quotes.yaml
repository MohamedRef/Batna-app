  - calculator: saag
    lecture: hb.L09
    page: 150
    quote: |-
      Serum-ascites albumin gradient (SAAG)
        SAAG is calculated as "serum albumin concentration - ascites albumin concentration (g/dl)".
        It can help differentiate between ascites ascribed to portal hypertension and ascites due to other causes.
        If SAAG is ≥ 1.1 g/dl (High SAAG), ascites is most likely due to portal hypertension while SAAG is < 1.1 g/dl (Low SAAG) suggests non- portal hypertension ascites.
  - calculator: ascitic_pmn
    lecture: hb.L09
    page: 167
    quote: |-
      Diagnosis
        Diagnostic paracentesis for SBP should be performed in all hospitalized patients with cirrhosis and ascites and in patients who deteriorate clinically.
        SBP is diagnosed by an elevated absolute polymorphonuclear leukocyte (PMN) count ≥250 cells/mm3 in the ascitic fluid (neutrocytic ascites) with or without a positive ascitic fluid culture.
        Ascitic fluid protein is < 1 g/dl.
        Ascitic fluid culture is usually monomicrobial and is mainly Gram-negative bacteria (Escherichia coli and Klebsiella pneumoniae). Less commonly, Gram-positive bacteria; Streptococcus spp, Staphylococcus spp, and Enterococci are isolated.
        Combining the results of the ascitic fluid PMN count and the ascitic fluid culture yields the following variants of SBP:
  - calculator: ascitic_pmn
    lecture: hb.L09
    page: 168
    quote: |-
      a) Culture-positive neutrocytic ascites.
      b) Culture-negative neutrocytic ascites (TB peritonitis, peritoneal carcinomatosis, and spontaneous fungal peritonitis must also be considered).
      c) Bacterascites "monomicrobial, nonneutrocytic ascites" (PMN count <250/mm3 but positive culture for a single organism). It may represent a transient and spontaneously reversible SBP (resolving SBP) or the first step in the development of SBP (evolving SBP).
      Other diagnostic tests
        Leukocyte esterase dipstick to detect elevated PMN count are also useful for rapid diagnosis of SBP (100% sensitivity) at the bedside.
        Ascitic procalcitonin and calprotectin have been studied for the diagnosis of SBP.
      Secondary bacterial peritonitis
        Secondary bacterial peritonitis is likely to be associated with an infection of ascitic fluid from an intra-abdominal surgically-treatable source such as an abscess or GI tract perforation.
        Compared with SBP, secondary bacterial peritonitis should be suspected if: ascitic fluid total protein concentration is >1.5 g/dL, ascitic fluid PMN is >5,000 cells/mm3, ascitic culture is polymicrobial, and there is a failure of ascitic fluid PMN count to fall after 48 h of antibiotic therapy.
        Other characteristics of secondary bacterial peritonitis are ascitic fluid glucose concentration <50 mg/l and ascitic LDH concentration > serum LDH levels.
  - calculator: kings_college
    lecture: hb.L10
    page: 187
    quote: |-
      King's College Criteria:
        Acute liver failure due to Wilson disease or Budd-Chari syndrome.
        Acetaminophen-induced ALF if either of the following are met:
          Arterial pH <7.3 after resuscitation and 24 hour after ingestion.
          Serum lactate >3 mmol/L.
          All 3 of the following: INR >6.5, serum creatinine >300 µmol/L (>3.4 mg/dL), hepatic encephalopathy stage 3 or 4.
        Non acetaminophen-induced ALF if either of the following are met:
          INR >6.5.
          Any 3 of the following: INR >3.5, serum bilirubin >300 µmol/L (>17.5 mg/dL), interval from jaundice to hepatic encephalopathy >7 days, age <10 years or >40 years, indeterminate etiology or drug- induced hepatotoxicity.
