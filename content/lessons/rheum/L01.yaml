          - ["Wound repair", "TGF-β"]
        hide: [[1, 1], [2, 1], [4, 1]]
      - kind: explain
        page: 6
        quote: "Regulation of cellular proliferation and differentiation (IL-2)."
        title: "ليه كل وظيفة ليها المثال ده؟"
        text: |
          الكتاب بيدّي مثال واحد أو اتنين لكل وظيفة. افتكرهم بالمنطق، والتفسير المقبول (مش في الكتاب) هنا مربوط بالجدول اللي جاي:

          - **Immunity (IL-2 و IL-4)**: IL-2 بيكبّر الـ T cells (cellular)، و IL-4 بيوجّه للـ Th2 والـ antibodies (humoral). واحد لكل ناحية.
          - **Inflammation (IL-1 و IL-6 و TNF-α)**: التلاتة بيكلموا الـ hypothalamus والكبد، فبيطلّعوا fever والـ acute phase proteins.
          - **Hematopoiesis (GM-CSF)**: الاسم نفسه بيقول: colony-stimulating factor للـ granulocytes والـ macrophages.
          - **Proliferation (IL-2)**: نفس IL-2، عشان شغلته الأساسية إنه يخلّي الـ T cell ==تتكاثر==.
          - **Wound repair (TGF-β)**: هو "الفرامل" اللي بتوقف الالتهاب، وبعد الالتهاب بييجي الإصلاح.
      - kind: aside
        tone: exam
        page: 6
        quote: "Induction of inflammatory response (IL-1, IL-6 and TNF-a)."
        text: "التلاتي IL-1 و IL-6 و TNF-α هم «تلاتي الحرارة والـ acute phase». هتقابلهم في كل محاضرة روماتيزم: C-reactive protein (CRP) عالي = غالبًا IL-6 شغال."
      - kind: explain
        page: 6
        quote: "Cytokines released from these cells activate an entire network of interacting cells in the immune response."
        title: "الشبكة بتبدأ منين؟"
        text: |
          الكتاب بيرسم البداية في سطرين:
          1. الـ **antigen** بيقابل الـ ==macrophage==.
          2. بعدها الـ **resting Th cells** بتتنشّط.
          3. الـ cytokines اللي بتخرج من الاتنين بتشغّل **network كاملة** من الخلايا.

          ليه البداية من الـ macrophage؟ التفسير المقبول (مش في الكتاب): الـ macrophage بياكل الميكروب ويعرض أجزاء منه للـ Th cell، فهو اللي بيصحّي الـ Th. ولما الـ Th يصحى، يبدأ يوزّع الأوامر. عشان كده أي خلل في الخطوة الأولى بيأثر على كل اللي بعدها.
