items:
  # ---------- p131: intro ----------
  - id: geri.L08.001
    kind: enumerate
    topic: intro
    prompt: Why are musculoskeletal disorders so debilitating in elderly people?
    points:
      - Pain
      - Mobility disorders
      - Increased risk of falls and fractures
      - Impaired ability to perform activities of daily living
    pass: 3
    src: { page: 131, quote: "they are associated with pain, mobility disorders, increased risk of falls and fractures, and impaired ability to perform activities of daily living." }
    status: unverified
  - id: geri.L08.002
    kind: card
    topic: intro
    front: What is the pathological triad of inter-related musculoskeletal disorders in the elderly?
    back: Sarcopenia, tendinopathies and arthritis.
    src: { page: 131, quote: "main ―components‖: sarcopenia, tendinopathies, and arthritis." }
    status: unverified
    tags: [high-yield]
  # ---------- p131-134: sarcopenia ----------
  - id: geri.L08.003
    kind: card
    topic: sarcopenia
    front: Define sarcopenia.
    back: Loss of skeletal muscle mass and function, either with ageing (primary) or due to an underlying disease or medication (secondary).
    src: { page: 131, quote: "Sarcopenia is the loss of skeletal muscle mass and function that occurs during the aging process (primary sarcopenia)" }
    status: unverified
    tags: [high-yield]
  - id: geri.L08.004
    kind: table
    topic: sarcopenia
    title: Primary versus secondary sarcopenia
    columns: [Type, Cause, Approach]
    rows:
      - [Primary, "The ageing process", "More challenging to characterize"]
      - [Secondary, "Underlying disease or medication", "Diagnose and treat the underlying cause"]
    blanks: [[0, 1], [1, 1], [1, 2]]
    src: { page: 131, quote: "While secondary sarcopenia relies on the diagnosis and treatment for the underlying causation, primary sarcopenia has been more challenging to characterize." }
    status: unverified
  - id: geri.L08.005
    kind: card
    topic: sarcopenia
    front: How does the European Working Group on Sarcopenia in Older People (EWGSOP) describe sarcopenia?
    back: A syndrome of progressive and generalized loss of skeletal muscle mass and strength, with a risk of adverse outcomes such as physical disability, poor quality of life and death.
    src: { page: 132, quote: "syndrome characterized by progressive and generalized loss of skeletal muscle mass and strength with a risk of adverse outcomes" }
    status: unverified
  - id: geri.L08.006
    kind: cloze
    topic: sarcopenia
    text: "From the second to the eighth decade, whole body and appendicular lean mass fall by about {{c1::20%}} in men and {{c2::30%}} in women."
    src: { page: 132, quote: "whole body and appendicular lean mass decline by about 20% in men and 30% in women." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L08.007
    kind: card
    topic: sarcopenia
    front: Who is sarcopenia most prevalent in?
    back: Older adults, especially women; it varies with age and geographic area.
    src: { page: 132, quote: "Sarcopenia, therefore, is prevalent in older adults, especially women, and presents substantial variations depending on age and geographic area." }
    status: unverified
  - id: geri.L08.008
    kind: table
    topic: sarcopenia
    title: Sarcopenia, what each finding means
    columns: [Finding, Meaning]
    rows:
      - [Low muscle strength, "Key characteristic: probable sarcopenia"]
      - [Low muscle quantity or quality, "Confirms the diagnosis"]
      - [Low physical performance, "Predicts adverse outcomes: grades severity"]
      - [All three present, "Severe sarcopenia"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 132, quote: "Low muscle strength is identified as a key characteristic and a primary indicator of probable sarcopenia." }
    status: unverified
    tags: [high-yield]
  - id: geri.L08.009
    kind: cloze
    topic: sarcopenia
    text: "Sarcopenia is considered {{c1::severe}} when low muscle {{c2::strength}}, low muscle quantity or quality, and low {{c3::physical performance}} are all detected."
    src: { page: 132, quote: "when low muscle strength, low muscle quantity/quality, and low physical performance are all detected, sarcopenia is considered to be severe." }
    status: unverified
  - id: geri.L08.010
    kind: enumerate
    topic: sarcopenia
    prompt: What qualities should a sarcopenia screening tool have?
    points: [High sensitivity, Widely available, User-friendly, Efficient, Non-invasive, Cheap]
    pass: 4
    src: { page: 132, quote: "Tools used for screening require high sensitivity and should be widely available, user-friendly, efficient, non-invasive and cheap." }
    status: unverified
  - id: geri.L08.011
    kind: enumerate
    topic: sarcopenia
    prompt: Enumerate the screening tools for sarcopenia.
    points:
      - SARC-F questionnaire
      - Mid-arm muscle circumference (MAMC)
      - Calf circumference (CC)
      - Hand grip strength
      - Gait speed
    pass: 4
    src: { page: 132, quote: "specifically the SARC-F questionnaire, mid-arm muscle circumference (MAMC), calf circumference (CC), hand grip strength and gait speed." }
    status: unverified
    tags: [high-yield]
  - id: geri.L08.012
    kind: card
    topic: sarcopenia
    front: Which combination of screening tools is recommended for sarcopenia?
    back: SARC-F with calf circumference or MAMC, combined with hand-grip strength or gait speed (Ishii group and EWGSOP); combining tools raises sensitivity.
    src: { page: 133, quote: "CC or MAMC and in combination with hand-grip strength or gait speed is recommended." }
    status: unverified
    tags: [high-yield]
  - id: geri.L08.013
    kind: enumerate
    topic: sarcopenia
    prompt: List the five SARC-F domains.
    points:
      - "Strength: lifting and carrying 10 pounds"
      - "Assistance in walking: walking across a room"
      - "Rise from a chair: transferring from a chair or bed"
      - "Climb stairs: a flight of 10 stairs"
      - "Falls: number in the past year"
    pass: 5
    src: { page: 133, quote: "Strength: How much difficulty do you have in lifting and carrying 10 pounds?" }
    status: unverified
    tags: [high-yield]
  - id: geri.L08.014
    kind: cloze
    topic: sarcopenia
    text: "SARC-F: each of 5 items scores 0 (none), 1 (some) or {{c1::2}} (a lot or unable); a score of {{c2::4}} or more best predicts the need for further, more comprehensive evaluation."
    src: { page: 134, quote: "Data suggests that a SARC-F score of .4 best predicts the need for further, more comprehensive evaluation." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L08.015
    kind: cloze
    topic: sarcopenia
    text: "SARC-F strength asks about lifting and carrying {{c1::10 pounds}}; the stairs item asks about climbing a flight of {{c2::10 stairs}}."
    src: { page: 133, quote: "Climb stairs: How much difficulty do you have climbing a flight of 10 stairs?" }
    status: unverified
    tags: [numbers]
  - id: geri.L08.016
    kind: card
    topic: sarcopenia
    front: "SARC-F falls item: how many falls in the past year score 2?"
    back: 4 or more falls score 2; fewer falls score 1 and none scores 0.
    src: { page: 133, quote: "Falls: How many times have you fallen in the past year?" }
    status: unverified
  - id: geri.L08.017
    kind: card
    topic: sarcopenia
    front: In which studies was SARC-F shown valid for detecting people at risk from sarcopenia?
    back: AAH, BLSA and NHANES; it was internally consistent and valid.
    src: { page: 134, quote: "The SARC-F proved internally consistent and valid for detecting persons at risk for adverse outcomes from sarcopenia" }
    status: unverified
  - id: geri.L08.018
    kind: case
    topic: sarcopenia
    stem: A 79-year-old woman says she has some difficulty carrying a 10-pound shopping bag, some difficulty getting out of a chair, cannot climb a flight of 10 stairs, walks across a room without trouble, and fell 5 times last year.
    steps:
      - question: What is her SARC-F score?
        options: ["6", "4", "5", "3"]
        answer: 0
        why: "Strength some = 1, walking none = 0, chair some = 1, stairs unable = 2, falls 4 or more = 2. Total 6 (p133)."
      - question: What does this score mean?
        options: [Needs further comprehensive evaluation, Sarcopenia is excluded, Severe sarcopenia is confirmed, Only repeat in 5 years]
        answer: 0
        why: "A SARC-F of 4 or more best predicts the need for further evaluation (p134). It is a screen; it does not confirm or grade sarcopenia."
      - reveal: Her grip strength is low.
        question: What does low muscle strength indicate?
        options: [Probable sarcopenia, Confirmed severe sarcopenia, Normal ageing, Frozen shoulder]
        answer: 0
        why: "Low strength is the key characteristic and primary indicator of probable sarcopenia; low muscle quantity or quality confirms it (p132)."
      - question: What is the primary treatment?
        options: [Resistance exercise with or without nutrition, An approved anti-sarcopenia drug, Testosterone for every patient, Bed rest]
        answer: 0
        why: "Physical exercise, especially high-intensity resistance training, alone or with nutrition is the primary treatment. No drug is approved (p134-135)."
    src: { page: 134, quote: "Data suggests that a SARC-F score of .4 best predicts the need for further, more comprehensive evaluation." }
    status: unverified
  - id: geri.L08.019
    kind: enumerate
    topic: sarc-mx
    prompt: Enumerate the mechanisms of sarcopenia.
    points:
      - Malnutrition
      - Physical inactivity
      - Hormonal changes
      - Inflammation
      - Increased catabolism and anabolic resistance
      - Myocyte loss
      - Reduced satellite cell number and function
      - Loss of α-motor neurons
      - Mitochondrial dysfunction
      - Insulin resistance
    pass: 7
    src: { page: 134, quote: "These include malnutrition, physical inactivity, hormonal changes, inflammation, increased catabolism, and anabolic resistance, myocyte's loss" }
    status: unverified
    tags: [high-yield]
  - id: geri.L08.020
    kind: card
    topic: sarc-mx
    front: Which two mechanisms of sarcopenia have received particular attention recently?
    back: Inflammation and mitochondrial dysfunction.
    src: { page: 134, quote: "In recent years, inflammation and mitochondrial dysfunction received particular attention as a major determinant of sarcopenia." }
    status: unverified
  - id: geri.L08.021
    kind: card
    topic: sarc-mx
    front: Primary treatment of sarcopenia?
    back: Physical exercise, alone or with nutritional interventions; high-intensity resistance training most notably improves muscle strength and mass.
    src: { page: 134, quote: "physical exercise, most notably high-intensity resistance training, improves the strength and mass of skeletal muscles" }
    status: unverified
    tags: [high-yield]
  - id: geri.L08.022
    kind: card
    topic: sarc-mx
    front: Are any drugs approved for sarcopenia?
    back: No drug has been approved yet.
    src: { page: 135, quote: "no drugs have been approved yet for the treatment of sarcopenia." }
    status: unverified
    tags: [high-yield]
  - id: geri.L08.023
    kind: cloze
    topic: sarc-mx
    text: "An umbrella review found only {{c1::vitamin D}} (especially in older women) and {{c2::testosterone}} (in older men with low testosterone and muscle weakness) justified for sarcopenia in daily practice."
    src: { page: 135, quote: "only vitamin D, especially in older women, and testosterone in older men with low testosterone levels and muscle weakness can be justified" }
    status: unverified
    tags: [high-yield]
  - id: geri.L08.024
    kind: mcq
    topic: sarc-mx
    stem: An 81-year-old man with confirmed sarcopenia asks what will help most. His testosterone level is normal. What do you recommend first?
    options:
      - High-intensity resistance training with nutritional support
      - Testosterone replacement
      - A licensed anti-sarcopenia drug
      - Complete rest to save energy
      - Calf circumference monitoring alone
    answer: 0
    why:
      - "Correct: exercise, notably high-intensity resistance training, with or without nutrition is the primary treatment (p134)."
      - Testosterone is justified only in older men with low testosterone and weakness (p135).
      - No drug has been approved for sarcopenia (p135).
      - Inactivity is one of the mechanisms of sarcopenia.
      - Calf circumference is a screening tool, not a treatment.
    src: { page: 134, quote: "Physical exercise, alone or in combination with nutritional interventions, is the non-pharmacological approach currently recommended as the primary treatment of sarcopenia." }
    status: unverified
  # ---------- p135-136: tendinopathy ----------
  - id: geri.L08.025
    kind: card
    topic: tendinopathy
    front: Define tendinopathy clinically.
    back: Tendon pain during activity, tendon swelling, localized tenderness on palpation, and loss of function.
    src: { page: 135, quote: "Tendinopathy is a musculoskeletal disorder characterized by tendon pain during an activity, tendon swelling and localized tenderness upon palpation, and loss of function." }
    status: unverified
  - id: geri.L08.026
    kind: enumerate
    topic: tendinopathy
    prompt: Light microscopy findings in pathological tendons?
    points:
      - Collagen degeneration
      - Increased mucoid ground substance
      - Increased tenocytes with myofibroblastic differentiation (tendon repair cells)
    pass: 3
    src: { page: 135, quote: "showed collagen degeneration, increased mucoid ground substance, and increased tenocytes with myofibroblastic differentiation" }
    status: unverified
  - id: geri.L08.027
    kind: card
    topic: tendinopathy
    front: What is the widely accepted concept for the origin of tendinopathy?
    back: Excessive tensile loads within the tendon over time; a rapid rise in load magnitude, duration or frequency can exceed local tensile strength and cause micro-injury.
    src: { page: 135, quote: "the generation of excessive tensile loads within the tendon over time." }
    status: unverified
  - id: geri.L08.028
    kind: enumerate
    topic: tendinopathy
    prompt: Which kinds of stress can lead to tendon weakening and degeneration over time?
    points:
      - Excessive tensile stress
      - Excessive compressive stress
      - Stress-shielding (too little local stress, understimulating tendon cells)
    pass: 3
    src: { page: 135, quote: "not only excessive tensile stress, but also excessive compressive stress as well as ―stress-shielding‖" }
    status: unverified
  - id: geri.L08.029
    kind: card
    topic: tendinopathy
    front: What is "stress-shielding" in tendons?
    back: Lack of adequate local stress, which understimulates the tendon cells and can lead to weakening and degeneration.
    src: { page: 135, quote: "the lack of adequate local stress producing understimulation of the tendon cells" }
    status: unverified
  - id: geri.L08.030
    kind: card
    topic: tendinopathy
    front: In tendons under force, which layers deform more?
    back: Deeper tissue layers deform more than superficial ones (non-uniform displacement).
    src: { page: 135, quote: "with deeper tissue layers deforming more than superficial ones." }
    status: unverified
  - id: geri.L08.031
    kind: order
    topic: tendinopathy
    prompt: Put the steps to calcific tendinopathy in order.
    steps:
      - High tendon compression
      - Tissue hypoxia
      - Fibrocartilaginous metaplasia of tenocytes into chondrocyte-like cells
      - Calcium deposits (mainly hydroxyapatite)
      - Calcific tendinopathy
    src: { page: 136, quote: "High levels of tendon compression and the associated tissue hypoxia stimulate the fibrocartilaginous metaplasia of tenocytes" }
    status: unverified
  - id: geri.L08.032
    kind: cloze
    topic: tendinopathy
    text: "In calcific tendinopathy, chondrocyte-like cells produce calcium deposits, predominantly {{c1::hydroxyapatite}}."
    src: { page: 136, quote: "to produce calcium deposits (predominantly hydroxyapatite). The clinical sequela is a condition known as calcific tendinopathy." }
    status: unverified
  - id: geri.L08.033
    kind: enumerate
    topic: tendinopathy
    prompt: Individual risk factors for tendinopathy?
    points: [Genes, Age, Sex, Biomechanics, Body composition, Obesity and its illnesses, Systemic diseases]
    pass: 5
    src: { page: 136, quote: "The individual factors that should be considered are genes, age, sex, biomechanics, and body composition." }
    status: unverified
  - id: geri.L08.034
    kind: card
    topic: tendinopathy
    front: Which extrinsic factor relates to lower limb versus upper limb tendinopathies?
    back: Lower limb tendinopathies relate strongly to weight bearing; upper limb tendon injuries occur with overload movements.
    src: { page: 136, quote: "while weight bearing is highly related to lower limbs tendinopathies, upper limbs tendons injuries can be observed in overload movements." }
    status: unverified
  # ---------- p136: clinical ----------
  - id: geri.L08.035
    kind: enumerate
    topic: tendon-clinic
    prompt: Core clinical characteristics of rotator cuff degenerative tendinopathy?
    points: [Old age, Focal night pain, Weakness of shoulder muscles, Movement restriction]
    pass: 4
    src: { page: 136, quote: "Core clinical characteristics of rotator cuff degenerative tendinopathy include old age, focal night pain, weakness of shoulder muscles, and movement restriction." }
    status: unverified
    tags: [high-yield]
  - id: geri.L08.036
    kind: card
    topic: tendon-clinic
    front: Where does rotator cuff shoulder pain radiate?
    back: To the deltoid and the middle part of the upper arm.
    src: { page: 136, quote: "Shoulder pain generally radiates to the deltoid and the middle part of the upper arm." }
    status: unverified
  - id: geri.L08.037
    kind: cloze
    topic: tendon-clinic
    text: "Weakness or movement restriction, especially in active {{c1::external rotation}}, is found in {{c2::half}} of radiologically confirmed rotator cuff tears."
    src: { page: 136, quote: "especially in active external rotation, are found in half of radiologically confirmed rotator cuff tears." }
    status: unverified
  - id: geri.L08.038
    kind: table
    topic: tendon-clinic
    title: Rotator cuff tendinopathy versus frozen shoulder
    columns: [Feature, Rotator cuff tendinopathy, Frozen shoulder]
    rows:
      - [Nature, "Degenerative tendon disease of old age", "Idiopathic, self-limiting (adhesive capsulitis)"]
      - [Restricted movement, "Active, especially active external rotation", "Both active and passive external rotation"]
      - [Clue, "Night pain, weakness", "Passive movement also lost"]
    blanks: [[0, 2], [1, 1], [1, 2]]
    src: { page: 136, quote: "Frozen shoulder is an idiopathic and self-limiting condition in which movement of the shoulder becomes restricted in both active and passive external rotation." }
    status: unverified
    tags: [high-yield]
  - id: geri.L08.039
    kind: mcq
    topic: tendon-clinic
    stem: A 72-year-old woman has 4 months of shoulder pain. She cannot externally rotate her arm actively, and the examiner also cannot rotate it passively. Most likely diagnosis?
    options:
      - Frozen shoulder (adhesive capsulitis)
      - Rotator cuff degenerative tendinopathy
      - Gluteal tendinopathy
      - Polymyalgia rheumatica
      - Calcific tendinopathy of the Achilles
    answer: 0
    why:
      - "Correct: frozen shoulder restricts both active and passive external rotation (p136)."
      - Rotator cuff disease restricts active movement; passive range is kept.
      - Gluteal tendinopathy causes lateral hip pain.
      - PMR is bilateral girdle stiffness, not a single restricted shoulder.
      - Achilles disease is in the leg.
    src: { page: 136, quote: "Movement testing helps to distinguish rotator cuff degenerative tendinopathy from frozen shoulder (adhesive capsulitis)." }
    status: unverified
  - id: geri.L08.040
    kind: card
    topic: tendon-clinic
    front: Describe the pain of gluteal tendinopathy.
    back: Low-grade lateral hip pain, aggravated by walking and other weight-bearing activities and by lying on the affected side.
    src: { page: 136, quote: "This pain presents in the lateral hip and is aggravated with activities (such as walking and other weight-bearing activities) and side-lying on the affected side." }
    status: unverified
  - id: geri.L08.041
    kind: enumerate
    topic: tendon-clinic
    prompt: Core clinical characteristics of gluteal tendinopathy?
    points:
      - Old age
      - Female gender
      - Back or hip joint pain comorbidity
      - Overweight or obesity
      - Poor hip abductor function
      - Altered gait
      - Psychological distress
    pass: 5
    src: { page: 136, quote: "gluteal tendinopathy include old age, female gender, comorbidities such as pain generated from the back and hip joint, overweight/obesity" }
    status: unverified
  # ---------- p137-139: management, PRP ----------
  - id: geri.L08.042
    kind: enumerate
    topic: tendon-mx
    prompt: Which interventions have been studied for rotator cuff and gluteal tendinopathies?
    points:
      - Exercise
      - Corticosteroid or platelet-rich plasma injections
      - Radial pressure wave and focused shock wave therapy
      - Topical glyceryl nitrate
    pass: 3
    src: { page: 137, quote: "Studied interventions include exercise, interventional approaches (i.e., corticosteroid or platelet-rich plasma injections)" }
    status: unverified
  - id: geri.L08.043
    kind: card
    topic: tendon-mx
    front: First-line treatment of tendinopathy?
    back: Conservative treatment through exercise and load management, aided by other conservative options such as ESWT (extracorporeal shockwave therapy).
    src: { page: 137, quote: "conservative treatment through exercise and load management should be the first source of treatment" }
    status: unverified
    tags: [high-yield]
  - id: geri.L08.044
    kind: cloze
    topic: tendon-mx
    text: "Surgery for tendinopathy is a last resort, once conservative treatment has failed after {{c1::six to twelve months}}."
    src: { page: 137, quote: "Surgical approach should only be used as a last resource once the conservative options have failed after six to twelve months of treatment." }
    status: unverified
    tags: [numbers]
  - id: geri.L08.045
    kind: cloze
    topic: tendon-mx
    text: "Peritendinous corticosteroid injection gives {{c1::moderate}} pain relief in gluteal and rotator cuff tendinopathy, but only for less than {{c2::4 weeks}}."
    src: { page: 137, quote: "peritendinous corticosteroid injection provides moderate pain relief, but only for a short time (less than 4 weeks)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L08.046
    kind: card
    topic: tendon-mx
    front: Which treatment shows preliminary benefit in gluteal tendinopathy?
    back: Platelet-rich plasma (PRP) injections.
    src: { page: 137, quote: "platelet-rich plasma injections may also clinically benefit patients with gluteal tendinopathy." }
    status: unverified
  - id: geri.L08.047
    kind: order
    topic: tendon-mx
    prompt: Order the steps of a PRP injection.
    steps:
      - Take one to a few tubes of the patient's own blood
      - Spin it down in a centrifuge
      - Collect and concentrate the platelets 2 to 8 times
      - Mix the platelets into a plasma liquid base
      - Inject into the injured area, sometimes ultrasound-guided
    src: { page: 138, quote: "The platelets are collected and concentrated from 2 to 8 times their normal number." }
    status: unverified
  - id: geri.L08.048
    kind: card
    topic: tendon-mx
    front: How do PRP injections work?
    back: Activated concentrated platelets release growth factors that stimulate and increase reparative cells, enhancing natural healing.
    src: { page: 138, quote: "releases growth factors that stimulate and increase the number of reparative cells." }
    status: unverified
  - id: geri.L08.049
    kind: enumerate
    topic: tendon-mx
    prompt: Which injuries are PRP injections used for?
    points:
      - Minor rotator cuff tears
      - Achilles tendon tears
      - Tendonitis or chronic tendinosis such as tennis elbow
      - Golfer's elbow
    pass: 3
    src: { page: 138, quote: "PRPs injections are used primarily for soft tissue injuries" }
    status: unverified
  - id: geri.L08.050
    kind: card
    topic: tendon-mx
    front: Risks of PRP injections?
    back: A remote risk of infection, as with any injection; otherwise only the unpredictability of how well it works.
    src: { page: 139, quote: "As with any injection, there is a remote risk of infection." }
    status: unverified
  # ---------- p139-142: OA ----------
  - id: geri.L08.051
    kind: card
    topic: oa
    front: Define arthritis as used in the lecture.
    back: A disease of articular joints that alters them biochemically, structurally and physiologically; a heterogeneous degenerative disorder with many causes and presentations.
    src: { page: 139, quote: "Arthritis is a disease of articular joints that alters the joints biochemically, structurally, and physiologically." }
    status: unverified
  - id: geri.L08.052
    kind: table
    topic: oa
    title: Primary versus secondary arthritis
    columns: [Type, Cause, Typical joints]
    rows:
      - [Primary (idiopathic), "No specific or known antecedent", "Hands, hips, knees, spine"]
      - [Secondary, "Trauma, or rheumatologic, metabolic or infectious disease", "Depends on cause"]
    blanks: [[0, 2], [1, 1]]
    src: { page: 139, quote: "Primary or idiopathic arthritis is without a specific or known antecedent and primarily affects the hands, hips, knees, and spine." }
    status: unverified
  - id: geri.L08.053
    kind: cloze
    topic: oa
    text: "WHO: {{c1::10%}} of men and {{c2::20%}} of women over 60 have symptomatic osteoarthritis; {{c3::130 million}} people are expected to have it by 2050."
    src: { page: 139, quote: "the WHO states that 10% of men and 20% of women over the age of 60 have symptomatic osteoarthritis." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L08.054
    kind: card
    topic: oa
    front: How is OA now defined, given new pathophysiology?
    back: A complex multifactorial joint pathology caused by inflammatory and metabolic factors underlying joint damage, with low-grade chronic synovial inflammation central.
    src: { page: 139, quote: "a complex multifactorial joint pathology caused by inflammatory and metabolic factors underlying joint damage." }
    status: unverified
    tags: [high-yield]
  - id: geri.L08.055
    kind: card
    topic: oa
    front: Which immune mechanisms drive OA inflammation and tissue destruction?
