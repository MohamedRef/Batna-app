  - id: git.L04.lesson6
    title: "القولون: من البوليب للسرطان، ومين في خطر"
    hook: "تلات طرق للسرطان، وبوليب حجمه 2 سنتي نصه فيه كانسر. وعيلة كاملة ممكن تحتاج colectomy."
    minutes: 10
    pages: [168, 175]
    topics: [crc-epi, crc-risk, crc-hered]
    goals:
      - "تعرف الـ adenoma-carcinoma sequence والـ 3 pathways"
      - "تحفظ أرقام خطر الـ adenoma بالنوع والحجم والـ dysplasia"
      - "تفرّق بين FAP و Gardner و Turcot و Lynch I/II"
    status: unverified
    steps:
      - kind: explain
        page: 168
        quote: "Colorectal cancer is the second leading cause of cancer-related deaths after lung cancer 5-year survival rate : 55%."
        title: "ليه القولون مهم؟"
        text: |
          الـ **colorectal cancer** تاني سبب وفاة بالسرطان بعد الـ lung، والـ 5-year survival حوالي 55%.

          بس هو **preventable** و**highly curable if detected early**، عشان كده الـ ==screening== مهم.

          - نادر قبل 40، وبيزيد بسرعة عند 50.
          - عند التشخيص: 37% localized، 37% regional، 20% metastatic.
          - 75% **sporadic**، والباقي في الـ high risk: IBD، FAP، HNPCC، family history.
      - kind: explain
        page: 170
        quote: "Sequence-specific accumulation of genetic lesions that cause an imbalance between epithelial cell proliferation and cell death."
        title: "البوليب بيكبر إزاي؟"
        text: |
          الـ colonic polyps: **sessile** أو pedunculated. مهمين عشان بيعملوا rectal bleeding، ونادرًا obstruction، وممكن يبقوا malignant.

          - **Non-neoplastic**: hyperplastic، inflammatory، lymphoid، juvenile.
          - **Adenomatous**: شائعة خصوصًا في الكبار.

          الـ pathophysiology: **genetic lesions** بتتراكم بترتيب معين، فيحصل imbalance بين الـ ==proliferation== والـ **cell death**. الخلايا تتكوم على السطح وتفضل تنقسم، وتعمل adenoma.
      - kind: figure
        page: 171
        quote: "HNPCC 10-15% CRC"
        title: "تلات طرق لنفس النهاية"
        alt: "Three horizontal pathways. 1 chromosomal: APC mutation, LOH, K-ras mutation, chromosome 18 loss, p53 loss; FAP, about 70 to 80 percent of CRC. 2 mismatch repair: MMR failure, microsatellite instability, TGF beta IIR and BAX mutations; HNPCC, 10 to 15 percent. 3 inflammation: p53 loss, inflammation, dysplasia low to high, carcinoma. Below: normal epithelium, hyperproliferation, adenoma, carcinoma in situ, invasion and metastasis."
        caption: "الطريق الأول هو الـ adenoma-carcinoma sequence الكلاسيكي (APC → K-ras → 18 → p53). التاني الـ MMR/MSI بتاع Lynch. التالت بتاع الـ colitis."
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="G04p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="5" y="8" width="320" height="110" rx="8" class="fg-acc"/>
            <text x="15" y="28" class="t-b">1. Chromosomal (FAP, 70-80%)</text>
            <text x="15" y="54" class="t-sm">APC</text>
            <path d="M45 50h25" class="fg-arrow" marker-end="url(#G04p1)"/>
            <text x="75" y="54" class="t-sm">K-ras</text>
            <path d="M115 50h25" class="fg-arrow" marker-end="url(#G04p1)"/>
            <text x="145" y="54" class="t-sm">Chr 18 loss</text>
            <path d="M225 50h25" class="fg-arrow" marker-end="url(#G04p1)"/>
            <text x="255" y="54" class="t-sm">p53 loss</text>
            <text x="15" y="84" class="t-sm t-mut">normal → early adenoma →</text>
            <text x="15" y="102" class="t-sm t-mut">late adenoma → cancer</text>
            <rect x="5" y="128" width="320" height="90" rx="8" class="fg-box"/>
            <text x="15" y="148" class="t-b">2. Mismatch repair (HNPCC, 10-15%)</text>
            <text x="15" y="176" class="t-sm">MMR failure</text>
            <path d="M95 172h25" class="fg-arrow" marker-end="url(#G04p1)"/>
            <text x="125" y="176" class="t-sm">MSI</text>
            <path d="M155 172h25" class="fg-arrow" marker-end="url(#G04p1)"/>
            <text x="185" y="176" class="t-sm">TGF-beta IIR, BAX</text>
            <text x="15" y="204" class="t-sm t-mut">adenoma grows to cancer faster</text>
            <rect x="5" y="228" width="320" height="80" rx="8" class="fg-bad"/>
            <text x="15" y="248" class="t-b">3. Inflammation (colitis)</text>
            <text x="15" y="276" class="t-sm">p53 loss</text>
            <path d="M75 272h20" class="fg-arrow" marker-end="url(#G04p1)"/>
            <text x="100" y="276" class="t-sm">dysplasia low to high</text>
            <path d="M240 272h20" class="fg-arrow" marker-end="url(#G04p1)"/>
            <text x="265" y="276" class="t-sm">cancer</text>
            <text x="15" y="335" class="t-sm t-b">Morphology:</text>
            <text x="15" y="355" class="t-sm">normal → hyperproliferation (ACF) → adenoma</text>
            <text x="15" y="375" class="t-sm">→ carcinoma in situ → invasion, metastasis</text>
          </svg>
      - kind: order
        page: 171
        quote: "Chrom 18 loss"
        prompt: "رتّب الـ chromosomal pathway:"
        steps: ["APC mutation", "K-ras mutation", "Chromosome 18 loss", "p53 loss"]
        why: "الـ APC هو بوابة الدخول (gatekeeper)، وبعده K-ras، وبعدين chromosome 18، والـ p53 في الآخر هو اللي بيحوّل الـ late adenoma لـ cancer."
      - kind: sort
        page: 172
        quote: "HRT, ASA, NSAIDS, COX2 protective and in some cases cause regression of polyps."
        prompt: "ده بيزوّد خطر سرطان القولون ولا بيحمي؟"
        bins: ["Raises risk", "Protective"]
        cards:
          - { text: "Red and processed meat", bin: 0 }
          - { text: "Grilling meat at high temperature", bin: 0 }
          - { text: "Type 2 diabetes", bin: 0 }
          - { text: "Heavy alcohol", bin: 0 }
          - { text: "Folate", bin: 1 }
          - { text: "Calcium supplements", bin: 1 }
          - { text: "Aspirin and NSAIDs", bin: 1 }
          - { text: "HRT", bin: 1 }
        why: "الـ folate بيحمي (نقصه مرتبط بـ K-ras mutations)، والكالسيوم بيقلل adenomas جديدة، والـ ASA/NSAIDs/COX2 و HRT بيحموا وأحيانًا البوليب يرجع. أما الـ fiber: مش مثبت لسه."
      - kind: table
        page: 172
        quote: "Tubulovillous, villous(most in rectum) have most increased risk of cancer (20% and 40% respectively.)"
        title: "Adenomas: النوع والخطر"
        columns: ["Type", "Share", "Cancer risk"]
        rows:
          - ["Tubular", "75-87%", "Lowest"]
          - ["Tubulovillous", "8-15%", "20%"]
          - ["Villous (mostly rectal)", "5-10%", "40%"]
          - ["Any adenoma over 2 cm", "-", "46%"]
          - ["Severe dysplasia", "-", "34%"]
        hide: [[1, 2], [2, 2], [3, 2], [4, 2]]
      - kind: mnemonic
        page: 172
        quote: "Size, degree of dysplasia (46% cancer >2cm, 34% in severe dysplasia)."
        word: "SVD"
        parts:
          - { key: "S", text: "Size: over 2 cm = 46% cancer" }
          - { key: "V", text: "Villous: 40% (tubulovillous 20%)" }
          - { key: "D", text: "Dysplasia: severe = 34%" }
        hook: |
          البوليب الخطير **SVD**: كبير، villous، و dysplastic. وده بالظبط سؤال الكتاب: "All of the above".
      - kind: explain
        page: 173
        quote: "Colectomy indicated for residual carcinoma, those at high risk for +LN despite complete polypectomy."
        title: "شلت البوليب وطلع فيه سرطان"
        text: |
          - العلاج: endoscopic removal، و**surveillance every three years**. لو مش هينفع يتشال: biopsy، والـ large sessile villous: جراحة.
          - **Contraindications to polypectomy**: fungation، ulceration، distortion.
          - ==Colectomy== لو: residual carcinoma، أو high risk للـ nodes: **+margin**، poor differentiation، vascular أو lymphatic invasion.
          - والـ **sessile polyp with invasive cancer** يتعمله resection حتى من غير الـ features دي.
      - kind: explain
        page: 173
        quote: "Without intervention, the lifetime risk of CRC approaches 100% by age 40."
        title: "FAP"
        text: |
          - **APC** point mutation على chromosome **5q21**، و1-2% من الـ colon cancer.
          - ==hundreds to thousands== of polyps من سن 10-12، في كل الـ GI tract بس أغلبها في القولون.
          - من غير تدخل: الخطر قرب ==100% by age 40==. والوقاية القياسية: **surgery**.
          - ممكن spontaneous، فمش لازم يكون في family history.
          - **Attenuated FAP**: أقل من 100 polyp وسن أكبر، بس الخطر لسه عالي. والـ **MAP** (MUTYH) شبهه.
      - kind: match
        page: 174
        quote: "Gardner’s Syndrome: Variant of FAP. Colonic and extracolonic manifestations."
        prompt: "وصّل كل syndrome بعلامته:"
        pairs:
          - ["Gardner syndrome", "Mandible osteoma, teeth, sebaceous cysts, desmoids"]
          - ["Turcot syndrome", "Brain tumor"]
          - ["Lynch I", "Colon only"]
          - ["Lynch II", "Also endometrium, ovary, stomach, urinary tract"]
          - ["Attenuated FAP", "Fewer than 100 polyps, later onset"]
        why: "Gardner و Turcot variants للـ FAP. Lynch nonpolyposis: I للقولون بس، II فيه كمان endometrium، ovary، stomach، small bowel، biliary، pancreas، ureter، renal pelvis."
      - kind: explain
        page: 174
        quote: "85% lifetime risk of colon cancer, more right sided cancers (60-70%), earlier (45y), lower stage, better survival"
        title: "Lynch: الأرقام"
        text: |
          - **Lynch I و II** أكتر من FAP بخمس مرات، و1-5% من الـ colon cancers.
          - **85% lifetime risk**، ==right sided== (60-70%)، earlier (حوالي 45 سنة).
          - lower stage و better survival، بس 20% risk لـ metachronous أو synchronous lesions.
      - kind: explain
        page: 175
        quote: "Cancer risk increases with the extent, duration, and severity of disease"
        title: "IBD، سرطان سابق، وقرايب"
        text: |
          - **IBD**: الخطر تقريبًا الضعف، وبيزيد مع ==extent, duration, and severity==. وبيقل مع الوقت بسبب العلاج والـ surveillance.
          - **Previous colon cancer**: second primary تلات مرات أكتر، و metachronous في 5-8%.
          - **First-degree relatives**: 1.8-8 مرات، وأكتر لو أكتر من قريب أو قريب صغير في السن.
      - kind: check
        page: 175
        quote: "Cancer risk increases with the extent, duration, and severity of disease"
        question: "Cancer risk in patients with IBD increases with:"
        options: ["The extent of disease", "Duration of disease", "Severity of disease", "All of the above"]
        answer: 3
        why:
          - "صح بس مش لوحده."
          - "صح بس مش لوحده."
          - "صح بس مش لوحده."
          - "صح: التلاتة. ده سؤال الكتاب بالنص."
      - kind: try
        items: [git.L04.154, git.L04.165, git.L04.169, git.L04.173, git.L04.181]
    recap:
      - "CRC تاني سبب وفاة بالسرطان؛ preventable و curable بدري؛ 75% sporadic."
      - "APC → K-ras → 18 → p53 (FAP، 70-80%)؛ MMR/MSI (HNPCC، 10-15%)؛ inflammation."
      - "Adenoma خطير = **SVD**: Size فوق 2 cm (46%)، Villous (40%)، Dysplasia (34%)."
      - "Colectomy: residual cancer، +margin، poor diff، vascular/lymphatic invasion."
      - "FAP: APC 5q21، 100% by 40، surgery. Lynch: 85%، right sided، 45 سنة، better survival."
