        title: "شكل الـ severe UC في المنظار"
        image: { file: git/L06-uc-pseudopolyps-endoscopy.webp, book: true }
        alt: "Three colonoscopy photos: A, red granular mucosa with small ulcers around the lumen; B, smooth polypoid pseudopolyps; C, hemorrhagic ulcerated mucosa with exudate."
        caption: "Figure 9: (A) mucosa حمرا ومحببة ومقرّحة، (B) **pseudopolyps**، (C) hemorrhagic مع exudate."
