  - id: neph.L14.lesson2
    title: "الستة classes: الـ deposits فين؟"
    hook: "لو عرفت الـ deposits قاعدة فين في الـ capillary loop، هتعرف الـ class والعلاج."
    minutes: 7
    pages: [449, 452]
    topics: [ln-classes, ln-class12]
    goals:
      - "تحفظ الـ ISN/RPS classes بالنسب"
      - "تفرّق IV-S عن IV-G و A عن C"
      - "تعالج class I/II والـ lupus podocytopathy"
    status: unverified
    steps:
      - kind: figure
        page: 449
        quote: "Renal Pathology Society (ISN/RPS) in 2003 revised in 2018"
        title: "مكان الـ deposits = الـ class"
        alt: "A glomerular capillary wall drawn as layers from the capillary lumen outwards: endothelium, the subendothelial space (class III and IV deposits), the glomerular basement membrane, the subepithelial space (class V deposits) and the podocyte foot processes. Below it the mesangium holds class I and II deposits."
        caption: "تصنيف ISN/RPS (2003، revised 2018): ==Mesangial== = I/II، ==subendothelial== = III/IV (وده اللي بيعمل inflammation لأنه جنب الدم)، ==subepithelial== = V (membranous)."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="60" height="150" rx="8" class="fg-box"/>
            <text x="40" y="80" text-anchor="middle" class="t-sm t-b">Lumen</text>
            <text x="40" y="98" text-anchor="middle" class="t-sm t-mut">blood</text>
            <rect x="76" y="10" width="16" height="150" class="fg-acc"/>
            <text x="84" y="178" text-anchor="middle" class="t-sm t-mut">Endo</text>
            <circle cx="108" cy="50" r="7" class="fg-dot-bad"/>
            <circle cx="108" cy="90" r="7" class="fg-dot-bad"/>
            <circle cx="108" cy="130" r="7" class="fg-dot-bad"/>
            <rect x="124" y="10" width="34" height="150" class="fg-box"/>
            <text x="141" y="178" text-anchor="middle" class="t-sm t-b">GBM</text>
            <circle cx="174" cy="60" r="7" class="fg-dot-acc"/>
            <circle cx="174" cy="110" r="7" class="fg-dot-acc"/>
            <rect x="190" y="10" width="40" height="150" rx="10" class="fg-good"/>
            <text x="210" y="178" text-anchor="middle" class="t-sm t-mut">Podocyte</text>
            <text x="250" y="40" class="t-sm t-bad t-b">III / IV</text>
            <text x="250" y="56" class="t-sm t-mut">subendothelial</text>
            <text x="250" y="100" class="t-sm t-acc t-b">V</text>
            <text x="250" y="116" class="t-sm t-mut">subepithelial</text>
            <rect x="10" y="200" width="220" height="44" rx="8" class="fg-thin"/>
            <circle cx="40" cy="222" r="7" class="fg-dot-good"/>
            <text x="56" y="227" class="t-sm t-b">Mesangium</text>
            <text x="250" y="218" class="t-sm t-good t-b">I / II</text>
            <text x="250" y="234" class="t-sm t-mut">mesangial</text>
          </svg>
      - kind: table
        page: 449
        quote: "Histopathology classification of lupus nephritis according to the criteria established by the international Society of Nephrology and the Renal Pathology Society"
        title: "ISN/RPS histopathology classification of lupus nephritis"
        columns: [Class, Name, Key]
        rows:
          - [I, Minimal mesangial, "Normal on LM; mesangial deposits on IF"]
          - [II, Mesangial proliferative, "Mesangial hypercellularity or matrix"]
          - [III, Focal, "<50% of glomeruli"]
          - [IV, Diffuse, "≥50% of glomeruli; IV-S or IV-G"]
          - [V, Membranous, "Subepithelial; may combine with III/IV"]
          - [VI, Advanced sclerosing, "≥90% globally sclerosed"]
        hide: [[2, 2], [3, 2], [4, 1], [5, 2]]
      - kind: mnemonic
        page: 449
        quote: "Lupus Nephritis with terminal prognosis ≥90% of the glomeruli in global sclerosis"
        word: "MM FD MS"
        parts:
          - key: "M M"
            text: "I Minimal mesangial, II Mesangial proliferative"
          - key: "F D"
            text: "III Focal (<50%), IV Diffuse (≥50%)"
          - key: "M S"
            text: "V Membranous, VI Sclerosing (≥90%)"
        hook: "اقراها **2-2-2**: أزواج من الأخف للأتقل. والأرقام **50** و **90** هما الحدود الوحيدة اللي محتاج تحفظها."
      - kind: explain
        page: 449
        title: "IV-S ولا IV-G؟ و A ولا C؟"
        quote: "This class is also divided in diffuse segmental (IV-S)"
        text: |
          - "**IV-S**: ≥50% من الـ glomeruli **المصابة** فيها lesions **segmental**."
          - "**IV-G**: ≥50% منها **global**."
          - **A** = active، **C** = chronic inactive، **A/C** = الاتنين.

          الـ A معناه فيه حاجة تتعالج، الـ C معناه scar مش هيرجع.
      - kind: check
        page: 449
        quote: "Lupus Nephritis with terminal prognosis ≥90% of the glomeruli in global sclerosis"
        question: "A biopsy shows subendothelial deposits in 30% of glomeruli with active lesions. Which class?"
        options:
          - "Class III (A)"
          - "Class IV-S (A)"
          - "Class V"
          - "Class VI"
        answer: 0
        why:
          - "صح: subendothelial في أقل من 50% = focal = III."
          - "الـ IV محتاج ≥50% من الـ glomeruli."
          - "الـ V يعني subepithelial deposits."
          - "الـ VI يعني ≥90% global sclerosis."
      - kind: explain
        page: 451
        title: "Class I و II"
        quote: "no specific immunosuppressive therapy beyond what is being given for nonrenal lupus is needed."
        text: |
          عادةً الـ kidney function **normal** والـ proteinuria قليلة، وساعات microscopic hematuria.

          **مفيش immunosuppression خاص بالكلية**: العلاج على حسب الـ **extrarenal** manifestations.
      - kind: explain
        page: 452
        title: "Lupus podocytopathy"
        quote: "over 90% of patients given glucocorticoid monotherapy achieved remission within a median time of 4 weeks."
        text: |
          Class **I أو II** على الـ biopsy بس معاه **nephrotic syndrome**؟ ده ==lupus podocytopathy==.
          - الـ EM بيبين **diffuse podocyte effacement**.
          - شبه **MCD** أو **FSGS**، فبيتعالج زي الـ **MCD**.
          - أكتر من **90%** بيعملوا remission على glucocorticoids لوحدها في متوسط **4 أسابيع**.
          - "بس بيرجع بعد الـ taper، فاعمل maintenance: **low-dose steroid** + MPAA أو azathioprine أو CNI."
      - kind: aside
        tone: exam
        text: "سؤال مشهور: class II مع nephrotic range proteinuria. الإجابة مش \"زوّد الـ immunosuppression\"، الإجابة \"lupus podocytopathy، اعمل EM وعالجه زي MCD\"."
      - kind: try
        items: [neph.L14.009, neph.L14.011, neph.L14.012, neph.L14.028, neph.L14.030]
    recap:
      - "I/II mesangial، III focal <50%، IV diffuse ≥50% (IV-S/IV-G)، V membranous، VI ≥90% sclerosis."
      - "Subendothelial = III/IV، subepithelial = V."
      - "Class I/II: علاج الـ extrarenal بس."
      - "Lupus podocytopathy: I/II + nephrotic؛ عالجه زي MCD، >90% remission في 4 أسابيع."
    practice: [neph.L14.009, neph.L14.010, neph.L14.011, neph.L14.012, neph.L14.013, neph.L14.014, neph.L14.015, neph.L14.016, neph.L14.026, neph.L14.027, neph.L14.028, neph.L14.029, neph.L14.030, neph.L14.031, neph.L14.102]
