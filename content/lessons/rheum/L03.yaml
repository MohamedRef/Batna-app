            <circle cx="274" cy="126" r="4" class="fg-bad"/>
            <text x="268" y="88" text-anchor="middle" class="t-sm">enzymes, ROS</text>
            <text x="268" y="170" text-anchor="middle" class="t-sm t-bad t-b">vasculitis</text>
          </svg>
      - kind: table
        page: 65
        quote: "local tissue damage characterized by pain, redness and swelling = Arthus reaction."
        title: "Localized ضد systemic"
        columns: ["", "Arthus", "Serum sickness"]
        rows:
          - ["Complexes", "Stay where Ag meets Ab", "Circulate, trapped in narrow vessels"]
          - ["Damage", "Local pain, redness, swelling", "Fever, weakness, rash, arthritis, GN"]
          - ["Cause", "Local antigen", "Anti-tetanus antitoxin, drugs"]
        hide: [[1, 2], [2, 2]]
      - kind: mnemonic
        page: 65
        quote: "Joints arteries and the renal glomeruli are susceptible to IC deposition."
        word: "JAG"
        hook: "الـ complexes بتتحشر في «JAG»: زي ما الشوكة بتتحشر في الزور."
        parts:
          - { key: "J", text: "Joints → arthritis" }
          - { key: "A", text: "Arteries → vasculitis" }
          - { key: "G", text: "Glomeruli → nephritis" }
      - kind: explain
        page: 65
        quote: "accumulation of ICs involving auto-antibodies recognizing soluble self antigens =SLE."
        title: "مش بس antigen غريب"
        text: |
          - المكان: **أوعية ضيقة** أو **turbulence** لما الدم يغيّر اتجاهه.
          - ==Serum sickness== هو الـ **prototype** للـ systemic type III.
          - ومن غير antigen غريب: autoantibodies ضد **soluble self antigens** ← ==SLE==.
      - kind: explain
        page: 65
        quote: "Is immunopathological damage occurring 24-72 hours after exposure of a sensitized individual to an antigen."
        title: "Type IV: الـ delayed type"
        text: |
          - Damage بعد ==24-72 ساعة== من التعرّض في واحد sensitized.
          - مش antibody: **effector T cells و macrophages**.
          - أول تعرّض: CD4 Th تتنشّط وتتكاثر في **1-2 أسبوع**.
          - التعرّض التاني: تفرز cytokines ← تجيب macrophages، وهي ==95%== من الخلايا.
          - Activated macrophages: phagocytosis أقوى.
      - kind: order
        page: 66
        quote: "initiated because Ag is 1st presented to T cells which then activate macroph."
        prompt: "رتّب الـ type IV زي رسمة صفحة 66:"
        steps:
          - "Antigen"
          - "Antigen-presenting cell"
          - "Sensitized T cell secretes cytokines"
          - "Macrophages attracted and activated"
          - "Granuloma formation"
        why: "بياخد أيام لأن الـ antigen لازم يتعرض على الـ T cells الأول، وهي اللي تشغّل الـ macrophages. الأمثلة: M. TB و Leishmania."
      - kind: sort
        page: 66
        quote: "Examples of antigens that induce type IV reaction intracellular pathogens such as M. TB and Leishmania."
        prompt: "حط كل مثال في نوعه:"
        bins: ["Type I", "Type II", "Type III", "Type IV"]
        cards:
          - { text: "Peanut anaphylaxis", bin: 0 }
          - { text: "Hay fever", bin: 0 }
          - { text: "ABO-incompatible transfusion", bin: 1 }
          - { text: "Myasthenia gravis", bin: 1 }
          - { text: "Serum sickness", bin: 2 }
          - { text: "Arthus reaction", bin: 2 }
          - { text: "Tuberculosis granuloma", bin: 3 }
          - { text: "Leishmania", bin: 3 }
        why: "I = IgE في دقايق، II = antibody على الخلية، III = complexes، IV = T cells بعد 24-72 ساعة."
      - kind: case
        page: 67
        quote: "What type of hypersensitivity reaction is this patient experiencing?"
        stem: "A 35-year-old woman has joint pain, swelling and rash two weeks after a new antibiotic for sinusitis. Fever, fatigue, dark urine, palpable purpura on the legs, low complement. (Book question 1)"
        steps:
          - question: "Which type of hypersensitivity?"
            options: ["Type III", "Type I", "Type II", "Type IV"]
            answer: 0
            why: "Drug antigen + أسبوعين + vasculitis (purpura) + arthritis + GN (dark urine) + complement واطي = type III زي serum sickness. الكتاب مش طابع الإجابة؛ دي من صفحة 65."
          - question: "Which does NOT belong to type III? (Book question 2)"
            options: ["Drug allergy", "Acute hypersensitivity pneumonitis", "Drug-induced vasculitis", "Serum sickness"]
            answer: 0
            why: "الـ drug allergy المعتاد (زي penicillin anaphylaxis) هو type I. الباقي immune complex."
      - kind: aside
        tone: trap
        page: 65
        quote: "Drug antigen or environmental."
        text: "نفس الـ drug antigen ممكن يعمل type I (anaphylaxis في دقايق) أو type III (serum sickness بعد أيام). السؤال بيفرّقهم بالـ **توقيت** و **الـ complement الواطي**."
      - kind: try
        items: [rheum.L03.078, rheum.L03.080, rheum.L03.082, rheum.L03.087, rheum.L03.089]
    recap:
      - "Type III: soluble Ag + IgG/IgM ← complexes كبيرة ← تترسب في الأوعية ← neutrophils ← vasculitis."
      - "Arthus = local. Serum sickness = systemic prototype. SLE = self antigen."
      - "JAG: joints، arteries، glomeruli."
      - "Type IV: 24-72 ساعة، T cells و macrophages (95%)، TB و Leishmania، granuloma."
