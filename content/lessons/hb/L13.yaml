schema: batna.lesson/v1
lecture: hb.L13
lessons:
  # ------------------------------------------------------------------
  - id: hb.L13.lesson1
    title: "الـ AIH: تشخيص بالاستبعاد"
    hook: "مناعة الجسم قررت تهاجم الكبد... بس قبل ما تتهمها، لازم تبرّئ كل المشتبه فيهم التانيين."
    minutes: 8
    pages: [204, 206]
    topics: [aih-diagnosis]
    goals:
      - "تعرّف الـ AIH بالتلات حاجات اللي بتميّزها"
      - "تفرّق بين interface hepatitis و lobular hepatitis"
      - "تمشي في الـ diagnostic algorithm من الأول للآخر وتفرّق definite من probable"
    status: unverified
    steps:
      - kind: explain
        page: 204
        title: "يعني إيه autoimmune hepatitis؟"
        quote: "a self-perpetuating hepatocellular inflammation of unknown cause"
        text: |
          الكتاب بيعرّفها إنها **self-perpetuating hepatocellular inflammation of unknown cause**: التهاب في الـ hepatocytes بيغذّي نفسه بنفسه، ومحدش عارف سببه.

          وبتتميّز بتلات حاجات:

          - **Interface hepatitis** في الـ histology.
          - **Hypergammaglobulinemia** و **autoantibodies** في الـ serum.
          - بتتشخّص **after exclusion of other chronic liver diseases**.

          خلّي بالك من التالتة: الـ AIH مالهاش test واحد يقول «أيوه هي». هي تشخيص بالاستبعاد.
      - kind: explain
        page: 205
        title: "Interface hepatitis vs lobular hepatitis"
        text: |
          - **Interface hepatitis:** الـ **limiting plate** بتاعة الـ portal tract (صف الـ hepatocytes اللي على حدود الـ portal tract) بيتكسر بـ **lymphoplasmacytic infiltrate**. ده الـ **hallmark** بتاع الـ AIH.
          - **Lobular hepatitis:** **mononuclear cells** بتصطف جوه الـ **sinusoids**. عادةً بتبقى مع الـ interface hepatitis، بس ممكن تبقى واضحة أكتر في الـ **acute** presentation.
      - kind: aside
        tone: analogy
        page: 205
        text: |
          تخيّل الـ portal tract **قسم شرطة** والـ limiting plate هو **السور** اللي حواليه.

          في الـ interface hepatitis الـ lymphocytes والـ plasma cells **بتنط من على السور** وتهاجم البيوت اللي جنبه على طول. ولو انتشروا في **الشوارع** نفسها (الـ sinusoids) يبقى ده lobular hepatitis.
      - kind: check
        page: 205
        question: "What is the histologic hallmark of autoimmune hepatitis?"
        options:
          - "Interface hepatitis"
          - "Florid bile duct lesion"
          - "Onion-skin periductal fibrosis"
          - "Storiform fibrosis"
        answer: 0
        why:
          - "صح: lymphoplasmacytic infiltrate بيكسر الـ limiting plate، وده الـ hallmark بتاع الـ AIH."
          - "دي stage I بتاعة الـ **PBC** (هتشوفها في درس الـ PBC)."
          - "دي علامة الـ **PSC**."
          - "دي علامة الـ **IgG4-related disease**."
      - kind: explain
        page: 205
        title: "الـ diagnostic criteria والـ serology"
        text: |
          الكتاب بيذكر في الـ diagnostic criteria:

          - إن عندها **propensity** تيجي **acute** وأحيانًا نادرة **fulminant**.
          - وجود **lobular hepatitis**.
          - **Cholestatic histologic changes**، منها bile duct injury و **ductopenia**.
          - **Immunoserologic tests:** **ANA**، **SMA**، **anti-LKM1**، و **pANCA** (common في **type 1**).
      - kind: explain
        page: 206
        title: "Definite ولا probable؟"
        text: |
          **Definite AIH** محتاجة تلاتة:

          - **Exclusion** للأمراض الشبهها.
          - Labs بتقول إن فيه **substantial immunoreactivity**.
          - **Interface hepatitis** في الـ histology.

          **Probable AIH:** لما الصورة متوافقة بس مش كفاية لـ definite. ومنها اللي **مالوش الـ conventional autoantibodies** بس عنده **investigational markers**: **anti-ASGPR**، **anti-SLA/LP**، **antiactin**، أو **anti-LC1**.
      - kind: figure
        page: 206
        title: "الـ algorithm في صفحة واحدة"
        alt: "Flow chart. Abnormal AST and gamma globulin with a high AST to ALP ratio. Then exclude: AMA negative, normal ceruloplasmin and alpha-1 antitrypsin phenotype, normal or nonspecific iron, HBsAg, anti-HCV and IgM anti-HAV negative. Then interface hepatitis with or without lobular hepatitis. Then two branches. Definite: gamma globulin at least 1.5 times normal, ANA, SMA or LKM1 at least 1:80, no drugs or blood products, alcohol under 25 g per day. Probable: gamma globulin at least 1.5 times normal, titre at least 1:40, previous drugs, blood products or alcohol, other liver autoantibodies. Finally type 1 is ANA and/or SMA, type 2 is LKM1."
        caption: "من فوق لتحت: labs، استبعاد، biopsy، وبعدين definite أو probable، وفي الآخر النوع حسب الـ antibody."
        svg: |
          <svg viewBox="0 0 330 560" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L13a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
