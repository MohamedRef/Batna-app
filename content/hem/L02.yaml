  - id: hem.L02.012
    kind: enumerate
    topic: symptoms
    prompt: Mention the prominent early symptoms of severe acute haemolysis or blood loss.
    points:
      - Resting or orthostatic hypotension (fall in total blood volume)
      - Light-headedness or syncope
      - Exertional or resting tachycardia and palpitations
      - Diaphoresis
      - Anxiety and agitation
      - Generalised severe weakness and lethargy
      - Possibly reduced mental function
    pass: 5
    src: { page: 10, quote: "In severe acute haemolysis or blood loss, prominent early symptoms include resting or orthostatic hypotension" }
    status: unverified
  - id: hem.L02.013
    kind: mcq
    topic: symptoms
    stem: A 60-year-old woman with a slowly progressive anaemia from menorrhagia walks into clinic with Hb 5.5 g/dL and few complaints. A man who bled acutely from an ulcer arrives faint and tachycardic with Hb 9 g/dL. What explains the difference?
    options:
      - Slowly developing anaemia may be asymptomatic even at Hb 5–6 g/dL
      - Women tolerate anaemia because their reference range is lower
      - Acute bleeding lowers Hb faster than chronic bleeding
      - The woman must have a lab error
      - Tachycardia is a sign of iron deficiency only
    answer: 0
    why:
      - "Correct: slowly developing or long-standing anaemia may be asymptomatic at Hb 5–6 g/dL (p10); acute loss brings hypotension and tachycardia from the drop in blood volume."
      - A lower reference range does not explain tolerance of Hb 5.5 g/dL.
      - The point is volume loss and adaptation, not the speed of the Hb fall.
      - The book explicitly allows such low Hb without symptoms.
      - Tachycardia comes from acute blood loss, haemolysis and severe anaemia of any cause.
    src: { page: 10, quote: "Slowly developing or long-standing anemia may be asymptomatic with Hb levels of 5 or 6 g/dL." }
    status: unverified
  - id: hem.L02.014
    kind: card
    topic: history
    front: What does the onset of anaemic symptoms suggest?
    back: Abrupt onset suggests haemolysis; insidious onset suggests a nutritional cause.
    src: { page: 10, quote: "Onset of symptoms abrupt (haemolysis) or insidious (nutritional)" }
    status: unverified
    tags: [high-yield]
  - id: hem.L02.015
    kind: card
    topic: history
    front: What does a short duration of dyspnoea and fatigue suggest?
    back: Recent bleeding or haemolysis.
    src: { page: 10, quote: "short duration of dyspnoea and fatigue etc. suggests recent bleeding or haemolysis" }
    status: unverified
