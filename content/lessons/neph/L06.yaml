  - id: neph.L06.lesson4
    title: "البوتاسيوم العالي: احمي القلب الأول"
    hook: "K 7 ورسم القلب متغير؟ عندك ترتيب تلات خطوات، والتلاتة بيبدأوا بحرف C."
    minutes: 9
    pages: [135, 139]
    topics: [k-physiology, hyperk, hyperk-treat]
    goals:
      - "تفهم ليه الـ K بيأثر على القلب والعضلات"
      - "تكشف الـ pseudo والـ reverse pseudohyperkalemia"
      - "ترتّب العلاج الطارئ وتقارن الـ K binders"
    status: unverified
    steps:
      - kind: explain
        page: 135
        title: "الـ K ساكن جوّه الخلية"
        quote: "Insulin and B adrenergic catecholamines stimulate membrane Na /K ATPase to pump K into cells (in a 3:2 ratio)."
        text: |
          أول ما الـ K يتمص، بيدخل الخلايا بسرعة. الـ ==insulin== والـ **beta-adrenergic catecholamines** بيشغّلوا الـ **Na/K-ATPase** (3 Na برّه لكل 2 K جوّه).

          **98%** من الـ exchangeable K جوّه الخلية. الفرق ده هو اللي عامل الـ **resting membrane voltage**، علشان كده أي لخبطة في الـ K بتظهر في **القلب والعضلات والأعصاب**.
      - kind: figure
        page: 136
        quote: "FILTERED LOAD 600-700 mEq/day"
        title: "رحلة الـ K في الـ nephron"
        alt: "Nephron diagram for potassium: filtered load 600-700 mEq/day; the proximal tubule reabsorbs most (about 75%), the loop of Henle about 15%; the distal tubule and collecting duct secrete K under aldosterone; urinary excretion about 90 mEq/day."
        caption: "الـ PCT والـ loop بيرجّعوا معظم الـ K. اللي **بيقرر** الـ K اللي في البول هو الـ ==aldosterone== في الـ DCT والـ collecting duct."
        svg: |
          <svg viewBox="0 0 330 280" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L06d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="5" y="5" width="320" height="38" rx="8" class="fg-ink"/>
            <text x="165" y="29" text-anchor="middle" class="t-b">Filtered load 600–700 mEq/day</text>
            <path d="M165 43 L165 58" class="fg-arrow" marker-end="url(#L06d)"/>
            <rect x="5" y="60" width="320" height="40" rx="8" class="fg-good"/>
            <text x="15" y="85" class="t-b">PCT</text>
            <text x="315" y="85" text-anchor="end" class="t-sm">reabsorbs 75%</text>
            <path d="M165 100 L165 115" class="fg-arrow" marker-end="url(#L06d)"/>
            <rect x="5" y="117" width="320" height="40" rx="8" class="fg-good"/>
            <text x="15" y="142" class="t-b">Loop of Henle</text>
            <text x="315" y="142" text-anchor="end" class="t-sm">reabsorbs 15%</text>
            <path d="M165 157 L165 172" class="fg-arrow" marker-end="url(#L06d)"/>
            <rect x="5" y="174" width="320" height="50" rx="8" class="fg-acc"/>
            <text x="15" y="195" class="t-b">DCT + collecting duct</text>
            <text x="15" y="213" class="t-sm">K secretion, tightly set by aldosterone</text>
            <path d="M165 224 L165 239" class="fg-arrow" marker-end="url(#L06d)"/>
            <rect x="5" y="241" width="320" height="34" rx="8" class="fg-box"/>
            <text x="165" y="263" text-anchor="middle" class="t-b">Urine ~90 mEq/day</text>
          </svg>
      - kind: explain
        page: 136
        title: "الكلية عندها ساعة"
        quote: "characterized by lower excretion at night and in the early morning hours and then increasing in the afternoon"
        text: |
          إخراج الـ K (K excretion) له ==circadian rhythm==: **قليل بالليل والصبح بدري**، ويعلى **بعد الضهر**.

          ليه؟ بيمشي مع مواعيد الأكل اللي فيه K، ومع rhythm في الـ genes بتاعة بروتينات إفراز الـ K، ومع rhythm الـ glucocorticoids والـ aldosterone مع النوم والصحيان.
      - kind: explain
        page: 137
        title: "Pseudohyperkalemia: العينة هي العيانة"
        quote: "Pseudohyperkalemia is a laboratory artifact in which there is marked elevation in serum K+ concentration (>0.5 mEq/L)"
        text: |
          الـ ==pseudohyperkalemia==: K عالي في المعمل (بأكتر من 0.5) والعيان سليم.

          أسبابها في **سحب العينة**: tourniquet، قبض الإيد، إبرة رفيعة، خبط العينة في الـ pneumatic tube. وأسباب مرضية: **platelets فوق 500,000** و **WBC حوالي 70,000** (بيطلّعوا K وهي بتتجلط).

          الـ ==reverse pseudohyperkalemia==: **plasma K** عالي والـ **serum K** طبيعي، في الـ **hematologic malignancy**، من الـ **heparin** اللي بيبوّظ غشاء الخلايا الهشة (أو الـ WBC الكتير مستهلكة الطاقة فالـ pump بيقف).
      - kind: check
        page: 137
        quote: "Refers to a false elevation in plasma K+ concentration when serum K+ concentration is normal."
        question: "CLL patient: heparin-tube K 6.9, clotted-tube K 4.2, normal ECG. What is this?"
        options:
          - "Reverse pseudohyperkalemia"
          - "Classic pseudohyperkalemia"
          - "True hyperkalemia"
          - "Hypokalemia"
        answer: 0
        why:
          - "صح: الـ plasma (heparin) عالي والـ serum طبيعي في malignancy."
          - "الكلاسيكي العكس: الـ serum هو اللي عالي."
          - "لو حقيقي كان الاتنين هيعلوا."
          - "الـ K مش واطي."
      - kind: sort
        page: 138
        quote: "Causes of Hyperkalaemia Increased potassium release from cells"
        prompt: "الـ K عالي ليه؟ حط كل سبب في مكانه:"
        bins: ["Release from cells", "Drugs", "Reduced urine excretion"]
        cards:
          - { text: "Rhabdomyolysis", bin: 0 }
