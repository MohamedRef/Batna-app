      - "Typical (Stx): E. coli O157:H7 أو Shigella، أطفال < 2–3، إسهال بدم، 70–85% الكلى بترجع."
      - "Atypical: كبار، من غير إسهال، complement regulatory proteins، 50% ESRD، 25% وفاة."
      - "DD: TTP، DIC، HELLP، vasculitis."
      - "سوايل بحذر، dialysis، ممنوع antibiotics و antiperistaltics؛ PRBC عند Hb 7–8؛ صفايح لأ إلا نزيف؛ eculizumab/ravulizumab (C5) للـ atypical."
