  - id: dm.L17.lesson7
    title: "مين في خطر؟ وليه ساكت لحد الكسر"
    hook: "الست الرفيعة المدخّنة اللي سن اليأس جالها بدري: كل حاجة فيها بتقول osteoporosis. وهتعرف ليه مش هتشتكي غير لما حاجة تتكسر."
    minutes: 9
    pages: [217, 219]
    topics: [risk, clinical]
    goals:
      - "تحفظ الـ risk factors وتعرف السبب ورا كل واحد"
      - "تعرف الـ FRAX"
      - "تفرّق الـ osteoporosis عن الـ osteomalacia إكلينيكيًا، وتعرف بتسأل عن إيه"
    status: unverified
    steps:
      - kind: explain
        remind: [dm.L17.026]
        page: 217
        title: "الـ major risk factors"
        quote: "The major risk factors for osteoporosis are age, female sex, white or Oriental race, family history of osteoporosis, thin habitus, early menopause"
        text: |
          الكتاب بيعدهم كده:
          - **Age**، **female sex**، **white or Oriental race**
          - **Family history**، ==thin habitus==
          - **Early menopause (before 45)**، oophorectomy، secondary amenorrhea
          - **Lifelong low calcium intake** (حتى الـ lactose intolerance)
          - **Sedentary lifestyle** و **immobilization**

          لو بصيت كويس هتلاقيهم مجموعتين: حاجات بتقلّل الـ estrogen (early menopause، oophorectomy، secondary amenorrhea، النحافة)، وحاجات بتقلّل البناء (كالسيوم قليل، قعدة). عشان كده الست اللي سن اليأس جالها بدري في خطر أكبر: سنين أكتر من غير estrogen.
      - kind: explain
        page: 218
        title: "ليه الست، وليه الأبيض؟"
        quote: "Sex: Women have a lower peak bone mass at skeletal maturity and a greatly accelerated phase of bone loss for several years after menopause. By the sixth decade, their absolute bone density is significantly lower than that in men."
        text: |
          هنا الكتاب نفسه بيدّيك السبب:

          - ==Age==: أقوى predictor لوحده؛ كل سنة سحب زيادة.
          - **Sex**: الست بتبدأ ==برصيد أقل== (lower peak bone mass)، وبعد سن اليأس بتخسر ==بسرعة جدًا== كام سنة. فعلى الستينات كثافتها أقل من الراجل بوضوح.
          - **Race**: الـ whites والـ Orientals أكتر من الـ blacks، غالبًا لأن الـ blacks بيبنوا **peak bone mass أكبر**، ويمكن كمان من فروق الأكل والرياضة والوزن.
          - **Family history** of osteoporotic fractures: major risk factor.

          شايف الخيط؟ نفس فكرة الحساب البنكي: يا رصيد البداية قليل، يا السحب أسرع.
      - kind: figure
        page: 218
        quote: "Sex: Women have a lower peak bone mass at skeletal maturity and a greatly accelerated phase of bone loss for several years after menopause. By the sixth decade, their absolute bone density is significantly lower than that in men."
        title: "الرصيد على مدى العمر"
        alt: "Bone mass on the vertical axis against age on the horizontal axis. Two curves rise in youth to a peak at skeletal maturity; the men's peak is higher. After the peak both fall slowly, but the women's curve drops steeply for several years after menopause and crosses a dashed fracture threshold line earlier than the men's."
        caption: "الست بتبدأ من قمة أوطى، وبعد سن اليأس بتنزل أسرع، فبتعدّي خط الكسر بدري. (الشكل توضيح للي في ص 216 و 218، مش من الكتاب.)"
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L17c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
