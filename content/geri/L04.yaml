    points: [Infection, Dehydration, Electrolyte imbalance, Polypharmacy, Acute medical illness, Change in therapy, Destabilised chronic condition, Visual problems, History of dementia, Constipation and urinary retention]
    pass: 7
    src: { page: 72, quote: "infection, dehydration, electrolyte imbalance, polypharmacy, acute medical illness, a change in therapy" }
    status: unverified
  - id: geri.L04.072
    kind: enumerate
    topic: delirium-diagnosis
    prompt: Enumerate the first-line investigations for delirium.
    points: ["Urinalysis and culture", Chest X-ray, "ECG, troponins", CBC with differential, Electrolytes, "Liver enzymes, renal function", Thyroid function, Glucose]
    pass: 6
    src: { page: 72, quote: "Infection work-up-Urinalysis and culture • Chest x-ray • ECG, troponins • CBC with differential" }
    status: unverified
  - id: geri.L04.073
    kind: card
    topic: delirium-diagnosis
    front: What are the 4 diagnostic criteria of delirium on p73?
    back: "1) Disturbance of consciousness (less clear awareness; less ability to focus, sustain or shift attention). 2) Change in cognition. 3) Develops over hours or days. 4) Fluctuates over the day."
    src: { page: 73, quote: "Disturbance develops over a short period (hours or days) 4) Fluctuation over a course of day" }
    status: unverified
  - id: geri.L04.074
    kind: card
    topic: delirium-diagnosis
    front: When is CT head indicated in delirium?
    back: Focal neurological deficits, TIA, or a history of previous stroke.
    src: { page: 73, quote: "Perform CT scan of the head (indications are focal neurological deficits, TIA, and history of a previous stroke)" }
    status: unverified
    tags: [high-yield]
  - id: geri.L04.075
    kind: card
    topic: delirium-diagnosis
    front: When is lumbar puncture indicated in delirium?
    back: When CNS infection is suspected, or when the source of a systemic infection cannot be found.
