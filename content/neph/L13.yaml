items:
  # ---------- p425-426: epidemiology ----------
  - id: neph.L13.001
    kind: cloze
    topic: epidemiology
    text: "In 2021, {{c1::537 million}} people ({{c2::11%}} of the world) had diabetes, expected to reach {{c3::783 million}} (12%) by 2045."
    src: { page: 425, quote: "In 2021, 537 million people worldwide (11% of the global population) had diabetes, and this number is expected to increase to 783 million (12%)" }
    status: unverified
    tags: [numbers]
  - id: neph.L13.002
    kind: card
    topic: epidemiology
    front: What mainly drives the global rise in diabetes?
    back: The increase in type 2 diabetes mellitus.
    src: { page: 425, quote: "has risen dramatically, owing mainly to the increase in type 2 diabetes mellitus." }
    status: unverified
  - id: neph.L13.003
    kind: cloze
    topic: epidemiology
    text: "About {{c1::20-50%}} of patients with T2DM ultimately develop DKD."
    src: { page: 425, quote: "Approximately 20–50% of patients with T2DM will ultimately develop DKD." }
    status: unverified
    tags: [numbers]
  - id: neph.L13.004
    kind: cloze
    topic: epidemiology
    text: "DKD is the {{c1::leading cause}} of CKD and end-stage kidney disease, accounting for {{c2::50%}} of cases."
    src: { page: 425, quote: "DKD is the leading cause of chronic kidney disease and end-stage kidney disease, accounting for 50% of cases." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L13.005
    kind: card
    topic: epidemiology
    front: Besides kidney failure, what does DKD cause?
    back: High cardiovascular morbidity and mortality, and lower health-related quality of life.
    src: { page: 425, quote: "DKD results in high cardiovascular morbidity and mortality, and decreases patients‘ health-related quality of life." }
    status: unverified
  - id: neph.L13.006
    kind: cloze
    topic: epidemiology
    text: "DKD develops in nearly {{c1::half}} of patients with T2DM and {{c2::one-third}} of those with T1DM during their lifetime."
    src: { page: 425, quote: "Diabetic kidney disease develops in nearly half of patients with T2DM and one-third of those with T1DM during their lifetime." }
    status: unverified
    tags: [numbers]
  - id: neph.L13.007
    kind: cloze
    topic: epidemiology
    text: "Glomerular hyperfiltration occurs within {{c1::1 to 5 years}} of T1DM and is present in {{c2::70%}} of T1DM and {{c3::50%}} of T2DM."
    src: { page: 425, quote: "Glomerular hyperfiltration occurs within 1 to 5 years of T1DM and is present in 70% of those with T1DM and 50% of those with T2DM." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L13.008
    kind: card
    topic: epidemiology
    front: Why is glomerular hyperfiltration thought to matter in diabetes?
    back: It is hypothesized to predispose to irreversible nephron damage, starting and driving progression of diabetic kidney disease.
    src: { page: 425, quote: "Glomerular hyperfiltration classically has been hypothesized to predispose towards irreversible nephron damage" }
    status: unverified
  # ---------- p425-426: definition ----------
  - id: neph.L13.009
    kind: card
    topic: definition
    front: DKD versus diabetic nephropathy (KDIGO)?
    back: DKD is a clinical diagnosis, CKD in a person with diabetes; DN is reserved for the histologic glomerular changes on biopsy.
    src: { page: 426, quote: "Whereas the term DN is exclusively reserved for the histologic diagnosis of glomerular changes observed on biopsy." }
    status: unverified
    tags: [high-yield]
  - id: neph.L13.010
    kind: cloze
    topic: definition
    text: "DKD = CKD in diabetes with persistent (at least {{c1::3 months}}) albuminuria (ACR {{c2::≥30 mg/g}}) and/or eGFR {{c3::<60}} mL/min/1.73 m²."
    src: { page: 426, quote: "(albumin-to-creatine ratio ≥ 30 mg/g) and/or low estimated glomerular filtration rate (eGFR < 60 mL/min/1.73 m2) in a person with diabetes." }
    status: unverified
    tags: [numbers, high-yield]
  # ---------- p426-427: pathogenesis ----------
  - id: neph.L13.011
    kind: card
    topic: pathogenesis
    front: Hyperfiltration in diabetes reflects what hemodynamic change?
    back: Increased intraglomerular capillary pressure.
    src: { page: 426, quote: "Hyperfiltration is thought to be a manifestation of increased intraglomerular capillary pressure" }
    status: unverified
  - id: neph.L13.012
    kind: cloze
    topic: pathogenesis
    text: "Glomerular hyperfiltration is a GFR of {{c1::120 to 180}} mL/min/1.73 m², or more than {{c2::two standard deviations}} above the age-matched mean."
    src: { page: 426, quote: "defined as a GFR from 120 to 180 mL/min/173 m2, or an absolute increase in GFR of more than two standard deviations" }
    status: unverified
    tags: [numbers]
  - id: neph.L13.013
    kind: enumerate
    topic: pathogenesis
    prompt: Four pathways from hyperglycemia to diabetic kidney disease (Figure, p427)?
    points:
      - Renal hemodynamic changes
      - Activation of RAAS
      - Ischemia and inflammation
      - Oxidative stress
    pass: 4
    src: { page: 427, quote: "Renal hemodynamic changes Activation of RAAS Ischemia and Inflammation Oxidative stress" }
    status: unverified
    tags: [high-yield]
  - id: neph.L13.014
    kind: table
    topic: pathogenesis
    title: Hyperglycemia pathways to DKD (Figure, p427)
    columns: [Pathway, Mediators, Result]
    rows:
      - [Renal hemodynamic changes, "IGF-1, TGF-β, VEGF, PG, glucagon, ET-1, SGLT2", "Efferent constriction, glomerular hypertension, hypertrophy, sclerosis"]
      - [Activation of RAAS, "ROS, TGF-β, Ang II, aldosterone", "Podocyte injury, decreased HIF stability, proteinuria"]
      - [Ischemia and inflammation, "AGEs, TNF-α, NF-κB", "Podocyte injury and tubulointerstitial fibrosis"]
      - [Oxidative stress, "JAK/STAT, VEGF, MCP-1", "Tubulointerstitial fibrosis, tubular atrophy, mesangial expansion, ECM accumulation"]
    blanks: [[0, 2], [1, 1], [2, 1], [3, 2]]
    src: { page: 427, quote: "Efferent arteriolar constriction Glomerular hypertension Glomerular hypertrophy Glomerular sclerosis" }
    status: unverified
  - id: neph.L13.015
    kind: order
    topic: pathogenesis
    prompt: Order the hemodynamic chain in the lower figure on p427.
    steps:
      - Increased glucose load on the kidney
      - Increased tubular reabsorption
      - Less NaCl delivered to the distal tubule
      - Initial glomerular hyperfiltration
      - Shear stress on the glomerulus
      - Mesangial matrix expansion, podocyte loss, tubular fibrosis
    src: { page: 427, quote: "Glucose load on kidney Tubule reabsorption NaCl to distal tubule Initial Glomerular hyperfilteration Sheer Stress on glomerulus" }
    status: unverified
  - id: neph.L13.016
    kind: enumerate
    topic: pathogenesis
    prompt: Metabolic pathways fed by oxidative stress in the p427 figure?
    points:
      - Polyol pathway flux
      - AGE formation
      - PKC activation
      - Hexosamine flux
    pass: 3
    src: { page: 427, quote: "Polyol pathway Flux AGE formation PKC Activation Hexosmine Flux" }
    status: unverified
  # ---------- p428-430: pathology ----------
  - id: neph.L13.017
    kind: card
    topic: pathology
    front: Classic light microscopy finding in diabetic nephropathy?
    back: Mesangial expansion from increased mesangial matrix, diffuse at first and nodular later (Kimmelstiel-Wilson nodules).
    src: { page: 428, quote: "Classic findings include mesangial expansion mainly due to increased mesangial matrix, which can be diffuse and, as kidney disease progresses, more typically nodular" }
    status: unverified
    tags: [high-yield]
  - id: neph.L13.018
    kind: card
    topic: pathology
    front: Describe a Kimmelstiel-Wilson nodule.
    back: A round, hypocellular matrix core surrounded by patent capillary loops, like a sunflower.
    src: { page: 428, quote: "The nodules are round with a hypocellular matrix core surrounded by patent capillary loops, resembling a sunflower." }
    status: unverified
    tags: [high-yield]
  - id: neph.L13.019
    kind: card
    topic: pathology
    front: What capillary lesion is often seen with mesangiolysis or nodules?
    back: Microaneurysms of glomerular capillaries.
    src: { page: 428, quote: "Microaneurysms of glomerular capillaries are often seen along with mesangiolysis or nodules." }
    status: unverified
  - id: neph.L13.020
    kind: card
    topic: pathology
    front: Which sclerosis pattern is common in late diabetic nephropathy?
    back: Segmental glomerulosclerosis, especially at the tubular outlet (tip lesion).
    src: { page: 429, quote: "Segmental glomerulosclerosis, especially at the tubular outlet (ie, tip lesion), is common in later stages of diabetic nephropathy." }
    status: unverified
  - id: neph.L13.021
    kind: card
    topic: pathology
    front: Typical immunofluorescence in diabetic nephropathy?
    back: Diffuse linear accentuation of glomerular and tubular basement membranes with IgG (κ and λ) and albumin.
    src: { page: 429, quote: "Diffuse linear accentuation of glomerular and tubular basement membranes with IgG (and κ and λ light chains) and albumin is typical." }
    status: unverified
    tags: [high-yield]
  - id: neph.L13.022
    kind: card
    topic: pathology
    front: Nonspecific immunofluorescence staining in advanced diabetic nephropathy?
    back: Segmental staining of hyaline deposits or sclerotic areas for IgM, C3 and C1q.
    src: { page: 429, quote: "Nonspecific segmental staining of hyaline deposits or glomerular sclerotic regions for IgM, C3, and C1q is common in advanced disease." }
    status: unverified
  - id: neph.L13.023
    kind: card
    topic: pathology
    front: Earliest structural change in diabetic nephropathy on electron microscopy?
    back: Diffuse thickening of the glomerular basement membranes.
    src: { page: 429, quote: "Diffuse thickening of GBMs is usually the earliest structural change." }
    status: unverified
    tags: [high-yield]
  - id: neph.L13.024
    kind: enumerate
    topic: pathology
    prompt: Electron microscopy findings in diabetic nephropathy?
    points:
      - Diffuse GBM thickening (earliest)
      - Thickened tubular basement membranes of nonatrophic tubules
      - Mesangial expansion from matrix accumulation
      - No immune complexes
      - Variable podocyte foot process effacement, especially late
    pass: 4
    src: { page: 429, quote: "Mesangial regions are expanded, predominantly due to accumulation of mesangial matrix. There are no immune complexes." }
    status: unverified
  - id: neph.L13.025
    kind: mcq
    topic: pathology
    stem: A biopsy from a man with 20 years of diabetes shows round acellular nodules ringed by open capillary loops, linear IgG along the GBM, and on EM thick GBMs without deposits. Which statement is true?
    options:
      - These are Kimmelstiel-Wilson nodules; the linear IgG is typical, not anti-GBM disease
      - Linear IgG means anti-GBM disease and needs plasmapheresis
      - Missing immune deposits rule out diabetic nephropathy
      - Nodules are the earliest change of diabetic nephropathy
      - The tip lesion is the earliest EM change
    answer: 0
    why:
      - "Correct: sunflower nodules, linear IgG/albumin accentuation and no immune complexes are classic DN (p428-429)."
      - Linear IgG with albumin is typical of DN (p429).
      - DN has no immune complexes on EM.
      - Nodules come later; GBM thickening is earliest.
      - The tip lesion is a late finding; GBM thickening is earliest.
    src: { page: 429, quote: "Diffuse thickening of GBMs is usually the earliest structural change." }
    status: unverified
  # ---------- p430-431: stages ----------
  - id: neph.L13.026
    kind: table
    topic: stages
    title: Classic stages of DKD
    columns: [Stage, Timing, Key features]
    rows:
      - [Hypertrophy-hyperfunction, "0-2 years", "Big glomeruli and kidneys; GFR >150 mL/min; microalbuminuria reversible with insulin"]
      - [Latent nephropathy, "2-5 years", "GFR normal or high; histologic lesions; microalbuminuria only with exercise or ketosis"]
      - [Microalbuminuria, "5-15 years", "Persistent 30-300 mg/24 h, below dipstick detection; high risk of overt nephropathy"]
      - [Overt nephropathy, "15-25 years", "Proteinuria >0.5 g/day; ESRD 5-10 years later"]
    blanks: [[0, 1], [1, 2], [2, 2], [3, 1], [3, 2]]
    src: { page: 431, quote: "Proteinuria or overt diabetic nephropathy (15-25y) proteinuria (>0.5g/D) associated with ESRD 5-10 years after development of overt nephropathy" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L13.027
    kind: card
    topic: stages
    front: Features of the hypertrophy-hyperfunction stage (0-2 years)?
    back: Increased glomerular and kidney size, hyperfiltration (GFR >150 mL/min), and microalbuminuria reversible with insulin.
    src: { page: 430, quote: "Hypertrophy hyperfunction (0-2y)1. Increased glomerular and kidney size hyperfiltration (GFR>150ml/min)3. Reversible microalbuminuria with insulin therapy." }
    status: unverified
  - id: neph.L13.028
    kind: card
    topic: stages
    front: Which hormonal factors drive the early hyperfunction stage?
    back: Hyperglycemia, glucagon and growth hormone.
    src: { page: 430, quote: "(hyperglycemia, glucagon, growth hormone)" }
    status: unverified
  - id: neph.L13.029
    kind: card
    topic: stages
    front: In latent nephropathy (2-5 years), when may microalbuminuria appear?
    back: Only with exercise or ketosis; GFR is normal or high normal with histological lesions.
    src: { page: 431, quote: "Latent nephropathy (2-5y) GFR normal or high normal histological lesions, microalbuminuria may occur with exercise or ketosis" }
    status: unverified
  - id: neph.L13.030
    kind: cloze
    topic: stages
    text: "Microalbuminuria stage ({{c1::5-15}} years): persistent {{c2::30-300 mg/24 hour}}, below dipstick detection."
    src: { page: 431, quote: "Microalbuminuria (5-15years) persisten microalbuminuria ( 30-300 mg/24 hour below limit of detection by dipsticks)" }
    status: unverified
    tags: [numbers]
  - id: neph.L13.031
    kind: cloze
    topic: stages
    text: "Overt nephropathy ({{c1::15-25}} years): proteinuria above {{c2::0.5 g/day}}, with ESRD {{c3::5-10 years}} later."
    src: { page: 431, quote: "Proteinuria or overt diabetic nephropathy (15-25y) proteinuria (>0.5g/D) associated with ESRD 5-10 years after development of overt nephropathy" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L13.032
    kind: card
    topic: stages
    front: How can the course differ in type 2 diabetes?
    back: It may be shorter; patients may present with established nephropathy, hypertension and falling kidney function, and nephrotic syndrome may occur.
    src: { page: 431, quote: "In type II course may be shorter and patients may present with established nephropathy, hypertension and progressive loss of renal function" }
    status: unverified
  - id: neph.L13.033
    kind: card
    topic: stages
    front: Do most diabetics follow the classic albuminuric course?
    back: "No: many T1DM and most T2DM do not; many have CKD without albuminuria, and albuminuria can regress."
    src: { page: 431, quote: "Many patients with T1DM and most with T2DM do not follow the classic course of DKD." }
    status: unverified
    tags: [high-yield]
  - id: neph.L13.034
    kind: card
    topic: stages
    front: What does regression of albuminuria in diabetes tell us?
    back: Raised urinary albumin excretion does not necessarily mean progressive nephropathy.
    src: { page: 431, quote: "indicating that elevated urinary albumin excretion does not imply progressive nephropathy" }
    status: unverified
  # ---------- p431-432: screening ----------
  - id: neph.L13.035
    kind: cloze
    topic: screening
    text: "Screen for DKD {{c1::annually}}: from {{c2::diagnosis}} in T2DM and from {{c3::5 years after onset}} in T1DM."
    src: { page: 431, quote: "Annually screening for DKD is recommended from the time of diagnosis of T2DM and 5 years after the onset of T1DM." }
    status: unverified
    tags: [high-yield]
  - id: neph.L13.036
    kind: card
    topic: screening
    front: Can a urine dipstick detect microalbuminuria?
    back: "No: microalbuminuria (30-300 mg/24 h) is below the dipstick's limit of detection."
    src: { page: 431, quote: "persisten microalbuminuria ( 30-300 mg/24 hour below limit of detection by dipsticks)" }
    status: unverified
  - id: neph.L13.037
    kind: enumerate
    topic: screening
    prompt: Three ways to screen for microalbuminuria?
    points:
      - 24-hour collection with creatinine (gives creatinine clearance too)
      - Timed (4-hour or overnight) collection
      - Albumin/creatinine ratio on a random spot sample
    pass: 3
    src: { page: 431, quote: "Timed (four-hour or overnight) collection; or measurement of the albumin/creatinine ratio in a random spot collection." }
    status: unverified
  - id: neph.L13.038
    kind: cloze
    topic: screening
    text: "Microalbuminuria needs {{c1::two of three}} ACR samples over {{c2::3-6 months}} to be {{c3::30-300 mg/g}}."
    src: { page: 432, quote: "must be abnormal (30 mg albumin per g creatinine to 300 mg albumin per g creatinine) before diagnosis of microalbuminuria can be made." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L13.039
    kind: card
    topic: screening
    front: Why must two of three ACR samples be abnormal?
    back: Because urinary albumin excretion varies.
    src: { page: 431, quote: "Because of variability in urinary albumin excretion, two of three urine albumin/creatinine ratio specimens" }
    status: unverified
  - id: neph.L13.040
    kind: cloze
    topic: screening
    text: "Macroalbuminuria (more than {{c1::300 mg/g}}) on a {{c2::single}} sample confirms the diagnosis without complicating factors."
    src: { page: 432, quote: "Macroalbuminuria (more than 300 mg per g) on a single sample can confirm diagnosis in the absence of complicating factors." }
    status: unverified
    tags: [numbers]
  - id: neph.L13.041
    kind: card
    topic: screening
    front: Besides albuminuria, what else must DKD screening include?
    back: Serum creatinine and eGFR, calculated with the CKD-EPI equation.
    src: { page: 432, quote: "Screening for DKD should also include measurement of serum creatinine and eGFR." }
    status: unverified
  - id: neph.L13.042
    kind: cloze
    topic: screening
    text: "In the CKD-EPI creatinine equation, κ is {{c1::0.7}} for females and {{c2::0.9}} for males."
    src: { page: 432, quote: "κ is 0.7 for females and 0.9 for males, α is -0.329 for females and - 0.411 for males" }
    status: unverified
    tags: [numbers]
  - id: neph.L13.043
    kind: card
    topic: screening
    front: Which variables does the CKD-EPI creatinine equation in the lecture use?
    back: Serum creatinine, age, sex (female factor 1.018) and race (black factor 1.159).
    src: { page: 432, quote: "1.018 [if female] × 1.159 [if black]" }
    status: unverified
    update:
      text: "The 2021 CKD-EPI creatinine equation removed race; KDIGO 2024 recommends it. Write the book's equation in the exam."
      ref: "CKD-EPI 2021; KDIGO 2024 CKD guideline"
  - id: neph.L13.044
    kind: card
    topic: screening
    front: Which serum marker does the lecture call more accurate than creatinine?
    back: Cystatin C (with its own CKD-EPI cystatin C equation).
    src: { page: 432, quote: "Cystatin C was a more accurate serum marker than serum creatinine." }
    status: unverified
  - id: neph.L13.045
    kind: mcq
    topic: screening
    stem: A 52-year-old with T2DM for 3 years has a spot ACR of 85 mg/g at a routine visit. eGFR 92. What is the right conclusion?
    options:
      - Repeat the ACR; two of three samples over 3-6 months must be 30-300 mg/g
      - Diagnose DKD now from this single result
      - Diagnose macroalbuminuria
      - Ignore it; screening starts 5 years after diagnosis in T2DM
      - Order a kidney biopsy
    answer: 0
    why:
      - "Correct: albumin excretion varies, so microalbuminuria needs 2 of 3 abnormal samples over 3-6 months (p431-432)."
      - One microalbuminuric sample is not enough.
      - Macroalbuminuria is >300 mg/g.
      - In T2DM screening starts at diagnosis; the 5-year delay is for T1DM.
      - Nothing here suggests an alternative diagnosis.
    src: { page: 431, quote: "Because of variability in urinary albumin excretion, two of three urine albumin/creatinine ratio specimens collected over a three- to six-month period" }
    status: unverified
  - id: neph.L13.046
    kind: mcq
    topic: screening
    stem: A 19-year-old was diagnosed with type 1 diabetes 2 years ago. When should annual DKD screening begin?
    options:
      - 5 years after the onset of diabetes
      - Now, at once
      - At age 30
      - Only when hypertension appears
      - Only after retinopathy is found
    answer: 0
    why:
      - "Correct: T1DM screening starts 5 years after onset (p431)."
      - Immediate screening is for T2DM.
      - Age is not the trigger.
      - Hypertension is not the trigger.
      - Retinopathy is not the trigger.
    src: { page: 431, quote: "Annually screening for DKD is recommended from the time of diagnosis of T2DM and 5 years after the onset of T1DM." }
    status: unverified
  # ---------- p437: lab evaluation and alternatives ----------
  - id: neph.L13.047
    kind: table
    topic: alternative
    title: Laboratory evaluation of DKD (Table 2)
    columns: [Test, Microalbuminuria, Macroalbuminuria]
    rows:
      - [24-hour urine, "30-300 mg/24 h", ">300 mg/24 h"]
      - [Spot urine ACR, "30-300 mg/g", ">300 mg/g"]
      - [Timed 4-hour or overnight urine, "20-200 mcg/min", ">200 mcg/min"]
    blanks: [[0, 1], [1, 1], [2, 1], [2, 2]]
    src: { page: 437, quote: "Laboratory Evaluation of Diabetic Kidney Disease" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L13.048
    kind: card
    topic: alternative
    front: According to Table 2, when is a renal biopsy performed in diabetes, and what does it show?
    back: If the cause of kidney disease is unclear (it risks bleeding); EM shows GBM thickening, LM shows mesangial expansion and Kimmelstiel-Wilson nodules.
    src: { page: 437, quote: "Performed if unclear etiology of kidney disease Procedure has risks of complication, especially bleeding" }
    status: unverified
  - id: neph.L13.049
    kind: card
    topic: alternative
    front: Per Table 2, how does eGFR behave over the course of DKD?
    back: Hyperfiltration raises eGFR early, then it falls as disease progresses.
    src: { page: 437, quote: "Hyperfiltration occurs early in disease with eGFR, then continues to decrease as disease progresses" }
    status: unverified
  - id: neph.L13.050
    kind: enumerate
    topic: alternative
    prompt: Conditions that give a falsely abnormal albumin/creatinine ratio?
    points:
      - Congestive heart failure
      - Exercise within 24 hours of testing
      - Fever
      - Infection
      - Marked hyperglycemia
      - Menstruation
    pass: 5
    src: { page: 437, quote: "Congestive heart failure Exercise within 24 hours of testing Fever Infection Marked hyperglycemia Menstruation" }
    status: unverified
    tags: [high-yield]
  - id: neph.L13.051
    kind: enumerate
    topic: alternative
    prompt: When should you consider a cause of albuminuria other than DKD?
    points:
      - Absence of diabetic retinopathy
      - Low or rapidly decreasing GFR
      - More than 30% fall in GFR within 2-3 months of starting ACEi or ARB
      - Active urinary sediment
      - Rapidly increasing proteinuria or nephrotic syndrome
      - Refractory hypertension
      - Signs or symptoms of another systemic disease
    pass: 5
    src: { page: 437, quote: "Absence of diabetic retinopathy Low or rapidly decreasing GFR More than 30% reduction in GFR within two to three months" }
    status: unverified
    tags: [high-yield]
  - id: neph.L13.052
    kind: cloze
    topic: alternative
    text: "A GFR fall of more than {{c1::30%}} within {{c2::two to three months}} of starting an ACEi or ARB should prompt a search for another diagnosis."
    src: { page: 437, quote: "More than 30% reduction in GFR within two to three months Of initiation of ACE inhibitor or ARB" }
    status: unverified
    tags: [numbers]
  - id: neph.L13.053
    kind: mcq
    topic: alternative
    stem: A 48-year-old with T2DM for 2 years has nephrotic-range proteinuria that rose over 3 months, red cell casts, and no retinopathy on fundoscopy. What is the best next step?
    options:
      - Kidney biopsy for an alternative diagnosis
      - Label it DKD and add finerenone
      - Repeat ACR in 6 months
      - Start an SGLT2 inhibitor and reassess yearly
      - Order cystatin C
    answer: 0
    why:
      - "Correct: no retinopathy, active sediment and rapidly rising proteinuria suggest another cause; biopsy is for unclear etiology (p437)."
      - These red flags argue against DKD.
      - Waiting delays a treatable diagnosis.
      - Treats DKD without excluding something else.
      - Cystatin C measures GFR, not the cause.
    src: { page: 437, quote: "Presence of active urinary sediment Rapidly increasing proteinuria or nephrotic syndrome Refractory hypertension" }
    status: unverified
  - id: neph.L13.054
    kind: mcq
    topic: alternative
    stem: A man with T2DM gives a spot urine sample the morning after a marathon. ACR is 70 mg/g; he also has a fever from flu. What do you do?
    options:
      - Repeat the test after recovery and no exercise for 24 hours
      - Diagnose microalbuminuria
      - Start an ACE inhibitor today
