    status: unverified
  - id: rheum.L20.079
    kind: card
    topic: treatment
    front: First-line therapy for severe peripheral PsA (erosive with functional limitation)?
    back: A TNF inhibitor, to limit joint damage and restore function faster; secukinumab or ustekinumab is an alternative.
