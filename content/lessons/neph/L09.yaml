  - id: neph.L09.lesson6
    title: "الزراعة: الأرقام، ومين ينفع يزرع"
    hook: "الكلية المزروعة بتعيش 14 سنة في المتوسط من متبرع حي. بس مش كل عيان ينفع يستقبلها."
    minutes: 9
    pages: [318, 322]
    topics: [tx-outcome, tx-recipient]
    goals:
      - "تعرف ليه الزراعة treatment of choice، وأرقام الـ survival"
      - "تفرّق الـ absolute من الـ relative contraindications"
      - "تعرف الأمراض اللي بترجع واللي لازم تهدى قبل الزراعة"
    status: unverified
    steps:
      - kind: explain
        page: 318
        title: "ليه الزراعة أحسن من الغسيل؟"
        quote: "Transplantation is the treatment of choice for advanced stages of CKD, with improved quality of life and life expectancy compared to being on dialysis."
        text: |
          الكتاب: الزراعة ==treatment of choice== للـ CKD المتقدم، بـ **quality of life** و **life expectancy** أحسن من الغسيل.

          ليه؟ التفسير المقبول (مش في الكتاب): الغسيل بيعوّض **جزء** من شغل الكلية: بيشيل toxins ومية كام ساعة في الأسبوع. الكلية المزروعة شغالة **24 ساعة**، وبتعمل كمان اللي الغسيل ما بيعملوش:
          - **erythropoietin**، فالأنيميا تتحسن.
          - **activated vitamin D**، فالعظم والـ phosphate يتظبطوا.
          - تنضيف مستمر من غير طلوع ونزول في الـ volume والـ K، فالقلب يرتاح.
          والعيان بيخرج من جدول الوحدة 3 مرات في الأسبوع، فيرجع لشغله وحياته. التمن: immunosuppression مدى الحياة، وده هنشوف عيوبه في آخر المحاضرة.

          وليه الأرقام دي مهمة للعيان؟ التفسير المقبول (مش في الكتاب): لما تكلم العيان عن الاختيار، الـ half-life معناها إن نص الكلى المزروعة لسه شغالة بعد 10–14 سنة. يعني الشاب ممكن يحتاج زراعة تانية في حياته، وده بيخلّي حماية الكلية الأولى (الالتزام بالأدوية، الضغط، السكر) أهم حاجة. والـ antibodies اللي بتتكون بعد رفض الأولى بتصعّب التانية، فالخسارة مش بس كلية.
      - kind: explain
        page: 319
        title: "الأرقام"
        quote: "With improvement of immunosuppressive treatment one y graft survival >90% in living or cadaveric transplant. Long term survival is not much impressive half life expectancy for living or deceased donor graft is around 14,10y respectively. Recently with tailoring of IS regimen and desensitization protocols a more liberal selection of potential kidney transplant recipient including ;high- risk category patients example human immunodeficiency virus (HIV)- positive, highly sensitized patients, T-cell positive cross-match, and ABO blood group-incompatible."
        text: |
          الزراعة ==treatment of choice== للـ chronic kidney disease (CKD) المتقدم: حياة أحسن وعمر أطول.

          - **One-year graft survival** أكتر من 90%.
          - **Half-life**: ==14 سنة living==، **10 سنين deceased**.
          - الوفيات أعلى في **أول سنة**، حوالي 7% في سن 50–60.
          - الوفاة مع كلية شغالة: **cardiovascular disease (CVD)، infection، malignancy**.
          - الـ chronic graft dysfunction (fibrosis، tubular atrophy، vasculopathy، glomerulopathy) أساسًا من الـ **chronic rejection**.

          ودلوقتي بنزرع ناس high-risk: human immunodeficiency virus (HIV)، highly sensitised، T-cell positive cross-match، و ABO-incompatible.

          ليه الـ living بيعيش أكتر من الـ deceased؟ التفسير المقبول (مش في الكتاب): الكلية من متبرع حي بتتاخد من شخص سليم، والعملية مخططة، فالـ **cold ischaemia** دقايق، والكلية ما بتتعرضش لـ brain death (اللي بيعمل عاصفة inflammatory في الجسم كله) ولا لهبوط ضغط قبل الوفاة. فبتبدأ شغالة من أول يوم. وليه الوفيات أعلى في أول سنة؟ لأن الـ immunosuppression في أعلى جرعاته، فالعدوى في أعلاها، والعملية نفسها جهد على قلب غالبًا تعبان.
      - kind: figure
        page: 319
        title: "الـ survival بينزل بعد أول سنة"
        image: { file: neph/L09-graft-survival.webp, book: true }
        alt: "Bar chart titled long-term patient and graft survival after renal transplant remains a challenge: patient and graft survival at 1 year 97.1 and 94.7 percent, at 3 years 92.9 and 87.9, at 5 years 86.3 and 78.6, with a red line sloping down; source Organ Procurement and Transplantation Network report 2008-2015."
        caption: |
          الشارت اللي في نفس الصفحة:

          - **العواميد الزرقا** = الـ patient survival، و**الرمادي** = الـ ==graft survival==.
          - **سنة**: 97.1% و 94.7%. **3 سنين**: 92.9% و 87.9%. **5 سنين**: 86.3% و ==78.6%==.
          - **الخط الأحمر** نازل: الاتنين بيقلّوا كل سنة.

          اللي تاخده: الـ graft بيقع أسرع من العيان نفسه، والسبب الأساسي على المدى الطويل الـ chronic rejection.
      - kind: explain
        page: 320
        title: "الـ absolute contraindications"
        quote: "Severe chronic pulmonary disease. Cardiac failure resistant to treatment severe peripheral vascular disease severe neuropathy with trophic ulcer.Advanced liver disease.Active infection or active GN or vasculitis uncorrectable lower urinary tract problems. Immunologic: Positive CDC at time of transplantation."
        text: |
          الكلية بتتحط **extraperitoneal في الـ inguinal fossa**، والعيان ممكن يخرج بعد أسبوع.

          **Absolute**:
          - ==Malignancy== (إلا لو خالي من رجوع سنين، أو prostate Gleason ≤6، أو renal tumour ≤1 cm بالصدفة).
          - Severe chronic lung disease، heart failure مقاوم، severe peripheral vascular disease (PVD)، neuropathy بـ trophic ulcer.
          - Advanced liver disease.
          - Active infection أو active glomerulonephritis (GN) أو vasculitis.
          - Lower urinary tract مش بيتصلّح.
          - ==Positive complement dependent cytotoxicity (CDC) cross-match== وقت الزراعة.

          **Relative**: morbid obesity، atherosclerosis، قلب، hypertension (HTN) مش منضبط، تدخين، مشاكل نفسية، systemic disease نشط (lupus، sickle cell).

          ليه دي مطلقة؟ التفسير المقبول (مش في الكتاب): الـ immunosuppression بيكتم المناعة اللي بتسيطر على **السرطان** و **العدوى**، فالسرطان النشط هيجري، والعدوى النشطة هتبقى sepsis. والقلب والرئة والكبد المتقدمين: العيان مش هيستحمل العملية، أو هيموت من المرض ده قبل ما يستفيد من الكلية. والـ GN النشط: هيضرب الكلية الجديدة على طول. والـ **CDC موجب** = antibodies جاهزة هتقتل الكلية في دقايق (hyperacute). أما الـ relative فحاجات ممكن تتظبط قبل العملية.

          وليه العيان بيتفحص للـ coronary disease بعدوانية؟ التفسير المقبول (مش في الكتاب): أغلب عيانين الـ ESRD عندهم سكر وضغط وسنين غسيل، فالـ coronary disease منتشرة ومستخبية (من غير angina لأن الأعصاب متأثرة). والعملية والـ immunosuppression جهد كبير، وأشهر سبب للموت مع كلية شغالة هو **CVD**. فالـ stress test أو الـ angiography قبل الزراعة بيمنع إن الكلية تعيش والعيان يموت.
      - kind: sort
        page: 320
        quote: "Relative contraindications: morbid obesity, atherosclerosis, cardiac disease, uncontrolled hypertension, smoking, unresolved psychological issues Active systemic disease (ie, lupus, sickle cell disease, wagn)"
        prompt: "Absolute ولا relative؟"
        bins: ["Absolute", "Relative"]
        cards:
          - { text: "Positive CDC cross-match", bin: 0 }
          - { text: "Active infection", bin: 0 }
          - { text: "Advanced liver disease", bin: 0 }
          - { text: "Smoking", bin: 1 }
          - { text: "Morbid obesity", bin: 1 }
          - { text: "Uncontrolled hypertension", bin: 1 }
        why: "الـ absolute: CDC موجب، عدوى نشطة، كبد متقدم، سرطان نشط، قلب أو رئة متقدمة. الـ relative حاجات ممكن تتظبط: تدخين، وزن، ضغط."
      - kind: explain
        page: 321
        title: "الأمراض اللي بترجع"
        quote: "Focal segmental glomerulosclerosis (FSG), membranous nephropathy (MN), IGA nephropathy and vasculitis, immune complex (IC) mediated membranoglomerulonephritis IC MPGN) and C3 glomerulopathy."
        text: |
          بترجع في الكلية الجديدة: ==focal segmental glomerulosclerosis (FSGS)==، membranous، **immunoglobulin A (IgA)**، vasculitis، IC-MPGN، و C3 glomerulopathy.

          ولازم تكون **هادية قبل الزراعة**: systemic lupus erythematosus (SLE)، antineutrophil cytoplasmic antibodies (ANCA) vasculitis، و antiphospholipid syndrome.

          **Urology (KDIGO 2020)**: اتأكد لو فيه urologic malignancy، urinary tract infection (UTI) متكرر، voiding dysfunction، bladder augmentation، ileal conduit، أو حصوات. و **cystoscopy** للي عنده خطر bladder cancer (cyclophosphamide أو تدخين ≥30 pack-years).

          ليه الأمراض دي بترجع؟ التفسير المقبول (مش في الكتاب): السبب **مش في الكلية القديمة**، السبب في **الدم**: permeability factor في الـ FSGS، anti-PLA2R في الـ membranous، IgA غلط في الـ IgA nephropathy، complement منفلت في الـ C3G. الكلية الجديدة بتقابل نفس الدم، فالمرض يرجع. عشان كده الـ FSGS الراجع بيتعالج بالـ plasma exchange (يشيل الـ factor). وليه الـ cystoscopy للي خد cyclophosphamide أو بيدخن؟ لأن الاتنين بيعملوا bladder cancer، والـ immunosuppression هيسرّعه.
      - kind: mnemonic
        page: 321
        quote: "Focal segmental glomerulosclerosis (FSG), membranous nephropathy (MN), IGA nephropathy and vasculitis, immune complex (IC) mediated membranoglomerulonephritis IC MPGN) and C3 glomerulopathy."
        word: "FIMVC"
        parts:
          - { key: "F", text: "FSGS" }
          - { key: "I", text: "IgA nephropathy" }
          - { key: "M", text: "Membranous and MPGN (immune complex)" }
          - { key: "V", text: "Vasculitis" }
          - { key: "C", text: "C3 glomerulopathy" }
        hook: |
          "**F**ine, **I** **M**ay **V**isit **C**airo": الأمراض دي بتزور الكلية الجديدة تاني.
      - kind: check
        page: 322
        quote: "SLE, cytoplasmic antibody (ANCA)-associated vasculitis, antiphospholipid syndrome (APS)."
        question: "A patient with ESRD from ANCA vasculitis is listed for transplant. What does the book require first?"
        options:
          - "The disease must be quiescent before transplant"
          - "Nothing; ANCA never recurs"
          - "Bilateral nephrectomy"
          - "Plasma exchange for every patient"
        answer: 0
        why:
          - "صح: الـ SLE والـ ==ANCA vasculitis== والـ antiphospholipid syndrome لازم يكونوا **quiescent** قبل الزراعة، لأن النشاط بيضرب الكلية الجديدة."
          - "الـ vasculitis في قايمة الأمراض اللي بترجع."
          - "الكتاب ما طلبش كده."
          - "الكتاب طلب إن المرض يهدى، مش plasma exchange للكل."
      - kind: figure
        page: 322
        quote: "Recommendations for initial and follow-up screening of viral and non-viral pathogens in kidney transplant candidates."
        title: "الـ screening للعدوى قبل الزراعة"
        image: { file: neph/L09-infection-screening.webp, book: true }
        alt: "Table of screening for viral and non-viral pathogens in kidney transplant candidates, with columns pathogen, test and repeat testing: HIV, HCV, HBV, CMV, EBV, HSV, VZV, measles-mumps-rubella and HTLV by IgG or antigen tests; syphilis, strongyloides, Chagas disease, tuberculosis by skin test or interferon-gamma release assay, and malaria by blood smear."
        caption: |
          جدول مطبوع كصورة، 3 عواميد: الـ pathogen، الـ test، وامتى نكرره:

          - **Viral** (فوق): HIV و HCV و HBV (Anti-HBs، Anti-HBc، HBsAg)، و ==CMV== و EBV و HSV و VZV و MMR و HTLV. أغلبهم IgG، ولو سلبي يتكرر وقت الزراعة.
          - **Non-viral** (تحت): syphilis، strongyloides، Chagas، ==tuberculosis== (tuberculin skin test أو interferon-gamma release assay)، و malaria (blood smear).
          - **VZV و MMR**: لو سلبي نطعّم ونعيد بعد 4 أسابيع.

          اللي تاخده: الـ IgG السلبي معناه إن العيان معرّض لعدوى أولية بعد الـ immunosuppression، فنطعّم قبل الزراعة.
      - kind: try
        items: [neph.L09.112, neph.L09.113, neph.L09.118, neph.L09.122, neph.L09.123]
    recap:
      - "الزراعة treatment of choice: حياة أحسن وعمر أطول."
      - "One-year survival > 90%؛ half-life 14 سنة living و 10 deceased."
      - "Absolute: malignancy، قلب أو رئة أو كبد متقدم، عدوى أو GN نشط، urinary tract مش بيتصلّح، CDC موجب."
