        why: "الـ EUS superior to CT or magnetic resonance imaging (MRI) for depth، بس صعب يفرّق T2 من T3، وعنده overstaging 10-15%. الـ CT أحسن للأعضاء اللي جنبه. وكل الـ tests بتقيس حجم الـ node بس، و50-75% من الـ nodes المصابة حجمها طبيعي."
