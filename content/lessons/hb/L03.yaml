  - id: hb.L03.lesson4
    title: "قبل أول نزيف: beta-blocker ولا رباط؟"
    hook: "الـ carvedilol بيقفل الحنفية ويرخّي الصباع في نفس الوقت. وإمتى الـ EBL يكسب؟"
    minutes: 9
    pages: [45, 48]
    topics: [primary-prophylaxis]
    goals:
      - "تعرف إن مفيش pre-primary prophylaxis بالـ beta-blockers في الكتاب"
      - "تختار بين NSBB و EBL في الـ primary prophylaxis"
      - "تربط كل علاج بالـ R أو الـ F في المعادلة"
      - "تشرح ميزة الـ carvedilol، تعريف الـ haemodynamic response، وجرعته"
    status: unverified
    steps:
      - kind: explain
        page: 45
        title: "Cirrhosis من غير varices"
        text: |
          الكتاب (**Conclusion I**):

          - **No specific pre-primary prophylaxis**
          - **Treat the underlying liver disease**
          - **Follow-up endoscopy after 2–3 years**

          والأهم: **beta-blockers cannot be recommended to prevent the formation of varices** (صفحة 46). يعني ما تدّيش propranolol لواحد معندوش دوالي علشان «ما تطلعش».
      - kind: update
        page: 46
        text: "Baveno VII بيدّي **NSBB (carvedilol preferred)** لأي compensated cirrhosis عنده **CSPH** علشان يمنع الـ **decompensation**، سواء فيه varices ولا لأ. بس برضه مش علشان «يمنع تكوين الـ varices» في مريض معندوش CSPH. في الامتحان: الكتاب بيقول beta-blockers cannot be recommended to prevent the formation of varices."
        ref: "Baveno VII consensus, 2021"
      - kind: explain
        page: 45
        title: "الـ primary prophylaxis"
        text: |
          - **No indication to treat patients without varices.**
          - **Small varices:** could be treated، **specially لو فيه red colour signs و/أو Child C**. والباقيين ممكن يتعالجوا علشان يمنعوا النمو، بس **further studies are needed**.
          - **Moderate or large varices:** **beta-blockers = treatment of choice**، و **EBL** للي عندهم **contraindications أو intolerance** للـ beta-blockers.

          **Baveno IV (2005)** للـ medium/large varices:
          - **NSBBs** بتقلل خطر أول نزيف.
          - **Prophylactic EBL** مفيد.
          - **EBL أكثر فاعلية** من الـ NSBB في منع أول نزيف، **بس ما بيحسّنش الـ survival**، والـ long-term benefit مش أكيد لأن الـ follow-up كان قصير.
      - kind: reveal
        page: 46
        prompt: "الـ EBL بيمنع النزيف أحسن... طب ليه ما بيحسّنش الـ survival؟"
        answer: |
          لأن الـ EBL **علاج موضعي**: بيربط الوريد اللي قدامك، بس **الـ portal pressure اللي وراه زي ما هو**.

          الـ NSBB بيقلل الـ **F** في المعادلة، فبينزّل الضغط **في كل حتة**: مش بس الـ varices، كمان باقي مضاعفات الـ PH. (ده المنطق الفسيولوجي، الكتاب بيدّيك النتيجة بس.)
