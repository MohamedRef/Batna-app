    status: unverified
    steps:
      - kind: explain
        page: 90
        quote: "Tumor of α-cells → excess glucagon. Typically arises in the pancreatic tail. Often malignant with liver metastases."
        title: "الـ glucagonoma"
        text: |
          ورم الـ **α-cells**، غالبًا في الـ **tail**، وكتير malignant بـ liver mets. كبار السن، ستات شوية أكتر.

          - البصمة: ==necrolytic migratory erythema== (NME)، rash كتير بيتشخص غلط.
          - Diabetes خفيف لمتوسط، weight loss، glossitis/cheilitis/stomatitis، diarrhoea، **thromboembolism**، أعراض نفسية، zinc و amino acids واطيين.
          - التشخيص: glucagon **أكتر من 500 pg/mL**.
      - kind: reveal
        page: 90
        quote: "Nutritional support (zinc, amino acids) may help NME."
        prompt: "ليه الـ zinc والـ amino acids ممكن يحسّنوا الـ rash؟"
        answer: "الـ glucagon الكتير بيحرق الـ amino acids في الـ gluconeogenesis، والجلد بيتغذى عليها، ومع الـ zinc الواطي الجلد بيتكسّر. التعويض بيساعد الـ NME، مع الجراحة أو الـ SSA أو الـ chemo أو الـ embolization."
      - kind: aside
        tone: tip
        page: 90
        quote: "Necrolytic migratory erythema (NME): hallmark rash, often misdiagnosed"
        text: "احفظها كده: الـ glucagonoma هو الـ **4D**: Dermatitis (NME)، Diabetes، DVT، Depression. كلهم موجودين في قايمة الكتاب."
      - kind: explain
        page: 91
        quote: "Causes watery diarrhea, marked hypokalemia. 80% are associated with the pancreas."
        title: "الـ VIPoma = WDHA"
        text: |
          **Verner-Morrison** أو ==WDHA==: Watery Diarrhoea، Hypokalaemia، Achlorhydria.

          - **80% في البنكرياس**، وكمان lung و ganglioneuromas. أكتر من 80% malignant.
          - Metastasis حوالي **70%**، و complete resection ← **95% 5-year**.
          - إسهال secretory من **3 لـ 20 لتر في اليوم**.
          - كمان: hypomagnesaemia، **hypercalcaemia**، acidosis، dehydration، flushing أحيانًا، **flaccid distended gallbladder**، ileus.
          - Marker: plasma VIP **أكتر من 200 pg/ml**.
