            <path d="M90 222v54" class="fg-arrow" marker-start="url(#L06b)" marker-end="url(#L06a)"/>
            <text x="100" y="246" class="t-sm t-acc">activation of</text>
            <text x="100" y="262" class="t-sm t-acc">hepatic stellate cells</text>
            <rect x="20" y="280" width="140" height="40" rx="8" class="fg-box"/>
            <text x="90" y="305" text-anchor="middle" class="t-b">Fibrosis</text>
            <path d="M90 324v34" class="fg-arrow-bad" marker-end="url(#L06c)"/>
            <rect x="20" y="362" width="140" height="40" rx="8" class="fg-bad"/>
