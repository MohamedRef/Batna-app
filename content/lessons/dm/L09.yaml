    topics: [sglt2, algorithm]
    goals:
      - "تفهم الكلى بتتعامل مع الـ glucose إزاي وإيه اللي بيتغير في T2DM"
      - "تحفظ مزايا وأعراض وموانع الـ SGLT2i وقاعدة الـ eGFR 45 و 20"
      - "تقرا الـ ADA 2025 figure وتصنّف الأدوية بالوزن والـ hypoglycemia والـ efficacy"
    status: unverified
    steps:
      - kind: explain
        page: 120
        title: "الكلى والسكر"
        quote: "In normal renal glucose handling, 90% of glucose is reabsorbed by SGLT2 in the S1 and S2 segments of the renal proximal convoluted tubules."
        text: |
          الكلى بتفلتر لحد **180 g glucose** في اليوم، وبترجّعه كله:
          - ==SGLT2== في الـ **S1 و S2**: حوالي **90%** (high capacity، low affinity).
          - **SGLT1** في الـ S3: حوالي **10%** (low capacity، high affinity).

          الـ **renal threshold** الطبيعي **180 mg/dl**. في T2DM بيعلى لـ **240** أو أكتر، لأن الـ SGLT2 بيزيد، فالكلى بتحافظ على السكر العالي بدل ما ترميه.
      - kind: figure
        page: 121
