        quote: "Bone radiography reveals generalized osteopenia, which most commonly affects the hands. Intra-articular calcifications often are observed."
        text: |
          - **Renal crisis:** ==Angiotensin-converting enzyme (ACE) inhibitors== ← antihypertensives ← dialysis ← renal transplant
          - **Advanced multisystem:** Antithymocyte globulin (ATG)، antilymphocyte globulin (ALG)، MMF، و autologous stem cell transplant
          - **Bone X-ray:** **generalized osteopenia** أكتر في الإيدين، و intra-articular calcifications

          السبب ورا ترتيب علاج الـ renal crisis في الخطوة اللي فاتت. والـ osteopenia في الإيدين بالذات منطقية لأن الإيدين فيها Raynaud و ischemia ومفاصل ملتهبة (التفسير المقبول، مش في الكتاب).
