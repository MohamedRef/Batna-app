    src: { page: 469, quote: "Complete blood count: hemoglobin and platelet\nPeripheral blood smear and Coombs' test\nDisseminated intravascular coagulopathy: prothrombin time, activated partial thromboplastin time, D-dimer, fibrinogen degradation products\nSerum haptoglobin, lactate dehydrogenase\nEnd organ damage survey: serum creatinine, blood urea nitrogen, CK-MB, troponin-I, amylase, lipase, alanine transaminase, bilirubin\nExclude thrombotic thrombocytopenic purpura:\n  ADAMTS13 activity\nDifferentiate secondary thrombotic microangiopathy:\n  Autoimmune diseases: C3, C4, anti-nuclear antibody, anti-cardiolipid antibody, anti-Scl70, anti-β2-microglobulin\n  Infectious diseases: stool Shiga-toxin or culture for Shiga toxin-producing E.coli (STEC), urine pneumococcal antigen, serum T-antigen, anti-HIV antibody\n  Inborn error of metabolism: serum homocysteine, vitamin B12, urine organic acids\n  Serum complement assays: Serum CFH, CFI, CFB, C3, C4; Serum C5b-9; Serum CH50/AH50\n  Serum complement auto-antibody: Anti-CFH Antibody\n  Molecular analysis: Complement-associated genes: CFH, CFI, VTR, C3, CFB, MCP, CFHR5, CFH/CFHR1 hybrid allele, CFHR1/CFHR4 deletion, CFHR3/CFHR1 deletion, C8B, C9, MASP1; Coagulation-associated genes: THBD, PLG, CD36, VWF; Others: DGKE, VTN" }
    status: unverified
