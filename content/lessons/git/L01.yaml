          - "نفس الكلام، أكتر من 80% CYP2C19."
          - "الـ pantoprazole كمان من الـ 80%، بس مش بيمنع الـ CYP2C19 (ده موضوع الـ clopidogrel)."
      - kind: figure
        page: 33
        quote: "CYP2C19 is inhibited by omeprazole and esomeprazole, which normally convert clopidogrel to its active form, thereby decreasing its blood levels."
        title: "التفاعلات من 3 أبواب"
