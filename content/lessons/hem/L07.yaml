        text: |
          لمدة ==2–3 years==:
          - **Prednisone 40–60** أو dexamethasone 6 mg/m2/day لمدة **5 أيام كل 28 يوم**
          - **Vincristine** 1.4 mg/m2 (max 2 mg) كل 4 أسابيع
          - **6-MP** 75 mg/m2 يوميًا بالليل
          - ==Methotrexate== 20 mg/m2 بالبق **مرة في الأسبوع**

          ليه سنين؟ التفسير المقبول (مش في الكتاب): الـ lymphoblasts ممكن تفضل نايمة بأعداد صغيرة، فالـ maintenance الخفيف الطويل بيصطادها كل ما تحاول تتقسم. وخلي بالك: الـ methotrexate **أسبوعي** مش يومي.
