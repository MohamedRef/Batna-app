            <text x="281" y="205" text-anchor="middle" class="t-sm t-b">H</text>
            <text x="311" y="205" text-anchor="middle" class="t-sm t-b">K</text>
            <text x="165" y="255" text-anchor="middle" class="t-sm">Top = primary organ, bottom = secondary</text>
            <text x="165" y="278" text-anchor="middle" class="t-sm t-mut">1–2 cardiorenal, 3–4 renocardiac, 5 both</text>
          </svg>
      - kind: aside
        tone: tip
        page: 68
        quote: "Type 3 (acute renocardiac) AKI leading to cardiac impairment"
        text: |
          الاسم نفسه بيقولك مين بدأ: **cardio-renal** = القلب الأول، **reno-cardiac** = الكلى الأول.

          وبعدين **فردي = acute** (1 و 3) و **زوجي = chronic** (2 و 4)، و **5** = الـ **secondary**: مرض من برّه ضرب الاتنين.
      - kind: table
        page: 68
        quote: "Type 5 (secondary cardiorenal) Systemic condition leading to both cardiac and renal impairment Diabetes, amyloidosis and sepsis"
        title: "Table 1: الأنواع وأسباب الـ morbidity"
        columns: [Type, Causes of morbidity]
        rows:
          - ["1 acute cardiorenal", "Cardiogenic shock and AKI, ADHF resulting in AKI"]
          - ["2 chronic cardiorenal", "Chronic heart failure"]
          - ["3 acute renocardiac", "HF in AKI from volume overload, inflammatory surge, metabolic disturbances"]
          - ["4 chronic renocardiac", "Myocardial remodeling and HF from CKD-associated cardiomyopathy"]
          - ["5 secondary", "Diabetes, amyloidosis and sepsis"]
        hide: [[0, 1], [2, 1], [3, 1], [4, 1]]
      - kind: sort
        page: 68
        quote: "Cardiogenic shock and AKI, acute decompensated heart failure (ADHF) resulting in AKI"
        prompt: "صنّف كل عيان على نوعه:"
        bins: ["Type 1", "Type 3", "Type 4", "Type 5"]
        cards:
          - { text: "Cardiogenic shock after MI, then creatinine doubles", bin: 0 }
          - { text: "ADHF admission with rising creatinine", bin: 0 }
          - { text: "Rhabdomyolysis AKI, then pulmonary edema from overload", bin: 1 }
          - { text: "AKI with hyperkalemia and arrhythmia", bin: 1 }
          - { text: "10 years on hemodialysis, now LVH and HF", bin: 2 }
          - { text: "Septic shock with AKI and new LV dysfunction", bin: 3 }
          - { text: "Amyloidosis with heart failure and nephrotic proteinuria", bin: 3 }
        why: "دوّر على مين اتأذى **الأول**: لو القلب acute = 1، لو الكلى acute = 3، لو CKD قديم = 4، ولو مرض systemic (sepsis، amyloid، diabetes) ضرب الاتنين = 5."
      - kind: explain
        page: 69
        title: "Figure 1: المحرّك في كل نوع"
        quote: "Renal fibrosis is particularly important in type 2. Also to be considered drug induced renal toxicity and VAD induced renal effects"
        text: |
          - **Type 1:** ==alteration of renal perfusion== هو الـ main trigger، خصوصًا لو فيه **congestive heart failure**.
          - **Type 2:** **renal fibrosis**، وكمان **drug-induced renal toxicity** وتأثير الـ **VAD** على الكلى.
          - **Type 3:** **salt and water** و **neurohormonal** و **uremia-induced dysregulations**.
          - **Type 4:** **hypertension**، **CKD-induced myopathy**، **chronic hemodialysis** و **fluid shifts**.
          - **Type 5:** patterns مشتركة: **autoimmunity**، **microcirculatory dysfunction**، **cytokine release**.
      - kind: reveal
        page: 69
        quote: "Alteration of renal perfusion is the main trigger (in particular when congestive heart failure is present)"
        prompt: "ليه الـ congestion (مش بس الـ low output) بيأذي الكلى في type 1؟"
        answer: |
          الكلى عايزة **فرق ضغط**: arterial pressure داخل ناقص **venous pressure** خارج. في الـ congestive HF الـ venous pressure بيعلى، فالـ **perfusion pressure** بيقل حتى لو الـ BP مقبول.

          علشان كده Figure 2 بتكتب **decreased perfusion, increased venous pressure** جنب بعض. (تفسير فسيولوجي؛ الكلام عن الـ perfusion من الكتاب.)
      - kind: figure
        page: 69
        quote: "Diuretic and ACE inhibitor Toxicity, Vasoconstriction"
        title: "Figure 2: إزاي الـ acute HF بيوقع الكلى (CRS-1)"
        alt: "Acute heart failure at the top, acute renal disease at the bottom. Three middle pathways run down: humoral signaling to endothelial activation to cytokine secretion; diuretic and ACE inhibitor to toxicity and vasoconstriction; hemodynamically mediated damage to decreased perfusion and increased venous pressure. A side loop of sympathetic and RAA activation runs from the kidney back up to the heart."
        caption: "تلات طرق نازلة للكلى، و **loop** طالع: الـ **sympathetic** والـ **RAA activation** بيرجعوا يتعبوا القلب أكتر، فتبقى vicious cycle."
        svg: |
          <svg viewBox="0 0 340 360" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L03b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            <marker id="L03c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker></defs>
            <rect x="95" y="8" width="140" height="36" rx="8" class="fg-bad"/>
