    front: What is the treatment target in the EULAR algorithm, and what counts as insufficient improvement?
    back: Clinical remission by ACR-EULAR definitions (or at least low disease activity if remission is unlikely), reached by 6 months; therapy is changed if improvement is under 50% of disease activity at 3 months.
    src: { page: 262, quote: "Phase III:\n  Change the bDMARD or JAK-inhibitor\n  Improved at 3 months and achieved target at 6 months? Yes: Continue → Dose reduction / interval increase in sustained remission; No: change again\nNotes:\n  1. 2010 ACR-EULAR classification criteria can support early diagnosis.\n  2. \"Methotrexate should be part of the first treatment strategy\". While combination therapy of csDMARDs is not preferred by the Task Force, starting with methotrexate does not exclude its use in combination with other csDMARDs although more adverse events without added benefit are to be expected, especially if MTX is combined with glucocorticoids.\n  3. The treatment target is clinical remission according to ACR-EULAR definitions or, if remission is unlikely to be achievable, at least low disease activity; the target should be reached after 6 months, but therapy should be adapted or changed if insufficient improvement (less than 50% of disease activity) is seen after 3 months.\n  4. Sustained remission: ≥ 6 months ACR/EULAR index based or Boolean remission.\n  5. Consider contraindications and risks. TNF-inhibitors (adalimumab, certolizumab, etanercept, golimumab, infliximab, including EMA/FDA approved bsDMARDs), abatacept, IL-6R inhibitors, or rituximab (under certain conditions); in patients who cannot use csDMARDs as comedication IL6-inhibitors and tsDMARDs have some advantages.\n  6. The following risk factors for cardiovascular events and malignancies must be considered when intending to prescribe a JAK-inhibitor: Age over 65 years, history of current or past smoking, other cardiovascular risk factors, other risk factors for malignancy, risk factors for thromboembolic events.\n  7. The most frequently used combination comprises methotrexate, sulfasalazine and hydroxychloroquine.\n  8. Dose reduction or interval increase can be safely done with all bDMARDs and tsDMARDs with little risk of flares; stopping is associated with high flare rates; most but not all patients can recapture their good state upon re-institution of the same bDMARD/tsDMARD, but before all this glucocorticoids must have been discontinued.\n  9. From a different or the same class." }
