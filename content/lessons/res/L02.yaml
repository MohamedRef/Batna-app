      - kind: figure
        page: 66
        title: "شريحة 66: الخط الأصلي للوفيات حوالين الولادة"
        image: { file: res/L02-s66-perinatal.webp, book: true }
        alt: "Timeline diagram from Last Menstrual Period on the left to 1 year after birth on the right, split by a birth bar into Intrauterine and Extrauterine. A thick axis is marked 20, 24, 28, 32 and 36 weeks, then 7 days and 28 days after birth. Top row: Fetal deaths spans conception to birth, Infant mortality spans birth to 1 year. Second row: Abortion to 20 weeks, Stillborn from 20 weeks to birth, Neonatal mortality from birth to 28 days, Postneonatal mortality from 28 days to 1 year. Above the axis, fetal deaths are early, intermediate and late, and neonatal deaths early and late. Below the axis, Perinatal Period I runs from 28 weeks to 7 days, outlined in a red box, and Perinatal Period II from 20 weeks to 28 days."
        caption: |
          دي الرسمة الأصلية اللي الخط المبسّط فوق متاخد منه. من فوق لتحت:

          - **أول صف**: **Fetal deaths** من أول الحمل لحد الـ **birth**، و**Infant mortality** من الولادة لحد **1 year**.
          - **تاني صف**: **Abortion** لحد 20 أسبوع، **Stillborn** من 20 أسبوع للولادة، **Neonatal mortality** من الولادة لـ 28 يوم، و**Postneonatal mortality** من 28 يوم لسنة.
          - **فوق الخط التخين**: الـ fetal deaths متقسمة early وintermediate وlate، والـ neonatal early (أول 7 أيام) وlate.
          - **الخط التخين**: 20 و24 و28 و32 و36 أسبوع، وبعد الولادة 7 أيام و28 يوم.
          - **تحت الخط**: **Perinatal Period I** في المربع الأحمر من ==28 أسبوع لـ 7 أيام==، و**Perinatal Period II** أوسع: من 20 أسبوع لـ 28 يوم.
          - **أطراف الرسمة**: على الشمال **Last Menstrual Period**، وتحت **Intrauterine** قبل الولادة و**Extrauterine** بعدها.

          اللي تاخده: الـ perinatal بيعدّي ==خط الولادة==، فبيجمع late fetal deaths مع early neonatal deaths؛ عشان كده المقام فيه الـ fetal deaths كمان، مش live births بس.
