- id: res.L15.lesson8
  title: 'تبني فئات الجدول: الحدود والـ width والـ midpoint'
  hook: عندك 500 رقم. تقسّمهم كام فئة؟ تبدأ منين؟ وتحسب نص الفئة إزاي؟
  minutes: 10
  pages: [40, 69]
  topics: [tables]
  goals:
  - تختار عدد الفئات وأول حد
  - تعرف أجزاء الفئة الخمسة وتحسب الـ width والـ midpoint
  - تقرا الـ cumulative %
  status: unverified
  steps:
  - kind: explain
    page: 40
    quote: |-
      Determining the lower limit of the first interval
      if smallest observation= 0 or 5
      Otherwise
      Round figure immediately lower than the smallest observation
    title: أول فئة تبدأ منين؟
    text: |
      - لو أصغر قيمة ==0 أو 5==، ابدأ منها.
      - غير كده، خد ==الرقم المدوّر اللي تحت أصغر قيمة على طول==.

      ليه رقم مدوّر؟ علشان الفئات تتقري بسهولة (10-، 20-) بدل حدود غريبة زي 12-. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 41
    quote: |-
      Width of interval
      Usually 5 or 10 or 15… etc.
      all of the same size unless otherwise indicated.
      Permissible number of 4-12 intervals.
      If resulting intervals < 4
      Therefore width less than 5.
      If resulting intervals >12
      reconstruct the table using a width greater than 5.
    title: نبني الفئات إزاي؟
    text: |-
      **أول فئة**: لو أصغر قيمة 0 أو 5 ابدأ بيها، وإلا ==أقرب رقم مدوّر أقل منها==.

      **الـ width**: عادة 5 أو 10 أو 15، والفئات كلها قد بعض.

      **عدد الفئات**: ==4 لـ 12==. أقل من 4 = بتخسر precision كتير؛ أكتر من 12 = الجدول مبقاش ملخّص.
    remind: [res.L15.042]
  - kind: check
    page: 42
    quote: |-
      Smallest =12 largest =79
      Therefore first interval at 10.
      10–
      20–
      30–
      40–
      50–
      60–
