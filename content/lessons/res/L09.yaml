      - "Nuremberg 1947 = do no harm + human rights: voluntary consent absolutely essential، وحق الانسحاب (المادة 9)."
      - "Helsinki 1964 (WMA، فنلندا): المشارك قبل العلم، consent مكتوب، لجنة أخلاقيات لازم."
