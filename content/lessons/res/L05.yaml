          - "موجودة: periodic medical examination."
          - "موجودة، ومعاها review of records."
          - "موجودة."
      - kind: explain
        page: 45
        quote: "Example of a cohort study\nObjective of the study:\nto study the relation between\nmaternal smoking and low birth\nweight"
        title: "مثال: تدخين الأم ووزن المولود"
        text: |
          الهدف: ==the relation between maternal smoking and low birth weight==.

          في الـ cohort: تبدأ بستات حوامل **مدخنات** و**مش مدخنات** (الـ exposure)، وتستنى الولادة وتقيس الوزن (الـ outcome). السؤال الجاي بيوريك ليه ده cohort مش case-control.
