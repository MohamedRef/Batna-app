  - id: hb.L13.lesson6
    title: "الـ PSC: علاج المضاعفات وطابور الأدوية الجديدة"
    hook: "الـ transplant هو الحل الأقوى، والـ UDCA مش زي ما فاكر، وفيه 20 دوا جديد كلهم «خفّضوا الـ ALP»."
    minutes: 10
    pages: [227, 240]
    topics: [psc-treatment, psc-emerging]
    goals:
      - "تعرف goals الـ management وعلاج كل complication"
      - "تحفظ أرقام الـ dominant stricture والـ transplant"
      - "تفهم ليه الـ UDCA مش recommended long-term في الـ PSC"
      - "ترتّب الأدوية الجديدة حسب الـ mechanism"
    status: unverified
    steps:
      - kind: explain
        page: 227
        title: "الهدف إيه؟"
        text: |
          الـ **management goals**:

          - **Relieve symptoms.**
          - **Prevent or treat complications.**
          - **Halt progression.**
          - **Optimize timing of liver transplantation.**
      - kind: match
        page: 228
        prompt: "وصّل كل مشكلة بعلاجها في الكتاب:"
        pairs:
          - ["Bacterial cholangitis", "Broad-spectrum IV antibiotic (ciprofloxacin)"]
          - ["Dominant stricture", "Endoscopic or radiologic balloon dilation"]
          - ["Cholangiocarcinoma", "Poor prognosis; transplant contraindicated"]
          - ["Advanced PSC", "Liver transplantation"]
        why: "الكتاب: cholangitis → IV ciprofloxacin، stricture → balloon dilation، cholangiocarcinoma → prognosis وحش ومش بيستجيب لـ chemo/radiation والـ transplant **contraindicated**، والـ advanced PSC → transplant هو الأكثر فاعلية."
      - kind: explain
        page: 228
        title: "الـ transplant والـ dominant stricture"
        text: |
          **Transplant:**

          - بين التشخيص والـ transplant عادةً **20–25 سنة**.
          - بعده: **acute أو chronic cellular rejection**، و **recurrence 30–50%** وممكن يحتاج transplant تاني.
          - الـ HLA serotyping عمومًا مش بيفرق كتير، بس الـ prescreening ممكن يحسّن النتيجة (alleles معيّنة في الـ recipient والـ graft مرتبطة بـ failure).

          **Dominant stricture:**

          - complication شائعة وخطيرة.
          - **Mean survival 14 سنة** معاها مقابل **27 سنة** من غيرها.
          - بتزوّد خطر الـ **CCA**: فكّر فيه لو فيه **subacute worsening** في الـ RUQ pain أو الـ labs.
          - **Balloon dilatation** هي الـ standard، والـ **stenting** لسه controversial.
      - kind: check
        page: 229
        question: "ERCP in a PSC patient with worsening jaundice shows a dominant stricture. What is the standard therapy?"
        options:
          - "Balloon dilatation"
          - "Routine stent for every stricture"
          - "High-dose UDCA (28–30 mg/kg/day)"
          - "Systemic chemotherapy"
        answer: 0
        why:
          - "صح: الـ **balloon dilatation** هي الـ standard therapy of choice."
          - "الـ stenting **controversial** في الكتاب."
          - "الجرعة العالية دي مرتبطة بـ **ضرر** (cirrhosis، varices، CCA، transplant، death)."
          - "مفيش chemo لـ stricture؛ والـ CCA نفسه بيستجيب وحش للـ chemo."
      - kind: explain
        page: 229
        title: "قصة الـ UDCA في الـ PSC"
        text: |
          الـ UDCA **hydrophilic bile acid** (من الـ chenodeoxycholate): بيحمي الـ cholangiocytes، بيزوّد الـ hepatobiliary secretion، وبيحمي الـ liver cells من الـ bile acid-induced apoptosis.

          - **Beuers 1992:** أول RCT، **13–15 mg/kg**، قلّل الـ disease activity بعد سنة.
          - **Mitchell:** 26 مريض، **20 mg/kg/day**، حسّن الـ tests والـ cholangiogram والـ fibrosis.
          - RCT بـ **219** مريض (**17–23 mg/kg/day**): مفيش فرق significant في «death or transplant».
          - **High dose (28–30 mg/kg/day): ضرر**: cirrhosis progression، varices، CCA، transplant، أو death.
          - **3 meta-analyses**: مفيش effect على الـ mortality أو الـ transplant.
          - **British Society of Gastroenterology:** **ضد** الـ long-term UDCA في الـ PSC الجديد.

          وإضافة **metronidazole** للـ UDCA (80 مريض، 3 سنين): ALP أقل، **New Mayo Risk Score** نزل، ومفيش progression في الـ ERCP، و histology أحسن.
      - kind: aside
        tone: trap
        page: 230
        text: |
          متخلطش: في الـ **PBC** الـ UDCA هو **main treatment مدى الحياة**. في الـ **PSC** الـ BSG بتقول **لأ** للـ long-term في الحالات الجديدة، والجرعة العالية (28–30) **بتضر**. نفس الدوا، حكايتين مختلفتين.
      - kind: figure
        page: 232
        title: "الـ FXR: الكبد والمصران بيتكلموا"
        alt: "Two stacked boxes. Liver box: FXR activation downregulates CYP7A1, the rate-limiting enzyme of bile acid synthesis, so less bile acid is made; FGFR4 receives the FGF19 signal. Gut box: in the enterocyte FXR lowers ASBT, the transporter that reabsorbs bile acids, and raises FGF19 secretion. An arrow labelled portal blood carries FGF19 from gut up to the liver FGFR4."
        caption: "الـ FXR بيقفل المصنع (CYP7A1) في الكبد، وبيقلّل الـ ASBT في المصران، ويبعت **FGF19** في الـ portal blood للـ FGFR4. النتيجة: bile acids أقل في الدورة."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L13c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
              <marker id="L13d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
