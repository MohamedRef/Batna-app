            options: ["Calcium-channel blocker or digoxin", "Propranolol 1 mg/min IV", "Adenosine", "No rate control"]
            answer: 0
            why: "الـ asthma = β-blocker contraindicated، فالبديل calcium channel blocker (CCB) أو digoxin."
          - question: "Fever?"
            options: ["Paracetamol and external cooling", "Aspirin", "Diclofenac", "Ice bath"]
            answer: 0
            why: "الـ salicylates بتطرد الهرمون من الـ binding فبتزوّد الـ storm."
          - question: "Where should he be managed?"
            options: ["HDU, consider ICU", "General ward", "Outpatient", "Day unit"]
            answer: 0
            why: "Medical high-dependency unit، والـ intensive care unit (ICU) لازم يتفكر فيه."
      - kind: reveal
        page: 118
        quote: "Supportive treatment may include:\n– Vigorous fluid resuscitation if appropriate.\n– External cooling.\n– Paracetamol for pyrexia."
        prompt: "ليه المريض في الـ storm محتاج vigorous fluid resuscitation؟"
        answer: "التفسير المقبول (مش في الكتاب): لأنه بيخسر سوايل من كل ناحية: **الحرارة والعرق**، **الـ vomiting**، والـ tachypnoea، ومعاه metabolic rate عالي جدًا. الجفاف بيقلل الـ cardiac output فالقلب يجري أكتر. الكتاب بيقول **if appropriate**، يعني خلي بالك لو فيه **congestive cardiac failure**، لأن السوايل الكتير هتغرّق الرئة. ومعاها **external cooling** و **paracetamol**، والـ salicylates لأ."
      - kind: aside
        tone: joke
        page: 118
        quote: "If β-blockers are contraindicated, the possible alternatives would include calcium channel blockers or digoxin.\nSupportive treatment may include:\n  Vigorous fluid resuscitation if appropriate.\n  External cooling.\n  Paracetamol for pyrexia.\n  Salicylates should be avoided as they inhibit thyroid hormone binding and can worsen the thyroid storm.\n  Patients should ideally be managed in a medical high- dependency unit and intensive care unit should be considered."
