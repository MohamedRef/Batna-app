        quote: "2 to 6 months after adenoma removal"
        text: "المنطق بسيط: كل ما البوليب يبقى أكتر أو أكبر أو أوحش، نرجع أسرع. واللي اتشال piecemeal ممكن يكون فاضل منه حتة، فنرجع بعد 2 to 6 months."
      - kind: explain
        page: 203
        quote: "Age 40, or 10 years before the youngest case in the immediate family, whichever is earlier."
        title: "ACS: لو في family history"
        text: |
          - **First-degree relative قبل 60**، أو اتنين first-degree في أي سن: ابدأ عند ==age 40, or 10 years before the youngest case== (الأبكر)، وكرر **every 5 years**.
          - **First-degree عنده 60 أو أكتر**، أو اتنين second-degree: ابدأ عند **age 40**، وكرر **every 10 years**.
      - kind: check
