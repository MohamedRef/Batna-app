# TEMPORARY: probe Batna Cloud from outside (removed before merge).
name: Probe Batna Cloud
on:
  push:
    branches: [claude/project-thread-cp83dj]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: health + sign-in endpoint
        run: |
          set -x
          U=https://batna-cloud.hamorefaat85.workers.dev
          dig +short batna-cloud.hamorefaat85.workers.dev A || true
          dig +short batna-cloud.hamorefaat85.workers.dev AAAA || true
          curl -sS -m 30 -w '\n%{http_code} %{time_total}s\n' $U/v1/health
          curl -sS -m 30 -w '\n%{http_code} %{time_total}s\n' -X POST -H 'content-type: application/json' \
            -d '{"id_token":"x.y.z","device":{"device_id":"probe","name":"probe","model":null,"platform":"other"}}' $U/v1/auth/google
          curl -sS -m 30 -w '\n%{http_code} %{time_total}s\n' -X POST -H 'content-type: application/json' \
            -d '{"refresh_token":"x"}' $U/v1/auth/refresh
          echo | openssl s_client -connect batna-cloud.hamorefaat85.workers.dev:443 -servername batna-cloud.hamorefaat85.workers.dev 2>/dev/null | openssl x509 -noout -issuer -subject -dates
  ureq:
    runs-on: ubuntu-latest
    steps:
      - name: same ureq + rustls stack as the app
        run: |
          cargo new -q probe && cd probe
          cat >> Cargo.toml <<'T'
          ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "json"] }
          tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
          tokio = { version = "1", features = ["full"] }
          T
          cat > src/main.rs <<'T'
          #[tokio::main]
          async fn main() {
              let agent: ureq::Agent = ureq::Agent::config_builder().http_status_as_error(false).build().into();
              for url in ["https://batna-cloud.hamorefaat85.workers.dev/v1/health", "https://oauth2.googleapis.com/token"] {
                  match agent.get(url).call() {
                      Ok(mut r) => println!("{url}: {} {}", r.status(), r.body_mut().read_to_string().unwrap_or_default().chars().take(80).collect::<String>()),
                      Err(e) => println!("{url}: ERROR {e:?}"),
                  }
              }
              let r = agent.post("https://batna-cloud.hamorefaat85.workers.dev/v1/auth/google")
                  .send_json(serde_json::json!({"id_token":"x.y.z","device":{"device_id":"probe","name":"p","model":null,"platform":"other"}}));
              match r { Ok(mut r) => println!("post: {} {}", r.status(), r.body_mut().read_to_string().unwrap_or_default()), Err(e) => println!("post: ERROR {e:?}") }
              match tokio_tungstenite::connect_async("wss://batna-cloud.hamorefaat85.workers.dev/v1/sync").await {
                  Ok(_) => println!("ws: connected"),
                  Err(e) => println!("ws: {e:?}"),
              }
          }
          T
          echo 'serde_json = "1"' >> Cargo.toml
          cargo run -q
