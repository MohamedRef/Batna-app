  - id: geri.L09.lesson2
    title: "الـ T والـ B، والالتهاب اللي ما بيطفيش"
    hook: "الكبير مناعته ضعيفة وفي نفس الوقت ملتهب طول الوقت. إزاي الاتنين مع بعض؟"
    minutes: 8
    pages: [159, 160]
    topics: [acquired, risks]
    goals:
      - "تعرف تغيّرات الـ T و B cells (سؤال امتحان)"
      - "تفهم الـ inflamaging والـ IL-6"
      - "تعدّ risk factors الـ infection في الكبير (سؤال امتحان)"
    status: unverified
    steps:
      - kind: explain
        page: 159
        title: "الـ acquired immunity"
        quote: "T cells: reduction in T cell thymopoiesis, accumulated highly differentiated memory cells. Loss of CD28 antigen CD69 antigen required for T cell activation& signal transduction, reduced CD8+ cell proliferation in response to antigen stimulation."
        text: |
          **T cells:**
          - ==thymopoiesis أقل== و memory cells highly differentiated متراكمة
          - بيضيع **CD28** و **CD69** (لازمين للـ activation والـ signal transduction)
          - الـ CD8+ proliferation للـ antigen أقل

          **B cells:** lymphopoiesis أقل، memory B أكتر، و ==antibody response للـ vaccination ضعيف==.

          ليه كل نقطة من دول بتفرق؟ التفسير المقبول (مش في الكتاب):
          - الـ **thymopoiesis** أقل: يعني T cells جديدة أقل، فالـ naive بيقلوا، ودي نفس حكاية الـ thymus من الدرس الأول.
          - الـ memory الـ highly differentiated **متراكمة**: بتاخد مكان، ومش بتعرف تتكاتر كتير.
          - الـ **CD28** هو «الإشارة التانية» اللي الـ T cell محتاجاها عشان تشتغل بجد بعد ما تمسك الـ antigen، والكتاب بيقول هو و CD69 ==required for T cell activation and signal transduction==. فلو ضاع، الخلية تمسك الـ antigen وما تتحركش.
          - والـ **B cells**: memory أكتر و lymphopoiesis أقل، فالـ antibody response للـ vaccination بيضعف، عشان التطعيم محتاج B cells جديدة تتعلم antigen جديد.
      - kind: figure
        page: 159
        title: "صورة الكتاب: الـ T و B cells مع السن"
        image: { file: geri/L09-adaptive-changes.webp, book: true }
        alt: "The book's slide of age-associated changes in the adaptive immune response. T cells at the top: decreased naive T cells and proliferation; increased memory T cells, Th17 cells and CD28-negative CD8 T cells; altered regulatory T cells; and altered T cell signalling. B cells at the bottom: decreased naive B cells, antibody specificity, affinity maturation and signalling; increased memory B cells and auto-antigen specificities; altered B cell repertoire."
        caption: |
          الصورة دي بتفصّل الكلام اللي فوق. دايرتين في النص، وحوالي كل واحدة صناديق:

          - **فوق على الشمال** (T cells): ==Decreased naive T cells== والـ proliferation؛ و **increased** memory T cells و ==CD28⁻ CD8⁺ T cells== (اللي فقدت الـ CD28 اللي في الكلام).
          - **فوق على اليمين**: الـ **T cell signaling** نفسه متغيّر، ومعاه الـ cytokines اللي بيطلّعها (IL-2 و interferon gamma).
          - **تحت على الشمال** (B cells): naive B cells أقل، و antibody specificity و affinity maturation أقل.
          - **تحت على اليمين**: memory B cells أكتر، و ==auto-antigen specificities== أكتر.

          اللي تاخده: الـ naive بيقل والـ memory بيزيد في الاتنين، فالكبير بيرد كويس على اللي شافه قبل كده وضعيف قدام الجديد (والتطعيم)، وبيطلّع autoantibodies أكتر.
      - kind: check
        page: 159
        quote: "B cells: reduction in B cell lymphoiesis, increase in memory B cells, impaired antibody response to vaccination."
        question: "Which change is NOT part of ageing acquired immunity?"
        options:
          - "More naive T cells"
          - "Loss of CD28 and CD69"
          - "More memory B cells"
          - "Impaired antibody response to vaccination"
        answer: 0
        why:
          - "صح: الـ naive T cells **بيقلوا**، مش بيزيدوا."
          - "الـ CD28 و CD69 بيضيعوا فعلًا."
          - "الـ memory B cells بيزيدوا."
          - "الـ antibody response ضعيف، وده سبب ضعف التطعيم."
      - kind: explain
        page: 159
        title: "Inflamaging"
        quote: "The majority of studies suggest that aging is associated with a dysregulated cytokine response, in particular an increase in pro-inflammatory cytokine IL-6, this phenomenon has been referred to as inflamaging. Chronic elevation of IL-6 has been correlated with chronic disease and functional decline in old."
        text: |
          مع السن الـ cytokine response بيبقى dysregulated، وأهم حاجة ==IL-6 بيعلى==. ده اسمه **inflamaging** (inflammation + aging).

          والـ **IL-6 العالي المزمن** مرتبط بـ chronic disease و ==functional decline==.

          طب ليه الالتهاب بيعلى وهو المناعة أصلًا بتضعف؟ التفسير المقبول (مش في الكتاب): الـ macrophage اللي بيعمل oxidative stress أكتر، والـ apoptotic cells اللي ما بتتنضفش، والـ memory cells الكتير اللي بتطلّع cytokines، كلهم بيزوّدوا «الدوشة». والكتاب نفسه في صورة صفحة 156 حاطط **CMV** و **obesity** و **stress** كحاجات بتسرّع الـ immunosenescence.

          والنتيجة اللي الكتاب بيربطها: الـ IL-6 العالي على طول = **chronic disease** و ==functional decline==، يعني الكبير بيضعف ويقع حتى من غير infection.
      - kind: aside
        tone: analogy
        page: 159
        quote: "The majority of studies suggest that aging is associated with a dysregulated cytokine response, in particular an increase in pro-inflammatory cytokine IL-6, this phenomenon has been referred to as inflamaging. Chronic elevation of IL-6 has been correlated with chronic disease and functional decline in old."
        text: "تخيّل إنذار حريق بيزمّر طول اليوم من غير حريق: الجيران زهقوا، ولما الحريق الحقيقي ييجي محدش بيتحرك. ده الـ **inflamaging**: IL-6 عالي على الفاضي، ورد ضعيف على الـ infection الحقيقي."
      - kind: explain
        page: 160
        title: "ليه الكبير بيتعدي؟"
        quote: "Living in a long term care facilities, chronic diseases, malnutrition, immune senescence, polypharmacy, increase use of prosthetic devices."
        text: |
          - **Long-term care facility**، chronic diseases، **malnutrition**، immune senescence
          - ==Polypharmacy== (أدوية كتير بتكبت المناعة)، و **prosthetic devices**
          - العلاج نفسه، والـ hospitalization الكتير ← **nosocomial infection**
          - ==Atypical presentation==: الأعراض بتتعرف متأخر فتحصل complications

          ليه كل واحدة من دي خطر؟ التفسير المقبول (مش في الكتاب):
          - الـ **long-term care facility**: ناس كتير ضعفانين في مكان واحد، فالعدوى بتتنقل بسهولة.
          - الـ **malnutrition**: المناعة محتاجة بروتين و micronutrients عشان تبني خلاياها (هنشوف الـ zinc والفيتامينات في الدرس الأخير).
          - الـ **polypharmacy**: الكتاب بيقول أدوية كتير ممكن **تكبت الـ immune response**، وكمان بيقول إن العلاج نفسه risk.
          - الـ **prosthetic devices**: أي جسم غريب ممكن الميكروب يلزق عليه.
          - الـ **hospitalization** الكتير: يعني تعرّض أكتر لـ nosocomial infections.
          - والـ **atypical presentation**: الكتاب بيقول التأخير في التعرّف على الأعراض هو اللي بيعمل الـ **serious complications**.
      - kind: sort
        page: 160
        quote: "Diminished anatomic & physiologic protection as cough reflex and mucociliary clearance, increase the susceptibility to respiratory infection. Decreased gastric acidity in old due to both physiological and medication side effects can increase susceptibility to gastrointestinal infections."
        prompt: "الحماية دي لما تقل، بتفتح الباب لأنهي infection؟"
        bins: ["Respiratory", "Gastrointestinal", "Nosocomial"]
        cards:
          - { text: "Weak cough reflex", bin: 0 }
          - { text: "Poor mucociliary clearance", bin: 0 }
          - { text: "Low gastric acid (ageing)", bin: 1 }
          - { text: "Long-term proton pump inhibitor (PPI)", bin: 1 }
          - { text: "Frequent hospital admissions", bin: 2 }
        why: "الـ **cough reflex** والـ **mucociliary clearance** بيحموا الصدر. الـ **gastric acidity** بتقل من السن ومن الأدوية زي الـ proton pump inhibitor (PPI)، فتزيد الـ gastrointestinal (GI) infection. والـ hospitalization الكتير = **nosocomial**."
      - kind: table
        page: 160
        quote: "Polypharmacy is another important risk factor."
        title: "صورة الكتاب: 3 مجموعات risk"
        columns: [Group, Examples]
        rows:
          - ["Host", "Diabetes، lung، renal، frailty، dry mucosa، immune senescence"]
          - ["Medication", "Polypharmacy، immunosuppressive drugs"]
          - ["Social", "Poor nutrition، crowding، long-term care، poor prevention"]
        hide: [[1, 1], [2, 1]]
      - kind: figure
        page: 160
        quote: "Living in a long term care facilities, chronic diseases, malnutrition, immune senescence, polypharmacy, increase use of prosthetic devices."
        title: "3 أبواب للـ infection في الكبير"
        alt: "Three boxes feed one arrow into infection. Host: comorbidities, frailty, immune senescence, dry mucosa and reduced gag reflex. Medication: polypharmacy and drugs that suppress immunity. Social: poor nutrition, crowding or long-term care, poor acceptance of prevention."
        caption: "صورة الكتاب بتقسم الـ risks تلات مجموعات: **host** و **medication** و **social**. كل باب لوحده بيزوّد الـ infection، والكبير غالبًا عنده التلاتة."
        svg: |
