      - kind: explain
        page: 400
        quote: "Endoscopic Sphincterotomy With Stone Extraction"
        title: "Sphincterotomy: بنوسّع الباب"
        text: |
          صفحة 400 صور منظار للـ papilla وهي بتتفتح والحصوة بتطلع.

          - ==Endoscopic sphincterotomy==: بالـ ERCP، سلك كهربا بيقطع الـ sphincter of Oddi، فالفتحة توسع (شرح مقبول، مش في الكتاب).
          - **Stone extraction**: بعد ما الباب وسع، balloon أو basket بيسحب الحصوة للـ duodenum.

          ليه ده الحل لحصوة الـ CBD بعد الـ cholecystectomy؟ التفسير المقبول (مش في الكتاب): المرارة اتشالت خلاص والمشكلة في القناة. فتح البطن تاني عملية كبيرة، لكن المنظار بيوصل للـ papilla من البُق. وكمان بيعالج الـ papillary stenosis اللي في قايمة صفحة 399.
