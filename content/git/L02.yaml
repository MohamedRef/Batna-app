  # ---------- p58-62: POEM ----------
  - id: git.L02.057
    kind: card
    topic: poem
    front: Gold standard treatment for achalasia according to the lecture?
    back: Heller's myotomy (1914).
    src: { page: 58, quote: "The gold standard treatment for achalasia is Heller‘s myotomy, 1914." }
    status: unverified
    tags: [high-yield]
  - id: git.L02.058
    kind: enumerate
    topic: poem
    prompt: Mention the other (non-Heller) treatments of achalasia listed with POEM.
    points:
      - Pneumatic balloon dilation
      - Botulinum toxin injection
      - Calcium channel blockers
      - POEM (per-oral endoscopic myotomy)
    pass: 3
    src: { page: 58, quote: "Pneumatic balloon dilation, botulinum toxin injections and calcium channel blockers." }
    status: unverified
  - id: git.L02.059
    kind: cloze
    topic: poem
    text: POEM was described by {{c1::Inoue}} et al in {{c2::2009}}, and uses a {{c3::natural orifice transluminal endoscopic surgical (NOTES)}} approach.
    src: { page: 58, quote: "In 2009, Inoue et al, described a revolutionary technique for the treatment of achalasia, termed per-oral endoscopic myotomy (POEM)" }
    status: unverified
    tags: [high-yield]
  - id: git.L02.060
    kind: order
    topic: poem
    prompt: Put the historical steps that led to human POEM in order.
    steps:
      - "1980: Ortega et al, endoscopic direct myotomy (6 dogs, then 17 patients)"
      - "2007: the submucosal tunnelling concept is proposed"
      - "Pasricha et al: completely endoscopic myotomy in swine"
      - "2009: Inoue et al report the first human POEM"
    src: { page: 58, quote: "In 2007, the concept of a submucosal tunnelling method was proposed." }
    status: unverified
  - id: git.L02.061
    kind: order
    topic: poem
    prompt: Put the steps of the POEM procedure in order.
    steps:
      - Submucosal bleb and a 2 cm longitudinal mucosotomy
      - Enter the submucosa with a tapered cap and create the tunnel (spray coagulation, hydrodissection with dilute indigo carmine)
      - Extend the tunnel 3 cm beyond the GE junction into the cardia
      - Selective myotomy of the inner circular fibres from 2 cm distal to the mucosotomy to 2 cm past the GEJ
      - Withdraw and inspect the mucosa over the tunnel through the true lumen
      - Close the mucosotomy entrance with endoscopic clips
    src: { page: 59, quote: "The entrance to the sub-mucosal tunnel is then sequentially closed with endoscopic clips" }
    status: unverified
    tags: [high-yield, book-question]
  - id: git.L02.062
