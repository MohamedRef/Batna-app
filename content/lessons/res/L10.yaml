  - id: res.L10.lesson3
    title: "يقدر يجاوب؟ وعايز يجاوب؟"
    hook: "تسأل عيان «عملت إيه تحاليل آخر 3 شهور؟» هيقولك «حاجات كتير يا دكتور». المشكلة في السؤال، مش فيه."
    minutes: 10
    pages: [22, 34]
