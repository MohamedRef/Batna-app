        quote: "1- Thyroid function remains remarkably normal throughout the course of HIV disease."
        title: "الغدة الدرقية في الـ HIV"
        text: |
          - الـ thyroid ==طبيعية بشكل ملفت== طول المرض، مع **thyroxine-binding globulin (TBG) عالي**.
          - حتى لو اتغزت بـ CMV أو Pneumocystis (P. carinii/jirovecii) أو Cryptococcus أو Kaposi أو lymphoma، غالبًا بتفضل **euthyroid**، يعني نفس فكرة الـ adrenal: الإصابة كتير والفشل قليل.
          - بس الـ hypothyroidism سبب **قابل للعلاج** للتعب والـ malaise وتغير الوعي والـ «failure to thrive»، علشان كده الكتاب بيقول **اكشف عليه روتين**.
          - أسباب أقل: الـ ketoconazole نادرًا بيعمل primary hypothyroidism، والـ rifampin (inducer للـ hepatic microsomal enzymes) بيزوّد الـ **T4 clearance**.
      - kind: explain
        page: 75
        quote: "Patients who fail to achieve plasma cortisol levels >20 mug per deciliter 60 minutes after ACTH stimulation should be considered to have, or be at high risk of developing, adrenal insufficiency. Plasma ACTH levels are frequently normal or subnormal even when plasma cortisol levels are depressed, suggesting that adrenal insufficiency in some HIV-infected patients is due to a primary pituitary or CNS disorder."
