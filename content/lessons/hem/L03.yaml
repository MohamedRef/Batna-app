          - { key: "M", text: "IgM: cold (0–4 °C), Mycoplasma, steroids fail" }
        hook: "**G**ood weather = warm = Ig**G**. **M**ountain snow = cold = Ig**M** (و**M**ycoplasma). سهلة."
      - kind: explain
        page: 38
        title: "التشخيص: Coombs"
        quote: "Direct antiglobulin test (DAT) is used to demonstrate antibodies or the complement attached to red cells in vivo."
        text: |
          - ==Direct antiglobulin test (DAT)== (direct): بيدوّر على antibody أو complement **لازقين على الكرة** في الجسم. ده اللي بيأكد الـ AIHA.
          - **Indirect antiglobulin test (IAT)** (indirect): بيدوّر على antibody **في السيرم**.

          ليه الـ DAT هو اللي بيأكد؟ عشان الـ AIHA معناها إن الـ antibody **قاعد على كرات العيان** دلوقتي. التفسير المقبول (مش في الكتاب): الـ IAT بيفيد أكتر قبل نقل الدم، عشان يدوّر على antibodies حرة ممكن تهاجم الدم اللي هتنقله.

          الـ warm AIHA: anaemia، **icterus**، **splenomegaly**؛ الفيلم فيه **microspherocytes** و reticulocytosis. وفي الـ secondary، أعراض المرض الأصلي (SLE، CLL) بتغطي. ليه microspherocytes؟ التفسير المقبول (مش في الكتاب): الـ macrophage بياخد حتة من الغشا بس، فالكرة بتصغر وتتكوّر زي الـ HS.
      - kind: reveal
        page: 38
        quote: "Neoplastic disorders (chronic lymphocytic leukaemia and malignant lymphoma, ovarian teratoma)"
        prompt: "ليه الـ SLE والـ CLL والـ lymphoma في قايمة الـ secondary warm AIHA؟"
        answer: |
          التفسير المقبول (مش في الكتاب): التلاتة فيهم **مناعة متلخبطة**. في الـ SLE الجسم بيعمل autoantibodies ضد حاجات كتير، والكرة الحمرا واحدة منهم. وفي الـ CLL والـ lymphoma الـ **B cells** نفسها هي المرض، والـ B cells هي اللي بتعمل الـ antibodies، فممكن يطلع منها antibody ضد الكرات.

          عشان كده الكتاب بيقول في الـ secondary AIHA **صورة المرض الأصلي بتغطي**، وأول خطوة في العلاج: ==عالج المرض الأصلي==. ونفس المنطق بيفسّر الـ **rituximab** (anti-CD20): بيشيل الـ B cells.
      - kind: check
        page: 38
