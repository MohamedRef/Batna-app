      - kind: explain
        page: 266
        title: "الـ infliximab ليه لازم MTX؟"
        quote: "Only infliximab needs to be combined with methotrexate to prevent development of antibodies to the mouse component of the drug."
        text: |
          الـ ==infliximab== **chimeric**: ربعه فار (الـ antigen-binding region) والباقي إنسان. الجسم ممكن يعمل antibodies ضد الحتة الفار، فبنحطّ معاه **methotrexate** يمنع ده.

          بياخد **3 mg/kg** IV على ساعتين: أسبوع 0 و 2 و 6، وبعدين كل **8 أسابيع**. ممكن يوصل 10 mg/kg كل 4 أسابيع.

          وبيموّت الخلايا اللي عليها TNF بالـ ADCC والـ complement.
