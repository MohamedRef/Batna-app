  - id: endo.L05.lesson4
    title: "جلد، إسهال، ومرارة: glucagonoma و VIPoma و somatostatinoma"
    hook: "تلات أورام في البنكرياس، كل واحد ليه بصمة: rash، مية، أو حصوة."
    minutes: 9
    pages: [90, 93]
    topics: [glucagonoma, vipoma, somatostatinoma]
