  - id: git.L03.lesson4
    title: "تكريع، ترجيع، و rumination"
    hook: "مش كل تكريع زي بعض، ومش كل حاجة طالعة من البُق تبقى vomiting. هنفرّق بالآلية."
    minutes: 10
    pages: [106, 113]
    topics: [belching, nausea-vomiting]
    goals:
      - "تفرّق supragastric عن gastric belching بالآلية وبالـ impedance"
      - "تعرّف nausea و vomiting و retching و rumination"
      - "تعرف criteria الـ chronic nausea and vomiting syndrome (CNVS) و cannabinoid hyperemesis syndrome (CHS) وعلاج cyclic vomiting syndrome (CVS)"
      - "تعرف functional vomiting و rumination و chronic idiopathic nausea وعلاجهم"
    status: unverified
    steps:
      - kind: explain
        page: 106
        quote: "There are two different types of belching: supragastric belching and gastric belching."
        title: "التكريع الطبيعي والزيادة"
        text: |
          الـ **belching (eructation)**: هوا بيطلع فجأة من المريء للـ pharynx، بصوت أو من غير صوت.

          وهو **physiologic**: بيحصل لحد ==30 times a day==. بيبقى مشكلة لما يتكرر ويأثر على اليوم والـ quality of life.

          وفيه نوعين: ==supragastric== و **gastric**.
      - kind: figure
        page: 106
        quote: "In air suction, patients subconsciously contract the skeletal muscle part in the diaphragm which results in negative pressure in the esophagus."
        title: "الهوا جاي منين؟"
        alt: "Two panels. Left, supragastric belching: the diaphragm contracts, pressure in the esophagus becomes negative, the upper sphincter opens and air rushes down into the esophagus, then is pushed straight back out; the lower sphincter stays shut so air never reaches the stomach. Right, gastric belching: swallowed air distends the stomach, a transient lower esophageal sphincter relaxation opens the sphincter and the gas vents upward; this is physiological, about 30 times a day."
        caption: "الـ supragastric: الهوا بيدخل المريء ويطلع على طول ومش بيوصل المعدة. الـ gastric: الهوا جاي من المعدة نفسها عن طريق الـ transient lower esophageal sphincter relaxation (TLESR)."
        svg: |
          <svg viewBox="0 0 330 322" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03ba" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
              <marker id="L03bb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
