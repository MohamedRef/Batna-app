        quote: "Glomerulonephritis (absent in classical PAN). Renal failure. Hypertension usually (not seen in WG). Renal infarction."
        text: |
          فخ مشهور: **classical polyarteritis nodosa (PAN)** = ==no glomerulonephritis== (بيعمل renal infarction و hypertension).
          والعكس: **Wegener's granulomatosis (WG)** بيعمل glomerulonephritis (GN) بس الكتاب بيقول **hypertension not seen in WG**.
      - kind: explain
        page: 128
        title: "الرئة والكلية: ليه الصورة كده؟"
        quote: "Alveolar haemorrhage, characterized by haemoptysis, anaemia and bilateral"
        text: |
          الجدول بيقول الرئة بتتصاب في **WG** و **CSS** و **MPA**، وأخطر حاجة الـ ==alveolar haemorrhage==: **haemoptysis** و **anaemia** و **bilateral evanescent lung opacities**.

          التفسير المقبول (مش في الكتاب) للتلاتة:
          - الـ **capillaries** حوالين الـ alveoli ملتهبة، فالدم بيسرّب جوه الـ alveoli ← **haemoptysis**.
          - الدم ده ضايع من الدورة ← **anaemia** (ممكن تبقى شديدة حتى لو الـ haemoptysis قليل).
          - الدم في الـ alveoli بيتشفط ويختفي في أيام ← opacities **evanescent** (بتروح وتيجي).

          والكلية: **GN** و **renal failure** و **hypertension** و **renal infarction**. الـ GN من الـ glomerular capillaries (small vessel)، والـ infarction من شريان أكبر.
