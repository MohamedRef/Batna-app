  - id: rheum.L01.lesson1
    title: "الـ cytokines: واتساب جهاز المناعة"
    hook: "الخلايا المناعية مش بتتكلم، بتبعت رسايل. الرسالة دي اسمها cytokine."
    minutes: 8
    pages: [1, 3]
    topics: [intro]
    goals:
      - "تعرّف الـ cytokine ومين أكتر حد بيعمله، وليه"
      - "تفرّق autocrine و paracrine و endocrine، وتعرف ليه الـ endocrine مش الطبيعي"
      - "تمشي سلسلة الـ cytokine من المنبّه لحد التأثير"
    status: unverified
    steps:
      - kind: explain
        page: 1
        quote: "Cytokines are a large, diverse family of low molecular weight proteins or glycoproteins (usually smaller than 30 kDa) secreted by varies types of cells and exerting biologic activities through binding to cell surface receptors ."
        title: "يعني إيه cytokine؟"
        text: |
          عشان جهاز المناعة يشتغل كفريق، الـ lymphocytes والـ inflammatory cells والـ haematopoietic cells لازم يكلموا بعض. اللي بيعمل الشغلانة دي هم الـ ==cytokines==.

          - **التعريف**: عيلة كبيرة من الـ proteins أو glycoproteins صغيرة الوزن (عادة **أقل من 30 kDa**).
          - بتشتغل بإنها تمسك في **receptors على سطح الخلية**.
          - غير المناعة، ليها دور في الـ development: cell differentiation و directed migration.
      - kind: explain
        page: 1
        quote: "In order to mount and coordinate an effective immune response, a mechanism by which lymphocytes, inflammatory cells and haematopoietic cells can communicate with each other is required."
        title: "ليه محتاجين رسايل أصلًا؟"
        text: |
          الكتاب بيبدأ بالسبب: عشان المناعة تعمل response **effective** ومتنظّم، الـ lymphocytes والـ inflammatory cells والـ haematopoietic cells لازم يكون عندهم طريقة **يكلموا بيها بعض**.

          التفسير المقبول (مش في الكتاب): الخلايا دي متفرقة في الجسم كله، في الدم والـ lymph nodes والنسيج الملتهب. مفيش "مدير" واحد بيشوف كل حاجة، فكل خلية بتعرف اللي بيحصل من الرسايل اللي بتوصلها.

          - الخلية اللي شافت الميكروب ==بتبلّغ==.
          - الخلية اللي بعيد شوية **بتيجي** أو **بتتكاثر** أو **بتهدى** على حسب الرسالة.

          عشان كده الـ cytokines هي "الوسيط" مش "السلاح": هي مش بتقتل الميكروب بنفسها في الغالب، هي بتنظّم مين يقتله وإمتى.
      - kind: explain
        page: 1
        quote: "Influencing both innate and adaptive immune responses, the two principal producers of cytokines are T helper cells (Th cells) and macrophages, although they can be transiently induced and secreted by all nucleated cells."
        title: "مين بيبعت الرسايل؟"
        text: |
          أكبر اتنين بيعملوا cytokines هم ==Th cells== و ==macrophages==.

          بس أي **nucleated cell** ممكن تعمل cytokines لفترة قصيرة لو اتحفزت. يعني كل الخلايا معاها موبايل، بس الـ Th والـ macrophage هم اللي عاملين الجروبات.
      - kind: reveal
        page: 1
        quote: "Influencing both innate and adaptive immune responses, the two principal producers of cytokines are T helper cells (Th cells) and macrophages, although they can be transiently induced and secreted by all nucleated cells."
        prompt: "ليه الـ Th cell والـ macrophage بالذات هم أكبر منتجين؟"
        answer: |
          الكتاب بيقول إن الـ cytokines بتأثر على الـ **innate** والـ **adaptive** الاتنين. التفسير المقبول (مش في الكتاب): كل واحد فيهم قائد في ناحية:

          - الـ **macrophage** أول واحد بيقابل الميكروب في النسيج، فهو اللي بيدّي **الإنذار الأول** (innate).
          - الـ **Th cell** هو "المايسترو" بتاع الـ adaptive: مش بيقتل، شغلته كلها إنه يقول للـ B و CD8 والـ macrophage يعملوا إيه، وده كله بالـ cytokines.

          وفي صفحة 6 هتلاقي الكتاب بيربطهم: الـ antigen بيقابل الـ macrophage، وبعدها الـ resting Th cells بتتنشّط.
      - kind: figure
        page: 2
        quote: "Autocrine (acts on same cell) manner.\nParacrine (acts on nearby cell) manner."
        title: "تلات طرق للرسالة"
        alt: "Three panels stacked. Autocrine: a cell releases a cytokine that loops back to its own receptor. Paracrine: a cell sends a cytokine to a neighbouring cell. Endocrine: a cell sends a cytokine through a blood vessel to a distant cell, marked as not the normal manner."
        caption: "Autocrine = لنفسك، paracrine = للجار، endocrine = لحد بعيد في الدم (ودي مش الطريقة المعتادة للـ cytokines)."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R01a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <text x="10" y="22" class="t-b">Autocrine</text>
            <circle cx="160" cy="55" r="26" class="fg-acc"/>
            <path d="M184 45c40-30 40 40 4 22" class="fg-arrow-acc" marker-end="url(#R01a)"/>
            <text x="230" y="60" class="t-sm t-mut">same cell</text>
            <text x="10" y="118" class="t-b">Paracrine</text>
            <circle cx="90" cy="150" r="26" class="fg-acc"/>
            <circle cx="230" cy="150" r="26" class="fg-box"/>
            <path d="M118 150h80" class="fg-arrow-acc" marker-end="url(#R01a)"/>
            <text x="120" y="140" class="t-sm t-mut">nearby cell</text>
            <text x="10" y="214" class="t-b">Endocrine</text>
            <circle cx="50" cy="255" r="22" class="fg-acc"/>
            <rect x="85" y="245" width="170" height="20" rx="10" class="fg-thin"/>
            <text x="150" y="240" class="t-sm t-mut">blood</text>
            <circle cx="290" cy="255" r="22" class="fg-box"/>
            <path d="M74 255h190" class="fg-arrow-acc" marker-end="url(#R01a)"/>
            <text x="110" y="292" class="t-sm t-bad">distant: not the normal manner</text>
          </svg>
      - kind: explain
        page: 2
        quote: "Cytokines aid cell to cell communication in immune responses and stimulate the movement of cells towards sites of inflammation, infection and trauma."
        title: "ليه الـ cytokines بتشتغل قريب؟"
        text: |
          الكتاب بيدّي الـ cytokines دورين في صفحة 2:
          - **Cell to cell communication** في الـ immune response.
          - تحريك الخلايا ناحية أماكن الـ ==inflammation== والـ infection والـ trauma.

          التفسير المقبول (مش في الكتاب) لإن الـ endocrine "مش الطريقة المعتادة": الـ cytokine بيتفرز بكميات صغيرة جدًا، وعمره في الدم قصير، فتركيزه بيبقى عالي **جنب الخلية اللي عملته** بس. يعني الرسالة بتوصل للجار وللخلية نفسها، ونادرًا لعضو بعيد.

          ولما الرسالة **توصل للدم كله** فعلًا، ده غالبًا علامة إن الإنتاج زاد عن حدّه، وده اللي هتشوفه في الـ cytokine storm (صفحة 15).
      - kind: check
        page: 2
        quote: "Endocrine (acts on distant cell; not the normal manner for cytokine responses) manner."
        question: "Which action mode is NOT the normal manner for cytokine responses?"
        options: ["Endocrine", "Autocrine", "Paracrine"]
        answer: 0
        why:
          - "صح: الكتاب كاتبها صريحة، الـ cytokines عادة بتشتغل قريب."
          - "الـ autocrine طبيعي جدًا: الخلية بتكلم نفسها (زي IL-2 على الـ T cell)."
          - "الـ paracrine هو الشائع: الخلية بتكلم جارتها."
      - kind: check
        page: 2
        quote: "When cytokine binds to receptors on the membrane of the same cells that secreted it."
        question: "Activated T cells secrete IL-2, which binds IL-2 receptors on the same T cells and drives their proliferation. Which action mode is this?"
        options: ["Autocrine", "Paracrine", "Endocrine"]
        answer: 0
        why:
          - "صح: نفس الخلية اللي فرزت هي اللي استقبلت، يعني autocrine."
          - "الـ paracrine يبقى لو IL-2 راح لخلية جارة، زي NK cell أو B cell جنبه."
          - "الـ endocrine لخلية بعيدة عن طريق الدم، ومش الطريقة المعتادة للـ cytokines."
      - kind: explain
        page: 3
        quote: "The susceptibility of a target cell to a particular cytokine is determined by the presence of specific membrane receptors and exhibit very high affinity for one another."
        title: "مين يسمع الرسالة؟"
        text: |
          الخلية بتتأثر بالـ cytokine **بس لو عندها الـ receptor بتاعه**. الـ binding ده **very high affinity**.

          بعد الـ binding: signal transduction ← يتغير الـ enzyme activity والـ ==gene expression==.

          السلسلة في رسمة الكتاب: inducing stimulus ← stimulated cell produces cytokine ← secreted ← receptor on target cell bound ← cell activation ← biological effect.
      - kind: explain
        page: 3
        quote: "Cytokines bind to specific receptors on the membranes of target cells, triggering signal transduction pathways that ultimately alter enzyme activity and gene expression."
        title: "ليه الـ receptor هو اللي بيقرر؟"
        text: |
          الـ cytokine نفسه بيلف في المكان كله، بس **مش كل خلية بتسمعه**. اللي بيفرق: هل الخلية دي عندها الـ ==specific receptor== ولا لأ.

          النتيجة اللي لازم تفهمها من الجملة دي:
          - **نفس الـ cytokine** ممكن يعمل حاجات مختلفة في خلايا مختلفة، عشان كل خلية بتترجم الإشارة بالـ genes بتاعتها (ده الـ pleiotropy في الدرس الجاي).
          - الخلية ممكن **تبطّل تسمع** لو قللت الـ receptor بتاعها.

          التفسير المقبول (مش في الكتاب) للـ **very high affinity**: عشان الـ cytokine بيتفرز بكميات قليلة جدًا، الـ receptor لازم يمسكه حتى وهو تركيزه ضعيف. كمية صغيرة تكفي تغيّر الـ gene expression.
      - kind: order
        page: 3
        quote: "The susceptibility of a target cell to a particular cytokine is determined by the presence of specific membrane receptors and exhibit very high affinity for one another."
        prompt: "رتّب سلسلة الـ cytokine زي رسمة الكتاب في صفحة 3:"
        steps:
          - "Inducing stimulus"
          - "Stimulated cell produces cytokine"
          - "Cytokine secreted"
          - "Binds receptor on target cell"
          - "Target cell activated"
          - "Biological effect"
        why: "المنطق بسيط: لازم حاجة تنبّه الخلية الأول، بعدين تعمل الـ cytokine وتفرزه، وبعدين يمسك الـ receptor، وده يشغّل الخلية التانية، والنتيجة تأثير بيولوجي. لو شلت الـ receptor من السلسلة، الخلية مش هتتأثر مهما زاد الـ cytokine."
      - kind: aside
        tone: analogy
        page: 3
        quote: "The susceptibility of a target cell to a particular cytokine is determined by the presence of specific membrane receptors and exhibit very high affinity for one another."
        text: "الـ cytokine زي رسالة على جروب واتساب كبير: كل الناس استلمتها، بس اللي **فاتح الإشعارات** (عنده الـ receptor) هو بس اللي بيتحرك. والـ affinity العالية زي إن الموبايل بيرن حتى لو الرسالة كلمة واحدة."
      - kind: try
        items: [rheum.L01.002, rheum.L01.005, rheum.L01.008, rheum.L01.012, rheum.L01.013]
    recap:
      - "Cytokines = proteins صغيرة (أقل من 30 kDa) بتشتغل على surface receptors، وبتنظّم المناعة مش بتقتل بنفسها."
      - "أكبر منتجين: Th cells و macrophages، وأي nucleated cell ممكن لفترة قصيرة."
      - "Autocrine لنفسها، paracrine للجار؛ endocrine مش الطبيعي عشان الكمية صغيرة والعمر قصير."
      - "الخلية بتسمع بس لو عندها الـ receptor، والـ affinity عالية جدًا."
    practice: [rheum.L01.001, rheum.L01.002, rheum.L01.003, rheum.L01.004, rheum.L01.005, rheum.L01.006, rheum.L01.007, rheum.L01.008, rheum.L01.009, rheum.L01.010, rheum.L01.011, rheum.L01.012, rheum.L01.013]
