        text: |
          الكتاب كاتبها بالخط العريض: ==There is no disease entity called mesangioproliferative GN==. ده **pattern** لازم يتكمّل بـ immunofluorescence (IF) و electron microscopy (EM).

          الـ DD بتاعه: **IgA**، **resolving post-infectious glomerulonephritis (PIGN)**، **C3 glomerulopathy**، **Alport**، **lupus class II**، و **podocytopathy** (MCD أو focal segmental glomerulosclerosis (FSGS) مش ظاهر في العينة).

          والنتيجة في case 7: الـ creatinine دلوقتي **8.4**.
