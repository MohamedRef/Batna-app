            why: "110 ÷ 120 × 100 = 91.7% ≈ **92%**."
      - kind: try
        items: [res.L05.052, res.L05.054, res.L05.055, res.L05.057, res.L05.051]
    recap:
      - "Cohort: incidence/RR/AR، outcomes كتير، dose-response، temporal أكيد، rare exposure. بس attrition، عينة كبيرة، وقت وفلوس، ومش للمرض النادر."
      - "**DOC**: rare Disease ← case-control؛ many Outcomes ← cohort؛ rare Cause ← cohort."
