          <text x="165" y="337" text-anchor="middle" class="t-sm t-b">portal pressure ↓ → RAAS ↓ → more Na excreted</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 156
        text: |
          الـ TIPS زي **كوبري أكتوبر** فوق زحمة الكبد: الدم بيعدّي من الـ portal للـ hepatic vein من غير ما يقف في الإشارات. الضغط بيقل، فالـ **RAAS يهدى** والـ **Na يخرج**.

          بس الكوبري ده برضه بيعدّي **الـ ammonia** من غير ما الكبد يفلترها، علشان كده الـ **HE في 30%**.
      - kind: table
        page: 156
        title: "TIPS في سطور"
        columns: ["", "TIPS"]
        rows:
          - ["Consider when", "LVP needed more than 3 times a month, or paracentesis ineffective"]
          - ["Complications", "Shunt dysfunction, hepatic encephalopathy (30%)"]
          - ["Contraindications", "Severe liver failure, active infection, progressive renal failure, severe cardiopulmonary disease"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: check
        page: 156
        question: "Which of these contraindicates TIPS for refractory ascites?"
        options:
          - "Severe cardiopulmonary disease"
          - "Needing paracentesis 4 times a month"
          - "Grade 3 ascites"
          - "Prior SBP that has resolved"
        answer: 0
        why:
          - "صح: الـ TIPS بتزق دم أكتر للقلب اليمين، فالـ severe cardiopulmonary disease contraindication."
          - "ده **indication** (أكتر من 3 مرات في الشهر)."
          - "الـ grade 3 refractory مكان الـ TIPS الطبيعي."
          - "اللي ممنوع هو **active** infection، مش واحدة خلصت."
      - kind: explain
        page: 156
        title: "الـ LT والأجهزة"
        text: |
          - **LT** = الـ **definitive treatment**. والـ refractory ascites **exception to MELD** في أولوية القائمة.
          - **Alfapump:** pump تحت الجلد بالبطارية، بيسحب الـ ascites من الـ peritoneum **للمثانة**. للي الـ **TIPS والـ LT ممنوعين** عندهم. Safe، بيحسّن الـ **nutrition**، والـ transient renal dysfunction بيتصلح بالـ volume expansion.
          - **Vasoconstrictors + albumin:** terlipressin IV أو midodrine (alpha-1 agonist) oral؛ بيقللوا الـ splanchnic vasodilatation فالكلية تشتغل أحسن.
          - **Vaptans:** بيقللوا الـ ascites والبزل من غير زيادة الـ diuretics؛ أخطرهم **overcorrection of Na** (osmotic demyelination)، dehydration، renal injury، hepatotoxicity.
      - kind: aside
        tone: joke
        page: 157
        text: |
          الـ Alfapump أذكى سباك في العالم: بدل ما المريض ييجي المستشفى كل أسبوع يتبزل، الجهاز بيوصّل البطن **بالمثانة** والمريض بيصرّف الـ ascites في الحمام وهو بيقرا الجرنال. 🚽
      - kind: match
        page: 158
        prompt: "وصّل كل وسيلة بالحاجة اللي تميّزها:"
        pairs:
          - ["CART", "Contraindicated in SBP"]
          - ["Tunneled peritoneal catheter", "Home drainage into a vacuum bottle"]
          - ["Peritoneovenous shunt", "Can cause DIC"]
          - ["Alfapump", "Pumps ascites into the bladder"]
          - ["TIPS", "Hepatic encephalopathy in 30%"]
        why: "**CART**: بيفلتر الـ ascites من الخلايا ويركّزه ويرجّعه؛ ملوش تأثير على الكلية، بيقلل الـ albumin، و contraindicated في الـ **SBP**. **Tunneled catheter**: المريض بيصرّف في البيت، ومشاكله الـ catheter والـ peritonitis. **PVS**: بيرجّع الـ ascites للدورة، ومضاعفاته occlusion، peritonitis، **DIC** ونزيف؛ لمين مينفعش له بزل ولا LT ولا TIPS."
      - kind: try
        items: [hb.L09.079, hb.L09.082, hb.L09.090]
    recap:
