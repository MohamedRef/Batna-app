  - id: rheum.L02.lesson9
    title: "الخلاصة: من غير أعراض، النوبة، وطول العمر"
    hook: "الكتاب بيرجع في آخر المحاضرة يلمّ الخيوط: مين نعالجه، بإيه، وإمتى نسيبه."
    minutes: 8
    pages: [45, 47]
    topics: [acute-tx, ult]
    goals:
      - "تعرف تعمل إيه مع الـ asymptomatic hyperuricaemia، وليه مفيش دوا"
      - "تعدّ وسايل علاج النوبة والقاعدتين بتوعها"
      - "تعرف مشاكل الـ steroids، ومين محتاج hypouricaemic drug طول العمر"
    status: unverified
    steps:
      - kind: explain
        page: 45
        quote: "Hyperuricemia: when sUA level persistently above 6,8 mg/dL or 0,41 mmol/l."
        title: "الـ asymptomatic hyperuricaemia"
        text: |
          الكتاب هنا بيعرّفها كـ serum uric acid **فوق 6.8 mg/dL (0.41 mmol/l) بشكل مستمر**.

          الإدارة:
          - **دوّر على السبب وعالجه**، خصوصًا الـ ==metabolic syndrome== وأمراضه.
          - **مفيش دليل كفاية** إن علاجها بدوا بيمنع gout أو مرض كلى أو أحداث قلبية.

          ليه مفيش دوا؟ التفسير المقبول (مش في الكتاب): 85% منهم عمرهم ما هيجيلهم gout (صفحة 24)، فلو عالجت الكل هتدّي دوا طول العمر لناس كتير مش محتاجينه، بكل الـ side effects بتاعته، من غير فايدة مثبتة.
      - kind: figure
        page: 45
        quote: "Uric acid crystal deposits visualized by DECT"
        title: "الـ urate المترسب على الـ DECT"
        image: { file: rheum/L02-dect-hand.webp, book: true }
        marks:
          - { at: [0.61, 0.58], label: "Urate deposit (green)" }
          - { at: [0.91, 0.58], label: "Urate deposit (green)" }
        alt: "Two dual-energy CT reconstructions of the same hand. A: a red three-dimensional rendering with lumpy deposits over the fingers and wrist. B: the bones in white with urate deposits coloured green around the joints and purple patches over the bones and wrist."
        caption: |
          صورتين **dual-energy CT** لنفس الإيد:

          - **شمال (A)**: صورة 3D حمرا، والكتل اللي على الصوابع والرسغ هي الترسيب.
          - **يمين (B)**: العضم أبيض، والـ urate المترسب ملوّن **أخضر** حوالين المفاصل (أوضحه عند 1 و 2).

          الصورة بتورّي قد إيه الـ urate ممكن يترسّب في الأنسجة، وده سبب إن الـ hyperuricaemia المستمرة مش رقم وخلاص.
      - kind: check
        page: 45
        quote: "There is insufficient evidence to recommend treatment of asymptomatic hyperuricemia to prevent gouty arthritis, renal disease or cardiovascular events."
        question: "Uric acid 9 mg/dL, no gout, no stones. What does the book recommend?"
        options: ["Find and manage the cause; no ULT", "Allopurinol 100 mg", "Febuxostat 40 mg", "Colchicine prophylaxis"]
        answer: 0
        why:
          - "صح: insufficient evidence لعلاج الـ asymptomatic hyperuricaemia؛ عالج السبب (metabolic syndrome)."
          - "مفيش indication للـ ULT من غير gout."
          - "نفس السبب."
          - "الـ prophylaxis مع الـ ULT بس."
      - kind: explain
        page: 45
        quote: "As a rule drugs work better when given early."
        title: "النوبة: الوسايل والقاعدتين"
        text: |
          الكتاب بيعدّ وسايل علاج النوبة: **icing و rest**، colchicine، NSAIDs، glucocorticoids، ACTH، anticytokines. والـ colchicine والـ NSAIDs **frequently combined**.

          وبعدين قاعدتين، وكل واحدة ليها سبب:
          - ==Drugs work better when given early==: عشان الالتهاب دايرة بتكبر نفسها في ساعات، فالأحسن تقطعها في أولها.
          - **No effect on uricemia; cannot cure gout**: عشان دي أدوية **ضد الالتهاب**، مش ضد البلورة. اللي بيشفي هو الـ ULT.
      - kind: aside
        tone: exam
        page: 46
        quote: "Terkeltaub et al.* RCT comparing 2 dosages given early (<12h) 180 patients mg/d (1.2 + 0.6 1h after) is as efficient and better tolerated than 4.8 mg/d (1.2 + 0.6/h x 6).\n  Terkeltaub RA, et al. High versus low dosing of oral colchicine for early acute gout flare: Twenty-four-hour outcome of the first multicenter, randomized, double-blind, placebo-controlled, parallel-group, dose-comparison colchicine study. Arthritis Rheum 2010,62(4):1060-8."
        text: "Terkeltaub randomised controlled trial (RCT): الجرعة الصغيرة بدري (1.2 mg وبعد ساعة 0.6 mg) = نفس فعالية الـ 4.8 mg، بس أخف بكتير على البطن. والـ tolerance بتعتمد على الجرعة والكلى والكبد والـ drug interactions."
      - kind: explain
        page: 46
        quote: "Frequent rebounds with orals. Patients may remain on long-term steroid therapy."
        title: "مشاكل الـ steroids، وليه"
        text: |
          الكتاب بيقول على الـ systemic steroids:
          - الجرعة **30 mg prednisone أو أكتر**.
          - ==Worsen hypertension and diabetes==: ودول أصلًا عوامل خطر ومرتبطين بالـ hyperuricaemia (صفحة 27 و 29)، فإنت بتعالج النوبة وبتبوّظ الأرضية.
          - **Rebounds متكررة** مع الـ oral، والمريض ممكن **يفضل على steroid طويل**.
          - الـ indication: اللي مايقدرش ياخد colchicine أو NSAIDs. والـ ACR بيحطهم first line زي الـ colchicine.

          التفسير المقبول (مش في الكتاب) للـ rebound: الـ steroid بيطفي الالتهاب بس البلورات لسه موجودة، فلما تقلل الجرعة بسرعة الالتهاب بيرجع.
      - kind: table
        page: 47
        quote: "Anti-interleukin-1 (IL-1) agents\nFor Refractory Gout When Nsaids, Colchicine, Gc Are Ineffective Or When Patient Have Contraindications To Any Of The Three Option Drugs.\n| Agent | Action and dose |\n|---|---|\n| ANAKINRA | IL-1 reseptor Antagonist; 100 mg/D, Sc |\n| RILONACEPT | Dimeric fusion protein directed against IL-1; 80-120 mg/weekly, Sc |\n| CANAKINUMAB | Fully humanized monoclonal antibody directed at IL-1β; 150 mg Sc |"
        title: "الـ IL-1 inhibitors"
        columns: ["Drug", "How", "Dose"]
        rows:
          - ["Anakinra", "IL-1 receptor antagonist", "100 mg/d SC"]
          - ["Rilonacept", "Decoy fusion protein", "80-120 mg/week SC"]
          - ["Canakinumab", "Anti-IL-1β antibody", "150 mg SC"]
        hide: [[0, 1], [2, 1]]
      - kind: explain
        page: 47
        quote: "Correction of any modifiable predisposing factors and patient education.\n  Lifestyle alteration to correct obesity, stop diuretic give alternative."
        title: "على المدى الطويل"
        text: |
          الـ gout **potentially curable**:

          - صحّح العوامل: الوزن، وقّف الـ ==diuretic== وادّي بديل، وعلّم المريض.
          - **Prolonged hypouricaemic therapy** في: نوبات متكررة، tophi، تآكل عضم أو مفصل، مرض كلى أو حصوات، uric acid عالي جدًا.

          التفسير المقبول (مش في الكتاب): ليه potentially curable؟ عشان البلورة بتتكون من الـ urate اللي فوق حد الذوبان، فلو نزّلت المستوى تحت 6 لمدة كفاية البلورات بتدوب والنوبات بتقف. يعني على عكس أغلب أمراض المفاصل، الـ gout له سبب تقدر تشيله. ووقف الـ diuretic عشان هو من أشهر أسباب ضيق البلاعة (صفحة 26).
      - kind: figure
        page: 47
        quote: "Once acute attack has resolved long term treatment needs consideration."
        title: "تلات مراحل، تلات أهداف"
        alt: "Three boxes in a row joined by arrows. Asymptomatic hyperuricaemia: find and treat the cause, no drug. Acute attack: anti-inflammatory early, no effect on urate. Interval and chronic: lifestyle, stop diuretic, urate-lowering therapy to target with prophylaxis."
        caption: "من غير أعراض: عالج السبب بس. في النوبة: anti-inflammatory بدري. بعد النوبة: الـ ULT والـ lifestyle هما اللي بيشفوا."
