    front: What is the imaging of choice to screen for intracranial aneurysm in ADPKD, and why?
    back: "Magnetic resonance angiography: noninvasive and needs no IV contrast. CT angiography is an alternative if contrast is allowed."
    src: { page: 152, quote: "Magnetic resonance angiography is the diagnostic imaging modality of choice for presymptomatic screening because it is noninvasive and does not require IV contrast administration. CT angiography is a sat-isfactory alternative if there is no contraindication to IV contrast. Repeated screening of patients with a strong family history of intra-cranial aneurysms or aneurysmal rupture after 5 to 10 years is recommended." }
