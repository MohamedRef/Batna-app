    quote: |-
      Pharmacotherapy:
        When choosing glucose-lowering medications for people with type 2 diabetes and overweight or obesity, consider the medication's effect on weight.
        Obesity pharmacotherapy is effective as an adjunct to nutrition, physical activity, and behavioral counseling for selected people with type 2 diabetes and BMI ≥27 kg/m2.
        If obesity pharmacotherapy is effective (typically defined as ≥5% weight loss after 3 months' use), further weight loss is likely with continued use.
        When early response is insufficient or if there are significant safety or tolerability issues, consider discontinuation of the medication and evaluate alternative drugs or treatment approaches.
      Metabolic surgery:
        8. Metabolic surgery should be a recommended option to treat type 2 diabetes with BMI ≥40 kg/m2 and in adults with BMI 35.0–39.9 kg/m2 who do not achieve durable weight loss and improvement in comorbidities (including hyperglycemia) with nonsurgical methods.
        9. Metabolic surgery may be considered as an option to treat type 2 diabetes in adults with a BMI of 30.0–34.9 kg/m2 who do not achieve durable weight loss and improvement in comorbidities (including hyperglycemia) with nonsurgical methods.
        10. Metabolic surgery should be performed in high-volume centers with multidisciplinary teams knowledgeable about and experienced in managing obesity, diabetes, and gastrointestinal surgery.
