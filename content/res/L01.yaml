  # ---------- slides 25-31: translational research and trial phases ----------
  - id: res.L01.030
    kind: card
    topic: translational
    front: Define translational research (TR).
    back: The process of transforming discoveries made in the laboratory and clinic into interventions that improve public health and well-being.
    src: { page: 25, quote: "Translational Research is the process of transforming discoveries made in the laboratory and clinic into interventions that improve public health and well being." }
    status: unverified
    tags: [high-yield]
  - id: res.L01.031
    kind: cloze
    topic: translational
    text: "The 3 main pillars of TR are {{c1::bench}} (basic biomedical research), {{c2::bedside}} (clinical research) and {{c3::community}} (improved health)."
    src: { page: 25, quote: "3 main pillars of TR" }
    status: unverified
  - id: res.L01.032
    kind: card
    topic: translational
    front: Where along the research continuum does translation occur?
    back: From basic to clinical research, from clinical research to clinical practice, and from clinical practice to the implementation and dissemination of public health interventions.
    src: { page: 26, quote: "from basic to clinical research, from clinical research to clinical practice, and from clinical practice to the implementation and dissemination of public health interventions." }
    status: unverified
  - id: res.L01.033
    kind: table
    topic: translational
    title: The translational research continuum, T1-T4
    columns: [Phase, Translation to, What it tests]
    rows:
      - [T1, Humans, Basic science discoveries for clinical effect and/or applicability]
      - [T2, Patients, New interventions in human subjects under controlled conditions; the basis for clinical applications and guidelines]
      - [T3, Practice, Applying new interventions in general practice; how best to implement them in the clinic]
      - [T4, Population, Factors and interventions that influence the health of populations]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [1, 2]]
    src: { page: 31, quote: "T2: Translation to Patients Testing new interventions in human subjects under controlled environments to form" }
    status: unverified
    tags: [high-yield]
  - id: res.L01.034
    kind: order
    topic: translational
    prompt: Order the stages of the translational research continuum.
    steps: [Basic science, Humans (T1), Patients (T2), Practice (T3), Population (T4)]
    src: { page: 31, quote: "Translational research continuum" }
    status: unverified
  - id: res.L01.035
    kind: mcq
    topic: translational
    stem: A study tests a new DAA regimen for HCV in a randomized controlled trial to form the basis of a treatment guideline. Which translational phase is it?
    options: [T2, T1, T3, T4]
    answer: 0
    why:
      - Correct. T2 tests new interventions in humans under controlled environments to form the basis for clinical applications and guidelines (phase II and III trials).
      - T1 tests basic science discoveries for clinical effect (preclinical, first-in-human, phase I).
      - T3 studies applying the intervention in general practice (phase IV, implementation).
      - T4 studies factors and interventions that affect the health of populations.
    src: { page: 31, quote: "T2: Translation to Patients Testing new interventions in human subjects under controlled environments to form" }
    status: unverified
  - id: res.L01.036
    kind: mcq
    topic: translational
    stem: After a drug is approved, a team studies how best to get Egyptian primary care clinics to prescribe it correctly. Which translational phase is this?
    options: [T3, T1, T2, T4]
    answer: 0
    why:
      - Correct. T3 is translation to practice, including dissemination and implementation research.
      - T1 tests basic discoveries in humans for the first time.
      - T2 tests the intervention under controlled conditions.
      - T4 measures the effect on the health of the whole population.
    src: { page: 31, quote: "T3: Translation to Practice Research on the application of new interventions or therapies in general practice;" }
    status: unverified
  - id: res.L01.037
    kind: table
    topic: translational
    title: "Translational research spectrum (slide 30): which studies sit in each T"
    columns: [Phase, Studies]
    rows:
      - ["T1 (to humans)", "Preclinical and animal studies, first-in-human studies, phase I trials"]
      - ["T2 (to patients)", "Phase II and phase III trials"]
      - ["T3 (to practice)", "Phase IV trials, dissemination and implementation research"]
      - ["T4 (to population health)", "T3 studies in the community, population outcome studies"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 30, quote: "Phase II clinical trials Phase IV clinical trials T3 studies in the Phase III clinical trials Dissemination and community" }
    status: unverified
  - id: res.L01.038
    kind: cloze
    topic: translational
    text: Between T3 and T4 on the translational spectrum sits {{c1::dissemination}}. Moving from T1 to T4, the control of experimental conditions {{c2::falls}} while the sample size {{c3::grows}}.
    src: { page: 30, quote: "Dissemination" }
    status: unverified
  - id: res.L01.039
    kind: table
    topic: translational
    title: "Phases of clinical trials (slide 29)"
    columns: [Phase, Main question, Participants]
    rows:
      - [Preclinical, Lab and animal studies, "-"]
      - [Phase I, "Safety study; safety and best dosage", "20-80 people"]
      - [Phase II, "Safety, side effects, first measure of effectiveness", "100-300 people"]
      - [Phase III, "Effectiveness on a larger scale; new vs standard treatment; side effects", "1,000-3,000 people"]
      - [Phase IV, "After approval: long-term side effects not seen in phase III", Thousands]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1], [1, 2], [3, 2]]
    src: { page: 29, quote: "Safety study * 20-80 people * Identify side effects effectiveness side effects" }
    status: unverified
    tags: [high-yield, numbers]
  - id: res.L01.040
    kind: mcq
    topic: translational
    stem: In which clinical trial phase is a new treatment compared with the standard treatment in hundreds to thousands of participants?
    options: [Phase III, Phase I, Phase II, Phase IV]
    answer: 0
    why:
      - Correct. Phase III compares new and standard treatment on a larger scale (1,000-3,000 people).
      - Phase I establishes safety and best dosage in a small group.
      - Phase II records the preliminary response and side effects in a medium group (100-300).
      - Phase IV follows the drug after approval.
    src: { page: 29, quote: "Results are compared between new and standard treatment. Hundreds to thousands of participants" }
    status: unverified
  - id: res.L01.041
    kind: mcq
    topic: translational
    stem: Which phase of clinical trials happens after the drug is approved, to detect side effects not apparent earlier?
    options: [Phase IV, Phase III, Phase II, Phase 0]
    answer: 0
    why:
      - Correct. Post-marketing studies monitor long-term safety in thousands of people.
      - Phase III is before approval and compares new vs standard treatment.
      - Phase II measures preliminary response and side effects.
      - Phase 0 looks at the effect on the body in a handful of people.
    src: { page: 29, quote: "After treatment is approved, it is studied to evaluate side effects not apparent in Phase III." }
    status: unverified
