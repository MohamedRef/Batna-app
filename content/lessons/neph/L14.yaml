  - id: neph.L14.lesson9
    title: "الـ light chains والـ sarcoid"
    hook: "نفس الـ light chain ممكن تعمل 4 أمراض مختلفة، على حسب هي وقفت فين في الـ nephron."
    minutes: 6
    pages: [494, 503]
    topics: [dysprot, sarcoid]
    goals:
      - "تفرّق MGUS و MGRS و myeloma"
      - "تعرف مكان كل lesion للـ light chains"
      - "تعالج بالـ clone-directed therapy، وتعرف علاج كلية الـ sarcoid"
    status: unverified
    steps:
      - kind: explain
        page: 495
        title: "MGUS ولا MGRS؟"
        quote: "When monoclonal gammopathy-related kidney damage occurs in the absence of overt malignancy, the hematologic disorder is categorized as monoclonal gammopathy of renal significance"
        text: |
          - "**MGUS**: monoclonal protein **من غير** end-organ damage."
          - "==MGRS==: الـ monoclonal protein **بيأذي الكلية** من غير malignancy واضحة."
          - "**Myeloma**: ~**11/100,000** سنوياً، و **20-30%** بييجوا بـ GFR واطي."

          الفكرة: بروتين قليل ممكن يبقى سام لوحده، مش لازم clone كبير.
      - kind: figure
        page: 499
        quote: "Cast Nephropathy (also known as Myeloma Kidney)"
        title: "الـ light chain وقفت فين؟"
        alt: "A nephron drawn left to right: glomerulus (AL amyloidosis fibrils and light chain deposition disease along basement membranes), proximal tubule (Fanconi syndrome from light chain crystals and cell injury from excess endocytosis), and distal tubule (cast nephropathy, light chains with Tamm-Horsfall protein forming casts)."
        caption: "==Glomerulus==: AL و LCDD. ==Proximal==: Fanconi. ==Distal==: cast nephropathy (myeloma kidney)، أشهر سبب لـ GFR واطي في الـ myeloma."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="70" r="36" class="fg-acc"/>
            <text x="50" y="66" text-anchor="middle" class="t-sm t-b">Glomerulus</text>
            <text x="50" y="82" text-anchor="middle" class="t-sm">AL, LCDD</text>
            <path d="M86 70 H130 Q150 70 150 90 V150 Q150 170 170 170 H200 Q220 170 220 150 V90 Q220 70 240 70 H315" class="fg-thin"/>
            <rect x="110" y="100" width="80" height="44" rx="8" class="fg-box"/>
            <text x="150" y="118" text-anchor="middle" class="t-sm t-b">Proximal</text>
            <text x="150" y="134" text-anchor="middle" class="t-sm">Fanconi</text>
            <rect x="225" y="40" width="95" height="60" rx="8" class="fg-bad"/>
            <text x="272" y="60" text-anchor="middle" class="t-sm t-b">Distal</text>
            <text x="272" y="76" text-anchor="middle" class="t-sm">Cast</text>
            <text x="272" y="91" text-anchor="middle" class="t-sm">nephropathy</text>
            <text x="165" y="205" text-anchor="middle" class="t-sm t-mut">FLC + Tamm-Horsfall = cast</text>
          </svg>
      - kind: explain
        page: 496
        title: "Cast nephropathy"
        quote: "The most common cause of decreased GFR in patients with multiple myeloma is light chain cast nephropathy."
        text: |
          الـ **free light chains** بتلزق في **Tamm-Horsfall protein** (uromodulin) في الـ **distal** nephron وتعمل casts ← obstruction ← **giant cell reaction** و interstitial inflammation.

          وفي الـ proximal: endocytosis زيادة عن طريق **cubilin-megalin** ← NF-κB ← IL-6 و TGF-β1 ← fibrosis.

          ⚠️ هنا **الـ diuretics مش لازمة وممكن تضر**، عكس الـ AL amyloidosis (nephrotic، محتاج diuretics).
      - kind: check
        page: 500
        quote: "while diuretic is not necessary and is potentially contraindicated in light chain cast nephropathy."
        question: "A myeloma patient has AKI from light chain cast nephropathy and mild ankle edema. Furosemide?"
        options:
          - "Not needed and potentially contraindicated"
          - "Essential, as in AL amyloidosis"
          - "Give high-dose to flush the casts"
          - "Only with albumin"
        answer: 0
        why:
          - "صح: الكتاب بيقول مش لازم وممكن يكون contraindicated في الـ cast nephropathy."
          - "الـ AL amyloidosis هو اللي بيعمل nephrotic ومحتاج diuretics."
          - "مش مذكور، والـ diuretic ممكن يساعد الـ casts تترسب."
          - "مش مذكور."
      - kind: explain
        page: 501
        title: "العلاج: اضرب الـ clone"
        quote: "Treatment is no longer decided by the renal histology but rather, is decided by the nature of the clone producing the M protein."
        text: |
          - القرار بنوع الـ **clone**، مش بالـ histology.
          - الـ RAS blockade والـ immunosuppression التقليدي **مش بيمنعوا ESRD**.
          - "==Bortezomib== أهم دوا: مع cyclophosphamide و dexamethasone، response **94%** و VGPR **66-71%**."
          - "**VGPR**: dFLC **<40 mg/L** أو نزول **>90%**."
          - **ASCT** بيحسّن الـ response؛ thalidomide و lenalidomide أضعف.
