        text: |
          الجرعات اللي في الكتاب (10 mg مع AZA أو 20 mg لوحده) شكلها جرعات **maintenance**. الـ **induction** في AASLD أعلى: **prednisone 20-40 mg + azathioprine** أو **40-60 mg لوحده**. **في الامتحان: أرقام الكتاب.**
        ref: "AASLD AIH practice guidance 2019"
