        <text x="272" y="117" text-anchor="middle" class="t-sm t-b">Qualitative</text>
        <rect x="4" y="142" width="80" height="48" rx="6" class="fg-box"/>
        <text x="44" y="160" text-anchor="middle" class="t-sm t-b">Continuous</text>
        <text x="44" y="176" text-anchor="middle" class="t-sm t-mut">measured</text>
        <rect x="90" y="142" width="80" height="48" rx="6" class="fg-box"/>
        <text x="130" y="160" text-anchor="middle" class="t-sm t-b">Discrete</text>
        <text x="130" y="176" text-anchor="middle" class="t-sm t-mut">counted</text>
        <rect x="180" y="142" width="74" height="48" rx="6" class="fg-box"/>
        <text x="217" y="160" text-anchor="middle" class="t-sm t-b">Ordinal</text>
        <text x="217" y="176" text-anchor="middle" class="t-sm t-mut">ordered</text>
        <rect x="260" y="142" width="76" height="48" rx="6" class="fg-box"/>
        <text x="298" y="160" text-anchor="middle" class="t-sm t-b">Nominal</text>
        <text x="298" y="176" text-anchor="middle" class="t-sm t-mut">no order</text>
        <path d="M90 126L48 140M120 126L130 140M255 126L222 140M290 126L298 140" class="fg-arrow"/>
      </svg>
    caption: الـ variables يا كمية (continuous بتتقاس، discrete بتتعد) يا نوعية (ordinal ليها ترتيب، nominal ملهاش).
    alt: 'Tree: data splits into constant and variables; variables into quantitative (continuous, discrete) and qualitative
      (ordinal, nominal).'
  - kind: explain
    page: 16
    quote: |-
      B- Discret or discontinus quantitative variables:
      Which are obtained by enumeration and its value is always integer value.
      Examples:
      Pulse
      Family size
      Number of live births
      Number of abortions.
    title: 'الكمي: قِسته ولا عدّيته؟'
    text: |-
      - **Continuous**: جه من ==measurement==، ينفع يبقى كسر: weight، height، hemoglobin، age، income، volume of urine.
      - **Discrete**: جه من ==enumeration== (عد)، دايمًا رقم صحيح: pulse، family size، number of live births، number of abortions.

      السؤال السحري: **«ينفع يبقى 2.5؟»** لو آه → continuous. لو لأ (مفيش 2.5 عيل) → discrete.
  - kind: aside
    page: 16
    quote: |-
      B- Discret or discontinus quantitative variables:
      Which are obtained by enumeration and its value is always integer value.
      Examples:
      Pulse
      Family size
      Number of live births
      Number of abortions.
    tone: trap
    text: |-
      الـ **pulse** في السلايدز ==discrete==، لأنك بتعد الضربات. ومتتلخبطش: الـ age والـ income في السلايدز continuous.
  - kind: explain
    page: 17
    quote: |-
      Qualitative variables
      Which are expressed in quality and cannot be enumerated or measured but can be categorized only.
    title: Qualitative variable
    text: |
      الـ **qualitative variable** بيتعبّر عنه ==بالنوع (quality)==: ==مايتعدّش ولا يتقاس==، بس ==يتصنّف==.

      مثال توضيحي: فصيلة الدم أو النوع.

      ليه ده مهم؟ لأن نوع المتغير بيحدد الجدول والرسمة والمقياس المسموح بيه، فالـ mean مثلًا ماينفعش هنا. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 18
    quote: |-
      a- Ordinal qualitative variables :
      Can be put in order:
      Examples
      Degree of success
      excellent
      very good
      good
      fair
      Degree of a disease:
      mild
      moderate
      severe
    title: 'Ordinal: ليه ترتيب'
    text: |
      الـ **ordinal qualitative variable** = متغير نوعي ==categories بتاعته ليها ترتيب==.

      أمثلة السلايد:

      - ==Degree of success==: excellent، very good، good، fair.
      - ==Degree of a disease==: mild، moderate، severe.

      ليه الترتيب يفرق؟ لأنه بيسمح بالـ median، بس المسافة بين الدرجات مش متساوية فالـ mean لأ. التفسير المقبول (مش في الكتاب).
  - kind: check
    page: 18
    quote: |-
      a- Ordinal qualitative variables :
      Can be put in order:
      Examples
      Degree of success
      excellent
      very good
      good
      fair
      Degree of a disease:
      mild
      moderate
      severe
    question: 'Disease severity graded as mild, moderate or severe is:'
    options:
    - Ordinal qualitative
    - Nominal qualitative
    - Discrete quantitative
    - Continuous quantitative
    answer: 0
    why:
    - 'صح: categories ليها ترتيب.'
    - الـ nominal مالوش ترتيب، وهنا فيه.
    - مفيش عدّ هنا.
    - مفيش قياس هنا.
  - kind: explain
    page: 19
    quote: |-
      b- Nominal qualitative variables :
      Can not be put in order and is further subdivided into:
      Dichotomous
      Examples
      Sex
      Yes / no variables
      Multichotomous
      Examples
      Marital status:
      (married, single, divorced, widow)
      Blood groups: A, B, AB, O
    title: 'النوعي: ليه ترتيب ولا لأ؟'
    text: |-
      - **Ordinal**: فئات ليها ==ترتيب==: degree of success (excellent، very good، good، fair)، degree of disease (mild، moderate، severe).
      - **Nominal**: فئات ==ملهاش ترتيب==:
        - **Dichotomous** (اتنين بس): sex، yes/no.
        - **Multichotomous** (أكتر): marital status، blood groups A، B، AB، O.
  - kind: sort
    page: 20
    quote: |-
