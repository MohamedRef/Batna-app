    caption: من الـ clinical problem للسؤال للـ search للـ appraisal للقرار، وترجع للمشكلة.
    alt: 'Cycle: clinical problem, answerable question, search articles, critical appraisal, decision on diagnosis and treatment,
      back to the problem.'
  - kind: explain
    page: 110
    quote: |-
      Step 5: Evaluate your performance with this patient
      Assess the performance
      Expected clinical outcome ??
      Easy to apply to patient ??
      Applicable to our practice??
      How to further improvise?? etc....
    title: 'Step 5: Assess'
    text: |-
      قيّم أداءك مع المريض ده:

      - الـ **expected clinical outcome** حصل؟
      - كان **easy to apply**؟
      - **Applicable** للممارسة بتاعتنا؟
      - نحسّن إزاي المرة الجاية؟
  - kind: explain
    page: 111
    quote: |-
      Challenges in adopting EBM??
      Technology and online information resources must be available to the clinicians.
      Understanding of the epidemiological study designs and concepts of biostatistics should be clear
      Attitude of the clinician: one must realize that clinical performance depends upon regularly updating knowledge and not merely on practical clinical experience
    title: تحديات الـ EBM
    text: |-
      - **Technology**: مصادر online متاحة للدكاترة.
      - **Understanding**: الـ study designs والـ biostatistics لازم تبقى واضحة.
      - **Attitude**: الأداء بيعتمد على ==updating knowledge== بانتظام، مش الخبرة العملية بس.
    remind: [res.L19.108]
  - kind: aside
    page: 112
    quote: |-
      Final words to remember:
      EBM builds on and reinforces but never replaces your clinical judgment or experience.
    tone: exam
    text: |-
      الجملة الأخيرة: الـ EBM ==builds on and reinforces== بس **never replaces** الـ clinical judgment والـ experience.
  - kind: table
    page: 114
    quote: |-
      Knowing EBM is like knowing 1-2-3-4.
      EBM has one goal, two fundamental principles, three components and four steps.
      I. One goal is to improve quality of clinical care.
      II. Two principles are hierarchy of evidence and insufficiency of evidence alone in decision-making.
    title: EBM = 1-2-3-4
    columns:
    - ''
    - What
    rows:
    - - 1 goal
      - Improve quality of clinical care
    - - 2 principles
      - Hierarchy of evidence; evidence alone is insufficient for decisions
    hide:
    - - 0
      - 1
    - - 1
      - 1
  - kind: explain
    page: 115
    quote: |-
      Knowing About EBM (1-2-3-4)
      Three components are (Evidence, Expertise and Expectations of patients) (i.e. triple Es).
      Four steps are (Ask, Acquire, Assess and Apply) (i.e 4 As).
    title: 3 components و4 steps
    text: |-
      - **3 components**: Evidence، Expertise، Expectations of patients (triple Es).
      - **4 steps** في الـ slide ده: Ask، Acquire، Assess، Apply (4 As).

      خلي بالك: slide 48 بيعدّ ==5 As== (بيزوّد Appraise). لو السؤال قال «five steps»، الـ 5 As.
    remind: [res.L19.021, res.L19.040]
  - kind: explain
    page: 116
    quote: |-
      Knowledge and Skills Necessary for Optimal Evidence-Based Practice
      Diagnostic expertise
      In-depth background knowledge
      Effective searching skills
      Effective critical appraisal skills
      Ability to define and understand benefits and risks of alternatives
      In-depth physiologic understanding allowing application of evidence to the individual
      Sensitivity and communication skills required for full understanding of patient context
      Ability to elicit and understand patient values and preferences and apply them to management decisions
    title: المهارات اللي محتاجها علشان تمارس EBM صح
    text: |
      السلايد بتعدّ 8 مهارات:

      - Diagnostic expertise.
      - In-depth background knowledge.
      - ==Effective searching skills==.
      - ==Effective critical appraisal skills==.
      - تعرف وتفهم benefits وrisks البدائل.
      - فهم physiology عميق علشان تطبّق على الفرد.
      - Sensitivity وcommunication skills علشان تفهم ظروف المريض.
      - ==تطلّع قيم المريض وتفضيلاته== وتطبّقها في القرار.

      ليه الليستة طويلة كده؟ لأن الـ evidence لوحده مش كفاية؛ نصها مهارات دكتور ونصها مهارات مع المريض. التفسير المقبول (مش في الكتاب).
  - kind: check
    page: 125
    quote: |-
      Q 6:When adopting an EBM approach in clinical practice, which of the following statements is CORRECT?
      A. Textbooks could be a suitable source for evidence.
      B. PICO format is a good approach for answering a clinical question.
      C. We cannot depend on expert opinion in the absence of suitable source for evidence to answer a specific question.
      D. When applying the evidence , the doctor should decide whatever the patient's preferences .
      E. Critical appraisal should be done to the filtered evidence.
    question: When adopting an EBM approach, which statement is CORRECT?
    options:
    - PICO format is a good approach for answering a clinical question
    - When applying evidence, the doctor decides whatever the patient's preferences
    - Critical appraisal should be done to the filtered evidence
    - We cannot depend on expert opinion when no suitable evidence exists
    answer: 0
    why:
    - 'صح: الـ PICO بيبني السؤال اللي بتدور له على إجابة.'
    - قيم المريض من الـ 3 Es.
    - الـ filtered اتقيم خلاص؛ انت بتقيم الـ unfiltered.
    - الـ expert opinion = grade C لما مفيش دراسات.
  - kind: try
    items: [res.L19.104, res.L19.108, res.L19.111]
  recap:
  - Apply بعد ما الدراسة تبقى valid وclinically significant.
  - '5 أسئلة: feasible، مختلف؟، alternatives، benefits vs harms، رأي المريض.'
  - لو الـ NNTs متقاربة، اختار الـ NNH الأعلى (side effects أقل).
  - 'التحديات: technology، understanding، attitude.'
  - 1 goal، 2 principles، 3 Es، والـ As (4 في الملخص، 5 في slide 48).
