        title: "Hereditary angioedema"
        quote: "Hereditary angioedema (HAE) results from absent (type I) or defective (type II) C1 esterase inhibitor (C1INH). It is an autosomal dominant trait."
        text: |
          - السبب: **C1 esterase inhibitor (C1INH)** ==غايب (type I)== أو ==بايظ (type II)==، و **autosomal dominant**
          - **الشكل:** تورم تحت الجلد في الوش (خصوصًا الشفايف)، الزور، الإيدين، الدراعات، الرجلين، الأعضاء التناسلية والمقعدة، بيقعد **2 لـ 5 أيام**. ==من غير التهاب==، وأحيانًا urticaria خفيفة وعابرة قبله
          - **البطن:** ألم، غثيان، ترجيع، ونادرًا إسهال مائي

          ليه نسخة واحدة بايظة كفاية (dominant)؟ التفسير المقبول (مش في الكتاب): النسخة السليمة بتعمل نص الكمية بس، والنص ده بيتستهلك بسرعة وقت أي trigger، فالفرامل بتخلص.
