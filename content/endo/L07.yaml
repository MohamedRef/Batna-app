    src: { page: 128, quote: "Causes\n  Undiagnosed addison's disease in patients on steroid replacement with intercurrent infection or acute stress with failure to increase the steroid dose.\n  Rare causes include:\n    Bilateral adrenal infarction/hemorrhages.\n    Secondary adrenal failure, which can present with hypoglycemia.\n  Primary adrenal insufficiency is usually due to:\n    Autoimmune conditions.\n    Tuberculosis.\n    Metastases or even.\n    Drugs like antifungals.\n  Secondary adrenal insufficiency is due to:\n    Pituitary pathology where there is only glucocorticoid deficiency without any mineralocorticoid deficiency; hence, adrenal crisis is rare.\n  Adrenal crisis can also occur in patients who have abruptly stopped their steroid medication." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.068
    kind: card
    topic: adrenal
    front: How does acute adrenal insufficiency present, and when should you suspect it?
    back: "Shock with non-specific features: anorexia, nausea, vomiting, abdominal pain, fever, lethargy. Suspect it in any shocked patient, even without adrenal history, especially with unexplained severe hypoglycaemia or hyponatraemia."
    src: { page: 129, quote: "Clinical Features\n  Acute adrenal insufficiency is a potentially life- threatening emergency that presents with shock and non-specific clinical features such as:\n    Anorexia\n    Nausea.\n    Vomiting\n    Abdominal Pain\n    Fever.\n    General lethargy.\n  Adrenal crisis should be considered in any patient who presents in a state of shock even when there is no prior history of adrenal disease, particularly if there is coexisting unexplained severe hypo- glycemia or hyponatremia." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.069
    kind: card
    topic: adrenal
    front: Which bloods are taken before steroids in suspected adrenal crisis, and should treatment wait for the ACTH test?
    back: Electrolytes, cortisol and ACTH. The short ACTH test is ideal for diagnosis, but treatment must never be delayed in a sick patient.
    src: { page: 129, quote: "Before initiating steroid treatment\n  The diagnosis is ideally made by a short ACTH stimulation test.\n  However, there should be no reason to delay treatment in a sick patient." }
    status: unverified
  - id: endo.L07.070
    kind: card
    topic: adrenal
    front: Can a basal cortisol exclude adrenal insufficiency? Which basal value shows an intact HPA axis?
    back: Basal and urinary free cortisol are often low-normal and cannot exclude it. A basal cortisol above 400 nmol/l (14.5 µg/dl) invariably indicates an intact HPA axis. (The book prints the units as mg/dl.)
    src: { page: 129, quote: "Basal plasma cortisol and urinary free cortisol levels are often in the low normal range and cannot be used to exclude the diagnosis. However, a basal cortisol value greater than 400 nmol/l (14.5 mg/dl) invariably indicates an intact HPA axis." }
    status: unverified
    tags: [numbers, high-yield]
  - id: endo.L07.071
    kind: card
    topic: adrenal
    front: How is the short synacthen test done and read?
    back: 250 µg tetracosactide IM or IV (the book prints "mg"); cortisol at 0 and 30 minutes. A normal peak is above 550 nmol/l (>20 µg/dl; the book prints mg/dl).
    src: { page: 130, quote: "Plasma cortisol levels are measured at 0 and 30 minutes after ACTH, and a normal response is defined by a peak plasma cortisol of greater than 550 nmol/l (>20 mg/dl)." }
    status: unverified
    tags: [numbers, high-yield]
