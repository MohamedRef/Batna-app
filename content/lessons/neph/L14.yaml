        text: "عايزة تحمل؟ الكتاب بيقول إن الـ **Azathioprine** هو البديل للـ MPAA في الـ maintenance بعد الـ initial therapy للي بتفكر في الحمل (وكمان للي مش مستحمل الـ MPAA أو مش لاقيه)."
      - kind: explain
        page: 460
        title: "ليه 36 شهر، وليه الـ steroid بينزل للآخر؟"
        quote: "Practice Point 10.2.3.2.4: The total duration of initial immunosuppression plus combination maintenance immunosuppression for proliferative LN should be ≥36 months."
        text: |
          الكتاب بيقول الإجمالي (initial + maintenance) ==≥36 months==، والـ steroid ==tapered to the lowest possible dose== إلا لو محتاجه للـ extrarenal، وتقدر توقفه بعد ==complete clinical renal response for ≥12 months==.

          وجرعة الـ early maintenance: **MMF 750-1000 mg** مرتين، أو **MPA 540-720 mg** مرتين.

          ليه المدة طويلة؟ الكتاب نفسه هيقولك في درس الـ relapse إن اللي مبيوصلش complete remission بيعمل **relapse أكتر**، وإن الـ flare **important predictor of poor long-term kidney survival**. فالـ maintenance هدفها تمنع الـ flare الجاي.

          وليه الـ steroid لأقل جرعة؟ التفسير المقبول (مش في الكتاب): سُمّيته (عضم، سكر، عدوى، عين) بتتجمع مع السنين، والـ MPAA هو اللي شايل الشغل في الـ maintenance.

          إزاي تفتكر الترتيب؟ الـ initial therapy بيطفّي الحريقة في شهور، والـ maintenance بيمنع الشرارة ترجع سنين. وكل ما الجرعة تنزل، السُمّية تقل، بس المراقبة لازم تفضل: بول و creatinine و complement كل زيارة، عشان لو الـ flare رجع تلحقه بدري.
      - kind: explain
        page: 459
        title: "Azathioprine: إمتى، وليه؟"
        quote: "Practice Point 10.2.3.2.1: Azathioprine is an alternative to MPAA after completion of initial therapy in patients who do not tolerate MPAA, who do not have access to MPAA, or who are considering pregnancy."
        text: |
          الكتاب بيدّي الـ azathioprine تلات أسباب، كلهم عن المريض مش عن المرض:

          - ==do not tolerate MPAA==
          - ==do not have access to MPAA==
          - ==considering pregnancy==

          ليه الحمل بالذات؟ الـ Figure 9 (ص 463) بتقولك azathioprine **safe in pregnancy** و **low medication cost**. والـ MPAA بيتوقف في الحمل (درس الحمل والكلية في المحاضرة 11 بيقولك إنه teratogenic وبيتوقف 6 أسابيع قبل الحمل).

          بس افتكر: الـ MPAA هو الـ **preferred** لأن الـ flare rate معاه **أقل** من الـ azathioprine.
