      - kind: figure
        page: 276
        title: "Fabry من الإنزيم للأعضاء"
        image: { file: neph/L08-fabry-clinical.webp, book: true }
        caption: "**Alpha-galactosidase A** ناقص ← تراكم ← أعراض بدري (ألم أعصاب، قلة عرق، قرنية، angiokeratomas) ← كلى وقلب ومخ."
        alt: "Book flow chart and body map of Fabry disease: alpha-galactosidase A deficiency, glycosphingolipid accumulation with inflammation and fibrosis, early symptoms, then kidney, heart and brain branches ending in end-stage renal disease, heart failure and arrhythmias, and stroke."
      - kind: explain
        page: 276
        title: "الخطوة الجاية بعد الـ biopsy"
        quote: "In our case, what should be the next step after renal biopsy?"
        text: |
          الكتاب بيسأل ==In our case, what should be the next step after renal biopsy?== وبيرد برسم:
          - **alpha-galactosidase A** ناقص، فـ **glycosphingolipid accumulation** مع hypoperfusion و inflammation و fibrosis
          - أعراض بدري: **neuropathic pain**، exercise intolerance، GI symptoms، **hypohidrosis**، corneal changes، **angiokeratomas**
          - الكلى: mild proteinuria، hyperfiltration، **isosthenuria**، وبعدين ==ESRD==
          - القلب: **hypertrophic cardiomyopathy و LVH**، وبعدين systolic و diastolic dysfunction و arrhythmias
          - المخ: MRI white grey matter lesions، وبعدين **TIA و strokes**

          ليه نسأل عن القلب والمخ بعد biopsy الكلى؟ التفسير المقبول (مش في الكتاب): الـ biopsy قال «suggestive»، يعني لسه محتاج تأكيد (قياس الإنزيم أو الجين). وFabry مرض **جسم كله**، والقلب والمخ هما اللي بيموّتوا، فلازم تفحصهم ودوّر على باقي العيلة.

          ليه الأعراض بدري بتتفوت؟ التفسير المقبول (مش في الكتاب): ألم الإيدين والرجلين، قلة العرق، وتعب مع المجهود بتبان في طفل «بيشتكي كتير»، والـ angiokeratomas بتبان بقع صغيرة في الجلد. فالتشخيص بيتأخر سنين لحد ما الكلية أو القلب يتعب. عشان كده لما تشخّص واحد، ارجع اسأله عن طفولته واسأل عن أهله: ممكن تلاقي مامته عندها قلب كبير ومحدش عارف السبب.
      - kind: mnemonic
        page: 277
        quote: "Characteristic features of Fabry's disease include:\n  Acroparesthesias\n  Angiokeratomas\n  Hypohidrosis\n  Corneal opacity\n  GIT problems\n  Tinnitus and hearing loss\n  Progressive kidney failure\n  Heart attacks\n  Stroke."
        word: "FABRY"
        parts:
          - { key: "F", text: "Fire in the hands, Fails to sweat: autonomic small fibres (acroparesthesias, hypohidrosis)" }
          - { key: "A", text: "Angiokeratomas" }
          - { key: "B", text: "Brain: stroke" }
          - { key: "R", text: "Renal failure, progressive" }
          - { key: "Y", text: "Eye: corneal opacity" }
        hook: "**FABRY**: الـ F شايلة اتنين من نفس الأعصاب (autonomic): الحرقان وقلة العرق، فدول 6. وفاضل **3 من غير حرف**: gastrointestinal tract (GIT) problems، tinnitus و hearing loss، و heart attacks. 6 + 3 = ==9==."
      - kind: explain
        page: 277
        title: "المتابعة و ERT"
        quote: "Approach to fabry disease\n  Newborn screening for Fabry Disease (FD): Provides early detection of the future insidious and irreversible cardiac damage\n    Identify Type 2 later-onset FD through IVS4 mutation\n      Disease progression for those with the IVS4 mutation:\n        Age ≤40 years: Only 2%-3% show symptoms (left ventricular hypertrophy [LVH])\n        Age >40 years: 32% females and 67% males develop LVH\n        Develop severe cardiac disease in the fourth to seventh decades of life\n      Recommendations for adult patients with the IVS4 mutation:\n        Carefully monitor with: Strain echocardiography annually; T1-mapping CMR every 2-3 years\n        Cardiac biopsy if abnormal results\n        If substantial Gb3 accumulation found, start enzyme replacement therapy before significant cardiac manifestations occur"
        text: |
          - **Newborn screening**: علشان تمسك الـ cardiac damage بدري.
          - **intron 4 splice-site mutation (IVS4) mutation** = type 2 **later-onset**: ≤ 40 سنة 2–3% بس عندهم left ventricular hypertrophy (LVH)، وبعد 40: ==32% ستات و 67% رجالة==.
          - المتابعة: **strain echo** كل سنة و **T1-mapping cardiac magnetic resonance (CMR)** كل 2–3 سنين، و cardiac biopsy لو abnormal.
          - لو Gb3 كتير: ابدأ ==enzyme replacement therapy== قبل الـ cardiac manifestations.

          ليه نبدأ قبل ما القلب يتعب؟ التفسير المقبول (مش في الكتاب): الـ ERT بيمنع Gb3 **جديد** من التراكم، بس الخلايا اللي اتليّفت خلاص مش هترجع. فلو استنيت لحد الـ LVH الواضح أو الـ arrhythmia، اللي اتعمل اتعمل. عشان كده الـ strain echo والـ T1-mapping: بيمسكوا التخزين في عضلة القلب قبل ما الـ echo العادي يشوف حاجة.
      - kind: try
        items: [neph.L08.173, neph.L08.175, neph.L08.177, neph.L08.179, neph.L08.183]
    recap:
      - "IF سلبي كله (حتى kappa و lambda) مش معناه كلية سليمة؛ بص على شكل الخلايا."
      - "Lacy podocytes + foamy distal tubules = Fabry؛ 80% sclerosis = advanced."
