            <path d="M160 206L210 236" class="fg-arrow-bad" marker-end="url(#L06c)"/>
            <rect x="212" y="134" width="112" height="36" rx="8" class="fg-bad"/>
            <text x="268" y="157" text-anchor="middle" class="t-sm t-b">Type 2 DM</text>
            <rect x="212" y="226" width="112" height="44" rx="8" class="fg-bad"/>
            <text x="268" y="245" text-anchor="middle" class="t-sm t-b">Cardiovascular</text>
            <text x="268" y="261" text-anchor="middle" class="t-sm t-b">disease</text>
            <path d="M90 222v54" class="fg-arrow" marker-start="url(#L06b)" marker-end="url(#L06a)"/>
            <text x="100" y="246" class="t-sm t-acc">activation of</text>
            <text x="100" y="262" class="t-sm t-acc">hepatic stellate cells</text>
            <rect x="20" y="280" width="140" height="40" rx="8" class="fg-box"/>
            <text x="90" y="305" text-anchor="middle" class="t-b">Fibrosis</text>
            <path d="M90 324v34" class="fg-arrow-bad" marker-end="url(#L06c)"/>
            <rect x="20" y="362" width="140" height="40" rx="8" class="fg-bad"/>
            <text x="90" y="387" text-anchor="middle" class="t-b t-bad">Cirrhosis</text>
            <path d="M90 406v34" class="fg-arrow-bad" marker-end="url(#L06c)"/>
            <rect x="20" y="444" width="140" height="40" rx="8" class="fg-bad"/>
            <text x="90" y="469" text-anchor="middle" class="t-b t-bad">HCC</text>
            <text x="180" y="356" class="t-sm t-mut">↕ two-headed = can</text>
            <text x="180" y="372" class="t-sm t-mut">go back with treatment</text>
            <text x="180" y="404" class="t-sm t-mut">→ one-way after</text>
            <text x="180" y="420" class="t-sm t-mut">cirrhosis</text>
            <text x="165" y="520" text-anchor="middle" class="t-sm t-b">Strongest risk factors for fibrosis,</text>
            <text x="165" y="538" text-anchor="middle" class="t-sm t-b">cirrhosis, HCC and death: T2DM + obesity</text>
          </svg>
      - kind: order
        page: 100
        prompt: "رتّب مسار الـ MASLD زي صورة الكتاب:"
        steps:
          - "Normal liver"
          - "Steatosis"
          - "MASH"
          - "Fibrosis"
          - "Cirrhosis"
          - "HCC"
        why: "الكتاب: steatosis → **MASH** → (activation of **hepatic stellate cells**) → fibrosis → cirrhosis → HCC."
      - kind: reveal
        page: 100
        prompt: "مين الخلية اللي بتنقل MASH لـ fibrosis؟ وفاكرها منين؟"
        answer: |
          **Hepatic stellate cells**: صاحبنا **أمين المخزن** من L01 اللي قاعد في Disse وبيخزّن vitamin A. لما يتنشط يبقى **مقاول** (myofibroblast) ويصب collagen.

          يعني نفس الآلية بتاعة أي cirrhosis، والـ MASH هو اللي بيدّيله أمر الشغل.
      - kind: explain
        page: 103
        title: "الفرخة ولا البيضة؟"
        text: |
          العلاقة بين MASLD و T2DM ==bidirectional== بقوة، في 4 مستويات: epidemiology، و clinical picture، و diagnosis، و pathomechanisms.

          - **مين الأول؟** أغلب الباحثين شايفين إن MASLD هي اللي بتظهر الأول، وتبدأ سلسلة الأحداث اللي توصل لـ T2DM.
          - **إيه الرابط؟** ==Insulin resistance== is the common root للاتنين. نفس الجذر، طالع منه فرعين.
          - **إيه المهم؟** مش مين جه الأول، لكن the right diagnosis and management at the right time.

          مثال عملي: مريض سكر جديد؟ دوّر على الكبد. مريض MASLD؟ اكشف على السكر.
      - kind: aside
        tone: joke
        page: 103
        text: |
          الكتاب سأل «الفرخة ولا البيضة؟» وبعدين جاوب جواب مصري أصيل: **سيبك من مين جه الأول، اعمل الـ omelette** 🍳

          يعني شخّص الاتنين وعالجهم في الوقت الصح، وده اللي يفرق مع المريض.
      - kind: check
        page: 103
        question: "Which statement about MASLD and type 2 diabetes matches the lecture?"
        options:
          - "Insulin resistance is the common root of both"
