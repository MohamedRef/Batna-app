        question: "Barrett biopsy shows nuclear stratification limited to the lower half. What next?"
        options:
          - "Endoscopic therapy (e.g. radiofrequency ablation)"
          - "Surveillance endoscopy in 3-5 years only"
          - "No follow-up, as it is not dysplasia"
          - "A barium swallow to look for a stricture"
        answer: 0
        why:
          - "صح: ده low-grade dysplasia، والـ endoscopic therapy indicated فيه."
          - "الـ 3-5 سنين للـ nondysplastic بس."
          - "فيه dysplasia، لازم تتعامل."
          - "الـ barium مالوش دور هنا."
      - kind: explain
        remind: [git.L10.lesson5:DHWI]
        page: 291
        quote: "It occurs in about 5% of patients with long standing GERD."
        title: "Stricture و bleeding"
        text: |
          - ==Peptic stricture==: في حوالي **5%** من الـ GERD القديم. **solid-food dysphagia** بتزيد ببطء على شهور لسنين، وأغلبها عند الـ **GE junction**. الـ **biopsy إجباري** علشان تفرّقها عن الـ carcinoma، والعلاج **endoscopic dilatation** ممكن على كذا جلسة.
          - **Bleeding**: مش مضاعفة شائعة؛ hematemesis، melena، أو iron deficiency anemia.

          ليه الـ stricture عند الـ GE junction وليه الـ biopsy إجباري؟ لأن ده المكان اللي بياخد أكتر حمض، والالتهاب المزمن بيعمل تليف بيضيّق. والـ biopsy لأن الـ **carcinoma** (وخصوصًا adenocarcinoma على Barrett) بيعمل نفس الصورة: dysphagia للناشف بتزيد. الفرق إن الـ peptic بطيء (شهور لسنين). وليه كذا جلسة dilatation؟ لأن النسيج المتليف لو اتمط مرة واحدة جامد ممكن يتقطع (perforation)، فبنوسّع على مراحل، وبنكمّل PPI علشان الالتهاب اللي عمل الضيق ما يرجعش يقفله تاني.
      - kind: figure
        page: 291
        title: "الـ peptic stricture"
        image: { file: git/L10-peptic-stricture.webp, book: true }
        alt: "Book endoscopy picture of a narrowed, ring-like lower esophageal lumen with reddened mucosa around it."
        caption: |
          تضييق في آخر المريء. ==لازم biopsy== علشان تفرّقه عن الـ carcinoma.
      - kind: reveal
        page: 292
        quote: "It is not common complication of GERD (hematemesis, melena, or iron deficiency anemia)"
        prompt: "الـ GERD نزيفه مش شائع. لما يحصل، بيبان إزاي؟ وليه غالبًا مش نزيف كبير؟"
        answer: |
          الكتاب: الـ bleeding **not common**، ولو حصل: **hematemesis**، **melena**، أو **iron deficiency anemia**.

          التفسير المقبول (مش في الكتاب): الـ esophagitis غالبًا تآكل **سطحي** في الـ mucosa، ومافيهوش شرايين كبيرة زي قاع قرحة المعدة. فالنزيف بيبقى **رشح** بطيء بيبان كأنيميا حديد أكتر من hematemesis. ولو لقيت iron deficiency، دوّر على سبب تاني كمان قبل ما تقول «ده من الـ reflux».
      - kind: check
        page: 291
        quote: "Endoscopy with biopsy is mandatory to differentiate peptic stricture from stricture by esophageal carcinoma."
        question: "A man with 10 years of reflux has solid-food dysphagia slowly worsening over 2 years. Endoscopy shows a GE junction stricture. Next step?"
