        options: ["MSUS", "Plain X-ray", "CT", "Capillaroscopy"]
        answer: 0
        why: "MSUS is sensitive and preferred for early inflammation at the enthesis."
      - reveal: "Achilles insertion: thick, hypoechoic, with Doppler signal at the enthesis."
        question: "What does this show?"
        options: ["Active enthesitis", "Gouty tophus", "Halo sign", "Normal tendon"]
