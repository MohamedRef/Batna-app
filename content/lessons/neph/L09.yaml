      - kind: explain
        page: 294
        title: "الـ dialysate بيتعمل إزاي؟"
        quote: "Dialysate: to prevent formation of insoluble calcium and magnesium salts with bicarbonate the final dialysate is formed from two separate components the bicarbonate concentrate (now commercially available dry powder bicarbonate cartridges to avoid infection) and acid concentrate ,the later contains all solutes(but no bicarbonate) in a concentration 34-36times that of final dialysate and contains small amount of acetate(3mEq/L in final dilution).The dialysate delivery system of dialysis machine draws up the two components separetaly and mixes them with purified treated water . For a session of 4 hours the patient blood is exposed to 120 litres of water, (dialysate flow 500ml/min). To get purified water it should be subjected to filtration, softening, activated charcoal filtration and reverse osmosis to remove chloramines, microbiologic contaminants and dissolved ions."
        text: |
          لو حطيت الـ **bicarbonate** مع الـ **calcium** و **magnesium** في جركن واحد، هيترسّبوا أملاح مش بتدوب. علشان كده المحلول من ==جزئين==:
          - **Bicarbonate concentrate** (دلوقتي cartridges بودرة ناشفة علشان العدوى).
          - **Acid concentrate**: كل الأملاح من غير bicarbonate، مركّز **34–36 مرة**، وفيه acetate قليل (3 mEq/L).

          الماكينة تخلطهم مع **مية متنقية**. في 4 ساعات الدم بيشوف ==120 لتر مية== (dialysate flow 500 mL/min)!
      - kind: order
        page: 294
        quote: "Dialysate: to prevent formation of insoluble calcium and magnesium salts with bicarbonate the final dialysate is formed from two separate components the bicarbonate concentrate (now commercially available dry powder bicarbonate cartridges to avoid infection) and acid concentrate ,the later contains all solutes(but no bicarbonate) in a concentration 34-36times that of final dialysate and contains small amount of acetate(3mEq/L in final dilution).The dialysate delivery system of dialysis machine draws up the two components separetaly and mixes them with purified treated water . For a session of 4 hours the patient blood is exposed to 120 litres of water, (dialysate flow 500ml/min). To get purified water it should be subjected to filtration, softening, activated charcoal filtration and reverse osmosis to remove chloramines, microbiologic contaminants and dissolved ions."
        prompt: "120 لتر بتلمس دم العيان. رتّب تنقية المية:"
        steps:
          - "Filtration"
          - "Softening"
          - "Activated charcoal"
          - "Reverse osmosis"
        why: "الكتاب: filtration ← softening ← activated charcoal ← reverse osmosis، علشان تشيل الـ chloramines والميكروبات والأملاح الدايبة."
      - kind: explain
        page: 294
        title: "الدايرتين والإنذارات"
        quote: "Dialysate circuit: The key components/processes of this circuit include: Heating; Deaeration; Proportioning; Monitoring; UF; and Disinfection. Alarm system for monitoring: Conductivity (reflection of sodium, bicarbonate conc), Temperature, Hemglobin (blood leak)."
        text: |
          **دايرة الـ dialysate**: heating، deaeration، proportioning، monitoring، ultrafiltration (UF)، disinfection. إنذاراتها: ==conductivity== (يعني تركيز الـ Na والـ bicarbonate)، الحرارة، والـ **haemoglobin** (blood leak).

          **دايرة الدم**: blood pump، وإنذارات inflow pressure و outflow pressure و ==air detector==.
      - kind: check
        page: 294
        quote: "Dialysate circuit: The key components/processes of this circuit include: Heating; Deaeration; Proportioning; Monitoring; UF; and Disinfection. Alarm system for monitoring: Conductivity (reflection of sodium, bicarbonate conc), Temperature, Hemglobin (blood leak)."
        question: "The haemoglobin detector alarms during dialysis. What does it mean?"
        options:
          - "Blood leak into the dialysate"
          - "Wrong sodium concentration"
          - "Air in the blood line"
          - "Dialysate too cold"
        answer: 0
        why:
          - "صح: الـ haemoglobin sensor في دايرة المحلول = blood leak (الفلتر مخروم)."
          - "ده الـ conductivity alarm."
          - "ده الـ air detector في دايرة الدم."
          - "ده الـ temperature alarm."
      - kind: explain
        page: 295
        title: "الجرعة والـ heparin"
        quote: "Dialysis should be delivered at least three times per week and the total duration should be at least 12 h per week."
        text: |
          - على الأقل ==3 مرات في الأسبوع== و **12 ساعة** في الأسبوع.
          - زوّد الوقت أو المرات لو: haemodynamic أو cardiovascular (CV) instability، resistant hypertension، phosphate مش مظبوط.
          - **الحامل**: ==5 جلسات و 20 ساعة== في الأسبوع على الأقل.
          - **Incremental**: نبدأ أقل ونزوّد مع الوقت لو فيه residual renal function، ونقيسها كل فترة.

          **Anticoagulation**: unfractionated أو low-molecular-weight heparin للعادي (1A)، قلّل أو الغي لو فيه خطر نزيف (1C)، و non-heparin لو عنده heparin allergy (1A).
      - kind: aside
        tone: joke
        page: 295
        quote: "An increase in treatment time and/or frequency in certain conditions: hemodynamic, CV instability, resistant hypertension, impaired phosphate control. Pregnant women should receive at least 5 sessions/w, minimum duration of 20h/w."
        text: |
          الحامل على الغسيل بتقضي في الوحدة **20 ساعة** في الأسبوع. يعني الممرضات هيعرفوا اسم البيبي قبل باباه 😄
