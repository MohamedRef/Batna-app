        prompt: "ارجع للـ hook: ليه مريض السكر اللي كليته بتضعف بتجيله hypo على نفس جرعة الإنسولين؟"
        answer: "الإنسولين المحقون مش بيعدّي على الكبد الأول زي الإنسولين الطبيعي، فالكتاب بيقول إن **الكلية هي العضو الأساسي** اللي بيكسّره (30-80%). لما الكلية تضعف، الإنسولين بيفضل في الدم مدة أطول، فنفس الجرعة بتشتغل أقوى وأطول، والسكر يقع، وغالبًا بالليل بعد جرعة المسا. علشان كده الكتاب بيقول «hypoglycemic drugs need dose adjustment in CRF»."
      - kind: explain
        remind: [endo.L04.062]
        page: 51
        quote: "Are some specific alterations in plasma levels of adipocytokines (tumour necrosis factor-a, resistin, leptin and adiponectin) and more indirect mechanisms, such as anaemia, metabolic acidosis and secondary hyperparathyroidism."
        title: "ليه الـ insulin resistance؟"
        text: |
          الـ insulin resistance (IR) بيبدأ في غير مرضى السكر لما الـ GFR يقل عن **50 ml/min**. أسبابه:
          - ==Uraemic toxins== بتلعب في الـ oxidative و non-oxidative pathways بتاعة الـ carbohydrate metabolism، وفي **عدد** الـ insulin receptors و **affinity** بتاعتها. يعني الإنسولين موجود بس المستقبل مش بيمسكه كويس.
          - **Adipocytokines**: TNF-α، resistin، leptin، adiponectin.
          - أسباب غير مباشرة: **anaemia**، **metabolic acidosis**، و **secondary hyperparathyroidism (HPT)**.

          فالمعادلة كاملة: الكلية مش بتكسّر الإنسولين (فيعلى)، والأنسجة مش سامعاه (IR)، والنتيجة ممكن تطلع hypo أو hyper حسب مين فيهم أقوى.
      - kind: update
