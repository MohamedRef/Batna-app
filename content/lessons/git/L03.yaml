      - kind: sort
        page: 137
        quote: "Such a detailed inquiry may facilitate recognition of the following types of fecal incontinence:\n  Passive incontinence, the involuntary discharge of fecal matter or flatus without any awareness. This pattern suggests a loss of perception or impaired rectoanal reflexes, with or without sphincter dysfunction."
        prompt: "أنهي نوع؟"
        bins: ["Passive", "Urge", "Seepage"]
        cards:
          - { text: "Leaks without noticing it", bin: 0 }
          - { text: "Loss of perception or rectoanal reflexes", bin: 0 }
          - { text: "Rushes to the toilet but cannot hold it", bin: 1 }
          - { text: "Disrupted sphincter, small rectal capacity", bin: 1 }
          - { text: "Stains after a bowel movement, otherwise continent", bin: 2 }
          - { text: "Incomplete evacuation; sphincters mostly intact", bin: 2 }
        why: "**Passive** = من غير ما يحس (perception أو reflexes). **Urge** = حاسس بس مش قادر يمسك (sphincter أو capacity). **Seepage** = تسريب بعد التبرّز، والسبب incomplete evacuation أو rectal sensation ضعيف."
      - kind: explain
        page: 137
        quote: "Anorectal manometry is a useful method for assessing IAS and EAS pressures as well as rectal sensation, rectoanal reflexes', and rectal compliance."
        title: "الفحوصات"
        text: |
          - ==Anorectal manometry==: ضغط الـ **internal anal sphincter (IAS)** والـ **external anal sphincter (EAS)**، الـ rectal sensation، الـ rectoanal reflexes، والـ compliance.
          - **Balloon expulsion test**: بسيط وبيكشف الـ dyssynergic defecation.
          - **Anal endosonography** أو magnetic resonance imaging (MRI): defects وسُمك الـ sphincters. والـ US هو الأكتر توافرًا.
          - **Defecography**، **neurophysiology** (EMG، pudendal nerve terminal motor latency (PNTML))، و saline infusion test.
          - **Sigmoidoscopy/colonoscopy** تستبعد mucosal lesions زي solitary rectal ulcer أو inflammation أو malignancy.
