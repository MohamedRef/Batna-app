  - id: git.L02.lesson5
    title: "نسخّن: RF و Stretta و microwave"
    hook: "حرارة محسوبة بتشد الـ LES، وحرارة تانية بتحرق HCC صغير. مين ينفع ومين لأ؟"
    minutes: 8
    pages: [69, 70]
    topics: [ablation]
    goals:
      - "تشرح الـ Stretta بتشتغل إزاي وليه الحرارة أقل من 100°C"
      - "تختار المريض المناسب للـ Stretta وتعرف ليه"
      - "تعرف حدود الـ microwave coagulation therapy (MCT)"
    status: unverified
    steps:
      - kind: explain
        page: 69
        quote: "RF is a minimally invasive alternative to standard antireflex surgery. It involves the application of controlled RF energy to induces collagen contraction in the LES region."
        title: "الـ RF و Stretta"
        text: |
          الـ **RF**: تيار متردد سريع ← حرارة ← **tissue necrosis**. لحد **900 megahertz (MHz)**، وفوقها **microwave**.

          بيتستخدم في **gastroesophageal reflux disease (GERD)** و**nodular hepatocellular carcinoma (HCC) أقل من 3-4 cm**.

          في الـ GERD (**Stretta**): RF energy بتعمل ==collagen contraction== في منطقة الـ **lower esophageal sphincter (LES)**، بديل minimally invasive للجراحة.
          - Generator بأربع قنوات، وكل إبرة فيها **thermocouple** يظبط الحرارة.
          - الحرارة **أقل من 100°C** علشان الضرر الجانبي يقل.
          - حلقات lesions **2 cm** فوق وتحت الـ cardia، **48-60 lesion** في حوالي **50 دقيقة**.
      - kind: reveal
        page: 69
        quote: "Maintaining lesion temperatures below 100oC minimizes the collateral tissue damage due to vaporization and high impedence values."
        prompt: "ليه الحرارة لازم تفضل تحت 100°C؟"
        answer: |
          الكتاب: تحت **100°C** الـ **collateral tissue damage** بيقل، لأن فوقها بيحصل **vaporization** و **high impedance**.

          التفسير المقبول (مش في الكتاب): 100°C هي درجة غليان المية. لو النسيج غلى، المية تتبخر وتسيب نسيج ناشف متفحم، والنسيج الناشف **مش بيوصّل** الكهربا (impedance عالية)، فالـ RF يقف عند السطح ويحرق بدل ما يسخّن بالراحة في العمق. وعلشان كده كل إبرة فيها **thermocouple** بيظبط الـ power لوحده.
      - kind: explain
        page: 69
        quote: "Additional lesion sets are created by rotating and changing the linear position of the catheter so as to create several rings of lesions 2 cm above and below cardia."
        title: "ليه حلقات كتير؟"
        text: |
          الكتاب: بنلفّ الـ catheter ونحرّكه طوليًا علشان نعمل **several rings of lesions** على مسافة **2 cm فوق وتحت الـ cardia**، وبعدين نطلّعه ونعيد الـ **EGD**. المجموع **48-60 lesion** في حوالي **50 دقيقة**.

          التفسير المقبول (مش في الكتاب): الهدف إن الـ **collagen contraction** يحصل في كل حلقة الـ LES، مش في نقطة واحدة. فلو اشتغلت في جهة واحدة، البوابة هتتشد من ناحية وتفضل سايبة من الناحية التانية. والـ EGD في الآخر علشان نتأكد إن الـ mucosa سليمة.
      - kind: reveal
        page: 69
        quote: "RF energy with frequency up to 900 MHz, while higher frequencies are in the microwave spectra."
        prompt: "ليه الـ RF والـ microwave في نفس الصفحة؟"
        answer: |
          الكتاب: الـ RF لحد **900 MHz**، وأعلى من كده يبقى **microwave**. والاتنين بيشتغلوا بنفس المبدأ: تيار متردد بسرعة ← **heat** ← **tissue necrosis**.

          التفسير المقبول (مش في الكتاب): يعني هما نفس الفكرة على درجتين من التردد. علشان كده بيتقارنوا في الـ HCC: الـ RF ليه الـ nodular type أقل من 3-4 cm، والـ MCT ليه حدوده (أقل من 40 mm، ومش لوحده فوق 2 cm). الفرق العملي في **حجم الحرق** اللي كل واحد يقدر يعمله في المرة.
      - kind: sort
        page: 70
        quote: "Have > 2 cm long fixed hiatal hernia. • Have significant dysphagia."
        prompt: "Stretta: المريض ده مناسب ولا لأ؟"
        bins: ["Ideal candidate", "Not a good candidate"]
        cards:
          - { text: "LES pressure at least 5 mm Hg, good peristalsis", bin: 0 }
          - { text: "Acid exposure time above 4% on 24-h pH", bin: 0 }
          - { text: "Nonerosive or Savary-Miller grade I-II", bin: 0 }
          - { text: "Responds to proton pump inhibitor (PPI), relapses off it", bin: 0 }
          - { text: "Fixed hiatal hernia over 2 cm", bin: 1 }
          - { text: "Significant dysphagia", bin: 1 }
          - { text: "Grade III-IV esophagitis or extensive Barrett", bin: 1 }
          - { text: "Poor peristalsis, incomplete LES relaxation", bin: 1 }
        why: "المنطق: الـ Stretta بتشد الـ LES، فلازم يكون فيه **peristalsis كويسة** و**reflux حقيقي** (أكتر من 4%) و**مرض خفيف بيستجيب للـ proton pump inhibitor (PPI)**. الـ hernia الكبيرة والـ dysphagia والـ esophagitis الشديدة بتطلّعه برّه."
      - kind: explain
        page: 70
        quote: "Have significant dysphagia."
        title: "ليه دول بالذات؟"
        text: |
          التفسير المقبول (مش في الكتاب) لكل شرط في الكتاب:
          - **Peristalsis كويسة و LES pressure 5 mm Hg على الأقل**: الـ Stretta **بتشد** الـ LES شوية، فلو الـ esophagus مش بيزق كويس، الأكل هيقف ويعمل dysphagia.
          - **Acid exposure أكتر من 4%**: لازم يكون فيه **reflux حقيقي** متسجّل، مش أعراض من سبب تاني.
          - **Nonerosive reflux disease أو grade I-II**: المرض لسه خفيف، والشدة البسيطة كفاية تلمّه.
          - **بيستجيب للـ PPI أو H2 blockers وبيرجع لما يوقفها**: ده أحسن دليل إن الأعراض من الحمض فعلًا، والمريض عايز يبطّل الدوا.

          والممنوعين: **hernia ثابتة أكتر من 2 cm** (الـ LES مش في مكانه أصلًا)، **dysphagia** (هتزيد)، **grade III-IV أو Barrett واسع** (المرض أكبر من الـ Stretta)، و**peristalsis ضعيفة** مع **incomplete LES relaxation**.

          يعني القاعدة: الـ Stretta لمريض **reflux حقيقي وخفيف، وبوابته في مكانها، والمريء بيزق كويس**. أي حاجة تكسر شرط من دول تطلّعه برّه.
      - kind: check
        page: 69
        quote: "RF is a promising modality for:\n• GERD\n• Nodular type HCC <3-4 cm."
        question: "Besides GERD, for which condition does the lecture call RF a promising modality?"
        options:
          - "Nodular HCC under 3-4 cm"
          - "Barrett's esophagus with high-grade dysplasia"
          - "Bleeding angiodysplasia"
          - "Achalasia"
        answer: 0
        why:
          - "صح: الكتاب: **GERD** و **nodular type HCC <3-4 cm**."
          - "الـ Barrett في الكتاب مع الـ cryotherapy."
          - "الـ angiodysplasia مع الـ APC."
          - "الـ achalasia مع الـ POEM والـ EUS."
      - kind: case
        page: 70
        quote: "Have nonerosive reflux disease or grade I or II esophagitis by Savary-Miller criteria."
        stem: "A 41-year-old has heartburn that settles on a proton pump inhibitor but returns each time he stops. Endoscopy shows grade I esophagitis, no hernia. 24-hour pH: acid exposure 7%. Manometry: good peristalsis, LES pressure 9 mm Hg."
        steps:
          - question: "Is he an ideal candidate for RF (Stretta) in the lecture?"
            options: ["Yes, he meets every criterion", "No, grade I esophagitis excludes him", "No, his acid exposure is too high", "No, he must fail PPIs completely"]
            answer: 0
            why: "Peristalsis كويسة، LES pressure 5 أو أكتر، acid exposure أكتر من **4%**، grade I، وبيستجيب للـ PPI وبيرجع لما يوقفه: ده بالظبط الـ **ideal candidate** في الكتاب."
          - question: "A year later a 4 cm fixed hiatal hernia is found. What changes?"
            options: ["He is no longer a good candidate", "Nothing changes", "He now needs APC", "He now needs cryotherapy"]
            answer: 0
            why: "الكتاب: **> 2 cm long fixed hiatal hernia** بيخليه **not a good candidate**. التفسير المقبول (مش في الكتاب): الـ LES اتشد لفوق في الصدر، فالحلقات حوالين الـ cardia مش هتشد البوابة الصح."
      - kind: explain
        page: 70
        quote: "Tissue coagulation occurs and reaches a depth corresponding to the length of the electrode."
        title: "الـ MCT: العمق بطول الإبرة"
        text: |
          الكتاب: الـ **microwave coagulator** بيبعت microwave لـ ==monopolar-type needle electrode==، والـ coagulation بتوصل لعمق **قد طول الـ electrode**.

          - الأورام اللي اتعالجت: **أقل من 40 mm**، وبعيدة **10 mm على الأقل** عن الأوعية والأعضاء الكبيرة.
          - **مش لوحدها** لـ HCC أكبر من **2 cm** في الـ long axis، ومحتاجة applications كتير.

          التفسير المقبول (مش في الكتاب): بُعد الـ 10 mm عن الأوعية الكبيرة ليه سببين: الدم الجاري **بيبرّد** النسيج جنبه فالـ tumor مش بيتحرق كله، والحرارة ممكن تأذي الوعاء نفسه. ولأن الحرق على قد الإبرة، الـ tumor الكبير محتاج **أكتر من مرة** علشان يتغطى.
      - kind: try
        items: [git.L02.084, git.L02.086, git.L02.088, git.L02.090, git.L02.092]
    recap:
      - "RF لحد 900 MHz؛ promising للـ GERD والـ nodular HCC أقل من 3-4 cm."
      - "Stretta: أربع قنوات، thermocouple، أقل من 100°C (vaporization و impedance)؛ حلقات 2 cm فوق وتحت الـ cardia؛ 48-60 lesion في 50 دقيقة."
      - "مناسب: LES pressure 5 أو أكتر، AET أكتر من 4%، nonerosive أو I-II، بيستجيب للـ PPI. لا: hernia أكبر من 2 cm، dysphagia، III-IV أو Barrett واسع، peristalsis ضعيفة."
      - "MCT: monopolar، العمق = الـ electrode؛ أقل من 40 mm وبعيد 10 mm؛ مش لوحده لـ HCC أكبر من 2 cm."
