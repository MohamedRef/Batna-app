  # ---------- p9: definition, special populations, symptoms ----------
  - id: hem.L02.001
    kind: card
    topic: definition
    front: Define anaemia clinically.
    back: An Hb or Ht value below the appropriate reference range for that patient, adjusted for age, sex and other factors such as altitude.
    src: { page: 9, quote: "The reference range needs to be adjusted for the age and sex, other factors such as altitude." }
    status: unverified
    tags: [high-yield]
  - id: hem.L02.002
    kind: cloze
    topic: definition
    text: "Anaemia can be defined as Hb < {{c1::14}} g/dL in adult men and < {{c2::12}} g/dL in adult women."
    src: { page: 9, quote: "Anaemia can be defined as Hb values <14 g/dL in adult men and <12 g/dL in adult women." }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L02.003
    kind: card
    topic: definition
    front: Is anaemia a diagnosis?
    back: No. It is a laboratory abnormality that requires explanation.
    src: { page: 9, quote: "Anaemia is not a diagnosis. It is a laboratory abnormality that requires explanation." }
    status: unverified
    tags: [high-yield]
  - id: hem.L02.004
    kind: cloze
    topic: definition
    text: "In African-Americans of both sexes and all ages, Hb runs {{c1::0.5–1.0}} g/dL lower than in comparable Caucasian populations."
    src: { page: 9, quote: "Hb are 0.5 - 1.0 g/dL <its values in comparable Caucasian populations." }
    status: unverified
    tags: [numbers]
  - id: hem.L02.005
    kind: cloze
    topic: definition
    text: "Physiologic (dilutional) anaemia: in the {{c1::3rd}} trimester RBC mass rises by {{c2::25%}} and plasma volume by {{c3::50%}}, so Hb, Ht and RBC count fall, often to anaemic levels."
    src: { page: 9, quote: "RBC mass and plasma volume are expanded by 25 and 50 %, respectively" }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L02.006
    kind: mcq
    topic: definition
    stem: A healthy woman at 34 weeks' gestation has Hb 10.6 g/dL with normal indices. Her Hb was 12.8 g/dL before pregnancy. What best explains the fall?
    options:
      - Plasma volume expands more (50%) than RBC mass (25%)
      - RBC mass falls by 25% in the third trimester
      - Iron is diverted to the fetus, so red cell production stops
      - Haemolysis caused by placental hormones
      - Bone marrow suppression by oestrogen
    answer: 0
    why:
      - "Correct: in the 3rd trimester RBC mass rises 25% and plasma volume 50%, a physiologic dilutional anaemia (p9)."
      - RBC mass rises, it does not fall.
      - Red cell production goes up in pregnancy; the book's explanation is dilution.
      - The book does not describe haemolysis in pregnancy.
      - Marrow suppression is not the mechanism the book gives.
    src: { page: 9, quote: "\"Physiologic\" or \"dilutional\" anaemia In the 3rd trimester of pregnancy" }
    status: unverified
