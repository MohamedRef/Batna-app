  - kind: explain
    page: 20
    quote: '| Cohort | Cohorts are a group of participants with a similar characteristic that are followed through time (either retrospectively or prospectively) to determine which risk factors are associated
      with that particular outcome. |'
    title: Cohort وCase-control (observational analytic)
    text: |-
      - **Cohort**: مجموعة ناس عندهم صفة مشتركة، بنتابعهم مع الزمن (==retrospectively or prospectively==) نشوف أنهي risk factors ليها علاقة بالـ outcome.
      - **Case-control**: بنبدأ من الـ **cases** (عندهم المرض) والـ **controls** (معندهمش)، ونبص لورا نقارن **how frequently the exposure** موجود في كل مجموعة.
    remind: []
  - kind: explain
    page: 22
    quote: '| Cross sectional | Observation of all of a population, or a representative sample, at one specific point in time. A cross-sectional study is one in which subjects are sampled without respect
      to disease status and are studied at a particular point in time, as in a random-sample health survey. |'
    title: Cross-sectional وCase series (observational descriptive)
    text: |-
      - **Cross-sectional**: صورة فوتوغرافية للـ population (أو sample ممثلة) في ==one specific point in time==، من غير ما نختار حسب حالة المرض، زي الـ **random-sample health survey**.
      - **Case series**: تقرير عن مجموعة صغيرة من حالات متشابهة؛ هو الطريق الإكلينيكي لـ **case definition** ولتوليد الـ hypotheses.
  - kind: aside
    tone: trap
    text: 'في المحاضرة دي الـ cross-sectional متصنّف **observational descriptive** في جدول، وفي سلايد PICO اتذكر مع الـ observational analytic. لو السؤال عن التصنيف، شوف السياق: survey للوصف ولا مقارنة
      exposure بـ outcome.'
    page: 22
    quote: Observational descriptive
  - kind: explain
    page: 24
    quote: '| Randomized controlled trials (RCTs) | RCTs are studies that measure an intervention''s effect by randomly assigning individuals (or groups of individuals) to an intervention group or a control
      group. This is the strongest study to determine a cause–effect relation that would potentially exist between treatment and outcome. |'
    title: 'الـ RCT: أقوى تصميم للسبب والنتيجة'
    text: |-
      **RCT**: بنوزّع الناس (أو مجموعات) ==randomly== على intervention group أو control group، ونقيس أثر الـ intervention.

      ده ==the strongest study== لإثبات **cause–effect** بين العلاج والنتيجة، لأن العشوائية بتخلي المجموعتين شبه بعض في كل حاجة تانية.
  - kind: explain
    page: 26
    quote: '| Meta-analysis | A subset of systematic reviews; a method for systematically combining pertinent qualitative and quantitative study data from several selected studies to develop a single conclusion
      that has greater statistical power. This conclusion is statistically stronger than the analysis of any single study because of: Increased numbers of subjects; Greater diversity among subjects; Accumulated
      effects and results |'
    title: الـ meta-analysis (secondary research)
    text: '**Meta-analysis** = ==a subset of systematic reviews==: طريقة بتجمع بيانات qualitative وquantitative من دراسات كتير مختارة، وتطلع بـ **single conclusion** بـ statistical power أعلى.'
  - kind: reveal
    page: 26
    quote: '| Meta-analysis | A subset of systematic reviews; a method for systematically combining pertinent qualitative and quantitative study data from several selected studies to develop a single conclusion
