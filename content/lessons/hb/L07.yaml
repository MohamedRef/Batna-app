      - kind: explain
        page: 120
        title: "لحد إمتى؟"
        text: |
          رسمة الـ treatment duration في الكتاب:

          - **HBeAg positive** + حصل **HBeAg seroconversion** → **stop treatment after 12 months**.
          - **HBeAg positive** من غير seroconversion → **long-term treatment**.
          - **HBeAg negative** → **long-term treatment**.
          - أي حد يوصل **HBsAg seroconversion** → **stop treatment**.

          يعني الـ HBeAg negative مالوش "محطة نزول" غير الـ HBsAg seroconversion، وده نادر، فعمليًا علاج طويل.
      - kind: check
        page: 120
        question: "An HBeAg-negative patient on entecavir has undetectable HBV DNA for 2 years. HBsAg is still positive. Per the duration algorithm:"
        options:
          - "Continue long-term treatment"
          - "Stop after 12 months of undetectable DNA"
          - "Stop now and monitor"
          - "Switch to peginterferon for 48 weeks"
        answer: 0
        why:
          - "صح: الـ HBeAg negative = **long-term treatment**، والوقف بس عند **HBsAg seroconversion**."
          - "قاعدة الـ 12 months دي للـ **HBeAg-positive** اللي عمل **HBeAg seroconversion**."
          - "الـ HBsAg لسه موجب، فمفيش endpoint للوقف."
          - "مفيش في الـ algorithm ده تحويل لـ interferon."
      - kind: figure
        page: 121
        title: "الـ NA resistance (رسمة الكتاب)"
        alt: "Horizontal bar chart of cumulative resistance. Lamivudine 24 percent at 1 year rising to 70 percent at 5 years. Adefovir 29 percent at 5 years. Telbivudine 17 percent at 2 years. Entecavir 1.2 percent at 5 years. Tenofovir DF 0 percent and tenofovir alafenamide 0 percent."
