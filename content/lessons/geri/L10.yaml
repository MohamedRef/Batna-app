      - kind: explain
        page: 177
        quote: "Broadly, the manifestations of fibrotic lung diseases (DPLDs) can be grouped as follows:\n  1) Chronic, insidious, and slowly progressive.\n  2) Subacute, with a resolving, remitting, relapsing, or progressive course.\n  3) Acute, with a fulminant, progressive, remitting, or resolving course.\n    Disorders with chronic, insidious, and slowly progressive courses are those that clinically resemble IPF and usually share a common pathology (ie, UIP).\n    Many of the rheumatologic/connective-tissue diseases, the pneumoconioses, and drug-related pulmonary fibrosis generally fit into this category.\n    Subacute presentations with a variable course are typified by Cryptogenic Organizing Pneumonia (COP).\n    COP often develops weeks or months after the onset of a flulike illness.\n    Patients can present to medical attention with dyspnea or exercise intolerance."
        title: "COP و AIP"
        text: |
          **COP** (cryptogenic organizing pneumonia): غالبًا بعد **flulike illness** بأسابيع أو شهور، بـ dyspnea أو exercise intolerance. الـ course متغيّر: ممكن يخف لوحده أو يتقدم، وبيرد كويس جدًا على الـ ==steroids==.

          **AIP** (acute interstitial pneumonia): severe lung injury idiopathic، الـ histopathology بتاعته زي **acute respiratory distress syndrome (ARDS)**. بييجي من غير مرض رئوي قبله، أو accelerated phase لـ interstitial lung disease (ILD) موجود. أغلبهم يروحوا **respiratory failure** بسرعة، وبعضهم يتحسن بالـ steroids.
      - kind: reveal
