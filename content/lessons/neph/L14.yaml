  - id: neph.L14.lesson11
    title: "مش بيستجيب ولا رجع تاني؟ الـ response والـ relapse"
    hook: "قبل ما تزوّد العلاج، اتأكد إن المريض بياخده، وإن اللي قدامك مرض نشط مش ندبة."
    minutes: 10
    pages: [461, 467]
    topics: [ln-response, ln-relapse]
    goals:
      - "تعرف تعريفات الـ response وتستنى المدة الصح"
      - "تمشي على خطوات الـ unsatisfactory response بالسبب"
      - "تعالج الـ relapse وتحسب الـ cyclophosphamide"
      - "تعرف تعمل إيه في الـ LN مع TMA وفي الـ refractory"
    status: unverified
    steps:
      - kind: order
        page: 461
        quote: "Figure 12: Management of patients who show unsatisfactory response to initial therapy for active lupus nephritis.\n1. Verify adherence to treatment\n2. Ensure adequate dosing of immunosuppressive medications by measuring plasma drug levels if applicable or available (check mycophenolic acid level if on mycophenolic acid analogs/check infusion records if on cyclophosphamide)\n3. Repeat biopsy if concern for chronicity or other diagnosis (e.g., thrombotic microangiopathy)\n4. Consider switching to an alternative first-line regimen when there is persistent disease activity\n5. Consider the following in patients refractory to first-line treatment regimens:\n  Addition of rituximab or other biologic therapies\n  Extended course of i.v. pulse cyclophosphamide\n  Enrollment in clinical trials if eligible\ni.v., intravenous."
        prompt: "مريض عنده unsatisfactory response للـ initial therapy. رتّب الخطوات:"
        steps:
          - "Verify adherence"
          - "Check dosing and drug levels"
          - "Repeat biopsy (chronicity? TMA?)"
          - "Switch to another first-line regimen"
          - "Refractory: rituximab, extended IV cyclophosphamide, or a trial"
        why: "ابدأ بالأرخص والأسهل: هل بياخد الدوا؟ وبجرعة كفاية؟ بعدين اتأكد إن المرض نشط فعلاً ومش scar أو thrombotic microangiopathy (TMA) قبل ما تزوّد العلاج."
      - kind: explain
        page: 461
        title: "ليه الترتيب ده؟"
        quote: "Figure 12: Management of patients who show unsatisfactory response to initial therapy for active lupus nephritis.\n1. Verify adherence to treatment\n2. Ensure adequate dosing of immunosuppressive medications by measuring plasma drug levels if applicable or available (check mycophenolic acid level if on mycophenolic acid analogs/check infusion records if on cyclophosphamide)\n3. Repeat biopsy if concern for chronicity or other diagnosis (e.g., thrombotic microangiopathy)\n4. Consider switching to an alternative first-line regimen when there is persistent disease activity\n5. Consider the following in patients refractory to first-line treatment regimens:\n  Addition of rituximab or other biologic therapies\n  Extended course of i.v. pulse cyclophosphamide\n  Enrollment in clinical trials if eligible\ni.v., intravenous."
        text: |
          كل خطوة بتستبعد سبب أرخص قبل ما تدفع تمن أغلى:

          1. **Adherence:** أسهل سبب للفشل إن الدوا مش بيتاخد.
          2. **Doses و drug levels:** ممكن بياخده بس بجرعة قليلة أو مستوى واطي.
          3. **Repeat biopsy:** الكتاب بيقول عشان تشوف ==chronicity or other types of lesions==. يعني ممكن البروتين جاي من **ندبة** مش هتتعالج، أو من TMA.
          4. **First-line تاني**، وبعدين للـ refractory: rituximab أو IV cyclophosphamide أطول أو تجربة.

          التفسير المقبول (مش في الكتاب): لو قفزت على طول للخطوة الأخيرة، هتدي المريض سُمّية أكتر عشان مشكلة كان حلها مكالمة تليفون عن الالتزام.
      - kind: table
        page: 464
        quote: "Figure 11: Definitions of response commonly used in clinical trials of lupus nephritis. \"For children <18 years old, complete response is defined as proteinuria <0.5 g/1.73 m² per day or <300 mg/m² per day based on a 24-hour urine specimen. eGFR, estimated glomerular filtration rate; PCR, protein-creatinine ratio."
        title: "تعريفات الـ response"
        columns: [Response, Proteinuria (PCR)]
        rows:
          - [Complete, "<0.5 g/g, kidney function ±10-15%"]
          - [Partial, "≥50% fall and <3 g/g"]
          - [Primary efficacy renal, "≤0.7 g/g, eGFR ≤20% below pre-flare or ≥60"]
          - [No response, "Neither, within 6-12 months"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 464
        title: "صبرك على الـ complete response"
        quote: "The Work Group suggests that if patients are improving. Allowing 18-24 months to achieve a complete response is reasonable in patients who show continuous improvement."
        text: |
          - المعتاد في **6-12 شهر**، بس لو المريض بيتحسن باستمرار استنى لحد **18-24 شهر**.
          - "في الـ **ALMS** trial: **normalization of complement** و **25% reduction of proteinuria** بدري بيتنبأوا بـ kidney outcome كويس."

          ليه الـ complement؟ التفسير المقبول (مش في الكتاب): الـ complement بيتاكل في الـ LN النشطة، فلما يرجع طبيعي يبقى الالتهاب هدي، حتى لو البروتين لسه بينزل ببطء.
      - kind: reveal
        page: 464
        quote: "This analysis suggested favorable kidney outcomes are predicted by normalization of complement levels and 25 reduction of proteinuria after weeks of treatment."
        prompt: "مريضة بعد 8 شهور البروتين نزل من 4 لـ 1.2 g/g وبينزل كل زيارة. لسه مش complete response. تغيّر العلاج؟"
        answer: |
          لأ. الكتاب بيقول لو المريض ==continuous improvement==، يبقى ==Allowing 18-24 months to achieve a complete response is reasonable==.

          والـ ALMS بيدّيك علامات بدري إن الطريق صح: ==normalization of complement levels== و **25% reduction of proteinuria**.

          ليه الصبر؟ التفسير المقبول (مش في الكتاب): الـ proteinuria بتنزل ببطء حتى بعد ما الالتهاب يهدى، لأن الـ GBM والـ podocyte محتاجين وقت يتصلّحوا. لو غيّرت بدري هتضيف سُمّية من غير داعي.
      - kind: explain
        page: 462
        title: "Relapse"
        quote: "Figure 8: Prevention and treatment of relapses.\nTreatment of relapse:\n  Immunosuppressive treatment according to clinical profile of the relapse (Figure 4 and Figure 5)\n  When a new cycle of cyclophosphamide treatment is needed, we suggest not to exceed a total cumulative dose > 10 g.\n10.2.4.3 Treatment of LN relapse Relapses of LN are common, and LN flare is an important predictor of poor long-term kidney survival. 270-273 LN flare rates of 10%-50% have been reported, and relapses occur over time. 274 Failure to achieve complete remission increases the risk of subsequent relapse, 93. 110, 275 Relapse rates of 39% and 64% were found in patients who achieved complete remission or partial remission, respectively, and time-to-relapse after complete response was 36 months, compared to 18 months after partial response.93 Similarly, an HR of 6.2 for relapse was reported in Chinese patients who did not achieve complete remission after initial therapy. 110 Practice Point 10.2.4.3.1: After a complete or partial remission has been achieved, LN relapse should be treated with the same initial therapy used to achieve the original response, or an alternative recommended first-line therapy."
        text: |
          - **Flare rates 10-50%**، والـ flare بيتنبأ بـ poor kidney survival.
          - "بعد **complete** remission: relapse **39%** بعد **36 شهر**."
          - "بعد **partial** remission: relapse **64%** بعد **18 شهر**."

          العلاج: **نفس الـ initial therapy** اللي نجحت، أو first-line تاني. ولو هتدي cyclophosphamide تاني، متعديش **10 g** cumulative.

          ليه نفس العلاج؟ لأنه اتجرّب مع المريض ده ونجح، والاختيار البديل مقبول لو فيه سبب (سُمّية، حمل، أو حد الـ cyclophosphamide).
      - kind: explain
        page: 462
        title: "ليه الـ partial remission بيرجع أسرع؟"
        quote: "Figure 8: Prevention and treatment of relapses.\nClinical remission (baseline status) → Lupus renal flare → Response to treatment → Long-term remission\nTreatment of relapse:\n  Immunosuppressive treatment according to clinical profile of the relapse (Figure 4 and Figure 5)\n  When a new cycle of cyclophosphamide treatment is needed, we suggest not to exceed a total cumulative dose > 10 g\nShort-term goals:\n  Achieve rapid clinical and serological remission (<3 months)\n  Move to maintenance therapy\nMaintenance immunosuppressive treatment in relapsing patients:\n  Ensure therapeutic compliance\n  Extend MPAA treatment duration beyond 3-5 years after relapse\n  For repeated relapses consider indefinite treatment with low MPAA dose\n  Consider adding belimumab (individualization according to evolution)\n  Consider a new kidney biopsy to evaluate active lesions and chronicity score"
        text: |
          الأرقام بتقول الحكاية: بعد complete **39%** بعد **36 شهر**، بعد partial **64%** بعد **18 شهر**. وفي الصينيين اللي موصلوش complete: **HR 6.2** للـ relapse.

          التفسير المقبول (مش في الكتاب): الـ partial معناه إن فيه **نشاط لسه شغال** تحت السطح، فهو مش relapse جديد قد ما هو نار مطفتش.

          والـ Figure 8 بتقول بعد الـ relapse:
          - الهدف القريب: remission ==<3 months== وبعدين maintenance.
          - كمّل الـ MPAA ==beyond 3-5 years==، ولو relapses متكررة: ==indefinite treatment with low MPAA dose==.
          - فكّر في **belimumab**، وفي **biopsy جديدة** للـ activity والـ chronicity.
          - ولو cyclophosphamide تاني: الإجمالي **متعدّيش 10 g**.
      - kind: explain
        page: 465
        title: "قبل ما تختار علاج الـ relapse"
        quote: "Disease activity should be verified as proteinuria may be secondary to CKD."
        text: |
          الكتاب بيدّيك خمس حاجات تفكر فيها، وكل واحدة ليها سبب:

          - **Cyclophosphamide قبل كده؟** احسب الـ **lifetime exposure**. الـ ovarian failure مرتبط بالسن والـ **oocyte reserve** والجرعة المتجمعة، والـ malignancy بتزيد بعد **36 g**، فلو قرّب منها ==cyclophosphamide is better avoided==.
          - **حامل؟** ==treatment choices are more limited==.
          - **رأي المريض وتحمّله** للعلاج الأولاني.
          - **الالتزام.**
          - ==Disease activity should be verified== لأن الـ proteinuria ممكن تكون **secondary to CKD**.
      - kind: check
        page: 465
        quote: "Disease activity should be verified as proteinuria may be secondary to CKD."
        question: "A patient in remission for 4 years has rising proteinuria. Before re-treating as a relapse, what should you confirm?"
        options:
          - "That the disease is active, since proteinuria may come from CKD"
          - "Nothing: rising proteinuria always means a flare"
          - "That anti-Sm antibodies have appeared"
          - "That the eGFR is above 90"
        answer: 0
        why:
          - "صح: الـ proteinuria ممكن تكون من الـ CKD (scar)، وساعتها الـ immunosuppression مش هيفيد."
          - "ده بالظبط الفخ."
          - "الـ anti-Sm مش marker للنشاط."
          - "مش شرط."
      - kind: explain
        page: 466
        title: "LN ومعاها TMA"
        quote: "10.3.1 Lupus nephritis and thrombotic microangiopathy Practice Point 10.3.1.1: Patients with LN and thrombotic microangiopathy (TMA) should be managed according to the underlying etiology of TMA, as shown in Figure 13'. 10.2.4.3 Treatment of LN relapse Lapses of LN are common, and LN flare is an important predictor of poor long-term kidney al.270-273 LN flare rates of 10%-50% have been reported, and relapses occur over time. 274 Fai ieve complete remission increases the risk of subsequent relapse, 93, 110, 275 Relapse rates of 39 4% were found in patients who achieved complete remission or partial remission, respectivel me-to-relapse after complete response was 36 months, compared to 18 months after partial ase.93 Similarly, an HR of 6.2 for relapse was reported in Chinese patients who did not achiev lete remission after initial therapy. 110 Actice Point 10.2.4.3.1: After a complete or partial remission has been achieved, LN rela d be treated with the same initial therapy used to achieve the original response, or an native recommended first-line therapy."
        text: |
          الكتاب بيقول المرضى دول ==should be managed according to the underlying etiology of TMA==.

          ليه؟ لأن الـ TMA في مريض lupus ممكن تيجي من أسباب مختلفة (زي ما شفنا في الـ biopsy: aHUS أو TTP أو antiphospholipid syndrome)، وكل سبب ليه علاج مختلف. فلو عالجت الـ LN بس، الجلطات الصغيرة هتفضل تقفل الأوعية.

          ودي نفس الفكرة اللي هتشوفها في درس الـ TMA الجاي: الـ TMA **صورة**، مش تشخيص.
      - kind: explain
        page: 467
        title: "Refractory بعد الـ triple: الخطوة الجاية حسب البداية"
        quote: "Lack of response (no reduction in proteinuria by at least >25%) or worsening of proteinuria and/or kidney function, with persistent immunological activity, after 2-3 months of immunosuppressive treatment with triple therapy (Figures 4 and 5)\n  Clinical considerations:\n    Investigate therapeutic non-compliance\n    Check optimal doses\n    Evaluate possible genetic factors (eg, APOL1 in black patients)\n    Consider to repeat kidney biopsy to evaluate chronicity or other types of lesions\n  Initial therapy based on MPAA (Figures 4 and 5) → Rituximab or Cyclophosphamide (Eurolupus regime)\n  Initial therapy based on Cyclophosphamide (Figure 4) → Rituximab or extended course of Cyclophosphamide (up to 6 months)\n    Non Response after 2-3 months:\n      Newest anti-B cell or anti-plasma cell drugs\n      Inclusion in clinical trials with drugs under development or experimental therapies for SLE"
        text: |
          الـ refractory في الكتاب = مفيش **≥25%** نزول في الـ proteinuria، أو الكلية أو البروتين بيسوء، مع ==persistent immunological activity==، بعد **2-3 شهور** من الـ triple.

          الخطوة الجاية بتعتمد على **بدأت بإيه**، عشان تغيّر الـ mechanism:
          - بدأت **MPAA** → **rituximab** أو **cyclophosphamide** (Euro-Lupus).
          - بدأت **cyclophosphamide** → **rituximab** أو **cyclophosphamide أطول** (لحد 6 شهور).
          - ولسه مفيش response بعد 2-3 شهور → أحدث أدوية **anti-B cell** أو **anti-plasma cell**، أو clinical trial.

          وقبل كل ده الـ figure بيقولك: الالتزام، الجرعات، **biopsy تانية**، و ==APOL1 in black patients==. التفسير المقبول (مش في الكتاب): الـ APOL1 بيعمل مرض كلى لوحده، فلو موجود البروتين مش هيستجيب للـ immunosuppression مهما زوّدت.
      - kind: check
        page: 467
        quote: "Lack of response (no reduction in proteinuria by at least >25%) or worsening of proteinuria and/or kidney function, with persistent immunological activity, after 2-3 months of immunosuppressive treatment with triple therapy (Figures 4 and 5)\n  Clinical considerations:\n    Investigate therapeutic non-compliance\n    Check optimal doses\n    Evaluate possible genetic factors (eg, APOL1 in black patients)\n    Consider to repeat kidney biopsy to evaluate chronicity or other types of lesions\n  Initial therapy based on MPAA (Figures 4 and 5) → Rituximab or Cyclophosphamide (Eurolupus regime)\n  Initial therapy based on Cyclophosphamide (Figure 4) → Rituximab or extended course of Cyclophosphamide (up to 6 months)\n    Non Response after 2-3 months:\n      Newest anti-B cell or anti-plasma cell drugs\n      Inclusion in clinical trials with drugs under development or experimental therapies for SLE"
        question: "After MPAA-based triple therapy for 3 months, proteinuria has not fallen and anti-dsDNA stays high. Adherence and doses are confirmed. What does the figure suggest next?"
        options:
          - "Rituximab or Euro-Lupus cyclophosphamide"
