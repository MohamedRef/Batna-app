items:
  # ---------- p1: introduction and sampling ----------
  - id: neph.L01.001
    kind: card
    topic: sampling
    front: Why is ABG analysis essential in high-risk and ICU patients?
    back: It is essential for diagnosing and managing both the oxygenation status and the acid–base balance.
    src: { page: 1, quote: "an essential part of diagnosing and managing the oxygenation status and acid– base balance of the high-risk patients" }
    status: unverified
  - id: neph.L01.002
    kind: card
    topic: sampling
    front: Besides following the patient's progress, what does applying acid–base concepts help the clinician do?
    back: Evaluate the effectiveness of the care being provided.
    src: { page: 1, quote: "not only to follow the progress of a patient, but also to evaluate the effectiveness of care being provided" }
    status: unverified
  - id: neph.L01.003
    kind: cloze
    topic: sampling
    text: ABG accuracy depends on collecting, handling and analyzing the specimen, but ABG measurements are particularly vulnerable to {{c1::preanalytic}} errors.
    src: { page: 1, quote: "ABG measurements are particularly vulnerable to preanalytic errors." }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.004
    kind: enumerate
    topic: sampling
    prompt: Mention the most common problems encountered in ABG sampling.
    points:
      - Nonarterial (venous) samples
      - Air bubbles in the sample
      - Inadequate or excessive anticoagulant
      - Delayed analysis of the sample
    pass: 3
    src: { page: 1, quote: "nonarterial samples, air bubbles in the sample, inadequate or excessive anticoagulant in the sample, and delayed analysis of sample." }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.005
    kind: card
    topic: sampling
    front: How should the arterial sample be mixed with the anticoagulant, and why?
    back: Mixed in two dimensions, to prevent stacking of red blood cells.
    src: { page: 1, quote: "Correct method of mixing of the arterial sample with the anticoagulant in two dimensions to prevent stacking of red blood cells." }
    status: unverified
  # ---------- p2: arterial vs venous ----------
  - id: neph.L01.006
    kind: card
    topic: sampling
    front: Can venous blood be used for ABG, and why?
    back: Yes. In normal individuals the difference between arterial and venous ABG values is insignificant (though it becomes significant in pathological states).
    src: { page: 2, quote: "venous blood samples can be used because there is insignificant difference in ABG values between these two samples." }
    status: unverified
  - id: neph.L01.007
    kind: card
    topic: sampling
    front: In which patient is a large arteriovenous ABG difference found?
    back: A patient with decreased cardiac output on mechanical ventilation.
    src: { page: 2, quote: "large arteriovenous difference can be found in a patient with decreased cardiac output and on mechanical ventilation." }
    status: unverified
  - id: neph.L01.008
    kind: cloze
    topic: sampling
    text: In low cardiac output on a ventilator, arterial pCO2 stays {{c1::normal}} while central venous pCO2 may be {{c2::extremely elevated}}, because more CO2 is added to the perfusing tissue.
    src: { page: 2, quote: "the arterial pCO2 remains normal, but central venous pCO2 may be extremely elevated, as more CO2 is added to the perfusing tissue." }
    status: unverified
  - id: neph.L01.009
    kind: cloze
    topic: sampling
    text: In low cardiac output states an arterial ABG assesses {{c1::pulmonary gas exchange}}, while a central venous ABG assesses {{c2::pH and tissue oxygenation}}.
    src: { page: 2, quote: "an arterial ABG is useful in assessing pulmonary gas exchange, and central venous ABG is useful in assessing pH and tissue oxygenation." }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.010
    kind: table
    topic: sampling
    title: Differences between arterial and venous blood samples (book p2)
    columns: [ABG value, Arterial blood, Venous blood]
    rows:
      - ["[H+] (nmol/L)", "40", "44"]
      - ["pH", "7.40", "7.36"]
      - ["pCO2 (mmHg)", "40", "48"]
      - ["[HCO3-] (mEq/L)", "24", "26"]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 2]]
    src: { page: 2, quote: "Differences between arterial and venous blood samples." }
    status: unverified
    tags: [numbers]
  # ---------- p3: normal values, ROME ----------
  - id: neph.L01.011
    kind: table
    topic: normals
    title: Normal acid–base values (book p3)
    columns: [Parameter, Normal value]
    rows:
      - ["pH", "7.35–7.45"]
      - ["paCO2", "35–45 mmHg"]
      - ["paO2", "80–100 mmHg"]
      - ["HCO3", "22–26 mEq/L"]
      - ["BE/BD", "−2 to +2"]
      - ["SpO2", "> 95%"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 3, quote: "Normal Acid Base values" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L01.012
    kind: cloze
    topic: normals
    text: Normal arterial pH is {{c1::7.35–7.45}}, normal paCO2 is {{c2::35–45 mmHg}}, and normal HCO3 is {{c3::22–26 mEq/L}}.
    src: { page: 3, quote: "7.35 —7.45 35— 45 mm Hg 80 — 100 mm Hg 22 — 26 mEq/L" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L01.013
    kind: card
    topic: normals
    front: What does the ROME mnemonic stand for?
    back: Respiratory Opposite, Metabolic Equal (direction of pH versus the primary variable).
    src: { page: 3, quote: "Acid-Base Mnemonic—ROME" }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.014
    kind: cloze
    topic: normals
    text: "ROME, respiratory = opposite: pH ↑ with PaCO2 ↓ is {{c1::respiratory alkalosis}}; pH ↓ with PaCO2 ↑ is {{c2::respiratory acidosis}}."
    src: { page: 3, quote: "Respiratory Opposite – pH ↑ PaCO2 ↓ Alkalosis – pH ↓ PaCO2 ↑ Acidosis" }
    status: unverified
  - id: neph.L01.015
    kind: cloze
    topic: normals
    text: "ROME, metabolic = equal: pH ↑ with HCO3 ↑ is {{c1::metabolic alkalosis}}; pH ↓ with HCO3 ↓ is {{c2::metabolic acidosis}}."
    src: { page: 3, quote: "Metabolic Equal – pH ↑ HCO3 ↑ Alkalosis – pH ↓ HCO3 ↓ Acidosis" }
    status: unverified
  - id: neph.L01.016
    kind: enumerate
    topic: normals
    prompt: Mention the three concepts that help you evaluate acid–base disorders.
    points:
      - The Henderson equation
      - The anion gap
      - The secondary physiologic response (compensation)
    pass: 3
    src: { page: 3, quote: "Three concepts that help you evaluate the acid–base disorders are: Henderson equation The anion gap The secondary physiologic response (compensation)" }
    status: unverified
    tags: [high-yield]
  # ---------- p4-5: Henderson ----------
  - id: neph.L01.017
    kind: card
    topic: henderson
    front: Why is the Henderson equation used instead of Henderson–Hasselbalch at the bedside?
    back: Henderson–Hasselbalch is cumbersome (logarithms); the Henderson equation gives the same information by relating [H+] to pH.
    src: { page: 4, quote: "the Henderson–Hasselbalch equation is a rather cumbersome way to calculate the pH using logarithms." }
    status: unverified
  - id: neph.L01.018
    kind: cloze
    topic: henderson
    text: "Henderson equation: [H+] (nmol/L) = {{c1::24}} × {{c2::pCO2 / [HCO3-]}}."
    src: { page: 4, quote: "This equation, which calculates [H+], is expressed as" }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.019
    kind: card
    topic: henderson
    front: What is the clinical use of the Henderson equation?
    back: To check the validity of the pH reported by the laboratory.
    src: { page: 4, quote: "The Henderson equation is thus used clinically to check the validity of pH obtained from the clinical laboratory." }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.020
    kind: table
    topic: henderson
    title: Approximate [H+] for clinically relevant pH values (book p4)
    columns: [pH, "[H+] (nmol/L)"]
    rows:
      - ["7.50", "30"]
      - ["7.40", "40"]
      - ["7.30", "50"]
      - ["7.20", "60"]
      - ["7.10", "80"]
      - ["7.00", "100"]
    blanks: [[0, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 4, quote: "pH 7.50 = 30 pH 7.40 = 40 pH 7.30 = 50 pH 7.20 = 60 pH 7.10 = 80 pH 7.00 = 100" }
    status: unverified
    tags: [numbers]
  - id: neph.L01.021
    kind: cloze
    topic: henderson
    text: "Quick rule from the lecture: the last two digits of the pH ≈ {{c1::80 − [H+]}}."
    src: { page: 4, quote: "Last 2 digits of pH= 80 - H+" }
    status: unverified
    tags: [numbers]
  - id: neph.L01.022
    kind: cloze
    topic: henderson
    text: "Worked example: pH 7.40, pCO2 40 mmHg, HCO3- 24 mEq/L gives [H+] = 24 × 40/24 = {{c1::40}} nmol/L, which matches pH {{c2::7.40}}."
    src: { page: 5, quote: "pCO2 = 40 mmHg HCO3− = 24 mEq/L" }
    status: unverified
    tags: [numbers]
  # ---------- p5-7: anion gap ----------
  - id: neph.L01.023
    kind: card
    topic: anion-gap
    front: What principle underlies the anion gap?
    back: Electroneutrality. Plasma cations must equal anions, but not all of them are measured routinely.
    src: { page: 5, quote: "the number of cations must equal the number of anions to maintain electroneutrality." }
    status: unverified
  - id: neph.L01.024
    kind: card
    topic: anion-gap
    front: Which electrolytes are usually measured, from which unmeasured anions are calculated?
    back: Na+, K+, Cl− and HCO3−.
    src: { page: 5, quote: "Among all electrolytes, Na+, K+, Cl−, and HCO3− are usually measured." }
    status: unverified
  - id: neph.L01.025
    kind: cloze
    topic: anion-gap
    text: "The anion gap is the amount by which plasma {{c1::[Na+]}} exceeds the sum of {{c2::[Cl−] and [HCO3−]}}: AG = Na+ − (Cl− + HCO3−)."
    src: { page: 5, quote: "plasma [Na+] exceeds the sum of plasma [Cl−] and [HCO3−], and the difference is called the anion gap (AG)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.026
    kind: card
    topic: anion-gap
    front: Why is K+ not routinely included in the anion gap calculation?
    back: Because the change in serum [K+] in health or disease is minimal.
    src: { page: 5, quote: "Since the change in serum [K+] in either health or disease is minimal, this cation is not routinely included in the calculation of AG." }
    status: unverified
  - id: neph.L01.027
    kind: table
    topic: anion-gap
    title: Unmeasured cations and anions (mEq/L) (book p6)
    columns: [Group, "Ions (mEq/L)", Total]
    rows:
      - ["Unmeasured cations", "K+ 4.5, Ca2+ 5.0, Mg2+ 1.5", "11"]
      - ["Unmeasured anions", "Albumin 12, other proteins 3, PO4 2, SO4 1, organic acids 5", "23"]
    blanks: [[0, 2], [1, 1], [1, 2]]
    src: { page: 6, quote: "Unmeasured cations (mEq/L); Unmeasured anions (mEq/L)" }
    status: unverified
    tags: [numbers]
  - id: neph.L01.028
    kind: cloze
    topic: anion-gap
    text: "Unmeasured anions total about {{c1::23}} mEq/L and unmeasured cations about {{c2::11}} mEq/L, so AG = 23 − 11 = {{c3::12 ± 4}}."
    src: { page: 6, quote: "Total: 11 Total: 23 AG = 23-11 = 12+4" }
    status: unverified
    tags: [numbers]
  - id: neph.L01.029
    kind: card
    topic: anion-gap
    front: Restate the anion gap in terms of unmeasured ions.
    back: AG = unmeasured anions − unmeasured cations (= measured cations − measured anions), because measured + unmeasured anions equal measured + unmeasured cations.
    src: { page: 6, quote: "Unmeasured anions Measured cations Unmeasured cations Measured anions" }
    status: unverified
  - id: neph.L01.030
    kind: card
    topic: anion-gap
    front: How does lactic acid raise the anion gap?
    back: Lactic acid dissociates into H+ and lactate (an unmeasured anion). The H+ is buffered by NaHCO3 (→ Na+ + CO2 + H2O), so HCO3- falls while lactate takes its place.
    src: { page: 6, quote: "Lactic acid ->H* + Lactate’" }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.031
    kind: cloze
    topic: anion-gap
    text: "The classic normal AG of {{c1::12 ± 4}} came from colorimetry and flame photometry; with ion-selective electrodes the normal AG is lower, {{c2::3 to 11}}."
    src: { page: 7, quote: "With the introduction of ion-selective electrode methodology, the normal AG levels are much lower, ranging from 3 to11." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L01.032
    kind: card
    topic: anion-gap
    front: Why are AG values lower with ion-selective electrodes?
    back: Because of higher Cl− determination by that method.
    src: { page: 7, quote: "These low values are related to high Cl− determination." }
    status: unverified
  - id: neph.L01.033
    kind: card
    topic: anion-gap
    front: Since normal AG varies between laboratories, what should the clinician do, and what value does the lecture take as normal for simplicity?
    back: Follow his or her own laboratory's values; for simplicity an AG of 10 mEq/L is considered normal.
    src: { page: 7, quote: "For simplicity, an AG of 10 mEq/L is considered normal." }
    status: unverified
    tags: [numbers]
  # ---------- p7-8: hyperglycemia ----------
  - id: neph.L01.034
    kind: card
    topic: anion-gap
    front: In severe hyperglycemia, should AG be calculated with measured or corrected Na+?
    back: Measured Na+ only, not corrected Na+.
    src: { page: 8, quote: "It is, thus, emphasized that only measured Na+ should be used to calculate the serum AG." }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.035
    kind: card
    topic: anion-gap
    front: Why should only measured Na+ be used for AG in hyperglycemia?
    back: Cl− and HCO3− are assumed to be diluted equally with Na+ by water leaving the cells. Using corrected Na+ without correcting Cl− and HCO3− overestimates AG and falsely suggests a high AG metabolic acidosis.
    src: { page: 8, quote: "the AG is overestimated with the implication of underlying high AG metabolic acidosis." }
    status: unverified
  - id: neph.L01.036
    kind: cloze
    topic: anion-gap
    text: Serum Na+ falls by {{c1::1.6}} for each {{c2::100 mg/dL}} rise in glucose above normal; no such number is given for Cl− or HCO3−.
    src: { page: 8, quote: "Na+ decreases by 1.6 mEq/dL for each increase in 100 mg/dL glucose above normal glucose levels" }
    status: unverified
    tags: [numbers]
  # ---------- p8: clinical use, high AG ----------
  - id: neph.L01.037
    kind: card
    topic: anion-gap
    front: What is the traditional clinical use of the anion gap?
    back: To classify metabolic acidosis into high, normal or low AG metabolic acidosis.
    src: { page: 8, quote: "the AG is useful in classifying metabolic acidosis into high, normal, or low AG metabolic acidosis." }
    status: unverified
  - id: neph.L01.038
    kind: cloze
    topic: anion-gap
    text: High AG is due to accumulation of {{c1::unmeasured anions}}, whereas normal AG metabolic acidosis is usually related to a high {{c2::Cl−}} level.
    src: { page: 8, quote: "High AG is due to accumulation of unmeasured anions, whereas normal AG is usually related to high Cl− level." }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.039
    kind: enumerate
    topic: anion-gap
    prompt: What does a low anion gap imply?
    points:
      - A substantial decrease in unmeasured anions
      - An increase in unmeasured cations
      - A spurious decrease in [Na+]
      - A spurious increase in [Cl−] or [HCO3−]
    pass: 3
    src: { page: 8, quote: "Low AG implies a substantial decrease in unmeasured anions, an increase in unmeasured cations, and spurious decrease in [Na+]" }
    status: unverified
  - id: neph.L01.040
    kind: table
    topic: anion-gap
    title: Most common causes of high AG metabolic acidosis (book p8, Table 4.4)
    columns: [Cause, Unmeasured anions causing high AG]
    rows:
      - ["Uremic acidosis (renal failure)", "Sulfate, phosphate, urate"]
      - ["Ketoacidosis (diabetes, starvation, alcohol)", "Acetoacetate, β-hydroxybutyrate"]
      - ["Lactic acidosis", "L-lactate"]
      - ["Small bowel resection", "D-lactate"]
      - ["Methanol", "Formate"]
      - ["Ethylene glycol", "Glycolate, oxalate"]
      - ["Aspirin", "Salicylate, L-lactate, ketoacids"]
      - ["Acetaminophen (Tylenol)", "Pyroglutamate"]
      - ["Paraldehyde", "Acetaldehyde or acetic acid"]
      - ["Toluene", "Hippurate, benzoate"]
    blanks: [[0, 1], [1, 1], [3, 1], [4, 1], [5, 1], [7, 1], [9, 1]]
    src: { page: 8, quote: "Most common causes of high AG metabolic acidosis" }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.041
    kind: cloze
    topic: anion-gap
    text: Small bowel resection causes high AG acidosis through {{c1::D-lactate}}, and acetaminophen through {{c2::pyroglutamate}}.
    src: { page: 8, quote: "Small bowl resection D-lactate" }
    status: unverified
  - id: neph.L01.042
    kind: card
    topic: anion-gap
    front: Which unmeasured anions accumulate in uremic acidosis?
    back: Sulfate, phosphate and urate.
    src: { page: 8, quote: "Uremic acidosis (renal failure) Sulfate, phosphate, urate" }
    status: unverified
  # ---------- p9: MUDPILES, normal AG, albumin ----------
  - id: neph.L01.043
    kind: enumerate
    topic: anion-gap
    prompt: "Expand MUDPILES: causes of elevated anion gap metabolic acidosis."
    points:
      - "M: Methanol"
      - "U: Uraemia (renal failure)"
      - "D: Diabetic, alcoholic or starvation ketoacidosis"
      - "P: Paracetamol, propylene glycol, paregoric"
      - "I: Inborn errors of metabolism, iron, ibuprofen, isoniazid"
      - "L: Lactic acid"
      - "E: Ethylene glycol"
      - "S: Salicylates (aspirin)"
    pass: 7
    src: { page: 9, quote: "Mnemonic: MUDPILES Methanol Uraemia (renal failure) Diabetic, alcoholic, or starvation ketoacidosis" }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.044
    kind: table
    topic: anion-gap
    title: Most common causes of normal AG metabolic acidosis (book p9, Table 4.5)
    columns: [Cause, Mechanism]
    rows:
      - ["Diarrhea", "Loss of HCO3- in stool"]
      - ["Ureterosigmoidostomy, ileal conduit", "Loss of HCO3- in stool"]
      - ["Carbonic anhydrase inhibitors", "Loss of HCO3- in urine"]
      - ["Recovery phase of ketoacidosis", "Less HCO3- synthesis from decreased availability of ketones"]
      - ["CKD stages 4–5", "Decrease in NH3 excretion"]
      - ["Proximal RTA (type II)", "Loss of HCO3- in urine"]
      - ["Distal RTA (type I)", "Decreased renal acid secretion"]
      - ["Distal RTA (type IV)", "Decreased acid secretion and low NH3 production"]
      - ["Dilutional acidosis", "Increased Cl- due to normal saline administration"]
      - ["Cholestyramine", "Release of Cl- in exchange for HCO3-"]
    blanks: [[2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [8, 1], [9, 1]]
    src: { page: 9, quote: "Most common causes of normal AG metabolic acidosis" }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.045
    kind: cloze
    topic: anion-gap
    text: CKD stages {{c1::4–5}} cause a normal AG metabolic acidosis through a decrease in {{c2::NH3 excretion}}.
    src: { page: 9, quote: "Chronic kidney diseases (stages 4-5) Decrease in NH; excretion" }
    status: unverified
  - id: neph.L01.046
    kind: card
    topic: anion-gap
    front: How does cholestyramine cause a normal AG metabolic acidosis?
    back: It releases Cl− in exchange for HCO3−.
    src: { page: 9, quote: "Cholestyramine | Release of Cl- in exchange for HCO,-" }
    status: unverified
  - id: neph.L01.047
    kind: card
    topic: anion-gap
    front: What is dilutional acidosis?
    back: A normal AG metabolic acidosis from increased Cl− due to normal saline administration.
    src: { page: 9, quote: "Dilutional acidosis Increased Cl- due to normal saline administration" }
    status: unverified
  - id: neph.L01.048
    kind: card
    topic: anion-gap
    front: Apart from laboratory error, what is the most common cause of a low AG in hospitalized patients?
    back: Hypoalbuminemia.
    src: { page: 9, quote: "Other than laboratory error, the most common cause of low AG acidosis in hospitalized patients is hypoalbuminemia." }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.049
    kind: cloze
    topic: anion-gap
    text: Albumin is the major unmeasured anion; for each 1 g/dL fall in albumin from normal, the AG falls by {{c1::2.5}} (4.0 → 2.0 g/dL lowers AG by {{c2::5}}).
    src: { page: 9, quote: "for each gram decrease in albumin from normal value, the AG decreases by 2.5" }
    status: unverified
    tags: [numbers, high-yield]
  # ---------- p10: low AG causes ----------
  - id: neph.L01.050
    kind: table
    topic: anion-gap
    title: Most common causes of low AG (book p10)
    columns: [Cause, Mechanism]
    rows:
      - ["Hypoalbuminemia", "Decreased number of anions"]
      - ["IgG myeloma", "Increased number of cations"]
      - ["Bromide intoxication", "Bromide measured as chloride"]
      - ["Salicylate overdose", "Salicylate measured as chloride"]
      - ["Hypercalcemia", "Increased number of cations"]
      - ["Hypermagnesemia", "Increased number of cations"]
      - ["Lithium toxicity", "Increased number of cations"]
      - ["Hypertriglyceridemia", "Different laboratory analysis"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [7, 1]]
    src: { page: 10, quote: "IgG myeloma Increased number of cations" }
    status: unverified
  - id: neph.L01.051
    kind: card
    topic: anion-gap
    front: How do bromide intoxication and salicylate overdose lower the AG?
    back: Bromide and salicylate are measured as chloride (spuriously high Cl−).
    src: { page: 10, quote: "Bromide intoxication* | Bromide measured as chloride Salicylate overdose Salicylate measured as chloride" }
    status: unverified
  - id: neph.L01.052
    kind: enumerate
    topic: anion-gap
    prompt: Name the causes of a low anion gap that act by increasing unmeasured cations.
    points: [IgG myeloma, Hypercalcemia, Hypermagnesemia, Lithium toxicity]
    pass: 3
    src: { page: 10, quote: "IgG myeloma Increased number of cations" }
    status: unverified
  # ---------- p10-11: delta ----------
  - id: neph.L01.053
    kind: card
    topic: delta
    front: Besides classifying metabolic acidosis, how else is the AG useful?
    back: Indirectly, in analyzing mixed disorders such as high AG metabolic acidosis with metabolic alkalosis, or high AG plus normal AG metabolic acidosis (via ΔAG/ΔHCO3).
    src: { page: 10, quote: "it is also indirectly helpful in analyzing mixed acid–base disorders" }
    status: unverified
  - id: neph.L01.054
    kind: cloze
    topic: delta
    text: In a simple high AG metabolic acidosis, each {{c1::1}} mEq/L rise in AG is matched by a {{c1::1}} mEq/L fall in HCO3-, so ΔAG/ΔHCO3- = {{c2::1}}.
    src: { page: 11, quote: "In a simple high AG metabolic acidosis, the ∆AG/∆HCO3− ratio is 1." }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.055
    kind: card
    topic: delta
    front: What does a significant deviation of ΔAG/ΔHCO3 from 1 indicate?
    back: A mixed acid–base disorder.
    src: { page: 11, quote: "Any significant deviation from 1 is indicative of a mixed acid–base disorder." }
    status: unverified
  - id: neph.L01.056
