          - "مش في القائمة."
          - "مش في القائمة، والـ diuretics عمومًا بترفع الـ urate."
      - kind: explain
        page: 243
        title: "الـ tophaceous gout"
        quote: "Tophi appear as white, yellowish deposits commonly in the external ear, subcutaneous deposits, especially of the finger tips, palms, soles"
        text: |
          قبل العلاج الفعال، **50%** كانوا بيعملوا tophi؛ دلوقتي أقل.
          - **White-yellow deposits:** ==external ear==، fingertips، palms، soles، حوالين المفاصل.
          - بعدين: **Achilles tendon** (fusiform/nodular) و **olecranon bursa** (saccular).
          - **Painless**، بس بتحدد الحركة وهي بتكبر. الجلد **tense، shiny**، وممكن يتقرح ويطلع **chalky material**.
          - **Pathology:** monosodium urate needles + mononuclear و **giant multinucleated cells**.
          - **X-ray:** **punched-out lesions** بـ **overhanging margins**.
      - kind: aside
        tone: analogy
        page: 243
        quote: "The overlying skin is tense, shiny, and may ulcerate to extrude white chalky or pasty material"
        text: "الـ tophus لما يتقرح بيطلع مادة بيضا زي **الطباشير** أو المعجون (**white chalky or pasty material**). لو شفت عيان ودنه فيها «حبة طباشير» ومفاصله معووجة: ده **tophaceous gout** لحد ما يثبت العكس."
