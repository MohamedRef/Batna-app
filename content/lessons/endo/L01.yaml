          ليه القايمة طويلة كده؟ لأن مفيش واحد فيهم شافي، فبنجمع أسلحة. التفسير المقبول (مش في الكتاب): الـ **chemoembolization** عشان الـ liver mets بتاكل من الـ hepatic artery، فنقفلها عليها والكبد السليم يعيش على الـ portal vein. الـ **octreotide** شبه الـ somatostatin، فبيقفل إفراز الـ gastrin. والـ **debulking** يعني نشيل أكبر كمية ورم، فالهرمون يقل حتى لو مقدرناش نشيل كله.
