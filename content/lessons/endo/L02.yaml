          لو مش متحكم فيه: preeclampsia، fetal malformations، premature delivery، low birth weight.

          ليه كل ممنوع؟ التفسير المقبول (مش في الكتاب): غدة الجنين بتبدأ تمسك **iodine** من حوالي الأسبوع 10–12، فالـ **RAI** هيدمّرها، والـ iodine الكتير ممكن يعمل لها goitre و hypothyroidism. والـ ATDs بتعدّي المشيمة وبتشتغل على غدة الجنين كمان، عشان كده **أقل جرعة** تخلّي الأم كويسة من غير ما تطفي غدة البيبي. وبنتابع البيبي لأن الأدوية والـ TSHR antibodies الاتنين بيوصلوله.
