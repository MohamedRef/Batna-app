  - id: neph.L14.lesson8
    title: "فيروسات الكلية: HCV و HBV و HIV"
    hook: "فيروس الكبد بيوصل الكلية من بابين: بروتين بيترسب، أو أذى مباشر للخلية."
    minutes: 10
    pages: [484, 490]
    topics: [hcv, hbv-hiv]
    goals:
      - "تعرف lesions الـ HCV وليه الـ cryoglobulinemic MPGN أشهرهم"
      - "تفرّق بين الـ MPGN والـ MGN تحت الميكروسكوب وتفهم ليه"
      - "تشرح الطريقين: immune-mediated و direct"
      - "تعالج حسب KDIGO وتعرف ليه الـ antiviral الأول"
      - "تعرف HBV و HIV والكلية"
    status: unverified
    steps:
      - kind: explain
        page: 484
        title: "ليه الـ HCV بيعمل cryoglobulins؟"
        quote: "HCV is a lymphotropic virus that promotes lymphocyte differentiation to abnormal plasma cells."
        text: |
          الـ lesions الأشهر: **MPGN** و **MGN**. والأقل: IgAN، TMA، FSGS، fibrillary و immunotactoid، و vasculitis زي الـ polyarteritis nodosa.

          السر في إن الـ HCV ==lymphotropic==: بيدخل الـ lymphocytes وبيزقّها تبقى ==abnormal plasma cells==. والنتيجة ==partially uncontrolled B-cell clone expansion== بتطلّع **mixed cryoglobulins**.

          - **Type II** مرتبط بالـ HCV في **90%**، و **type III** في **70%**.
          - والـ cryoglobulins **increases with the duration of the HCV infection**: كل ما العدوى طوّلت، الـ clone بيكبر.

          التفسير المقبول (مش في الكتاب): ده نفس السبب إن الـ HCV ليه علاقة بالـ B-cell lymphoma، وإن الـ **rituximab** (اللي بيضرب الـ B cells) ليه دور في العلاج.
      - kind: explain
        page: 485
        title: "ليه الـ MPGN هو الأشهر، وشكله إيه؟"
        quote: "The most frequent kidney lesion associated with chronic HCV is MPGN mainly due to cryoglobulinemia-induced vasculitis. HCV-induced MPGN is due to the precipitation of cryoglobulins in the glomerular endothelial layer cells."
        text: |
          الـ cryoglobulins ==precipitation== في الـ **endothelial layer**، يعني جنب الدم. فكل اللي بتشوفه تحت الميكروسكوب جاي من ده:

          - **Subendothelial IgM و IgG** و "fingerprint"، وساعات **intraluminal thrombi** قافلة الـ capillary: البروتين نفسه بيترسب في الـ lumen.
          - **Hypercellularity** من الـ mononuclear والـ polymorphonuclear: الـ deposits جنب الدم فبتشد الخلايا.
          - **Double contours** في الـ GBM: لأن الـ **monocytes** بتدخل بين الـ GBM والـ endothelium.
          - **Vasculitis** في الشرايين الصغيرة في **30%**.

          وممكن MPGN **من غير cryoglobulins** بـ immune complexes عادية.
      - kind: explain
        page: 485
        title: "Cryoglobulinemic MPGN"
        quote: "The most frequent kidney lesion associated with chronic HCV is MPGN mainly due to cryoglobulinemia-induced vasculitis."
        text: |
          - Subendothelial **immunoglobulin M (IgM) و immunoglobulin G (IgG)** deposits، ساعات **intraluminal thrombi**.
          - **Double contours** من الـ monocyte interposition.
          - Lobular accentuation و hypercellularity.
          - "electron microscopy (EM): **large subendothelial deposits**."
          - **Vasculitis** في **30%**.

          ليه الـ intraluminal thrombi؟ لأن الـ cryoglobulins نفسها بتترسب جوه الـ capillary وتسدّه، وده اللي بيعمل التدهور السريع في الكلية.
      - kind: explain
        page: 485
        title: "الـ MGN: نفس الفيروس، مكان تاني"
        quote: "The lack of significant cellular proliferation. Increased glomerular basement membrane (GBM) thickness. And increased subepithelial immune deposits are distinctive features of MGN."
        text: |
          الـ MGN في الكتاب: ==lack of significant cellular proliferation==، **GBM سميك**، و **subepithelial deposits**.

          قارن بالـ MPGN: هناك الـ deposits **subendothelial** فالتهاب وخلايا كتير، هنا **subepithelial** ورا الـ GBM فمفيش خلايا. نفس المنطق اللي شفناه في الـ lupus class IV مقابل class V.

          يعني نفس الفيروس ممكن يعمل صورتين مختلفتين خالص، والفرق كله في مكان الـ deposit.
      - kind: explain
        page: 486
        title: "إيه اللي بيقول إن الـ HCV نفسه بيعمل MGN؟"
        quote: "MGN occurs in HCV-infected patients and can present with histological and clinical features similar to primary MGN. According to Yamabe et Al. 8.3% of patients with MGN had anti-HCV antibodies or detectable HCV RNA."
        text: |
          الكتاب بيدّيك حجّتين إن العلاقة **سببية** مش صدفة:
          1. في **سلسلة مصرية**، أغلبهم MPGN، بس نسبة كان عندهم **MGN لوحده** من غير أي cryoglobulinemia.
          2. اتلقى ==HCV-related proteins== في جدار الـ capillary مع cryoglobulins قليلة أو مفيش.

          وفي Yamabe: **8.3%** من الـ MGN عندهم anti-HCV أو HCV RNA. والآلية: immune complexes فيها بروتينات الفيروس بتتجمع في الـ glomeruli، وده مدعوم بـ deposits من **IgG و IgA و complement** مع جزيئات الـ HCV.

          والـ **FSGS**؟ نادر، وشبه الـ primary. الآلية مش معروفة، بس الشك إن الـ HCV ==damage podocytes directly==، زي الـ **HIV**. والتفرقة بالتحاليل والصورة بتاعة الـ HCV.

          ليه الحجتين دول مقنعين؟ لأن لو الـ MGN كان صدفة، مكانش هيبقى فيه بروتينات فيروس جوه الـ deposits نفسها.
      - kind: explain
        page: 487
        title: "بابين للأذى: immune و direct"
        quote: "HCV antigens may activate B lymphocytes to produce autoantibodies. immune-mediated cryoprecipitates and non-cryoprecipitate complexes."
        text: |
          **الباب الأول: Immune-mediated.** الـ HCV antigens بتشغّل الـ B cells ← autoantibodies و cryoprecipitates ← تترسب في الـ nephron ← complement و anti-endothelial antibodies ← **fibrinoid necrosis** ← adhesion molecules تشد خلايا كتير (dendritic، NK، T و B) وتنشّط الصفايح. ولو الـ GBM اتضرب جامد، الـ cryoglobulins بتعدّي للـ tubules وتعمل **crescents** و **tubular casts**.

          **الباب التاني: Direct.** الكتاب بيقول ==tempting to speculate==: الفيروس بيأذي الـ endothelium والـ tubular cells، والكلية ممكن تعبّر عن **CD81** (الـ receptor اللي الـ HCV بيدخل بيه الـ B cells والكبد)، والخلايا المصابة بتعمل **apoptosis**، وكمان أذى للـ Bowman capsule والـ **podocyte**.

          ليه ده مهم؟ التفسير المقبول (مش في الكتاب): الباب الأول بيتعالج بـ immunosuppression، الاتنين بيتعالجوا لما تشيل الفيروس. وده اللي بيفسّر ترتيب KDIGO الجاي.
      - kind: table
