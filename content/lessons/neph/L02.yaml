        hide: [[0, 1], [2, 1]]
      - kind: explain
        page: 55
        quote: "Figure 28: Potassium absorption rates of plant-based, animal-based, and processed foods. 3.13. Hyperuricemia Recommend people with CKD and symptomatic hyperuricemia should be offered uric acid-lowering intervention (1C)."
        title: "ليه البوتاسيوم النباتي أقل خطر؟"
        text: |
          Figure 28 بتدّي السبب كمان، مش الأرقام بس:

          - **Plant-based** (50–60%): الـ absorption قليل، والأكل النباتي **net alkalizing** (بيقلّل الحموضة)، والـ carbs فيه بتشغّل insulin يدخّل الـ K جوه الخلايا، فالأثر على الـ serum K صغير.
          - **Animal-based** (70–90%): الـ absorption أعلى، والبروتين الحيواني **net acid**، فالـ K يفضل في الدم أكتر.
          - **Processed** (90%): الـ ==potassium salts== (زي اللي في بدائل الملح والأكل المصنّع) بتتمص تقريبًا كلها.

          يعني الخيارة مش زي بديل الملح، حتى لو الاتنين فيهم K.
