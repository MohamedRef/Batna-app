[package]
name = "batna-anki"
description = "Anki decks (.apkg) from Batna content, for batna-tools and the app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
batna-core.workspace = true
serde_json.workspace = true
# The .apkg is a zipped SQLite collection; ids are SHA-1/SHA-256 based.
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_yaml_ng.workspace = true
tempfile = "3"

[lints]
workspace = true
