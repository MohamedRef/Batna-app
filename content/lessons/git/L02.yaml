  - id: git.L02.lesson3
    title: "نقطع من جوه: EMR و ESD و POEM"
    hook: "تشيل cancer بدري من غير جراحة، وتعالج achalasia من غير ولا غرزة برّه. السر في الـ submucosa."
    minutes: 10
    pages: [56, 62]
    topics: [resection, poem]
    goals:
      - "تعرف حدود الـ EMR والفرق بينه وبين الـ ESD"
      - "ترتّب خطوات الـ POEM بالأرقام"
      - "تعرف G-POEM و Z-POEM ومخاطر الـ POEM"
    status: unverified
    steps:
      - kind: explain
        page: 56
        quote: "EMR is a minimally invasive technique for staging/ treatment of early malignant lesions limited to the mucosa."
        title: "الـ EMR"
        text: |
          ==EMR==: minimally invasive لـ **staging** و**treatment** الـ early malignant lesions **limited to the mucosa**.

          - طلع من الـ **snare biopsy**، وبقى **first-choice** للـ early GI carcinoma.
          - بتحقن saline تحت الـ mucosa فتنتفخ، وبعدين تمسكها بـ **cap aspiration** أو **forceps traction**.
      - kind: aside
        tone: exam
        page: 57
        quote: "Maximal indicative diameters for EMR are 20/10 mm in elevated and depressed lesions respectively."
        text: |
          الأرقام: ==20 mm== للـ **elevated**، ==10 mm== للـ **depressed**.

          ومش radical treatment للـ **poorly differentiated adenocarcinoma**. والمتابعة: منظار **كل 6 شهور لمدة 5 سنين**.

          افتكرها كده: الـ lesion «الواقفة» (elevated) مسموحلها الضعف.
      - kind: table
        page: 57
        quote: "EMR is a natural extension of polypectomy, applied to a flat lesion after a submucosal injection."
        title: "EMR ولا ESD؟"
        columns: ["", "EMR", "ESD"]
        rows:
          - ["الفكرة", "Polypectomy for a flat lesion after submucosal injection", "Tunnel into the submucosal plane"]
          - ["الصعوبة", "Simpler", "Technically harder"]
          - ["إمتى", "Early cancer limited to mucosa, within size limits", "Likely superficial submucosal invasion, fibrosis, post-EMR recurrence"]
        hide: [[0, 2], [2, 2]]
      - kind: explain
        page: 58
        quote: "In 2009, Inoue et al, described a revolutionary technique for the treatment of achalasia, termed per-oral endoscopic myotomy (POEM)"
        title: "الـ POEM: Heller من جوه"
        text: |
          الـ **gold standard** للـ achalasia في الكتاب: ==Heller's myotomy (1914)==. والبدائل: **pneumatic dilation**، **botulinum toxin**، **CCBs**.

          الـ **POEM** (Inoue، **2009**): myotomy بالـ **NOTES** approach، يعني من فتحة طبيعية، **minimally invasive** و **scar-less**.

          الطريق ليه: Ortega 1980 (كلاب ثم 17 مريض)، فكرة الـ **submucosal tunnel** 2007، Pasricha على الخنازير، وبعدين Inoue على البني آدمين.
      - kind: figure
        page: 59
        quote: "The submucosal tunnel was extended 3 cm beyond the GE junction into the gastric cardia"
        title: "الـ POEM بالأرقام"
        alt: "Side view of the distal esophagus and cardia: mucosotomy entry high up, a submucosal tunnel running down between mucosa and muscle to 3 cm past the GE junction, and the myotomy of the inner circular layer starting 2 cm below the entry and ending 2 cm past the GE junction, with clips closing the entry."
        caption: "الأرقام اللي هتتسأل: mucosotomy **2 cm**، النفق **3 cm** بعد الـ GEJ، والـ myotomy لحد **2 cm** بعد الـ GEJ. والـ entry بيتقفل بـ **clips**."
