      - kind: reveal
        page: 43
        quote: "Enteroscope\n  Antegrade (oral) DBE\n  Retrograde (anal) DBE"
        prompt: "ليه بالونتين، مش بالونة واحدة؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الأمعاء الدقيقة طويلة ومتحركة، لو زقيت منظار عادي بيعمل **loop** في البطن ومش بيتقدم. البالونة التانية **بتمسك** الأمعاء وانت بتحرك الأولى، فتقدر تشد الأمعاء وتكرمشها على الـ overtube (**push and pull**). وعلشان كده فيه طريقين في الكتاب: ==antegrade (oral)== للجزء العلوي، و ==retrograde (anal)== للجزء السفلي.
      - kind: check
        page: 41
        quote: "Carbon dioxide is used to insufflate the small bowel which minimize bloating."
        question: "Why is carbon dioxide used to insufflate the small bowel during enteroscopy?"
        options:
          - "It minimizes bloating"
          - "It improves image colour"
          - "It replaces the need for sedation"
          - "It prevents bleeding"
        answer: 0
