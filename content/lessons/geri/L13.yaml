  - id: geri.L13.lesson6
    title: "إمتى نبدأ الـ palliative care في الكبير؟"
    hook: "مفيش «سرطان stage 4» في الكبير الـ frail. أمال إيه اللي يقولك إن الوقت جه؟ الكتاب مدّيك نوعين من العلامات."
    minutes: 7
    pages: [229, 230]
    topics: [markers]
    goals:
      - "تعدّ الـ core end-stage indicators"
      - "تعرف الـ non-disease specific indicators"
      - "تعرف احتياجات مريض الـ geriatric palliative care"
    status: unverified
    steps:
      - kind: explain
        remind: [geri.L13.055]
        page: 229
        quote: "(Adapted from Morrison & Meier except as noted) Core End-stage Indicators: indicating terminal phase of chronic illness are physical decline, weight loss, multiple comorbidities, and a serum albumin of <2.5 g/dL. Dependence on assistance with most activities of daily living."
        title: "إمتى نبدأ في الكبار؟"
        text: |
          **Core end-stage indicators** (Morrison & Meier):
          - Physical decline و **weight loss**.
          - Multiple comorbidities.
          - ==Serum albumin < 2.5 g/dL==.
          - اعتماد على الغير في **أغلب الـ activities of daily living (ADLs)**.

          ليه الـ albumin بالذات؟ التفسير المقبول (مش في الكتاب): الـ albumin الواطي بيعكس سوء تغذية والتهاب مزمن، ومرتبط بـ mortality أعلى في الكبار. يعني رقم بسيط في تحليل روتيني بيلخّص إن الجسم مابقاش قادر يعوّض.
          والعلامات دي مع بعض بتشاور على ==terminal phase of chronic illness==، أيًا كان اسم المرض.
      - kind: reveal
        page: 229
        quote: "Core End-stage Indicators: indicating terminal phase of chronic illness are physical decline, weight loss, multiple comorbidities, and a serum albumin of <2.5 g/dL."
        prompt: "مريض عنده heart failure و COPD و CKD، وزنه نازل وتعبان أكتر من الأول. الـ albumin 2.3. العلامات دي بتقولك إيه؟"
        answer: "إنه غالبًا في الـ ==terminal phase of chronic illness==: physical decline، weight loss، **multiple comorbidities**، و **albumin < 2.5 g/dL**. ده وقت تفتح كلام الـ palliative care، من غير ما تستنى تشخيص terminal واحد."
      - kind: aside
        remind: [geri.L13.057]
        tone: tip
        page: 230
        quote: "Frailty - extreme vulnerability to morbidity and mortality due to progressive decline in function and physiological reserve. Frequent falls, disability, susceptibility to acute illness and reduced ability to recover are examples of frailty."
        text: |
          علامات **مش خاصة بمرض** معين، افتكرها **4F**:
          - ==Frailty== (falls متكررة، disability، يعيا بسهولة ومايرجعش).
          - **Function**: dependence.
          - **Forgetting**: cognitive impairment.
          - **Family** support needs.

          ليه اسمها «non-disease specific»؟ يعني مش محتاج تعرف التشخيص عشان تشوفها. وده بالظبط اللي يناسب الكبير، لأن أعبائه (frailty، dependence، cognitive impairment) **multifactorial** وموجودة من سنين (ص 223).
      - kind: explain
        page: 230
        quote: "Cognitive impairment changes in memory, attention, thinking, language and executive function.\nFamily support needs emotional support, information and educational support unique to each patient/family and/or caregivers."
        title: "الـ F التالتة والرابعة بالتفصيل"
        text: |
          - ==Cognitive impairment==: تغيّر في الذاكرة، الانتباه، التفكير، اللغة، والـ **executive function**.
          - ==Family support needs==: دعم **نفسي**، و**معلومات** وتعليم، على مقاس كل مريض وعيلته أو الـ caregivers.
          - و **functional dependence**: الاعتماد على حد تاني في أنشطة الحياة اليومية.

          ليه احتياجات العيلة علامة لبدء رعاية المريض؟ التفسير المقبول (مش في الكتاب): في الكبير، العيلة هي اللي شايلة الرعاية سنين. لما تبدأ تتعب أو تتلخبط في قرارات العلاج، ده لوحده سبب كفاية تدخل الـ palliative care.
