          - **Coeliac**: infertility، و LH و T عاليين (زي ص 53 و 66).
          - **Neurologic diseases**: «mentioned before» (ص 56).
          - **Short stature**: نفس كلام ص 53، بس بجملة أوضح: الأطفال دول عندهم **acquired** short stature، يعني اتولدوا طبيعي وقصروا بسبب المرض، مع GH عالي و IGF-I واطي. والـ GH receptor antibodies **نادرًا** بتعمل peripheral GH insensitivity.

          والجديد بجد في الجلوكوز تحت. وص 71 كلها تكرار حرفي لص 70 و 45-46، فمش هنعيدها.
      - kind: explain
        page: 70
        quote: "b- FBS is normal or slightly elevated (greater than 50% of azotemic individuals even overt fasting hyperglycemia).\nc- spontaneous hypoglycemia has also been reported\nd- Plasma levels of insulin are slightly to moderatrly elevated in most pts (because the kidneys contributes significantly to insulin removal from the circulation)."
        title: "الجلوكوز في الـ chronic renal disease: الصورة الكاملة"
        text: |
          1. الـ glucose metabolism بايظ، والدليل إن الجلوكوز **بينزل أبطأ** بعد الـ glucose load.
          2. الـ fasting blood sugar (FBS) طبيعي أو عالي شوية، و**أكتر من 50%** من الـ azotaemic عندهم overt fasting hyperglycaemia.
          3. **Spontaneous hypoglycaemia** كمان اتسجلت.
          4. الإنسولين في البلازما **عالي شوية لمتوسط** في أغلب المرضى. والكتاب بيدّي السبب صريح: لأن **الكلية بتشيل جزء كبير من الإنسولين** من الدورة.
          5. الأدوية محتاجة dose adjustment، والـ oral agents ممنوعة عند GFR ≤50% (زي ص 52).
          6. مرضى الـ renal transplant عندهم خطر عالي لـ ==post-transplant diabetes mellitus==.

          يعني نفس المريض فيه قوتين ضد بعض: IR بترفع السكر، وإنسولين متراكم بيوقّعه.
