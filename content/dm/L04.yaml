    status: unverified
  - id: dm.L04.035
    kind: card
    topic: bp-esc
    front: ESC/ESH preferred initial combination for most hypertensive patients?
    back: A RAS blocker (ACEi or ARB) with a CCB or diuretic, preferably as a single-pill combination (SPC).
    src: { page: 43, quote: "Preferred combinations should comprise a RAS blocker (either an ACE inhibitor or an ARB) with a CCB or diuretic." }
