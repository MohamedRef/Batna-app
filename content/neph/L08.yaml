  - id: neph.L08.045
    kind: mcq
    topic: mcd
    stem: "A child has edema, hypertension, cola-coloured urine, low creatinine clearance, normal serum albumin, low C3 and a urine protein/creatinine ratio of 0.6. Using the book's differential table, which diagnosis fits?"
    options:
      - Post-streptococcal GN
      - Minimal change nephrotic syndrome
      - Membranous nephropathy
      - IgA nephropathy
      - FSGS
    answer: 0
    why:
      - Correct. PSGN = low renal function, normal albumin, low C3, UPr/Cr below 1.0, hematuria and hypertension.
      - MCNS has normal renal function, low albumin, normal C3 and UPr/Cr above 3.0.
      - Membranous has very low albumin, normal C3 and UPr/Cr above 3.0.
      - IgA nephropathy has a normal C3 and UPr/Cr 1.0 to 3.0.
      - FSGS has low albumin and a normal C3.
    src: { page: 222, quote: "Differential diagnosis of nephrotic syndrome" }
    status: unverified
  - id: neph.L08.046
    kind: enumerate
    topic: mcd
    prompt: A patient with nephrotic syndrome develops AKI. What is the differential diagnosis?
    points:
