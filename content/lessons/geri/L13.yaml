  - id: geri.L13.lesson2
    title: "الأهداف، والكبار بيعيوا بطريقة تانية"
    hook: "جدّك عنده pneumonia ومفيش كحة ولا سخونية. بس اتلخبط ووقع. ده بالظبط اللي الكتاب عايزك تاخد بالك منه."
    minutes: 8
    pages: [222, 223]
    topics: [goals, elderly]
    goals:
      - "تعدّ أهداف العلاج الـ palliative"
      - "تعرف إزاي الكبار بيعيوا بشكل مختلف"
      - "تفرّق تركيز الـ palliative care في الكبير عن الصغير"
    status: unverified
    steps:
      - kind: explain
        page: 222
        quote: "Relief from suffering\nTreatment of pain and other distressing symptoms as: Fatigue, shortness of breath, constipation, nausea, loss of appetite, sleep problems, and many other symptoms and side effects of a disease and disease treatment."
        title: "الأهداف"
        text: |
          1. **Relief from suffering**.
          2. علاج الألم والأعراض المزعجة: fatigue، shortness of breath، constipation، nausea، فقدان الشهية، النوم، وأعراض العلاج الجانبية.
          3. ==Psychological== و ==spiritual== care.
          4. support system يخليه **يعيش نشيط** على قد ما يقدر، ويحس إنه **متحكم**.
          5. يخفف **عبء العيلة** ويقوّي العلاقات.
          6. فهم **واقعي** للمرض.

          ليه «sense of control» هدف لوحده؟ التفسير المقبول (مش في الكتاب): المرض المتقدم بياخد من المريض حاجات كتير: شغله، حركته، استقلاله. لما يشارك في القرار ويفهم مرضه بشكل **واقعي**، بيحس إنه لسه صاحب حياته، وده بيقلل القلق.
          والفهم الواقعي مش معناه نشيل الأمل؛ يعني المريض والعيلة يخططوا على أساس الحقيقة، مش على وعود مش هتحصل.
      - kind: check
        page: 222
        quote: "Relieve burden on family members and strengthen relationships Gain a realistic understanding of the nature of the illness."
        question: "Which is NOT one of the book's goals of palliative treatment?"
        options: ["Cure of the underlying illness", "Relieve burden on family members", "Gain a realistic understanding of the illness", "Achieve a sense of control"]
        answer: 0
        why:
          - "صح: الشفا مش من أهداف الـ palliative treatment، حتى لو بيتقدّم جنب العلاج الشافي."
          - "من الأهداف: يخفف عبء العيلة ويقوّي العلاقات."
          - "من الأهداف: فهم واقعي للمرض."
          - "من الأهداف: support system يخليه يحس إنه متحكم."
      - kind: explain
        page: 222
        quote: "The Old Get Sick Differently\n  Acute change in mental status.\n  Altered pain sensation; inability to localize.\n  Vague symptoms.\n  Functional status decreases.\n  Falls.\n  Dehydrate easier due to decreased muscle mass & intra cellular water."
        title: "The old get sick differently"
        text: |
          (Amella 2003)
          - ==Acute change in mental status==: الـ delirium ممكن يكون أول علامة.
          - إحساس الألم متغير، ومش قادر **يحدد مكانه**.
          - أعراض **vague**.
          - الـ functional status بيقل، و ==falls==.
          - بيعمل **dehydration** أسهل.
          - Anorexia.
          - رد فعل غريب للأدوية.

          ليه الـ confusion ممكن تبقى أول علامة؟ التفسير المقبول (مش في الكتاب): المخ في الكبير احتياطيه قليل، فأي ضغط (عدوى، جفاف، دوا) بيبان عليه بدري، قبل ما الحرارة أو الكحة يظهروا.
          النتيجة: «اتلخبط فجأة» أو «وقع» في كبير لازم تدوّر وراه على مرض، مش تقول «ده سن».
      - kind: reveal
        page: 222
        quote: "The Old Get Sick Differently\n  Acute change in mental status.\n  Altered pain sensation; inability to localize.\n  Vague symptoms.\n  Functional status decreases.\n  Falls.\n  Dehydrate easier due to decreased muscle mass & intra cellular water."
        prompt: "ليه الكبير بيجفّ أسرع من الشاب؟"
        answer: "لأن الـ ==muscle mass== قلّت، ومعاها الـ **intracellular water**. المخزون أصغر، فأي نقص بسيط يبان بسرعة."
      - kind: check
        page: 222
        quote: "The Old Get Sick Differently\n  Acute change in mental status.\n  Altered pain sensation; inability to localize.\n  Vague symptoms.\n  Functional status decreases.\n  Falls.\n  Dehydrate easier due to decreased muscle mass & intra cellular water."
        question: "An 88-year-old with a UTI is most likely to present with:"
        options: ["New confusion and a fall", "High fever and loin pain", "Well-localized suprapubic pain", "Exactly what a 30-year-old would show"]
        answer: 0
        why:
          - "صح: mental status change و falls من أشهر صور العيا في الكبار."
          - "ممكن، بس الكبار كتير مايعملوش الصورة الكلاسيكية."
          - "الألم في الكبار صعب يتحدد مكانه."
          - "الكتاب بيقول بالظبط العكس: get sick differently."
      - kind: reveal
        page: 222
        quote: "Altered pain sensation; inability to localize.\nVague symptoms."
        prompt: "جدة عندها appendicitis، بتقول «تعبانة كده» ومش قادرة تقول فين الوجع. ليه ده متوقع؟"
        answer: "لأن الكبار عندهم ==altered pain sensation== ومش بيقدروا **يحددوا مكان** الألم، والأعراض بتبقى **vague**. يعني غياب الألم الواضح مش دليل إن مفيش مرض جراحي."
      - kind: table
        page: 223
        quote: "Indeed, palliative care for younger adults is typically focused on the identification of symptoms associated with either a specific advanced terminal illness and its immediate manifestations or signs of poor prognosis/imminent death."
        title: "الصغير مقابل الكبير"
        columns: ["", "Younger adults", "Elderly"]
        rows:
          - ["Focus", "Symptoms of one advanced terminal illness", "Functional and cognitive impairment, frailty, dependence"]
          - ["Also watch", "Signs of poor prognosis or imminent death", "Burden of symptom distress"]
          - ["Time course", "Advanced terminal stage", "Chronic illness over many years, long-term caregivers"]
        hide: [[0, 2], [1, 1], [2, 2]]
      - kind: explain
        page: 223
        quote: "The many-year duration of most geriatric chronic illnesses.\nThe high prevalence of long-term functional and cognitive impairment."
        title: "ليه مختلفة؟"
        text: |
          تلات أسباب:
          1. الأمراض المزمنة في الكبار بتطوّل **سنين**.
          2. ==functional و cognitive impairment== طويل المدى منتشر جدًا.
          3. محتاجين **long-term caregivers**.

          عشان كده التركيز مش على علامات الموت القريب، لكن على ==frailty== والاعتمادية وعبء الأعراض.

          ليه ده بيفرق؟ التفسير المقبول (مش في الكتاب): الشاب اللي عنده سرطان متقدم بيمشي على خط واضح نحو الموت في شهور، فالرعاية بتركز على الفترة دي. الكبير الـ frail بيعيش **سنين** بين الصحة والعجز، فلو استنينا «علامات الموت القريب» هيفوتنا أغلب الوقت اللي كان محتاج فيه مساعدة.
      - kind: explain
        page: 223
        quote: "Thus, palliative care for the elderly is most appropriately centered on the identification and amelioration of functional and cognitive impairment, development of frailty and dependence on caregivers, and the associated burden of symptom distress rather than, as is typical in advanced cancer and traditional hospice settings, identification of specific and advanced terminal illness and its immediate manifestations or signs of poor prognosis or imminent death."
        title: "يبقى نركّز على إيه في الكبير؟"
        text: |
          الكتاب بيقفل الفكرة كده: الـ palliative care في الكبير تتمركز حوالين:
          - اكتشاف وتخفيف الـ ==functional and cognitive impairment==.
          - تطور الـ **frailty** والاعتماد على الـ caregivers.
          - **عبء الأعراض** اللي معاهم.

          بدل ما تدوّر، زي السرطان المتقدم والـ hospice التقليدي، على مرض terminal محدد وعلامات الموت القريب.

          يعني عمليًا: سؤالك الأول للكبير مش «فاضل له قد إيه؟» لكن «بيعمل إيه لوحده، ومين بيساعده، وإيه اللي تاعبه؟»
      - kind: aside
        tone: exam
        page: 223
        quote: "Conversely, many of the characteristics of advanced old age (frailty, functional dependence, cognitive impairment, multiple comorbidities, and symptom distress) are multifactorial in etiology and are present for many years. In the frail elderly, disease-specific treatments may ameliorate or lessen the burdens of frailty, dependence, and symptom distress but are unlikely to eliminate them."
        text: "سؤال امتحان: علاج المرض نفسه ممكن **يخفف** الـ frailty والاعتمادية، بس ==unlikely to eliminate== لأنها multifactorial وموجودة من سنين."
      - kind: try
        items: [geri.L13.010, geri.L13.012, geri.L13.014, geri.L13.061, geri.L13.062]
    recap:
      - "الأهداف: relief from suffering، الأعراض، psychological و spiritual care، sense of control، عبء العيلة، فهم واقعي. الشفا مش منهم."
      - "Get sick differently: confusion، ألم مش متحدد، أعراض vague، falls، dehydration، anorexia، رد فعل غريب للأدوية."
      - "Dehydration أسهل: عضل أقل و intracellular water أقل."
      - "الصغير: أعراض مرض terminal واحد. الكبير: function، cognition، frailty، dependence لسنين."
      - "علاج المرض بيخفف الـ frailty بس مش بيلغيها."
    practice: [geri.L13.010, geri.L13.011, geri.L13.012, geri.L13.013, geri.L13.014, geri.L13.015, geri.L13.016, geri.L13.061, geri.L13.062, geri.L13.078]
