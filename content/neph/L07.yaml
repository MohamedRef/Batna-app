  # ---------- p160-161: CKD, dialysis, PLD, aneurysm ----------
  - id: neph.L07.082
    kind: cloze
    topic: adpkd-ckd
    text: "ADPKD patients with eGFR above {{c1::30}} mL/min are advised to drink enough water to keep urine osmolality below {{c2::250}} mOsm/kg (about {{c3::3}} L/day)."
    src: { page: 160, quote: "Hypertension plays an important role in the progression of ADPKD to ESRD. In addition to the HALT PKD clinical trials, long-term follow Preclinical studies, and evidence suggesting increased vasopressin effect on the kidney and cAMP levels are involved in cyst progression, have led to the ingestion of supplemental water sufficient to achieve a urinary osmolality below 250 mOsm/kg H₂O (~3 liters in most patients) being recommended for patients with ADPKD with an eGFR greater than 30 ml/min, although there are no RCTs to support this approach.34 Patients with ADPKD have reduced morbidity and mortality on dialysis compared with patients with ESRD from other causes. Women appear to do better than men. The good outcome in ADPKD may result from higher endogenous erythropoietin production, better maintenance of hemoglobin, or lower comorbidity. Rarely, hemodialysis can be by a medially located renal cyst. Despite renal size, peritoneal dialysis can usually be performed in ADPKD, although there is increased risk for inguinal and umbilical hernias, which require surgical repair." }
    status: unverified
    tags: [numbers, high-yield]
