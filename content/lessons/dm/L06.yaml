          </svg>
      - kind: match
        page: 67
        quote: "Diabetes Mellitus → Diabetic Foot Ulcer (DFU):\n  PVD (with smoking, hypertension, dyslipidemia) → Ischaemia → Trauma → DFU\n  Neuropathy:\n    Somatic, sensory → Loss of Protective Sensation → Trauma → DFU\n    Somatic, motor → Intrinsic muscles Imbalance & Wasting → Foot Deformities → High Pressure Points → DFU\n    Autonomic → Reduced Sweating → Dry Skin → Cracks & Fissures → DFU"
        prompt: "وصّل كل ذراع بالسلسلة بتاعته:"
        pairs:
          - ["PVD", "Ischaemia + trauma"]
          - ["Sensory neuropathy", "Loss of protective sensation + trauma"]
          - ["Motor neuropathy", "Muscle wasting → deformity → high pressure"]
          - ["Autonomic neuropathy", "Less sweating → dry skin → cracks"]
        why: "الـ autonomic بيقلل العرق فالجلد ينشف ويتشقق؛ الـ motor بيضعف الـ intrinsic muscles فالصوابع تتلوي وتعمل نقط ضغط؛ الـ sensory بيشيل الإحساس فالجرح يعدّي؛ والـ peripheral vascular disease (PVD) بيقطع الدم."
      - kind: reveal
        page: 67
        quote: "Diabetes Mellitus → Diabetic Foot Ulcer (DFU):\n  PVD (with smoking, hypertension, dyslipidemia) → Ischaemia → Trauma → DFU\n  Neuropathy:\n    Somatic, sensory → Loss of Protective Sensation → Trauma → DFU\n    Somatic, motor → Intrinsic muscles Imbalance & Wasting → Foot Deformities → High Pressure Points → DFU\n    Autonomic → Reduced Sweating → Dry Skin → Cracks & Fissures → DFU"
        prompt: "ليه الـ autonomic neuropathy بتعمل جلد ناشف؟"
        answer: |
          الغدد العرقية متغذية بأعصاب **sympathetic** (autonomic). لما تموت، العرق يقل، فالجلد يفقد الترطيب الطبيعي ويبقى **dry skin**، ويتشقق **cracks and fissures** تبقى باب للميكروب وبداية للقرحة.

          علشان كده نصيحة الـ **moisturizing cream** في الـ foot care مش رفاهية.
      - kind: reveal
        page: 67
        quote: "Somatic, motor → Intrinsic muscles Imbalance & Wasting → Foot Deformities → High Pressure Points → DFU"
        prompt: "ضعف عضلات صغيرة جوّه الرجل، إزاي يوصل لقرحة؟"
        answer: |
          الكتاب بيرسم السلسلة: **intrinsic muscles imbalance & wasting** ← **foot deformities** ← **high pressure points** ← DFU.

          التفسير المقبول (مش في الكتاب) للحلقة اللي في النص: الـ **intrinsic muscles** هي اللي بتمسك الصوابع مفرودة. لما تضعف، العضلات الطويلة اللي جاية من الساق بتشد لوحدها، فالصوابع تتلوي (**claw toes**) ورؤوس الـ **metatarsals** تنزل لتحت. الوزن كله يتركّز على نقط صغيرة بدل ما يتوزع على باطن الرجل، والنقطة دي بتتهري مع كل خطوة.
      - kind: explain
        page: 67
        title: "الذراع الرابع: الشريان"
        quote: "PVD (with smoking, hypertension, dyslipidemia) → Ischaemia → Trauma → DFU"
        text: |
          في الرسم الـ **peripheral vascular disease (PVD)** عليها تلات عوامل: ==smoking== و **hypertension** و **dyslipidemia**، وبتوصل لـ **ischaemia** وبعدين **trauma** ثم القرحة.

          ليه التلاتة دول بالذات؟ لأنهم هما نفسهم عوامل الـ **atherosclerosis**؛ السكر بيضيّق الشرايين، والتلاتة بيسرّعوا التضييق. فدول اللي تقدر تغيّرهم بإيدك.

          ولاحظ إن كلمة **trauma** موجودة في ذراع الشريان وفي ذراع الـ sensory. يعني القرحة غالبًا مش بتطلع لوحدها: محتاجة **زقة** صغيرة (جزمة ضيقة، مسمار، مية سخنة) على رجل أصلًا مش حاسة أو مش واصلها دم كفاية عشان تلم الجرح.
      - kind: check
        page: 67
        quote: "Autonomic → Reduced Sweating → Dry Skin → Cracks & Fissures → DFU"
        question: "Dry skin with deep heel fissures in a diabetic foot: which arm of the pathway made them?"
        options:
          - "Autonomic neuropathy"
          - "Motor neuropathy"
          - "Sensory neuropathy"
          - "Peripheral vascular disease"
        answer: 0
        why:
          - "صح: autonomic ← reduced sweating ← dry skin ← cracks and fissures."
          - "الـ motor بيعمل muscle wasting و deformity و high pressure points."
          - "الـ sensory بيشيل الـ protective sensation، فالـ trauma تعدّي."
          - "الـ PVD بيعمل ischaemia، مش جلد ناشف متشقق."
      - kind: try
        items: [dm.L06.001, dm.L06.003, dm.L06.006, dm.L06.008, dm.L06.054]
    recap:
      - "40–60% من مرضى السكر هيعملوا PN؛ الألم بيبدأ من الرجل (أطول عصب) ويطلع، وبعدين loss of sensation."
      - "الوجع اللي سكت ممكن يكون عصب مات: الرجل بقت insensate."
      - "4 أذرع للـ DFU: PVD (ischaemia + trauma)، sensory (LOPS + trauma)، motor (deformity ← high pressure)، autonomic (dry skin ← cracks)."
      - "Smoking و HTN و dyslipidemia بيسرّعوا الـ PVD، وهما اللي تقدر تغيّرهم."
