  - id: neph.L07.lesson4
    title: "أكياس تانية: ARPKD و NPHP و ADTKD و sponge"
    hook: "طفل بكبد متليّف، مراهق بيبول كتير، شاب بالـ gout، وشاب بحصوات. كلهم أكياس، وكل واحد له قصة."
    minutes: 10
    pages: [165, 168]
    topics: [cystic-other]
    goals:
      - "تفرّق ARPKD و NPHP و ADTKD و medullary sponge بالسن والوراثة والصورة"
      - "تعرف ليه كل واحد بيعمل الأعراض بتاعته"
      - "تستعمل Table 7.6 و 7.7 في التشخيص"
    status: unverified
    steps:
      - kind: explain
        page: 165
        title: "ARPKD: مرض الأطفال"
        quote: "Caused by a rare mutation of the PKHD1 gene (located on chromosome 6) encoding polyductin. It is a disease of infancy and childhood, presenting with polycystic kidneys, progressive CKD, congenital hepatic fibrosis, and portal hypertension. It is much less common than ADPKD (estimated prevalence 1:20,000 live births)."
        text: |
          الـ ==autosomal recessive polycystic kidney disease (ARPKD)==: جين **polycystic kidney and hepatic disease 1 gene (PKHD1)** على **chromosome 6** بيعمل **polyductin** (اسمه كمان fibrocystin).

          بيظهر في **الرضّع والأطفال**: polycystic kidneys، chronic kidney disease (CKD) بيتقدم، و ==congenital hepatic fibrosis== مع **portal hypertension**. أندر بكتير من الـ ADPKD (حوالي **1:20,000**).

          ليه الكلية والكبد مع بعض؟ التفسير المقبول (مش في الكتاب): الـ fibrocystin موجود في الـ cilia بتاعة الـ collecting ducts وكمان الـ bile ducts. فلما يبوظ، الـ bile ducts ما تتشكلش صح وحواليها fibrosis، والـ fibrosis دي بتضغط على الـ portal veins فيحصل portal hypertension. وليه بيظهر في الرضّع؟ لأنه recessive: النسختين بايظين من الأول، فمفيش "انتظار" للـ second hit زي الـ ADPKD.
      - kind: reveal
        page: 165
        quote: "It is a disease of infancy and childhood, present-ing with polycystic kidneys, progressive CKD, congenital hepatic fibrosis, and portal hypertension."
        prompt: "ليه الـ ARPKD بييجي مع congenital hepatic fibrosis و portal hypertension؟"
        answer: |
          الكتاب بيقول الصورة: **polycystic kidneys + CKD + congenital hepatic fibrosis + portal hypertension**.

          التفسير المقبول (مش في الكتاب): الـ **polyductin (fibrocystin)** موجود في الـ cilia بتاعة خلايا **الـ bile ducts** كمان، مش في الكلية بس. فالقنوات الصفراوية بتتشكل غلط وحواليها **fibrosis**، والتليّف ده بيعلّي الضغط في الـ portal vein. يعني نفس العيب في عضوين.
      - kind: explain
        page: 165
        title: "Nephronophthisis: الـ nephrons بتختفي"
        quote: "A recessively inherited condition (~1 in 50,000), characterized by cystic change and tubulointerstitial fibrosis, presenting in early childhood (age >1 year) and leading to ESRD in adolescence. Mutations in at least five NPHP loci have been described, most commonly NPHP1 (associated with earlier onset). Imaging characteristically reveals echo-bright kidneys with a few corticomedullary cysts. Clinical features: polydipsia and polyuria but often presents as ESRD. Unlike medullary cystic kidney disease, extrarenal manifestations, including oculomotor apraxia, hypoplasia of cerebellar vermis (Joubert's syndrome), developmental delay, bone abnormalities (cone-shaped epiphyses), situs invertus, and hepatic and portal fibrosis) also occur. May also be associated with retinitis pigmentosa in the Senior-Løken syndrome."
        text: |
          الاسم يوناني معناه **"ضياع الـ nephrons تدريجيًا"**. ==autosomal recessive== tubulointerstitial nephropathy، ومن أشهر أسباب الـ end-stage renal disease (ESRD) الوراثية في **الأطفال والمراهقين**.

          - **nephronophthisis 1 gene (NPHP1)** = 21% من الحالات (وبدري أكتر)؛ كل جين تاني أقل من 4%.
          - يبدأ بعد سنة من العمر، و ESRD في المراهقة.
          - Imaging: **echo-bright kidneys** مع **أكياس قليلة corticomedullary**.
          - Polyuria و polydipsia، بس غالبًا يظهر وهو ESRD.

          ليه polyuria بس من غير ضغط ولا dipstick؟ التفسير المقبول (مش في الكتاب): المرض في الـ tubules والـ interstitium مش في الـ glomeruli، فمفيش protein ولا دم في البول. والـ tubules البايظة ما تعرفش تركّز البول ولا تمسك الملح، فالطفل يبول كتير ويشرب كتير، ومفيش ملح زيادة يرفع الضغط. علشان كده المرض بيعدّي من غير ما حد ياخد باله لحد ما يوصل ESRD.

          إزاي تفرّقه عن الـ ARPKD في طفل؟ التفسير المقبول (مش في الكتاب): الـ ARPKD الكلى **كبيرة** ومليانة أكياس من الولادة، أما الـ nephronophthisis الكلى **طبيعية أو صغيرة** والأكياس قليلة في الـ corticomedullary junction. والاتنين recessive، يعني الأهل غالبًا سليمين. فلو طفل عطشان وبيبول كتير ووظايف الكلى بتسوء من غير ضغط ولا protein، فكّر في الـ nephronophthisis.
      - kind: explain
        page: 165
        title: "ليه الـ NPHP بيبدأ بـ polyuria؟"
        quote: "Clinical features: polydipsia and polyuria but often presents as ESRD."
        text: |
          الكتاب بيوصف الـ NPHP كـ ==tubulointerstitial nephropathy==: cystic change و **tubulointerstitial fibrosis**، والأكياس **corticomedullary**.

          التفسير المقبول (مش في الكتاب) للأعراض:
          - المرض في الـ **tubules والـ interstitium**، يعني في الحتة اللي بتركّز البول. فأول حاجة تبوظ هي القدرة على التركيز: ==polyuria و polydipsia==.
          - الطفل اللي بيشرب كتير وبيبول كتير ممكن يتشاف كده عادي، فالمرض بيتكشف **متأخر**، وعلشان كده الكتاب بيقول "often presents as ESRD".
          - والكلى بتبان **echo-bright** لأن الـ fibrosis بيرجّع صدى أكتر من النسيج الطبيعي.
      - kind: mnemonic
        page: 165
        quote: "A recessively inherited condition (~1 in 50,000), characterized by cystic change and tubulointerstitial fibrosis, presenting in early childhood (age >1 year) and leading to ESRD in adolescence. Mutations in at least five NPHP loci have been described, most commonly NPHP1 (associated with earlier onset). Imaging characteristically reveals echo-bright kidneys with a few corticomedullary cysts. Clinical features: polydipsia and polyuria but often presents as ESRD. Unlike medullary cystic kidney disease, extrarenal manifestations, including oculomotor apraxia, hypoplasia of cerebellar vermis (Joubert's syndrome), developmental delay, bone abnormalities (cone-shaped epiphyses), situs invertus, and hepatic and portal fibrosis) also occur. May also be associated with retinitis pigmentosa in the Senior-Løken syndrome."
        word: "JOBS-H"
        parts:
          - { key: "J", text: "Joubert: cerebellar vermis hypoplasia, oculomotor apraxia, developmental delay" }
          - { key: "O", text: "Organ reversal: situs inversus" }
          - { key: "B", text: "Bones: cone-shaped epiphyses" }
          - { key: "S", text: "Senior-Løken: retinitis pigmentosa" }
          - { key: "H", text: "Hepatic and portal fibrosis" }
        hook: "الـ NPHP عنده **JOBS-H** برّه الكلية، عكس الـ medullary cystic disease اللي مالوش extrarenal."
      - kind: check
        page: 165
        quote: "May also be associated with retinitis pigmentosa in the Senior-Løken syndrome."
        question: "A 13-year-old boy has polyuria, polydipsia, rising creatinine and retinitis pigmentosa. Most likely?"
        options:
          - "Nephronophthisis (Senior-Løken syndrome)"
          - "ADPKD"
          - "Medullary sponge kidney"
          - "Alport syndrome"
        answer: 0
        why:
          - "صح: طفل، concentrating defect، CKD، ومعاه retinitis pigmentosa = Senior-Løken."
          - "الـ ADPKD نادر يعمل ESRD في السن ده، ومالوش retinitis pigmentosa."
          - "الـ sponge benign ومالوش CKD."
          - "الـ Alport عينه lenticonus و flecks، مش retinitis pigmentosa، ومعاه طرش."
      - kind: explain
        page: 166
        title: "ADTKD (medullary cystic kidney disease)"
        quote: "Autosomal dominant tubulointerstitial kidney diseases (ADTKD) The term autosomal dominant tubulointerstitial kidney diseases (ADTKD) has been proposed for the set of disorders previously described as med-ullary cystic kidney disease, UMOD-related kidney disease, familial Disease-causing mutations in four genes: MUC1, UMOD, REN, and HNF1B, are responsible for most cases.19 Hyperuricemia is a key feature of UMOD-related disease."
        text: |
          **Autosomal dominant**، يبان في **أول الشباب** مع family history.

          - الجينات: **mucin 1 gene (MUC1)، uromodulin gene (UMOD)، REN، hepatocyte nuclear factor 1-beta gene (HNF1B)**؛ الـ ==UMOD = hyperuricemia== و gout.
          - أكياس صغيرة **1–10 mm** في الـ corticomedullary junction، مع scarring، والـ **glomeruli سليمة**.
          - Nocturia و polyuria، **dipstick نضيف**، والضغط غالبًا **طبيعي** (salt loss).
          - الكلى **صغيرة لطبيعية** على السونار.
          - ESRD حوالي **60 سنة** (MUC1 بعد 60، UMOD في العقد 4–7). مفيش علاج خاص؛ صلّح الملح والميه.

          ليه الـ UMOD بيعمل gout؟ التفسير المقبول (مش في الكتاب): الـ uromodulin بيتعمل في الـ thick ascending limb، والـ mutation بتخلّيه يتكوّم جوّه الخلية فيبوّظها، فالـ loop ما يمسكش الملح. الجسم يحس بنقص حجم فيرجّع ملح وميه من الـ proximal tubule، ومعاهم الـ uric acid. والنتيجة hyperuricemia و gout بدري. وده نفس السبب إن الضغط طبيعي: الكلية بتخسر ملح مش بتحبسه.
      - kind: explain
        page: 166
        title: "ليه الـ ADTKD بيعمل gout وضغط طبيعي؟"
        quote: "Impaired urate excretion and hyperuricaemia (± gout) may occur."
        text: |
          الكتاب بيقول: ==impaired urate excretion== و hyperuricaemia (± gout)، و **hyperuricemia key feature** في الـ UMOD، والضغط غالبًا طبيعي مع **relative salt loss**.

          التفسير المقبول (مش في الكتاب):
          - الـ **uromodulin** بيتعمل في الـ **thick ascending limb**، نفس الحتة اللي بترجّع الملح. لو البروتين ده غلط، الحتة دي تتعب.
          - الملح بيضيع شوية، فالجسم ينشف شوية، والـ **proximal tubule** يعوّض ويرجّع كل حاجة **ومعاها الـ urate**، فالـ uric acid يعلى.
          - ونفس الـ salt loss ده **السبب** إن الضغط مش عالي زي باقي أمراض الكلى، وإن العلاج "correction of salt and water depletion".
          - والـ **dipstick نضيف** لأن الـ glomeruli سليمة.
      - kind: explain
        page: 167
        title: "Medullary sponge kidney: مش وراثي"
        quote: "A common, benign condition characterized by diffuse medullary cyst for- mation. It is a develop mental, rather than a genetic, anomaly. Clinically, there is no family history, and patients are usually identified either inci-dentally or when investigated for UTI or stones (see Table 7.7). Impaired calcium handling in the collecting ducts predisposes to formation of calcium-containing stones (often in cysts). Consider the diagnosis in young calcium-containing stones (often in cysts). Consider the diagnosis in young patients presenting with calcium stones. Haematuria (microscopic or gross) and recurrent UTIs may also complicate the disorder. Diagnosis is made on imaging; traditionally IVU (typical 'calyceal brush'), now CT. Renal impairment is very rare, and management should be directed at infection and prevention of stone formation."
        text: |
          شائع و **benign**، و ==developmental مش genetic== (مفيش family history).

          الـ collecting ducts مش بتتعامل مع الـ calcium كويس، فتعمل **calcium stones** جوّه الأكياس. فكّر فيه في **شاب عنده calcium stones**. وكمان hematuria و urinary tract infection (UTI) متكرر.

          التشخيص: **intravenous urogram (IVU)** (الشكل الكلاسيكي ==calyceal brush== أو "paintbrush")، ودلوقتي **computed tomography (CT)**. الـ renal impairment **نادر جدًا**.

          ليه stones؟ التفسير المقبول (مش في الكتاب): الـ collecting ducts الواسعة زي الإسفنجة بتخلّي البول يقف ويركد، والبول الراكد بيترسّب فيه الـ calcium، وكمان العدوى بتلاقي مكان. وليه الـ "paintbrush" على الـ IVU؟ لأن الصبغة بتدخل الأكياس الصغيرة الممدودة في الـ papillae فتبان زي شعر الفرشة. وليه الوظيفة غالبًا سليمة؟ لأن الـ cortex والـ glomeruli مش متأثرين.

          إزاي تطمّن المريض؟ التفسير المقبول (مش في الكتاب): الشاب اللي عنده حصوات متكررة وسمع كلمة "أكياس في الكلية" غالبًا هيفتكر إنه رايح للـ dialysis. هنا الفرق المهم: الـ medullary sponge kidney مش وراثي ومش بيبوّظ الوظيفة، فالخطة هي نفس خطة الحصوات: ميه كتير، علاج الـ UTI بسرعة، ودوّر على سبب للـ hypercalciuria. يعني مشكلته الحصوات، مش الكلية نفسها.
      - kind: figure
        page: 167
        quote: "Paintbrush Appearance"
        title: "الـ paintbrush على الـ IVU"
        image: { file: neph/L07-paintbrush-ivu.webp, book: true }
        alt: "Book intravenous urogram of medullary sponge kidney: contrast fills dilated collecting ducts in the papillae as fine streaks fanning out from the calyx, the 'paintbrush' appearance."
        caption: |
          صورة intravenous urogram (IVU) قريبة على كلية: الصبغة البيضا في الـ calyx، وطالع منها ==خطوط بيضا رفيعة== على شكل مروحة في الـ papillae، زي شعر الفرشة.

          دي الـ collecting ducts الواسعة اللي الصبغة دخلتها، وده الشكل الكلاسيكي للـ ==medullary sponge kidney== (**calyceal brush**).
      - kind: figure
        page: 167
        quote: "Medullary calcification"
        title: "الـ medullary calcification على الـ CT"
        image: { file: neph/L07-medullary-calcification-ct.webp, book: true }
        alt: "Book axial contrast CT of the abdomen at the level of the kidneys: small bright calcific foci lie in the medullary pyramids of both kidneys, more on the left of the image."
        caption: |
          مقطع computed tomography (CT) عرضي في البطن: الكليتين على جنبي العمود الفقري تحت النص.

          جوّه الـ **medulla** (الهرم الغامق جوّه كل كلية) فيه ==نقط بيضا صغيرة== = **calcification** في الأكياس، أوضح في الكلية اللي على يمين الصورة.

          يعني الـ CT بقى بديل الـ intravenous urogram (IVU)، وبيورّي الـ ==calcium stones جوّه الأكياس== اللي بتميّز المرض.
