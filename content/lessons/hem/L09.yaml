      - kind: explain
        page: 147
        title: "العيان شكله إيه؟"
        quote: "Splenomegaly is found in almost all patients at presentation and splenic pain/discomfort is a common presenting symptom."
        text: |
          - Incidence **0.5–1.5/100,000**، أغلبهم في **العقد السادس**، والجنسين زي بعض.
          - لحد **تلت** المرضى **asymptomatic** (CBC عرضي: anemia أو thrombocytopenia).
          - ==Splenomegaly in almost all==، و splenic pain شائع. حوالي **10% massive** لحد الـ **right iliac fossa**، وممكن **portal hypertension** (varices و ascites) من الـ blood flow الزيادة.
          - **Splenic infarcts** (painful و painless) شائعة.
          - **Hypermetabolic state**: fever، anorexia، weight loss، night sweats = **poor prognosis**.
      - kind: figure
