      - [Low molecular weight, "Fragment from unregulated intracellular processing: GHRH fragment"]
      - [Altered glycosylation, "Glycosylated ACTH; failed normal glycosylation of hCG alpha subunit"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 34, quote: "High molecular weight ectopic hormone due to incomplete enzymatic cleavage of the precursor" }
    status: unverified
