        page: 205
        quote: "yet PaO2 is 60 mmHg or less this is still CRITICALas it lies on the critical point of starting steep part of the curve."
        prompt: "المريض الـ saturation بتاعه 90%، يعني جوه الـ target. ليه الكتاب بيقول ده لسه ممكن يبقى critical؟"
