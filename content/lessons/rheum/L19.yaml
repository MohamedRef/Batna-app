        question: "Cardiopulmonary manifestations of SLE include all EXCEPT:"
        options: ["Bronchiectasis", "Pleuropericardial effusion", "Libman-Sacks endocarditis", "Acute lupus pneumonitis"]
        answer: 0
        why:
