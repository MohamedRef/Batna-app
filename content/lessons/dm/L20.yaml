          </svg>
      - kind: explain
        page: 253
        title: "كل محطة بتعمل إيه؟"
        quote: "HDL Metabolism"
        text: |
          امشي مع رسمة الـ HDL metabolism محطة محطة:
          - **ABCA1**: باب على غشاء الخلية بيطلّع الـ free cholesterol للـ **lipid-poor ApoA-I**، فيبقى **nascent HDL** (قرص صغير).
          - **LCAT**: بيحوّل الـ free cholesterol لـ ==cholesteryl ester== (CE).
          - **SR-B1**: على الكبد، بياخد الـ CE من الـ **mature HDL**.
          - **CETP**: طريق جانبي؛ يبدّل CE من الـ HDL بـ TG من الـ VLDL و LDL، والـ CE ده يرجع الكبد على الـ **LDL receptor**.

          ليه الـ LCAT مهم كده؟ التفسير المقبول (مش في الكتاب): الـ free cholesterol بيقعد على **سطح** الـ HDL ويقدر يرجع للخلية تاني. لما يتحوّل لـ ester بيكره المية أكتر، فيدخل **قلب** الـ particle ويتحبس هناك، والسطح يفضى ويشيل كوليسترول جديد. النتيجة: القرص يتنفخ ويبقى كورة، وده الـ ==mature HDL==.
      - kind: reveal
        page: 253
        quote: "HDL Metabolism"
        prompt: "لو الـ CETP بقى نشيط زيادة، الـ HDL-C هيعلى ولا يوطى؟ وليه؟"
        answer: "**يوطى**. الـ CETP بيسحب الـ cholesteryl ester من الـ HDL ويديه للـ VLDL و LDL. نشاط زيادة = HDL مصفّى. وده بالظبط فكرة الـ CETP inhibitors: اقفله، الـ HDL يعلى."
      - kind: explain
        page: 253
        title: "الـ plaque بتتبني إزاي؟"
        quote: "Anti-atherogenic Effects of HDL"
        text: |
          رسمة ص 253 بتحكي الـ ==atherogenesis== في خطوات:
          1. الـ LDL يدخل الـ **intima** ويتأكسد (**oxidized LDL**).
          2. الـ endothelium يطلّع **adhesion molecules**، فالـ monocyte يلزق ويدخل ويبقى **macrophage**.
          3. الـ macrophage ياكل الـ oxidized LDL ويبقى ==foam cell==.
          4. الـ foam cell يطلّع **cytokines** و **growth factors** ← **cell proliferation**، و **metalloproteinases** ← **matrix degradation**.

          ليه الـ macrophage مش بيبطّل أكل؟ التفسير المقبول (مش في الكتاب): بياخد الـ oxidized LDL على **scavenger receptors**، مش على الـ LDL receptor، والـ scavenger receptors مالهاش فرامل لما الخلية تتملي. فيفضل ياكل لحد ما يبقى كيس دهون. والـ matrix degradation بتضعّف غطا الـ plaque، فيبقى سهل يتقطع وتتعمل عليه جلطة.

          والـ **anti-atherogenic effects** بتاعة الـ HDL في الخطوة الجاية بتقفل الخطوات دي واحدة واحدة.
      - kind: figure
        page: 253
        quote: "Anti-atherogenic Effects of HDL"
        title: "الـ HDL بيضرب فين في الـ plaque؟"
        alt: "Three stacked steps of atherogenesis each with an HDL block: monocyte adhesion to endothelium, blocked by HDL inhibiting adhesion molecule expression; LDL oxidation in the intima, blocked by HDL inhibiting LDL oxidation; macrophage turning into a foam cell, opposed by HDL promoting cholesterol efflux."
        caption: "3 نقط تفتيش في الكتاب: **يمنع اللزق** (adhesion)، **يمنع الأكسدة**، و **يسحب الكوليسترول** من الـ macrophage قبل ما يبقى foam cell."
