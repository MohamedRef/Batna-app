  - id: dm.L13.lesson4
    title: "الإنسولين في الحمل"
    hook: "الإنسولين ما بيعديش المشيمة، بس احتياجه بيتغير كل شهر. تعرف ترسم المنحنى؟"
    minutes: 9
    pages: [170, 174]
    topics: [treatment]
    goals:
      - "تعرف إن 70-85% من الـ GDM بيتظبط بالـ lifestyle"
      - "تشرح ليه الإنسولين هو المفضل"
      - "ترسم منحنى احتياج الإنسولين في الـ T1DM"
    status: unverified
    steps:
      - kind: explain
        page: 170
        quote: "Management of Diabetes in Pregnancy\n  12. Lifestyle Management Depending on the population, studies suggest that 70–85% of women diagnosed with GDM can control GDM with lifestyle modification alone."
        title: "الأول: الـ lifestyle"
        text: |
          الـ education ليها 11 بند: من general info و psychological adjustment لحد الـ breastfeeding والـ postpartum والـ hypo/hyper.

          والخبر الحلو: ==70-85%== من الـ gestational diabetes mellitus (GDM) بيتظبط بالـ **lifestyle** لوحده: **Medical nutrition therapy (MNT)**، **physical activity**، و **weight management** حسب الوزن قبل الحمل.

          اللي سكرها عالي من الأول ممكن تحتاج دوا بدري. والعلاج بيحسّن الـ **perinatal outcomes** (دراستين randomized).
      - kind: mnemonic
        page: 172
        quote: "2. Insulin does not cross the placenta & its use offers two other advantages over oral agents during pregnancy:\n  3. Insulin treatment can be tailored to the timing of meals to minimize the risk of hypoglycemia.\n  4. Can generally achieve an acceptable euglycemic profile within 2 weeks, even in an initially poorly controlled DM patient."
        word: "PMT"
        hook: "ليه الإنسولين هو الـ preferred agent؟"
        parts:
          - { key: "P", text: "Placenta: ما بيعديهاش" }
          - { key: "M", text: "Meals: بيتظبط على مواعيد الأكل فيقلل الـ hypoglycemia" }
          - { key: "T", text: "Two weeks: بيوصل لـ euglycemia في حوالي أسبوعين حتى لو الضبط كان وحش" }
      - kind: table
        page: 173
        quote: "Available Insulin & Associated Pregnancy Category (short & rapid acting)\n| Pregnancy Category | Duration | Peak Time | Time to Onset | Insulin |\n|---|---|---|---|---|\n| B | 8 hours | 3 hours | 30 min | Regular U-100 |\n| B | Up to 24 hours | 3 hours | 30 min | Regular U-500 |\n| B | 3–5 hours | 40–50 min | 10–15 min | Aspart |\n| B | 3–5 hours | 30–90 min | 10–15 min | Lispro U-100 & U-200 |\n| C | 3–5 hours | 55 min | 10–15 min | Glulisine |"
        title: "Short و rapid acting"
        columns: ["Insulin", "Onset", "Category"]
        rows:
          - ["Regular U-100", "30 min", "B"]
          - ["Aspart", "10-15 min", "B"]
          - ["Lispro", "10-15 min", "B"]
          - ["Glulisine", "10-15 min", "C"]
        hide: [[0, 2], [3, 2]]
      - kind: table
        page: 173
        quote: "Available Insulin & Associated Pregnancy Category (intermediate & long acting)\n| Pregnancy Category | Duration | Peak Time | Time to Onset | Insulin |\n|---|---|---|---|---|\n| B | 10–20 hours | 4–8 hours | 1–2 hours | NPH |\n| B | 24 hours | None | 1–2 hours | Detemir |\n| No human pregnancy data (previously C) | 24 hours | None | 1–2 hours | Glargine U-100 |\n| No human pregnancy data | 24 hours | None | >6 hours | Glargine U-300 |\n| Maybe used by EMA& Health Canada | 42 hours (at steady state) | None | 1 hour | Degludec U-100 |\n| C | 2 hours | 57 min | 12–15 min | Inhaled human insulin |"
        title: "Intermediate و long acting"
        columns: ["Insulin", "Peak", "Category"]
        rows:
          - ["NPH", "4-8 h", "B"]
          - ["Detemir", "None", "B"]
          - ["Glargine U-100", "None", "No human data"]
          - ["Degludec", "None", "EMA, Health Canada"]
        hide: [[0, 2], [1, 2], [2, 2]]
      - kind: aside
        tone: exam
        page: 173
        quote: "Available Insulin & Associated Pregnancy Category (intermediate & long acting)\n| Pregnancy Category | Duration | Peak Time | Time to Onset | Insulin |\n|---|---|---|---|---|\n| B | 10–20 hours | 4–8 hours | 1–2 hours | NPH |\n| B | 24 hours | None | 1–2 hours | Detemir |\n| No human pregnancy data (previously C) | 24 hours | None | 1–2 hours | Glargine U-100 |\n| No human pregnancy data | 24 hours | None | >6 hours | Glargine U-300 |\n| Maybe used by EMA& Health Canada | 42 hours (at steady state) | None | 1 hour | Degludec U-100 |\n| C | 2 hours | 57 min | 12–15 min | Inhaled human insulin |"
        text: |
          في الامتحان: الـ category **B** = ==regular، aspart، lispro، neutral protamine Hagedorn (NPH)، detemir==. الـ **glulisine** والـ inhaled = C. الـ glargine = no human pregnancy data.
      - kind: update
        ref: "FDA Pregnancy and Lactation Labeling Rule 2015"
        text: "الـ US Food and Drug Administration (FDA) لغت حروف الـ A/B/C/D/X سنة 2015 وحطت مكانها وصف مكتوب. الكتاب لسه بيستخدم الحروف، وده اللي هيتسأل فيه."
      - kind: figure
        page: 174
        quote: "Increasing until the 37th week. Rapidly increasing IR requires weekly or biweekly ↑ in insulin dose."
        title: "منحنى الإنسولين في الـ T1DM"
        alt: "A line chart of insulin requirement across pregnancy weeks: a dip in the first trimester labelled more hypoglycaemia, a steady rise to a peak around week 37 labelled weekly or biweekly increases, then a fall in the final month. A note says the total may double and over half becomes prandial."
        caption: "ينزل في الأول، يطلع لحد 37، وينزل في الشهر الأخير. والمجموع ممكن يتضاعف."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 170h290M30 170V20" class="fg-ink"/>
            <text x="30" y="188" class="t-sm t-mut">0</text>
            <text x="110" y="188" class="t-sm t-mut">13</text>
            <text x="190" y="188" class="t-sm t-mut">28</text>
            <text x="262" y="188" class="t-sm t-mut">37</text>
            <text x="305" y="188" class="t-sm t-mut">40</text>
            <text x="175" y="206" text-anchor="middle" class="t-sm">Weeks of pregnancy</text>
            <path d="M30 120 C60 120 80 140 110 138 C160 130 220 60 268 40 C285 35 300 60 315 75" class="fg-arrow-acc" fill="none" stroke-width="3"/>
            <text x="60" y="160" class="t-sm t-bad">↓ hypos</text>
            <text x="170" y="70" class="t-sm t-acc">↑ weekly</text>
            <text x="268" y="30" text-anchor="middle" class="t-sm t-b">peak</text>
            <text x="300" y="100" class="t-sm" text-anchor="end">↓ last</text>
            <text x="40" y="225" class="t-sm t-mut">Total may double · prandial &gt;50%</text>
          </svg>
      - kind: reveal
        page: 174
        quote: "Over the entire pregnancy, insulin requirements may double, & there is a shift toward more prandial insulin relative to basal insulin."
        prompt: "ليه الجزء الأكبر من الجرعة بيروح للـ prandial مش للـ basal؟"
        answer: "عشان مشكلة الحمل الأساسية هي ==بعد الأكل== (هرمونات المشيمة)، والصيام أصلًا واطي. فالـ basal بيبقى **<50%** والـ prandial **>50%**."
      - kind: explain
        page: 174
        quote: "The CDAPP Sweet Success program offers some guidance on adjustments, suggesting changes by 2–4 units (~10%) in short- & intermediate-acting insulins every 2–3 days."
        title: "الـ bolus والـ titration"
        text: |
          - الـ **mealtime bolus** قبل الأكل بـ ==10-15 min== لو السكر قبل الأكل >70 ومفيش أعراض hypo.
          - **California Diabetes and Pregnancy Program (CDAPP) Sweet Success**: غيّر ==2-4 units (~10%)== كل **2-3 أيام**.
          - عمليًا: عدّل كل يومين لحد ما توصل، لو الوقت والفريق يسمحوا.
      - kind: check
        page: 174
        quote: "Decrease in 1st trimester, ↓TDI requirements (may experience increased hypoglycemia)."
        question: "A woman with T1DM at 9 weeks has three mild hypos this week on her usual doses. Likely reason?"
        options:
          - "Insulin needs fall in the 1st trimester"
          - "Insulin resistance peaks in the 1st trimester"
          - "Her insulin is crossing the placenta"
          - "Lactation effect"
        answer: 0
        why:
          - "صح: الـ total daily insulin (TDI) بيقل في الأول ومعاه hypos أكتر."
          - "الـ resistance بتزيد لحد الأسبوع 37، مش في الأول."
          - "الإنسولين ما بيعديش المشيمة."
          - "الـ lactation بعد الولادة."
      - kind: try
        items: [dm.L13.062, dm.L13.067, dm.L13.071, dm.L13.072, dm.L13.074]
    recap:
      - "70-85% من الـ GDM بالـ lifestyle: MNT، رياضة، وزن."
      - "الإنسولين preferred: ما بيعديش المشيمة، على مواعيد الأكل، ضبط في أسبوعين."
      - "Category B: regular، aspart، lispro، NPH، detemir."
      - "T1DM: ↓ 1st trimester، ↑ لحد 37، ↓ آخر شهر، ممكن يتضاعف، prandial >50%."
      - "Bolus قبل الأكل بـ 10-15 دقيقة. عدّل 2-4 units كل 2-3 أيام."
    practice: [dm.L13.061, dm.L13.062, dm.L13.063, dm.L13.064, dm.L13.065, dm.L13.066, dm.L13.067, dm.L13.068, dm.L13.069, dm.L13.070, dm.L13.071, dm.L13.072, dm.L13.073, dm.L13.074, dm.L13.075, dm.L13.076, dm.L13.102]
