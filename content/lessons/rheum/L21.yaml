      - kind: order
        page: 345
        quote: "T cell + Bcell + macrophage + mast cell + fibroblasts stimulation → Inflammatory cytokine secretion (IL-4, IL-6, TGF-β, PGF & CTGF) → Increase collagen I, III, V, VII, proteoglycans & fibrinectin."
        prompt: "رتّب السلسلة من غير ما تبص فوق:"
        steps:
          - "HLA genes + environmental factors"
          - "Immune cells and fibroblasts stimulated"
          - "IL-4, IL-6, TGF-β, PGF, CTGF secreted"
          - "More collagen, proteoglycans, fibronectin"
        why: "الجينات والبيئة تشغّل الـ cells، الـ cells تطلّع cytokines، والـ cytokines تخلّي الـ fibroblast يطلّع collagen أكتر."
      - kind: figure
        page: 345
        quote: "| Criteria domain | Sub-criteria | Weight |\n|---|---|---|\n| Skin thickening (count the higher of the three) | Skin thickening of the fingers of both hands extending proximal to the MCP joints | 9 |\n| | Puffy fingers | 2 |\n| | Whole finger, distal to MCP joint | 4 |\n| Fingertip lesions (count the higher of the two) | Digital tip ulcers | 2 |\n| | Pitting scars | 3 |\n| Telangiectasia | | 2 |\n| Abnormal nailfold capillaries | | 2 |\n| Lung involvement | PAH and/or ILD | 2 |\n| Raynaud's phenomenon | | 3 |\n| SSc-related antibodies | Any of ACA, ATA (anti-Scl 70), RNA polimerase | 3 |"
        title: "عدّاد الـ 2013 ACR/EULAR"
        alt: "Point counter for the 2013 ACR/EULAR systemic sclerosis criteria. Skin thickening of the fingers of both hands proximal to the MCPs scores 9 and is enough alone. Otherwise count the higher skin item: sclerodactyly 4 or puffy fingers 2. Fingertip lesions, the higher of pitting scars 3 or digital tip ulcers 2. Telangiectasia 2, abnormal nailfold capillaries 2, lung involvement 2, Raynaud phenomenon 3, SSc antibodies 3. Total 9 or more classifies SSc."
        caption: "الـ **skin** والـ **fingertips** بتاخد ==الأعلى بس==، مش بتجمع. والكتاب ما كتبش الـ threshold: هو **9 أو أكتر** (شوف الـ update تحت)."
        svg: |
