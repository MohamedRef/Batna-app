  - id: geri.L03.lesson5
    title: "الحاج أحمد و13 دوا"
    hook: "راجل عنده 69 سنة كان ماشي على رجله وعقله تمام، وفي 4 أيام بقى بيقع ومش مركّز. مفيش مرض جديد، في روشتة."
    minutes: 8
    pages: [52, 53]
    topics: [principles, questions]
    goals:
      - "تحفظ ملخص الـ prescribing rules"
      - "تحل سؤال الحاج أحمد خطوة خطوة"
      - "تجاوب سؤال الـ antidepressant"
    status: unverified
    steps:
      - kind: explain
        page: 52
        title: "الملخص في عشر قواعد"
        quote: "Obtain a complete medication history Review medications regularly and before prescribing a new medication"
        text: |
          - **Medication history** كاملة.
          - راجع الأدوية **بانتظام** وقبل أي دوا جديد.
          - اعرف الـ actions والـ adverse events والـ toxicity.
          - ابدأ الـ long-term **low** وظبّط على الـ response.
          - وصّل لـ **therapeutic dose** قبل ما تغيّر أو تزوّد.
          - علّم الحاج أو اللي بيرعاه.
          - ==ما تعالجش side effect بدوا تاني==.
          - حاول **دوا واحد لمرضين**.
          - ابعد عن أدوية **نفس الـ class**.
          - كلّم **الدكاترة التانيين**.
      - kind: aside
        tone: analogy
        page: 52
        quote: "Avoid using one medication to treat the adverse events caused by another"
        text: "استعمال **medication** علشان تعالج الـ **adverse events** بتاعة دوا تاني اسمه **prescribing cascade**: الـ amlodipine عمل edema، فاتكتب furosemide، فعمل incontinence، فاتكتب anticholinergic، فعمل confusion... وكل ده كان حله إنك توقف أول دوا."
