      - kind: aside
        tone: joke
        page: 27
        quote: "Ecological Fallacy falsely assumes that every individual's IQ is high, since the class average IQ is high."
        text: |
          متوسط الـ intelligence quotient (IQ) بتاع الدفعة عالي، يبقى كل واحد في الدفعة عبقري؟ 😅 اسأل أي حد كان قاعد في آخر الـ lecture hall.

          ده بالظبط الـ **ecological fallacy**: متوسط المجموعة مش بيقول حاجة أكيدة عن فرد فيها.
      - kind: check
        page: 25
        quote: "The weakness of ecological approach is that exposure and disease are measured at the population (group) level.\nEcological fallacy (Definition) is a logic error in the interpretation of statistical data. Drawing conclusions about specific individuals based on the analysis of aggregate data on the larger group.\nThere is assumption that all members of a given population share the same exposure and same risk of disease. Hence caution must be exercised in drawing causal inferences/conclusions for the individual based on the results of an ecological study.\nThe term \"ecological fallacy\" is applied to such conclusions, since the true relation between exposure and disease is distorted by the inability to control for the confounding variables."
        question: "Governorates with more fast-food outlets have higher diabetes rates. Concluding that each fast-food eater has a higher personal diabetes risk is an example of:"
        options: ["Recall bias", "Ecological fallacy", "Publication bias", "Survival bias"]
