      - kind: explain
        page: 335
        title: "Severe PsA (ACR/NPF)"
        quote: "ACR/NPF severe psoriatic arthritis\n  Erosive disease.\n  Elevated markers of inflammation (ESR, CRP) attributable to PsA.\n  Long-term damage that interferes with function (i.e. joint deformities).\n  Highly active disease that causes a major impairment in quality of life.\n  Active PsA at many sites including dactylitis, enthesitis.\n  Rapidly progressive disease."
        text: |
          - ==Erosive disease==
          - **Erythrocyte sedimentation rate (ESR)/C-reactive protein (CRP)** عالي بسبب الـ psoriatic arthritis (PsA)
          - **Damage** بيأثر على الوظيفة (deformities)
          - نشاط عالي بيبوّظ الـ **quality of life**
          - نشاط في أماكن كتير، منها dactylitis و enthesitis
          - **Rapidly progressive**

          ليه التعريف واسع كده؟ لأن الشدة في الـ PsA مش بس عدد المفاصل: erosions، أو inflammatory markers، أو deformity، أو أثر على الحياة، كل واحدة لوحدها بتخلي المرض severe.
      - kind: explain
        remind: [rheum.L20.054]
        page: 336
        title: "EULAR poor prognosis"
        quote: "Eular Poor Prognostic Factors\n  Many swollen joints.\n  Structure damage in the presence of inflammation.\n  High ESR or CRP.\n  Clinically relevant extra-articular manifestations."
        text: |
          1. **Many swollen joints**
          2. **Structural damage** مع inflammation
          3. **High ESR أو CRP**
          4. **Extra-articular** manifestations مهمة إكلينيكيًا

          السبب ورا كل واحد في الخطوة الجاية.
      - kind: reveal
        page: 336
        quote: "Structure damage in the presence of inflammation."
        prompt: "ليه كل واحد من الـ EULAR poor prognostic factors يخليك تقلق؟"
        answer: |
          - **Many swollen joints**: حِمل التهاب كبير، يعني مكان أكتر للضرر.
          - ==Structural damage مع inflammation==: الضرر بدأ فعلًا والالتهاب لسه شغال، فهيكمّل.
          - **High ESR أو CRP**: الالتهاب systemic وعالي.
          - **Extra-articular manifestations** مهمة: المرض مش واقف عند المفصل.

          يعني الأربعة بيقولوا نفس الحاجة: المرض نشط وواسع وبيعمل ضرر. علشان كده بيوجّهوك لعلاج أقوى بدري (التفسير المقبول للربط، مش في الكتاب).
