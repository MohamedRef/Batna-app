        quote: "Risk factors\n  1- Association with high socioeconomic status in childhood.\n  2- Familial aggregations frequently reported. (genetic vs environmental effect?)\n  3- Considerable evidence linking EBV to HD in individuals with past history of infectious mononucleosis."
        text: "الـ Hodgkin بيحب ولاد الذوات: high socioeconomic status في الطفولة. النظرية إن العدوى بتتأخر (زي الـ EBV) لما الطفولة تبقى نضيفة أوي."
      - kind: table
