          بيحصل في حوالي **20%** من عيانين السرطان، والأعلى prevalence: **multiple myeloma**.

          تلات mechanisms:
          1. ==parathyroid hormone-related protein (PTHrP)== (الأشهر، **80%**، اسمها **humoral hypercalcemia of malignancy**): solid tumors زي **squamous** (head، neck، lung)، breast، ovarian، renal، وشوية non-Hodgkin lymphoma (NHL).
