items:
  # ---------------- sample-size (slides 1-21) ----------------
  - id: res.L07.001
    kind: card
    topic: sample-size
    front: Why must the sample size of a clinical trial be calculated, rather than guessed?
    back: >-
      Too small a sample gives insignificant results and wastes the effort; too large a sample wastes money,
      because every subject in a trial costs a lot, so even one extra subject is poor financial management.
    src: { page: 1, quote: "Step 5 - Sample Size Calculation:\n  Too small a sample would produce insignificant results and would be a waste of efforts.\n  Every subject in a clinical trial costs tremendous amount of money, so even one additional subject may mean poor financial management." }
    status: unverified
    tags: [high-yield]
  - id: res.L07.002
    kind: card
    topic: sample-size
    front: What is a type I (alpha) error?
    back: >-
      A false-positive conclusion: rejecting a true null hypothesis, that is, detecting a difference that is not really present.
      In plain words: putting a useless medicine onto the market.
    src: { page: 3, quote: "What is α (Type I error)?\n  describes the phenomenon of detecting a difference that is not really present\n  The probability of wrong rejection of the null hypothesis\n  (Put an useless medicine into the market!)" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.003
    kind: card
    topic: sample-size
    front: What is a type II (beta) error?
    back: >-
      A false-negative conclusion: failing to reject a false null hypothesis, so a real difference is missed.
      In plain words: keeping a good medicine away from patients.
    src: { page: 4, quote: "What is β (Type II error)?\n  Type II error refers to the probability of a false-negative conclusion by fail to reject a false null hypothesis\n  (keep a good medicine away from patients!)" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.004
    kind: table
    topic: sample-size
    title: Possible trial outcomes
    columns: [Trial result, "Truth: no real difference", "Truth: real difference"]
    rows:
      - [Treatments differ, Type I error (alpha), Correct (power)]
      - [Treatments do not differ, Correct, Type II error (beta)]
    blanks: [[0, 1], [1, 2], [0, 2]]
    src: { page: 5, quote: "Possible trial outcomes\n| Reality | Trial Results |\n|---|---|\n| Treatments do NOT differ | Treatments do NOT differ (correct); Treatment do differ (α = Type 1 error) |\n| Treatments do differ | Treatments do NOT differ (β = Type 2 error); Treatment do differ (correct) |" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.005
    kind: card
    topic: sample-size
    front: What is power, and how is it calculated?
    back: >-
      Power = 1 - beta: the ability of the study to find true differences of a given size (delta),
      that is, the chance of correctly identifying a better medicine.
    src: { page: 6, quote: "What is Power?\n  Power quantifies the ability of the study to find true differences of various values of δ.\n  Power = 1 - β = P (accept H1 | H1 is true)\n  the chance of correctly identify H1 (correctly identify a better medicine)" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.006
    kind: card
    topic: sample-size
    front: What is the minimal clinically relevant difference (MCRD, delta)? Give the lecture's two examples.
    back: >-
      The smallest difference between the groups that the investigator considers clinically relevant.
      Continuous outcome: 5 kg of body weight. Binary outcome (myocardial infarction yes/no): a 10% difference between treatment and control groups.
    src: { page: 7, quote: "Minimal clinically relevant difference (MCRD) δ:\n  For continuous outcome (body weight) the MCRD may be 5 Kg\n  For a trial with a binary outcome, for example the effect of a drug on the development of a myocardial infarction (yes/no), an investigator could choose a difference of 10% between the treatment group and the control group as MCRD" }
    status: unverified
  - id: res.L07.007
    kind: enumerate
    topic: sample-size
    prompt: Enumerate the five factors that affect the sample size of a randomized controlled trial (RCT).
    points:
      - Alpha (type I error)
      - Beta (type II error)
      - Power (1 - beta)
      - Minimal clinically relevant difference (MCRD, delta)
      - Variance of the outcome (SD for a continuous outcome)
    pass: 4
    hook: "الـ sample size بيتحدد بـ 5: «α، β، power (1 - β)، أقل فرق مهم (MCRD، delta)، والتباين (SD)»."
    src: { page: 8, quote: "Factors affecting sample size of RCT\n| Component | Definition |\n|---|---|\n| Alpha (type I error) | The probability of falsely rejecting H0 and detecting a significant difference when the groups in reality are not different |\n| Beta (type II error) | The probability of falsely accepting H0 and not detecting a statistically significant when a specified difference between the groups in reality exist |\n| Power (1-beta) | The possibility of correctly rejecting H0 and detecting statistically significant difference when it is true |\n| (MCRD) δ | The minimal difference between the groups that the investigator considers clinically relevant |\n| Variance | The variability of the outcome measure as the SD in case of continuous outcome |" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.008
    kind: table
    topic: sample-size
    title: "Increase the factor: what happens to the sample size?"
    columns: [Factor increased, Sample size needed, Why]
    rows:
      - [Alpha (accept more type I error), Smaller, Z for alpha falls]
      - [Power, Larger, Z for beta rises]
      - [minimal clinically relevant difference (MCRD) (delta), Smaller, A big difference is easy to see]
      - [Variance (SD of the outcome), Larger, More variability hides the difference]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 8, quote: "Factors affecting sample size of RCT\n| Component | Definition |\n|---|---|\n| Alpha (type I error) | The probability of falsely rejecting H0 and detecting a significant difference when the groups in reality are not different |\n| Beta (type II error) | The probability of falsely accepting H0 and not detecting a statistically significant when a specified difference between the groups in reality exist |\n| Power (1-beta) | The possibility of correctly rejecting H0 and detecting statistically significant difference when it is true |\n| (MCRD) δ | The minimal difference between the groups that the investigator considers clinically relevant |\n| Variance | The variability of the outcome measure as the SD in case of continuous outcome |" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.009
    kind: card
    topic: sample-size
    front: What goes wrong if the margin delta is set too large, or too small?
    back: >-
      Too large: several inefficacious drugs reach the market, because they can be judged non-inferior or equivalent.
      Too small: some potentially useful drugs are neglected.
    src: { page: 9, quote: "Sometimes, if δ is too large, several inefficacious drugs will appear in the market for they can be judged as non-inferiority/equivalence; On the contrary, if δ is too small, some potential useful drugs will be neglected." }
    status: unverified
  - id: res.L07.010
    kind: card
    topic: sample-size
    front: Write the simple sample-size formula for a difference in proportions, and name each part.
    back: >-
      n per group = 2 x p(1 - p) x (Z-beta + Z-alpha/2)^2 / (p1 - p2)^2. p(1 - p) is the variability, Z-beta the desired power
      (0.84 for 80%), Z-alpha/2 the significance level (1.96 for 0.05), and p1 - p2 the effect size. It assumes equal-sized groups.
    src: { page: 10, quote: "Simple formula for difference in proportions: n = 2 × (p̄)(1 - p̄)(Zβ + Zα/2)² / (p1 - p2)²\n  n: Sample size in each group (assumes equal sized groups)\n  (p̄)(1 - p̄): A measure of variability (similar to standard deviation)\n  Zβ: Represents the desired power (typically .84 for 80% power).\n  Zα/2: Represents the desired level of statistical significance (typically 1.96).\n  (p1 - p2): Effect Size (the difference in proportions)" }
    status: unverified
  - id: res.L07.011
    kind: cloze
    topic: sample-size
    text: >-
      For a difference in means, n per group = 2 x {{c1::sigma squared (SD of the outcome)}} x (Z-beta + Z-alpha/2)^2 / difference squared (the effect size).
      Z-beta is typically {{c2::0.84}} for 80% power and Z-alpha/2 is typically {{c3::1.96}}.
    src: { page: 11, quote: "Simple formula for difference in means: n = 2 × σ²(Zβ + Zα/2)² / difference²\n  n: Sample size in each group (assumes equal sized groups)\n  σ: Standard deviation of the outcome variable\n  Zβ: Represents the desired power (typically .84 for 80% power).\n  Zα/2: Represents the desired level of statistical significance (typically 1.96).\n  difference: Effect Size (the difference in means)" }
    status: unverified
  - id: res.L07.012
    kind: card
    topic: sample-size
    front: What is the most feasible way to improve the estimate of random error in a trial?
    back: Recruit a sufficient number of subjects according to a sample-size calculation (power analysis).
    src: { page: 2, quote: "Random error can be divided into two types of errors with respect of hypothesis testing.\n  Type I error refers to the probability of drawing a false-positive conclusion by rejection of a true null hypothesis,\n  Type II error refers to the probability of a false-negative conclusion accepting a false null hypothesis\nThe most feasible way to improve the estimate of random error is to recruit a sufficient number of subjects according to a sample size calculation or power analysis." }
    status: unverified
  - id: res.L07.013
    kind: mcq
    topic: sample-size
    stem: >-
      A randomized controlled trial (RCT) comparing two drugs shows a difference between them (p < 0.05), but in reality the two groups do not differ.
      This is an example of:
    options:
      - Type 1 error (alpha error)
      - Type 2 error (beta error)
      - 1 - alpha
      - 1 - beta
    answer: 0
    why:
      - The trial found a difference that is not really there, a false positive.
      - A type 2 error misses a real difference; here there was none to miss.
      - 1 - alpha is the chance of correctly finding no difference.
      - 1 - beta is power, the chance of correctly finding a real difference.
    src: { page: 3, quote: "What is α (Type I error)?\n  describes the phenomenon of detecting a difference that is not really present\n  The probability of wrong rejection of the null hypothesis\n  (Put an useless medicine into the market!)" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.014
    kind: mcq
    topic: sample-size
    stem: Which of the following best describes a type I error?
    options:
      - The null is true, but we mistakenly reject it.
      - The null is false and we reject it.
      - The null is false, but we fail to reject it.
      - The null is true and we fail to reject it.
    answer: 0
    why:
      - Rejecting a true null is a false positive, which is a type I error.
      - Rejecting a false null is the correct decision; its probability is the power.
      - Failing to reject a false null is a type II error.
      - Keeping a true null is the correct decision (1 - alpha).
    src: { page: 3, quote: "What is α (Type I error)?\n  describes the phenomenon of detecting a difference that is not really present\n  The probability of wrong rejection of the null hypothesis\n  (Put an useless medicine into the market!)" }
    status: unverified
  - id: res.L07.015
    kind: mcq
    topic: sample-size
    stem: In a statistical test of hypotheses, a type II error is committed if
    options:
      - We reject the null hypothesis when it is in fact valid.
      - We fail to reject the null hypothesis when it is in fact invalid.
      - We reject the null hypothesis when it is in fact invalid.
      - We fail to reject the null hypothesis when it is in fact valid.
    answer: 1
    why:
      - That is a type I error.
      - A false null that survives is a missed difference, a false negative.
      - That is the correct decision (power).
      - That is also a correct decision.
    src: { page: 15, quote: "In a statistical test of hypotheses, a Type II error is committed if:\n  a. We reject the null hypothesis when, in fact, the null hypothesis is valid.\n  b. We fail to reject the null hypothesis when, in fact, the null hypothesis is invalid.\n  c. We reject the null hypothesis when, in fact, the null hypothesis is invalid.\n  d. We fail to reject the null hypothesis when, in fact, the null hypothesis is valid." }
    status: unverified
  - id: res.L07.016
    kind: mcq
    topic: sample-size
    stem: Which alpha level gives the smallest chance of committing a type I error?
    options: ["0.025", "0.10", "0.01", "0.05"]
    answer: 2
    why:
      - 0.025 allows a 2.5% chance, more than 0.01.
      - 0.10 is the largest chance of the four.
      - Alpha is the type I error rate itself, so the smallest alpha, 0.01, is the smallest chance.
      - 0.05 allows a 5% chance.
    src: { page: 8, quote: "Factors affecting sample size of RCT\n| Component | Definition |\n|---|---|\n| Alpha (type I error) | The probability of falsely rejecting H0 and detecting a significant difference when the groups in reality are not different |\n| Beta (type II error) | The probability of falsely accepting H0 and not detecting a statistically significant when a specified difference between the groups in reality exist |\n| Power (1-beta) | The possibility of correctly rejecting H0 and detecting statistically significant difference when it is true |\n| (MCRD) δ | The minimal difference between the groups that the investigator considers clinically relevant |\n| Variance | The variability of the outcome measure as the SD in case of continuous outcome |" }
    status: unverified
  - id: res.L07.017
    kind: mcq
    topic: sample-size
    stem: >-
      In a well-designed trial of ovarian cancer treatment, remission at one year is similar for a new drug and usual care, p = 0.4.
      This means that
    options:
      - Both treatments are effective
      - Neither treatment is effective
      - The statistical power of this study is 60%
      - The best estimate of the treatment effect is 0.4
      - It is not possible to decide which treatment is better from this information
    answer: 4
    why:
      - A non-significant comparison says nothing about whether either works against no treatment.
      - There was no placebo arm, so we cannot say neither works.
      - Power is planned from alpha, beta, delta and variance; it is not 1 - p.
      - The p value is a probability, not the size of the effect.
      - p = 0.4 is not significant, and without the effect size and its confidence interval (CI) we cannot pick a winner.
    src: { page: 17, quote: "In a well designed clinical trial of treatment of ovarian cancer, remission rate at one year is similar for new drug and usual care, p = 0.4. This means that:\n  a. Both treatment are effective\n  b. Neither treatment is effective\n  c. The statistical power of this study is 60%\n  d. The best estimate of treatment effect is 0.4\n  e. It is not possible to decide which treatment is better based on these information\nAnswer: e" }
    status: unverified
  - id: res.L07.018
    kind: mcq
    topic: sample-size
    stem: All of the following can be increased to get a smaller sample size in a randomized controlled trial (RCT) EXCEPT
    options: [Alpha error, Power, minimal clinically relevant difference (MCRD) (delta), Beta error]
    answer: 1
    why:
      - Accepting a larger alpha lowers Z-alpha, so fewer subjects are needed.
      - Higher power raises Z-beta, so more subjects are needed.
      - A larger difference is easier to detect, so fewer subjects are needed.
      - Accepting a larger beta means lower power, so fewer subjects are needed.
    src: { page: 18, quote: "All of the followings can be increased to get smaller sample size in RCT EXCEPT?\n  a. α error\n  b. Power\n  c. (MCRD) δ" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.019
    kind: mcq
    topic: sample-size
    stem: >-
      For your randomized controlled trial (RCT), you want 80% power to detect a reduction of 10 points or more in the treatment group relative to placebo.
      What is the 10 in your sample-size formula?
    options: [Standard deviation, Mean change, Effect size, Standard error, Significance level]
    answer: 2
    why:
      - The SD is the variability of the outcome, a separate input.
      - It is a planned difference between groups, not the mean change in one group.
      - The smallest difference worth detecting is the effect size (MCRD, delta).
      - The standard error comes out of the data, not the plan.
      - The significance level is alpha, typically 0.05.
    src: { page: 8, quote: "Factors affecting sample size of RCT\n| Component | Definition |\n|---|---|\n| Alpha (type I error) | The probability of falsely rejecting H0 and detecting a significant difference when the groups in reality are not different |\n| Beta (type II error) | The probability of falsely accepting H0 and not detecting a statistically significant when a specified difference between the groups in reality exist |\n| Power (1-beta) | The possibility of correctly rejecting H0 and detecting statistically significant difference when it is true |\n| (MCRD) δ | The minimal difference between the groups that the investigator considers clinically relevant |\n| Variance | The variability of the outcome measure as the SD in case of continuous outcome |" }
    status: unverified
  - id: res.L07.020
    kind: mcq
    topic: sample-size
    stem: >-
      A significance test based on a small sample may not give a statistically significant result even if the true value
      differs substantially from the null value. This type of result is known as
    options:
      - The significance level of the test
      - The power of the study
      - A type 1 error
      - A type 2 error
    answer: 3
    why:
      - The significance level is alpha, fixed before the test.
      - Power is the chance of avoiding exactly this miss.
      - A type 1 error is a false positive; this is a false negative.
      - A real difference was missed, a false negative, which small samples make likely.
    src: { page: 7, quote: "Minimal clinically relevant difference (MCRD) δ:\n  For continuous outcome (body weight) the MCRD may be 5 Kg\n  For a trial with a binary outcome, for example the effect of a drug on the development of a myocardial infarction (yes/no), an investigator could choose a difference of 10% between the treatment group and the control group as MCRD" }
    status: unverified
  # ---------------- conduct (slides 22-25, 45-50) ----------------
  - id: res.L07.021
    kind: card
    topic: conduct
    front: What does step 6 (detailed descriptions of protocols) require?
    back: >-
      Detailed protocols of clinical procedures, laboratory investigations, and questionnaire and interview protocols,
      written explicitly for every variable: intervention, co-intervention, confounders, and major and minor outcomes.
    src: { page: 22, quote: "Step 6 - Detailed Descriptions of Measurement Protocols:\n  Ensure that the measurement process is accurate.\n  Detailed protocols of clinical procedures, laboratory investigations as well as the details of questionnaire and interview protocols.\n  For each and every variable (intervention, co-intervention, confounders and major and minor outcome variables), write down very clearly and explicitly, as regards:" }
    status: unverified
  - id: res.L07.022
    kind: enumerate
    topic: conduct
    prompt: For each variable in the trial protocol, which questions must be written down clearly?
    points:
      - Who will make the measurement?
      - When will it be made?
      - What equipment or instrument will be used?
      - What technique will be used?
      - How will the equipment, techniques and personnel be standardized and validated?
    pass: 4
    hook: "لكل متغير اكتب 5: «مين؟ إمتى؟ بإيه؟ إزاي؟ وإزاي نوحّد ونتأكد؟» = who، when، equipment، technique، standardized وvalidated."
    src: { page: 23, quote: "Who will make the measurement? When will it be made?\nWhat equipment / instrument will be used?\nWhat technique will be used?\nHow the equipment, techniques and personnel be standardized and validated?" }
    status: unverified
  - id: res.L07.023
    kind: card
    topic: conduct
    front: What should be presented in step 7, enrolling the participants?
    back: A "Recruitment and Participation Flow Chart" giving the numbers (n) at each step.
    src: { page: 24, quote: "Step 7 - Enrolling the Participants: It is important to present the \"Recruitment and Participation Flow Chart\" giving the numbers ('n') at each step" }
    status: unverified
  - id: res.L07.024
    kind: card
    topic: conduct
    front: In step 9, how should the placebo be prepared, and what else must be planned?
    back: >-
      The placebo must have the same shape, colour, size and taste and be given by similar procedures.
      Procedures for checking compliance must also be developed.
    src: { page: 45, quote: "Step 9 - Introduce the Intervention and Placebo Control Modalities:\n  Develop procedures for checking compliance\n  Ensure that they get the placebo drug in the same shape, colour, size and taste and is also administered using similar procedures." }
    status: unverified
    tags: [high-yield]
  - id: res.L07.025
    kind: card
    topic: conduct
    front: What rule applies to data collection in the two study groups, and what happens if it is broken?
    back: >-
      Data for each group must be of the same quality: treatment (assigned and received) recorded, and outcome criteria
      explicitly stated and measured comparably in all groups. Otherwise there is observer bias.
    src: { page: 46, quote: "Data collection: It is essential that data collected for each of the study groups be of the same quality\n  Treatment (assigned and received)\n  Outcome: criteria explicitly stated and measured comparably in all groups\nOtherwise → observer bias" }
    status: unverified
  - id: res.L07.026
    kind: card
    topic: conduct
    front: Why is blinding step 10 of a randomized controlled trial (RCT), and who can be blinded?
    back: >-
      Knowing whether a participant is in the treatment or control group can influence behaviour.
      It is overcome by blinding the participants, the observer and/or the data reviewer.
    src: { page: 47, quote: "Step 10 - Ensure Blinding:\n  Knowledge of whether the participant is in a treatment or control group can influence behaviour\n  Overcome through blinding the participants and/or observer and/or data reviewer" }
    status: unverified
  - id: res.L07.027
    kind: card
    topic: conduct
    front: In step 11, how long are subjects followed, and what must be avoided?
    back: >-
      Until the end point or the end of the trial period, whichever is earlier.
      Losses to follow-up must be avoided, because they can seriously bias the results.
    src: { page: 48, quote: "Step 11 - Follow Up and Assessment:\n  Follow up the subjects till the end point, or the period of trial, whichever is earlier\n  Avoid losses to follow up, which may otherwise seriously bias the study results" }
    status: unverified
  - id: res.L07.028
    kind: enumerate
    topic: conduct
    prompt: "Stopping rules: when may a randomized controlled trial (RCT) be stopped early?"
    points:
      - Larger than expected benefit
      - Larger than expected harm
      - No important difference between the groups
      - Clearly high mortality or complications in the intervention group
    pass: 3
    hook: "توقف الـRCT بدري في 4 «كسب كبير، خسارة كبيرة، تعادل، أو وفيات في الذراع الجديد»: benefit أكبر من المتوقع، harm أكبر من المتوقع، no important difference، أو mortality أو complications عالية بوضوح في الـintervention group."
    src: { page: 49, quote: "When to stop RCT (\"Stoppage Rules\"):\n  RCTs may be stopped early if an intervention produces \"larger than expected benefit or harm,\" or\n  If \"investigators find evidence of no important difference\"\n  Evidence of clearly high mortality or complication in the intervention group comes up." }
    status: unverified
    tags: [high-yield]
  - id: res.L07.029
    kind: mcq
    topic: conduct
    stem: A randomized, single-masked experimental study is conducted. Which of the following problems is surely avoided?
    options:
      - "Noncompliance with the assigned treatment"
      - "Confounding by unknown factors"
      - Biased assessment of the disease outcome
      - "Loss to follow-up of participants"
    answer: 2
    why:
      - Masking does not make people take their treatment.
      - Randomization balances confounders on average but cannot guarantee it, so it is not surely avoided.
      - "This is the slide's answer: masking is the tool against biased outcome assessment. Strictly, single masking hides the group from one party only."
      - People can still drop out of a masked trial.
    src: { page: 50, quote: "Suppose that a randomized single masked experimental study is conducted. Which of the following problems are surely avoided in this study?\n  a. Noncompliance\n  b. Confounding\n  c. Biased assessment of the disease outcome\n  d. Loss to follow up" }
    status: unverified
  # ---------------- randomization (slides 26-34) ----------------
  - id: res.L07.030
    kind: enumerate
    topic: randomization
    prompt: How does randomization avoid bias? (slide 26)
    points:
      - Ensures the next assignment is unpredictable
      - Reduces baseline differences in risk between treatment and control groups
      - It is the only way to control for unknown factors
      - Makes both groups similar in the distribution of confounding variables
    pass: 3
    hook: "الـ randomization بتمنع الـ bias بـ 4: «متتوقعش اللي جاي، الجروبين متساويين في الخطر، الوحيدة اللي بتسيطر على المجهول، والـ confounders متوزعة بالتساوي»."
    src: { page: 26, quote: "Step 8 - Randomization. Randomization avoids bias by:\n  Ensuring unpredictability of next assignment\n  Reduces baseline differences in risk between treatment and control groups.\n  Only way to control for unknown factors\n  should make both groups similar in terms of the distribution of confounding variables\n  larger the randomized groups, the greater the probability of equal baseline risks." }
    status: unverified
    tags: [high-yield]
  - id: res.L07.031
    kind: enumerate
    topic: randomization
    prompt: Enumerate the three benefits of randomization quoted on slide 27.
    points:
      - Eliminates bias in treatment assignment (selection bias and confounding)
      - Facilitates blinding (masking) of treatments from investigators, participants and assessors
      - Permits probability theory to express how likely a difference is due to chance
    pass: 3
    hook: "فوايد الـ randomization 3: «مفيش انحياز، الـ blinding أسهل، والإحصاء يقول ده صدفة ولا لأ» = eliminates bias (selection وconfounding)، facilitates blinding، probability theory."
    src: { page: 27, quote: "Randomization:\n  \"It eliminates bias in treatment assignment,\" specifically selection bias and confounding.\n  \"It facilitates blinding (masking) of the identity of treatments from investigators, participants, and assessors.\"\n  \"It permits the use of probability theory to express the likelihood that any difference in outcome between treatment groups merely indicates chance.\"" }
    status: unverified
  - id: res.L07.032
    kind: card
    topic: randomization
    front: How does the size of the randomized groups affect baseline balance?
    back: The larger the randomized groups, the greater the probability of equal baseline risks.
