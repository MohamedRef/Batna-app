  - id: hb.L18.lesson3
    title: "نحمي ونكشف بدري: القهوة والـ PAGE-B"
    hook: "فنجان قهوة، statin، شوية مشي... وsonar كل 6 شهور. ده كل الفرق بين HCC بيتعالج و HCC بيتشاف متأخر."
    minutes: 9
    pages: [347, 352]
    topics: [protective, surveillance]
    goals:
      - "تعدّ الـ protective factors بأرقامها"
      - "تعرف مين نعمله surveillance ومين لأ، حسب كل guideline"
      - "تحسب PAGE-B وتقرا الـ categories"
    status: unverified
    steps:
      - kind: explain
        page: 347
        title: "الحاجات اللي بتحمي"
        text: |
          الكتاب بيجمعها في 4:

          - **Vaccination** ضد HBV.
          - **Treatment** للـ viral hepatitis.
          - **Medications:** **statins**، **aspirin و NSAIDs**، **metformin**.
          - **Lifestyle:** **coffee**، **diet**، **physical activity**.
      - kind: match
        page: 348
        prompt: "وصّل كل عامل حماية بالرقم بتاعه في الكتاب:"
        pairs:
          - ["Statins", "OR 0.63 (37% lower risk)"]
          - ["NSAID or antiplatelet use", "HR 0.51"]
          - ["Metformin (in diabetes)", "OR 0.50"]
          - ["Regular coffee", "RR 0.66"]
          - ["Physical activity", "HR 0.55"]
        why: "Statins: meta-analysis 1.6 مليون، **37%** أقل (OR 0.63). NSAIDs: **HR 0.51**. Metformin: **OR 0.50** (وكمان أقل overall cancer). Coffee: **RR 0.66**. Physical activity: **HR 0.55** في cohort متابعة 15 سنة."
      - kind: explain
        page: 349
        title: "ليه؟"
        text: |
          - **Aspirin:** المرضى اللي بياخدوه لـ **cardiovascular prevention** ممكن ياخدوا **فايدة زيادة** في تقليل الـ HCC.
          - **Coffee:** فيها **antioxidants** كتير، وده بيدّي **biologic plausibility**.
          - **Diet:** **white meat، fish، omega-3، vegetables**، و **vitamin E** (حتى في اللي مالهمش liver disease).
          - **Physical activity:** تأثيرها على **glucose و lipid metabolism** في الكبد، وتحسين الـ fatty liver.
      - kind: aside
        tone: joke
        page: 349
        text: |
          أخيرًا حاجة في الكتاب في صفّك: **القهوة** بتقلل خطر الـ HCC (**RR 0.66**). ☕

          يعني لما حد يقولك «انت بتشرب قهوة كتير ليه؟» قوله: «**chemoprevention** يا حبيبي، الكتاب قال كده». (بس ماتنساش النوم برضه.)
      - kind: explain
        page: 350
        title: "ليه نعمل screening أصلًا؟"
        text: |
          الـ **therapeutic window ضيقة جدًا**: لما الأعراض تظهر يكون الـ prognosis بقى وحش. فالـ surveillance هدفه نلقط الـ HCC في **أبدر stage** وقت ما فرصة الـ cure أعلى.

          - systematic review: الـ surveillance في الـ cirrhosis مرتبط بـ **detection أحسن**، **curative therapy أكتر**، و **overall survival أحسن**.
          - إضافة **AFP** للـ ultrasound بتزوّد الـ **sensitivity** بشكل واضح.
      - kind: explain
        page: 350
        title: "مين يتعمله، وإزاي؟"
        text: |
          **مين:**
          - **Cirrhosis من أي سبب.** (كل الـ guidelines متفقين)
          - **Chronic HBV من غير cirrhosis** لو **intermediate أو high risk** بالـ **PAGE-B**.
          - بعض الـ societies: **HCV من غير cirrhosis** بس عنده **bridging fibrosis (F3)**.

          **استثناءات مهمة:**
          - **EASL و AASLD:** من الـ cirrhotics، **Child-Pugh A و B بس**. الـ **Child C** لأ، **إلا لو مستني transplant**.
          - **AASLD:** كل اللي على **transplant list** يتعملهم screening **مرتين في السنة**، لأن اكتشاف early HCC ممكن **يغيّر أولويته** في الـ transplant.
          - **مفيش surveillance** للي عنده **life-limiting comorbidity** مش هتتعالج بالـ transplant.

          **إزاي:**
          - **Abdominal ultrasound كل 6 شهور** (كل الـ guidelines).
          - **AFP** ممكن مع الـ US، بس **أبدًا لوحده** (sensitivity و specificity ضعاف).
          - **NICE:** AFP لازم للبالغين اللي عندهم **cirrhosis + HBV**.
          - Biomarkers جديدة لسه بتتجرّب: **DCP، AFP-L3**، و human growth factors.
      - kind: reveal
        page: 350
        prompt: "ليه مانعملش surveillance لمريض **Child-Pugh C** مش على قايمة الـ transplant؟"
        answer: |
          الـ surveillance هدفه نلقط ورم صغير **نعالجه علاج curative**. مريض Child C مش هيستحمل resection ولا ablation في الغالب، والكبد نفسه هو اللي هيموّته قبل الورم. يبقى نكشف ورم صغير ليه لو مش هنقدر نعمل حاجة تغيّر مصيره؟

          علشان كده الاستثناء الوحيد: **مستني transplant**، لأن الـ transplant بيعالج الاتنين.
