  # Peak bone mass moved to lesson2 on 2026-11-13 (#828).
  - id: dm.L17.lesson1
    title: "العضم بيتسرق بالراحة"
    hook: "الـ osteoporosis مرض صامت لحد ما حاجة تنكسر. نفهم ليه بتنكسر، ومين بيتكسر إيه."
    minutes: 9
    pages: [214, 216]
    topics: [definition, types]
    goals:
      - "تعرّف الـ osteoporosis بالـ imbalance"
      - "تفرّق type 1 من type 2: مين، أي عضم، أي كسر، وليه"
      - "توصف الـ Colles' fracture وتعرف ليه type 1 هو اللي بيعملها"
    status: unverified
    steps:
      - kind: explain
        page: 214
        title: "حساب بنك فيه سحب أكتر من الإيداع"
        quote: "The bone disease osteoporosis is caused by more bone cells being resorbed than being deposited. This imbalance results in a progressive loss of bone density and a thinning of bone tissue. Osteoporotic bones are more porous and therefore more vulnerable to fracture."
        text: |
          العضم مش حجر، ده حساب بنك شغال طول الوقت: الـ **osteoclasts** بتسحب (resorption) والـ **osteoblasts** بتودع (deposition).

          الـ ==osteoporosis== = السحب أكتر من الإيداع. النتيجة: **progressive loss of bone density** و **thinning of bone tissue**.

          العضم بيبقى **more porous**، فبيبقى ==more vulnerable to fracture==.
      - kind: figure
        page: 214
        title: "عضم طبيعي وعضم مخرّم"
        image: { file: dm/L17-trabecular-bone.webp, book: true }
        alt: "Two proximal femurs side by side with magnified trabecular bone: normal bone has thick, dense struts; osteoporotic bone has thin struts with large holes."
        caption: "شوف الـ trabeculae: في الطبيعي سميكة ومتشابكة، وفي الـ **osteoporosis** رفيعة وبينها فراغات كبيرة. نفس الشكل من بره، بس من جوه **porous**."
      - kind: explain
        remind: [dm.L17.003, rheum.L14.004]
        page: 215
        title: "بيتكسر فين؟"
        quote: "Bones liable to fracture in osteoporosis: Vertebral bodies, distal radius, proximal femur."
        text: |
          الكتاب بيرسم الهيكل ويعلّم على تلات أماكن:
          - **Vertebral bodies**
          - **Distal radius** (الـ Colles' fracture)
          - **Proximal femur** (كسر الحوض/الـ hip)

          كلهم أماكن غنية بالـ **trabecular bone**، وده العضم الإسفنجي اللي بيتسرق الأول. التفسير المقبول (مش في الكتاب): الـ trabecular bone مساحة سطحه كبيرة، فالـ osteoclasts بتلاقي فيه شغل أكتر، وعشان كده بيخسر أسرع من الـ cortical.
      - kind: "figure"
        page: 215
        quote: "Bones liable to fracture in osteoporosis: Vertebral bodies, distal radius, proximal femur."
        title: "بيتكسر فين؟ رسمة الكتاب، ص 215"
        image: { file: dm/L17-fracture-sites.webp, book: true }
        caption: "الهيكل بتاع الكتاب والنجوم الصفرا على أماكن الكسر: ==الـ vertebral bodies== في الضهر، ==الـ distal radius== عند الرسغ، و==الـ proximal femur== عند الورك.\n\nافتكر إن الرسغ والفقرات بتوع type 1 (trabecular)، والورك أكتر في type 2، زي ما الجدول اللي جاي بيقول."
        alt: "Book drawing of a skeleton with yellow starbursts at the vertebral bodies, both distal radii and both proximal femurs, beside the text: bones liable to fracture in osteoporosis: vertebral bodies, distal radius, proximal femur."
      - kind: table
        page: 215
        quote: "Affects six times as many women as men, and is mainly responsible for the increased risk of osteoporotic fractures."
        title: "Type 1 ضد type 2"
        columns: [Feature, Type 1, Type 2]
        rows:
          - ["Women : men", "6 : 1", "2 : 1"]
          - ["Bone", "Trabecular", "Trabecular + cortical"]
          - ["Fractures", "Vertebral crush, Colles'", "Femoral + vertebral"]
          - ["Age", "Postmenopausal", "Mainly > 70 y"]
          - ["Cause", "Postmenopausal endocrine", "Age-related vitamin D"]
        hide: [[0, 1], [0, 2], [2, 1], [2, 2]]
      - kind: reveal
        page: 216
        quote: "Postmenopausal endocrinologic changes probably cause type 1 osteoporosis; age-related changes in vitamin D synthesis are thought to lead to type 2 osteoporosis."
        prompt: "ليه type 1 بيجي للستات 6 أضعاف الرجالة، و type 2 الضعف بس؟"
        answer: |
          الكتاب بيدّيك المفتاح: type 1 سببه غالبًا ==postmenopausal endocrinologic changes==، و type 2 من تغيّرات الـ vitamin D مع السن.

          النتيجة: type 1 مربوط بحاجة بتحصل للستات بس (سن اليأس ووقوع الـ estrogen)، فالفرق كبير (6:1). أما type 2 فبيحصل للاتنين مع الكبر، والستات بيفضلوا أكتر شوية (2:1) عشان بيبدأوا برصيد أقل (ص 218).
      - kind: explain
        page: 215
        title: "الـ Colles' fracture شكلها إيه، وليه type 1 بالذات؟"
        quote: "Colles’ fracture: A break across the end of both of the lower arm bones, a Colles' fracture results in a backward and outward position of the hand in relation to the wrist."
        text: |
          الكتاب بيوصفها: كسر عرضي في ==آخر عضمتين الساعد== (الطرف البعيد)، والإيد بتتزق **لورا ولبرة** بالنسبة للرسغ.

          ليه type 1 هو اللي بيعملها؟ الكتاب بيقول لأنه بيضرب ==trabecular bone== أساسًا، والطرف البعيد للـ radius والفقرات عضم إسفنجي في الأساس. يعني المرض بيختار العضم اللي فيه trabeculae كتير، والكسر بييجي في نفس المكان.

          التفسير المقبول (مش في الكتاب) لاتجاه الإيد: الست بتقع على ==إيد مفرودة==، فالقوة بتزق الجزء المكسور لورا. عشان كده دي كسرة "الوقعة على الإيد" في ست بعد سن اليأس.
      - kind: mnemonic
        page: 215
        quote: "It is a gradual age-related bone loss. Also known as involutional or senile osteoporosis, it occurs mainly in persons > 70 years and affects twice as many women as men."
        word: "6T 2C"
        parts:
          - { key: "6", text: "Type 1: six women for every man" }
          - { key: "T", text: "Type 1: Trabecular bone, so vertebral crush and Colles'" }
          - { key: "2", text: "Type 2 (senile, mainly over 70): two women for every man" }
          - { key: "C", text: "Type 2: Cortical bone too, so femoral fractures join in" }
        hook: "**6T** للست اللي لسه داخلة سن اليأس، و **2C** للجدّة اللي فوق السبعين."
      - kind: check
        page: 215
        quote: "Because it primarily affects trabecular bone, type 1 osteoporosis is mainly responsible for vertebral crush fractures and Colles' fractures."
        question: "A 55-year-old woman, 4 years after menopause, falls on her hand. Most likely fracture?"
        options:
          - "Colles' fracture"
          - "Femoral neck fracture"
          - "Skull fracture"
          - "Clavicle fracture"
        answer: 0
        why:
          - "صح: type 1 = trabecular = vertebral crush و Colles'."
          - "الـ femoral أكتر في type 2 فوق السبعين."
          - "مش من أماكن الـ osteoporosis في الكتاب."
          - "مش من الأماكن التلاتة في الشكل."
      - kind: reveal
        page: 216
        quote: "Because density decreases in both trabecular and cortical bone, type 2 osteoporosis results in femoral and vertebral fractures."
        prompt: "ليه type 2 بس اللي بيكسر الـ femur بسهولة؟"
        answer: |
          لأن عنق الـ femur محتاج **cortical bone** قوي يشيله. في type 1 الخسارة في الـ **trabecular** أساسًا.

          في type 2 الكثافة بتقل في ==trabecular and cortical bone== مع بعض، فالكسور تبقى **femoral and vertebral**.
      - kind: explain
        page: 216
        title: "السبب والـ biphasic pattern"
        quote: "Postmenopausal endocrinologic changes probably cause type 1 osteoporosis; age-related changes in vitamin D synthesis are thought to lead to type 2 osteoporosis."
        text: |
          - **Type 1**: غالبًا من ==postmenopausal endocrinologic changes== (الـ estrogen وقع).
          - **Type 2**: من **age-related changes in vitamin D synthesis**.

          والست ممكن تاخد الاتنين مع بعض، فيبقى عندها **biphasic pattern of bone loss**.
      - kind: try
        items: [dm.L17.001, dm.L17.003, dm.L17.004, dm.L17.009, dm.L17.012]
    recap:
      - "Osteoporosis = resorption أكتر من deposition ← عضم porous بيتكسر."
      - "أماكن الكسر: vertebral bodies، distal radius، proximal femur."
      - "Type 1: 6:1، trabecular، crush + Colles'، من سن اليأس. Type 2: فوق 70، 2:1، cortical كمان ← femur، من الـ vitamin D."
      - "الست ممكن تاخد الاتنين: biphasic pattern."
    practice: [dm.L17.001, dm.L17.002, dm.L17.003, dm.L17.004, dm.L17.005, dm.L17.006, dm.L17.007, dm.L17.008, dm.L17.009, dm.L17.010, dm.L17.011, dm.L17.012]
