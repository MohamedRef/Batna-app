  - id: neph.L04.lesson6
    title: "العلاج خطوة خطوة"
    hook: "lifestyle، target، وأول دوا حسب السن والأصل، وبعدين combination. كل خطوة ليها سبب."
    minutes: 10
    pages: [88, 91]
    topics: [treatment]
    goals:
      - "تعرف مبادئ العلاج وليه combination"
      - "تدّي أرقام الـ lifestyle والـ targets وتعرف ليه"
      - "تختار أول دوا (A أو C/D) وتعرف ليه"
    status: unverified
    steps:
      - kind: explain
        page: 88
        title: "مبادئ العلاج"
        quote: "1- Assessment 2- Repeated measurement 3- Life style modification 4- Target blood pressures needed 5- Ambulatory blood pressure target 6- Most hypertensive patients require a combination of drugs 7- First dose profound hypotension occurs with ACEi Alpha blockers (Post Synaptic)"
        text: |
          Assessment، قياس متكرر، lifestyle، target، ambulatory target.

          - ==أغلب العيانين محتاجين combination==.
          - **First-dose profound hypotension:** مع **ACEi** و **alpha blockers**.
          - مع **ACEi و ARBs** تابع الـ renal function، وممكن **angioedema**.
          - **Refractory** = مش واصل للـ target على **optimal triple therapy including a diuretic** في عيان ملتزم.

          الخطوة الجاية بتشرح **ليه** combination وليه أول جرعة بتوقّع.
      - kind: explain
        page: 88
        quote: "First dose profound hypotension occurs with"
        title: "ليه combination، وليه أول جرعة بتوقّع؟"
        text: |
          الكتاب: **أغلب العيانين محتاجين combination**، و**first-dose profound hypotension** مع **ACEi** و **alpha blockers**. وأهداف الـ combination: side effects أقل، adherence أحسن، control أحسن، الهدف بيتحقق في وقته، و outcomes أحسن.

          التفسير المقبول (مش في الكتاب):

          - كل دوا لوحده بيشغّل الجسم **يعوّض**: الـ diuretic بيعلّي الـ renin، والـ vasodilator بيعلّي النبض. الدوا التاني **بيقفل** التعويض ده، **فـ** الأثر أكبر بجرعات أقل.
          - الـ **ACEi** أول جرعة: العيان اللي جاف أو على diuretic ضغطه **معتمد** على الـ angiotensin II، فلما تقفله فجأة الضغط يقع.
          - الـ **alpha blocker**: بيوسّع الأوردة، **فـ** لما يقف الدم ينزل في الرجلين ويدوخ (postural).
      - kind: table
        page: 89
        quote: "| Measure | Recommendations |\n| Body weight | Maintain normal body weight (BMI 20-25 kg/m²) |\n| Aerobic exercise | Perform ≥30 min brisk walk most days of the week |\n| Diet | Reduce intake of fat and saturated fat |\n| | Reduce salt intake <100 mmol/day (<6 g NaCl or <2.4 g Na/day) |\n| | Limit alcohol to ≤3 units/day men and <2 units/day women |\n| | Consume ≥5 portions of fresh fruit and vegetables/day |\n| Cardiovascular risk reduction | Avoid cigarette smoking and increase oily fish intake |"
        title: "Lifestyle"
        columns: [Measure, Target]
        rows:
          - ["BMI", "20–25 kg/m²"]
          - ["Walk", "≥30 min most days"]
          - ["Salt", "<100 mmol/day (<6 g NaCl)"]
          - ["Alcohol", "≤3 units men, <2 women"]
          - ["Fruit, vegetables", "≥5 portions/day"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
      - kind: explain
        page: 89
        quote: "Lifestyle modification in borderline and hypertensive patients"
        title: "ليه كل بند في الـ lifestyle؟"
        text: |
          الكتاب: BMI **20–25**، مشي **≥ 30 دقيقة** أغلب الأيام، ملح **< 100 mmol/day** (< 6 g NaCl)، alcohol **< 3 units** للرجالة و **< 2** للستات، **≥ 5** حصص خضار وفاكهة، وبلاش تدخين.

          التفسير المقبول (مش في الكتاب):

          - **الوزن:** الدهون (خصوصًا البطن) بتعمل insulin resistance وsleep apnea، والاتنين بيعلّوا الضغط.
          - **المشي:** بيوسّع الأوعية وبيقلّل الـ sympathetic.
          - **الملح:** أقل صوديوم = volume أقل، **عشان** كده بيفرق أكتر في الـ salt-sensitive.
          - **الخضار والفاكهة:** فيهم **potassium**، واللي شفنا إنه بيحمي من الملح.
      - kind: aside
        tone: joke
        text: |
          الـ lifestyle table كله في جملة: **امشي نص ساعة، كُل خمس حاجات خضرا، وما تحطش ملح زيادة على الفول**. ولو قال «بس الفول مش بيتاكل من غير ملح»، قوله إن الـ cardiologist كمان مش بيتاكل.
      - kind: table
        page: 90
        quote: "| Types of Hypertension | BP Goal (mmHg) |\n| Uncomplicated | <140/90 |\n| Complicated: | |\n| Diabetes mellitus | <130/80 |\n| Kidney disease | <130/80* |\n| Other high risk (stroke, myocardial infarction) | <130/80 |\n*Lower if proteinuria is >1 g/day"
        title: "Targets (ESH/ESC و JNC 7)"
        columns: [Patient, Goal]
        rows:
          - ["Uncomplicated", "<140/90"]
          - ["Diabetes", "<130/80"]
          - ["Kidney disease", "<130/80; lower if proteinuria >1 g/day"]
          - ["Stroke, MI", "<130/80"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 90
        quote: "Lower if proteinuria is >1 g/day"
        title: "ليه الهدف أقل في السكر والكلى؟"
        text: |
          الكتاب: **< 140/90** في الـ uncomplicated، و **< 130/80** في الـ diabetes و kidney disease و high risk (stroke، MI)، و**أقل** لو الـ proteinuria **> 1 g/day**.

          التفسير المقبول (مش في الكتاب): العيان ده خطره على القلب والكلى أعلى أصلًا، **فـ** نفس النزول في الضغط بيمنع events أكتر. ولو فيه proteinuria، الضغط العالي بيوصل للـ glomerulus مباشرة، **يعني** كل mmHg أقل = بروتين أقل في البول وكلية بتعيش أطول.
      - kind: update
        page: 90
        quote: "| Types of Hypertension | BP Goal (mmHg) |\n| Uncomplicated | <140/90 |\n| Complicated: | |\n| Diabetes mellitus | <130/80 |\n| Kidney disease | <130/80* |\n| Other high risk (stroke, myocardial infarction) | <130/80 |\n*Lower if proteinuria is >1 g/day"
        text: "الـ **Kidney Disease: Improving Global Outcomes (KDIGO) 2021** بيقترح systolic blood pressure (SBP) **<120** (standardized office BP) في الـ CKD لو العيان مستحمل، والـ **European Society of Hypertension (ESH) 2023** بيستهدف <130/80 لأغلب المتعالجين. في الامتحان جاوب بجدول الكتاب: <130/80، وأقل لو الـ **proteinuria** >1 g/day."
        ref: "KDIGO BP in CKD 2021; ESH 2023"
      - kind: explain
        page: 90
        quote: "Recommendations for Combining BP-lowering Drugs"
        title: "ليه الـ combinations دي بتشتغل؟"
        text: |
          الكتاب (ESH/ESC): رسمة بتوصل بين الـ **diuretics**، **beta-blockers**، **ARBs**، **CCBs**، و **ACE inhibitors**، وفيها الـ combinations اللي متاحة **fixed-dose** واللي less frequently used.

          التفسير المقبول (مش في الكتاب) لأشهرهم:

          - **ACEi/ARB + diuretic:** الـ diuretic بيعلّي الـ renin، والـ ACEi بيقفل اللي بعده. وكمان الـ ACEi بيرفع الـ K والـ diuretic بيوطّيه، **فـ** بيتعادلوا.
          - **ACEi/ARB + CCB:** الـ CCB بيعمل ankle edema من توسيع الشريان بس، والـ ACEi بيوسّع الوريد كمان **فـ** الـ edema بيقل.
          - الـ **fixed-dose** حباية واحدة، **يعني** adherence أحسن.
      - kind: figure
        page: 90
        quote: "Recommendations for Combining BP-lowering Drugs"
        title: "مين يتجمع مع مين؟ رسمة الكتاب"
        image: { file: neph/L04-drug-combinations.webp, book: true }
        alt: "Book hexagon 'ESH-ESC recommendations for combining BP-lowering drugs': diuretics (top), beta-blockers (upper left), alpha-blockers (lower left), ACE inhibitors (bottom), calcium channel blockers (lower right, blue oval) and angiotensin receptor blockers (upper right, blue oval). Solid red lines join diuretics with ARBs, CCBs and ACE inhibitors, CCBs with ACE inhibitors and ARBs, and beta-blockers with CCBs; a dashed red line joins diuretics and beta-blockers; dashed black lines join the rest. A thick blue double arrow joins ARBs and CCBs. Key: red, available as a fixed-dose combination; dashed black, less frequently used, combination used as necessary."
        caption: |
          6 عائلات أدوية على أطراف شكل سداسي، والخطوط بينهم = هل الجمع ده مستخدم:

          - **الخطوط الحمرا المتصلة**: جمع مفضّل و**available as a fixed-dose combination**: **Diuretics** مع **ARBs** و **CCBs** و **ACE inhibitors**، والـ **CCBs** مع **ACE inhibitors** و **ARBs**.
          - **الخط الأحمر المتقطع**: diuretics مع **β-blockers**.
          - **الخطوط السودا المتقطعة**: **less frequently used** (زي α-blockers مع أي حاجة).
          - **السهم الأزرق التخين يمين**: **ARBs ↔ CCBs**.

          الرسمة بتقول القاعدة: ==A + C أو A + D== (RAS blocker مع CCB أو diuretic) هي الأساس، وده نفس اللي في السلّم اللي بعدها. والـ ACE inhibitor مع ARB ==مفيش بينهم خط مفضّل== (ممنوع الجمع).
      - kind: figure
        page: 91
        quote: "Then GOAL is ….to Achieve reduction of BP And protect TOD Figure: Choosing drugs for patients newly diagnosed with hypertension."
        title: "تختار أول دوا إزاي: رسمة الكتاب"
        image: { file: neph/L04-choosing-drugs.webp, book: true }
        alt: "Book flowchart 'Choosing drugs for patients newly diagnosed with hypertension'. Two starting boxes: younger than 55 years leads to A; 55 years or older or black patients of any age leads to C or D (step 1). Both lead to A+C or A+D (step 2), then A+C+D (step 3), then step 4: add further diuretic therapy or alpha-blocker or beta-blocker, consider seeking specialist advice."
        caption: |
          4 درجات (المكتوبين بالأحمر يمين: **Step 1** لـ **Step 4**):

          1. **Step 1**: فوق شمال **Younger than 55 years** ← **A** (ACE inhibitor، أو ARB لو مش مستحمل). فوق يمين **55 years or older or black patients** ← **C** (calcium-channel blocker) **أو D** (thiazide-type diuretic).
          2. **Step 2**: الطريقين بيتقابلوا: **A + C** أو **A + D**.
          3. **Step 3**: **A + C + D**.
          4. **Step 4**: الصندوق الكبير: زوّد **diuretic** تاني أو **alpha-blocker** أو **beta-blocker**، و==اطلب رأي specialist== (resistant HT).

          يعني ==السن والعِرق بيحددوا أول دوا بس==، وبعد كده الكل بيوصل لنفس التركيبة A + C + D.
      - kind: explain
        page: 91
        quote: "Black patients are those of African or Caribbean descent"
        title: "ليه A للصغير و C أو D للكبير والأسود؟"
        text: |
          الكتاب: **A** (ACEi، أو ARB لو مش مستحمل) تحت **55**، و **C** أو **D** لـ **55+ أو black**، وبعدين A+C أو A+D، وبعدين A+C+D، وبعدين diuretic زيادة أو alpha أو beta-blocker.

