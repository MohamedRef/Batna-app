  - id: endo.L07.lesson2
    title: "الـ myxedema coma: لما الجسم يدخل بيات شتوي"
    hook: "مش لازم يكون في غيبوبة. كفاية واحدة كبيرة، بردانة، بطيئة، ودواها في الدرج مقفول."
    minutes: 8
    pages: [113, 115]
    topics: [myxedema]
    goals:
      - "تعرف التعريف والـ clues"
      - "تفهم ليه الـ sodium والسكر بيقعوا"
      - "تكتب العلاج بالجرعات والأولويات"
    status: unverified
    steps:
      - kind: explain
        page: 113
        quote: "It is defined as severe hypothyroidism with: – Depressed mental status. – Hypothermia. – Reduced function of other organs."
        title: "التعريف"
        text: |
          ==Myxedema coma== = **severe hypothyroidism** مع:

          - Depressed mental status.
          - **Hypothermia**.
          - Reduced function of other organs.

          Medical emergency بـ mortality عالية، والتشخيص بدري مهم. و **myxedema** نفسها يعني انتفاخ الوش والأطراف من ترسّب الـ **mucin** في الجلد.
      - kind: explain
        page: 114
        quote: "Hypotension (has prognostic significance)."
        title: "الـ clues والصورة"
        text: |
          **Clues**: thyroid surgery، radioactive iodine، أو ==poor compliance== على الـ thyroxine.

          **الصورة**: depressed mental state، **bradycardia**، hypothermia، **hypotension** وليها prognostic significance، و **type 2 respiratory failure**.

          ورغم الاسم، أغلبهم بييجوا confused أو psychotic، **مش** في coma.
      - kind: figure
        page: 114
        quote: "Hyponatremia is common and seen in at least 50% of the patients."
        title: "الجسم في بيات شتوي"
        alt: "A body outline in the centre with labelled slowed systems: brain drowsy and confused, heart slow and low blood pressure, lungs retaining CO2, temperature low, kidneys holding water causing low sodium, liver giving low glucose."
        caption: "كل حاجة بتبطّأ. الـ hyponatraemia في 50% على الأقل، والـ hypoglycaemia شائعة."
        svg: |
          <svg viewBox="0 0 330 280" xmlns="http://www.w3.org/2000/svg">
            <circle cx="165" cy="40" r="22" class="fg-acc"/>
            <rect x="140" y="66" width="50" height="110" rx="20" class="fg-acc"/>
            <path d="M150 176L140 250M180 176L190 250" class="fg-ink" stroke-width="10"/>
            <text x="5" y="34" class="t-sm t-b">Brain</text>
            <text x="5" y="50" class="t-sm">drowsy, confused</text>
            <text x="225" y="34" class="t-sm t-b">Temp</text>
            <text x="225" y="50" class="t-sm">hypothermia</text>
            <text x="5" y="100" class="t-sm t-b">Heart</text>
            <text x="5" y="116" class="t-sm">brady, low BP</text>
            <text x="225" y="100" class="t-sm t-b">Lungs</text>
            <text x="225" y="116" class="t-sm">low O2, high CO2</text>
            <text x="5" y="170" class="t-sm t-b">Kidney</text>
            <text x="5" y="186" class="t-sm">low Na (50%)</text>
            <text x="225" y="170" class="t-sm t-b">Liver</text>
            <text x="225" y="186" class="t-sm">low glucose</text>
            <text x="90" y="272" class="t-sm t-mut">everything slows down</text>
          </svg>
      - kind: check
        page: 114
        quote: "Any patient with a low serum sodium and normal volume status should be suspected of having an underactive thyroid."
        question: "A patient has Na 124 mmol/L and looks euvolaemic. Which condition should you suspect per the lecture?"
        options: ["Hypothyroidism", "Hyperthyroidism", "Pheochromocytoma", "Hypercalcaemia"]
        answer: 0
        why:
          - "صح: أي low sodium مع normal volume status فكّر في underactive thyroid."
          - "الـ hyperthyroidism مش بيعمل كده."
          - "مش مذكورة كسبب."
          - "الـ hypercalcaemia بتعمل polyuria مش hyponatraemia."
      - kind: explain
        page: 115
        quote: "a short synacthen test should be considered, as coexisting hypoadrenalism is a possibility"
        title: "التحاليل"
        text: |
          اسحب **TSH**، **free T4**، و ==cortisol==.

          ولو تقدر، اعمل **short synacthen test**: ممكن يكون معاه hypoadrenalism، خصوصًا لو الـ hypothyroidism **secondary** من الـ pituitary.
      - kind: table
        page: 115
        quote: "The dose of T4 is between 200 μg and 400 μg per day iv"
        title: "العلاج"
        columns: ["Step", "Detail"]
        rows:
          - ["Start", "Quickly if suspicion is high"]
          - ["T4", "200-400 µg/day IV"]
          - ["T3", "10 µg three times a day IV"]
          - ["Steroid", "Hydrocortisone 100 mg 8-hourly"]
          - ["Support", "Careful warming, HR, BP, Na"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: trap
        page: 115
        quote: "The young, obese and those with less likely cardiac risk should receive a higher dose than their counterparts."
        text: "الجرعة الأعلى للـ **young** والـ **obese** وقليلي الـ cardiac risk. يعني الست الكبيرة اللي عندها قلب تاخد الطرف الواطي من الـ 200-400."
      - kind: reveal
        page: 115
        quote: "Hypothermia by careful warming."
        prompt: "ليه الـ warming لازم يكون careful؟"
        answer: "التدفية بسرعة بتعمل **peripheral vasodilatation** والـ BP الواطي أصلًا هيقع أكتر. والكتاب بيقول إن الـ ==supportive treatment== هو الـ crucial aspect: warming بالراحة، bradycardia، hypotension، hyponatraemia، وعلاج السبب."
      - kind: check
        page: 115
        quote: "around a third may succumb to the illness."
        question: "Despite aggressive treatment, roughly how many patients with myxedema coma die?"
        options: ["About a third", "Under 5%", "About 85%", "Nearly all"]
        answer: 0
        why:
          - "صح: حوالي التلت."
          - "أقل بكتير من الحقيقة."
          - "ده رقم الكتاب للـ pheo crisis."
          - "مبالغة."
      - kind: try
        items: [endo.L07.014, endo.L07.017, endo.L07.019, endo.L07.022, endo.L07.024]
    recap:
      - "Severe hypothyroidism + depressed mentation + hypothermia + organ failure."
      - "Clues: surgery، RAI، poor compliance. Hypotension = prognostic."
      - "Na واطي في 50% على الأقل، وhypoglycaemia شائعة."
      - "TSH، FT4، cortisol؛ SST لو ممكن."
      - "T4 200-400 + T3 10 tds IV، hydrocortisone 100 كل 8 ساعات، warming بالراحة. تلت بيموتوا."
    practice: [endo.L07.014, endo.L07.015, endo.L07.016, endo.L07.017, endo.L07.018, endo.L07.019, endo.L07.020, endo.L07.021, endo.L07.022, endo.L07.023, endo.L07.024, endo.L07.025, endo.L07.026, endo.L07.099, endo.L07.102]
  # ------------------------------------------------------------------
  - id: endo.L07.lesson3
    title: "الـ thyroid storm: الغدة ولّعت"
    hook: "حرارة، قلب بيجري أسرع من الحرارة، ومريضة مش قادرة تقعد. والأسبرين هنا ممنوع."
    minutes: 9
    pages: [115, 118]
    topics: [storm]
    goals:
      - "تعرف الـ precipitants والصورة"
      - "ترتّب العلاج بالتلات مبادئ وبالجرعات"
      - "تعرف ليه الـ salicylates ممنوعة"
    status: unverified
    steps:
      - kind: explain
        page: 116
        quote: "Diabetic ketoacidosis. Cardiovascular accident. Parturition. Status epilepticus. I131 treatment. Iodinated contrast dyes."
        title: "إيه اللي بيولّعها؟"
        text: |
          ==Precipitants==: surgery، sepsis، burns، **DKA**، cardiovascular accident، **parturition**، status epilepticus، **I-131**، و iodinated contrast.

          **Thyroxine overdose لا يعمل thyroid storm**. السبب مش واضح، بس فيه:

          - Acute discharge لـ T4 و T3 من الغدة.
          - Inhibition لارتباطهم بالـ binding globulin.
      - kind: explain
        page: 116
        quote: "Tachycardia out of proportion to the fever."
        title: "الصورة"
        text: |
          Thyrotoxicosis بس أشد:

          - **Fever** 38.5°C.
          - ==Tachycardia out of proportion to the fever==.
          - Confusion، agitation.
          - Nausea و vomiting.
          - Hypertension، **congestive cardiac failure**.

          التحاليل: TSH واطي، T3 و T4 عاليين، ومعاهم ALT و ALP و bilirubin عاليين.
      - kind: check
        page: 116
        quote: "Thyroxine overdose does not cause thyroid storm."
        question: "Which of these does NOT cause thyroid storm, per the lecture?"
        options: ["Thyroxine overdose", "Parturition", "Iodinated contrast", "Diabetic ketoacidosis"]
        answer: 0
        why:
          - "صح: الكتاب بيقولها صريحة."
          - "الولادة precipitant."
          - "الـ contrast precipitant."
          - "الـ DKA precipitant."
      - kind: figure
        page: 117
        quote: "Decrease the production and release of thyroid hormones, – Block the effects of circulating t4 and t3."
        title: "اقفل المصنع، اقفل التحويل، اقفل التأثير"
        alt: "A pipeline from thyroid gland to tissues. Block 1 at the gland: methimazole or PTU stop synthesis. Block 2 at release and conversion: Lugol's iodine (lithium if allergic), steroids and PTU stop T4 to T3. Block 3 at the tissues: propranolol. Below: treat the precipitant, fluids, cooling, paracetamol, no aspirin."
        caption: "الـ PTU بيقفل خطوتين: الـ synthesis والـ T4 → T3."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="70" rx="8" class="fg-bad"/>
            <text x="20" y="32" class="t-b">1. Gland: synthesis</text>
            <text x="20" y="52" class="t-sm">methimazole 20 mg IV 4-6 h</text>
            <text x="20" y="70" class="t-sm">or PTU 200 mg 4-hourly</text>
            <rect x="10" y="90" width="310" height="90" rx="8" class="fg-acc"/>
            <text x="20" y="112" class="t-b">2. Release and T4 to T3</text>
            <text x="20" y="132" class="t-sm">Lugol's 0.3 ml in 50 ml 8-hourly, 5 days</text>
            <text x="20" y="150" class="t-sm">iodine allergy: lithium 300 mg 6-hourly</text>
            <text x="20" y="168" class="t-sm">dexamethasone 4 mg or HC 100 mg qds</text>
            <rect x="10" y="190" width="310" height="52" rx="8" class="fg-good"/>
            <text x="20" y="212" class="t-b">3. Tissues: propranolol</text>
            <text x="20" y="230" class="t-sm">80 mg tds or 1 mg/min IV to HR 100</text>
            <rect x="10" y="250" width="310" height="42" rx="8" class="fg-thin"/>
            <text x="20" y="268" class="t-sm">fluids, cooling, paracetamol</text>
            <text x="20" y="284" class="t-sm t-bad t-b">no salicylates; treat precipitant</text>
          </svg>
      - kind: table
        page: 117
        quote: "Lugol‘s iodine: 0.3 ml diluted to 50 ml every 8 hours given orally or via nasogastric tube for 5 days."
        title: "الجرعات"
        columns: ["Drug", "Dose"]
        rows:
          - ["Methimazole", "20 mg IV 4-6-hourly"]
          - ["Carbimazole", "30 mg twice daily (oral)"]
          - ["PTU", "200 mg 4-hourly"]
          - ["Lugol's", "0.3 ml in 50 ml 8-hourly x5 d"]
          - ["Lithium", "300 mg 6-hourly, level 1 mmol/l"]
          - ["Propranolol", "80 mg tds or 1 mg/min IV"]
        hide: [[0, 1], [2, 1], [3, 1], [5, 1]]
      - kind: aside
        tone: tip
        page: 117
        quote: "Both drugs can also be given per rectum."
        text: "المريض بيرجّع ومفيش IV؟ الكتاب بيقول الاتنين، methimazole و PTU، ممكن **per rectum**، والـ PTU والـ Lugol's ممكن بالـ NG tube."
      - kind: case
        page: 118
        quote: "If β-blockers are contraindicated, the possible alternatives would include calcium channel blockers or digoxin."
        stem: "A 40-year-old man with Graves' and asthma develops storm after pneumonia. Pulse 150, temperature 39.5°C."
        steps:
          - question: "Rate control?"
            options: ["Calcium-channel blocker or digoxin", "Propranolol 1 mg/min IV", "Adenosine", "No rate control"]
            answer: 0
            why: "الـ asthma = β-blocker contraindicated، فالبديل CCB أو digoxin."
          - question: "Fever?"
            options: ["Paracetamol and external cooling", "Aspirin", "Diclofenac", "Ice bath"]
            answer: 0
            why: "الـ salicylates بتطرد الهرمون من الـ binding فبتزوّد الـ storm."
          - question: "Where should he be managed?"
            options: ["HDU, consider ICU", "General ward", "Outpatient", "Day unit"]
            answer: 0
            why: "Medical high-dependency unit، والـ ICU لازم يتفكر فيه."
      - kind: aside
        tone: joke
        page: 118
        quote: "Salicylates should be avoided as they inhibit thyroid hormone binding and can worsen the thyroid storm."
        text: "إنك تدّي **aspirin** في الـ thyroid storm زي ما تطفي حريقة بجركن بنزين: بيطرد الهرمون من الـ TBG فيبقى free أكتر. خليك في الـ **paracetamol**."
      - kind: try
        items: [endo.L07.027, endo.L07.029, endo.L07.032, endo.L07.035]
    recap:
      - "Precipitants: surgery، sepsis، DKA، ولادة، I-131، contrast. الـ thyroxine overdose لا."
      - "Fever + tachycardia أكبر من الحرارة + agitation + CCF؛ ALT و bilirubin عاليين."
      - "Methimazole 20 IV أو PTU 200 كل 4 ساعات؛ Lugol's 0.3 ml كل 8 ساعات 5 أيام."
      - "Lithium لو حساسية يود؛ steroids؛ propranolol، أو CCB/digoxin."
      - "Paracetamol و cooling؛ salicylates ممنوعة."
    practice: [endo.L07.027, endo.L07.028, endo.L07.029, endo.L07.030, endo.L07.031, endo.L07.032, endo.L07.033, endo.L07.034, endo.L07.035, endo.L07.036, endo.L07.037, endo.L07.038, endo.L07.097, endo.L07.101]
