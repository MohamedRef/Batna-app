        title: "الـ cholestasis بيضرب فين في طريق الصفرا؟"
        alt: "A vertical bile path drawn on the left, from the hepatocyte and its canaliculus down through the ductule, the small interlobular ducts and the large ducts. Beside each level is the matching type. Canaliculus: bland canalicular, ALP below 3 times, transaminases below 5 times, contraceptives and anabolic steroids. Hepatocyte plus canaliculus: hepatocanalicular, ALP above 3 times, transaminases 2 to 10 times, chlorpromazine, Augmentin, erythromycin. Ductule: ductular, benoxaprofen. Small ducts destroyed: cholangiodestructive or vanishing bile ducts, paraquat, chlorpromazine. Large ducts narrowed: cholangiosclerotic, floxuridine, scolicides. A note says the duct levels are an accepted explanation, not from the book."
