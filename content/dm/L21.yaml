  # ---------- p260: definition and Fredrickson ----------
  - id: dm.L21.001
    kind: card
    topic: fredrickson
    front: On what basis did Fredrickson classify hyperlipoproteinemia in the 1960s?
    back: On the composition of serum lipoproteins; he described five phenotypes.
    src: { page: 260, quote: "During the 1960s, based on the composition of serum lipoproteins, Fredrickson suggested five different phenotypes of hyperlipoproteinemia . This classification became commonly used for distinguishing hyperlipidemic conditions." }
    status: unverified
  - id: dm.L21.002
    kind: table
    topic: fredrickson
    title: Fredrickson classification
    columns: [Phenotype, Lipoprotein elevated, Cholesterol, Triglyceride, "Frequency %"]
    rows:
      - [I, Chylomicrons, Normal to ↑, ↑↑↑↑, "<1"]
      - [IIa, LDL, ↑↑, Normal, "10"]
      - [IIb, LDL and VLDL, ↑↑, ↑↑, "40"]
      - [III, IDL, ↑↑, ↑↑↑, "<1"]
      - [IV, VLDL, Normal to ↑, ↑↑, "45"]
      - [V, VLDL and chylomicrons, ↑ to ↑↑, ↑↑↑↑, "6"]
    blanks: [[0, 1], [1, 1], [1, 3], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 260, quote: "Fredrickson Classification of Hyperlipidemia:\n| Phenotype | Lipoprotein(s) elevated | Serum cholesterol concentration | Serum triglyceride concentration | Relative frequency % |\n| I | Chylomicrons | Normal to ↑ | ↑↑↑↑ | <1 |\n| IIa | LDL | ↑↑ | Normal | 10 |\n| IIb | LDL and VLDL | ↑↑ | ↑↑ | 40 |\n| III | IDL | ↑↑ | ↑↑↑ | <1 |\n| IV | VLDL | Normal to ↑ | ↑↑ | 45 |\n| V | VLDL and chylomicrons | ↑ to ↑↑ | ↑↑↑↑ | 6 |" }
    status: unverified
    tags: [high-yield]
  - id: dm.L21.003
    kind: table
    topic: fredrickson
    title: Fredrickson phenotypes by frequency
    columns: [Phenotype, "Relative frequency %"]
    rows:
      - [IV, "45"]
      - [IIb, "40"]
      - [IIa, "10"]
      - [V, "6"]
      - [I and III, "<1 each"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 260, quote: "Fredrickson Classification of Hyperlipidemia:\n| Phenotype | Lipoprotein(s) elevated | Serum cholesterol concentration | Serum triglyceride concentration | Relative frequency % |\n| I | Chylomicrons | Normal to ↑ | ↑↑↑↑ | <1 |\n| IIa | LDL | ↑↑ | Normal | 10 |\n| IIb | LDL and VLDL | ↑↑ | ↑↑ | 40 |\n| III | IDL | ↑↑ | ↑↑↑ | <1 |\n| IV | VLDL | Normal to ↑ | ↑↑ | 45 |\n| V | VLDL and chylomicrons | ↑ to ↑↑ | ↑↑↑↑ | 6 |" }
