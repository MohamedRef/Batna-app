items:
  # ---------- p1-2: overview, GERD ----------
  - id: git.L01.001
    kind: enumerate
    topic: overview
    prompt: Enumerate the acid-related disorders listed at the start of the lecture.
    points:
      - Gastroesophageal reflux disease
      - Functional dyspepsia
      - Gastritis
      - Peptic ulcer
      - Zollinger-Ellison syndrome
    pass: 4
    src: { page: 1, quote: "Gastroesophageal reflux disease • Functional dyspepsia • Gastritis • Peptic ulcer • Zolinger ellisson syndrome" }
    status: unverified
  - id: git.L01.002
    kind: card
    topic: gerd
    front: Define GERD.
    back: The condition in which reflux of gastric contents into the esophagus causes symptoms and/or complications.
    src: { page: 1, quote: "GERD is the condition in which the reflux of gastric contents into the esophagus results in symptoms and/or complications." }
    status: unverified
    tags: [high-yield]
  - id: git.L01.003
    kind: cloze
    topic: gerd
    text: GERD is objectively defined by characteristic {{c1::mucosal injury at endoscopy}} and/or abnormal {{c2::esophageal acid exposure on a reflux monitoring study}}.
    src: { page: 1, quote: "characteristic mucosal injury seen at endoscopy and/or abnormal esophageal acid exposure demonstrated on a reflux monitoring study" }
    status: unverified
    tags: [high-yield]
  - id: git.L01.004
    kind: card
    topic: gerd
    front: Are GERD symptoms 100% specific?
    back: No. They are nonspecific and may overlap with or be confused with other disorders.
    src: { page: 2, quote: "The Symptoms of GERD are Nonspecific and may Overlap Or Be Confused With Those Of Other Disorders" }
    status: unverified
  - id: git.L01.005
    kind: enumerate
    topic: gerd
    prompt: Mention the disorders whose symptoms may overlap with or be confused with GERD.
    points:
      - Rumination
      - Achalasia
      - Eosinophilic esophagitis (EoE)
      - Reflux hypersensitivity
      - Functional heartburn
      - Cardiac or pulmonary disease
    pass: 5
    src: { page: 2, quote: "Rumination • Achalasia • Eosinophilic Esophagitis (EoE) • Reflux Hypersensitivity • Functional heartburn, Cardiac or Pulmonary Disease" }
    status: unverified
  - id: git.L01.006
    kind: card
    topic: gerd
    front: In the GERD case, how was the PPI first prescribed?
    back: Once daily, 30-60 minutes before breakfast, for 6 weeks.
    src: { page: 3, quote: "PPI was prescribed once daily 30- 60 minutes before breakfast for 6 weeks." }
    status: unverified
  # ---------- p3-6: PPI-refractory GERD ----------
  - id: git.L01.007
    kind: card
    topic: refractory-gerd
    front: In the GERD case, what was done after a partial response to once-daily PPI?
    back: The PPI was escalated to double dose. When symptoms persisted, the PPI was stopped for 2 weeks and upper endoscopy was done off PPI.
    src: { page: 3, quote: "Escalation of PPI dose was done to double dose for 6 weeks." }
    status: unverified
  - id: git.L01.008
    kind: enumerate
    topic: refractory-gerd
    prompt: Enumerate the potential mechanisms of symptoms suspected to be GERD but refractory to PPI therapy.
    points:
      - "Refractory GERD: abnormal acid reflux persists despite PPI and causes symptoms"
      - "Reflux hypersensitivity: PPI normalized acid exposure but physiologic reflux (acidic or non-acidic) evokes symptoms"
      - Other esophageal disorders (EoE, achalasia)
      - Non-esophageal disorders (rumination, gastroparesis)
      - "Functional: not due to GERD or any histopathologic, motility or structural abnormality"
    pass: 4
    src: { page: 3, quote: "Potential mechanisms underlying symptoms suspected due to GERD but refractory to PPI therapy" }
    status: unverified
    tags: [high-yield]
  - id: git.L01.009
    kind: card
    topic: refractory-gerd
    front: What is reflux hypersensitivity?
    back: PPIs have normalized acid exposure, but physiologic reflux episodes (acidic or non-acidic) still evoke symptoms.
    src: { page: 3, quote: "reflux hypersensitivity, a condition in which PPI have normalized acid exposure but physiologic reflux episodes(acidic or non acidic) evoke symptoms" }
    status: unverified
  - id: git.L01.010
    kind: card
    topic: refractory-gerd
    front: What is refractory GERD (as a mechanism of PPI-refractory symptoms)?
    back: Abnormal acid reflux persists despite PPI therapy and is causing the symptoms.
    src: { page: 3, quote: "Refractory GERD: Despite PPI therapy, abnormal acid reflux persist and is causing symptoms" }
    status: unverified
  - id: git.L01.011
    kind: card
    topic: refractory-gerd
    front: Why stop the PPI before endoscopy in suspected GERD? (reason 1)
    back: To maximize the yield for GERD and assess for erosive esophagitis. PPIs heal erosive esophagitis so well that underlying EE can be missed.
    src: { page: 4, quote: "Because PPIs are highly effective for healing EE, underlying EE clearly can be missed." }
    status: unverified
    tags: [high-yield, book-question]
  - id: git.L01.012
    kind: cloze
    topic: refractory-gerd
    text: Stopping PPIs for {{c1::2-4 weeks}} before endoscopy also helps diagnose {{c2::eosinophilic esophagitis (EoE)}}.
    src: { page: 4, quote: "Stopping PPIs for 2–4 weeks also will facilitate a diagnosis of EoE" }
    status: unverified
    tags: [numbers]
  - id: git.L01.013
    kind: order
    topic: refractory-gerd
    prompt: Put the book's algorithm for PPI-refractory GERD in order.
    steps:
      - Troublesome GERD symptoms despite single-dose PPI
      - 8-week double-dose PPI trial
      - No symptom response
      - "Assess for objective GERD despite double-dose PPI: erosive disease on EGD, or pH-impedance on PPI with elevated acid exposure time or reflux burden"
      - PPI-refractory GERD
    src: { page: 4, quote: "8 wk double-dose PPI trial" }
    status: unverified
    tags: [high-yield, book-question]
  - id: git.L01.014
    kind: enumerate
    topic: refractory-gerd
    prompt: What endoscopic findings on double-dose PPI count as objective erosive GERD in the refractory-GERD algorithm?
    points:
      - LA grade C or D esophagitis
      - Peptic stricture
      - Barrett esophagus
    pass: 3
    src: { page: 4, quote: "Erosive disease on EGD (LA Grade © or D Esophagitis, Peptic No symptom stricture, Barret hagus)" }
    status: unverified
  - id: git.L01.015
    kind: cloze
    topic: refractory-gerd
    text: "LA grade C esophagitis: mucosal breaks extending between the tops of {{c1::two or more}} mucosal folds but involving less than {{c2::75%}} of the esophageal circumference."
    src: { page: 4, quote: "Mucosal breaks that extend between the tops of two or" }
    status: unverified
    tags: [numbers]
  - id: git.L01.016
    kind: card
    topic: refractory-gerd
    front: If objective GERD has not been diagnosed before, how should impedance-pH testing be done?
    back: Off PPI therapy (wireless or catheter-based), to look for baseline GERD.
    src: { page: 5, quote: "Initial impedance pH testing should be performed off PPI therapy" }
    status: unverified
    tags: [high-yield]
  - id: git.L01.017
    kind: card
    topic: refractory-gerd
    front: In a patient already proven to have pathologic GERD, how does the work-up for refractory symptoms begin?
    back: Esophageal pH-impedance monitoring ON PPI therapy, to look for PPI-refractory acid exposure.
    src: { page: 5, quote: "Diagnostic evaluation begins with esophageal pH-impedance monitoring on PPI therapy to assess for PPI refractory acid exposure." }
    status: unverified
    tags: [high-yield]
  - id: git.L01.018
    kind: enumerate
    topic: refractory-gerd
    prompt: Which findings mean a patient was previously diagnosed with pathologic GERD?
    points:
      - LA grade C or D esophagitis
      - Peptic stricture
      - Barrett's esophagus
      - Pathologic acid exposure off PPI on esophageal pH monitoring
    pass: 3
    src: { page: 5, quote: "LA Grade C or D esophagitis, peptic stricture, Barrett‘s esophagus, or pathologic acid exposure off PPI on esophageal pH monitoring" }
    status: unverified
  - id: git.L01.019
    kind: cloze
    topic: refractory-gerd
    text: According to the GERD Consensus Group, esophageal acid exposure time greater than {{c1::6%}} {{c2::on PPI}} is consistent with PPI-refractory GERD.
    src: { page: 5, quote: "esophageal acid exposure time greater than 6% on PPI is consistent with PPI refractory GERD." }
    status: unverified
    tags: [high-yield, numbers]
  - id: git.L01.020
    kind: card
    topic: refractory-gerd
    front: What is a common, useful result of off-PPI pH testing in suspected refractory GERD?
    back: It is not infrequently negative for GERD, which steers the evaluation and management away from GERD.
    src: { page: 5, quote: "Not infrequently, pH testing in these scenarios is negative for GERD and helps to guide the evaluation and management away from GERD." }
    status: unverified
  - id: git.L01.021
    kind: card
    topic: eoe
    front: Endoscopy in the GERD case could be LA grade D esophagitis or eosinophilic esophagitis. How do you tell them apart?
    back: By biopsy, which is taken even if the endoscopy looks normal.
    src: { page: 6, quote: "GERD LA grade D or esinophil esophagitis Differentiate by biopsy Even if endoscopy is within normal" }
    status: unverified
  # ---------- p7: EoE ----------
  - id: git.L01.022
    kind: cloze
    topic: eoe
    text: For the endoscopic diagnosis of EoE, at least {{c1::six}} biopsies are taken from the {{c2::distal and mid/proximal}} esophagus.
    src: { page: 7, quote: "at least six biopsy samples taken from the distal and mid/proximal esophagus are recommended." }
    status: unverified
    tags: [high-yield, numbers]
  - id: git.L01.023
    kind: card
    topic: eoe
    front: Should esophageal biopsies be taken if EoE is suspected but the mucosa looks normal?
    back: Yes. Biopsies are taken regardless of the endoscopic appearance.
    src: { page: 7, quote: "The biopsy samples should be obtained regardless of the endoscopic appearance if EoE is suspected." }
    status: unverified
  - id: git.L01.024
    kind: cloze
    topic: eoe
    text: EoE is diagnosed with intraepithelial eosinophils {{c1::≥15}} in {{c2::≥2 hpfs}} or {{c3::≥25 in any single hpf}}.
    src: { page: 7, quote: "Eosinophilic esophagitis is diagnosed with intraepithelial eosinophils ≥15 in ≥2 hpfs or ≥25 in any single hpf." }
    status: unverified
    tags: [high-yield, numbers]
  # ---------- p7-11: dyspepsia ----------
  - id: git.L01.025
    kind: card
    topic: dyspepsia
    front: What is dyspepsia?
    back: An umbrella term for a number of relatively nonspecific symptoms thought to come from the upper GI tract.
    src: { page: 7, quote: "Dyspepsia is an umbrella term used to encompass a number of symptoms thought to originate from the upper gastrointestinal tract." }
    status: unverified
  - id: git.L01.026
    kind: card
    topic: dyspepsia
    front: What is the clinician's first challenge in dyspepsia?
    back: Detecting the minority with a potentially life-threatening disorder (such as gastric cancer) among patients whose symptoms are mostly functional.
    src: { page: 8, quote: "detecting the minority who may have a potentially lifethreatening disorder, such as gastric cancer" }
    status: unverified
  - id: git.L01.027
    kind: enumerate
    topic: dyspepsia
    prompt: Enumerate the alarm features in dyspepsia.
    points:
      - "Clinically significant unintentional weight loss (>5% of usual body weight over 6-12 months)"
      - "Overt GI bleeding (hematemesis, hematochezia, melena)"
      - Dysphagia
      - Odynophagia
      - Unexplained iron deficiency anemia
      - Persistent vomiting
      - Palpable mass or lymphadenopathy
      - Family history of upper GI cancer
    pass: 6
    src: { page: 8, quote: "Unexplained iron deficiency anemia Persistent vomiting Palpable mass or lymphadenopathy" }
    status: unverified
    tags: [high-yield]
  - id: git.L01.028
    kind: cloze
    topic: dyspepsia
    text: As an alarm feature, significant weight loss means unintentional loss of more than {{c1::5%}} of usual body weight over {{c2::6 to 12 months}}.
    src: { page: 8, quote: "Clinically significant, unintentional weight loss (>5% usual body weight over 6 to 12 months)" }
    status: unverified
    tags: [numbers]
  - id: git.L01.029
    kind: card
    topic: dyspepsia
    front: How do alarm features divide dyspepsia in the lecture?
    back: If any alarm feature is present, the dyspepsia is due to an organic cause. If none is present, it is functional.
    src: { page: 8, quote: "If any of the above alarm features is present then the dyspepsia is due to organic cause. If not then it is functional" }
    status: unverified
  - id: git.L01.030
    kind: enumerate
    topic: dyspepsia
    prompt: Mention the factors in the pathophysiology of functional dyspepsia (book Figure 1).
    points:
      - Delayed gastric emptying
      - Impaired fundic accommodation
      - Visceral hypersensitivity
      - H. pylori
      - Enteric pathogens (post-infection)
      - Intraduodenal acid and lipid
      - Duodenal eosinophilia, inflammation and immune activation
      - "Not in the figure: diet and lifestyle (tobacco, alcohol, NSAIDs) and psychosocial factors (stress, anxiety, depression)"
    pass: 5
    src: { page: 9, quote: "Not included in the figure: diet and lifestyle factors (eg, tobacco, alcohol, nonsteroidal anti-inflammatory drug use)" }
    status: unverified
  - id: git.L01.031
    kind: card
    topic: dyspepsia
    front: Which tests were done in the functional dyspepsia case before deciding on endoscopy?
    back: Hemoglobin, H. pylori stool antigen, TSH and free T4, celiac serology, and ECG.
    src: { page: 9, quote: "Stool antigen for H pylori negative • TSH and Free T4 are normal • Celiac serology negative • ECG is within normal" }
    status: unverified
  - id: git.L01.032
    kind: card
    topic: dyspepsia
    front: Do all patients with dyspepsia need endoscopy?
    back: No, only specific groups. Most patients are offered non-invasive H. pylori "test and treat" instead.
    src: { page: 10, quote: "Are you going to ask for endoscope? NO except" }
    status: unverified
  - id: git.L01.033
    kind: enumerate
    topic: dyspepsia
    prompt: In dyspepsia without other alarm features, when is URGENT endoscopy warranted?
    points:
      - Age ≥55 years with dyspepsia and weight loss
      - Age >40 years from an area with increased gastric cancer risk
      - Family history of gastro-esophageal cancer
    pass: 3
    src: { page: 10, quote: "urgent endoscopy is warranted in - Patients aged ≥55 years with dyspepsia with weight loss," }
    status: unverified
    tags: [high-yield, numbers]
  - id: git.L01.034
    kind: cloze
    topic: dyspepsia
    text: Non-urgent endoscopy is considered at age {{c1::≥55 years}} with {{c2::treatment-resistant dyspepsia}}, or dyspepsia with a raised platelet count or nausea or vomiting.
    src: { page: 10, quote: "non-urgent endoscopy is considered in patients aged ≥55 years with treatment-resistant dyspepsia" }
    status: unverified
    tags: [numbers]
  - id: git.L01.035
    kind: cloze
    topic: dyspepsia
    text: Urgent abdominal {{c1::CT}} is considered at age {{c2::≥60 years}} with abdominal pain and weight loss, to exclude {{c3::pancreatic cancer}}.
    src: { page: 10, quote: "urgent abdominal CT scanning is considered in patients aged ≥60 years with abdominal pain and weight loss to exclude pancreatic cancer" }
    status: unverified
    tags: [numbers]
  - id: git.L01.036
    kind: card
    topic: dyspepsia
    front: What is offered to all other patients with dyspepsia (no indication for endoscopy)?
    back: Non-invasive testing for H. pylori ("test and treat"), with eradication therapy if infected.
    src: { page: 10, quote: "all other patients with dyspepsia are offered noninvasive testing for Helicobacter pylori (‗test and treat‘)" }
    status: unverified
    tags: [high-yield]
  - id: git.L01.037
    kind: card
    topic: dyspepsia
    front: After "test and treat", in whom is successful H. pylori eradication confirmed (BSG dyspepsia recommendations quoted in the lecture)?
    back: Only in patients with an increased risk of gastric cancer.
    src: { page: 11, quote: "successful eradication of H. pylori after ‗test and treat‘ is only confirmed in patients with an increased risk of gastric cancer" }
    status: unverified
  - id: git.L01.038
    kind: card
    topic: dyspepsia
    front: What is offered to dyspepsia patients without H. pylori infection?
    back: Empirical acid suppression therapy.
    src: { page: 11, quote: "patients without H. pylori infection are offered empirical acid suppression therapy" }
    status: unverified
  - id: git.L01.039
    kind: enumerate
    topic: dyspepsia
    prompt: Mention the key causes of organic dyspepsia (book algorithm, p. 11).
    points:
      - Peptic ulcer disease
      - H. pylori gastritis
      - Symptomatic gallstone disease
      - Medications (e.g. NSAIDs)
      - Pancreatitis
      - Gastric or esophageal cancer
    pass: 4
    src: { page: 11, quote: "Key causes of organic dyspepsia * Peptic ulcer disease = 4 pylori gastritis Symptomatic gallstone disease" }
    status: unverified
  - id: git.L01.040
    kind: enumerate
    topic: dyspepsia
    prompt: Functional dyspepsia is diagnosed when all of which three are true (book algorithm inset)?
    points:
      - Persistent symptoms for the prior 3 months
      - Symptom onset at least 6 months before diagnosis
      - No evidence of structural disease to explain the symptoms
    pass: 3
    src: { page: 11, quote: "Persistent symptoms for the Yes prior 3 months" }
    status: unverified
    tags: [numbers]
  - id: git.L01.041
    kind: card
    topic: dyspepsia
    front: Which non-invasive tests does the book's dyspepsia algorithm use for H. pylori?
    back: The stool antigen test or the urea breath test.
    src: { page: 11, quote: "Test for #. pytori infection (refer to inset) with either: Treat based om undertying disease = Stoo! antigen test * Urea breath test" }
    status: unverified
  # ---------- p12-15: gastritis ----------
  - id: git.L01.042
    kind: card
    topic: gastritis
    front: The dyspepsia patient returned with melena and Hb 10.5 g/dL. What did endoscopy show?
    back: Antral gastritis and a peptic ulcer in the duodenal bulb.
    src: { page: 12, quote: "Diagnosis : Antral gastritis and peptic ulcer in the duodenal bulb" }
    status: unverified
  - id: git.L01.043
    kind: card
    topic: gastritis
    front: In a duodenal bulb ulcer with antral gastritis, where are biopsies taken and why?
    back: From the antrum, incisura, fundus and body for gastritis topography, plus a rapid urease test. A duodenal ulcer itself is not biopsied.
    src: { page: 12, quote: "From antrum, incisura, fundus and body for topography of gastritis" }
    status: unverified
  - id: git.L01.044
    kind: card
    topic: gastritis
    front: Define chronic gastritis.
    back: Chronic inflammatory mucosal changes, without erosions, that eventually lead to mucosal atrophy and intestinal metaplasia.
    src: { page: 12, quote: "chronic inflammatory mucosal changes leading eventually to mucosal atrophy and intestinal metaplasia in absence of erosions" }
    status: unverified
    tags: [high-yield]
  - id: git.L01.045
    kind: cloze
    topic: gastritis
    text: The two main histologic features of chronic gastritis are {{c1::infiltration of the lamina propria by inflammatory cells}} and {{c2::atrophy of the glandular epithelium}}.
    src: { page: 12, quote: "The two main features are infiltration of the lamina propria by inflammatory cells and atrophy of glandular epithelium" }
    status: unverified
  - id: git.L01.046
    kind: card
    topic: gastritis
    front: What does the Updated Sydney System combine to classify and grade gastritis?
    back: Topographical, morphological and etiological information.
    src: { page: 12, quote: "combining topographical, morphological, and etiological information to help arrive at clinical diagnosis." }
    status: unverified
  - id: git.L01.047
    kind: card
    topic: gastritis
    front: Which system is used for gastritis staging in clinical practice, and what does it combine?
    back: OLGA (Operative Link on Gastritis Assessment). It combines the atrophy score (from biopsy) with the atrophy topography (from directed biopsy mapping).
    src: { page: 13, quote: "gastritis staging is done using the OLGA (Operative Link on Gastritis Assessment) staging system" }
    status: unverified
    tags: [high-yield]
  - id: git.L01.048
    kind: table
    topic: gastritis
    title: Types of chronic gastritis in the Updated Sydney System (book p13)
    columns: [Type, Etiology, Synonyms]
    rows:
      - [Non-atrophic, "H. pylori, other factors", "Superficial, diffuse antral (DAG), chronic antral (CAG), interstitial-follicular, hypersecretory, type B"]
      - [Atrophic autoimmune, Autoimmunity, "Type A, diffuse corporal, pernicious anemia-associated"]
      - [Multifocal atrophic, "H. pylori, dietary, environmental", "Type B, type AB, environmental, metaplastic"]
      - [Chemical, "Chemical irritation, bile, NSAIDs, other agents", "Reactive, reflux, NSAID, type C"]
      - [Lymphocytic, "Idiopathic or immune, gluten, ticlopidine, H. pylori", "Varioliform, celiac disease-associated"]
      - [Eosinophilic, "Food sensitivity, other allergies", Allergic]
    blanks: [[0, 1], [1, 1], [1, 2], [2, 1], [3, 2], [4, 1], [5, 1]]
    src: { page: 13, quote: "Diffuse antral gastriis (DAG)" }
    status: unverified
  - id: git.L01.049
    kind: enumerate
    topic: gastritis
    prompt: Enumerate the special forms of gastritis in the Sydney table.
    points:
      - Chemical
      - Radiation
      - Lymphocytic
      - Noninfectious granulomatous (Crohn's, sarcoidosis, GPA and vasculitides, foreign substances, idiopathic)
      - Eosinophilic
      - Other infectious gastritides (bacteria other than H. pylori, viruses, fungi)
    pass: 4
    src: { page: 13, quote: "Granuiomatosis with polyanaitis and other vasculfides" }
    status: unverified
  - id: git.L01.050
    kind: card
    topic: gastritis
    front: Define autoimmune (type A) gastritis.
    back: A chronic inflammatory disorder of the oxyntic (acid-secreting) mucosa that leads to progressive mucosal atrophy.
    src: { page: 14, quote: "Chronic inflammatory disorder affecting the oxyntic (acid-secreting gastric compartment) mucosa, leading to progressive mucosal atrophy." }
    status: unverified
  - id: git.L01.051
    kind: card
    topic: gastritis
    front: Which part of the stomach does autoimmune gastritis spare, and why does that matter?
    back: The antrum. Inflammation is restricted to the corpus and fundus, which distinguishes AIG from other causes of atrophic gastritis such as H. pylori.
    src: { page: 14, quote: "The inflammation is restricted to the corpus and fundus, sparing the antrum" }
    status: unverified
    tags: [high-yield]
  - id: git.L01.052
    kind: cloze
    topic: gastritis
    text: Parietal (oxyntic) cells secrete {{c1::HCl}} and produce {{c2::intrinsic factor}}, the vitamin B12-binding glycoprotein.
    src: { page: 14, quote: "Parietal cells (oxyntic cells) have two main functions: HCL secretion and intrinsic factor (vitamin B12-binding glycoprotein) production." }
    status: unverified
  - id: git.L01.053
    kind: card
    topic: gastritis
    front: How does autoimmune gastritis cause anemia?
    back: Anti-parietal cell antibodies (APCA) destroy parietal cells, which impairs iron and vitamin B12 absorption and leads to megaloblastic anemia.
    src: { page: 14, quote: "destruction of these cells due to APCA (anti-parietal cell antibodies) leads to impairment of iron and vit B12 absorption" }
    status: unverified
  - id: git.L01.054
    kind: cloze
    topic: gastritis
    text: Hyposplenism, defined by a pitted RBC count of {{c1::>4%}}, is found in {{c2::55%}} of patients with autoimmune gastritis.
    src: { page: 14, quote: "Defective spleen function (hyposplenism), defined by a pitted RBC count of >4%, has been found in 55% of patients with AIG" }
    status: unverified
    tags: [numbers]
  - id: git.L01.055
    kind: enumerate
    topic: gastritis
    prompt: Mention the diseases associated with autoimmune gastritis.
    points:
      - Hashimoto thyroiditis
      - Type 1 diabetes mellitus
      - Addison disease
      - Vitiligo
    pass: 3
    src: { page: 14, quote: "Association with Hashimoto thyroiditis, type 1 DM, Addison and vitiligo." }
    status: unverified
  - id: git.L01.056
    kind: card
    topic: gastritis
    front: What does the corpus look like endoscopically in autoimmune gastritis?
    back: Marked vascular visibility on the lesser curvature and the entire greater curvature (atrophic pattern).
    src: { page: 14, quote: "corpus showing marked vascular visibility both on the lesser curvature and the entire greater curvature." }
