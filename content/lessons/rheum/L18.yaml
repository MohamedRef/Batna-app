  - id: rheum.L18.lesson3
    title: "عدّاد النقط والعلاج: 2016 criteria وEULAR 2019"
    hook: "تلات نقط للـ biopsy، تلاتة للـ anti-Ro، ونقطة لكل اختبار ناشف. محتاج 4."
    minutes: 10
    pages: [305, 308]
    topics: [criteria, investigations, management]
    goals:
      - "تحسب الـ 2016 ACR-EULAR score"
      - "تعرف الـ inclusion والـ exclusion"
      - "تمشي على علاج الجفاف والمرض الـ systemic حسب EULAR 2019"
    status: unverified
    steps:
      - kind: explain
        page: 305
        title: "تلات بوابات"
        quote: "The classification of SS applies to any individual who meets the inclusion criteria"
        text: |
          علشان تصنّف حد **primary Sjögren** بالـ **2016 ACR-EULAR** لازم يعدّي تلات بوابات:

          1. **Inclusion:** عَرَض جفاف واحد على الأقل
          2. **No exclusion**
          3. ==Score ≥4== من البنود الموزونة
      - kind: figure
        page: 305
        quote: "Labial salivary gland with focal lymphocytic sialadenitis and focus score ≥ 1. (score: 3). • Anti-SSA (Ro) + (score: 3)."
        title: "عدّاد النقط"
        alt: "Point counter for the 2016 ACR-EULAR criteria. Two large tiles worth 3 points each: labial gland biopsy with focus score at least 1, and anti-SSA Ro positive. Three small tiles worth 1 point each: ocular staining score at least 5 or van Bijsterveld at least 4, Schirmer at most 5 mm in 5 minutes, unstimulated saliva flow at most 0.1 ml per minute. A bar at the bottom marks the threshold of 4."
        caption: "الـ **biopsy** والـ **anti-Ro** تقال (3 لكل واحد). الاختبارات الوظيفية خفاف (1 لكل واحد). لو المجموع ==4 أو أكتر== يبقى classified."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="15" y="10" width="145" height="80" rx="12" class="fg-acc"/>
            <text x="87" y="40" text-anchor="middle" class="t-lg t-b t-acc">3</text>
            <text x="87" y="62" text-anchor="middle" class="t-sm">Labial biopsy</text>
            <text x="87" y="78" text-anchor="middle" class="t-sm">focus score ≥1</text>
            <rect x="170" y="10" width="145" height="80" rx="12" class="fg-acc"/>
            <text x="242" y="40" text-anchor="middle" class="t-lg t-b t-acc">3</text>
            <text x="242" y="62" text-anchor="middle" class="t-sm">Anti-SSA (Ro)</text>
