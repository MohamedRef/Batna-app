  # ---------- p146: pathophysiology ----------
  - id: neph.L07.006
    kind: card
    topic: adpkd-path
    front: Where do polycystin-1 and polycystin-2 sit, and what is polycystin-2?
    back: Together in the cilia of renal collecting duct epithelial cells. Polycystin-1 is a membrane receptor signalling protein; polycystin-2 is a calcium-permeable channel.
    src: { page: 146, quote: "Pathophysiology Polycystin-1 is a membrane receptor signalling protein that co-localizes with polycystin-2 (a calcium-permeable channel) within the cilia of renal collecting duct epithelial cells. This polycystin complex acts as an extra-cellular mechanosensor (luminal flow disturbs the cilia and triggers the apparatus) that assists in the regulation of cell proliferation, adhesion, differentiation, and maturation (→ all ultimately maintain tubular integrity and calibre). Failure of normal polycystin complex formation results in dysregulated cell turnover and uncontrolled cell proliferation in response to growth factors. Proliferating tubular cells form tubular cysts that close off the associated nephron and expand in size over time. It is estimated that <1% of nephrons undergo such cystic transforma-" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.007
    kind: card
    topic: adpkd-path
    front: What does the polycystin complex normally do?
    back: It is an extracellular mechanosensor (luminal flow bends the cilia) that regulates cell proliferation, adhesion, differentiation and maturation, keeping tubular integrity and calibre.
    src: { page: 146, quote: "Pathophysiology Polycystin-1 is a membrane receptor signalling protein that co-localizes with polycystin-2 (a calcium-permeable channel) within the cilia of renal collecting duct epithelial cells. This polycystin complex acts as an extra-cellular mechanosensor (luminal flow disturbs the cilia and triggers the apparatus) that assists in the regulation of cell proliferation, adhesion, differentiation, and maturation (→ all ultimately maintain tubular integrity and calibre). Failure of normal polycystin complex formation results in dysregulated cell turnover and uncontrolled cell proliferation in response to growth factors. Proliferating tubular cells form tubular cysts that close off the associated nephron and expand in size over time. It is estimated that <1% of nephrons undergo such cystic transforma-" }
    status: unverified
  - id: neph.L07.008
    kind: order
    topic: adpkd-path
    prompt: Order how a cyst forms in ADPKD.
    steps:
      - The polycystin complex fails to form
      - Cell turnover is dysregulated with uncontrolled proliferation to growth factors
      - Proliferating tubular cells form a cyst
      - The cyst closes off its nephron and expands over time
    src: { page: 146, quote: "Pathophysiology Polycystin-1 is a membrane receptor signalling protein that co-localizes with polycystin-2 (a calcium-permeable channel) within the cilia of renal collecting duct epithelial cells. This polycystin complex acts as an extra-cellular mechanosensor (luminal flow disturbs the cilia and triggers the apparatus) that assists in the regulation of cell proliferation, adhesion, differentiation, and maturation (→ all ultimately maintain tubular integrity and calibre). Failure of normal polycystin complex formation results in dysregulated cell turnover and uncontrolled cell proliferation in response to growth factors. Proliferating tubular cells form tubular cysts that close off the associated nephron and expand in size over time. It is estimated that <1% of nephrons undergo such cystic transforma-" }
    status: unverified
  - id: neph.L07.009
    kind: cloze
    topic: adpkd-path
    text: "Fewer than {{c1::1%}} of nephrons undergo cystic transformation in ADPKD."
    src: { page: 146, quote: "Pathophysiology Polycystin-1 is a membrane receptor signalling protein that co-localizes with polycystin-2 (a calcium-permeable channel) within the cilia of renal collecting duct epithelial cells. This polycystin complex acts as an extra-cellular mechanosensor (luminal flow disturbs the cilia and triggers the apparatus) that assists in the regulation of cell proliferation, adhesion, differentiation, and maturation (→ all ultimately maintain tubular integrity and calibre). Failure of normal polycystin complex formation results in dysregulated cell turnover and uncontrolled cell proliferation in response to growth factors. Proliferating tubular cells form tubular cysts that close off the associated nephron and expand in size over time. It is estimated that <1% of nephrons undergo such cystic transforma-" }
    status: unverified
    tags: [numbers]
  - id: neph.L07.010
    kind: card
    topic: adpkd-path
    front: In the ADPKD signal pathway figure, how does vasopressin drive cyst growth?
    back: AVP on the V2 receptor activates adenylyl cyclase 6, raising cAMP. cAMP activates PKA, which drives CFTR chloride (fluid) secretion and, through Src, MAPK and mTOR, cell proliferation. Low intracellular Ca removes the brake on cAMP.
    src: { page: 146, quote: "Signal Pathway\nLegend: Reduced in PKD; Increased in PKD\nPC1, PC2 (cilium) → Ca2+\nPC2 → Ca2+\nCa2+ → PDE1 (cAMP → AMP)\nCa2+ ⊣ AC6\nAVP → V2R → Gs → AC6\nSST → SSTR → Gi ⊣ AC6\nAC6: ATP → cAMP\ncAMP → PKA\nPKA → CFTR → Cl− → Fluid secretion\nTKR → Src\nPKA → Src → MAPK → mTOR → Cell proliferation" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.011
    kind: card
    topic: adpkd-path
    front: In the signal pathway figure, how does somatostatin oppose cyst growth?
    back: Somatostatin on its receptor (SSTR) acts through Gi to inhibit adenylyl cyclase 6, lowering cAMP.
    src: { page: 146, quote: "Signal Pathway\nLegend: Reduced in PKD; Increased in PKD\nPC1, PC2 (cilium) → Ca2+\nPC2 → Ca2+\nCa2+ → PDE1 (cAMP → AMP)\nCa2+ ⊣ AC6\nAVP → V2R → Gs → AC6\nSST → SSTR → Gi ⊣ AC6\nAC6: ATP → cAMP\ncAMP → PKA\nPKA → CFTR → Cl− → Fluid secretion\nTKR → Src\nPKA → Src → MAPK → mTOR → Cell proliferation" }
    status: unverified
  # ---------- p147: epidemiology and clinical ----------
  - id: neph.L07.012
    kind: cloze
    topic: adpkd-genetics
    text: "The prevalence of genetically affected individuals at birth is about 1 in {{c1::400}} to 1 in {{c2::1000}}."
    src: { page: 147, quote: "ADPKD occurs worldwide and in all races, with a prevalence of geneti- cally affected individuals at birth estimated at 1 in 400 to 1 in 1000. In most patients the diagnosis is made decades later, and some patients are never diagnosed. Therefore, at any point in time, only a fraction of genetically affected individuals are aware of having the disease. Clinical Patients may present with a family history of ADPKD. A careful history for renal disease, ↑ BP, stroke (intracranial haemorrhage), or premature death may pinpoint carriers of the gene mutation. Inheritance is autosomal dominant, so 50% of offspring should be affected." }
    status: unverified
    tags: [numbers]
