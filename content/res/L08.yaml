    src: { page: 37, quote: "Macular degeneration is a leading cause of blindness. City residents aged 43 to 86 years were asked to participate in a recent study to determine the relation between smoking and macular degeneration. At a baseline examination, 1232 participant were found to be free from macular degeneration and were asked to report their life time smoking habits. After 5 years, participants had an examination to determine the development of macular degeneration. Out of 368 never smoked, 26 developed macular degeneration and out of 864 ever smoked,79 developed macular degeneration at the end of the study.\n  a) Cross sectional\n  b) Case control\n  c) Correlation study\n  d) Prospective cohort\n  e) Retrospective cohort" }
