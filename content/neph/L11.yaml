    src: { page: 378, quote: "Hemodialysis During Pregnancy Intensive hemodialysis is recommended during pregnancy because it is associated with better fetal and maternal outcomes. Up to 36 hours of dialysis weekly is recommended for women, targeting predialysis serum blood urea nitrogen of<50mg/dL. In a series of 344 pregnancies, Okundaye et al(79) observed that infants born to women who had>20 hours/wk of dialysis had prolonged gestational age and a higher birth weight. Intensive hemodialysis is associated with improved pregnancy outcomes with a lower incidence of prematurity, a higher incidence of live birth rate, higher birth weight, and lower neonatal mortality rates.(78)" }
    status: unverified
  - id: neph.L11.143
    kind: card
    topic: hd-rx
    front: Why are biocompatible single-use dialyzers recommended in pregnancy?
    back: To avoid fetal toxicity from reuse agents such as formaldehyde and ethylene oxide.
    src: { page: 378, quote: "To achieve a predialysis blood urea of less than 50mg/dL, 4-6 sessions of 4-6 hours of dialysis per week are usually needed. Frequent dialysis is aimed at maintaining adequate uteroplacental flow without compromising on net fluid removal. Biocompatible and single-use dialyzers are recommended to prevent fetal toxicity secondary to reuse agents such as formaldehyde and ethylene oxide. A biocompatible and single-use dialyzer is preferred. Respiratory alkalosis with compensated metabolic acidosis is usually seen during pregnancy. Hence, dialyzing a pregnant woman would mandate low bicarbonate dialysate to avoid alkalemia. Although the data are limited, it is recommended to use a dialysate bath with 25-30mmol/L bicarbonate during pregnancy. To minimize" }
    status: unverified
