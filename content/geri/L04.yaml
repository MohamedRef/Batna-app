  # ---------- p70-73: diagnosis ----------
  - id: geri.L04.064
    kind: card
    topic: delirium-diagnosis
    front: What does DSM-5 criterion A for delirium require?
    back: A disturbance in attention (reduced ability to direct, focus, sustain and shift attention) and awareness (reduced orientation to the environment).
    src: { page: 70, quote: "A disturbance in attention (i.e., reduced ability to direct, focus, sustain, and shift attention) and awareness" }
    status: unverified
  - id: geri.L04.065
    kind: enumerate
    topic: delirium-diagnosis
    prompt: Enumerate the DSM-5 elements of delirium as the lecture summarises them.
    points: [Disturbance of consciousness, Change in cognition, Develops over a short period, "Evidence from history, examination (or labs) of a cause"]
    pass: 4
    src: { page: 70, quote: "Disturbance of consciousness. • Change in cognition. • The disturbance develops over a short period." }
    status: unverified
  - id: geri.L04.066
    kind: card
    topic: delirium-diagnosis
    front: Which DSM-5 criterion excludes delirium?
    back: The disturbances are not explained by another pre-existing or evolving neurocognitive disorder and do not occur with severely reduced arousal such as coma.
    src: { page: 70, quote: "do not occur in the context of a severely reduced level of arousal, such as coma." }
    status: unverified
  - id: geri.L04.067
    kind: enumerate
    topic: delirium-diagnosis
    prompt: Enumerate the 9 delirium features assessed by the Confusion Assessment Method (CAM).
    points: [Acute onset, Inattention, Disorganised thinking, Altered level of consciousness, Disorientation, Memory impairment, Perceptual disturbances, Psychomotor agitation or retardation, Altered sleep-wake cycle]
    pass: 7
    src: { page: 70, quote: "Acute onset, inattention, disorganized thinking, altered level of consciousness, disorientation, memory impairment, perceptual disturbances" }
    status: unverified
  - id: geri.L04.068
    kind: card
    topic: delirium-diagnosis
    front: State the CAM diagnostic algorithm.
    back: "Feature 1 (acute onset and fluctuating course) AND feature 2 (inattention), plus EITHER feature 3 (disorganised thinking) OR feature 4 (altered level of consciousness)."
    src: { page: 71, quote: "In which the first 2 and either of the latter 2 are required for diagnosis." }
    status: unverified
    tags: [high-yield]
  - id: geri.L04.069
    kind: cloze
    topic: delirium-diagnosis
    text: "The Delirium Rating Scale has {{c1::16}} items ({{c2::13}} for severity, 3 diagnostic), each scored 0-3; a severity score above {{c3::15}} or a total above 18 indicates delirium."
    src: { page: 71, quote: "It has 16- items 13 of which assess the severity. 3 items are of diagnostic significance." }
    status: unverified
    tags: [numbers]
  - id: geri.L04.070
    kind: card
    topic: delirium-diagnosis
    front: Describe the Memorial Delirium Assessment Scale (MDAS).
    back: "10 items, each rated 0-3, covering arousal and level of consciousness, memory, attention, orientation, thinking disturbances and psychomotor activity, based on the current interaction or behaviour over the past several hours."
    src: { page: 72, quote: "It has 10 items which assesses disturbances in arousal and level of consciousness" }
    status: unverified
  - id: geri.L04.071
    kind: enumerate
    topic: delirium-diagnosis
