      - kind: check
        page: 43
        quote: "Natriuretic peptides\n  Secreted by the heart:\n    atrial natriuretic peptide (ANP)\n    brain natriuretic peptide (BNP)\n  Secreted by endothelium:\n    C-type natriuretic"
        question: "Which natriuretic peptide comes from the endothelium?"
        options: ["C-type natriuretic peptide", "ANP", "BNP", "Endothelin-1"]
        answer: 0
        why:
          - "صح: الـ CNP من الـ endothelium."
          - "الـ ANP من القلب."
          - "الـ BNP من القلب."
          - "الـ endothelin (ET) مش natriuretic peptide."
      - kind: explain
        page: 44
        quote: "The ETs are potent hypertensive agents that exert their effects directly on the VSMCs Adrenomedullin (Am) The peptide is produced in normal chromaffin cells of the adrenal gland, as well as a variety of other tissues, including brain, kidney, endothelial cells, and VSMCs."
        title: "Endothelins و Adrenomedullin: واحد بيرفع وواحد بيوقّع"
        text: |
          - ==Endothelins== (ET-1، ET-2، ET-3): **potent hypertensive agents**. بيرفعوا الضغط لأنهم بيشتغلوا **مباشرة** على الـ vascular smooth muscle cells (VSMCs)، يعني مش محتاجين وسيط: العضلة بتنقبض، الوعاء يضيق، والمقاومة تعلى.
          - ==Adrenomedullin (AM)==: بيتعمل في الـ **chromaffin cells** في الـ adrenal (ومن هنا الاسم: adreno-medullin)، وكمان من المخ والكلية والـ endothelium والـ VSMCs. الكتاب بيقول إنه ممكن يكون سبب الـ **hypotension** في الـ inflammation والـ **septic shock** والـ atherosclerosis.
          - شغل الـ AM غالبًا ==autocrine أو paracrine==، يعني بيتعمل جوه جدار الوعاء ويأثر عليه في نفس المكان.

          فالخلاصة: الـ endothelium نفسه بيطلّع حاجة بترفع (ET) وحاجات بتوقّع (NO، CNP)، والتوازن بينهم هو اللي بيحدد قطر الوعاء.
      - kind: aside
        tone: analogy
        page: 44
        quote: "AM may be responsible for the hypotension of inflammation, septic shock, and atherosclerosis."
        text: "الـ endothelin زي اللي بيقفل الحنفية (يرفع الضغط)، والـ adrenomedullin زي اللي بيفتحها على الآخر في الـ septic shock (يوقّع الضغط)."
      - kind: reveal
        page: 44
        quote: "AM may be responsible for the hypotension of inflammation, septic shock, and atherosclerosis. The actions of AM may be predominantly autocrine or paracrine in nature."
        prompt: "ليه الـ adrenomedullin ممكن يفسّر الضغط الواطي في الـ septic shock بالذات؟"
        answer: "الكتاب بيقول بس إنه «may be responsible». التفسير المقبول (مش في الكتاب): الـ AM هرمون **vasodilator**، والـ inflammation بيزوّد إفرازه من الـ endothelium والـ VSMCs نفسهم. ولأن شغله **autocrine/paracrine**، كل وعاء ملتهب بيوسّع نفسه بنفسه، فالمقاومة الطرفية كلها تقع مرة واحدة، والضغط يقع حتى لو القلب شغال كويس."
      - kind: explain
        page: 44
        quote: "Estrogen cardioprotective effct\n  Anti-oxidant.\n  Ca – channel blocker.\n  ↓ LDL.\n  ↑ HDL."
        title: "الـ oestrogen بيحمي القلب: أربع أسباب"
        text: |
          الكتاب بيدّي أربع حاجات تحت «cardioprotective effect». ليه كل واحدة بتحمي؟
          1. ==↓ LDL==: الـ low-density lipoprotein (LDL) هو اللي بيترسب في جدار الشريان ويعمل الـ plaque، فلما يقل، الـ atherosclerosis يقل.
          2. ==↑ HDL==: الـ high-density lipoprotein (HDL) بيشيل الكوليسترول من الأنسجة ويرجّعه للكبد، يعني بينضّف.
          3. ==Ca-channel blocker==: الكالسيوم هو اللي بيخلّي العضلة الملساء تنقبض، فلما الـ oestrogen يقفل قنواته، العضلة **بترتاح** والوعاء **يتوسع**، وده نفس اللي الكتاب كاتبه فوق «relaxes smooth muscles and dilates blood vessels so blood flow increases».
          4. **Anti-oxidant**: التفسير المقبول (مش في الكتاب): الـ LDL مش بيأذي قوي غير لما يتأكسد، فمضاد الأكسدة بيقلل الـ oxidised LDL اللي بيبدأ الـ plaque.

          يعني التلات أسباب الأولانية بتشتغل على الدهون والرابعة على الوعاء نفسه.
      - kind: sort
        page: 44
        quote: "Estrogen and the cardiovascular system\n  Increases HDL cholesterol.\n  Decreases LDL cholesterol.\n  Relaxes, smooth muscles and dilates blood vessels so blood flow increases."
        prompt: "صنّف تأثير الـ oestrogen على الـ cardiovascular system (CVS):"
        bins: ["Protective", "Opposite / other effects"]
        cards:
          - { text: "↑ high-density lipoprotein (HDL)", bin: 0 }
          - { text: "↓ low-density lipoprotein (LDL)", bin: 0 }
          - { text: "Vasodilation", bin: 0 }
          - { text: "Calcium-channel blocking", bin: 0 }
          - { text: "Antioxidant", bin: 0 }
          - { text: "Promotes blood clotting", bin: 1 }
          - { text: "↑ triglycerides (TG) slightly", bin: 1 }
        why: "الـ oestrogen بيحمي بالـ lipids والـ vasodilation والـ antioxidant، بس بيزوّد الـ coagulability وبيرفع الـ TG شوية (ص 72، تحت «other effects»)."
      - kind: aside
        tone: trap
        page: 44
        quote: "It causes some changes that have the opposite effect:\n  Promotes blood clot formation.\n  Soaks up free radicals, naturally occurring particles in the blood that can damage the arteries and other tissues."
        text: "الكتاب حاطط الـ «soaks up free radicals» تحت «opposite effect»، بس هو في الحقيقة antioxidant يعني protective، والكتاب نفسه بيكتب anti-oxidant تحت الـ cardioprotective. لو اتسألت، الـ opposite effect هو الـ **clot formation**."
      - kind: check
        page: 44
        quote: "It causes some changes that have the opposite effect:\n  Promotes blood clot formation."
        question: "Which oestrogen effect works against the heart?"
        options: ["Promotes blood clot formation", "Raises HDL", "Blocks calcium channels", "Lowers LDL"]
        answer: 0
        why:
          - "صح: الـ clot ممكن يسد شريان تاجي حتى لو الدهون كويسة، وعشان كده الكتاب حاطه تحت «opposite effect»."
          - "الـ HDL العالي بيحمي."
          - "ده بيوسّع الأوعية، يعني بيحمي."
          - "ده بيقلل الـ plaque، يعني بيحمي."
      - kind: table
        page: 44
        quote: "Estrogen and the cardiovascular system\n  Increases HDL cholesterol.\n  Decreases LDL cholesterol.\n  Relaxes, smooth muscles and dilates blood vessels so blood flow increases.\nIt causes some changes that have the opposite effect:\n  Promotes blood clot formation."
        title: "إجابة سؤال «impact of estrogen on CVS»"
