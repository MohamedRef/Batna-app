  # --- Cross-sectional (slides 43-49) ---
  - id: res.L04.048
    kind: card
    topic: cross-sectional
    front: What does a cross-sectional study aim to do, and when are exposure and outcome measured?
    back: >-
      Describe and quantify the distribution of disease, risk factors or other characteristics in a defined
      population at one particular time; exposure and outcome are measured at the same time.
    src: { page: 43, quote: "Cross-sectional studies aim at describing and quantifying the distribution of disease, risk factors, or other characteristics in a defined population at one particular time.\nIn a cross-sectional study, the investigator measures the outcome and the exposures in the study participants at the same time.\nCross-sectional designs are used for population-based surveys and to assess the prevalence of diseases in clinic-based samples." }
    status: unverified
    tags: [high-yield]
  - id: res.L04.049
    kind: card
    topic: cross-sectional
    front: Why are cross-sectional studies called a bridge?
    back: >-
      They sit between simple descriptive studies (case reports and series) and studies that test hypotheses
      (analytic and intervention); they can suggest relationships.
    src: { page: 44, quote: "Cross-sectional studies form a bridge between simple descriptive studies (case reports and case series) and those that can test hypotheses (analytic and intervention studies).\nThey can suggest the presence of relationships." }
    status: unverified
  - id: res.L04.050
    kind: card
    topic: cross-sectional
    front: What does a cross-sectional comparative study add to a plain survey? (malnutrition example)
    back: >-
      Besides describing (percentage malnourished, food availability, feeding practices, beliefs), it compares
      malnourished with well-nourished children to find which variables may have contributed.
    src: { page: 46, quote: "Cross-sectional comparative studies: Many cross-sectional surveys focus on describing as well as comparing groups. For example, a survey on malnutrition may wish to establish:\n  The percentage of malnourished children in a certain population\n  Factors affecting the availability of food (socio economic, environmental, political)\n  Feeding practices\n  The knowledge, beliefs, opinions that influence feeding practices.\nThe researcher will not only describe these concepts but, by comparing malnourished and well-nourished children, he will try to determine which socio-economic, behavioral and other independent variables may have contributed to malnutrition." }
    status: unverified
  - id: res.L04.051
    kind: cloze
    topic: cross-sectional
    text: "In the 2×2 table of a cross-sectional study, prevalence of the disease = {{c1::(a + c)}} / {{c2::(a + b + c + d)}} × 100."
    extra: Rows are exposure (yes a, b; no c, d), columns are disease (yes a, c; no b, d).
    src: { page: 47, quote: "Interpreting results of cross-sectional studies: The findings can be presented in the 2x2 table (Contingency table or Table of association) as follows:\n| Exposure (Risk factor) | Disease (Malnutrition): Yes | Disease (Malnutrition): No | Total |\n|---|---|---|---|\n| Yes (Exposed) | a | b | a+b |\n| No (Non-exposed) | c | d | c+d |\n| Total | a+c | b+d | a+b+c+d |\nPrevalence of malnutrition = a+c / a+b+c+d x 100 (proportion of malnourished among the total surveyed)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: res.L04.052
    kind: card
    topic: cross-sectional
    front: Two ways a cross-sectional study shows an association, and the test of significance?
    back: >-
      Compare prevalence of disease in exposed a/(a+b) with unexposed c/(c+d), or prevalence of exposure in
      diseased a/(a+c) with non-diseased b/(b+d). Test: chi-squared.
    src: { page: 48, quote: "Cross-Sectional Studies: Determining an Association\n  Compare the prevalence of disease in persons with the exposure, [a/(a+b)], with the prevalence of disease in persons without the exposure, [c/(c+d)]\n  Compare the prevalence of exposure in persons with the disease, [a/(a+c)], with the prevalence of exposure in persons without the disease, [b/(b+d)]\n| | Disease | No Disease | |\n|---|---|---|---|\n| Exposed | a | b | a+b |\n| Not Exposed | c | d | c+d |\n| | a+c | b+d | |\nTest of significance: Chi-squared test" }
    status: unverified
    tags: [high-yield]
  - id: res.L04.053
    kind: mcq
    topic: cross-sectional
    stem: >-
      A survey of 400 children finds: exposed (no safe water) 60 with diarrhoea and 140 without; unexposed 20
      with diarrhoea and 180 without. What is the prevalence of diarrhoea among the exposed, and overall?
    options: ["30% and 20%", "75% and 20%", "30% and 10%", "60% and 40%"]
    answer: 0
    why:
      - "Exposed a/(a+b) = 60/200 = 30%; overall (a+c)/(a+b+c+d) = 80/400 = 20%."
      - "75% is a/(a+c) = 60/80, the prevalence of exposure among the sick."
      - "10% is c/(c+d) = 20/200, the prevalence among the unexposed."
      - These are raw counts read as percentages.
    src: { page: 48, quote: "Cross-Sectional Studies: Determining an Association\n  Compare the prevalence of disease in persons with the exposure, [a/(a+b)], with the prevalence of disease in persons without the exposure, [c/(c+d)]\n  Compare the prevalence of exposure in persons with the disease, [a/(a+c)], with the prevalence of exposure in persons without the disease, [b/(b+d)]\n| | Disease | No Disease | |\n|---|---|---|---|\n| Exposed | a | b | a+b |\n| Not Exposed | c | d | c+d |\n| | a+c | b+d | |\nTest of significance: Chi-squared test" }
