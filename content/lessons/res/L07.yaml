  - id: res.L07.lesson3
    title: "الظرف المقفول: concealment ضد blinding"
    hook: "الدكتور شاف إن الظرف الجاي فيه الدوا الجديد، فاختار له عيان شكله هيتحسّن. ده اسمه إيه؟"
    minutes: 8
    pages: [35, 50]
    topics: [concealment, conduct]
    goals:
      - "تعدّ طرق الـ allocation concealment"
      - "تفرّق بين concealment و blinding: التوقيت، الـ bias، وإمكانية التنفيذ"
      - "تعرف steps 9 لـ 11 والـ stopping rules"
    status: unverified
    steps:
      - kind: explain
        page: 35
        quote: "Some standard methods of ensuring allocation concealment include:\n  1. Sequentially numbered, opaque, sealed envelopes (SNOSE).\n  2. Pharmacy controlled allocation\n  3. Sophisticated off-site centralized randomization center"
        title: "إزاي تخبّي القرعة؟"
        text: |
          الـ ==allocation concealment== بتحمي تسلسل القرعة **قبل** ما العيان يدخل التجربة. طرقها:

          - ظروف متنمّرة ومقفولة ومش شفافة: **sequentially numbered, opaque, sealed envelopes (SNOSE)**
          - الصيدلية ماسكة القايمة: **pharmacy-controlled**
          - مركز بعيد يقولك رقم العلبة: **central randomization**

          والـ SNOSE اختصار: Sequentially Numbered, Opaque, Sealed Envelopes.
      - kind: figure
        page: 38
        quote: "Allocation concealment vs. blinding, along time:\n  Before randomisation: Concealment of allocation, against Selection bias\n  After randomisation: Blinding, against Performance bias"
        title: "خط الزمن: قبل القرعة وبعدها"
        alt: "Timeline with randomisation in the middle. Before it, allocation concealment protects the sequence and prevents selection bias. After it, blinding hides the treatment and prevents performance and ascertainment bias."
        caption: "**قبل** القرعة: concealment ضد الـ selection bias. **بعد** القرعة: blinding ضد الـ performance والـ ascertainment bias."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R07t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <path d="M10 100H318" class="fg-arrow" marker-end="url(#R07t)"/>
            <text x="318" y="120" text-anchor="end" class="t-sm t-mut">time</text>
            <rect x="140" y="80" width="50" height="40" rx="6" class="fg-ink"/>
            <text x="165" y="104" text-anchor="middle" class="t-sm t-b">R</text>
            <text x="165" y="140" text-anchor="middle" class="t-sm t-b">randomisation</text>
            <rect x="8" y="20" width="125" height="50" rx="6" class="fg-acc"/>
            <text x="70" y="40" text-anchor="middle" class="t-sm t-b">Concealment</text>
            <text x="70" y="58" text-anchor="middle" class="t-sm">always possible</text>
            <rect x="197" y="20" width="125" height="50" rx="6" class="fg-good"/>
            <text x="259" y="40" text-anchor="middle" class="t-sm t-b">Blinding</text>
            <text x="259" y="58" text-anchor="middle" class="t-sm">not always</text>
            <rect x="8" y="155" width="125" height="34" rx="6" class="fg-bad"/>
            <text x="70" y="177" text-anchor="middle" class="t-sm">Selection bias</text>
            <rect x="197" y="155" width="125" height="34" rx="6" class="fg-bad"/>
            <text x="259" y="177" text-anchor="middle" class="t-sm">Performance bias</text>
          </svg>
      - kind: table
        page: 37
        quote: "| Allocation concealment | Blinding |\n|---|---|\n| Prevents selection bias | Prevents ascertainment bias |\n| Protects the randomization sequence before and until the interventions are given to study participants | Protects the randomization sequence after allocation |\n| Can always be implemented | Can not always be implemented |"
        title: "الفرق في جدول"
        columns: ["", "Concealment", "Blinding"]
        rows:
          - ["When", "Before and until treatment is given", "After allocation"]
          - ["Prevents", "Selection bias", "Ascertainment bias"]
          - ["Feasible", "Always", "Not always"]
        hide: [[1, 1], [1, 2], [2, 1], [2, 2]]
      - kind: aside
        tone: analogy
        page: 39
        quote: "\"The patient's condition fits the trial, and she has consented. Which treatment pack should I give her?\"\n\"Yes doctor, your patient is eligible. She will be allocated to treatment pack X32. After the trial we will tell you what treatment X32 was.\"\nRandomization should be separate & distant from clinicians conducting the trial"
        text: |
          الكارتون في الشريحة: الدكتور بيتصل بالمركز: «العيانة مناسبة وموافقة، أدّيها أنهي علبة؟» والمركز يرد: «أدّيها **علبة X32**، وبعد التجربة هنقولك X32 كانت إيه».

          ده الـ concealment الصح: الـ randomization **بعيدة ومنفصلة** عن الـ clinicians اللي بيعملوا التجربة. زي ورقة امتحان التنسيق: مكتوب عليها رقم جلوس مش اسم.
      - kind: check
        page: 40
        quote: "Allocation concealment reduces bias as...\n  a. It prevents researchers from influencing which participants are assigned to the intervention/ control group.\n  b. prevents the participants from knowing which arm of the trial they are on"
        question: "Allocation concealment reduces bias because:"
        options:
          - "It prevents researchers from influencing which participants are assigned to each group"
          - "It prevents participants from knowing which arm they are on"
          - "It makes the placebo identical to the drug"
          - "It increases the power of the trial"
        answer: 0
        why:
          - "صح: الباحث مايقدرش يختار مين يدخل الجروب ده، فبيمنع الـ selection bias."
          - "ده blinding، وبيحصل بعد الـ allocation."
          - "الـ placebo المتطابق جزء من الـ blinding."
          - "الـ power بيعتمد على الـ sample size والـ alpha والـ effect size."
      - kind: sort
        page: 44
        quote: "6. In a randomized controlled trial, the following types of biases are reduced by randomization:\n  a. Ascertainment bias\n  b. Selection bias\n  c. Recall bias\n  d. Publication bias\n  e. Bias in handling dropout\nAnswer: b"
        prompt: "كل bias من دول بيتمنع بإيه؟"
        bins: ["Randomization + concealment", "Blinding", "Intention to treat"]
        cards:
          - { text: "Selection bias", bin: 0 }
          - { text: "Unknown confounders unequal at baseline", bin: 0 }
          - { text: "Ascertainment (assessment) bias", bin: 1 }
          - { text: "Patients bias their answers because they know their drug", bin: 1 }
          - { text: "Bias from dropouts and non-compliers", bin: 2 }
        why: "القرعة والظرف المقفول بيخلّوا الجروبين شبه بعض في البداية. الـ blinding بيحمي القياس بعد كده. والـ intention to treat بيحمي التحليل من اللي وقفوا العلاج."
      - kind: explain
        page: 45
        quote: "Step 9 - Introduce the Intervention and Placebo Control Modalities:\n  Develop procedures for checking compliance\n  Ensure that they get the placebo drug in the same shape, colour, size and taste and is also administered using similar procedures."
        title: "Steps 9 و 10: الـ placebo والـ blinding"
        text: |
          - **Step 9**: الـ placebo لازم يبقى ==same shape, colour, size and taste== ويتدّى بنفس الطريقة. واعمل procedures لمراجعة الـ **compliance**.
          - الـ **data collection** لازم تبقى **same quality** في الجروبين: الـ treatment (assigned و received)، والـ outcome بمعايير واضحة ومتقاسة بنفس الطريقة. غير كده: **observer bias**.
          - **Step 10**: الناس لو عرفت هي في أنهي جروب، سلوكها بيتغيّر. الحل: blinding للـ participants و/أو الـ observer و/أو الـ data reviewer.
      - kind: explain
        page: 49
        quote: "When to stop RCT (\"Stoppage Rules\"):\n  RCTs may be stopped early if an intervention produces \"larger than expected benefit or harm,\" or\n  If \"investigators find evidence of no important difference\"\n  Evidence of clearly high mortality or complication in the intervention group comes up."
        title: "Step 11 والـ stopping rules"
        text: |
          **Step 11**: تابع الناس لحد الـ **end point** أو **آخر مدة التجربة، أيهما أقرب**، وامنع الـ ==losses to follow up== لأنها ممكن تعمل bias كبير.

          **إمتى نوقف الـ randomized controlled trial (RCT) بدري؟**
          - **Benefit** أكبر من المتوقع (مش أخلاقي نحرم الـ control منه).
          - **Harm** أكبر من المتوقع.
          - مفيش **important difference** خالص (futility).
          - **Mortality** أو complications عالية بوضوح في جروب الـ intervention.
      - kind: aside
        tone: exam
        page: 48
        quote: "Step 11 - Follow Up and Assessment:\n  Follow up the subjects till the end point, or the period of trial, whichever is earlier\n  Avoid losses to follow up, which may otherwise seriously bias the study results"
        text: |
          الدكتورة قالت في الشرح: الـ ==losses to follow up== لازم تبقى أقل ما يمكن، و**ماتعدّيش 20%**. وحتى لو أقل من كده، ممكن تعمل bias لو مرتبطة بالعلاج أو بالـ outcome، وبتقلل الـ power.
      - kind: aside
        tone: tip
        page: 41
        quote: "Which is not an issue with RCTs?\n  a. Contamination\n  b. Losses to follow up\n  c. Recall bias\n  d. Bias in assessment of outcome"
        text: |
          ==Contamination==: جزء من الـ intervention يوصل للـ control group، فالفرق الحقيقي بين الجروبين يصغر.

          مثال الدكتورة في المحاضرة: **برنامج تثقيف صحي** معمول للجروب التجريبي، وبعض الناس في الـ control سمعوه أو اتعرضوا له. خطّط تمنع التسريب ده، وسجّل أي co-interventions.
      - kind: aside
        tone: trap
        page: 50
        quote: "Suppose that a randomized single masked experimental study is conducted. Which of the following problems are surely avoided in this study?\n  a. Noncompliance\n  b. Confounding\n  c. Biased assessment of the disease outcome\n  d. Loss to follow up"
        text: |
          سؤال شريحة 50: «randomized **single masked** study، إيه المشكلة اللي **أكيد** اتمنعت؟» إجابة الشريحة: **biased assessment of the outcome**.

          ممكن تعترض إن الـ single masking بيخبّي عن طرف واحد بس، وإن القرعة بتقلل الـ confounding. لكن إجابة الامتحان هي إجابة الشريحة: الـ **masking** = سلاح ضد الـ **biased assessment**. والـ noncompliance والـ loss to follow-up مفيش حاجة بتمنعهم.
      - kind: try
        items: [res.L07.042, res.L07.041, res.L07.028]
    recap:
      - "Concealment: SNOSE، pharmacy، central. بيحمي القرعة قبل الإعطاء، دايمًا ممكن، وبيمنع الـ selection bias."
      - "Blinding: بعد الـ allocation، مش دايمًا ممكن، وبيمنع الـ ascertainment والـ performance bias."
      - "الـ placebo: نفس الشكل واللون والحجم والطعم. والـ data بنفس الجودة في الجروبين، وإلا observer bias."
      - "Stopping rules: benefit أو harm أكبر من المتوقع، مفيش فرق، أو mortality عالية."
    practice: [res.L07.024, res.L07.025, res.L07.026, res.L07.027, res.L07.028, res.L07.029, res.L07.041, res.L07.042, res.L07.043, res.L07.044, res.L07.045, res.L07.046, res.L07.047, res.L07.048, res.L07.049, res.L07.050, res.L07.116, res.L07.117, res.L07.118]
