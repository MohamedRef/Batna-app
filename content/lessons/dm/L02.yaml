  - id: dm.L02.lesson4
    title: "الضغط والكوليسترول: 130/80 و 70"
    hook: "رقمين بيحموا قلب العيان: ضغط أقل من 130/80، و LDL أقل من 70."
    minutes: 9
    pages: [25, 26]
    topics: [hypertension, lipids]
    goals:
      - "تشخّص وتعالج الـ hypertension في السكر بالـ algorithm"
      - "تختار الـ statin intensity بالسن والـ risk factors (سؤال كتاب)"
      - "تتصرّف في الـ statin intolerance"
    status: unverified
    steps:
      - kind: explain
        page: 25
        title: "الضغط في السكر"
        quote: "Hypertension is defined as a systolic blood pressure ≥130 mmHg or a diastolic blood pressure ≥80 mmHg"
        text: |
          - **Definition:** ==≥130/80== كمتوسط ≥2 قراءات في ≥2 مرات.
          - **Single visit:** لو **≥180/110** ومعاه **CVD**.
          - **ابدأ دوا** لو persistently **≥130/80**.
          - **Target:** **<130/80** لو ينفع بأمان.
      - kind: figure
        page: 25
        quote: "Initial BP ≥150/90 mmHg Start two agents"
        title: "الـ BP algorithm"
        alt: "Two columns. Initial BP 130/80 to under 150/90: start one agent; with albuminuria or CAD it must be ACEi or ARB, otherwise ACEi or ARB or CCB or diuretic. Initial BP 150/90 or more: start two agents; with albuminuria or CAD, ACEi or ARB plus CCB or diuretic. Then add a complementary class, and after three classes add an MRA and refer."
        caption: "سؤالين بس: الضغط **فوق 150/90**؟ (دوا ولا اتنين) وفيه **albuminuria أو CAD**؟ (لازم ==ACEi أو ARB==)."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L02b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="8" y="6" width="152" height="40" rx="10" class="fg-acc"/>
            <text x="84" y="23" text-anchor="middle" class="t-sm t-b">≥130/80, &lt;150/90</text>
            <text x="84" y="39" text-anchor="middle" class="t-sm">Start ONE agent</text>
            <rect x="170" y="6" width="152" height="40" rx="10" class="fg-bad"/>
            <text x="246" y="23" text-anchor="middle" class="t-sm t-b">≥150/90</text>
            <text x="246" y="39" text-anchor="middle" class="t-sm">Start TWO agents</text>
            <text x="165" y="68" text-anchor="middle" class="t-sm t-b">Albuminuria or CAD?</text>
            <rect x="8" y="78" width="152" height="44" rx="8" class="fg-box"/>
            <text x="14" y="95" class="t-sm t-b">Yes:</text>
            <text x="14" y="112" class="t-sm">ACEi or ARB</text>
            <rect x="170" y="78" width="152" height="44" rx="8" class="fg-box"/>
            <text x="176" y="95" class="t-sm"><tspan class="t-b">Yes:</tspan> ACEi/ARB +</text>
            <text x="176" y="112" class="t-sm">CCB or diuretic</text>
            <rect x="8" y="128" width="152" height="44" rx="8" class="fg-thin"/>
            <text x="14" y="145" class="t-sm t-b">No:</text>
            <text x="14" y="162" class="t-sm">ACEi/ARB, CCB or diuretic</text>
            <rect x="170" y="128" width="152" height="44" rx="8" class="fg-thin"/>
            <text x="176" y="145" class="t-sm"><tspan class="t-b">No:</tspan> two of</text>
            <text x="176" y="162" class="t-sm">ACEi/ARB, CCB, diuretic</text>
            <path d="M165 178 V196" class="fg-arrow" marker-end="url(#L02b)"/>
            <rect x="30" y="198" width="270" height="34" rx="10" class="fg-box"/>
            <text x="165" y="220" text-anchor="middle" class="t-sm">Not at goal: add a complementary class</text>
            <path d="M165 232 V250" class="fg-arrow" marker-end="url(#L02b)"/>
            <rect x="30" y="252" width="270" height="42" rx="10" class="fg-ink"/>
            <text x="165" y="270" text-anchor="middle" class="t-sm t-b">All three classes, still not at goal:</text>
            <text x="165" y="286" text-anchor="middle" class="t-sm">add MRA, refer to BP specialist</text>
          </svg>
      - kind: check
        page: 25
        quote: "Initial BP ≥150/90 mmHg Start two agents"
        question: "Diabetes with albuminuria, BP 158/96 on repeated visits. Start?"
        options: ["ACEi or ARB plus CCB or diuretic", "One agent of any class", "Lifestyle only", "CCB plus diuretic"]
        answer: 0
        why:
          - "صح: **≥150/90** = اتنين، و **albuminuria** = لازم ACEi أو ARB."
          - "فوق 150/90 محتاج اتنين."
          - "الدوا بيبدأ من ≥130/80 persistently."
          - "مع الـ albuminuria لازم ACEi أو ARB يبقى واحد منهم."
      - kind: reveal
        page: 25
        quote: "Consider addition of mineralocorticoid receptor antagonist; refer to specialist with expertise in BP management"
        prompt: "ليه الـ ACEi أو ARB لازم يبقى موجود لو فيه albuminuria؟"
        answer: |
          الـ **ACEi/ARB** بيوسّع الـ **efferent arteriole**، فيقلل الضغط جوه الـ glomerulus، فالـ protein اللي بيتسرب يقل وتبطّأ الـ nephropathy. الـ CCB والـ diuretic بيوطّوا الضغط العام بس.

          ولو التلات classes ما نفعوش: **mineralocorticoid receptor antagonist** وتحويل لمتخصص. (التفسير فسيولوجي؛ الخطوات من الكتاب.)
      - kind: table
        page: 26
        quote: "High-intensity statin therapy (lowers LDL cholesterol by ≥50%) Rosuvastatin 20–40 mg, Atorvastatin 40–80 mg"
        title: "Statin intensity"
        columns: [Intensity, LDL ↓, Doses (mg)]
        rows:
          - ["High", "≥50%", "Rosuva 20–40, atorva 40–80"]
          - ["Moderate", "30–49%", "Rosuva 5–10, atorva 10–20"]
        hide: [[0, 1], [0, 2], [1, 2]]
      - kind: mnemonic
        page: 26
        quote: "Rosuvastatin 20–40 mg, Atorvastatin 40–80 mg"
        word: "R2A4"
        parts:
          - { key: "R", text: "Rosuvastatin" }
          - { key: "2", text: "High starts at 20 mg" }
          - { key: "A", text: "Atorvastatin" }
          - { key: "4", text: "High starts at 40 mg" }
        hook: "**R2A4** زي اسم روبوت: الـ high-intensity بيبدأ من **Rosuva 20** و **Atorva 40**، وأقصاه الضعف (40 و 80). والـ moderate هو اللي تحتهم (5–10 و 10–20)."
      - kind: figure
        page: 26
        quote: "Use a high-intensity statin in those with ≥1 ASCVD risk factor, with an LDL cholesterol goal of <70 mg/dL (<1.8 mmol/L)."
        title: "الـ statin بالسن"
        alt: "Age ladder. 20 to 39: consider a statin if additional ASCVD risk factors. 40 to 75: moderate intensity without risk factors; high intensity with one or more risk factors, LDL goal under 70; add ezetimibe or PCSK9 inhibitor if not at goal; bempedoic acid if statin intolerant. Over 75: continue, or consider starting moderate intensity after weighing benefit and risk."
        caption: "الـ **40–75** هو قلب الموضوع: ==risk factor واحد== بيحوّلك من moderate لـ high، والـ LDL **<70**."
        svg: |
          <svg viewBox="0 0 330 270" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="6" width="80" height="50" rx="10" class="fg-acc"/>
            <text x="48" y="36" text-anchor="middle" class="t-b">20–39</text>
            <rect x="96" y="6" width="226" height="50" rx="10" class="fg-box"/>
            <text x="104" y="27" class="t-sm">Consider a statin if additional</text>
            <text x="104" y="44" class="t-sm">ASCVD risk factors</text>
            <rect x="8" y="64" width="80" height="140" rx="10" class="fg-bad"/>
            <text x="48" y="138" text-anchor="middle" class="t-b">40–75</text>
            <rect x="96" y="64" width="226" height="40" rx="10" class="fg-box"/>
            <text x="104" y="81" class="t-sm t-b">No risk factor:</text>
            <text x="104" y="97" class="t-sm">moderate intensity</text>
            <rect x="96" y="110" width="226" height="94" rx="10" class="fg-bad"/>
            <text x="104" y="127" class="t-sm t-b">≥1 risk factor: high intensity</text>
            <text x="104" y="143" class="t-sm">LDL goal &lt;70 mg/dL (&lt;1.8 mmol/L)</text>
            <text x="104" y="163" class="t-sm">not at goal: + ezetimibe or PCSK9i</text>
            <text x="104" y="181" class="t-sm">intolerant: bempedoic acid</text>
            <rect x="8" y="212" width="80" height="52" rx="10" class="fg-ink"/>
            <text x="48" y="243" text-anchor="middle" class="t-b">&gt;75</text>
            <rect x="96" y="212" width="226" height="52" rx="10" class="fg-box"/>
            <text x="104" y="233" class="t-sm">Continue, or start moderate</text>
            <text x="104" y="250" class="t-sm">after weighing benefit and risk</text>
          </svg>
      - kind: check
        page: 26
        quote: "Use a high-intensity statin in those with ≥1 ASCVD risk factor, with an LDL cholesterol goal of <70 mg/dL (<1.8 mmol/L)."
        question: "52-year-old with type 2 diabetes and hypertension, no ASCVD. Statin?"
        options: ["High intensity, LDL goal <70", "Moderate intensity", "None", "Ezetimibe alone"]
        answer: 0
        why:
          - "صح: 40–75 + risk factor (hypertension) = **high intensity**."
          - "الـ moderate للي مالوش risk factors."
          - "في السن ده الـ statin indicated."
          - "الـ ezetimibe بيتضاف فوق أقصى statin متحمّل."
      - kind: explain
        page: 26
        title: "Statin intolerance"
        quote: "Switching to a different high-intensity statin - Lowering the statin dose - Using nondaily dosing of statins"
        text: |
          ما تسيبش الـ statin من أول وجع عضلات:
          1. **Switch** لـ statin تاني
          2. **Lower** الجرعة
          3. ==Nondaily dosing== (يوم ويوم مثلًا)
          4. **Add non-statin** فوق أقصى جرعة متحمّلة

          والـ figure بيقول: **bempedoic acid** للي statin intolerant، و **ezetimibe أو PCSK9i** لو الهدف ما اتحققش.
      - kind: try
        items: [dm.L02.051, dm.L02.054, dm.L02.057, dm.L02.060, dm.L02.089]
    recap:
      - "Hypertension في السكر ≥130/80 (≥2 قراءات، ≥2 مرات)؛ single visit لو ≥180/110 + CVD؛ target <130/80."
      - "<150/90 دوا واحد، ≥150/90 اتنين؛ albuminuria/CAD = لازم ACEi أو ARB؛ بعد 3 classes: MRA وتحويل."
      - "High statin: rosuva 20–40، atorva 40–80 (≥50%). Moderate: 5–10، 10–20 (30–49%)."
      - "20–39 فكّر لو risk factors؛ 40–75 moderate، أو high + LDL <70 لو risk factor؛ >75 كمّل أو moderate."
      - "Intolerance: switch، جرعة أقل، nondaily، add non-statin؛ bempedoic acid؛ ezetimibe/PCSK9i."
