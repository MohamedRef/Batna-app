    steps:
      - kind: explain
        page: 239
        title: "Case 4: الندبة في أي حتة"
        quote: "Sixteen glomeruli were seen, in all serial sections examined, out of which 1 was obsolescent. Two of the glomeruli showed segmental tuft sclerosis with capsular adhesions located randomly within the tuft."
        text: |
          الـ **IH**: IgA و IgG و IgM و C3 كلهم negative. الـ **LM**: **16 glomeruli**، 1 obsolescent، و ==2 فيهم segmental tuft sclerosis with capsular adhesions== **located randomly within the tuft**. الباقي طبيعي، والـ tubules والـ interstitium والـ arteries طبيعيين. وفي الصفحة اللي بعدها: **Congo red** سلبي.

          ليه كل كلمة مهمة؟ التفسير المقبول (مش في الكتاب):
          - **2 من 16** = ==focal== (أقل من 50%)، و **جزء من الـ tuft** = segmental. يعني الاسم نفسه focal segmental.
          - الـ **IF السلبي** بيقول إن الندبة مش بقايا GN فيه deposits (زي IgA أو lupus قديم)؛ دي ندبة podocyte.
          - الـ **Congo red** علشان الـ amyloid ممكن يتشاف كـ matrix زيادة.
          - و **randomly** هي المفتاح: لو الندبة كانت عند الـ vascular pole كانت perihilar، ولو عند الـ tubular pole كانت tip. في أي حتة = NOS.
      - kind: figure
        page: 240
        title: "الـ biopsy بتاع case 4"
        image: { file: neph/L08-fsgs-case4-lm.webp, book: true }
        caption: "glomeruli من case 4: معظم الـ tuft مفتوح، وفي segment منه ==sclerosis لازقة في Bowman's capsule== (adhesion)."
        alt: "Two book photomicrographs from case 4: glomeruli with mostly open capillary loops and one segment of sclerosis adherent to Bowman's capsule."
      - kind: explain
        page: 241
        title: "Case 4"
        quote: "FSGS; Not Otherwise Specified (NOS; Classic Variant) What are the other types of FSGS?"
        text: |
          ست **52 سنة**، urine protein-to-creatinine ratio (uPCR) **1.13**، albumin 3.6، creatinine 0.56. الـ biopsy: 2 من 16 glomeruli فيهم **segmental tuft sclerosis** و capsular adhesions **في أي حتة في الـ tuft**، والـ immunofluorescence (IF) سلبي، والـ Congo red سلبي.

          التشخيص: ==focal segmental glomerulosclerosis (FSGS) NOS (classic variant)==، وده **أشهر** نوع.

          ليه الـ IF والـ Congo red السلبيين مهمين؟ التفسير المقبول (مش في الكتاب): الـ segmental sclerosis **نتيجة** مش مرض لوحدها؛ أي glomerulus اتعوّر وعمل ندبة ممكن يبان كده. فقبل ما تقول FSGS لازم تستبعد إن الندبة دي جاية من حاجة تانية: IgA قديم (IF هيبيّن IgA)، lupus (full house)، أو amyloid (Congo red). لما كله سلبي، تفضل الـ FSGS هي التشخيص.
          وليه «**NOS**»؟ لأن الندبة مش في مكان مميز (لا عند الـ hilum، ولا عند الـ tip، ولا collapsing)، فبتتسمى not otherwise specified، وده أشهر variant.
          والـ uPCR **1.13** بس مع albumin 3.6: الـ proteinuria مش nephrotic، وده بيرجّح FSGS **secondary/adaptive** أكتر من primary.
