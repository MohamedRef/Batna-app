        text: |
          ==Carbohydrate counting== هو **meal planning technique** لظبط السكر:
          - تتابع قد إيه **carbohydrate** بتاكل
          - تحدد **maximum** لكل وجبة
          - ومع الـ **physical activity** والدوا (لو محتاج) السكر يفضل في الـ target

