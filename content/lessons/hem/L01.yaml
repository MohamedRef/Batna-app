            <path d="M100 215 L270 266" class="fg-arrow" marker-end="url(#h01c)"/>
          </svg>
      - kind: explain
        page: 4
        title: "B في الـ Bone marrow، T في الـ Thymus"
        quote: "The T-cell progenitors undergo maturation in the thymus."
        text: |
          الـ **lymphoid stem cell** بيطلّع يا **T cells** يا **B cells / plasma cells**.

          - الـ ==B cells== بتنضج في **microenvironment النخاع** نفسه، وبعدين تمشي في الدم لـ **B-cell zones** في الـ peripheral lymphoid tissue.
          - الـ ==T cells== بتنضج في الـ **thymus**، وبعدين تروح الـ **T-cell zones** في الـ peripheral lymphoid organs.
      - kind: aside
        tone: tip
        page: 4
        quote: "undergo maturation into B-cells in the microenvironment of the marrow"
        text: "الحروف بتساعدك: **B** = **B**one marrow، **T** = **T**hymus. سهلة ومش هتنساها في الامتحان."
      - kind: explain
        page: 4
        title: "الـ CFU-GEMM: أبو الـ myeloid"
        quote: "The myeloid stem cell progresses to the progenitor colony forming unit"
        text: |
          الـ **myeloid stem cell** بيتحول لـ ==CFU-GEMM==: colony forming unit **G**ranulocyte-**E**rythrocyte-**M**onocyte-**M**egakaryocyte. الاسم نفسه بيعدّ ولاده.

          ومنه بتطلع committed progenitors: **CFU-GM**، **CFU-eosinophil**، **CFU-basophil**، **CFU-megakaryocyte**. وفي الـ erythropoiesis بيتحول لـ **BFU-E** (burst-forming unit erythroid).

          كل CFU في الظروف المناسبة يطلّع **colony من lineage واحد**.
      - kind: mnemonic
        page: 4
        quote: "granulocyte-eythrocyte-monocyte-megakaryocyte (CFU-GEMM)"
        word: "GEMM"
        parts:
          - { key: "G", text: "Granulocyte" }
          - { key: "E", text: "Erythrocyte" }
          - { key: "M", text: "Monocyte" }
          - { key: "M", text: "Megakaryocyte" }
        hook: "**GEMM** = جوهرة (gem)؛ الـ myeloid progenitor ده جوهرة بتطلّع 4 أنواع. الـ lymphocyte مش منهم: ده من الـ lymphoid stem cell."
      - kind: check
        page: 4
        quote: "The lymphoid stem cell in the bone marrow generates B cell progenitors"
        question: "Which cell does NOT come from CFU-GEMM?"
        options:
          - "Lymphocyte"
          - "Erythrocyte"
          - "Megakaryocyte"
          - "Monocyte"
        answer: 0
        why:
          - "صح: الـ lymphocytes من الـ lymphoid stem cell، مش من الـ myeloid CFU-GEMM."
          - "الـ E في GEMM = erythrocyte."
          - "الـ M الأخيرة = megakaryocyte."
          - "الـ M الأولى = monocyte."
      - kind: explain
        page: 4
        title: "الـ microenvironment: البيت مش بس الطوب"
        quote: "It is composed of stromal cells and a microvascular network."
        text: |
          تكوين الخلايا الناضجة بيتحكم فيه 3 حاجات: **growth factors**، **inhibitors**، و ==BM microenvironment==.

          الـ microenvironment = **stromal cells** + **microvascular network**. الـ stromal cells بتعمل **extracellular matrix** (collagen وبروتينات)، وده ضروري عشان الـ renewal والـ differentiation يمشوا صح.

          في شكل الكتاب (ص 5) الـ **stroma** = fibroblast-like **reticular cells** + collagenous fibres + extracellular matrix، زي "مرتبة" الخلايا نايمة عليها.
      - kind: explain
        page: 5
        title: "الـ CAMs: velcro النخاع"
        quote: "As the marrow cells differentiate, they lose cell adhesion molecules (CAMS), thus they can leave the marrow to the circulation."
        text: |
          في النخاع فيه **CAM receptors** (cell adhesion molecules).

          - لو اديت **stem cells** في الوريد، بتروح تلزق في النخاع (==homing==) بسبب الـ CAM receptors دي. وده أساس الـ **bone marrow transplant**.
          - الخلية وهي بتنضج بـ**تفقد** الـ CAMs، فتفك من النخاع وتطلع الدم.
      - kind: reveal
        page: 5
        quote: "they lose cell adhesion molecules (CAMS), thus they can leave the marrow to the circulation"
        prompt: "لو الخلايا الصغيرة (blasts) ظهرت في الدم، ده معناه إيه بلغة الـ CAMs؟"
        answer: "الطبيعي إن الخلية ما تسيبش النخاع إلا لما تنضج و**تفقد الـ CAMs**. ظهور blasts في الدم معناه إن حاجة بوّظت الـ microenvironment أو الخلايا نفسها شاذة؛ ودي حاجة هتقابلها في الـ leukaemia والـ myelofibrosis."
      - kind: try
        items: [hem.L01.015, hem.L01.021, hem.L01.023, hem.L01.030, hem.L01.031]
    recap:
      - "الـ pluripotential stem cell: self-renewal + proliferation + differentiation لـ committed progenitors."
      - "B cells بتنضج في النخاع، T cells في الـ thymus."
      - "Myeloid stem cell ← CFU-GEMM ← CFU-GM, -Eo, -Baso, -Meg؛ وفي الأحمر BFU-E."
      - "Microenvironment = stromal cells + microvascular network؛ الـ ECM ضروري للـ renewal."
      - "CAM receptors بتخلي الـ stem cells المحقونة تلزق في النخاع؛ والخلية الناضجة بتفقد الـ CAMs فتطلع الدم."
