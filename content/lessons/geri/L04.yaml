      - kind: explain
        page: 82
        quote: "Antidepressants: choice according to side effect profile, previous experience"
        title: "تختار أنهي antidepressant؟"
        text: |
          الكتاب بيقول الاختيار حسب حاجتين:
          - **Side effect profile**: الدوا اللي أعراضه الجانبية أقل ضرر على المريض ده بالذات.
          - **Previous experience**: لو دوا نفع معاه قبل كده، ده أقرب اختيار.

          ليه الـ side effects هي اللي بتحكم؟ التفسير المقبول (مش في الكتاب): لأن الـ antidepressants فعاليتها قريبة من بعض، والفرق الحقيقي في اللي المريض هيستحمله ويكمّل عليه. مريض بيقع محتاج دوا مابيعملش دوخة، ومريض عنده heart disease يبعد عن اللي بيأثر على القلب. وده نفس كلام الـ tolerability في الـ guidelines.
      - kind: explain
        page: 83
        quote: "Perform a comprehensive clinical assessment, including cognitive testing"
        title: "سؤالين الكتاب في آخر المحاضرة"
        text: |
          الكتاب بيختم المحاضرة بسؤالين:

          **Question 1**: مريض 84 سنة، memory loss بيزيد، صعوبة في المهام اليومية، وتغيير في الشخصية. إيه الخطوة الجاية؟ الإجابة **c**: ==comprehensive clinical assessment== فيه cognitive testing وhistory-taking. ليه مش الـ MRI ولا الدوا على طول؟ لأن ترتيب الـ evaluation في الكتاب بيبدأ بالـ **history** من العيلة والـ exam والـ cognitive assessment، والـ imaging رقم 5. ومن غير تقييم ممكن يفوتك سبب يتعكس (depression، intoxication).

          **Question 2**: إيه الصح عن الـ dementia؟ الإجابة **d) all the above**: الـ mental ability بتقع وبتأثّر على الحياة اليومية، المريض ممكن ينسى اسمه، والـ Alzheimer's **سبب** للـ dementia (الأشهر بس مش الوحيد).
