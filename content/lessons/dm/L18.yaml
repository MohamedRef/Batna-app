      - kind: explain
        page: 241
        title: "الـ urate oxidase"
        quote: "It is indicated to prevent acute hyperuricemia induced by chemotherapy for hematological malignancies."
        text: |
          **1. Rasburicase (Elitek):** urate oxidase من **Aspergillus flavus** معدّل وراثيًا.
          - ==prevent acute hyperuricemia induced by chemotherapy== في الـ hematological malignancies.
          - IV، vials **1.5 و 7.5 mg**. عيبه: IV ومش متسجل في كل البلاد.

          **2. Pegloticase (PEG-uricase):** للـ **3%** اللي مش بيوصلوا للهدف رغم العلاج.
          - **8 mg IV كل أسبوعين أو شهريًا**؛ الـ urate ينزل والـ **tophi تدوب** بالراحة.
          - أشهر side effects: **gout flares** و **infusion reactions**.
      - kind: explain
        page: 242
        title: "ليه الـ uricase بيتحجز؟"
        quote: "3% of patients cannot achieve or cannot maintain a target UA level of 6 mg/dl despite conventional therapy, because of refractoriness, contraindications, or intolerance. Pegloticase was developed for this group of patients."
        text: |
          - **Rasburicase**: ==IV== ومش متسجّل في كل البلاد، فبيتحجز لحالة واحدة: منع الـ hyperuricemia الحادة مع الـ chemotherapy في أورام الدم.
          - **Pegloticase**: للـ ==3%== اللي مش بيوصلوا 6 أو مش قادرين يحافظوا عليه، بسبب refractoriness أو contraindications أو intolerance.

          ليه الـ rasburicase في الـ tumor lysis مش الـ allopurinol؟ الكتاب بيقول في ص 240 إن الـ allopurinol صعب يتحكم في الـ uricosuria الشديدة هناك، وبيعمل ==xanthinuria== شديدة. التفسير المقبول (مش في الكتاب): الـ allopurinol بيمنع تكوين uric acid جديد بس، والـ xanthine بيتجمع؛ أما الـ uricase فبيكسر الـ uric acid الموجود فعلًا.

          وليه الـ flares والـ infusion reactions مع الـ pegloticase؟ التفسير المقبول (مش في الكتاب): نزول سريع بيفكّك الـ tophi (هجمة)، والإنزيم بروتين غريب على الجسم.
