        title: "الـ 3 طرق جايين منين؟"
        quote: "Specific Approaches to Increase HDL\n  1. Promoting ApoA1 Production.\n  2. Promoting Cholesterol Efflux and RCT.\n  3. Slowing removal of HDL from Blood."
        text: |
          الـ 3 طرق جايين من رسمة الـ HDL metabolism نفسها؛ كل طريق بيزق محطة:
          1. **Promoting ApoA-I production**: زوّد **الهيكل**؛ ApoA-I أكتر = HDL أكتر يتبني.
          2. **Promoting cholesterol efflux and RCT**: افتح **الباب** (ABCA1) أوسع، فالـ ApoA-I يتملي أسرع.
          3. **Slowing removal of HDL from blood**: اقفل **الحنفية** اللي بتصفّيه (CETP)، فالـ HDL يفضل في الدم.

          يعني لو فاكر الرسمة، الـ 3 طرق بيتكتبوا لوحدهم: ==هيكل، باب، حنفية==. الدرس ده للطريقين الأولانيين، والـ CETP ليه درس لوحده.
      - kind: explain
        page: 256
        title: "ApoA-I Milano"
        quote: "Apo A-I Milano (IV infusion):\n  1. IV infusion of apoA-I Milano in humans.\n  2. 5 weekly infusions of apoA-I Milano.\n  3. Significant reduction of coronary atheroma volume as measured by IVUS."
        text: |
          - **ApoA-I Milano** بيتدّي **IV infusion** في البني آدمين.
          - **5 infusions أسبوعية** قللت حجم الـ ==coronary atheroma== بشكل واضح.
          - القياس بالـ **intravascular ultrasound (IVUS)**: probe جوّه الشريان التاجي بيقيس حجم الـ plaque نفسه.

          ليه "Milano"؟ التفسير المقبول (مش في الكتاب): ده **variant** طبيعي من الـ ApoA-I اتلقى في عيلة في شمال إيطاليا، الـ HDL عندهم واطي ومع كده الـ atherosclerosis قليل. فالفكرة إن الـ ApoA-I ده **شاطر** في سحب الكوليسترول حتى لو الرقم مش عالي.

          وخد بالك: الـ IVUS بيقيس **حجم الـ plaque**، مش الوفيات والجلطات. نتيجة مشجعة، مش دليل إن الأحداث قلّت.
      - kind: explain
        page: 257
        title: "Autologous ApoA-I و mimetic peptides"
        quote: "Autologous Apo A-I (IV infusion):\n  1. Patient's own apoA-I.\n  2. ApoA-I is more effective in promoting cholesterol efflux than mature HDL particles.\n  3. Selectively de-lipidate HDL ex vivo, generating lipid-poor apoA-I.\n  4. Autologous plasma containing apoA-I is re-infused."
        text: |
          - **Autologous ApoA-I** (IV): الـ ApoA-I بتاع العيان نفسه. الـ HDL بتاعه يتعمله **de-lipidation ex vivo** (بره الجسم) فيطلع ==lipid-poor ApoA-I==، والـ plasma ترجع تتحقن.

            ليه التعب ده؟ لأن الكتاب بيقول الـ ApoA-I الفاضي **أشطر في الـ cholesterol efflux** من الـ mature HDL. تخيّل إسفنجة ناشفة وإسفنجة مليانة: الناشفة بتشرب أكتر.
          - **ApoA-I mimetic peptides** (IV): peptides صناعية خواصها زي الـ ApoA-I، فبتعمل efflux، وقللت تقدّم الـ atherosclerosis في الـ clinical trials. العيب: **الحقن** عائق قدام العلاج طويل المدى.
