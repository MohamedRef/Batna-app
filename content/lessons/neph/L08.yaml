      - kind: check
        page: 246
        quote: "Medications (Clopidogrel, Ticlopidine)."
        question: "Which drug causes immune-mediated secondary TMA in the book's table?"
        options:
          - "Clopidogrel"
          - "Cyclosporine"
          - "Mitomycin C"
          - "Tacrolimus"
        answer: 0
