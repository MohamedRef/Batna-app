            <rect x="60" y="44" width="86" height="76" class="fg-acc"/>
            <text x="66" y="74" class="t-sm">NTI, central,</text>
            <text x="66" y="92" class="t-sm">assay</text>
            <rect x="150" y="44" width="86" height="76" class="fg-box"/>
            <text x="156" y="70" class="t-sm">subclinical</text>
            <text x="156" y="88" class="t-sm">hyper,</text>
            <text x="156" y="106" class="t-sm">steroids</text>
            <rect x="240" y="44" width="86" height="76" class="fg-bad"/>
            <text x="246" y="74" class="t-sm t-b">Graves',</text>
            <text x="246" y="92" class="t-sm">toxic nodules</text>
            <rect x="60" y="124" width="86" height="76" class="fg-acc"/>
            <text x="66" y="160" class="t-sm">NTI, central</text>
            <rect x="150" y="124" width="86" height="76" class="fg-good"/>
            <text x="160" y="166" class="t-sm t-b">euthyroid</text>
            <rect x="240" y="124" width="86" height="156" class="fg-bad"/>
            <text x="246" y="170" class="t-sm t-b">trap zone:</text>
            <text x="246" y="190" class="t-sm">assay, FDH,</text>
            <text x="246" y="208" class="t-sm">L-T4, heparin,</text>
            <text x="246" y="226" class="t-sm">TSHoma, RTH</text>
            <rect x="60" y="204" width="86" height="76" class="fg-bad"/>
            <text x="66" y="238" class="t-sm t-b">primary</text>
            <text x="66" y="256" class="t-sm">hypothyroid</text>
            <rect x="150" y="204" width="86" height="76" class="fg-box"/>
            <text x="156" y="230" class="t-sm">subclinical</text>
            <text x="156" y="248" class="t-sm">hypo, poor</text>
            <text x="156" y="266" class="t-sm">compliance</text>
          </svg>
      - kind: sort
        page: 103
        quote: "When interpreting TFTs seven major patterns should be considered:"
        prompt: "حط كل سبب في الـ TFT pattern بتاعه:"
        bins: ["High FT4, low TSH", "Low FT4, TSH low/normal", "High FT4, TSH normal/high"]
        cards:
          - { text: "Toxic multinodular goitre", bin: 0 }
          - { text: "Hyperemesis gravidarum", bin: 0 }
          - { text: "Excess thyroxine ingestion", bin: 0 }
          - { text: "Isolated TSH deficiency", bin: 1 }
          - { text: "Central hypothyroidism", bin: 1 }
          - { text: "TSH-secreting adenoma", bin: 2 }
          - { text: "Resistance to thyroid hormone", bin: 2 }
          - { text: "Heparin", bin: 2 }
        why: "الـ TSH-secreting pituitary adenoma (TSHoma) والـ resistance to thyroid hormone (RTH) والـ heparin كلهم بيدّوا هرمون عالي من غير ما الـ TSH يقع. والـ central بيدّي هرمون واطي بـ TSH مش عالي."
      - kind: try
        items: [endo.L06.011, endo.L06.012, endo.L06.014, endo.L06.015, endo.L06.017]
    recap:
      - "الـ TSH حساس: تغيير صغير في الـ TH = تغيير كبير في الـ TSH."
      - "بيضللك في: علاج thyrotoxicosis قريب، NTI، interference، central، TSHoma، RTH، transport disorders."
      - "Screening = FT4 + TSH؛ ومرضى الـ replacement بأعراض محتاجين tissue markers."
      - "اطلب TFTs بس لو فيه clinical features؛ سبع أنماط؛ FT4 عالي بـ TSH مش واطي = منطقة المطبات."
    practice: [endo.L06.010, endo.L06.011, endo.L06.012, endo.L06.013, endo.L06.014, endo.L06.015, endo.L06.016, endo.L06.017, endo.L06.018]
