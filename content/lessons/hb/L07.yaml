        title: "مين بيدخل منين؟"
        text: |
          رسمة الـ Cleveland Clinic في الكتاب بتقول إن نقطة البداية بتعتمد على طريقة العدوى:

          - **Perinatal transmission**: يبدأ من ==immune tolerant== (HBeAg+ chronic infection). والتفسير المقبول إن مناعة الطفل لسه متسامحة، فبيقعد سنين في الهدنة.
          - **Horizontal transmission**: يدخل على طول في ==HBeAg+ immune active phase==، والتفسير المقبول إن مناعة الكبير بتتخانق من الأول.

          بعد كده بيحصل **e loss ± anti-HBe seroconversion**، ومنه طريقين:

          - **Inactive HBV**: وممكن منه **clearance of HBsAg**.
          - **Anti-HBe immune active phase**: الخناقة رجعت والـ HBeAg سالب.

          ومن الـ inactive ممكن يرجع يدخل الـ anti-HBe immune active، فالـ inactive carrier محتاج متابعة ومش "خف".
