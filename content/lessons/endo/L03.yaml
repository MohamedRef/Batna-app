  - id: endo.L03.lesson3
    title: "Ectopic ACTH: Cushing على السريع"
    hook: "مش هتلاقي moon face ولا buffalo hump. هتلاقي بوتاسيوم 2 ومريض بيدبل في شهرين."
    minutes: 8
    pages: [36, 38]
    topics: [acth]
    goals:
      - "تعرف أسباب الـ ectopic ACTH ونسبها"
      - "تفرّقها عن Cushing's disease"
      - "تفهم ليه البوتاسيوم بيقع"
    status: unverified
    steps:
      - kind: table
        page: 36
        quote: "Etiology\n  1. Small cell or oat cell pulmonary carcinoma 50%.\n  2. Carcinoma of thymus 10%.\n  3. Ca. pancreas (carcinoid and islet cell tumor) 10%.\n  4. Pheochromocytoma 5%.\n  5. Medullary Ca of thyroid 5%."
        title: "الأسباب"
        columns: ["Tumour", "%"]
        rows:
          - ["Small cell (oat cell) lung", "50%"]
          - ["Thymus carcinoma", "10%"]
          - ["Pancreas (carcinoid, islet)", "10%"]
          - ["Pheochromocytoma", "5%"]
          - ["Medullary Ca thyroid", "5%"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: explain
        page: 36
        quote: "Pathogenesis\n  Increased expression of proopiomelanocortin gene which encodes ACTH and other poly-peptide hormones like lipotropin, melanocyte stimulating hormone and endorphin.\n  Rarely, CRH is produced by many tumors."
        title: "الميكانيزم"
        text: |
          ==pro-opiomelanocortin (POMC) gene expression== بيزيد. الـ POMC بيتقطع لـ adrenocorticotropic hormone (ACTH) و lipotropin و melanocyte-stimulating hormone (MSH) و endorphin. نادرًا الورم بيعمل **corticotropin-releasing hormone (CRH)**.

          وفي حالات نادرة الغدة نفسها عليها **ectopic receptors**:
          - **glucose-dependent insulinotropic polypeptide (GIP) receptors**: الأكل يعلّي الـ cortisol.
          - **luteinising hormone (LH) receptors** مع macronodular hyperplasia: cushingoid في الحمل، وكامل بعد الـ menopause.

          الورم نادرًا بيعمل steroids، لأن تركيبها معقد.
      - kind: explain
        page: 37
        quote: "Ectopic ACTH Cushing can be differentiated from Cushing disease:\n  1) Presence of marked hypokalemia.\n  2) Marked increase of ACTH.\n  3) Marked increase of serum and urine cortisol.\n  4) No suppression of ACTH or cortisol by high Dexamethasone dose suppression test.\n  5) Metabolic alkalosis.\n  6) Fluid retention and hypertension.\n  7) D.M.\n  8) Steroid psychosis."
        title: "إزاي تفرّقها عن Cushing's disease"
        text: |
          كلمة السر: ==marked==.
          1. **Marked hypokalemia**.
          2. **Marked** ACTH ↑.
          3. **Marked** cortisol ↑ في الدم والبول.
          4. ==No suppression== بالـ high-dose dexamethasone.
          5. Metabolic alkalosis.
          6. Fluid retention و hypertension.
          7. diabetes mellitus (DM).
          8. Steroid psychosis.
      - kind: figure
        page: 37
        quote: "2) Marked elevation of cortisol overwhelm 11 B- hydroxysteroid dehydrogenase enzyme type2 which normally inhibits binding of cortisol to renal mineralocorticoid receptors."
        title: "ليه البوتاسيوم بيقع؟"
        alt: "Kidney tubule cell. Normally 11-beta HSD2 converts cortisol to inactive cortisone, guarding the mineralocorticoid receptor. In ectopic ACTH, a flood of cortisol overwhelms the enzyme, so cortisol binds the mineralocorticoid receptor, causing sodium retention, potassium loss and alkalosis. ACTH also drives adrenal mineralocorticoids directly."
        caption: "الـ 11β-HSD2 زي البواب: بيحوّل الـ cortisol لـ cortisone قبل ما يوصل للـ receptor. لما الـ cortisol يبقى سيل، البواب يغرق."
        svg: |
