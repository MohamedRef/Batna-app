  - id: rheum.L20.lesson7
    title: "الـ IL-23 axis: من الـ trigger للعضم"
    hook: "Trigger على جينات جاهزة، IL-23 بيشغّل الـ T cells، والعضم بيتاكل ويتبني في نفس الوقت."
    minutes: 8
    pages: [327, 329]
    topics: [pathogenesis]
    goals:
      - "تمشي على السلسلة من الـ trigger للضرر"
      - "تفهم الـ deep Koebner ودور الأمعاء"
      - "تفسّر ليه الـ PsA بيعمل erosions و new bone مع بعض"
    status: unverified
    steps:
      - kind: explain
        page: 327
        title: "من الـ trigger للضرر"
        quote: "Stimulation of Toll-like Receptors will lead to activation of the innate and adaptive immune system with the subsequent expansion of dendritic cells, macrophages, CD4+ and CD8+ T cells, neutrophils, monocytes, Natural Killer lymphocyte and other cells with the final inflammation and damage of skin, joint and enthesis."
        text: |
          الكتاب بيحكيها في سلسلة واحدة:
          1. شخص عنده ==genetic predisposition==.
          2. **Trigger**: infection، **dysbiosis**، أو **mechanic stress**.
          3. **Toll-like receptors** تتحفّز ← الـ **innate** والـ **adaptive immunity** يشتغلوا.
          4. Expansion لـ dendritic cells، macrophages، **CD4+ و CD8+ T cells**، neutrophils، monocytes، natural killer cells.
          5. النتيجة: inflammation و damage في **الجلد والمفصل والـ enthesis**.

          ليه الـ mechanic stress بالذات؟ لأن الـ enthesis هي المكان اللي الوتر بيشد فيه على العضم، يعني أكتر حتة بتتعرض لضغط ميكانيكي. وده بيمهّد للـ **deep Koebner** بعد الصورة. والكتاب بيضيف إن الـ **pro-inflammatory cytokines** والـ **proteases** بتتلاقى في الـ synovial fluid وفي الدم.
      - kind: figure
        page: 329
        title: "السلسلة في صورة واحدة"
        image: { file: rheum/L20-pathogenesis.webp, book: true }
        alt: "Pathogenesis diagram read left to right. On the left, genetic predisposition (MHC class I, mitochondrial DNA mutations) linked by a two-way arrow to environmental factors (bacterial and viral infections, physical trauma, smoke). In the middle, oxidative stress, innate immunity cells, acquired immunity cells, cytokines and enzymes. A long red arrow points right to clinical PsA: a joint with erosion, a tendon insertion with ossification, and a patch of psoriatic skin."
        caption: |
          - **الشمال**: ==genetic predisposition== (MHC class I) فوق، والـ **environmental factors** (infection، physical trauma، smoke) تحت، وسهم رايح جاي بينهم.
          - **النص**: الـ **oxidative stress**، والـ **innate immunity** (macrophages، dendritic cells، neutrophils)، والـ **acquired immunity** (B cells، CD4+ و CD8+ T cells)، وتحتهم الـ cytokines (منها **IL-12/IL-23** و **IL-17** و **TNF-α**).
          - **اليمين**: السهم الأحمر بيوصل لـ **Clinical PsA**: مفصل فيه ==erosion==، enthesis فيها **ossification**، وجلد فيه صدفية.

          يعني نفس الخطوات اللي فوق: جينات + trigger ← مناعة ← ضرر في المفصل والـ enthesis والجلد، والـ erosion والعضم الجديد مع بعض.
      - kind: explain
        remind: [rheum.L20.014]
        page: 328
        title: "الـ triggers من بره"
        quote: "Skin trauma is known to induce flares of psoriatic skin lesions, which is known as the Koebner phenomenon. There is evidence the joint trauma may induce a flare of arthritis, referred to as the \"internal\" or \"deep\" Koebner phenomenon."
        text: |
          - **Streptococcal infection** (guttate psoriasis) و **antibiotics** حديثة
          - ==Deep Koebner==: زي ما جرح الجلد بيطلّع صدفية (Koebner)، **trauma للمفصل** ممكن يعمل flare
          - **Dysbiosis**
          - **Tobacco** شكله **protective** (controversial)

          ليه الـ antibiotics في القايمة؟ لأنها بتغيّر الـ microbiota، وده نفس فكرة الـ dysbiosis والأمعاء كمصدر للـ IL-23 (التفسير المقبول، مش في الكتاب). والكتاب نفسه بيقول إن دور البيئة «suspected but difficult to confirm».
      - kind: check
        page: 328
        quote: "There is evidence the joint trauma may induce a flare of arthritis, referred to as the \"internal\" or \"deep\" Koebner phenomenon."
        question: "A man with psoriasis sprains his knee; weeks later the same knee is swollen and inflamed. Which phenomenon does the book describe?"
        options: ["Deep (internal) Koebner phenomenon", "Classic skin Koebner phenomenon", "Reactive arthritis after streptococcal infection", "Dysbiosis"]
        answer: 0
        why:
          - "صح: trauma للمفصل بيعمل flare للـ arthritis، زي ما جرح الجلد بيطلّع صدفية."
          - "الـ Koebner العادي في الجلد: جرح ← plaque."
          - "الـ streptococcal infection مرتبطة بالـ guttate psoriasis، مش بالـ trauma."
          - "الـ dysbiosis في الأمعاء، مش من الإصابة."
      - kind: aside
        tone: joke
        page: 328
        quote: "Tobacco appears to be protective against the development of psoriatic arthritis (controversial)."
        text: "الكتاب بيقول التدخين شكله protective ضد الـ PsA. لو عيانك قالك «يبقى أدخّن يا دكتور؟»، قوله: «لا. هتحمي ركبتك وتبوّظ قلبك ورئتك، صفقة خسرانة.» 🚭 والكلمة المهمة هنا **controversial**."
      - kind: figure
        page: 328
        quote: "IL-23, is a central cytokine in the pathogenesis of PsO & PsA. It stimulates resident T cells (CD3+, CD4-, CD8-, IL-23R+) leading to the production of IL-17, IL-22, and TNF-alpha, which promote inflammation, bone loss with erosions, and osteoproliferation."
        title: "محور IL-23"
        alt: "Flow diagram. Gut dysbiosis or barrier leak and macrophages and dendritic cells produce IL-23. IL-23 acts on resident IL-23R positive T cells, which release IL-17, IL-22 and TNF-alpha. These cause three outcomes: inflammation, bone erosion via neutrophils and osteoclasts, and new bone (osteoproliferation). TNF-alpha also kills osteoblasts, reducing repair."
        caption: "==IL-23== هو المايسترو، والـ **IL-17 / IL-22 / TNF-α** هم العازفين. علشان كده أدوية الـ PsA بتضرب **tumor necrosis factor (TNF)** و **IL-17** و **IL-12/23**."
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L20a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="20" y="10" width="290" height="50" rx="10" class="fg-box"/>
