      - kind: explain
        page: 124
        quote: "Bone Cysts\nBrown Tumor in The Inferior Obturator Ramus\nChondrocalcinosis of The Knee"
        title: "العضم في الصور"
        text: |
          الكتاب بيعرض صور للـ **skeletal** manifestations: **osteoclastoma of the jaw** في الـ computed tomography (CT) (ص 123)، **bone cysts**، **brown tumour** في الـ inferior obturator ramus، و **chondrocalcinosis of the knee**.

          التفسير المقبول (مش في الكتاب): الـ PTH العالي بينشّط الـ osteoclasts، فالعضم بيتاكل في أماكن ويتعمل فيها cysts. الـ **brown tumour** اسمه كده لأن فيه دم قديم (haemosiderin) بيدّيه لون بني، وهو مش ورم حقيقي. والـ **chondrocalcinosis** يعني ترسّب كالسيوم في الغضروف، وده بيعمل **pseudogout**. يعني لو شفت brown tumour في الأشعة، فكّر في الـ hyperparathyroidism مش في cancer.
