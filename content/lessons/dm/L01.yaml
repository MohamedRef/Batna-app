  - id: dm.L01.lesson2
    title: "Type 1 في 6 محطات، و Type 2 في معركتين"
    hook: "Type 1 حرب أهلية جوه البنكرياس. Type 2 مصنع شغال overtime لحد ما يقع."
    minutes: 9
    pages: [3, 5]
    topics: [t1-pathogenesis, t2-pathogenesis]
    goals:
      - "ترتّب الـ 6 stages بتاعة type 1"
      - "تشرح الـ two defects بتاعة type 2 ومين بيعمل fasting hyperglycemia"
      - "تفرّق glucotoxicity من lipotoxicity"
    status: unverified
    steps:
      - kind: explain
        page: 3
        title: "Type 1: مين بيضرب مين؟"
        quote: "Type 1 diabetes is caused by destruction of the insulin producing cells."
        text: |
          الـ **type 1** = ==destruction of the insulin producing cells==.

          فيه **strong genetic component**، بس لوحده مش كفاية: لازم **extragenetic factors** (immunologic و environmental زي الفيروسات).
      - kind: figure
        page: 3
        quote: "Natural history of type 1 diabetes comprised 6 stages"
        title: "الـ 6 stages: β-cells بتقل"
        alt: "A falling line of beta-cell mass across six stages: genetic susceptibility, environmental trigger, immune activation, loss of glucose-stimulated insulin secretion, overt diabetes when more than 90 percent are lost, and endless beta-cell failure."
        caption: "الكتلة بتنزل بهدوء لحد ما يفضل أقل من **10%**، ساعتها بس السكر يبان (==overt diabetes==). يعني لما العيان يجيلك، المعركة خلصت من زمان."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L01a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <path d="M30 20 V200 H320" class="fg-arrow" marker-end="url(#L01a)"/>
            <text x="12" y="30" class="t-sm t-mut">β</text>
            <path d="M40 40 H90 L130 60 L170 110 L210 170 L250 182 L300 196" class="fg-arrow-acc" stroke-width="3" fill="none"/>
            <path d="M30 172 H320" class="fg-thin"/>
            <text x="318" y="166" text-anchor="end" class="t-sm t-bad">10% left: overt</text>
            <text x="55" y="218" text-anchor="middle" class="t-sm t-b">I</text>
            <text x="105" y="218" text-anchor="middle" class="t-sm t-b">II</text>
            <text x="150" y="218" text-anchor="middle" class="t-sm t-b">III</text>
            <text x="190" y="218" text-anchor="middle" class="t-sm t-b">IV</text>
            <text x="235" y="218" text-anchor="middle" class="t-sm t-b">V</text>
            <text x="285" y="218" text-anchor="middle" class="t-sm t-b">VI</text>
            <text x="55" y="234" text-anchor="middle" class="t-sm">Genes</text>
            <text x="105" y="234" text-anchor="middle" class="t-sm">Trigger</text>
            <text x="150" y="234" text-anchor="middle" class="t-sm">Immune</text>
            <text x="190" y="250" text-anchor="middle" class="t-sm">↓ GSIS</text>
            <text x="235" y="234" text-anchor="middle" class="t-sm">Overt</text>
            <text x="285" y="250" text-anchor="middle" class="t-sm">Failure</text>
          </svg>
      - kind: explain
        page: 3
        title: "المحطات بالتفصيل"
        quote: "One diabetogenic gene within the HLA is necessary."
        text: |
          1. **Genetic susceptibility:** لازم **one diabetogenic gene within the HLA**؛ و **95%** من العيانين **HLA-DR3 و/أو DR4**.
          2. **Environmental trigger:** ==congenital rubella== هو الوحيد اللي **proved**. الباقي مقترح: mumps، coxsackie-B، reovirus، herpes، و chemicals/toxins.
          3. **Immune activation:** autoimmune **insulitis**، و autoantibodies: islet cell (الكتاب كاتبها ICS)، **GAD**، insulin antibodies.
          4. **Progressive loss of glucose-stimulated insulin secretion.**
          5. **Overt diabetes:** لما أكتر من **90%** من الـ β-cells تموت.
          6. **Endless β-cell failure:** insulin و **C-peptide** absent أو very low.
      - kind: order
        page: 3
        quote: "Natural history of type 1 diabetes comprised 6 stages"
        prompt: "رتّب الـ stages:"
        steps:
          - "Genetic susceptibility"
          - "Environmental trigger"
          - "Immune activation"
          - "Loss of glucose-stimulated insulin secretion"
          - "Overt diabetes"
          - "Endless beta cell failure"
        why: "منطقها: **أرض** (genes) ← **شرارة** (trigger) ← **حريقة** (immune) ← الخلايا بتقل لحد ما السكر يبان ← وبعدين مفيش خلايا خالص."
      - kind: check
        page: 3
        quote: "Congenital rubella is the only proved environmental factor."
        question: "Which environmental trigger of type 1 diabetes is proven?"
        options: ["Congenital rubella", "Coxsackie B", "Mumps", "Reovirus"]
        answer: 0
        why:
          - "صح: الوحيد الـ **proved**."
          - "مقترح بس (suggested)، مش مثبت."
          - "مقترح بس."
          - "مقترح بس."
      - kind: explain
        page: 4
        title: "Type 2: عيبين مع بعض"
        quote: "Type 2 diabetes is caused by a combination of decreased insulin action and inadequate insulin secretion."
        text: |
          الـ **type 2** = ==decreased insulin action== + **inadequate insulin secretion**.

          - **Genetic:** غالبًا **multigenic**.
          - **Environmental:** obesity، sedentary life، physical inactivity، hypertension، dyslipidemia، increased age، smoking، stress.

          ومين بيبدأ الأول؟ الكتاب صريح: **still controversial**.
      - kind: figure
        page: 4
        quote: "hepatic glucose production (HGP): the major contributor to fasting hyperglycemia."
        title: "تلات أعضاء ضد الـ insulin"
        alt: "Three boxes. Liver: increased hepatic glucose production, the major cause of fasting hyperglycemia. Adipose tissue: increased lipolysis and free fatty acids. Muscle: decreased glucose uptake. All feed into high blood glucose."
        caption: "الكبد هو بطل الـ ==fasting hyperglycemia==: بالليل وانت نايم بيضخ سكر مع إن مفيش داعي. الدهون بتطلّع **FFAs**، والعضلات مش بتسحب سكر."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L01b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker></defs>
            <rect x="10" y="10" width="100" height="90" rx="10" class="fg-bad"/>
            <text x="60" y="34" text-anchor="middle" class="t-b">Liver</text>
            <text x="60" y="56" text-anchor="middle" class="t-sm">↑ glucose</text>
            <text x="60" y="72" text-anchor="middle" class="t-sm">production</text>
            <text x="60" y="90" text-anchor="middle" class="t-sm t-bad t-b">fasting BG</text>
            <rect x="115" y="10" width="100" height="90" rx="10" class="fg-box"/>
            <text x="165" y="34" text-anchor="middle" class="t-b">Adipose</text>
            <text x="165" y="56" text-anchor="middle" class="t-sm">↑ lipolysis</text>
            <text x="165" y="72" text-anchor="middle" class="t-sm">↑ FFAs</text>
            <rect x="220" y="10" width="100" height="90" rx="10" class="fg-box"/>
            <text x="270" y="34" text-anchor="middle" class="t-b">Muscle</text>
            <text x="270" y="56" text-anchor="middle" class="t-sm">↓ glucose</text>
            <text x="270" y="72" text-anchor="middle" class="t-sm">uptake</text>
            <path d="M60 100 L150 160" class="fg-arrow-bad" marker-end="url(#L01b)"/>
            <path d="M270 100 L180 160" class="fg-arrow-bad" marker-end="url(#L01b)"/>
            <path d="M165 100 V150" class="fg-arrow" marker-end="url(#L01b)"/>
            <rect x="95" y="165" width="140" height="34" rx="10" class="fg-ink"/>
            <text x="165" y="187" text-anchor="middle" class="t-b">Hyperglycemia</text>
            <text x="165" y="228" text-anchor="middle" class="t-sm t-mut">FFAs → lipotoxicity; high BG → glucotoxicity</text>
          </svg>
      - kind: explain
        page: 5
        title: "الحلقة المفرغة"
        quote: "Glucotoxicity: high BG levels further impair"
        text: |
          - ==Glucotoxicity==: السكر العالي نفسه بيبوّظ الـ β-cell أكتر.
          - ==Lipotoxicity==: الـ **FFAs** العالية بتبوّظ الـ β-cell **و** الـ insulin action.

          ولو الـ **insulin resistance** هي البداية: الـ β-cells تعوّض بـ **hyperinsulinemia**، لحد ما تتعب ومتقدرش تزوّد، فالـ secretion يقع والسكر يعلى.
      - kind: aside
        tone: joke
        page: 5
        quote: "the pancreatic beta cells secrete more insulin to compensate for the peripheral defects of insulin action (hyperinsulinemia)."
        text: "الـ β-cell في type 2 زي الموظف الوحيد اللي بيشتغل في القسم: كل ما الباقيين (الـ tissues) يطنّشوا، يشتغل overtime (**hyperinsulinemia**)... لحد ما ياخد إجازة مرضي ومحدش يغطّي. وساعتها بس المدير يلاحظ إن في مشكلة (**hyperglycemia**)."
      - kind: reveal
        page: 4
        quote: "hepatic glucose production (HGP): the major contributor to fasting hyperglycemia."
        prompt: "ليه الكبد بالذات هو اللي بيعمل الـ fasting hyperglycemia، مش العضلات؟"
        answer: |
          وانت صايم مفيش أكل داخل، فالسكر اللي في الدم كله جاي من **hepatic glucose production**. الـ **insulin** طبيعيًا بيقفل الحنفية دي. لو الكبد **resistant**، الحنفية تفضل مفتوحة طول الليل.

          العضلات بتسحب السكر أساسًا **بعد الأكل**، فعيبها بيبان أكتر في سكر ما بعد الأكل. (تفسير فسيولوجي؛ المعلومة إن الـ HGP هو **the major contributor** من الكتاب.)
      - kind: try
        items: [dm.L01.022, dm.L01.023, dm.L01.024, dm.L01.033, dm.L01.034]
    recap:
      - "Type 1: genes (HLA؛ 95% DR3/DR4) ← trigger (rubella الوحيد المثبت) ← insulitis (ICA، GAD) ← ↓ GSIS ← overt (>90% ماتوا) ← failure."
      - "Type 2: ↓ action + ↓ secretion؛ مين الأول controversial."
      - "الكبد (↑ HGP) = أهم سبب للـ fasting hyperglycemia؛ adipose ← FFAs؛ muscle ← ↓ uptake."
      - "Glucotoxicity و lipotoxicity بيكمّلوا على الـ β-cell."
    practice: [dm.L01.021, dm.L01.022, dm.L01.023, dm.L01.024, dm.L01.025, dm.L01.026, dm.L01.027, dm.L01.028, dm.L01.029, dm.L01.030, dm.L01.031, dm.L01.032, dm.L01.033, dm.L01.034, dm.L01.035, dm.L01.036, dm.L01.037, dm.L01.116, dm.L01.117, dm.L01.118, dm.L01.132]
