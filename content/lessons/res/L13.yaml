      - kind: explain
        page: 28
        quote: "Results\nTables\nA table should be readily understood without reference to the text.\nA table should have a title which exactly describes the content of the table (WHAT – WHEN – WHO – WHERE).\nIt should have short or abbreviated headings for columns and rows and, if necessary, a footnote for explanation of non-standard abbreviations that are used, and for identification of statistical measures of variations, such as SD and SEM."
        title: "الجدول يتفهم لوحده"
        text: |
          - الجدول **يتفهم من غير ما ترجع للنص**.
          - العنوان يوصف المحتوى بالظبط: ==WHAT – WHEN – WHO – WHERE==.
          - headings قصيرة للأعمدة والصفوف، و**footnote** تشرح الاختصارات غير الـ standard ومقاييس الـ variation زي SD و SEM.
      - kind: explain
        page: 30
        quote: "Results\nTables\nTables should have a logical structure.\nColumns should be arranged from left to right in a logical sequence, e.g. to reflect the sequence in which data were collected or changes over time.\nRows should be arranged from top to bottom in a logical order, e.g. by ascending order of age."
        title: "ترتيب الجدول"
        text: |
          - **الأعمدة** من الشمال لليمين بترتيب منطقي، زي ترتيب جمع الداتا أو التغيّر مع الوقت.
          - **الصفوف** من فوق لتحت بترتيب منطقي، زي السن تصاعدي.
      - kind: check
        page: 34
        quote: "Results\nIllustrations\nIllustrations should be used only for:\nA specific purpose. An illustration may be used as evidence to support the argument, since \"seeing is believing\".\nGraphs are used to illustrate relationships. If exact values are important, a table is preferable to a graph; when trends and relationships are more important than exact values, a graph is more efficient."
        question: "You want to show HbA1c month by month over a year. Best choice?"
        options: ["A graph", "A table", "Text", "Leave it out"]
        answer: 0
        why:
