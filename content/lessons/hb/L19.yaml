      - kind: reveal
        page: 380
        quote: "Supersaturationof bile with cholesterol most commonly results from excessive cholesterol secretion (as occurs in obesity or diabetes) but may result from a decrease in bile salt secretion (eg, in cystic fibrosis because of bile salt malabsorption) or in lecithin secretion (eg, in a rare genetic disorder that causes a form of progressive intrahepatic familial cholestasis)."
        prompt: "ليه الـ **cystic fibrosis** ممكن تعمل cholesterol stones، مع إن الـ cholesterol نفسه مش زايد؟"
        answer: |
          لأن المشكلة في الكفة التانية من الميزان.

          - الـ CF بتعمل ==bile salt malabsorption==.
          - فالـ bile salts اللي راجعة للكبد بتقل، والـ secretion بتقل.
          - الـ cholesterol نفس الكمية، بس اللي شايله بقى أقل.
          - النتيجة: bile **supersaturated** وحصوات cholesterol.

          ونفس المنطق بالظبط في الـ ileal resection اللي في عوامل الخطر في مصر.
      - kind: table
        page: 380
        quote: "Black pigment stonesare small, hard gallstones composed of Ca bilirubinateand inorganic Ca salts (eg, Ca carbonate, Ca phosphate). Factors that accelerate their development include alcoholic liver disease, chronic hemolysis, and older age."
