  # ---------- p48-50, p68-69: CRF reproductive ----------
  - id: endo.L04.036
    kind: enumerate
    topic: crf-reproductive
    prompt: Hormonal changes of the reproductive system in chronic renal disease.
    points:
      - Changes in androgen synthesis and metabolism
      - Hyperprolactinaemia
    pass: 2
    hook: "الإنجاب في الكلى المزمنة 2: «الـ androgen يتلخبط تصنيعه وأيضه، والبرولاكتين يعلى»."
    src: { page: 48, quote: "Hormonal Changes in KRD\n  1- Changes in androgen Synthesis & metabolism.\n  2- Hyperprolactinaemia." }
    status: unverified
  - id: endo.L04.037
    kind: card
    topic: crf-reproductive
    front: When do the androgen changes of chronic renal insufficiency appear?
    back: Early after the onset of renal insufficiency.
    src: { page: 48, quote: "Endocrine abnormalities are a common feature of chronic renal insufficiency. Changes of androgen synthesis and metabolism develop early after the onset of renal insufficiency." }
    status: unverified
  - id: endo.L04.038
    kind: card
    topic: crf-reproductive
    front: What is thought to cause the endocrine changes of chronic renal insufficiency?
    back: Uraemic toxins and concomitant drugs, though the exact mechanism remains unclear.
    src: { page: 48, quote: "Uremic toxins, and concomitant drug administration are supposed to contribute to the observed changes, yet the exact mechanism remain unclear." }
    status: unverified
  - id: endo.L04.039
    kind: cloze
    topic: crf-reproductive
    text: In male CRF, plasma testosterone is {{c1::decreased or low normal}} in spite of {{c2::increased}} LH and FSH.
    src: { page: 48, quote: "The plasmsa testosterone levels are decreased or low normal ( inspite of an increased LH and FSH). The changes in testosterone levels are likely to be caused by primary hypogonadism and/or Disturbances of the hypothalamic– pituitary axis i.e. the consequence of a combined abnormality." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.040
    kind: card
    topic: crf-reproductive
    front: At what level is the testosterone defect in male CRF?
    back: A combined abnormality, primary hypogonadism and/or disturbance of the hypothalamic–pituitary axis.
    src: { page: 48, quote: "The plasmsa testosterone levels are decreased or low normal ( inspite of an increased LH and FSH). The changes in testosterone levels are likely to be caused by primary hypogonadism and/or\nDisturbances of the hypothalamic– pituitary axis i.e. the consequence of a combined abnormality." }
    status: unverified
  - id: endo.L04.041
    kind: enumerate
    topic: crf-reproductive
    prompt: Why is testosterone low or low-normal in chronic renal failure? (7 reasons)
    points:
      - Less pulsatile hypothalamic GnRH release
      - Diminished pituitary response to GnRH
      - Impaired feedback; low testosterone fails to drive adequate gonadotrophin synthesis
      - Peripheral Leydig-cell resistance from a circulating LH-receptor inhibitor
      - Decreased metabolic clearance of GnRH, LH and FSH
      - Increased prolactin, which suppresses FSH and LH
      - Age-related rise in SHBG (+1.2%/year), lowering free testosterone further
    pass: 5
    hook: "التستوستيرون في CRF واطي بـ7: 4 «على طول المحور»: GnRH pulses أقل، pituitary مبيستجيبش لـGnRH كويس، feedback بايظ (التستوستيرون الواطي مبيشغّلش gonadotrophins كفاية)، وLeydig resistance من LH-receptor inhibitor في الدم… و3 «من برّه»: clearance أقل لـGnRH وLH وFSH، prolactin عالي يكتم FSH وLH، وSHBG يزيد مع السن (+1.2%/year) فالـfree يقل. 4 + 3 = 7."
    src: { page: 48, quote: "Why testosterone levels are decreased or low normal?\n  1- Decrease of the pulsatility of hypothalamic GRH (gonadotrophin releasing hormone) release.\n  2- Diminished answer of the pituitary gland to GRH." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.042
    kind: cloze
    topic: crf-reproductive
    text: Leydig-cell resistance in CRF is due to a circulating {{c1::LH-receptor inhibitor}}.
    src: { page: 49, quote: "3- Low testosterone levels are not able to induce adequate gonadotrophin synthesis(impaired feed the hypothalamic– pituitary level back mechanism).\n4- Peripheral leydig-cell resistance (dt circulating LH-receptor inhibitor).\n5- Decreased metabolic clearance of at least GRH, LH, FSH.\n6- Increased prolactin (it suppers FSH& LH secretion).\n7- The age-related increase in SHBG (sex hormone binding globulin) levels (+1.2%/year) further induces a more fall in free testosterone." }
    status: unverified
  - id: endo.L04.043
    kind: cloze
    topic: crf-reproductive
    text: SHBG rises with age by about {{c1::1.2%}} per year, further lowering {{c2::free}} testosterone.
    src: { page: 49, quote: "3- Low testosterone levels are not able to induce adequate gonadotrophin synthesis(impaired feed the hypothalamic– pituitary level back mechanism).\n4- Peripheral leydig-cell resistance (dt circulating LH-receptor inhibitor).\n5- Decreased metabolic clearance of at least GRH, LH, FSH.\n6- Increased prolactin (it suppers FSH& LH secretion).\n7- The age-related increase in SHBG (sex hormone binding globulin) levels (+1.2%/year) further induces a more fall in free testosterone." }
    status: unverified
  - id: endo.L04.044
    kind: card
    topic: crf-reproductive
    front: How does raised prolactin lower testosterone in CRF?
    back: Prolactin suppresses FSH and LH secretion.
    src: { page: 49, quote: "3- Low testosterone levels are not able to induce adequate gonadotrophin synthesis(impaired feed the hypothalamic– pituitary level back mechanism).\n4- Peripheral leydig-cell resistance (dt circulating LH-receptor inhibitor).\n5- Decreased metabolic clearance of at least GRH, LH, FSH.\n6- Increased prolactin (it suppers FSH& LH secretion).\n7- The age-related increase in SHBG (sex hormone binding globulin) levels (+1.2%/year) further induces a more fall in free testosterone." }
    status: unverified
  - id: endo.L04.045
    kind: enumerate
    topic: crf-reproductive
    prompt: Consequences of androgen deficit in CRF.
    points:
      - Body composition change; BMI up from more fat, lean and muscle mass down
      - Osteoporosis and more fractures
      - Impaired libido and sexual function, possibly depression
    pass: 3
    hook: "نقص الـ androgen في الـ CRF بيعمل 3: «الجسم يتغير (دهن أكتر فالـ BMI يعلى، وعضل أقل)، العضم يضعف (osteoporosis وكسور)، والرغبة تقل (libido وsexual function، وممكن depression)»."
    src: { page: 49, quote: "Consequences of deficit androgen\na) Changes in body composition : Body mass index (BMI) increases via an increment of body fat, while Depression. Lean body mass is reduced, thus associated with reduced muscle mass." }
    status: unverified
  - id: endo.L04.046
    kind: cloze
