  - id: res.L05.lesson4
    title: "الـ cohort والـ RR والـ AR"
    hook: "تابع 200 مدخن و200 مش مدخن. كام واحد هيجيله cancer؟ ومن كل اللي جالهم، كام في المية بسبب السيجارة؟"
