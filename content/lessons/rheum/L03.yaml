  - id: rheum.L03.lesson7
    title: "Type IV: الجيش المتأخر"
    hook: "Type IV زي جيش بيوصل بعد 3 أيام، بس لما يوصل بيبني قلعة (granuloma)."
    minutes: 8
    pages: [65, 66]
    topics: [type4]
    goals:
      - "تعرف توقيت الـ type IV وتشرح ليه بيتأخر"
      - "تعرف مين بيعمل الضرر: T cells و macrophages (95%)"
      - "تفرّق الأربع أنواع بالتوقيت والمثال"
    status: unverified
    steps:
      - kind: explain
        page: 65
        quote: "Is immunopathological damage occurring 24-72 hours after exposure of a sensitized individual to an antigen."
        title: "Type IV: الـ delayed type"
        text: |
          - Damage بعد ==24-72 ساعة== من التعرّض في واحد sensitized.
          - مش antibody: **effector T cells و macrophages**.
          - أول تعرّض: CD4 Th تتنشّط وتتكاثر في **1-2 أسبوع**.
          - التعرّض التاني: تفرز cytokines ← تجيب macrophages، وهي ==95%== من الخلايا.
          - Activated macrophages: phagocytosis أقوى.

          التفسير المقبول (مش في الكتاب): ليه 24-72 ساعة؟ عشان مفيش antibody جاهز. الـ memory T cells لازم تشوف الـ antigen، تفرز cytokines، تجيب macrophages من الدم وتشغّلها، وكل ده بياخد أيام. يعني لو اختبار الـ tuberculin اتقرا بعد ساعة هيبان سلبي، وده سبب إنه بيتقرا بعد 48-72 ساعة.
      - kind: explain
        page: 65
        quote: "Upon first contact with antigen a subset of CD4 Th cells is activated and clonally expands this takes 1-2 wks."
        title: "ليه 24-72 ساعة؟"
        text: |
          الكتاب بيدّي السبب في رسمة صفحة 66: الـ antigen لازم **يتعرض على الـ T cells الأول**، وهي اللي بعدين تشغّل الـ macrophages.

          قارن بالـ type I:
          - في type I الـ IgE **قاعد جاهز** على الـ mast cell، فأول ما الـ allergen يوصل الحبيبات بتفضى في **دقايق**.
          - في type IV مفيش حاجة جاهزة على الخلايا. الـ sensitized Th cells لازم **تلاقي** الـ antigen، **تفرز cytokines**، والـ cytokines **تنادي** macrophages من الدم، وتنشّطها. كل خطوة بتاخد ساعات.

          وأول مرة خالص أطول كمان: الـ CD4 Th محتاجة ==1-2 أسبوع== تتنشّط وتعمل clonal expansion. عشان كده الـ type IV محتاج حد **sensitized** من قبل.
      - kind: order
        page: 66
        quote: "The immune mechanisms of type IV HS. These reactions take days to be initiated because Ag is 1st presented to T cells which then activate macroph."
        prompt: "رتّب الـ type IV زي رسمة صفحة 66:"
        steps:
          - "Antigen"
          - "Antigen-presenting cell"
          - "Sensitized T cell secretes cytokines"
          - "Macrophages attracted and activated"
          - "Granuloma formation"
        why: "بياخد أيام لأن الـ antigen لازم يتعرض على الـ T cells الأول، وهي اللي تشغّل الـ macrophages. الأمثلة: M. TB و Leishmania."
      - kind: explain
        page: 66
        quote: "Activated macrophages have increased phagocytic ability and can destroy pathogens more effectively."
        title: "ليه الأمثلة كلها ميكروبات جوه الخلايا؟"
        text: |
          الكتاب بيدّي مثالين: **M. TB** و **Leishmania**، والاتنين ==intracellular pathogens==.

          التفسير المقبول (مش في الكتاب): الميكروب اللي قاعد **جوه** الخلية، الـ antibody مش بيوصله. الحل الوحيد إن الـ macrophage اللي هو جواه **يتنشّط** فيقدر يقتله، وده بالظبط اللي الـ type IV بيعمله: الـ activated macrophages بتبقى **phagocytic ability أعلى** وبتدمّر الميكروب أحسن.

          ولو الميكروب صعب يتقتل، الـ macrophages بتتجمع حواليه في **granuloma** تحبسه. الثمن: النسيج اللي حواليه بيتأذي، وده الـ hypersensitivity.
      - kind: figure
        page: 66
        title: "الـ type IV خطوة خطوة"
        image: { file: rheum/L03-type-iv.webp, book: true }
        alt: "Flow diagram: an antigen goes to an APC, which goes to a round cell labelled macrophage; an arrow labelled attract and activate leads to an activated macrophage, which leads to granuloma formation."
        caption: |
          رسمة الكتاب في صفحة 66، من الشمال لليمين وبعدين لتحت:

          - **antigen** ← **antigen-presenting cell (APC)** ← خلية مدوّرة فوق يمين مكتوب عليها macrophage. الكلام في نفس الصفحة بيقول إن الـ APC بتعرض على الـ **sensitized Th cells**، وهي اللي بتطلّع cytokines تجذب الـ macrophages وتنشّطها.
          - السهم لتحت مكتوب عليه **attract and activate** ← **macrophage** متنشّط (تحت يمين، مليان حبيبات).
          - السهم لشمال ← ==granuloma formation==.

          يعني الـ type IV بياخد وقت عشان فيه عرض على خلايا الأول، وفي الآخر الـ macrophage بيحاوط الميكروب في granuloma، زي الـ TB.
      - kind: figure
        page: 65
        quote: "In contrast to to type I, II and III which are antibody mediated type IV HS results primarily from the actions of effector T cells and macrophages."
        title: "الأربع أنواع على الساعة"
        alt: "A horizontal time axis from minutes to days. Type I sits at minutes with IgE and mast cell. Type II sits at minutes to hours with antibody on a cell. Type III sits at days to two weeks with immune complexes. Type IV sits at 24 to 72 hours after re-exposure with T cells and macrophages."
        caption: "Type I في دقايق (IgE جاهز). Type II دقايق لساعات (زي الـ transfusion). Type III أيام (serum sickness). Type IV بعد 24-72 ساعة من التعرض التاني (T cells و macrophages)."
