        answer: |
          الكتاب بيجاوب: **glucocorticoids** هما **initial treatment of choice**، والـ **steroid-sparing** بيتضاف حسب الاستجابة. والـ **anti-Mi-2** مرتبط بالـ **classic DM** و **good prognosis**، والشرح بيقول: ==typical skin features and a favorable treatment response==.

