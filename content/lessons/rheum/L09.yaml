  - id: rheum.L09.lesson3
    title: "التشخيص والـ cancer والعلاج"
    hook: "قبل ما تكتب prednisone: MRI يوريك فين تاخد العينة، ونظرة على عوامل الـ cancer."
    minutes: 8
    pages: [167, 172]
    topics: [diagnosis, malignancy, treatment]
    goals:
      - "ترتب الـ workup: enzymes، EMG، MRI، biopsy"
      - "تعرف مين محتاج cancer screening"
      - "تحفظ سلّم العلاج"
    status: unverified
    steps:
      - kind: explain
        page: 167
        title: "الـ workup"
        quote: "Elevated muscle enzymes (CK, aldolase, AST, ALT, LDH)."
        text: |
          - **Enzymes:** ==CK==، aldolase، AST، ALT، LDH (أيوه الـ AST و ALT من العضلة كمان، ما تتلخبطش وتفتكره كبد)
          - **Antibody panels:** MSAs و MAAs
          - **EMG:** myopathic: **short-duration, low-amplitude** MUPs + spontaneous activity (fibrillations، positive sharp waves)
          - **Biopsy:** ==تأكيد وتفرقة== بين الأنواع
          - **MRI:** oedema و inflammation و ==يحدد مكان الـ biopsy==
      - kind: order
        page: 167
        quote: "Useful for detecting muscle edema, inflammation, and guiding biopsy sites."
        prompt: "رتّب خطوات تأكيد الـ myositis في عيان ضعيف proximally:"
        steps:
          - "CK and muscle enzymes, antibody panel"
          - "EMG for a myopathic pattern"
          - "MRI to find oedematous, inflamed muscle"
          - "Biopsy of that muscle to confirm and subtype"
        why: "الدم الأول (سهل)، والـ EMG يأكد إنه myopathy، والـ MRI يختار العضلة الملتهبة، وبعدين الـ biopsy من المكان ده علشان ما تطلعش سليمة."
      - kind: explain
        page: 168
        title: "الـ cancer"
        quote: "High-risk features include Older age Male sex Anti-TIF1γ positivity Severe skin disease Rapid onset of muscle weakness"
        text: |
          الـ ==adult-onset DM== مرتبط بزيادة الـ malignancy.

          **High risk:** older age، **male**، ==anti-TIF1γ==، **severe skin**، **rapid onset** weakness.

          الـ screening حسب السن والنوع: **mammogram**، pelvic exam، **CT**، tumour markers.
      - kind: check
        page: 168
        quote: "Certain IIMs, particularly adult-onset dermatomyositis, are associated with an increased risk of malignancy."
        question: "Who most needs malignancy screening?"
        options:
          - "A 66-year-old man with rapid-onset DM, severe rash, anti-TIF1γ +"
          - "A 9-year-old with juvenile DM, anti-NXP2 +"
          - "A 40-year-old woman with overlap myositis and anti-U1-RNP"
          - "A 35-year-old with classic DM and anti-Mi-2"
        answer: 0
        why:
          - "صح: كل عوامل الخطر مجمعة: سن، ذكر، TIF1γ، جلد شديد، بداية سريعة."
          - "الـ juvenile DM مش هو الـ adult-onset المرتبط بالـ cancer."
          - "الـ overlap مش في قائمة الـ high risk."
          - "الـ Mi-2 بـ prognosis كويس."
      - kind: table
        page: 168
        quote: "Glucocorticoids: Prednisone is the initial treatment. Steroid-sparing agents: Methotrexate, azathioprine, or mycophenolate mofetil."
        title: "سلّم العلاج"
        columns: [Step, Drug]
        rows:
          - ["First line", "Prednisone"]
          - ["Steroid-sparing", "MTX, AZA or MMF"]
          - ["Refractory", "IVIG or rituximab"]
          - ["RP-ILD", "Cyclophosphamide"]
          - ["Always", "Physical therapy"]
        hide: [[0, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: exam
        page: 168
        quote: "Physical Therapy Critical to preserve muscle strength and prevent atrophy."
        text: |
          ما تنساش ==physical therapy== في إجابة الـ essay: الكتاب بيقول **critical** علشان تحافظ على القوة وتمنع الـ atrophy.

          والـ prognosis بيتحدد بالـ **subtype** ووجود **ILD** أو **malignancy**، والتشخيص بدري يحسّنه.
      - kind: case
        page: 171
        quote: "IBM is common in elderly men and is poorly responsive to immunosuppressive therapy."
        stem: "A 72-year-old man: 3 years of asymmetric weakness of the right quadriceps and left finger flexors. CK mildly raised. No rash. No response to prednisone."
        steps:
          - question: "Most likely subtype?"
            options: ["Inclusion body myositis", "Dermatomyositis", "Polymyositis", "IMNM"]
            answer: 0
            why: "راجل كبير + asymmetric + distal + مفيش استجابة = IBM. الـ DM فيه rash، الـ PM symmetric ونادر، والـ IMNM عنده antibodies و necrosis."
          - question: "Biopsy finding?"
            options: ["Rimmed vacuoles and protein aggregates", "Perifascicular atrophy", "Necrosis with minimal inflammation", "Normal muscle"]
            answer: 0
            why: "الـ IBM = degeneration (rimmed vacuoles) + inflammation. الـ perifascicular = DM. الـ necrosis من غير التهاب = IMNM."
      - kind: try
        items: [rheum.L09.029, rheum.L09.031, rheum.L09.033, rheum.L09.035, rheum.L09.052]
    recap:
      - "Workup: CK وأخواتها، antibodies، EMG myopathic، MRI يختار المكان، biopsy يأكد ويفرق."
      - "Adult DM = cancer risk، خصوصًا كبير، ذكر، TIF1γ، جلد شديد، بداية سريعة."
      - "Prednisone ← MTX/AZA/MMF ← IVIG/rituximab، و CYC للـ RP-ILD، و physiotherapy دايمًا."
    practice: [rheum.L09.028, rheum.L09.029, rheum.L09.030, rheum.L09.031, rheum.L09.032, rheum.L09.033, rheum.L09.034, rheum.L09.035, rheum.L09.036, rheum.L09.037, rheum.L09.038, rheum.L09.039, rheum.L09.040, rheum.L09.047, rheum.L09.048, rheum.L09.050, rheum.L09.052]
