            <text x="82" y="477" text-anchor="middle" class="t-sm">ANA and/or SMA</text>
            <rect x="170" y="434" width="155" height="56" rx="6" class="fg-acc"/>
            <text x="247" y="456" text-anchor="middle" class="t-b">Type 2</text>
            <text x="247" y="477" text-anchor="middle" class="t-sm">anti-LKM1</text>
            <text x="165" y="524" text-anchor="middle" class="t-sm t-mut">Book Fig. 1, page 206 (redrawn)</text>
          </svg>
      - kind: mnemonic
        page: 206
        word: "CAVIA"
        parts:
          - { key: "C", text: "Ceruloplasmin normal (no Wilson)" }
          - { key: "A", text: "AMA negative (no PBC)" }
          - { key: "V", text: "Viral markers negative: HBsAg, anti-HCV, IgM anti-HAV" }
          - { key: "I", text: "Iron level normal or nonspecific (no hemochromatosis)" }
          - { key: "A", text: "Alpha-1 antitrypsin phenotype normal" }
        hook: |
          **Cavia** يعني «فار تجارب» (guinea pig). قبل ما تقول AIH، الكبد لازم يتعمل عليه **CAVIA**: يتفحص لكل المتهمين التانيين الأول. ولو فاتك واحد، انت اللي بقيت فار التجارب في الامتحان. 😄
      - kind: sort
        page: 206
        prompt: "حط كل نقطة في الخانة الصح:"
        bins: ["Definite AIH", "Probable AIH"]
        cards:
          - { text: "ANA, SMA or LKM1 titre ≥ 1:80", bin: 0 }
          - { text: "No drugs or blood products", bin: 0 }
          - { text: "Alcohol < 25 g/day", bin: 0 }
          - { text: "Titre ≥ 1:40 is enough", bin: 1 }
          - { text: "Previous drugs or blood products", bin: 1 }
          - { text: "Only anti-SLA/LP positive (no ANA, SMA or LKM1)", bin: 1 }
        why: "الـ definite: titre ≥ 1:80، مفيش أدوية ولا نقل دم، والكحول أقل من 25 g/day. الـ probable بتسمح بـ titre ≥ 1:40، بتاريخ أدوية أو دم أو كحول، وبالـ investigational antibodies زي anti-SLA/LP. الاتنين محتاجين GG ≥ 1.5× normal."
      - kind: reveal
        page: 204
        prompt: "ليه مش كفاية ANA موجب + interface hepatitis علشان تقول AIH؟"
        answer: |
          لأن الـ AIH في تعريفها نفسه **diagnosed after exclusion of other chronic liver diseases**.

          الـ interface hepatitis والـ autoantibodies ممكن يظهروا في أمراض كبد تانية (viral، Wilson، drugs...). علشان كده الـ algorithm بيحط خطوة **الاستبعاد** قبل الـ biopsy: لو نسيتها ممكن تدي steroids لواحد عنده HBV أو Wilson.
      - kind: check
        page: 206
        question: "A woman has features of AIH. ANA, SMA and anti-LKM1 are negative, but anti-SLA/LP is positive. How is she classified?"
        options:
          - "Probable AIH"
          - "Definite type 1 AIH"
          - "Definite type 2 AIH"
          - "AIH is excluded"
        answer: 0
        why:
          - "صح: اللي مالوش conventional autoantibodies وعنده investigational marker (زي anti-SLA/LP) بيتصنّف **probable**."
          - "الـ type 1 محتاج **ANA و/أو SMA**، وهي سالبين."
          - "الـ type 2 محتاج **anti-LKM1**، وهو سالب."
          - "غلط: غياب الـ conventional antibodies مش بينفي الـ AIH، بيخليها probable."
      - kind: aside
        tone: exam
        page: 206
        text: |
          الأرقام اللي بتتسأل: **GG ≥ 1.5× normal** في الاتنين، و **1:80 للـ definite** و **1:40 للـ probable**، والكحول **< 25 g/day** للـ definite.

          سهلة: الـ definite «ضعف» الـ probable في الـ titre (80 = 2 × 40).
      - kind: try
        items: [hb.L13.004, hb.L13.009, hb.L13.013, hb.L13.015]
    recap:
      - "AIH = interface hepatitis + hypergammaglobulinemia/autoantibodies + استبعاد باقي الأمراض."
      - "Interface hepatitis (limiting plate مكسورة بـ lymphoplasmacytic infiltrate) هي الـ hallmark."
      - "استبعد بـ **CAVIA**: ceruloplasmin، AMA، viral، iron، α1-AT."
      - "Definite: titre ≥ 1:80، مفيش drugs/blood، alcohol < 25 g. Probable: ≥ 1:40 أو investigational antibodies."
      - "Type 1 = ANA/SMA. Type 2 = anti-LKM1."
    practice: [hb.L13.001, hb.L13.002, hb.L13.003, hb.L13.004, hb.L13.005, hb.L13.006, hb.L13.007, hb.L13.008, hb.L13.009, hb.L13.010, hb.L13.011, hb.L13.012, hb.L13.013, hb.L13.014, hb.L13.015, hb.L13.016, hb.L13.021, hb.L13.022, hb.L13.023, hb.L13.227]

  # ------------------------------------------------------------------
  - id: hb.L13.lesson2
    title: "تلات أنواع وأربع variants"
    hook: "type 1 للكبار، type 2 للأطفال، وفيه variants نصها AIH ونصها cholangitis. نرتّبهم مرة واحدة."
    minutes: 8
    pages: [207, 209]
    topics: [aih-types]
    goals:
      - "تشرح الـ shared motif hypothesis بكلام بسيط"
      - "تفرّق الـ 3 types بالـ antibody والسن"
      - "تعرف كل variant بيتعالج إزاي ومتى تضيف UDCA"
    status: unverified
    steps:
      - kind: explain
        page: 207
        title: "إيه اللي بيشعللها؟"
        text: |
          الـ pathogenesis **unknown**، بس الفرضية المشهورة إنها **constellation of interactive factors**:

          - **Triggering agent:** infection، drugs، أو toxins.
          - **Genetic predisposition.**
          - **Autoantigen display**، **immunocyte activation**، و **effector cell expansion**.

          والـ liver cell destruction بتحصل بـ **cell-mediated cytotoxicity**، أو **antibody-dependent cell-mediated cytotoxicity**، أو الاتنين.
      - kind: explain
        page: 207
        title: "الـ HLA والـ shared motif"
        text: |
          الـ **class II MHC** عنده **antigen binding groove** بيقدّم فيه الـ peptides للـ immune cells. شكل الـ groove ده بيحدده الـ alleles.

          - الـ susceptibility alleles على **DRB1**: في البيض (northern Europe و North America) هما **DRB1\*0301** و **DRB1\*0401**.
          - الاتنين بيشفّروا نفس الـ sequence: **LLEQKR**، والـ **lysine (K)** في **position 71** من الـ DRβ chain.
          - في Mexican و Japanese و Argentine adults: **DRB1\*0404** و **\*0405**، بنفس الـ sequence تقريبًا بس **arginine (R)** بدل الـ K عند DRβ71.

          ده الـ **shared motif hypothesis**: الخطر مرتبط بالـ amino acid sequence في الـ groove، و alleles مختلفة ممكن تعمل نفس الـ sequence. الـ motif ده بيحدد أنهي peptides تتقدّم.

          والـ autoantigen الوحيد المعروف كـ target هو **CYP2D6** (cytochrome P450 IID6).
      - kind: aside
        tone: analogy
        page: 207
        text: |
          الـ groove زي **قفل**، والـ peptide هو **المفتاح**. Alleles مختلفة (0301، 0401) ممكن تكون قِفل من مصانع مختلفة بس **نفس الفتحة** (LLEQKR)، فبتفتح لنفس المفاتيح الغلط. ده كل معنى «shared motif».
      - kind: table
        page: 208
        title: "Table 1: الـ 3 types (اكشف الخانات الفاضية)"
        columns: ["Feature", "Type 1", "Type 2", "Type 3"]
        rows:
          - ["Conventional antibodies", "ANA, SMA", "anti-LKM1", "None"]
          - ["Novel antibodies", "pANCA, actin, ASGPR", "CYP2D6", "tRNP (selenocysteine)"]
          - ["Age (years)", "Bimodal 10–20 and 45–70", "Pediatric 2–14", "Adults 30–50"]
          - ["Women (%)", "78", "89", "90"]
          - ["Gamma globulin rise", "Marked", "Mild", "Moderate"]
          - ["Low IgA", "No", "Occasional", "No"]
          - ["Steroid response", "+++", "+++", "+++"]
        hide: [[0, 1], [0, 2], [2, 1], [2, 2], [4, 1], [5, 2]]
      - kind: mnemonic
        page: 208
        word: "LKM"
        parts:
          - { key: "L", text: "Little ones: type 2 is pediatric (2–14 years)" }
          - { key: "K", text: "Kids get Less: mild gamma globulin rise, occasional low IgA" }
          - { key: "M", text: "Microsome target: CYP2D6 is the novel antibody" }
        hook: |
          النوع التاني اسمه على الـ antibody بتاعه: **LKM**. افتكرها **Little Kids' Microsomes**. والنوع الأول؟ الكبار اللي بيقولوا «**أنا سمعت**»: **ANA + SMA**. 😄
      - kind: check
        page: 208
        question: "A 9-year-old girl has acute hepatitis. ANA and SMA are negative; anti-LKM1 is positive. Which type of AIH is this?"
        options:
          - "Type 2"
          - "Type 1"
          - "Type 3"
          - "Autoimmune cholangitis"
        answer: 0
        why:
          - "صح: anti-LKM1 + سن الأطفال (2–14) = **type 2**."
          - "Type 1 بيبقى بـ **ANA/SMA**، وسنه bimodal (10–20 و 45–70)."
          - "Type 3 مالوش conventional antibodies خالص، وفي الكبار 30–50."
          - "Autoimmune cholangitis فيها **ANA و/أو SMA** و cholangitis على الـ biopsy."
      - kind: explain
        page: 209
        title: "الـ variants: AIH بس فيها حاجة زيادة"
        text: |
          **Table 2** فيه 4 variants، وكلهم الـ histology فيها **cholangitis** ما عدا الـ cryptogenic:

          - **AIH + PBC:** AIH features و **AMA present**.
          - **AIH + PSC:** AIH features مع **CUC** (chronic ulcerative colitis)، AMA absent، و **abnormal cholangiogram**.
          - **Autoimmune cholangitis:** **ANA و/أو SMA**، AMA absent، مفيش CUC، و **normal cholangiogram**.
          - **Cryptogenic chronic hepatitis:** AIH features، **no autoantibodies**، و **HLA-B8 أو DR3**. الـ histology: interface hepatitis.

          العلاج كله **empirical**:

          - **AIH + PBC:** prednisone لوحده لو **ALP ≤ 2× normal**؛ و prednisone **+ UDCA** لو **ALP > 2×** و/أو **florid duct lesions**.
          - **AIH + PSC:** prednisone **+ UDCA** لو **ALP > 2×** و/أو florid duct lesions.
          - **Autoimmune cholangitis:** prednisone **و/أو** UDCA (من غير شرط ALP).
          - **Cryptogenic chronic hepatitis:** الـ **conventional AIH regimens**.
      - kind: match
        page: 209
        prompt: "وصّل الصورة بالاسم:"
        pairs:
          - ["AIH features + AMA positive", "AIH + PBC"]
          - ["AIH features + CUC + abnormal cholangiogram", "AIH + PSC"]
          - ["ANA/SMA, AMA negative, normal cholangiogram, cholangitis", "Autoimmune cholangitis"]
          - ["AIH features, no antibodies, HLA-B8 or DR3", "Cryptogenic chronic hepatitis"]
        why: "المفتاح: **AMA** يوديك للـ PBC، و **CUC + cholangiogram** للـ PSC، و **ANA/SMA مع cholangiogram سليم** للـ autoimmune cholangitis، و **مفيش antibodies** للـ cryptogenic."
      - kind: check
        page: 209
        question: "A woman has AIH features and a positive AMA. ALP is 3 times normal. What does Table 2 suggest?"
        options:
          - "Prednisone plus ursodeoxycholic acid"
          - "Prednisone alone"
          - "Ursodeoxycholic acid alone"
          - "No treatment until cirrhosis develops"
        answer: 0
        why:
          - "صح: AIH + PBC و ALP > 2× normal = prednisone **و** UDCA."
          - "الـ prednisone لوحده لما الـ ALP **≤ 2× normal**."
          - "الـ UDCA لوحده مش موجود في الـ AIH + PBC؛ الـ prednisone أساسي."
          - "مفيش حاجة في الكتاب اسمها نستنى الـ cirrhosis."
      - kind: aside
        tone: trap
        page: 209
        text: |
          الفخ: **AMA** في الـ AIH + PBC **present**، وفي الـ autoimmune cholangitis **absent** مع إن الاتنين histology فيهم cholangitis. الـ AMA هو اللي بيفرّق.
      - kind: try
        items: [hb.L13.031, hb.L13.026, hb.L13.035, hb.L13.029]
    recap:
      - "Trigger + genetic predisposition + autoantigen display → effector cells تقتل الـ hepatocytes."
      - "DRB1*0301 و *0401 = نفس الـ motif LLEQKR (K عند 71). الـ autoantigen الوحيد المعروف: CYP2D6."
      - "Type 1: ANA/SMA، bimodal. Type 2: anti-LKM1، أطفال. Type 3: مفيش conventional antibodies، 30–50."
      - "الـ variants: AMA → AIH+PBC، CUC + cholangiogram → AIH+PSC، ANA/SMA وcholangiogram سليم → autoimmune cholangitis."
      - "في AIH+PBC و AIH+PSC: ALP > 2× أو florid duct lesions → prednisone + UDCA. Autoimmune cholangitis: prednisone و/أو UDCA. Cryptogenic: AIH regimens."
    practice: [hb.L13.024, hb.L13.025, hb.L13.026, hb.L13.027, hb.L13.028, hb.L13.029, hb.L13.030, hb.L13.031, hb.L13.032, hb.L13.033, hb.L13.034, hb.L13.035, hb.L13.036, hb.L13.037, hb.L13.038, hb.L13.039, hb.L13.040]

  # ------------------------------------------------------------------
  - id: hb.L13.lesson3
    title: "نعالج الـ AIH إمتى وإزاي؟"
    hook: "رقمين بيحددوا مين يتعالج (10 و 5×2)، وجدول prednisone لازم يتحفظ زي رقم تليفون البيت."
    minutes: 10
    pages: [210, 214]
    topics: [aih-treatment, aih-diagnosis]
    goals:
      - "تعرف الـ prognostic indices وإيه اللي بيتنبأ بالأسوأ"
      - "تقسّم الـ indications لـ absolute و relative و none"
      - "تكتب الـ regimens وتقول ليه الـ combination أحسن"
      - "تعرف الـ end points وإمتى تفكّر في transplant"
    status: unverified
    steps:
      - kind: explain
        page: 210
        title: "الـ prognosis قبل العلاج"
        text: |
          الـ prevalence في northern Europe: **1.9 per 100,000 per year**.

          **Table 3** بيقولك اللي جاي من شكل المريض أول ما ييجي:

          - **Bridging أو multilobular necrosis:** 82% cirrhosis في 5 سنين، و 45% mortality في 5 سنين.
          - **Cirrhosis:** 58% mortality في 5 سنين.
          - **AST ≥ 10×:** 50% mortality في 3 سنين.
          - **AST ≥ 5× + GG ≥ 2×:** **90% mortality في 10 سنين**.
          - **AST < 10× + GG < 2×:** 49% cirrhosis في 15 سنة، و 10% mortality في 10.
          - **Interface hepatitis** بس: 17% cirrhosis في 5 سنين، و **normal 5-year survival**.

          وبعد العلاج: **failure to improve**، أو **hyperbilirubinemia بعد أسبوعين**، أو **failure to enter remission within 4 years**، دول كلهم high mortality.
