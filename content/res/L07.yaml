  - id: res.L07.096
    kind: card
    topic: quasi
    front: What makes a study quasi-experimental?
    back: One characteristic of a true experiment is missing, either randomization or a separate control group.
    src: { page: 97, quote: "In a QUASI-EXPERIMENTAL STUDY, one characteristic of a true experiment is missing:\n  Randomization or\n  Use of a separate control group.\nPretest-Posttest Design" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.097
    kind: table
    topic: quasi
    title: Two quasi-experimental designs
    columns: [Feature, One-group pre-test/post-test, Classical quasi-experimental]
    rows:
      - [Control group, None, "Yes, not randomized"]
      - [Measurements, Before and after the treatment, Before and after in both groups]
