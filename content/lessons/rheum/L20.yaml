  - id: rheum.L20.lesson3
    title: "بره المفاصل والتشخيص: CASPAR"
    hook: "Arthritis + صدفية − RF: ده أبسط تعريف، والـ CASPAR بيحتاج 3 نقط."
    minutes: 8
    pages: [333, 334]
    topics: [extraarticular, diagnosis]
    goals:
      - "تعدّ الـ extraarticular manifestations وتقارن الـ PsA بالـ SpA التانيين"
      - "تحسب الـ CASPAR وتعرف ليه كل بند فيه"
      - "تفهم ليه الـ PsA «usually seronegative»"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L20.040]
        page: 333
        title: "بره المفاصل"
        quote: "Ocular disease: Iritis or uveitis occurs in 7% to 18%, more bilateral than in AS, but is usually found in patients with spinal involvement."
        text: |
          أقل من الـ rheumatoid arthritis (RA):
          - ==Uveitis== في **7–18%**، **bilateral** أكتر من الـ ankylosing spondylitis (AS)، وغالبًا مع الـ spinal disease
          - **Aortic insufficiency**
          - **Metabolic syndrome** و cardiovascular risk
          - **Inflammatory bowel disease (IBD)**، **amyloidosis**، fatigue و fibromyalgia

          ليه الـ uveitis بيجي مع الـ spinal involvement؟ لأن الاتنين ملامح الـ spondyloarthritis (زي الـ AS)، فالعيان اللي عنده axial disease أقرب للعيلة دي وبيجيله uveitis أكتر.
      - kind: table
        page: 333
        quote: "Comparison with other SpAs\n| Clinical feature | PsA | AS (radiographic ax-SpA) | Reactive arthritis | Enteropathic (IBD-associated) SpA |\n|---|---|---|---|---|\n| Gender distribution | 1:1 | 2:1 | 3:1 | 2:1 |\n| HLA-B27 | 45–50% | 90–95% | 70% | 30% |\n| Peripheral arthritis | 95% | 30% | 90% | 30% |\n| Axial arthritis (%) | 50% | 100% | 15–50% | 30% |\n| Dactylitis | +++ | – | + | – |\n| Enthesitis | ++ | +++ | + | – |\n| Skin psoriasis | All | 10% | Rare | Rare |"
        title: "الـ PsA وإخواته"
        columns: [Feature, PsA, AS]
        rows:
          - ["M:F", "1:1", "2:1"]
          - ["HLA-B27", "45–50%", "90–95%"]
          - ["Peripheral", "95%", "30%"]
          - ["Axial", "50%", "100%"]
          - ["Dactylitis", "+++", "–"]
          - ["Psoriasis", "All", "10%"]
        hide: [[0, 1], [1, 1], [2, 1], [4, 1]]
      - kind: aside
        tone: tip
        page: 333
        quote: "Comparison with other SpAs\n| Clinical feature | PsA | AS (radiographic ax-SpA) | Reactive arthritis | Enteropathic (IBD-associated) SpA |\n|---|---|---|---|---|\n| Gender distribution | 1:1 | 2:1 | 3:1 | 2:1 |\n| HLA-B27 | 45–50% | 90–95% | 70% | 30% |\n| Peripheral arthritis | 95% | 30% | 90% | 30% |\n| Axial arthritis (%) | 50% | 100% | 15–50% | 30% |\n| Dactylitis | +++ | – | + | – |\n| Enthesitis | ++ | +++ | + | – |\n| Skin psoriasis | All | 10% | Rare | Rare |"
        text: "وفي نفس الجدول: **reactive arthritis** M:F **3:1**، B27 **70%**، peripheral **90%**. والـ **enteropathic** M:F **2:1**، B27 **30%**، peripheral و axial **30%**، ومفيش dactylitis ولا enthesitis."
      - kind: reveal
        page: 333
        quote: "Nevertheless, in its simplest form, PsA can be considered as an arthritis occurring in the presence of psoriasis, but in the absence of rheumatoid factor."
        prompt: "مفيش diagnostic test للـ PsA. طيب بنشخّصه إزاي في أبسط صورة؟"
        answer: |
          التعريف البسيط بتاع الكتاب: ==arthritis + psoriasis − rheumatoid factor==. وأغلب العيانين بيدخلوا فيه.

          ليه الـ RF negative جزء منه؟ لأن الـ RF هو اللي بيفرّق عن الـ **RA**: عيان صدفية ممكن يجيله RA بالصدفة، والـ RF positive بيرجّحه. علشان كده الـ CASPAR (الخطوة الجاية) بيدّي **نقطة** للـ RF negative. بس خلي بالك: الـ PsA «**usually** seronegative»، يعني RF واطي ممكن يتلاقى في 5–16%.
      - kind: explain
        page: 334
        title: "CASPAR (2006)"
        quote: "Inflammatory articular disease (joint,spine or entheseal)with 3 or more points from the following:\n  Skin psoriasis: present - 2 / previously present -1\n  Family history, patient not affected – 1\n  Nail lesions: onycholysis, pitting, hyperkeratosis – 1\n  Dactylitis: present or past, documented by a rheumatologist – 1\n  Rheumatoid factor: negative by any method except for latex – 1\n  Juxta-articular bone formation: distinct from osteophytes – 1\n  (Specificity 98.7% and sensitivity 91.4%)."
        text: |
          الشرط: **inflammatory articular disease** (joint أو spine أو enthesis) + ==3 نقط أو أكتر==:

          - **Psoriasis:** current **2**، past **1**، أو family history **1** (لو هو مش مصاب)
          - **Nail lesions:** onycholysis، pitting، hyperkeratosis **1**
          - **Dactylitis** (حالي أو قديم، rheumatologist شافه) **1**
          - **Rheumatoid factor (RF) negative** (أي طريقة غير latex) **1**
          - **Juxta-articular new bone** (مش osteophyte) **1**

          Specificity **98.7%**، sensitivity **91.4%**.

          ليه الصدفية الحالية بـ 2 والقديمة بـ 1؟ لأن الصدفية الموجودة قدامك دليل أقوى من حكاية العيان أو قريبه. والـ specificity العالية (98.7%) معناها إن العيان اللي بيجيب 3 نقط غالبًا PsA فعلًا.
      - kind: figure
        page: 334
        quote: "Inflammatory articular disease (joint,spine or entheseal)with 3 or more points from the following:"
        title: "CASPAR: محتاج 3"
        alt: "A gate labelled inflammatory articular disease (joint, spine or entheseal), then a points table: current psoriasis 2, past psoriasis 1 or family history 1, nail lesions 1, dactylitis 1, rheumatoid factor negative 1, juxta-articular new bone 1. Total 3 or more classifies PsA; specificity 98.7%, sensitivity 91.4%."
        caption: "الأول **بوابة**: inflammatory joint أو spine أو enthesis. بعدين النقط، والـ ==current psoriasis لوحدها بـ 2==. علشان كده عيان صدفية حالية محتاج بند واحد زيادة بس."
        svg: |
