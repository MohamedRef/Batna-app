      - kind: explain
        page: 179
        title: "Thin basement membrane: الـ benign familial hematuria"
        quote: "TBM During the assessment of potential live kidney donors. The normal GBM is ± 350nm thick-but, in TMD, it is often less than 200nm (although other-wise structurally normal)."
        text: |
          الـ ==thin basement membrane nephropathy (TBMN)== اسمه القديم **benign familial hematuria**: **autosomal dominant (AD)** شائع، microscopic hematuria والكلى **شغالة تقريبًا دايمًا**. موجود في ~5% من الـ post-mortems وبنلاقيه في المتبرعين.

          - الـ GBM الطبيعي حوالي **350 nm**؛ في الـ TBMN غالبًا **أقل من 200**. الـ cut-off ==250 nm في الكبار== (200–250 في الأطفال).
          - **40%** من العائلات عندهم type IV collagen alpha-3 gene (COL4A3)/COL4A4.
          - ~**25%** من الـ microscopic hematuria في عيادة الكلى. Macroscopic في 20%.
          - Proteinuria وضغط و renal impairment **نادرين**، و **مفيش extrarenal**.

          ليه benign رغم إنه نفس الجينات؟ التفسير المقبول (مش في الكتاب): الـ TBMN غالبًا نسخة واحدة بايظة من COL4A3 أو COL4A4 (carrier)، فالغشاء أرفع بس متكوّن صح. أما الـ Alport فالغشاء متكوّن غلط وبيتقطّع. يعني رفيع ≠ مكسور. وده سبب إن الـ hematuria موجودة (الغشاء الرفيع بيعدّي كرات حمرا) بس الوظيفة سليمة، ومفيش ودن ولا عين.
