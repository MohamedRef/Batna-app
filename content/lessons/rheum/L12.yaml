      - kind: reveal
        page: 205
        quote: "The presence of a low-grade 'DIC-like‘ laboratory picture with increased D-dimer, abnormal PT and PTT and increased ferritin is frequently present without clinical hemorrhage."
        prompt: "ليه الـ ESR بينزل في الـ MAS مع إن العيان أتعب؟"
        answer: "الكتاب بيقول فيه DIC-like picture (D-dimer عالي، PT و PTT مش مظبوطين). الـ coagulopathy بتستهلك الـ fibrinogen، والـ fibrinogen هو اللي بيرفع الـ ESR، فالـ ESR يقع. عشان كده الـ ESR اللي بينزل فجأة في طفل systemic تعبان علامة خطر، مش تحسن."
