      - kind: explain
        page: 300
        title: "قايمة المضاعفات: ليه كل واحدة؟"
        quote: "Intradialytic Hypotension,"
        text: |
          الكتاب بيعدّ مضاعفات الـ haemodialysis: ==intradialytic hypotension== و hypertension، dialyzer reactions، **disequilibrium syndrome**، cramping، **air embolism**، haemolysis، arrhythmias، haemorrhage، hypoxia، pruritus، febrile reactions، اضطرابات الـ acid–base والـ K والـ Na، و vascular access complications.

          إزاي تفتكرها؟ التفسير المقبول (مش في الكتاب): قسّمها حسب **مصدرها** في الجلسة:
          - **من سحب المية**: hypotension، cramps، arrhythmias (لأن الحجم بيقل بسرعة أسرع ما الـ interstitium يعوّض).
          - **من تغيير التركيزات بسرعة**: disequilibrium، hypokalaemia، اضطراب الـ Na والـ acid–base.
          - **من الدايرة نفسها**: air embolism (لو الـ air detector فشل)، haemolysis (محلول سخن أو غلط)، dialyzer reactions، haemorrhage من الـ heparin.
          - **من الـ access**: thrombosis و infection.
          فلما يحصل عرض في الجلسة، اسأل: المية؟ التركيز؟ الماكينة؟ ولا الوصلة؟

          وليه الـ cramps؟ التفسير المقبول (مش في الكتاب): لما الحجم يقل بسرعة، الأوعية في العضلات بتنقبض والعضلة ما بتاخدش دم كفاية، ومع تغير الـ Na والـ osmolality العضلة بتشد. الحل نفس حل الـ IDH: سحب أبطأ وزيادة أقل بين الجلسات. والـ pruritus؟ غالبًا من الـ phosphate العالي والـ uraemic toxins اللي الغسيل مش بيشيلها كويس، فبيتحسن بغسيل أكفأ وظبط الـ phosphate.
      - kind: explain
        page: 301
        title: "الـ disequilibrium syndrome"
        quote: "Disequilibrium syndrome: Cerebral edema from urea removal from the blood more rapidly than from the CSF and brain tissue generating a urea osmotic gradient.\nHD generates a CO2 gradient between plasma and CSF lowering the pH in the CSF and brain tissue."
        text: |
          الـ urea بتنزل من **الدم** أسرع من **المخ والـ cerebrospinal fluid (CSF)**. المخ يفضل osmolality أعلى، فالمية تدخله: ==cerebral oedema==. وكمان الـ HD بيعمل CO2 gradient فالـ pH في الـ CSF ينزل.

          **مين؟** أول جلسات، الكبار والأطفال، central nervous system (CNS) lesions (stroke أو head trauma)، brain oedema (malignant hypertension (HTN)، hyponatraemia، hepatic encephalopathy)، و ==BUN عالي قبل الغسيل==.

          ليه المرضى دول بالذات؟ التفسير المقبول (مش في الكتاب): كل واحد فيهم يا إما المخ عنده urea كتير جدًا (BUN عالي، أول جلسة لسه ما اتنضفش قبل كده)، يا إما المخ أصلًا مش مستحمل أي ورم زيادة (stroke، trauma، hyponatraemia، hepatic encephalopathy، malignant hypertension). والكبار والأطفال الـ autoregulation عندهم أضعف. فالوقاية: جلسة أولى قصيرة، blood flow أقل، ومحلول Na أعلى شوية علشان الـ osmolality في الدم ما تقعش فجأة.
      - kind: figure
        page: 301
        quote: "Disequilibrium syndrome: Cerebral edema from urea removal from the blood more rapidly than from the CSF and brain tissue generating a urea osmotic gradient.\nHD generates a CO2 gradient between plasma and CSF lowering the pH in the CSF and brain tissue."
