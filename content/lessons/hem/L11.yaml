      - kind: figure
        page: 181
        title: "صورة الكتاب: الـ IMWG criteria زي ما هي"
        image: { file: hem/L11-imwg-criteria.webp, book: true }
        alt: "Book slide titled Updated IMWG Criteria for Diagnosis of Multiple Myeloma, with three columns. MGUS: M protein below 3 g/dL, clonal plasma cells in marrow below 10 percent, no myeloma defining events. Smoldering: M protein 3 g/dL or more in serum or 500 mg per 24 hours or more in urine, clonal plasma cells in marrow 10 to 60 percent, no other myeloma defining events. Multiple myeloma: underlying plasma cell proliferative disorder, more than 10 percent clonal plasma cells, and one or more myeloma-defining events: at least one CRAB feature, more than one MRI focal lesion, serum free light chain ratio 100 or more, clonal plasma cells in marrow 60 percent or more. Footnote below defines CRAB: calcium above 11 mg/dL or more than 1 mg/dL above the upper limit of normal; renal insufficiency with creatinine clearance below 40 mL/min or creatinine above 2 mg/dL; anaemia with haemoglobin below 10 g/dL or 2 g/dL below normal; bone disease with one or more lytic lesions on radiography, CT or PET/CT."
        caption: |
          ده الأصل اللي السلم اللي فوق متبني عليه: تلات عواميد من الشمال لليمين، كل واحد درجة أعلى:

          - **الشمال، MGUS**: M protein **< 3 g/dL**، plasma cells في النخاع **< 10%**، ومفيش myeloma-defining events.
          - **النص، Smoldering**: M protein **≥ 3 g/dL** (أو **≥ 500 mg/24 h** في البول)، plasma cells **10–60%**، ولسه مفيش events.
          - **اليمين، Multiple myeloma**: plasma cells **> 10%** **و** ==1 أو أكتر myeloma-defining event==: **≥ 1 CRAB**، أو **> 1 MRI focal lesion**، أو **free light chain ratio ≥ 100**، أو plasma cells **≥ 60%** (الثلاثة الأخيرين هم الـ SLiM).
          - **تحت** (الـ footnote): تعريف كل حرف في الـ ==CRAB== بأرقامه: calcium > 11، creatinine clearance < 40 أو creatinine > 2، Hb < 10، وlytic lesion واحدة أو أكتر.

          لاحظ إن العمود اليمين مالوش حد للـ M protein: الـ myeloma بتتشخص بالـ events، مش بكمية البروتين.
      - kind: mnemonic
