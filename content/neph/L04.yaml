  - id: neph.L04.055
    kind: enumerate
    topic: renal-ht
    prompt: Mechanisms of renoparenchymal hypertension?
    points:
      - Low nephron number from fetal life (poor Na and volume homeostasis)
      - Salt and water retention (TIN ischemia needs high pressure for natriuresis)
      - Sympathetic overactivity
      - RAAS activation
