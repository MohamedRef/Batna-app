  - id: endo.L04.lesson9
    title: "الدم والـ granulomas والغدد"
    hook: "مريض Addison's الـ Hb بتاعه 12. اديته محاليل، تاني يوم بقى 9. هو نزف؟ ولا الأنيميا كانت موجودة من الأول ومستخبية؟"
    minutes: 8
    pages: [61, 63]
    topics: [haematology, granulomatous]
    goals:
      - "تشرح ليه الـ Hb عند الراجل أعلى وتعدّ أنواع الأنيميا الهرمونية"
      - "تعرف إزاي الـ plasma cell dyscrasias بتبوّظ تحاليل الغدة"
      - "تعرف تأثير الـ sarcoidosis والـ leprosy على الغدد"
    status: unverified
    steps:
      - kind: explain
        page: 61
        quote: "The difference in levels of Hb between men &women is the effect of androgen & estrogen on erytheropoiesis.\nTestosterne & anabolic steroids augment erythropoiesis, Castration & estrogen administration to male decrease erytheropoiesis."
        title: "ليه الراجل الـ Hb بتاعه أعلى؟"
        text: |
          الفرق في الـ Hb بين الرجالة والستات سببه **تأثير الـ androgen والـ oestrogen على الـ erythropoiesis**:
          - الـ ==testosterone== والـ anabolic steroids **بيزوّدوا** الـ erythropoiesis.
          - الـ ==castration== وإعطاء oestrogen للراجل **بيقللوه**.

          يعني لو راجل عنده hypogonadism (زي اللي شفناه في الـ CRF)، الأنيميا جزء من الصورة، ولو حد بياخد anabolic steroids، الـ Hb بيعلى.

          والكتاب بيقسم الـ endocrine–haematological disorders لأربعة: hypoproliferative anaemia، haemolytic anaemias، plasma cell dyscrasias، و Crow–Fukase syndrome (POEMS).
      - kind: explain
        remind: [endo.L04.136, endo.L04.131]
        page: 62
        quote: "In Addisons disease the anemia is more severe, depending on the level of thyroid & androgen hormones dysfunction. However, anemia may be masked by hypovolemia. Once pts are given volume replacement, Hb level may drop rapidly."
        title: "الـ hypoproliferative anaemia"
        text: |
          يعني الـ bone marrow مش بيعمل كفاية. أربع أسباب هرمونية:
          1. **Hypothyroid**.
          2. **Pituitary hormone deficiency**.
          3. ==Addison's==: الأنيميا **أشد**، وعلى قد درجة الـ thyroid والـ androgen dysfunction اللي معاها. بس الـ **hypovolaemia** بتداريها، لأن البلازما قليلة فالدم مركّز والـ Hb باين طبيعي.
          4. **Hyperparathyroidism (HPT)**: أنيميا خفيفة، إما من **renal effect** بتاع الـ hypercalcaemia أو من ضعف تكاثر الـ erythroid progenitors.
      - kind: reveal
        page: 62
        quote: "However, anemia may be masked by hypovolemia. Once pts are given volume replacement, Hb level may drop rapidly."
        prompt: "ارجع للـ hook: الـ Hb وقع من 12 لـ 9 بعد المحاليل. إيه اللي حصل؟"
        answer: "مفيش نزيف. الأنيميا كانت موجودة من الأول، بس الـ **hypovolaemia** كانت مركّزة الدم. لما اديته محاليل، البلازما رجعت لحجمها، فالـ Hb **وقع بسرعة** للرقم الحقيقي. الكتاب بيقولها صريح: «once pts are given volume replacement, Hb level may drop rapidly»."
      - kind: explain
        page: 62
        quote: "Such as Waldenstrom's macroglobulinemia can bind to the thyorid hormones, decreasing their biological activity & result in hypothyroidism. In both pts the auto- antibodies interfere with the thyroid hormone immunoassay & cause false elevation or decrease in measured hormone levels."
        title: "الـ haemolytic والـ plasma cell dyscrasias"
        text: |
          - **Haemolytic anaemias**:
            - **Sickle cell**: impotence و infertility.
            - **Thalassaemia**: endocrine disorders سببها الـ **haemochromatosis**، لأن نقل الدم المتكرر بيرسّب حديد في الغدد.
          - **Plasma cell dyscrasias** زي ==Waldenström's macroglobulinaemia==: الـ paraprotein **بيمسك الـ thyroid hormones**، فالـ biological activity بتاعتهم تقل، والنتيجة **hypothyroidism**.
