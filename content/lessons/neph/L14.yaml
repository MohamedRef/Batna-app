  - id: neph.L14.lesson7
    title: "TTP: طوارئ، والـ PLASMIC بيساعدك"
    hook: "من غير علاج 90% بيموتوا، ومع العلاج 80% بيستجيبوا. الفرق: PEX بدري."
    minutes: 8
    pages: [477, 483]
    topics: [ttp]
    goals:
      - "تشرح الـ ADAMTS13 والـ VWF"
      - "تحسب الـ PLASMIC score"
      - "تعالج TTP وتعرف توصيات ISTH 2020"
    status: unverified
    steps:
      - kind: explain
        page: 478
        title: "الميكانيزم"
        quote: "This is due to the inability of the ADAMTS13 to inactivate the large multimer von Willebrand factor (VWF)"
        text: |
          الـ ==ADAMTS13== بيقطّع الـ **ultra-large VWF multimers**. لو ناقص، الـ multimers دي بتمسك platelets وتعمل microthrombi.

          - "**Acquired** (أشهر): autoantibodies ضد ADAMTS13. Triggers: antiplatelets، immunosuppressants، **HIV**، **estrogen pills**، **pregnancy**."
          - "**Congenital**: mutation، ومحتاج trigger (infection أو حمل)."
          - الـ **CNS** والـ **كلية** أكتر عضوين.
      - kind: aside
        tone: exam
        text: "الـ **pentad** (fever، thrombocytopenia، hemolytic anemia، renal، neuro) موجود كامل في **أقل من 5%** بس. متستناش الخمسة عشان تشخّص."
      - kind: mnemonic
        page: 479
        quote: "The PLASMIC score is calculated using findings on presentation and predicts the likelihood of ADAMTS13 activity being less than or equal to 10%"
        word: "PLASMIC"
        parts:
          - key: P
            text: "Platelets <30,000"
          - key: L
            text: "Lysis (hemolysis: retics >2.5%, no haptoglobin, indirect bilirubin >2)"
          - key: A
            text: "Active cancer absent"
          - key: S
            text: "Stem-cell or solid-organ transplant absent"
          - key: M
            text: "MCV <90 fL"
          - key: I
            text: "INR <1.5"
          - key: C
            text: "Creatinine <2.0 mg/dL"
        hook: "اسم الـ score هو نفسه الـ mnemonic. لازم **schistocytes** الأول. Sensitivity **99%**، specificity **57%**: كويس عشان تستبعد."
      - kind: explain
        page: 480
        title: "الـ ADAMTS13 بالأرقام"
        quote: "A decrease of the ADAMTS13 activity to less than 20% after initial recovery from an acute episode is considered a relapse"
        text: |
          - **<10%** مع hemolysis و thrombocytopenia = TTP (بس ممكن يحصل في sepsis و cancer).
          - **<20%** بعد الشفا = **relapse**، حتى من غير أعراض.
          - كمان اعمل **troponin** و **brain MRI** للـ end-organ damage.
      - kind: explain
        page: 480
        title: "العلاج الأساسي"
        quote: "The mainstay of treatment in TTP is plasma exchange (PEX) with high-dose corticosteroid therapy."
        text: |
          ==PEX + high-dose steroids==، وابدأ فوراً.
          - "**Steroid**: prednisone **1 mg/kg/day**؛ لو حالته وحشة methylprednisolone IV."
          - "**PEX**: plasma volume واحد (~**40 mL/kg**) يومياً، والـ replacement **plasma** لأنه بيعوّض ADAMTS13."
          - وقّف الـ PEX فجأة عند الـ remission (لما الـ platelets تستقر أكتر من 48 ساعة)، والـ steroid يتسحب بالتدريج.
      - kind: check
        page: 482
        quote: "Platelet transfusion is controversial but is considered to be contraindicated unless major bleeding is present."
        question: "A TTP patient has platelets 9,000 and no bleeding. Platelet transfusion?"
        options:
          - "Not given: contraindicated unless major bleeding"
          - "Give before PEX"
          - "Give with every PEX session"
          - "Give if platelets <10,000"
        answer: 0
