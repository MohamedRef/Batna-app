          ليه الـ **peroral endoscopic myotomy (POEM)** حلو في **type III**؟ لأن الـ spasm مش في الـ LES بس، طالع في الـ distal body. والـ POEM بيخليك تطوّل الـ myotomy على قد الـ **spastic segment** اللي شفته على الـ high-resolution manometry (HRM). الـ balloon مش هيوصل هناك.
