  # ---------- p101: CTL ----------
  - id: rheum.L06.075
    kind: order
    topic: ctl
    prompt: Order the steps that let a cytotoxic T cell kill a virally infected cell.
    steps:
      - Virus particles from the infected cell are endocytosed by APCs
      - APCs present viral peptide on class II MHC to TH1 cells
      - TH1 cells send activation signals (IFN-γ, IL-2) to CTLs
      - CTLs recognise the viral peptide on class I MHC of the target
      - CTLs kill the target
