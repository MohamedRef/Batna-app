  - id: res.L05.lesson3
    title: "الـ odds ratio: ad على bc"
    hook: "رقم واحد بيقولك الكحول ليه علاقة بـ cancer larynx قد إيه. وهتحسبه في 10 ثواني."
    minutes: 9
    pages: [30, 36]
    topics: [odds-ratio, cc-merits]
    goals:
      - "تحسب الـ odds ratio (OR) من أي 2×2 table"
      - "تفسّر OR = 1 و > 1 و < 1"
      - "تعرف مزايا وعيوب الـ case-control"
    status: unverified
    steps:
      - kind: explain
        page: 30
        quote: "Analysis\n1. Exposure Rates among the disease (Cases)\n2. Exposure Rates among the non-disease (Control)\n3. Odd's Ratio"
        title: "التحليل في 3 خطوات"
        text: |
          1. ==Exposure rate among cases==.
          2. **Exposure rate among controls**.
          3. **Odds ratio**.

          لاحظ إن الحساب كله على الـ **exposure** مش على المرض. ليه؟ لأنك اخترت عدد العيانين والأصحاء بنفسك، فنسبة المرض في الدراسة مصطنعة ومينفعش تتحسب. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 32
        quote: "ODDS: the probability of an event (exposure) occurring to the probability of the event not occurring\n  CASES: a/a+c divided by c/a+c = a/c\n  CONTROLS: b/b+d divided by d/b+d = b/d\nODDS RATIO: ratio of the odds of exposure among the cases to the odds of exposure among the controls = ad/bc"
        title: "يعني إيه odds؟"
        text: |
          ==Odds== = احتمال إن الحدث يحصل ÷ احتمال إنه **مايحصلش**.

          في الـ case-control الحدث هو ==الـ exposure==:

          - Odds في الـ **cases** = a/c
          - Odds في الـ **controls** = b/d
      - kind: table
        page: 31
        quote: "Tabulation and Analysis\n| Exposure Status | Disease Status: Yes | Disease Status: No |\n|---|---|---|\n| Yes | a | b |\n| No | c | d |\n| Total | a+c | b+d |"
        title: "Tabulation and analysis: the case-control 2×2"
        columns: ["Exposure", "Disease: yes (cases)", "Disease: no (controls)"]
        rows:
          - ["Yes", "a", "b"]
          - ["No", "c", "d"]
          - ["Total", "a+c", "b+d"]
        hide: [[1, 1], [0, 2]]
      - kind: explain
        page: 32
        quote: "ODDS: the probability of an event (exposure) occurring to the probability of the event not occurring\n  CASES: a/a+c divided by c/a+c = a/c\n  CONTROLS: b/b+d divided by d/b+d = b/d\nODDS RATIO: ratio of the odds of exposure among the cases to the odds of exposure among the controls = ad/bc"
        title: "الـ odds ratio"
        text: |
          ==OR== = odds of exposure في الـ cases ÷ odds of exposure في الـ controls

          = (a/c) ÷ (b/d) = ==ad/bc==

          يعني اضرب **القطر** (a × d) وقسّم على **القطر التاني** (b × c).

          الدكتورة فرّقت في الشرح بين حاجتين: نسبة الـ exposed بين الـ cases = a/(a+c)، لكن ==odds الـ exposure = a/c==. ودكتورة سحر في المراجعة حلّتها بأرقام: cases 60 exposed و40 لأ، controls 20 و80. الـ odds 60/40 و20/80، والـ OR = **6**. لو قسمت النسب (60/100 ÷ 20/100) هيطلع 3، وده مقياس تاني خالص مش OR. وقبل أي حساب **اقرا عناوين الصفوف والأعمدة**: لو الجدول مقلوب، مكان a و b بيتغير.

          وفي التفسير: قول «odds الـ exposure في الـ cases أكتر X مرة»، مش «خطر المرض زاد X مرة». الـ OR بيقرّب للـ RR في ظروف زي إن المرض نادر، بس مش هو الـ RR.
      - kind: mnemonic
        page: 32
        quote: "ODDS: the probability of an event (exposure) occurring to the probability of the event not occurring\n  CASES: a/a+c divided by c/a+c = a/c\n  CONTROLS: b/b+d divided by d/b+d = b/d\nODDS RATIO: ratio of the odds of exposure among the cases to the odds of exposure among the controls = ad/bc"
        word: "CROSS"
        parts:
          - { key: "C", text: "Cases column first: a over c" }
          - { key: "R", text: "Ratio of the two odds" }
          - { key: "O", text: "One diagonal on top: a × d" }
          - { key: "S", text: "Second diagonal below: b × c" }
          - { key: "S", text: "So OR = ad/bc (cross-product ratio)" }
        hook: "الـ OR اسمه كمان **cross-product ratio**: اعمل **X** على الجدول."
      - kind: figure
        page: 34
        quote: "Example: Alcohol Consumption and Laryngeal Cancer"
        title: "الـ X على الجدول: مثال الكحول"
        alt: "A 2 by 2 table, cases and controls in columns, alcohol and no alcohol in rows: a 160, b 90, c 40, d 110. A bold diagonal joins a and d, a thin one joins b and c. Odds in cases a over c equals 4, odds in controls b over d equals 0.82. Below: a times d over b times c, 160 times 110 over 90 times 40, OR equals 4.89."
        caption: |
          ده جدول slide 34 مرسوم بالـ X بتاع الـ cross-product ratio:

          - الأعمدة **cases** و**controls** (اخترتهم على أساس المرض)، والصفوف الـ exposure.
          - على الشمال الـ odds في كل عمود: **4** في الـ cases و**0.82** في الـ controls. قسمتهم على بعض = الـ OR.
          - نفس الرقم أسرع بالـ X: ==القطر التقيل== (a × d = 160 × 110) فوق، و**القطر الخفيف** (b × c = 90 × 40) تحت.

          النتيجة **4.89**: الـ odds بتاعة الكحول عند العيانين قد اللي عند السليمين ==4.89 مرة==. ولو الجدول جالك مقلوب (المرض في الصفوف) حدّد a الأول قبل ما ترسم الـ X.
