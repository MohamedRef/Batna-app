      - kind: explain
        page: 48
        title: "التشخيص وليه كل رقم"
        quote: "Hyponatremia and hyperkalemia may develop as the patient enters into renal failure."
        text: |
          - **CBC**: anaemia (Hb غالبًا **أقل من 10 g/dL**) و thrombocytopenia.
          - **Film**: ==schistocytes==.
          - **Coombs سالب**: الـ haemolysis **mechanical**.
          - **Creatinine عالي**: AKI.
          - **Indirect bilirubin** و **LDH** عاليين: haemolysis.
          - **Hyponatraemia و hyperkalaemia** لما الكلية تفشل، لأن الكلية هي اللي بتطلّع البوتاسيوم والميه الزيادة.
          - **Urinalysis**: haematuria و proteinuria من الـ glomeruli المجروحة.

          يعني كل تحليل بيأكد ضلع من الـ triad: الـ film والـ LDH للـ MAHA، الـ CBC للصفايح، والـ creatinine والبول للكلية.
