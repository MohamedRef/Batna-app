  # Split from lesson5 on 2026-11-13 (#828): metabolic defects, met-Hb,
  # smoking, causes without hypoxia, apparent polycythemia, algorithm (pp172-175).
  - id: hem.L10.lesson8
    title: "Hb عالي من غير hypoxia: سجاير، Chuvash، أورام، وبلازما قليلة"
    hook: "سيجارة، دوا بيأكسد الحديد، طفرة في حساس الأكسجين، ورم بيطلّع EPO، أو مجرد ميّة ناقصة."
    minutes: 10
    pages: [172, 175]
    topics: [secondary]
    goals:
      - "تفهم الـ red cell metabolic defects والـ met-Hb والـ CO-Hb"
      - "تشرح الـ Chuvash والأورام اللي بتطلّع EPO"
      - "تتعامل مع الـ apparent polycythemia وتمشي على algorithm الـ congenital"
    status: unverified
    steps:
      - kind: explain
        page: 172
        title: "الـ high-affinity بصحة كويسة، والـ 2,3-BPG"
        quote: "Most people with high affinity Hb are:\n  In good health,\n  Plethoric,\n  Hyperviscosity is rarely a problem,\n  No increased CV morbidity or mortality,\n  Pregnancy is rarely affected"
        text: |
          أغلب اللي عندهم **high-affinity Hb**: ==in good health==، plethoric، الـ hyperviscosity نادرًا مشكلة، **no increased CV morbidity or mortality**، والحمل نادرًا يتأثر.

          **Red cell metabolic defects**: نادر جدًا. عيب في الـ metabolism بيقلّل الـ **2,3-BPG** جوه الكرة، **autosomal recessive**، والتشخيص بـ **P50 واطي**.

          ليه 2,3-BPG قليل يعمل نفس الصورة؟ التفسير المقبول (مش في الكتاب): الـ 2,3-BPG هو اللي **بيزقّ** الأكسجين من على الـ Hb في الأنسجة. قلّ، يبقى الـ Hb ماسك أكتر (left shift)، زي الـ high-affinity بالظبط. وليه هما بصحة كويسة؟ لأن الكرات الزيادة هنا **تعويض مظبوط** مش ورم، فالجسم بيوصل لتوازن.
      - kind: explain
        remind: [hem.L10.107]
        page: 172
        title: "Met-Hb و السجاير"
        quote: "Acquired methemoglobinemia due to exposure to strong oxidant (dapsone, inorganic nitrate, benzocaine, sulpha), life threatening when severe."
        text: |
          - **Met-Hb**: الحديد اتأكسد من **Fe²⁺ لـ Fe³⁺**، والرجوع محتاج **reduced nicotinamide adenine dinucleotide (NADH)** من الـ glycolysis. الـ met-Hb affinity أعلى و **left shift**.
          - **Acquired**: oxidants قوية: ==dapsone، inorganic nitrate، benzocaine، sulpha==؛ خطير لو شديد.
          - **Hereditary**: **Hb M** (حوالين الـ heme pocket) أو عيوب **NADH reductase / cytochrome b5 reductase**.
          - الـ **chronic** met-Hb ممكن يعمل secondary polycythemia زي الـ high-affinity (ص 173).
          - **Heavy smoking** (ص 173): **CO-Hb 3–20%**: الـ CO **بيزق الـ O2** وبيعمل conformational change زي الـ met-Hb (left shift، P50 واطي)، فـ **mild polycythemia** حتى من غير مرض رئة.

          ليه الـ NADH مهم؟ التفسير المقبول (مش في الكتاب): هو اللي بيدّي الإلكترون اللي بيرجّع الحديد Fe²⁺. أي عيب في الإنزيمات اللي بتستعمله، الـ met-Hb بيتراكم.
      - kind: check
        page: 172
        quote: "Acquired methemoglobinemia due to exposure to strong oxidant (dapsone, inorganic nitrate, benzocaine, sulpha), life threatening when severe."
        question: "Which drug from the book's list can cause acquired methaemoglobinaemia?"
        options: ["Dapsone", "Allopurinol", "Hydroxyurea", "ACE inhibitor"]
        answer: 0
        why:
          - "صح: dapsone و inorganic nitrate و benzocaine و sulpha."
          - "الـ allopurinol للـ uric acid في الـ PV."
          - "الـ hydroxyurea cytoreductive، مش oxidant في القايمة."
          - "الـ ACE inhibitor علاج للـ chronic mountain sickness وبعض حالات الكلى."
      - kind: explain
        page: 173
        title: "من غير hypoxia: Chuvash والكلى والأورام"
        quote: "VHL mutant leads to reduced rate of degradation of HIF-1 and up regulation of down stream target Epo."
        text: |
          - ==Chuvash polycythemia==: **autosomal recessive**، endemic في Chuvashia (mid-Volga)، EPO **عالي** ومفيش erythropoietin receptor (EPOR) mutation. السبب **von Hippel–Lindau (VHL)** mutation: الـ VHL مسؤول عن الـ ubiquitination و degradation بتاع **HIF-1**، فلما يتعيّب الـ HIF-1 ما بيتكسرش، والـ **EPO** يعلى.
          - **Renal**: tumours، **polycystic kidney**، **renal cyst** (**local hypoxia**)، renal transplantation. بعضهم يستجيب لـ **ACE inhibitors و theophylline**، وبعضهم venesection، وبعضهم يخف لوحده (ص 174).
          - **Non-renal tumours** (ص 174): **HCC**، **cerebellar hemangioma**، **large uterine fibroma**. ==Polycythemia responds to removal of the tumor==.
          - **Endocrine**: **androgens** زيادة: EPO أعلى + تأثير **مباشر** على النخاع.

          الكيس في الكلية ليه؟ الكتاب بيقول **local hypoxia**: الكيس بيضغط على الأنسجة حواليه، فخلايا الكلية اللي بتقيس الأكسجين بتحس إنه قليل، رغم إن الجسم كله كويس.
      - kind: figure
        page: 173
        quote: "Mutation in von Hipple-Lindua gene (VHL) responsible for ubiquintination and degradation of HIF-1 transcription factor (central in oxygen sensing pathway).\nVHL mutant leads to reduced rate of degradation of HIF-1 and up regulation of down stream target Epo."
        title: "حساس الأكسجين: VHL و HIF-1"
        alt: "Two rows. Normal oxygen: HIF-1 is tagged by VHL and degraded, so EPO stays normal. VHL mutant (Chuvash): HIF-1 is not degraded, it builds up and switches on EPO, so EPO is high and red cells rise."
        caption: "الـ **VHL** بيرمي الـ HIF-1 في الزبالة طول ما فيه أكسجين. في الـ ==Chuvash== الـ VHL عاطل، فالـ HIF-1 يفضل يقول «فيه hypoxia» والـ EPO يعلى."
        svg: |
