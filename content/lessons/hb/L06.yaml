      - kind: explain
        page: 105
        quote: "Interprofessional teams, management, and liver monitoring for care of individuals with diabetes and MASLD\n| Stage | Care team | Management | Liver monitoring |\n|---|---|---|---|\n| MASLD with no fibrosis (F0) or early fibrosis (F1) stage | Primary care physicians, physicians associates/assistants, and nurse practitioners; Registered dietitian nutritionist, obesity management team; Behavioral modification team, diabetes care and education specialist; Metabolic surgery team, as per ADA Standards of Care | Lifestyle intervention, weight loss with pharmacotherapy or metabolic surgery, as per ADA Standards of Care; Diabetes care, as per ADA Standards of Care; favor medications that reduce CVD and steatosis (GLP-1RA, SGLT2i, pioglitazone); CV risk reduction, as per ADA Standards of Care | FIB-4 every 1-2 years. LSM by transient elastography (or ELF) if FIB-4 score is >1.3 (possible disease progression) |\n| MASLD with fibrosis stage F2-F3 (\"at-risk\" MASH) | Same as for MASLD with stage F0-F1, and consider referrals to: Hepatologist or GI (with physician associates/assistants and nurse practitioners team); Endocrinologist/diabetes specialist | Lifestyle intervention, weight loss same as for MASLD with stage F0-F1; Diabetes care: prefer GLP-1, dual GIP/GLP-1RA, pioglitazone, or combination to treat MASH; consider resmetirom after treatment optimization of obesity and/or diabetes for at least 6-12 months; CV risk reduction, same as for MASLD with stage F0-F1 | Consider annual imaging (LSM either by transient elastography or MRE) and measurement of blood-based liver fibrosis biomarkers |\n| Cirrhosis | Same as for MASLD with stage F2-F3, and consider referrals to: Transplant team for decompensated cirrhosis; Social support team | Lifestyle intervention same as for MASLD with stage F0-F1, but decompensated cirrhosis requires tailored nutritional planning; Diabetes care: In compensated cirrhosis: same as for MASLD with stage F2-F3 but with caution; In decompensated cirrhosis: insulin only; Avoid use of resmetirom in cirrhosis; CV risk reduction, same as for MASLD with stage F0-F1; caution with lipid-lowering medications in decompensated cirrhosis | Tailored to cirrhosis severity and presence of its complications. Screen for HCC |"
        title: "مين في الفريق، وبنتابع إزاي؟ (ADA)"
        text: |
          الفريق بيكبر مع الـ stage، زي ما المشكلة بتكبر:

          - **F0–F1**: primary care، و dietitian، و obesity و diabetes teams. المتابعة: FIB-4 every 1–2 years، و liver stiffness measurement (LSM) (elastography أو enhanced liver fibrosis test (ELF)) لو FIB-4 أكتر من 1.3.
          - ==F2–F3 (at-risk metabolic dysfunction-associated steatohepatitis (MASH))==: نفس الفريق، ويدخل hepatologist/GI و endocrinologist. المتابعة: annual imaging (LSM أو magnetic resonance elastography (MRE)) و blood fibrosis biomarkers.
          - **Cirrhosis**: نفس الفريق، ويدخل transplant team (في الـ decompensated) و social support team. المتابعة tailored، و ==screen for hepatocellular carcinoma (HCC)==.
      - kind: figure
        page: 105
        quote: "Interprofessional teams, management, and liver monitoring for care of individuals with diabetes and MASLD"
        title: "مين في الفريق في كل مرحلة: صورة الكتاب"
        image: { file: hb/L06-ada-care-teams.webp, book: true }
        alt: "Book figure: a ring on the left labelled 'Care of people with diabetes and MASLD' with three coloured arcs, each linked to a box on the right. Green box, MASLD with no fibrosis (F0) or early fibrosis (F1): care team of primary care physicians, dietitian, behavioural team, metabolic surgery team; management of lifestyle, diabetes care favouring GLP-1RA, SGLT2i and pioglitazone, cardiovascular risk reduction; liver monitoring FIB-4 every 1-2 years, LSM by transient elastography or ELF if FIB-4 over 1.3. Blue box, fibrosis stage F2-F3 ('at-risk' MASH): add hepatologist or GI and endocrinologist; prefer GLP-1, dual GIP/GLP-1RA, pioglitazone, consider resmetirom after 6-12 months of optimised treatment; annual imaging (LSM by transient elastography or MRE) and blood fibrosis biomarkers. Red box, cirrhosis: add transplant team for decompensated cirrhosis and social support; tailored nutrition in decompensated cirrhosis, insulin only in decompensated cirrhosis, avoid resmetirom, caution with lipid-lowering drugs; monitoring tailored to severity, screen for HCC."
        caption: |
          الدايرة شمال مكتوب فيها **Care of people with diabetes and MASLD**، ومقسومة 3 ألوان، وكل لون بيوصل لصندوق يمين فيه 3 أعمدة: **Care team**، **Management**، **Liver monitoring**:

          - **الأخضر فوق: F0–F1**: الفريق primary care، dietitian، behavioral team. الأدوية المفضلة: glucagon-like peptide-1 receptor agonist (GLP-1RA)، sodium-glucose cotransporter-2 inhibitor (SGLT2i)، pioglitazone. المتابعة: **FIB-4 كل 1–2 سنة**، و liver stiffness measurement (LSM) أو enhanced liver fibrosis (ELF) لو الـ FIB-4 >1.3.
          - **الأزرق في النص: F2–F3 ("at-risk" MASH)**: زود hepatologist أو gastroenterologist (GI) و endocrinologist. GLP-1 أو dual GIP/GLP-1RA أو pioglitazone، و**resmetirom** بعد 6–12 شهر علاج. المتابعة **سنوي**: LSM بالـ elastography أو magnetic resonance elastography (MRE) + biomarkers.
          - **الأحمر تحت: Cirrhosis**: زود transplant team وsocial support. في الـ decompensated: ==insulin only== وتغذية مخصوصة، و==avoid resmetirom== في الـ cirrhosis. المتابعة حسب الشدة + **screen for HCC**.

          كل ما المرحلة تعلى، الفريق بيكبر، والمتابعة بتقرب، والأدوية بتضيق.
      - kind: try
        items: [hb.L06.037, hb.L06.038, hb.L06.039, hb.L06.041, hb.L06.043]
    recap:
      - "**No population screening**؛ بس **screen all prediabetics and T2DM**، حدد الـ high risk، و stage الـ fibrosis."
      - "EASL 2021: FIB-4 **< 1.30** → lifestyle و re-test 1–3 سنين؛ **≥ 1.30** → elastography؛ **≥ 8 kPa** → serum test؛ agree = F3–F4 → refer."
      - "ADA 2025: **< 1.3** كل 1–3 سنين، **1.3–2.67** → VCTE (≥ 8.0 kPa → hepatology)، **> 2.67** → hepatology."
      - "الحد الفوقاني: ص 102 **3.25**، ADA **2.67**، EASL رقم واحد **1.30**."
