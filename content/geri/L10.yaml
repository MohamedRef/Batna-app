  - { id: treatment, title: "Treatment of IPF and non-idiopathic pulmonary fibrosis" }
items:
  # ---------- p169-170: introduction ----------
  - id: geri.L10.001
    kind: card
    topic: intro
    front: What is the normal host response when the lung meets an injurious agent?
    back: Eradicate the agent, repair the injury caused by the agent, and repair the injury caused by the inflammatory process itself; this ends in resolution and normal lung architecture.
    src: { page: 169, quote: "The normal host response to such insults is to eradicate the etiologic agent, to repair the injury caused by the agent" }
    status: unverified
  - id: geri.L10.002
    kind: card
    topic: intro
    front: What happens when the inflammatory and/or repair response of the lung is dysregulated?
    back: A chronic alveolar/interstitial remodelling process with varying inflammation and fibrosis, giving the restrictive physiology and gas-exchange abnormalities of DPLD.
    src: { page: 170, quote: "if the inflammatory and/or repair response is dysregulated, a chronic alveolar/interstitial remodeling process with varying degrees of inflammation and fibrosis ensues." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.003
    kind: card
    topic: intro
    front: Why are the DPLDs grouped into one category although they are heterogeneous?
    back: Because they share common features in their clinical, radiographic and physiological presentations.
    src: { page: 170, quote: "grouped into a single category based on common features in their clinical, radiographic, and physiological presentations." }
    status: unverified
  - id: geri.L10.004
    kind: card
    topic: intro
    front: What is the most prevalent DPLD in the elderly?
    back: Idiopathic pulmonary fibrosis (IPF), a chronic fibrotic disease of unknown etiology.
    src: { page: 170, quote: "The most prevalent in the elderly is Idiopathic Pulmonary Fibrosis (IPF), a chronic fibrotic disease of unknown etiology." }
    status: unverified
    tags: [high-yield]
  # ---------- p170: epidemiology ----------
  - id: geri.L10.005
    kind: cloze
    topic: epidemiology
    text: "DPLD prevalence in the USA is {{c1::20 to 40}} per 100000; above age 75 it may exceed {{c2::175}} per 100000."
    src: { page: 170, quote: "The prevalence of DPLD: 20 to 40 per 100000 in the USA." }
    status: unverified
    tags: [numbers]
  - id: geri.L10.006
    kind: cloze
    topic: epidemiology
    text: "The median age of onset of IPF is {{c1::50 to 70}} years; the diagnosis is almost never made at age {{c2::40 years or younger}}."
    src: { page: 170, quote: "The median age of onset of IPF ranges from 50 to 70 years" }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L10.007
    kind: card
    topic: epidemiology
    front: Two reasons the incidence of DPLD is rising in the elderly?
    back: More use of pneumotoxic drugs for malignant and cardiovascular diseases, and the rising median age of the population.
    src: { page: 170, quote: "The increased use of pneumotoxic drugs to treat malignant and cardiovascular diseases in the elderly as well the rising median age" }
    status: unverified
  # ---------- p171: classification ----------
  - id: geri.L10.008
    kind: table
    topic: classification
    title: "Interstitial lung disease: the four groups (book figure, p171)"
    columns: [Group, Members]
    rows:
      - [Known cause or association, "Connective tissue diseases, occupational causes, drug side-effects"]
      - [Idiopathic interstitial pneumonias (IIP), "Major, unclassifiable and rare forms"]
      - [Granulomatous, "Sarcoidosis, hypersensitivity pneumonitis, infections"]
      - [Other forms, "Lymphangioleiomyomatosis, histiocytosis X"]
    blanks: [[0, 1], [2, 1], [3, 1]]
    src: { page: 171, quote: "Known cause or association: Connective tissue diseases Occupational causes Drug side-effects" }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.009
    kind: table
    topic: classification
    title: "Major idiopathic interstitial pneumonias (book figure, p171)"
    columns: [Subgroup, Diseases]
    rows:
      - [Chronic fibrosing, "Idiopathic pulmonary fibrosis, non-specific interstitial pneumonia"]
      - [Smoking related, "Desquamative interstitial pneumonia, respiratory bronchiolitis-ILD"]
      - [Acute and subacute, "Cryptogenic organising pneumonia, acute interstitial pneumonia"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 171, quote: "Chronic fibrosing Smoking related Acute and subacute" }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.010
    kind: enumerate
    topic: classification
    prompt: Name the two rare idiopathic interstitial pneumonias in the book's figure.
    points: [Idiopathic pleuroparenchymal fibroelastosis, Idiopathic lymphocytic interstitial pneumonia]
    pass: 2
    src: { page: 171, quote: "Rare Idiopathic pleuroparenchymal fibroelastosis Idiopathic lymphocytic interstitial pneumonia" }
    status: unverified
  - id: geri.L10.011
    kind: card
    topic: classification
    front: How does IPF relate to pulmonary fibrosis in the book's diagram?
    back: IPF is one small part sitting inside the much larger circle of pulmonary fibrosis.
    src: { page: 171, quote: "PULMONARY FIBROSIS IPF" }
    status: unverified
  # ---------- p172-173: pathology ----------
  - id: geri.L10.012
    kind: card
    topic: pathology
    front: What is the morphologic pattern of IPF, and on what is its histological diagnosis based?
    back: Usual interstitial pneumonia (UIP); diagnosed by temporal and spatial heterogeneity.
    src: { page: 172, quote: "The histological diagnosis of UIP is based on temporal and spatial heterogeneity." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.013
    kind: card
    topic: pathology
    front: Define temporal heterogeneity in UIP.
    back: Fibrotic lesions at different stages (fibroblastic infiltrates, mature fibrosis and honeycombing) in the same biopsy, with architectural distortion.
    src: { page: 172, quote: "identification of fibrotic lesions at different stages (fibroblastic infiltrates, mature fibrosis and honeycombing) within the same biopsy specimen" }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.014
    kind: cloze
    topic: pathology
    text: "Honeycombing involving more than {{c1::5%}} of the lung volume is an almost {{c2::100%}} specific finding."
    src: { page: 172, quote: "Honeycombing if it involves more than 5% of the lung volume is an almost 100% specific finding." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L10.015
    kind: card
    topic: pathology
    front: Define spatial heterogeneity in UIP.
    back: Areas of normal lung alternating with interstitial fibrosis and honeycombing.
    src: { page: 172, quote: "Areas of normal lung alternating with interstitial fibrosis and honeycombing." }
    status: unverified
  - id: geri.L10.016
    kind: cloze
    topic: pathology
    text: "UIP has an {{c1::apicobasal}} gradient with {{c2::basal and peripheral (subpleural)}} predominance, although it is often patchy."
    src: { page: 172, quote: "The distribution of UIP characteristically is with an apicobasal gradient with basal and peripheral (subpleural) predominance" }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.017
    kind: card
    topic: pathology
    front: How much inflammation is seen in UIP, and where?
    back: Absent or mild, mostly limited to the areas of honeycombing.
    src: { page: 172, quote: "Inflammation is absent or mild and mostly limited to the areas of honeycombing." }
    status: unverified
  - id: geri.L10.018
    kind: card
    topic: pathology
    front: Is a UIP pattern specific to IPF?
    back: No. It also occurs in other ILDs, especially connective-tissue-related ILD.
    src: { page: 172, quote: "it may also occur in other ILD especially in connective tissue related ILD." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.019
    kind: card
    topic: pathology
    front: A UIP pattern is found. When do you call it IPF, and when not?
    back: IPF if the patient was already classed as idiopathic interstitial pneumonia (IIP). If there is a known cause, the UIP is due to that cause, not IPF.
    src: { page: 173, quote: "So if UIP pattern is found in patient who has been previously identified as IIP now we can say it is IPF." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.020
    kind: card
    topic: pathogenesis
    front: Name the structures of the respiratory zone (book figure, p173).
    back: Respiratory bronchioles, alveolar ducts and alveolar sacs; the terminal bronchiole is still part of the conducting zone.
    src: { page: 173, quote: "Structures of the Respiratory Zone" }
    status: unverified
  # ---------- p174-176: pathogenesis ----------
  - id: geri.L10.021
    kind: order
    topic: pathogenesis
    prompt: Order the common pathophysiology proposed for non-idiopathic interstitial pulmonary fibrosis.
    steps:
      - Acute injury to the pulmonary parenchyma
      - Chronic interstitial inflammation
      - Fibroblast activation and proliferation
      - Pulmonary fibrosis and tissue destruction
    src: { page: 174, quote: "begin with acute injury to the pulmonary parynchyma leading to chronic interstitial inflammation, then to fibroblast activation and proliferation" }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.022
    kind: card
    topic: pathogenesis
    front: How does current research see the role of inflammation in IPF?
    back: Less important; IPF appears to be primarily a disorder of fibroblast activation and proliferation in response to unknown trigger(s).
    src: { page: 174, quote: "inflammation is less important in IPF which appears to be primarily a disorder of fibroblast activation and proliferation" }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.023
    kind: card
    topic: pathogenesis
    front: Why was the old inflammation theory of IPF abandoned?
    back: Anti-inflammatory agents and immune modulators proved minimally effective in modifying the natural course of the disease.
    src: { page: 174, quote: "anti-inflammatory agents and immune modulators have proved to be minimally effective in modifying the natural course of the disease." }
    status: unverified
  - id: geri.L10.024
    kind: enumerate
    topic: pathogenesis
    prompt: Give examples of the unknown endogenous or environmental stimuli thought to trigger IPF.
    points: [Smoke, Environmental pollutants, Environmental dust, Viral infections, Gastroesophageal reflux disease, Chronic aspiration]
    pass: 4
    src: { page: 174, quote: "smoke, environmental pollutants, environmental dust, viral infections, gastroesophageal reflux disease, chronic aspiration" }
    status: unverified
  - id: geri.L10.025
    kind: enumerate
    topic: pathogenesis
    prompt: Fibrogenic cytokines and growth factors released by aberrantly activated alveolar epithelial cells.
    points: [TNF-alpha, TGF-beta, Platelet-derived growth factor, Insulin-like growth factor-1, Endothelin-1]
    pass: 4
    src: { page: 175, quote: "platelet-derived growth factor insulin-like growth factor-1 endothelin-1 (ET-1)." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.026
    kind: card
    topic: pathogenesis
    front: What do these cytokines and growth factors do to fibroblasts?
    back: Drive fibroblast migration and proliferation and transform fibroblasts into myofibroblasts.
    src: { page: 175, quote: "These cytokines and growth factors are involved in the migration and proliferation of fibroblasts and the transformation of fibroblasts into myofibroblasts." }
    status: unverified
  - id: geri.L10.027
    kind: card
    topic: pathogenesis
    front: What are the key effector cells in fibrogenesis, and which one secretes matrix?
    back: Fibroblasts and myofibroblasts; myofibroblasts secrete extracellular matrix proteins.
    src: { page: 175, quote: "Fibroblasts and myofibroblasts are key effector cells in fibrogenesis, and myofibroblasts secrete extracellular matrix proteins." }
    status: unverified
  - id: geri.L10.028
    kind: card
    topic: pathogenesis
    front: What must happen to wound myofibroblasts for normal healing, and what if it fails?
    back: They must undergo apoptosis. Failure leads to myofibroblast accumulation, excess extracellular matrix and pathologic scar.
    src: { page: 175, quote: "Failure of apoptosis leads to myofibroblast accumulation, excessive extracellular matrix protein production, and pathologic scar formation." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.029
    kind: card
    topic: pathogenesis
    front: Which growth factor promotes an antiapoptotic phenotype in fibroblasts?
    back: TGF-beta.
    src: { page: 175, quote: "TGF-ẞ has been shown to promote an antiapoptotic phenotype in fibroblasts." }
    status: unverified
  - id: geri.L10.030
    kind: cloze
    topic: pathogenesis
    text: "IPF is currently seen as an {{c1::epithelial-fibroblastic}} disease: aberrant epithelial repair causes excess {{c2::epithelial cell apoptosis}}, while fibroblasts become myofibroblasts {{c3::resistant to apoptosis}}."
    src: { page: 175, quote: "It is currently believed that idiopathic pulmonary fibrosis (IPF) is an epithelial-fibroblastic disease" }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.031
    kind: order
    topic: pathogenesis
    prompt: Order the current model of IPF ("to sum up").
    steps:
      - Unknown stimuli disrupt alveolar epithelial homeostasis
      - Diffuse epithelial activation and aberrant epithelial repair
      - Excess apoptosis and loss of epithelial cells
      - Release of cytokines
      - Fibroblasts become apoptosis-resistant myofibroblasts
      - Excess fibrous tissue and destruction of lung parenchyma
    src: { page: 175, quote: "Excess loss of epithelial cells leads to release of cytokines." }
    status: unverified
  - id: geri.L10.032
    kind: card
    topic: pathogenesis
    front: Which mutation is associated with familial IPF?
    back: Mutation in telomerase.
    src: { page: 175, quote: "Mutation in telomerase is associated with familial idiopathic pulmonary fibrosis." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.033
    kind: card
    topic: pathogenesis
    front: What does telomerase do?
    back: It is a polymerase that adds telomere repeats to chromosome ends, offsetting the shortening that occurs with DNA replication.
    src: { page: 176, quote: "Telomerase is a polymerase enzyme that adds telomere repeats to the ends of chromosomes." }
    status: unverified
  - id: geri.L10.034
    kind: card
    topic: pathogenesis
    front: How can telomere shortening lead to IPF, and why does it link IPF to age?
    back: It occurs with aging (and can be acquired) and may promote loss of alveolar epithelial cells, causing aberrant epithelial repair.
    src: { page: 176, quote: "This telomere shortening could promote the loss of alveolar epithelial cells, resulting in aberrant epithelial cell repair." }
    status: unverified
  # ---------- p177-178: time course ----------
  - id: geri.L10.035
    kind: enumerate
    topic: course
    prompt: The three time courses of fibrotic lung diseases (DPLDs).
    points:
      - "Chronic, insidious, slowly progressive"
      - "Subacute: resolving, remitting, relapsing or progressive"
      - "Acute: fulminant, progressive, remitting or resolving"
    pass: 3
    src: { page: 177, quote: "1) Chronic, insidious, and slowly progressive. 2) Subacute, with a resolving, remitting, relapsing, or progressive course." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.036
    kind: card
    topic: course
    front: Which disorders run a chronic, insidious, slowly progressive course?
    back: Those resembling IPF and sharing its UIP pathology; many rheumatologic/connective-tissue diseases, the pneumoconioses and drug-related pulmonary fibrosis.
    src: { page: 177, quote: "Many of the rheumatologic/connective-tissue diseases, the pneumoconioses, and drug-related pulmonary fibrosis generally fit into this category." }
    status: unverified
  - id: geri.L10.037
    kind: card
    topic: course
    front: Which disease typifies the subacute presentation, and when does it often start?
    back: Cryptogenic organizing pneumonia (COP); often weeks or months after a flulike illness.
    src: { page: 177, quote: "COP often develops weeks or months after the onset of a flulike illness." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.038
    kind: card
    topic: course
    front: Course of COP and its response to treatment?
    back: Variable; it may remit spontaneously or progress. It is thought to be very responsive to steroids.
    src: { page: 178, quote: "The course is variable and may either spontaneously remit or progress. The disorder is thought to be very responsive to steroid therapy." }
    status: unverified
  - id: geri.L10.039
    kind: card
    topic: course
    front: Which disease typifies the acute DPLDs, and what is its histopathology?
    back: Acute interstitial pneumonia (AIP), an idiopathic severe lung injury with the histopathology of adult respiratory distress syndrome.
    src: { page: 178, quote: "AIP is an idiopathic form of severe lung injury. The histopathology is that of adult respiratory distress syndrome." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.040
    kind: card
    topic: course
    front: How do patients with AIP present, and what is their usual course?
    back: With no previous lung disease, or as an accelerated phase of an underlying ILD. Most progress rapidly to respiratory failure; some improve with steroids or other immunosuppressants.
    src: { page: 178, quote: "Most patients progress rapidly to respiratory failure." }
    status: unverified
  # ---------- p178-179: IPF clinical ----------
  - id: geri.L10.041
    kind: card
    topic: clinical
    front: Most common presenting symptom of IPF?
    back: Insidious exertional dyspnea that slowly progresses over many months, sometimes years.
    src: { page: 178, quote: "The most common presenting symptom is the insidious onset of exertional dyspnea that slowly progresses over many months" }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.042
    kind: card
    topic: clinical
    front: Why is early IPF dyspnea often missed in older people?
    back: It is mild and blamed on being out of shape, normal aging, overweight or a viral infection; some are treated for other ailments such as heart failure.
    src: { page: 178, quote: "dyspnea is mild and maybe attributed to other causes such as being out-of-shape," }
    status: unverified
  - id: geri.L10.043
    kind: card
    topic: clinical
    front: Other prominent complaints in IPF besides dyspnea?
    back: Nonproductive cough and fatigue.
    src: { page: 178, quote: "Nonproductive cough and fatigue are also prominent complaints." }
    status: unverified
  - id: geri.L10.044
    kind: card
    topic: clinical
    front: Which systemic symptoms may occur in IPF (uncommon), and which never belong to it?
    back: Weight loss, low-grade fever, fatigue, arthralgia, myalgia. Not arthritis and not myositis.
    src: { page: 178, quote: "weight loss, low- grade fevers, fatigue, arthralgias, or myalgias. (Not arthritis, Not myositis)." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.045
    kind: card
    topic: clinical
    front: How may IPF be found incidentally?
    back: On a chest radiograph or abnormal screening spirometry done for unrelated reasons.
    src: { page: 178, quote: "Incidental diagnosis may be made from a chest radiograph or abnormal screening spirometry findings obtained for unrelated reasons." }
    status: unverified
  - id: geri.L10.046
    kind: card
    topic: clinical
    front: Characteristic chest auscultation finding in IPF?
    back: Bilateral basal "Velcro-like" late-inspiratory crackles.
    src: { page: 179, quote: "Characteristic bilateral basal crepitant (\"Velcro-like\") late-inspiratory rales (crackles) on lung auscultation." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.047
    kind: card
    topic: clinical
    front: Is digital clubbing seen in IPF?
    back: Yes, it is relatively common in IPF, less common in some other DPLDs.
    src: { page: 179, quote: "Digital clubbing is relatively common in IPF, but less common in certain other DPLDs." }
    status: unverified
  - id: geri.L10.048
    kind: enumerate
    topic: clinical
    prompt: Cardiac signs of pulmonary hypertension and cor pulmonale in late IPF.
    points: [Accentuated P2, Tricuspid insufficiency, Right ventricular heave, Peripheral edema]
    pass: 3
    src: { page: 179, quote: "an accentuated P2, tricuspid insufficiency, a right ventricular heave, and peripheral edema maybe noted." }
    status: unverified
  - id: geri.L10.049
    kind: card
    topic: clinical
    front: Does IPF have extrapulmonary involvement?
    back: No. Extrapulmonary involvement does not occur with IPF.
    src: { page: 179, quote: "Extrapulmonary involvement does not occur with idiopathic pulmonary fibrosis." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.050
    kind: card
    topic: clinical
    front: Other examination findings in IPF besides Velcro crackles?
    back: Occasional wheeze, rhonchi or coarse rales; the chest may be normal early; resting tachycardia and tachypnea in advanced disease.
    src: { page: 179, quote: "With advanced disease, resting tachycardia and tachypnea maybe present." }
    status: unverified
  - id: geri.L10.051
    kind: enumerate
    topic: clinical
    prompt: What to check in the history of a patient with suspected IPF.
    points:
      - "Drugs: amiodarone, bleomycin, nitrofurantoin"
      - "Exposures: radiation, asbestos, silica, heavy metals, pigeon droppings"
      - "Collagen-vascular disease: arthralgia, arthritis, photosensitivity, Raynaud, dry eyes or mouth"
      - Obstructive sleep apnoea (high prevalence in IPF)
    pass: 4
    src: { page: 179, quote: "1) Drug history (e.g. Amiodarone, bleomycin, and nitrofurantoin)." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.052
    kind: cloze
    topic: clinical
    text: "Drugs to ask about in suspected IPF: {{c1::amiodarone}}, {{c2::bleomycin}} and {{c3::nitrofurantoin}}."
    src: { page: 179, quote: "1) Drug history (e.g. Amiodarone, bleomycin, and nitrofurantoin)." }
    status: unverified
  # ---------- p179-180: complications and prognosis ----------
  - id: geri.L10.053
    kind: enumerate
    topic: prognosis
    prompt: Complications of idiopathic pulmonary fibrosis.
    points: [Pulmonary hypertension, Acute exacerbation of pulmonary fibrosis, Respiratory infection, Acute coronary syndrome, Thromboembolic disease, Adverse medication effects, Lung cancer]
    pass: 5
    src: { page: 179, quote: "1) Pulmonary hypertension. 2) Acute exacerbation of pulmonary fibrosis. 3) Respiratory infection." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.054
    kind: enumerate
    topic: prognosis
    prompt: Baseline characteristics that predict a poor prognosis in IPF.
    points:
      - UIP on lung biopsy (median survival under 5 years)
      - Low DLCO
      - Increased A-a gradient
      - Desaturation on 6-minute walk (SaO2 below 88%)
      - Pulmonary arterial hypertension (mPAP above 25 mmHg)
      - Honeycombing on HRCT
    pass: 5
    src: { page: 180, quote: "1) The finding of UIP on lung biopsy predicts a median survival of less than 5 years. 2) A low DLCO" }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.055
    kind: cloze
    topic: prognosis
    text: "Poor prognosis in IPF: desaturation during a 6-minute walk to SaO2 {{c1::below 88%}}, and pulmonary arterial hypertension with mPAP {{c2::above 25 mmHg}}."
    src: { page: 180, quote: "4) Desaturation during a 6-minute walk test (SaO2 < 88%) 5) Pulmonary arterial hypertension (mPAP >25 mmHg)" }
    status: unverified
    tags: [numbers]
  - id: geri.L10.056
    kind: cloze
    topic: prognosis
    text: "Dynamic predictors of poor prognosis: FVC decline of {{c1::10% or more}} predicted over {{c2::6 months}}, DLCO decline of {{c3::15% or more}} predicted over 12 months, and serial changes in dyspnea score."
    src: { page: 180, quote: "1) Decline in (FVC) ≥10 (%predicted) over a 6-month period. 2) Decline in DLCO ≥ 15 (%predicted) over a 12-month period." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L10.057
    kind: card
    topic: prognosis
    front: Natural history of IPF?
    back: Heterogeneous. Most patients decline steadily in lung function, but a significant proportion die of acute exacerbations, whose cause is unknown.
    src: { page: 180, quote: "a significant proportion of patients with IPF succumb to acute exacerbations of the disease." }
    status: unverified
  # ---------- p181-184: diagnosis ----------
  - id: geri.L10.058
    kind: card
    topic: diagnosis
    front: Causes of progressive dyspnoea to think of before ILD?
    back: Cardiac, anemia, metabolic, and chest causes (ILD, COPD).
    src: { page: 181, quote: "Causes: cardiac, anemia, metabolic, chest (ILD, COPD)." }
    status: unverified
  - id: geri.L10.059
    kind: table
    topic: diagnosis
    title: Patterns of PFT
    columns: [Pattern, FVC, FEV1/FVC]
    rows:
      - [Normal, "> LLN", "> 70%"]
      - [Obstructive, "> LLN", "< 70%"]
      - [Restrictive, "< LLN", "> 70%"]
      - [Mixed, "< LLN", "< 70%"]
    blanks: [[1, 2], [2, 1], [2, 2], [3, 1]]
    src: { page: 181, quote: "c) Restrictive Pattern ……. < LLN ……. > 70%" }
    status: unverified
    tags: [high-yield, numbers]
  - id: geri.L10.060
    kind: card
    topic: diagnosis
    front: Spirometry shows a restrictive pattern. What next, and what confirms restrictive lung disease?
    back: DLCO and full PFT for total lung capacity. Confirmed by diminished CO diffusion capacity and TLC below LLN.
    src: { page: 181, quote: "Restrictive Lung Disease is confirmed by presence of: Diminshed CO diffusion capacity And TLC < LLN." }
    status: unverified
    tags: [high-yield]
  - id: geri.L10.061
    kind: card
    topic: diagnosis
    front: Hallmark chest X-ray finding in ILD, and the late finding?
    back: Reticular and/or nodular opacities; honeycombing is late.
    src: { page: 181, quote: "Reticular and/or nodular opacities are the hallmark. Honeycombing is a late finding." }
    status: unverified
