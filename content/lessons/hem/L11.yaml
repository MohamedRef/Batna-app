        hide: [[0, 1], [0, 2]]
      - kind: aside
        tone: analogy
        page: 188
        quote: "The tumor is located in the upper respiratory tract especially in the nasal cavity and sinuses, nasopharynx, and larynx, in the gastrointestinal tract"
        text: "الـ extramedullary plasmacytoma زي ضيف ساكن في المناخير: nasal cavity و sinuses هما أشهر عنوان."
      - kind: explain
        page: 188
        quote: "IgD myeloma\n  ~1% of cases of MM; younger mean age; high rate of Bence Jones proteinuria and associated higher frequency of acute and chronic renal failure\nIgM myeloma\n  Very rare; <0.5% of MM\n  Plasma cell infiltrate in BM associated with osteolytic lesions\n  Response and survival equivalent to MM."
        title: "IgD و IgM و IgE"
        text: |
          - **IgD**: حوالي **1%**، **أصغر سنًا**، و ==Bence Jones كتير== فالـ **acute و chronic renal failure** أكتر.
          - **IgM**: نادر جدًا (**< 0.5%**). plasma cells في النخاع مع **osteolytic lesions**، والـ response والـ survival **زي الـ MM**.
          - **IgE** (ص 189): **أندر نوع**، أصغر سنًا، و **plasma cell leukaemia** كتير.

          ليه الـ IgM اللي هنا بنسمّيه myeloma؟ التفسير المقبول (مش في الكتاب): الـ IgM paraprotein عادةً بيعمله Waldenström (اللي في قايمة الـ MGUS، ص 181)، وده lymphoma مش myeloma. اللي بيفرّق هنا إن فيه **plasma cells** و **lytic lesions**، يعني بيتصرف زي الـ myeloma، فبيتعالج ويعيش زيه.
      - kind: aside
        tone: exam
        page: 189
        quote: "IgE myeloma\nRarest form of MM\nYounger age; high incidence of plasma cell leukaemia."
        text: "سؤال جاهز: «rarest form of MM» = **IgE**، وبيجي معاه **plasma cell leukaemia** كتير وفي سن أصغر. والـ IgD هو اللي بيبوّظ الكلية (Bence Jones)."
      - kind: sort
        page: 188
        quote: "IgD myeloma\n  ~1% of cases of MM; younger mean age; high rate of Bence Jones proteinuria and associated higher frequency of acute and chronic renal failure"
        prompt: "مين ده؟"
        bins: ["IgD", "IgM", "IgE"]
        cards:
