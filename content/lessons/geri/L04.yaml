    goals:
      - "تعرف الـ early warning signs وخطوات الـ evaluation بالترتيب وليه"
      - "تحسب وتفسّر الـ Mini-Mental State Examination (MMSE)"
      - "تفرّق الـ Alzheimer's disease (AD) drugs بالـ mechanism والجرعة"
    status: unverified
    steps:
      - kind: explain
        page: 62
        quote: "How important is early detection and diagnosis of AD?\n  Early warning signs include:\n    Gradual loss of short-term memory\n    Mood or personality changes\n    Problems finding or speaking the right word\n    Inability to recognize objects\n    For getting how to use simple, ordinary things, such as a pencil\n    For getting to turn off the stove, close windows andlock doors"
        title: "علامات الإنذار"
        text: |
          ==Early warning signs==:
          - **Gradual loss of short-term memory**.
          - تغيير في الـ **mood or personality**.
          - مش لاقي الكلمة (**word finding**).
          - مش عارف يتعرّف على الحاجات.
          - نسي يستخدم حاجة بسيطة زي **pencil**.
          - ينسى يقفل الـ **stove** أو الشبابيك أو الباب.

          ليه دي بالذات أول علامات؟ التفسير المقبول (مش في الكتاب): لأن الزهايمر بيبدأ في الـ **hippocampus** (اللي بيخزّن الجديد)، فالـ short-term memory تقع الأول، وبعدين ينتشر للـ cortex فتيجي اللغة والتعرّف واستخدام الحاجات. وعلامات زي **الـ stove** والباب مهمة لأنها بتقول إن فيه **خطر** على المريض، مش نسيان بريء.
      - kind: order
        page: 62
        quote: "III. EVALUATION\n  1. History (family,friends)-degree of change in ADL and in personal behaviour\n  2. Physical examination\n  3. Cognitive assessment-attention, memory, executive function, language, visuospatial"
        prompt: "رتّب الـ evaluation زي الكتاب:"
        steps:
