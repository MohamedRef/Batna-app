  # --- Comparison (slides 63-65) ---
  - id: res.L05.054
    kind: table
    topic: compare
    title: Case-control versus cohort
    columns: [Feature, Case-control, Cohort]
    rows:
      - [Direction, Effect to cause, Cause to effect]
      - [Starts with, The disease, People exposed to the suspected cause]
      - [Subjects, Fewer, Larger number]
      - [Results, Relatively quick, "Long follow-up, delayed"]
      - [Rare disease, Suitable (best), Inappropriate]
      - [Measure, "Odds ratio (estimate of RR)", "Incidence, RR, AR"]
      - [Outcomes, Only the disease under study, More than one disease]
      - [Cost, Relatively inexpensive, Expensive]
    blanks: [[0, 1], [0, 2], [4, 2], [5, 1], [6, 2]]
    src: { page: 63, quote: "| Case Control Studies | Cohort Studies |\n|---|---|\n| Proceeds from effect to cause | Proceeds from cause to effect |\n| Starts with the disease | Starts with people exposed to the risk factor or suspected cause |\n| Tests whether the suspected cause occurs more frequently in those with disease than those without disease | Tests whether disease occurs more frequently in those exposed than in those not exposed |\n| Usually the 1st approach to the testing of hypothesis, but also useful for exploratory studies | Reserved for the testing of precisely formulated hypothesis |\n| Involves fewer study subjects | Involves larger number of subjects |\n| Yields results relatively quickly | Long follow-up, delayed results |\n| Suitable for study of rare diseases | Inappropriate when disease or exposure under investigation is rare |\n| Generally, yields only estimate of relative risk (Odds ratio) | Yields incidence rates, relative risk, attributable risk |\n| Cannot yield information about disease other than that under study | Can give information about more than one disease outcome |\n| Relatively inexpensive | Expensive |" }
    status: unverified
    tags: [high-yield]
  - id: res.L05.055
    kind: mcq
    topic: compare
    stem: Which situation is best studied with a cohort rather than a case-control design?
    options: [A rare disease, A disease with a long latent period, A rare exposure, Several risk factors for one disease]
    answer: 2
    why:
      - Rare disease is best by case-control.
      - Long latency is best by case-control.
      - A rare exposure (e.g. an industrial chemical) is best by cohort, since you start from the exposed.
      - Several risk factors is best by case-control.
    src: { page: 64, quote: "Comparing case control to cohort\n| | Case control | Cohort |\n|---|---|---|\n| Logistic of the study: Time | quick | long term |\n| Cost | relatively cheap | costly |\n| Sample size | small | larger |\n| Ethical problem | - | + |\n| Type of investigation: Rare disease | best | - |\n| Disease with long LP | best | - |\n| Rare exposure | - | best |\n| Multiple outcomes | - | best |\n| Several risk factors | best | - |" }
    status: unverified
    tags: [high-yield]
