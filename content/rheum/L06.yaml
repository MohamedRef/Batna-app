    status: unverified
    tags: [high-yield]
  - id: rheum.L06.006
    kind: cloze
    topic: innate
    text: "The innate immune system is activated {{c1::immediately}} and controls replication of the organism until clonal expansion of adaptive lymphocytes, which takes {{c2::3–5 days}}."
    src: { page: 85, quote: "acquired immune system that takes 3-5 days can deal with it." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L06.007
    kind: card
    topic: innate
    front: Besides holding off infection early, what else does the innate immune system do?
    back: It interacts with and controls the adaptive immune system.
    src: { page: 85, quote: "Also IIS interacts with and controls the adaptive immune system." }
    status: unverified
  - id: rheum.L06.008
    kind: mcq
    topic: innate
    stem: Which feature belongs to innate rather than adaptive immunity, according to the lecture?
    options:
      - Increases in intensity with each exposure
      - Mediated by lymphocytes and antibodies
      - Present at birth and does not change in intensity with infection
      - Acquired from exposure
      - Main circulating factor is antibody
    answer: 2
    why:
      - That is adaptive immunity.
      - Lymphocytes and antibodies are adaptive.
      - "Correct: innate immunity is non-specific, present at birth and constant in intensity (p85)."
      - Acquired from exposure = adaptive.
      - Innate circulating factors are complement and CRP.
    src: { page: 85, quote: "Present at birth." }
    status: unverified
  # ---------- p86: IIS mechanism ----------
  - id: rheum.L06.009
    kind: card
    topic: iis
    front: What are pathogen-associated molecular patterns (PAMPs)? Give examples.
    back: Microbial molecules macrophages recognise, e.g. bacterial lipopolysaccharides, peptidoglycans, mannans and bacterial DNA/RNA.
    src: { page: 86, quote: "pathogen-associated molecular patterns" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.010
    kind: card
    topic: iis
    front: Through which receptors do macrophages bind PAMPs?
    back: Pattern recognition receptors, such as Toll-like receptors and mannose receptors.
    src: { page: 86, quote: "Binding occurs through Toll-like receptors; mannose receptors (pattern" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.011
    kind: table
    topic: iis
    title: "Macrophage cytokines after PAMP binding and their targets"
    columns: [Cytokine, Acts on]
    rows:
      - ["IL-1, TNF-α, IL-8", Activate neutrophils]
      - [IFN-α, Stimulates phagocytes]
      - [IL-15, Stimulates natural killer cells]
      - ["IL-12, IL-18", Stimulate TH1 cells]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 86, quote: "IL-15 stimulate natural killer cells." }
    status: unverified
  - id: rheum.L06.012
    kind: enumerate
    topic: iis
    prompt: How does the innate immune system interact with the acquired immune system?
    points:
      - Innate cells bind pathogens, endocytose them and present them to T cells (act as APCs)
      - Antigen binding to Toll receptors upregulates costimulatory molecules on APCs, needed for T-cell activation
    pass: 2
    src: { page: 86, quote: "Binding of antigens to Toll receptors upregulates the expression of co-" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.013
    kind: mcq
    topic: iis
    stem: Which macrophage cytokines stimulate TH1 cells after Toll-like receptor binding, according to the lecture?
    options: ["IL-12 and IL-18", IL-15, "IL-1 and IL-8", IL-4, IL-10]
    answer: 0
    why:
      - "Correct: IL-12 and IL-18 stimulate TH1 cells (p86)."
      - IL-15 stimulates NK cells.
      - IL-1 and IL-8 (with TNF) activate neutrophils.
      - IL-4 drives Th2, not Th1.
      - IL-10 is the Treg effector cytokine.
    src: { page: 86, quote: "IL-12 , IL-18 stimulate TH1 cells." }
    status: unverified
  # ---------- p86: cytokines ----------
  - id: rheum.L06.014
    kind: card
    topic: cytokines
    front: Define cytokines.
    back: Small molecular weight soluble factors released by cells to communicate with and influence the function of other cells through specific surface receptors.
    src: { page: 86, quote: "Are small molecular weight soluble factors released by cells (cyto) to" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.015
    kind: cloze
    topic: cytokines
    text: "Cytokines can act in an {{c1::autocrine}}, {{c1::paracrine}} or {{c1::endocrine}} way; those released by and acting on white blood cells are called {{c2::interleukins}}."
    src: { page: 86, quote: "Cytokines can have an autocrine function, paracrine or endocrine function." }
    status: unverified
  - id: rheum.L06.016
    kind: card
    topic: cytokines
    front: What immune functions do cytokines have?
    back: Lymphocyte activation, and local and systemic inflammation.
    src: { page: 86, quote: "Cytokines have important immune functions in lymphocyte activation, local" }
    status: unverified
  # ---------- p87-91: HLA ----------
  - id: rheum.L06.017
    kind: card
    topic: hla
    front: What is the HLA, and on which chromosome are its genes?
    back: The human major histocompatibility complex, a collection of genes many of which have immune functions; on chromosome 6.
    src: { page: 87, quote: "The human MHC is known as HLA and the genes are found on" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.018
    kind: card
    topic: hla
    front: What do class I and class II HLA molecules do?
    back: They are cell-surface glycoproteins that bind short processed peptides and present them to the T cell receptor.
    src: { page: 87, quote: "and bind short processed peptides and present them to T cell receptor." }
    status: unverified
  - id: rheum.L06.019
    kind: table
    topic: hla
    title: "HLA class I versus class II"
    columns: [Feature, Class I, Class II]
    rows:
      - [Presents to, Cytotoxic (CD8) T cells, Helper (CD4) T cells]
      - [Expressed on, All nucleated cells, "Professional APCs: macrophages, dendritic cells, B cells"]
      - [Chains, "α heavy chain (class I genes) + β2-microglobulin", "α and β chains, both transmembrane"]
      - [Diversity, Less, More]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [3, 2]]
    src: { page: 87, quote: "Class I to cytotocic and class II to helper T cells" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.020
    kind: mcq
    topic: hla
    stem: A virus infects renal tubular cells. Which HLA molecules on the infected cells present viral peptides, and to which T cells?
    options:
      - Class II, to helper T cells
      - Class I, to cytotoxic T cells
      - Class III, to NK cells
      - Class II, to cytotoxic T cells
    answer: 1
    why:
      - Class II is only on professional APCs (macrophages, dendritic cells, B cells).
      - "Correct: class I is on all nucleated cells and presents to cytotoxic T cells (p87, p101)."
      - Class III genes code complement and TNF, not peptide presenters.
      - Class II presents to helper T cells.
    src: { page: 87, quote: "Class I are expressed on all nucleated cells" }
    status: unverified
  - id: rheum.L06.021
    kind: enumerate
    topic: hla
    prompt: Which genes lie in the class III region of the MHC on chromosome 6 (p87 map)?
    points: [C4B and C4A, Factor B (Bf), C2, HSP, TNF]
    pass: 3
    src: { page: 87, quote: "C4B C4A B1 C2 HSP TNF" }
    status: unverified
  - id: rheum.L06.022
    kind: cloze
    topic: hla
    text: "In HLA class I, the heavy α chain is non-covalently bound to {{c1::β2-microglobulin}}, whose gene is on chromosome {{c2::15}}."
    src: { page: 88, quote: "microglobulin, the gene for which is on chromosome 15." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L06.023
    kind: card
    topic: hla
    front: Which HLA class shows more diversity?
    back: Class II proteins show more diversity than class I.
    src: { page: 88, quote: "MHC class II proteins show more diversity than MHC class I proteins." }
    status: unverified
  - id: rheum.L06.024
    kind: card
    topic: hla
    front: Why do all HLA-DR molecules share the same α chain?
    back: The DR subregion contains a single α chain gene (DRA); the diversity comes from the DRB genes.
    src: { page: 89, quote: "DR subregion contains a single chain gene (DRA), all HLA-DR" }
    status: unverified
  - id: rheum.L06.025
    kind: cloze
    topic: hla
    text: "There are {{c1::nine}} DRB genes (DRB1–9), of which {{c2::4}} are functional; DRB1 alone has about {{c3::60}} alleles."
    src: { page: 89, quote: "There exist nine DRB genes DRB1-9 (4 are functional)" }
    status: unverified
    tags: [numbers]
  - id: rheum.L06.026
    kind: card
    topic: hla
    front: Define gene polymorphism and give its two consequences for HLA.
    back: A considerable number of different alleles at one locus (e.g. DRB1 with 60). Individuals differ enormously in HLA genes, giving diverse susceptibility to disease and prompt rejection of organ transplants.
    src: { page: 89, quote: "termed gene polymorphismb e.g DRB1 has 60 different alleles." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.027
    kind: card
    topic: hla
    front: Which chains are polymorphic in the HLA-DQ and HLA-DP regions?
    back: In DQ both α and β chains are polymorphic; in DP the β chain is highly polymorphic.
    src: { page: 89, quote: "DQ region: DQ and chains are polymorphic." }
    status: unverified
  - id: rheum.L06.028
    kind: card
    topic: hla
    front: Why did HLA nomenclature change?
    back: Types used to be defined serologically by the antisera a cell reacts with; genotyping and amino-acid sequencing showed that molecules identical by serology can differ.
    src: { page: 89, quote: "by serology may differ at genotyping." }
    status: unverified
  - id: rheum.L06.029
    kind: order
    topic: hla
    prompt: Build the class II allele name DRB1*0101 in the order the lecture gives.
    steps:
      - Letter for the locus (DR)
      - A or B for the α or β chain (DRB)
      - Number defining the locus (DRB1)
      - Asterisk (DRB1*)
      - Two-digit type (DRB1*01)
      - Two-digit variant (DRB1*0101)
    src: { page: 90, quote: "Letter designing locus DR." }
    status: unverified
  - id: rheum.L06.030
    kind: cloze
    topic: hla
    text: "In HLA-A*0101, the first two digits ({{c1::01}}) give the {{c2::type}}, the same as the serology number, and the next two give the {{c3::variant}}."
    src: { page: 90, quote: "2 digit number design type HLA-A*01." }
    status: unverified
  - id: rheum.L06.031
    kind: card
    topic: hla
    front: What is an MHC haplotype, and what is codominance?
    back: A haplotype is the string of linked MHC genes on one chromosome, one maternal and one paternal. Codominance means both the maternal and paternal alleles are expressed.
    src: { page: 90, quote: "Both maternal and paternal derived allelic forms are expressed: codominance." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.032
    kind: card
    topic: hla
    front: Define linkage disequilibrium and give the lecture's example.
    back: Certain alleles occur together on one haplotype more often than random recombination at meiosis would allow (e.g. HLA-B8, DR3); large intact MHC portions are inherited as extended haplotypes.
    src: { page: 90, quote: "frequency than should occur if recombination during meiosis was random (eg." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.033
    kind: card
    topic: hla
    front: Which extended haplotype does the lecture ask "too much of a good thing?" about, and why?
    back: HLA A1, B8, DR3. It may give a vigorous response to infection, but also aggressive hyper-responsiveness and inflammatory diseases.
    src: { page: 91, quote: "HLA A1, B8, DR3 vigorous response to infection?" }
    status: unverified
  - id: rheum.L06.034
    kind: mcq
    topic: hla
    stem: >-
      HLA-B8 and HLA-DR3 are found together on the same haplotype far more often than chance recombination
      would predict. What is this called?
    options: [Codominance, Linkage disequilibrium, Gene polymorphism, Molecular mimicry, Negative selection]
    answer: 1
    why:
      - Codominance is expression of both parental alleles.
      - "Correct: alleles found together more often than random meiotic recombination allows = linkage disequilibrium (p90)."
      - Polymorphism is the number of alleles at a locus.
      - Mimicry is HLA resembling a pathogen antigen.
      - Negative selection is thymic deletion.
    src: { page: 90, quote: "Linkage disequilibrium." }
    status: unverified
  - id: rheum.L06.035
    kind: enumerate
    topic: hla-disease
    prompt: By what mechanisms do MHC genes confer disease susceptibility?
    points:
      - T cell maturation (MHC decides which naïve T cells survive in the thymus)
      - MHC controls what T cells can see (peptide binding depends on its amino-acid sequence)
      - Molecular mimicry
      - Linkage disequilibrium
    pass: 4
    src: { page: 91, quote: "By what mechanism do MHC genes confer disease susceptibility:" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.036
    kind: card
    topic: hla-disease
    front: Explain the molecular mimicry theory of HLA–disease association.
    back: An HLA molecule may resemble a pathogen antigen. Either the pathogen is taken as self, giving severe unabated disease, or the response against the pathogen also hits self HLA, giving autoimmune disease.
    src: { page: 91, quote: "HLA molecule may bear similarity to a certain antigen (pathogen)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L06.037
    kind: card
    topic: hla-disease
    front: How can linkage disequilibrium explain an HLA–disease association?
    back: The HLA allele itself may not confer susceptibility but is commonly inherited with another gene that does.
    src: { page: 92, quote: "they are associated but they are commonly inherited in association with" }
    status: unverified
