        text: |
          - **First line:** **gemcitabine + platinum compound**، لوحده أو مع radiotherapy.
          - **NCCN:** **durvalumab أو pembrolizumab** + gemcitabine + cisplatin للـ primary treatment في unresectable و metastatic biliary tract cancer.
          - **NICE:** **durvalumab** + gemcitabine + cisplatin.
          - **Second line** بعد progression على gem/platinum: **FOLFOX** (folinic acid + fluorouracil + oxaliplatin).
          - الـ response محدود، فممكن **نوقف العلاج** لو الـ imaging أكّد progression.
          - بعض الأورام بتتعمل **downstaging** وتبقى resectable بعد الـ chemoradiation.
          - **Transarterial chemotherapy-based treatment:** survival benefit **2–7 شهور** مقارنة بالـ systemic.
          - **Next generation sequencing** علشان نلاقي **targetable alterations** للـ second line، وفكّر في **clinical trials**.
