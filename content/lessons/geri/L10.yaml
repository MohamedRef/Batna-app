            <text x="20" y="392" class="t-sm t-mut">Cryobiopsy: may replace surgery (ATS 2022)</text>
          </svg>
      - kind: reveal
        page: 183
        quote: "Transbronchial lung biopsy frequently is Not useful for diagnosis. This is due to the patchy distribution of the majority of these diseases."
        prompt: "ليه الـ transbronchial biopsy غالبًا مش بيفيد في الـ ILD؟ افتكر الـ spatial heterogeneity."
        answer: "لأن أغلب الأمراض دي ==patchy==: حتة سليمة جنب حتة تعبانة. العينة الصغيرة ممكن تيجي من الحتة السليمة. عشان كده محتاجين surgical biopsy (open أو thoracoscopic) لما الـ HRCT مش definite."
      - kind: explain
        page: 182
        quote: "Morbidity of the procedure is significant. A definitive diagnosis may not be possible even with surgical lung biopsy."
        title: "الـ surgical biopsy مش ببلاش"
        text: |
          وازن الـ risk والـ benefit، خصوصًا في الكبار:

          - الـ ==morbidity== كبيرة.
          - ممكن حتى بعدها مانوصلش لتشخيص.
          - ولو وصلنا، ممكن مايكونش فيه علاج فعّال.
          - فساعات empiric therapy أو مفيش علاج أحسن من الـ biopsy.
      - kind: update
        page: 182
        quote: "Update Ats 2022: Transbronchial Cryobiopsy is being considered to replace surgical lung biopsy although not yet fully approved."
        text: "الكتاب نفسه بيقول إن ATS 2022 بتدرس الـ transbronchial cryobiopsy كبديل للـ surgical biopsy، بس لسه مش approved بالكامل."
        ref: "ATS 2022 (as cited by the book)"
      - kind: explain
        page: 184
        quote: "Management of comorbid conditions. Stop smoking and offer pharmacotherapy as needed. Oxygen therapy."
        title: "علاج الـ IPF"
        text: |
          الـ optimal therapy لسه متحددش، فوازن الـ risk/benefit مع المريض.

          **General**: comorbidities، وقف التدخين، oxygen، vaccine للـ influenza والـ pneumococcus.

          **Antifibrotics** (الاتنين FDA 2014):
          - ==Nintedanib== (Ofev): tyrosine kinase inhibitor على VEGFR و FGFR و PDGFR، بيوقف signaling الـ fibroblast. أكتر سبب لوقفه: diarrhea، nausea، vomiting.
          - **Pirfenidone** (Esbriet): anti-inflammatory و antioxidant و antifibrotic، mechanism مش واضح؛ بيبطّأ (وأحيانًا يوقف) نزول الـ FVC ويحسّن progression-free survival.
      - kind: aside
        tone: exam
        page: 186
        quote: "Guidelines (2015) recommend AGAINST the use of combination prednisone, azathioprine, and N-acetylcysteine.(because this combination increases mortality"
        text: "سؤال امتحان كلاسيك: الـ IPF ممنوع فيه steroid monotherapy (مفيش survival benefit)، وممنوع الـ triple combination (prednisone + azathioprine + NAC) لأنها بتزوّد الـ mortality. ولو هتدّي steroid لأي سبب، استبعد latent TB الأول."
      - kind: check
        page: 186
        quote: "1) Partial pressure of oxygen [PaO] < 55 mmHg. 2) Oxygen saturation by pulse oximetry [SpO] < 88%."
        question: "When should oxygen be given in pulmonary fibrosis, and to what target?"
        options: ["PaO2 < 55 or SpO2 < 88%; keep saturation ≥ 90%", "SpO2 < 94%; keep saturation ≥ 98%", "Only during sleep", "Only if PaCO2 is raised"]
        answer: 0
        why:
          - "صح: at rest أو مع المجهود، والهدف 90% على الأقل في الراحة والنوم والمجهود."
          - "الأرقام دي أعلى من اللي في الكتاب."
          - "الهدف في الراحة والنوم والمجهود."
          - "الكتاب بيعتمد على الـ hypoxemia مش الـ CO2."
      - kind: explain
        page: 187
        quote: "Empiric use of these medications without a specific diagnosis should be discouraged because they have significant toxicities."
        title: "الـ non-idiopathic fibrosis"
        text: |
          - نفس الـ general strategies، وعالج الـ comorbidities: **COPD، OSA، GERD، CAD**.
          - أهم خطوة: ==identify the cause== وعالجه.
          - Oxygen لو PaO2 < 55 أو SpO2 < 88%، والهدف ≥ 90%.
          - Steroids و cytotoxics (cyclophosphamide، azathioprine، methotrexate كـ steroid-sparing) **لتشخيصات محددة بس**. Empiric من غير تشخيص = لأ، لأن الـ toxicity كبيرة.
          - الكتاب (ATS 2022): nintedanib و pirfenidone لسه **مش approved** للـ non-IPF.
