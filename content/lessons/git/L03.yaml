  - id: git.L03.lesson13
    title: "الترجيع والغثيان: CVS و CHS و rumination و CIN"
    hook: "نوبات ترجيع بتيجي وتروح، أو ترجيع بعد كل أكلة بطعمه حلو، أو غثيان كل يوم. كل واحد ليه اسم وعلاج."
    minutes: 9
    pages: [109, 113]
    topics: [nausea-vomiting]
    goals:
      - "تعرف معايير الـ CNVS والـ CHS والـ work-up"
      - "تعالج نوبة الـ CVS وتعرف محاذير الـ triptans"
      - "تفرّق الـ functional vomiting عن الـ rumination، وتعالج الـ CIN"
    status: unverified
    steps:
      - kind: explain
        page: 109
        quote: "B3c. Cannabinoid hyperemesis syndrome (CHS)\nDiagnostic criteria* - Must include all of the following:\n  1. Stereotypical episodic vomiting resembling cyclic vomiting syndrome (CVS) in terms of onset, duration, and frequency\n  2. Presentation after prolonged use of cannabis\n  3. Relief of vomiting episodes by sustained cessation of cannabis use\n*Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis\nSupportive remark\n  May be associated with pathologic bathing behavior (prolonged hot baths or showers)"
        title: "CNVS و CHS"
        text: |
          - **chronic nausea and vomiting syndrome (CNVS):** nausea مزعجة **at least 1 day per week** و/أو vomiting مرة أو أكتر في الأسبوع، بعد استبعاد self-induced vomiting و eating disorders و rumination والـ organic disease.
          - ==CHS== (cannabinoid hyperemesis): vomiting episodic شبه الـ cyclic vomiting syndrome (CVS)، **after prolonged use of cannabis**، و ==relief by sustained cessation==. وممكن معاه **pathologic bathing**: دش سخن طويل.

          والكل بالـ Rome rule: آخر 3 شهور، و onset من 6 شهور.

          التفسير المقبول (مش في الكتاب): ليه الـ hot baths في الـ CHS؟ المريض بيلاحظ إن الميه السخنة بتهدّي الغثيان فبيكررها كتير، فلو سمعت إن مريض ترجيع بياخد حمّامات سخنة طويلة، اسأل عن الـ cannabis علشان الحل الوحيد هو إنه يوقفه.
      - kind: explain
        page: 110
        quote: "It is important to rule out motility disorders of the upper gastrointestinal tract as well as metabolic and central nervous system diseases."
        title: "الـ work-up: بندوّر على إيه؟"
        text: |
          الكتاب: لازم نستبعد الـ **motility disorders** في الجزء العلوي، والأمراض الـ **metabolic** والـ **CNS**.
          - أغلب الخبراء: **upper endoscopy**، و **small bowel X-ray** أو **CT enterography**.
          - تحاليل: **electrolytes**، **serum calcium**، **thyroid function**، ولو فيه داعي **hypoadrenalism (Addison)**.
          - **Gastric emptying** لو متاح. وفي الـ CVS، الـ emptying ممكن يكون ==accelerated== مش delayed في جزء من المرضى.
          - **Mitochondrial diseases** زي **medium chain acyl-coenzyme A dehydrogenase deficiency** ممكن تعمل ترجيع متقطع، غالبًا في الأطفال، بس لو فيه شك تتعمل.

          التفسير المقبول (مش في الكتاب) لكل تحليل: الكالسيوم العالي والـ Addison والغدة كلهم بيعملوا ترجيع ممكن يتعالج بسهولة، والـ endoscopy والـ CT بيستبعدوا الـ obstruction. والسبب إن الـ functional تشخيص بالاستبعاد: لو فوّت Addison، المريض ممكن يدخل crisis.
      - kind: case
        page: 110
        quote: "A triptan such as sumatriptan (a 5HT1 agonist) can be effective for acute migraine and for CVS."
        stem: "A 24-year-old has stereotyped bouts of vomiting lasting days, with well weeks between them. His mother has migraine. He has never used cannabis."
        steps:
          - question: "Gastric emptying is tested. What does the lecture say is found in a subset of CVS patients?"
            options: ["Accelerated emptying", "Delayed emptying in every patient", "Absent emptying (gastric outlet obstruction)", "Emptying is never abnormal"]
            answer: 0
            why: "الكتاب: في الـ CVS الـ gastric emptying ممكن يبقى **accelerated** في subset من المرضى، مش delayed. وطبعًا تعمل endoscopy و electrolytes و calcium و thyroid، وتفكّر في Addison."
          - question: "He presents at the start of a bout. Which drug can abort it?"
            options: ["Sumatriptan", "Metoclopramide long term", "Cannabis", "Loperamide"]
            answer: 0
            why: "الـ **triptan** (5HT1 agonist) بينفع للـ migraine وللـ CVS، خصوصًا مع family history لـ migraine. ولو النوبة جامدة: admission و IV fluids و IV antiemetics."
          - question: "Before giving a triptan, what must you check?"
            options: ["Ischemic heart disease, stroke or uncontrolled hypertension", "Liver enzymes only, before each triptan dose", "A stool culture for an infectious cause", "H. pylori status by a urea breath test"]
            answer: 0
            why: "الـ triptans بتعمل vasoconstriction، فخطر الـ vascular problems في IHD و ischemic stroke و uncontrolled hypertension."
      - kind: reveal
        page: 110
        quote: "Remember triptans have a risk of inducing vascular problems in ischemic heart disease, ischemic stroke and uncontrolled hypertension."
        prompt: "ليه الـ triptan بيفيد في الـ CVS، وليه نخاف منه في مرضى القلب؟"
        answer: |
          الكتاب: في النوبة ممكن المريض يحتاج **admission** و **IV fluids** و **IV antiemetics**. وطريقة تانية: **antimigraine therapy** في أول النوبة، خصوصًا لو فيه migraine في المريض أو العيلة. والـ **sumatriptan (5HT1 agonist)** بينفع للـ migraine وللـ CVS، **subcutaneous** أو **nasal spray** أو بالبق بدري. و ==triptans have a risk of inducing vascular problems== في الـ ischemic heart disease والـ ischemic stroke والـ uncontrolled hypertension.

          التفسير المقبول (مش في الكتاب): الـ CVS والـ migraine قرايب (نوبات، ومستقرة بينهم، وتاريخ عائلي)، فالدوا اللي بيوقف الـ migraine بيوقف الـ CVS. والـ triptan بيشتغل بإنه **يقبّض الأوعية**، وده اللي بيفيد في الصداع، بس نفس التقبيض ممكن يقفل شريان تاجي ضيق أصلًا. ومريض بيرجّع مش هيمسك حباية، علشان كده الحقن والـ spray أحسن.
      - kind: explain
        page: 111
        quote: "Rumination is thought to be an acquired habit. Habit reversal using a breathing technique to halt regurgitation can be easily taught to patients (diaphragmatic breathing) and can be curative."
        title: "Functional vomiting ولا rumination؟"
        text: |
          الـ **functional vomiting** نادر: vomiting **at least once per week** ومش cyclical.

          الـ ==rumination== حاجة تانية خالص: الأكل بيرجع للبُق، والمريض يتفّه أو يمضغه ويبلعه تاني. **no preceding retching** وغالبًا **no nausea**، والطعم ساعات حلو!

          آليتها: **habitual contraction** لعضلات البطن بتعلّي الضغط جوه المعدة فتزق الأكل لفوق. وهي **acquired habit**، علشان كده ==diaphragmatic breathing== ممكن يعالجها خالص.

          ولازم تسأل بلطف عن الـ body image والـ self-induced vomiting، لأن **bulimia** و **anorexia nervosa** محتاجين psychiatrist.
      - kind: sort
        page: 111
        quote: "The patient either spits out the food or re-chews and swallows it. There is no preceding retching and typically no nausea."
        prompt: "Rumination ولا vomiting؟"
        bins: ["Rumination", "Vomiting"]
        cards:
          - { text: "Effortless, with no retching", bin: 0 }
          - { text: "Food often tastes good and is re-swallowed", bin: 0 }
          - { text: "Cured by diaphragmatic breathing", bin: 0 }
          - { text: "Forceful expulsion", bin: 1 }
          - { text: "Preceded by nausea and retching", bin: 1 }
        why: "الـ rumination **effortless** ومن غير nausea، والأكل لسه طازة وطعمه كويس. الـ vomiting قوي، وقبله nausea و retching."
      - kind: explain
        page: 112
        quote: "Maintenance of nutritional status and psychological support are essential."
        title: "علاج الـ functional vomiting، والـ CIN"
        text: |
          الكتاب، الـ **functional vomiting**:
          - العلاج ==remains difficult==.
          - الأساس: الحفاظ على الـ **nutritional status** و **psychological support**.
          - **TCAs** ممكن تتكتب.
          - الـ antiemetics العادية ==usually not effective==.
          - **cognitive and social skills training** ممكن يفيد (بيانات محدودة)، و**self-monitoring** مع كبت الرغبة في الترجيع.

          و ==chronic idiopathic nausea (CIN)==: غثيان كذا مرة في الأسبوع من غير سبب organic. ومختلف عن الـ functional dyspepsia اللي فيها الألم أو أعراض الأكل هي الغالبة مش الغثيان، مع إن مرضى كتير عندهم الاتنين.

          التفسير المقبول (مش في الكتاب): ليه الـ antiemetics مش بتنفع في الـ functional vomiting؟ لأنها بتشتغل على مسارات الترجيع العادية (الـ chemoreceptor zone، المعدة)، والمشكلة هنا في معالجة المخ للإشارة، علشان كده الـ TCAs والعلاج النفسي منطقيين أكتر.
      - kind: explain
        page: 113
        quote: "It is particularly important to exclude gastroesophageal reflux in this setting, which is easily treated but may be overlooked."
        title: "Chronic idiopathic nausea"
        text: |
          الـ ==CIN==: nausea هي العرض الأساسي، **several times per week**، من غير organic cause. مختلفة عن الـ functional dyspepsia (FD) اللي فيها الألم أو أعراض الأكل هي الغالبة.

          - أهم حاجة تستبعد **GERD**: ممكن يكون من غير heartburn خالص، والـ pH testing بيشخّصه.
          - Esophagogastroduodenoscopy (EGD) تستبعد السبب الـ structural، و gastric scintigraphy للـ **gastroparesis**.
          - الـ H. pylori **مش سبب رئيسي** للـ nausea، بس علاجه لو موجود مش غلط.

          العلاج: ابدأ بـ ==domperidone== (antinausea + prokinetic). Metoclopramide بديل بس الـ side effects بتحدّه. Tricyclic antidepressants (TCAs)، prochlorperazine أو promethazine، والـ ondansetron غالي فبيتساب للـ refractory.
      - kind: check
        page: 113
        quote: "A prokinetic drug such as domperidone is worth trying initially; it has antinausea as well as prokinetic properties."
        question: "Chronic idiopathic nausea: normal EGD, normal pH study, no gastroparesis. Which drug does the lecture try first"
        options:
          - "Domperidone"
          - "Ondansetron"
          - "Metoclopramide"
          - "H. pylori eradication"
        answer: 0
        why:
          - "صح: domperidone الأول، لأنه antinausea و prokinetic في نفس الوقت."
          - "الـ serotonin receptor type 3 (5HT3) antagonists غالية، بنسيبها للـ refractory."
          - "بديل، بس الـ side effects بتحدّ استعماله."
          - "الـ H. pylori مش سبب رئيسي للـ nausea."
      - kind: sort
        page: 111
        quote: "There is no preceding retching and typically no nausea."
        prompt: "ده rumination ولا vomiting؟"
        bins: ["Rumination", "Vomiting"]
        cards:
          - { text: "Effortless regurgitation of recent food", bin: 0 }
          - { text: "Food often tastes pleasant and is re-swallowed", bin: 0 }
          - { text: "No retching, typically no nausea", bin: 0 }
          - { text: "Cured by diaphragmatic breathing", bin: 0 }
          - { text: "Forceful expulsion of gastric contents", bin: 1 }
          - { text: "Preceded by nausea and retching", bin: 1 }
        why: "الكتاب: الـ rumination **effortless** ومن غير retching ولا nausea، والأكل طعمه **pleasant** وممكن يتبلع تاني؛ الـ vomiting **forceful**. التفسير المقبول (مش في الكتاب): لو المريض قال «بترجّع»، اسأل: فيه غثيان قبلها؟ بتتعب وانت بترجّع؟ لو لأ، فكّر في rumination لأن علاجها سهل."
      - kind: try
        items: [git.L03.148, git.L03.152, git.L03.157, git.L03.160, git.L03.163]
    recap:
      - "CNVS: غثيان يوم في الأسبوع أو ترجيع مرة؛ استبعد rumination والـ eating disorders. CHS: زي CVS بعد cannabis طويل، وبيروح بإيقافه، وحمّامات سخنة."
      - "Work-up: endoscopy، small bowel أو CT enterography، electrolytes و calcium و thyroid و Addison، gastric emptying (ممكن accelerated في CVS)."
      - "نوبة CVS: IV fluids و antiemetics، أو sumatriptan بدري؛ خطر على القلب والـ stroke والضغط."
      - "Rumination: regurgitation من غير retching ولا nausea، طعمه حلو؛ diaphragmatic breathing. Functional vomiting: نادر، TCAs، الـ antiemetics مش بتنفع."
      - "CIN: استبعد الـ reflux (pH) والـ gastroparesis؛ domperidone الأول، TCAs، ondansetron للـ refractory."
