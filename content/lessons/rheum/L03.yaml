      - kind: check
        page: 60
        quote: "Interference with IgE/Fc-8 R1 signalling:omalizumab that selectively binds to circulating IgE."
        question: "A patient with severe allergic asthma and a high IgE is started on omalizumab. How does it work?"
        options: ["It binds circulating IgE so it cannot arm mast cells", "It blocks histamine H1 receptors", "It inhibits 5-lipoxygenase", "It desensitises by rising allergen doses"]
        answer: 0
        why:
