  # ---------- p11: treatment of MEN 2 ----------
  - id: endo.L01.074
    kind: card
    topic: men2-treatment
    front: Consensus on thyroidectomy for children carrying the MEN 2 mutant gene?
    back: Early thyroidectomy with central lymph node dissection soon after the syndrome is identified.
    src: { page: 11, quote: "Early thyroidectomy for MTC. A general consensus to do this operation in children who carry the mutant gene and central lymph node dissection performed soon after identification of the syndrome." }
    status: unverified
    tags: [high-yield]
    update:
      text: "Timing now follows the mutation's risk class: highest risk (codon 918, MEN 2B) thyroidectomy in the first year of life; high risk (codon 634) at or before age 5, guided by calcitonin; moderate risk when calcitonin starts to rise, with calcitonin and neck ultrasound checks from age 5 until then. In high-risk children, central neck dissection only if calcitonin is above 40 pg/mL or nodes are suspected, to protect the parathyroids. In the exam give the book's answer."
      ref: "ATA revised guidelines for the management of medullary thyroid carcinoma (Wells et al., Thyroid 2015)"
  - id: endo.L01.075
    kind: cloze
    topic: men2-treatment
    text: In adults with MTC larger than {{c1::1 cm}}, regional nodal metastases are common ({{c2::more than 75%}}), so the operation is {{c3::total thyroidectomy with central lymph node dissection}}.
    src: { page: 11, quote: "In adults with MTC > 1 cm in size metastases to the regional lymph nodes are common (> 75%), total thyroidectomy with central lymph node dissection." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.076
    kind: card
    topic: men2-treatment
    front: Role of external irradiation and chemotherapy in extensive MTC?
    back: Irradiation may prevent local recurrence or shrink the tumour but is not curative; adriamycin, vincristine, cyclophosphamide and dacarbazine may palliate.
    src: { page: 11, quote: "In patients with extensive local metastases, external irradiation may prevent local recurrence or reduce tumor mass but not curative.\nChemotherapy with combination of Adriamycin, vincristine, cyclophosphamide, and dacarbazine may provide palliation." }
    status: unverified
    update:
      text: "For progressive or symptomatic metastatic MTC, kinase inhibitors replaced cytotoxic chemotherapy: vandetanib (FDA 2011) or cabozantinib (FDA 2012), and the selective inhibitor selpercatinib (FDA 2020) for tumours with a mutation in the MEN 2 gene. In the exam give the book's answer."
      ref: "ATA revised guidelines for the management of medullary thyroid carcinoma (Wells et al., Thyroid 2015); FDA approval of selpercatinib 2020"
  - id: endo.L01.077
    kind: card
    topic: men2-treatment
    front: Why do most clinicians remove only the affected adrenal for phaeochromocytoma in MEN 2?
    back: Malignancy is rare (fewer than 15 reported cases); although the other gland often develops phaeochromocytoma within 8–10 years, removing both carries the risk of adrenal insufficiency.
    src: { page: 11, quote: "Pheochromocytoma: In spite of the possibility of malignancy ( < 15 reported cases ), the high probability of developing pheochromocytoma in the apparently unaffected gland over an 8 -10-year period, and the risk of adrenal insufficiency, yet most clinicians recommend removal of the affected gland." }
    status: unverified
  - id: endo.L01.078
    kind: card
    topic: men2-treatment
    front: What replacement is mandatory after bilateral adrenalectomy?
    back: Both glucocorticoids and mineralocorticoids.
    src: { page: 11, quote: "If both adrenals are removed glucocorticoids and mineralocorticoids replacement are mandatory." }
    status: unverified
  - id: endo.L01.079
    kind: card
    topic: men2-treatment
    front: Advantage and drawback of cortical-sparing adrenalectomy?
    back: It removes the phaeochromocytoma and medulla and avoids steroid replacement, but phaeochromocytoma recurs in a small percentage.
    src: { page: 11, quote: "A cortical sparing adrenalectomy removing the pheochromocytoma and adrenal medulla is successful and eliminates the necessity for steroid hormone replacement, although pheochromocytoma recurs in a small percentage." }
    status: unverified
