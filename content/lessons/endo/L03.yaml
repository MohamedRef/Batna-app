schema: batna.lesson/v1
lecture: endo.L03
lessons:
  # ------------------------------------------------------------------
  - id: endo.L03.lesson1
    title: "الورم اللي بيعمل هرمونات: يعني إيه paraneoplastic؟"
    hook: "خلية سرطان رجعت طفلة، فافتكرت كل حاجة كانت بتعرف تعملها. ومنها هرمونات مش بتاعتها."
    minutes: 8
    pages: [31, 32]
    topics: [definition, pathophysiology]
    goals:
      - "تعرّف الـ PNS وتفرّقه عن الـ mass effect والـ metastasis"
      - "تعرف ليه الخلية السرطانية تقدر تعمل هرمونات مش بتاعتها"
      - "تعرف الميكانيزمات الأربعة والأجهزة اللي بتتأثر"
    status: unverified
    steps:
      - kind: explain
        page: 31
        quote: "Neoplasm is defined as\n  \"Unregulated cell growth producing undifferentiated cells\".\n  This may physiologically occur during embryogenesis or wound repair.\n  But this occurs for a limited time at a specific period."
        title: "الـ neoplasm"
        text: |
          الكتاب بيعرّف الـ ==neoplasm== إنه **unregulated cell growth producing undifferentiated cells**.

          النمو ده بيحصل طبيعي في الـ embryogenesis والـ wound repair، بس **لفترة محدودة**. الخلايا الـ primitive دي شايلة قدرات خلايا كتير متخصصة، زي خلية أمها. علشان كده ممكن تعمل هرمونات.

          فكّر فيها كده: كل خلية في جسمك شايلة **نفس الـ DNA** كله، بس الخلية المتخصصة (رئة مثلًا) قافلة الجينات اللي مش محتاجاها. لما الخلية ترجع **undifferentiated**، الأقفال دي بتفك، فجين زي الـ ACTH أو الـ ADH ممكن يشتغل تاني. يعني الورم مش بيخترع هرمون، هو بيفتكر هرمون كان ناسيه.
      - kind: explain
        page: 31
        quote: "Clinical syndromes involving non metastatic systemic effects that accompany neoplastic diseases"
        title: "الـ PNS"
        text: |
          ==Paraneoplastic syndromes== = **clinical syndromes involving non-metastatic systemic effects** بتصاحب الأورام، وغالبًا جاية من الـ secretory products بتاعة الورم.

          ليه الكلمة المهمة **non-metastatic**؟ لأن المرض بيظهر في مكان **مفيهوش** ورم خالص: الكالسيوم يعلى من غير ما العضم يكون فيه metastasis، أو الصوديوم يقع والمخ سليم. يعني الورم بيأذي من بعيد بحاجة بيفرزها في الدم. وده بيخلّي الـ PNS أحيانًا **أول علامة** للورم قبل ما يبان.
      - kind: sort
        page: 31
        quote: "Clinical picture of neoplastic disease\n  1) Mass effect Obstruction, invasion or compression.\n  2) Remote effect\n  Metastatic.\n  Non-metastatic (Paraneoplastic synd.)."
        prompt: "صنّف تأثير الورم:"
        bins: ["Mass effect", "Remote effect"]
        cards:
          - { text: "Obstruction", bin: 0 }
          - { text: "Compression", bin: 0 }
          - { text: "Invasion", bin: 0 }
          - { text: "Liver metastases", bin: 1 }
          - { text: "Paraneoplastic hypercalcaemia", bin: 1 }
        why: "الـ mass: obstruction، invasion، compression. الـ remote: metastatic أو non-metastatic (ده الـ PNS)."
      - kind: explain
        page: 32
        quote: "3) Psychic effect\n  Loneliness, acceptance, fear of pain or loss of control."
        title: "التأثير التالت: psychic"
        text: |
          غير الـ mass والـ remote، الكتاب بيعدّ تأثير تالت: ==psychic effect==.

          - **Loneliness**، **acceptance**، **fear of pain**، أو **loss of control**.

          يعني المريض محتاج حد يسمعه، مش بس تحاليل. وليه الكتاب حاطه جوه الـ clinical picture؟ لأن الخوف والوحدة بيأثروا على الأكل والنوم والالتزام بالعلاج، فهما جزء من المرض اللي بنعالجه فعلًا.
      - kind: explain
        remind: [endo.L03.007]
        page: 32
        quote: "Pathophysiology of Paraneoplasic Syndromes\n  1) Production of antibodies against neoplastic tissue that cross react with normal body tissue like CNS.\n  2) Production of physiologically active products like hormones, hormone precursors, enzymes, cytokines and fetal proteins.\n  3) Interference with metabolic pathway of steroid hormones.\n  4) Unknown."
        title: "بيحصل إزاي؟"
        text: |
          1. ==Antibodies== ضد الورم بتعمل cross-react مع أنسجة طبيعية زي الـ central nervous system (CNS).
          2. ==Physiologically active products==: hormones، precursors، enzymes، cytokines، fetal proteins.
          3. Interference مع الـ steroid metabolism.
          4. Unknown.

          وبيمس أجهزة كتير: endocrine، CNS، hematologic، skin، renal، gastrointestinal tract (GIT)، rheumatologic، neuromuscular، و non-specific.

          ليه الـ antibodies بتضرب الـ CNS؟ التفسير المقبول (مش في الكتاب): الورم بيطلّع على سطحه بروتينات شبه بروتينات الأعصاب، فالمناعة تعمل antibodies ضد الورم، والـ antibodies دي متعرفش تفرّق، فتضرب الأعصاب كمان. وليه الأجهزة كتير كده؟ لأن الـ products نفسها كتير (hormones، cytokines، enzymes)، وكل واحد له عضو بيشتغل عليه.
      - kind: figure
        page: 31
        quote: "Clinical picture of neoplastic disease\n  1) Mass effect Obstruction, invasion or compression.\n  2) Remote effect\n  Metastatic.\n  Non-metastatic (Paraneoplastic synd.)."
        title: "الورم بيأذي بتلات طرق"
        alt: "A tree. Neoplastic disease branches into mass effect (obstruction, invasion, compression), remote effect (metastatic, and non-metastatic which is the paraneoplastic syndrome) and psychic effect (loneliness, acceptance, fear of pain, loss of control)."
        caption: "الـ PNS هو الفرع الـ remote اللي من غير metastasis."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <rect x="95" y="8" width="140" height="30" rx="8" class="fg-box"/>
            <text x="165" y="28" text-anchor="middle" class="t-sm t-b">Neoplastic disease</text>
            <path d="M120 38L55 70M165 38V70M210 38L275 70" class="fg-arrow"/>
            <rect x="5" y="72" width="100" height="74" rx="8" class="fg-box"/>
            <text x="55" y="92" text-anchor="middle" class="t-sm t-b">Mass</text>
            <text x="55" y="110" text-anchor="middle" class="t-sm">obstruction</text>
            <text x="55" y="124" text-anchor="middle" class="t-sm">invasion</text>
            <text x="55" y="138" text-anchor="middle" class="t-sm">compression</text>
            <rect x="115" y="72" width="100" height="74" rx="8" class="fg-acc"/>
            <text x="165" y="92" text-anchor="middle" class="t-sm t-b">Remote</text>
            <text x="165" y="110" text-anchor="middle" class="t-sm">metastatic</text>
            <text x="165" y="128" text-anchor="middle" class="t-sm t-b t-acc">non-metastatic</text>
            <text x="165" y="142" text-anchor="middle" class="t-sm t-acc">= PNS</text>
            <rect x="225" y="72" width="100" height="74" rx="8" class="fg-box"/>
            <text x="275" y="92" text-anchor="middle" class="t-sm t-b">Psychic</text>
            <text x="275" y="110" text-anchor="middle" class="t-sm">loneliness</text>
            <text x="275" y="124" text-anchor="middle" class="t-sm">fear of pain</text>
            <text x="275" y="138" text-anchor="middle" class="t-sm">loss of control</text>
            <text x="10" y="180" class="t-sm">PNS mechanisms: antibodies (cross-react with CNS),</text>
            <text x="10" y="198" class="t-sm">active products (hormones, enzymes, cytokines),</text>
            <text x="10" y="216" class="t-sm">steroid-pathway interference, unknown</text>
          </svg>
      - kind: check
        page: 31
        quote: "Clinical syndromes involving non metastatic systemic effects that accompany neoplastic diseases"
        question: "Which describes a paraneoplastic syndrome?"
        options: ["A non-metastatic systemic effect of a tumour, often from its secretions", "Bone pain from a skeletal metastasis", "Jaundice from a tumour compressing the bile duct", "Anxiety about the diagnosis"]
        answer: 0
        why:
          - "صح: non-metastatic systemic effect، غالبًا من الـ secretory products."
          - "دي metastasis، remote بس مش paraneoplastic."
          - "ده mass effect (compression)."
          - "ده الـ psychic effect."
      - kind: try
        items: [endo.L03.001, endo.L03.003, endo.L03.004, endo.L03.006, endo.L03.007]
    recap:
      - "Neoplasm = unregulated growth of undifferentiated cells؛ بتفتكر جينات كانت مقفولة."
      - "PNS = non-metastatic systemic effects، غالبًا من secretory products."
      - "الورم بيأذي بـ mass، remote (metastatic أو PNS)، و psychic."
      - "Mechanisms: antibodies، active products، steroid pathway، unknown؛ أجهزة كتير."
    practice: [endo.L03.001, endo.L03.002, endo.L03.003, endo.L03.004, endo.L03.005, endo.L03.078, endo.L03.006, endo.L03.007, endo.L03.055]
