  - id: geri.L09.040
    kind: card
    topic: covid
    front: How does SARS-CoV-2 enter human cells?
    back: Its spike (S) protein binds angiotensin-converting enzyme 2 (ACE2); entry needs priming of S by transmembrane serine protease 2 (TMPRSS2), a human serine protease.
    src: { page: 163, quote: "The innate immune response is the first level of response in the detection and clearance of a viral infection. In SARS-CoV-2, the spike protein (S) mediates the attachment, fusion, and entry of the virus in human cells (99). The protein S strongly binds to angiotensinconverting enzyme 2 receptor leading to the attachment of the virus to the host cell (99). The successful entry needs the priming of the S protein by TMPRSS2, a human cellular serine protease (100). Once in the host cell, SARS-CoV-2 can be detected by macrophages, which or chest rate the production of a pro-inflammatory microenvironment that inhibits viral replication, stimulates adaptive immunity." }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.041
    kind: card
    topic: covid
    front: Why may the elderly develop worse COVID-19 inflammation?
    back: Elderly lung macrophages may produce more IL-6 and other pro-inflammatory cytokines.
    src: { page: 163, quote: "Macrophages from elderly lungs may have a more pronounced production of IL-6 and other pro-inflammatory cytokines in response to stimuli (101). It is possible that IL-6 has a critical role in the immune response of the elderly that mounts against SARS- COV-2. Patients with severe COVID-19 have a higher IL-6/Interferon-γ ratio than those who present with a moderate disease, which could be related to the cytokine storm leading to lung injury (104–107). Indeed, patients with severe COVID-19 frequently have lower absolute numbers of Interferon-γ producing CD4+ T cells compared to patients with moderate disease (108). Then, when patients with COVID-19 enter the immune dysregulation phase, the increase in IL-6 leads to a relative immunoparalysis that may impair the clearance of SARS-Cov-2 (98)." }
    status: unverified
