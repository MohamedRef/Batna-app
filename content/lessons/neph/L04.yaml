  - id: neph.L04.lesson3
    title: "الكلى والضغط، والعلاج خطوة خطوة"
    hook: "الكلى بترفع الضغط والضغط بيبوّظ الكلى. نكسر الدايرة دي إزاي؟"
    minutes: 10
    pages: [87, 91]
    topics: [renal-ht, treatment]
    goals:
      - "تعرف أرقام الـ renoparenchymal HT وآلياته"
      - "تحفظ الـ lifestyle table والـ targets"
      - "تختار أول دوا وتصعّد بـ A، C، D"
    status: unverified
    steps:
      - kind: table
        page: 87
        quote: "60% of CKD Stage III (GFR 30-59 mL / min) are hypertensive >80% CKD stage IV – V are hypertensive"
        title: "Renoparenchymal HT بالأرقام"
        columns: [Group, Number]
        rows:
          - ["CKD stage III hypertensive", "60%"]
          - ["CKD stage IV–V hypertensive", ">80%"]
          - ["Hypertensive CKD uncontrolled", "70%"]
          - ["HD patients hypertensive", "86%"]
          - ["HD patients controlled", "Only 30%"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
      - kind: explain
        page: 87
        title: "إزاي الكلى بترفع الضغط"
        quote: "one reason to sodium sensitivity could result from renal TIN ischemia which needs a high pressure for natriuresis."
        text: |
          ==Proteinuria== أقوى predictor للـ HT وللـ poor control.

          1. **Low nephron number** من الحمل ← Na و volume homeostasis أضعف.
          2. **Salt و water:** الـ **TIN ischemia** محتاجة ضغط أعلى علشان تطلّع الصوديوم (**pressure natriuresis**).
          3. **SNS:** ↑renin، ↓Na excretion، ↓RBF ← renal damage و salt-sensitive HT. العلاج: renal denervation، nephrectomy، ACEi و ARBs. و ==renalase== (من الكلى) بيكسّر الـ catecholamines.
      - kind: figure
        page: 88
        quote: "Renal damage → ↑ ACE expression → ↑ATII → renal damage + SSHT"
        title: "دايرة الـ RAAS في الكلى"
        alt: "A cycle: renal damage leads to increased ACE expression, then increased angiotensin II, which causes sodium reabsorption, arteriolar vasoconstriction and aldosterone secretion, leading back to more renal damage and salt-sensitive hypertension."
        caption: "الـ renin من الـ **JG cells** في الـ afferent arteriole. الـ AT II: ↑Na reabsorption، vasoconstriction، aldosterone. والدايرة تقفل: damage ← ↑ACE ← ↑AT II ← damage أكتر."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L04a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker></defs>
            <rect x="105" y="12" width="120" height="40" rx="10" class="fg-bad"/>
            <text x="165" y="37" text-anchor="middle" class="t-sm t-b">Renal damage</text>
            <rect x="220" y="120" width="104" height="40" rx="10" class="fg-acc"/>
            <text x="272" y="145" text-anchor="middle" class="t-sm t-b">↑ ACE</text>
            <rect x="105" y="236" width="120" height="40" rx="10" class="fg-acc"/>
            <text x="165" y="261" text-anchor="middle" class="t-sm t-b">↑ Angiotensin II</text>
            <rect x="6" y="110" width="110" height="60" rx="10" class="fg-box"/>
            <text x="61" y="130" text-anchor="middle" class="t-sm">↑ Na reabsorption</text>
            <text x="61" y="146" text-anchor="middle" class="t-sm">vasoconstriction</text>
            <text x="61" y="162" text-anchor="middle" class="t-sm">aldosterone</text>
