        title: "الـ biopsy والـ typing"
        quote: "‑ Light Chain Renal / Amyloidosis; AL- Lambda Type. ‑ Mild Arteriosclerosis."
        text: |
          - **LM**: mesangial deposits **homogeneous pink** و ==weak periodic acid–Schiff (PAS)==.
          - **Congo red** موجب تحت الـ **polarized light**.
          - **Immunophenotyping**: AA سلبي، **lambda 4+**.

          التشخيص: ==AL amyloidosis, lambda==. والـ bone marrow طلع **B-cell non-Hodgkin lymphoma (NHL)**، والـ monoclonal gammopathy (MG) مع الـ B-NHL association معروف.

          ليه كل test؟ التفسير المقبول (مش في الكتاب):
          - **weak PAS**: الـ amyloid مش matrix عادي، فما بيتصبغش بالـ PAS زي الـ sclerosis أو الـ diabetic nodules. ده أول ما يخليك تشك.
          - **Congo red + polarized light**: الـ amyloid ألياف متطبقة بشكل beta-sheet، فبتلمع **apple-green**؛ ده التشخيص.
          - **Typing**: لازم تعرف **نوع** البروتين، لأن العلاج مختلف تمامًا: AL يتعالج بعلاج الـ clone (chemo)، AA يتعالج بعلاج الالتهاب المزمن.
          - **Bone marrow**: الـ lambda المترسب جاي من clone، فلازم تدور عليه؛ وهنا طلع B-cell lymphoma.
