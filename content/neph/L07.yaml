    pass: 3
    hook: "AML الكلية في TSC نتدخل لو «كبير، بيوجع، بينزف، أو مش متأكدين إنه مش RCC» = large size (aneurysms فوق 5 cm)، pain، hemorrhage، أو inability to exclude RCC (وساعتها nephron-sparing surgery)."
    src: { page: 175, quote: "Renal AMLs are generally benign and require no treatment. Larger AMLs frequently develop micro- and macro-aneurysms, and the risk for serious hemorrhage correlates with aneurysms over 5-cm in diam-eter.24 Therefore these large AMLs require preemptive treatment with either nephron-sparing surgery or embolization. In addition to size and complications such as pain or hemorrhage, the inability to exclude an associated RCC should prompt intervention. When an associated malignancy cannot be excluded, nephron- sparing surgery, such as enucleation or partial nephrectomy is preferred. Female sex hormones may accelerate AML growth. Therefore it is prudent to caution women with multiple AMLs about the potential risks of pregnancy and estrogen administration." }
