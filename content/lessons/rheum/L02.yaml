  - id: rheum.L02.lesson6
    title: "شيل البنزين: الـ ULT"
    hook: "الـ colchicine بيطفي النار. الـ allopurinol بيشيل البنزين. ولو نسيت الـ prophylaxis، النار هتولع تاني وانت بتشيله."
    minutes: 10
    pages: [42, 44]
    topics: [ult]
    goals:
      - "تعرف إمتى تبدأ ULT، وليه كل indication"
      - "تبدأ الـ prophylaxis صح وتحفظ مدته"
      - "تفرّق allopurinol عن febuxostat عن pegloticase"
    status: unverified
    steps:
      - kind: explain
        page: 42
        quote: "Any patient with established diagnosis of gouty arthritis and:\n  Tophi by clinical exam or imaging study.\n  Frequent attacks of gouty arthritis (22 attacks/yr).\n  CKD stage 2 or worse.\n  Past urolithiasis."
        title: "إمتى الـ ULT؟"
        text: |
          أي مريض gout مؤكد ومعاه واحدة من:

          - ==Tophi== (فحص أو imaging).
          - **2 نوبات أو أكتر في السنة**.
          - **Chronic kidney disease (CKD) stage 2 or worse**.
          - **Past urolithiasis**.

          التفسير المقبول (مش في الكتاب): ليه الأربعة دول؟ كلهم علامة إن البلورات بقت كتير أو إن الضرر بدأ: الـ tophi يعني مخزون كبير، والنوبات المتكررة يعني الترسيب مستمر، والـ CKD والحصوات يعني الكلى نفسها بتتأذي من الـ urate. يعني مستنيتش الضرر يكبر، وبتنزّل الـ urate عشان البلورات تدوب.
      - kind: explain
        page: 42
        quote: "Frequent attacks of gouty arthritis (22 attacks/yr)."
        title: "ليه الأربعة دول بالذات؟"
        text: |
          التفسير المقبول (مش في الكتاب): كل indication من الأربعة معناه إن **الـ urate pool كبير وبيعمل ضرر**، مش مجرد رقم في التحليل:

          - **Tophi**: البلورات بقت كتلة بتتشاف، يعني الـ pool مليان.
          - **نوبتين أو أكتر في السنة**: البلورات كتير لدرجة إنها بتتقلقل كل شوية.
          - **CKD stage 2 أو أسوأ**: الكلى مش بتطلّع urate كويس، والـ urate نفسه ممكن يأذيها أكتر (chronic urate nephropathy).
          - **Past urolithiasis**: الحصوة هتتكرر طول ما الـ urate عالي.

          وفي الأربعة: المريض لازم يكون عنده ==established gouty arthritis==. الـ urate العالي لوحده مش indication (صفحة 45).
      - kind: update
        page: 42
        quote: "Any patient with established diagnosis of gouty arthritis and:\n  Tophi by clinical exam or imaging study.\n  Frequent attacks of gouty arthritis (22 attacks/yr).\n  CKD stage 2 or worse.\n  Past urolithiasis."
        text: "American College of Rheumatology (ACR) 2020: Urate-lowering therapy (ULT) بقوة لو فيه tophus أو أكتر، أو radiographic damage، أو نوبتين في السنة؛ وبشكل conditional بعد أول نوبة لو CKD 3 أو أكتر، أو urate فوق 9 mg/dL، أو حصوات. الامتحان: إجابة الكتاب."
        ref: "ACR Gout Guideline, 2020"
      - kind: explain
        page: 42
        quote: "If pharmacologic ULT is indicated\n  Start acute gout prophylaxis before ULT\n    Medication choices\n      Low dose Colchicine: 0.6mg once or twice a day."
        title: "الـ prophylaxis الأول"
        text: |
          الـ urate لما ينزل فجأة البلورات بتتقلقل ← flares. عشان كده ==ابدأ prophylaxis قبل الـ ULT==:

          - First line: **colchicine 0.6 mg** مرة أو مرتين، أو **non-steroidal anti-inflammatory drugs (NSAID) low dose + proton pump inhibitor (PPI)** (naproxen 250 mg).
          - Second line: **prednisolone 5-10 mg/day**.

          المدة: **ACR 2012**: 3 شهور من غير tophi، 6 مع tophi. **European League Against Rheumatism (EULAR) 2016**: 6 شهور للكل.
      - kind: reveal
        page: 42
        quote: "3 months if no tophi, 6 months in presence of tophi (ACR 2012)."
        prompt: "ليه الـ prophylaxis أطول لو فيه tophi؟"
        answer: |
          التفسير المقبول (مش في الكتاب): لما الـ ULT ينزّل الـ urate، البلورات الموجودة **بتبدأ تدوب وتتقلقل**، وده بيعمل نوبات في الأول.

          الـ tophi معناها بلورات أكتر بكتير، فبتاخد وقت أطول لحد ما تخلص، وفترة النوبات بتطول. عشان كده **6 شهور مع tophi و 3 من غيرها** (ACR 2012)، والـ EULAR 2016 اختصرها وقال 6 للكل.
      - kind: check
        page: 42
        quote: "Duration of prophylaxis:\n  3 months if no tophi, 6 months in presence of tophi (ACR 2012).\n  6 months for all (EULAR 2016)."
        question: "A patient with tophi starts allopurinol. How long is flare prophylaxis per ACR 2012?"
        options: ["6 months", "3 months", "2 weeks", "Until the first normal urate"]
        answer: 0
        why:
          - "صح: 6 شهور لو فيه tophi (و EULAR 2016: 6 شهور للكل)."
          - "3 شهور لو مفيش tophi."
          - "قصير جدًا."
          - "المدة بالشهور مش بالمعمل."
      - kind: explain
        page: 43
        quote: "Start low and go slow: 100mg/d for healthy patients.\n50mg/d in pts with CKD (stage 4 or more).\nTitrate/2-4 weeks."
        title: "الـ allopurinol"
        text: |
          - **Target**: ==urate أقل من 6 mg/dL== (أو أقل من 5 لو محتاج تحسن أكتر).
          - Xanthine oxidase inhibitor (XOI) بيشتغل على الـ under-excreters والـ over-producers.
          - **Start low, go slow**: 100 mg/d، و **50 mg/d في CKD 4 أو أكتر**، وزوّد كل 2-4 أسابيع.
          - **ماتوقفوش في النوبة**.
          - الـ ACR: مقبول تبدأه أثناء النوبة لو المريض بيستجيب للـ anti-inflammatory.
          - Lifelong.

          التفسير المقبول (مش في الكتاب): ليه start low, go slow؟ عشان أي نزول سريع في الـ urate بيخلي البلورات المترسبة تتقلقل وتطلع للمفصل، فتعمل نوبة. وكمان الجرعة الصغيرة في الـ CKD سببها إن الكلى هي اللي بتطلّع الـ allopurinol، فلو ضعيفة الدوا يتراكم. وماتوقفوش في النوبة عشان التغيير في مستوى الـ urate (طلوع أو نزول) هو اللي بيشعللها.
      - kind: explain
        page: 43
        quote: "XOI Effective for both underexcreters and overproducers of UA."
        title: "ليه الـ allopurinol بينفع الكل؟"
        text: |
          الـ allopurinol **XOI**، يعني بيقفل الـ xanthine oxidase، وده الإنزيم اللي بيعمل آخر خطوتين في تصنيع الـ uric acid (صفحة 25).

          فمهما كان سبب الـ hyperuricaemia، لو قفلت **المصنع** الـ urate هينزل:
          - الـ **overproducer**: المصنع شغال زيادة، وإنت قفلته.
          - الـ **under-excretor**: البلاعة ضيقة، بس إنت قللت اللي داخل الحوض.

          عشان كده هو ==first choice== في أغلب الـ guidelines. و **start low, go slow** (100 mg، و 50 في CKD 4) عشان التفسير المقبول (مش في الكتاب): النزول الفجائي للـ urate بيقلقل البلورات ويعمل نوبات، والكلى الضعيفة بتراكم الدوا.
      - kind: aside
        tone: trap
        page: 43
        quote: "Select first line ULT agent:\n  Xanthine Oxidase Inhibitors (XOI): Allopurinol OR Feboxustat\n  If at least one XOI is contraindicated or not tolerated, Alternative first line ULT: Uricosurics\nULT:\n  May prolong the acute attack or lead to rebound flares if started during attack.\n  Should be started only 2 weeks after attack is well-controlled and with concomittent prophylactic therapy.\n  Is a life-long treatment."
        text: "الكتاب في نفس الصفحة فيه رأيين: الرسمة بتقول ابدأ بعد النوبة بأسبوعين، والنص بيقول الـ ACR بيسمح أثناء النوبة. لو السؤال قال «ACR»: أثناء النوبة مقبول. والاتنين متفقين: لو المريض واخده، ماتوقفوش."
      - kind: table
        page: 44
        quote: "FDA-approved 1966 FDA-approved 2009 Purine-selective XO Inhibitor Non-Purine Selective XO Inhibitor Dose: 100-800 mg Dose: 40-80 mg Renal Metabolism Dose adj. in mild to mod. Liver Metabolism Dose adj. in mild to mod."
        title: "Allopurinol ضد febuxostat"
        columns: ["", "Allopurinol", "Febuxostat"]
        rows:
          - ["FDA", "1966", "2009"]
          - ["Type", "Purine-selective", "Non-purine selective"]
          - ["Dose", "100-800 mg", "40-80 mg"]
          - ["Metabolism", "Renal", "Liver"]
          - ["Adjust in mild-mod CKD", "Yes", "No"]
        hide: [[3, 2], [4, 2]]
      - kind: explain
        page: 44
        quote: "Febuxostat is an excellent alternative for patients with renal insufficiency"
        title: "ليه febuxostat للكلى الضعيفة؟"
        text: |
          الجدول بيجاوب: الـ allopurinol **renal metabolism** ومحتاج تعديل جرعة في الـ CKD الخفيف والمتوسط. الـ febuxostat **liver metabolism** ومش محتاج تعديل في الـ CKD الخفيف والمتوسط.

          النتيجة: الكتاب بيقول febuxostat ==excellent alternative== في الـ renal insufficiency.

          وفرق تاني في الجدول: الـ allopurinol **purine-selective** (شكله شبه الـ purines)، والـ febuxostat **non-purine selective**. والاتنين XOI، فالاتنين ممنوعين مع الـ azathioprine (صفحة 30).
      - kind: explain
        page: 44
        quote: "Antigenic, with a risk of anaphylaxis, so: premedication with antihistamine and corticosteroids is recommended."
        title: "الـ pegloticase"
        text: |
          - للـ ==refractory gout== (USA 2010، Europe 2013)، **8 mg IV كل أسبوعين**.
          - بينزّل الـ urate جامد ويدوّب الـ tophi بسرعة.
          - بس: **antigenic** وفيه **anaphylaxis** ← premedication بـ antihistamine و steroid. وفيه قلق **cardiovascular** (حذر في الـ heart failure).
          - استخدامه محدود: قليلين بس refractory فعلًا، وغالي.

          التفسير المقبول (مش في الكتاب): ليه antigenic؟ الـ pegloticase إنزيم (uricase) من مصدر مش بشري، والإنسان أصلًا مافيهوش الإنزيم ده، فالجهاز المناعي بيشوفه غريب ويعمل antibodies. يعني ممكن anaphylaxis، والـ antibodies كمان بتبطّل مفعوله. وعشان كده premedication وبيتحجز للحالات الـ refractory بس.
      - kind: sort
        page: 44
        quote: "Treatment objectives\n| Phase | Objective |\n|---|---|\n| Asymptomatic Phase | Prevent the 1st Attack |\n| ACUTE GOUT | Terminate The Attack |\n| INTERVAL GOUT and CHRONIC GOUT | Prevent recurrent attacks; Prevent/reverse complications; Lower serum uric acid to target |"
        prompt: "Treatment objectives: حط كل هدف في مرحلته"
        bins: ["Asymptomatic", "Acute", "Interval / chronic"]
