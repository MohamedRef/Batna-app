  - id: neph.L08.lesson5
    title: "C3 و amyloid والـ fibrils"
    hook: "مفيش مرض اسمه mesangioproliferative GN. وكل fibril ليه مقاس بالنانومتر."
    minutes: 10
    pages: [249, 264]
    topics: [c3g, amyloid, integration]
    goals:
      - "تعرف ليه الـ LM لوحده بيضيّع التشخيص (case 7)"
      - "تقسّم الـ amyloid وتعرف خطوات الـ typing"
      - "تفرّق الـ organized deposits بالحجم"
    status: unverified
    steps:
      - kind: explain
        page: 250
        title: "Case 7: biopsy من غير IF"
        quote: "Biopsy was examined only by L.M (no IHC or EM) with a diagnosis of Mesangioproliferative GN"
        text: |
          شاب **23 سنة**: edema و HTN و **C3 واطي** من سنتين. اتعمله biopsy اتقرا ==LM بس==، واتكتب «mesangioproliferative GN»، وخد prednisolone 60 mg وبطّله لوحده.

          دلوقتي: creatinine 1.9، **C3 37** (consumed)، **C4 طبيعي**، ANA و ANCA سلبي.
      - kind: check
        page: 251
        quote: "IgA: Negative, IgG: Negative, IgM: Negative, C3: deposits along GBM (3+) and C4: deposits along GBM (1+)"
        question: "Repeat biopsy IF: C3 3+ along the GBM, no IgG, IgA or IgM. Diagnosis?"
        options:
          - "C3 glomerulopathy"
          - "Lupus nephritis"
          - "IgA nephropathy"
          - "Membranous GN"
        answer: 0
        why:
          - "صح: ==C3 لوحده== من غير Ig مع C3 واطي و C4 طبيعي = complement-mediated. وطلع **dense deposit disease**."
          - "الـ lupus بيبقى full-house و C3 و C4 واطيين و ANA موجب."
          - "الـ IgA nephropathy = mesangial IgA."
          - "الـ membranous = granular IgG."
      - kind: aside
        tone: exam
        page: 254
        quote: "There is no disease entity called Mesangioproliferative GN."
        text: |
          الكتاب كاتبها بالخط العريض: ==There is no disease entity called mesangioproliferative GN==. ده **pattern** لازم يتكمّل بـ IF و EM.

          الـ DD بتاعه: **IgA**، **resolving PIGN**، **C3 glomerulopathy**، **Alport**، **lupus class II**، و **podocytopathy** (MCD أو FSGS مش ظاهر في العينة).

          والنتيجة في case 7: الـ creatinine دلوقتي **8.4**.
      - kind: figure
        page: 264
        quote: "In dense deposit disease the capillary walls appear rigid & thickened"
        title: "Dense deposit disease"
