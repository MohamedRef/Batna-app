  kind: mcq
  topic: zscore
  stem: A lab value has a Z-score of −3.4. What should you do?
  options:
  - Investigate it as a potential outlier
  - 'Accept it: it is an ordinary value'
  - Call it unusual but not extreme
  - Drop it from the data without checking
  answer: 0
  why:
  - Under −3 is an extreme observation, which the slide says should be investigated as a potential outlier.
  - Ordinary values lie within ±2.
  - Unusual is between 2 and 3 SD; −3.4 is beyond 3.
  - 'Investigate, not delete: an outlier may be a real value or an error.'
  src:
