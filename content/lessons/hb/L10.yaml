          <text x="165" y="441" text-anchor="middle" class="t-b">Refractory: barbiturate coma</text>
          <text x="165" y="456" text-anchor="middle" class="t-sm">steroids: no mortality benefit</text>
          </svg>
      - kind: update
        page: 179
        ref: "EASL Clinical Practice Guidelines on ALF 2017"
        text: |
          الـ EASL بتستهدف ICP أقل من حوالي 20–25 mmHg، والكتاب نفسه بيبدأ العلاج من **ICP >20**. بس الـ **goal** المكتوب في الكتاب **<40 mmHg**، وده اللي تكتبه في الامتحان.
      - kind: mnemonic
        page: 179
        word: "HHM"
        parts:
          - { key: "H", text: "Head elevated to 20°" }
          - { key: "H", text: "Hyperventilation to a PaCO2 of 25 mmHg" }
          - { key: "M", text: "Mannitol 0.5 g/kg (100–200 mL of 20%) over 10 min, if kidney function is intact" }
        hook: |
          لما الـ ICP يعدّي 20 أو الـ CPP يقع تحت 60، انت هتقول «هممم…» 🤔 وتعمل **HHM**. وافتكر إن الـ **hypertonic saline** لحد Na 145–155 بيقلل خطر الـ intracranial hypertension، ومفيش **straining** ولا suctioning كتير.
      - kind: order
        page: 179
        prompt: "رتّب حماية المخ من الأول للآخر:"
        steps:
          - "Stage 2 HE: admit to ICU, avoid sedatives, image the head"
          - "Stage 3 HE: intubate, ventilate, consider an ICP monitor"
          - "Hypertonic saline to Na 145–155, avoid straining"
          - "ICP > 20 or CPP < 60: head 20°, PaCO2 25, mannitol"
          - "Refractory: barbiturate-induced coma"
        why: "الكتاب بيبني السلّم بالترتيب ده: ICU من stage 2، ventilation و monitor من stage 3، hypertonic saline يقلل الـ risk، و HHM لما الأرقام تعدّي الحد، و barbiturates للـ refractory."
      - kind: check
        page: 179
        question: "Ventilated ALF patient: ICP 28 mmHg, MAP 80 mmHg, creatinine normal. Best immediate measure?"
        options:
          - "Mannitol 0.5 g/kg IV over 10 minutes"
          - "Large-volume hypotonic fluid to raise MAP"
          - "IV hydrocortisone to lower mortality"
          - "Frequent endotracheal suctioning"
        answer: 0
        why:
          - "صح: ICP >20 (والـ CPP = 52 <60) والكلية سليمة = **mannitol** مع head up و hyperventilation."
          - "الـ hypotonic fluids بكميات كبيرة بتزوّد الـ ICP."
          - "الـ glucocorticoids **ineffective** في تقليل الـ mortality."
          - "الـ suctioning بيعمل **straining** ويرفع الـ ICP."
      - kind: explain
        page: 179
        title: "حاجات تعرفها"
        text: |
          **Seizures**:
          - الـ subclinical seizures شائعة في المرضى دول.
          - بس فايدة الـ prophylactic phenytoin **uncertain**.

          **Steroids**:
          - الـ adrenal insufficiency شائع.
          - بس الـ glucocorticoids مش بتقلل الـ mortality.
          - وممكن تقلل الـ overall survival في المرضى اللي الـ MELD بتاعهم عالي.
          - الفايدة الوحيدة: ممكن تقلل احتياج الـ vasopressors.

          **قراءة الـ ICP monitor**:
          - ==Sudden decrease in ICP==: ممكن يكون **brain herniation**، مش تحسّن.
          - **Prolonged ICP أعلى من الـ MAP**: ممكن يكون **brain death**، وده غالبًا contraindication للزرع. ليه؟ لأن الـ CPP بقى صفر أو سالب، يعني مفيش دم بيوصل للمخ.
      - kind: aside
        tone: trap
        page: 180
        text: |
          الـ ICP نزل فجأة من 35 لـ 5؟ متفرحش! 😬 ده مش تحسّن، ده ممكن يكون الـ **herniation**. افحص الحدقات فورًا.
