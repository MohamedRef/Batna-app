      - kind: aside
        tone: analogy
        page: 3
        text: |
          الـ HSC في الكبد الطبيعي زي **أمين المخزن**: قاعد في Disse، ساكت، ماسك مفتاح مخزن الـ vitamin A.

          أول ما الكبد يتعوّر، أمين المخزن يقلب **مقاول**: يبقى **myofibroblast** ويبتدي يصبّ **collagen** في كل حتة، زي جارك اللي بيبني دور زيادة من غير ترخيص. والنتيجة إن الشبابيك (fenestrations) تتسد بالطوب، وده اللي الكتاب بيسميه **capillarization of the sinusoids**.
      - kind: order
        page: 3
        prompt: "رتّب اللي بيحصل من أول الإصابة لحد ما الكبد يفشل في شغله:"
        steps:
          - "Chronic injury with hepatocellular necrosis"
          - "HSCs activate and become myofibroblasts"
          - "Collagen laid down in the space of Disse"
          - "Defenestration of the sinusoidal wall (capillarization)"
          - "Impaired metabolic exchange with hepatocytes"
        why: "الكتاب: **fibrosis follows hepatocellular necrosis**، الـ HSCs بتتنشط وتحط collagen في Disse، ده بيعمل defenestration، وده بيمنع الـ metabolic exchange."
      - kind: reveal
        page: 4
        prompt: "الـ hepatocytes لسه عايشة... طب ليه الكبد بيبقى عنده **hepatic dysfunction**؟"
        answer: |
          سببين في الكتاب:

          - ضياع الـ **fenestrations** والـ **hepatocyte microvilli** (الـ capillarization) بيمنع الـ **metabolic exchange** بين الدم والـ hepatocytes. الخلية موجودة بس مش واصلها حاجة.
          - الدم بيتحوّل بعيد عن النسيج الشغّال (**diversion of portal blood**)، فبيحصل **vascular insufficiency at the center of the regenerative nodules**.
      - kind: explain
        page: 3
        title: "والـ nodules جات منين؟"
        text: |
          موت الخلايا بيطلّع **growth factors** بتشتغل على الـ **surviving hepatocytes** فتعمل **regenerative nodules**.

          الـ fibrosis والـ nodules مع بعض بيبوّظوا الـ architecture، وكده الـ **full cirrhosis** بتكمل.

          ومهم: الـ fibrosis بتبدأ **reversible**، وبتبقى **irreversible** لما تتكوّن **acellular permanent septa**.
      - kind: sort
        page: 3
        prompt: "الـ fibrosis بتبدأ فين؟ حط كل سبب في الـ zone بتاعته:"
        bins: ["Zone 1 (periportal)", "Zone 3"]
        cards:
          - { text: "Viral hepatitis", bin: 0 }
          - { text: "Hemochromatosis", bin: 0 }
          - { text: "Alcoholism", bin: 1 }
          - { text: "Right heart failure", bin: 1 }
        why: "الكتاب: viral hepatitis و hemochromatosis في **zone 1**، و alcoholism و right heart failure في **zone 3**. وسهلة تفتكرها: الـ right heart failure بيرجّع الدم على الـ hepatic veins، يعني على zone 3 اللي حوالين الـ central vein."
      - kind: mnemonic
        page: 2
        word: "MAVS PATCH"
        parts:
          - { key: "M", text: "Metabolic: MASH (ex-NASH), hemochromatosis, Wilson, alpha-1 antitrypsin deficiency, type IV glycogenosis, galactosemia, tyrosinemia" }
          - { key: "A", text: "Alcohol" }
          - { key: "V", text: "Viral hepatitis B, C and D" }
          - { key: "S", text: "Syphilis (tertiary)" }
          - { key: "P", text: "Prolonged cholestasis: PBC, PSC, prolonged extrahepatic cholestasis" }
          - { key: "A", text: "Autoimmune hepatitis" }
          - { key: "T", text: "Toxins and drugs: methotrexate, amiodarone" }
          - { key: "C", text: "Cryptogenic (no cause found)" }
          - { key: "H", text: "Hepatic venous outflow block: Budd-Chiari, SOS (VOD), right heart failure, constrictive pericarditis" }
        hook: |
          تخيّل كبد اسمه **«مافس»** اتقطّع من التليف، فرقّعوه **PATCH**. كل حرف في الرقعة مجموعة أسباب من **Table 1**، والتسعة مع بعض هما الجدول كله.
      - kind: check
        page: 2
        question: "Which of these is listed under **hepatic venous outflow block**?"
        options:
          - "Constrictive pericarditis"
          - "Primary sclerosing cholangitis"
          - "Wilson disease"
          - "Methotrexate"
        answer: 0
        why:
          - "صح: Budd-Chiari، SOS، right heart failure و constrictive pericarditis كلهم بيعطّلوا خروج الدم من الكبد."
          - "دي **prolonged cholestasis** (الـ P في PATCH)."
          - "دي **metabolic** (copper overload)، الـ M."
          - "دي **toxins and drugs**، الـ T."
      - kind: aside
        tone: joke
        text: |
          لو حد سألك في الشفوي «إيه سبب الـ cirrhosis ده؟» وانت مش عارف، فيه إجابة في الكتاب فعلًا: **Cryptogenic**. 😄

          بس خلّيها آخر حاجة تقولها، مش أول حاجة.
      - kind: try
        items: [hb.L01.003, hb.L01.009, hb.L01.008]
    recap:
      - "Cirrhosis = **diffuse fibrosis + regenerative nodules** بتبوّظ الـ architecture، وهي end result لأي chronic injury."
      - "الـ HSCs في Disse بتخزّن vitamin A، ولما تتنشط تبقى myofibroblasts وتحط collagen."
      - "Collagen في Disse → defenestration (capillarization) → الدم مش بيوصل للـ hepatocytes → dysfunction."
      - "Zone 1: viral و hemochromatosis. Zone 3: alcohol و right heart failure."
      - "الأسباب كلها: **MAVS PATCH**."
    practice: [hb.L01.001, hb.L01.002, hb.L01.003, hb.L01.004, hb.L01.005, hb.L01.006, hb.L01.007, hb.L01.008, hb.L01.009, hb.L01.010, hb.L01.101, hb.L01.102, hb.L01.103, hb.L01.104, hb.L01.105, hb.L01.106, hb.L01.108, hb.L01.197]
