  - id: hb.L07.lesson5
    title: "نعالج مين، بإيه، ولحد إمتى؟"
    hook: "رقم 2,000 ورقم 40 ورقم 9: تلات أرقام بيقرروا مين ياخد علاج. وليه الـ lamivudine خسر السباق."
    minutes: 10
    pages: [118, 121]
    topics: [treat-who, drugs]
    goals:
      - "تمشي في الـ who-to-treat algorithm بالأرقام بتاعته"
