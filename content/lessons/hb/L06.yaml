  - id: hb.L06.lesson4
    title: "مين نفحصه وإمتى نحوّله؟"
    hook: "مش هنعمل screening للبلد كلها. الكتاب بيدّيك pathwayين (EASL 2021 و ADA 2025) يوصّلوك للـ hepatologist في الوقت الصح."
