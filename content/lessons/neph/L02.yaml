      - "تشخّص وتعالج أنيميا الـ CKD وتعرف ليه الهدف أقل من الطبيعي"
      - "تفهم الـ CKD-MBD من high لـ low turnover"
      - "تعرف خطوات الـ MBD قبل الغسيل"
    status: unverified
    steps:
      - kind: table
        page: 64
        quote: "Treatment of complications Anemia of CKD Screen annually if GFR 30-60, twice annually if GFR < 30 ml/min/1.73m2 Diagnose if Hb < 13 g/dl in males, < 12 g/dl in females Erythropoiesis stimulating agents (ESAs)"
        title: "أنيميا الـ CKD بالأرقام"
        columns: [Point, Number]
        rows:
          - ["Screen if GFR 30–60", "Once a year"]
          - ["Screen if GFR < 30", "Twice a year"]
