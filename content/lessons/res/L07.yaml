          </svg>
      - kind: explain
        page: 56
        quote: "Importance of NNT\n| CER | EER | RRR | ARR | NNT |\n|---|---|---|---|---|\n| 50% | 25% | 50% | 25% | 4 |\n| 5% | 2.50% | 50% | 2.50% | 40 |\n| 0.05% | 0.025% | 50% | 0.03% | 4000 |"
        title: "ليه الـ RRR لوحده بيخدع؟"
        text: |
          الـ RRR ==does not discriminate== بين أثر absolute ضخم وأثر تافه. بص على 3 أدوية كلهم **RRR = 50%**:

          - CER 50%، experimental event rate (EER) 25%: ARR 25%، **NNT = 4**.
          - CER 5%، EER 2.5%: ARR 2.5%، **NNT = 40**.
          - CER 0.05%، EER 0.025%: ARR 0.025%، **NNT = 4000**.

          نفس الـ 50%، بس التالت محتاج تعالج **4000 واحد** علشان تنفع واحد. القاعدة: ==ARR = RRR × baseline risk==، فكل ما الـ baseline risk يقل، الـ NNT يكبر.
      - kind: aside
        tone: analogy
        page: 55
        quote: "Relative Risk Reduction (RRR):\n  Is the extent to which a treatment reduces a risk, in comparison with patients not receiving the treatment of interest.\n  However does not discriminate between huge absolute treatment effects and trivial ones.\n  RRR = CER - EER / CER"
        text: |
          إعلان: «خصم 50%!» على إيه؟ لو على عربية، ده فرق مهول. لو على باكو لبان، فرقت معاك نص جنيه.

          الـ **RRR** هو الـ «50%» اللي في الإعلان. الـ **ARR** هو الفرق الـ absolute: الفلوس اللي وفّرتها فعلًا. وشركات الأدوية بتحب تكتب الـ RRR بخط كبير.
      - kind: check
        page: 62
        quote: "With respect to the influence of the relative risk reduction (RRR) and baseline risk on the NNT, which scenario results in the lowest NNT?\n  a. A greater RRR and higher base-line risk\n  b. A lower RRR and lower base-line risk\n  c. A lower RRR and higher base-line risk\n  d. A lower RRR regardless of base-line risk\n  e. A greater RRR and lower base-line risk\nAnswer: a"
        question: "Which scenario gives the lowest NNT?"
        options:
          - "Greater RRR and higher baseline risk"
          - "Lower RRR and lower baseline risk"
          - "Lower RRR and higher baseline risk"
          - "Greater RRR and lower baseline risk"
        answer: 0
        why:
          - "صح: ARR = RRR × baseline risk، فالاتنين عاليين يدّوا أكبر ARR وأصغر NNT."
          - "الاتنين واطيين = أصغر ARR = أكبر NNT."
          - "الـ RRR الواطي بيصغّر الـ ARR."
          - "الـ baseline risk الواطي بيصغّر الـ ARR."
      - kind: case
        page: 59
        quote: "| | Got TB | Did not get TB | Total |\n|---|---|---|---|\n| INH | 3 | 42 | 45 |\n| No INH | 9 | 36 | 45 |\n  CER = 9/45 = 20%\n  EER = 3/45 = 6.67%\n  Calculate ARR = 13.33%\n  Calculate RRR = 0.67\n  Calculate NNT = 1 / 13.33 = 7.69"
        stem: "100 أطفال contacts لعيانين tuberculosis (TB). 10 عندهم TB أصلًا. من الـ 90 الباقيين: 45 خدوا isoniazid و 3 منهم جالهم TB، و 45 ماخدوش و 9 منهم جالهم TB."
        steps:
          - question: "What are CER and EER?"
            options: ["CER 20%, EER 6.67%", "CER 6.67%, EER 20%", "CER 9%, EER 3%", "CER 10%, EER 3%"]
            answer: 0
            why: "الـ control هم اللي ماخدوش: 9/45 = 20%. الـ experimental خدوا isoniazid (INH): 3/45 = 6.67%. والـ 10 اللي عندهم TB أصلًا برّه الحسبة."
          - question: "ARR and RRR?"
            options: ["ARR 13.33%, RRR 0.67", "ARR 0.67, RRR 13.33%", "ARR 6.67%, RRR 0.33", "ARR 20%, RRR 0.5"]
            answer: 0
            why: "ARR = 20 - 6.67 = 13.33%. RRR = 13.33 / 20 = 0.67."
          - question: "NNT?"
            options: ["7.5, so treat 8 children", "13, so treat 13 children", "20, so treat 20 children", "3, so treat 3 children"]
            answer: 0
            why: "NNT = 1 / 0.1333 = 7.5 (السلايد كاتب 7.69، وده 1 / 0.13)، والـ NNT دايمًا بيتقرّب لفوق: 8 أطفال علشان نمنع حالة TB واحدة."
      - kind: case
        page: 60
        quote: "| Outcome | Zidovudine | Placebo | Total |\n|---|---|---|---|\n| Infants HIV infected | 13 | 40 | 53 |\n| Non HIV Infected Infants | 167 | 143 | 11 |\n| Total | 180 | 183 | 363 |\nCompute all possible measures of association. Interpret the obtained results:\n  EER = 13 / 180 = 0.07\n  CER = 40 / 183 = 0.22\n  RR = 3.14\n  RRR = 0.22 - 0.07 / 0.22 = 68%\n  ARR = 0.22 - 0.07 = 0.15\n  NNT = 1 / 15% = 100 / 15 = 6"
        stem: "Zidovudine للحوامل: 13 من 180 طفل اتعدوا بالـ human immunodeficiency virus (HIV) في جروب الـ zidovudine، و 40 من 183 في الـ placebo."
        steps:
          - question: "EER and CER?"
            options: ["EER 0.07, CER 0.22", "EER 0.22, CER 0.07", "EER 0.13, CER 0.40", "EER 0.07, CER 0.15"]
            answer: 0
            why: "EER = 13/180 = 0.07. CER = 40/183 = 0.22."
          - question: "RRR and ARR?"
            options: ["RRR 68%, ARR 0.15", "RRR 15%, ARR 0.68", "RRR 32%, ARR 0.15", "RRR 68%, ARR 0.22"]
            answer: 0
            why: "RRR = 0.15 / 0.22 = 68%. ARR = 0.22 - 0.07 = 0.15."
          - question: "The slide prints relative risk (RR) = 3.14 and NNT = 100/15 = 6. What is right?"
            options: ["RR = 0.33; NNT = 7", "RR = 3.14; NNT = 6", "RR = 0.68; NNT = 15", "RR = 3.14; NNT = 7"]
            answer: 0
            why: "الـ 3.14 هي CER/EER، مقلوبة. الـ RR = EER/CER = 0.07/0.22 = حوالي 0.33، يعني الدوا بيحمي. و 100/15 = 6.7، والـ NNT بيتقرّب لفوق: 7."
      - kind: aside
        tone: exam
        page: 63
        quote: "The results of an RCT where the control event rate (CER) was 20% and the treatment event rate (TER) was 10% can be described as:\n  a. RR = 2.0, RRR = 10%, ARR 10%, NNT 20\n  b. RR = 0.5, RRR = 50%, ARR 10%, NNT 10\n  c. RR = 2.0, RRR = 50%, ARR 10%, NNT 10\n  d. RR = 1.0, RRR = 30%, ARR 20%, NNT 20\nAnswer: b"
        text: |
          سؤال شريحة 63 بيتكرر كتير: CER 20%، treatment 10%.

          - **RR** = 10/20 = **0.5** (مش 2.0: الـ RR دايمًا treated على control).
          - **RRR** = 1 - 0.5 = **50%**.
          - **ARR** = 20 - 10 = **10%**.
          - **NNT** = 1/0.10 = **10**.

          لو شفت RR = 2.0 في الاختيارات، ده فخ القسمة بالمقلوب.
      - kind: try
        items: [res.L07.053, res.L07.054, res.L07.057]
    recap:
      - "CER = c/(c+d)، EER = a/(a+b)، RRR = (CER-EER)/CER، ARR = CER-EER، NNT = 1/ARR، وبيتقرّب لفوق."
      - "17% ضد 12%: RRR 29%، ARR 5%، NNT 20."
      - "الـ RRR مابيفرّقش بين أثر ضخم وتافه. ARR = RRR × baseline risk."
      - "INH: CER 20%، EER 6.67%، ARR 13.33%، RRR 0.67، NNT 7.5 (السلايد كاتب 7.69) يعني 8. Zidovudine: الـ RR الصح 0.33 مش 3.14، والـ NNT 7."
