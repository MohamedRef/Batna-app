  - id: res.L12.lesson5
    title: "Information bias: قسنا غلط"
    hook: "أم طفل عنده تشوّه فاكرة كل برشامة خدتها في الحمل، وأم الطفل السليم ناسية. مين الصادقة؟ الاتنين، بس الداتا اتلخبطت."
    minutes: 9
    pages: [39, 46]
    topics: [information]
    goals:
      - "تعرّف الـ information bias ونوعين الـ misclassification"
      - "تعدّ الـ 5 أنواع وتطلّعهم من أمثلة"
      - "تعرف الأنواع التانية في الـ trials"
    status: unverified
    steps:
      - kind: explain
        page: 39
        quote: "II. Information bias\nOften referred to as measurement bias\nOccurs due to poor measurement (classification) of study variables (exposure)Distinguish two basic types of information bias\n1. Non-differential\nMisclassification between groups is approximately equal\n2. Differential\nAmount of misclassification differs between groups"
        title: "Information bias = measurement bias"
        text: "==Information bias== (اسمه كمان measurement bias) بيحصل من **قياس أو تصنيف غلط** للـ study variables (الـ exposure).\n\nنوعين:\n1. **Non-differential**: الـ misclassification **تقريبًا متساوي** بين المجموعات.\n2. **Differential**: كمية الـ misclassification **مختلفة** بين المجموعات."
      - kind: figure
        page: 39
        quote: "II. Information bias\nOften referred to as measurement bias\nOccurs due to poor measurement (classification) of study variables (exposure)Distinguish two basic types of information bias\n1. Non-differential\nMisclassification between groups is approximately equal\n2. Differential\nAmount of misclassification differs between groups"
        title: "Non-differential vs differential"
        alt: "Two pairs of bars for cases and controls. In the non-differential pair, both bars have an equal hatched slice labelled misclassified. In the differential pair, the cases bar has a large misclassified slice and the controls bar a small one."
        caption: "**Non-differential**: الغلط بنفس الحجم في الاتنين. **Differential**: الغلط في مجموعة أكتر من التانية."
        svg: "<svg viewBox=\"0 0 330 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <text x=\"82\" y=\"16\" text-anchor=\"middle\" class=\"t-sm t-b\">Non-differential</text>\n  <text x=\"248\" y=\"16\" text-anchor=\"middle\" class=\"t-sm t-b\">Differential</text>\n  <rect x=\"40\" y=\"30\" width=\"34\" height=\"110\" class=\"fg-box\"/><rect x=\"40\" y=\"30\" width=\"34\" height=\"26\" class=\"fg-bad\"/>\n  <rect x=\"92\" y=\"30\" width=\"34\" height=\"110\" class=\"fg-box\"/><rect x=\"92\" y=\"30\" width=\"34\" height=\"26\" class=\"fg-bad\"/>\n  <rect x=\"206\" y=\"30\" width=\"34\" height=\"110\" class=\"fg-box\"/><rect x=\"206\" y=\"30\" width=\"34\" height=\"62\" class=\"fg-bad\"/>\n  <rect x=\"258\" y=\"30\" width=\"34\" height=\"110\" class=\"fg-box\"/><rect x=\"258\" y=\"30\" width=\"34\" height=\"12\" class=\"fg-bad\"/>\n  <text x=\"57\" y=\"156\" text-anchor=\"middle\" class=\"t-sm\">cases</text><text x=\"109\" y=\"156\" text-anchor=\"middle\" class=\"t-sm\">controls</text>\n  <text x=\"223\" y=\"156\" text-anchor=\"middle\" class=\"t-sm\">cases</text><text x=\"275\" y=\"156\" text-anchor=\"middle\" class=\"t-sm\">controls</text>\n  <rect x=\"120\" y=\"162\" width=\"10\" height=\"8\" class=\"fg-bad\"/><text x=\"134\" y=\"170\" class=\"t-sm t-mut\">misclassified</text>\n</svg>"
      - kind: mnemonic
        page: 40
        quote: "II. Information bias (Measurement OR Misclassification bias)\n1. Instrumentation\n2. Recall bias\n3. Interviewer bias: (eliciting information, recording and interpretation bias)\n4. Prevarication bias\n5. Ascertainment bias"
        word: "IRIPA"
        parts:
          - { key: "I", text: "Instrumentation: the measuring tool changes, isn't validated, or is badly maintained." }
          - { key: "R", text: "Recall bias: cases remember past exposures more than controls." }
          - { key: "I", text: "Interviewer bias: eliciting, recording and interpreting differently." }
          - { key: "P", text: "Prevarication bias: the subject exaggerates or minimizes on purpose." }
          - { key: "A", text: "Ascertainment bias: the outcome is measured by different methods in the two groups." }
        hook: "**IRIPA**: آلة، ذاكرة، محاور، كداب، وطريقة كشف."
        remind: [res.L12.061]
      - kind: explain
        page: 41
        quote: "1. Instrumental bias\nSuch instrumental bias takes place when the measuring instrument (e.g., a measuring device, a survey, interviews/participant observation) that is used in a study changes over time, not tested for validity and reliability, poor maintainance..."
        title: "Instrumental وrecall"
        text: "**1. Instrumental bias**: لما أداة القياس (جهاز، survey، interviews، participant observation):\n- **بتتغير مع الوقت**،\n- أو **مش متجرّبة** للـ validity والـ reliability،\n- أو **صيانتها وحشة**.\n\n**2. ==Recall bias==**: في الـ **case control** والـ **retrospective cohort**، اللي عنده المرض بيفتكر الـ exposures اللي فاتت **أكتر** من الـ controls. المريض بيدوّر على سبب، والسليم مش فارقة معاه."
      - kind: explain
        page: 43
        quote: "3.Interviewer bias:\nIn case control study, cases are asked about exposure in a meticulous way unlike control.\nLeading questions\nRecording of information (if a typical) might differ between cases and control.\nInterpretation of the same information differently in different occasions."
        title: "Interviewer وprevarication وascertainment"
        text: "**3. Interviewer bias**:\n- بيسأل الـ cases عن الـ exposure **بتدقيق**، والـ controls لأ.\n- **Leading questions**.\n- **Recording** مختلف بين الـ cases والـ controls.\n- **Interpretation** لنفس المعلومة بشكل مختلف في مرات مختلفة.\n\n**4. Prevarication bias**: المريض **بيهرب من الحقيقة** بالمبالغة أو التقليل حسب مصلحته: عامل يقلّل أعراضه **عشان ميترفدش**، وغيره يبالغ **عشان التعويض**.\n\n**5. Ascertainment bias**: داتا الـ **outcome** بتتجمع **بطرق مختلفة** في المجموعتين."
        remind: [res.L12.064]
      - kind: sort
        page: 42
        quote: "2.Recall bias:\nIn case control study, and retrospective cohort study Subjects with a disease are more likely to remember past relevant exposures, in comparison to controls"
