          </svg>
      - kind: explain
        page: 229
        title: "الـ bisphosphonate holiday"
        quote: "Women with low or moderate risk should be considered for a bisphosphonate holiday (temporary discontinuation for up to 5years)"
        text: |
          - بعد **5 سنين oral** أو **3 سنين parenteral**: قيّم الـ fracture risk تاني.
          - **High risk**: كمّل بدوا تاني.
          - ==Low or moderate risk==: **bisphosphonate holiday** لحد **5 سنين**.

          ليه؟ لأن الاستخدام أكتر من 5 سنين مربوط بـ **atypical femoral fractures** و **ONJ**. والـ bisphosphonate بيفضل في العضم سنين بعد ما توقفه.
      - kind: reveal
        page: 229
        quote: "A drug holiday is not recommended if stopped vertebral fractures increased (BTM) and BMD decreased to the pre-treatment level within 24 months."
        prompt: "ليه الـ denosumab مفيهوش holiday زي الـ bisphosphonate؟"
        answer: |
          الـ bisphosphonate بيتخزن في العضم ويفضل شغال. الـ denosumab **antibody** بيخلص من الجسم، فلما توقفه الـ osteoclasts ترجع بقوة (rebound):
          - الـ **BTM** يعلى
          - الـ BMD يرجع لـ ==pre-treatment level within 24 months==
          - والـ **vertebral fractures** تزيد

          علشان كده **no drug holiday**، والـ reassessment بعد **5 to 10 years**.
      - kind: check
        page: 231
        quote: "In postmenopausal women with low or moderate fracture risk, oral bisphosphonate holiday is after:"
        question: "In postmenopausal women with low or moderate fracture risk, oral bisphosphonate holiday is after:"
        options:
          - "5 years of treatment"
          - "3 years of treatment"
          - "2 years of treatment"
          - "None of the above"
        answer: 0
        why:
          - "صح (سؤال الكتاب): الـ oral بيتقيّم بعد 5 سنين."
          - "3 سنين ده للـ parenteral."
          - "سنتين ده حد الـ PTH."
          - "الإجابة موجودة: 5 سنين."
      - kind: explain
        page: 230
        title: "الـ PTH: سنتين وبعدين antiresorptive"
        quote: "Treatment with teriparatide or abaloparatide is for up to 2 years to women at very high risk for fracture"
        text: |
          **Teriparatide** أو **abaloparatide** لحد ==2 years== للـ **very high risk** (زي severe أو multiple vertebral fractures)، وبعدها **antiresorptive** علشان تحافظ على المكسب.
      - kind: explain
        page: 230
        title: "المتابعة: الـ BMD وقع، أعمل إيه؟"
        quote: "BMD that is stable or improving is evidence for a treatment response."
        text: |
          **Stable or improving BMD** = استجابة. لو وقع بشكل واضح، دوّر على:
          - ==poor adherence==
          - **inadequate GI absorption**
          - **inadequate calcium and vitamin D**
          - **مرض جديد** بيأذي العضم

          لو المريض منتظم والفحص سليم والنزول **أقل من 5%**: كمّل نفس العلاج وكرر الـ BMD بعد **سنة** (ممكن يبقى measurement error).
      - kind: explain
        page: 231
        title: "الـ markers لو مفيش DXA"
        quote: "If the marker has not decreased by 50 percent, noncompliance or poor absorption"
        text: |
          الخطة العادية: **DXA hip and spine بعد سنة**، ولو stable، متابعة أقل.

          لو الـ DXA مش متاح: **urinary NTX أو serum CTX** قبل العلاج وبعد **3–6 شهور**، وبعدين DXA بعد سنتين.
          - لو الـ marker ما نزلش ==50%==: فكّر في **noncompliance** أو **poor absorption** (غالبًا أكل بدري بعد الحباية).
          - ده للـ **antiresorptives** بس. مع الـ PTH، الـ **P1NP** هو اللي بيعلى.
      - kind: check
        page: 231
        quote: "In case of good response to denosumab therapy, the bone turnover marker of resorption (CTX) is:"
        question: "In case of good response to denosumab therapy, the bone turnover marker of resorption (CTX) is:"
        options:
          - "Decreased"
          - "Increased"
          - "Stable"
          - "None of the above"
        answer: 0
        why:
          - "صح (سؤال الكتاب): الـ denosumab antiresorptive، فالـ CTX بينزل (الهدف 50%)."
          - "الـ CTX بيعلى لما الـ denosumab يقف، مش لما يشتغل."
          - "ثابت = مفيش تأثير antiresorptive."
          - "الإجابة Decreased."
      - kind: aside
        tone: joke
        page: 231
        quote: "often related to an insufficient time interval between drug intake and food ingestion"
        text: "الـ alendronate عايز معدة فاضية وكوباية مية ونص ساعة صبر. أي فول بدري (food ingestion بعد الـ drug intake بشوية) = الحباية راحت هدر والـ CTX مش هينزل. «الفطار بعد الحباية، مش مع الحباية» ☕"
      - kind: try
        items: [dm.L17.106, dm.L17.107, dm.L17.115, dm.L17.117, dm.L17.127]
