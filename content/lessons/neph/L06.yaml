          **السبب** في عيب كل binder هو **اللي بيدّيه مقابل الـ K** (التفسير المقبول، مش في الكتاب، والمقارنة نفسها من جدول الكتاب):

          - **SPS**: بيدّي **Na** مقابل الـ K، فممكن **hypernatremia** و **volume overload**. وبيشتغل في القولون بس، وغالبًا مع **sorbitol**، وده مرتبط بالـ ==colonic necrosis==. وبيمسك أي حاجة (Ca و Mg كمان)، فلازم تفصل الأدوية التانية عنه.
          - **Patiromer**: بيدّي **Ca** مقابل الـ K، وكمان بيمسك **Mg**، فممكن **hypomagnesemia**. بيشتغل في القولون، فبطيء شوية.
          - **SZC**: بيدّي **H+ و Na**، وبيشتغل في **الأمعاء كلها** من أولها، فأسرع واحد. الـ Na اللي بيدّيه ممكن يعمل **edema**، والـ H+ اللي بياخده من المعدة بيعلّي الـ gastric pH.
