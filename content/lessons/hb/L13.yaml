        quote: "Cholangiocarcinoma: Carries a poor prognosis and responds poorly to\n chemotherapy or radiation therapy. Liver transplant is contraindicated."
        prompt: "الزرع أحسن علاج للـ advanced PSC، بس لو ظهر cholangiocarcinoma الزرع بيبقى contraindicated. ليه؟"
        answer: |
          الكتاب: الـ cholangiocarcinoma **poor prognosis**، و **responds poorly to chemotherapy or radiation**، و **liver transplant is contraindicated**.

          التفسير المقبول (مش في الكتاب): الورم ده بيكون انتشر جوه القنوات أو برّه الكبد ساعة ما يتكشف، وبعد الزرع المريض هياخد **immunosuppression** طول العمر، فأي خلية ورم فاضلة هتكبر بسرعة. يعني الكبد الجديد هيضيع، وعشان كده الشطارة إنك تزرع **قبل** ما الورم يظهر.
