        quote: "Paresthesia and numbness around the mouth and in the extremities."
        title: "الصورة والتحاليل"
        text: |
          1. **Paresthesia** و numbness حوالين البق والأطراف.
          2. **Muscle spasms**، خصوصًا الإيدين والرجلين.
          3. ==Laryngeal spasm==: stridor وممكن موت، و convulsions.

          التحاليل: calcium و ionized calcium واطيين، **phosphate عالي**، PTH واطي، vitamin D واطي، الكلى، والـ magnesium.
      - kind: table
