          - "Oxygen"
          - "Nitroglycerin"
          - "Primary PCI (best)"
          - "CABG if PCI contraindicated (left main)"
        why: "**MON** وبعدين **primary PCI** (أحسن علاج). ولو الـ PCI ممنوع زي **left main disease** ← CABG. وبعدها العلاج زي الـ angina بين النوبات."
      - kind: explain
        page: 13
        title: "تلات حاجات عن العلاج عند الكبار"
        quote: "Tissue plasminogen activator during the first 3 hours of MI has been shown to be more effective thrombolytic agent"
        text: |
          - ==Anterior MI== ← غالبًا **full-dose anticoagulation** علشان خطر الـ **mural thrombus** والـ embolization.
          - **tPA** في أول **3 ساعات** أكفأ thrombolytic، وممكن نزيف أقل.
          - قرار الـ PTCA أو الـ bypass بعد الـ MI عند الكبار بيعتمد على **شدة الأعراض**، مش على السن.
