          - "**Microangiopathic hemolytic anemia**: Hb واطي، lactate dehydrogenase (LDH) عالي، haptoglobin واطي، **schistocytes**"
          - "**Thrombocytopenia**: أقل من **150,000** أو نزول **>25%** من الـ baseline"
          - "**End-organ damage**: كلية، مخ، قلب، رئة، gastrointestinal (GI)"

          الأصل: endothelial damage ← thrombi في الـ microvasculature ← الكرات الحمرا بتتقطع (Coombs **negative**).
