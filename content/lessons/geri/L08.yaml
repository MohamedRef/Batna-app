  - id: geri.L08.lesson4
    title: "الـ gout: الـ uric acid ومين بيولّعه"
    hook: "صباع رجل أحمر نار في نص الليل بعد عزومة لحمة. الكتاب بيقولك مين معرّض، وإزاي تتأكد، وكل دوا بيضرب فين."
    minutes: 9
    pages: [143, 146]
    topics: [gout, gout-mx]
    goals:
      - "تعرف الـ uric acid جاي منين وليه بيترسّب"
      - "تعدّ الـ risk factors وتعرف ليه الأدوية دي بترفعه"
      - "تعرف معايير التشخيص والفحوص، وكل دوا بيشتغل فين"
    status: unverified
    steps:
      - kind: explain
        page: 143
        quote: "Gout is an ancient disease associated with deposits of uric acid, especially in the joints and kidneys."
        title: "مرض قديم، وفهم جديد"
        text: |
          الكتاب بيقول الـ gout ==ancient disease== مرتبط بترسّب **uric acid**، خصوصًا في **المفاصل** و **الكلى**. وإن الـ pathways بتاعة تصنيع الـ uric acid، وقدرة البلورات إنها تعمل التهاب، ما اتثبتوش غير في **القرن العشرين**.

          ليه المفاصل والكلى بالذات؟ التفسير المقبول (مش في الكتاب): الـ uric acid بيدوب بصعوبة، ولما تركيزه يعلى بيترسّب بلورات في الأماكن اللي **أبرد** أو **أقل دم** (المفاصل الطرفية زي صباع الرجل الكبير)، أو اللي **بيتركّز فيها** (البول في الكلى، فبيعمل حصوات).

          يعني الـ gout مش «التهاب مفاصل» وخلاص، هو مرض **مستوى** uric acid، والمفصل بس المكان اللي بيبان فيه.
      - kind: explain
        page: 144
        title: "الـ uric acid جاي منين؟"
        quote: "Gout is clearly associated with a buildup of uric acid. Uric acid is produced as part of the body's metabolism of purines, which are produced as the body breaks down any of the many purine-containing substances, including nucleic acids from our diet or from the breakdown of our own cells."
        text: |
          الـ gout مرض قديم: ==uric acid deposits== في المفاصل والكلى. الـ uric acid ناتج من **purine metabolism**: من الأكل (nucleic acids) أو من تكسير خلايانا.

          التفسير المقبول (مش في الكتاب): يعني فيه مصدرين للـ purines، **أكلك** و **خلاياك**. عشان كده الريجيم لوحده مش بيحل المشكلة، وعشان كده الـ gout ممكن يولّع لما خلايا كتير تموت مرة واحدة.
      - kind: table
        page: 144
        quote: "Medications Diuretics (thiazides, loop diuretics) Low-dose aspirin Ciclosporin Niacin Ethambutol."
        title: "Risk factors"
        columns: [Group, Factors]
        rows:
          - ["Age, sex, race", "Onset >50; male; African American"]
          - ["Lifestyle", "Beer, red meat, seafood, purines, obesity"]
          - ["Drugs", "Thiazides, loops, low-dose aspirin, ciclosporin, niacin, ethambutol"]
          - ["Diseases", "Metabolic syndrome, HTN, CVD, HF, CKD"]
        hide: [[2, 1]]
      - kind: explain
        page: 144
        quote: "Medications Diuretics (thiazides, loop diuretics) Low-dose aspirin Ciclosporin Niacin Ethambutol."
        title: "ليه الحاجات دي بترفع الـ uric acid؟"
        text: |
          الكتاب بيعدّ: **age >50** عند البداية، **African American > White**، **male > female**، **genetics** (الجينات بتحدد الكلى بتطلّع قد إيه)، **lifestyle** (alcohol خصوصًا **beer**، red meat، seafood، purine-rich foods، obesity)، **أدوية**، و **comorbidities** (metabolic syndrome، HTN، CVD، thromboembolic disorders، HF، CKD، و hyperuricaemia من غير arthritis).

          التفسير المقبول (مش في الكتاب) للمنطق، وكله بيرجع لسؤالين: **بنعمل كتير؟ ولا بنطلّع قليل؟**
          - **بنعمل كتير**: اللحمة الحمرا والـ seafood والـ beer مليانين purines.
          - **بنطلّع قليل**: الكلى هي اللي بتخرّج الـ uric acid، فالـ **CKD** والـ **diuretics** والأدوية اللي في الـ CANDLE بيقللوا إخراجه. والـ **insulin resistance** في الـ metabolic syndrome بيخلّي الكلى تحتفظ بيه.
          - **الرجالة** أكتر لأن الـ estrogen بيساعد الكلى تطلّعه، وعشان كده الستات بيلحقوا بعد الـ menopause.

          يعني لما تشوف عيان gout، راجع أدويته قبل ما تكتب دوا جديد.
      - kind: mnemonic
        page: 144
        quote: "Medications Diuretics (thiazides, loop diuretics) Low-dose aspirin Ciclosporin Niacin Ethambutol."
        word: "CANDLE"
        parts:
          - { key: "C", text: "Ciclosporin" }
          - { key: "A", text: "Aspirin (low dose)" }
          - { key: "N", text: "Niacin" }
          - { key: "D", text: "Diuretics: thiazides" }
          - { key: "L", text: "Loop diuretics (the second diuretic)" }
          - { key: "E", text: "Ethambutol" }
        hook: "**CANDLE**: الشمعة اللي بتولّع الـ ==gout==. الأدوية دي بتقلل إخراج الـ uric acid من الكلى."
      - kind: explain
        page: 145
        title: "التشخيص"
        quote: "Gout Attack Locations (figure key: most common, common, least common)\nFirst toe eventually affected in about 90% of people with gout"
        text: |
          الكتاب: ==6 أو أكتر== من: أكتر من attack، الـ inflammation توصل الذروة في **يوم**، monoarthritis، احمرار، **1st metatarsophalangeal (MTP)** مؤلم أو وارم، unilateral 1st MTP، unilateral tarsal، **tophus**، hyperuricaemia، asymmetric swelling على الأشعة، subcortical cysts من غير erosions، و culture سلبي.

          والـ **first toe** بيتصاب في الآخر في حوالي **90%**. والفحوص: **serum uric acid** و **joint aspiration**.

          ليه المعايير دي؟ التفسير المقبول (مش في الكتاب): كل واحدة بتوصف **شخصية** الـ gout:
          - البلورة بتعمل التهاب **شديد وسريع**، فالذروة في **يوم** والاحمرار واضح.
          - بيمسك **مفصل واحد** (mono)، وغالبًا الطرفي البارد (الـ **1st MTP** والـ tarsal).
          - الـ **tophus** هو البلورات متجمعة تحت الجلد، والـ **subcortical cysts without erosions** هي بلورات جوه العضمة.
          - والـ **culture negative** عشان تستبعد الـ septic arthritis اللي ممكن تعمل نفس الشكل.

          وليه الـ **joint aspiration**؟ لأن البلورة في السائل هي الدليل المباشر، والـ uric acid في الدم ممكن يكون طبيعي وقت الـ attack أو عالي من غير gout (والكتاب نفسه بيعدّ hyperuricaemia without gouty arthritis).
