      - kind: explain
        page: 33
        title: "الـ CKD عند الكبار"
        quote: "The incidence of ESRD and mortality has increased with aging. These risks are higher when associated with DM, CVD, and hyperuricemia."
        text: |
          **chronic kidney disease (CKD):** الـ end-stage renal disease (ESRD) والوفيات بيزيدوا مع السن، وأكتر مع ==diabetes mellitus (DM) و cardiovascular disease (CVD) و hyperuricemia==.

          ليه التلاتة دول؟ التفسير المقبول (مش في الكتاب): التلاتة بيضربوا **الأوعية الصغيرة** في الكلية، اللي هي أصلًا بتضيق مع السن. فالكلية اللي خسرت جزء من الـ glomeruli بسبب السن، بتخسر الباقي أسرع.

          ورسمة الكتاب (Yamagata 2007) بتورّي إن الـ CKD stage I و II بيزيد مع كل عقد من العمر.
      - kind: figure
        page: 33
        quote: "Age specific incidence of CKD (stage I or II)"
        title: "الـ CKD بالسن والنوع"
        image: { file: geri/L02-ckd-incidence-chart.webp, book: true }
        alt: "The book's bar chart of the age-specific incidence of CKD stage I or II, in percent, for males and females in four age groups: 40 to 49, 50 to 59, 60 to 69 and 70 to 79 years. Male bars run about 4, 6, 8 and 7 percent; female bars about 2, 3, 5 and 6 percent."
        caption: |
          رسمة الكتاب (Yamagata 2007): المحور اللي تحت هو السن بالعقود، واللي على الشمال **%**:

          - **العمود الأزرق** = male، و **الروز** = female (فوق في الـ legend).
          - الأزرق بيطلع من حوالي **4%** في الـ 40–49 لحوالي ==8% في الـ 60–69==، وبينزل شوية في الـ 70–79.
          - الروز بيطلع على طول من حوالي **2%** لحوالي **6%**، وعمره ما بيعدّي الأزرق.

          اللي تاخده: الـ ==CKD stage I و II== بيزيد مع السن، والرجالة أكتر في كل عقد. القراية بالأرقام تقريبية من الرسمة.
