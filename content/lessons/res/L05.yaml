      - kind: order
        page: 41
        quote: "Steps of a cohort study"
        prompt: "رتّب خطوات الـ cohort study:"
        steps:
          - "Selection of study subjects"
          - "Obtaining data on exposure"
          - "Selection of a comparison group"
          - "Follow up"
          - "Analysis"
        why: "تختار الناس، تعرف مين exposed وبدرجة قد إيه، تختار مجموعة المقارنة، تتابع، وبعدين تحلل."
      - kind: explain
        page: 42
        quote: "-Heterogeneous (internal comparison) e.g smoking"
        title: "Heterogeneous ولا homogeneous؟"
        text: |
          - ==Heterogeneous== cohort: نفس المجموعة فيها exposed و unexposed، فالمقارنة **internal** (مثال: smoking).
          - ==Homogeneous== cohort: الكل exposed (زي عمال الـ X-ray)، فلازم مقارنة **external** بمجموعة برة.

          الـ **exposure data** بتيجي من: الناس نفسهم، records، medical exam أو special tests، environmental surveys.
          والـ **follow-up**: periodic medical exam، records، death records، mailed questionnaires، تليفونات، زيارات بيت.
      - kind: check
        page: 46
        quote: "obtaining smoking histories from women at the time of the prenatal visit"
        question: "Smoking histories are taken at the prenatal visit, and birth weight is later correlated with smoking. This study is:"
        options: ["Clinical trial", "Cross-sectional", "Prospective cohort", "Case-control"]
        answer: 2
        why:
          - "محدش قال للستات يدخنوا."
          - "الـ outcome (الولادة) بييجي **بعدين**، مش في نفس اللحظة."
          - "صح: الـ exposure اتسجل الأول، وبعدين تابعنا لقدّام لحد الوزن."
          - "الـ case-control كان هيبدأ من الأطفال اللي وزنهم قليل ويرجع لورا."
      - kind: explain
        page: 50
        quote: "Incidence among exposed = Ie a a+b"
        title: "Ie و Io"
        text: |
          في جدول الـ cohort: الصفوف = exposed / not exposed، والأعمدة = disease yes / no.

          - ==Ie== (incidence في الـ exposed) = **a/(a+b)**
          - ==Io== (incidence في الـ non-exposed) = **c/(c+d)**

          ولاحظ: هنا بنمشي **بالعرض** على الصفوف، لأن المجموعات اتعملت على أساس الـ exposure.
      - kind: explain
        page: 51
        quote: "Relative risk"
        title: "3 أرقام بيطلعوا من Ie و Io"
        text: |
          - ==RR== (relative risk / risk ratio) = Ie ÷ Io: احتمال المرض في الـ exposed **نسبةً** للـ unexposed.
          - ==AR== (attributable risk) = Ie − Io: الـ **excess risk** اللي جاي من الـ exposure.
          - ==ARP== (attributable risk percent) = (Ie − Io)/Ie × 100: كام في المية من مرض الـ exposed **هيختفي لو شلنا الـ exposure**.
      - kind: table
        page: 53
        quote: "Relative risk > 1 Risk factor"
        title: "Interpreting RR"
        columns: ["RR", "Meaning"]
        rows:
          - ["> 1", "Risk factor"]
          - ["= 1", "No association"]
          - ["< 1", "Protective factor"]
        hide: [[0, 1], [2, 1]]
      - kind: case
        page: 54
        quote: "Smoking Lung cancer Total"
        stem: "Smoking and lung cancer cohort. Smokers: 20 of 200 got lung cancer. Non-smokers: 2 of 200."
        steps:
          - question: "What are Ie and Io?"
            options: ["0.10 and 0.01", "20 and 2", "0.11 and 0.01", "0.10 and 0.10"]
            answer: 0
            why: "Ie = 20/200 = **0.10**. Io = 2/200 = **0.01**."
          - question: "What is the relative risk?"
            options: ["0.1", "9", "10", "18"]
            answer: 2
            why: "RR = 0.10/0.01 = **10**: المدخن خطره 10 أضعاف."
          - question: "What is the attributable risk?"
            options: ["0.09 (90 per 1000)", "0.9", "10", "0.11"]
            answer: 0
            why: "AR = 0.10 − 0.01 = **0.09**، يعني 90 حالة زيادة لكل 1000 مدخن."
          - question: "And the attributable risk percent?"
            options: ["9%", "50%", "90%", "100%"]
            answer: 2
            why: "ARP = 0.09/0.10 × 100 = **90%** من حالات المدخنين سببها التدخين."
      - kind: explain
        page: 56
        quote: "The risk of developing hip fractures was 1.59 times higher in those with low bone mineral density"
        title: "إزاي تكتب التفسير زي المحاضرة"
        text: |
          - **RR**: «The risk of developing hip fractures was ==1.59 times higher== in those with low BMD... during this 5-year follow-up.» (230/630 ÷ 110/479)
          - **AR**: «The risk of stroke is ==increased by 0.20== for smokers compared to non-smokers.» (0.30 − 0.10)
          - **ARP**: Apgar 0–3 vs 4–6: (34.4 − 12.5)/34.4 = ==63.7%==، يعني تقريبًا تلتين الوفيات في المجموعة دي بسبب الـ Apgar الواطي. الـ asphyxia **major contributor** بس مش السبب الوحيد.
      - kind: aside
        tone: exam
        page: 61
        quote: "The attributable risk percent typically is used as an indicator of the public health impact of exposure."
        text: |
          الـ **ARP** هو اللي بيقيس **public health impact**: لو منعنا الـ exposure، قد إيه من المرض هيختفي؟

          وخلي بالك من الفرق: **RR** نسبة (قسمة)، **AR** فرق (طرح)، **ARP** الفرق ÷ Ie × 100.
      - kind: mnemonic
        page: 51
        quote: "Relative risk"
        word: "RAD"
        parts:
          - { key: "R", text: "Ratio: RR = Ie ÷ Io" }
          - { key: "A", text: "Attributable: AR = Ie − Io (excess risk)" }
          - { key: "D", text: "Divide the excess by Ie × 100 = ARP" }
        hook: "**RAD**: قسمة، طرح، وبعدين الطرح ÷ Ie. ترتيب الأسئلة في الامتحان نفسه."
      - kind: check
        page: 61
        quote: "ARP= (0.344-0.125)X1OO= 63.7%"
        question: "Death rate 34.4% with Apgar 0–3 vs 12.5% with Apgar 4–6. The attributable risk percent is:"
        options: ["21.9%", "36.3%", "63.7%", "275%"]
        answer: 2
        why:
          - "21.9 ده **AR** (34.4 − 12.5)، مش الـ ARP."
          - "36.3% = Io/Ie، الجزء اللي **مش** من الـ exposure."
          - "صح: (0.344 − 0.125)/0.344 × 100 = **63.7%**."
          - "ده الـ RR (2.75) مكتوب كنسبة."
      - kind: try
        items: [res.L05.031, res.L05.039, res.L05.041, res.L05.046, res.L05.048]
