        title: "إمتى تحوّل للـ gastroenterologist"
        text: |
          - Typical GERD ما اتحسنش على **twice-daily PPI**.
          - Extraesophageal ما اتحسنش بعد ==3 months== twice-daily PPI.
          - **Dysphagia** واضحة أو أي alarm symptom.
          - **Barrett** للـ surveillance، أو Barrett مع **dysplasia** أو early mucosal cancer.
          - لما تفكر في **surgery**.

          ليه دول بالذات؟ لأن كل واحد منهم يا إما التشخيص نفسه لسه مش مؤكد (ما استجابش)، يا إما فيه حاجة محتاجة منظار (alarm، Barrett)، يا إما قرار الجراحة محتاج pH و manometry قبله.
