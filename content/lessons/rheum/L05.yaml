lecture: rheum.L05
lessons:
  # ------------------------------------------------------------------
  # Book order. Ids are never reused: lesson3 (pp 79-82, T and B cell
  # tolerance) was split out of lesson1; the two principal factors (p79)
  # moved from lesson2 into lesson1 beside the definition (#828, 2026-11-13).
  - id: rheum.L05.lesson1
    title: "الجهاز المناعي بيعرف أهله إزاي؟"
    hook: "كل يوم جسمك بيصنع ملايين خلايا ممكن تهاجمه. السؤال مش ليه بيحصل autoimmunity، السؤال ليه مش بيحصل دايمًا."
    minutes: 8
    pages: [77, 79]
    topics: [tolerance, principles]
    goals:
      - "تفرّق بين activation و tolerance و ignorance"
      - "تشرح ليه فيه خطين دفاع: central و peripheral"
      - "تعرف العاملين الأساسيين في الـ autoimmunity"
    status: unverified
    steps:
      - kind: explain
        page: 77
        title: "خريطة المحاضرة"
        quote: "One of the cardinal features of the immune system, namely, is ability of discrimination between self and non self antigens."
        text: |
          الكتاب بيفتح بجملة واحدة هي المحاضرة كلها: أهم ميزة في الجهاز المناعي إنه ==يفرّق بين self و non-self==.

          والـ agenda ماشية بالترتيب ده: الـ **tolerance** (يعني إيه وليه مهمة)، بعدين الـ **central T tolerance**، بعدين الـ **peripheral T tolerance** بتلات طرق (**anergy** و **deletion** و **immune suppression**)، بعدين الـ **B cell tolerance**، وفي الآخر **الجينات** و **العدوى**.

          ليه الترتيب ده؟ عشان المحاضرة بتبني المرض من الطبيعي: الأول تعرف إزاي الجسم بيحمي نفسه، وبعدين تفهم الـ autoimmunity على إنها **الحماية دي لما تقع**. يعني كل mechanism هتذاكره دلوقتي هو مكان ممكن يحصل فيه عطل.
      - kind: explain
        page: 78
        title: "self ولا non-self؟"
        quote: "immune system, may attack the individual's own cells and tissues. Such reactions are called autoimmunity, and the disease they cause are called autoimmune diseases."
        text: |
          أهم ميزة في الجهاز المناعي إنه **يفرّق بين self و non-self**.

          لو التفريق ده باظ، المناعة تهاجم خلايا الجسم نفسه. ده اسمه ==autoimmunity==، والأمراض اللي بتطلع منه هي **autoimmune diseases**.

          التفسير المقبول (مش في الكتاب): ليه التفريق ده صعب أصلًا؟ عشان الـ lymphocyte receptors بتتعمل **عشوائي** عشان تقدر تمسك أي ميكروب ممكن يظهر، فلازم بعض الـ receptors تطلع بتمسك أنسجتنا إحنا. يعني الـ self-reactive cells مش غلطة نادرة، دي ثمن التنوع، والـ tolerance هي اللي بتنضّف وراه.
      - kind: table
        page: 78
        quote: "Tolerance: The lymphocytes may be functionally inactivated or killed resulting in tolerance; antigens that induce tolerance are said to be tolerogenic"
        title: "الـ lymphocyte قابل الـ antigen بتاعه: 3 احتمالات"
        columns: [Outcome, What happens, Antigen]
        rows:
          - ["Activation", "Immune response", "Immunogenic"]
          - ["Tolerance", "Inactivated or killed", "Tolerogenic"]
          - ["Ignorance", "No reaction at all", "-"]
        hide: [[0, 2], [1, 1], [1, 2], [2, 1]]
      - kind: aside
        tone: analogy
        page: 78
        quote: "Normally microbes are immunogenic and self antigens are either tolerogenic or are ignored"
        text: |
          فكّر في أمن عمارة: الغريب (**microbe**) بيتمسك، يعني **immunogenic**.

          ساكن العمارة (**self antigen**) يا إما الأمن عارفه وبيسلّم عليه (**tolerogenic**)، يا إما ساكن في الدور الأخير وعمره ما نزل فالأمن **ignoring** وجوده خالص.
      - kind: explain
        page: 78
        title: "ليه الـ ignorance مش أمان كامل؟"
        quote: "Ignorance: In some situations the antigen specific lymphocytes may not react in any way, implying that the lymphocytes simply ignore the presence of the antigen"
        text: |
          الكتاب بيقول الـ lymphocyte ممكن **simply ignore** الـ antigen وماتعملش أي حاجة.

          التفسير المقبول (مش في الكتاب): ده بيحصل غالبًا لما الـ antigen **مستخبي** عن المناعة، في مكان الـ lymphocytes مش بتوصله، أو بكمية صغيرة جدًا. الخلية الـ self-reactive لسه **عايشة وسليمة**، هي بس ماشافتش الـ antigen.

          يعني الـ ignorance هدنة مش سلام. لو حاجة كشفت الـ antigen فجأة (جرح، عدوى)، الخلية اللي كانت متجاهلاه ممكن تهاجمه. وده بالظبط اللي هتشوفه في صفحة 81 مع الـ **sequestered antigens** زي العين والـ testis.
      - kind: explain
        page: 78
        title: "ليه الـ tolerance مهمة؟"
        quote: "Strategies for inducing tolerance are being tested to treat allergic and autoimmune diseases and to prevent the rejection of organ transplantation."
        text: |
          1. الـ **self antigens** طبيعي بتعمل tolerance.
          2. لو عرفنا **نعمل tolerance** لـ antigen معيّن، نقدر نمنع أي immune reaction مش عايزينها.

          علشان كده بيجرّبوا ==tolerance induction== في علاج الـ **allergy** والـ **autoimmune diseases** ومنع **transplant rejection**.
      - kind: check
        page: 78
        quote: "Normally microbes are immunogenic and self antigens are either tolerogenic or are ignored"
        question: "According to the lecture, how do self antigens normally behave?"
        options:
          - "Tolerogenic or ignored"
          - "Immunogenic"
          - "Always ignored"
          - "Always immunogenic but suppressed by antibodies"
        answer: 0
        why:
          - "صح: الـ self antigens يا tolerogenic يا ignored، والـ microbes هي اللي immunogenic."
          - "الـ immunogenic ده وصف الـ microbes، ولو self antigen بقى immunogenic يبقى ده autoimmunity."
          - "الـ ignorance احتمال واحد بس، والـ tolerance هو الأساس."
          - "مفيش antibodies في المعادلة دي؛ الـ tolerance بتحصل في الـ lymphocytes نفسها."
      - kind: figure
        page: 79
        quote: "Immunologic tolerance to different self antigens may be induced when developing lymphocytes encounter these antigens in the generative lymphoid organs, called central tolerance, or when mature lymphocytes encounter self antigens in peripheral tissues, called peripheral tolerance"
        title: "خطين دفاع: central و peripheral"
        alt: "Two-tier diagram. Top tier, central tolerance in the generative organs: thymus for T cells, where high-avidity self recognition leads to apoptosis by negative selection; bone marrow for B cells, where cells are killed or change receptor specificity. Arrow down to the periphery for mature cells. Bottom tier, peripheral tolerance: anergy, deletion by activation-induced cell death, and suppression by regulatory T cells for T cells; anergy for B cells."
        caption: "الـ ==central tolerance== في المصنع، يعني الـ thymus والـ bone marrow. والـ **peripheral** في الشارع للخلايا الناضجة اللي هربت."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L05a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fg-head-acc"/></marker></defs>
