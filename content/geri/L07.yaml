  - id: geri.L07.057
    kind: case
    topic: falls
    stem: An 81-year-old woman in a rehabilitation ward fell yesterday. She takes furosemide, amlodipine and zopiclone. She is mildly anxious but cooperative. AMTS 7/10.
    steps:
      - question: What is her FRAT recent-falls score?
        options: ["8", "6", "4", "2"]
        answer: 0
        why: "One or more falls in the last 3 months while an inpatient or resident scores 8 (p114). 6 is a fall in the last 3 months outside care, 4 is 3–12 months ago, 2 is none."
      - reveal: "Three listed drugs (a diuretic, an antihypertensive, a hypnotic) = 4. Mildly affected psychologically = 2. AMTS 7 = 2."
        question: What is her total and risk band?
        options: ["16, high", "14, medium", "12, medium", "18, high"]
        answer: 0
        why: "8 + 4 + 2 + 2 = 16, and 16–20 is high risk (p114). 12–15 would be medium."
      - question: What must the team do now?
        options: [Commence a fall alert and put the status on the care plan, Repeat the FRAT in a year, Stop all three drugs at once, Nothing until she falls again]
        answer: 0
        why: "High status: commence fall alert and list it on the care plan (p114). Medication review is part of the multifactorial assessment, but stopping everything at once is not the Falls Risk Assessment Tool (FRAT) action."
      - question: Which other measurement should be part of her multifactorial assessment?
        options: [Lying and standing blood pressure, Serum vitamin B12 only, Bone scan, Spirometry]
        answer: 0
        why: "A lying and standing blood pressure (BP) is in the falls assessment (p113); dizziness or postural hypotension also makes risk automatically high (p114)."
