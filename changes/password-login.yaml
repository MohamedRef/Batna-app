# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: new
  ar_eg: تقدر تدخل باسم مستخدم وباسورد من أي جهاز من غير جيميلك (المزامنة › الدخول باسم مستخدم وباسورد)، وهتلاقي مذاكرتك كلها زي ما هي
  en: Sign in with a username and password on any device, without your Gmail (Sync › Username and password); everything syncs down
- kind: new
  ar_eg: على جهاز مش بتاعك علّم «الجهاز ده مش بتاعي»، وهتخرج لوحدك أول ما تقفل التاب أو التطبيق
  en: On someone else's device, tick "Not my device" and you're signed out when the tab or app closes
- kind: improved
  ar_eg: الدرس اللي ما خلّصتوش بيفتح على نفس الخطوة بإجاباتك وملاحظاتك على أي جهاز من أجهزتك، مش على الجهاز اللي بدأته عليه بس
  en: An unfinished lesson reopens at the same step, with your answers and notes, on any of your devices
