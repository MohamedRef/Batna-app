    src: { page: 11, quote: "MTC > 1 cm in size metastases to the regional lymph nodes are common (> 75%), total thyroidectomy with central lymph node dissection." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.076
    kind: card
    topic: men2-treatment
    front: Role of external irradiation and chemotherapy in extensive MTC?
