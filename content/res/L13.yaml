items:
  # ---------------- structure (slides 2-6) ----------------
  - id: res.L13.001
    kind: card
    topic: structure
    front: What is the most common way of communicating research results, and why is its format standardized?
    back: >-
      Writing a scientific paper is the most common way of communicating the results of research to other scientists
      and to health professionals. Its format for biomedical journals has been standardized to give a systematic and
      organized way to present the data.
    src: { page: 2, quote: "@" }
    status: unverified
  - id: res.L13.002
    kind: mcq
    topic: structure
    stem: Which body issues the uniform requirements for submitting manuscripts to biomedical journals?
    options:
      - The International Committee of Medical Journal Editors
      - The World Medical Association
      - The US National Library of Medicine
      - Each journal's own editor, independently
    answer: 0
    why:
      - The slide names the International Committee of Medical Journal Editors, which revises these requirements periodically.
      - The World Medical Association wrote the Helsinki Declaration (ethics), not the manuscript requirements.
      - The National Library of Medicine runs MeSH, PubMed and the journal abbreviation list, not the manuscript rules.
      - Journals add their own instructions, but the uniform requirements are one shared set.
    src: { page: 3, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.003
    kind: order
    topic: structure
    prompt: Put the parts of a scientific paper in the order the lecture gives them.
    steps:
      - Title
      - Abstract
      - Introduction
      - Methodology
      - Results
      - Discussion
      - Conclusion
      - Acknowledgements
    src: { page: 4, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.004
    kind: cloze
    topic: structure
    text: "A good title describes the contents of the paper in the fewest possible words; generally it should consist of {{c1::10–12}} words."
    src: { page: 5, quote: "@" }
    status: unverified
    tags: [numbers, high-yield]
  - id: res.L13.005
    kind: mcq
    topic: structure
    stem: Which is the best title for a cross-sectional study of pine-wood allergy in furniture workers?
    options:
      - Few workers exposed to wood dust are detected with specific IgE against pine wood
      - "A study of IgE in workers: observations on pine"
      - Pine IgE in FWs
      - Wood
    answer: 0
    why:
      - It describes the content in about a dozen words, with no wasted phrases or abbreviations (the slide's own example paper).
      - '"A study of" and "Observations on" are the wasted phrases the slide tells you to drop.'
      - A title should not contain abbreviations.
      - Too short; it doesn't describe the contents.
    src: { page: 5, quote: "@" }
    status: unverified
  - id: res.L13.006
    kind: enumerate
    topic: structure
    prompt: List the rules for a good title from the lecture.
    points:
      - Adequately describes the contents in the fewest possible words (generally 10–12 words; not too long or too short)
      - Sub-titles only where the journal allows them (some journals, not all)
      - No unnecessary words or phrases such as "Observations on" or "A study of"
      - No abbreviations
    pass: 3
    hook: "العنوان «قصير، شامل، نضيف»: من 10 لـ 12 كلمة تحكي المحتوى، sub-title لو الجورنال يسمح، من غير «A study of» ولا اختصارات."
    src: { page: 6, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.007
    kind: card
    topic: structure
    front: What is a running title, and how long is it usually?
    back: >-
      A short title that many journals require to be printed at the top or bottom of every page of the published
      article. It is usually between 30 and 50 characters.
    src: { page: 6, quote: "@" }
    status: unverified
    tags: [numbers, high-yield]
  # ---------------- abstract (slides 8-14) ----------------
  - id: res.L13.008
    kind: enumerate
    topic: abstract
    prompt: What should the abstract state?
    points:
      - Purposes of the study or investigation
      - Basic procedures (selection of subjects or laboratory animals; observational and analytical methods)
      - Main findings (specific data and their statistical significance, if possible)
      - Principal conclusions
    pass: 4
    hook: "الـ abstract بيجاوب 4 أسئلة «ليه؟ إزاي؟ لقينا إيه؟ يعني إيه؟» = purposes، basic procedures، main findings، principal conclusions."
    src: { page: 8, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.009
    kind: card
    topic: abstract
    front: Where does the abstract go, and what should a good abstract be?
    back: >-
      At the beginning of the paper. It should be a miniature version of the paper: a brief summary of each of the
      main sections, following the structure of the paper.
    src: { page: 9, quote: "@" }
    status: unverified
  - id: res.L13.010
    kind: enumerate
    topic: abstract
    prompt: Give the subtitles of a structured abstract listed in the lecture.
    points:
      - Objective
      - Type of design
      - Setting
      - Material or subjects
      - Methods
      - Results
      - Conclusions
    pass: 5
    hook: "الـ structured abstract «هدف، تصميم، مكان، ناس، طريقة، نتيجة، خلاصة» = objective، type of design، setting، material or subjects، methods، results، conclusions."
    src: { page: 9, quote: "@" }
    status: unverified
  - id: res.L13.011
    kind: table
    topic: abstract
    title: Abstract word limits
    columns: [Abstract type, Words]
    rows:
      - [Unstructured, Less than 150]
      - [Structured, Less than 250]
    blanks: [[0, 1], [1, 1]]
    src: { page: 11, quote: "@" }
    status: unverified
    tags: [numbers, high-yield]
  - id: res.L13.012
    kind: mcq
    topic: abstract
    stem: Why does the abstract word limit matter beyond style?
    options:
      - Some electronic databases are programmed to accept only up to that number of words
      - Reviewers stop reading after 150 words
      - The ICMJE fines papers that exceed it
      - The abstract is printed on the running head
    answer: 0
    why:
      - That is the reason the slide gives.
      - The slide gives no such reason.
      - No penalty of this kind is mentioned.
      - The running title, not the abstract, goes at the top or bottom of each page.
    src: { page: 11, quote: "@" }
    status: unverified
  - id: res.L13.013
    kind: cloze
    topic: abstract
    text: "Abstracts are generally written in the {{c1::past}} tense."
    src: { page: 11, quote: "@" }
    status: unverified
  - id: res.L13.014
    kind: enumerate
    topic: abstract
    prompt: The abstract must be self-contained. So what must it NOT include?
    points:
      - References to literature or to figures and tables in the body of the paper
      - Information that is not in the paper
      - Abbreviations or acronyms, unless standard or very well known
    pass: 3
    hook: "الـ abstract «يقف لوحده»: 3 لأ = لا references ولا figures/tables، لا معلومة مش في الـ paper، ولا اختصارات (إلا المشهورة)."
    src: { page: 12, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.015
    kind: mcq
    topic: abstract
    stem: An abstract ends with "...as shown in Table 2 (ref 14)". What rule does this break?
    options:
      - The abstract must stand alone without the full text
      - The abstract must be in the past tense
      - The abstract must be under 150 words
      - Key words must follow the abstract
    answer: 0
    why:
      - Being self-contained means no references to literature or to the paper's tables and figures.
      - Tense isn't the problem here.
      - Length isn't the problem here.
      - True, but not what this sentence breaks.
    src: { page: 12, quote: "@" }
    status: unverified
  - id: res.L13.016
    kind: card
    topic: abstract
    front: How many key words, where do they go, and where should the terms come from?
    back: >-
      3–10 key words or short phrases, usually placed beneath the abstract. They help indexers cross-index the article.
      Use terms from the Medical Subject Headings (MeSH) list of PubMed (US National Library of Medicine) wherever
      possible, to help indexing and retrieval.
    src: { page: 13, quote: "@" }
    status: unverified
    tags: [numbers, high-yield]
  # ---------------- intro-methods (slides 15-24) ----------------
  - id: res.L13.017
    kind: enumerate
    topic: intro-methods
    prompt: What should the introduction do?
    points:
      - Tell the reader why the research was started and what question it was designed to answer (research is not a fishing expedition)
      - Raise the interest of the reader (convey enthusiasm, but do not exaggerate)
    pass: 2
    hook: "المقدمة شغلتين «ليه، وشدّني»: ليه البحث بدأ وسؤاله إيه، وتشد القارئ من غير مبالغة."
    src: { page: 15, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.018
    kind: enumerate
    topic: intro-methods
    prompt: What should the introduction NOT do?
    points:
      - Explain what can be found in any textbook in the field
      - Be over-referenced (give only strictly pertinent references)
      - Include data or conclusions from the work being reported
    pass: 3
    hook: "المقدمة 3 لأ «مش كتاب، مش مكتبة، مش نتيجة»: ماتشرحش اللي في أي textbook، ماتحشرش references، وماتحطش نتايجك."
    src: { page: 16, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.019
    kind: mcq
    topic: intro-methods
    stem: '"Research is not a fishing expedition." What does the lecture mean?'
    options:
      - A study is designed with a specific question in mind, which the introduction makes clear
      - Research must not be done near the sea
      - You should collect all possible data and then look for something significant
      - The introduction should list every paper on the subject
    answer: 0
    why:
      - Right; that is why the introduction states the question the research was designed to answer.
      - It's a metaphor, not a location rule.
      - That is exactly the fishing expedition the slide warns against.
      - The introduction should not be over-referenced.
    src: { page: 15, quote: "@" }
    status: unverified
  - id: res.L13.020
    kind: card
    topic: intro-methods
    front: What is the main principle of the methods section, and how long is too short?
    back: >-
      Replicability of results is the heart of science: the methods give a detailed exposition of the research design,
      so a reader can repeat the study and validate the findings. A methods section under two double-spaced pages is
      probably inadequate.
    src: { page: 18, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.021
    kind: table
    topic: intro-methods
    title: How much to describe each method
    columns: [Method, What to write]
    rows:
      - [Established, "A reference; no description needed"]
      - [Published but not well known, "A reference and a brief description"]
      - [New or substantially modified, "A clear description, the reasons for using it and its limitations"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 19, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.022
    kind: enumerate
    topic: intro-methods
    prompt: What should the methods section NOT do?
    points:
      - Refer to patients and animals as "material" (living things; use "material" only for inanimate specimens)
      - Use proprietary names of drugs (use generic names)
    pass: 2
    hook: "في الـ methods لأين «مش حاجة، ومش ماركة»: العيان مش material، والدوا باسمه العلمي مش التجاري."
    src: { page: 20, quote: "@" }
    status: unverified
  - id: res.L13.023
    kind: mcq
    topic: intro-methods
    stem: Which sentence is acceptable in a methods section?
    options:
      - Patients received paracetamol 1 g every 8 hours.
      - The material consisted of 120 patients with cirrhosis.
      - Patients received Panadol 1 g every 8 hours.
      - Patient A.M. (hospital no. 4521) developed a rash.
    answer: 0
    why:
      - Generic drug name, and patients are not called material.
      - Patients are living things, not "material"; that word is for inanimate specimens.
      - A proprietary (brand) name; use the generic name.
      - Patients' names, initials or hospital numbers must not be used.
    src: { page: 20, quote: "@" }
    status: unverified
  - id: res.L13.024
    kind: card
    topic: intro-methods
    front: What must the methods say about ethics for human and for animal experiments?
    back: >-
      Human subjects: whether the procedures followed the ethical standards of the responsible committee on human
      experimentation and the Helsinki Declaration; never use patients' names, initials or hospital numbers. Animals:
      whether institutional or national guidelines or laws on the care and use of laboratory animals were followed.
    src: { page: 21, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.025
    kind: enumerate
    topic: intro-methods
    prompt: What statistical details should the methods report?
    points:
      - Statistical methods in enough detail for a knowledgeable reader with the original data to verify the results
      - References for statistical methods to standard works, when possible
      - Any computer programs used
      - Randomization details, concealment of allocation and the method of masking (blinding), if used
      - Losses to observation (such as dropouts from a clinical trial)
    pass: 4
    hook: "إحصاء الـ methods «طريقة، مرجع، برنامج، قرعة، ومين وقع»: methods بالتفصيل، standard works، computer programs، randomization و concealment و blinding، والـ dropouts."
    src: { page: 23, quote: "@" }
    status: unverified
  - id: res.L13.026
    kind: mcq
    topic: intro-methods
    stem: Why should a paper write "a P value of less than 0.05 was considered statistically significant"?
    options:
      - Because the choice of the cut-off point is arbitrary
      - Because 0.05 is the only accepted cut-off
      - Because "significant" must never appear in a paper
      - Because the journal will otherwise reject the abstract
    answer: 0
    why:
      - Right; "considered" admits that 0.05 is a chosen, arbitrary cut-off.
      - The point is the opposite; the cut-off is a choice.
      - It may appear in its statistical sense; only non-technical use is to be avoided.
      - No such rule on the slide.
    src: { page: 24, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.027
    kind: card
    topic: intro-methods
    front: Which technical statistical terms should not be used in their everyday sense?
    back: >-
      "Random", "significant", "correlation" and "sample": avoid non-technical uses of them in non-statistical contexts.
    src: { page: 24, quote: "@" }
    status: unverified
  # ---------------- results (slides 25-37) ----------------
  - id: res.L13.028
    kind: enumerate
    topic: results
    prompt: Give the principles of writing the results.
    points:
      - Mention only results that relate to the research objective
      - Give enough detail for scientists to assess their validity and accuracy
      - Describe the statistical analysis adequately, but don't let statistics take over the paper
      - Present results in a logical sequence in text, tables and illustrations
      - Don't repeat in the text the numbers already in tables and figures
    pass: 4
    hook: "النتايج 5 «يخص، كفاية، إحصاء بالعقل، بالترتيب، ومن غير تكرار»: related to objective، detail كفاية، statistics مش واخدة الـ paper، logical sequence، وماتعيدش أرقام الجداول."
    src: { page: 25, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.029
    kind: cloze
    topic: results
    text: "A good rule about whether to include figures or not is: {{c1::When in doubt, leave it out}}."
    src: { page: 26, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.030
    kind: table
    topic: results
    title: When to use a table
    columns: [Use a table, Don't use a table]
    rows:
      - ["To show exact values of more data than a few sentences can summarize", "When the data can easily be presented in the text"]
      - ["When the aim is to present specific inter-relationships", "When there is no relation between the data or to a time sequence"]
    blanks: [[0, 0], [1, 0], [0, 1], [1, 1]]
    src: { page: 27, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.031
    kind: mcq
    topic: results
    stem: You have only three numbers to report (age, sex ratio, response rate). What does the lecture advise?
    options:
      - Put them in the text; a table is not needed
      - Make a table so they stand out
      - Make a bar chart
      - Put them in the abstract only
    answer: 0
    why:
      - Tables should not be used when the data can easily be presented in the text.
      - A table is for more data than a few sentences can hold.
      - Graphs are for trends and relationships.
      - Results go in the results section; the abstract only summarizes them.
    src: { page: 27, quote: "@" }
    status: unverified
  - id: res.L13.032
    kind: card
    topic: results
    front: What should a table's title describe?
    back: >-
      Exactly the content of the table: WHAT – WHEN – WHO – WHERE. The table should be understood without reference to
      the text.
    src: { page: 28, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.033
    kind: card
    topic: results
    front: What goes in a table's footnote?
    back: >-
      Explanation of non-standard abbreviations used, and identification of the statistical measures of variation, such
      as SD and SEM. Column and row headings stay short or abbreviated.
    src: { page: 28, quote: "@" }
    status: unverified
