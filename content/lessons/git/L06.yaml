  - id: git.L06.lesson4
    title: "الـ UC: من الـ rectum ولفوق من غير ما يفوّت حتة"
    hook: "التهاب سطحي بس عنيد: بيبدأ من الـ rectum ويطلع لفوق، وأخطر حاجة فيه الـ toxic megacolon."
    minutes: 10
    pages: [213, 224]
    topics: [uc-extent, uc-clinical, uc-tests]
    goals:
      - "ترسم الـ Montreal E1–E3 من دماغك (سؤال كتاب)"
      - "تقيّم شدة النوبة بالجدول"
      - "تقرأ الـ plain film في الـ severe UC"
    status: unverified
    steps:
      - kind: explain
        page: 213
        title: "الـ UC عكس الـ Crohn في كل حاجة تقريبًا"
        quote: "Inflammation in ulcerative colitis is limited to the mucosal layer of the colon. The rectum is virtually always involved"
        text: |
          - الالتهاب في ==mucosal layer== بس، وفي الـ **colon** بس.
          - الـ **rectum** متصاب **virtually always**، والالتهاب بيطلع لفوق **confluent** (من غير skip).
          - البداية غالبًا **acute or subacute** (الـ Crohn insidious).

          التوزيع: جزء كبير **proctitis** بس، حوالي **تلت** proctosigmoiditis، والأغلبية تحت الـ **splenic flexure**، وحوالي **تلت** فوقها (extensive)، وكتير pancolitis.
      - kind: figure
        page: 222
        quote: "Involvement limited to the rectum (that is, proximal extent of inflammation is distal to the rectosigmoid junction)"
        title: "Montreal: E1، E2، E3"
        alt: "Three colon sketches stacked vertically, with the splenic flexure marked. E1: only the rectum is red, ulcerative proctitis. E2: rectum, sigmoid and descending colon are red up to the splenic flexure, left-sided UC. E3: the red passes the splenic flexure into the transverse and ascending colon, extensive UC or pancolitis."
        caption: "العلامة اللي بتفصل E2 عن E3 هي ==splenic flexure==. لو الالتهاب عدّاها ولو بسنتي يبقى **E3**."
        svg: |
          <svg viewBox="0 0 330 520" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="18" class="t-b t-acc">E1 Ulcerative proctitis</text>
            <rect x="40" y="50" width="22" height="70" rx="6" class="fg-box"/>
            <rect x="40" y="30" width="200" height="22" rx="6" class="fg-box"/>
            <rect x="218" y="30" width="22" height="70" rx="6" class="fg-box"/>
            <rect x="160" y="98" width="80" height="22" rx="6" class="fg-box"/>
            <rect x="160" y="98" width="22" height="34" rx="6" class="fg-dot-bad"/>
            <circle cx="229" cy="41" r="4" class="fg-dot-acc"/>
            <text x="248" y="45" class="t-sm t-acc">splenic flexure</text>
            <text x="190" y="136" class="t-sm t-mut">rectum</text>
            <text x="10" y="156" class="t-sm">rectum only (distal to the rectosigmoid junction)</text>
            <text x="10" y="190" class="t-b t-acc">E2 Left-sided (distal) UC</text>
            <rect x="40" y="222" width="22" height="70" rx="6" class="fg-box"/>
            <rect x="40" y="202" width="200" height="22" rx="6" class="fg-box"/>
            <rect x="218" y="202" width="22" height="70" rx="6" class="fg-dot-bad"/>
            <rect x="160" y="270" width="80" height="22" rx="6" class="fg-dot-bad"/>
            <rect x="160" y="270" width="22" height="34" rx="6" class="fg-dot-bad"/>
            <circle cx="229" cy="213" r="4" class="fg-dot-acc"/>
            <text x="248" y="217" class="t-sm t-acc">splenic flexure</text>
            <text x="190" y="308" class="t-sm t-mut">rectum</text>
            <text x="10" y="328" class="t-sm">up to, not beyond, the splenic flexure</text>
            <text x="10" y="362" class="t-b t-acc">E3 Extensive UC (pancolitis)</text>
            <rect x="40" y="394" width="22" height="70" rx="6" class="fg-dot-bad"/>
            <rect x="40" y="374" width="200" height="22" rx="6" class="fg-dot-bad"/>
            <rect x="218" y="374" width="22" height="70" rx="6" class="fg-dot-bad"/>
            <rect x="160" y="442" width="80" height="22" rx="6" class="fg-dot-bad"/>
            <rect x="160" y="442" width="22" height="34" rx="6" class="fg-dot-bad"/>
            <circle cx="229" cy="385" r="4" class="fg-dot-acc"/>
            <text x="248" y="389" class="t-sm t-acc">splenic flexure</text>
            <text x="190" y="480" class="t-sm t-mut">rectum</text>
            <text x="10" y="500" class="t-sm">extends proximal to the splenic flexure</text>
          </svg>
      - kind: sort
        page: 222
        quote: "Extensive UC (pancolitis) Involvement extends proximal to the splenic flexure"
        prompt: "صنّف كل colonoscopy:"
        bins: ["E1", "E2", "E3"]
        cards:
          - { text: "Rectum only, up to 12 cm", bin: 0 }
          - { text: "Rectum to sigmoid", bin: 1 }
          - { text: "Rectum to descending colon", bin: 1 }
          - { text: "Rectum to mid-transverse colon", bin: 2 }
          - { text: "Rectum to cecum", bin: 2 }
        why: "الـ rectum بس = E1. لحد الـ splenic flexure = E2. عدّى الـ splenic flexure = E3."
      - kind: aside
        tone: trap
        page: 213
        quote: "Cecal patch can be found especially in children with peri appendiceal involvement. Backwash ileitis can occur in UC especially in extensive colitis."
        text: |
          تلات حاجات في الـ UC ممكن تخليك تفتكره Crohn:
          - **cecal patch** (حوالين الـ appendix)، خصوصًا في الأطفال
          - **backwash ileitis** في الـ extensive colitis
          - **skip lesions** عند عيان **under treatment** (العلاج بيخف حتت قبل حتت)
      - kind: explain
        page: 213
        title: "الأعراض"
        quote: "Overt rectal bleeding and tenesmus are virtually universally present and may be the only symptoms in patients with proctitis alone."
        text: |
          - ==rectal bleeding== و **tenesmus**: موجودين في كله تقريبًا، وفي الـ proctitis ممكن يبقوا هما بس.
          - لما يطلع لفوق: **diarrhea** و **abdominal pain** أكتر.
          - **nausea و weight loss**: مرض أشد.
          - **severe pain أو fever**: fulminant colitis أو **toxic megacolon**.

          الكشف: tenderness خفيف في الـ **hypogastrium / LLQ**، والـ DRE ممكن يطلّع **red blood**. و **severe tenderness، fever، tachycardia** = fulminant.
      - kind: table
        page: 222
        quote: "Table 4 Mayo score for assessment of UC activity"
        title: "شدة النوبة (Table 4 في الكتاب)"
        columns: [Feature, "Mild · Moderate", Severe]
        rows:
          - ["Stools/day", "≤4 · 4–6", "≥6 + one systemic (*)"]
          - [Blood, "Small · between", Visible]
          - ["Temp >37.8 °C *", "No · No", "Yes"]
          - ["Pulse ≥90 *", "No · No", "Yes"]
          - ["Anaemia *", "No · No", "Yes"]
          - ["ESR *", "≤30 · ≤30", ">30"]
        hide: [[0, 1], [0, 2], [3, 2], [5, 2]]
      - kind: update
        page: 222
        quote: "Table 4 Mayo score for assessment of UC activity"
        text: "الجدول ده اسمه في الكتاب **Mayo score**، بس الأرقام دي هي **Truelove and Witts criteria**. الـ Mayo score حاجة تانية مجموعها 12، وبنودها: stool frequency، rectal bleeding، endoscopy و physician's global assessment. في الامتحان اكتب جدول الكتاب، ولو اتسألت عن الاسم قول إنه Truelove–Witts."
        ref: "Truelove & Witts, BMJ 1955; ECCO UC guideline 2022"
      - kind: check
        page: 222
        quote: "Table 4 Mayo score for assessment of UC activity"
        question: "UC patient: 8 bloody stools/day, pulse 104, temperature 37.2 °C, ESR 22. Severity?"
        options:
          - "Severe"
          - "Moderate"
          - "Mild"
          - "Moderate, because ESR is normal"
        answer: 0
        why:
          - "صح: ≥6 مع دم + **systemic feature واحدة** (pulse ≥90) = severe."
          - "الـ moderate من غير أي systemic feature."
          - "الـ mild ≤4."
          - "feature واحدة كفاية، الـ ESR الطبيعي ما يلغيش الـ tachycardia."
      - kind: explain
        page: 214
        title: "التحاليل"
        quote: "P-ANCA is the most commonly associated marker. However, it is also present in Crohn colitis"
        text: |
          - anemia، low iron، leukocytosis، thrombocytosis، **hypoalbuminemia** لو شديد وواسع.
          - البراز: **negative** للـ infection، و **positive** للـ fecal leukocytes و **calprotectin**.
          - ==P-ANCA==: أشهر marker، بس موجود في الـ Crohn colitis كمان.
          - الـ P-ANCA UC: أكتر **refractory**، محتاج **early surgery**، و **chronic pouchitis** بعد الـ IPAA.
      - kind: figure
        page: 223
        quote: "Abdominal X ray in patient with acute severe UC with dilated colon and thumbprinting sign of severe inflammation:"
        title: "الـ plain film في الـ acute severe UC"
        image: { file: git/L06-asuc-xray-ct.webp, book: true }
        alt: "Left: plain abdominal X-ray with a dilated gas-filled colon and white arrows on thick wall folds (thumbprinting). Right: coronal CT of a dilated, inflamed colon with an arrow and an arrowhead."
        caption: "Figure 7 من الكتاب: قولون **dilated** والأسهم على الـ ==thumbprinting== (edema في الحيطة)."
      - kind: table
        page: 214
        quote: "So-called thumbprinting or thickening of the colon wall indicates severe colitis with bowel wall edema."
        title: "اقرا الـ plain film"
        columns: [Finding, Meaning]
        rows:
          - ["Thumbprinting / thick wall", "Severe colitis, wall edema"]
          - ["Dilated colon, no haustra", "Toxic megacolon"]
          - ["Pneumatosis", "Late: ischemia and infarction"]
          - ["Obstruction", "Rare in UC: think malignancy"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 215
        title: "المنظار والـ barium والـ CT"
        quote: "confluent inflammation extending proximally from the anal verge, with mucosal erythema, edema, and granularity and loss of normal vasculature"
        text: |
          **Colonoscopy:** التهاب **confluent** من الـ **anal verge** ولفوق: erythema، edema، granularity، و ==loss of normal vasculature==. والانتقال من العيان للسليم **abrupt**. في الشديد: hemorrhagic، ulcers، purulent exudate.

          **Pseudopolyps** في المرض القديم: nondysplastic، **no malignant potential**. بس الـ dysplastic lesions فعلًا أكتر في الـ UC.

          **Barium:** قولون **granular and shortened**. **CT:** wall thickening (الطبيعي **<3 mm**). **Pouchography** بعد الـ IPAA.
      - kind: figure
        page: 224
        quote: "Colonscopic findings in patient with severe UC with pseudopolyps:"
        title: "شكل الـ severe UC في المنظار"
        image: { file: git/L06-uc-pseudopolyps-endoscopy.webp, book: true }
        alt: "Three colonoscopy photos: A, red granular mucosa with small ulcers around the lumen; B, smooth polypoid pseudopolyps; C, hemorrhagic ulcerated mucosa with exudate."
        caption: "Figure 9: (A) mucosa حمرا ومحببة ومقرّحة، (B) **pseudopolyps**، (C) hemorrhagic مع exudate."
      - kind: try
        items: [git.L06.077, git.L06.081, git.L06.086, git.L06.093, git.L06.101]
    recap:
      - "UC = mucosal، colon بس، من الـ rectum ولفوق confluent."
      - "Montreal: E1 rectum، E2 لحد الـ splenic flexure، E3 عدّاها."
      - "Cecal patch، backwash ileitis، skip under treatment = ممكن تلخبطك مع Crohn."
      - "Severe = ≥6 bloody stools + temp >37.8، pulse ≥90، anaemia أو ESR >30."
      - "Thumbprinting = edema، dilated بدون haustra = toxic megacolon، pneumatosis = infarction."
