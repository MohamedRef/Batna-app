  - id: geri.L09.038
    kind: card
    topic: covid
    front: How is SARS-CoV-2 transmitted and how does it present?
    back: Mainly by respiratory droplets; fever, cough, myalgia and fatigue.
    src: { page: 162, quote: "Coronaviruses are a large family of viruses that cause upper and lower- respiratory tract illnesses in humans. SARS-CoV-2 is transmitted predominantly via respiratory droplets. Clinically, patients frequently present with fever, cough, myalgia, and fatigue (95). In a subset of patients, mainly elderly individuals, SARS-CoV-2 was shown to lead to bilateral pulmonary diffuse alveolar damage that may progress to acute respiratory distress syndrome (96, 97)." }
