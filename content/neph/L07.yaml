    src: { page: 160, quote: "Usually asymptomatic, PLD requires no treatment. When symptomatic, therapy is directed toward reducing cyst volume and hepatic size. Noninvasive measures include avoiding excessive use of ethanol, other hepatotoxins, and possibly cAMP agonists (e.g., caffeine), which have been shown to stimulate cyst fluid secretion in vitro. Histamine-2 blockers and somatostatin have been suggested to reduce secretion of secretin and secretory activity of cyst walls. Estrogens are likely to contribute to cyst growth, but the use of OCs and postmenopausal ERT are con-traindicated only if the liver is significantly enlarged and the risk for further hepatic cyst growth outweighs the benefits of estrogen therapy." }
    status: unverified
  - id: neph.L07.087
