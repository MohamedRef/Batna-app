    title: "الـ PPI: بنكتبه ليه، وبيتخانق مع مين"
    hook: "دوا بنكتبه كل يوم: يتكسّر بأنهي enzyme، بيتخانق مع مين، وبيعمل إيه على المدى الطويل؟"
    minutes: 9
    pages: [32, 34]
    topics: [ppi, pud-management]
    goals:
      - "تعدّ indications و adverse effects الـ proton pump inhibitor (PPI)"
      - "تختار الـ PPI مع الـ clopidogrel وتعرف ليه"
      - "تحمي معدة المريض اللي لازم ياخد NSAID"
    status: unverified
    steps:
      - kind: explain
        page: 32
        quote: "Component in treatment of H pylori eradication With the exception of omeprazole (pregnancy class C) all PPIs have been categorized as class B agents."
        title: "الـ PPI بنكتبه في إيه؟"
        text: |
          سبعة indications:
          - **Acute peptic ulcer**
          - **Nonsteroidal anti-inflammatory drug (NSAID) ulcer**: علاج ووقاية
          - **Gastroesophageal reflux disease (GERD)**
          - **Zollinger–Ellison syndrome (ZES)** قبل الجراحة
          - **Gastrointestinal (GI) hemorrhage**: علاج ووقاية
          - **Stress ulcer bleeding** في الـ critically ill
          - جزء من **H. pylori eradication**

          الخيط اللي بيجمعهم: كلهم الحمض فيهم يا هو السبب، يا بيمنع الالتئام. وفي النزيف بالذات، التفسير المقبول (مش في الكتاب) إن الـ pH العالي بيخلّي الجلطة اللي على القرحة **تثبت** وما تدوبش.

          وفي الحمل: كل الـ PPIs **class B** ما عدا ==omeprazole (class C)==.
      - kind: explain
        remind: [git.L01.134]
        page: 32
        quote: "CYP2C19 is responsible for > 80% of the metabolism of omeprazole, lansoprazole, and pantoprazole metabolism."
        title: "CYP2C19: ليه نفس الجرعة بتفرق من واحد للتاني"
        text: |
          الـ PPIs بتتكسّر بـ ==cytochrome P450 2C19 (CYP2C19)== و **cytochrome P450 3A4 (CYP3A4)**.

          - الـ CYP2C19 مسؤول عن أكتر من **80%** من metabolism الـ **omeprazole** و **lansoprazole** و **pantoprazole**.
          - فيه 4 phenotypes: **extensive**، **intermediate**، **ultra-rapid**، **poor** metabolizers.
          - في الـ **extensive** والـ **ultra-rapid**، الـ omeprazole والـ lansoprazole ممكن **ميكفوش**.
          - **Esomeprazole** (الـ S-isomer) بيتكسّر بالـ CYP2C19 أقل، و **rabeprazole** أغلبه **non-enzymatic** لـ rabeprazole thioether.
      - kind: aside
        tone: analogy
        page: 33
        quote: "Therefore, the effectiveness of omeprazole and lansoprazole is sometimes insufficient in EM and ultra-rapid metabolizers."
        text: |
          الـ **ultra-rapid metabolizer** زي واحد بياكل بسرعة: تحطله الأكل، يخلّصه قبل ما تقعد. الـ omeprazole بيتهضم قبل ما يلحق يشتغل.

          علشان كده لو مريض «مش بيستجيب» على omeprazole، فكّر في الـ CYP2C19 قبل ما تقول refractory.
      - kind: check
        page: 33
        quote: "Esomeprazole, the S-isomer of omeprazole, is metabolized to a less extent by CYP2C19 than omeprazole."
        question: "Which PPI is mainly cleared by non-enzymatic reduction, so CYP2C19 genotype matters least?"
        options:
          - "Rabeprazole"
          - "Omeprazole"
          - "Lansoprazole"
          - "Pantoprazole"
        answer: 0
        why:
