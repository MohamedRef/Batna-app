lecture: rheum.L02
lessons:
  # ------------------------------------------------------------------
  # Book order. Ids are never reused: lesson8 (pp 34-35, chronic gout and
  # the kidney) was split out of lesson3, lesson9 (pp 45-47, the book's
  # summary pages) out of lessons 5 and 6 (#828, 2026-11-13).
  - id: rheum.L02.lesson1
    title: "النقرس: بلورات في المكان الغلط"
    hook: "السكر لما يزيد في الشاي بيترسب في القاع. الـ uric acid لما يزيد في الدم بيترسب في صباع رجلك."
    minutes: 10
    pages: [23, 26]
    topics: [definition, hyperuricemia]
    goals:
      - "تعرّف الـ gout والـ pseudogout بالبلورة"
      - "تحفظ أرقام الـ epidemiology وتعرف سبب كل رقم"
      - "تعرّف الـ hyperuricaemia وتعرف أسبابها بالنسب وبالآلية"
    status: unverified
    steps:
      - kind: explain
        page: 23
        quote: "Gout is a disease resulting from deposition of monosodium urate monohydrate crystals in tissues (joint or peri-articular tissues) as a result of hyperuricaemia (MSUM supersaturation of extra-cellular fluids)."
        title: "يعني إيه gout؟"
        text: |
          الاتنين **crystal-induced synovial inflammation**، والفرق في البلورة:

          - ==Gout==: **monosodium urate (MSU)**، بسبب **hyperuricaemia** (الـ extracellular fluid بقى supersaturated).
          - **Pseudogout**: **calcium pyrophosphate dihydrate (CPPD)**.

          ممكن يظهروا acute mono/oligoarthritis، أو chronic polyarthropathy شبه الـ Osteoarthritis (OA) أو الـ rheumatoid arthritis (RA). والكتاب بيقول: gout is a **curable** disease، بس لو اتساب بيبقى صعب جدًا.
      - kind: explain
        page: 23
        quote: "Gout and pseudoguot are inflammatory arthitides (crystal – induced synovial inflammation) due to monosodium urate (MSU, gout) or calcium pyrophosphate dehydrate (CPPD, pseudogout) crystal formation."
        title: "ليه البلورة بتولّع المفصل؟"
        text: |
          الكتاب بيسميها **crystal-induced synovial inflammation**: البلورة نفسها هي اللي بتعمل الالتهاب، مش ميكروب.

          التفسير المقبول (مش في الكتاب)، وهتلاقي أوله في رسمة الـ colchicine في صفحة 40: الـ neutrophils والـ macrophages بتشوف البلورة كجسم غريب وتحاول **تبلعها**. البلورة بتشغّل الـ ==inflammasome== جوه الخلية، فيطلع **IL-1** بكمية كبيرة، و IL-1 بينادي neutrophils أكتر.

          عشان كده:
          - المفصل بيبقى **أحمر وسخن ووارم** زي الـ septic arthritis بالظبط.
          - الأدوية اللي بتقفل الـ neutrophil أو IL-1 (colchicine، anti-IL-1) بتطفي النوبة، مع إنها مش بتنزّل الـ urate.
      - kind: figure
        page: 24
        title: "البلورات جوه المفصل"
        image: { file: rheum/L02-msu-deposits.webp, book: true }
        marks:
          - { at: [0.45, 0.30], size: [0.80, 0.40], label: "White urate crystal deposits", kind: box }
        alt: "Photograph of the inside of a joint: a grey-blue surface in the upper half is coated with many small white flecks and patches, above a darker lower area."
        caption: |
          صورة من جوه مفصل (من غير caption مطبوع)، تحت عنوان الكتاب **Gout is a Deposition Disease**. التفسير المقبول (مش في الكتاب):

          - **النص اللي فوق (1)**: سطح رمادي مزرق مغطّى بنقط وبقع بيضا كتير، دي ==MSU crystals== مترسبة على سطح المفصل.
          - **تحت**: باقي المفصل أغمق ومن غير الترسيب ده.

          الصورة بتثبت جملة الكتاب: الـ gout مرض **ترسيب**، البلورة بتترص فعلًا في المفصل لما الـ urate يفضل فوق الـ saturation point.
      - kind: figure
        page: 24
        title: "الـ gout اللي اتساب"
        image: { file: rheum/L02-tophus-toe.webp, book: true }
        marks:
          - { at: [0.31, 0.55], label: "Swollen red big toe" }
          - { at: [0.81, 0.33], label: "Chalky white urate deposit" }
        alt: "Two photographs side by side. Left: a foot with a swollen, red, shiny big toe. Right: a cut specimen of a toe joint on a black background, filled with white chalky deposits."
        caption: |
          صورتين جنب بعض تحت جملة الكتاب **Neglected gout becomes a severe and difficult to treat disease**:

          - **شمال (1)**: صباع رجل كبير وارم وأحمر ولامع، ده شكل المفصل اللي فيه gout.
          - **يمين (2)**: مقطع في مفصل صباع، مليان مادة **بيضا طباشيرية**، دي ==tophus==: كتلة MSU crystals كبيرة أكلت المفصل.

          يعني نفس المرض اللي ممكن يتعالج بالكامل (gout is a curable disease)، لو اتساب سنين البلورات بتبني كتل جوه العضم والمفصل.
      - kind: explain
        page: 24
        quote: "Epidemiology of Gout\n  Gout commoner in men > women [10 : 1].\n  Peak age of onset in men 40 – 50 yrs.\n  Females > 60 years.\n  Gout is the commonest cause of inflammatory arthritis in men over 40 yrs of age.\n  Rarely occurs before young adulthood {when it occurs suggests a specific enzyme defect}.\n  Seldom in premenopausal women.\n  Prevalence of older women is increasing with diuretic use.\n  Only 15% of all patients with hyperuricaemia develop gout."
        title: "مين بيجيله؟"
        text: |
          - رجالة أكتر من ستات **10 : 1**.
          - الرجالة: **40-50** سنة. الستات: **بعد 60** (نادر قبل الـ menopause).
          - ==أشهر inflammatory arthritis في رجل فوق 40==.
          - لو ظهر قبل الشباب ← فكّر في **enzyme defect**.
          - الستات الكبار بيزيدوا بسبب الـ **diuretics**.
      - kind: explain
        page: 24
        quote: "Prevalence of older women is increasing with diuretic use."
        title: "ليه الأرقام دي كده؟"
        text: |
          الأرقام في الكتاب، والتفسير المقبول (مش في الكتاب) عشان تفتكرها:

          - **رجالة 10 : 1، والستات بعد 60، ونادر قبل الـ menopause**: الـ oestrogen بيساعد الكلى تطلّع urate، فالست قبل سن اليأس محمية. بعدها الحماية بتروح، فبيظهر بعد 60.
          - **الستات الكبار بيزيدوا مع الـ diuretics**: الـ diuretic بيعمل volume depletion، والكلى بتعوّض بإنها **ترجّع urate** أكتر (ده مكتوب في آليات صفحة 26).
          - **قبل الشباب = enzyme defect**: الـ urate بيحتاج سنين عشان يترسب، فلو ظهر بدري يبقى فيه سبب قوي جدًا من الأول، زي نقص إنزيم بيخلي الإنتاج مهول.
          - **15% بس من الـ hyperuricaemia بيجيلهم gout**: يعني ==hyperuricaemia ≠ gout==. الترسيب محتاج حاجات تانية غير الرقم (صفحة 27: solubility و nucleation).
      - kind: check
        page: 24
        quote: "Epidemiology of Gout\n  Gout commoner in men > women [10 : 1].\n  Peak age of onset in men 40 – 50 yrs.\n  Females > 60 years.\n  Gout is the commonest cause of inflammatory arthritis in men over 40 yrs of age.\n  Rarely occurs before young adulthood {when it occurs suggests a specific enzyme defect}.\n  Seldom in premenopausal women.\n  Prevalence of older women is increasing with diuretic use.\n  Only 15% of all patients with hyperuricaemia develop gout."
        question: "What fraction of people with hyperuricaemia develop gout?"
        options: ["15%", "50%", "75%", "Almost all"]
        answer: 0
        why:
          - "صح: 15% بس. عشان كده الـ uric acid العالي لوحده مش تشخيص."
          - "أكتر بكتير من الحقيقة."
          - "75% دي نسبة الـ under-excretors في الـ primary gout، فخ أرقام."
          - "لأ، أغلبهم عمرهم ما هيجيلهم نقرس."
      - kind: explain
        page: 25
        quote: "As a serum uric acid above the theoretical solubility of MSUM in physiological conditions 6.0 mg/dl."
        title: "الـ hyperuricaemia"
        text: |
          تعريفين:

          1. ==Serum uric acid فوق 6.0 mg/dl== (حد ذوبان الـ monosodium urate monohydrate (MSUM) في الجسم).
          2. أو أكتر من **2 standard deviation (SD)** فوق متوسط المجتمع.

          الـ uric acid: **تلت** من الأكل و **تلتين** من الـ purine metabolism. بيخرج **تلتين** من الكلى و **تلت** من الأمعاء. وآخر خطوتين بيعملهم ==xanthine oxidase==: hypoxanthine ← xanthine ← uric acid.

          التفسير المقبول (مش في الكتاب): ليه الحد 6.0 بالذات؟ عشان ده الرقم اللي فوقه الـ urate مايقدرش يفضل دايب في سوائل الجسم، فيبدأ يترسب بلورات. يعني الـ hyperuricaemia مش رقم إحصائي وبس، دي النقطة اللي البلورة بتبتدي عندها. وعشان آخر خطوتين في إيد إنزيم واحد (xanthine oxidase)، ده بالظبط المكان اللي الـ allopurinol بيقفله بعدين (صفحة 43).
      - kind: figure
        page: 25
        quote: "Purine nucleotide synthesis and degration are regulated by a network of enzyme pathways; xanthine oxidase catalyses the end conversion hypoxanthine to xanthine and then xanthine to uric acid."
        title: "الحوض: داخل وخارج"
        alt: "A bathtub labelled body urate pool. Two taps fill it: diet one third, purine metabolism two thirds. Two drains empty it: kidney two thirds, gut one third. A note at the tap: xanthine oxidase makes the last steps, hypoxanthine to xanthine to uric acid."
        caption: "الـ urate زي حوض: لو الحنفية زادت (overproduction) أو البلاعة اتسدت (under-excretion) هيفيض ويترسب."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R02a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="10" y="10" width="140" height="44" rx="8" class="fg-box"/>
            <text x="20" y="30" class="t-sm t-b">Diet: 1/3</text>
            <text x="20" y="46" class="t-sm t-mut">purine-rich food</text>
            <rect x="180" y="10" width="140" height="44" rx="8" class="fg-box"/>
            <text x="190" y="30" class="t-sm t-b">Purine metabolism: 2/3</text>
            <text x="190" y="46" class="t-sm t-mut">xanthine oxidase</text>
            <path d="M80 56V92" class="fg-arrow-acc" marker-end="url(#R02a)"/>
            <path d="M250 56V92" class="fg-arrow-acc" marker-end="url(#R02a)"/>
            <path d="M30 96H300V170C300 182 290 190 278 190H52C40 190 30 182 30 170Z" class="fg-acc"/>
            <text x="105" y="140" class="t-b">Urate pool</text>
            <text x="85" y="162" class="t-sm t-mut">over 6.0 mg/dL = crystals</text>
            <path d="M90 192V228" class="fg-arrow-acc" marker-end="url(#R02a)"/>
            <path d="M240 192V228" class="fg-arrow-acc" marker-end="url(#R02a)"/>
            <text x="40" y="250" class="t-sm t-b">Kidney: 2/3</text>
            <text x="200" y="250" class="t-sm t-b">Gut: 1/3</text>
          </svg>
      - kind: figure
        page: 25
        title: "الأرقام الحقيقية للحوض"
        image: { file: rheum/L02-urate-pool.webp, book: true }
        alt: "Flow diagram. De novo purine synthesis (about 600 to 700 mg per day) and dietary purines (about 300 to 600 mg per day) feed purine nucleotides, which exchange with tissue nucleotides and with purine bases; dietary purines also go straight to purine bases. Purine bases feed a uric acid pool of about 1200 mg. Two thirds leave by renal excretion (about 600 mg per day) and one third by intestinal uricolysis (about 200 mg per day)."
        caption: |
          رسمة الكتاب في صفحة 25، وهي الأرقام ورا الحوض اللي فوق:

          - **فوق**: **de novo purine synthesis** (حوالي 600-700 mg/day) و **dietary purines** على الشمال (حوالي 300-600 mg/day)، الاتنين بيصبّوا في الـ purine nucleotides (اللي بتبادل مع الـ tissue nucleotides على اليمين).
          - **في النص**: الـ purine nucleotides ← **purine bases** ← الحوض.
          - **تحت**: الـ ==uric acid pool== حوالي **1200 mg**، وبيخرج منه:
            - **2/3 شمال**: renal excretion (حوالي 600 mg/day).
            - **1/3 يمين**: intestinal uricolysis (حوالي 200 mg/day).

          يعني الجسم نفسه بيعمل أكتر من الأكل، والكلى هي البلاعة الأساسية، وعشان كده الـ ==under-excretion== هو السبب الأشهر.
      - kind: sort
        page: 26
        quote: "Inherited isolated renal tubular defect (\"under- excretors\") =75% of 1ry gout."
        prompt: "السبب ده بيقلل الإخراج ولا بيزوّد الإنتاج؟"
        bins: ["↓ Renal excretion (common)", "↑ Production (uncommon)"]
        cards:
          - { text: "Under-excretors (75% of primary gout)", bin: 0 }
          - { text: "Thiazide and loop diuretics", bin: 0 }
          - { text: "Low-dose aspirin", bin: 0 }
          - { text: "Lead toxicity", bin: 0 }
          - { text: "Lactic acidosis (alcohol)", bin: 0 }
          - { text: "Polycythaemia, chronic lymphocytic leukemia (CLL)", bin: 1 }
          - { text: "Over-producers (20%)", bin: 1 }
          - { text: "HGPRT deficiency (Lesch-Nyhan)", bin: 1 }
          - { text: "Glucose-6-phosphatase deficiency", bin: 1 }
        why: "الأغلبية الساحقة بتاعة الـ primary gout هم under-excretors (75%). الـ enzyme defects أقل من 1%، بس هي اللي بتيجي في سؤال «gout في سن صغير»."
      - kind: explain
        page: 26
        quote: "Increased purine turnover: chronic myeloproliferative and lymphoproliferative disorders (polycythaemia, chronic lymphocytic leukaemia)."
        title: "ليه كل سبب بيرفع الـ urate؟"
        text: |
          ارجع للحوض: الـ urate بيعلى لو **الحنفية زادت** أو **البلاعة اتسدت**.

          **البلاعة (أشهر، 75%)**:
          - **Renal failure**: الكلى هي اللي بتطلّع تلتين الـ urate، فلو وقعت يتحبس.
          - **Lactic acidosis (alcohol)** والـ ketoacids: الكتاب بيقول إنها بتقلل الـ **secretion**. التفسير المقبول (مش في الكتاب): بتتنافس مع الـ urate على نفس الـ transporters في الـ tubule.

          **الحنفية (أقل)**:
          - **Myeloproliferative و lymphoproliferative** (polycythaemia، CLL): خلايا كتير بتتولد وتموت، وكل خلية بتموت بتسيب الـ ==purines== بتاعة الـ DNA بتاعها، فالـ urate يزيد.
          - **Enzyme defects** (أقل من 1%): زي Lesch-Nyhan، الإنتاج بيبقى عالي من الولادة، وده سبب الـ gout في سن صغير.

          والنتيجة العملية: لما تلاقي مريض gout، اسأل الأول عن **البلاعة** (الكلى، الأدوية، الكحول) عشان دي 75% من الحالات، وبعدين دوّر على **الحنفية** لو المريض صغير أو عنده تضخم طحال أو صورة دم غريبة.
      - kind: mnemonic
        page: 26
        quote: "Chronic drug therapy: thiazide and loop diuretics, low-dose aspirin, cyclosporine, pyrazinamide."
        word: "CALT"
        hook: "الأدوية اللي بتحبس الـ urate في الكلى: «CALT»، زي «قلت» الإخراج."
        parts:
          - { key: "C", text: "Cyclosporine" }
          - { key: "A", text: "Aspirin (low dose)" }
          - { key: "L", text: "Loop diuretics" }
          - { key: "T", text: "Thiazides … وزوّد عليهم pyrazinamide" }
      - kind: table
        page: 26
        quote: "Reabsorption increase:\n  Volume depletion (diuretics).\n  Metabolic syndrome."
        title: "أربع آليات"
        columns: ["Mechanism", "Example"]
        rows:
          - ["Hyperproduction", "Purine diet, alcohol, MPN"]
          - ["↓ GFR", "CKD"]
          - ["↑ Reabsorption", "Diuretics (volume), metabolic syndrome"]
          - ["↓ Secretion", "Lactate (exercise, alcohol), ketoacids (fasting)"]
        hide: [[2, 1], [3, 1]]
      - kind: aside
        tone: joke
        page: 26
        quote: "Secretion decreased:\n  Lactates increased (exercise, alcohol) and ketoacids (fasting)."
        text: "اللي صام يوم كامل وبعدين عمل تمرين جامد وفطر على فتة ولحمة: ketoacids + lactate + purines. ده مش إفطار، ده بروتوكول لعمل نوبة نقرس."
      - kind: try
        items: [rheum.L02.003, rheum.L02.005, rheum.L02.010, rheum.L02.016, rheum.L02.019]
    recap:
      - "Gout = MSU، pseudogout = CPPD؛ الاتنين crystal synovitis: البلورة ← inflammasome ← IL-1."
      - "رجالة 10:1، 40-50 سنة؛ أشهر inflammatory arthritis فوق 40؛ الستات بعد الـ menopause ومع الـ diuretics."
      - "Hyperuricaemia فوق 6.0 mg/dl، وبس 15% بيجيلهم gout."
      - "Under-excretors 75%، over-producers 20%، enzyme defects أقل من 1%."
      - "CALT: cyclosporine، aspirin، loop، thiazide (+ pyrazinamide)."
    practice: [rheum.L02.001, rheum.L02.002, rheum.L02.003, rheum.L02.004, rheum.L02.005, rheum.L02.006, rheum.L02.007, rheum.L02.008, rheum.L02.009, rheum.L02.010, rheum.L02.011, rheum.L02.012, rheum.L02.013, rheum.L02.014, rheum.L02.015, rheum.L02.016, rheum.L02.017, rheum.L02.018, rheum.L02.019, rheum.L02.020, rheum.L02.145, rheum.L02.146, rheum.L02.147]
