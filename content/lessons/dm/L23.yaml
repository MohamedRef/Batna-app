        quote: "Apheresis Mipomersen Lomitapide"
        text: "الـ **apheresis** زي **غسيل كلوي للدهون**: مكلف ومش متاح في كل حتة، بس الأقوى (70-80%) والوحيد اللي له **cardiac benefit** مثبت و 40 سنة أمان. الـ mipomersen وسطه 25-38%."
      - kind: explain
