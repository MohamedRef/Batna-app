  - id: hb.L07.lesson6
    title: "الـ cirrhosis والحالات اللي ليها قواعد خاصة"
    hook: "في الـ cirrhosis ننسى رقم 2,000 خالص. وفيروس مستخبي من غير HBsAg؟ آه، اسمه occult."
    minutes: 8
    pages: [120, 122]
    topics: [cirrhosis, special]
    goals:
      - "تعرف قواعد علاج الـ HBV في الـ compensated والـ decompensated cirrhosis"
      - "تتعامل مع الـ healthcare worker والـ HBV/HCV coinfection"
      - "تعرّف الـ occult HBV وتعرف بيتلاقي فين"
    status: unverified
    steps:
      - kind: explain
        page: 120
        quote: "need treatment, with any detectable HBV DNA level and regardless of ALT levels. A NA with high barrier to resistance should be used."
        title: "الـ cirrhosis: أي DNA يتعالج"
        text: |
          في الـ cirrhosis القواعد بتتغير خالص:

          - **Who**: compensated or decompensated cirrhosis، مع ==any detectable HBV DNA==، و regardless of ALT.
          - **Which drug**: ==NA with high barrier to resistance==.
          - **And also**: العيان يتقيّم لـ **liver transplantation**.

          قارنها بالـ non-cirrhotic: هناك كنا محتاجين DNA أعلى من 2,000 مع ALT عالي. هنا لا ده ولا ده.
      - kind: reveal
        page: 120
        quote: "Patients with compensated or decompensated cirrhosis need treatment, with any detectable HBV DNA level and regardless of ALT levels."
        prompt: "ليه في الـ cirrhosis بنعالج أي DNA، حتى لو 100 IU/mL والـ ALT طبيعي؟"
        answer: |
          التفسير المقبول: الكبد الـ cirrhotic مالوش احتياطي. أي flare، حتى لو صغير، ممكن يقلبه decompensated.

          وعلشان كده كمان لازم **high barrier to resistance**: لو حصل resistance وطلع flare، التمن هنا غالي جدًا. ده بالظبط سبب إن الـ lamivudine (70% resistance) مش مكانه هنا.
      - kind: explain
        page: 120
        quote: "All NAs must be adjusted to renal function. Approximately 35% of treated patients can be delisted for liver transplantation"
        title: "الـ decompensated"
        text: |
          - **Renal dose**: all NAs must be adjusted to renal function. الـ decompensated عادة كليته على الحافة، والـ NAs بتطلع من الكلى.
          - **Delisting**: حوالي 35% من اللي اتعالجوا اتشالوا من قايمة الـ liver transplantation.
          - **Child-Pugh**: improvement أكتر من 2 points في 40–50% على الأقل.

          يعني حتى في الـ decompensated، العلاج بيفرق بجد.
      - kind: aside
        tone: joke
        page: 120
        quote: "Approximately 35% of treated patients can be delisted for liver transplantation, and an improvement of Child-Pugh Score > 2 was"
        text: |
          **35%** اتشالوا من قايمة الزرع بسبب حباية في اليوم. ده أحسن خبر ممكن يسمعه حد واقف في طابور، أحسن من إن الطابور اتلغى. 😄
      - kind: check
        page: 120
        quote: "need treatment, with any detectable HBV DNA level and regardless of ALT levels. A NA with high barrier to resistance should be used."
        question: "A man with decompensated HBV cirrhosis (Child B, with ascites) has HBV DNA 150 IU/mL and normal ALT. What does the book advise?"
        options:
          - "Start an NA with a high barrier to resistance, adjusted to renal function, and assess for transplant"
          - "No treatment: DNA is below 2,000 IU/mL"
          - "No treatment: ALT is normal"
          - "Start lamivudine because it is cheapest"
        answer: 0
        why:
          - "صح: في الـ cirrhosis **any detectable DNA** و **regardless of ALT**، NA بـ high barrier، dose على الكلى، وتقييم للزرع."
          - "رقم الـ 2,000 للـ non-cirrhotic؛ في الـ cirrhosis أي DNA."
          - "الكتاب بيقول **regardless of ALT levels**."
          - "الـ lamivudine low barrier (70% resistance في 5 سنين)، والكتاب عايز **high barrier**."
      - kind: explain
        page: 121
        quote: "Healthcare workers performing exposure prone procedures with serum HBV DNA > 200 IU/ml may be treated with NA to reduce transmission risk."
        title: "الـ healthcare worker"
        text: |
          - **Who**: **healthcare workers** اللي بيعملوا ==exposure prone procedures== (زي الجراحين).
          - **Cut-off**: HBV DNA > 200 IU/mL.
          - **What**: ممكن ياخدوا **NA** علشان نقلل الـ transmission risk.

          لاحظ: الهدف هنا حماية المرضى اللي بيعملهم عمليات، مش بس الكبد بتاعه. وعلشان كده الرقم واطي جدًا (200 مش 2,000).
      - kind: explain
        page: 121
        quote: "receive NA treatment. HBV infected patients - not fulfilling treatment criteria – receiving DAAs should be monitored and tested for HBV reactivation"
        title: "HBV + HCV coinfection"
        text: |
          علاج الـ HCV بالـ **DAAs** ممكن يعمل ==reactivation of HBV==. فقبل ما تبدأ:

          - **Meets standard criteria for HBV treatment**: ياخد NA.
          - **Does not meet them**: monitored، ولو الـ ALT طلع يتعمله test for HBV reactivation.
      - kind: reveal
        page: 121
        quote: "Treatment of HCV with direct-acting antivirals (DAAs) may cause reactivation of HBV."
        prompt: "إزاي علاج فيروس C يصحّي فيروس B؟"
        answer: |
          التفسير المقبول: الفيروسين بيتنافسوا جوه الكبد، والـ **HCV** كان بيكتم الـ **HBV**.

          لما الـ DAAs تشيل الـ HCV بسرعة، الـ HBV يلاقي الساحة فاضية فيطلع. علشان كده الكتاب بيقول راقب الـ ALT.
      - kind: explain
        page: 122
        quote: "The detection of HBV DNA in the absence of HBsAg. HBV DNA is detected in the liver in most cases"
        title: "الـ occult HBV"
        text: |
          - **Definition**: ==detection of HBV DNA in the absence of HBsAg==.
          - **Where is the DNA**: in the liver في أغلب الحالات. في الـ serum يا مش موجود يا قليل.
          - **Anti-HBc**: عادة positive.
          - **Who**: أشهر في **cirrhosis** أو **HCC**.

          ليه في الـ cirrhosis والـ HCC بالذات؟ الكتاب بيقول إنهم غالبًا كانوا chronic HBV لعشرات السنين، والكبد اتأذى، بس الـ HBsAg كان اختفى لما اتشخّصوا.

          وده بيربط بالـ serology: anti-HBc لوحده في الـ screening ممكن يكون occult HBV، وده شفناه في الدرس التالت.
      - kind: aside
        tone: analogy
        page: 122
        quote: "Anti-HBc Abs are usually +ve. More common among patients with cirrhosis or HCC."
        text: |
          الـ occult HBV زي حرامي رمى الكارنيه (HBsAg) بس بصماته لسه في المكان: DNA في الكبد و **anti-HBc** في الدم.

          فلو عيان عنده cirrhosis أو HCC "من غير سبب" والـ HBsAg سالب، بص على الـ anti-HBc.
      - kind: figure
        page: 121
        quote: "Healthcare workers performing exposure prone procedures with serum HBV DNA > 200 IU/ml may be treated with NA to reduce transmission risk."
        title: "مين ياخد NA في الحالات الخاصة؟"
