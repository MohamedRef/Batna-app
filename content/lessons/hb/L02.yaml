      - kind: explain
        page: 35
        title: "الـ HVPG: الترمومتر الحقيقي"
        quote: "HVPG remains the only validated tool and should not be substituted by NITS"
        text: |
          الـ NITs بتقولك **فيه CSPH ولا لأ**. بس لو عايز تعرف:

          - **severity** الـ portal hypertension بالظبط (فوق مجرد موجود/مش موجود)
          - و **haemodynamic response to treatment** (مثلًا بعد الـ beta-blocker)

          يبقى **HVPG** هو **الأداة الوحيدة الـ validated**، والـ NITs **ما تحلّش محله**. ولو الـ CSPH likely: المريض عنده **increased risk of clinical decompensation**، والـ HVPG هو اللي يقيس الشدة.
