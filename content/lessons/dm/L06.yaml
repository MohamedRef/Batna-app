  # ------------------------------------------------------------------
  - id: dm.L06.lesson1
    title: "4 طرق للقرحة: خريطة الـ diabetic foot"
    hook: "عصب حسي، عصب حركي، عصب autonomic، وشريان: كل واحد بيوصل للقرحة بطريقته."
    minutes: 8
    pages: [66, 68]
    topics: [why, pathway, stages]
    goals:
      - "تعرف ليه الـ neuropathy مهمة وأرقامها"
      - "ترسم الـ pathway من DM لـ DFU بأربع أذرع"
      - "ترتب الـ DF stages وتفرّق wet عن dry necrosis"
    status: unverified
    steps:
      - kind: explain
        page: 66
        title: "ليه نهتم؟"
        quote: "Up to 40-60% of those with diabetes will develop PN."
        text: |
          الـ **neuropathy** من أشهر complications السكر: لحد ==40–60%== من مرضى السكر هيعملوا **peripheral neuropathy**.

          - الألم: **burning، tingling، prickling، dull-aching**
          - بيبدأ في **الرجلين** ويطلع لفوق مع الوقت (stocking pattern)
      - kind: explain
        page: 66
        title: "من الوجع للتنميل"
        quote: "Due to intractable pain, decreased mobility & sleep disorders."
        text: |
          الـ **painful neuropathy** بتبوّظ الـ **quality of life**: **intractable pain**، حركة أقل، ومشاكل نوم.

          وبعدين الأخطر: ==loss of sensation==، والرجل تبقى **insensate**. الوجع كان جرس إنذار، ولما يسكت الرجل تبقى من غير حماية.
      - kind: aside
        tone: analogy
        page: 66
        quote: "Later on, there is ―Loss of Sensation‖."
        text: "زي جرس الحريق: الأول بيزمّر طول الليل ويضايقك (الألم). لما البطارية تخلص بيسكت، بس ده مش معناه إن الحريقة خلصت. الرجل الـ **insensate** هي البيت اللي جرسه فاصل."
      - kind: figure
        page: 67
        quote: "Loss of Protective Sensation Foot Deformities"
        title: "من DM لـ DFU"
        alt: "Pathway diagram. Diabetes splits into PVD and neuropathy. PVD leads to ischaemia then trauma then ulcer, driven by smoking, hypertension and dyslipidemia. Neuropathy splits into sensory (loss of protective sensation, trauma), motor (intrinsic muscle imbalance and wasting, foot deformities, high pressure points) and autonomic (reduced sweating, dry skin, cracks and fissures). All four arms end in diabetic foot ulcer."
        caption: "أربع أذرع بتنتهي في نفس المكان: ==DFU==. الـ PVD عليه smoking و HTN و dyslipidemia، والـ neuropathy ليها 3 أذرع: sensory و motor و autonomic."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L06p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fg-head"/></marker></defs>
