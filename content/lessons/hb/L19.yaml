          الكتاب مش بيشاور على حصوة في الصورة. التفسير المقبول (مش في الكتاب): في الـ gallstone ileus بندوّر في الأشعة على 3 حاجات: أمعاء متوسعة (obstruction)، و ==هوا في القنوات المرارية== (من الـ fistula)، وأحيانًا الحصوة نفسها لو فيها calcium. هنا الأمعاء المتوسعة بس هي اللي باينة.
