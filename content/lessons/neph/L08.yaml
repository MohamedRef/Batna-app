        text: |
          الـ ==mesangial hypercellularity== = **4 nuclei أو أكتر** في **peripheral mesangial segment** واحد. والصورة اللي بعدها في الكتاب فيها **حوالي 16 nuclei** في segment واحد.

          ليه عدد؟ التفسير المقبول (مش في الكتاب): الـ mesangial segment الطبيعي فيه nuclei قليلة (1 لـ 3)، و«زيادة شوية» كلمة مطّاطة كل pathologist يقراها بشكل. لما تحط **رقم**، اتنين pathologists يقولوا نفس الكلام، وده مهم لأن الـ mesangial hypercellularity جزء من **Oxford/MEST** (الـ M) بتاع الـ IgA. وليه الـ mesangium بيتكاثر؟ لأن الـ immune complexes (زي الـ IgA) بتتحجز فيه، فالـ mesangial cells تتنبّه وتتكاثر وتزوّد الـ matrix.

          وخد بالك: **peripheral** segment، مش الـ vascular pole، لأن الـ mesangium عند الـ hilum طبيعي فيه nuclei أكتر.

          ليه بالعدد مش بالعين؟ التفسير المقبول (مش في الكتاب): «الـ mesangium شكله مليان» كلمة شخصية، واتنين pathologists ممكن يختلفوا. الرقم (4 أو أكتر في mesangial area بعيد عن الـ hilum) بيخلي التقرير يتكرر ويتقارن، وده مهم في الـ MEST score بتاع الـ IgA، لأن الـ M1 بيغيّر الـ prognosis. وليه بعيد عن الـ hilum؟ لأن المنطقة عند الـ vascular pole فيها cells زيادة طبيعيًا.
