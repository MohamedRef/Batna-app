      - kind: explain
        remind: [neph.L14.032]
        page: 452
        title: "Glucocorticoids + واحد من دول"
        quote: "Recommendation 10.2.3.1.1: We recommend that patients with active Class III or IV LN, with or without a membranous component, be treated initially with glucocorticoids plus any one of the following:\ni. Mycophenolic acid analogs (MPAAs) (1B); or\nii. Low-dose intravenous cyclophosphamide (1B); or\niii. Belimumab and either MPAA or low-dose intravenous cyclophosphamide (1B); or\niv. MPAA and a calcineurin inhibitor (CNI) when kidney function is not severely impaired (i.e., estimated glomerular filtration rate [eGFR] <45"
        text: |
          1. ==mycophenolic acid analogues (MPAA)== (mycophenolate)
          2. **Low-dose intravenous (IV) cyclophosphamide** (Euro-Lupus)
          3. **Belimumab** + MPAA أو low-dose IV cyclophosphamide
          4. **MPAA + calcineurin inhibitor (CNI)** لو الـ kidney function مش واقعة جامد

          ومع الكل: **hydroxychloroquine** و الـ general measures.

          ليه الـ HCQ مع الكل؟ هتعرف السبب في الخطوة الجاية، وليه أربع طرق مش طريقة واحدة كمان.
      - kind: explain
        page: 452
        title: "ليه أربع طرق؟"
        quote: "Recommendation 10.2.3.1.1: We recommend that patients with active Class III or IV LN, with or without a membranous component, be treated initially with glucocorticoids plus any one of the following:\ni. Mycophenolic acid analogs (MPAAs) (1B); or\nii. Low-dose intravenous cyclophosphamide (1B); or\niii. Belimumab and either MPAA or low-dose intravenous cyclophosphamide (1B); or\niv. MPAA and a calcineurin inhibitor (CNI) when kidney function is not severely impaired (i.e., estimated glomerular filtration rate [eGFR] <45"
        text: |
          كل طريقة بتحل مشكلة مختلفة، والكتاب بيدّي الأربعة نفس قوة التوصية (**1B**):

          - **MPAA:** برشام، ومن غير خطر كبير على الخصوبة.
          - **Low-dose IV cyclophosphamide:** حقن في المستشفى، فالالتزام مضمون.
          - **Belimumab + MPAA أو cyclophosphamide:** دوا تالت للي في خطر أعلى.
          - **MPAA + CNI:** لما الكلية لسه شغالة، والشرط في الكتاب إن الـ function ==not severely impaired== (الـ eGFR مش أقل من **45**).

          ليه شرط الـ eGFR مع الـ CNI؟ التفسير المقبول (مش في الكتاب): الـ CNI بيقفل الـ afferent arteriole وممكن يعمل nephrotoxicity، فالكلية الضعيفة مش هتستحمل.
