            <circle cx="195" cy="55" r="4" class="fg-dot-acc"/><circle cx="212" cy="70" r="4" class="fg-dot-good"/><circle cx="215" cy="50" r="4" class="fg-dot-bad"/>
            <circle cx="280" cy="55" r="4" class="fg-dot-acc"/><circle cx="298" cy="70" r="4" class="fg-dot-good"/><circle cx="300" cy="50" r="4" class="fg-dot-bad"/>
            <circle cx="195" cy="125" r="4" class="fg-dot-acc"/><circle cx="212" cy="140" r="4" class="fg-dot-good"/><circle cx="215" cy="120" r="4" class="fg-dot-bad"/>
            <circle cx="280" cy="125" r="4" class="fg-dot-acc"/><circle cx="298" cy="140" r="4" class="fg-dot-good"/><circle cx="300" cy="120" r="4" class="fg-dot-bad"/>
            <text x="250" y="180" text-anchor="middle" class="t-sm t-mut">whole clusters sampled</text>
          </svg>
      - kind: check
        page: 43
        quote: "Advantages :\nCuts down on the cost of preparing a sampling frame.\nThis can reduce travel and other administrative costs.\nDisadvantages:\nsampling error is higher over a simple random sample of same size."
        question: "What is the main disadvantage of cluster sampling?"
        options: ["Higher sampling error than a simple random sample of the same size", "It needs a complete list of every individual", "It raises travel costs", "It cannot be random"]
        answer: 0
        why:
          - "صح: الناس جوه الـ cluster الواحدة شبه بعض أكتر، فالـ sampling error أعلى."
          - "بالعكس، ميزته إنه بيوفّر تكلفة تجهيز الـ sampling frame."
          - "بالعكس، بيقلل الـ travel والتكاليف الإدارية."
          - "الـ clusters نفسها بتتختار random."
      - kind: explain
        page: 44
        quote: "Two types of cluster sampling methods.\nOne-stage sampling. All of the elements within selected clusters are included in the sample.\nTwo-stage sampling. A subset of elements within selected clusters are randomly selected for inclusion in the sample."
        title: "One-stage ولا two-stage؟"
        text: |
          - **One-stage**: كل الناس جوه الـ clusters المختارة بيدخلوا.
          - **Two-stage**: بتسحب **random** جزء من الناس جوه كل cluster مختار.

          مثال الشريحة: الـ **immunization coverage** في محافظة = **30 cluster × 7 أطفال** (12–23 شهر).
      - kind: explain
        page: 47
        quote: "Is done in successive stages; each successive sampling unit is nested in the previous sampling unit\nAdvantage: Introduces flexibility in sampling\nFor example, in large country surveys, states are chosen, then districts, then villages, then every 10th person in village as final sampling unit\nin a school survey: Districts schools classes students by systmatic random technique"
        title: "5. Multistage sampling"
        text: |
          ==Multistage sampling== = sampling على **مراحل**، كل وحدة **جوه** اللي قبلها، وميزته الـ **flexibility**.

          - في survey على مستوى دولة: محافظات ← مراكز ← قرى ← كل عاشر واحد في القرية.
          - في survey على المدارس: districts ← schools ← classes ← students (بالـ systematic random).
      - kind: check
        page: 30
        quote: "Dividing up the population into smaller groups (Strata) , and randomly sampling from each group.\nStratified sampling is only possible when we know what proportion of the study population belongs to each group we are interested in."
        question: "People are separated into sub-groups and some are selected randomly from each sub-group. Which sampling is this?"
        options: ["Stratified random sampling", "Cluster random sampling", "Systematic random sampling", "Simple random sampling"]
        answer: 0
        why:
          - "صح: sub-groups + random من **كل** واحدة = stratified."
          - "الـ cluster بياخد **بعض** المجموعات كاملة، مش من كلها."
          - "الـ systematic كل K واحد من list."
          - "الـ simple random مفيهوش sub-groups."
      - kind: try
        items: [res.L11.026, res.L11.031, res.L11.034, res.L11.036, res.L11.040]
    recap:
