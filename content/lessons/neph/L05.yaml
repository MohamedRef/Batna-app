  - id: neph.L05.lesson3
    title: "امنع الأول، وبعدين عالج صح"
    hook: "An ounce of prevention is worth a pound of cure. نص علاج الـ AKI هو إنك ما تعملش حاجات غلط."
    minutes: 10
    pages: [110, 115]
    topics: [prevention, treatment, dialysis]
    goals:
      - "تحفظ regimens منع الـ contrast nephropathy وقواعد الـ aminoglycosides"
      - "تعالج الـ AKI: fluids، pressors، ومن غير dopamine ولا diuretics على الفاضي"
      - "تعرف الـ furosemide stress test ودواعي الـ dialysis (AEIOU)"
    status: unverified
    steps:
      - kind: table
        page: 110
        quote: "Normal saline regimen: 1ml/kg/h for 12hours before and after procedure"
        title: "منع الـ contrast-induced nephropathy"
        columns: [Regimen, How]
        rows:
          - ["Normal saline", "1 ml/kg/h, 12 h before and 12 h after"]
          - ["Sodium bicarbonate", "3 ml/kg/h × 1 h before, then 1 ml/kg/h × 6 h after"]
          - ["N-acetylcysteine", "600–1200 mg PO q12h × 2–3 days, 2 doses before"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: update
        page: 110
        quote: "N-acetylcysteine (600-1200mg orally every 12 hours for 2-3 days, the first two doses precontrast)"
        text: "الـ **PRESERVE trial (2018)**: الـ bicarbonate مش أحسن من الـ saline، والـ **N-acetylcysteine** مش أحسن من الـ placebo. الـ ACR-NKF 2020 بيوصّي بـ isotonic volume expansion للـ high risk ومش بيوصّي بالـ NAC. في الامتحان جاوب بالـ regimens اللي في الكتاب."
        ref: "PRESERVE trial 2018; ACR-NKF consensus 2020"
      - kind: explain
        page: 111
        title: "الـ ICU والـ aminoglycosides"
        quote: "KDIGO suggests using single dose daily rather than multiple-dose daily treatment regimens"
        text: |
          - في الـ ICU: **glucose 110–149 mg/dl** بالـ insulin.
          - الـ **aminoglycosides**: ما تستخدمهاش لو فيه بديل أقل nephrotoxic، وابعد عنها فوق ==65 سنة==، والـ DM، والـ septic shock.
          - لو لازم: ==single daily dose==، و topical أو local (aerosol، beads) لو ينفع.
      - kind: explain
        page: 111
        title: "تلات قواعد عامة"
        quote: "Elimination of nephrotoxic agents (e.g., ACE inhibitors, ARBS, NSAIDs, aminoglycosides) if possible"
        text: |
          1. ظبّط الـ **hemodynamics**: fluids و vasopressors بعقل.
          2. ==وقّف الـ nephrotoxic agents==: ACE inhibitors، ARBs، NSAIDs، aminoglycosides.
          3. ابدأ **RRT** لما يكون فيه indication.
      - kind: explain
        page: 111
        title: "Fluids و pressors"
        quote: "KDIGO suggest using isotonic crystalloids rather than colloids (albumin or starches)"
        text: |
          - ==Isotonic crystalloids== قبل الـ colloids. الـ colloids لو محتاج volume كبير، أو cirrhosis مع SBP، أو burns.
          - الـ **albumin** renoprotective، والـ hyperoncotic **starch** nephrotoxic.
          - لو shock بعد الـ resuscitation: **MAP 65–70**، والـ ==norepinephrine== أحسن من الـ dopamine (adverse events أقل).
      - kind: aside
        tone: trap
        page: 112
        quote: "KDIGO recommends not using low-dose dopamine to prevent or treat AKI. (1A)"
        text: |
          "**Renal-dose dopamine**" إجابة غلط دايمًا: KDIGO ==بيوصّي ضدها== للـ prevention والـ treatment، **grade 1A**.
      - kind: explain
        page: 112
        title: "HRS و CRS"
        quote: "all in combination with intravenous albumin (maximum 100 g/d)"
        text: |
          - **SBP:** الـ albumin مع الـ antibiotics ممكن يمنع الـ AKI.
          - **HRS bridge:** ==terlipressin==، أو octreotide + midodrine، أو norepinephrine، وكلهم مع **IV albumin** (max 100 g/d).
          - **Cardiorenal:** ظبّط القلب: inotropes، preload و afterload reduction، antiarrhythmics، و **IABP**.
      - kind: table
        page: 113
        quote: "KDIGO recommend not using diuretics to prevent AKI. (1B)"
        title: "الـ diuretics في الـ AKI"
        columns: [Use, KDIGO, Grade]
        rows:
          - ["Prevent AKI", "Not recommended", "1B"]
          - ["Treat AKI", "Not suggested, except volume overload", "2C"]
        hide: [[0, 2], [1, 1], [1, 2]]
      - kind: figure
        page: 113
        quote: "Use of furosemide stress test to guide resuscitation"
        title: "Furosemide stress test"
        alt: "Flowchart. Adequately resuscitated oliguric patient gets furosemide 1 mg per kg if naive or 1.5 mg per kg if not. More than 200 ml urine in 2 hours means passed, pre-renal oliguria. Less than 200 ml means failed, intrinsic renal failure."
        caption: "لو ==فشل== والبول أقل من **200 ml** في ساعتين، زيادة الـ fluids أو الـ pressors مش هتعلّي البول، والـ urine output مش مقياس perfusion."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L05b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="40" y="10" width="250" height="44" rx="8" class="fg-box"/>
            <text x="165" y="28" text-anchor="middle" class="t-sm">Resuscitated, still oliguric</text>
            <text x="165" y="46" text-anchor="middle" class="t-sm t-mut">fluid challenge unlikely to help</text>
            <line x1="165" y1="54" x2="165" y2="74" class="fg-arrow" marker-end="url(#L05b)"/>
            <rect x="40" y="78" width="250" height="44" rx="8" class="fg-acc"/>
            <text x="165" y="96" text-anchor="middle" class="t-sm t-b">Furosemide IV bolus</text>
            <text x="165" y="114" text-anchor="middle" class="t-sm">naive 1 mg/kg · not naive 1.5 mg/kg</text>
            <line x1="120" y1="122" x2="85" y2="152" class="fg-arrow" marker-end="url(#L05b)"/>
            <line x1="210" y1="122" x2="245" y2="152" class="fg-arrow" marker-end="url(#L05b)"/>
            <rect x="10" y="156" width="150" height="84" rx="8" class="fg-good"/>
            <text x="85" y="178" text-anchor="middle" class="t-sm t-b">&gt;200 ml / 2 h</text>
            <text x="85" y="198" text-anchor="middle" class="t-sm">Passed</text>
            <text x="85" y="218" text-anchor="middle" class="t-sm">Pre-renal oliguria</text>
            <rect x="170" y="156" width="150" height="84" rx="8" class="fg-bad"/>
            <text x="245" y="178" text-anchor="middle" class="t-sm t-b">&lt;200 ml / 2 h</text>
            <text x="245" y="198" text-anchor="middle" class="t-sm">Failed</text>
            <text x="245" y="218" text-anchor="middle" class="t-sm">Intrinsic renal failure</text>
          </svg>
      - kind: explain
        page: 114
        title: "Fenoldopam و rhabdo"
        quote: "Aggressive volume repletion (may require 10 L of fluid per day)"
        text: |
          - **Fenoldopam:** pure **D1 agonist** من غير adrenergic stimulation. الدراسات مش حاسمة، وفي الـ critically ill الـ infusion أحسن من الـ low-dose dopamine.
          - **Rhabdomyolysis:** ==fluids كتير (لحد 10 L/day)==، والـ alkaline fluids مفيدة. diuretics بس لو الـ fluids كفاية ومفيش بول، و dialysis، وراقب الـ **calcium و phosphate**.
      - kind: update
        page: 114
        quote: "Fenoldopam mesylate is a pure dopamine type-1 receptor agonist"
        text: "الكتاب كاتب الجرعة **0.1 mg/kg/min**، والجرعة المعروفة **0.1 µg/kg/min** (micrograms). والـ **KDIGO 2012** بيقترح ما تستخدمش الـ fenoldopam للـ prevention أو الـ treatment (2C)."
        ref: "KDIGO AKI guideline 2012"
      - kind: explain
        page: 114
        title: "أسباب ليها علاج خاص"
        quote: "AKI due to scleroderma (scleroderma renal crisis) should be treated with ACE inhibitors"
        text: |
          - **GN / vasculitis:** immunosuppression و/أو plasmapheresis.
          - **Allergic AIN:** وقّف الدوا.
          - **Scleroderma renal crisis:** ==ACE inhibitors==، الاستثناء اللي بنديه فيه رغم الـ AKI.
          - **Postrenal:** فكّ الانسداد بسرعة، وجهّز fluids و electrolytes للـ diuresis اللي بعدها.
      - kind: mnemonic
        page: 115
        quote: "Intoxications (lithium, ethylene glycol, etc)"
        word: "AEIOU"
        parts:
          - { key: "A", text: "Acidosis" }
          - { key: "E", text: "Electrolytes, usually hyperkalemia" }
          - { key: "I", text: "Intoxications (lithium, ethylene glycol)" }
          - { key: "O", text: "Overload (volume)" }
          - { key: "U", text: "Uremia (symptoms, signs)" }
        hook: "الحروف المتحركة الخمسة بالإنجليزي. لو العيان قال أيّ واحد فيهم ومش بيتصلّح بالعلاج، يبقى محتاج dialysis."
      - kind: check
        page: 115
        quote: "Hemodynamically stable- IHD"
        question: "AKI with K 7.0 refractory to treatment, BP 80/50 on norepinephrine. Mode?"
        options:
          - "Intermittent hemodialysis"
          - "CRRT, PD or SLED"
          - "No dialysis while on pressors"
        answer: 1
        why:
          - "الـ IHD للـ hemodynamically stable."
          - "صح: الـ unstable ياخد CRRT أو PD أو SLED."
          - "الـ hyperkalemia الـ refractory دي indication، والـ mode بس هو اللي بيتغير."
      - kind: explain
        page: 115
        title: "الـ prognosis"
        quote: "10% of cases requiring dialysis develop ckd"
        text: |
          - الـ **prerenal** والـ **postrenal** أحسن.
          - الكلى ممكن ترجع حتى بعد AKI محتاج dialysis.
          - ==10%== من اللي احتاجوا dialysis بيبقى عندهم CKD.
          - ممكن يحصل death بدري حتى بعد ما الوظيفة ترجع كاملة.
      - kind: try
        items: [neph.L05.072, neph.L05.080, neph.L05.088, neph.L05.093, neph.L05.127]
    recap:
      - "CIN: saline 1 ml/kg/h 12 h قبل وبعد، أو bicarbonate 3 ثم 1 ml/kg/h؛ NAC 600–1200 q12h."
      - "Aminoglycosides: لو فيه بديل ابعد، ولو لازم single daily dose."
      - "Crystalloids قبل colloids، MAP 65–70، norepinephrine مش dopamine."
      - "No low-dose dopamine (1A)، no diuretics للـ prevention (1B) أو العلاج (2C) إلا للـ overload."
      - "FST فشل = أقل من 200 ml في ساعتين = intrinsic. Dialysis = AEIOU؛ unstable ياخد CRRT/PD/SLED."
    practice: [neph.L05.066, neph.L05.067, neph.L05.068, neph.L05.069, neph.L05.070, neph.L05.071, neph.L05.072, neph.L05.073, neph.L05.074, neph.L05.075, neph.L05.076, neph.L05.077, neph.L05.078, neph.L05.079, neph.L05.080, neph.L05.081, neph.L05.082, neph.L05.083, neph.L05.084, neph.L05.085, neph.L05.086, neph.L05.087, neph.L05.088, neph.L05.089, neph.L05.090, neph.L05.091, neph.L05.092, neph.L05.093, neph.L05.094, neph.L05.095, neph.L05.096, neph.L05.097, neph.L05.098, neph.L05.099, neph.L05.127, neph.L05.128, neph.L05.132]
  # ------------------------------------------------------------------
  - id: neph.L05.lesson4
    title: "الكرياتينين بيوصل متأخر"
    hook: "ساعة الكرياتينين دايمًا متأخرة. الـ biomarkers والـ renal reserve بيقولولك اللي حصل قبلها."
    minutes: 8
    pages: [116, 126]
    topics: [biomarkers, reserve]
    goals:
      - "تشرح ليه الكرياتينين marker متأخر"
      - "تعرف الـ cystatin C و NGAL و KIM-1 و TIMP-2×IGFBP7"
      - "تقيس الـ renal functional reserve وتصنّف الـ recovery"
    status: unverified
    steps:
      - kind: explain
        page: 116
        title: "أدوات جديدة من 2012"
        quote: "RISK ASSESSMENT TOOLS SINCE 2012"
        text: |
          الحالات زادت (156 ← 925 بين السبعينات والتمانينات) والـ mortality فضلت **فوق 50%**. علشان كده ظهرت أدوات جديدة:
          - **Renal angina index**
          - ==Renal functional reserve== assessment
          - **New biomarkers:** [TIMP-2]×[IGFBP7]
      - kind: order
        page: 118
        quote: "Multiple Timezones of AKI and Organ Damage Clock"
        prompt: "رتّب ساعة الضرر بعد الـ insult، من الأبدر للأخر:"
        steps:
          - "Damage"
          - "GFR falls"
          - "Oliguria"
          - "Creatinine rises"
        why: "الضرر بيبدأ الساعة 10 الصبح، وبعدين الـ GFR بينزل، وبعدين الـ oliguria، والـ ==creatinine== آخر واحد بيعلى (1 بالليل). الكرياتينين ساعته دايمًا متأخرة."
      - kind: explain
        page: 117
        title: "Function ولا damage؟"
        quote: "Biomarkers are Foot Prints of Actual Organ Damage"
        text: |
          - الـ **creatinine** = functional marker، بيتأثر متأخر وممكن ما يتأثرش خالص بسبب الـ ==renal reserve==.
          - الـ **biomarkers** = ==footprints== للضرر نفسه.
          - وفيه ارتفاع **creatinine** من غير ضرر: prerenal، HRS، CRS، RAAS inhibition.
      - kind: table
        page: 121
        quote: "Considered equivalent to troponin in acute coronary syndrome"
        title: "الـ biomarkers المهمين"
        columns: [Marker, Key fact]
        rows:
          - ["Cystatin C", "Detects AKI 24–48 h before creatinine, even while creatinine is normal"]
          - ["NGAL", "In plasma and urine within 2 h of bypass AKI; the kidney's troponin"]
          - ["KIM-1", "Type 1 transmembrane glycoprotein; marks severity, predicts outcomes"]
          - ["[TIMP-2]×[IGFBP7]", ">0.3 = risk of moderate to severe AKI within 12 h"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: joke
        page: 121
        quote: "Considered equivalent to troponin in acute coronary syndrome"
        text: |
          الـ **NGAL** هو ==troponin== الكلية: بيطلع بعد ساعتين من الـ bypass، والكرياتينين لسه بيشرب شاي في الكافيتيريا.
      - kind: check
        page: 120
        quote: "Allows detection of AKI, 24-48 hours earlier than serum creatinine"
        question: "Which marker is a better functional surrogate than creatinine for early, subtle GFR change?"
        options:
          - "Cystatin C"
          - "KIM-1"
          - "Urine sodium"
        answer: 0
        why:
          - "صح: الـ cystatin C بيكشف الـ AKI قبل الكرياتينين بـ 24–48 ساعة، حتى والكرياتينين normal."
          - "الـ KIM-1 marker للـ severity والـ outcomes."
          - "الـ urine sodium بيفرّق prerenal عن ATN."
      - kind: explain
        page: 122
        title: "الـ biomarker بيغيّر العلاج"
        quote: "Preventive strategy performed in high risk on pump cardiac surgery patients-single center trial"
        text: |
          في عيانين cardiac surgery الـ **[TIMP-2]×[IGFBP7] ≥0.3** اتعملهم ==KDIGO care bundle==:
          - وقف ACEi/ARBs لـ 48 ساعة
          - optimize volume و perfusion لـ 12 ساعة، و PiCCO لو لزم
          - راقب SCr و UO، وامنع hyperglycemia لـ 72 ساعة، وبدائل للـ contrast

          الـ AKI نزل من **71% لـ 55.1%**، والـ moderate–severe من **44.9% لـ 29.7%**.
      - kind: figure
        page: 123
        quote: "Renal function reserve"
        title: "الـ renal functional reserve"
        alt: "Two bars. Baseline GFR is the lower bar; after an oral protein load of 1.2 g per kg, stimulated GFR is the taller bar. The difference between them is the renal functional reserve."
        caption: "**RFR = stimulated GFR − baseline GFR** بعد protein load ==1.2 g/kg==. الكلية ممكن تبان طبيعية والـ reserve خلصان."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <line x1="40" y1="200" x2="310" y2="200" class="fg-ink"/>
            <rect x="70" y="100" width="70" height="100" rx="4" class="fg-box"/>
            <text x="105" y="218" text-anchor="middle" class="t-sm">Baseline</text>
            <text x="105" y="155" text-anchor="middle" class="t-sm t-b">GFR</text>
            <rect x="200" y="100" width="70" height="100" rx="4" class="fg-box"/>
            <rect x="200" y="40" width="70" height="60" rx="4" class="fg-good"/>
            <text x="235" y="75" text-anchor="middle" class="t-sm t-b">RFR</text>
            <text x="235" y="155" text-anchor="middle" class="t-sm">baseline</text>
            <text x="235" y="218" text-anchor="middle" class="t-sm">Stimulated</text>
            <text x="165" y="28" text-anchor="middle" class="t-sm t-mut">oral protein 1.2 g/kg</text>
          </svg>
      - kind: table
        page: 124
        quote: "Full Recovery (Baseline GFR >90 ml/min & RFR >30 ml/min)"
        title: "رجعت إزاي بعد الـ AKI؟"
        columns: [Category, Baseline GFR, RFR]
        rows:
          - ["Full recovery", ">90", ">30"]
          - ["Apparent full recovery", ">90", "<30"]
          - ["Kidney recovery", ">60", "-"]
          - ["Non-recovery", "<60", "<30"]
        hide: [[0, 2], [1, 2], [3, 1]]
      - kind: check
        page: 124
        quote: "Full Recovery (Baseline GFR >90 ml/min & RFR >30 ml/min)"
        question: "GFR 98 ml/min; after a protein load it rises to 140. Recovery class?"
        options:
          - "Full recovery"
          - "Apparent full recovery"
          - "Non-recovery"
        answer: 0
        why:
          - "صح: GFR >90 و RFR = 42، يعني أكتر من 30، يبقى full recovery."
          - "الـ apparent full recovery لما الـ RFR <30."
          - "الـ non-recovery لما الـ GFR <60."
      - kind: explain
        page: 125
        title: "الـ stress test مفيد فين؟"
        quote: "To evaluate living kidney donors to make sure no problem will occur to the donor and the recipient after transplantation"
        text: |
          - **Silent disease** في الـ high risk: HTN، DM، PKD، solitary kidney، CKD.
          - ==Living kidney donors==.
          - قبل **high-risk surgery** أو **contrast**: RFR <15 = خطر AKI ==11.8 مرة== بعد cardiac surgery.
          - تقييم الـ recovery بعد الـ AKI.
      - kind: explain
        page: 126
        title: "خد معاك"
        quote: "No role of low dose dopamine, diuretics in prevention and treatment"
        text: |
          1. شخّص بدري: الـ **biomarkers** ليها مستقبل.
          2. دوّر على السبب.
          3. ==Prevent rather than treat==.
          4. تابع كويس اللي رجع جزئيًا.
          5. مفيش دور للـ **low-dose dopamine** ولا الـ **diuretics**.
          6. ابدأ **RRT** لما يكون فيه indication.
      - kind: try
        items: [neph.L05.103, neph.L05.108, neph.L05.112, neph.L05.122, neph.L05.129]
    recap:
      - "الترتيب: damage ← GFR ← oliguria ← creatinine؛ ساعة الكرياتينين دايمًا متأخرة."
      - "Cystatin C بيسبق الكرياتينين بـ 24–48 h؛ NGAL بعد ساعتين = troponin الكلية."
      - "KIM-1 للـ severity؛ TIMP-2×IGFBP7 >0.3 = AKI في 12 h."
      - "RFR = stimulated − baseline GFR بعد protein 1.2 g/kg."
      - "Full recovery: GFR >90 و RFR >30؛ لو RFR <30 تبقى apparent."
