            <text x="280" y="232" class="t-b">IV</text>
          </svg>
      - kind: figure
        page: 193
        title: "صورة الكتاب: الـ Ann Arbor stages"
        image: { file: hem/L12-ann-arbor.webp, book: true }
        alt: "Book drawing of four body outlines side by side, labelled Stage I to Stage IV, with purple dots for involved lymph nodes. Stage I: one group in the neck. Stage II: neck and mediastinal groups above the diaphragm. Stage III: neck nodes plus abdominal and pelvic nodes on both sides of the diaphragm. Stage IV: widespread nodes plus a large purple liver and spleen."
        caption: |
          الأصل اللي الرسمة اللي فوق مبسّطاه: أربع أجسام من الشمال لليمين، والنقط البنفسجي هي الغدد المصابة:

          - **Stage I** (أول جسم): مجموعة واحدة في **الرقبة**.
          - **Stage II**: مجموعتين أو أكتر **فوق الحجاب الحاجز** (رقبة وصدر).
          - **Stage III**: غدد **فوق وتحت** الحجاب (رقبة + بطن وحوض).
          - **Stage IV** (آخر جسم): الغدد منتشرة، و ==الكبد والطحال== ملوّنين بنفسجي كله = extralymphatic.

          يعني السؤالين: الغدد على ==جانب واحد من الحجاب== ولا الجانبين؟ وفيه عضو برّه الـ lymph system ولا لأ؟
      - kind: explain
        page: 193
        quote: "Patients are said to be stage (A) if they have no systemic symptoms, or stage (B) in the presence of any one of; night sweats, fever or weight loss (10% in past 6 months)."
        title: "A ولا B؟"
        text: |
          - **A**: مفيش systemic symptoms.
          - ==B==: واحدة بس تكفي من: **night sweats**، **fever**، أو **weight loss 10% في آخر 6 شهور**.

          ليه الـ B بتفرق؟ التفسير المقبول (مش في الكتاب): الأعراض دي جاية من **cytokines** بيطلعها الورم أو الخلايا اللي حواليه، يعني المرض بقى بيأثر على **الجسم كله** مش على الغدة بس. وعشان كده في الـ Hodgkin الكتاب بيحط **IIB** مع الـ advanced (ص 198): نفس عدد الغدد، بس الـ B قلبت الخطة.
      - kind: aside
        tone: trap
        page: 193
        quote: "Patients are said to be stage (A) if they have no systemic symptoms, or stage (B) in the presence of any one of; night sweats, fever or weight loss (10% in past 6 months)."
        text: "الـ pruritus والـ fatigue أعراض موجودة في الـ Hodgkin، بس مش B symptoms. الـ B تلاتة بس: سخونية، عرق بالليل، ووزن 10% في 6 شهور."
      - kind: check
        page: 193
        quote: "Ann Arbor staging classification:\n  Stage III: Involvement of lymph node groups on both sides of the diaphragm.\n  Stage IV: Involvement of extralymphatic sites e.g. bone marrow or liver."
        question: "Axillary and inguinal nodes, no symptoms. Stage?"
        options: ["IIIA", "IIA", "IIIB", "IA"]
        answer: 0
        why:
          - "صح: الإبط فوق الحجاب والـ inguinal تحته = III، ومفيش أعراض = A."
          - "الـ II لازم الاتنين على جانب واحد."
          - "مفيش أعراض، يبقى A."
          - "دول مجموعتين مش واحدة."
      - kind: reveal
        page: 192
        quote: "Stage I: Involvement of a single lymph node group.\n  Stage II: Involvement of two or more lymph node groups on one side of the\n  diaphragm."
        prompt: "ليه الـ Ann Arbor اختار الحجاب الحاجز بالذات خط فاصل بين II و III؟"
        answer: |
          التفسير المقبول (مش في الكتاب): لأن المرض اللي على **جانب واحد** ممكن يتغطى بـ **field واحد** من الـ radiotherapy، أما لو عدّى للجانبين فبيبقى منتشر محتاج **chemotherapy** للجسم كله.

          وده بيوصلك لعلاج الـ Hodgkin في ص 198: الـ **early (IA/IIA)** ممكن radiotherapy، والـ **advanced** (من IIB لـ IV) ABVD. يعني الـ stage مش اسم، ده قرار علاج.
      - kind: explain
        remind: [hem.L12.020]
        page: 193
        quote: "International Prognostic Index\nExtranodal disease:\n  Disease outside lymphatic sites confers a poor prognosis.\nAdvanced stage disease:\n  Worse prognosis.\nElevated LDH:\n  Worse prognosis.\nAge:\n  Increasing age is associated with worse prognosis."
        title: "International Prognostic Index"
        text: |
          الكتاب بيعد أربع حاجات بتخلّي الـ prognosis أوحش:

          - ==Extranodal disease==
          - **Advanced stage**
          - **Elevated LDH**
          - **Increasing age**

          لاحظ إن التلاتة الأولانيين بيقيسوا **المرض** (انتشر برّه الغدد، stage متقدم، LDH = حجم وسرعة)، والرابع بيقيس **المريض**: التفسير المقبول (مش في الكتاب) إن الكبير بيستحمل الـ chemo أقل، فبياخد جرعة أقل أو بيوقفها بدري.
      - kind: update
        page: 193
        quote: "International Prognostic Index\nExtranodal disease:\n  Disease outside lymphatic sites confers a poor prognosis.\nAdvanced stage disease:\n  Worse prognosis.\nElevated LDH:\n  Worse prognosis.\nAge:\n  Increasing age is associated with worse prognosis."
        text: "الـ International Prognostic Index (IPI) الأصلي خمس نقط: age > 60، Eastern Cooperative Oncology Group (ECOG) performance status ≥ 2، stage III-IV، LDH عالي، و > 1 extranodal site. الكتاب ذكر أربعة من غير الـ performance status."
        ref: "International Non-Hodgkin's Lymphoma Prognostic Factors Project, NEJM 1993"
