    tags: [numbers]
  - id: dm.L23.007
    kind: mcq
    topic: risk
    stem: "A 45-year-old with heterozygous FH, no ASCVD and no other risk factor. His ESC/EAS 2019 risk category?"
    options: [High, Very high, Moderate, Low]
    answer: 0
    why:
      - "Correct: FH without other major risk factors = high risk."
      - "Very high needs FH with ASCVD or another major risk factor."
      - "FH alone is never moderate."
      - "FH alone is never low."
    src: { page: 284, quote: "Patients with FH without other major risk factors." }
    status: unverified
  - id: dm.L23.008
    kind: mcq
    topic: risk
    stem: "A 60-year-old with T2DM for 6 years has retinopathy and microalbuminuria. ESC/EAS 2019 category?"
    options: [Very high, High, Moderate, Low]
    answer: 0
    why:
      - "Correct: DM with target organ damage is very high risk."
      - "High is DM without organ damage (duration ≥ 10 years or another RF)."
      - "Moderate is young patients with short DM and no risk factors."
      - "Diabetes is never low risk in this table."
    src: { page: 283, quote: "DM with target organ damage,* or at least three major risk factors, or early onset of T1DM of long duration" }
    status: unverified
  # ---------- p284-285: LDL-C goals ----------
  - id: dm.L23.009
    kind: table
    topic: goals
    title: "ESC/EAS 2019 LDL-C goals"
    columns: [Risk, LDL-C goal, Also]
    rows:
      - [Very high, "< 55 mg/dL (1.4 mmol/L)", "≥ 50% reduction from baseline"]
      - [High, "< 70 mg/dL (1.8 mmol/L)", "≥ 50% reduction from baseline"]
      - [Moderate, "< 100 mg/dL (2.6 mmol/L)", "-"]
      - [Low, "< 116 mg/dL (3.0 mmol/L)", "-"]
    blanks: [[0, 1], [0, 2], [1, 1], [2, 1], [3, 1]]
    src: { page: 284, quote: "an LDL-C reduction of ≥50% from baseline and an LDL-C goal of <1.4 mmol/L (<55 mg/dL) are recommended" }
    status: unverified
    tags: [high-yield, numbers]
  - id: dm.L23.010
    kind: cloze
    topic: goals
    text: "ASCVD patients with a second vascular event within {{c1::2 years}} on maximally tolerated statin therapy: an LDL-C goal of {{c2::< 40 mg/dL (1.0 mmol/L)}} may be considered."
    src: { page: 284, quote: "experience a second vascular event within 2 years" }
    status: unverified
    tags: [numbers]
  - id: dm.L23.011
    kind: card
    topic: goals
    front: "Very-high-risk patients get two LDL-C targets at once (ESC/EAS 2019). What are they?"
    back: "A ≥ 50% reduction from baseline AND an absolute LDL-C below 55 mg/dL (1.4 mmol/L). Both apply in secondary and primary prevention, and in FH at very high risk (should be considered)."
    src: { page: 284, quote: "In primary prevention for individuals with FH at very-high risk, an LDL-C reduction of ≥50% from baseline" }
    status: unverified
  - id: dm.L23.012
    kind: mcq
    topic: goals
    stem: "Moderate-risk patient by ESC/EAS 2019. Which LDL-C goal should be considered?"
    options: ["< 100 mg/dL", "< 116 mg/dL", "< 70 mg/dL", "< 55 mg/dL"]
    answer: 0
    why:
      - "Correct: moderate risk < 2.6 mmol/L (< 100 mg/dL)."
      - "That is the low-risk goal (< 3.0 mmol/L)."
      - "That is high risk."
      - "That is very high risk."
    src: { page: 284, quote: "In individuals at moderate risk, an LDL-C goal of <2.6 mmol/L (<100 mg/dL) should be considered." }
    status: unverified
  # ---------- p285: diabetes recommendations ----------
  - id: dm.L23.013
    kind: cloze
    topic: diabetes
    text: "ESC/EAS 2019: in T2DM at very-high risk, LDL-C reduction {{c1::≥ 50%}} and goal {{c2::< 55 mg/dL}}; at high risk, ≥ 50% and goal {{c3::< 70 mg/dL}}."
    src: { page: 285, quote: "In patients with T2DM at high risk, an LDL-C reduction of ≥50% from baseline and an LDL-C goal of <1.8 mmol/L (<70 mg/dL)" }
    status: unverified
    tags: [high-yield]
  - id: dm.L23.014
    kind: card
    topic: diabetes
    front: "Diabetic above goal on a statin: what comes first, intensifying the statin or adding a drug (ESC/EAS 2019)?"
    back: Intensify the statin first; if the goal is still not reached, add ezetimibe.
    src: { page: 285, quote: "Intensification of statin therapy should be considered before the introduction of combination therapy." }
    status: unverified
  - id: dm.L23.015
    kind: card
    topic: diabetes
    front: In which diabetic patients is statin therapy NOT recommended (ESC/EAS 2019)?
    back: Premenopausal women with diabetes who are considering pregnancy or are not using adequate contraception.
    src: { page: 285, quote: "Statin therapy is not recommended in premenopausal patients with diabetes who are considering pregnancy" }
    status: unverified
    tags: [high-yield]
  - id: dm.L23.016
    kind: card
    topic: diabetes
    front: When may a statin be considered in a diabetic aged 30 or younger (ESC/EAS 2019)?
    back: "T1DM or T2DM aged ≤ 30 with end-organ damage and/or LDL-C > 2.5 mmol/L (about 100 mg/dL), as long as pregnancy is not planned."
    src: { page: 285, quote: "Statin therapy may be considered in both T1DM and T2DM patients aged ≤30 years with evidence of end organ damage" }
    status: unverified
  - id: dm.L23.017
    kind: card
    topic: diabetes
    front: Which T1DM patients are statins recommended for (ESC/EAS 2019)?
    back: T1DM patients at high or very-high CV risk.
    src: { page: 285, quote: "Statins are recommended in patients with T1DM who are at high or very-high risk" }
    status: unverified
