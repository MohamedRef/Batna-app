  - id: rheum.L13.lesson2
    title: "الـ Power Doppler: إشارة حمرا يعني نار"
    hook: "مريضة RA بتقولك أنا كويسة، والكشف كمان كويس. الـ Doppler ليه رأي تاني."
    minutes: 7
    pages: [214, 219]
    topics: [doppler, decisions]
    goals:
      - "تفهم الـ PD بيضيف إيه وإزاي بنقيّمه من 0 لـ 3"
      - "تعرف دور الـ MSUS في القرار وفي الـ tapering"
      - "تحل أسئلة الكتاب عن الـ MSUS"
    status: unverified
    steps:
      - kind: explain
        page: 214
        quote: "Power Doppler is more sensitive than color Doppler in detecting slow flow in small vessels and is essential for scoring disease activity."
        title: "الـ Power Doppler"
        text: |
          الـ ==power Doppler== بيضيف **functional data**: بيشوف الدم في الأنسجة الملتهبة.

          - **Synovial vascularity**.
          - الاستجابة للعلاج: **PD بيقل = remission**.
          - أحسن من الـ **colour Doppler** في الـ slow flow في الأوعية الصغيرة، وأساسي في الـ scoring.
      - kind: reveal
        page: 214
        quote: "Power Doppler (PD) adds functional data by detecting blood flow in inflamed tissues"
        prompt: "ليه الـ synovium الملتهب بيطلع فيه PD signal والطبيعي لأ؟"
        answer: "الـ inflamed tissue بيعمل أوعية جديدة وبيوسّع اللي موجود (blood flow أكتر). الـ synovium الطبيعي الـ flow فيه أبطأ وأقل من إن الجهاز يلقطه. عشان كده الـ PD = التهاب شغال، ولما يختفي يبقى الالتهاب هدي."
      - kind: figure
        page: 214
        quote: "Gray-scale (GS) and Power Doppler (PD) signals are graded 0–3."
        title: "السلّم من 0 لـ 3"
        alt: "Four boxes in a row from grade 0 to 3, labelled none, mild, moderate and severe. Each box shows more coloured Doppler dots than the one before."
        caption: "الـ GS والـ PD كل واحد بيتدرّج من 0 لـ 3، وبيدخلوا في scores زي US7 و GLOESS و OMERACT-EULAR."
        svg: |
          <svg viewBox="0 0 330 150" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="20" width="75" height="75" rx="6" class="fg-box"/>
            <rect x="87" y="20" width="75" height="75" rx="6" class="fg-box"/>
            <rect x="169" y="20" width="75" height="75" rx="6" class="fg-box"/>
            <rect x="251" y="20" width="75" height="75" rx="6" class="fg-box"/>
            <circle cx="115" cy="57" r="5" class="fg-dot-bad"/>
            <circle cx="190" cy="45" r="5" class="fg-dot-bad"/>
            <circle cx="210" cy="65" r="5" class="fg-dot-bad"/>
            <circle cx="225" cy="45" r="5" class="fg-dot-bad"/>
            <circle cx="265" cy="40" r="5" class="fg-dot-bad"/>
            <circle cx="282" cy="55" r="5" class="fg-dot-bad"/>
            <circle cx="300" cy="40" r="5" class="fg-dot-bad"/>
            <circle cx="270" cy="72" r="5" class="fg-dot-bad"/>
            <circle cx="295" cy="75" r="5" class="fg-dot-bad"/>
            <circle cx="312" cy="60" r="5" class="fg-dot-bad"/>
            <text x="35" y="118" class="t-lg t-b">0</text>
            <text x="117" y="118" class="t-lg t-b">1</text>
            <text x="199" y="118" class="t-lg t-b">2</text>
            <text x="281" y="118" class="t-lg t-b">3</text>
            <text x="22" y="140" class="t-sm">none</text>
            <text x="108" y="140" class="t-sm">mild</text>
            <text x="180" y="140" class="t-sm">moderate</text>
            <text x="266" y="140" class="t-sm">severe</text>
          </svg>
      - kind: explain
        page: 214
        quote: "Confirm active synovitis in equivocal clinical exams. Identify subclinical disease in patients in apparent remission."
        title: "الـ MSUS بيغيّر القرار"
        text: |
          - يأكد **active synovitis** لما الكشف مش واضح (equivocal).
          - يلاقي ==subclinical disease== في مريض شكله في remission.
          - يوجّه حقن الـ steroid في المفصل أو الـ bursa.
          - يلقط الـ flare بدري ويخلّي الـ **tapering** للـ DMARDs/biologics شخصي.

          ولو الـ Doppler مفيهوش التهاب: **high negative predictive value**.
      - kind: case
        page: 214
        quote: "Detect flares early and personalize tapering of DMARDs/biologics."
        stem: "A 45-year-old woman with RA on MTX plus a biologic has had no swollen joints for a year and asks to reduce treatment."
        steps:
          - question: "What can MSUS add before tapering?"
            options: ["Look for subclinical synovitis with PD", "Nothing, the exam is enough", "Measure bone density", "Confirm anti-CCP"]
            answer: 0
            why: "MSUS identifies subclinical disease in apparent remission and personalizes tapering."
          - reveal: "Grey-scale shows mild synovial hypertrophy; PD grade 2 in two MCPs."
            question: "Is she in true remission?"
            options: ["No: PD 2 means active inflammation", "Yes: GS changes are enough", "Yes: grade 2 is normal", "Cannot be graded"]
            answer: 0
            why: "PD shows synovial vascularity; a decrease in PD signal is what marks remission."
          - reveal: "Another patient has GS changes but PD 0 in every joint."
            question: "What does the negative Doppler tell you?"
            options: ["Active inflammation is unlikely (high NPV)", "Disease is surely active", "The probe is wrong", "Repeat with X-ray"]
            answer: 0
            why: "MSUS has high negative predictive value when Doppler shows no inflammation."
      - kind: check
        page: 218
        quote: "Correct Answer: B. Synovial vascularity and active inflammation."
        question: "What does a positive Power Doppler signal indicate in a joint?"
        options: ["Synovial vascularity and active inflammation", "Joint effusion only", "Old erosion", "Cartilage thinning"]
        answer: 0
        why:
          - "صح: الـ PD بيشوف الدم في الـ synovium الملتهب."
          - "الـ effusion بتبان في الـ grey scale."
          - "الـ erosion القديمة مفيهاش flow."
          - "الـ cartilage مفيهوش flow."
      - kind: check
        page: 219
        quote: "Correct Answer: C. MSUS."
        question: "Which imaging is most sensitive for early enthesitis (book answer)?"
        options: ["MSUS", "X-ray", "MRI", "CT"]
        answer: 0
        why:
          - "صح: إجابة الكتاب، sensitive و preferred للـ enthesis."
          - "الـ X-ray مش بيشوف الالتهاب البدري."
          - "مش إجابة الكتاب في السؤال ده."
          - "مش بيشوف الالتهاب البدري."
      - kind: aside
        tone: exam
        page: 217
        quote: "Correct Answer: C. 6–15 MHz."
        text: "أسئلة الكتاب (ص 217–219) بتيجي من الحاجات دي بالظبط: الميزة (early synovitis و guides injections)، الـ probe (6–15 MHz)، الـ PD (vascularity)، الـ SpA (enthesitis with Doppler)، والـ gout (double contour)."
      - kind: try
        items: [rheum.L13.018, rheum.L13.019, rheum.L13.020, rheum.L13.022, rheum.L13.048]
    recap:
      - "PD = blood flow في النسيج الملتهب؛ PD بيقل = remission."
      - "PD أحسن من colour Doppler في الـ slow flow."
      - "GS و PD من 0 لـ 3: none، mild، moderate، severe."
      - "MSUS يلاقي subclinical disease ويوجّه الحقن والـ tapering."
      - "Doppler سليم = high negative predictive value."
    practice: [rheum.L13.018, rheum.L13.019, rheum.L13.020, rheum.L13.021, rheum.L13.022, rheum.L13.023, rheum.L13.041, rheum.L13.046, rheum.L13.047, rheum.L13.048, rheum.L13.049, rheum.L13.052, rheum.L13.053]
