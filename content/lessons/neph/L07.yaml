  - id: neph.L07.lesson7
    title: "Fabry: إنزيم ناقص ودهون في كل خلية"
    hook: "ولد عنده حرقان في إيديه ورجليه من صغره، ما بيعرقش، وبعدين proteinuria. ورا كل ده إنزيم واحد على الـ X."
    minutes: 10
    pages: [186, 192]
    topics: [fabry]
    goals:
      - "تعرف الإنزيم والجين وليه الرجالة أوحش"
      - "تعرف الكلية والقلب والأعصاب والجلد والعين في الـ Fabry وليه"
      - "تشخّص بالإنزيم وتعالج بالـ agalsidase وتعرف حدود الزرع"
    status: unverified
    steps:
      - kind: explain
        page: 186
        title: "Fabry: إنزيم ناقص"
        quote: "Introduction Fabry disease is caused by hereditary deficiency of the enzyme a- galactosidase A (a-Gal A), resulting in the intra cellular accumulation of neutral glycosphingolipids with terminal a-linked galactosyl moieties (Fig. 46.10). Clinically, this leads to progressive CKD, pain crises, sweat-ing abnormalities, vascular cutaneous lesions, and cardiac and eye abnormalities."
        text: |
          نقص ==α-galactosidase A== فيتجمع **glycosphingolipid (Gb3)** جوّه الخلايا.

          الجين **GLA** على ==X chromosome== (أكتر من 500 mutation). الرجالة (hemizygous) حالتهم شديدة، والستات (heterozygous) متغيرة وغالبًا أخف.

          النتيجة: **chronic kidney disease (CKD)، pain crises، مشاكل عرق، جلد، قلب، وعين**.

          ليه الست ممكن تتعب رغم إنها heterozygous؟ التفسير المقبول (مش في الكتاب): في كل خلية في جسم الست، واحدة من الـ X chromosomes بتتقفل بالصدفة. لو الصدفة قفلت الـ X السليمة في أغلب خلايا عضو معين، العضو ده هيبقى شبه خلايا الراجل. علشان كده الستات متغيرين جدًا: فيه اللي سليمة وفيه اللي عندها قلب أو كلية زي الرجالة.
      - kind: mnemonic
        page: 186
        quote: "Introduction Fabry disease is caused by hereditary deficiency of the enzyme a- galactosidase A (a-Gal A), resulting in the intra cellular accumulation of neutral glycosphingolipids with terminal a-linked galactosyl moieties (Fig. 46.10). Clinically, this leads to progressive CKD, pain crises, sweat-ing abnormalities, vascular cutaneous lesions, and cardiac and eye abnormalities."
        word: "FABRY"
        parts:
          - { key: "F", text: "Feet burn, Fail to sweat: autonomic small fibres (acral pain crises from childhood, hypohidrosis)" }
          - { key: "A", text: "Angiokeratomas (bathing-trunk area)" }
          - { key: "B", text: "Bad kidneys: proteinuria, ESRD 3rd–6th decade" }
          - { key: "R", text: "Rhythm and left ventricular hypertrophy (LVH): heart, coronary disease" }
          - { key: "Y", text: "Eye: corneal verticillata (75%)" }
        hook: "**FABRY**: الـ F شايلة اتنين من نفس الأعصاب (autonomic): الحرقان وقلة العرق، فالستة جوّه الخمس حروف. والموت غالبًا من ==MI أو stroke==."
      - kind: explain
        page: 187
        title: "ليه الرجالة أوحش، وبيبدأ إزاي؟"
        quote: "As expected for an X-linked disorder, severe clinical manifestations occur in hemizygous males, whereas heterozygous females have a variable but typically less severe course."
        text: |
          الكتاب: الجين **GLA** على الـ ==X chromosome== (أكتر من 500 mutation)، والـ glycosphingolipids اللي بتتجمع هي **نفسها** اللي في الأنسجة الطبيعية، بس بكميات أكبر بكتير لأن الإنزيم اللي بيكسّرها ناقص.

          - الراجل **hemizygous**: عنده X واحد بس، فمفيش نسخة سليمة تعوّض، والصورة ==شديدة==.
          - الست **heterozygous**: عندها X سليم، فخلايا كتير بتعمل الإنزيم، والصورة **متغيرة وأخف غالبًا** (التفسير المقبول للتغيّر، مش في الكتاب: كل خلية بتقفل X بالصدفة، فالنسبة بتختلف من ست للتانية).

          في الراجل البداية في **الطفولة وأول المراهقة**: ==paresthesias وألم في الإيدين والرجلين== مع **pain crises**. والمسار بيوصل لـ ESRD في العقد 3–6، والموت غالبًا **MI أو stroke**.
      - kind: explain
        page: 188
        title: "الكلية"
        quote: "Trating defect, the nephropathy of Fabry disease typically manifests as mild to moderate proteinuria, sometimes with microhematuria, begin-ning in the third decade although proteinuria in childhood is reported."
        text: |
          - **Proteinuria خفيفة لمتوسطة** ± microhematuria من **العقد الثالث**؛ الـ nephrotic نادر.
          - في البول: ==oval fat bodies مع Maltese cross== تحت الـ polarized light.
          - ضغط و end-stage renal disease (ESRD) في العقد **4–5**؛ لحد **10%** من الستات يوصلوا ESRD.
          - **light microscopy (LM)**: الـ podocytes منفوخة ومليانة **vacuoles صافية**.
          - **electron microscopy (EM)**: inclusions في الـ lysosomes (myelin figures) طبقات متوازية = ==zebra bodies==.

          ليه zebra bodies؟ التفسير المقبول (مش في الكتاب): الإنزيم الناقص (α-Gal A) شغلته يكسّر الـ Gb3 جوّه الـ lysosome. لما يغيب، الـ Gb3 (وهو دهون) يتراكم طبقات فوق طبقات جوّه الـ lysosome، فيبان تحت الـ EM زي خطوط الحمار الوحشي. والـ podocytes بتتأثر الأول لأنها خلايا ما بتتجددش، فالدهون بتتجمع فيها سنين، والنتيجة proteinuria.

          ليه البروتين بييجي من العقد التالت؟ التفسير المقبول (مش في الكتاب): الـ Gb3 بيتراكم ببطء في الـ podocytes من الطفولة، بس الخلية بتستحمل لحد ما تتملي. لما تتعب، الـ filtration barrier يضعف ويبان protein. يعني الـ proteinuria علامة متأخرة نسبيًا، وعلشان كده منطقي إن الإنزيم يبقى أفيد قبل ما الـ podocytes تموت، مش بعدها.
      - kind: figure
        page: 188
        quote: "Glomerular visceral epithelial cells are enlarged and packed with small, clear vacuoles that represent glycosphingolipid material"
        title: "Vacuolation في الـ Fabry"
