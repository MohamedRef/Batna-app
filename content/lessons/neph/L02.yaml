            <text x="10" y="62" class="t-sm t-b">G1 ≥90</text>
            <text x="10" y="102" class="t-sm t-b">G2 60–89</text>
            <text x="10" y="142" class="t-sm t-b">G3a 45–59</text>
            <text x="10" y="182" class="t-sm t-b">G3b 30–44</text>
            <text x="10" y="222" class="t-sm t-b">G4 15–29</text>
            <text x="10" y="262" class="t-sm t-b">G5 &lt;15</text>
            <rect x="102" y="40" width="66" height="36" rx="5" class="fg-good"/><text x="135" y="63" text-anchor="middle" class="t-sm">1</text>
            <rect x="172" y="40" width="66" height="36" rx="5" class="fg-acc"/><text x="205" y="63" text-anchor="middle" class="t-sm">1</text>
            <rect x="242" y="40" width="66" height="36" rx="5" class="fg-bad"/><text x="275" y="63" text-anchor="middle" class="t-sm">3</text>
            <rect x="102" y="80" width="66" height="36" rx="5" class="fg-good"/><text x="135" y="103" text-anchor="middle" class="t-sm">1</text>
            <rect x="172" y="80" width="66" height="36" rx="5" class="fg-acc"/><text x="205" y="103" text-anchor="middle" class="t-sm">1</text>
            <rect x="242" y="80" width="66" height="36" rx="5" class="fg-bad"/><text x="275" y="103" text-anchor="middle" class="t-sm">3</text>
            <rect x="102" y="120" width="66" height="36" rx="5" class="fg-acc"/><text x="135" y="143" text-anchor="middle" class="t-sm">1</text>
            <rect x="172" y="120" width="66" height="36" rx="5" class="fg-bad"/><text x="205" y="143" text-anchor="middle" class="t-sm">2</text>
            <rect x="242" y="120" width="66" height="36" rx="5" class="fg-dot-bad"/><text x="275" y="143" text-anchor="middle" class="t-sm t-b">3</text>
            <rect x="102" y="160" width="66" height="36" rx="5" class="fg-bad"/><text x="135" y="183" text-anchor="middle" class="t-sm">2</text>
            <rect x="172" y="160" width="66" height="36" rx="5" class="fg-dot-bad"/><text x="205" y="183" text-anchor="middle" class="t-sm t-b">3</text>
            <rect x="242" y="160" width="66" height="36" rx="5" class="fg-dot-bad"/><text x="275" y="183" text-anchor="middle" class="t-sm t-b">3</text>
            <rect x="102" y="200" width="66" height="36" rx="5" class="fg-dot-bad"/><text x="135" y="223" text-anchor="middle" class="t-sm t-b">3</text>
            <rect x="172" y="200" width="66" height="36" rx="5" class="fg-dot-bad"/><text x="205" y="223" text-anchor="middle" class="t-sm t-b">3</text>
            <rect x="242" y="200" width="66" height="36" rx="5" class="fg-dot-bad"/><text x="275" y="223" text-anchor="middle" class="t-sm t-b">4+</text>
            <rect x="102" y="240" width="66" height="36" rx="5" class="fg-dot-bad"/><text x="135" y="263" text-anchor="middle" class="t-sm t-b">4+</text>
            <rect x="172" y="240" width="66" height="36" rx="5" class="fg-dot-bad"/><text x="205" y="263" text-anchor="middle" class="t-sm t-b">4+</text>
            <rect x="242" y="240" width="66" height="36" rx="5" class="fg-dot-bad"/><text x="275" y="263" text-anchor="middle" class="t-sm t-b">4+</text>
          </svg>
      - kind: aside
        page: 32
        quote: "Low risk (if no other markers of kidney disease, no CKD)"
        tone: trap
        text: "**G1A1 و G2A1** من غير أي marker تاني = **مش CKD**. ماتكتبش \"CKD stage 2\" لمجرد إن الـ eGFR 75."
      - kind: table
        page: 32
        quote: "2.1. Monitoring/yr for progression of CKD"
        title: "كام مرة في السنة؟ (Monitoring/yr)"
        columns: [GFR, A1, A2, A3]
        rows:
          - ["G3a", "1", "2", "3"]
          - ["G3b", "2", "3", "3"]
          - ["G4", "3", "3", "4+"]
        hide: [[0, 2], [1, 1], [2, 3]]
      - kind: explain
        page: 32
        quote: "Change in eGFR of >20% on a subsequent test."
        title: "إمتى التغيير يقلق؟"
        text: |
          الأرقام بتتهز طبيعي. اللي يستاهل تقييم:

          - تغيير في الـ eGFR ==> 20%== في التحليل اللي بعده
          - نزول ==> 30%== بعد ما تبدأ دوا hemodynamically active (زي ACEi/ARB أو SGLT2i)
          - الـ ACR ==يتضاعف==
      - kind: check
        page: 32
        quote: "GFR reductions of >30% in CKD patients after initiating hemodynamically active therapies."
        question: "eGFR drops from 50 to 42 (16%) two weeks after starting losartan. Best step?"
        options:
          - "Continue losartan and recheck as planned"
          - "Stop losartan"
          - "Add an ACE inhibitor"
          - "Urgent kidney biopsy"
        answer: 0
        why:
          - "صح: أقل من 30% بعد RAASi متوقع (hemodynamic dip)."
          - "بنوقف كآخر حل، ومش هنا."
          - "الـ ACEi + ARB ممنوع (1B)."
          - "مفيش داعي."
      - kind: explain
        page: 33
        quote: "Examination: Uremic facies, scratch marks, bone tenderness, neuropathy."
        title: "CKD ولا AKI؟"
        text: |
          **History**: تحاليل قديمة، أعراض طويلة (fatigue، anorexia، itching، bone pain، 2ry amenorrhea، infertility، polyuria)، risk factors.

          **Exam**: uremic facies، scratch marks، bone tenderness، neuropathy.

          **Investigations**: ==anemia of CKD==، CKD-MBD، و ==small kidneys== بالـ U/S، أو biopsy.

          والـ **chronicity** بتتأكد بتحاليل قديمة، imaging (كلى صغيرة وcortex رفيع)، pathology (fibrosis وatrophy)، أو تكرار التحليل بعد 3 شهور.
      - kind: sort
        page: 34
        quote: "Non-diabetic chronic kidney disease"
        prompt: "حط كل سبب في الـ compartment بتاعه:"
        bins: ["Glomerular", "Tubulointerstitial", "Vascular", "Cystic"]
        cards:
          - { text: "IgA nephropathy", bin: 0 }
          - { text: "Membranous nephropathy", bin: 0 }
          - { text: "Analgesic nephropathy", bin: 1 }
          - { text: "Chronic obstruction", bin: 1 }
          - { text: "Lead / aristolochic acid", bin: 1 }
          - { text: "Renal artery stenosis", bin: 2 }
          - { text: "Cholesterol emboli", bin: 2 }
          - { text: "ADPKD", bin: 3 }
      - kind: mnemonic
        page: 34
        quote: "Glomerulosclerosis Tubular atrophy Interstitial fibrosis Vascular sclerosis"
        word: "GTIV"
        parts:
          - { key: "G", text: "Glomerulosclerosis" }
          - { key: "T", text: "Tubular atrophy" }
          - { key: "I", text: "Interstitial fibrosis" }
          - { key: "V", text: "Vascular sclerosis" }
        hook: "**جي تي آي في**: الكلى المتليّفة اتقفلت زي **TV** قديم. 📺"
      - kind: explain
        page: 35
        quote: "Using the patient's Urine, Sex, Age and GFR, the kidney failure risk equation provides the 2 and 5 year probability"
        title: "الـ KFRE: احتمال الفشل الكلوي"
        text: |
          ==KFRE== بياخد **Urine ACR، Sex، Age، GFR** ويديك احتمال kidney failure بعد **سنتين و5 سنين**.

          - بيتستخدم في **G3–G5**
          - **ممكن ميبقاش valid في G1–G2**
          - في IgAN و ADPKD فيه equations خاصة
      - kind: table
        page: 36
        quote: "Transition from an estimated glomerular filtration rate (eGFR)-based to a risk- based approach"
        title: "من الـ eGFR للـ risk"
        columns: [Step, eGFR, KF risk]
        rows:
          - ["Refer to nephrology", "30–60", "≥ 3–5% / 5 y"]
          - ["Interprofessional care", "< 30", "≥ 10% / 2 y"]
          - ["Access + transplant planning", "< 20", "≥ 40% / 2 y"]
        hide: [[1, 2], [2, 1], [2, 2]]
      - kind: case
        page: 36
        quote: "Transition from an estimated glomerular filtration rate (eGFR)-based to a risk- based approach"
        stem: "A 55-year-old with diabetes: eGFR 38 and ACR 650 mg/g for 6 months. KFRE: 2-year risk 14%."
        steps:
          - question: "Stage?"
            options: ["G3bA3", "G3aA3", "G4A2", "G3bA2"]
            answer: 0
            why: "30–44 = **G3b**، > 300 = **A3**."
          - question: "Monitoring?"
            options: ["3 times a year", "Once a year", "Twice a year", "Every 2 years"]
            answer: 0
            why: "G3bA3 = **3** مرات."
          - question: "Care level by risk?"
            options: ["Interprofessional nephrology care (≥ 10% at 2 y)", "Primary care only", "Start dialysis", "Transplant listing now"]
            answer: 0
            why: "الـ risk ≥ 10% في سنتين = interprofessional care حتى لو eGFR فوق 30."
      - kind: try
        items: [neph.L02.033, neph.L02.036, neph.L02.037, neph.L02.042, neph.L02.051]
