  - id: res.L02.lesson3
    title: "Incidence: الحالات الجديدة بس"
    hook: "75 واحد اتعشوا في فرح و46 جالهم إسهال. الـ attack rate كام؟ وليه في الـ incidence بنشيل اللي عيان أصلًا؟"
    minutes: 6
    pages: [25, 36]
    topics: [incidence, prevalence]
    goals:
      - "تكتب الـ incidence rate formula صح: new cases وpopulation at risk"
      - "تعرف الـ attack rate وخصائصه وتحسبه"
      - "تشيل اللي عيان أصلًا من الـ denominator"
    status: unverified
    steps:
      - kind: explain
        page: 25
        quote: "1. Incidence Rate = Number of new cases during a specific period / Total midperiod population at risk"
        title: "الـ incidence rate"
        text: |
          المعادلة:

          - **Incidence rate = new cases during a specific period ÷ total midperiod population at risk**

          ركّز على الـ ==new cases== والـ ==at risk==.

          كلمتين مهمين:

          - **New**: الحالات القديمة مش محسوبة.
          - **At risk**: اللي عنده المرض أصلًا (أو immune) مش at risk، يبقى يطلع من المقام.

          الـ incidence بتقيس ==سرعة== ظهور المرض (rapidity of occurrence).
      - kind: explain
        page: 26
        quote: "2. Attack Rate: An attack rate is a specific type of incidence rate. It is calculated for a narrowly defined population observed for a limited time, such as during an outbreak. It is usually expressed as a percentage, so 10ⁿ equals 100."
        title: "الـ attack rate: incidence وقت الأزمة"
        text: |
          الـ **attack rate** = نوع خاص من الـ incidence rate، بنحسبه لـ population محددة ضيقة لفترة قصيرة، زي ==outbreak== أو epidemic، وغالبًا للأمراض المعدية.

          - **Attack rate = new cases during the period ÷ population at risk at the beginning of the period × 100**

          وهو مقياس للـ ==probability or risk== إنك تبقى case.
      - kind: check
        page: 27
        quote: "Attack rate\n▪ Usually connected to infectious disease\n▪ An attack rate is an incidence rate\ncalculated for a specific disease for a\nlimited period of time during an epidemic"
        question: "An attack rate is best described as:"
        options:
          - "An incidence rate for a specific disease over a limited period during an epidemic"
          - "The number of existing cases at one point in time"
          - "Deaths from a disease over the number of people with it"
          - "Cases among contacts of a primary case"
        answer: 0
        why:
          - "صح: slide 27، attack rate = incidence rate لمرض معين في فترة محدودة وقت الـ epidemic، وغالبًا infectious."
          - "ده prevalence: حالات موجودة، مش جديدة."
          - "ده case fatality rate."
          - "ده secondary attack rate، نوع خاص هتاخده في درس الـ SAR."
      - kind: mnemonic
        page: 28
        quote: "For a defined population (the population at risk), during a limited time period. Remember, attack rates have some special characteristics:\n  Restricted to a special age group\n  Limited by \"place\" variables\n  Time period is usually brief: limited period of risk\n  Usually expressed as a percentage"
        word: "APTP"
        parts:
          - { key: "A", text: "Age group: restricted to a special one" }
          - { key: "P", text: "Place variables limit it" }
          - { key: "T", text: "Time period is brief (limited period of risk)" }
          - { key: "P", text: "Percentage: usually expressed as one" }
        hook: |
          الـ attack rate بيهجم زي **APTP**: على **سن** معين، في **مكان** معين، في **وقت** قصير، وبيتكتب **%**.
      - kind: case
        page: 29
        quote: "Example: Of 75 persons who attended a dinner, 46 subsequently developed a gastrointestinal illness. To calculate the attack rate of GI illness we first define the numerator and denominator:\n  x = Cases of GI illness occurring within the incubation period for GI illness among persons who attended the dinner = 46\n  y = Number of persons at the dinner = 75\nThen, the attack rate for GI illness is 46/75 x 100 = 61%\nIn this example, we could say that among persons who attended the dinner, the probability of developing GI illness was 61%, or the risk of developing GI illness was 61%."
        stem: "فرح في المنصورة: 75 معزوم، و46 منهم جالهم gastroenteritis خلال الـ incubation period."
        steps:
          - question: "What is the numerator?"
            options: ["46", "75", "29"]
            answer: 0
            why: "x = الحالات اللي حصلت خلال الـ incubation period بين اللي حضروا = 46."
          - question: "What is the attack rate?"
            options: ["61%", "46%", "39%", "163%"]
            answer: 0
            why: "46/75 × 100 = 61%. يعني الـ risk إنك تتعب لو اتعشيت في الفرح ده = 61%."
      - kind: explain
        page: 34
        quote: "Disease occurrence in a sample over time:\n  Year 1, 5 individuals developed the outcome\n  Year 2, an additional 7 people developed the outcome\n  Year 3, an additional 4 people developed the outcome"
        title: "مثال المجموعة: 30 واحد على 3 سنين"
        text: |
          30 شخص متابعين:

          - سنة 1: **5** جالهم المرض.
          - سنة 2: **7** زيادة.
          - سنة 3: **4** زيادة.

          (مفيش حد خف أو مات.)
      - kind: figure
        page: 34
        quote: "Year 2, an additional 7 people developed the outcome"
        title: "الـ 30 واحد: المقام بيصغر كل سنة"
        alt: "Three rows of 30 dots for years 1, 2 and 3. Year 1: 5 new cases, at risk 30, incidence 5 over 30 equals 17 percent. Year 2: 5 already ill, 7 new, at risk 25, 7 over 25 equals 28 percent. Year 3: 12 already ill, 4 new, at risk 18, 4 over 18 equals 22 percent."
        caption: |
          دي نفس عيّنة slide 34 (30 شخص على 3 سنين)، بس مرسومة علشان تشوف المقام وهو بيتغيّر:

          - كل نقطة شخص. **الأحمر** عيان من سنة قبل كده، **الملوّن** حالة جديدة السنة دي، و**الفاضي** لسه at risk.
          - سنة 1: 5 جداد من 30 = 17%.
          - سنة 2: الـ 5 الحمر ==خرجوا من المقام==، فالـ 7 الجداد على 25 = 28%.
          - سنة 3: 12 خرجوا، فالـ 4 على 18 = 22%.

          الـ incidence بتعدّ الملوّن بس، وتقسمه على الملوّن + الفاضي. الأحمر مكانه في الـ prevalence.
