    src: { page: 35, quote: "A study was carried out in country X to find out whether the risk of diarrhea in under-five children was different between two nearby villages. It was suspected that village B had a higher risk because the community used unprotected wells while village A used tap water. village A had a population of 10,000, while village B included 15,000 people. The under-five populations were 1,000 and 1,500 respectively. The records kept by village health workers (VHWs) responsible for the villages in the previous four weeks were checked. village B had had 100 cases of diarrhea while village A had had 50 cases.\n  a) Cross sectional\n  b) Case control\n  c) Correlation study\n  d) Prospective cohort\n  e) Retrospective cohort" }
