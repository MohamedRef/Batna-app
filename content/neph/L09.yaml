    back: Fluid removal without volume replacement, so volume control but not solute control.
    src: { page: 303, quote: "Isolated ultrafiltration The main goal of ultrafiltration is to remove fluid using semipermeable membranes without volume replacement, thus achieving volume but not solute control in the patient." }
