  - id: geri.L04.lesson9
    title: "علاج الاكتئاب عند الكبير: اختار صح واستنّى"
    hook: "دوا صح، جرعة صغيرة، وصبر 6 أسابيع. وأغلب الفشل مش من الدوا، من إن المريض وقفه بدري."
    minutes: 9
    pages: [80, 83]
    topics: [depression-treatment, definitions]
    goals:
      - "تعرف ليه الاكتئاب عند الكبار مابيتعالجش كويس"
      - "تطبّق الـ guidelines: efficacy، tolerability، safety، interactions"
      - "تعرف الاستجابة ومدة العلاج وإمتى lithium والـ electroconvulsive therapy (ECT)"
    status: unverified
    steps:
      - kind: explain
        page: 80
        quote: "Treatment\n  Educate patients to understand:\n    Their condition may result from vulnerability factors e.g., physical illness, inherited predisposition, biological and psychosocial stress (life events, lack of social support).\n    Depression is not an uncommon medical illness.\n    Treatment of depression in primary care has led to lowered suicide rates, resulting in recommendations that late –life suicide prevention efforts focus on adequate recognition and treatment of depression."
        title: "ليه مابيتعالجش؟"
        text: |
          - أغلبهم مش بياخدوا **optimal meds**، وأقل من **10%** بياخدوا psychotherapy فعّالة.
          - **Stigma**: بيتشاف «moral weakness» أو ضعف شخصية.
          - بيرفضوا الـ referral وبيوقفوا العلاج.

          وعلاج الاكتئاب في الـ primary care قلّل الـ **suicide**، فالـ ==suicide prevention== عند الكبار = اكتشف وعالج الاكتئاب.

          ليه الـ stigma مهمة؟ لأن المريض اللي شايف الاكتئاب ضعف شخصية **هيرفض الـ referral ويوقف العلاج**، وده اللي الكتاب بيقوله بعدها على طول. يعني أول علاج هو الـ **education**: إن الاكتئاب مرض طبي مش نادر، وليه أسباب (physical illness، وراثة، biological و psychosocial stress، قلة الـ social support).

          وليه أقل من 10% بياخدوا psychotherapy؟ التفسير المقبول (مش في الكتاب): الكبير غالبًا بيروح للـ primary care مش للطبيب النفسي، وصعب يتحرك لجلسات كتير، والـ referral نفسه بيتشاف وصمة. علشان كده الكتاب بيركّز إن الـ primary care نفسه يكتشف ويعالج، وده اللي قلّل الـ suicide rates.
      - kind: explain
        remind: [geri.L04.106]
        page: 81
        quote: "Tolerability: the elderly are particularly sensitive to drug side-effects"
        title: "أربع أسئلة قبل ما تكتب"
        text: |
          الكتاب بيحط ==guidelines for drug therapy in the elderly==:
          - **Efficacy**: أول اختيار لازم يكون دوا فعّال.
          - **Tolerability**: الكبار حساسين جدًا للـ side-effects، وعواقبها عليهم خطيرة.
          - **Safety**: بعض الـ antidepressants خطر لو اتاخدت **overdose**.
          - **Drug interactions**: لأن عنده أمراض كتير، فبياخد classes كتير.

          ليه الـ safety في الـ overdose بالذات؟ لأن المريض المكتئب ممكن يفكر في الانتحار، فالدوا اللي في إيده لازم مايبقاش سلاح. التفسير المقبول (مش في الكتاب): الـ TCAs مثلًا كمية صغيرة منها ممكن تعمل arrhythmia قاتلة، والـ SSRIs أأمن بكتير، وده جزء من ليه الـ SSRIs مفضّلة. وليه الـ tolerability؟ لأن دوخة بسيطة من دوا عند الكبير ممكن تبقى وقعة وكسر.
      - kind: figure
        page: 81
        title: "صندوق الكتاب: إزاي تكتب دوا psychoactive لكبير"
        image: { file: geri/L04-psychoactive-principles.webp, book: true }
        alt: "The book's boxed list of general principles and a ten-step recommended approach for psychoactive drugs in the elderly, including non-drug approaches first, avoiding routine as-needed drugs, choosing the least toxic drug, starting at 25 to 50 percent of the standard dose and titrating slowly, keeping the regimen simple and reviewing all bottles and over-the-counter drugs regularly."
        caption: |
          الصندوق الأحمر في ص 81: فوق **general principles** (الكبار حساسين جدًا للـ psychoactive drugs، واعرف كام دوا كويس)، وتحت **10 خطوات**:

          1–3: ابدأ بالـ ==nonpharmacologic==، وما تكتبش "as needed" للنوم والقلق والألم كروتين، واختار الأقل toxic.
          4–5: بدّل الدوا الخطر بدوا أأمن، وقلّل الجرعة.
          6: ==Start low and go slow==: **25–50%** من الجرعة العادية، وزوّد بالراحة، وهدفك تحسّن مش اختفاء الأعراض.
          7–10: خلي الروشتة بسيطة، وخلّي المريض يجيب كل العلب، وراجع الأدوية القديمة والـ over-the-counter.

          اللي تاخده: نفس قواعد درس الـ prescribing، بس هنا مخصوصة للمخ.
