items:
  # ---------- p68: definition and epidemiology ----------
  - id: rheum.L04.001
    kind: enumerate
    topic: definition
    prompt: APS is a systemic autoimmune disorder characterised by which three features?
    points:
      - Arterial and/or venous thrombosis
      - Pregnancy-related morbidity
      - Persistent antiphospholipid antibodies (aPL) in the blood
    pass: 3
    src: { page: 68, quote: "Arterial and/or venous thrombosis. Pregnancy-related morbidity" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L04.002
    kind: card
    topic: definition
    front: Give three examples of the pregnancy-related morbidity of APS.
    back: Recurrent miscarriage, stillbirth, and premature birth due to placental insufficiency.
    src: { page: 68, quote: "recurrent miscarriage, stillbirth, premature birth due to placental insufficiency" }
    status: unverified
  - id: rheum.L04.003
    kind: cloze
    topic: definition
    text: "APS on its own is {{c1::primary}} APS; APS with another autoimmune disease, particularly {{c2::SLE}}, is {{c3::secondary}} APS."
    src: { page: 68, quote: "APS can occur on its own (primary APS) or in association with other autoimmune diseases, particularly systemic lupus erythematosus (SLE)" }
    status: unverified
  - id: rheum.L04.004
    kind: card
    topic: definition
    front: What is the most common acquired cause of thrombophilia?
    back: Antiphospholipid syndrome.
    src: { page: 68, quote: "APS is the most common acquired cause of thrombophilia." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L04.005
    kind: card
    topic: definition
    front: Who does APS affect most, and which organs can it involve?
    back: It occurs at any age but is commonest in women of childbearing age; it can affect virtually any organ through thrombotic or ischemic complications.
    src: { page: 68, quote: "It can occur at any age but is more common in women of childbearing age." }
    status: unverified
  # ---------- p69: clinical features ----------
  - id: rheum.L04.006
    kind: card
    topic: clinical
    front: Venous thromboses of APS?
    back: Deep vein thrombosis and pulmonary embolism.
    src: { page: 69, quote: "Deep vein thrombosis (DVT)." }
    status: unverified
  - id: rheum.L04.007
    kind: enumerate
    topic: clinical
    prompt: Enumerate the arterial thromboses of APS listed in the lecture.
    points: [Stroke, Transient ischemic attacks, Myocardial infarction, Retinal artery or vein thrombosis]
    pass: 3
    src: { page: 69, quote: "Retinal artery or vein thrombosis." }
    status: unverified
  - id: rheum.L04.008
    kind: cloze
    topic: clinical
    text: "APS pregnancy morbidity: recurrent early miscarriages, typically before {{c1::10 weeks}}; unexplained fetal death beyond {{c1::10 weeks}}; premature birth before {{c2::34 weeks}}."
    src: { page: 69, quote: "Recurrent early miscarriages (typically before 10 weeks gestation). Unexplained fetal death beyond 10 weeks gestation." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L04.009
    kind: card
    topic: clinical
    front: What three causes of premature birth (<34 weeks) count as APS pregnancy morbidity?
    back: Severe preeclampsia, eclampsia, or placental insufficiency.
    src: { page: 69, quote: "Premature birth (<34 weeks) due to severe preeclampsia, eclampsia, or placental insufficiency." }
    status: unverified
  - id: rheum.L04.010
    kind: enumerate
    topic: clinical
    prompt: Enumerate the other (non-thrombotic, non-obstetric) clinical manifestations of APS.
    points:
      - Thrombocytopenia
      - Livedo reticularis
      - Valvular heart disease (Libman–Sacks endocarditis)
      - Neurological symptoms (migraine, seizures, chorea)
      - Catastrophic APS
    pass: 4
    src: { page: 69, quote: "Thrombocytopenia. Livedo reticularis. Valvular heart disease (Libman–Sacks endocarditis)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L04.011
    kind: card
    topic: clinical
    front: What is the valvular heart disease of APS called?
    back: Libman–Sacks endocarditis.
    src: { page: 69, quote: "Valvular heart disease (Libman–Sacks endocarditis)." }
    status: unverified
  - id: rheum.L04.012
    kind: card
    topic: clinical
    front: Three neurological symptoms of APS given in the lecture?
    back: Migraine, seizures and chorea.
    src: { page: 69, quote: "Neurological symptoms (e.g., migraine, seizures, chorea)." }
    status: unverified
  - id: rheum.L04.013
    kind: mcq
    topic: clinical
    stem: A 29-year-old woman has a lacy violaceous mottling on her thighs, a platelet count of 85 × 10⁹/L and a past left leg DVT. Which skin sign is she showing, as listed among the other manifestations of APS?
    options: [Livedo reticularis, Erythema nodosum, Malar rash, Palpable purpura, Pyoderma gangrenosum]
    answer: 0
    why:
      - "Correct: livedo reticularis sits with thrombocytopenia among the 'other' APS manifestations (p69)."
      - Erythema nodosum is tender nodules (sarcoid, IBD), not a net-like pattern.
      - A malar rash is SLE's butterfly rash over the cheeks, not the thighs.
      - Palpable purpura points to small-vessel vasculitis.
      - Pyoderma gangrenosum is an ulcerating lesion, usually with IBD.
    src: { page: 69, quote: "Thrombocytopenia. Livedo reticularis." }
    status: unverified
  # ---------- p70: Sapporo criteria ----------
  - id: rheum.L04.014
    kind: card
    topic: criteria
    front: Which criteria does the lecture use to classify APS, and what must a patient have?
    back: The 2006 revised Sapporo criteria. At least one clinical criterion and at least one laboratory criterion.
    src: { page: 70, quote: "Classification Criteria for APS (2006 Revised Sapporo Criteria)" }
    status: unverified
    tags: [high-yield]
    update:
      text: "The 2023 ACR/EULAR APS classification criteria replace Sapporo for research: an entry criterion (a positive aPL within 3 years of a clinical event), then weighted clinical and laboratory domains, needing at least 3 points from each. The book's Sapporo criteria remain the exam answer."
      ref: "ACR/EULAR APS classification criteria, 2023"
  - id: rheum.L04.015
    kind: card
    topic: criteria
    front: Sapporo vascular thrombosis criterion?
    back: One or more objectively confirmed episodes of arterial, venous, or small vessel thrombosis in any tissue or organ.
    src: { page: 70, quote: "One or more objectively confirmed episodes of arterial, venous, or small vessel thrombosis in any tissue or organ." }
    status: unverified
  - id: rheum.L04.016
    kind: table
    topic: criteria
    title: "Sapporo pregnancy morbidity criteria (any one)"
    columns: [Event, Number, Timing, Condition]
    rows:
      - [Death of a morphologically normal fetus, "≥1", "At or beyond 10 weeks", Unexplained]
      - [Premature birth, "≥1", "Before 34 weeks", "Due to eclampsia, preeclampsia or placental insufficiency"]
      - [Spontaneous abortions, "≥3 consecutive", "Before 10 weeks", Maternal and anatomical causes excluded]
    blanks: [[0, 2], [1, 2], [2, 1], [2, 2]]
    src: { page: 70, quote: "Three or more consecutive spontaneous abortions before 10 weeks, with maternal and anatomical causes excluded." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L04.017
    kind: cloze
    topic: criteria
    text: "Sapporo laboratory criteria must be positive on {{c1::two or more}} occasions at least {{c2::12 weeks}} apart."
    src: { page: 70, quote: "(Repeated on two or more occasions, at least 12 weeks apart)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L04.018
    kind: enumerate
    topic: criteria
    prompt: Enumerate the three Sapporo laboratory criteria.
    points:
      - Lupus anticoagulant (per international guidelines)
      - Anticardiolipin IgG or IgM in medium to high titer
      - Anti-β2 glycoprotein I IgG or IgM
    pass: 3
    src: { page: 70, quote: "Anticardiolipin antibody (aCL) of IgG or IgM isotype in medium to high titer." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L04.019
    kind: mcq
    topic: criteria
    stem: >-
      A 31-year-old woman had two consecutive miscarriages at 7 and 8 weeks. Lupus anticoagulant is
      positive today and again 14 weeks later. Does she meet the 2006 revised Sapporo criteria?
    options:
      - Yes, two early miscarriages plus persistent LA are enough
      - No, the early-loss criterion needs three or more consecutive losses before 10 weeks
      - No, LA must be confirmed 24 weeks apart
      - Yes, any pregnancy loss with one positive aPL test qualifies
    answer: 1
    why:
      - Two early losses fall short of the clinical criterion.
      - "Correct: the early-loss criterion is ≥3 consecutive spontaneous abortions before 10 weeks (p70); her laboratory criterion is met."
      - The interval is at least 12 weeks, which she meets.
      - A single positive test is never enough; it must be repeated ≥12 weeks apart.
    src: { page: 70, quote: "Three or more consecutive spontaneous abortions before 10 weeks, with maternal and anatomical causes excluded." }
    status: unverified
  - id: rheum.L04.020
    kind: mcq
    topic: criteria
    stem: Which of the following is a diagnostic criterion for APS according to the revised Sapporo (2006) criteria?
    options: [Elevated ESR, Positive ANA, Unexplained fetal loss after 10 weeks of gestation, Transient proteinuria]
    answer: 2
    why:
      - ESR is non-specific and is not in the criteria.
      - ANA points to SLE screening, not APS classification.
      - "Correct: a morphologically normal fetal death at or after 10 weeks is a clinical criterion (p70, p76)."
      - Proteinuria is not an APS criterion.
    src: { page: 70, quote: "One or more unexplained deaths of a morphologically normal fetus at or beyond the 10th week of gestation." }
    status: unverified
    tags: [book-question]
  # ---------- p70-71: antibodies ----------
  - id: rheum.L04.021
    kind: card
    topic: antibodies
    front: What kind of test is lupus anticoagulant, and what risk does it carry?
    back: A functional assay based on clotting time. It carries the highest risk of thrombosis.
    src: { page: 70, quote: "Functional assay based on clotting time. Associated with the highest risk of thrombosis." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L04.022
    kind: card
    topic: antibodies
    front: Is lupus anticoagulant an anticoagulant in the body?
    back: No. It prolongs clotting time in the test tube, but in vivo it increases the risk of thrombosis.
    src: { page: 70, quote: "Not a true anticoagulant in vivo, rather, it increases thrombosis risk." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L04.023
    kind: cloze
    topic: antibodies
    text: "Anticardiolipin antibodies are detected by {{c1::ELISA}}; moderate to high titers of {{c2::≥40 GPL or MPL units}} are clinically significant."
    src: { page: 71, quote: "Moderate to high titers (≥40 GPL or MPL units) are clinically significant." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L04.024
    kind: card
    topic: antibodies
    front: What is β2-glycoprotein I's role in APS testing?
    back: It is the cofactor for anticardiolipin binding to phospholipids; anti-β2GPI antibodies (IgG and IgM) are detected by ELISA.
    src: { page: 71, quote: "Targeted against β2-glycoprotein I, a cofactor for aCL binding to phospholipids." }
    status: unverified
  - id: rheum.L04.025
    kind: table
    topic: antibodies
    title: "The three antiphospholipid antibodies"
    columns: [Antibody, Method, Isotypes, Key point]
    rows:
      - [Lupus anticoagulant, "Functional clotting-time assay (aPTT, dRVVT)", "-", Highest thrombosis risk]
      - [Anticardiolipin, ELISA, IgG and IgM, "Significant at ≥40 GPL/MPL units"]
      - [Anti-β2GPI, ELISA, IgG and IgM, Targets the cofactor for aCL binding]
    blanks: [[0, 1], [0, 3], [1, 3], [2, 1]]
    src: { page: 71, quote: "Moderate to high titers (≥40 GPL or MPL units) are clinically significant." }
    status: unverified
  - id: rheum.L04.026
    kind: card
    topic: antibodies
    front: How does the risk of thrombosis in APS relate to the aPL tests?
    back: It correlates with the type and the number of positive aPL tests.
    src: { page: 71, quote: "The risk of thrombosis correlates with the type and number of positive aPL tests." }
    status: unverified
  - id: rheum.L04.027
    kind: enumerate
    topic: antibodies
    prompt: Enumerate the higher-risk aPL profiles.
    points:
      - Triple positivity (LA, aCL and anti-β2GPI)
      - Isolated LA positivity, especially persistent
      - High titers, especially IgG >40 units
    pass: 3
    src: { page: 71, quote: "Triple Positivity: Positive for LA, aCL, and anti-β2GPI. Isolated LA positivity: Especially when persistent." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L04.028
    kind: enumerate
    topic: antibodies
    prompt: Enumerate the lower-risk aPL profiles.
    points:
      - Low-titer aCL or anti-β2GPI only
      - IgM antibodies without LA
      - Transient or single-time positive tests (infection, pregnancy)
    pass: 3
    src: { page: 71, quote: "Low-titer aCL or anti-β2GPI only. IgM antibodies without LA." }
    status: unverified
  - id: rheum.L04.029
    kind: mcq
    topic: antibodies
    stem: Which antiphospholipid antibody is associated with the highest risk of thrombosis?
    options: [Anti-dsDNA, Anticardiolipin IgM, Lupus anticoagulant, Anti-β2 glycoprotein I IgM]
    answer: 2
    why:
      - Anti-dsDNA is an SLE antibody, not an aPL.
      - IgM aCL without LA is a lower-risk profile.
      - "Correct: LA is the strongest predictor of thrombotic events (p70, p76)."
      - IgM anti-β2GPI alone is a lower-risk profile.
    src: { page: 70, quote: "Associated with the highest risk of thrombosis." }
    status: unverified
    tags: [book-question]
  - id: rheum.L04.030
    kind: mcq
    topic: antibodies
    stem: >-
      A 26-year-old man had a positive IgM anticardiolipin at low titer during a febrile viral illness.
      LA and anti-β2GPI were negative, and repeat aCL 12 weeks later is negative. How should this be read?
    options:
      - Triple-positive, high-risk APS
      - A transient, low-risk aPL result that does not meet the laboratory criterion
      - Definite APS because aCL was positive once
      - Isolated LA positivity
    answer: 1
    why:
      - Only one test was ever positive, and only once.
      - "Correct: low-titer IgM without LA, transient during infection, is a lower-risk profile; it is not persistent (p71)."
      - Every test must be persistently positive on 2 occasions ≥12 weeks apart.
      - LA was negative.
    src: { page: 71, quote: "Transient or single-time positive tests (e.g., during infection or pregnancy)." }
    status: unverified
  # ---------- p72: CAPS ----------
  - id: rheum.L04.031
    kind: card
    topic: caps
    front: Define catastrophic APS.
    back: A rare, rapidly progressive form of APS with simultaneous thrombosis in multiple organs.
    src: { page: 72, quote: "CAPS is a rare, rapidly progressive form of APS involving simultaneous thrombosis in multiple organs." }
    status: unverified
  - id: rheum.L04.032
    kind: cloze
    topic: caps
    text: "CAPS involves {{c1::≥3}} organ systems within a short time (usually {{c2::days}}), with evidence of {{c3::small-vessel}} thrombosis and high mortality if untreated."
    src: { page: 72, quote: "Involves ≥3 organ systems within a short time (usually days). Evidence of small-vessel thrombosis." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L04.033
    kind: enumerate
    topic: caps
    prompt: Enumerate the common triggers of catastrophic APS.
    points: [Infection, Surgery, Withdrawal of anticoagulation, Obstetric complications]
    pass: 3
    src: { page: 72, quote: "Infection. Surgery. Withdrawal of anticoagulation. Obstetric complications." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L04.034
    kind: enumerate
    topic: caps
    prompt: What is the "triple therapy" of catastrophic APS?
    points:
      - Anticoagulation
      - High-dose corticosteroids
      - Plasmapheresis and/or IVIG
    pass: 3
    src: { page: 72, quote: "Plasmapheresis and/or intravenous immunoglobulin (IVIG)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L04.035
    kind: card
    topic: caps
    front: Which drugs may be used in refractory catastrophic APS?
    back: Rituximab or eculizumab.
    src: { page: 72, quote: "Rituximab or eculizumab may be used in refractory cases." }
    status: unverified
  - id: rheum.L04.036
    kind: case
    topic: caps
    stem: >-
      A 34-year-old woman with known primary APS stopped warfarin 10 days ago for a dental extraction.
      Over three days she develops confusion, oliguria with rising creatinine, and dyspnoea with bilateral infiltrates.
    steps:
      - reveal: "Platelets 52 × 10⁹/L. Renal biopsy is not possible; skin biopsy of a livedo patch shows small-vessel thrombi."
        question: What is the most likely diagnosis?
        options: [Catastrophic APS, Thrombotic thrombocytopenic purpura from an unrelated cause, Septic shock, Lupus nephritis flare]
        answer: 0
        why: "Three organ systems (brain, kidney, lung) within days, small-vessel thrombosis, and a classic trigger (withdrawal of anticoagulation) define CAPS (p72)."
      - question: Which treatment does the lecture recommend first?
        options:
          - Warfarin restart alone
          - Full anticoagulation, high-dose steroids, and plasmapheresis and/or IVIG
          - Low-dose aspirin and observation
          - Rituximab alone
        answer: 1
        why: "CAPS needs rapid, aggressive 'triple therapy' (p72, p75). Rituximab or eculizumab are for refractory cases."
    src: { page: 72, quote: "Involves ≥3 organ systems within a short time (usually days). Evidence of small-vessel thrombosis." }
    status: unverified
  # ---------- p72-73: work-up ----------
  - id: rheum.L04.037
    kind: enumerate
    topic: workup
    prompt: Enumerate the points of the clinical evaluation in suspected APS.
    points:
      - Detailed history of thrombosis or pregnancy loss
      - Family history of autoimmune or clotting disorders
      - Examination for skin signs (livedo reticularis)
      - Examination for cardiac murmurs
      - Examination for neurological deficits
    pass: 4
    src: { page: 72, quote: "Detailed history of thrombosis or pregnancy loss. Family history of autoimmune or clotting disorders." }
    status: unverified
  - id: rheum.L04.038
    kind: enumerate
    topic: workup
    prompt: Enumerate the laboratory tests in suspected APS.
    points:
      - Coagulation tests (aPTT, dRVVT) for LA
      - ELISA for aCL and anti-β2GPI (IgG and IgM)
      - Re-test after 12 weeks to confirm persistence
      - Screen for SLE (ANA, anti-dsDNA)
    pass: 4
    src: { page: 73, quote: "Coagulation tests (e.g., aPTT, dRVVT for LA). ELISA for aCL and anti-β2GPI (IgG and IgM). Re-test after 12 weeks to confirm persistence." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L04.039
    kind: card
    topic: workup
    front: In APS work-up, who especially needs SLE screening, and with which tests?
    back: Younger patients or those with systemic symptoms; screen with ANA and anti-dsDNA.
    src: { page: 73, quote: "Additional screening for SLE (ANA, anti-dsDNA), especially in younger patients or those with systemic symptoms." }
    status: unverified
  # ---------- p73: thrombotic APS ----------
  - id: rheum.L04.040
    kind: card
    topic: thrombotic
    front: How long is anticoagulation after a thrombotic event in APS?
    back: Lifelong, generally, to prevent recurrence.
    src: { page: 73, quote: "lifelong anticoagulation is generally required to prevent recurrence." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L04.041
    kind: card
    topic: thrombotic
    front: What is the initial anticoagulant in acute thrombosis in APS, and why might UFH be chosen?
    back: Heparin (UFH or LMWH). UFH allows rapid reversal if needed.
    src: { page: 73, quote: "UFH allows rapid reversal if needed." }
    status: unverified
  - id: rheum.L04.042
    kind: cloze
    topic: thrombotic
    text: "Long-term APS anticoagulation: {{c1::warfarin}} is the mainstay, target INR {{c2::2–3}} for most; INR {{c3::3–4}} may be considered for recurrent events despite standard anticoagulation."
    src: { page: 73, quote: "INR 3–4 may be considered in recurrent events despite standard anticoagulation." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L04.043
    kind: card
    topic: thrombotic
    front: Are DOACs recommended in high-risk APS? Why?
    back: No, especially in triple-positive patients; trials showed an increased risk of recurrent thrombosis.
    src: { page: 73, quote: "Increased risk of recurrent thrombosis in clinical trials." }
    status: unverified
    tags: [high-yield]
    update:
      text: "EULAR 2019 says to avoid rivaroxaban in triple-positive APS and to avoid DOACs after arterial events, and EMA (2019) warns against DOACs in APS with a history of thrombosis."
      ref: "EULAR recommendations for APS in adults, 2019"
  - id: rheum.L04.044
    kind: mcq
    topic: thrombotic
    stem: >-
      A 38-year-old woman has an unprovoked DVT. LA, IgG aCL (70 GPL) and anti-β2GPI are positive now and
      12 weeks later. She has been on LMWH for one week. Which long-term plan matches the lecture?
    options:
      - Rivaroxaban for 3 months
      - Warfarin with a target INR of 2–3, lifelong
      - Warfarin with a target INR of 3–4 from the start
      - Low-dose aspirin alone
      - Apixaban lifelong
    answer: 1
    why:
      - DOACs are not recommended in high-risk (triple-positive) APS, and 3 months is too short.
      - "Correct: warfarin is the mainstay, INR 2–3 for most, lifelong after a thrombotic event (p73)."
      - INR 3–4 is reserved for recurrence despite standard anticoagulation.
      - Aspirin alone is for primary prevention, not after a thrombosis.
      - DOACs raise recurrent thrombosis in triple-positive APS.
    src: { page: 73, quote: "Target INR 2–3 for most patients." }
    status: unverified
  - id: rheum.L04.045
    kind: mcq
    topic: thrombotic
    stem: >-
      A 45-year-old man with triple-positive APS on warfarin, with INRs consistently 2.3–2.8, has a
      second DVT. Which change does the lecture allow?
    options:
      - Switch to apixaban
      - Raise the target INR to 3–4
      - Stop anticoagulation and start hydroxychloroquine
      - Add an IVC filter and stop warfarin
    answer: 1
    why:
      - DOACs increase recurrence in triple-positive patients.
      - "Correct: INR 3–4 may be considered in recurrent events despite standard anticoagulation (p73)."
      - Hydroxychloroquine is an adjunct, never a replacement for anticoagulation.
      - Stopping anticoagulation risks more thrombosis; the lecture gives no role for filters.
    src: { page: 73, quote: "INR 3–4 may be considered in recurrent events despite standard anticoagulation." }
    status: unverified
  # ---------- p74-75: obstetric, prevention, special ----------
  - id: rheum.L04.046
    kind: cloze
    topic: obstetric
    text: "Obstetric APS during pregnancy: low-dose aspirin {{c1::75–100 mg/day}} plus {{c2::prophylactic LMWH}}."
    src: { page: 74, quote: "Low-dose aspirin (LDA) 75–100 mg/day Prophylactic low-molecular-weight heparin (LMWH)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L04.047
    kind: card
    topic: obstetric
    front: When is therapy started and stopped in obstetric APS?
    back: Start early in pregnancy and continue throughout gestation; stop LMWH shortly before delivery and resume it postpartum.
    src: { page: 74, quote: "Discontinue LMWH shortly before delivery and resume postpartum to reduce thrombosis risk." }
    status: unverified
  - id: rheum.L04.048
    kind: enumerate
    topic: obstetric
    prompt: What may refractory obstetric APS require?
    points: [Higher doses of LMWH, Hydroxychloroquine, IVIG in select cases]
    pass: 3
    src: { page: 74, quote: "Higher doses of LMWH. Hydroxychloroquine. Intravenous immunoglobulin (IVIG) in select cases." }
    status: unverified
  - id: rheum.L04.049
    kind: case
    topic: obstetric
    stem: >-
      A 30-year-old woman had an unexplained stillbirth of a normal fetus at 22 weeks last year. LA and
      anti-β2GPI IgG were positive twice, 14 weeks apart. She is now 6 weeks pregnant.
    steps:
      - question: Does she meet the Sapporo criteria?
        options: [Yes, "No: she needs three losses", "No: the fetus must be abnormal", "No: she needs a thrombosis too"]
        answer: 0
        why: "One unexplained death of a morphologically normal fetus at ≥10 weeks is a clinical criterion, and persistent LA is a laboratory criterion (p70)."
      - question: Which treatment should she start now?
        options:
          - Warfarin INR 2–3
          - Low-dose aspirin plus prophylactic LMWH through the pregnancy
          - Low-dose aspirin alone
          - Rivaroxaban
        answer: 1
        why: "Obstetric APS = LDA 75–100 mg/day plus prophylactic LMWH from early pregnancy (p74). Warfarin is teratogenic in early pregnancy, and DOACs are not used."
      - question: What happens around delivery?
        options:
          - Continue LMWH through labour
          - Stop LMWH shortly before delivery and resume it postpartum
          - Stop everything at 36 weeks for good
          - Switch to warfarin at 34 weeks
        answer: 1
