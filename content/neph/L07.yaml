  - id: neph.L07.030
    kind: cloze
    topic: adpkd-renal
    text: "Visible hematuria occurs in up to {{c1::40%}} of ADPKD patients over the disease course and may be the first symptom."
    src: { page: 149, quote: "Hematuria and Cyst Hemorrhage Visible hematuria may be the initial presenting symptom and occurs in up to 40% of patients with ADPKD over the course of the disease. Many have recurrent episodes. Differential diagnosis includes cyst hem-orrhage, stone, infection, and tumor. Cyst hemorrhage is a frequent complication and produces gross hematuria when the cyst communicates with the collecting system. Frequently, the cyst does not communicate with the collecting system, and flank pain without hematuria occurs. It can manifest with fever, raising the possibility of cyst infection. On occasion, a hemorrhagic cyst will rupture, resulting in a retroperitoneal bleed that can be significant, potentially requiring transfusion. In most patients, cyst hemorrhage is self-limited, resolving within 2 to 7 days. If symptoms of hematuria or flank pain last longer than 1 week or if the initial episode of hematuria occurs after age 50 years, neoplasm should be excluded." }
    status: unverified
    tags: [numbers]
  - id: neph.L07.031
    kind: enumerate
    topic: adpkd-renal
    prompt: Give the differential diagnosis of visible hematuria in ADPKD.
    points:
