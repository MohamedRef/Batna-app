  - id: hem.L12.lesson4
    title: "Hodgkin في العيادة: من الرقبة لـ ABVD"
    hook: "غدة في الرقبة مطاطية ومش بتوجع، وهرش، وعرق بالليل. ومعاها ESR عالي. يلا نكمّل."
    minutes: 9
    pages: [196, 198]
    topics: [hl-clinical, hl-management]
    goals:
      - "توصف الغدة وتعرف أماكنها بالنسب"
      - "تعرف الـ constitutional symptoms والـ organomegaly"
      - "تعرف الـ investigations والعلاج حسب الـ stage"
    status: unverified
    steps:
      - kind: explain
        page: 196
        quote: "Painless, non-tender, asymmetrical, firm, discrete and rubbery. Lymph nodes may become matted."
        title: "الغدة"
        text: |
          ==Painless, non-tender==، asymmetrical، firm، discrete و ==rubbery==. وممكن تلزق في بعض (**matted**).
      - kind: figure
        page: 196
        quote: "Cervical nodes; are involved in 60 – 70 % Axillary nodes; in 10 – 15 % Inguinal nodes; in 6 – 12 %"
        title: "فين الغدد؟"
        alt: "A simple body outline with node sites and percentages: cervical 60 to 70 percent, mediastinal 6 to 11 percent, axillary 10 to 15 percent, retroperitoneal often (seen on CT), inguinal 6 to 12 percent."
        caption: "الرقبة بعيد في الأول. الـ mediastinal علامة الـ nodular sclerosing."
        svg: |
          <svg viewBox="0 0 330 290" xmlns="http://www.w3.org/2000/svg">
            <circle cx="165" cy="35" r="25" class="fg-box"/>
            <rect x="120" y="65" width="90" height="150" rx="25" class="fg-box"/>
            <rect x="140" y="215" width="20" height="65" class="fg-box"/>
            <rect x="170" y="215" width="20" height="65" class="fg-box"/>
            <circle cx="150" cy="65" r="7" class="fg-dot-bad"/>
            <text x="10" y="62" class="t-sm t-b">Cervical 60-70%</text>
            <circle cx="165" cy="100" r="7" class="fg-dot-acc"/>
            <text x="220" y="100" class="t-sm">Mediastinal 6-11%</text>
            <circle cx="125" cy="90" r="6" class="fg-dot-bad"/>
            <text x="10" y="112" class="t-sm">Axillary 10-15%</text>
            <circle cx="165" cy="165" r="6" class="fg-dot-acc"/>
            <text x="220" y="165" class="t-sm">Retroperitoneal</text>
            <text x="220" y="181" class="t-sm t-mut">(on CT)</text>
            <circle cx="148" cy="210" r="6" class="fg-dot-bad"/>
            <text x="10" y="212" class="t-sm">Inguinal 6-12%</text>
          </svg>
      - kind: explain
        page: 196
        quote: "Mediastinal L.N. enlargement; in 6-11% of patients. This is a feature of the nodular sclerosing type."
        title: "الـ mediastinum"
        text: |
          - ==Mediastinal== nodes في **6-11%**، وده feature للـ **nodular sclerosing**.
          - ممكن يعمل **pleural effusion** أو ==superior vena cava obstruction==.
          - الـ **retroperitoneal** بيتصاب كتير بس بيبان على الـ CT.
      - kind: explain
        page: 197
        quote: "Splenomegaly occurs during course of disease in 50% of cases, but seldom massive."
        title: "الأعضاء والأعراض"
        text: |
          - **Splenomegaly** في ==50%== أثناء المرض، بس **seldom massive**. والكبد ممكن.
          - النخاع، الـ GIT، العضم، الرئة والـ spinal cord: **unusual**.

          الـ **constitutional symptoms**:

          - **Fever 30%**، continuous أو **cyclic**.
          - Weight loss، و profuse sweating بالليل.
          - ==Pruritus 25%==، وممكن يبقى severe.
          - Fatigue، anorexia و cachexia.
      - kind: aside
        tone: exam
        page: 197
        quote: "Fever in 30% of patients, is continuous or cyclic."
        text: "الـ fever الـ cyclic (أيام سخونية وأيام لأ) في الـ Hodgkin له اسم مشهور: Pel-Ebstein fever. الكتاب بيقول continuous or cyclic بس."
      - kind: sort
        page: 198
        quote: "ESR/ plasma viscosity: high in active HD and could be good for follow up."
        prompt: "التحليل ده بيقيس إيه في الـ Hodgkin؟"
        bins: ["Activity / follow-up", "Advanced disease", "Complication"]
        cards:
          - { text: "ESR / plasma viscosity", bin: 0 }
          - { text: "High LDH", bin: 1 }
          - { text: "High uric acid (secondary gout)", bin: 2 }
          - { text: "Abnormal kidney function", bin: 2 }
          - { text: "Abnormal liver function", bin: 2 }
        why: "الـ ESR عالي في الـ active HD وكويس للمتابعة. الـ LDH عالي في الـ advanced. الـ uric acid من الـ lympho-proliferative activity، والكلية من الإصابة أو الـ gout، والكبد لو اتصاب."
      - kind: explain
        page: 198
        quote: "Confirm diagnosis by biopsy, best histology of lymph node by excision biopsy."
        title: "الـ investigations"
        text: |
          1. ==Excision biopsy== للغدة: أحسن histology.
          2. Blood: normocytic anaemia، reactive leucocytosis، **eosinophilia**، thrombocytosis خفيف.
          3. **CXR**: غدد أو infection من الـ immune suppression.
          4. **CT chest, abdomen, pelvis**: nodal و extranodal.
          5. **Bone marrow trephine**: نستبعد إصابة النخاع.
          6. **MRI أو PET** في الحالات الصعبة.
      - kind: explain
        page: 198
        quote: "Can be treated with extended field radiotherapy or 3 courses of ABVD+ localized radiotherapy."
        title: "العلاج"
        text: |
          - **Early (IA / IIA)**: extended field radiotherapy، أو ==3 courses ABVD + localized radiotherapy==.
          - **Advanced (IIB-IV)**: ==6-8 courses ABVD==.
      - kind: mnemonic
        page: 198
        quote: "ABVD = Adriamycin, Bleomycin, Vinblastine, and Decarbazine"
        word: "ABVD"
        parts:
