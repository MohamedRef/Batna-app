    title: "علاج الـ AKI في الحمل: فريق، حذر، وساعات ولادة"
    hook: "نفس علاج الـ AKI العادي تقريبًا، مع تلات فروق ممكن تموّت الأم لو نسيتها."
    minutes: 8
