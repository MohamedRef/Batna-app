  - id: dm.L21.lesson5
    title: "Secondary hyperlipidemia: دوّر على السبب الأول"
    hook: "غدة كسلانة، كلية بتسرّب بروتين، وحباية منع حمل. كل واحد بيعلّي دهن مختلف، ولكل واحد سبب."
    minutes: 9
    pages: [261, 262]
    topics: [secondary]
    goals:
      - "تربط كل secondary cause بالـ lipid اللي بيعلّيه"
      - "تفهم ليه كل سبب بيعلّي الدهن ده"
      - "تعرف لقطات الجدول الكبير: IDL و Lp(a) و LDL الواطي"
    status: unverified
    steps:
      - kind: figure
        page: 261
        quote: "II. Secondary hyperlipidemia"
        title: "كوليسترول ولا TG؟"
        alt: "Two columns. Left, mainly cholesterol up: hypothyroidism, nephrotic syndrome (with or without TG), cholestasis, anorexia nervosa. Right, mainly TG up: diabetes mellitus (with low HDL), alcohol abuse (HDL up with mild intake), chronic renal failure, bulimia, pregnancy. Drugs sit under both: TG and/or cholesterol up, HDL down."
        caption: "جدول الـ secondary hyperlipidemia (ص 261) في عمودين. اللي **بيبطّأ تنضيف الـ LDL** أو **بيحبس الكوليسترول** في الشمال، واللي **بيزوّد الـ VLDL** في اليمين. والأدوية في الاتنين."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="150" height="180" rx="8" class="fg-acc"/>
            <text x="85" y="32" text-anchor="middle" class="t-b">Cholesterol up</text>
            <text x="20" y="62" class="t-sm">Hypothyroidism</text>
            <text x="20" y="88" class="t-sm">Nephrotic (± TG)</text>
            <text x="20" y="114" class="t-sm">Cholestasis</text>
            <text x="20" y="140" class="t-sm">Anorexia nervosa</text>
            <rect x="170" y="10" width="150" height="180" rx="8" class="fg-bad"/>
            <text x="245" y="32" text-anchor="middle" class="t-b">TG up</text>
            <text x="180" y="62" class="t-sm">Diabetes (HDL down)</text>
            <text x="180" y="88" class="t-sm">Alcohol abuse</text>
            <text x="180" y="114" class="t-sm">Chronic renal failure</text>
            <text x="180" y="140" class="t-sm">Bulimia</text>
