  - id: rheum.L16.lesson2
    title: "شكله إيه في العيادة؟ والـ criteria بالنقط"
    hook: "إيدين الاتنين، الصبح متخشّبين، والـ DIP سليم. وبعدين تحسب النقط: 6 من 10 وخلاص."
    minutes: 8
    pages: [244, 246]
    topics: [onset, criteria]
    goals:
      - "تعرف أنواع الـ onset والمفاصل اللي بتتصاب"
      - "تحفظ الـ ACR 1987 وتفهم ليه الـ 6 أسابيع"
      - "تحسب الـ ACR/EULAR 2010 score لوحدك"
    status: unverified
    steps:
      - kind: explain
        page: 244
        title: "البداية"
        quote: "Gradual (usually). Acute in a minority. Occasionally palindromic"
        text: |
          الـ onset غالبًا ==gradual==، وأحيانًا acute، ونادرًا **palindromic**: نوبات ألم وورم واحمرار تروح وترجع، و **50%** منهم يطلع عندهم RA.

          ومعاه أعراض systemic: fatigue، malaise، weakness، low-grade fever، نقص وزن.
      - kind: reveal
        page: 244
        quote: "Morning stiffness: due to edema and inflammatory mediator accumulation during sleep or inactivity."
        prompt: "ليه المفاصل بتبقى متخشّبة الصبح بالذات؟"
        answer: "وانت نايم مفيش حركة، فالـ **edema** والـ **inflammatory mediators** بيتجمّعوا في المفصل. أول ما تتحرك بيتصرّفوا والتخشّب يقل. علشان كده الـ **morning stiffness** علامة التهاب."
      - kind: explain
        page: 244
        title: "مين بيتصاب؟"
        quote: "Less commonly: Tempromandibular and cricoarytenoid joint."
        text: |
          - **كتير**: الإيد (==MCP، PIP، wrist==)، القدم، الركبة.
          - **كمان**: الكتف، الـ hip، الكاحل، الـ sternoclavicular.
          - **أقل**: الـ temporomandibular والـ **cricoarytenoid**.
          - **العمود الفقري**: الـ upper cervical بس، والـ ==sacroiliac سليم==.
      - kind: aside
        tone: trap
        page: 244
        quote: "Symmetry and non involvement of DIP is characteristic."
        text: "الفخ: **DIP** ملتهب؟ فكّر في OA أو psoriatic arthritis. الـ RA بيسيب الـ **DIP** في حاله، وبيبقى **symmetrical**."
      - kind: check
        page: 244
        quote: "Spinal involvement is limited to upper cervical area, sacroiliac joint is spared."
        question: "عيان عنده inflammatory back pain و sacroiliitis في الـ MRI. ده يبعّدك عن الـ RA ليه؟"
        options:
          - "الـ RA بيسيب الـ sacroiliac joint"
          - "الـ RA بيصيب الـ lumbar spine بس"
          - "الـ RA مش بيصيب العمود الفقري خالص"
          - "الـ sacroiliitis علامة RA متأخر"
        answer: 0
        why:
          - "صح: الـ spine في الـ RA = upper cervical بس، والـ sacroiliac spared."
          - "الـ lumbar مش هو المكان، الـ upper cervical هو."
          - "لأ، الـ upper cervical بيتصاب (وخطير)."
          - "الـ sacroiliac spared في الـ RA مهما طال."
      - kind: explain
        page: 245
        title: "ACR 1987: سبعة، ولازم أربعة"
        quote: "4 or more criteria must be present for diagnosis."
        text: |
          1. Morning stiffness **1 ساعة** على الأقل
          2. ورم **3 مفاصل** أو أكتر
          3. ورم wrist أو MCP أو PIP
          4. Symmetric swelling
          5. X-ray الإيد: erosions أو decalcification
          6. Rheumatoid nodules
          7. RF موجب (بطريقة موجبة في أقل من 5% من الأصحّاء)

          لازم ==4 أو أكتر==، والأعراض **6 أسابيع**.
      - kind: reveal
        page: 245
        quote: "It prevents self limiting or vial arthritis to be labelled as RA."
        prompt: "ليه الـ 6 أسابيع مهمين أوي؟"
        answer: "علشان الـ **viral arthritis** والحاجات الـ **self-limiting** بتخف لوحدها في أسابيع. لو ما استنيتش، هتلزّق تشخيص RA لعيان كان عنده parvovirus. العيب: الـ criteria دي **مش sensitive للـ early RA**."
      - kind: figure
        page: 246
        quote: "Patients are definitively diagnosed with RA if they score 6 or more points according to the following criteria"
        title: "عدّاد نقط ACR/EULAR 2010"
        alt: "Four bars, one per domain, each split into its point levels: joints 0, 1, 2, 3, 5; serology 0, 2, 3; duration 0, 1; acute phase reactants 0, 1. A line marks the threshold of 6 out of 10 for definite RA."
        caption: "خد **أعلى خانة** في كل domain، واجمع. **6 من 10** = definite RA. المفاصل لوحدها توصّل 5، والـ serology 3."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="20" class="t-b">Joints (max 5)</text>
            <rect x="10" y="28" width="56" height="34" rx="5" class="fg-box"/><text x="38" y="44" text-anchor="middle" class="t-sm">1 large</text><text x="38" y="57" text-anchor="middle" class="t-b">0</text>
            <rect x="72" y="28" width="56" height="34" rx="5" class="fg-box"/><text x="100" y="44" text-anchor="middle" class="t-sm">2-10 L</text><text x="100" y="57" text-anchor="middle" class="t-b">1</text>
            <rect x="134" y="28" width="56" height="34" rx="5" class="fg-acc"/><text x="162" y="44" text-anchor="middle" class="t-sm">1-3 S</text><text x="162" y="57" text-anchor="middle" class="t-b">2</text>
            <rect x="196" y="28" width="56" height="34" rx="5" class="fg-acc"/><text x="224" y="44" text-anchor="middle" class="t-sm">4-10 S</text><text x="224" y="57" text-anchor="middle" class="t-b">3</text>
            <rect x="258" y="28" width="62" height="34" rx="5" class="fg-bad"/><text x="289" y="44" text-anchor="middle" class="t-sm">&gt;10 S</text><text x="289" y="57" text-anchor="middle" class="t-b">5</text>
            <text x="10" y="90" class="t-b">Serology: RF or ACPA (max 3)</text>
            <rect x="10" y="98" width="96" height="34" rx="5" class="fg-box"/><text x="58" y="114" text-anchor="middle" class="t-sm">negative</text><text x="58" y="127" text-anchor="middle" class="t-b">0</text>
            <rect x="112" y="98" width="100" height="34" rx="5" class="fg-acc"/><text x="162" y="114" text-anchor="middle" class="t-sm">low (≤3× ULN)</text><text x="162" y="127" text-anchor="middle" class="t-b">2</text>
            <rect x="218" y="98" width="102" height="34" rx="5" class="fg-bad"/><text x="269" y="114" text-anchor="middle" class="t-sm">high (&gt;3× ULN)</text><text x="269" y="127" text-anchor="middle" class="t-b">3</text>
            <text x="10" y="160" class="t-b">Duration of synovitis (max 1)</text>
            <rect x="10" y="168" width="150" height="34" rx="5" class="fg-box"/><text x="85" y="184" text-anchor="middle" class="t-sm">&lt; 6 weeks</text><text x="85" y="197" text-anchor="middle" class="t-b">0</text>
            <rect x="170" y="168" width="150" height="34" rx="5" class="fg-acc"/><text x="245" y="184" text-anchor="middle" class="t-sm">≥ 6 weeks</text><text x="245" y="197" text-anchor="middle" class="t-b">1</text>
            <text x="10" y="230" class="t-b">CRP or ESR (max 1)</text>
            <rect x="10" y="238" width="150" height="34" rx="5" class="fg-box"/><text x="85" y="254" text-anchor="middle" class="t-sm">both normal</text><text x="85" y="267" text-anchor="middle" class="t-b">0</text>
            <rect x="170" y="238" width="150" height="34" rx="5" class="fg-acc"/><text x="245" y="254" text-anchor="middle" class="t-sm">either abnormal</text><text x="245" y="267" text-anchor="middle" class="t-b">1</text>
            <rect x="10" y="288" width="310" height="34" rx="8" class="fg-good"/>
            <text x="165" y="310" text-anchor="middle" class="t-b t-good">Total ≥ 6 / 10 = definite RA</text>
          </svg>
      - kind: aside
        tone: trap
        page: 246
        quote: "a patient with five small joints involved and four large joints involved scores 3 points."
        text: "5 مفاصل صغيرة + 4 كبيرة = **3** نقط مش 4. انت بتاخد **أعلى خانة** بتنطبق، مش بتجمع جوّه الـ domain."
      - kind: case
        page: 246
        quote: "At least one test is positive at high titer, defined as more than three times the upper limit of normal (3 points)."
        stem: "A 41-year-old woman: 8 weeks of synovitis in both wrists and 7 MCP/PIP joints. Anti-CCP is 4 times the ULN. ESR is normal."
        steps:
          - question: "Joint domain score?"
            options: ["3", "5", "2", "1"]
            answer: 0
            why: "Wrists, MCPs and PIPs are small joints. 4-10 small joints = 3. (Over 10 would be 5.)"
          - question: "Serology score?"
            options: ["3", "2", "0", "1"]
            answer: 0
            why: "More than 3 times the ULN = high titre = 3 points."
          - question: "Total, and is it RA?"
            options: ["7: definite RA", "6: not RA", "8: definite RA", "5: not yet RA"]
            answer: 0
            why: "3 + 3 + 1 (8 weeks) + 0 (normal ESR) = 7, which is 6 or more: definite RA."
      - kind: try
        items: [rheum.L16.030, rheum.L16.033, rheum.L16.037, rheum.L16.040]
    recap:
      - "Onset غالبًا gradual؛ palindromic → 50% يبقوا RA."
      - "Morning stiffness = edema + mediators اتجمعوا وانت نايم."
      - "MCP، PIP، wrist، قدم، ركبة. Upper cervical بس، sacroiliac سليم، DIP سليم."
      - "ACR 1987: 7 criteria، 4 أو أكتر، 6 أسابيع (تطلّع الـ viral). مش sensitive للـ early."
      - "ACR/EULAR 2010: joints 0–5، serology 0/2/3، duration 0/1، APR 0/1. 6 أو أكتر = RA."
    practice: [rheum.L16.024, rheum.L16.025, rheum.L16.026, rheum.L16.027, rheum.L16.028, rheum.L16.029, rheum.L16.030, rheum.L16.031, rheum.L16.032, rheum.L16.033, rheum.L16.034, rheum.L16.035, rheum.L16.036, rheum.L16.037, rheum.L16.038, rheum.L16.039, rheum.L16.040, rheum.L16.041, rheum.L16.042, rheum.L16.043, rheum.L16.202]
