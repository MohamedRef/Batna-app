  - id: git.L11.lesson2
    title: "أول ساعة: GBS ومحاليل ودم"
    hook: "رقم واحد بيقولك المريض يروّح ولا يدخل، وحدّ واحد بيقولك تنقل دم ولا لأ."
    minutes: 9
    pages: [301, 309]
    topics: [risk, resuscitation]
    goals:
      - "تحسب الـ Glasgow-Blatchford score وتعرف معنى GBS ≤1"
      - "تعرف مين يدخل intensive care unit (ICU)"
      - "تختار المحلول وحدود نقل الدم"
    status: unverified
    steps:
      - kind: explain
        page: 301
        quote: "When the patient with acute bleeding can be discharged and followed up as an outpatient?"
        title: "خمس أسئلة لأي نزيف"
        text: |
          المحاضرة بتقولك اسأل نفسك في كل حالة:
          - أصنّف الـ ==severity== إزاي؟
          - الـ initial assessment على حسب الـ severity والنوع؟
          - إمتى يروّح ويتابع **outpatient**؟
          - إيه الـ **indications for admission**؟
          - يدخل فين: **ward** ولا **intensive care unit (ICU)**؟
      - kind: explain
        page: 302
        quote: "Patient assessment & risk stratification: The use of the Glasgow– Blatchford Score (GBS) (Table 2) is highly recommended for preendoscopy risk stratification. Patients with GBS ≤ 1 are at very low risk of rebleeding, mortality within 30 days, or needing hospital-based intervention and can be safely managed as outpatients with outpatient endoscopy."
        title: "Glasgow-Blatchford قبل المنظار"
        text: |
          الـ ==GBS== هو الـ score المنصوح بيه **pre-endoscopy**، وهو الأدق في التنبؤ بالحاجة لـ **hospital-based intervention** (نقل دم، endoscopic treatment، embolization، surgery) أو الوفاة.

          الرقم السحري: ==GBS ≤ 1== = **very low risk**، يروّح ويعمل المنظار **outpatient**.

          ليه score قبل المنظار؟ التفسير المقبول (مش في الكتاب): لأن أول قرار (يروّح ولا يدخل، والمنظار إمتى) بيتاخد في الطوارئ قبل ما المنظار يبقى متاح، والـ GBS معمول من حاجات بتتقاس في دقايق. وليه الـ BUN جواه؟ لأن الدم اللي بيتهضم في الأمعاء بروتين بيرفع الـ urea، والـ hypovolemia كمان بتقلل دم الكلى.
      - kind: table
        page: 309
        quote: "Table 2: Glasgow-Blatchford score\n| Risk factors at admission | Factor score |\n|---|---|\n| Blood urea nitrogen (mg/dL) | |\n| 18.2 to <22.4 | 2 |\n| 22.4 to <28.0 | 3 |\n| 28.0 to <70.0 | 4 |\n| ≥70.0 | 6 |\n| Hemoglobin (g/dL) | |\n| 12.0 to <13.0 (men); 10.0 to <12.0 (women) | 1 |\n| 10.0 to <12.0 (men) | 3 |\n| <10.0 | 6 |\n| Systolic blood pressure (mm Hg) | |\n| 100–109 | 1 |\n| 90–99 | 2 |\n| <90 | 3 |\n| Heart rate (beats per minute) | |\n| ≥100 | 1 |\n| Melena | 1 |\n| Syncope | 2 |\n| Hepatic disease* | 2 |\n| Cardiac failure* | 2 |"
        title: "نقط الـ GBS (Table 2)"
        columns: ["Factor", "Range", "Points"]
        rows:
          - ["BUN (mg/dL)", "18.2-<22.4 / 22.4-<28 / 28-<70 / ≥70", "2 / 3 / 4 / 6"]
          - ["Hb men (g/dL)", "12-<13 / 10-<12 / <10", "1 / 3 / 6"]
          - ["Hb women (g/dL)", "10-<12 / <10", "1 / 6"]
          - ["Systolic BP", "100-109 / 90-99 / <90", "1 / 2 / 3"]
          - ["Heart rate", "≥100", "1"]
          - ["Melena", "present", "1"]
          - ["Syncope, hepatic disease, cardiac failure", "each present", "2 each"]
        hide: [[0, 2], [1, 2], [3, 2], [5, 2], [6, 2]]
      - kind: aside
        tone: tip
        page: 309
        quote: "Table 2: Glasgow-Blatchford score\n| Risk factors at admission | Factor score |\n|---|---|\n| Blood urea nitrogen (mg/dL) | |\n| 18.2 to <22.4 | 2 |\n| 22.4 to <28.0 | 3 |\n| 28.0 to <70.0 | 4 |\n| ≥70.0 | 6 |\n| Hemoglobin (g/dL) | |\n| 12.0 to <13.0 (men); 10.0 to <12.0 (women) | 1 |\n| 10.0 to <12.0 (men) | 3 |\n| <10.0 | 6 |\n| Systolic blood pressure (mm Hg) | |\n| 100–109 | 1 |\n| 90–99 | 2 |\n| <90 | 3 |\n| Heart rate (beats per minute) | |\n| ≥100 | 1 |\n| Melena | 1 |\n| Syncope | 2 |\n| Hepatic disease* | 2 |\n| Cardiac failure* | 2 |"
        text: |
          حيلة للحفظ: **4 أرقام + 4 أسئلة آه/لأ**.
          - الأرقام: **blood urea nitrogen (BUN)**، **Hb**، **blood pressure (BP)**، **pulse**. أعلى نقطة 6 بتاعة BUN ≥70 و Hb <10.
          - الآه/لأ: **melena = 1**، والتلاتة التانيين (**syncope**، **liver**، **heart failure**) = **2 لكل واحد**.

          الـ endoscopy مش جوه الـ score: علشان كده اسمه **pre-endoscopy**.
      - kind: case
        page: 309
        quote: "Table 2: Glasgow-Blatchford score\n| Risk factors at admission | Factor score |\n|---|---|\n| Blood urea nitrogen (mg/dL) | |\n| 18.2 to <22.4 | 2 |\n| 22.4 to <28.0 | 3 |\n| 28.0 to <70.0 | 4 |\n| ≥70.0 | 6 |\n| Hemoglobin (g/dL) | |\n| 12.0 to <13.0 (men); 10.0 to <12.0 (women) | 1 |\n| 10.0 to <12.0 (men) | 3 |\n| <10.0 | 6 |\n| Systolic blood pressure (mm Hg) | |\n| 100–109 | 1 |\n| 90–99 | 2 |\n| <90 | 3 |\n| Heart rate (beats per minute) | |\n| ≥100 | 1 |\n| Melena | 1 |\n| Syncope | 2 |\n| Hepatic disease* | 2 |\n| Cardiac failure* | 2 |"
        stem: "A 64-year-old man with known heart failure has melena. HR 108/min, SBP 96 mmHg, Hb 11 g/dL, BUN 30 mg/dL, no syncope."
        steps:
