    kind: table
    topic: risk
    title: "ESC/EAS 2019 risk: diabetes and CKD"
    columns: [Category, Diabetes, CKD]
    rows:
      - [Very high, "Target organ damage, ≥ 3 major RF, or T1DM > 20 years", "eGFR < 30"]
      - [High, "No organ damage; duration ≥ 10 years or another RF", "eGFR 30-59"]
      - [Moderate, "Young (T1DM < 35, T2DM < 50), duration < 10 years, no other RF", "-"]
    blanks: [[0, 1], [0, 2], [1, 2], [2, 1]]
    src: { page: 284, quote: "Young patients (T1DM <35 years; T2DM <50 years) with DM duration <10 years, without other risk factors." }
    status: unverified
    tags: [high-yield]
  - id: dm.L23.006
    kind: table
    topic: risk
    title: "ESC/EAS 2019 risk by SCORE (10-year fatal CVD)"
    columns: [Category, SCORE]
    rows:
      - [Very high, "≥ 10%"]
      - [High, "≥ 5% and < 10%"]
      - [Moderate, "≥ 1% and < 5%"]
      - [Low, "< 1%"]
