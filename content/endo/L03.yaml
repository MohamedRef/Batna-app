  # ---------- p36-38: ACTH ----------
  - id: endo.L03.028
    kind: table
    topic: acth
    title: Causes of ectopic ACTH Cushing's syndrome
    columns: [Tumour, Share]
    rows:
      - [Small cell (oat cell) lung carcinoma, 50%]
      - [Carcinoma of thymus, 10%]
      - ["Pancreas (carcinoid, islet cell tumour)", 10%]
      - [Phaeochromocytoma, 5%]
      - [Medullary carcinoma of thyroid, 5%]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 36, quote: "1. Small cell or oat cell pulmonary carcinoma 50%. 2. Carcinoma of thymus 10%." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L03.029
    kind: card
    topic: acth
    front: Pathogenesis of ectopic ACTH secretion?
    back: Increased expression of the pro-opiomelanocortin gene, which encodes ACTH, lipotropin, MSH and endorphin; rarely tumours make CRH.
    src: { page: 36, quote: "Increased expression of proopiomelanocortin gene which encodes ACTH" }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.030
    kind: card
    topic: acth
    front: When was the first ectopic ACTH Cushing's described?
    back: "1928."
    src: { page: 36, quote: "The first case of ectopic ACTH Cushing was described at 1928." }
    status: unverified
  - id: endo.L03.031
    kind: card
    topic: acth
    front: How can ectopic adrenal receptors cause cortisol excess without ACTH?
    back: "GIP receptors make cortisol rise with food intake; adrenal LH receptors with macronodular hyperplasia give cushingoid features in pregnancy or the full picture at menopause."
    src: { page: 37, quote: "Gastric inhibitory peptide (GIP) receptors stimulated by food intake leading to increased cortisol secretion." }
    status: unverified
  - id: endo.L03.032
    kind: card
    topic: acth
    front: Why do tumours rarely produce steroid hormones?
    back: Because of the steroids' complex structure (many enzymatic steps).
    src: { page: 37, quote: "Steroid hormones are rarely produced by neoplastic cells due to its complex structure." }
    status: unverified
  - id: endo.L03.033
    kind: enumerate
    topic: acth
    prompt: Features that distinguish ectopic ACTH Cushing's from Cushing's disease.
    points:
      - Marked hypokalaemia
      - Marked rise in ACTH
      - Marked rise in serum and urine cortisol
      - No suppression on high-dose dexamethasone
      - Metabolic alkalosis
      - Fluid retention and hypertension
      - Diabetes
      - Steroid psychosis
    pass: 5
    src: { page: 37, quote: "1) Presence of marked hypokalemia. 2) Marked increase of ACTH. 3) Marked increase of serum and urine cortisol." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.034
    kind: card
    topic: acth
    front: Why does ectopic ACTH cause marked hypokalaemia and alkalosis?
    back: Very high ACTH drives both glucocorticoid and mineralocorticoid secretion, and very high cortisol overwhelms renal 11-beta HSD2, so cortisol binds mineralocorticoid receptors.
    src: { page: 37, quote: "Marked elevation of cortisol overwhelm 11 B- hydroxysteroid dehydrogenase enzyme type2" }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.035
    kind: cloze
    topic: acth
    text: "Diagnosis of ectopic ACTH: urinary free cortisol {{c1::2 to 4 times}} normal, ACTH usually above {{c2::100 pg/mL}}, and a negative high-dose dexamethasone test (no {{c3::50%}} fall from baseline)."
    src: { page: 38, quote: "Urinary free cortisol is 2 to 4 times normal level. ACTH is usually more than 100 pg/ml." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L03.036
    kind: table
    topic: acth
    title: Lowering cortisol in ectopic ACTH syndrome
    columns: [Option, Dose]
    rows:
      - [Ketoconazole, 200–400 mg twice daily]
      - [Metyrapone, 250–500 mg every 6 hours]
      - [Mitotane, 1 g every 6 hours]
      - [Surgery, Bilateral adrenalectomy]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 38, quote: "Medical: Ketoconazol 200-400 mg twice daily. Metyrapone 250-500 mg/6 hours. Mitotane 1 gm/6 hours." }
    status: unverified
    tags: [numbers]
  - id: endo.L03.037
    kind: card
    topic: acth
    front: First step in treating ectopic ACTH Cushing's, and what to consider after medical or surgical adrenalectomy?
    back: Treat the primary tumour; consider cortisol replacement afterwards.
    src: { page: 38, quote: "Consider cortisol replacement therapy after medical or surgical adrenalectomy." }
    status: unverified
  # ---------- p38-39: SIADH ----------
  - id: endo.L03.038
    kind: enumerate
    topic: siadh
    prompt: Tumours and lesions causing ectopic SIADH.
    points: [Small cell lung cancer, Carcinoid tumour, CNS lesions, GIT tumour, Genitourinary tumour, Ovarian tumour]
    pass: 4
    src: { page: 38, quote: "Small cell lung Ca. Carcinoid Tumor. CNS lesions. GIT tumor. Genitourinary tumor. Ovarian tumor." }
    status: unverified
  - id: endo.L03.039
    kind: card
    topic: siadh
    front: Pathogenesis and net result of paraneoplastic SIADH?
    back: Increased vasopressin and ANP secretion; inappropriate water retention and urine concentration.
    src: { page: 39, quote: "Inappropriate retention of water. Inappropriate urine concentration." }
    status: unverified
  - id: endo.L03.040
    kind: card
    topic: siadh
    front: Clinical picture of SIADH?
    back: Often asymptomatic hyponatraemia; lethargy, weakness, nausea, confusion, seizures; weight gain from water retention without oedema.
    src: { page: 39, quote: "Increased body weight due to retention of water without oedema." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.041
    kind: enumerate
    topic: siadh
    prompt: Diagnosis of SIADH.
    points:
      - Hyponatraemia with low plasma osmolality
      - Inappropriately normal or high urine osmolality
      - Low blood urea nitrogen and uric acid
      - Exclude hypothyroidism and hypocortisolism
    pass: 3
    src: { page: 39, quote: "Low blood urea nitrogen and uric acid. Exclude hypothyroidism and hypocortisolism." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.042
    kind: table
    topic: siadh
    title: Treatment of SIADH by severity
    columns: [Severity, Treatment]
    rows:
      - [Mild, Fluid restriction to less than urine output]
      - [Moderate, "Demeclocycline 150–300 mg three times daily (slow, weeks; antagonises AVP on tubules)"]
      - [Severe (Na below 110 mEq/L), Hypertonic saline with furosemide]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 39, quote: "Severe cases (Na less than 110mEq/L) Hypertonic Saline with furesemide." }
    status: unverified
    tags: [high-yield, numbers]
    update:
      text: "Current guidance adds vaptans (tolvaptan) as an option and limits correction of chronic hyponatraemia to about 8–10 mmol/L in 24 hours to avoid osmotic demyelination."
      ref: "European clinical practice guideline on hyponatraemia 2014"
  # ---------- p39-40: IGF-II ----------
  - id: endo.L03.043
    kind: card
    topic: igf2
    front: Which tumours cause IGF-II hypoglycaemia?
    back: Mesenchymal and hepatic tumours.
    src: { page: 39, quote: "Mesenchymal tumor. Hepatic tumor." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.044
    kind: enumerate
    topic: igf2
    prompt: Pathogenesis of tumour (IGF-II) hypoglycaemia.
    points:
      - Increased glucose consumption by tumour cells
      - Less gluconeogenesis from a liver studded with metastases
      - Fewer counter-regulatory hormones such as GH
      - Big IGF-II that acts on insulin receptors
      - Failure to form IGF binding protein 3, leaving IGF-II active
      - IGF-II secretion exceeding binding proteins
    pass: 4
    src: { page: 39, quote: "Increased ectopic IGFII (Big IGFII) that can react with insulin receptors." }
    status: unverified
  - id: endo.L03.045
    kind: card
    topic: igf2
    front: Clinical picture and treatment of IGF-II hypoglycaemia?
    back: Recurrent fasting hypoglycaemia; small frequent meals, IV glucose especially at night, glucagon, GH and corticosteroids.
    src: { page: 40, quote: "Small frequent meals. I.V. Glucose infusion especially by night. Glucagon, G.H. and corticsteroids." }
    status: unverified
  # ---------- p40-41: hCG ----------
  - id: endo.L03.046
    kind: card
    topic: hcg
    front: Structure of hCG and which subunit is shared?
    back: Two subunits with a carbohydrate moiety; the alpha subunit is like that of LH, FSH and TSH, while the beta subunit is specific.
    src: { page: 40, quote: "Alpha subunit is similar to that of LH, FSH, and TSH." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.047
    kind: enumerate
    topic: hcg
    prompt: Tumours producing ectopic hCG.
    points:
      - Trophoblastic tumour (hydatidiform mole)
      - Gonadal tumours (teratoma, seminoma)
      - "Non-gonadal: choriocarcinoma, lung cancer, hepatoma, breast and colon cancer"
    pass: 3
    src: { page: 40, quote: "Trophoblastic tumor (Hydatiform mole). Gonadal tumor like teratoma or seminoma." }
    status: unverified
  - id: endo.L03.048
    kind: card
    topic: hcg
    front: How does ectopic hCG cause its effects, and which subunit is used for follow-up?
    back: Increased steroidogenesis and aromatase activity raise oestradiol; the beta subunit differentiates and follows these hormones.
    src: { page: 40, quote: "Increased steroidogensis with increased aromatase activity leading to high E2 level." }
    status: unverified
  - id: endo.L03.049
    kind: table
    topic: hcg
    title: Clinical picture of ectopic hCG by age and sex
    columns: [Patient, Picture]
    rows:
      - [Young, Precocious puberty]
      - [Adult female, Uterine bleeding]
      - [Adult male, Gynaecomastia]
      - [Any, Possible hyperthyroidism]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 41, quote: "Young patient precocious puberty. Adult female uterine bleeding. Adult male gynecomastia." }
    status: unverified
    tags: [high-yield]
  # ---------- p41: osteomalacia, GH ----------
  - id: endo.L03.050
    kind: card
    topic: osteomalacia
    front: Tumours causing oncogenic osteomalacia?
    back: "Unusual, mostly benign mesenchymal tumours, \"strange tumour in strange place\": haemangiopericytoma, angiosarcoma, chondrosarcoma in skin, muscle or paranasal sinuses."
    src: { page: 41, quote: "Unusual mesenchymal tumors. Mostly benign. Strange tumor in strange place" }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.051
    kind: card
    topic: osteomalacia
    front: Mechanism of oncogenic osteomalacia?
    back: Tumour FGF-23 ("phosphatonin") cuts renal phosphate reabsorption and renal 1,25-vitamin D synthesis.
    src: { page: 41, quote: "Increased fibroblast growth factor 23 secreted by tumor cells leads to decreased phosphate reabsorption by the kidney" }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.052
    kind: cloze
    topic: osteomalacia
    text: "Oncogenic osteomalacia labs: {{c1::low}} phosphate, {{c2::high}} alkaline phosphatase, {{c3::normal}} calcium and low vitamin D."
    src: { page: 41, quote: "There is hypophosphatemia, increased alkaline phosphatase, normal calcium and low vit. D." }
    status: unverified
  - id: endo.L03.053
    kind: card
    topic: osteomalacia
