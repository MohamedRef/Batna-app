lessons:
  # ------------------------------------------------------------------
  - id: hem.L01.lesson1
    title: "الدم بيتعمل فين؟ من الـ yolk sac لحد الحوض"
    hook: "مصنع الدم بيعزّل كذا مرة في حياتك: من كيس صغير جنب الجنين، للكبد، للعضم. واللي بيفضل شغال في الكبير ده اللي هتبزل منه."
    minutes: 7
    pages: [1, 2]
    topics: [definition, ontogeny, lineages]
    goals:
      - "تعرّف الـ haematopoiesis وتعدّ أعضاء الـ haematopoietic system"
      - "ترتّب أماكن تصنيع الدم من الجنين لحد سن 18"
      - "تعرف كل blast بيطلّع أنهي خلية ناضجة"
    status: unverified
    steps:
      - kind: explain
        page: 1
        title: "يعني إيه haematopoiesis؟"
        quote: "is the process of blood cell production, differentiation and development"
        text: |
          الـ ==haematopoiesis== هي عملية **تصنيع** خلايا الدم، و **تمايزها** (differentiation)، و **نموها** لحد ما تنضج.

          والـ **haematopoietic system** مش النخاع لوحده. هو خمس أعضاء:
          - **Bone marrow**
          - **Liver**
          - **Spleen**
          - **Lymph nodes**
          - **Thymus**
      - kind: aside
        tone: analogy
        page: 1
        quote: "The haematopoietic system consists of the bone marrow, liver, spleen, lymph nodes and thymus."
        text: "فكّر فيها زي شركة: الـ **bone marrow** هو المصنع الرئيسي، والـ **thymus** مدرسة تدريب الـ T cells، والـ **lymph nodes** والـ **spleen** فروع التوزيع. والـ **liver** و الـ spleen كانوا المصنع القديم أيام الجنين، وممكن يرجعوا يشتغلوا وقت الأزمة."
      - kind: figure
        page: 1
        quote: "The fetal liver becomes the main site of hematopoiesis in the second trimester of pregnancy"
        title: "المصنع بيعزّل: timeline"
        alt: "A vertical timeline of the main site of haematopoiesis: yolk sac from day 14 to 19 of the embryo, fetal liver in the second trimester, fetal bone marrow from the third trimester, the whole marrow red in the first 4 years after birth, and by 18 years only the axial skeleton and proximal femur and humerus."
        caption: "**Yolk sac** ← **liver** (2nd trimester) ← **marrow** (3rd trimester). بعد الولادة النخاع لوحده، وكل ما تكبر الـ red marrow بتنكمش لـ ==axial skeleton== وأول الفخد والعضد."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="h01a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="310" height="50" rx="8" class="fg-box"/>
            <text x="20" y="31" class="t-b">Yolk sac</text>
            <text x="20" y="49" class="t-sm t-mut">Embryo, day 14–19: it all starts here</text>
            <path d="M165 60 L165 72" class="fg-arrow" marker-end="url(#h01a)"/>
            <rect x="10" y="74" width="310" height="50" rx="8" class="fg-acc"/>
            <text x="20" y="95" class="t-b">Fetal liver</text>
            <text x="20" y="113" class="t-sm t-mut">Main site in the 2nd trimester</text>
            <path d="M165 124 L165 136" class="fg-arrow" marker-end="url(#h01a)"/>
            <rect x="10" y="138" width="310" height="50" rx="8" class="fg-acc"/>
            <text x="20" y="159" class="t-b">Fetal bone marrow</text>
            <text x="20" y="177" class="t-sm t-mut">Starts in the 3rd trimester</text>
            <path d="M165 188 L165 200" class="fg-arrow" marker-end="url(#h01a)"/>
            <rect x="10" y="202" width="310" height="50" rx="8" class="fg-good"/>
            <text x="20" y="223" class="t-b">After birth: marrow only</text>
            <text x="20" y="241" class="t-sm t-mut">First 4 years: nearly all cavities red</text>
            <path d="M165 252 L165 264" class="fg-arrow" marker-end="url(#h01a)"/>
