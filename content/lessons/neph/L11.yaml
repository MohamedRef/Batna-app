        title: "الـ work-up"
        quote: "Diagnosis of AKI in pregnancy The diagnosis of AKI in pregnancy is not standardized in clinical practice due to inconsistency in the definition of pregnancy-related AKI and non-validation of the KDIGO (Kidney Disease Improving Outcomes) guidelines, RIFLE (Risk, Injury, Failure, Loss and End-stage) and the AKIN (Acute Kidney Injury Network) criteria for the non-pregnant population in pregnant women.(9) Furthermore, detection AKI is confounded by the physiological lowering of serum creatinine due to glomerular hyper filtration in pregnancy. For instance, an increase in serum creatinine concentration by 0.4 mg/dl, consistent with stage 1 in the AKIN criteria, may point towards significant kidney injury. Currently, there are no distinct criteria for the diagnosis of AKI in pregnancy. Attention should be paid to trends in serum creatinine levels in pregnancy, and even small changes in creatinine are sensitive in picking up early kidney injury in specific clinical settings. For example, in a woman with new onset hypertension, concomitant increase in serum creatinine by 0.3 mg/dl with increases in liver enzymes and thrombocytopenia, represents AKI and requires close follow of kidney function.(23) Initial evaluation for AKI should start with a comprehensive review of the patient's history of CKD, chronic hypertension, diabetes, preeclampsia in prior pregnancies, systemic lupus erythematous, and preexisting glomerular diseases. The onset of AKI during pregnancy by trimester can point towards the underlying etiology. While hyperemesis gravidarum and septic abortions are common causes of AKI in the first trimester, majority of AKI occurring in the second and trimester are specific to a pregnancy complication of preeclampsia, HELLP syndrome, AFLP, thrombotic microangiopathies like TTP, and placental abruptio. Atypical HUS and NSAID's induced kidney injury are common causes of AKI in the postpartum period. Diagnostic evaluation should include urinalysis, urine microscopy, comprehensive metabolic panel, coagulation panel, and appropriate serological workup along with a thorough review of medications. Serum complement levels can be elevated in pregnancy due to increased synthesis by the"
        text: |
          1. **History**: chronic kidney disease (CKD)، ضغط مزمن، سكر، preeclampsia قبل كده، systemic lupus erythematosus (SLE)، glomerulonephritis (GN).
          2. **الشهر**: أول الحمل غير آخره غير بعد الولادة.
          3. **Labs**: urinalysis و microscopy، metabolic و coagulation panels، serology، ومراجعة الأدوية.
          4. **Ultrasound**: يفرّق الـ hydronephrosis المرضي من ==physiological hydronephrosis==، و Doppler لو شاكك في embolism.
      - kind: aside
        tone: trap
        page: 362
        quote: "liver and can complicate the diagnosis of lupus nephritis. Kidney ultrasound should be performed to rule out post-obstructive causes of AKI, such as pathological hydronephrosis. Pathological hydronephrosis should be differentiated from physiological hydronephrosis. Due to the hypercoagulable state of pregnancy, ultrasound with doppler should be performed if there is a high suspicion for the embolic disease. Common causes of AKI in the second and third trimester like preeclampsia, HELLP syndrome, TTP, aHUS, AFLP, and lupus nephritis can have overlapping features and requires detailed evaluation.(23) Kidney biopsy should be considered when the laboratory evaluation for AKI is non-diagnostic, and a definitive diagnosis will help facilitate appropriate treatment outweighing the risks of biopsy. The decision to perform a kidney biopsy is based on gestation age, available treatment options, and viability of pregnancy. Since late-term pregnancy biopsies have a higher risk of complication, notably after 25 weeks, it is recommended to biopsy in the first and second trimesters, and best to avoid in the third trimester unless treatment of AKI leads to improvement in maternal and fetal outcomes.(24) Depending on fetal maturity, and the impact of declining kidney function on fetus and mother, early delivery should be weighed and offered when feasible. Delivery prior to biopsy may be a more prudent option for the late-term pregnancies, especially if the fetus has reached viability. Complications and risks should be thoroughly discussed with the patient, including the risk of major bleeding requiring transfusion, embolization, severe obstetric complications, early preterm delivery, and fetal death.(25) Women at high risk for developing an AKI should be evaluated in the postpartum period with regular monitoring of blood pressure, kidney function, and proteinuria. This includes women with CKD prior to pregnancy, as well as those who developed preeclampsia during pregnancy. aHUS is usually diagnosed postpartum, and when suspected, laboratory work including complement levels should be completed during hospitalization. Hemodynamic monitoring in high-risk pregnancies should be performed during follow-up visit as postpartum derangements may be associated with developing postpartum cardiomyopathy or HUS.(13)"
        text: |
          الـ ==complement== بيعلى في الحمل (الكبد بيصنّع أكتر). فـ C3 طبيعي مش بينفي **lupus nephritis** عند حامل.
