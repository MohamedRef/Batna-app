        quote: "A successful renal transplant restores ovulation due to remission of hypothalamus– pituitary–ovarian axis dysfunction, as there are significant declines in luteinizing hormone, follicle-stimulating hormone, and prolactin levels, and a rise in estrogen levels by the end of the first year, with the restoration of menses and ovulation."
        text: |
          ارجع لدرس الغسيل: الـ prolactin كان عالي عشان الكلية مش بتنضفه، والـ LH والـ FSH عاليين عشان مفيش feedback. الكلية الجديدة بتصلّح الاتنين، فالكتاب بيقول ==remission of hypothalamus–pituitary–ovarian axis dysfunction==: الـ LH والـ FSH والـ prolactin بيقلّوا، والـ estrogen بيعلى، والدورة والـ ovulation يرجعوا.

          وده بالظبط سبب الخطر: الحمل ممكن يحصل ==incidentally and rapidly==، قبل ما الـ graft يستقر. فالكتاب بيقول لازم الخطر ده يتقال لكل ست في سن الإنجاب **وجوزها**.
