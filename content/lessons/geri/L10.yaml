      - kind: aside
        tone: exam
        page: 186
        quote: "Guidelines (2015) recommend AGAINST the use of combination prednisone, azathioprine, and N-acetylcysteine.(because this combination increases mortality in IPF patients)."
        text: "سؤال امتحان كلاسيك: الـ IPF ممنوع فيه steroid monotherapy (مفيش survival benefit)، وممنوع الـ triple combination (prednisone + azathioprine + N-acetylcysteine (NAC)) لأنها بتزوّد الـ mortality. ولو هتدّي steroid لأي سبب، استبعد latent tuberculosis (TB) الأول."
      - kind: reveal
        page: 186
        quote: "Guidelines recommend that patients with IPF should NOT be treated with corticosteroid Monotherapy."
        prompt: "ليه الـ steroids مش بتفيد الـ IPF، وليه الـ triple combination بالذات خطر؟"
        answer: |
          الكتاب: الـ retrospective studies ما لقيتش **survival benefit** للـ steroids، والـ guidelines بتقول **NOT** monotherapy، والـ combination (prednisone + azathioprine + N-acetylcysteine) **بتزوّد الـ mortality**.

          التفسير المقبول (مش في الكتاب): افتكر الـ pathogenesis. الـ IPF مش التهاب، فالـ steroids بتشيل حاجة مش هي المحرك. يعني المريض بياخد الأعراض الجانبية كلها (عدوى، سكر، عضم) من غير فايدة. وعشان الـ steroids بتصحّي الـ TB، لو اتدّت لأي سبب لازم تستبعد **latent tuberculosis** الأول.
      - kind: check
        page: 186
        quote: "Oxygen therapy in patients with hypoxemia at rest or with exercise:\n  1) Partial pressure of oxygen [PaO] < 55 mmHg.\n  2) Oxygen saturation by pulse oximetry [SpO] < 88%.\n  The goal is to maintain an oxygen saturation of at least 90% at rest, with sleep, and with exertion.\n  Vaccinate_patients against influenza and pneumococcal infection."
        question: "When should oxygen be given in pulmonary fibrosis, and to what target?"
        options: ["PaO2 < 55 or SpO2 < 88%; keep saturation ≥ 90%", "SpO2 < 94%; keep saturation ≥ 98%", "Only during sleep", "Only if PaCO2 is raised"]
        answer: 0
        why:
          - "صح: at rest أو مع المجهود، والهدف 90% على الأقل في الراحة والنوم والمجهود."
          - "الأرقام دي أعلى من اللي في الكتاب."
          - "الهدف في الراحة والنوم والمجهود."
          - "الكتاب بيعتمد على الـ hypoxemia مش الـ CO2."
      - kind: explain
        page: 186
        quote: "The goal is to maintain an oxygen saturation of at least 90% at rest, with sleep, and with exertion."
        title: "الأكسجين: إمتى ولحد فين؟"
        text: |
          - ابدأ لو **PaO2 < 55 mmHg** أو **SpO2 < 88%**، في الراحة **أو** مع المجهود.
          - الهدف: saturation ==90% على الأقل== في الراحة **والنوم والمجهود**.

          ليه الأرقام دي؟ التفسير المقبول (مش في الكتاب): تحت الـ 88% تقريبًا إنت على الجزء المنحدر من الـ oxygen dissociation curve، يعني أي نزول صغير في الـ PaO2 بيوقّع الـ saturation جامد. وليه في النوم والمجهود كمان؟ لأن ده بالظبط وقت ما الـ IPF بيـ desaturate (الدم بيجري أسرع مع المجهود، والتنفس بيقل في النوم).
      - kind: explain
        remind: [geri.L10.083]
        page: 187
        quote: "Empiric use of these medications without a specific diagnosis should be discouraged because they have significant toxicities."
        title: "الـ non-idiopathic fibrosis"
        text: |
          - نفس الـ general strategies، وعالج الـ comorbidities: **COPD، obstructive sleep apnoea (OSA)، gastro-oesophageal reflux disease (GERD)، coronary artery disease (CAD)**.
          - أهم خطوة: ==identify the cause== وعالجه.
          - Oxygen لو arterial partial pressure of oxygen (PaO2) < 55 أو oxygen saturation by pulse oximetry (SpO2) < 88%، والهدف ≥ 90%.
          - Steroids و cytotoxics (cyclophosphamide، azathioprine، methotrexate كـ steroid-sparing) **لتشخيصات محددة بس**. Empiric من غير تشخيص = لأ، لأن الـ toxicity كبيرة.
          - الكتاب (ATS 2022): nintedanib و pirfenidone لسه **مش approved** للـ non-IPF.
      - kind: update
        page: 186
        quote: "Update: (ATS 2022) Use of Nintedanib and Pirfenidone for treatment NON- idiopathic pulmonary fibrosis is still under debate and Not yet approved. (Till now only approved for tt IPF)."
        text: "الـ nintedanib اتعمله approval للـ progressive pulmonary fibrosis غير الـ IPF (FDA 2020)، والـ guideline بتاعة 2022 بتنصح بيه في الـ progressive pulmonary fibrosis (PPF). في الامتحان: إجابة الكتاب (لسه مش approved)."
        ref: "ATS/ERS/JRS/ALAT IPF and PPF guideline, 2022"
