      - kind: update
        page: 20
        quote: "Therapy with ACE-I and beta-blocker (Up-titrate to maximum tolerated evidence-based doses)"
        text: "الـ ESC 2021 ما بقاش سلّم: بيبدأ **الأربع أدوية** بدري مع بعض في الـ HFrEF: ACEI أو ARNI، beta-blocker، MRA، و **SGLT2 inhibitor** زي dapagliflozin أو empagliflozin. في الامتحان: سلّم الكتاب."
        ref: "ESC heart failure guidelines, 2021"
      - kind: check
        page: 20
        quote: "Sinus rhythm, QRS duration ≥130 msec"
