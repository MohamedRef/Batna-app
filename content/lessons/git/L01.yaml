  - id: git.L01.lesson11
    title: "علاج الـ H. pylori: أنهي regimen ولمين؟"
    hook: "مريض أول مرة ياخد علاج، ومريض تاني فشل معاه علاجين. نختار إيه، وليه الـ clarithromycin مش أول اختيار؟"
    minutes: 9
    pages: [31, 31]
    topics: [hp-treatment]
    goals:
      - "تكتب 3 regimens لمريض treatment-naive"
      - "تختار الـ regimen للمريض اللي فشل قبل كده"
      - "تعرف الـ key concepts: الانتشار، الـ test of cure، والـ susceptibility"
    status: unverified
    steps:
      - kind: explain
        page: 31
        quote: "The prevalence of H. pylori infection in North America is decreasing over time but remains substantial at 30%-40%"
        title: "قبل العلاج: الـ key concepts"
        text: |
          الكتاب بيبدأ علاج الـ **treatment-naïve** بجدول، وتحته **key concepts**:

          - الـ H. pylori في North America بيقل بس لسه ==30%-40%==. بيتلقط في **الطفولة**، وأكتر في الـ non-White، والزحمة والـ sanitation الوحشة، والمهاجرين من أماكن endemic.
          - قرار **test** وقرار **treat** ==قرار واحد== مش اتنين: يعني لو مش ناوي تعالج ما تعملش test.
          - الـ **susceptibility tests** (culture أو PCR أو next generation sequencing) بقت متاحة أكتر.

          ليه بيتلقط في الطفولة؟ التفسير المقبول (مش في الكتاب): العدوى بتنتقل من شخص لشخص في البيت (oral-oral أو fecal-oral)، والأطفال في البيوت الزحمة بيتعرضوا أكتر.
      - kind: explain
        page: 31
        quote: "| Regimen | Drugs (doses) | Dosing frequency | FDA Approval | Recommendation |\n|---|---|---|---|---|\n| Optimized bismuth quadruple | PPI (standard dose); Bismuth subcitrate (120 - 300 mg) or subsalicylate (300 mg); Tetracycline (500 mg); Metronidazole (500 mg) | b.i.d.; q.i.d.; q.i.d.; t.i.d. or q.i.d. | No | Strong (moderate quality of evidence) |\n| Rifabutin triple (Talicia) | Omeprazole (10 mg); Amoxicillin (250 mg); Rifabutin (12.5 mg) | 4 capsules t.i.d. | Yes | Conditional (low quality of evidence) |\n| PCAB dual (Voquezna DualPak) | Vonoprazan (20 mg); Amoxicillin (1,000 mg) | b.i.d; t.i.d | Yes | Conditional (moderate quality of evidence) |\n| PCAB triple (Voquezna TriplePak) | Vonoprazan (20 mg); Clarithromycin (500 mg); Amoxicillin (1,000 mg) | b.i.d | Yes | Conditional (moderate quality of evidence) |"
        title: "المنيو: 4 regimens لمريض treatment-naive"
        text: |
          الجدول في الكتاب فيه 4، والسؤال بيقول «اكتب 3»:

          - ==Optimized bismuth quadruple==: **Proton pump inhibitor (PPI)** b.i.d. + **bismuth** q.i.d. + **tetracycline 500 mg** q.i.d. + **metronidazole 500 mg** t.i.d. or q.i.d. الوحيد اللي توصيته **strong**، وهو **مش Food and Drug Administration (FDA) approved**.
          - **Rifabutin triple (Talicia)**: omeprazole 10 + amoxicillin 250 + rifabutin 12.5 mg في الكبسولة، **4 capsules t.i.d.**
          - **Potassium-competitive acid blocker (PCAB) dual**: **vonoprazan 20 mg** b.i.d. + amoxicillin 1 g t.i.d.
          - **PCAB triple**: vonoprazan + clarithromycin 500 + amoxicillin 1 g، الكل b.i.d.
      - kind: mnemonic
        page: 31
        quote: "| Regimen | Drugs (doses) | Dosing frequency | FDA Approval | Recommendation |\n|---|---|---|---|---|\n| Optimized bismuth quadruple | PPI (standard dose); Bismuth subcitrate (120 - 300 mg) or subsalicylate (300 mg); Tetracycline (500 mg); Metronidazole (500 mg) | b.i.d.; q.i.d.; q.i.d.; t.i.d. or q.i.d. | No | Strong (moderate quality of evidence) |\n| Rifabutin triple (Talicia) | Omeprazole (10 mg); Amoxicillin (250 mg); Rifabutin (12.5 mg) | 4 capsules t.i.d. | Yes | Conditional (low quality of evidence) |\n| PCAB dual (Voquezna DualPak) | Vonoprazan (20 mg); Amoxicillin (1,000 mg) | b.i.d; t.i.d | Yes | Conditional (moderate quality of evidence) |\n| PCAB triple (Voquezna TriplePak) | Vonoprazan (20 mg); Clarithromycin (500 mg); Amoxicillin (1,000 mg) | b.i.d | Yes | Conditional (moderate quality of evidence) |"
        word: "BMTP"
        parts:
          - { key: "B", text: "Bismuth (subcitrate 120-300 mg or subsalicylate 300 mg) q.i.d." }
          - { key: "M", text: "Metronidazole 500 mg t.i.d. or q.i.d." }
          - { key: "T", text: "Tetracycline 500 mg q.i.d." }
          - { key: "P", text: "PPI standard dose b.i.d." }
        hook: "**«بي إم تي بي»**: الـ bismuth quadruple زي **ميكروباص BMTP**، أربع ركاب، والـ PPI بس اللي بيركب مرتين في اليوم."
      - kind: explain
        page: 31
        quote: "3. Clarithromycin- and levofloxacin-containing treatment regimens should be avoided in the absence of demonstrated macrolide and quinolone susceptibility, respectively."
        title: "ليه كل دوا في الـ regimen؟"
        text: |
          التفسير المقبول (مش في الكتاب) لتركيبة العلاج:

          - الـ **PPI** أو الـ **vonoprazan**: بيعلّوا الـ pH، فالمضادات الحيوية زي الـ **amoxicillin** والـ clarithromycin تشتغل أحسن، والبكتيريا تبدأ تتكاثر فتبقى حساسة ليها. والـ **vonoprazan** (potassium-competitive acid blocker (PCAB)) بيقفل الحمض أقوى وأسرع، فينفع مع amoxicillin لوحده (dual).
          - الـ **bismuth**: بيقتل البكتيريا موضعيًا، ومفيش resistance ليه.
          - **مضادّين حيويين** أو أكتر: علشان لو البكتيريا resistant لواحد، التاني يلحقها.

          وده سبب قاعدة الكتاب: ==clarithromycin و levofloxacin== بس لو الـ susceptibility **متثبتة**، لأن الـ resistance ليهم منتشرة، والـ regimen هيفشل.
      - kind: aside
        tone: trap
        page: 31
        quote: "3. Clarithromycin- and levofloxacin-containing treatment regimens should be avoided in the absence of demonstrated macrolide and quinolone susceptibility, respectively."
        text: |
          فخ مشهور: **clarithromycin** و **levofloxacin** متديهمش إلا لو الـ susceptibility **متثبتة**.

          وكل مريض اتعالج لازم **test of cure** (UBT أو fecal antigen أو biopsy) **at least 4 weeks** بعد العلاج.
      - kind: explain
        page: 31
        quote: "6. In treatment-experienced patients with persistent H. pylori infection who have not previously received bismuth quadruple therapy, optimized bismuth quadruple therapy is suggested (conditional recommendation; very low quality of evidence)"
        title: "المريض فشل معاه العلاج: نروح فين؟"
        text: |
          توصيات الـ **treatment-experienced** في الكتاب (6 لـ 12):
          - **ماخدش bismuth quadruple قبل كده** (أو خد PPI-clarithromycin triple) ← ==optimized bismuth quadruple==، ومفضّل على الـ quinolone-based.
          - **خد bismuth quadruple** ← ==rifabutin triple==.
          - **Clarithromycin-sensitive** متثبت ← PPI- أو PCAB-clarithromycin triple.
          - **Levofloxacin triple**: بس مع strain **levofloxacin-sensitive**، ولما الـ bismuth quadruple والـ rifabutin triple اتجربوا أو مش متاحين.
          - **High-dose PPI أو PCAB dual**: **مفيش evidence كفاية** من North America.
          - **Probiotics**: مفيش evidence إنها بتحسّن الـ efficacy أو الـ tolerability.

          المنطق ببساطة: ما تكررش نفس الـ regimen اللي فشل، لأن البكتيريا اللي فضلت غالبًا resistant له.
