        title: "الـ medium vessel vasculitis: ليه دول بالذات في القايمة؟"
        quote: "Familial Mediterranean fever."
        text: |
          الكتاب بيعد الـ **medium vessel vasculitis**: **Kawasaki's disease**، **polyarteritis nodosa**، **hepatitis B-related**، **familial Mediterranean fever**، و **cutaneous PAN**.

          التفسير المقبول (مش في الكتاب): الرابط إن الشريان المتوسط (اللي داخل للعضو) هو اللي ملتهب، فالنتيجة **aneurysms و infarcts**: في الـ Kawasaki الـ ==coronary== aneurysms، وفي الـ PAN الـ mesenteric و renal aneurysms (ص 143).
          - **Hepatitis B**: الـ virus بيعمل immune complexes في جدار الشريان، فبيعمل PAN، وعشان كده بتدوّر عليه في أي PAN.
          - **FMF**: مهم عندنا في مصر؛ الالتهاب المتكرر ممكن يصاحبه PAN-like vasculitis.
          - **Cutaneous PAN**: نفس الشكل بس في الجلد بس، من غير أعضاء جوه.

          وليه الكتاب بيبدأ بيهم قبل الـ Kawasaki والـ PAN؟ عشان تفتكر القاعدة اللي من أول المحاضرة: **حجم الوعاء بيحدد الصورة**. الـ large vessel = فرق نبض وclaudication، الـ medium = aneurysms وinfarcts ووجع خصية وmononeuritis، والـ small = purpura وGN ونزيف رئة. لما تقابل عيان، ابدأ بسؤال **أنهي حجم؟** وبعدها دوّر جوه المجموعة دي على المرض بالسن والعلامات: طفل بسخونية = Kawasaki، شاب عنده hepatitis B وضغط = PAN.
