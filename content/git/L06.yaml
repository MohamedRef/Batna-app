items:
  # ---------- p206-207: definition and epidemiology ----------
  - id: git.L06.001
    kind: card
    topic: epidemiology
    front: Define inflammatory bowel disease, per the lecture.
    back: A chronic inflammatory condition of the intestines marked by remissions and relapses, with two major subtypes, ulcerative colitis and Crohn disease.
    src: { page: 206, quote: "Inflammatory Bowel Disease is a chronic inflammatory condition of the intestines that is marked by remission and relapses" }
    status: unverified
  - id: git.L06.002
    kind: card
    topic: epidemiology
    front: What common pathogenesis do UC and Crohn disease share?
    back: A dysregulated mucosal immune response to antigens of the normal commensal gut microbiota.
    src: { page: 206, quote: "derived from a dysregulated mucosal immune response to antigenic components of the normal commensal microbiota" }
    status: unverified
    tags: [high-yield]
  - id: git.L06.003
    kind: cloze
    topic: epidemiology
    text: "In North America, ulcerative colitis has an incidence of {{c1::8–15}} per 100,000 and a prevalence of {{c2::170–230}} per 100,000."
    src: { page: 206, quote: "The incidence of ulcerative colitis in North America is estimated to be 8–15 per 100,000 persons, with a prevalence of 170–230 per 100,000" }
    status: unverified
    tags: [numbers]
  - id: git.L06.004
    kind: cloze
    topic: epidemiology
    text: "Crohn disease has an incidence of {{c1::5–15}} per 100,000 and a prevalence of {{c2::140–200}} per 100,000."
    src: { page: 206, quote: "Crohn disease has an estimated incidence of 5–15 per 100,000 and prevalence of 140– 200 per 100,000" }
    status: unverified
    tags: [numbers]
  - id: git.L06.005
    kind: enumerate
    topic: epidemiology
    prompt: Where is IBD more common? Mention the groups with higher incidence and prevalence.
    points:
      - Developed nations
      - Northern locale (within the northern hemisphere)
      - Urban environments
      - Caucasians
      - Persons of Jewish ethnicity
    pass: 4
    src: { page: 206, quote: "found in developed nations, northern locale (at least within the northern hemisphere), and urban" }
    status: unverified
  - id: git.L06.006
    kind: card
    topic: epidemiology
    front: How have CD and UC incidence changed in industrialized versus developing countries?
    back: "Industrialized: Crohn disease has risen significantly over the past half century while UC stayed relatively steady. Developing: both have risen dramatically."
    src: { page: 207, quote: "Whereas that of ulcerative colitis has remained relatively steady. In developing countries, the incidence of both forms of IBD has dramatically risen." }
    status: unverified
  - id: git.L06.007
    kind: cloze
    topic: epidemiology
    text: "Median age at diagnosis: Crohn disease in the {{c1::third}} decade, ulcerative colitis in the {{c2::fourth}} decade; a second smaller peak in the {{c3::sixth and seventh}} decades is clearer for UC."
    src: { page: 207, quote: "The median age of diagnosis for Crohn disease and ulcerative colitis is the third and fourth decades of life, respectively." }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L06.008
    kind: card
    topic: epidemiology
    front: Sex distribution of IBD?
    back: Males and females are equally affected.
    src: { page: 207, quote: "As regards the gender, both males and females are equally affective." }
    status: unverified
  # ---------- p207-208: etiology ----------
  - id: git.L06.009
    kind: card
    topic: etiology
    front: Three groups of factors interplay in the cause of IBD?
    back: Genetic, microbial (and environmental), and immunologic factors.
    src: { page: 207, quote: "interplay of genetic, microbial, and immunologic factors clearly exists" }
    status: unverified
  - id: git.L06.010
    kind: cloze
    topic: etiology
    text: "Crohn susceptibility genes: {{c1::NOD2/CARD15}} on chromosome {{c2::16}} and {{c3::IL23R}} on chromosome 1."
    src: { page: 207, quote: "NOD2/CARD15 on chromosome 16 and IL23R on chromosome 1, in Crohn disease" }
    status: unverified
    tags: [high-yield, numbers]
  - id: git.L06.011
    kind: card
    topic: etiology
    front: Are NOD2 or IL23R mutations found in most Crohn patients?
    back: No. They are present in only a minority of Crohn disease cases.
    src: { page: 207, quote: "mutations in these genes are present in only a minority of Crohn disease cases" }
    status: unverified
  - id: git.L06.012
    kind: card
    topic: etiology
    front: What did animal studies show about gut bacteria in IBD?
    back: Commensal gut bacteria must be present for IBD to occur; the colitis comes from an inappropriate immune response to flora that healthy people tolerate.
    src: { page: 207, quote: "Animal studies have demonstrated that the presence of commensal gut bacteria is necessary for IBD to occur." }
    status: unverified
  - id: git.L06.013
    kind: card
    topic: etiology
    front: Effect of cigarette smoking on Crohn disease versus ulcerative colitis?
    back: Smoking increases the risk of Crohn disease but is protective for ulcerative colitis.
    src: { page: 207, quote: "Cigarette smoking increases the risk for Crohn disease but is protective for ulcerative colitis." }
    status: unverified
    tags: [high-yield]
  - id: git.L06.014
    kind: cloze
    topic: etiology
    text: "{{c1::Oral contraceptives}} and {{c2::NSAIDs}} are implicated as risk factors for IBD, while {{c3::appendectomy}} may protect against UC."
    src: { page: 207, quote: "Both oral contraceptive and nonsteroidal anti-inflammatory medications have been implicated as risk factors for IBD. Appendectomy may protect against the UC." }
    status: unverified
  - id: git.L06.015
    kind: enumerate
    topic: etiology
    prompt: Mention the characteristics of gut-associated lymphoid tissue (GALT).
    points:
      - A unique structure
      - Physiologic inflammation
      - A tendency to suppress immune responses (oral tolerance)
      - Production of secretory immunoglobulins
    pass: 3
    src: { page: 207, quote: "a unique structure, physiologic inflammation, a tendency to suppress immune responses (oral tolerance), and production of secretory immunoglobulins" }
    status: unverified
  - id: git.L06.016
    kind: card
    topic: etiology
    front: What ultimately causes the inflammation of IBD?
    back: Overproduction of proinflammatory mediators relative to anti-inflammatory mediators, from adaptive (T helper) and innate (macrophage, dendritic) cells that excessively infiltrate the gut.
    src: { page: 208, quote: "IBD is ultimately caused by overproduction of proinflammatory mediators relative to anti-inflammatory mediators" }
    status: unverified
  - id: git.L06.017
    kind: cloze
    topic: etiology
    text: "Crohn disease preferentially shows overactivity of {{c1::Th1 and Th17}} cells; ulcerative colitis of {{c2::Th2}} cells. Both overproduce the innate cytokines {{c3::TNF and IL-6}}."
    src: { page: 208, quote: "Crohns disease (CD) may preferentially exhibit overactivity of Th1 and Th17 cells, and ulcerative colitis (UC) may exhibit overactivity of Th2 cells" }
    status: unverified
    tags: [high-yield]
  - id: git.L06.018
    kind: card
    topic: etiology
    front: How do the innate and adaptive arms of immunity differ?
    back: "Innate: rapid and hard-wired. Adaptive: delayed in onset, with memory."
    src: { page: 208, quote: "immune response has two major arms: innate (rapid, hard-wired) and adaptive (delayed in onset with memory)" }
    status: unverified
  - id: git.L06.019
    kind: mcq
    topic: etiology
    stem: A 24-year-old man asks whether his lifestyle affects his newly diagnosed Crohn disease. He smokes 15 cigarettes a day, had an appendectomy at 12, and takes ibuprofen for back pain. Which statement fits the lecture?
    options:
      - Smoking raises his risk of Crohn disease
      - Smoking protects against Crohn disease
      - His appendectomy protects against Crohn disease
      - NSAIDs protect against IBD
      - NOD2 mutations are found in most Crohn patients
    answer: 0
    why:
      - "Correct: smoking increases the risk of Crohn disease (p207)."
      - Smoking is protective for ulcerative colitis, not Crohn disease.
      - Appendectomy may protect against UC; the book says nothing protective for CD.
      - NSAIDs are implicated as risk factors for IBD.
      - NOD2/CARD15 mutations are present in only a minority of Crohn cases.
    src: { page: 207, quote: "Cigarette smoking increases the risk for Crohn disease but is protective for ulcerative colitis." }
    status: unverified
  # ---------- p208-209: Crohn's pattern ----------
  - id: git.L06.020
    kind: card
    topic: cd-pattern
    front: Who described Crohn disease, where and when?
    back: Dr. Crohn, in the US, in 1932.
    src: { page: 208, quote: "is the name of the doctor who first described the disease in US in 1932" }
    status: unverified
  - id: git.L06.021
    kind: card
    topic: cd-pattern
    front: Depth of inflammation in Crohn disease, and why it matters?
    back: Typically transmural, so it often leads to perforating complications or to progressive fibrosis and stricturing.
    src: { page: 208, quote: "The inflammation in Crohn disease is typically transmural. This frequently leads to complications from perforating disease or from progressive fibrosis and stricturing." }
    status: unverified
    tags: [high-yield]
  - id: git.L06.022
    kind: enumerate
    topic: cd-pattern
    prompt: Mention the three phenotypes (behaviours) of Crohn disease.
    points:
      - Inflammatory
      - Stricturing
      - Perforating (penetrating), including abscesses and fistulae
    pass: 3
    src: { page: 208, quote: "three phenotypes: inflammatory, stricturing, or perforating disease (the latter including abscesses and fistulae)" }
    status: unverified
    tags: [high-yield]
  - id: git.L06.023
    kind: order
    topic: cd-pattern
    prompt: Order the usual progression of Crohn behaviour in one patient.
    steps:
      - Inflammatory disease
      - Penetrating disease
      - Fibrosis and stricturing
    src: { page: 208, quote: "inflammatory disease frequently progresses to penetrating disease, and then to fibrosis and stricturing" }
    status: unverified
  - id: git.L06.024
    kind: card
    topic: cd-pattern
    front: Which part of the gut can Crohn disease affect, and in what pattern?
    back: Any part of the alimentary canal, often in a nonconfluent pattern (skip lesions).
    src: { page: 208, quote: "Crohn disease may affect any part of the alimentary canal, and may do so in a nonconfluent (socalled skip lesion) pattern." }
    status: unverified
  - id: git.L06.025
    kind: cloze
    topic: cd-pattern
    text: "Nearly half of Crohn patients have inflammation localized to the {{c1::terminal ileum and cecum}}."
    src: { page: 208, quote: "Nearly half of all patients with Crohn disease have inflammation localized to the Terminal ileum and cecum" }
    status: unverified
    tags: [high-yield]
  - id: git.L06.026
    kind: card
    topic: cd-pattern
    front: How common is Crohn disease of the esophagus, stomach or duodenum?
    back: Rare, and virtually unheard of without small bowel or colonic disease.
    src: { page: 208, quote: "Crohn disease of the esophagus, stomach, or duodenum is rare, and virtually unheard of in the absence of small bowel or colonic disease" }
    status: unverified
  - id: git.L06.027
    kind: card
    topic: cd-pattern
    front: Perianal Crohn disease is most often seen with disease where?
    back: With terminal ileal disease. Perianal abscesses and fistulae are common.
    src: { page: 209, quote: "Perianal disease, including abscesses and fistulae, is commonly encountered, particularly in conjunction with terminal ileal disease." }
    status: unverified
  - id: git.L06.028
    kind: table
    topic: cd-pattern
    title: "Montreal classification of Crohn disease (book Table 1)"
    columns: [Domain, Montreal categories]
    rows:
      - [Age at diagnosis, "A1 <16 years; A2 17–40 years; A3 >40 years"]
      - [Location, "L1 ileal; L2 colonic; L3 ileocolonic; L4 isolated upper disease"]
      - [Behaviour, "B1 non-stricturing, non-penetrating; B2 stricturing; B3 penetrating"]
      - [Modifier, "p = perianal disease"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 218, quote: "A1 <16 years A2 17-40 years A3 >40 years" }
    status: unverified
    tags: [high-yield, numbers]
  - id: git.L06.029
    kind: card
    topic: cd-pattern
    front: How does the Montreal classification of Crohn disease differ from Vienna?
    back: "Montreal splits age into three (A1 <16, A2 17–40, A3 >40; Vienna had A1 <40 and A2 >40), calls L4 isolated upper disease, and adds the p perianal modifier."
    src: { page: 218, quote: "A1 < 40 years A2 >40 years" }
    status: unverified
  - id: git.L06.030
    kind: cloze
    topic: cd-pattern
    text: "In the Montreal classification of CD, L1 = {{c1::ileal}}, L2 = {{c2::colonic}}, L3 = {{c3::ileocolonic}}."
    src: { page: 218, quote: "L1 ileal L2 colonic L3 ileocolonic L4 isolated upper disease" }
    status: unverified
  - id: git.L06.031
    kind: mcq
    topic: cd-pattern
    stem: "A 15-year-old with Crohn disease has ileocolonic inflammation, an ileal stricture and a perianal fistula. How is he classified by Montreal?"
    options:
      - A1 L3 B2p
      - A1 L1 B3
      - A2 L3 B2p
      - A1 L3 B1p
      - A2 L2 B3
    answer: 0
    why:
      - "Correct: under 16 = A1, ileocolonic = L3, stricturing = B2, perianal modifier p."
      - The disease is ileocolonic (L3), and the perianal fistula is coded as the p modifier.
      - A2 is 17–40 years; he is 15.
      - B1 is non-stricturing, but he has a stricture.
      - Wrong age band and location.
    src: { page: 218, quote: "B1 non-stricturing, non-penetrating B2 stricturing B3 penetratng p perianal disease modifier" }
    status: unverified
  # ---------- p209: Crohn's symptoms and signs ----------
  - id: git.L06.032
    kind: card
    topic: cd-clinical
    front: Onset and course of Crohn disease?
    back: Insidious onset and a highly variable course, mostly recurring symptomatic episodes with periods of remission.
    src: { page: 209, quote: "The onset of symptoms in Crohn disease is typically insidious, and the subsequent clinical course is highly variable." }
    status: unverified
  - id: git.L06.033
    kind: card
    topic: cd-clinical
    front: Most typical symptoms of Crohn disease, and how does its diarrhea differ from UC?
    back: Abdominal pain and diarrhea; unlike UC, the diarrhea is often nonbloody. Fever and weight loss are common.
    src: { page: 209, quote: "Abdominal pain and diarrhea are the most typical symptoms. Unlike ulcerative colitis, the diarrhea in Crohn disease is often nonbloody." }
    status: unverified
    tags: [high-yield]
  - id: git.L06.034
    kind: card
    topic: cd-clinical
    front: What dictates a Crohn patient's symptoms and signs?
    back: The location and phenotype of disease (inflammatory, stricturing or perforating), with the severity of inflammation.
    src: { page: 209, quote: "the location and phenotype of disease (inflammatory, stricturing, or perforating), along with the severity of inflammation, dictate" }
    status: unverified
  - id: git.L06.035
    kind: table
    topic: cd-clinical
    title: Symptoms of Crohn fistulae by the organ involved
    columns: [Fistula to, Symptom]
    rows:
      - [Gut, "Diarrhea, weight loss"]
      - [Skin, Drainage]
      - [Vagina, Drainage]
      - [Bladder, Pneumaturia]
    blanks: [[0, 1], [3, 1]]
    src: { page: 209, quote: "gut—diarrhea, weight loss; skin—drainage; vagina—drainage; bladder—pneumaturia" }
    status: unverified
  - id: git.L06.036
    kind: card
    topic: cd-clinical
    front: Characteristic features of a perianal fistula?
    back: Pain and drainage of purulent or fecal material.
    src: { page: 209, quote: "Pain and drainage of purulent or fecal material are characteristic of perianal fistulae." }
    status: unverified
  - id: git.L06.037
    kind: card
    topic: cd-clinical
    front: Symptoms of stricturing Crohn disease?
    back: Obstructive symptoms of pain, abdominal distention, nausea and vomiting.
    src: { page: 209, quote: "Stricturing disease causes obstructive symptoms of pain, abdominal distention, nausea, and vomiting." }
    status: unverified
  - id: git.L06.038
    kind: cloze
    topic: cd-clinical
    text: "Crohn abdominal tenderness is most classically in the {{c1::right lower quadrant}}, and {{c2::temporal wasting and cachexia}} indicate significant malnutrition."
    src: { page: 209, quote: "Signs of Crohn disease include abdominal tenderness, most classically in the right lower quadrant." }
    status: unverified
  - id: git.L06.039
    kind: card
    topic: cd-clinical
    front: Signs of small bowel obstruction in stenosing Crohn disease?
    back: Distention, tympany and high-pitched bowel sounds.
    src: { page: 209, quote: "Typical symptoms of small bowel obstruction (distention, tympany, highpitched bowel sounds) may be present in stenosing disease." }
    status: unverified
  - id: git.L06.040
    kind: card
    topic: cd-clinical
    front: How are perianal and cutaneous fistulae found on examination?
    back: By a careful perineal and skin examination; they are readily identified.
    src: { page: 209, quote: "Perianal and cutaneous fistulae are readily identified on a careful perineal and skin examination." }
    status: unverified
  - id: git.L06.041
    kind: mcq
    topic: cd-clinical
    stem: A 38-year-old woman with ileal Crohn disease complains of passing air bubbles in her urine and recurrent urinary infections. What is the most likely complication?
    options:
      - Enterovesical fistula
      - Enterocutaneous fistula
      - Ileal stricture
      - Calcium oxalate stone
      - Rectovaginal fistula
    answer: 0
    why:
      - "Correct: a fistula to the bladder causes pneumaturia (p209)."
      - A skin fistula causes drainage on the skin, not pneumaturia.
      - A stricture causes obstructive pain, distention and vomiting.
      - Oxalate stones cause colic and hematuria, not air in the urine.
      - A vaginal fistula causes vaginal drainage.
    src: { page: 209, quote: "gut—diarrhea, weight loss; skin—drainage; vagina—drainage; bladder—pneumaturia" }
    status: unverified
  # ---------- p210: Crohn's labs ----------
  - id: git.L06.042
    kind: card
    topic: cd-labs
    front: Is there a diagnostic laboratory test for Crohn disease?
    back: No. No single laboratory test is diagnostic or specific.
    src: { page: 210, quote: "No single laboratory test is diagnostic or specific for Crohn disease." }
    status: unverified
  - id: git.L06.043
    kind: enumerate
    topic: cd-labs
    prompt: Enumerate the common blood findings in Crohn disease.
    points:
      - At least mild anemia, often iron deficiency
      - Leukocytosis and thrombocytosis (systemic inflammation)
      - Low albumin (protein-losing enterocolitis or malnutrition)
      - "Low minerals (calcium, magnesium) and vitamins (B12, D, folate) from malabsorption"
      - Raised CRP and, less so, ESR
    pass: 4
    src: { page: 210, quote: "Patients are typically at least mildly anemic, often with iron deficiency. Leukocytosis and thrombocytosis are common" }
    status: unverified
  - id: git.L06.044
    kind: card
    topic: cd-labs
    front: Three causes of malabsorption in Crohn disease that lower minerals and vitamins?
    back: Inflammation, bacterial overgrowth, and surgical resection.
    src: { page: 210, quote: "Malabsorption due to inflammation, bacterial overgrowth, or surgical resection may lead to diminished levels of various minerals" }
    status: unverified
  - id: git.L06.045
    kind: card
    topic: cd-labs
    front: Why is serum albumin low in some Crohn patients?
    back: Protein-losing enterocolitis or malnutrition.
    src: { page: 210, quote: "Serum albumin may be low in the case of protein-losing enterocolitis or in malnutrition." }
    status: unverified
  - id: git.L06.046
    kind: card
    topic: cd-labs
    front: What stool findings are expected in Crohn disease?
    back: Excess fat (malabsorption) or fecal leukocytes (inflammation); studies must be negative for bacterial pathogens, C. difficile, and ova and parasites.
    src: { page: 210, quote: "Stool examination may reveal excess fat, indicative of malabsorption, or fecal leukocytes, indicative of gut inflammation." }
    status: unverified
  - id: git.L06.047
    kind: enumerate
    topic: cd-labs
    prompt: Mention the uses of fecal lactoferrin and calprotectin in IBD.
    points:
      - Distinguish IBD from IBS
      - Gauge disease activity
      - Predict flare
      - Monitor and assess response to treatment
    pass: 3
    src: { page: 210, quote: "Stool inflammatory markers like fecal lactoferrin and calprotectin, are available that can help distinguish IBD from irritable bowel syndrome" }
    status: unverified
    tags: [high-yield]
  - id: git.L06.048
    kind: enumerate
    topic: cd-labs
    prompt: Enumerate the serologic markers linked with Crohn disease.
    points:
      - ASCA (anti-Saccharomyces cerevisiae)
      - Anti-OmpC
      - Anti-I2
      - Anti-CBir1 (clostridial flagellin)
    pass: 3
    src: { page: 210, quote: "antibodies to the yeast Saccharomyces cerevisiae (ASCA), to bacterial proteins Omp-C and I2, and to clostridial flagellin, CBir-1" }
    status: unverified
  - id: git.L06.049
    kind: card
    topic: cd-labs
    front: P-ANCA is associated with which forms of IBD?
    back: Both ulcerative colitis and Crohn colitis.
    src: { page: 210, quote: "Antineutrophil cytoplasmic antibodies (ANCA, P-subtype) are associated with both ulcerative colitis and Crohn colitis." }
    status: unverified
  - id: git.L06.050
    kind: card
    topic: cd-labs
    front: How useful are IBD serologic markers as single tests?
    back: Limited diagnostic accuracy; in select situations they help distinguish Crohn disease from other inflammatory conditions.
    src: { page: 210, quote: "As individual tests, these markers have limited diagnostic accuracy" }
    status: unverified
  - id: git.L06.051
    kind: mcq
    topic: cd-labs
    stem: A 27-year-old woman has 6 months of loose stools and cramps that improve after defecation. Exam and blood count are normal. Which stool test best helps separate IBD from IBS?
    options:
      - Fecal calprotectin
      - Fecal fat
      - Stool ova and parasites
      - Serum ASCA alone
      - ESR
    answer: 0
    why:
      - "Correct: fecal calprotectin and lactoferrin help distinguish IBD from IBS (p210)."
      - Fecal fat shows malabsorption, not gut inflammation.
      - Ova and parasites exclude infection but do not separate IBD from IBS.
      - Serologic markers alone have limited diagnostic accuracy.
      - ESR is a nonspecific marker of inflammation.
    src: { page: 210, quote: "fecal lactoferrin and calprotectin, are available that can help distinguish IBD from irritable bowel syndrome (IBS)" }
    status: unverified
  # ---------- p211-212: Crohn's imaging and endoscopy ----------
  - id: git.L06.052
    kind: card
    topic: cd-imaging
    front: Role of plain abdominal films in Crohn disease?
    back: Detecting obstruction and megacolon; otherwise limited.
    src: { page: 211, quote: "Standard abdominal plain films are useful for detecting obstructive disease and megacolon" }
    status: unverified
  - id: git.L06.053
    kind: card
    topic: cd-imaging
    front: Two common CT findings of the gut in Crohn disease?
    back: Bowel wall thickening and excessive mesenteric fat proliferation (creeping fat). CT also shows abscesses and inflammatory masses.
    src: { page: 211, quote: "Common abnormalities of the gut include thickening and excessive mesenteric fat proliferation (so-called creeping fat)." }
    status: unverified
    tags: [high-yield]
  - id: git.L06.054
    kind: card
    topic: cd-imaging
    front: What is CT enterography?
    back: CT with a special low-density oral contrast, combining CT with a small bowel series for detailed pictures of the small bowel mucosa.
    src: { page: 211, quote: "CT enterography, which uses a special low-density oral contrast, combines the advantages of CT and small bowel series" }
    status: unverified
  - id: git.L06.055
    kind: card
    topic: cd-imaging
    front: MR enterography versus CT enterography in Crohn disease?
    back: MRE detects mild disease better and slightly improves detection of wall thickening and enhancement; no significant difference in moderate to severe disease.
    src: { page: 211, quote: "Studies have shown MRE to have better detection of mild disease than CT enterography (CTE)" }
    status: unverified
  - id: git.L06.056
    kind: card
    topic: cd-imaging
    front: Best imaging to localize perianal fistulae and abscesses?
    back: MRI of the pelvis.
    src: { page: 211, quote: "MRI pelvis to localize perianal fistulae and abscesses." }
    status: unverified
    tags: [high-yield]
  - id: git.L06.057
    kind: card
    topic: cd-imaging
    front: Advantage of intestinal ultrasound in IBD?
    back: A safe, new modality that shows the intestines and colon without radiation or contrast.
    src: { page: 211, quote: "US intestines is safe and new modality which can visualize the intestines, and colon without hazards of irradiation or the contrast." }
    status: unverified
  - id: git.L06.058
    kind: enumerate
    topic: cd-imaging
    prompt: Mention the colonoscopic findings of Crohn disease.
    points:
      - Ulcerations
      - Erythema
      - Granularity
