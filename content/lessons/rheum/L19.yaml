        quote: "Dermatologic\n  Cutaneous vascular lesions.\n  Photosensitivity.\n  Butterfly rash (Malar Rash).\n  Oral/nasopharyngeal ulcers.\n  Alopecia."
        text: |
          الـ dermatologic: **cutaneous vascular lesions**، ==photosensitivity==، **butterfly (malar) rash**، **oral/nasopharyngeal ulcers**، **alopecia**.

          ليه الجلد أشيع مكان؟ لأن الـ UV بيضرب الـ keratinocytes مباشرة (الدرس التاني)، فالجلد المكشوف للشمس هو أول حتة تولّع. علشان كده الـ photosensitivity والـ malar rash على الوش.
      - kind: figure
