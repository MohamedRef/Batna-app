  - id: neph.L13.lesson2
    title: "تحت الميكروسكوب وعلى مدى 25 سنة"
    hook: "عباد الشمس في الـ glomerulus، ومراحل بتمشي بالسنين."
    minutes: 8
    pages: [428, 431]
    topics: [pathology, stages]
    goals:
      - "توصف الـ Kimmelstiel-Wilson nodule والـ IF والـ EM"
      - "تحفظ مراحل الـ DKD بالسنين والأرقام"
      - "تعرف إن أغلب الـ T2DM مش بيمشوا على الـ classic course"
    status: unverified
    steps:
      - kind: explain
        page: 428
        title: "Light microscopy"
        quote: "The nodules are round with a hypocellular matrix core surrounded by patent capillary loops, resembling a sunflower."
        text: |
          - **Mesangial expansion** من زيادة الـ matrix: diffuse الأول، وبعدين ==nodular== (**Kimmelstiel-Wilson**).
          - الـ nodule: **round**، قلبها matrix **hypocellular**، وحواليها capillary loops مفتوحة، شكلها **عباد الشمس (sunflower)**.
          - **Microaneurysms** مع الـ mesangiolysis أو الـ nodules.
          - متأخر: **segmental sclerosis** خصوصًا عند الـ tubular outlet (**tip lesion**).
      - kind: figure
        page: 428
        quote: "The nodules are round with a hypocellular matrix core surrounded by patent capillary loops, resembling a sunflower."
        title: "الـ sunflower"
        alt: "Sketch of a glomerulus with a round pale central nodule of mesangial matrix, ringed by open capillary loops drawn as petals, labelled Kimmelstiel-Wilson nodule."
        caption: "قلب ==hypocellular== (البذور) وحواليه capillary loops مفتوحة (البتلات). ده الـ Kimmelstiel-Wilson nodule."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <circle cx="140" cy="125" r="105" class="fg-thin"/>
            <circle cx="140" cy="45" r="20" class="fg-acc"/>
            <circle cx="197" cy="68" r="20" class="fg-acc"/>
            <circle cx="220" cy="125" r="20" class="fg-acc"/>
            <circle cx="197" cy="182" r="20" class="fg-acc"/>
            <circle cx="140" cy="205" r="20" class="fg-acc"/>
            <circle cx="83" cy="182" r="20" class="fg-acc"/>
            <circle cx="60" cy="125" r="20" class="fg-acc"/>
            <circle cx="83" cy="68" r="20" class="fg-acc"/>
            <circle cx="140" cy="125" r="46" class="fg-box"/>
            <text x="140" y="121" text-anchor="middle" class="t-sm t-b">matrix</text>
            <text x="140" y="137" text-anchor="middle" class="t-sm t-mut">hypocellular</text>
            <text x="252" y="40" class="t-sm t-acc">patent</text>
            <text x="252" y="56" class="t-sm t-acc">capillary</text>
            <text x="252" y="72" class="t-sm t-acc">loops</text>
            <text x="252" y="200" class="t-sm t-b">K-W nodule</text>
            <text x="252" y="216" class="t-sm t-mut">"sunflower"</text>
          </svg>
      - kind: explain
        page: 429
        title: "IF و EM"
        quote: "Diffuse linear accentuation of glomerular and tubular basement membranes with IgG (and κ and λ light chains) and albumin is typical."
        text: |
          **Immunofluorescence:** **linear** IgG (κ و λ) و **albumin** على الـ glomerular basement membrane (GBM) والـ tubular basement membrane (TBM). ده typical ومش anti-GBM. ومتأخر: staining غير specific بـ immunoglobulin M (IgM) و C3 و C1q.

          **Electron microscopy:**
          - ==GBM thickening== = **أول تغيير structural**.
          - الـ TBM بيتخن كمان.
          - mesangial matrix expansion.
          - **مفيش immune complexes**.
          - foot process effacement متغير، أكتر في الآخر.
      - kind: aside
        tone: trap
        page: 429
        quote: "Diffuse thickening of GBMs is usually the earliest structural change. Tubular basement membranes of nonatrophic tubules are also thickened. Mesangial regions are expanded, predominantly due to accumulation of mesangial matrix. There are no immune complexes. Podocytes show variable foot process effacement, especially in advanced stages."
        text: "فخ: «Linear IgG» في عيان سكر مش معناها anti-GBM disease، ولا الـ nodules أول تغيير. أول تغيير = ==GBM thickening== على الـ electron microscopy (EM)."
      - kind: check
        page: 429
        quote: "Diffuse thickening of GBMs is usually the earliest structural change. Tubular basement membranes of nonatrophic tubules are also thickened. Mesangial regions are expanded, predominantly due to accumulation of mesangial matrix. There are no immune complexes. Podocytes show variable foot process effacement, especially in advanced stages."
        question: "Which finding argues AGAINST pure diabetic nephropathy?"
        options:
          - "Subepithelial immune complex deposits on EM"
          - "Linear IgG and albumin along the GBM"
          - "Diffuse GBM thickening"
          - "Nodular mesangial sclerosis"
        answer: 0
        why:
          - "صح: الـ diabetic nephropathy (DN) مفيهاش immune complexes، فوجودها يدوّر على تشخيص تاني."
          - "ده typical في الـ DN."
          - "ده أول تغيير في الـ DN."
          - "ده Kimmelstiel-Wilson."
      - kind: table
        page: 431
        quote: "Proteinuria or overt diabetic nephropathy (15-25y) proteinuria (>0.5g/D) associated with ESRD 5-10 years after development of overt nephropathy"
        title: "المراحل الكلاسيكية"
        columns: [Stage, Years, Hallmark]
        rows:
          - ["Hypertrophy-hyperfunction", "0-2", "GFR >150, microalbuminuria reversible with insulin"]
          - ["Latent nephropathy", "2-5", "Microalbuminuria only with exercise or ketosis"]
          - ["Microalbuminuria", "5-15", "Persistent 30-300 mg/24 h"]
          - ["Overt nephropathy", "15-25", "Proteinuria >0.5 g/day; ESRD 5-10 y later"]
        hide: [[0, 1], [1, 2], [2, 2], [3, 2]]
      - kind: mnemonic
        page: 430
        quote: "Hypertrophy hyper function (0-2y)1. Increased glomerular and kidney size hyper filtration (GFR>150ml/min)3. Reversible microalbuminuria with insulin therapy. (hyperglycemia, glucagon, growth hormone)"
        word: "HLMO"
        parts:
          - { key: "H", text: "Hypertrophy-hyperfunction: 0-2 years" }
          - { key: "L", text: "Latent: 2-5 years" }
          - { key: "M", text: "Microalbuminuria: 5-15 years" }
          - { key: "O", text: "Overt: 15-25 years, end-stage renal disease (ESRD) 5-10 years after" }
        hook: "الأرقام بتكمّل بعض: **0 - 2 - 5 - 15 - 25**. كل مرحلة بتبدأ مكان ما اللي قبلها خلصت."
      - kind: explain
        page: 431
        title: "الواقع مش كتاب"
        quote: "Many patients with T1DM and most with T2DM do not follow the classic course of DKD."
        text: |
          - في الـ **type 2** الـ course ممكن يبقى أقصر، ويجي العيان أصلًا بـ established nephropathy و hypertension (HTN)، وممكن **nephrotic syndrome**.
          - كتير من الـ type 1 diabetes mellitus (T1DM) و ==most type 2 diabetes mellitus (T2DM)== مش بيمشوا على الـ classic course.
          - كتير عندهم **chronic kidney disease (CKD) من غير albuminuria**.
          - والـ albuminuria ممكن **ترجع**، يعني الـ albuminuria مش معناها progressive nephropathy.
      - kind: try
        items: [neph.L13.018, neph.L13.021, neph.L13.023, neph.L13.026, neph.L13.033]
    recap:
      - "LM: mesangial expansion ← Kimmelstiel-Wilson nodules (sunflower)، microaneurysms، tip lesion."
      - "IF: linear IgG و albumin (typical). EM: GBM thickening أول تغيير، ومفيش immune complexes."
      - "Stages (HLMO): 0-2، 2-5، 5-15، 15-25 سنة؛ ESRD بعد الـ overt بـ 5-10 سنين."
      - "أغلب الـ T2DM مش classic: CKD من غير albuminuria، والـ albuminuria ممكن ترجع."
    practice: [neph.L13.017, neph.L13.018, neph.L13.019, neph.L13.020, neph.L13.021, neph.L13.022, neph.L13.023, neph.L13.024, neph.L13.025, neph.L13.026, neph.L13.027, neph.L13.028, neph.L13.029, neph.L13.030, neph.L13.031, neph.L13.032, neph.L13.033, neph.L13.034]
