      - kind: check
        page: 152
        quote: "Ruxolitinib causes anemia (a predictable fall in hemoglobin levels by 10%, peaking at 12–16 weeks and gradually resolving thereafter) and thrombocytopenia (fall in platelet levels by 40%).\nBoth anemia and thrombocytopenia can be attenuated by dose-modification and may be moderated by addition of agents such as Erythropoietin and androgens."
        question: "PMF on ruxolitinib for 14 weeks: spleen smaller, sweats gone, Hb down 10%. Best action?"
        options: ["Continue; adjust the dose and consider EPO or androgens", "Stop it at once", "Switch to splenectomy", "This fall means transformation to AML"]
        answer: 0
        why:
          - "صح: النزول متوقع وأقصاه 12–16 أسبوع وبيتحسن؛ dose modification و EPO أو androgens."
          - "الوقف المفاجئ بيعمل rebound للأعراض والطحال."
          - "هو مستفيد؛ الـ splenectomy last resort."
          - "ده side effect معروف، مش AML (اللي تعريفها ≥20% blasts)."
      - kind: explain
        page: 153
        title: "علاج الأنيميا: كل دوا لمين؟"
        quote: "daily) and danazol (400–600 mg daily). Both can have virilizing effects and can lead to abnormal liver function.\nb. Corticosteroids: Patients with a reduced red cell survival may respond.\nc. Human recombinant erythropoietin: has shown promise in small clinical studies of anemia in PMF usually where endogenous EPO levels are low.\nd. Despite these treatments, most patients become transfusion- dependent eventually.\ne. Thalidomide: has been reported to improve anemia, thrombocytopenia or splenomegaly in 20-30% of the patients. Thalidomide is poorly tolerated at conventional doses. Furthermore, thalidomide increases the risk of extreme thrombocytosis and probably that of venous thrombosis, and it is extremely teratogenic."
        text: |
          - **Androgens**: response في لحد **التلت**، وأحسن نتيجة في اللي ==without massive splenomegaly and with a normal karyotype==. الأشهر **oxymetholone (50–150 mg)** و **danazol (400–600 mg)**؛ ممكن **virilizing** و **abnormal liver function**.
          - **Corticosteroids**: للي عندهم **reduced red cell survival**.
          - **Human recombinant erythropoietin**: واعد في دراسات صغيرة، غالبًا لما الـ **endogenous EPO واطي**.
          - **Thalidomide**: بيحسّن الأنيميا أو الصفائح أو الطحال في **20–30%**، بس **poorly tolerated**، وبيزوّد **extreme thrombocytosis** وغالبًا الـ **venous thrombosis**، و **extremely teratogenic**.
          - **Pomalidomide**: كمان اتقال إنه نجح.
          - ومع كل ده، **أغلبهم بيبقوا transfusion-dependent** في الآخر.

          التفسير المقبول (مش في الكتاب) للشروط: الـ **steroids** بتنفع لما جزء من الأنيميا **تكسير** (مناعي أو في الطحال)، مش لما المصنع واقف. والـ **EPO** بينفع لما الجسم **مش بيطلب** كفاية؛ لو الـ EPO الطبيعي عالي أصلًا، زيادته مش هتفرق. والـ androgens محتاجة نخاع لسه فيه خلايا تستجيب، وطحال مش هيبلع الناتج.
