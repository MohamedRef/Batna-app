      - kind: explain
        remind: [dm.L07.029]
        page: 80
        title: "5. دوخة من غير ما الضغط يقع"
        quote: "The hallmark of these abnormalities is the absence of a fall in BP with standing, but a tachycardia or bradycardia with the change in posture"
        text: |
          أعراض orthostasis (faint، dizzy، **circumoral paresthesia**، headache) لما يقف، بس ==BP ما بيقعش==. اللي بيتغير هو الـ **heart rate** (tachy أو brady).

          الأسباب: **Postural orthostatic tachycardia syndrome (POTS)**، inappropriate sinus tachycardia، **neurocardiogenic syncope**، baroreceptor abnormalities.

          يعني الفرق المهم: هنا الـ **vasoconstriction** شغالة فالضغط ماسك، بس **التحكم في القلب** هو اللي متلخبط، فبيرد بزيادة (tachycardia) أو بنقص (bradycardia).
