        page: 70
        quote: "Figure 2: Mechanism of damage in CRS-2. CKD, chronic kidney disease; CRS, cardiorenal syndrome.\nChronic Heart Disease\n  Genetic predisposition, Environmental risk factors → Normal Kidney Function\n  Low Cardiac Output, Inflammation, Arterial calcification, Endothelial calcification → Initiation of Kidney Damage\n  Chronic hypoperfusion, Increased venous pressure, Increased venous resistance → Progression to CKD\nNormal Kidney Function → (Chronic hypofusion, Apoptosis) → Initiation of Kidney Damage → (Sclerosis-Fibrosis) → Progression to CKD\nKidney → Anemia, Hypertension, Electrolyte imbalance → Chronic Heart Disease"
        title: "الدايرة المفرغة في الـ CRS-2"
        alt: "A loop of four boxes. Chronic heart failure at top leads by low output and high venous pressure to kidney hypoperfusion on the right, which leads to fibrosis and CKD at the bottom, which leads by anaemia, hypertension and electrolyte imbalance to more strain on the heart on the left, which feeds back to chronic heart failure. Centre label: RAAS and sympathetic activation."
        caption: "كل سهم بيزوّد اللي بعده. علشان كده الدايرة **مش بتقف لوحدها**: لازم نكسرها من ناحية القلب (congestion) أو ناحية الكلية (أنيميا، ضغط، K)."
