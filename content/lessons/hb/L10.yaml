        text: |
          افتكر الـ IV بالأرقام 150 → 50 → 100 في 15 دقيقة → 4 ساعات → 16 ساعة. والـ oral: 140 وبعدين 70 كل 4 ساعات × 17.
      - kind: aside
        tone: trap
        page: 181
        text: |
          الـ NAC ممكن يطوّل الـ PT، فتفتكر إن الكبد بيسوء وهو مش كده. وعيوبه كمان: nausea، vomiting، و **anaphylactoid reaction** خصوصًا مع تاريخ **asthma**.
      - kind: match
        page: 181
        prompt: "وصّل كل سبب بعلاجه الخاص:"
        pairs:
          - ["Acetaminophen", "N-acetyl cysteine"]
          - ["Hepatitis B", "Nucleoside analogues"]
          - ["Herpes simplex hepatitis", "IV acyclovir"]
          - ["Wilson disease", "Plasmapheresis + D-penicillamine"]
        why: "الكتاب بيدي العلاجات دي بالاسم. علشان كده تحديد السبب مهم: فيه specific therapy."
      - kind: explain
        page: 181
        title: "الكبد الصناعي: حلم لسه"
        text: |
          **Liver assist devices**: الأمل كان إنها تبقى **bridge** للزرع أو للـ recovery، وتغنّي عن الزرع. بس حلم الـ «proxy liver» لسه بعيد.

          **ليه صعب نقيّمها؟** لأنها بتأثر على نفس الـ prognostic markers اللي بنقيس بيها الكبد. فالمهارة إنك تفرّق بين تحسّن الكبد نفسه وتأثير الجهاز. والأهم يفضل critical care كويس.

          **الأنواع**:
          - **Artificial (filters)**: dialysis أو adsorption بيشيلوا toxins. مفيش survival benefit.
          - **MARS** (Molecular Absorbent Recirculating System): membrane فيه albumin بيشيل الـ protein-bound toxins. حسّن الـ hemodynamics والـ HE، بس مفيش mortality benefit، مع trend للتحسن في الـ acetaminophen اللي ما اتزرعوش.
          - **Bio-artificial**: بتشيل الـ toxins وبتعمل metabolism كمان. فيها whole organ perfusion، أو hepatocytes (porcine أو hepatoblastoma) على columns، أو transplantation of hepatocytes / stem cells.
            - **ELAD** (hepatoblastoma cells): حسّن الـ physiology، بس مفيش mortality benefit.
            - **Cell transplantation**: فيها أمل، خصوصًا في الأطفال بـ metabolic disease.

          ==Plasma exchange== هو الوحيد اللي ليه ==mortality benefit==:
          - بيتعمل في أول 3 أيام في الـ critical care.
          - قلل الـ ICP، وحسّن الـ survival في اللي ما اتزرعوش، حتى اللي مااتسجلوش للزرع بسبب co-morbidity.
          - التفسير: بيعدّل الـ monocyte immune function، وبيشيل mediators، وبيعوّض plasma factors.
      - kind: figure
        page: 181
        title: "مين نفع فعلًا؟"
        alt: "A scoreboard of four liver support options with two columns, physiology and mortality. Filters by dialysis or adsorption: no survival benefit. MARS with an albumin membrane: better physiology, no mortality benefit. ELAD with hepatoblastoma cells: better physiology, no mortality benefit. Plasma exchange in the first 3 days in intensive care: better physiology and a mortality benefit. Notes: MARS showed a trend in acetaminophen patients without transplant; cell transplantation is a hope, mostly in children."
        caption: "الأجهزة كلها حسّنت الأرقام، بس اللي قلل الوفيات فعلًا هو الـ ==plasma exchange== بس."
