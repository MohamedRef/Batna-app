- id: res.L20.lesson5
  title: مهم إكلينيكيًا؟ والـ validity والـ evidence levels
  hook: دراسة non-significant ممكن تكون أهم من significant. وإزاي تحكم إن البحث اتعمل صح ويتطبق عندك؟
  minutes: 10
  pages:
  - 41
  - 51
  topics:
  - discussion
  - conclusion
  goals:
  - تعرف إن الـ clinical importance حكم طبي
  - تقرا مثال الـ 178 مريض بالـ CI
  - تعرف مستويات الـ evidence والـ internal/external validity
  - تحدد biases كل تصميم
  status: unverified
  steps:
  - kind: explain
    page: 41
    quote: |-
      What about clinical importance (usefulness)?
      Clinical importance is a medical judgment, not statistical
      Clinicians should change practice only if they believe
      the study has definitively demonstrated a treatment difference
      that the treatment difference is large enough to be clinically important.
      Depends on knowledge of:
      A range of possible treatments
      Their costs
      Their side effects
    title: الأهمية الإكلينيكية = حكم طبي
    text: |-
      ==Clinical importance== حكم **طبي**، مش إحصائي.

      غيّر الـ practice بس لو مقتنع إن:
      - الدراسة **أثبتت فعلًا** فرق في العلاج، و
      - الفرق **كبير كفاية** يبقى مهم إكلينيكيًا.

      وده محتاج تعرف: البدائل، **التكلفة**، والـ **side effects**.
  - kind: case
    page: 43
    quote: |-
      Chi-square value = 1.74
      (p>0.1) (non–significant)
      i.e. there is no statistical significant difference in efficacy between the two treatments.
      --- The observed difference is: 75% - 66% = 9%....PE
      and the 95% CI for the difference is: (- 4% to 22%)
      -- This indicates that compared to treatment B, treatment A has, at best an appreciable advantage (22%) and at worst , a slight disadvantage (- 4%).
      --- This inference is more informative than just saying that the difference is non-significant.
    stem: 'Trial on 178 patients: A succeeded in 76/101 (75%), B in 51/77 (66%). Chi-square = 1.74, p > 0.1.'
    steps:
    - question: What does p > 0.1 mean here?
      options:
      - No statistically significant difference in efficacy
      - A is proven better
      - A and B are proven equal
      - The trial is invalid
      answer: 0
      why: 'p > 0.1 = non-significant: مفيش فرق statistically significant. وده مش إثبات إن العلاجين زي بعض، ومش معناه إن الـ trial invalid.'
    - reveal: '95% CI for the difference: −4% to 22%.'
      question: What is the point estimate and how do you read the CI?
      options:
      - 'PE 9%: A is at best 22% better and at worst 4% worse than B'
      - 'PE 75%: A works in 75%'
      - 'PE 9%: A is certainly 9% better'
      - 'PE 22%: the maximum benefit'
      answer: 0
      why: 'الـ PE = 75% − 66% = 9%. والـ CI من −4% لـ 22%: A في أحسن الأحوال أحسن بـ 22% (appreciable advantage) وفي أسوأها أوحش بـ 4% (slight disadvantage). 22% ده الحد الأعلى مش الـ PE.'
  - kind: aside
    tone: exam
    text: 'الجملة اللي بتتسأل: الـ PE + CI ==more informative== من مجرد إنك تقول «non-significant».'
    page: 43
    quote: '--- This inference is more informative than just saying that the difference is non-significant.'
  - kind: table
    page: 44
    quote: |-
      Reaction of investigator to results of a statistical significance test
      | Practical importance of observed effect | Not significant | Significant |
      |---|---|---|
      | Not important | Happy | Annoyed |
      | Important | Very sad | Elated |
      (columns: Statistical significance)
    title: رد فعل الباحث
    columns:
    - Practical importance
    - Not significant
    - Significant
    rows:
    - - Not important
      - Happy
      - Annoyed
    - - Important
      - Very sad
      - Elated
    hide:
    - - 1
      - 1
    - - 1
      - 2
  - kind: aside
    tone: joke
    text: 'أثر مهم بس مش significant؟ الباحث «Very sad» 😢: كان قريب أوي بس العينة صغيرة. وأثر تافه بس significant؟ «Annoyed»: نجح ورقيًا بس ملوش لازمة.'
  - kind: explain
    page: 45
    quote: |-
      III. CONCLUSION
      Assesses the relevance of the article as to whether it is clinically significant & clinical importance even though it may be statistically significant or not.
      It allows participants to analyze whether it is a feasible study and if it can be applied in clinical practice.
      If so, what would the economic burden associated with it be? There may be numerous studies that show that a particular diagnostic modality is highly sensitive and specific in detecting a disease, but they may be too expensive and cumbersome to be applied as a screening tool.
    title: 'الخاتمة: هينفع عندي؟ وبكام؟'
    text: |-
      الخاتمة بتقيّم ==relevance== المقال: هل هو **clinically significant** ومهم إكلينيكيًا، سواء significant إحصائيًا ولا لأ.

      وبتسأل: ينفع يتطبق في الـ practice؟ ولو ينفع، الـ **economic burden** قد إيه؟ ممكن test يكون sensitive وspecific جدًا بس **غالي ومعقد** يتعمل screening.
  - kind: table
    page: 47
    quote: |-
      Levels of Evidence.
      | Level | Description | Examples |
      |---|---|---|
      | I | Evidence from at least one randomized controlled trial (RCT) or meta-analysis of RCTs | |
      | II | Nonrandomized controlled trial | Prospective (cohort or outcomes) study with an internal control group or a systematic review of prospective, controlled trials |
      | III | Observational studies with controls | Retrospective, time series, case control |
      | IV | Observational studies without controls | Cohorts, case series without controls |
      | V | Expert opinion | |
    title: Levels of evidence
    columns:
    - Level
    - Description
    rows:
    - - I
      - At least one RCT or meta-analysis of RCTs
    - - II
      - Nonrandomized controlled trial
    - - III
      - Observational studies with controls
    - - IV
      - Observational studies without controls
    - - V
      - Expert opinion
    hide:
    - - 0
      - 1
    - - 2
      - 1
    - - 4
      - 1
  - kind: explain
    page: 46
    quote: |-
      The relevance and statistical significance of the study can also be measured by the grade and level of evidence that the study represents.
      RCTs are typically the highest level of evidence, and data derived from them tend to represent grade A recommendations given that they are the most unbiased, controlled, blinded studies that typically confer a large sample size and contain data over a long period of time.
    title: ليه الـ RCT في القمة؟
    text: |-
      الـ RCTs عادةً ==the highest level of evidence== وبتدّي **grade A recommendations**، لأنها:
      - الأقل bias، controlled، وblinded.
      - عادةً عينة كبيرة وبيانات على فترة طويلة.
  - kind: figure
    page: 48
    quote: |-
      Outside the study: External Validity
      Does the same thing happen in other settings?
      Other Labs
      Everyday settings
      Inside the study: Internal Validity
      Was the research done "right"?
    title: Internal جوه، External بره
    alt: 'A large outer rounded box labelled external validity: does the same thing happen in other settings, with other labs and everyday settings. Inside it a smaller oval labelled internal validity:
      was the research done right.'
    caption: '**Internal**: البحث اتعمل صح جوه نفسه؟ **External**: نفس النتيجة هتحصل في أماكن تانية؟'
    svg: |
      <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
        <rect x="8" y="8" width="314" height="184" rx="24" class="fg-acc"/>
        <text x="165" y="32" text-anchor="middle" class="t-b">External validity (outside the study)</text>
        <text x="165" y="50" text-anchor="middle" class="t-sm">Does the same thing happen in other settings?</text>
        <text x="40" y="80" class="t-sm t-mut">Other labs</text><text x="290" y="80" text-anchor="end" class="t-sm t-mut">Everyday settings</text>
        <ellipse cx="165" cy="135" rx="120" ry="45" class="fg-good"/>
        <text x="165" y="130" text-anchor="middle" class="t-b">Internal validity</text>
        <text x="165" y="150" text-anchor="middle" class="t-sm">Was the research done "right"?</text>
      </svg>
  - kind: explain
    page: 49
    quote: |-
      Internal Validity | External Validity
      Internal validity: Did the authors rule out chance, bias, and confounding factors?
      Was there an external funding source? If so, what was its contribution?
      Not every therapeutic trial that is funded by a pharmaceutical company is deemed "bias." It is important to assess the funding source's contribution. If it merely supplied the finance but a separate group of investigators conducted and analyzed the study, then the results of the study can represent valid data.
      The External Validity of the study can also be assessed by asking whether the study is feasible:
      Change your practice?
      Add knowledge about the subject?
    title: إزاي تحكم على الـ validity؟
    text: |-
      - **Internal validity**: الباحثين استبعدوا ==chance, bias, and confounding==؟ وفيه **external funding**؟ دوره كان إيه؟
      - مش كل trial ممولة من شركة أدوية تبقى biased: لو الشركة **دفعت بس** وفريق مستقل نفّذ وحلّل، النتايج ممكن تبقى valid.
      - **External validity**: الدراسة feasible؟ **هتغيّر الـ practice**؟ ولا **تزوّد معرفة**؟
  - kind: check
    page: 49
    quote: Not every therapeutic trial that is funded by a pharmaceutical company is deemed "bias." It is important to assess the funding source's contribution. If it merely supplied the finance but a separate
      group of investigators conducted and analyzed the study, then the results of the study can represent valid data.
    question: A pharmaceutical company funded a trial but an independent group conducted and analysed it. How do you judge it?
    options:
    - Its results can represent valid data; assess the funder's contribution
    - It is biased by definition
    - It has no external validity
    - It must be excluded from any review
    answer: 0
    why:
    - 'صح: المهم دور الممول، مش وجوده.'
    - السلايد بيقول صراحةً مش كل تمويل = bias.
    - التمويل مالوش علاقة مباشرة بالـ external validity.
    - مفيش قاعدة كده.
  - kind: explain
    page: 50
    quote: |-
      A good strategy to adopt when analyzing a study is to come up with three strengths and three weaknesses of the study.
      The strengths of the study can be apparent by referring to the overall effect and statistical or clinical significance.
      When assessing the weaknesses (limitations) of a study, one can refer to specific weaknesses inherent to the study design or to author-specific weakness that may lie within the funding source, population sampling, biases, non-blinding, non-randomization, and so on.
    title: 3 نقاط قوة و3 ضعف
    text: |-
      استراتيجية حلوة: طلّع ==three strengths and three weaknesses==.
      - **القوة**: من الـ overall effect والـ statistical أو clinical significance.
      - **الضعف (limitations)**: من التصميم نفسه، أو من الباحثين: التمويل، الـ sampling، الـ biases، **non-blinding**، **non-randomization**.
  - kind: table
    page: 51
    quote: |-
      Potential Biases and Limitations Based on Study Design.
      | Study Design | Biases and Limitations |
      |---|---|
      | Cross-sectional | No way to establish temporal relationship exposure and outcome measured at the same time; Selection bias; Self-reporting bias; Response bias |
      | Case control | Selection bias (of cases and controls); Recall bias; Questionable temporal relationship (decrease exposure before outcome) |
      | Cohort | Selection bias; Loss to follow-up; Change in habits over time |
      | Experimental design | Selection bias; Loss to follow-up; Improper or biased randomization procedures; Inadequate blinding of participants and investigators to exposure or treatment |
      Response bias = tendencies for participants to respond inaccurately or falsely to questions (Social desirability bias)
    title: Biases كل تصميم
    columns:
    - Design
    - Biases and limitations
    rows:
    - - Cross-sectional
      - No temporal relationship; selection, self-reporting, response bias
    - - Case-control
      - Selection bias; recall bias; questionable temporal relationship
    - - Cohort
      - Selection bias; loss to follow-up; change in habits over time
    - - Experimental
      - Selection bias; loss to follow-up; biased randomization; inadequate blinding
    hide:
    - - 1
      - 1
    - - 2
      - 1
  - kind: check
    page: 51
    quote: Response bias = tendencies for participants to respond inaccurately or falsely to questions (Social desirability bias)
    question: Participants in a survey under-report smoking because it looks bad. Which bias is this?
    options:
    - Response (social desirability) bias
    - Recall bias
    - Loss to follow-up
    - Publication bias
    answer: 0
    why:
    - 'صح: الرد غلط عشان يبان كويس.'
    - الـ recall bias = نسيان أو تذكر غير متساوي، غالبًا في case-control.
    - ده في الـ cohort.
    - ده في الـ systematic reviews.
