lessons:
  # ------------------------------------------------------------------
  - id: neph.L07.lesson1
    title: "ADPKD: الكلية اللي بتطلّع عنب"
    hook: "جين واحد بايظ، وحساس صغير في الـ cilia مش شغال، والنتيجة كلية بتكبر لحد ما تملى البطن. نبدأ من الأول."
    minutes: 9
    pages: [145, 147]
    topics: [adpkd-genetics, adpkd-path]
    goals:
      - "تعرف الجينين والـ proteins وليه PKD1 أوحش"
      - "تفهم الـ polycystin complex كـ mechanosensor وليه فشله بيعمل كيس"
      - "تعرف ليه ناس كتير شايلين الجين ومش عارفين"
    status: unverified
    steps:
      - kind: explain
        page: 145
        title: "مرض في الجسم كله"
        quote: "Definition Autosomal dominant polycystic kidney disease (ADPKD) is a multisystem disorder characterized by multiple, bilateral renal cysts and associated with cysts in other organs, such as liver, pancreas, and arachnoid mem-branes. It is a genetic disorder caused by mutations in either of two major genes and is inherited in an autosomal dominant pattern, with Inheritance (Genetic) ADPKD is inherited in an autosomal dominant manner. Mutations in the genes pkd-1 (located on chromosome 16) and pkd-2 (chromosome 4) result in defective synthesis of the proteins polycystin-1 and -2, respec-tively. Both polycystin-1 and -2 are ubiquitously expressed by epithelial cells throughout the"
        text: |
          الـ ==autosomal dominant polycystic kidney disease (ADPKD)== مش مرض كلى بس: ده **multisystem disorder** فيه أكياس كتير في **الكليتين**، ومعاها أكياس في **الكبد** والـ **pancreas** والـ **arachnoid**.

          الوراثة **autosomal dominant**: يعني **50%** من الأولاد هيورثوه. بس خلي بالك، **25–40%** من العيانين الجداد **مفيش عندهم family history**.

          ليه 25–40% مفيش عندهم family history؟ التفسير المقبول (مش في الكتاب): فيه كذا سبب: الأب أو الأم عندهم شكل خفيف (غالبًا PKD2) واتشخّص متأخر أو ماتوا قبل ما يبان، أو mutation جديدة (de novo)، أو الأهل ما اتعملهمش سونار أصلًا. علشان كده **غياب الـ family history ما يستبعدش** الـ ADPKD، وأول خطوة لما تلاقي أكياس كتير في شاب: اسأل عن العيلة واعرض سونار على الأهل.
      - kind: table
        page: 145
        quote: "Definition Autosomal dominant polycystic kidney disease (ADPKD) is a multisystem disorder characterized by multiple, bilateral renal cysts and associated with cysts in other organs, such as liver, pancreas, and arachnoid mem-branes. It is a genetic disorder caused by mutations in either of two major genes and is inherited in an autosomal dominant pattern, with Inheritance (Genetic) ADPKD is inherited in an autosomal dominant manner. Mutations in the genes pkd-1 (located on chromosome 16) and pkd-2 (chromosome 4) result in defective synthesis of the proteins polycystin-1 and -2, respec-tively. Both polycystin-1 and -2 are ubiquitously expressed by epithelial cells throughout the"
        title: "الجينين"
        columns: [Gene, Chromosome, Protein]
        rows:
          - ["PKD1", "16", "Polycystin-1"]
          - ["PKD2", "4", "Polycystin-2"]
        hide: [[0, 1], [1, 1]]
      - kind: explain
        page: 147
        title: "ليه أغلب الشايلين مش عارفين؟"
        quote: "In most patients the diagnosis is made decades later, and some patients are never diagnosed. Therefore, at any point in time, only a fraction of genetically affected individuals are aware of having the disease."
        text: |
          الكتاب بيقول الـ prevalence عند الولادة حوالي ==1 في 400 لـ 1 في 1000==، بس الـ **diagnosis** بييجي **بعدها بعشرات السنين**، وفي ناس عمرهم ما بيتشخّصوا. علشان كده في أي لحظة، جزء صغير بس من الشايلين عارفين.

          ليه؟ التفسير المقبول (مش في الكتاب): الأكياس بتبدأ صغيرة وبتكبر بالراحة، والكلية بتفضل شغالة لحد العقد الرابع أو أكتر، فمفيش أعراض تخلّي حد يكشف.

          وعلشان كده الـ **family history** مهم، والكتاب بيقولك تسأل عن: **renal disease**، **↑ BP**، **stroke** (intracranial haemorrhage)، و **موت بدري** في العيلة. كل دول ممكن يكونوا ADPKD متخبّي.
      - kind: mnemonic
        page: 146
        quote: "body. Pkd-1 mutations are seven times more com-mon than pkd-2 and associated with more aggressive disease (onset of esrd, on average, 15 years earlier). Mutations in a third gene, ganab, have been identified in families with mild polycystic kidney and more variable polycystic liver disease."
        word: "PKD1"
        parts:
          - { key: "P", text: "Polycystin-1, a receptor" }
          - { key: "K", text: "Kidney failure ~15 years earlier" }
          - { key: "D", text: "Dominant: 7 times commoner than polycystin-2 gene (PKD2)" }
          - { key: "1", text: "chromosome 16: 1 + 6, and PKD2 on 4" }
        hook: "**PKD1** = النمرة **1** في كل حاجة: أشهر (7 أضعاف)، أوحش، والـ ESRD بدري بـ **15 سنة**."
      - kind: reveal
        page: 146
        quote: "Pkd-1 mutations are seven times more com-mon than pkd-2 and associated with more aggressive disease (onset of esrd, on average, 15 years earlier)."
        prompt: "ليه الـ PKD1 أوحش من الـ PKD2، وإيه الجين التالت؟"
        answer: |
          الكتاب بيدّي الأرقام: PKD1 **أشهر 7 مرات** والـ ESRD بيجي **بدري بـ 15 سنة**. وفيه جين تالت، ==GANAB==، في عائلات عندها polycystic kidney **خفيف** وكبد متغيّر.

          التفسير المقبول (مش في الكتاب) للفرق: المرضى بالـ PKD1 بيعملوا **أكياس أكتر وأبدر**، فالكلية بتوصل للحجم الضخم أسرع، وبالتالي الـ GFR بيقع أبدر. يعني الفرق في **عدد الأكياس**، مش في سرعة نمو الكيس الواحد.
      - kind: explain
        page: 146
        title: "الـ cilia: حساس السرعة"
        quote: "Pathophysiology Polycystin-1 is a membrane receptor signalling protein that co-localizes with polycystin-2 (a calcium-permeable channel) within the cilia of renal collecting duct epithelial cells. This polycystin complex acts as an extra-cellular mechanosensor (luminal flow disturbs the cilia and triggers the apparatus) that assists in the regulation of cell proliferation, adhesion, differentiation, and maturation (→ all ultimately maintain tubular integrity and calibre). Failure of normal polycystin complex formation results in dysregulated cell turnover and uncontrolled cell proliferation in response to growth factors. Proliferating tubular cells form tubular cysts that close off the associated nephron and expand in size over time. It is estimated that <1% of nephrons undergo such cystic transforma-"
        text: |
          الـ **polycystin-1** (receptor) والـ **polycystin-2** (==calcium channel==) قاعدين مع بعض في الـ **cilia** بتاعة خلايا الـ collecting duct.

          البول وهو ماشي بيهز الـ cilia، فالـ complex يشتغل كـ ==mechanosensor== ويقول للخلية: "اثبتي، ما تكبريش". لو الـ complex باظ، الخلايا **تتكاثر من غير ضابط**، تعمل cyst **يقفل** على الـ nephron بتاعه ويكبر. وده بيحصل في **أقل من 1%** من الـ nephrons بس.

          ليه أقل من 1% بس؟ التفسير المقبول (مش في الكتاب): كل خلية ورثت نسخة بايظة من الأب أو الأم، بس النسخة التانية السليمة لسه شغالة. الكيس بيطلع بس في الـ nephron اللي خلية فيه خسرت النسخة السليمة كمان (second hit). علشان كده الأكياس متناثرة ومش في كل nephron، وعددها بيزيد مع السن لأن الـ second hits بتتجمع مع السنين.
      - kind: reveal
        page: 146
        quote: "This polycystin complex acts as an extra-cellular mechanosensor (luminal flow disturbs the cilia and triggers the apparatus) that assists in the regulation of cell proliferation, adhesion, differentiation, and maturation"
        prompt: "لو أقل من 1% من الـ nephrons بس بيعمل أكياس، إزاي الكلية كلها تقع؟"
        answer: |
          الكتاب بيقول الكيس **بيقفل على الـ nephron بتاعه** و **بيكبر مع الوقت**.

          التفسير المقبول (مش في الكتاب): الكيس الواحد بقى كتلة بتكبر وبتضغط على اللي حواليها. مع آلاف الأكياس اللي بتكبر، النسيج السليم بيتزنق ويتليّف، فالكلية تفقد شغلها حتى لو الـ nephrons اللي اتحولت أكياس قليلة. علشان كده **حجم الكلية** هو أحسن مؤشر للتدهور (هتشوفه في الدرس الجاي).
      - kind: figure
        page: 146
        quote: "Signal Pathway"
        title: "الـ signal pathway: رسمة الكتاب"
        image: { file: neph/L07-signal-pathway.webp, book: true }
        alt: "Book diagram of a collecting duct cell in polycystic kidney disease. On the apical cilium, PC1 and PC2 sense flow and let calcium in. Vasopressin (AVP) on the V2 receptor activates Gs and adenylyl cyclase, turning ATP into cAMP; somatostatin (SST) on its receptor (SSTR) acts through Gi to inhibit it, and PDE1, driven by calcium, breaks cAMP down to AMP. cAMP activates PKA, which drives the CFTR chloride channel (fluid secretion) and, through Src, MAPK and mTOR, cell proliferation. A key marks steps reduced and increased in PKD."
        caption: |
          خلية من الـ collecting duct، والـ cilium طالع من فوق:

          - **فوق، الـ cilium**: عليه **PC1 و PC2** (polycystin-1 و -2) بيحسّوا بسريان البول ويدخّلوا **Ca²⁺**. الـ Ca بيشغّل **PDE1** اللي بيكسّر الـ cAMP لـ AMP. في الـ PKD الـ Ca ده ==بيقل==، فالكسر بيقل.
          - **تحت يمين، المستقبلات**: الـ vasopressin (**AVP**) على الـ **V2R** ← **Gs** ← **AC6** يحوّل ATP لـ **cAMP** (بيزوّده). والـ somatostatin (**SST**) على الـ **SSTR** ← **Gi** ← بيقفل الـ AC6 (بيقلّله).
          - **النص، PKA**: الـ cAMP بيشغّل الـ **PKA**، ومنه سهمين: لفوق شمال على الـ **CFTR** (Cl⁻ بيطلع) = **Fluid secretion** جوّه الكيس، ولتحت عن طريق **Src ← MAPK ← mTOR** = **Cell proliferation**.

          يعني الـ ==cyclic adenosine monophosphate (cAMP) هو البنزين== اللي بيكبّر الكيس بالميه والخلايا مع بعض، وعشان كده الأدوية بتقفل مدخله: **tolvaptan** على الـ V2R، و **octreotide** على الـ SSTR، والـ ==mTOR inhibitors== على فرع الـ proliferation.
      - kind: order
        page: 146
        quote: "Failure of normal polycystin complex formation results in dysregulated cell turnover and uncontrolled cell proliferation in response to growth factors. Proliferating tubular cells form tubular cysts that close off the associated nephron and expand in size over time."
        prompt: "رتّب إزاي الكيس بيتكوّن في الـ ADPKD:"
        steps:
          - "Mutation in PKD1 or PKD2"
          - "Polycystin complex fails in the cilia"
          - "Dysregulated cell turnover and proliferation"
          - "Tubular cyst closes off its nephron"
