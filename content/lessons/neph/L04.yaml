  - id: neph.L04.lesson2
    title: "ليه الضغط مش بينزل، ومين بيدفع التمن؟"
    hook: "قبل ما تضيف دوا رابع، اسأل: هو فعلًا resistant ولا حد بيضحك عليك؟"
    minutes: 10
    pages: [83, 87]
    topics: [refractory, pathogenesis, complications]
    goals:
      - "تعدّ أسباب الـ refractory HT (pseudoresistance أولها)"
      - "تشرح الـ pathogenesis بتاع الـ essential HT وتغيّرات الأوعية"
      - "تعرف الـ end-organ damage والـ malignant HT ودرجات Keith–Wagener"
    status: unverified
    steps:
      - kind: explain
        page: 83
        title: "أسباب الـ refractory HT"
        quote: "Pseudoresistance Nonadherence to prescribed therapy Volume overload Drug-related causes Concomitant conditions Secondary causes of hypertension"
        text: |
          1. ==Pseudoresistance==: white-coat، pseudohypertension في الكبار، **small cuff** في التخان
          2. **Nonadherence**
          3. **Volume overload**
          4. **Drug-related:** جرعات قليلة، diuretic غلط، combinations غلط، interactions، وأدوية بترفع الضغط
          5. **Concomitant:** obesity، **sleep apnea**، ethanol >**30 ml/day**، anxiety
          6. **Secondary causes**
      - kind: sort
        page: 83
        quote: "Cyclosporine, tacrolimus Erythropoietin Antidepressants Nonsteroidal anti-inflammatory drugs"
        prompt: "صنّف سبب الـ refractory HT:"
        bins: ["Pseudoresistance", "Drug-related", "Concomitant condition"]
        cards:
          - { text: "White-coat hypertension", bin: 0 }
          - { text: "Small cuff on an obese arm", bin: 0 }
          - { text: "Tacrolimus", bin: 1 }
          - { text: "Erythropoietin", bin: 1 }
          - { text: "Nasal decongestant", bin: 1 }
          - { text: "Sleep apnea", bin: 2 }
          - { text: "Ethanol over 30 ml a day", bin: 2 }
        why: "الـ pseudoresistance = القياس نفسه غلط. الأدوية (cyclosporine/tacrolimus، EPO، decongestants، NSAIDs، licorice) بترفع الضغط فعلًا. والـ obesity والـ sleep apnea والكحول حالات مصاحبة."
      - kind: explain
        page: 83
        title: "الـ essential HT: 80–90% من العيانين"
        quote: "Low birth weight is associated with subsequent high blood pressure due to: Prolonged malnutrition Long term changes in B.V. Structure Low Nephron Number"
        text: |
          state معقدة بتربط **genetic** و **behavioral** factors لحد ما ==vascular resistance== يزيد.

          - **Genetic:** بيمشي في العيلة (genes وبيئة مشتركة).
          - **Fetal:** الـ **low birth weight** ← malnutrition، تغيير في الأوعية، و ==low nephron number==.
      - kind: explain
        page: 84
        title: "البيئة والهرمونات"
        quote: "Sodium intake: it is a major determinant of blood pressure differences."
        text: |
          - **Obesity** (وكمان overestimation للقراءة و sleep disturbance)، **alcohol** بكميات كبيرة.
          - ==Sodium intake== major determinant؛ والـ **high potassium** ممكن يحمي.
          - **Stress و pain** بيرفعوا الضغط، بس علاقة الـ **chronic stress** مش معروفة.
          - **ANS، RAAS، natriuretic peptide، kallikrein–kinin:** بيتحكموا في الـ short-term BP وفي الـ pathogenesis، **مش في maintenance**.
          - imbalance بين **endothelin** و **NO**، و **insulin resistance** (hyperinsulinemia، glucose intolerance، ↓HDL ↑TG، central obesity).
      - kind: check
        page: 84
        quote: "play a role in pathophysiological regulation of short term blood pressure and pathogenesis of essential HT but are not directly involved in maintenance of HT."
        question: "Per the lecture, the RAAS and autonomic system in essential HT are:"
        options:
          - "Involved in short-term regulation and pathogenesis, not directly in maintenance"
          - "The main factors maintaining established hypertension"
          - "Unrelated to hypertension"
          - "Only active in secondary hypertension"
        answer: 0
        why:
          - "صح: short-term و pathogenesis، مش maintenance."
          - "الكتاب بيقول بالظبط إنهم not directly involved in maintenance؛ اللي بيحافظ على الضغط هو الـ resistance vessels."
          - "ليهم دور في الـ pathogenesis."
          - "الكتاب بيتكلم عنهم في الـ essential HT."
      - kind: figure
        page: 85
        quote: "have increased wall thicknees and reduction of vessel lumen diameter which leads to increased vascular resistance which maintains HT"
        title: "الأوعية الصغيرة والكبيرة"
        alt: "Two cross-sections of a small artery: normal with a thin wall and wide lumen, and hypertensive with a thick wall and narrow lumen labelled increased resistance. Below, a large vessel box lists thick media, increased collagen and secondary calcium deposition leading to loss of compliance and a higher pulse wave velocity."
        caption: "الشرايين الصغيرة: ==wall تخين و lumen ضيق== = resistance عالي وده اللي بيحافظ على الضغط، والـ cardiac output **normal**. الكبيرة: media تخينة، collagen، calcium ← تفقد الـ compliance."
        svg: |
          <svg viewBox="0 0 330 290" xmlns="http://www.w3.org/2000/svg">
            <text x="85" y="20" text-anchor="middle" class="t-sm t-b">Normal arteriole</text>
            <circle cx="85" cy="80" r="45" class="fg-acc"/>
            <circle cx="85" cy="80" r="33" class="fg-box"/>
            <text x="245" y="20" text-anchor="middle" class="t-sm t-b">Hypertensive</text>
            <circle cx="245" cy="80" r="45" class="fg-bad"/>
            <circle cx="245" cy="80" r="16" class="fg-box"/>
            <text x="245" y="146" text-anchor="middle" class="t-sm t-bad">thick wall, narrow lumen</text>
            <text x="85" y="146" text-anchor="middle" class="t-sm t-mut">thin wall, wide lumen</text>
            <rect x="20" y="168" width="290" height="110" rx="10" class="fg-box"/>
            <text x="35" y="192" class="t-sm t-b">Large vessels</text>
            <text x="35" y="214" class="t-sm">• Thick media  • ↑ Collagen</text>
            <text x="35" y="234" class="t-sm">• Secondary calcium deposition</text>
            <text x="35" y="256" class="t-sm t-acc">→ loss of compliance, pressure wave</text>
            <text x="35" y="272" class="t-sm t-acc">→ ↑ pulse wave velocity (stiffness)</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 85
        quote: "Pulse wave velocity, it measures arterial stiffness and is inversely related to distensibility"
        text: |
          الـ **pulse wave velocity** زي الصوت في خرطوم: الخرطوم الطري بيمتص الموجة فتمشي بالراحة، والـ **ناشف** بيوصّلها بسرعة. علشان كده الـ PWV بيقيس الـ ==arterial stiffness== وعكس الـ distensibility.

          ومع **↑PVR** القلب يشيل حمل أكتر ← ==LVH==، وده prognostic indicator مهم للـ CV events.
      - kind: explain
        page: 86
        title: "التمن: end-organ damage"
        quote: "HT patients have a sixfold increase in strokes There is a threefold increase in cardiac death."
        text: |
          المخ (hemorrhage، stroke)، القلب (LVH، CHD، CHF)، العين (retinopathy)، الـ PVD، والكلى (renal failure، proteinuria).

          الأرقام: stroke **×6**، cardiac death **×3**، PVD **×2**.

          ==Malignant (accelerated) HT==: الضغط يطلع بسرعة مع **DBP >120** و **fibrinoid necrosis**. من غير علاج: renal failure بـ proteinuria و hematuria، HF، aortic dissection، stroke، cerebral edema، hemorrhage، و HT encephalopathy.
      - kind: table
        page: 86
        quote: "GII: GI + arteriovenous nipping. GIII: GII + flame shaped hemorrhages, soft exudates"
        title: "Keith–Wagener"
        columns: [Grade, Adds]
        rows:
          - ["I", "Tortuous arteries, silver wiring"]
          - ["II", "AV nipping"]
          - ["III", "Flame hemorrhages, cotton wool exudates"]
          - ["IV", "Papilledema"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: trap
        page: 86
        quote: "GIII and IV are diagnostic of malignant HT"
        text: |
          ==GIII و GIV== هما اللي **diagnostic of malignant HT**. يعني مش لازم تستنى الـ papilledema: الـ flame hemorrhages والـ cotton wool لوحدهم كفاية.
      - kind: try
        items: [neph.L04.022, neph.L04.023, neph.L04.031, neph.L04.047, neph.L04.049]
    recap:
      - "Refractory = مش واصل للـ target على triple therapy فيها diuretic في عيان ملتزم."
      - "الأسباب: pseudoresistance، nonadherence، volume، drugs، concomitant، secondary."
      - "Essential 80–90%: genetic، fetal (low nephron number)، sodium، obesity، endothelin/NO، insulin resistance."
      - "Resistance vessels: wall تخين و lumen ضيق؛ الـ cardiac output normal؛ LVH = prognosis."
      - "Malignant: DBP >120 + fibrinoid necrosis؛ KW III و IV diagnostic."
    practice: [neph.L04.022, neph.L04.023, neph.L04.024, neph.L04.025, neph.L04.026, neph.L04.027, neph.L04.028, neph.L04.029, neph.L04.030, neph.L04.031, neph.L04.032, neph.L04.033, neph.L04.034, neph.L04.035, neph.L04.036, neph.L04.037, neph.L04.038, neph.L04.039, neph.L04.040, neph.L04.041, neph.L04.042, neph.L04.043, neph.L04.044, neph.L04.045, neph.L04.046, neph.L04.047, neph.L04.048, neph.L04.049, neph.L04.050, neph.L04.051, neph.L04.116]
