  # ------------------------------------------------------------------
  - id: rheum.L08.lesson1
    title: "الأوعية بتولّع: ليه وإزاي نقسّمها؟"
    hook: "مرض واحد ممكن يبقى بقعة في الرجل، أو نزيف في الرئة وفشل كلوي. السر في حجم الوعاء والطريقة اللي الجدار بيتضرب بيها."
    minutes: 10
    pages: [123, 126]
    topics: [basics, classification]
    goals:
      - "تعرّف الـ vasculitis وتفهم ليه أعراضه متنوعة كده"
      - "تعدّ الأربع mechanisms اللي بيضربوا الجدار، وليه كل واحد بيدّي علامة معملية مختلفة"
      - "تقسّم بالـ Chapel Hill 2012 حسب حجم الوعاء والأقسام التانية"
    status: unverified
    steps:
      - kind: explain
        page: 123
        title: "يعني إيه vasculitis؟"
        quote: "Vasculitides are a hetrogenous group of conditions characterized by inflammation and necrosis of blood vessels."
        text: |
          الـ **vasculitides** مجموعة أمراض مختلفة، يجمعها ==inflammation and necrosis of blood vessels==.

          - أي وعاء، بأي حجم، في أي organ ممكن يتصاب.
          - علشان كده الأعراض متنوعة جدًا: من مرض **benign** في الجلد بس، لحد مرض **life-threatening** systemic.
          - وبالتالي بيقلّد أمراض كتير، وأمراض كتير بتقلّده. فلازم **systematic approach**.
      - kind: explain
        page: 123
        title: "عمليتين بس"
        quote: "Pathogenesis of vasculitis involves two processes, namely. 1. Inflammation of vessel wall. 2. Ischaemia of tissues."
        text: |
          الـ pathogenesis كلها عمليتين:
          1. ==Inflammation of vessel wall==
          2. **Ischaemia of tissues** (الوعاء ضاق أو اتسد، فالعضو اللي بيغذيه جاع)

          أغلبهم **immune-mediated** و **idiopathic**.
      - kind: reveal
        page: 123
        quote: "Pathogenesis of vasculitis involves two processes, namely."
        prompt: "لو العملية بس «التهاب وعاء» و«ischaemia»، ليه أعراض الـ vasculitis متنوعة لدرجة إنها بتقلّد أمراض كتير؟"
        answer: |
          لأن العرض بيتحدد بـ **مين الوعاء ده بيغذّي**، مش بالمرض نفسه. الكتاب بيقول **vessels of any size and of any organ** ممكن تتصاب.

          التفسير المقبول (مش في الكتاب):
          - وعاء صغير في الجلد ← **purpura**.
          - وعاء الـ nerve (vasa nervorum) ← **foot drop** مفاجئ.
          - شريان الكلية ← **hypertension** أو **renal infarction**.
          - شريان في المخ ← **stroke** في شاب.

          فنفس العملية بتلبس وش عضو مختلف كل مرة، وعشان كده الكتاب بيقول محتاج ==systematic approach==.
      - kind: table
        page: 124
        quote: "Immune complex mediated with immune complex deposition or formation in situ. This is associated with low complement levels, e.g. Henoch-Schonlein purpura (HSP), polyarteritis nodosa (PAN)."
        title: "إزاي الجدار بيتضرب؟"
        columns: [Mechanism, Clue, Example]
        rows:
          - ["Allergic angiitis", "Eosinophils, high IgE", "Churg–Strauss"]
          - ["Pauci-immune (ANCA)", "Few deposits", "GPA, MPA, CSS"]
          - ["Immune complex", "Low complement", "HSP, PAN"]
          - ["T cell (Th1)", "Granulomatous infiltrate", "GCA, Takayasu"]
        hide: [[0, 2], [1, 1], [2, 1], [3, 2]]
      - kind: explain
        page: 124
        title: "ليه كل mechanism ليه علامة معملية؟"
        quote: "Immune complex mediated with immune complex deposition or formation in situ. This is associated with low complement levels"
        text: |
          الكتاب بيدّي أربع طرق لضرب الجدار، وكل واحدة بتسيب **بصمة** تقدر تدوّر عليها:
          - **Allergic angiitis** (زي **Churg–Strauss**): **eosinophilia** و **IgE عالي**، لأن العملية allergic أصلًا، فالـ eosinophils هي اللي بتهاجم.
          - **Antibody mediated (pauci-immune)** = الـ **ANCA-associated vasculitis (AAV)**: الـ ANCA في الدم، بس الجدار تحت الميكروسكوب **فيه immune deposits قليلة جدًا** (pauci = قليل).
          - **Immune complex**: زي **HSP** و **PAN**، ومعاها ==low complement== لأن الـ complexes بتشغّل الـ classical pathway فالـ complement **بيتصرف** (افتكر المحاضرة 7).
          - **T cell mediated** بالـ **Th1**: زي **GCA** و **Takayasu**، فبيعمل **granuloma** و giant cells بدل antibodies.

          يعني لما تطلب **complement** و **ANCA** و **eosinophils**، إنت بتسأل "أنهي mechanism شغال؟".
      - kind: check
        page: 124
        quote: "Immune complex mediated with immune complex deposition or formation in situ. This is associated with low complement levels, e.g. Henoch-Schonlein purpura (HSP), polyarteritis nodosa (PAN)."
        question: "Which vasculitis mechanism typically lowers serum complement?"
        options:
          - "Immune complex mediated"
          - "Pauci-immune ANCA"
          - "Th1 T-cell mediated"
          - "Allergic angiitis"
        answer: 0
        why:
          - "صح: الـ immune complexes بتستهلك الـ complement (HSP، polyarteritis nodosa (PAN))."
          - "الـ pauci-immune معناها deposits قليلة، فالـ complement عادي."
          - "الـ Th1 ده giant cell arteritis (GCA) و Takayasu، مفيش استهلاك complement."
          - "الـ allergic angiitis علامته eosinophilia و immunoglobulin E (IgE)."
      - kind: explain
        page: 124
        title: "الـ pathology مش هتقولك الاسم"
        quote: "Pathology of Vasculitis\n  Considerable overlap in patterns of pathological involvement.\n  Pathologic findings not diagnostic for a specific syndrome.\n  Can be focal and segmental.\n  Not all the vessel may be involved.\n  Occasionally, the vasculitis might be necrotizing.\n  (Limited Response) Increased permeability.\n  Weakening (Aneurysm +/ hemorrhage) Intimal proliferation and thrombosis.\n  Obstruction and local ischemia."
        text: |
          - الأنماط بتتداخل جامد، والـ pathology ==not diagnostic== لمرض بعينه.
          - الإصابة ممكن تبقى **focal and segmental**: حتة مصابة وحتة سليمة (skip lesions).
          - الجدار الملتهب: permeability تزيد، يضعف (**aneurysm** أو نزيف)، أو الـ intima تتكاثر و thrombosis، والنهاية **obstruction and ischaemia**.

          الأرقام: incidence **19.8 per million** في السنة، الذروة **65–74** سنة، والرجالة أكتر.
      - kind: reveal
        page: 124
        quote: "Pathology of Vasculitis\n  Considerable overlap in patterns of pathological involvement.\n  Pathologic findings not diagnostic for a specific syndrome.\n  Can be focal and segmental.\n  Not all the vessel may be involved.\n  Occasionally, the vasculitis might be necrotizing.\n  (Limited Response) Increased permeability.\n  Weakening (Aneurysm +/ hemorrhage) Intimal proliferation and thrombosis.\n  Obstruction and local ischemia."
        prompt: "ليه الـ focal and segmental دي بتهمك عمليًا قدام عيان GCA؟"
        answer: |
          لأن الـ biopsy ممكن تيجي **سليمة** لو أخدت حتة ما فيهاش التهاب. علشان كده في GCA بناخد **4–6 cm**، ولو الشك قوي والـ biopsy سليمة نعمل الناحية التانية (هتشوفها في درس 3).
      - kind: explain
        page: 125
        title: "Primary ولا secondary؟"
        quote: "Polysystemic autoimmun diseases"
        text: |
          الكتاب بيقسّم الأول لنوعين:
          - **Primary**: الوعاء هو المرض نفسه: **arteritis temporalis**، **Takayasu**، **Wegener granulomatosis**، **Churg–Strauss**، **PAN**، **Schönlein–Henoch purpura**.
          - **Secondary**: الـ vasculitis نتيجة لحاجة تانية: **polysystemic autoimmune diseases** (زي الـ lupus والـ RA)، **infections**، **hypersensitivity** (أدوية)، **cryoglobulinaemic vasculitis**، وغيرهم زي Cogan و Sweet.

          ليه التقسيمة دي مهمة؟ لأن في الـ ==secondary== العلاج الأول هو **السبب**: توقف الدوا، تعالج الـ hepatitis C، تتحكم في الـ lupus. وده نفس اللي هتلاقيه في آخر المحاضرة: علاج الـ cryoglobulinaemic vasculitis بيبدأ بـ **treat Hep C**.
