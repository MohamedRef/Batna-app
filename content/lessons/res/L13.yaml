  - id: res.L13.lesson6
    title: "الـ referencing: ليه وإمتى، و Harvard ضد Vancouver"
    hook: "كل جملة واخدها من حد لازم تقول هي جاية منين. ولو مقولتش، دي plagiarism حتى لو بكلامك."
    minutes: 8
    pages: [56, 68]
    topics: [referencing]
    goals:
      - "تعرّف الـ referencing وليه بنعمله"
      - "تعرف إمتى لازم reference وإمتى لأ"
      - "تفرّق بين reference list و bibliography، وبين Harvard و Vancouver"
    status: unverified
    steps:
      - kind: explain
        page: 56
        quote: "What is referencing?\nReferencing is a standardized way of acknowledging the sources of information and ideas that have been used in an assignment and allows the source to be identified."
        title: "يعني إيه referencing؟"
        text: |
          ==Referencing== = طريقة **standardized** تنسب بيها مصادر المعلومات والأفكار اللي استخدمتها، بحيث **المصدر يتعرف**.

          وفي الكتابة الأكاديمية لازم تنسب **كل حتة** لصاحبها: مرة **جوه النص** (in-text)، ومرة في **ليستة في الآخر**.
      - kind: explain
        page: 57
        quote: "WHY DO WE NEED REFERENCING?\nIn academic writing you are obliged to attribute every piece of material you use to its author"
        title: "الـ reference في مكانين"
        text: |
          في الـ academic writing ==لازم تنسب كل حتة بتستخدمها لصاحبها==.

          والـ references بتتكتب في مكانين:

          1. ==جوه النص==: عند النقطة اللي استخدمت فيها المعلومة.
          2. ==في list في الآخر==.

          ليه الاتنين؟ اللي في النص بيقول «المعلومة دي جاية من حد»، واللي في الآخر بيقول «تلاقيه فين بالظبط». التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 60
        quote: "Why do we need referencing?\nTo distinguish your own ideas from those of someone else.\nTo cite different points of view.\nTo validate what you are writing, by referring to documented evidence. Published work for instance can be used to support your argument and add credibility to your writing.\nTo inform readers of the scope and depth of your reading."
        title: "ليه؟"
        text: |
          - تفصل **أفكارك** عن أفكار غيرك.
          - تعرض **وجهات نظر** مختلفة.
          - ==Validate== كلامك بدليل موثّق (credibility).
          - توري القارئ **قريت قد إيه**.
          - تقارن وتقيّم عشان توري إنك فاهم، وتأيد أو تعارض رأي، وتمهّد للبحث اللي وصّل لدراستك.
          - تقتبس نقطة مهمة، وتخلّي القارئ **يرجع للأصل** بنفسه.
          - وأهمهم: تتجنب ==plagiarism==.
      - kind: explain
        page: 63
        quote: "What should be referenced?\nIdeas, information, results, opinions from any source that you have summarised, paraphrased or directly quoted\nDefinitions of terms\nIllustrations, tables, figures drawn from sources\nPlans, ideas or anything that was stimulated by others"
        title: "إيه اللي محتاج reference؟"
        text: |
          - ==Ideas، information، results، opinions== من أي مصدر، سواء لخّصتها أو paraphrase أو quote.
          - ==Definitions of terms==.
          - ==Illustrations، tables، figures== جاية من مصادر.
          - خطط أو أفكار أو أي حاجة غيرك ألهمك بيها.

          ليه حتى الـ paraphrase؟ لأن الكلام اتغير بس الفكرة لسه بتاعة صاحبها. التفسير المقبول (مش في الكتاب).
      - kind: check
        page: 63
        quote: "What should be referenced?\nIdeas, information, results, opinions from any source that you have summarised, paraphrased or directly quoted\nDefinitions of terms\nIllustrations, tables, figures drawn from sources\nPlans, ideas or anything that was stimulated by others"
        question: "In your thesis you paraphrase another author's definition of «frailty» in your own words. Must you reference it?"
        options:
          - "Yes; ideas and definitions are referenced even when paraphrased"
