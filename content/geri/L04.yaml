    tags: [high-yield]
  - id: geri.L04.083
    kind: card
    topic: delirium-treatment
    front: Which drug is preferred for delirium, and on what dosing principle?
    back: Neuroleptics, with haloperidol the drug of choice (fewer side effects), given in the lowest dose for the shortest time possible.
    src: { page: 76, quote: "Neuroleptics are preferred - Haloperidol is the drug of choice." }
    status: unverified
    tags: [high-yield]
  - id: geri.L04.084
    kind: cloze
    topic: delirium-treatment
    text: "Haloperidol for delirium: start {{c1::0.5 to 1 mg}} orally or parenterally, repeat every {{c2::30 minutes}} after rechecking vital signs until sedation; total loading dose no more than {{c3::3 to 5 mg}}."
    src: { page: 76, quote: "The recommended starting dose 0.5 to 1 mg of haloperidol orally or parenterally, repeated every 30 min." }
    status: unverified
    tags: [numbers, high-yield]
