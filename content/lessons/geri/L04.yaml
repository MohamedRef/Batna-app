          - **1993 Tacrine** (تحت على الشمال): اتسحب سنة 2013 بسبب serious adverse effects.
          - **1996 Donepezil**، و **2000 Rivastigmine**، و **2001 Galantamine**: التلات ==cholinesterase inhibitors==.
          - **2003 Memantine**، و **2014 Namzaric** (memantine مع donepezil؛ التفسير المقبول، مش في الكتاب).
