      - "الزراعة أحسن علاج؛ half-life 14 سنة living و 10 deceased."
      - "الوفاة مع كلية شغالة: CVD و infection و malignancy."
      - "Absolute: سرطان، قلب أو رئة متقدمة، كبد متقدم، عدوى أو GN نشط، CDC موجب."
