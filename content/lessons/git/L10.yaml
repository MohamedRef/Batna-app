            <text x="230" y="16" text-anchor="middle" class="t-sm t-bad t-b">Endoscopic therapy</text>
          </svg>
      - kind: explain
        page: 290
        title: "الـ pathologist بيشوف إيه؟"
        quote: "Histopathologic findings of low-grade dysplasia in Barrett esophagus. The surface epithelium displays nuclear stratification, limited to the lower half of the cytoplasm."
        text: |
          صور ص 290 و 291 بتمشي بالترتيب:
          - **Non-dysplastic Barrett**: glandular epithelium فيه ==goblet cells== (ودي اللي بتقول intestinal metaplasia).
          - **Low-grade dysplasia**: **nuclear stratification** محصورة في **النص اللي تحت** من الخلية.
          - **High-grade dysplasia**: stratification **full-thickness** والـ mucosa شكلها villous.

          ليه الـ stratification علامة خطر؟ التفسير المقبول (مش في الكتاب): الخلية الطبيعية نواتها قاعدة مترتبة في القاع. لما الخلايا تبدأ تتكاثر من غير نظام، الأنوية تتكوّم فوق بعض وتطلع لفوق، وكل ما طلعت أكتر، كل ما الخلية بعدت عن الطبيعي.
      - kind: figure
        page: 290
        quote: "Histopathologic findings of low-grade dysplasia in Barrett esophagus."
        title: "Low-grade dysplasia"
        image: { file: git/L10-barrett-lgd.webp, book: true }
        alt: "Book histology of low-grade dysplasia in Barrett esophagus: glands lined by columnar cells whose nuclei are crowded and stratified in the lower half of the cells."
        caption: |
          الأنوية متكدسة، بس ==في النص اللي تحت== من الخلية.
      - kind: figure
