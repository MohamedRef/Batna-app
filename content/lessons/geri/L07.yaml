          - "ده السؤال 13 في الـ GDS-15."
      - kind: aside
        tone: tip
        page: 120
        quote: "GDS"
        text: "في ص 120 فيه **Geriatric Depression Scale (GDS)** بالعربي، 30 سؤال (هل أنت راضٍ عن حياتك أساسًا؟...). نفس الفكرة، أسئلة أكتر."
      - kind: figure
        page: 121
        quote: "Clinical Frailty Scale\n| Score | Category | Description |\n|---|---|---|\n| 1 | Very Fit | People who are robust, active, energetic and motivated. These people commonly exercise regularly. They are among the fittest for their age. |\n| 2 | Well | People who have no active disease symptoms but are less fit than category 1. Often, they exercise or are very active occasionally, e.g. seasonally. |\n| 3 | Managing Well | People whose medical problems are well controlled, but are not regularly active beyond routine walking. |\n| 4 | Vulnerable | While not dependent on others for daily help, often symptoms limit activities. A common complaint is being \"slowed up\", and/or being tired during the day. |\n| 5 | Mildly Frail | These people often have more evident slowing, and need help in high order IADLs (finances, transportation, heavy housework, medications). Typically, mild frailty progressively impairs shopping and walking outside alone, meal preparation and housework. |\n| 6 | Moderately Frail | People need help with all outside activities and with keeping house. Inside, they often have problems with stairs and need help with bathing and might need minimal assistance (cuing, standby) with dressing. |\n| 7 | Severely Frail | Completely dependent for personal care, from whatever cause (physical or cognitive). Even so, they seem stable and not at high risk of dying (within ~ 6 months). |\n| 8 | Very Severely Frail | Completely dependent, approaching the end of life. Typically, they could not recover even from a minor illness. |\n| 9 | Terminally Ill | Approaching the end of life. This category applies to people with a life expectancy <6 months, who are not otherwise evidently frail. |\nScoring frailty in people with dementia\nThe degree of frailty corresponds to the degree of dementia. Common symptoms in mild dementia include forgetting the details of a recent event, though still remembering the event itself, repeating the same question/story and social wi