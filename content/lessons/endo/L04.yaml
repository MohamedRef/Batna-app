  - id: endo.L04.lesson2
    title: "الغدة الدرقية والقلب"
    hook: "مريض hypothyroid نبضه 55 وضغطه 100/95. ليه الـ diastolic بالذات هو اللي عالي؟"
    minutes: 6
    pages: [45, 47]
    topics: [thyroid-heart]
    goals:
      - "تشرح الـ systolic والـ diastolic dysfunction في الـ hypothyroidism"
      - "تعدّ تلات ميكانيزمات للـ diastolic hypertension"
      - "تعرف أثر الـ thyroxine على الضغط والـ heart failure"
    status: unverified
    steps:
      - kind: explain
        page: 45
        quote: "disorders of the thyroid gland can worsen old cardiac symptoms or cause new ones, and can accelerate the underlying heart problem"
        title: "الغدة بتلعب في القلب"
        text: |
          لأي حد عنده heart disease، أمراض الـ thyroid ممكن **تزوّد الأعراض القديمة**، **تعمل أعراض جديدة**، و **تسرّع** المرض نفسه.
      - kind: explain
        page: 46
        quote: "In hypothyroidism the heart muscle is weakened in both its contraction phase, and also its relaxation phase."
        title: "عضلة كسلانة في الاتجاهين"
        text: |
          في الـ ==hypothyroidism== عضلة القلب ضعيفة في:
          - الـ **contraction**: بيضخ أقل مع كل نبضة = ==systolic dysfunction==.
          - الـ **relaxation**: مش بترتاح كويس بين النبضات = ==diastolic dysfunction==.

          والنبض بيقل **10-20 beat/min** عن الطبيعي. بس رغم كده، ممكن **PVCs** وحتى **AF** يزيدوا.
      - kind: check
        page: 46
        quote: "hypothyroidism may worsen the tendency for premature beats (such as pvcs) and even tachycardias such as atrial fibrillation"
        question: "Which arrhythmia can hypothyroidism make worse, despite bradycardia?"
        options: ["Atrial fibrillation", "Complete heart block only", "WPW", "None"]
        answer: 0
        why:
          - "صح: الكتاب بيقول premature beats (PVCs) وحتى AF."
          - "مش مذكور."
          - "مش مذكور."
          - "الكتاب بيقول بيزوّد الـ PVCs والـ AF."
      - kind: figure
        page: 46
        quote: "Because the arteries are stiffer in hypothyroidism, (dt reduction of the amount of nitric oxide in the lining of the blood vessels"
        title: "ليه الـ diastolic بيعلى؟"
        alt: "Three boxes feeding into diastolic hypertension. One: less nitric oxide in the vessel lining makes arteries stiff. Two: more sympathetic activity, fewer beta receptors so alpha responses dominate. Three: SIAD expands extracellular volume and raises systemic vascular resistance. Below: thyroxine brings diastolic pressure to 90 or less in 32 percent."
        caption: "تلات أسباب، والعلاج بالـ thyroxine بيظبط الـ diastolic في 32%."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="E04b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="6" y="8" width="102" height="74" rx="8" class="fg-box"/>
            <text x="57" y="28" text-anchor="middle" class="t-sm t-b">↓ NO</text>
            <text x="57" y="48" text-anchor="middle" class="t-sm">stiff</text>
            <text x="57" y="66" text-anchor="middle" class="t-sm">arteries</text>
            <rect x="114" y="8" width="102" height="74" rx="8" class="fg-box"/>
            <text x="165" y="28" text-anchor="middle" class="t-sm t-b">↑ sympathetic</text>
            <text x="165" y="48" text-anchor="middle" class="t-sm">↓ β receptors</text>
            <text x="165" y="66" text-anchor="middle" class="t-sm">α wins</text>
            <rect x="222" y="8" width="102" height="74" rx="8" class="fg-box"/>
            <text x="273" y="28" text-anchor="middle" class="t-sm t-b">SIAD</text>
            <text x="273" y="48" text-anchor="middle" class="t-sm">↑ ECF volume</text>
            <text x="273" y="66" text-anchor="middle" class="t-sm">↑ SVR</text>
            <path d="M57 82L140 120" class="fg-arrow-bad" marker-end="url(#E04b)"/>
            <path d="M165 82V118" class="fg-arrow-bad" marker-end="url(#E04b)"/>
            <path d="M273 82L190 120" class="fg-arrow-bad" marker-end="url(#E04b)"/>
            <rect x="75" y="122" width="180" height="36" rx="8" class="fg-bad"/>
            <text x="165" y="145" text-anchor="middle" class="t-b">Diastolic hypertension</text>
            <rect x="35" y="180" width="260" height="56" rx="8" class="fg-good"/>
            <text x="165" y="202" text-anchor="middle" class="t-sm t-b">Thyroxine → DBP ≤ 90 mm Hg</text>
            <text x="165" y="222" text-anchor="middle" class="t-sm">in 32% of hypertensive hypothyroid</text>
          </svg>
      - kind: reveal
        page: 46
        quote: "The number of ß-adrenergic receptors is decreased, leading to increased alpha-adrenergic responses"
        prompt: "ليه قلة الـ β receptors بتعلّي الضغط؟"
        answer: "الـ β2 في الأوعية بيعمل vasodilation. لما الـ β receptors تقل، الـ **α-adrenergic** (vasoconstriction) بيبقى هو الغالب، فالـ peripheral resistance تعلى، وده بيرفع الـ **diastolic** أكتر."
      - kind: aside
        tone: exam
        page: 46
        quote: "In 32% of hypertensive hypothyroid patients, replacement therapy with thyroxine leads to a fall in diastolic blood pressure to 90 mm Hg or less"
        text: "رقمين بيتسألوا: النبض بيقل **10-20**، والـ thyroxine بيرجّع الـ DBP لـ 90 أو أقل في **32%**."
      - kind: explain
        page: 47
        quote: "Hypothyroidism can make well- controlled heart failure worsen, and can produce heart failure for the first time"
        title: "والـ heart failure؟"
        text: |
          الـ hypothyroidism ممكن **يبوّظ heart failure كانت متظبطة**، أو **يعمل heart failure لأول مرة** عند حد عنده heart disease بسيط.

          (الكتاب كرر الكلام ده كله في ص 71-73.)
      - kind: case
        page: 46
        quote: "Diastolic hypertension may result from extracellular volume expansion (SIAD) and increased systemic vascular resistance."
        stem: "A 58-year-old woman with fatigue and weight gain: pulse 54, BP 135/98, TSH 40 mIU/L."
        steps:
          - question: "Her blood pressure pattern?"
            options: ["Diastolic hypertension of hypothyroidism", "Isolated systolic hypertension", "Normal", "Hypertensive emergency"]
            answer: 0
            why: "الـ hypothyroidism بيرفع الـ diastolic: NO قليل، α غالب، و SIAD."
          - question: "What may thyroxine do to her diastolic pressure?"
            options: ["Bring it to 90 mm Hg or less (about 1 in 3)", "Raise it", "Nothing", "Drop it below 60"]
            answer: 0
            why: "32% من الـ hypertensive hypothyroid الـ DBP بيوصل 90 أو أقل."
      - kind: try
        items: [endo.L04.024, endo.L04.026, endo.L04.028, endo.L04.031, endo.L04.191]
    recap:
      - "Hypothyroid heart: systolic + diastolic dysfunction."
      - "النبض -10 لـ -20، بس PVCs و AF ممكن يزيدوا."
      - "Diastolic HTN: ↓NO (stiff)، ↓β/↑α، SIAD + ↑SVR."
      - "Thyroxine: DBP ≤90 في 32%."
      - "بيبوّظ الـ HF أو يعملها لأول مرة."
    practice: [endo.L04.023, endo.L04.024, endo.L04.025, endo.L04.026, endo.L04.027, endo.L04.028, endo.L04.029, endo.L04.030, endo.L04.031, endo.L04.032, endo.L04.033, endo.L04.190, endo.L04.191, endo.L04.192, endo.L04.193, endo.L04.241]
  # ------------------------------------------------------------------
  - id: endo.L04.lesson3
    title: "الكلية والخصوبة: الـ CRF والـ testosterone"
    hook: "مريض غسيل كلوي، الـ LH عالي والـ testosterone واطي. يعني العيب في الخصية؟ ولا فوق؟ الإجابة: الاتنين."
    minutes: 7
    pages: [47, 50]
    topics: [kidney, crf-reproductive]
    goals:
      - "تعدّ هرمونات الكلية التلاتة"
      - "تشرح ليه الـ testosterone واطي في الـ CRF بسبع أسباب"
      - "تعرف إيه اللي بيتحسن بالغسيل وإيه بالزرع"
    status: unverified
    steps:
      - kind: explain
        page: 47
        quote: "The human kidney secretes three hormones 1- Renin. 2- Erythropoietin. 3- Calcitrol"
        title: "الكلية غدة كمان"
        text: |
          الكلية بتفرز **تلات هرمونات**:
          1. ==Renin==.
          2. ==Erythropoietin==.
          3. ==Calcitriol== (1,25(OH)2 vitamin D3).

          والـ CRF بيأثر على تلات أجهزة: الـ **reproductive**، الـ **CHO metabolism**، والـ **parathyroid**.
      - kind: explain
        page: 48
        quote: "The plasmsa testosterone levels are decreased or low normal ( inspite of an increased LH and FSH)."
        title: "الـ testosterone في الـ CRF"
        text: |
          التغيرات بتبدأ ==بدري== بعد ما الكلى تضعف، وغالبًا بسبب الـ **uremic toxins** والأدوية.

          الـ testosterone ==واطي أو low normal== **رغم إن الـ LH والـ FSH عاليين**. يعني فيه **combined abnormality**: primary hypogonadism + عيب في الـ hypothalamic–pituitary axis.
      - kind: figure
        page: 48
        quote: "Why testosterone levels are decreased or low normal? 1- Decrease of the pulsatility of hypothalamic GRH"
        title: "سبع ضربات على المحور"
        alt: "Vertical axis: hypothalamus, pituitary, testis, blood. Hits marked: 1 less pulsatile GnRH at the hypothalamus; 2 weak pituitary response; 3 broken feedback; 4 Leydig resistance from an LH-receptor inhibitor at the testis; 5 reduced clearance of GnRH, LH and FSH; 6 high prolactin suppressing LH and FSH; 7 rising SHBG lowering free testosterone in blood."
        caption: "العيب في كل دور: فوق (1، 2، 3، 6)، في الخصية (4)، وفي الدم (5، 7)."
        svg: |
          <svg viewBox="0 0 330 270" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="E04c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="8" y="8" width="110" height="34" rx="8" class="fg-acc"/>
            <text x="63" y="30" text-anchor="middle" class="t-sm t-b">Hypothalamus</text>
            <rect x="8" y="78" width="110" height="34" rx="8" class="fg-acc"/>
            <text x="63" y="100" text-anchor="middle" class="t-sm t-b">Pituitary</text>
            <rect x="8" y="148" width="110" height="34" rx="8" class="fg-acc"/>
            <text x="63" y="170" text-anchor="middle" class="t-sm t-b">Testis (Leydig)</text>
            <rect x="8" y="218" width="110" height="34" rx="8" class="fg-acc"/>
            <text x="63" y="240" text-anchor="middle" class="t-sm t-b">Blood</text>
            <path d="M63 42V76" class="fg-arrow" marker-end="url(#E04c)"/>
            <path d="M63 112V146" class="fg-arrow" marker-end="url(#E04c)"/>
            <path d="M63 182V216" class="fg-arrow" marker-end="url(#E04c)"/>
            <text x="74" y="64" class="t-sm t-mut">GnRH</text>
            <text x="74" y="134" class="t-sm t-mut">LH, FSH</text>
            <text x="74" y="204" class="t-sm t-mut">T</text>
            <rect x="134" y="8" width="190" height="34" rx="6" class="fg-bad"/>
            <text x="142" y="22" class="t-sm">1 ↓ GnRH pulses</text>
            <text x="142" y="37" class="t-sm">3 weak feedback</text>
            <rect x="134" y="78" width="190" height="34" rx="6" class="fg-bad"/>
            <text x="142" y="92" class="t-sm">2 ↓ response to GnRH</text>
            <text x="142" y="107" class="t-sm">6 ↑ prolactin ⊣ LH, FSH</text>
            <rect x="134" y="148" width="190" height="34" rx="6" class="fg-bad"/>
            <text x="142" y="170" class="t-sm">4 LH-receptor inhibitor</text>
            <rect x="134" y="218" width="190" height="34" rx="6" class="fg-bad"/>
            <text x="142" y="232" class="t-sm">5 ↓ clearance GnRH, LH, FSH</text>
            <text x="142" y="247" class="t-sm">7 ↑ SHBG → ↓ free T</text>
          </svg>
      - kind: order
        page: 48
        quote: "1- Decrease of the pulsatility of hypothalamic GRH (gonadotrophin releasing hormone) release. 2- Diminished answer of the pituitary gland to GRH."
        prompt: "رتّب أول أربع أسباب زي الكتاب:"
        steps:
          - "↓ GnRH pulsatility"
          - "↓ Pituitary response to GnRH"
          - "Impaired feedback (low T can't drive gonadotrophins)"
          - "Leydig resistance (LH-receptor inhibitor)"
