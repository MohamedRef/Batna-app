        quote: "NSAIDS (esp indomethacin) Propoxyphene"
        text: "الـ **propoxyphene** اتسحب من السوق في أمريكا وأوروبا 2009–2010 بسبب الـ cardiac toxicity، والـ **ticlopidine** اتبدل بالـ clopidogrel تقريبًا. الباقي لسه في **Beers 2023**."
