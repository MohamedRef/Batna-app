      - kind: explain
        page: 48
        quote: "In patients with ascites and gastroesophageal varices, carvedilol is safe and may improve survival, as long as no impairment of the systemic hemodynamic or renal dysfunction occur, with maintained arterial blood pressure as suitable safety surrogate."
        title: "طب ولو عنده ascites؟"
        text: |
          الخوف القديم: الـ beta-blocker بيوطّي الضغط، والمريض اللي عنده ascites ضغطه أصلًا واطي وكليته على الحافة. الكتاب بيرد:

          - Long-term carvedilol therapy is not harmful في الـ decompensated cirrhosis مع ascites.
          - في مرضى الـ ascites والـ varices: الـ carvedilol safe and may improve survival.
          - بشرط ما يحصلش impairment في الـ systemic haemodynamics أو **renal dysfunction**.

          ==Safety surrogate==: maintained arterial blood pressure. يعني تراقب ضغط الدم: طول ما هو ماسك، كمّل.

          ==Target dose==: 12.5 mg/day، أقل من جرعة الـ heart failure بكتير. (برّه الكتاب، للفهم بس: الجرعات الأعلى بتوطّي الضغط أكتر من غير ما تنزّل الـ HVPG زيادة.)
