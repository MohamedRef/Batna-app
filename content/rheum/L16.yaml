items:
  # ---------- p241: definition, epidemiology, aetiology ----------
  - id: rheum.L16.001
    kind: card
    topic: intro
    front: Define rheumatoid arthritis (book definition).
    back: A symmetrical, deforming polyarthritis of small and large joints, often with systemic disturbance and extra-articular features.
    src: { page: 241, quote: "Symmetrical, deforming, small and large joint polyarthritis often associated with systemic disturbance and extra- articular disease features. Prevalence 1% world wide." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.002
    kind: cloze
    topic: intro
    text: "RA prevalence is about {{c1::1%}} worldwide, with a female to male ratio of {{c2::2:1}}."
    src: { page: 241, quote: "Symmetrical, deforming, small and large joint polyarthritis often associated with systemic disturbance and extra- articular disease features. Prevalence 1% world wide.\nFemale / Male 2:1." }
    status: unverified
    tags: [numbers]
  - id: rheum.L16.003
    kind: enumerate
    topic: intro
    prompt: Mention the HLA associations of RA given in the book.
    points: [HLA-DR1, HLA-DR4, HLA-DRw14]
    pass: 2
    hook: "RA «DR1 وDR4 وDRw14»: واحد وأربعة وأربعتاشر."
    src: { page: 241, quote: "Genetic background:\n  Association HLA DR1, DR4, DRW14.\n  Shared epitope: Increased susceptibility with a specific aminoacid sequence on B chain of HLA DR1. DR4.\n  Increased In first degree relatives." }
    status: unverified
  - id: rheum.L16.004
    kind: card
    topic: intro
    front: What is the shared epitope in RA?
    back: A specific amino-acid sequence on the beta chain of HLA-DR1 and DR4 that increases susceptibility to RA.
    src: { page: 241, quote: "Shared epitope: Increased susceptibility with a specific aminoacid sequence on B chain of HLA DR1. DR4." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.005
    kind: enumerate
    topic: intro
    prompt: Mention the possible environmental antigens (infections) suggested as triggers of RA.
    points: ["Viruses (parvovirus, Epstein-Barr)", Retroviruses, Mycoplasma, Mycobacteria]
    pass: 3
    hook: "محفزات RA المقترحة «فيروسات، ريتروفيروسات، mycoplasma، وmycobacteria»: parvovirus وEpstein-Barr، retroviruses، mycoplasma، mycobacteria."
    src: { page: 241, quote: "Possible environmental factor antigen\n  Virus (parvovirus, Epstien barr).\n  Retrovirus.\n  Mycoplasma.\n  Mycobacteria." }
    status: unverified
  - id: rheum.L16.006
    kind: enumerate
    topic: intro
    prompt: Mention the three aetiological factors of RA.
    points:
      - Genetic background (HLA-DR1, DR4, DRw14; shared epitope; first-degree relatives)
      - A possible environmental antigen (viruses, retroviruses, mycoplasma, mycobacteria)
      - Self-perpetuation through autoimmunity
    pass: 3
    hook: "RA = «جينات + محفّز + بيكمّل لوحده»: genetic background (DR1، DR4، DRw14، shared epitope، قرايب درجة أولى)، environmental antigen، وself-perpetuation by autoimmunity."
    src: { page: 241, quote: "Aetiology\n1- Genetic background:\nAssociation HLA DR1, DR4, DRW14.\nShared epitope: Increased susceptibility with a specific aminoacid sequence on B chain of HLA DR1. DR4.\nIncreased In first degree relatives.\n2- Possible environmental factor antigen\nVirus (parvovirus, Epstien barr).\nRetrovirus.\nMycoplasma.\nMycobacteria.\n3- Self perpetuation through autoimmunity." }
    status: unverified
  - id: rheum.L16.007
    kind: mcq
    topic: intro
    stem: A 35-year-old woman asks whether her sister's RA raises her own risk. Which statement from the book's aetiology section fits best?
    options: ["Risk rises in first-degree relatives, with HLA-DR1/DR4 and the shared epitope", "RA is purely environmental, so her family history does not matter at all", "Her risk is linked mainly to HLA-B27, as in the spondyloarthritides", "Only male relatives of a patient carry an increased risk of RA"]
    answer: 0
    why:
      - "Correct: the genetic background includes HLA-DR1, DR4, DRw14, the shared epitope and increased risk in first-degree relatives (p241)."
      - The book lists a genetic background as the first aetiological factor.
      - HLA-B27 belongs to the seronegative spondyloarthritides, not RA.
      - The book gives no sex limit for familial risk; RA itself is twice as common in women.
    src: { page: 241, quote: "Genetic background:\n  Association HLA DR1, DR4, DRW14.\n  Shared epitope: Increased susceptibility with a specific aminoacid sequence on B chain of HLA DR1. DR4.\n  Increased In first degree relatives." }
    status: unverified
  # ---------- p242: pathogenesis ----------
  - id: rheum.L16.008
    kind: card
    topic: pathogenesis
    front: Which arm of immunity mainly drives RA, and through which cells?
    back: Cell-mediated immunity, through macrophages and Th1 lymphocytes (macrophages present processed antigen to Th1 cells).
    src: { page: 242, quote: "Cell mediated Immunity through macrophage and TH1 lymphocytes," }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.009
    kind: card
    topic: pathogenesis
    front: What is the role of B cells in RA pathogenesis according to the book?
    back: B cells become plasma cells that make antibodies and immune complexes, which may cause some of the extra-articular features.
    src: { page: 242, quote: "Some contribution of B lymphocytes → plasma cells →antibodies → immune complexes that may be responsible for some of extra- articular features." }
    status: unverified
  - id: rheum.L16.010
    kind: table
    topic: pathogenesis
    title: Cytokines in RA pathogenesis
    columns: [Cytokine or mediator, Made by, Effect]
    rows:
      - [IL-2, Th1 cells, Stimulates lymphocytes]
      - [IFN-gamma, Th1 cells, Stimulates macrophages]
      - [IL-6, Macrophages, Acute phase response (ESR and CRP)]
      - [IL-8, Macrophages, Chemotactic to polymorphs (toxic oxygen radicals)]
      - [IL-17, Th17 cells, Proinflammatory; important role in inflammation]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 2], [4, 1]]
    src: { page: 242, quote: "Macrophage produce:\n  IL6: stimulates acute phase response (ESR CRP).\n  IL-8 chemotactic to polymorphs → * Toxic oxygen radicals.\n  Prostaglandins.\n  Leukotrienes." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.011
    kind: enumerate
    topic: pathogenesis
    prompt: Mention the effects of IL-1 and TNF in RA.
    points:
      - Activate synovial fibroblasts and chondrocytes (metalloproteinases destroy cartilage; PGE2 demineralizes and destroys bone)
      - Upregulate adhesion molecules with cell recruitment
      - Stimulate angiogenesis to supply the proliferating synovium
    pass: 3
    hook: "IL-1 وTNF في RA: «يكسروا (الغضروف والعضم)، يشدّوا خلايا، ويعملوا أوعية» = activate fibroblasts/chondrocytes، adhesion molecules، angiogenesis."
    src: { page: 242, quote: "II. Upregulation of adhestion molecules with cell recruitement. III. Stimulation of angiogenesis to supply the proliferating synovium." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.012
    kind: cloze
    topic: pathogenesis
    text: "IL-1 and TNF activate synovial fibroblasts and chondrocytes: {{c1::metalloproteinases}} destroy cartilage and {{c2::PGE2}} demineralizes and destroys bone."
    src: { page: 242, quote: "I. Activate synovial fibroblasts and chondrocytes →\n  Metalloproteinases → cartilage destruction.\n  PGE2 → demineralization and destruction of bone." }
    status: unverified
  - id: rheum.L16.013
    kind: enumerate
    topic: pathogenesis
    prompt: Mention the products of the activated macrophage in RA.
    points: [IL-6, IL-8, Prostaglandins, Leukotrienes]
    pass: 3
    hook: "الـ macrophage في RA بيطلّع «6 و8 وprostaglandins وleukotrienes»: IL-6، IL-8، prostaglandins، leukotrienes."
    src: { page: 242, quote: "Macrophage produce:\n  IL6: stimulates acute phase response (ESR CRP).\n  IL-8 chemotactic to polymorphs → * Toxic oxygen radicals.\n  Prostaglandins.\n  Leukotrienes." }
    status: unverified
  - id: rheum.L16.014
    kind: mcq
    topic: pathogenesis
    stem: In an RA joint, which mediator explains the raised ESR and CRP?
    options: [IL-6 from macrophages, IL-2 from Th1 cells, IL-8 from macrophages, Leukotrienes]
    answer: 0
    why:
      - "Correct: macrophage IL-6 stimulates the acute phase response (ESR, CRP) (p242)."
      - IL-2 from Th1 cells stimulates lymphocytes.
      - IL-8 is chemotactic to polymorphs.
      - Leukotrienes are inflammatory mediators but the book ties the acute phase response to IL-6.
    src: { page: 242, quote: "Macrophage produce:\n  IL6: stimulates acute phase response (ESR CRP).\n  IL-8 chemotactic to polymorphs → * Toxic oxygen radicals.\n  Prostaglandins.\n  Leukotrienes." }
    status: unverified
  - id: rheum.L16.015
    kind: mcq
    topic: pathogenesis
    stem: Which cytokine pair does the book hold responsible for cartilage and bone destruction in RA?
    options: [IL-1 and TNF, IL-2 and IFN-gamma, IL-8 and leukotrienes, IL-17 and IL-2]
    answer: 0
    why:
      - "Correct: IL-1 and TNF activate fibroblasts and chondrocytes to release metalloproteinases and PGE2 (p242)."
      - IL-2 and IFN-gamma are Th1 products that stimulate lymphocytes and macrophages.
      - IL-8 recruits polymorphs; leukotrienes are inflammatory mediators.
      - IL-17 is proinflammatory, but the destruction pathway in the book belongs to IL-1 and TNF.
    src: { page: 242, quote: "IL1—TNF\n  I. Activate synovial fibroblasts and chondrocytes\n    a) Metalloproteinases → cartilage destruction.\n    b) PGE2 → demineralization and destruction of bone.\n  II. Upregulation of adhestion molecules with cell recruitement.\n  III. Stimulation of angiogenesis to supply the proliferating synovium." }
    status: unverified
  # ---------- p243-244: pathology ----------
  - id: rheum.L16.016
    kind: order
    topic: pathology
    prompt: Put the joint pathology of RA in order.
    steps:
      - Injury to the synovial microvasculature
      - Swelling and congestion of synovium with Th1 cells, macrophages and plasma cells; polymorph-rich effusion
      - Synovial hypertrophy with villous formation and lymphoid follicles
      - Pannus spreads over and under the articular cartilage, which is eroded
      - Fibrous and bony ankylosis
    src: { page: 243, quote: "Early change: injury to synovial microvasculature." }
    status: unverified
  - id: rheum.L16.017
    kind: card
    topic: pathology
    front: What is pannus?
    back: Inflammatory granulation tissue that spreads over and under the articular cartilage and erodes it.
    src: { page: 243, quote: "Formation of inflammatory granulation tissue (pannus) spreading over and under the articular cartilage which becomes eroded." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.018
    kind: card
    topic: pathology
    front: What is the earliest pathological change in the RA joint?
    back: Injury to the synovial microvasculature.
    src: { page: 243, quote: "Early change: injury to synovial microvasculature." }
    status: unverified
  - id: rheum.L16.019
    kind: card
    topic: pathology
    front: How do RA joints become deformed?
    back: Inflammatory destruction of soft tissues makes ligaments and tendons lax, which leads to deformities.
    src: { page: 243, quote: "Inflammatory destruction of soft tissues laxity of ligaments and tendons – deformities." }
    status: unverified
  - id: rheum.L16.020
    kind: cloze
    topic: pathology
    text: "The RA synovial effusion is rich in {{c1::polymorphs}}, while the synovial membrane is infiltrated with {{c2::Th1 lymphocytes}}, macrophages and some plasma cells."
    src: { page: 243, quote: "Swelling and congestion of synovial membrane - infiltration with TH1 lymphocytes, macrophages and some plasma cells. Effusion of synovial fluid rich in polymorphs." }
    status: unverified
  - id: rheum.L16.021
    kind: card
    topic: pathology
    front: Describe the histology of a rheumatoid subcutaneous nodule.
    back: A central area of fibrinoid necrosis surrounded by a palisade of mononuclear cells.
    src: { page: 244, quote: "Subcutaneous nodules\n  Central area of fibrinoid necrosis.\n  Palisade of mononuclear cells." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.022
    kind: card
    topic: pathology
    front: What is the pathology in extra-articular tissues in RA?
    back: A mononuclear cell infiltrate with varying degrees of fibrinoid necrosis and nodule formation.
    src: { page: 244, quote: "Extra-articular tissues\n  Mononuclear cell infiltrate with varying degrees of fibrinoid necrosis and nodule formation." }
    status: unverified
  - id: rheum.L16.023
    kind: card
    topic: pathology
    front: Why do muscles waste around an RA joint?
    back: The book lists atrophy of muscles adjacent to inflamed joints as part of the joint pathology.
    src: { page: 243, quote: "Atrophy of muscles adjacent to inflamed joints." }
    status: unverified
  # ---------- p244: onset and joint pattern ----------
  - id: rheum.L16.024
    kind: enumerate
    topic: onset
    prompt: Mention the types of onset of RA.
    points: [Gradual (usual), Acute (a minority), Palindromic (occasionally), "Systemic symptoms (fatigue, malaise, weakness, low-grade fever, weight loss)"]
    pass: 3
    hook: "RA بيبدأ «بالراحة، فجأة، يروح ويجي، أو بأعراض عامة»: gradual (usual)، acute (minority)، palindromic (occasionally)، وsystemic (fatigue، malaise، weakness، low-grade fever، weight loss)."
    src: { page: 244, quote: "ONSET\n  Gradual (usually).\n  Acute in a minority.\n  Occasionally palindromic (pain, swelling, erythema that resolve but recur 50% develop RA).\n  Systemic symptoms: Fatigue, malaise, weakness, low grade fever, loss of weight.\n  Joints: pain- swelling- tender on pressure.\n  Morning stiffness: due to edema and inflammatory mediator accumulation during sleep or inactivity.\n  Joints commonly involved: joints of hand (MCP-PIP-Wrist) foot joints-knee.\n  Also affected: shoulder- hip- ankle —sternoclavicular joints.\n  Less commonly: Tempromandibular and cricoarytenoid joint.\n  Spinal involvement is limited to upper cervical area, sacroiliac joint is spared.\n  Symmetry and non involvement of DIP is characteristic." }
    status: unverified
  - id: rheum.L16.025
    kind: cloze
    topic: onset
    text: "Palindromic onset: attacks of pain, swelling and erythema that resolve but recur; about {{c1::50%}} develop RA."
    src: { page: 244, quote: "ONSET\n  Gradual (usually).\n  Acute in a minority.\n  Occasionally palindromic (pain, swelling, erythema that resolve but recur 50% develop RA).\n  Systemic symptoms: Fatigue, malaise, weakness, low grade fever, loss of weight.\n  Joints: pain- swelling- tender on pressure.\n  Morning stiffness: due to edema and inflammatory mediator accumulation during sleep or inactivity.\n  Joints commonly involved: joints of hand (MCP-PIP-Wrist) foot joints-knee.\n  Also affected: shoulder- hip- ankle —sternoclavicular joints.\n  Less commonly: Tempromandibular and cricoarytenoid joint.\n  Spinal involvement is limited to upper cervical area, sacroiliac joint is spared.\n  Symmetry and non involvement of DIP is characteristic." }
    status: unverified
    tags: [numbers]
  - id: rheum.L16.026
    kind: card
    topic: onset
    front: What causes morning stiffness in RA?
    back: Oedema and accumulation of inflammatory mediators during sleep or inactivity.
    src: { page: 244, quote: "Morning stiffness: due to edema and inflammatory mediator accumulation during sleep or inactivity." }
    status: unverified
