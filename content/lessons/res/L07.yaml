  - id: res.L07.lesson8
    title: "تمارين المحاضرة: جولة سريعة"
    hook: "١٧ سؤال من آخر المحاضرة. تعال نحل أشهرهم ونشوف الفخاخ."
    minutes: 8
    pages: [106, 123]
    topics: [practice]
    goals:
      - "تحل أسئلة المحاضرة عن الـ phases والـ blinding والـ randomization"
      - "ترتب مستويات الـ evidence وخطوات التجربة"
      - "تتعرف على الفخاخ: observational ولا experimental، و open label"
    status: unverified
    steps:
      - kind: explain
        page: 107
        quote: "The risk of unbalanced randomization decreases"
        title: "لو كبّرت العيّنة..."
        text: |
          سؤال شريحة 107 ليه **3 إجابات صح**:

          - الـ ==confidence interval decreases== (يضيق).
          - الـ **power increases**.
          - الـ **risk of unbalanced randomization decreases**.

          والغلط: إن الـ CI يوسع، أو إن الـ power يقل.
      - kind: check
        page: 110
        quote: "Ensure study groups are comparable on baseline characteristics"
        question: "The major purpose of random assignment in an RCT is to:"
        options:
          - "Facilitate double blinding"
          - "Facilitate measurement of outcomes"
          - "Ensure groups are comparable on baseline characteristics"
          - "Reduce ascertainment bias"
        answer: 2
        why:
          - "بتساعد في الـ blinding، بس مش ده الهدف الأساسي."
          - "القياس بيعتمد على الـ protocols."
          - "صح: القرعة بتخلي الجروبين شبه بعض في البداية، حتى في الحاجات اللي مش بنقيسها."
          - "الـ ascertainment bias بيتمنع بالـ blinding."
      - kind: sort
        page: 117
        quote: "In single blinding"
        prompt: "مين مش عارف الجروب في كل نوع blinding؟"
        bins: ["Single", "Double", "Triple"]
        cards:
          - { text: "Only the subject", bin: 0 }
          - { text: "The subject and the observer", bin: 1 }
          - { text: "Subject, observer and analyzer", bin: 2 }
        why: "**Single** = العيان بس (إجابة شريحة 117: subject). **Double** = العيان والـ observer. **Triple** = العيان والـ observer والـ analyzer."
      - kind: aside
        tone: trap
        page: 114
        quote: "the clinician assessing the patients condition does not know which treatment the patient has received"
        text: |
          شريحة 114: «في الـ double blind trial» صح ولا غلط:

          - العيانين مش عارفين بياخدوا إيه: **صح**.
          - كل عيان بياخد placebo: **غلط**، الـ control بس.
          - العيانين مش عارفين إنهم في تجربة: **غلط**، دول مضيين consent.
          - كل عيان بياخد العلاجين: **غلط**، ده crossover.
          - الـ clinician اللي بيقيّم مش عارف العلاج: **صح**.
      - kind: check
        page: 112
        quote: "Researchers compared telephone company and police records"
        question: "699 drivers with accidents; phone use just before the crash compared with the same time on a previous day. This study is:"
        options:
          - "A randomized comparative experiment"
          - "An experiment without randomization"
          - "An observational study"
          - "A simple random sample"
        answer: 2
        why:
          - "محدش اتقال له «اتكلم في التليفون وانت سايق»."
          - "التجربة لازم الباحث يدّي الـ exposure بإيده."
          - "صح: الباحثين اتفرجوا على سجلات اللي الناس عملوه، يعني observational."
          - "الـ simple random sample طريقة sampling، مش design."
      - kind: order
        page: 116
        quote: "Arrange the followings ascending according to the level of evidence"
        prompt: "رتّب من الأضعف للأقوى في الـ evidence:"
        steps:
          - "Expert opinion"
          - "Case series"
          - "Case-control study"
          - "Cohort study"
          - "Randomized controlled trial"
        why: "إجابة الشريحة E، D، C، A، B: expert opinion، ثم case series، ثم case-control، ثم cohort، وفوق الكل الـ RCT."
      - kind: order
        page: 118
        quote: "While conducting experimental study, arrange the following steps in sequential manner"
        prompt: "رتّب الخطوات دي في التجربة:"
        steps:
          - "Enumerate the inclusion and exclusion criteria"
          - "Randomization"
          - "Blinding"
          - "Statistical analysis"
        why: "خطوات الـ experimental study بالترتيب: الـ criteria الأول (step 3)، بعدين القرعة (step 8)، بعدين الـ blinding (step 10)، وآخر حاجة التحليل (step 12)."
      - kind: check
        page: 121
        quote: "best suited to comparing cognitive behavioural therapy with a selective reuptake inhibitor"
        question: "Best method to compare CBT with an SSRI in anxiety disorder?"
        options:
          - "Double blind and placebo controlled"
          - "Randomization and open label"
          - "Randomization and placebo controlled, unblinded"
          - "Randomization and triple blind"
        answer: 1
        why:
          - "العيان عارف هو بيعمل جلسات ولا بياخد حباية، فمستحيل double blind."
          - "صح: قرعة، بس الـ label مفتوح لأن العلاجين مختلفين في الشكل."
          - "الاتنين علاجات فعّالة؛ مفيش placebo."
          - "مستحيل والعيان شايف علاجه."
      - kind: aside
        tone: exam
        page: 120
        quote: "It uses a single dose of drug determined from the Phase I experience"
        text: |
          أسئلة الـ **phases** في التمارين:

          - **Phase 1**: دراسات صغيرة **20-80** عيان، بتبص على الـ **toxic & pharmacological effects** (شريحة 111).
          - **Phase 2**: بيستخدم **single dose** محددة من تجربة الـ phase 1 (إجابة شريحة 120). وأول تجربة على البشر هي phase 1 مش 2.
          - **Phase 4**: **post marketing surveillance** (شريحة 115).

          وكمان: الـ experimental study **مينفعش** لـ **study of risk factors**، لأنك مش هتعرّض الناس لخطر عن قصد (شريحة 113).
      - kind: try
        items: [res.L07.109, res.L07.111, res.L07.107]
    recap:
      - "عيّنة أكبر: CI أضيق، power أعلى، والقرعة أكثر توازنًا."
      - "هدف القرعة الأساسي: جروبين متشابهين في الـ baseline. وهي أداة الـ confounders."
      - "Single = العيان. Double = + observer. Triple = + analyzer. CBT ضد SSRI = randomized open label."
      - "Phase 1 = 20-80، toxicity. Phase 2 = single dose من phase 1. Phase 4 = post marketing."
