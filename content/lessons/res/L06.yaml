  - id: res.L06.lesson4
    title: "من المعمل للصيدلية: الـ phases"
    hook: "من 10,000 مادة بتتجرّب، واحدة بس بتوصل الصيدلية. الـ 9,999 التانيين وقعوا فين؟"
    minutes: 9
    pages: [5, 41]
    topics: [drug-phases]
    goals:
      - "ترتّب مراحل تطوير الدوا"
      - "تعرف كل phase بيسأل إيه، على مين، وكام واحد"
      - "تعرف ليه phase IV موجودة"
    status: unverified
    steps:
      - kind: explain
        page: 5
        quote: "New Product Development: A Risky and Expensive Proposition\n  Discovery (2–10 Years): 5,000–10,000 Screened\n  Preclinical Testing, Laboratory and Animal Testing: 250 Enter Preclinical Testing\n  Phase I: 20–80 Healthy Volunteers Used to Determine Safety and Dosage\n  Phase II: 100–300 Patient Volunteers Used to Look for Efficacy and Side Effects\n  Phase III: 1,000–5,000 Patient Volunteers Used to Monitor Adverse Reactions to Long-Term Use (5 Enter Clinical Testing)\n  FDA Review Approval: 1 Approved by the FDA\n  Additional Post-Marketing Testing\nNet Cost: $802 Million Invested Over 15 Years (Source: Tufts Center for the Study of Drug Development)"
        title: "مشوار طويل وغالي"
        text: |
          الدوا الجديد ==A Risky and Expensive Proposition==:

          - **Discovery** (2–10 سنين)، بعدها **preclinical testing** في المعمل وعلى الحيوانات.
          - بعدها **Phase I، II، III**، وبعدين **Food and Drug Administration (FDA) review approval**، وبعدها **post-marketing testing**.
          - من **5,000–10,000** مادة بيتعملهم screening: **250** يدخلوا preclinical، **5** يدخلوا clinical testing، وواحدة بس **approved**.
          - التكلفة على الشريحة: حوالي **$802 million** على مدى **15 سنة**.
      - kind: figure
        page: 5
        quote: "New Product Development: A Risky and Expensive Proposition\n  Discovery (2–10 Years): 5,000–10,000 Screened\n  Preclinical Testing, Laboratory and Animal Testing: 250 Enter Preclinical Testing\n  Phase I: 20–80 Healthy Volunteers Used to Determine Safety and Dosage\n  Phase II: 100–300 Patient Volunteers Used to Look for Efficacy and Side Effects\n  Phase III: 1,000–5,000 Patient Volunteers Used to Monitor Adverse Reactions to Long-Term Use (5 Enter Clinical Testing)\n  FDA Review Approval: 1 Approved by the FDA\n  Additional Post-Marketing Testing\nNet Cost: $802 Million Invested Over 15 Years (Source: Tufts Center for the Study of Drug Development)"
