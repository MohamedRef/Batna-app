        text: |
          الـ **duration** هو اللي بيحسم: مرض ==incidence واطي بس مزمن ومبيموتش== (زي الـ diabetes) بيبقى prevalence عالي ومشكلة public health كبيرة. والـ common cold incidence عالي جدًا بس بيخلص في أسبوع، فالـ prevalence واطي.
