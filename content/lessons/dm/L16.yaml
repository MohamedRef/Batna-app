        quote: "Combining the severity of the mother‘s condition with the non-reassuring fetal well-being & the unfavorable cervical score, a cesarean section was performed."
        text: |
          **ليه cesarean؟** الكتاب بيجمع تلات حاجات:
          - الأم ==حالتها شديدة== (السكر 494–569 رغم الـ IV insulin).
          - الجنين ==مش مطمّن==: null variability، و oedema تحت الجلد، ومفيش حركات تنفس، بس الـ umbilical Doppler لسه طبيعي.
          - الـ cervix ==مش جاهز== للولادة الطبيعي.

          **ليه T1DM؟** serum insulin صفر (البنكرياس مش بيطلّع) + **ICA** و **anti-GAD** و **IA2** موجبة (autoimmune). الـ HbA1c 8% والـ fructosamine 380.

