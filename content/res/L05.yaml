  # --- Retrospective cohort (slides 66-70) ---
  - id: res.L05.057
    kind: card
    topic: retrospective
    front: What is a retrospective cohort study, and its other names?
    back: >-
      One in which all outcomes have occurred before the investigation starts: the investigator selects the
      group from past records and traces them forward to the present. Also called historical or non-concurrent cohort.
    src: { page: 66, quote: "Retrospective Cohort Study:\n  A retrospective cohort study is one in which the outcome have all occurred before the start of investigation.\n  Investigator goes back to the past to select study group from existing records of the past employment, medical and other records and traces them forward through time from the past date fixed on the records usually to the present.\n  Known with the name of Historical Cohort and noncurrent cohort" }
    status: unverified
    tags: [high-yield]
