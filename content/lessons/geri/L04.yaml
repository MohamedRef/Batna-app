        answer: "لأن المريض غالبًا **مش واخد باله** من النسيان (عكس الـ benign forgetfulness)، والكتاب بيطلب درجة التغيير في الـ **ADL** والسلوك، ودي حاجة اللي عايشين معاه هما اللي شايفينها. التفسير المقبول (مش في الكتاب): السؤال المفيد: «إيه اللي كان بيعمله من سنة ومبقاش يعرف يعمله؟»"
      - kind: explain
        page: 63
        quote: "4. Laboratory tests & Biomarkers- Plasma Phosphorylated tau (ptau) is a specific blood biomarker for Alzheimer disease (AD) pathology, with p- tau217 considered to have the most utility."
        title: "الـ blood biomarker"
        text: |
          الـ **plasma phosphorylated tau** (p-tau) هو **specific blood biomarker** للـ AD pathology، وأفيدهم ==p-tau217==.

          ليه الـ p-tau بالذات؟ لأن الـ tau المفسفر هو اللي بيعمل الـ tangles جوه الخلية، فلما يظهر في الدم يبقى بيعكس الـ AD **pathology** نفسها، مش مجرد تلف عام في المخ. التفسير المقبول (مش في الكتاب): وده أسهل من الـ PET أو الـ CSF. ولاحظ الترتيب: الـ biomarker رقم 4، بعد الـ history والـ exam والـ cognitive testing، مش أول خطوة.
