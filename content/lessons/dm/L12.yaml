        title: "الـ statins"
        quote: "Statins Use in diabetic patients\n  1. Statin is mandatory in all diabetic patients ≥40 years, irrespective of their prevailing LDL-C level and the CVD.\n  2. High-intensity statins in pts with ASCVD\n  3. or 10-year ASCV risk > 20%.\n  4. Moderate-intensity statins in pts without ASCVD or 10-year ASCV risk ˂ 20%."
        text: |
          الـ lipid-lowering ==renal-protective==: بيحسّن الـ albuminuria والـ eGFR.

          - Statin ==mandatory== لكل diabetic **≥40** سنة، مهما كان الـ low-density lipoprotein (LDL).
          - **High intensity**: Atherosclerotic cardiovascular disease (ASCVD) أو 10-year risk **>20%**.
          - **Moderate intensity**: من غير ASCVD والـ risk **<20%**.

          ليه الـ statin إجباري حتى لو الـ LDL كويس؟ التفسير المقبول (مش في الكتاب): السكر نفسه بيضاعف خطر الـ atherosclerosis، والـ CKD بيزوّده كمان، فالفايدة جاية من تقليل الخطر الكلي مش من رقم الـ LDL. وكل ما الخطر يعلى (ASCVD أو risk >20%) الشدة بتعلى.
