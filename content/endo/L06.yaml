  - id: endo.L06.040
    kind: card
    topic: levothyroxine
    front: Why can intermittent thyroxine intake give normal or high FT4 with a persistently high TSH?
    back: Because of their different half-lives, a recent dose raises TH, but the TSH, reflecting weeks of poor compliance, stays high.
