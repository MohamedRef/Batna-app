  - id: neph.L07.071
    kind: cloze
    topic: adpkd-tx
    text: "Surgical cyst decompression relieves pain in {{c1::80–90%}} at 1 year and {{c2::62–77%}} beyond 2 years; it neither accelerates nor preserves renal decline."
    src: { page: 157, quote: "If multiple cysts are contributing to pain, laparoscopic or surgical cyst fenestration may be of benefit. Surgical decompression is effective in 80% to 90% of patients at 1 year, and 62% to 77% have sustained pain relief for more than 2 years (Fig. 44.10A). Surgical intervention pain relief for more than 2 years (Fig. 44.10A). Surgical intervention does not accelerate the decline in renal function, as once thought, but does not appear to preserve declining renal function either (see Fig. 44.10B). Laparoscopic fenestration is as effective as open surgical fen-estration in short-term follow-up in patients with limited disease, and ADPKD whose roles have not been fully defined. Laparoscopic renal denervation has been used in combination with cyst fenestration." }
    status: unverified
    tags: [numbers]
  - id: neph.L07.072
    kind: card
    topic: adpkd-tx
    front: How is cyst hemorrhage in ADPKD managed?
    back: "Usually self-limited: bed rest, analgesics and more fluid to prevent obstructing clots. Severe cases may need admission and transfusion; tranexamic acid has been used; persistent bleeding may need segmental arterial embolization, then surgery."
    src: { page: 158, quote: "Episodes of cyst hemorrhage are self-limited, and patients respond well to conservative management with bed rest, analgesics, and increased fluid intake to prevent obstructing clots. Rarely, bleeding is more severe, requires hospitalization and transfusion. The antifibrinolytic agent tranexamic acid has been successfully used in some patients, but no obstruction from clots. In patients with unusually severe or persistent hemorrhage, segmental arterial embolization can be successful. If not, surgery may be required to control bleeding." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.073
    kind: card
    topic: adpkd-tx
    front: Why treat cystitis and asymptomatic bacteriuria promptly in ADPKD?
    back: Most renal cyst infections begin as cystitis; prompt treatment prevents retrograde seeding of the kidney.
    src: { page: 158, quote: "Urinary Tract and Cyst Infection Because most renal cyst infections begin as cystitis, prompt treatment of symptomatic cystitis and asymptomatic bacteriuria is indicated to prevent retrograde seeding of the renal parenchyma. Antibiotics that not effective for upper UTI in severe renal impairment. Cyst infection is often difficult to treat despite prolonged therapy with an antibiotic to which the organism is susceptible. Treatment failure occurs if anticoncentrations within the cysts. Lipophilic agents have been shown to penetrate cysts reliably and have an acid dissociation constant (pK₂) that allows favorable electrochemical gradients into acidic cyst fluid." }
    status: unverified
  - id: neph.L07.074
    kind: card
    topic: adpkd-tx
    front: Which antibiotics are agents of choice for cyst infection in ADPKD, and why?
    back: Trimethoprim-sulfamethoxazole and fluoroquinolones. They are lipophilic and reach good intracystic concentrations in both gradient and non-gradient cysts.
    src: { page: 158, quote: "Therapeutic agents of choice include trimethoprim-sulfamethoxazole and fluoroquinolones, both of which have favorable intra cystic thera-peutic concentration gradients at physiologic pH in gradient and non-gradient cysts. If fever persists after 1 to 2 weeks of appropriate antimicrobial therapy, infected cysts should be drained percutaneously or surgically. In the case of end- stage polycystic kidneys, nephrectomy should be considered. If fever recurs after stopping antibiotics, complicating features such as obstruction, perinephric abscess, and stone should be excluded." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.075
    kind: card
    topic: adpkd-tx
    front: What if fever persists after 1–2 weeks of appropriate antibiotics for an infected cyst?
    back: Drain the infected cyst percutaneously or surgically; with end-stage polycystic kidneys, consider nephrectomy. If fever recurs after stopping, look for obstruction, perinephric abscess or stone.
    src: { page: 158, quote: "Therapeutic agents of choice include trimethoprim-sulfamethoxazole and fluoroquinolones, both of which have favorable intra cystic thera-peutic concentration gradients at physiologic pH in gradient and non-gradient cysts. If fever persists after 1 to 2 weeks of appropriate antimicrobial therapy, infected cysts should be drained percutaneously or surgically. In the case of end- stage polycystic kidneys, nephrectomy should be considered. If fever recurs after stopping antibiotics, complicating features such as obstruction, perinephric abscess, and stone should be excluded." }
    status: unverified
  - id: neph.L07.076
    kind: mcq
    topic: adpkd-tx
    stem: A woman with ADPKD has fever and right flank pain. CT shows a complicated cyst. Which antibiotic best penetrates the cyst?
    options:
      - Ciprofloxacin
      - Gentamicin
      - Ampicillin
      - Cefazolin
      - Nitrofurantoin
    answer: 0
    why:
      - "Correct: fluoroquinolones (and TMP-SMX) are lipophilic and reach therapeutic levels inside cysts (p158)."
      - Aminoglycosides are not lipophilic and penetrate cysts poorly.
      - Ampicillin is not one of the agents of choice.
      - Cefazolin is not one of the agents of choice.
      - Nitrofurantoin acts only in the bladder; it does not treat upper tract or cyst infection.
    src: { page: 158, quote: "Therapeutic agents of choice include trimethoprim-sulfamethoxazole and fluoroquinolones, both of which have favorable intra cystic thera-peutic concentration gradients at physiologic pH in gradient and non-gradient cysts. If fever persists after 1 to 2 weeks of appropriate antimicrobial therapy, infected cysts should be drained percutaneously or surgically. In the case of end- stage polycystic kidneys, nephrectomy should be considered. If fever recurs after stopping antibiotics, complicating features such as obstruction, perinephric abscess, and stone should be excluded." }
    status: unverified
  - id: neph.L07.077
    kind: enumerate
    topic: adpkd-tx
    prompt: Name the three stone-forming conditions in ADPKD treated with potassium citrate.
    points:
      - Uric acid lithiasis
      - Hypocitraturic calcium oxalate nephrolithiasis
      - Distal acidification defects
    pass: 3
    hook: "Potassium citrate بيحل 3: «يوريك، سترات ناقصة، وحموضة ما بتنزلش» = uric acid lithiasis، hypocitraturic calcium oxalate nephrolithiasis، وdistal acidification defects."
    src: { page: 159, quote: "Treatment of nephrolithiasis in patients with ADPKD is the same as that in patients without ADPKD (see Chapter 57). Potassium citrate is the treatment of choice in the three stone-forming conditions associated with ADPKD: uric acid lithiasis, hypocitraturic calcium oxalate nephrolithiasis, and distal acidification defects. Extracorporeal shock wave lithotripsy and percutaneous nephrostolithotomy are reported to be 82% and 80% successful, respectively, without increased complications compared with patients without ADPKD. 1 Flexible ureterorenoscopy with laser fragmentation also has been used safely and effectively and cannot cause traumatic nephron loss.¹" }
    status: unverified
    tags: [high-yield]
