  - id: geri.L03.lesson6
    title: "الكلية والدوا: ثلث الشغل راح"
    hook: "تحاليل الكلى طبيعية؟ ده مش معناه إن الكلية طبيعية. والفرق ده ممكن يبقى جرعة digoxin زيادة."
    minutes: 8
    pages: [42, 46]
    topics: [renal]
    goals:
      - "تعرف ليه الـ renal function بيقل الثلث وليه التحاليل بتكدب"
      - "تحسب الـ creatinine clearance (CrCl) بـ Cockcroft-Gault"
      - "تحفظ الأدوية اللي بتخرج من الكلية وليه هي بالذات خطر"
    status: unverified
    steps:
      - kind: explain
        page: 43
        title: "الكلية: ثلث الشغل راح"
        quote: "Renal function declines by about 1/3 with normal ageing- NB- digoxin, gentamicin. NB normal renal function tests do not mean normal renal function in the elderly."
        text: |
          - الـ renal function بيقل حوالي ==الثلث== مع السن الطبيعي. خلي بالك من **digoxin** و **gentamicin**.
          - السبب: الكلية أصغر، والـ tubular secretion والـ renal blood flow أقل.
          - **normal renal function tests do not mean normal renal function**. الكرياتينين مش مقياس كويس، احسب الـ creatinine clearance (CrCl).

          ليه الكتاب بيذكر الـ **digoxin** والـ **gentamicin** بالذات؟ لأن الاتنين بيخرجوا من الكلية، والمسافة بين الجرعة اللي بتعالج والجرعة اللي بتسمّم **صغيرة** (narrow therapeutic index). فلو الكلية بقت تطلّع تلت أقل، الدوا يتراكم ويوصل للسُمّية بسرعة: الـ digoxin يعمل arrhythmia ولخبطة، والـ gentamicin يأذي الودن والكلية نفسها.
      - kind: explain
        page: 42
        title: "معادلة Cockcroft-Gault"
        quote: "Clearance via Kidney-Reduced\n  Lower GFR (decreased: size, tubular secretion, renal blood flow)\n  Serum creatinine is not a reliable measure and Cockcroft-Gault is an estimate\n  Renal (fx) shows big individual variations in the elderly\nCr cl. = (140-age) x body wt. (kg.) / 72 x Serum Cr. (x 0.85 for Women)"
        text: |
          **CrCl = (140 − age) × weight ÷ (72 × s.Cr)**

          وللستات: ==× 0.85==.

          الكتاب بيقول إنها **estimate**، والـ renal function بيختلف جدًا من حاج للتاني.

          ليه estimate؟ لأنها بتخمّن كتلة العضلات من السن والوزن. الحاج اللي وزنه كبير بسبب **دهون أو edema** هتطلعله CrCl أعلى من الحقيقة، والحاج اللي عضلاته ضامرة جدًا ممكن الكرياتينين عنده يبقى واطي لدرجة إن الرقم يطلع "كويس" وهو مش كويس.
      - kind: check
        page: 42
        quote: "Clearance via Kidney-Reduced\n  Lower GFR (decreased: size, tubular secretion, renal blood flow)\n  Serum creatinine is not a reliable measure and Cockcroft-Gault is an estimate\n  Renal (fx) shows big individual variations in the elderly\nCr cl. = (140-age) x body wt. (kg.) / 72 x Serum Cr. (x 0.85 for Women)"
        question: "85-year-old woman, 50 kg, creatinine 1.0 mg/dl. CrCl by Cockcroft-Gault?"
        options:
          - "About 32 ml/min"
          - "About 38 ml/min"
          - "About 55 ml/min"
          - "About 100 ml/min"
        answer: 0
        why:
          - "صح: 55 × 50 ÷ 72 = 38.2، × 0.85 = 32.5."
          - "نسيت الـ 0.85 بتاع الستات."
          - "55 ده (140 − age) بس."
          - "الكرياتينين 1.0 مش معناه كلية طبيعية."
      - kind: explain
        remind: [geri.L03.022]
        page: 45
        title: "أدوية بتخرج من الكلية"
        quote: "Drugs with predominant renal elimination\n  Aminoglycosides\n  Antimycotics: fluconazole, flucytosine\n  Antivirals: acyclovir, gancyclovir, ribavirin"
        text: |
          الجرعة دي بتتظبط على الـ ==creatinine clearance (CrCl)==:
          - **Aminoglycosides**
          - **Antimycotics**: fluconazole، flucytosine
          - **Antivirals**: acyclovir، ganciclovir، ribavirin
          - **Beta-blockers**: atenolol، sotalol
          - **Beta-lactams**: penicillins، cephalosporins
          - **Digoxin**، **H2-blockers**، **Lithium**

          ليه دول بالذات؟ لأنهم **hydrophilic** وما بيتكسروش في الكبد، فالكلية هي باب الخروج الوحيد. يعني الـ half-life بتاعهم بيتبع الـ CrCl بالظبط: الـ CrCl يقل للنص، الـ half-life يتضاعف تقريبًا. والكبد عمره ما هيعوّض.
      - kind: mnemonic
        page: 46
        quote: "Betablockers: atenolol, sotalol\nBetalactam antibiotics: penicillins, cepha-losporins\nDigoxin\nH2-Blockers\nLithium"
        word: "A-A-A-B-B-D-H-L"
        parts:
          - { key: "A", text: "Aminoglycosides" }
          - { key: "A", text: "Antimycotics: fluconazole, flucytosine" }
          - { key: "A", text: "Antivirals: acyclovir, ganciclovir" }
          - { key: "B", text: "Beta-blockers: atenolol, sotalol" }
          - { key: "B", text: "Beta-lactams" }
          - { key: "D", text: "Digoxin" }
          - { key: "H", text: "H2-blockers" }
          - { key: "L", text: "Lithium" }
        hook: "**تلات A، اتنين B، وبعدين DHL**: زي شركة الشحن، الأدوية دي بتتشحن برّه الجسم عن طريق **الكلية**."
      - kind: reveal
        page: 43
        quote: "Half-life(t1/2) ≈ vol. of distribution(Vd) over clearance(CI)"
        prompt: "الـ digoxin عند الحاج: الـ Vd بتاعه بيقل والـ clearance بيقل. الـ half-life هيعمل إيه؟ والتركيز؟"
        answer: |
          الـ **clearance** هو اللي بيكسب: الكلية بقت تطلّع تلت أقل، فالـ t½ ≈ Vd ÷ clearance **بيطول** رغم إن الـ Vd قل شوية.

          والـ **Vd الأصغر** (عضلات وميه أقل) معناه إن نفس الجرعة بتعمل **تركيز أعلى** من الأول. يعني الاتنين بيروحوا في نفس الاتجاه: مستوى أعلى، ويقعد أطول. علشان كده الكتاب بيقول للـ digoxin جرعة **0.125 mg/day** وما تزيدش.
      - kind: check
        page: 45
        quote: "Drugs with predominant renal elimination"
        question: "An 86-year-old (CrCl 28 ml/min) needs treatment. Which of these drugs most needs its dose cut for the kidney?"
        options:
          - "Gentamicin"
          - "Oxazepam"
          - "Propranolol"
          - "Diazepam"
        answer: 0
        why:
          - "صح: aminoglycosides من الـ drugs with predominant renal elimination."
          - "الـ oxazepam بيتكسر في الكبد phase II."
          - "الـ propranolol high extraction في الكبد."
          - "الـ diazepam بيتكسر في الكبد phase I."
      - kind: try
        items: [geri.L03.016, geri.L03.019, geri.L03.021, geri.L03.022, geri.L03.023]
    recap:
      - "الكلية −⅓ مع السن الطبيعي: أصغر، tubular secretion أقل، renal blood flow أقل."
      - "Normal renal function tests ≠ normal renal function."
      - "CG = (140 − age) × wt ÷ (72 × Cr)، والست × 0.85، وهي estimate."
      - "الكلية: AAA BB DHL، والجرعة على الـ CrCl."
    practice: [geri.L03.016, geri.L03.017, geri.L03.018, geri.L03.019, geri.L03.020, geri.L03.021, geri.L03.022, geri.L03.023]
  # ------------------------------------------------------------------
  - id: geri.L03.lesson2
    title: "الكبد العجوز: Phase I تعبان، Phase II شغال"
    hook: "ليه الدكتور الكبير يكتب oxazepam مش diazepam؟ الإجابة في كلمتين: phase two."
    minutes: 8
    pages: [42, 46]
    topics: [hepatic, pk]
    goals:
      - "تفرّق بين Phase I و Phase II ومين اللي بيتأثر بالسن"
      - "تعرف قاعدة جرعة الـ high و low extraction drugs"
      - "تلخّص الـ pharmacokinetics كلها في جدول واحد"
    status: unverified
    steps:
      - kind: explain
        page: 42
        title: "الكبد بيصغر وبيبطّأ"
        quote: "Drug Metabolism is Very Liver Dependent\n  Reduced liver function due to decreased liver size, blood flow, and disease (e.g. CHF)\n  Phase I - first pass oxidative/reduction activities are reduced (e.g. propranolol)\n  Phase II - drugs are preferred (oxazepam)\n  In general, biotransforming enzymes are reduced in the elderly"
        text: |
          الـ drug metabolism ==very liver dependent==، والكبد عند الكبار:
          - **أصغر**.
          - الـ **blood flow** أقل.
          - وممكن فيه مرض زي **congestive heart failure (CHF)**.

          والـ biotransforming enzymes عمومًا أقل.

          ليه كل ده بيبطّأ تكسير الدوا؟ الكبد بيكسر الدوا بطريقتين، وكل واحدة بيضربها تغيير:
          - الأدوية اللي بيكسرها بسرعة جدًا (**high extraction**) سرعتها مربوطة بكمية **الدم** اللي بتعدي على الكبد. الـ blood flow يقل، يبقى بيكسر أقل.
          - الأدوية اللي بيكسرها ببطء (**low extraction**) سرعتها مربوطة بكمية **الـ enzymes**. الكبد أصغر والـ enzymes أقل، يبقى بيكسر أقل.
          والـ **CHF** بيضرب الاتنين: دم أقل للكبد، وكبد محتقن.
      - kind: table
        page: 44
        quote: "Hepatic metabolism of lipophilic drugs\n| Phase I (introduction of functional groups) | Phase II (conjugation) |\n|---|---|\n| Oxidation; Reduction; Hydrolysis | Glucuronidation; Acetylation; Methylation; Sulfatation |\n| → Most metabolites active and potentially hepatotoxic | → Most metaboliotes inactive and not toxic |"
        title: "Phase I ولا Phase II؟"
        columns: [Phase, Reactions, Products]
        rows:
          - ["I", "Oxidation, reduction, hydrolysis", "Active, maybe hepatotoxic"]
          - ["II", "Conjugation: glucuronidation etc.", "Inactive, not toxic"]
        hide: [[0, 2], [1, 2]]
      - kind: explain
        page: 42
        title: "السن بيضرب Phase I بس"
        quote: "Metabolism- affected by ageing; phase I reactions (oxidative) in the liver impaired even with normal ageing, phase II (conjugation reactions) - relatively spared."
        text: |
          - **Phase I** أي الـ oxidation: بيضعف ==even with normal ageing==. مثال الكتاب للـ first pass: **propranolol**.
          - **Phase II** أي الـ conjugation: ==relatively spared==.

          علشان كده ==Phase II drugs are preferred==، ومثال الكتاب: **oxazepam**.

          ليه الـ phase II أأمن؟ شوف الجدول اللي فات: نواتج الـ phase I **active وممكن hepatotoxic**، يعني الدوا بيتحول لدوا تاني لسه شغال ويتراكم. نواتج الـ phase II **inactive ومش toxic**. فلو الدوا بيعدي على phase II بس، الكبد العجوز بيخلص منه في خطوة واحدة شغالة كويس، ومن غير metabolites تفضل تنيّم الحاج.
      - kind: mnemonic
        page: 45
        quote: "Hepatic extraction of drugs\n| High extraction (>0.5) | Low extraction (<0.5) |\n|---|---|\n| Bromocriptine | Antidepressants (I, II) |\n| Chlorpromazine | Codeine (I,II) |\n| Clomethiazole | Diazepam (I,II) |\n| Dihydroergotamine | Isoniazid (I,II) |\n| Diltiazem | Lorazepam (II) |\n| Metoclopramide | Neuroleptics (I,II) |\n| Metoprolol | Oxazepam (II) |\n| Midazolam | Phenobarbital (I,II) |\n| Morphine | Phenytoin (I,II) |\n| Nifedipine | Procainamide (I,II) |\n| Propranolol | Quinidine (I,II) |\n| Verapamil | Theophylline (I,II) |\n| | Warfarin (I,II) |"
        word: "LOT"
