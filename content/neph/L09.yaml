  - id: neph.L09.005
    kind: card
    topic: intro
    front: At which CKD stage should RRT counselling start, and why then?
    back: Stage 4 CKD, to allow time for hepatitis B vaccination and for creating and maturing an arteriovenous fistula.
    src: { page: 293, quote: "Important renal replacement therapies (RRT) for end-stage renal disease (ESRD) patients are hemodialysis (HD), peritoneal dialysis (PD) and renal transplantation (RT). The outcome comparison suggest that RT is a better overall treatment forESRD patients. On the other hand, the studies that compared patient outcome for HD and PD have yielded conflicting results. Neither treatment modality is best suited for all patients. The choice should be discussed and analyzed for each particular patient considering his demographic, comorbidity, availability of suitable living-related or cadaveric donor, economic factors and social circumstances, morbidity and quality of life on RRT. In practice, most patients in the world are treated with hemodialysis (80%). Councelling for RRT should be in stage 4CKD, to allow time for hepatitis B vaccination, and sufficient time for creation and maturation of arteriovenous fistula in case of hemodialysis." }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.006
    kind: mcq
    topic: intro
    stem: A 55-year-old with CKD stage 4 (eGFR 22) asks when he should start learning about dialysis and transplant. What does the book advise?
    options:
      - Now, at stage 4, to allow hepatitis B vaccination and fistula maturation
      - Later, once eGFR falls below 10 and dialysis start is close
      - Later, once uraemic symptoms appear and dialysis is clearly needed to start
      - At stage 5D, after the first dialysis session has been completed
    answer: 0
    why:
      - "Correct: counselling belongs in stage 4 CKD (p293)."
      - Waiting this long leaves no time for a fistula to mature.
      - Symptoms mean he may start on a catheter, with no vaccination.
      - 5D means he is already on dialysis.
    src: { page: 293, quote: "Important renal replacement therapies (RRT) for end-stage renal disease (ESRD) patients are hemodialysis (HD), peritoneal dialysis (PD) and renal transplantation (RT). The outcome comparison suggest that RT is a better overall treatment forESRD patients. On the other hand, the studies that compared patient outcome for HD and PD have yielded conflicting results. Neither treatment modality is best suited for all patients. The choice should be discussed and analyzed for each particular patient considering his demographic, comorbidity, availability of suitable living-related or cadaveric donor, economic factors and social circumstances, morbidity and quality of life on RRT. In practice, most patients in the world are treated with hemodialysis (80%). Councelling for RRT should be in stage 4CKD, to allow time for hepatitis B vaccination, and sufficient time for creation and maturation of arteriovenous fistula in case of hemodialysis." }
    status: unverified
  # ---------- p293-294: modalities ----------
  - id: neph.L09.007
    kind: card
    topic: modalities
    front: Which dialysis modalities are specific for acute renal failure?
    back: Continuous renal/kidney replacement therapy (CRRT, CKRT) and slow low-efficiency dialysis (SLED) / prolonged intermittent RRT (PIRRT).
    src: { page: 293, quote: "Hemodialysis may be required for either acute or chronic kidney failure Continuous renal/kidney replacement therapy (CRRT, CKRT), slow low efficiency dialysis (SLED) /prolonged intermittent renal replacement therapy (PIRRT) are specific for acute renal failure." }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.008
    kind: table
    topic: modalities
    title: Session time by modality
    columns: [Modality, Session time, Machine]
    rows:
      - ["CRRT (CKRT)", "24 h/day, continuous", "Special dialysis machine"]
      - ["PIRRT or SLED", "6–12 h/session", "Usual dialysis machine"]
      - ["Intermittent conventional HD", "4–5 h/session", "Usual dialysis machine"]
    blanks: [[0, 1], [1, 1], [2, 1], [0, 2], [1, 2]]
    src: { page: 294, quote: "PIRRT or SLED 6-12h /session (can be done with the usual dialysis machine).while intermittent conventional HD 4-5h/session." }
    status: unverified
