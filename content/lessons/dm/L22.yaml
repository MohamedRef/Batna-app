        quote: "| Risk | LDL-C target |\n|---|---|\n| Very high risk | LDL-C <1.4 mmol/L (<55 mg/dL) (Class I) |\n| High risk | LDL-C <1.8 mmol/L (<70 mg/dL) (Class I) |\n| Moderate risk | LDL-C <2.6 mmol/L (<100 mg/dL) (Class I) |"
