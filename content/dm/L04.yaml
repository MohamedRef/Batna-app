  - id: dm.L04.013
    kind: card
    topic: cardiorenal
    front: Type 2 diabetes with CKD, on maximally tolerated ACEi/ARB. What is preferred?
    back: An SGLT2i with primary evidence of reducing CKD progression, if eGFR ≥20; continue it until dialysis or transplantation. A GLP-1 RA with proven CVD benefit if SGLT2i is not tolerated or contraindicated.
    src: { page: 39, quote: "Use SGLT2i in people with an eGFR ≥20 mL/min per 1.73 m2; once initiated should be continued until initiation of dialysis or transplantation" }
    status: unverified
    tags: [high-yield]
