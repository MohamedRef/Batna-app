    status: unverified
    tags: [numbers]
  - id: dm.L11.036
    kind: card
    topic: premix
    front: How often and on what reading is premixed insulin titrated?
    back: Once weekly, based on the lowest self-measured plasma glucose over the previous 3 days.
    src: { page: 138, quote: "Titrate once weekly, based on the lowest SMPG value over the previous 3 days before titration." }
