  - id: neph.L11.135
    kind: table
    topic: dialysis-htn
    title: Timing of delivery in preeclampsia
    columns: [Situation, Delivery]
    rows:
      - [No severe features, At 37 weeks or later]
      - ["Severe features or adverse maternal/fetal conditions", Stabilize and deliver at or after 34 weeks]
      - [Delivery before 34 weeks, Give corticosteroids for fetal lung maturity]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 377, quote: "For patients with preeclampsia, delivery is recommended at 37 weeks or later if no severe features such as hemolysis, thrombocytopenia, or liver dysfunction are observed. Stabilization and delivery at or>34 weeks are recommended in those women with severe features or adverse maternal or fetal conditions, such as fetal growth restriction or fetal distress. If delivery is done before 34 weeks' gestation, corticosteroids should be administered to the mother for fetal lung maturity.(70) Many patients with preeclampsia are treated with magnesium sulfate to minimize the risk of seizures. As magnesium is excreted by kidneys, a lower dose is recommended for women with kidney failure. Careful monitoring for clinical signs of magnesium toxicity and magnesium levels is needed.(72)" }
