      - Polycythemia vera
      - Renal cell carcinoma
    answer: 0
    why:
      - "Correct: autosomal dominant, isolated erythrocytosis, low or normal EPO, normal curve = EPOR mutation (p170)."
      - High-affinity Hb lowers the P50 and raises EPO.
      - Chuvash raises EPO.
      - JAK2 testing is negative and other lines are normal.
      - A tumour raises EPO.
    src: { page: 170, quote: "Mutation or truncation of Epo receptor protein with increased sensitivity to Epo." }
    status: unverified
