  - id: hb.L13.lesson9
    title: "الـ AIH: prednisone لوحده ولا مع azathioprine؟"
    hook: "الجرعات بتنزل كل أسبوع لحد جرعة الصيانة. والسؤال الحقيقي: إزاي نعالج الكبد من غير ما نبوّظ باقي الجسم؟"
