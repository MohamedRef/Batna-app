      - kind: table
        page: 38
        quote: "2) Cold antibody type (antibody maximally active at 0 to 4°C)\n  Cold-reactive antibody is IgM.\n  1) Primary\n  2) Secondary (Infections like Mycoplasma pneumonia. EBV, CMV, malaria, Lymphoproliferative disorders)."
