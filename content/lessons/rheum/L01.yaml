        text: "Th1 = عسكري الشارع: بينشّط الـ macrophage والـ Tc ويعمل delayed-type hypersensitivity (DTH) ضد اللي جوه الخلايا. Th2 = موظف المصنع: بيكبّر الـ B cells ويطلّع antibodies و Immunoglobulin E (IgE) ويجيب الـ eosinophils والـ mast cells."
