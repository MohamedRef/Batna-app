  # ---------------------------------------------------------------- central-pain
  - id: git.L03.223
    kind: enumerate
    topic: central-pain
    prompt: "State the Rome IV criteria for centrally mediated abdominal pain syndrome (CAPS)."
    points:
      - Continuous or nearly continuous abdominal pain
      - No or only occasional relation to physiological events (eating, defecation, menses)
      - Pain limits some aspect of daily functioning
      - The pain is not feigned
      - Not explained by another structural or functional GI disorder or medical condition
    pass: 4
    hook: "الـ CAPS في 5: «وجع دايم، ملوش دعوة بالأكل والحمّام والدورة، معطّل حياته، حقيقي، ومحدش مفسّره»: continuous أو nearly continuous pain، no أو occasional relation لـ eating/defecation/menses، بيحدّ من daily functioning، not feigned، ومش متفسّر بـ structural أو functional GI disorder أو حالة تانية."
    src: { page: 129, quote: "D1. Centrally mediated abdominal pain syndrome (CAPS)*\nDiagnostic criteria* - Must include all of the following:\n  1. Continuous or nearly continuous abdominal pain\n  2. No or only occasional relationship of pain with physiological events (e.g., eating, defecation or menses)†\n  3. Pain limits some aspect of daily functioning††\n  4. The pain is not feigned\n  5. Pain is not explained by another structural or functional gastrointestinal disorder or other medical condition\n*CAPS is typically associated with psychosocial comorbidity, but there is no specific profile that can be used for diagnosis\n**Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis\n†Some degree of gastrointestinal dysfunction may be present\n††Daily function could include impairments in work, intimacy, social/leisure, family life, and caregiving for self or others" }
    status: unverified
