        title: "الـ typical HUS: supportive، بس كل حاجة بسبب"
        quote: "Patients are often volume depleted, and less volume resuscitation has been linked to an increased need for renal replacement therapy, which half of all patients require."
        text: |
          علاج الـ STEC-HUS ==generally supportive==، بس كل خطوة فيها قرار:

          - **السوايل:** المرضى غالبًا ==volume depleted==، و ==less volume resuscitation== مرتبط بـ RRT أكتر. ونص المرضى بيحتاجوا RRT أصلًا.
          - **Blood transfusion** على قد الحاجة.
          - **Platelets** **sparingly to avoid thrombotic complications**: لأنك بتدّي وقود لنفس الجلطات.
          - **Antimotility و antibiotics: لأ**. الكتاب بيقول **poorer outcomes, likely due to heightened Shiga toxin exposure**. التفسير المقبول (مش في الكتاب): الـ antibiotic بيموّت البكتيريا فتفضّي التوكسين اللي جواها مرة واحدة، والـ antimotility بيخلّي التوكسين يقعد في الأمعاء أطول.
          - بس لو **S. dysenteriae** أو **S. pneumoniae**: **early antibiotics** بتحسّن النتيجة.
