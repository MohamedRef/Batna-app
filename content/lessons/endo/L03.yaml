  - id: endo.L03.lesson4
    title: "SIADH، سكر واطي، hCG وعضم طري"
    hook: "صوديوم واطي من غير وذمة، سكر واطي مع insulin واطي، راجل عنده ثدي، وعضم بيتكسر من ورم صغير في الأنف."
    minutes: 9
    pages: [38, 41]
    topics: [siadh, igf2, hcg, osteomalacia, gh]
    goals:
      - "تشخّص وتعالج الـ SIADH حسب الشدة"
      - "تفهم ميكانيزم الـ IGF-II hypoglycemia"
      - "تعرف صورة الـ ectopic hCG والـ oncogenic osteomalacia"
    status: unverified
    steps:
      - kind: explain
        page: 39
        quote: "The net result is\n  Inappropriate retention of water.\n  Inappropriate urine concentration."
        title: "SIADH"
        text: |
          **الأسباب:** small cell lung Ca، carcinoid، central nervous system (CNS) lesions، gastrointestinal tract (GIT)، genitourinary، ovarian tumors.

          **الميكانيزم:** antidiuretic hormone (ADH) ↑ و atrial natriuretic peptide (ANP) ↑، والنتيجة ==inappropriate water retention== و **inappropriate urine concentration**.

          **الصورة:** غالبًا hyponatremia بالصدفة؛ أو lethargy، weakness، nausea، confusion، seizure؛ ووزن بيزيد ==من غير oedema==.
      - kind: reveal
        page: 39
        quote: "Clinical picture\n  Asymptomatic: accidentally discovered hyponatremia.\n  Lethargy, weakness, nausea, confusion and seizure.\n  Increased body weight due to retention of water without oedema."
        prompt: "ليه المية محبوسة بس مفيش oedema؟"
        answer: "المية الحرة بتتوزع على كل الـ compartments، وتلتينها جوه الخلايا. والـ ANP العالي بيطلّع صوديوم، فالـ extracellular volume مش بيزيد بالقدر اللي يعمل oedema. (ده تفسير فسيولوجي؛ الكتاب ذكر الـ ANP والنتيجة.)"
      - kind: explain
        page: 39
        quote: "Diagnosis\n  Hyponatremia and decreased plasma osmolality in the setting of inappropriate normal or increased urine osmolality.\n  Low blood urea nitrogen and uric acid.\n  Exclude hypothyroidism and hypocortisolism."
        title: "التشخيص"
        text: |
          - Hyponatremia و plasma osmolality واطية، مع urine osmolality ==normal أو عالية== (inappropriate).
          - **blood urea nitrogen (BUN) و uric acid واطيين**.
          - ==استبعد hypothyroidism و hypocortisolism==.
      - kind: table
        page: 39
        quote: "Treatment\n  Mild cases Fluid restriction to less than urine output.\n  Moderate cases Demeclocycline 150-300 mg three times daily. Slow action up to weeks. It antagonizes AVP action on renal tubules.\n  Severe cases (Na less than 110mEq/L) Hypertonic Saline with furesemide.\n  4) Ectopic IGFII secretion hypoglycemia Etiology\n  Mesenchymal tumor.\n  Hepatic tumor."
        title: "العلاج"
        columns: ["Severity", "Treatment"]
        rows:
          - ["Mild", "Fluid restriction < urine output"]
          - ["Moderate", "Demeclocycline 150-300 mg tds (weeks)"]
          - ["Severe (Na <110)", "Hypertonic saline + furosemide"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: update
        page: 39
        quote: "Treatment\n  Mild cases Fluid restriction to less than urine output.\n  Moderate cases Demeclocycline 150-300 mg three times daily. Slow action up to weeks. It antagonizes AVP action on renal tubules.\n  Severe cases (Na less than 110mEq/L) Hypertonic Saline with furesemide.\n  4) Ectopic IGFII secretion hypoglycemia Etiology\n  Mesenchymal tumor.\n  Hepatic tumor."
        text: "الكتاب: severe cases (Na أقل من 110) تاخد hypertonic saline مع furosemide. الإرشادات الأوروبية (2014) بتبدأ بالـ fluid restriction، وبعدها urea أو loop diuretic جرعة صغيرة مع oral sodium chloride (NaCl)، وبتنصح ضد الـ vaptans والـ demeclocycline. توصيات الـ American expert panel (Verbalis et al., 2013) بتحط الـ tolvaptan كاختيار. وعلشان الـ osmotic demyelination: الأوروبية بتحدد تصحيح الـ chronic hyponatremia بـ 10 mmol/L في أول 24 ساعة و 8 في كل يوم بعدها، والـ American panel بـ 10–12 في الـ 24 ساعة (و 8 لو العيان high risk). في الامتحان اكتب إجابة الكتاب."
        ref: "European clinical practice guideline on hyponatraemia 2014; Hyponatremia treatment guidelines: expert panel recommendations (Verbalis et al.) 2013"
      - kind: explain
        page: 39
        quote: "Pathogenesis\n  Increased consumption of glucose by tumor cells.\n  Decreased gluoneogensis by studded liver by metastasis.\n  Decreased counter regulatory hormones like GH.\n  Increased ectopic IGFII (Big IGFII) that can react with insulin receptors."
        title: "IGF-II hypoglycemia"
        text: |
          **الأسباب:** ==mesenchymal== و **hepatic** tumors.

          **الميكانيزم:**
          - الورم بياكل glucose.
          - الكبد المليان metastases مش بيعمل gluconeogenesis.
          - Counter-regulatory hormones (زي growth hormone (GH)) قليلة.
          - ==Big IGF-II== بيشتغل على الـ insulin receptors.
          - الـ insulin-like growth factor (IGF) binding protein 3 مبيتكونش، فالـ IGF-II يفضل active.

          **الصورة:** fasting hypoglycemia متكررة. **العلاج:** small frequent meals، IV glucose بالليل، glucagon، GH، corticosteroids.
      - kind: check
        page: 39
        quote: "Treatment\n  Mild cases Fluid restriction to less than urine output.\n  Moderate cases Demeclocycline 150-300 mg three times daily. Slow action up to weeks. It antagonizes AVP action on renal tubules.\n  Severe cases (Na less than 110mEq/L) Hypertonic Saline with furesemide.\n  4) Ectopic IGFII secretion hypoglycemia Etiology\n  Mesenchymal tumor.\n  Hepatic tumor."
        question: "Fasting hypoglycaemia with LOW insulin in a patient with a big retroperitoneal tumour suggests:"
        options: ["IGF-II-secreting mesenchymal tumour", "Insulinoma", "Ectopic ACTH", "Ectopic PTHrP"]
        answer: 0
        why:
          - "صح: الـ insulin واطي لأن الـ big IGF-II هو اللي شغال على الـ receptors."
          - "الـ insulinoma الـ insulin عالي."
          - "بيعمل hyperglycemia."
          - "بيعمل hypercalcemia."
      - kind: explain
        page: 40
        quote: "5) Ectopic Human Chorionic Gonadotropin secretion\nHCG is composed of two subunits with CHOes molecule.\nAlpha subunit is similar to that of LH, FSH, and TSH.\nNormally produced by trophoblastic cell during pregnancy, gestational trophoblastic neoplastic cells and teratoma.\nB-subunit is different in the four glycprotein hormones."
        title: "Ectopic hCG"
        text: |
          - الـ hCG من subunitين. ==Alpha== زي luteinising hormone (LH) و follicle-stimulating hormone (FSH) و thyroid-stimulating hormone (TSH)، والـ **beta** مختلف (بيه بنفرّق ونتابع).
          - **الأسباب:** hydatidiform mole، teratoma، seminoma، و non-gonadal (choriocarcinoma، lung، hepatoma، breast، colon).
          - **الميكانيزم:** steroidogenesis و ==aromatase== ↑ ← E2 عالي.
      - kind: table
        page: 41
        quote: "Young patient precocious puberty.\nAdult female uterine bleeding.\nAdult male gynecomastia."
        title: "الصورة حسب السن والجنس"
        columns: ["Patient", "Picture"]
        rows:
          - ["Young", "Precocious puberty"]
          - ["Adult female", "Uterine bleeding"]
          - ["Adult male", "Gynecomastia"]
          - ["Any", "Hyperthyroid features possible"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 41
        quote: "There may be manifestations of hyperthyroidism."
        prompt: "ليه الـ hCG ممكن يعمل hyperthyroidism؟"
        answer: "الـ alpha subunit بتاع الـ hCG زي بتاع الـ TSH، والجزيء كله شبهه، فلو الكمية كبيرة جدًا بينبّه الـ TSH receptor. (زي ما شفنا في الحمل في المحاضرة 2: direct effect of hCG on the thyroid.)"
      - kind: explain
        page: 41
        quote: "Increased fibroblast growth factor 23 secreted by tumor cells leads to decreased phosphate reabsorption by the kidney with decreased 1,25 Vit.D synthesis by the kidney. Also, known as \" Phosphatonin \"."
        title: "Oncogenic osteomalacia"
        text: |
          - أورام ==mesenchymal غريبة، غالبًا benign==: "strange tumor in strange place"، زي hemangiopericytoma و angiosarcoma و chondrosarcoma في الجلد أو العضلات أو الـ paranasal sinuses.
          - الورم بيفرز ==FGF-23== (phosphatonin): phosphate reabsorption ↓، و 1,25-vit D ↓.
          - **Labs:** phosphate ↓، alkaline phosphatase (ALP) ↑، **calcium normal**، vit D ↓.
          - **الصورة:** bone pain، muscle weakness، fractures، waddling gait.

          وآخر حاجة: **GH و growth hormone-releasing hormone (GHRH)** ectopic نادر جدًا (lung، stomach، breast، ovary)، وعلاجه **octreotide**.
      - kind: aside
        tone: joke
