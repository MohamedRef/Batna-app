      - BMI 24 is not obese, and hypocaloric diets are for BMI >30.
      - Dry weight can be estimated; assessment should not wait.
    src: { page: 404, quote: "Two criteria stratify patients at high risk of malnutrition: Being underweight (BMI <18.5 kg/m2) Advanced decompensated cirrhosis (Child–Pugh C)" }
