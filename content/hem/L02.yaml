    kind: table
    topic: symptoms
    title: Symptoms that point to the associated disease
    columns: [Symptom, Points to]
    rows:
      - [Jaundice, Haemolysis]
      - [Weight loss, Malignancy]
      - ["Fevers, night sweats", Malignancy; chronic infection]
      - [Abdominal fullness (splenomegaly), "Lymphoma, chronic liver disease, myeloproliferative disorders"]
