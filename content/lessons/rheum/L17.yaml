            <text x="190" y="226" class="t-sm">(osteophyte)</text>
          </svg>
      - kind: explain
        page: 286
        title: "الـ spine والـ US والـ MRI"
        quote: "May reveal evidence of early sacroiliitis (bone marrow edema), or chronic changes including bone erosions, sclerosis, periarticular fatty tissue accumulation."
        text: |
          **Spine**: squaring (periostitis)، ==bamboo spine== (syndesmophytes)، و **railway appearance** في الـ lateral (تكلّس الـ anterior و lateral ligaments).

          **Ultrasound (US)**: يثبت الـ active enthesitis.

          **MRI**: الـ early = ==bone marrow oedema==؛ الـ chronic = erosions، sclerosis، periarticular fat.

          يعني كل علامة في الـ spine هي عضم جديد عند enthesis: الـ squaring من الـ periostitis على حواف الفقرة، والـ syndesmophytes من الـ annulus، والـ railway من الأربطة.
      - kind: reveal
        page: 286
        quote: "May reveal evidence of early sacroiliitis (bone marrow edema), or chronic changes including bone erosions, sclerosis, periarticular fatty tissue accumulation."
        prompt: "ليه الـ X-ray متأخر والـ MRI بيلحق الـ AS بدري؟"
        answer: |
          الكتاب: الـ X-ray ==not very sensitive==، والـ MRI بيبيّن الـ **early sacroiliitis** كـ **bone marrow oedema**.

          التفسير المقبول (مش في الكتاب): الـ X-ray بيشوف **كالسيوم** بس: erosion أو sclerosis أو عضم جديد، ودول بياخدوا شهور لسنين. الـ MRI بيشوف **المية**، والالتهاب أول ما يبدأ بيعمل oedema في النخاع اللي جنب المفصل، قبل ما العضم يتغيّر.

          ولما الالتهاب يهدى يسيب **fat** مكانه، علشان كده الـ periarticular fat تغيير **chronic** مش early.
      - kind: check
        page: 286
        quote: "May reveal evidence of early sacroiliitis (bone marrow edema), or chronic changes including bone erosions, sclerosis, periarticular fatty tissue accumulation."
        question: "Which MRI finding best indicates early AS?"
        options: ["Bone marrow oedema of the SI joints", "Periarticular fat accumulation", "Vertebral erosions", "Spinal ankylosis"]
        answer: 0
        why:
          - "صح: ده سؤال الكتاب نفسه (ص 300). الـ bone marrow oedema = early sacroiliitis."
          - "الـ fat accumulation تغيير chronic."
          - "الـ erosions تغيير chronic."
          - "الـ ankylosis آخر مرحلة."
      - kind: try
        items: [rheum.L17.041, rheum.L17.044, rheum.L17.046, rheum.L17.048, rheum.L17.052]
