  - id: git.L07.lesson4
    title: "الأسباب، والألم، ولون البراز"
    hook: "سبع عائلات أسباب، وسؤال واحد عن الألم، ولون البراز: تلات أدوات تقرّبك من المصدر قبل المنظار."
    minutes: 9
    pages: [226, 227]
    topics: [causes, clinical]
    goals:
      - "تعدّ أسباب الـ LGIB بالـ etiology (سؤال كتاب) وتعرف ليه الـ diverticulosis أشهرهم"
      - "تقسّم الأسباب بالألم وشكل الدم (سؤال كتاب) وتعرف ليه"
      - "تقرا لون البراز والأعراض وتحدد المكان"
    status: unverified
    steps:
      - kind: explain
        page: 226
        title: "تلات طرق تقسّم بيها"
        quote: "Types: we can classifiy the lower GI bleeding according to:\n• Etiology.\n• Site of bleeding\n• Relation to the pain."
        text: |
          الكتاب بيقسّم الـ lower GI bleeding بتلات طرق:
          - **Etiology**: السبب نفسه.
          - **Site of bleeding**: المكان.
          - **Relation to the pain**: فيه ألم ولا لأ.

          ليه تلاتة؟ التفسير المقبول (مش في الكتاب): كل واحدة بتجاوب سؤال مختلف. الـ etiology للامتحان وللعلاج، والمكان علشان تختار أنهي scope أو أشعة، والألم علشان تعرف من أول جملة في الـ history إذا كنت حوالين الشرج ولا جوه القولون.
      - kind: explain
        remind: [git.L07.017]
        page: 226
        title: "الأسباب بالـ etiology"
        quote: "Diverticulosis is the most common cause of lower GI bleeding."
        text: |
          - **Congenital:** polyps، **Meckel's diverticulum**، hereditary hemorrhagic telangiectasia
          - **Inflammatory:** Ulcerative colitis (UC)، infective، amoebic، Crohn
          - **Neoplastic:** adenomas، carcinomas، polyps
          - ==Diverticulosis==: **the most common cause**
          - **Vascular:** angiodysplasia، ischemic colitis، vasculitis، hemangioma
          - **Clotting disorders:** hemophilia، leukemia، warfarin، disseminated intravascular coagulation (DIC)
          - **Miscellaneous:** piles، anal fissure، rectal injury

          ليه الـ **diverticulosis** الأشهر؟ التفسير المقبول (مش في الكتاب): الـ diverticulum بيطلع من نقطة ضعيفة في الجدار مكان ما الـ **vasa recta** بتخش، فالشريان بيتمط على قبة الكيس ويرقّ لحد ما يتقطع. النزيف شرياني من غير التهاب، فبيبقى **كتير ومن غير ألم**، والمرض نفسه شايع جدًا في الكبار.
      - kind: mnemonic
        page: 226
        quote: "Congenital - Polyp‘s / Meckel‘s diverticulum /hereditary hemorrhagic telangiectasia."
        word: "CIND VCM"
        parts:
          - { key: "C", text: "Congenital: polyps, Meckel diverticulum, hereditary hemorrhagic telangiectasia (HHT)" }
          - { key: "I", text: "Inflammatory: UC, infective, amoebic, Crohn" }
          - { key: "N", text: "Neoplastic: adenomas, carcinomas, polyps" }
          - { key: "D", text: "Diverticulosis: the most common cause" }
          - { key: "V", text: "Vascular: angiodysplasia, ischemic colitis, vasculitis, hemangioma" }
          - { key: "C", text: "Clotting: hemophilia, leukemia, warfarin, DIC" }
          - { key: "M", text: "Miscellaneous: piles, fissure, rectal injury" }
        hook: "**CIND** و **VCM**: اتنين كلمات زي رقم عربية. سؤال «causes of lower GIB» بيتجاوب بالسبعة دول بالترتيب."
      - kind: reveal
        page: 226
        quote: "Clotting disorders - Haemophilia / Leukaemia / Warfarin therapy / DIC."
        prompt: "ليه الـ clotting disorders (haemophilia، leukaemia، warfarin، DIC) في قايمة أسباب نزيف القولون، مع إنها مش مرض في القولون؟"
        answer: |
          الكتاب بيحطها عيلة لوحدها في الـ etiology.

          التفسير المقبول (مش في الكتاب): هي مش بتعمل جرح، هي بتخلّي **أي جرح صغير** (hemorrhoid، polyp، diverticulum) ينزف أكتر ومايقفش. عشان كده اسأل دايمًا عن الـ **warfarin**، ولو العيان عليه وبينزف، لسه لازم تدوّر على الـ lesion اللي تحت.
      - kind: sort
        page: 226
        quote: "With pain Fissure in Anus, Fistula in Anus. Ca. Anal Canal. Rup. perianal haematoma. Rup. AnoRectal abscess. Endometriosis. Injury."
        prompt: "الكتاب قسّمها كمان بالألم. صنّف:"
        bins: ["With pain", "Without pain"]
        cards:
          - { text: "Anal fissure", bin: 0 }
          - { text: "Ruptured anorectal abscess", bin: 0 }
          - { text: "Endometriosis", bin: 0 }
          - { text: "Carcinoma of the anal canal", bin: 0 }
          - { text: "Hemorrhoids", bin: 1 }
          - { text: "Villous adenoma", bin: 1 }
          - { text: "Diverticular disease", bin: 1 }
          - { text: "Carcinoma of the rectum", bin: 1 }
        why: "الأسباب المؤلمة كلها حوالين الـ anal canal والـ perianal (فيها نهايات أعصاب حسية) أو endometriosis أو injury. الـ rectum والقولون ما بيحسوش بالقطع، فالـ hemorrhoids الداخلية والـ adenoma والـ diverticula والـ Ca rectum مش بيوجعوا."
      - kind: table
        page: 226
        quote: "Without pain Blood Alone: Polyp, Villous Adenoma, Diverticular diseases Blood After Defecation Hemorrhoids Blood with mucus"
        title: "الـ painless LGIB: شكل الدم بيقول السبب"
        columns: [Pattern, Causes]
        rows:
          - [Blood alone, "Polyp, villous adenoma, diverticular disease"]
          - [Blood after defecation, Hemorrhoids]
          - [Blood with mucus, "UC, intussusception, ischemic colitis"]
          - [Blood streaked on stool, Carcinoma of the rectum]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 226
        title: "ليه شكل الدم بيفرّق؟"
        quote: "Without pain\n• Blood Alone: Polyp, Villous Adenoma, Diverticular diseases\n• Blood After Defecation Hemorrhoids\n• Blood with mucus\n• Ulcerative colitis."
        text: |
          الكتاب بيقسّم الـ painless حسب شكل الدم. التفسير المقبول (مش في الكتاب) لكل شكل:
          - **Blood alone**: وعاء واحد بينزف من سطح polyp أو adenoma أو diverticulum، والغشا حواليه سليم فمفيش mucus ولا إسهال.
          - **Blood after defecation** (==hemorrhoids==): البراز بيحك في الـ cushion المنفوخ وهو خارج، فالدم بينقّط **بعد** التبرز.
          - **Blood with mucus** (UC، intussusception، ischemic colitis): الغشا **ملتهب أو ميت**، والغدد بتطلّع mucus مع الدم.
          - **Blood streaked on stool** (Ca rectum): الورم على الجدار، والبراز بيمسح عليه وهو معدّي، فالدم **على** البراز مش جواه.
      - kind: figure
        page: 227
        quote: "Maroon stools imply a lesion in the right colon or small intestine. Black stools (melena) predict a source proximal to the ligament of Treitz."
        title: "لون البراز = خريطة"
        alt: "A vertical gut map from stomach to anus with four coloured stool chips. Black stool points above the ligament of Treitz; maroon to the small intestine and right colon; large bright red to the colon; brown stool streaked with blood to the rectosigmoid and anus."
        caption: "كل ما الدم يبقى أغمق، المصدر أعلى والدم قعد في الأمعاء وقت أطول. ==Melena== = فوق الـ Treitz، و **maroon** = right colon أو small intestine."
        svg: |
