    quote: |-
      Clinical interpretation is important because it includes patient safety and efficacy.
      Statistically significant differences between data sets may not always result in an appropriate change in clinical practice.
      Clinical research is only of value if it is properly interpreted.
    title: ليه التفسير الإكلينيكي مهم؟
    text: |-
      الـ clinical interpretation فيها **patient safety and efficacy**.

      والفرق الـ ==statistically significant== مش دايمًا معناه إنك تغيّر الـ practice. والبحث **only of value if it is properly interpreted**.
  - kind: aside
    tone: exam
    text: 'السلايد بيدي Cohen''s ES كده: **<0.2 trivial، 0.2–0.5 small، 0.5–0.8 large**. اكتبها زي السلايد في الامتحان.'
    page: 32
    quote: 'Cohen quantified ES that have been operationally described in ranges: <0.2 = trivial effect ; 0.2-0.5= small effect ; 0.5-0.8= large effect'
  - kind: update
    text: 'في مرجع Cohen الأصلي: 0.2 = small، 0.5 = medium، 0.8 = large (ورسمة السلايد 40 نفسها فيها خطوط عند 0.2 و0.5 و0.8). الامتحان على السلايد.'
    ref: Cohen J. Statistical Power Analysis for the Behavioral Sciences, 2nd ed, 1988
  - kind: check
