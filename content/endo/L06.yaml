items:
  # ---------- p99: intro ----------
  - id: endo.L06.001
    kind: card
    topic: intro
    front: In which two ways can TFT results seem confusing?
    back: They can be discordant with the clinical picture, or appear incongruent with each other.
    src: { page: 99, quote: "Being discordant with the clinical picture." }
    status: unverified
  - id: endo.L06.002
    kind: enumerate
    topic: intro
    prompt: Which confounding factors should be considered when TFTs seem confusing?
    points: [Pregnancy, Non-thyroidal illness, Medication usage, Laboratory artifact, "Rare genetic disorder, e.g. resistance to thyroid hormone"]
    pass: 5
    src: { page: 99, quote: "Rare genetic disorder e.g: resistance to thyroid hormone." }
    status: unverified
    tags: [high-yield]
  # ---------- p100-101: physiology ----------
  - id: endo.L06.003
    kind: card
    topic: physiology
    front: What do an individual's T4 and T3 levels reflect over a lifetime?
    back: They stay relatively constant and reflect that person's own set-point of the HPT axis (tightly regulated by TRH and TSH).
    src: { page: 100, quote: "In any given individual T4 and T3 concentrations remain relatively constant throughout life" }
    status: unverified
  - id: endo.L06.004
    kind: cloze
    topic: physiology
    text: "The euthyroid gland secretes {{c1::85-90%}} T4 and {{c2::10-15%}} T3, both more than {{c3::99.5%}} protein bound."
    src: { page: 100, quote: "85–90% T4 and 10–15% T3." }
    status: unverified
    tags: [numbers, high-yield]
  - id: endo.L06.005
    kind: enumerate
    topic: physiology
    prompt: Which proteins bind thyroid hormones in serum?
    points: [TBG, Albumin, "Transthyretin (prealbumin)"]
    pass: 3
    src: { page: 100, quote: "Transthyretin (prealbumin)." }
    status: unverified
  - id: endo.L06.006
    kind: card
    topic: physiology
    front: Which transporter carries thyroid hormone into cells such as the brain?
    back: Monocarboxylate transporter 8 (MCT8); it also governs TH efflux from the thyroid gland.
    src: { page: 100, quote: "specific membrane proteins monocarboxylate transporter 8 (MCT8)" }
    status: unverified
  - id: endo.L06.007
    kind: table
    topic: physiology
    title: The deiodinases (pre-receptor regulation)
    columns: [Enzyme, Action]
    rows:
      - [Hepatic type 1 DIO, Peripheral T4 to T3 conversion]
      - [DIO2, T4 to T3 in the hypothalamus and pituitary]
      - [DIO3, "T4 to reverse T3 and T3 to T2 (limits TH action)"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 100, quote: "family of intracellular deiodinases (DIOs)" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.008
    kind: card
    topic: physiology
    front: Which is the principal bioactive thyroid hormone, and how does it act?
    back: T3; it binds a nuclear thyroid hormone receptor (TR) in target cells.
    src: { page: 101, quote: "T3 is the principal bioactive hormone and its major actions are mediated by binding to a receptor (TR) in the nucleus of target cells." }
    status: unverified
  - id: endo.L06.009
    kind: cloze
    topic: physiology
    text: "The thyroid hormone receptor genes are {{c1::THRA}} on chromosome {{c2::17}} and {{c3::THRB}} on chromosome 3; splicing gives TRα1, TRα2, TRβ1 and TRβ2."
    src: { page: 101, quote: "2 thyroid hormone receptor genes (THRA, THRB) exist on chromosomes 17 and 3 respectively." }
    status: unverified
  # ---------- p102: screening ----------
  - id: endo.L06.010
    kind: card
    topic: screening
    front: Why was TSH recommended as the frontline thyroid screening test?
    back: Modest changes in thyroid hormone concentrations produce marked excursions in TSH.
    src: { page: 102, quote: "as a modest changes in TH concentrations are associated with marked excursions in TSH." }
    status: unverified
  - id: endo.L06.011
    kind: card
    topic: screening
    front: What does the lecture now advise for routine thyroid screening, and why?
    back: Both FT4 and TSH, because screening with TSH alone misdiagnoses some cases.
    src: { page: 102, quote: "Accordingly, it is now routinely thyroid screening should be done with both FT4 and TSH." }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.012
    kind: enumerate
    topic: screening
    prompt: Conditions in which measuring TSH alone may be misleading.
    points: ["Recent treatment for thyrotoxicosis (TSH stays suppressed)", Non-thyroidal illness, TSH assay interference, Central hypothyroidism, TSH-secreting pituitary adenoma, Resistance to thyroid hormone, Disorders of TH transport or metabolism]
    pass: 5
    src: { page: 102, quote: "Conditions in which measurement of TSH alone may be misleading" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.013
    kind: card
    topic: screening
    front: Why may TSH mislead after recent treatment of thyrotoxicosis?
    back: TSH may remain suppressed even when thyroid hormone concentrations have normalised.
    src: { page: 102, quote: "TSH may remain suppressed even when TH concentrations have normalised" }
    status: unverified
  - id: endo.L06.014
    kind: card
    topic: screening
    front: A patient on levothyroxine has optimal TFTs but ongoing symptoms. What does the lecture say?
    back: Restoring euthyroidism in the HPT axis does not equal resolution of hypothyroidism in other tissues; tissue markers of TH action are needed.
    src: { page: 102, quote: "for these patients tissue markers of TH action are required." }
    status: unverified
  # ---------- p103: patterns ----------
  - id: endo.L06.015
    kind: table
    topic: patterns
    title: The seven TFT patterns (book figure, p103)
    columns: [Pattern, Main causes]
    rows:
      - ["FT4/FT3 ↑, TSH ↓", "Graves', toxic MNG, toxic adenoma, thyroiditis, amiodarone/iodine, excess thyroxine, hyperemesis/mole, congenital"]
      - ["FT4/FT3 normal, TSH ↓", "Subclinical hyperthyroidism, recent treatment, steroids/dopamine, assay interference, NTI"]
      - ["FT4/FT3 ↓, TSH normal or ↓", "NTI, central hypothyroidism, isolated TSH deficiency, assay interference"]
      - ["FT4/FT3 normal, TSH ↑", "Subclinical hypothyroidism, poor compliance, malabsorption, amiodarone, assay interference, NTI recovery, TSH resistance"]
      - ["FT4/FT3 ↓, TSH ↑", "Hashimoto's/atrophic, post-RAI or surgery, hypothyroid phase of thyroiditis, drugs, iodine, neck irradiation, Riedel's, infiltration, congenital"]
      - ["FT4/FT3 ↑, TSH normal or ↑", "Assay interference/FDH, thyroxine therapy, amiodarone/heparin, NTI, neonatal, TSHoma, RTH, transport disorders"]
    blanks: [[2, 1], [3, 1], [5, 1]]
    src: { page: 103, quote: "When interpreting TFTs seven major patterns should be considered:" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.016
    kind: card
    topic: patterns
    front: "Raised FT4/FT3 with a normal or raised TSH: which causes does the lecture list?"
    back: "Assay interference or FDH, thyroxine replacement (including poor compliance), drugs (amiodarone, heparin), NTI including acute psychiatric disorders, the neonatal period, TSH-secreting pituitary adenoma, resistance to thyroid hormone, and TH transport or metabolism disorders."
    src: { page: 103, quote: "TSH-secreting pituitary adenoma Resistance to thyroid hormone" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.017
    kind: card
    topic: patterns
    front: "Low FT4/FT3 with a normal or low TSH: causes?"
    back: NTI, central hypothyroidism, isolated TSH deficiency and assay interference.
    src: { page: 103, quote: "central hypothyroidism isolated TSH deficiency" }
    status: unverified
  - id: endo.L06.018
    kind: card
    topic: patterns
    front: When should thyroid function tests be requested?
    back: Only when there are clinical features of a thyroid problem.
    src: { page: 103, quote: "Thyroid function tests should only be requested when there are clinical features of thyroid problem." }
    status: unverified
  # ---------- p103-105: NTI ----------
  - id: endo.L06.019
    kind: card
    topic: nti
    front: Define non-thyroidal illness (sick euthyroid syndrome).
    back: A common finding after any acute or chronic illness, defined by the absence of an intrinsic abnormality of HPT function; a secondary, beneficial adaptive change that reduces metabolic rate.
    src: { page: 103, quote: "NTI is a common finding following any acute or chronic illness defined by the absence of an intrinsic abnormality of HPT function." }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.020
    kind: card
    topic: nti
    front: How soon can thyroid hormone changes appear in NTI?
    back: Within 24 hours of the onset of the illness.
    src: { page: 104, quote: "Changes in TH may occur 24 h after the onset of nonthyroidal illness" }
    status: unverified
  - id: endo.L06.021
    kind: enumerate
    topic: nti
    prompt: In which conditions does NTI occur?
    points: [Poor nutrition, Starvation, Sepsis, Burns, Malignancy, Myocardial infarction, Post-surgery, Chronic liver and renal disease]
    pass: 6
    src: { page: 104, quote: "Myocardial infarction." }
    status: unverified
  - id: endo.L06.022
    kind: table
    topic: nti
    title: TFT pattern in non-thyroidal illness
    columns: [Test, Change]
    rows:
      - [Total T4, "↓"]
      - [Total T3, "↓"]
      - [Reverse T3, "↑"]
      - [TSH, "↓ or normal"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 104, quote: "↓TT4 ↓TT3 ↑ reverse T3 ↓ or N TSH" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.023
    kind: card
    topic: nti
    front: Why do total hormones fall in NTI?
    back: Reduced TH binding capacity, secondary to a fall in TH binding-protein concentrations.
    src: { page: 104, quote: "The reduction in total hormone is due to reduced TH binding capacity secondary to a fall in TH binding protein concentrations." }
    status: unverified
  - id: endo.L06.024
    kind: enumerate
    topic: nti
    prompt: Enumerate the proposed mechanisms of NTI.
    points: [Reduced hypothalamic TRH from the paraventricular nuclei, Impaired pituitary TSH secretion, Decreased serum TH binding capacity, Reduced cellular uptake of T4 and T3, Altered deiodinase activity, Low leptin in malnutrition, "Pro-inflammatory cytokines (IL-1, IL-6, TNF-α)", Excess endogenous glucocorticoids]
    pass: 6
    src: { page: 104, quote: "Pro-inflammatory cytokines (IL-1, IL-6, TNF-a) in infectious, inflammatory and neoplastic states." }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.025
    kind: card
    topic: nti
    front: What can happen to TSH during recovery from an intercurrent illness, and why does it matter?
    back: TSH may become overtly elevated for a short time; knowing this transient phenomenon avoids a wrong diagnosis of hypothyroidism and needless treatment.
    src: { page: 105, quote: "in some patients TSH may become overtly elevated for a short period of time" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.026
    kind: mcq
    topic: nti
    stem: A 64-year-old man in ICU with septic shock has low total T4, low total T3, high reverse T3 and a low-normal TSH. He had no thyroid history. What is the best interpretation?
    options: [Non-thyroidal illness, Central hypothyroidism needing levothyroxine, Primary hypothyroidism, Subclinical hyperthyroidism]
    answer: 0
    why:
      - "Correct: ↓TT4, ↓TT3, ↑rT3 and normal or low TSH is the NTI pattern, an adaptive change."
      - "Central hypothyroidism needs pituitary disease; here the illness explains it, and rT3 is high."
      - "Primary hypothyroidism has a high TSH."
      - "Subclinical hyperthyroidism has normal hormones with low TSH."
    src: { page: 104, quote: "↓TT4 ↓TT3 ↑ reverse T3 ↓ or N TSH" }
    status: unverified
  - id: endo.L06.027
    kind: mcq
    topic: nti
    stem: Two weeks after recovering from pneumonia, a woman's TSH is 9 mU/L with a normal FT4. She feels well. What is the best next step per the lecture?
    options: [Repeat TFTs later; TSH can rise transiently in NTI recovery, Start levothyroxine now, Request a pituitary MRI, Diagnose Hashimoto's thyroiditis]
    answer: 0
    why:
      - "Correct: a short TSH rise during recovery is a known transient phenomenon."
      - "Treating now risks inappropriate treatment."
      - "A high TSH with normal FT4 does not suggest a pituitary tumour here."
      - "Hashimoto's needs more than one transient TSH value."
    src: { page: 105, quote: "it is important to be aware of this transient phenomenon in order to avoid inappropriate diagnosis and treatment." }
    status: unverified
  # ---------- p105: pregnancy ----------
  - id: endo.L06.028
    kind: card
    topic: pregnancy
    front: Why does TBG rise in pregnancy?
    back: Oestrogen increases its hepatic synthesis, and its degradation is reduced.
    src: { page: 105, quote: "Tbg ↑as a consequence of oestrogen-induced increased hepatic synthesis, together with reduced degradation." }
    status: unverified
  - id: endo.L06.029
    kind: cloze
    topic: pregnancy
    text: "In pregnancy total T4 and T3 rise to {{c1::150%}} of non-pregnant values during the {{c2::first half}} of pregnancy and stay there until parturition."
    src: { page: 105, quote: "Total t4 and t3 ↑ to 150% of non-pregnant values during the first half of pregnancy and maintained until parturition." }
    status: unverified
    tags: [numbers, high-yield]
  - id: endo.L06.030
    kind: card
    topic: pregnancy
    front: Why does FT4 rise transiently in the first trimester?
    back: High hCG stimulates the TSH receptor.
    src: { page: 105, quote: "Transient ↑ in ft4 in first trimester is due to the stimulatory effects of ↑ hcg acting on the tsh receptor." }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.031
    kind: card
    topic: pregnancy
    front: A woman with hyperemesis gravidarum is overtly thyrotoxic with a suppressed TSH. Which test helps separate gestational hyperthyroidism from Graves' disease?
    back: TSH receptor antibodies (TRAb).
    src: { page: 105, quote: "it is important to distinguish gestational hyperthyroidism from other causes of thyrotoxicosis (e.g. Graves‘ disease) & (trab) measurement is helpful." }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.032
    kind: enumerate
    topic: pregnancy
    prompt: Other mechanisms that change thyroid status in pregnancy.
    points: [Increased plasma volume, "Enhanced placental DIO3 activity (more T4 and T3 degradation)", "Increased urinary iodine clearance (goitre in iodine-deficient regions)"]
    pass: 3
    src: { page: 105, quote: "Enhanced DIO3 activity (placental origin: increased T4 & T3 degradation)." }
    status: unverified
  - id: endo.L06.033
    kind: mcq
    topic: pregnancy
    stem: At 10 weeks a woman has a TSH of 0.08 mU/L, a mildly raised FT4, no goitre and no eye signs. TRAb is negative. What is the most likely explanation?
    options: [hCG stimulating the TSH receptor (gestational), Graves' disease, Toxic adenoma, Assay interference from TBG]
    answer: 0
    why:
      - "Correct: a transient first-trimester FT4 rise from hCG acting on the TSH receptor."
      - "Negative TRAb and no eye signs argue against Graves'."
      - "Nothing suggests a nodule."
      - "TBG rises total, not free, hormones."
    src: { page: 105, quote: "Transient ↑ in ft4 in first trimester is due to the stimulatory effects of ↑ hcg acting on the tsh receptor." }
    status: unverified
  # ---------- p106: levothyroxine ----------
  - id: endo.L06.034
    kind: table
    topic: levothyroxine
    title: Anomalous TFTs on levothyroxine (book table, p106)
    columns: [Pattern, Cause]
    rows:
      - ["A. Normal TSH, mildly ↑FT4", Normal physiological variant]
      - ["B. ↑TSH, low-normal or ↓FT4 (needs high L-T4)", "Maladministration, malabsorption, ↑TH metabolism or excretion, ↑TH binding capacity"]
      - ["C. Unexpected change in dose needs", Change in L-T4 preparation]
      - ["D. ↑TSH, normal FT4", TSH assay interference]
      - ["E. Persistent ↑TSH with ↓, ↑ or normal FT4 on high doses", Poor compliance]
      - ["F. Supraphysiologic L-T4 needed; ↑FT4 and ↑FT3", Resistance to thyroid hormone]
    blanks: [[0, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 106, quote: "Causes of anomalous TFTs in patients receiving levothyroxine therapy" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.035
    kind: card
    topic: levothyroxine
    front: Why do some well-replaced patients on L-T4 have a normal TSH but mildly high FT4?
    back: A normal physiological variant, possibly less efficient deiodination of T4 to T3; FT3 is typically normal.
    src: { page: 106, quote: "possibly reflecting less efficient deiodination of T4 to T3); FT3 is typically normal" }
    status: unverified
  - id: endo.L06.036
    kind: card
    topic: levothyroxine
    front: How should L-T4 be taken, and which foods and drugs impair its absorption?
    back: "On an empty stomach. Fibre and espresso coffee; iron, calcium, PPIs, sucralfate, aluminium hydroxide, cholestyramine, colestipol."
    src: { page: 106, quote: "Patients should be advised to take L-T4 on an empty stomach; certain foodstuffs (e.g. fibre, espresso coffee)" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.037
    kind: enumerate
    topic: levothyroxine
    prompt: Malabsorption syndromes that impair L-T4 absorption.
    points: [Coeliac disease, Achlorhydria, Lactose intolerance (lactose is in some L-T4 tablets)]
    pass: 3
    src: { page: 106, quote: "L-T4 malabsorption occurs with coeliac disease, achlorhydria, lactose intolerance" }
    status: unverified
  - id: endo.L06.038
    kind: card
    topic: levothyroxine
    front: Which drugs raise L-T4 needs by increasing thyroid hormone metabolism, and which renal condition raises losses?
    back: Phenytoin, carbamazepine, phenobarbitone, rifampicin and some TKIs (e.g. imatinib) enhance hepatic TH metabolism; nephrotic syndrome can increase urinary TH loss.
    src: { page: 106, quote: "Phenytoin, carbamazepine, phenobarbitone, rifampicin and some tyrosine kinase inhibitors (e.g. Imatinib) increase L-T4 requirements" }
    status: unverified
  - id: endo.L06.039
    kind: card
    topic: levothyroxine
    front: Why does oral oestrogen or IVF treatment raise L-T4 requirements?
    back: The oestrogen rise markedly increases TBG and hence TH binding capacity; SERMs and mitotane do the same.
    src: { page: 106, quote: "results in a marked increase in TBG and hence TH binding capacity, necessitating an increase in L-T4 therapy" }
    status: unverified
  - id: endo.L06.040
    kind: card
    topic: levothyroxine
    front: Why can intermittent thyroxine intake give normal or high FT4 with a persistently high TSH?
    back: Because of their different half-lives, a recent dose raises TH, but the TSH, reflecting weeks of poor compliance, stays high.
    src: { page: 106, quote: "Owing to their differing half-lives, intermittent thyroxine ingestion may result in normal or even elevated TH concentrations, but fails to normalize TSH" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.041
    kind: card
    topic: levothyroxine
    front: "On L-T4: raised TSH with normal FT4 and normal FT3. Which cause does the table give?"
    back: Heterophilic antibody interference in the TSH assay, giving a falsely high TSH.
    src: { page: 106, quote: "Heterophilic antibody interference in the TSH assay may yield falsely elevated results; FT3 is normal" }
    status: unverified
  - id: endo.L06.042
    kind: card
    topic: levothyroxine
    front: When is resistance to thyroid hormone typically unmasked on L-T4?
    back: After inappropriate thyroid ablation, or with concomitant primary hypothyroidism, in a patient with a THRB mutation; supraphysiologic L-T4 is needed to normalise TSH, with raised FT4 and FT3.
    src: { page: 106, quote: "Typically seen following inappropriate thyroid ablation or concomitant primary hypothyroidism" }
    status: unverified
  - id: endo.L06.043
    kind: cloze
    topic: levothyroxine
    text: "In athyreotic people, full daily levothyroxine is about {{c1::1.6-2.0 mcg/kg}}; the elderly need {{c2::lower}} doses."
    src: { page: 106, quote: "usually fall in the range 1.6–2.0 mcg/kg" }
    status: unverified
    tags: [numbers]
  - id: endo.L06.044
    kind: card
    topic: levothyroxine
    front: What should follow a change of L-T4 preparation?
    back: Preparations differ in potency and bioavailability; changes are best avoided, and if needed, TFTs should be monitored more often.
    src: { page: 106, quote: "Not all L-T4 preparations are of comparable potency/ bioavailability" }
    status: unverified
  - id: endo.L06.045
    kind: mcq
    topic: levothyroxine
    stem: A woman on levothyroxine 150 µg daily has a TSH of 18 mU/L. She takes the tablet with breakfast, coffee and her calcium and iron tablets. What is the most likely cause?
    options: [Maladministration impairing absorption, Resistance to thyroid hormone, TSH assay interference, Change in L-T4 preparation]
    answer: 0
    why:
      - "Correct: L-T4 must be taken on an empty stomach; coffee, calcium and iron all impair absorption."
      - "RTH gives high FT4 and FT3 with a normal TSH on large doses."
      - "Interference gives a high TSH with normal FT4 and FT3, but here there is an obvious cause."
      - "Nothing in the story suggests a new brand."
    src: { page: 106, quote: "Patients should be advised to take L-T4 on an empty stomach" }
    status: unverified
  - id: endo.L06.046
    kind: mcq
    topic: levothyroxine
    stem: A man on levothyroxine 200 µg has a TSH of 25 mU/L and a high-normal FT4. He admits he takes the tablets "most days" and took several this morning before clinic. Most likely cause?
    options: [Poor compliance, Resistance to thyroid hormone, Malabsorption from coeliac disease, Physiological variant]
    answer: 0
    why:
      - "Correct: intermittent intake raises FT4 on the day but fails to normalise TSH."
      - "RTH gives high FT4 and FT3 with a normal TSH."
      - "Malabsorption gives a low or low-normal FT4."
      - "The variant has a normal TSH."
    src: { page: 106, quote: "intermittent thyroxine ingestion may result in normal or even elevated TH concentrations, but fails to normalize TSH" }
    status: unverified
  - id: endo.L06.047
    kind: mcq
    topic: levothyroxine
    stem: A hypothyroid woman stable on levothyroxine starts IVF. Six weeks later her TSH has risen. Why?
    options: [Oestrogen rise increases TBG and binding capacity, hCG blocks the TSH receptor, IVF drugs block L-T4 absorption, Ovarian hyperstimulation causes NTI]
    answer: 0
    why:
      - "Correct: gonadotrophin-induced oestrogen raises TBG, so she needs more L-T4."
      - "hCG stimulates, not blocks, the TSH receptor."
      - "The table explains it by binding capacity, not absorption."
      - "The table links IVF to TBG."
    src: { page: 106, quote: "gonadotrophin-induced rise in oestrogen concentrations (e.g. IVF treatment) results in a marked increase in TBG" }
    status: unverified
  # ---------- p107-108: drugs ----------
  - id: endo.L06.048
    kind: card
    topic: drugs
    front: In which two ways do drugs alter thyroid function?
    back: By modulating the HPT axis itself, or through downstream effects on thyroid hormone transport or metabolism.
    src: { page: 107, quote: "either by – modulating the HPT axis itself, – or through downstream effects on thyroid hormone transport or metabolism." }
    status: unverified
  - id: endo.L06.049
    kind: table
    topic: drugs
    title: Iodide and the thyroid
    columns: [Pattern, Mechanism]
    rows:
      - ["↑TSH, ↓FT4", "Transient disturbance; persistent hypothyroidism if thyroid reserve is low (e.g. chronic autoimmune thyroiditis)"]
      - ["↓TSH, ↑FT4", "Jod-Basedow: overt hyperthyroidism in latent autonomy (e.g. MNG), may last months"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 107, quote: "may develop overt hyperthyroidism following exposure to iodine-containing compounds (Jod- Basedow effect), which may persist for months" }
    status: unverified
  - id: endo.L06.050
    kind: table
    topic: drugs
    title: Amiodarone and TFTs
    columns: [Pattern, Explanation]
    rows:
      - ["Transient ↑TSH; ↑FT4, normal FT3", "Early months; type 1 DIO inhibition keeps FT4 high, FT3 normal"]
      - ["↓TSH, ↑FT4", "Thyrotoxicosis: type 1 (iodine load on latent autonomy), type 2 (destructive thyroiditis); T4 rises more than T3"]
      - ["↑TSH, ↓FT4", "Hypothyroidism in up to 15% (women, antibody positive); failure to escape Wolff-Chaikoff"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 107, quote: "Two main types of thyrotoxicosis are recognised: type 1 (large iodine load precipitating latent thyroid autonomy); type 2 (destructive thyroiditis)" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.051
    kind: card
    topic: drugs
