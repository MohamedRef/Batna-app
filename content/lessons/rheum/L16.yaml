  - id: rheum.L16.lesson9
    title: "القلب والرئة والأعصاب والرقبة"
    hook: "Pericarditis صامت، effusion سكره واطي، وصباع بيتنمّل بالليل. وأخطر محطة: الرقبة."
    minutes: 9
    pages: [253, 256]
    topics: [heart-lung, neuro]
    goals:
      - "تعرف الـ RA effusion و Caplan و الـ interstitial fibrosis وليه"
      - "تفرّق الـ entrapment من الـ mononeuritis multiplex"
      - "تعرف الـ atlantoaxial subluxation وتشخيصه"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L16.070]
        page: 253
        title: "القلب والرئة"
        quote: "Respiratory\n  Cricoarytenoid joint inflammation - laryngeal pain – dysphonia - pain on swallowing.\n  Pleurisy\n  Pleural effusion with low glucose level - Elevated LDH.\n    Males - seropositive - small and unilateral resolve spontaneously or require steroids.\n  Interstitial fibrosis: Most common pulmonary manifestation, asymptomatic- lower lobes.\n  Nodules : solitary or multiple - can cavitate\n    Rheumatoid nodule + pneumoconiosis → Caplan's syndrome.\n  Bronchiolitis obliterans: dyspnea - hyperinflation may be fatal."
        text: |
          **القلب**: **pericarditis** في **30%** بس صامت (echo بيكشفه)، myocarditis، heart block، endocarditis، AR و MR، coronary vasculitis.

          **الرئة**:
          - cricoarytenoid: ألم في الحنجرة، dysphonia، ألم في البلع
          - pleurisy و **effusion**: ==low glucose== و lactate dehydrogenase (LDH) عالي؛ رجالة seropositive، صغير وفي ناحية واحدة
          - ==Interstitial fibrosis==: **الأشهر**، صامت، في الـ lower lobes
          - Nodules (ممكن تعمل cavity) + pneumoconiosis = **Caplan**
          - Bronchiolitis obliterans: ضيق نفس و hyperinflation، ممكن يموّت.

          والـ cricoarytenoid في القايمة لأنه (مش في الكتاب) synovial joint صغير في الحنجرة، فبيلتهب زي أي مفصل تاني.
      - kind: figure
        page: 254
        title: "الرئة في الـ RA"
        image: { file: rheum/L16-cxr.webp, book: true }
        alt: "Frontal chest X-ray: a fine net of lines and small shadows across both lungs, heaviest in the lower zones."
        caption: |
          أشعة صدر: **شبكة** خطوط ونقط في الرئتين الاتنين، أكتر في **تحت**.

          ده شكل الـ ==interstitial fibrosis== اللي الكتاب بيقول إنها أشهر إصابة في الرئة وبتحب الـ **lower lobes**.
      - kind: explain
        page: 253
        title: "الـ RA effusion: ليه السكر واطي؟"
        quote: "Pleural effusion with low glucose level - Elevated LDH."
        text: |
          الكتاب بيوصف الـ rheumatoid pleural effusion: ==low glucose== و **LDH عالي**، في **الرجالة seropositive**، صغير و **unilateral**، يخف لوحده أو يحتاج steroids.

          التفسير المقبول (مش في الكتاب):
          - **السكر واطي** لأن الـ pleura الملتهبة التخينة بتعطّل دخول الـ glucose، والخلايا الملتهبة جوّه بتاكله.
          - **الـ LDH عالي** لأن الخلايا بتموت وتتجدّد بسرعة، والـ LDH بيخرج منها.

          ونفس الفكرة في الـ **pericarditis**: موجود في **30%** بس **asymptomatic**، فمش هتعرفه غير بالـ echo. ده سبب إن الـ RA بيزوّد الـ cardiovascular risk من غير ما العيان يحس.
      - kind: check
        page: 253
        quote: "Males - seropositive - small and unilateral resolve spontaneously or require steroids."
        question: "A 58-year-old seropositive man with RA has a small right pleural effusion. Which fluid fits the book's description?"
        options: ["Low glucose, high LDH", "High glucose, low LDH", "Chylous, high triglyceride", "Transudate, normal LDH"]
        answer: 0
        why:
          - "صح: الكتاب: low glucose و elevated LDH."
          - "العكس تمامًا."
          - "الـ chylous effusion مالوش علاقة بالـ RA في الكتاب."
          - "الـ RA effusion التهابي، مش transudate."
      - kind: match
        page: 253
        quote: "Nodules : solitary or multiple - can cavitate\n  Rheumatoid nodule + pneumoconiosis → Caplan's syndrome."
        prompt: "وصّل الوصف بالتشخيص:"
        pairs:
          - ["RA nodules + coal dust", "Caplan syndrome"]
          - ["Most common RA lung lesion", "Interstitial fibrosis"]
          - ["Dyspnoea + hyperinflation, may kill", "Bronchiolitis obliterans"]
          - ["RA + splenomegaly", "Felty syndrome"]
        why: "Caplan = nodules + pneumoconiosis. الـ fibrosis أشهر حاجة. الـ bronchiolitis obliterans هو اللي فيه hyperinflation. والـ Felty من الـ lymphatic features."
      - kind: explain
        remind: [rheum.L16.078]
        page: 254
        title: "الأعصاب"
        quote: "Entrapment neuropathy:\n  Median nerve: carpal tunnel syndrome (C.T.S).\n  Posterior tibial: tarsal tunnel syndrome (T.T.S).\n  Ulnar at elbow.\n  Peroneal at head of fibula."
        text: |
          **Entrapment**: الـ synovium المنفوخ بيخنق العصب في نفق ضيق:
          - Median: ==carpal tunnel==
          - Posterior tibial: tarsal tunnel
          - Ulnar عند الكوع
          - Peroneal عند رأس الـ fibula

          وكمان peripheral neuropathy و mononeuritis multiplex.

          يعني نفس الصباع ممكن يتنمّل في عيان RA لسببين مختلفين: ضغط من برّه (entrapment) أو وعاء مقفول (mononeuritis)، والخطوة الجاية بتفرّقهم.
      - kind: figure
        page: 255
        title: "الـ carpal tunnel"
        image: { file: rheum/L16-cts.webp, book: true }
        alt: "Drawing of a palm titled Carpal Tunnel Syndrome. The thumb, index, middle and half of the ring finger and the matching palm are shaded red; the little finger side is white. A red circle at the wrist marks the median nerve in the carpal tunnel, with the note: tapping produces paresthesias (Tinel's sign)."
        caption: |
          - **الأحمر**: الصباع الكبير، السبابة، الوسطى ونص البنصر: ده إحساس الـ ==median nerve==.
          - **الأبيض**: الخنصر ونص البنصر (الـ ulnar) سليم.
          - **الدايرة عند الرسغ**: العصب جوه الـ carpal tunnel. لو خبطت عليه ← تنميل في المنطقة الحمرا: ==Tinel's sign==.

          ليه في الـ RA؟ التفسير المقبول (مش في الكتاب): الـ synovium الملتهب حوالين الأوتار بياخد مكان في النفق الضيق فيضغط العصب.
      - kind: reveal
        page: 254
        quote: "1- Entrapment neuropathy:\n - Median nerve: carpal tunnel syndrome (C.T.S).\n - Posterior tibial: tarsal tunnel syndrome (T.T.S).\n - Ulnar at elbow.\n - Peroneal at head of fibula.\n 2- Peripheral neuropathy.\n 3- Mononeuritis multiplex."
        prompt: "الكتاب بيدّيك 3 أنواع أعصاب. إيه الفرق في السبب بين الـ entrapment والـ mononeuritis multiplex؟"
        answer: |
          - **Entrapment**: العصب سليم بس **مخنوق** من برّه. التفسير المقبول (مش في الكتاب): الـ synovium والـ tenosynovitis المنفوخين جوّه نفق ضيق مش بيتمد (carpal tunnel، tarsal tunnel، الكوع، رأس الـ fibula) بيدوسوا على العصب. يتحسن لما الالتهاب يهدى أو بالتسليك.
          - **Mononeuritis multiplex**: العصب **بيموت** من جوّه، لأن الأوعية اللي بتغذّيه اتقفلت بالـ **vasculitis** (هو كمان في قايمة الـ vasculitis ص 252). أعصاب متفرقة واحد ورا التاني، وده معناه مرض نشيط ومحتاج علاج أقوى.
      - kind: check
        page: 254
        quote: "Median nerve: carpal tunnel syndrome (C.T.S)."
        question: "RA patient: night tingling in the thumb, index and middle fingers. Which nerve and where?"
        options: ["Median nerve at the carpal tunnel", "Ulnar nerve at the elbow", "Posterior tibial at the tarsal tunnel", "Peroneal at the head of the fibula"]
        answer: 0
        why:
          - "صح: الـ median في الـ carpal tunnel، والـ wrist synovitis بيضيّق النفق."
          - "الـ ulnar بيدّي الصباع الصغير والبنصر."
          - "الـ posterior tibial في القدم (tarsal tunnel)."
          - "الـ peroneal عند الركبة: foot drop."
      - kind: explain
        page: 255
        title: "أخطر محطة: الرقبة"
        quote: "Cervical cord compression due to atlantoaxial subluxation due to erosion of transverse ligament around the posterior aspect of the odontoid peg. On neck flexion, peg moves posteriorly indenting the cord. Symptoms occipital headache, parathesia, electric shock in the arm, motor weakness (Quadreparesis).\n  Lateral x ray in flexion and in extention if in flexion distance between odontoid peg and atlas > 3mm → subluxation."
        text: |
          الـ ==transverse ligament== هو الحزام اللي ماسك الـ **odontoid peg** في مكانه. الـ rheumatoid arthritis (RA) بياكله.

          لما العيان يحني رقبته لقدّام، الـ peg يرجع لورا **ويدوس على الـ cord**:
          - occipital headache
          - paraesthesia و "كهربا" في الدراع
          - ضعف لحد **quadriparesis**.

          التشخيص: lateral X-ray في flexion و extension. المسافة بين الـ peg والـ atlas **أكتر من 3 mm** في الـ flexion = ==subluxation==.

          ليه flexion و extension الاتنين؟ لأن الـ peg بيرجع لورا **في الـ flexion**، فالصورة وهو مفرود ممكن تبان سليمة.
      - kind: reveal
        page: 255
        quote: "Symptoms occipital headache, parathesia, electric shock in the arm, motor weakness (Quadreparesis)."
        prompt: "ليه الضعف هنا quadriparesis (الأربع أطراف) مش paraplegia؟ وليه الـ occipital headache؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الضغط عند **C1-C2**، يعني فوق كل الأعصاب اللي رايحة للدراعين والرجلين، فالأربعة يضعفوا. لو الضغط كان في الـ thoracic كانت الرجلين بس (paraplegia).

          والـ **occipital headache** لأن الجذور العصبية العليا (C2) هي اللي بتغذّي جلد ورا الراس، فلما تتشد أو تتضغط الوجع يطلع هناك.
      - kind: figure
        page: 256
        title: "Atlantoaxial subluxation في الكتاب"
        image: { file: rheum/L16-atlantoaxial-xray.webp, book: true }
        alt: "Book lateral cervical spine X-ray in flexion with a double-headed arrow marking a widened gap between the anterior arch of the atlas and the odontoid peg."
        caption: "السهم بيقيس المسافة بين الـ atlas والـ odontoid peg. لو **أكتر من 3 mm** في الـ flexion يبقى subluxation."
      - kind: case
        page: 255
        quote: "Lateral x ray in flexion and in extention if in flexion distance between odontoid peg and atlas > 3mm subluxation."
        stem: "A 60-year-old woman with 18 years of erosive RA is going for hip surgery. She mentions electric shocks in both arms when she looks down."
        steps:
          - question: "What do you fear?"
            options: ["Atlantoaxial subluxation", "Carpal tunnel syndrome", "Scleritis", "Caplan syndrome"]
            answer: 0
            why: "Neck flexion pushes the peg back on the cord when the transverse ligament is eroded (p255)."
          - question: "Which test?"
            options: ["Lateral cervical X-ray in flexion and extension", "Nerve conduction", "Echocardiography", "Hand X-ray"]
            answer: 0
            why: "Lateral views in flexion and extension; over 3 mm gap in flexion = subluxation."
      - kind: aside
        tone: exam
        page: 255
        quote: "Cervical cord compression due to atlantoaxial subluxation due to erosion of transverse ligament around the posterior aspect of the odontoid peg. On neck flexion, peg moves posteriorly indenting the cord. Symptoms occipital headache, parathesia, electric shock in the arm, motor weakness (Quadreparesis).\n  Lateral x ray in flexion and in extention if in flexion distance between odontoid peg and atlas > 3mm → subluxation."
        text: "عيان RA قديم داخل عملية؟ اسأل عن الرقبة: **occipital headache**، paraesthesia، كهربا في الدراع. الـ **intubation** فيها neck flexion، وده بالظبط اللي بيخلي الـ peg يدوس على الـ cord."
      - kind: try
        items: [rheum.L16.070, rheum.L16.072, rheum.L16.074, rheum.L16.077, rheum.L16.080]
    recap:
      - "Pericarditis 30% صامت (echo). Myocarditis، heart block، AR و MR، coronary vasculitis."
      - "Effusion: low glucose، LDH عالي، رجالة seropositive، صغير و unilateral."
      - "Fibrosis الأشهر (lower lobes). Caplan = nodules + pneumoconiosis. Bronchiolitis obliterans ممكن يموّت."
      - "Entrapment = نفق ضيق (CTS، TTS، ulnar، peroneal). MNM = vasculitis للعصب."
      - "Atlantoaxial: transverse ligament اتاكل؛ أكتر من 3 mm في الـ flexion؛ quadriparesis."
    practice: [rheum.L16.068, rheum.L16.069, rheum.L16.070, rheum.L16.071, rheum.L16.072, rheum.L16.073, rheum.L16.074, rheum.L16.075, rheum.L16.076, rheum.L16.077, rheum.L16.078, rheum.L16.079, rheum.L16.080, rheum.L16.081, rheum.L16.082, rheum.L16.203, rheum.L16.205]
