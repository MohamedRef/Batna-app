            <text x="30" y="144" class="t-sm">Hard to keep WBC below 20,000</text>
            <text x="30" y="162" class="t-sm">Spleen, liver grow; infiltration</text>
            <text x="30" y="180" class="t-sm">Blasts 15–19%, basophils ≥20%</text>
            <text x="30" y="200" class="t-sm t-b">Median survival 12 months</text>
            <path d="M120 210 L120 238" class="fg-arrow-bad" marker-end="url(#L08b)"/>
            <path d="M300 70 L300 238" class="fg-arrow-bad" marker-end="url(#L08b)"/>
            <text x="292" y="150" text-anchor="end" class="t-sm t-bad">1/3 abrupt</text>
            <rect x="15" y="240" width="300" height="80" rx="12" class="fg-bad"/>
            <text x="30" y="264" class="t-sm t-b">Blast crisis (like acute leukemia)</text>
            <text x="30" y="284" class="t-sm">Myeloid 70% · lymphoid 20% · undiff 10%</text>
            <text x="30" y="304" class="t-sm t-b">Median survival 3 months</text>
          </svg>
      - kind: check
        page: 120
        quote: "the appearance of blast cells (15 to 19%) in blood or BM, basophilia 20% or more. This last group of features, termed the accelerated phase of CML."
        question: "Which finding fits the accelerated phase of CML in the book?"
        options:
          - "Basophils 20% or more in the blood"
          - "Blasts above 30% with a clinical picture of acute leukemia"
          - "WBC easily kept below 20,000"
          - "A shrinking spleen"
        answer: 0
        why:
