  - id: res.L10.lesson5
    title: "الصياغة، الشكل، الـ pretest والـ coding"
    hook: "سؤال واحد مكتوب وحش ممكن يبوّظ بحث سنة. 5 قواعد للصياغة وتجربة على 15–30 واحد بيحموك."
    minutes: 10
    pages: [53, 63]
    topics: [wording]
    goals:
      - "تفرّق بين الـ response error والـ non-response error"
      - "تحفظ الـ 5 guidelines للصياغة"
      - "تعرف الـ skip logic والـ pretesting وأنواع الـ coding"
    status: unverified
    steps:
      - kind: explain
        page: 53
        quote: "How Should the Question Be Worded?\n  Translating the information needed into clearly worded questions that are easily understood is the most difficult aspect of questionnaire development."
        title: "أصعب حاجة: الصياغة"
        text: |
          إنك تحوّل المعلومة اللي محتاجها لـ **clearly worded questions** سهلة الفهم = ==the most difficult aspect== في عمل الـ questionnaire.
      - kind: figure
        page: 54
        quote: "Poorly worded questions can also frustrate the respondents to the point that they refuse to answer those questions or items.\n  This is referred to as item non-response and leads to non-response error.\n  If respondents interpret questions differently than intended by the researcher, serious bias can occur, leading to response error."
        title: "سؤال مكتوب وحش ← غلطتين"
        alt: "A poorly worded question leads two ways. If the respondent is frustrated and refuses, that is item non-response, giving non-response error. If he answers but understands it differently from the researcher, that is response error."
        caption: "**رفض يجاوب** ← item non-response ← **non-response error**. **جاوب بس فهم غلط** ← **response error**."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L10w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="85" y="10" width="160" height="36" rx="6" class="fg-ink"/>
            <text x="165" y="33" text-anchor="middle" class="t-sm t-b">Poorly worded question</text>
            <path d="M130 46L80 82" class="fg-arrow-bad" marker-end="url(#L10w)"/>
            <path d="M200 46L250 82" class="fg-arrow-bad" marker-end="url(#L10w)"/>
            <rect x="10" y="86" width="145" height="44" rx="6" class="fg-box"/>
            <text x="82" y="105" text-anchor="middle" class="t-sm">Frustrated, refuses</text>
            <text x="82" y="121" text-anchor="middle" class="t-sm t-mut">item non-response</text>
            <rect x="175" y="86" width="145" height="44" rx="6" class="fg-box"/>
            <text x="247" y="105" text-anchor="middle" class="t-sm">Answers, but reads</text>
            <text x="247" y="121" text-anchor="middle" class="t-sm">it differently</text>
            <path d="M82 130V152" class="fg-arrow-bad" marker-end="url(#L10w)"/>
            <path d="M247 130V152" class="fg-arrow-bad" marker-end="url(#L10w)"/>
            <rect x="10" y="156" width="145" height="34" rx="6" class="fg-bad"/>
            <text x="82" y="178" text-anchor="middle" class="t-sm t-b">Non-response error</text>
            <rect x="175" y="156" width="145" height="34" rx="6" class="fg-bad"/>
            <text x="247" y="178" text-anchor="middle" class="t-sm t-b">Response error</text>
          </svg>
      - kind: check
        page: 54
        quote: "If respondents interpret questions differently than intended by the researcher, serious bias can occur, leading to response error."
        question: "If respondents interpret questions differently than intended by the researcher, this leads to:"
        options: ["Response error", "Non-response error", "Aided recall", "Unaided recall"]
        answer: 0
        why:
          - "صح: جاوب، بس الإجابة معناها حاجة تانية = serious bias."
          - "الـ non-response error لما يرفض يجاوب (item non-response)."
          - "الـ aided recall تكنيك بيساعد الذاكرة."
          - "الـ unaided recall سؤال من غير cues."
      - kind: mnemonic
        page: 55
        quote: "Five guidelines to avoid problems in question wording\n  (1) Define the issue (who, what, when, and where).\n  (2) Use ordinary words.\n  (3) Avoid ambiguous words.\n  (4) Avoid leading questions.\n  (5) Use positive and negative statements. Avoid double negatives."
        word: "WORDS"
        parts:
          - { key: "W", text: "Who, what, when and where: define the issue" }
          - { key: "O", text: "Ordinary words" }
          - { key: "R", text: "Remove ambiguous words" }
          - { key: "D", text: "Don't lead: avoid leading questions" }
          - { key: "S", text: "Statements positive and negative; avoid double negatives" }
        hook: "الـ wording قواعده في كلمة **WORDS** نفسها."
      - kind: aside
        tone: tip
        page: 55
        quote: "(4) Avoid leading questions.\n  (5) Use positive and negative statements. Avoid double negatives."
        text: |
          أمثلة تفهّمك:
          - **Leading question**: «مش شايف إن التدخين مضر؟» السؤال بيقوله يقول إيه.
          - **Double negative**: «مش موافق إن الـ vaccine مش مفيد؟» محدش هيفهم آه يعني إيه.
          - **Ambiguous word**: «بتاكل سكريات كتير؟» كتير بالنسبة لمين؟
      - kind: explain
        page: 56
        quote: "Questionnaire Format\n  When designing questionnaires:\n  Allow ample white space\n  Allow enough space for responses to be typed for open-ended questions\n  Ask respondents to clearly mark their answers\n  Be consistent in style"
        title: "شكل الـ questionnaire"
        text: |
          وانت بتصمم:

          - سيب ==white space== كتير.
          - سيب مكان كفاية للإجابة في الـ open-ended.
          - اطلب من المشارك ==يعلّم إجابته بوضوح==.
          - ==Be consistent in style==.

          ليه الشكل مهم؟ ورقة زحمة بتخلي المشارك يتلخبط ويسيب أسئلة، وإجابة مش واضحة مش هتعرف تدخلها. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 57
        quote: "Skip logic or conditional branching\n  Skip logic enables you to guide participants to a specific follow-up question, based on a response to an earlier question.\n  This technique can be used to minimize non-relevant questions for each participant, and for filtering out survey participants."
        title: "الشكل والـ skip logic"
        text: |
          الـ **format**: سيب **white space** كفاية، ومكان للكتابة في الـ open-ended، واطلب منه يعلّم إجابته بوضوح، وخليك **consistent** في الستايل.

          ==Skip logic== (conditional branching): الإجابة بتوديه لسؤال معيّن. «لو ساكن في بيت ملك، روح لسؤال 14». بيقلل الأسئلة اللي مالهاش لازمة لكل واحد، وبيـ **filter** المشاركين.

          مثال الشرح: اللي **مش diabetic** متسألهوش عن علاج السكر؛ الـ skip instruction تنقله للسؤال اللي يخصّه.
      - kind: figure
        page: 57
        quote: "Skip logic enables you to guide participants to a specific follow-up question, based on a response to an earlier question."
        title: "Skip logic"
        alt: "Q5 asks: do you own or rent your home? Own home skips to Q14 on the next page. Rent home goes to Q6, how much is your monthly rent."
        caption: "**Own** ← اقفز لـ Q14. **Rent** ← كمّل Q6 عن الإيجار."
        svg: |
          <svg viewBox="0 0 330 180" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L10s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="65" y="10" width="200" height="40" rx="6" class="fg-acc"/>
            <text x="165" y="35" text-anchor="middle" class="t-sm t-b">Q5 Own or rent your home?</text>
            <path d="M120 50L70 98" class="fg-arrow-acc" marker-end="url(#L10s)"/>
            <path d="M210 50L260 98" class="fg-arrow-acc" marker-end="url(#L10s)"/>
            <text x="58" y="66" class="t-sm t-b">Own</text>
            <text x="246" y="66" class="t-sm t-b">Rent</text>
            <rect x="10" y="102" width="130" height="50" rx="6" class="fg-good"/>
            <text x="75" y="124" text-anchor="middle" class="t-sm t-b">Skip to Q14</text>
            <text x="75" y="141" text-anchor="middle" class="t-sm t-mut">next page</text>
            <rect x="190" y="102" width="130" height="50" rx="6" class="fg-box"/>
            <text x="255" y="124" text-anchor="middle" class="t-sm t-b">Q6 Monthly rent?</text>
            <text x="255" y="141" text-anchor="middle" class="t-sm t-mut">under $100 ... $300+</text>
          </svg>
      - kind: explain
        page: 60
        quote: "Pretesting\n  Pretesting refers to testing the questionnaire on a small sample of respondents, usually 15 to 30, to identify and eliminate potential problems.\n  Even the best questionnaire can be improved by pretesting.\n  As a general rule, a questionnaire should not be used in the field study without extensive pretesting."
        title: "Pretesting: جرّبه الأول"
        text: |
          ==Pretesting== = تجرّب الـ questionnaire على **sample صغيرة، عادة 15 لـ 30**، عشان تكتشف المشاكل وتشيلها. حتى أحسن questionnaire بيتحسّن بيه، ومفيش questionnaire ينزل الميدان من غير **extensive pretesting**.

          بتختبر **كل حاجة**: content، wording، sequence، form وlayout، difficulty، وinstructions. والـ pretest group لازم يشبه الـ respondents الحقيقيين (خلفيتهم، معرفتهم بالموضوع، attitudes)، في بيئة شبه الـ survey الحقيقي.

          الدكتورة شدّدت في الشرح: الـ pretest **يتعمل فعلًا**، مش يتكتب في الـ protocol وخلاص. اكتشف المشاكل وعدّل **قبل** النسخة النهائية، وبعدها اجمع بنفس الطريقة للكل.
      - kind: check
        page: 60
        quote: "Pretesting refers to testing the questionnaire on a small sample of respondents, usually 15 to 30, to identify and eliminate potential problems."
        question: "Pretesting a questionnaire is usually done on how many respondents?"
        options: ["15 to 30", "6 to 12", "100 to 200", "The whole study sample"]
        answer: 0
        why:
          - "صح: sample صغيرة، عادة 15–30."
          - "ده حجم الـ focus group discussion."
          - "ده مش pretest، ده survey."
          - "الـ pretest قبل الميدان، على عدد صغير شبههم."
      - kind: aside
        tone: trap
        page: 61
        quote: "The pretest groups should be similar to the respondents in terms of their background characteristics, familiarity with the topic, and attitudes and behaviors of interest, and it should be conducted in an environment and context similar to that of the actual survey."
        text: |
          متعملش الـ pretest على زمايلك الـ residents وانت بحثك على فلاحين في قرية. الـ ==pretest groups should be similar to the respondents== وفي **environment** شبه الحقيقي، وإلا مش هتكتشف المشاكل اللي هتقابلك فعلًا.
      - kind: explain
        page: 62
        quote: "Coding\n  Coding is an analytical process in which data are categorised to facilitate analysis.\n  It means the transformation of data into a form understandable by computer software."
        title: "الـ coding"
        text: |
          الـ **coding** عملية تحليلية بتقسّم فيها الـ data لـ ==categories== علشان التحليل يبقى أسهل.

          يعني ==تحويل الـ data لشكل الـ software يفهمه==.

          ليه؟ الكمبيوتر مابيفهمش «موافق جدًا»، بيفهم 5. فكل إجابة لازم تاخد رقم ثابت قبل الإدخال. التفسير المقبول (مش في الكتاب).
      - kind: match
        page: 63
        quote: "Questionnaire data can be:\n  Pre-coded (assigning codes to expected answers on designed questionnaire)\n  Field-coded (process of assigning codes as soon as the date flows, usually during fieldwork)\n  Post-coded (coding of open questions on completed questionnaires)"
        prompt: "الـ coding = تحويل الداتا لشكل الكمبيوتر يفهمه. وصّل كل نوع بمعناه:"
        pairs:
          - ["Pre-coded", "Codes on expected answers in the designed questionnaire"]
          - ["Field-coded", "Codes assigned as data flow, during fieldwork"]
          - ["Post-coded", "Open questions coded on completed questionnaires"]
        why: "Pre = قبل (الورقة نفسها فيها الأكواد). Field = في الميدان وانت بتجمع. Post = بعد ما الورق يخلص، للأسئلة المفتوحة."
      - kind: aside
        tone: tip
        page: 63
        quote: "Questionnaire data can be:\n  Pre-coded (assigning codes to expected answers on designed questionnaire)\n  Field-coded (process of assigning codes as soon as the date flows, usually during fieldwork)\n  Post-coded (coding of open questions on completed questionnaires)"
        text: |
          من الشرح: حدّد أكواد الإجابات **قبل** الإدخال قد ما تقدر، على الـ questionnaire نفسها لو تقدر (**pre-coded answers**: 1 = ذكر، 2 = أنثى مثلًا)، واعمل **codebook** يشرح معنى كل كود.

          والرقم اللي اديته لـ category **مش كمية**: متجمعش أكواد ولا تطلّع لها متوسط. وخلّي كود الـ **missing** مختلف عن الإجابات الحقيقية.
