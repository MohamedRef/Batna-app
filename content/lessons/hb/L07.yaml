            <path d="M145 264v16" class="fg-arrow" marker-end="url(#L07a)"/>
            <rect x="60" y="282" width="170" height="44" rx="6" class="fg-box"/>
            <text x="145" y="300" text-anchor="middle" class="t-sm">Reverse transcription:</text>
            <text x="145" y="316" text-anchor="middle" class="t-sm">(−) then (+) strand DNA</text>
            <rect x="240" y="286" width="84" height="36" rx="6" class="fg-bad"/>
            <text x="282" y="301" text-anchor="middle" class="t-sm t-b t-bad">NAs</text>
            <text x="282" y="315" text-anchor="middle" class="t-sm t-bad">block here</text>
            <path d="M240 304h-6" class="fg-arrow-bad" marker-end="url(#L07c)"/>
            <path d="M145 326v16" class="fg-arrow" marker-end="url(#L07a)"/>
            <rect x="60" y="344" width="220" height="32" rx="6" class="fg-box"/>
            <text x="170" y="365" text-anchor="middle" class="t-sm">Envelope (HBsAg) from ER, budding</text>
            <path d="M170 376v14" class="fg-arrow" marker-end="url(#L07a)"/>
            <rect x="60" y="392" width="220" height="32" rx="6" class="fg-good"/>
            <text x="170" y="413" text-anchor="middle" class="t-sm t-b">Secretion of new virions</text>
            <path d="M60 300H16V146H56" class="fg-arrow-acc" stroke-dasharray="5 4" marker-end="url(#L07b)"/>
            <text x="20" y="236" class="t-sm t-acc">back</text>
            <text x="20" y="250" class="t-sm t-acc">to</text>
            <text x="20" y="264" class="t-sm t-acc">cccDNA</text>
          </svg>
      - kind: reveal
        page: 113
        quote: "Nucleoside/tide analogues; Negative strand synthesis HBV DNA; Positive strand synthesis HBV DNA; cccDNA amplification"
        prompt: "لو الـ NAs بتوقف الفيروس بالقوة دي، ليه لما نوقفها الـ DNA بيرجع تاني؟"
        answer: |
          بص على الرسمة: الـ NAs بتضرب في **reverse transcription** جوه الـ capsid، يعني بتمنع تصنيع DNA جديد.

          لكن الـ ==cccDNA== قاعد في النواة زي نسخة احتياطية، ومش بيتأثر بيها. أول ما الدوا يقف، القالب لسه موجود ويبدأ يطلّع pgRNA من تاني.

          ده المنطق اللي ورا إن علاج كتير من المرضى **long-term** (هتشوفه في درس العلاج).
      - kind: check
        page: 113
        quote: "Nucleoside/tide analogues; Negative strand synthesis HBV DNA; Positive strand synthesis HBV DNA"
        question: "Nucleos(t)ide analogues act on which step of the HBV life cycle?"
        options:
          - "Reverse transcription of pregenomic RNA into DNA"
          - "Formation of cccDNA in the nucleus"
          - "Viral entry through the receptor"
          - "Transcription of cccDNA into RNA"
        answer: 0
        why:
          - "صح: الرسمة بتحط الـ NAs على الـ **negative- and positive-strand DNA synthesis** جوه الـ capsid."
          - "الـ cccDNA بيتكوّن في النواة والـ NAs مش بتمنعه، وعلشان كده الفيروس بيرجع لما العلاج يقف."
          - "الدخول بالـ receptor والـ endocytosis مش ده مكان الـ NAs."
          - "الـ transcription بيحصل من الـ cccDNA في النواة، قبل الخطوة اللي الـ NAs بتوقفها."
      - kind: explain
        page: 114
        quote: "Incubation period: 1 to 4 months. Blood borne infection."
        title: "بيتنقل إزاي؟"
        text: |
          - **Incubation period**: من 1 لـ 4 months. يعني العدوى ممكن تكون حصلت من شهور قبل ما أي حاجة تبان.
          - **Blood borne infection**: بينتقل بالدم، وده اللي هيخلّينا نهتم بوخزة الإبرة في آخر درس.
          - ==Perinatal transmission==: من الأم للطفل وقت الولادة.

          الرقم المهم في الـ perinatal (من غير prophylaxis):

          - الأم ==HBeAg-positive==: الطفل بيتعدي في حوالي 85 لـ 90%.
          - الأم **HBeAg-negative**: 30% بس.

          الفرق الكبير ده مش صدفة، وسببه في السؤال الجاي.
      - kind: reveal
        page: 114
        quote: "risk of perinatal transmission is between 85% and 90% for infants born to HBeAg-positive mothers and 30% for infants born to HBeAg-negative mothers."
        prompt: "ليه الأم الـ HBeAg-positive بتنقل للطفل أكتر بكتير؟"
        answer: |
          الـ **HBeAg** ماشي مع **replication** عالي، يعني فيروس أكتر في الدم. فيروس أكتر = فرصة انتقال أكبر وقت الولادة.

          وعلشان كده في الحمل هتلاقي القرار كله مبني على **HBV DNA** (هنشوفه في آخر درس).
      - kind: check
        page: 114
        quote: "Although HBsAg can be detected in breast milk, there is no evidence that HBV infection can be transmitted by breast- feeding."
        question: "An HBsAg-positive mother asks if she can breastfeed. Per the lecture:"
        options:
          - "Yes: HBsAg is in breast milk, but there is no evidence of transmission by breastfeeding"
          - "No: HBsAg in breast milk transmits the virus"
          - "Only if she is HBeAg-negative"
          - "Only after the baby's third vaccine dose"
        answer: 0
        why:
          - "صح: الكتاب بيقول الـ HBsAg ممكن يتلاقى في اللبن، بس **no evidence** إن الرضاعة بتنقل العدوى."
          - "وجود الـ HBsAg في اللبن مش معناه انتقال؛ الكتاب صريح إن مفيش دليل."
          - "الكتاب مش بيربط الرضاعة بحالة الـ HBeAg."
          - "الكتاب مش بيحط شرط تطعيم قبل الرضاعة."
      - kind: aside
        tone: joke
        page: 114
        quote: "Although HBsAg can be detected in breast milk, there is no evidence that HBV infection can be transmitted by breast- feeding."
        text: |
          الـ HBsAg في لبن الأم زي الضيف اللي بييجي الفرح ومش بياكل: موجود، بس مش بيعمل حاجة. 😄

          فالأم ترضع عادي، والامتحان عايز منك الجملة دي بالظبط.
      - kind: try
        items: [hb.L07.003, hb.L07.004, hb.L07.005, hb.L07.008, hb.L07.009]
    recap:
      - "الـ virion: envelope (**HBsAg**)، capsid (**HBcAg**)، **HBeAg**، **DNA polymerase** والـ DNA."
      - "Genotype **A** = better interferon response. Genotype **C** = late e-seroconversion + more HCC."
      - "الـ **cccDNA** في النواة هو القالب؛ الـ NAs بتوقف الـ reverse transcription بس مش بتشيله."
      - "Incubation **1–4 months**. Perinatal: **85–90%** (HBeAg+) مقابل **30%** (HBeAg−)."
      - "الرضاعة مسموحة: HBsAg في اللبن بس **no evidence** of transmission."
    practice: [hb.L07.001, hb.L07.002, hb.L07.003, hb.L07.004, hb.L07.005, hb.L07.006, hb.L07.007, hb.L07.008, hb.L07.009]

  # ------------------------------------------------------------------
  - id: hb.L07.lesson2
    title: "الـ acute HBV: من دور برد لحد الصفرا"
    hook: "عيان بقى أصفر... وفجأة نفسه اتفتحت وبقى أحسن. ليه؟ وإمتى نخاف ونبدأ antivirals؟"
    minutes: 9
    pages: [114, 116]
    topics: [acute]
    goals:
      - "تعدّ الـ 3 صور الإكلينيكية والـ 3 مراحل للـ classic"
      - "تحفظ الـ 3 علامات اللي بتقول severe acute hepatitis B"
      - "تفهم ليه الـ antivirals مش لكل acute HBV"
    status: unverified
    steps:
      - kind: explain
        page: 114
        quote: "Asymtomatic; only elevated transaminaes. Anicteric: GI and influenza like symptoms, no jaundice. Classic: 3 stages:"
        title: "تلات صور للمرض"
        text: |
          الـ acute HBV ممكن ييجي بتلات أشكال:

          - **Asymptomatic**: مفيش غير **elevated transaminases**.
          - ==Anicteric==: أعراض **GI** وزي الـ **influenza**، ومن غير jaundice.
          - ==Classic==: تلات مراحل: prodromal، بعده icteric، وآخره convalescent.

          والأهم في الأرقام: حوالي 70% subclinical أو anicteric، و 30% بس icteric.

          يعني اللي بتشوفه أصفر في العيادة هو الأقلية، وأغلب العدوى بتعدّي من غير ما حد ياخد باله. وده سبب إن الـ transaminases مهمة في اكتشاف الـ anicteric cases (هنشوفها كمان شوية).
      - kind: figure
        page: 114
        quote: "Approximately 70% of patients have subclinical or anicteric hepatitis and only 30% have icteric hepatitis."
        title: "الـ acute HBV في صورة واحدة"
        alt: "Top: a bar split 70 percent subclinical or anicteric and 30 percent icteric. Middle: the classic course as three boxes in a row: prodrome 3 to 4 days with malaise, fever, anorexia and nausea; icteric phase 1 to 4 weeks with dark urine then jaundice and itching while the patient feels better; convalescence. Bottom: severe acute hepatitis B when any one of C, P or E is present: coagulopathy INR above 1.5, protracted course over 4 weeks, encephalopathy or ascites; this leads to antivirals."
        caption: "أغلب العدوى من غير صفرا (70%). الـ classic بيمشي prodrome ← icteric ← convalescent. والـ antivirals بس لو ظهرت علامة من الـ 3 اللي تحت (**CPE**، هنشرحها بعد شوية)."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L07g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
