lessons:
  # ------------------------------------------------------------------
  - id: hem.L08.lesson1
    title: "كروموزوم قصير عمل مشكلة كبيرة: الـ Philadelphia"
    hook: "حتة من كروموزوم 9 راحت لـ 22، فطلع enzyme ما بيبطلش يشتغل."
    minutes: 8
    pages: [116, 117]
    topics: [cml-definition, bcr-abl]
    goals:
      - "تعرّف الـ CML وتحفظ أرقامها"
      - "تشرح الـ Ph1 والـ BCR/ABL والـ P210"
      - "تعرف دور الـ PP2A في الـ blast crisis"
    status: unverified
    steps:
      - kind: explain
        page: 116
        title: "مصنع neutrophils من غير فرامل"
        quote: "It is an acquired malignant disease characterized by over production of cells of the granulocytic series, especially the neutrophilic series"
        text: |
          الـ **CML** مرض خبيث **acquired** فيه ==overproduction== للـ **granulocytic series**، خصوصًا الـ neutrophils.

          النتيجة:
          - **Marked splenomegaly**
          - **WBC عالي جدًا**
          - **Basophilia** و **thrombocytosis** شائعين
      - kind: table
        page: 116
        quote: "1 or 2 persons per 100,000 per year with slight male preponderance. The median age at diagnosis is approximately 45 to 50 years."
        title: "أرقام الـ CML"
        columns: [Fact, Number]
        rows:
          - ["Incidence", "1–2 per 100,000 per year"]
          - ["Sex", "Slight male preponderance"]
          - ["Median age", "45–50 years"]
          - ["Ph1 present", ">95%"]
          - ["After atomic bomb", "Peak 5–12 years, dose related"]
        hide: [[0, 1], [2, 1], [3, 1]]
      - kind: figure
        page: 116
        quote: "The Ph1 chromosome results from a balanced translocation of material between the long arms of chromosomes 9 and 22."
        title: "9 و22 بيبدّلوا"
        alt: "Chromosomes 9 and 22 drawn side by side before and after the translocation. The ABL segment from 9q34 moves onto chromosome 22 next to BCR, forming a short chromosome 22 labelled Ph1 that carries the BCR-ABL fusion gene, which makes the P210 tyrosine kinase."
        caption: "الـ **ABL** من 9q34 بيروح جنب الـ **BCR** على 22، و22 بيطلع ==أقصر==: ده الـ Ph1."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L08a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head-acc"/></marker></defs>
            <text x="85" y="18" text-anchor="middle" class="t-sm t-b">Before</text>
            <text x="245" y="18" text-anchor="middle" class="t-sm t-b">After</text>
            <rect x="45" y="30" width="26" height="150" rx="12" class="fg-box"/>
            <rect x="45" y="150" width="26" height="30" rx="8" class="fg-acc"/>
            <text x="58" y="198" text-anchor="middle" class="t-sm">9</text>
            <text x="20" y="170" text-anchor="middle" class="t-sm t-acc t-b">ABL</text>
            <rect x="100" y="70" width="26" height="110" rx="12" class="fg-box"/>
            <rect x="100" y="120" width="26" height="14" class="fg-bad"/>
            <text x="113" y="198" text-anchor="middle" class="t-sm">22</text>
            <text x="150" y="131" text-anchor="middle" class="t-sm t-bad t-b">BCR</text>
            <path d="M165 105 L190 105" class="fg-arrow-acc" marker-end="url(#L08a)"/>
            <rect x="205" y="30" width="26" height="150" rx="12" class="fg-box"/>
            <rect x="205" y="150" width="26" height="30" rx="8" class="fg-thin"/>
            <text x="218" y="198" text-anchor="middle" class="t-sm">9q+</text>
            <rect x="265" y="100" width="26" height="62" rx="12" class="fg-box"/>
            <rect x="265" y="120" width="26" height="14" class="fg-bad"/>
            <rect x="265" y="134" width="26" height="28" rx="6" class="fg-acc"/>
            <text x="278" y="180" text-anchor="middle" class="t-sm t-b">Ph1</text>
            <rect x="60" y="225" width="210" height="34" rx="10" class="fg-acc"/>
            <text x="165" y="247" text-anchor="middle" class="t-sm t-b">BCR-ABL → P210 tyrosine kinase</text>
            <text x="165" y="285" text-anchor="middle" class="t-sm t-mut">kinase always ON → proliferation</text>
          </svg>
      - kind: explain
        page: 117
        title: "الجين الهجين"
        quote: "allows translocation of the cellular oncogene C- AB1 to a position on chromosome 22 called the breakpoint cluster region (bcr)."
        text: |
          - الكسر في **9q34** بينقل الـ oncogene ==c-ABL== لمكان على 22 اسمه **breakpoint cluster region (bcr)**.
          - الاتنين جنب بعض بيعملوا **hybrid gene BCR/ABL**.
          - الجين ده بيعمل بروتين جديد **210 kDa** اسمه ==P210==: **tyrosine kinase** بيشغّل الانقسام من غير كنترول.
      - kind: reveal
        page: 116
        quote: "This distribution places the abnormality in CML close to the plaripotent stem cells."
        prompt: "الـ Ph1 بيتلاقي في الـ erythroid والـ myeloid والـ monocytes ونادرًا T cells، بس مش في الـ marrow fibroblasts. ده معناه إيه؟"
        answer: |
          إن الخلل حصل في خلية ==قبل== ما السلالات دي تتفرق، يعني قريب من الـ **pluripotent stem cell**.

          الـ fibroblasts مش من الـ hematopoietic stem cell أصلًا، علشان كده سليمة.
      - kind: check
        page: 116
        quote: "the Philadelphia (Ph1) chromosome, is present in the bone marrow cells in more than 95% of cases"
        question: "The Ph1 chromosome in CML is:"
        options:
          - "A shortened chromosome 22 from a balanced t(9;22)"
          - "A long chromosome 9 from t(15;17)"
          - "Present in about 50% of cases"
          - "Found in marrow fibroblasts"
        answer: 0
        why:
          - "صح: translocation balanced بين 9 و22، و22 بيخسر أكتر ما بياخد فيقصر."
          - "الـ t(15;17) بتاعة الـ APL."
          - "الـ Ph1 موجود في أكتر من 95%."
          - "الـ fibroblasts مفيهاش Ph1."
      - kind: explain
        page: 117
        title: "الـ PP2A: الفرامل اللي اتشالت"
        quote: "PP2A activity is suppressed in blast crisis but not chronic phase CML cells through the BCR/ABL induced expression of its inhibitor, SET."
        text: |
          الخلية الطبيعية محتاجة توازن بين ==kinase== (بيشغّل) و ==phosphatase== (بيطفي).

          - الـ **PP2A** phosphatase فيه **tumour suppressor activity**.
          - في الـ **blast crisis** (مش الـ chronic phase) الـ BCR/ABL بيزوّد الـ inhibitor بتاعه **SET**، فالـ PP2A يقف.
          - لو رجعنا الـ PP2A ← الـ BCR/ABL يتكتم، حتى الـ **T315I**.
          - **Forskolin** بيشغّل PP2A: فكرة علاج للـ blast crisis والـ imatinib-resistant CML.
      - kind: aside
        tone: analogy
        page: 117
        quote: "Restoration of PP2A activity inhibits BCR/ABL expression/activity, hence impairing wild type and T315, BCR/ABL leukemogenesis."
        text: "تخيل عربية دواسة البنزين فيها لزقت (**BCR/ABL**). الـ chronic phase لسه فيها فرامل (**PP2A**). في الـ blast crisis الـ **SET** قطع سلك الفرامل. الـ forskolin بيحاول يرجّع السلك."
      - kind: aside
        tone: exam
        page: 117
        quote: "BCR/ABL fusion gene is found in 25% of normal adults without CML."
        text: "معلومة كتاب غريبة بيحبوا يسألوها: الـ **BCR/ABL** بيتلاقي في ==25%== من الكبار الطبيعيين من غير CML."
      - kind: try
        items: [hem.L08.003, hem.L08.008, hem.L08.010, hem.L08.012, hem.L08.015]
    recap:
      - "CML = overproduction granulocytes، splenomegaly، WBC عالي، basophilia وthrombocytosis."
      - "1–2/100,000، رجالة أكتر شوية، median 45–50 سنة. السبب المعروف: radiation."
      - "Ph1 = t(9;22) balanced، 22 قصير، في >95%، stem cell disease."
      - "BCR/ABL ← P210 tyrosine kinase."
      - "PP2A بيتكتم بالـ SET في الـ blast crisis؛ forskolin فكرة علاج."
    practice: [hem.L08.001, hem.L08.002, hem.L08.003, hem.L08.004, hem.L08.005, hem.L08.006, hem.L08.007, hem.L08.008, hem.L08.009, hem.L08.010, hem.L08.011, hem.L08.012, hem.L08.013, hem.L08.014, hem.L08.015, hem.L08.100, hem.L08.121]
  # ------------------------------------------------------------------
  - id: hem.L08.lesson2
    title: "CML: الطحال العملاق والمراحل التلاتة"
    hook: "طحال واصل للحوض، وWBC بالمية ألف، وساعات العيان ما يحسش بحاجة."
    minutes: 10
    pages: [118, 121]
    topics: [cml-clinical, cml-course, cml-diagnosis, cml-variants]
    goals:
      - "تربط كل عرض بسببه"
      - "تفرّق الـ chronic والـ accelerated والـ blast crisis"
      - "تفرّق الـ CML عن الـ leukemoid reaction وتعرف الـ variants"
    status: unverified
    steps:
      - kind: explain
        page: 118
        title: "الأعراض جاية منين؟"
        quote: "Symptomatology of CML usually nonspecific, is secondary to anaemia, spleen size or an increase basal metabolic rate."
        text: |
          كتير بيتكشف **صدفة** في تحاليل روتينية. الأعراض nonspecific وجاية من:
          - **Anemia**: fatigue، malaise
          - ==Spleen size==: easy satiety وتقل في الـ **left upper quadrant**
          - **↑ basal metabolic rate**: weight loss

          ونادرًا: نزيف من low platelets أو thrombosis من الـ thrombocytosis.
      - kind: sort
        page: 118
        quote: "An elevated blood histamine level (related to the hasophil cell mass) can cause upper GIT bleeding."
        prompt: "وصّل العرض بآليته:"
        bins: ["Leukostasis", "Basophil histamine", "Big spleen"]
        cards:
          - { text: "Dyspnea", bin: 0 }
          - { text: "TIA", bin: 0 }
          - { text: "Priapism", bin: 0 }
          - { text: "Upper GIT bleeding", bin: 1 }
          - { text: "Easy satiety", bin: 2 }
          - { text: "LUQ fullness", bin: 2 }
          - { text: "Splenic infarction pain", bin: 2 }
        why: "الـ leukostasis = sludging في أوعية الرئة والمخ (dyspnea، drowsiness، TIA)، والـ priapism مع leukocytosis أو thrombocytosis شديدة. الـ histamine من الـ basophils بيعمل نزيف GIT. الطحال الكبير بيضغط على المعدة وممكن يحصل فيه infarction."
      - kind: explain
        page: 118
        title: "الكشف"
        quote: "Splenomegaly is the most consistent physical sign in CML occurs in more than 60% of cases."
        text: |
          - ==Splenomegaly== أثبت علامة، في **أكتر من 60%**، وممكن يوصل لـ **pelvic brim**.
          - **Hepatomegaly** أقل.
          - **Lymphadenopathy** و skin infiltration ==نادرين جدًا==.
          - الـ neutrophil function عادةً **طبيعية**.
          - **Acute gout** ممكن ييجي بعد العلاج.
      - kind: aside
        tone: trap
        page: 119
        quote: "If present, these findings suggest Ph1-negative CML, or accelerated or blastic transformation."
        text: "عيان CML عنده **lymph nodes** أو **skin infiltration**؟ ده مش typical. فكّر في ==Ph1-negative CML== أو إنه دخل **accelerated** أو **blastic transformation**."
      - kind: figure
        page: 120
        quote: "blast cells (15 to 19%) in blood or BM, basophilia 20% or more. This last group of features, termed the accelerated phase"
        title: "تلات محطات"
        alt: "A three-step timeline: chronic phase, controllable with treatment; accelerated phase, with difficulty keeping WBC under 20,000, growing spleen and liver, infiltration, blasts 15 to 19 percent and basophils 20 percent or more, median survival 12 months; blast crisis resembling acute leukemia, median survival 3 months, blasts myeloid in 70 percent, lymphoid 20 percent and undifferentiated 10 percent."
        caption: "تلت العيانين بيقفزوا لـ ==blast crisis== فجأة، والتلتين بيعدّوا على الـ **accelerated** الأول."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L08b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head-bad"/></marker></defs>
            <rect x="15" y="10" width="300" height="60" rx="12" class="fg-good"/>
            <text x="30" y="34" class="t-sm t-b">Chronic phase</text>
            <text x="30" y="54" class="t-sm">WBC and spleen controllable</text>
            <path d="M120 70 L120 98" class="fg-arrow-bad" marker-end="url(#L08b)"/>
            <text x="130" y="90" class="t-sm t-mut">2/3 gradually</text>
            <rect x="15" y="100" width="300" height="110" rx="12" class="fg-acc"/>
            <text x="30" y="124" class="t-sm t-b">Accelerated phase</text>
            <text x="30" y="144" class="t-sm">Hard to keep WBC below 20,000</text>
            <text x="30" y="162" class="t-sm">Spleen, liver grow; infiltration</text>
            <text x="30" y="180" class="t-sm">Blasts 15–19%, basophils ≥20%</text>
            <text x="30" y="200" class="t-sm t-b">Median survival 12 months</text>
            <path d="M120 210 L120 238" class="fg-arrow-bad" marker-end="url(#L08b)"/>
            <path d="M300 70 L300 238" class="fg-arrow-bad" marker-end="url(#L08b)"/>
            <text x="292" y="150" text-anchor="end" class="t-sm t-bad">1/3 abrupt</text>
            <rect x="15" y="240" width="300" height="80" rx="12" class="fg-bad"/>
            <text x="30" y="264" class="t-sm t-b">Blast crisis (like acute leukemia)</text>
            <text x="30" y="284" class="t-sm">Myeloid 70% · lymphoid 20% · undiff 10%</text>
            <text x="30" y="304" class="t-sm t-b">Median survival 3 months</text>
          </svg>
      - kind: check
        page: 121
        quote: "blast crisis of CML is only 3 months. The survival after development of the accelerated phase of CML is 12 months."
        question: "Median survival after CML blast crisis, per the book?"
        options:
          - "3 months"
          - "12 months"
          - "3 years"
          - "5–12 years"
        answer: 0
        why:
          - "صح: 3 شهور بس."
          - "الـ 12 شهر بعد الـ accelerated phase."
          - "3 سنين مش رقم الكتاب."
          - "5–12 سنة دي ذروة الـ CML بعد القنبلة الذرية."
      - kind: explain
        page: 120
        title: "التشخيص"
        quote: "The presence of unexplained myeloid leukocytosis with splenomegely should lead to a leukocyte alkaline phosphotase (LAP) test and bone marrow examination with a cytogenetic analysis."
        text: |
          **Myeloid leukocytosis** مش مفهومة + **splenomegaly** ← اعمل:
          1. ==LAP== (leukocyte alkaline phosphatase)
          2. **Bone marrow** + **cytogenetics**

          الـ **Ph1** بيأكد التشخيص. لو مش موجود ← دوّر على ==BCR/ABL== بالـ molecular tests.
      - kind: table
        page: 120
        quote: "Toxic granulation -ve +ve Baesophilia + -ve LAP weak or abscent normal"
        title: "CML ولا leukemoid reaction؟"
        columns: [Feature, CML, Leukemoid]
        rows:
          - [WBC, ">50,000", "<50,000"]
          - [Toxic granules, "-ve", "+ve"]
          - [Basophilia, "+", "-ve"]
          - [LAP, Weak or absent, Normal]
          - [Marrow, Blast cells, Normal]
          - [Antibiotics, No response, Good response]
        hide: [[1, 1], [2, 1], [3, 1], [5, 2]]
      - kind: reveal
        page: 120
        quote: "Toxic granulation -ve +ve Baesophilia + -ve LAP weak or abscent normal"
        prompt: "ليه الـ LAP واطي في الـ CML وطبيعي في الـ leukemoid reaction، مع إن الاتنين neutrophils كتير؟"
        answer: |
          في الـ **leukemoid reaction** الـ neutrophils طبيعية ومتنشّطة بالـ infection، فالـ enzyme بتاعها شغال.

          في الـ **CML** الـ neutrophils جاية من ==clone== خبيث، شكلها ناضج بس وظيفيًا ناقصها الـ **alkaline phosphatase**. علشان كده الـ LAP **weak or absent**. (تفسير فسيولوجي؛ الجدول من الكتاب.)
      - kind: table
        page: 121
        quote: "It occurs in elderly men, monocytosis is prominent, thrombocytopenia is common, basophilia and eosinophilia are absent, dysplatic changes are usually present."
        title: "الـ variants"
        columns: [Variant, Clue]
        rows:
          - ["Ph-negative", "No basophilia or blasts, dysplasia, worse survival"]
          - ["CMML", "Old men, monocytosis, low platelets, no basophils or eosinophils"]
          - ["t(5;12)", "Eosinophilia, no basophilia, great on low-dose imatinib"]
          - ["CNL", "Rare, mature neutrophils, no basophilia, by exclusion"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: try
        items: [hem.L08.017, hem.L08.024, hem.L08.027, hem.L08.031, hem.L08.039]
    recap:
      - "الأعراض: anemia، الطحال، الـ BMR. Leukostasis: dyspnea، drowsiness، TIA، priapism."
      - "Splenomegaly أثبت علامة (>60%). Nodes أو skin = Ph-negative أو transformation."
      - "Accelerated: blasts 15–19%، basophils ≥20%، 12 شهر. Blast crisis: 3 شهور، myeloid 70%."
      - "التشخيص: LAP + marrow cytogenetics؛ Ph1 بيأكد. CML: LAP واطي، basophilia، مفيش toxic granules."
      - "Variants: Ph-negative، CMML، t(5;12)، CNL."
    practice: [hem.L08.016, hem.L08.017, hem.L08.018, hem.L08.019, hem.L08.020, hem.L08.021, hem.L08.022, hem.L08.023, hem.L08.024, hem.L08.025, hem.L08.026, hem.L08.027, hem.L08.028, hem.L08.029, hem.L08.030, hem.L08.031, hem.L08.032, hem.L08.033, hem.L08.034, hem.L08.035, hem.L08.036, hem.L08.037, hem.L08.038, hem.L08.039, hem.L08.040, hem.L08.041, hem.L08.042, hem.L08.101, hem.L08.102, hem.L08.103, hem.L08.116, hem.L08.117]
  # ------------------------------------------------------------------
  - id: hem.L08.lesson3
    title: "علاج الـ CML: من busulfan لحد الـ TKIs"
    hook: "دوا واحد بيقفل الـ kinase اللي غلطان، وغيّر حياة العيانين دول."
    minutes: 10
    pages: [122, 125]
    topics: [cml-treatment, tki, cml-phases-tx]
    goals:
      - "تعرف امتى العلاج لازم يبقى فوري"
      - "تحفظ busulfan وhydroxyurea بجرعاتهم وآثارهم"
      - "تعرف الـ TKIs والـ resistance والـ T315I"
    status: unverified
    steps:
      - kind: explain
        page: 122
        title: "مش لازم تجري... إلا في 3 حالات"
        quote: "Immediate treatment of CML is not necessary unless the WBC count exceeds 200,000/dl or there is evidence of leukostasis"
        text: |
          العلاج **الفوري** مش لازم، إلا لو:
          1. ==WBC أكتر من 200,000/µL==
          2. **Leukostasis**: priapism، dyspnea، venous thrombosis
          3. **Painful splenomegaly** (شك في splenic infarction)

          **Supportive**: overhydration + **allopurinol**، blood transfusion، platelets لو محتاج.
      - kind: table
        page: 122
        quote: "Hydroxyurea: is given at a dose of 1 to 4 grams per day."
        title: "الـ palliative drugs"
        columns: [Point, Busulfan, Hydroxyurea]
        rows:
          - [Dose, "4–8 mg/day", "1–4 g/day"]
          - [Adjust, "Halve when count halves", "Lower as WBC falls"]
          - [Stop at, "WBC 20,000", "WBC 5,000"]
          - [Side effects, "Menopause, sterility, pigment, weight loss, lung fibrosis", "Uncommon: rash, mucositis, diarrhea"]
        hide: [[0, 1], [0, 2], [2, 1], [2, 2]]
      - kind: reveal
        page: 122
        quote: "Since the WBC count continues to fall for 2 to 4 weeks after cessation of busulfan the drug should be discontinued"
        prompt: "ليه نوقف الـ busulfan عند 20,000 مش لما الـ WBC يبقى طبيعي؟"
        answer: |
          لأن الـ WBC ==بيكمّل ينزل 2–4 أسابيع== بعد ما توقفه.

          لو استنيت لحد الطبيعي، هيكمّل ينزل وتقع في **severe pancytopenia**.
      - kind: mnemonic
        page: 122
        quote: "Premature menopause."
        word: "BUSLF"
        parts:
          - { key: "B", text: "Bronze skin: hyperpigmentation" }
          - { key: "U", text: "Unable to conceive: sterility" }
          - { key: "S", text: "Stopped periods: premature menopause" }
          - { key: "L", text: "Lung fibrosis" }
          - { key: "F", text: "Fatigue and weight loss" }
        hook: "**BUSLF** = **BUS**ulfan بأول حروف آثاره الجانبية."
      - kind: explain
        page: 123
        title: "الـ TKI: المفتاح في القفل"
        quote: "There is now general agreement that patients with CML in chronic phase should be treated with a TKI."
        text: |
          الـ **chronic phase** بيتعالج بـ ==TKI== (tyrosine kinase inhibitor): بيقعد في جيب الـ BCR/ABL kinase ويقفله.

          لو فيه **donor** مناسب، ممكن **SCT** كأول علاج لو تمن الـ TKI لسنين **مستحيل**.
      - kind: figure
        page: 123
        quote: "the replacement of threonine by isoleucine at position 315 (referred to as the T3151 mutation)"
        title: "ليه الـ T315I بيقفل الباب؟"
        alt: "Two panels stacked. Top: the BCR-ABL kinase pocket with imatinib fitting inside and the kinase switched off. Bottom: the same pocket with residue 315 changed from threonine to the bulkier isoleucine, blocking the drug, so the kinase stays on."
        caption: "الـ ==T315I== بيغيّر حمض أميني واحد عند باب الجيب، فالـ imatinib وكل الـ TKIs (في الكتاب) ما يدخلوش."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="18" text-anchor="middle" class="t-sm t-b">Wild-type BCR-ABL</text>
            <path d="M40 40 H290 V130 H200 V80 H130 V130 H40 Z" class="fg-box"/>
            <rect x="138" y="86" width="54" height="40" rx="6" class="fg-good"/>
            <text x="165" y="111" text-anchor="middle" class="t-sm t-b">TKI</text>
