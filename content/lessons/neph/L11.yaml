      - kind: explain
        page: 377
        title: "الهدف والولادة"
        quote: "For patients with preeclampsia, delivery is recommended at 37 weeks or later if no severe features such as hemolysis, thrombocytopenia, or liver dysfunction are observed. Stabilization and delivery at or>34 weeks are recommended in those women with severe features or adverse maternal or fetal conditions, such as fetal growth restriction or fetal distress. If delivery is done before 34 weeks' gestation, corticosteroids should be administered to the mother for fetal lung maturity.(70) Many patients with preeclampsia are treated with magnesium sulfate to minimize the risk of seizures. As magnesium is excreted by kidneys, a lower dose is recommended for women with kidney failure. Careful monitoring for clinical signs of magnesium toxicity and magnesium levels is needed.(72)"
        text: |
          - **CHIPS**: الضبط الشديد قلّل الـ severe hypertension بس من غير فرق في النتيجة. **CHAP**: ==<140/90== قلّل النتايج السيئة (30.2% مقابل 37%). فالهدف على الغسيل <140/90.
          - Preeclampsia من غير severe features: ولادة عند ==37 أسبوع==. مع severe features: استقرار وولادة عند **34** أو بعدها، و steroids لو قبل 34.
          - **Magnesium sulfate** بجرعة **أقل**: الكلية هي اللي بتطلّعه.
      - kind: explain
        page: 378
        title: "المتابعة"
        quote: "The incidence of cervical incompetence is high in women treated with dialysis, and screening is suggested between 18 and 20 weeks. Preeclampsia should be screened by monitoring BP and laboratory chemistries, including complete blood counts and liver function tests, twice a month. (77) Minimizing fluctuations in BP during dialysis sessions prevents uteroplacental insufficiency. For a patient receiving dialysis, pregnancy is considered high risk, and fetal anomaly screening is recommended. (78)"
        text: |
          75-80% بس بيوصلوا الـ second trimester بطفل عايش، و **82%** منهم preterm.
          - **Cervical incompetence**: screening في ==18-20 أسبوع==.
          - **Preeclampsia**: ضغط و complete blood count (CBC) و liver function tests **مرتين في الشهر**.
          - قلل تقلبات الضغط في الجلسة (uteroplacental insufficiency)، واعمل **fetal anomaly scan**.
      - kind: figure
        page: 380
        quote: "Figure 4: Hemodialysis during pregnancy"
        title: "روشتة الـ HD للحامل (Fig 4)"
        alt: "A prescription card for hemodialysis in pregnancy: 4 to 6 sessions of 4 to 6 hours a week to keep predialysis blood urea under 50 mg/dL; dialysate potassium 3 to 3.5, bicarbonate 25 to 30, calcium 2.5; biocompatible single-use dialyzer; dry weight up by up to 0.5 kg a week in the second and third trimesters; 35 kcal per kg and 1.8 g protein per kg a day (the text gives 1.5 to 1.8), with water-soluble vitamins continued; low-dose aspirin from 12 weeks; nocturnal option 7 to 8 hours, 5 to 7 nights."
        caption: "احفظها كروشتة. الرقم الأهم: ==blood urea nitrogen (BUN) <50 mg/dL== قبل الجلسة. والـ bicarbonate **أقل** من العادي."
        svg: |
