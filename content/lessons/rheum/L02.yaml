        answer: |
          - **مش بيأكد**: عشان 85% من اللي عندهم hyperuricaemia عمرهم ما بيجيلهم gout (صفحة 24). المريض ممكن يكون عنده urate عالي **و** septic arthritis.
          - **مش بينفي**: التفسير المقبول (مش في الكتاب): الـ urate ممكن **ينزل** وقت النوبة نفسها، لأن الالتهاب بيخلّي الكلى تطلّع urate أكتر، ولأن جزء منه بيترسب كبلورات.

          عشان كده الكتاب بيقول hyperuricaemia بتتأكد بـ **2 قياسات صايمة أو أكتر**، والتشخيص الأكيد بالبلورة.
      - kind: explain
        page: 35
        quote: "A 24-hr urine collection is obtained to determine the uric acid and creatinine excretion. On a regular purine diet, a urate value of more than 800mg/24hr suggests overproduction of uric acid."
