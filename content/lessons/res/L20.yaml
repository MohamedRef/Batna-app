- id: res.L20.lesson4
  title: 'المناقشة: p-value ولا confidence interval؟'
  hook: الـ p = 0.03 يعني الدوا هايل؟ مش بالضرورة. هنا هنعرف الفرق بين statistical وclinical significance.
  minutes: 10
  pages:
  - 30
  - 40
