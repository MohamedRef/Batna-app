  # ---------- p266-267: FCHL ----------
  - id: dm.L21.038
    kind: card
    topic: fchl
    front: Which Fredrickson type does the book give for familial combined hyperlipidemia?
    back: Type V.
    src: { page: 266, quote: "Type V Fredrickson Hyperlipoproteinaemia" }
    status: unverified
    update:
      text: "Most references place FCHL mainly as Fredrickson IIb (the patient may also show IIa or IV); type V is VLDL plus chylomicrons. In the exam write the book's answer."
      ref: "Harrison's Principles of Internal Medicine 21e (2022), lipoprotein disorders"
  - id: dm.L21.039
    kind: card
    topic: fchl
    front: Describe the lipid pattern of familial combined hyperlipidemia.
    back: Moderately raised TG (VLDL) and cholesterol (LDL) with reduced HDL-C.
    src: { page: 266, quote: "Characterized by moderate elevations in plasma levels of triglycerides (VLDL) and cholesterol (LDL) and reduced plasma levels of HDL-C" }
    status: unverified
    tags: [high-yield]
  - id: dm.L21.040
    kind: enumerate
    topic: fchl
    prompt: Mention the pathogenesis of familial combined hyperlipidemia.
    points:
      - VLDL overproduction
      - Disturbed clearance or catabolism of VLDL and chylomicrons
      - Partial lipoprotein lipase deficiency
    pass: 3
    src: { page: 266, quote: "Partial lipoprotein lipase deficiency." }
    status: unverified
  - id: dm.L21.041
    kind: enumerate
    topic: fchl
    prompt: Mention the clinical features of familial combined hyperlipidemia.
    points:
      - Significantly increased risk of premature CHD
      - Can appear in childhood but usually fully expressed in adulthood
      - "Metabolic syndrome cluster: obesity, glucose intolerance, insulin resistance, hypertension"
