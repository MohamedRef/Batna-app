  - id: neph.L02.047
    kind: mcq
    topic: causes
    stem: Which toxin is a tubulointerstitial cause of CKD in the book's table?
    options:
    - Minimal change disease
    - Cholesterol emboli
    - Fabry disease
    - Aristolochic acid
    answer: 3
    why:
    - Minimal change disease is a primary glomerular disease.
    - Cholesterol emboli are vascular.
    - Fabry disease is cystic/congenital.
    - Environmental toxins (lead, aristolochic acid) are tubulointerstitial causes.
