  - id: neph.L03.lesson2
    title: "Biomarkers، وليه الـ diuretic مش دايمًا كفاية"
    hook: "الـ furosemide صاحبك من زمان، بس عنده عيوب. والـ ultrafiltration بيقولك: سيبني أنا."
    minutes: 9
    pages: [72, 74]
    topics: [biomarkers, diuretics-uf, dialysis-hf]
    goals:
      - "تعرف كل biomarker بيقيس إيه (Table 2)"
      - "تعد عيوب الـ diuretics ومزايا الـ slow UF ومضاعفاته"
      - "تختار dialysis strategy لعيان HF على الغسيل (Table 6)"
    status: unverified
    steps:
      - kind: table
        page: 72
        quote: "B-type natriuretic peptide (BNP) Myocardial stretching sST2 Member of interleukin"
        title: "Table 2: molecular biomarkers"
        columns: [Marker, Reflects]
        rows:
          - ["cTnI", "Myocardial injury"]
          - ["BNP", "Myocardial stretching"]
          - ["sST2", "IL-1 receptor family"]
          - ["PIIINP", "Connective tissue injury"]
          - ["Creatinine", "Skeletal muscle"]
          - ["Albuminuria", "Glomerular integrity"]
          - ["KIM-1", "Regenerating PCT epithelium"]
          - ["L-FABP", "Tubular injury"]
          - ["IL-18", "Inflammation, AKI via NF-κB"]
          - ["AGE", "Improper renal clearance"]
        hide: [[1, 1], [4, 1], [6, 1], [7, 1], [8, 1]]
      - kind: aside
        tone: tip
        page: 72
        quote: "Kidney injury molecule (KIM-1) Type 1 cell membrane glycoprotein expressed in regenerating PCT epithelium"
        text: |
          الـ **creatinine** بيقولك الكلى **بتفلتر قد إيه** (وأصله من العضلات)، لكن مش بيقولك الـ tubule **اتجرح ولا لأ**.

          علشان الجرح نفسه عندك ==KIM-1== (في الـ **regenerating PCT epithelium**)، و **L-FABP** (tubular injury)، و **IL-18**.
      - kind: explain
        page: 72
        title: "الـ physiological biomarkers"
        quote: "Chest radiograph Cardiomegaly Interstitial edema Enlarged pulmonary artery Pleural effusion Prominent superior vena cava Kerley line"
        text: |
          **القلب:**
          - **Echo:** LVH، CVP، pericardial effusion، valvular stenosis و calcification، myocardial injury، fluid overfill.
          - **Doppler:** intraparenchymal blood flow. **Ultrasound:** fluid overload.
          - **Chest X-ray:** ==cardiomegaly==، interstitial edema، enlarged pulmonary artery، pleural effusion، prominent SVC، **Kerley lines**.

          **الكلى (ultrasound):** kidney enlargement، **thin hyperechogenic cortex**، small dilation of the urinary tract، parapelvic و subcortical cysts، و Doppler للـ intraparenchymal flow.
      - kind: check
        page: 72
        quote: "Kidney injury molecule (KIM-1) Type 1 cell membrane glycoprotein expressed in regenerating PCT epithelium"
        question: "Which biomarker in Table 2 marks proximal tubular injury?"
        options:
          - "KIM-1"
          - "BNP"
          - "Serum creatinine"
          - "sST2"
        answer: 0
        why:
          - "صح: KIM-1 glycoprotein في الـ regenerating PCT epithelium."
          - "الـ BNP = myocardial stretching."
          - "الـ creatinine أصله skeletal muscle وبيقيس filtration."
          - "الـ sST2 من الـ IL-1 receptor family، marker قلب."
      - kind: explain
        page: 73
        title: "Table 3: عيوب الـ diuretics في الـ HF"
        quote: "Direct activation of the renin-angiotensin-aldosterone system Deterioration in renal function Electrolyte abnormalities (e.g., hypokalemia and hypomagnesemia)"
        text: |
          1. **Direct RAAS activation**
          2. **Deterioration in renal function**
          3. **Electrolyte abnormalities:** hypokalemia و hypomagnesemia
          4. ==Suboptimal natriuresis==: بيطلّع **hypotonic urine**
          5. **Diuretic resistance**
          6. **Unpredictable response**
          7. مش واضح الـ **optimal dosing**
          8. **Nonrenal effects:** ototoxicity و hypersensitivity
      - kind: reveal
        page: 73
        quote: "Suboptimal natriuresis (production of hypotonic urine)"
        prompt: "ليه الـ hypotonic urine مشكلة في عيان الـ HF؟"
        answer: |
          المشكلة في الـ HF هي **الصوديوم** الزيادة، والمية بتمشي وراه. لو البول **hypotonic**، يبقى انت بتشيل مية أكتر من الصوديوم، فالـ total body sodium يفضل عالي والـ congestion يرجع.

          الـ ultrafiltrate بقى **isotonic** زي البلازما، علشان كده الكتاب بيقول **higher mass clearance of sodium**. (الشرح فسيولوجي.)
      - kind: table
        page: 73
        quote: "More rapid removal of fluid and improvement in symptoms Higher mass clearance of sodium Decreased risk of electrolyte abnormality"
        title: "Table 4: ليه الـ slow UF؟"
        columns: [Advantage, Detail]
        rows:
          - ["Speed", "More rapid fluid removal and symptom relief"]
          - ["Sodium", "Higher mass clearance of sodium"]
          - ["Electrolytes", "Less hypokalemia"]
          - ["Hormones", "No RAAS and no SNS activation"]
          - ["Cytokines", "Removed; may restore diuretic response"]
          - ["Hospital", "Shorter stay, fewer readmissions"]
          - ["Kidney", "Less worsening renal function"]
        hide: [[1, 1], [3, 1], [4, 1], [6, 1]]
      - kind: explain
        page: 74
        title: "Table 5: بس الماكينة ليها تمن"
        quote: "Air embolus Hemorrhage from venous return disconnection Hemorrhage from hollow fiber blood leak Hemorrhage complicating systemic anticoagulation"
        text: |
          - **Air embolus**
          - ==Hemorrhage== من تلات حتت: **venous return disconnection**، **hollow fiber leak**، **systemic anticoagulation**
          - **Membrane bioincompatibility** و **allergic reactions** للـ circuit
          - **Hemolysis and hyperkalemia**
          - **Catheter:** infection، stenosis، thrombosis
          - **Excess UF:** hypotension، **prerenal azotemia**، أو acute renal failure
      - kind: mnemonic
        page: 74
        quote: "Catheter-related complications (ie, infections, stenoses, thromboses)"
        word: "ABCHE"
        parts:
          - { key: "A", text: "Air embolus and allergic reactions" }
          - { key: "B", text: "Bleeding: disconnection, fiber leak, anticoagulation" }
          - { key: "C", text: "Catheter: infection, stenosis, thrombosis" }
          - { key: "H", text: "Hemolysis and hyperkalemia" }
          - { key: "E", text: "Excess UF: hypotension, prerenal azotemia, AKI (and bioincompatibility)" }
        hook: "**ABCHE**: زي ما تكون بتعطس من الماكينة. خمس حروف تجيب Table 5 كلها."
      - kind: table
        page: 74
        quote: "Dialysate cooling May lead to less myocardial stunning, less intradialytic hypotension, and less cardiac remodeling"
        title: "Table 6: عيان HF على الغسيل"
        columns: [Strategy, Benefit, Limitation]
        rows:
          - ["Longer/more frequent", "Less weight gain, slower UF", "Preference, cost"]
          - ["Cool dialysate", "Less stunning and hypotension", "Optimal temp undefined"]
          - ["Ca ≥2.5 mEq/L", "Fewer HF admissions", "Vascular calcification"]
          - ["Higher Na", "Less hypotension", "More weight gain, worse HF"]
          - ["Low-Na diet", "Less congestion", "More admissions, neurohormones"]
          - ["Midodrine", "Less hypotension, dyspnea", "Possible ↑ mortality"]
        hide: [[1, 2], [2, 2], [3, 2], [5, 2]]
      - kind: aside
        tone: trap
        page: 74
        quote: "Higher dialysate sodium Less intradialytic hypotension, resulting in better single session tolerance Increased interdialytic weight gain"
        text: |
          الفخ: **higher dialysate sodium** بيحل الـ hypotension **النهارده**، بس العيان يعطش ويشرب، فالـ ==interdialytic weight gain== يزيد والـ HF يسوء. حل جلسة وعقدة أسبوع.
      - kind: try
        items: [neph.L03.032, neph.L03.041, neph.L03.045, neph.L03.049, neph.L03.052]
    recap:
      - "BNP = stretching، cTnI = injury، KIM-1 = PCT injury، creatinine أصله العضلات."
      - "الـ diuretics: RAAS، كلى، K و Mg، hypotonic urine، resistance."
      - "الـ slow UF: صوديوم أكتر، من غير RAAS و SNS، cytokines تتشال، readmissions أقل."
      - "مضاعفات الماكينة: **ABCHE**."
      - "Table 6: الـ Na العالي = weight gain، الـ Ca ≥2.5 = calcification، الـ midodrine = mortality."
