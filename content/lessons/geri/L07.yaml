        title: "ليه الوقعة القريبة بتاخد 8؟"
        text: |
          في الـ FRAT part 1 الـ **recent falls** بتوصل لـ **8 نقط**، وباقي البنود 4 بالكتير. التفسير المقبول (مش في الكتاب): أقوى حاجة بتتنبأ بوقعة جاية هي **وقعة فاتت**، وكل ما كانت أقرب (آخر 3 شهور) أو حصلت وهو في المستشفى تحت رعاية، يبقى السبب لسه موجود.

          ومنطق باقي البنود:
          - **Medications**: الكتاب بيعدّ sedatives، anti-depressants، anti-Parkinson's، diuretics، anti-hypertensives، hypnotics. التفسير المقبول (مش في الكتاب): دول يا بيدوّخوا (sedatives، hypnotics، antidepressants)، يا بيوطّوا الضغط وهو واقف (anti-hypertensives، anti-Parkinson's)، يا بيجروه على الحمام بسرعة بالليل (diuretics). وكل دوا زيادة بيزوّد نقطة.
          - **Psychological**: القلق والاكتئاب وقلة الـ insight أو الـ judgement، خصوصًا عن الحركة: يعني بيقوم من غير ما يستنى المساعدة.
          - **Cognition** بالـ **AMTS**: كل ما قل، كل ما زادت النقط.

