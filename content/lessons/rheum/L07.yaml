      - kind: explain
        page: 112
        title: "اللاعيبة"
        quote: "In AP factor B is structurally & functionally homologous to C2. It binds to the deposited C3b,then is cleaved by active factor D, into Ba & Bb. C3bBb is the AP convertase. It is stabilized by properdin (P). C3bBbP (serine protease) then cleaves C3 to C3a and C3b. C3b then set up the feedback loop."
        text: |
          - ==Factor B==: شبه **C2**، بيمسك في الـ C3b.
          - **Factor D**: بيقطع factor B لـ **Ba** و **Bb**.
          - **C3bBb**: الـ **alternative pathway (AP) C3 convertase**.
          - **Properdin (P)**: بيثبّته، فيبقى **C3bBbP** يقطع C3 لـ C3a و C3b، والـ C3b يكمّل الـ loop.

          ليه محتاج properdin؟ التفسير المقبول (مش في الكتاب): الـ C3bBb لوحده بيتفكّك بسرعة، فالـ properdin زي **المسمار** اللي بيخلّيه يعيش كفاية يقطع C3 كتير.
      - kind: reveal
        page: 112
        quote: "In AP factor B is structurally & functionally homologous to C2."
        prompt: "قارن الـ convertase بتاع الـ classical (C4b2b) بتاع الـ alternative (C3bBb). مين بيقابل مين؟"
        answer: |
          الكتاب بيقول **factor B** شبه **C2** في التركيب والوظيفة. فالخريطة:
          - **C4b** في الـ classical ↔ **C3b** في الـ alternative: الحتة اللي قاعدة على السطح وماسكة الباقي.
          - **C2b** ↔ **Bb**: الإنزيم اللي بيقطع.
          - **C1s** (اللي بيقطع C2) ↔ **factor D** (اللي بيقطع B).

          وفي الـ alternative فيه لاعب زيادة: الـ **properdin** اللي بيثبّت الإنزيم. يعني نفس الماكينة بقطع غيار مختلفة، وده بيسهّل الحفظ جدًا.
      - kind: explain
        remind: [rheum.L07.029]
        page: 113
        title: "الفرامل: خلاياك ولا الميكروب؟"
        quote: "Factor B binds noncovalently to C3b on a cell surface and is cleaved to Bb by factor D:\n  On host cells, the complement-regulatory proteins CR1, H, MCP, and DAF bind to C3b. CR1, H, and DAF displace Bb.\n  Pathogens lack complement-regulatory proteins. Binding of properdin (factor P) may stabilize the C3bBb complex"
        text: |
          C3b بيقع على كل حاجة، بس:
          - **على خلاياك**: فيه ==complement receptor 1 (CR1) و H و MCP و decay-accelerating factor (DAF)== بيمسكوا الـ C3b ويزيحوا الـ Bb، و **factor I** يقطع الـ C3b لـ **iC3b** الخامل. مفيش activation.
          - **على الميكروب**: مفيش الـ regulators دول، فالـ **properdin** يثبّت الـ C3bBb، ويترسّب C3b كتير ← opsonization و membrane attack complex (MAC).

          يعني الـ C3b نفسه **مش بيفرّق** بين صاحب وعدو؛ اللي بيفرّق هو إن خلاياك لابسة **الفرامل** على سطحها والميكروب لأ (الكتاب: present on host cells but absent from microbes).
      - kind: aside
        remind: [rheum.L07.029]
        tone: joke
        page: 111
        quote: "Inhibitors such as factors H & I, keep the system in check. In absence of these regulators, the system fires to exhaustion, as in inherited deficiency of fluid phase regulators. AP serves as a feedback loop to amplify C3 deposition (regardless of which path deposited C3). Thus, if C3 is deposited on a target by CP or LP, the AP can enhance C3b deposition many folds."
        text: |
          الـ AP زي **ولّاعة شغّالة طول الوقت**. خلاياك لابسة بدلة ضد الحريق (DAF و MCP و CR1)، والميكروب داخل بالبيجامة.

          ولو **factor H أو I** ناقصين وراثيًا؟ الولّاعة تفضل شغالة لحد ما ==يخلص الـ C3== كله: **fires to exhaustion**.
      - kind: explain
        page: 111
        title: "ليه نقص factor H أو I بيخلّص الـ C3؟"
        quote: "In absence of these regulators, the system fires to exhaustion, as in inherited deficiency of fluid phase regulators."
        text: |
          الكتاب بيقول الـ **factors H و I** بيمسكوا الـ system، ومن غيرهم ==fires to exhaustion==، زي الـ **inherited deficiency of fluid phase regulators**.

          السبب، من الماكينة اللي فاتت: الـ C3b بيعمل convertase، والـ convertase بيعمل C3b أكتر. ده **loop** مالوش نهاية طبيعية. اللي بيقفله هو الـ factor H (يزيح الـ Bb) والـ factor I (يقطع الـ C3b لـ iC3b خامل).

          من غيرهم الـ loop يفضل يلف لحد ما **C3 يخلص من الدم**. والنتيجة الغريبة: المريض بيجيله **عدوى متكررة** مع إن المشكلة إن الـ complement "زيادة"، لأنه صرف كل الـ C3 قبل ما يحتاجه.
