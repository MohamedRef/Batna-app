      - kind: explain
        remind: [neph.L07.031]
        page: 149
        title: "الـ prognosis، والـ hematuria والـ cyst hemorrhage"
        quote: "Up to 77% of patients are alive with preserved renal function at age 50 years, and 52% at age 73. Men tend to progress to renal failure more rapidly and require renal replacement therapy at a younger age than women. Other risk factors for renal failure include Black race, diagnosis of ADPKD before age 30, first episode of hematuria before age 30, onset of hypertension before age 35, hyperlipidemia, low level of high-density lipoprotein cholesterol, sickle cell trait, and PKD1 truncating mutations.\nRecently, a post hoc analysis of the HALT PKD clinical trials showed an association of dietary sodium with the rate of kidney growth in.\nSeveral mechanisms account for renal function decline. The CRISP study confirmed that kidney and cyst volumes are the strongest predic-tors of renal functional decline.23 CRISP also found that renal blood.\nHematuria and Cyst Hemorrhage Visible hematuria may be the initial presenting symptom and occurs in up to 40% of patients with ADPKD over the course of the disease. Many have recurrent episodes. Differential diagnosis includes cyst hem-orrhage, stone, infection, and tumor. Cyst hemorrhage is a frequent complication and produces gross hematuria when the cyst communicates with the collecting system. Frequently, the cyst does not communicate with the collecting system, and flank pain without hematuria occurs. It can manifest with fever, raising the possibility of cyst infection. On occasion, a hemorrhagic cyst will rupture, resulting in a retroperitoneal bleed that can be significant, potentially requiring transfusion. In most patients, cyst hemorrhage is self-limited, resolving within 2 to 7 days. If symptoms of hematuria or flank pain last longer than 1 week or if the initial episode of hematuria occurs after age 50 years, neoplasm should be excluded."
        text: |
          ==ESRD مش حتمي==: لحد **77%** عايشين بكلية كويسة عند 50 سنة و **52%** عند 73.

          **Risk factors** للـ renal failure: **ذكر**، Black race، تشخيص أو أول hematuria **قبل 30**، hypertension **قبل 35**، hyperlipidemia و high-density lipoprotein (HDL) واطي، sickle cell trait، و **polycystin-1 gene (PKD1) truncating**.

          الـ **visible hematuria** بتحصل في لحد **40%**. الـ differential diagnosis (DD): ==cyst hemorrhage، stone، infection، tumor==.

          الـ cyst hemorrhage يعمل hematuria **بس لو الكيس متصل بالـ collecting system**؛ غير كده يبقى **flank pain بس** (وأحيانًا حرارة، فتلتبس بالـ infection). أغلبه بيخلص في **2–7 أيام**.

          ⚠ لو استمر **أكتر من أسبوع** أو أول hematuria **بعد 50**: استبعد **neoplasm**.

          ليه الـ risk factors دي بالذات؟ التفسير المقبول (مش في الكتاب): كلها بتقول إن المرض **شديد أو بدري**. الـ PKD1 truncating بيوقف البروتين خالص فالأكياس تطلع أكتر وأبدر، والـ hematuria والضغط قبل 30–35 معناهم إن الأكياس كبرت بدري. وليه نستبعد neoplasm بعد 50 أو لو النزيف طوّل؟ لأن نزيف الكيس العادي بيخلص في أيام، فاللي يطوّل أو يبدأ في سن الأورام محتاج سبب تاني.
