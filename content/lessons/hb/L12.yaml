  - id: hb.L12.lesson5
    title: "Alpha-1: الرئة والكبد في مرض واحد"
    hook: "بروتين بيتعمل في الكبد علشان يحمي الرئة. لو قلّ، الاتنين بيدفعوا التمن، وزرع الكبد بيغيّر المصنع كله."
    minutes: 8
    pages: [201, 203]
    topics: [aatd]
    goals:
      - "تقول الجين وشغل الـ AAT الطبيعي"
      - "تعرف سن الأعراض ونسبة الكبد في الأطفال والكبار"
      - "تعدّ الـ investigations وتختار كل واحد ليه"
      - "تشرح ليه الـ augmentation للرئة بس، وليه الزرع curative"
