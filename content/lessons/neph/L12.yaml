      - kind: explain
        page: 417
        title: "كل lab في الـ TMA بيقول إيه؟"
        quote: "Thrombotic microangiopathy (TMA) is characterized by microangiopathic hemolytic anemia from red blood cell fragmentation (schistocytes, increased lactate dehydrogenase, depressed haptoglobin), thrombocytopenia (platelet count 30% reduction) and end-organ damage, including AΚΙ."
        text: |
          الكتاب بيقول الأنيميا ==from red blood cell fragmentation==. التفسير المقبول (مش في الكتاب) لكل lab:

          - **Schistocytes:** كرة الدم الحمرا بتعدي في capillary فيه جلطة صغيرة، فبتتقطّع حتت.
          - **LDH عالي:** الـ LDH جوه كرات الدم، فلما تتكسر بيطلع.
          - **Haptoglobin واطي:** الـ haptoglobin بيمسك الـ hemoglobin الحر ويتشال معاه، فبيخلص.
          - **Platelets واطية:** بتتستهلك في الجلطات الصغيرة (الكتاب بيقول **30% reduction**).

          والكلية أكتر عضو بيتأذي لأنها مليانة capillaries في الـ glomerulus، وعشان كده الـ AKI غالبًا **severe** وممكن تحتاج **dialysis**.
