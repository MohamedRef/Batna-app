  - id: geri.L07.043
    kind: mcq
    topic: mobility
    stem: What is the purpose of the "Get Up and Go Test" in falls assessment?
    options:
      - To measure bone density
      - To evaluate gait speed and balance
      - To diagnose osteoporosis
      - To assess dietary habits
      - To screen for cognitive impairment
    answer: 1
    why:
      - Bone density needs DXA, not a walking test.
      - "Correct: the timed up and go is one of the simple tests for walking and balance (p112, p113)."
      - Osteoporosis is diagnosed by bone density, not by walking.
      - Diet is covered in the nutritional assessment.
      - Cognition has its own screening tools.
    src: { page: 112, quote: "Simple tests for walking and balance i. Timed up and go test" }
    status: unverified
    tags: [book-question]
