      - kind: aside
        tone: analogy
        page: 192
        quote: "antiviral therapy should be considered if HBV replication is present (HBVDNA +ve)."
        text: |
          الكبد الجديد شقة جديدة والفيروس حرامي من الحتة القديمة.

          - الـ antiviral زي entecavir بيقفل المصنع اللي بيطلّع حرامية، يعني الـ replication.
          - الـ ==HBIg== هو البواب: أجسام مضادة جاهزة بتمسك أي فيروس واقف على الباب قبل ما يدخل الـ graft.

          قفلين أحسن من قفل واحد، خصوصًا في السنة الأولى.
      - kind: explain
        page: 193
        quote: "We do accept HBcIgG positive donors in case recipient's HBcIgG is positive and recipient accepts lifelong prophylaxis."
        title: "الـ donor والـ anti-HBc"
        text: |
          - All donors should be vaccinated ضد HBV.
          - البرنامج بيقبل ==HBcIgG positive donor==، بشرط إن الـ recipient كمان HBcIgG positive، ويقبل ==lifelong prophylaxis==.

          - **Anti-HBc** أو HBcIgG: أجسام مضادة معناها إن الشخص اتعرّض للفيروس قبل كده، حتى لو خف.

          ليه الشرط ده؟ كبد الـ donor اللي عنده anti-HBc ممكن يكون شايل فيروس نايم جوه خلاياه. أول ما يتزرع في جسم بياخد immunosuppression، الفيروس ممكن يصحى. فالـ recipient لازم يبقى على حماية طول عمره. (منطق مقبول، الكتاب كاتب الشرط بس.)
      - kind: check
        page: 192
        quote: "HBIg is given IM 4000 IU intraoperative and 2000IU daily postoperative for one week till reaching HBsAb level >300-500."
        question: "In the book's protocol, how is HBIg given during the first postoperative week?"
        options:
          - "2000 IU daily until anti-HBs exceeds 300-500"
          - "4000 IU daily for one week"
          - "2000 IU weekly"
          - "Monthly, to keep anti-HBs about 300"
        answer: 0
        why:
          - "صح: بعد الـ **4000 IU IM intraoperative**، بيبقى **2000 IU daily** أسبوع لحد ما الـ HBsAb يعدّي 300-500."
          - "الـ 4000 IU جرعة واحدة وقت العملية بس."
          - "الـ weekly ده لباقي الشهر الأول، بعد الأسبوع الأول."
          - "الـ monthly بيبدأ بعد الشهر الأول، ولحد سنة."
      - kind: explain
        page: 193
        quote: "Phlebotomies should be continued for life with the frequency of maintenance therapy dependent on serum ferritin level."
        title: "Hemochromatosis و PBC"
        text: |
          **HHC**، يعني hereditary hemochromatosis، حسب AASLD:

          - أي مريض عنده iron overload نشجعه بقوة على ==regular phlebotomies==، لحد ما الـ iron stores تخلص.
          - وبعدين phlebotomy for life.
          - والـ maintenance frequency حسب الـ **serum ferritin**.

          ليه الفصد؟ لأن كل كيس دم بيطلّع حديد معاه، والجسم مالوش طريق تاني يتخلص بيه من الحديد الزيادة. ده الدرس الجاي في L12.

          **PBC**: أي مريض PBC عنده abnormal liver enzymes يتفكّر له في specific therapy. الـ **UDCA**:

          - بيحسّن الـ biochemical markers of cholestasis بشكل واضح
          - بيبطّأ الـ progression
          - بس مش بيخلّص المرض: no resolution
          - الجرعة: ==13-15 mg/kg==، single أو divided
      - kind: update
        page: 193
        quote: "Primary Biliary Cirrhosis All patients with PBC with abnormal liver enzyme levels should be considered for specific therapy."
        text: |
          الكتاب بيقول **Primary Biliary Cirrhosis**. الاسم اتغيّر رسميًا لـ **Primary Biliary Cholangitis** (نفس الاختصار PBC) لأن معظم المرضى مش بيوصلوا cirrhosis. نفس المرض، نفس الجرعة.
        ref: "EASL PBC guideline 2017 (renaming 2015)"
      - kind: explain
        page: 193
        quote: "PSC, with or without ulcerative colitis, is the most common known predisposing factor for cholangiocarcinoma."
        title: "PSC: خلّي عينك على الـ cholangiocarcinoma"
        text: |
          - **PSC**: التهاب مزمن بيعمل تليّف وضيق في القنوات المرارية جوه وبرّه الكبد، وغالبًا ماشي مع ulcerative colitis.
          - **Cholangiocarcinoma**: سرطان القنوات المرارية.

          الربط بينهم: الـ PSC، مع أو من غير ulcerative colitis، هي ==the most common known predisposing factor for cholangiocarcinoma==. القنوات ملتهبة سنين، والالتهاب المزمن بيمهّد للورم.

          - علشان كده لازم regular screening.
          - الـ **CA 19-9** عالي في لحد 85% من الـ cholangiocarcinoma.
          - في الـ PSC: CA 19-9 > 100 U/mL ليه sensitivity 75% و specificity 80%.
          - ومع ده كله: early diagnosis is extremely challenging.

          وافتكر إن الـ cholangiocarcinoma من الـ CASH CASH. يعني لو الورم اتكشف متأخر، باب الزرع اتقفل. علشان كده الـ screening هنا مهم جدًا.
      - kind: reveal
        page: 193
        quote: "It has been reported that a CA 19-9 value greater than 100 U/mL has a sensitivity of 75 % and"
        prompt: "Sensitivity 75% و specificity 80%... يعني إيه ده عمليًا لمريض الـ PSC قدامك؟"
        answer: |
          - **Sensitivity 75%**: من كل 4 عندهم cholangiocarcinoma، واحد هيطلع الـ CA 19-9 بتاعه أقل من 100. يعني رقم طبيعي ==مش بيطمّنك==.
          - **Specificity 80%**: من كل 5 من غير ورم، واحد هيطلع عنده أعلى من 100. ممكن من الـ cholangitis أو الـ obstruction، وده تفسير مقبول.

          علشان كده الكتاب بيقول التشخيص المبكر extremely challenging حتى مع الـ marker. الرسمة الجاية بتوريك ده.
