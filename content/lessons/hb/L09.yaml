  - id: hb.L09.lesson3
    title: "البزل بيقولك إيه؟ SAAG وأصحابه"
    hook: "سرنجة مية واحدة بتقولك السبب، وفيه عدوى ولا لأ، وفيه ورم ولا لأ."
    minutes: 9
    pages: [149, 151]
    topics: [diagnosis]
    goals:
      - "تعرف إمتى تعمل diagnostic paracentesis"
      - "تقرا الـ ascitic fluid analysis: cells، protein، SAAG، LDH"
      - "تعرف الـ special tests والـ prognosis"
    status: unverified
    steps:
      - kind: explain
        page: 149
        quote: "Sonography can also easily assess for free fluid as little as 100 m of ascites."
        title: "التشخيص: من الكشف للسونار"
        text: |
          إزاي نكتشف المية أصلًا؟
          - **الكشف**: الكشف الكويس بيلاقي الـ free fluid، بس محتاج كمية كبيرة زي ما قلنا (1–2 لتر).
          - ==Sonography==: بتشوف لحد 100 mL بس، فهي الأحسن للكميات الصغيرة. (الكتاب كاتبها «100 m»، والمقصود mL.)
          - **CT**: مش روتيني. بنطلبه بس لو فيه مشكلة في الـ differential diagnosis، زي الشك في ورم.

          بعد ما نتأكد إن فيه مية، السؤال الأهم: المية دي جت منين؟ وده اللي البزل هيقوله.
      - kind: explain
        page: 150
        quote: "A diagnostic paracentesis of ascites at the time of first presentation of grades 2 and 3"
        title: "مين يتبزل؟ وإيه اللي نطلبه؟"
        text: |
          **Diagnostic paracentesis** بنعمله في حالتين:
          - عند أول ظهور لـ grade 2 أو 3.
          - لما نشك في complication، زي الـ **SBP**.

          **Biochemical analysis**، وكل بند بيجاوب سؤال:
          - **Appearance**: transparent، tinged yellow، hemorrhagic، أو chylous. لون المية أول خيط.
          - ==Cell count + differential==: فيه عدوى؟ PMN ≥250/mm³ = SBP. ولو **lymphocytes** هي الغالبة فكّر في TB.
          - **Total protein**: واطي (<1.5 g/dL) في الـ cirrhosis، وعالي (>2.5 g/dL) في الـ heart failure والـ malignant ascites.
          - **Albumin**: علشان نحسب الـ ==SAAG==.
          - **LDH**: عالي في الـ malignant ascites.

          **Culture**: 10–20 mL في زجاجتين blood culture (aerobic و anaerobic)، ==at the bedside==.

          **Cytology**: بندوّر على malignant cells. بس خلي بالك: الـ normal peritoneal epithelial cells ممكن تشبه الـ malignant cells، فيحصل over-diagnosis للكانسر.
      - kind: reveal
        page: 150
        quote: "should be inoculated into two [aerobic and anaerobic] blood culture bottles at the bedside."
        prompt: "ليه نحط الـ ascitic fluid في blood culture bottles جنب السرير بدل ما نبعته في أنبوبة؟"
        answer: |
          الكتاب بيقول ده هو الصح (**inoculated at the bedside**). والسبب العملي إن عدد البكتيريا في الـ ascites قليل جدًا، فالـ inoculation الفوري في bottles بيزوّد فرصة إن الـ culture تطلع positive.
      - kind: figure
        page: 150
        quote: "If SAAG is ≥ 1.1 g/dl (High SAAG), ascites is most likely due to portal hypertension"
        title: "تقرا الـ SAAG إزاي"
        alt: "SAAG equals serum albumin minus ascitic albumin. At or above 1.1 g/dL means portal hypertension; below 1.1 means a non-portal-hypertension cause. Below that, total protein under 1.5 g/dL fits cirrhosis and above 2.5 g/dL fits heart failure or malignancy. A box notes that portal hypertension plus a second cause still gives a SAAG of 1.1 or more."
        caption: "الـ SAAG بيقيس الضغط، والـ total protein بيقيس الغشاء: في الـ cirrhosis الـ sinusoids اتعملها capillarization فبتمسك البروتين، فالمية فقيرة. في الـ cardiac الـ sinusoids طبيعية وبتسرّب بروتين، فالمية غنية."
