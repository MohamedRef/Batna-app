        quote: "Ocular\n  Episcleritis: red- painless-begnin-no discharge.\n  Scleritis: red- painful may lead to uveitis-secondary glaucoma –visual impairment.\n  Scleromalacia: painless bilateral thinning-blue colour of underling choroid.\n  Corneal melting; pain - redness - blurred vision - thining -perforation.\n  Sjogren's syndrome."
        text: "قاعدة سريعة: عين حمرا **مش بتوجع** = episcleritis (اطمّن). عين حمرا **بتوجع** = **scleritis**، ودي ممكن تاخد النظر (uveitis، glaucoma)."
