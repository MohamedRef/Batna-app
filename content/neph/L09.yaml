  - id: neph.L09.086
    kind: card
    topic: pd-principles
    front: What are the transport mechanisms of PD, and what drives UF and solute transport?
    back: Diffusion, convection and osmosis; the driving force is the osmotic gradient. After a dwell, the effluent is drained and replaced by fresh dialysate.
    src: { page: 311, quote: "Diffusion, convection, Osmosis uraemic toxins and solutes within the blood compartment will diffuse from the peritoneal micro-circulation across the peritoneal membrane into the dialysis fluid (dialysate) within the peritoneal cavity either down a concentration gradient or by convection. After a dwell time the fluid (effluent) is then drained out, to be replaced by fresh dialysate. The driving force for UF and solute transport is generated by the smotic gradient. The barriers against this force are the cited anatomic structures." }
    status: unverified
