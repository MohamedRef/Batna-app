  - id: rheum.L06.lesson1
    title: "جيشين: innate و adaptive"
    hook: "جيش واقف على الحدود من يوم ما اتولدت، وجيش متخصص بياخد 3–5 أيام يجهّز. الاتنين لازم يتكلموا مع بعض."
    minutes: 9
    pages: [83, 85]
    topics: [organs, innate]
    goals:
      - "تعرف أعضاء الـ lymphoid system وليه الـ MALT قاعد على الأبواب"
      - "تفرّق بين الـ innate والـ adaptive immunity (سؤال كتاب)"
      - "تفهم ليه الـ adaptive بياخد 3–5 أيام، والـ innate بيسدّ الفترة دي"
    status: unverified
    steps:
      - kind: figure
        page: 83
        quote: "Gut-associated Peyer's patches lymphoid tissue (GALT)"
        title: "خريطة الجيش في الجسم (شكل الكتاب ص 83)"
        image: { file: rheum/L06-lymphoid-organs.webp, book: true }
        alt: "Book figure of a human body with the lymphoid organs in pink: naso-pharyngeal and tonsillar lymph nodes, bronchial lymph nodes (together labelled mucosa-associated lymphoid tissue, MALT), peripheral lymph nodes in the neck and axilla, the thymus behind the sternum, the spleen, Peyer's patches in the small intestine (gut-associated lymphoid tissue, GALT) and the bone marrow in the femur."
        caption: |
          أول صفحة في المحاضرة خريطة: الـ **bone marrow** و الـ **thymus** (فين الخلايا بتتولد وبتتعلّم)، والـ **spleen** والـ **peripheral lymph nodes** (فين بتقابل العدو).

          وفيه مجموعة متجمّعة على الأبواب اسمها ==mucosa-associated lymphoid tissue (MALT)==: **naso-pharyngeal** و **tonsillar** و **bronchial lymph nodes**، و في الأمعاء الـ **Peyer's patches** = **gut-associated lymphoid tissue (GALT)**.
      - kind: reveal
        page: 83
        quote: "Gut-associated Peyer's patches lymphoid tissue (GALT)"
        prompt: "بص على الخريطة: ليه الـ MALT متجمّع في الأنف واللوز والشعب الهوائية والأمعاء بالذات؟"
        answer: |
          التفسير المقبول (مش في الكتاب): دي **الأبواب** اللي الميكروبات بتدخل منها: الهوا اللي بتتنفسه، والأكل اللي بتبلعه. فالجسم حاطط **نقط تفتيش** عند كل باب، بدل ما يستنى العدو يوصل الدم.

          عشان كده الـ **tonsils** بتكبر مع التهاب الزور، والـ **Peyer's patches** قاعدة في الـ small intestine اللي بيعدّي عليها كل الأكل.
      - kind: explain
        remind: [hem.L04.lesson1:NLMEB]
        page: 84
        title: "منين بييجي الجيش؟"
        quote: "Pluripotent stem cell → Erythrocytes, Platelets\nGranulocyte/monocyte (myeloid) lineage:\n  Granulocyte precursor → Neutrophil, Eosinophil, Basophil (mature blood forms); Mast cell (mature tissue form)\n  Monoblast → Monocyte → Macrophage, Alveolar macrophage, Mesangial cell, Kupffer cell, Osteoclast\n? → Dendritic cell → Follicular dendritic cells\nLymphocyte (lymphoid) lineage:\n  pre-B lymphocyte → B lymphocyte → Plasma cell\n  pre-T lymphocyte → Thymus → T lymphocyte\n  Natural killer cell, Large granular lymphocyte"
        text: |
          كله بيبدأ من **pluripotent stem cell** في الـ bone marrow، وبيتفرّع لخطين:

          - ==myeloid lineage==: neutrophils و eosinophils و basophils و mast cells و **monocytes**، والـ monocyte بيبقى **macrophage** في الأنسجة.
          - **lymphoid lineage**: **B cells** وبتبقى **plasma cells**، و **T cells** وبتعدّي على الـ **thymus**، و **natural killer (NK) cells**.

          والـ **lymphoid tissue** متوزّع في الـ lymph nodes والـ **mucosa-associated lymphoid tissue (MALT)**، زي الـ tonsils والـ bronchial nodes والـ **Peyer's patches** في الـ gut-associated lymphoid tissue (GALT).
      - kind: table
        page: 85
        quote: "Physical barriers Skin, mucous membranes Mucosal immune system Circulating factors Complement, CRP Antibody Cells Macrophages, Neutrophils Lymphocytes Natural killer Cell derived mediators Monokines (IL1, TNF, IL12, Lymphokines Interferons)"
        title: "الجيشين جنب بعض"
        columns: [Component, Innate, Adaptive]
        rows:
          - ["Barriers", "Skin, mucous membranes", "Mucosal immune system"]
          - ["Circulating", "Complement, CRP", "Antibody"]
          - ["Cells", "Macrophages, neutrophils, NK", "Lymphocytes"]
          - ["Mediators", "Monokines: IL-1, TNF, IL-12, IFN", "Lymphokines"]
        hide: [[1, 1], [1, 2], [2, 1], [2, 2]]
      - kind: sort
        page: 85
        quote: "Natural (Innate). Acquired (specific/Adaptive) immunity. Immunity. Specific response. None specific. Acquired from exposure. Present at birth. Increases in intensity with exposure. Does not change in intensity with infection. Protect from bacteria viruses and protozoa. Protects from bacteria fungi and worms. Cells:lymphocytes. Cells: macrophage, neutrophils, natural killer Circulating factors:antibodies, lymphokines. cells. Circulating factors:"
        prompt: "innate ولا adaptive؟"
        bins: ["Innate", "Adaptive"]
        cards:
          - { text: "Present at birth", bin: 0 }
          - { text: "Non-specific", bin: 0 }
          - { text: "Same intensity with every infection", bin: 0 }
          - { text: "Protects from fungi and worms", bin: 0 }
          - { text: "Acquired from exposure", bin: 1 }
          - { text: "Increases in intensity with exposure", bin: 1 }
          - { text: "Protects from viruses and protozoa", bin: 1 }
          - { text: "Lymphokines", bin: 1 }
        why: "الـ innate موجود من الولادة، مش specific، ومش بيقوى مع التكرار. الـ adaptive بيتعلّم: specific وبيقوى مع كل exposure. والبكتيريا الاتنين بيحموا منها."
      - kind: aside
        tone: analogy
        page: 85
        quote: "IIS is activated immediately and can rapidly control the replication of the infecting organism until the clonal expansion of the lymphocytes of the acquired immune system that takes 3-5 days can deal with it."
        text: |
          الـ ==innate== زي **الأمن المركزي** على باب القسم: موجود دايمًا، بيضرب أي حد غريب فورًا، بس مش بيعرف الأسامي.

          الـ **adaptive** زي **المباحث**: بتاخد **3–5 أيام** تعمل التحريات (clonal expansion)، بس لما تمسك المتهم بتمسكه هو بالظبط، وبتفتكره المرة الجاية.
      - kind: explain
        page: 85
        title: "ليه الـ adaptive بياخد 3–5 أيام؟"
        quote: "IIS is activated immediately and can rapidly control the replication of the infecting organism until the clonal expansion of the lymphocytes of the acquired immune system that takes 3-5 days can deal with it."
        text: |
          الكتاب بيقول الـ ==innate immune system (IIS)== بيشتغل **immediately**، ويمسك تكاثر الميكروب لحد ما الـ **clonal expansion** بتاع الـ lymphocytes يخلص في **3–5 أيام**.

          يعني إيه clonal expansion؟ التفسير المقبول (مش في الكتاب):
          - كل lymphocyte عليها receptor لـ antigen **واحد بس**، فاللي يعرف الميكروب ده بالذات **عدد قليل جدًا** من الخلايا.
          - لازم الخلايا القليلة دي **تتقسم مرات كتير** (clone) لحد ما تبقى جيش كفاية، وده بياخد أيام.

          وفي الفترة دي لو مفيش حد ماسك الحدود، الميكروب هيتضاعف براحته. فالـ innate مش "الجيش الأضعف"، هو اللي **بيشتري وقت**. وكمان الكتاب بيقول إنه **interacts with and controls** الـ adaptive، وده اللي هنشوفه في الدرس الجاي.
      - kind: reveal
        page: 85
        quote: "Increases in intensity with exposure."
        prompt: "ليه الـ adaptive بيقوى مع كل exposure، والـ innate بيفضل زي ما هو؟"
        answer: |
          الكتاب بيقول الـ adaptive **increases in intensity with exposure**، والـ innate **does not change in intensity with infection**.

          السبب (هتلاقيه في نفس المحاضرة ص 94): لما الـ B cell تقابل الـ antigen بتطلّع **memory cells**، ودي اللي بتعمل الـ **secondary immune response** أسرع وأقوى المرة الجاية. الـ innate ما عندوش memory cells، فبيرد بنفس الشكل كل مرة.

          وده نفس منطق **التطعيم**: بتعرّف الـ adaptive على العدو من غير المرض، فيبقى جاهز.
      - kind: check
        page: 85
        quote: "Natural (Innate). Acquired (specific/Adaptive) immunity. Immunity. Specific response. None specific. Acquired from exposure. Present at birth. Increases in intensity with exposure. Does not change in intensity with infection. Protect from bacteria viruses and protozoa. Protects from bacteria fungi and worms. Cells:lymphocytes. Cells: macrophage, neutrophils, natural killer Circulating factors:antibodies, lymphokines. cells. Circulating factors:"
        question: "Which belongs to innate immunity?"
        options: ["Present at birth, unchanged by repeated infection", "Increases in intensity with exposure", "Mediated by antibodies and lymphokines", "Needs 3–5 days of clonal expansion"]
        answer: 0
        why:
          - "صح: الـ innate من الولادة ومش بيتغيّر مع العدوى."
          - "ده الـ adaptive: بيقوى مع التكرار."
          - "الـ antibodies والـ lymphokines adaptive."
          - "الـ clonal expansion في 3–5 أيام دي بتاعة الـ adaptive."
      - kind: try
        items: [rheum.L06.001, rheum.L06.004, rheum.L06.005, rheum.L06.006, rheum.L06.087]
    recap:
      - "MALT على الأبواب: naso-pharyngeal و tonsillar و bronchial nodes، و GALT = Peyer's patches."
      - "Innate: من الولادة، non-specific، complement و CRP، macrophages و neutrophils و NK، monokines."
      - "Adaptive: specific، بيقوى مع الـ exposure (memory)، antibodies و lymphocytes."
      - "الـ clonal expansion بياخد 3–5 أيام، والـ innate بيمسك الميكروب لحد ما يخلص."
    practice: [rheum.L06.001, rheum.L06.002, rheum.L06.003, rheum.L06.004, rheum.L06.005, rheum.L06.006, rheum.L06.007, rheum.L06.008, rheum.L06.087]
