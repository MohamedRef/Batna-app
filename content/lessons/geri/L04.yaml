        page: 82
        quote: "Pharmacological Treatment\n  Antidepressants, preferably SSRI's:\n    Effective among the elderly.\n    Generally less toxic than older medications.\n    60-80% respond to medications if prescribed according to guidelines.\n    Full benefit takes 4-6 weeks; half of patients respond to first prescribed med.\n    Meds should be continued at least 6 months because patients are at risk for relapse for up to 2 years or indefinitely.\n    In U.S., about a third of patients discontinue Ads within 6 weeks; less than one-half achieve therapeutic doses."
