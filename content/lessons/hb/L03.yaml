        quote: "Natural History of Esophageal Varices\n| Stage | Rate | Prevention |\n|---|---|---|\n| No Varices (~ 50%) | 4-5% per year | Preventing Variceal Formation |\n| Varices (~ 50%): Small | <10% risk bleeding at 2y; 12% per year (small → large) | Preventing Variceal Growth |\n| Varices (~ 50%): Large | >25% risk bleeding at 2y | Preventing First Bleeding |\n| Variceal Bleeding | | Treating acute bleeding; Preventing Rebleeding |\n| Variceal Rebleeding | 63% risk at 2y | |"
