      - kind: explain
        page: 42
        quote: "Tophi by clinical exam or imaging study. Frequent attacks of gouty arthritis (22 attacks/yr). CKD stage 2 or worse. Past urolithiasis."
        title: "إمتى الـ ULT؟"
        text: |
          أي مريض gout مؤكد ومعاه واحدة من:

          - ==Tophi== (فحص أو imaging).
          - **2 نوبات أو أكتر في السنة**.
          - **CKD stage 2 or worse**.
          - **Past urolithiasis**.
