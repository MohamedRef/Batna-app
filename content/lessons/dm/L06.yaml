    title: "النبض والـ ABI وضغط باطن الرجل"
    hook: "النبض الموجود مش بيطمّنك، والـ ABI بيقولك الحقيقة. وباطن الرجل ليه خريطة ألوان."
    minutes: 8
    pages: [70, 72]
    topics: [vascular, pressure]
    goals:
      - "تفسر النبض والـ ABI بجدول المحاضرة دي"
