  # ---------- p364-365: fertility and sexual function in CKD ----------
  - id: neph.L11.079
    kind: card
    topic: ckd-fertility
    front: How does CKD affect female reproductive function?
    back: It disrupts the hypothalamic-gonadal axis, causing irregular cycles, anovulation, low libido and impaired fertility.
    src: { page: 364, quote: "Fertility and Chronic Kidney Disease Women with chronic kidney disease experience disruption of the hypothalamic- gonadal axis that leads to irregularity in the menstrual cycle, anovulation, decreased libido, and impaired fertility. Women on maintenance dialysis, especially with amenorrhea, have high serum prolactin because of impaired kidney clearance, increased luteinizing hormone and follicular stimulating hormone, and decreased estradiol and progesterone concentration. The persistently elevated gonadotropins because of loss of negative feedback on hypothalamic and pituitary centers and absence of luteinizing hormone surge leads to anovulation.(27) Of importance, there is restoration of hormones such as gonadotropins and prolactin after kidney transplantation, suggesting that the underlying cause of the hormonal imbalances with kidney failure is related to the dysfunction of the kidneys rather than permanent damage to the hypothalamic- pituitary-ovarian axis.(28)" }
    status: unverified
