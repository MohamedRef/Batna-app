          - أشهر scores: **International Prognostic Scoring System (IPSS)** و **Dynamic International Prognostic Scoring System (DIPSS)** و **DIPSS-plus**.
          - **CALR**: ==fewer thrombotic events but more myelofibrotic transformation==.
          - طفرات **worse prognosis**: **ASXL-1، enhancer of zeste homologue 2 (EZH2)، isocitrate dehydrogenase 1 (IDH1)/2، serine/arginine-rich splicing factor 2 (SRSF2)**.
