        title: "Hyperglycemia: نوعين"
        quote: "When the blood glucose level reaches above the renal threshold of the individual, which is on average 180mg/dl, it causes symptoms of increased Urination (polyuria) and thirst (polydipsia)."
        text: |
          الـ **hyperglycemia** = سكر الدم فوق الطبيعي. وهي يا إما **symptomatic** يا إما **asymptomatic**.

          بتبقى **symptomatic** لما السكر يعدّي ==renal threshold== (في المتوسط **180 mg/dl**)، فيبدأ **polyuria** و **polydipsia**.

          أشهر سبب: **Diabetes mellitus (DM)، خصوصًا type 1**.

          ليه 180 بالذات؟ التفسير المقبول (مش في الكتاب): الـ tubules بترجّع كل السكر اللي بيتفلتر لحد سقف معين، زي إسفنجة بتمتص لحد ما تتشبع. لما السكر يعدّي السقف ده، الزيادة تنزل في البول وتسحب معاها ميه. والكتاب نفسه بيقول إن الـ threshold **of the individual**، يعني بيختلف من حد للتاني، وده هيرجع لنا في الـ glycosuria.
