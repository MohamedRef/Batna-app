  - id: neph.L09.lesson5
    title: "الـ peritoneal dialysis: البطن كفلتر"
    hook: "متر مربع واحد من الـ peritoneum، شوية سكر، وصبر. ده كل الـ PD."
    minutes: 10
    pages: [311, 318]
    topics: [pd-principles, pd-solutions, pd-types, pd-complications]
    goals:
      - "تفهم الـ peritoneum كغشا والـ three-pore model"
      - "تعرف محاليل الـ PD: glucose و icodextrin و amino acids"
      - "تعرف CAPD و APD والـ PET والمضاعفات ومين ما يعملش PD"
    status: unverified
    steps:
      - kind: explain
        page: 311
        title: "الغشا"
        quote: "The size of the peritoneum is one square metre"
        text: |
          الـ peritoneum حوالي ==1 m²==، وده صغير جنب فلتر الـ HD. والـ **visceral part** بس (10–15%) هو اللي بيشتغل، بس الـ microvilli بتكبّره **40 مرة**. وفي أول أسابيع الـ PD بيخسر microvilli و mesothelial cells.

          **الطريقة**: diffusion و convection و ==osmosis==. المحلول يقعد (dwell)، يتصرف (effluent)، وييجي غيره. الـ **osmotic gradient** هو اللي بيسحب المية والـ solutes.
      - kind: table
        page: 312
        quote: "Aquaporins allows water but not of solutes with radii exceeding 5"
        title: "الـ three-pore model"
        columns: [Pore, What passes]
        rows:
          - ["Small pores (SPT)", "Water + small solutes"]
          - ["Aquaporins (FWT)", "Free water only"]
          - ["Large pores (LPT)", "Macromolecules, occasional"]
        hide: [[1, 1], [2, 1]]
      - kind: explain
        page: 313
        title: "المحلول والسكر"
        quote: "IP GLUCOSE: carbohydrate load: Truncal fattness, Dyslipidemia."
        text: |
          محلول الـ PD شبه الـ interstitial fluid بس ==hypertonic== للبلازما علشان يسحب مية. فيه **lactate** 35–40 كـ buffer، و glucose 1.5–4.25 g/dL، و **pH 5.2–5.5**.

          العيان بيمص ==100–300 g glucose في اليوم== (30–100 kg في السنة!). النتيجة: تغيّر في الـ peritoneum، hyperglycaemia و superoxide، truncal obesity و dyslipidaemia، insulin resistance، new-onset diabetes، و CV disease. والـ glucose من البطن بيعمل hyperglycaemia و hyperinsulinaemia **أطول** من اللي بالبُق.
      - kind: aside
        tone: joke
        page: 313
        quote: "PD patients absorb from 100 -300 Glucose g/d. About 30-100 Kg/year"
        text: |
          30–100 kg سكر في السنة. يعني عيان الـ PD بياكل جوال سكر من غير ما يفتح بُقه 😄 علشان كده لازم بدايل.
      - kind: table
        page: 314
        quote: "Icodextrin is a gluose polymer, Molecular WT 16,500 7.5% solution"
        title: "البدايل الـ biocompatible"
        columns: [Fluid, Best use]
        rows:
          - ["7.5% icodextrin", "Long dwell; peritonitis, lost UF, diabetics"]
          - ["1.1% amino acids", "Malnutrition; watch urea and acidosis"]
        hide: [[0, 1], [1, 1]]
      - kind: reveal
        page: 314
        quote: "Osmolality 285 mOsm/Kg of water (act as a colloid) Absorption 10-20% of"
        prompt: "ليه الـ icodextrin بيفضل يسحب مية في الـ long dwell والـ glucose لأ؟"
        answer: "الـ glucose صغير، فبيتمص وبعد ساعات الـ gradient يختفي والمية ترجع. الـ ==icodextrin== polymer كبير (MW 16,500) بيشتغل زي **colloid**، بيتمص منه 10–20% بس في 8–12 ساعة، فالسحب مستمر."
      - kind: explain
        page: 315
        title: "الـ catheter والأنواع"
        quote: "tunnelled segment with 2 Dacron cuffs at the ends to anchor the catheter and prevent bacterial migration"
        text: |
          **Tenckhoff** silicone بـ 3 أجزاء: intraperitoneal مخرّم، tunnelled فيه ==2 Dacron cuffs== (تثبيت ومنع البكتيريا)، و extraperitoneal. الطرف في الـ **pelvis**، والـ exit site بعيد عن الـ midline بكام سنتي.

          التركيب: surgical، laparoscopic، blind Seldinger، أو fluoroscopy.

          **الأنواع**: ==CAPD== (يدوي) و **APD** (cycler): **NIPD** (البطن ناشفة بالنهار) و **CCPD** (مبلولة بالنهار).
      - kind: figure
        page: 316
        title: "NIPD و CCPD و CAPD في اليوم"
        image: { file: neph/L09-pd-regimens.webp, book: true }
        caption: "البرتقالي = exchanges قصيرة، والأخضر = dwell طويل. الـ **NIPD** ليل بس والنهار ناشف، الـ **CCPD** ليل بالـ cycler ونهار مبلول، والـ **CAPD** dwell طويل بالليل و 3 بالنهار."
        alt: "Book figure of peritoneal volume over 24 hours: NIPD has four short night exchanges and an empty day; CCPD has four short night exchanges and one long day dwell; CAPD has one long night dwell and three day exchanges."
      - kind: explain
        page: 317
        title: "الكفاية والـ PET"
        quote: "The ratio of solute concentrations in dialysate and plasma (D/P ratio) at specific times"
        text: |
          الهدف: ==Kt/V urea 2== أسبوعيًا و **creatinine clearance 60 L**/أسبوع/1.73 m² في الـ CAPD، وأعلى شوية في الـ APD. بيعتمد على عدد وحجم وقوة الـ exchanges والـ dwell time.

          الـ ==PET== بيقيس سرعة الـ equilibration بالـ **D/P ratio**:
          - **Fast transporter**: exchanges أكتر و dwell أقصر (cycler).
          - **Low transporter**: حجم أكبر (3 لتر بدل 2.5).

          الـ technique survival كانت 30–50% في 5 سنين. الفشل: **UF failure**، clearance مش كفاية، و **peritonitis**. والـ PD بيكسب بدري (residual renal function).
      - kind: check
        page: 317
        quote: "the patients with fast transport properties can intensify their regime preferentially"
        question: "Fast transporter on PET, poor UF on long dwells. Best change?"
        options:
          - "More exchanges, shorter dwells (cycler)"
          - "Longer dwells"
          - "Bigger 3 L bags only"
          - "Stop PD now"
        answer: 0
        why:
          - "صح: الـ fast transporter بيخسر الـ glucose gradient بسرعة، فالـ dwell القصير أحسن."
          - "الـ dwell الطويل هيرجّع المية للدم."
          - "ده للـ low transporter."
          - "الكتاب بيغيّر الـ regimen الأول."
      - kind: explain
        page: 318
        title: "المضاعفات ومين ما يعملش PD"
        quote: "Contraindication for PD: No absolute but extracorporeal is preferred if"
        text: |
          **المضاعفات**: mechanical (hernia، leaks، امتلاء البطن، إمساك، malposition)، ==peritonitis== و exit-site و tunnel infection، metabolic (سمنة، lipids، فقد بروتين)، وتلف الغشا (sclerosis).

          **مفيش contraindication مطلق**، بس الـ HD أحسن لو: chronic respiratory insufficiency، drains أو stoma، intestinal obstruction، عمليات بطن كتير، peritoneal malignancy، hernia كبيرة، cellulitis في جدار البطن، morbid obesity، و hypercatabolism.

          **Non-renal**: heart failure مقاوم، hypothermia شديدة، hyperuricaemia، hypercalcaemia شديدة، وأطفال الـ HD صعب عليهم.
      - kind: try
        items: [neph.L09.094, neph.L09.100, neph.L09.101, neph.L09.104, neph.L09.109]
    recap:
      - "Peritoneum 1 m²، الـ visceral 10–15% بس؛ الـ osmotic gradient بيسحب."
      - "Three pores: small، aquaporins (مية بس)، large."
      - "PD fluid hypertonic، lactate، pH 5.2–5.5؛ 100–300 g glucose في اليوم."
      - "Icodextrin للـ long dwell و peritonitis و diabetics؛ amino acids للـ malnutrition."
      - "Kt/V 2 و CrCl 60 L/أسبوع؛ fast transporter = dwells أقصر، low = حجم أكبر."
      - "HD أحسن مع stoma، عمليات كتير، hernia، obesity، respiratory failure."
    practice: [neph.L09.084, neph.L09.085, neph.L09.086, neph.L09.087, neph.L09.088, neph.L09.089, neph.L09.090, neph.L09.091, neph.L09.092, neph.L09.093, neph.L09.094, neph.L09.095, neph.L09.096, neph.L09.097, neph.L09.098, neph.L09.099, neph.L09.100, neph.L09.101, neph.L09.102, neph.L09.103, neph.L09.104, neph.L09.105, neph.L09.106, neph.L09.107, neph.L09.108, neph.L09.109, neph.L09.110, neph.L09.111, neph.L09.172, neph.L09.177]
