  - id: hb.L20.lesson6
    title: "قبل العملية، بعد الزرع، وفي الـ ICU"
    hook: "جدول أرقام واحد يلم كل التارجتس، وليه نوقف الأكل 48–72 ساعة بعد النزيف."
    minutes: 10
    pages: [416, 418]
    topics: [surgery-lt, critical]
    goals:
      - "تحفظ تارجتس الطاقة والبروتين في كل موقف"
      - "تعرف التغذية بعد الـ LT ومشاكلها"
      - "تتعامل مع الـ critically ill والـ GI bleeding"
    status: unverified
    steps:
      - kind: explain
        page: 416
        title: "قبل العملية"
        text: |
          مين في خطر قبل جراحة الكبد؟
          - **Severe undernutrition** (BMI < 18.5) أو **obesity** (BMI > 40): morbidity و mortality أعلى.
          - عيانين الـ **waiting list** معرضين برضه، لأن أكلهم وسعراتهم قليلة.

          نعمل إيه؟
          - الـ ==liver glycogen is depleted== في الـ cirrhosis، فقصّر فترات الصيام قبل العملية. نفس فكرة سناك آخر الليل من الدرس التاني.
          - اعمل **screening** للـ malnutrition والـ sarcopenia قبل الـ LT أو الـ elective surgery، وعالج الـ sarcopenia قبل الـ elective.
          - في الـ obese: دوّر على **sarcopenic obesity** بـ body composition analysis.
          - استخدم **standard regimens**: الـ BCAA-enriched والـ immune-enhancing ماثبتش إنهم بيحسّنوا morbidity أو mortality.
      - kind: table
        page: 417
        title: "جدول التارجتس (احفظه صورة)"
        columns: ["Situation", "Energy", "Protein"]
        rows:
          - ["Stable cirrhosis (p407)", "≥ 35 kcal/kg", "1.2–1.5 g/kg"]
          - ["Pre-op: maintain status", "30 kcal/kg", "1.2 g/kg"]
          - ["Pre-op: improve status", "35 kcal/kg", "1.5 g/kg"]
          - ["After acute post-LT phase", "35 kcal/kg", "1.5 g/kg"]
          - ["Obese after LT, tube/PN", "25 kcal/kg ideal BW", "2.0 g/kg ideal BW"]
          - ["Critically ill", "≥ 35–40 kcal/kg or 1.3 × REE", "≥ 1.2–1.3 g/kg"]
        hide: [[1, 1], [1, 2], [2, 2], [4, 1], [5, 1]]
      - kind: aside
        tone: tip
        page: 416
        text: |
          الجدول ده شكله مرعب بس فيه منطق: ==35/1.5== هي "الأساس" تقريبًا في كل حتة.

          - عايز تحافظ بس؟ انزل خطوة: **30/1.2**.
          - **Critically ill**؟ اطلع خطوة في الطاقة: **35–40 kcal/kg**.
          - **Obese**؟ الطاقة تقل (**25**) والبروتين يعلى (**2.0**)، وعلى الـ **ideal** BW.
      - kind: explain
        page: 416
        title: "بعد العملية والزرع"
        text: |
          الأكل بعد العملية، مقارنةً بـ fluids and electrolytes بس، بيقلل: **ventilator time**، **ICU stay**، **bacterial and viral infections**، و **bile duct and other complications**.

          - بعد الـ **LT**: ==normal food== و/أو **enteral tube feeding** خلال 12–24 ساعة علشان الـ infections تقل.
          - مفيش oral ولا enteral؟ **parenteral** أحسن من **no feeding**.
          - بعد عمليات تانية في الـ CLD: **ERAS protocols**.
          - **Parenteral** في الـ HE مع **unprotected airways** لما الـ cough والـ swallow يضعفوا، أو لو الـ enteral ممنوع.
          - بعد الـ LT العيان في **negative nitrogen balance** → زوّد البروتين.
          - صحّح الـ **chronic dilutional hyponatraemia** بالراحة علشان ==pontine myelinolysis==.
          - على المدى الطويل: **weight gain/obesity** من الـ **metabolic syndrome**.
      - kind: check
        page: 417
        question: "Why must chronic dilutional hyponatraemia be corrected **slowly** after liver transplantation?"
        options:
          - "To avoid pontine myelinolysis"
          - "To avoid variceal re-bleeding"
          - "Because sodium worsens anabolic resistance"
          - "To prevent hepatic encephalopathy"
        answer: 0
        why:
          - "صح: التصحيح السريع للـ hyponatraemia المزمنة بيعمل **(central) pontine myelinolysis**."
          - "الـ re-bleeding هو سبب وقف الـ **enteral nutrition** بعد النزيف، مش الصوديوم."
          - "مفيش علاقة في الكتاب."
          - "مش السبب اللي الكتاب ذاكره."
      - kind: explain
        page: 417
        title: "الـ critically ill"
        text: |
          مين؟ اللي **hospitalized for severe complications** of CLD، الـ **acute-on-chronic liver failure**، اللي في **ICU**، والـ **acute alcoholic hepatitis**.

          - قيّم الـ nutrition والـ sarcopenia، وادعم التغذية وانت بتعالج الـ decompensation.
          - قيس الـ **REE** بـ ==indirect calorimetry== لو تقدر.
          - ==Tight glucose control== زي أي critically ill.
          - **Enteral** أو **parenteral** غالبًا هتحتاجهم: enteral لو مش قادر ياكل، و parenteral لو الـ oral والـ enteral مش متحمَّلين أو ممنوعين.
          - **Standard regimens**؛ وفي الـ **HE** فكّر في **BCAA-enriched solutions**.

          والـ **active alcohol abuse** ممكن يرفع الـ **REE**. والتغذية في الـ severe alcoholic hepatitis ممكن تسرّع تحسّن الـ HE و تحسّن الـ **survival** في اللي أكلهم قليل.
