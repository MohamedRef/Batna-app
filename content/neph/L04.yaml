  - id: neph.L04.003
    kind: card
    topic: measurement
    front: How many measurements are needed to diagnose hypertension, and how far apart?
    back: Two measurements, one week apart.
    src: { page: 80, quote: "Hypertension must be diagnosed on two measurements one week apart" }
    status: unverified
    tags: [high-yield]
  - id: neph.L04.004
    kind: card
    topic: measurement
    front: Which measurement pitfall should you watch for while deflating the cuff?
    back: The auscultatory gap, so palpate first and inflate high enough; also watch the rate of mercury fall and avoid painful inflation.
    src: { page: 80, quote: "be careful for ascultatory gap" }
    status: unverified
  - id: neph.L04.005
    kind: enumerate
    topic: measurement
    prompt: If BP is very high at the first visit, check the femoral pulse for delay. Which causes does a delay point to?
    points:
      - Coarctation of the aorta
      - Leriche syndrome
      - Aortitis (Takayasu syndrome)
    pass: 3
    src: { page: 80, quote: "Femoral pulse delay Coarctation Leriche syndrome Aortitis" }
    status: unverified
  - id: neph.L04.006
    kind: mcq
    topic: measurement
    stem: A 24-year-old man has BP 172/100 in the right arm at his first visit. His femoral pulses are weak and delayed compared with the radial. What is the most likely cause?
    options:
      - Essential hypertension
      - Coarctation of the aorta
      - White-coat hypertension
      - Primary hyperaldosteronism
    answer: 1
    why:
      - Essential hypertension does not delay the femoral pulse.
      - "Correct: a very high first-visit BP should prompt measuring another site; femoral pulse delay points to coarctation (p80)."
      - White-coat hypertension does not change the pulses.
      - Conn syndrome causes hypertension with hypokalemia but normal femoral pulses.
    src: { page: 80, quote: "If <<first>> visit B.P is ↑↑ Other site Femoral pulse delay Coarctation" }
    status: unverified
