  - id: git.L11.lesson3
    title: "الأسبرين والوارفارين والـ PPI والمنظار"
    hook: "مريض بنزف وعامل stent من 3 شهور: توقف الأسبرين؟ ده سؤال الكتاب بالظبط."
    minutes: 10
    pages: [303, 305]
    topics: [antithrombotics, drugs, endoscopy]
    goals:
      - "تعرف تعمل إيه في كل antithrombotic (سؤال essay)"
      - "تكتب جرعة الـ PPI صح، وتعرف الـ vasoactive لمين"
      - "تعرف توقيت المنظار ومين يتعالج وإزاي"
    status: unverified
    steps:
      - kind: explain
        page: 303
        quote: "In patients with acute UGIH who are taking low dose aspirin as monotherapy for secondary cardiovascular prophylaxis, aspirin should not be interrupted."
        title: "الأسبرين: primary ولا secondary؟"
        text: |
          السؤال الأول: الأسبرين ده **ليه**؟
          - ==Primary prophylaxis== (مفيش حدث قلبي قبل كده): **وقّفه مؤقتًا**، وارجع له بعد ما تراجع الـ indication.
          - ==Secondary prophylaxis== (MI، stent، stroke): **ما توقفوش**. ولو اتوقف لأي سبب، رجّعه بسرعة، **within 3-5 days**.
          - **DAPT**: خلّي الأسبرين، و**وقّف التاني** (زي clopidogrel) ورجّعه **within 5 days**.
      - kind: aside
        tone: analogy
        page: 303
        quote: "The second antiplatelet agent should be interrupted, but restarted as soon as possible, preferably within 5 days."
        text: |
          الـ stent زي جسر جديد لسه الخرسانة طرية. شيل الأسبرين = تقفل الجسر وتستنى الجلطة. علشان كده في الـ secondary prophylaxis القرحة بتتعالج بالمنظار والـ PPI، والأسبرين يفضل.
      - kind: explain
        page: 304
        quote: "the anticoagulant should be withheld and endoscopy not delayed."
        title: "الـ anticoagulants"
        text: |
          - ==VKA== (warfarin): وقّفه. لو المريض **unstable**: **low-dose vitamin K** + **IV PCC**، أو **FFP** لو مفيش PCC.
          - ==DOAC==: وقّفه، و**ما تأخرش المنظار**. لو النزيف شديد ومستمر: **reversal agent** أو **IV PCC**.
          - الرجوع: بعد ما النزيف يتحكم، **within or soon after 7 days** حسب الـ thromboembolic risk. وافتكر إن الـ DOAC بيشتغل أسرع من الـ VKA.
      - kind: sort
        page: 303
        quote: "who are taking low dose aspirin as monotherapy for primary cardiovascular prophylaxis, aspirin should be temporarily interrupted."
        prompt: "أثناء النزيف: يفضل ولا يتوقف؟"
        bins: ["Continue", "Withhold / interrupt"]
        cards:
          - { text: "Aspirin after a coronary stent", bin: 0 }
          - { text: "Aspirin in DAPT for secondary prophylaxis", bin: 0 }
          - { text: "Aspirin for primary prevention only", bin: 1 }
          - { text: "Clopidogrel in DAPT", bin: 1 }
          - { text: "Warfarin", bin: 1 }
          - { text: "Apixaban", bin: 1 }
        why: "الأسبرين الـ secondary بس هو اللي يفضل (لوحده أو جوه DAPT). الـ primary aspirin، والـ antiplatelet التاني، والـ VKA، والـ DOAC كلهم يتوقفوا ويرجعوا بمواعيد."
      - kind: explain
        page: 304
        quote: "It is advised to start high dose PPI (8 mg/hr) infusion for 72 h following a bolus dose of 80 mg."
        title: "الـ PPI والأدوية"
        text: |
          - ==PPI==: **80 mg bolus** وبعده **8 mg/h** لمدة **72 h**. أو **40 mg كل 12 ساعة** بعد الـ bolus، وبنفس الكفاءة في منع الـ rebleeding.
          - الـ PPI **قبل المنظار** بيقلل عدد القرح اللي محتاجة endoscopic therapy.
          - المعتمدين من الـ FDA للـ NVUGIB: **esomeprazole**، **pantoprazole**، **lansoprazole**.
          - ==Splanchnic vasoconstrictors== (somatostatin، octreotide، terlipressin): **variceal بس**.
          - **Prokinetic** قبل المنظار يفضّي المعدة ويوضح الرؤية، وأكتر واحد اتدرس **erythromycin**.
      - kind: check
        page: 304
        quote: "It is advised to start high dose PPI (8 mg/hr) infusion for 72 h following a bolus dose of 80 mg."
        question: "Write the high-dose PPI regimen for a bleeding ulcer."
        options:
          - "80 mg IV bolus, then 8 mg/h for 72 h"
          - "40 mg IV once daily for 72 h"
          - "8 mg bolus, then 80 mg/h for 24 h"
          - "Octreotide 50 µg/h for 5 days"
        answer: 0
        why:
          - "صح: 80 bolus ثم 8 في الساعة 72 ساعة (أو 40 كل 12 ساعة)."
          - "مرة واحدة في اليوم مش high dose."
          - "الأرقام مقلوبة."
          - "الـ octreotide للدوالي بس."
      - kind: explain
        page: 305
        quote: "Patients without evidence of active bleeding undergo nonemergent endoscopy usually within 24 hours."
        title: "المنظار: إمتى وليه"
        text: |
          - من غير active bleeding: **within 24 hours**.
          - Active bleeding (بعد الـ resuscitation) أو **suspected variceal**: ==within 12 hours==.
          - ممكن يتأخر في comorbidity خطيرة زي **ACS** لو مفيش نزيف مستمر.

          وقيمته تلات حاجات: **etiology**، **prognosis of rebleeding**، و**therapy**.
      - kind: explain
        page: 305
        quote: "Ulcers with active bleeding and non-bleeding visible vessels should receive endoscopic therapy; endoscopic therapy may also be used for ulcers with adherent clots."
        title: "مين يتعالج بالمنظار؟"
        text: |
          - **Active bleeding** و **non-bleeding visible vessel**: لازم ==endoscopic therapy==.
          - **Adherent clot**: ممكن.
          - الأدوات: **injection** (epinephrine)، **thermal** (bipolar، heater probe)، أو **clips**.
          - القاعدة الذهبية: ==epinephrine دايمًا معاه second modality==.

          درجات القرحة دي هي **Forrest classification** اللي اتشرحت في محاضرة 1.
      - kind: order
        page: 305
        quote: "Recurrent bleeding should be treated with repeat endoscopic therapy but subsequent bleeding by transarterial embolization or surgery."
        prompt: "القرحة نزفت تاني بعد العلاج. رتّب الخطوات:"
        steps:
          - "First endoscopic therapy (dual modality)"
          - "Repeat endoscopic therapy for rebleeding"
          - "Transarterial embolization or surgery if it bleeds again"
        why: "أول rebleed = منظار تاني. اللي بعده = TAE أو surgery."
      - kind: explain
        page: 305
        quote: "Patients who have ulcers with high risk lesions (active bleeding, visible vessel, adherent clot) should receive high dose proton pump inhibitors for 72 h."
        title: "بعد المنظار"
        text: |
          - القرح ==high risk== (active bleeding، visible vessel، adherent clot): **high-dose PPI لمدة 72 h**.
          - الأسبرين الـ **secondary**: يكمل أو يرجع بسرعة بعد الـ hemostasis.
          - باقي الـ **antithrombotics**: رجوع بدري بيقلل الـ thrombotic events والوفاة.
      - kind: case
        page: 305
        quote: "Epinephrine injection should always be followed by a second modality."
        stem: "A 66-year-old on aspirin after a stent has melena, HR 112, SBP 92. Endoscopy shows a duodenal ulcer with a visible vessel."
        steps:
          - question: "His aspirin?"
            options: ["Keep it (secondary prophylaxis)", "Stop it for 4 weeks", "Swap it for clopidogrel", "Stop it permanently"]
            answer: 0
            why: "Secondary prophylaxis = ما يتوقفش."
          - question: "Endoscopic treatment of the visible vessel?"
            options: ["Epinephrine plus clips or thermal probe", "Epinephrine alone", "PPI only, no therapy", "Band ligation"]
            answer: 0
            why: "الـ visible vessel لازم يتعالج، والـ epinephrine دايمًا معاه second modality."
          - question: "After endoscopy?"
            options: ["High-dose PPI for 72 h", "Oral PPI once daily only", "Octreotide 5 days", "No PPI"]
            answer: 0
            why: "High-risk lesion = high-dose PPI 72 ساعة."
      - kind: try
        items: [git.L11.051, git.L11.055, git.L11.056, git.L11.063, git.L11.073]
    recap:
      - "Aspirin primary: وقّف وراجع. Aspirin secondary: ما توقفش (لو وقف، رجّع خلال 3-5 أيام). DAPT: خلي الأسبرين ووقّف التاني لحد 5 أيام."
      - "VKA unstable: vitamin K قليل + IV PCC (أو FFP). DOAC: وقّف وما تأخرش المنظار. الرجوع خلال 7 أيام."
      - "PPI: 80 bolus ثم 8 mg/h لمدة 72 h، أو 40 كل 12 ساعة. Vasoactive للدوالي بس. Erythromycin قبل المنظار."
      - "المنظار خلال 24 h، أو 12 h لو active أو variceal. Active أو visible vessel = علاج. Epinephrine + second modality."
