  - id: geri.L07.032
    kind: enumerate
    topic: function
    prompt: List the six activities of the Katz Index of Independence in ADL.
    points: [Bathing, Dressing, Toileting, Transferring, Continence, Feeding]
    pass: 5
    hook: "الـKatz الستة «من الحمام للسفرة»: استحمى (bathing)، البس (dressing)، ادخل الحمام (toileting)، اتنقل (transferring)، امسك نفسك (continence)، وكُل (feeding)."
    src: { page: 111, quote: "Katz Index of Independence in Activities of Daily Living\n| Activities (Points 1 or 0) | Independence (1 Point): NO supervision, direction or personal assistance. | Dependence (0 Points): WITH supervision, direction, personal assistance or total care. |\n|---|---|---|\n| BATHING | (1 POINT) Bathes self completely or needs help in bathing only a single part of the body such as the back, genital area or disabled extremity. | (0 POINTS) Need help with bathing more than one part of the body, getting in or out of the tub or shower. Requires total bathing |\n| DRESSING | (1 POINT) Get clothes from closets and drawers and puts on clothes and outer garments complete with fasteners. May have help tying shoes. | (0 POINTS) Needs help with dressing self or needs to be completely dressed. |\n| TOILETING | (1 POINT) Goes to toilet, gets on and off, arranges clothes, cleans genital area without help. | (0 POINTS) Needs help transferring to the toilet, cleaning self or uses bedpan or commode. |\n| TRANSFERRING | (1 POINT) Moves in and out of bed or chair unassisted. Mechanical transfer aids are acceptable | (0 POINTS) Needs help in moving from bed to chair or requires a complete transfer. |\n| CONTINENCE | (1 POINT) Exercises complete self control over urination and defecation. | (0 POINTS) Is partially or totally incontinent of bowel or bladder |\n| FEEDING | (1 POINT) Gets food from plate into mouth without help. Preparation of food may be done by another person. | (0 POINTS) Needs partial or total help with feeding or requires parenteral feeding. |\nTOTAL POINTS. SCORING: 6 = High (patient independent) 0 = Low (patient very dependent)" }
    status: unverified
    tags: [high-yield]
