  - id: endo.L03.lesson4
    title: "SIADH وسكر واطي من الورم"
    hook: "صوديوم واطي من غير وذمة، وسكر واطي مع insulin واطي. الورم بيلعب في المية والسكر."
    minutes: 9
    pages: [38, 40]
    topics: [siadh, igf2]
    goals:
      - "تفهم ليه الـ SIADH بيعمل hyponatremia من غير oedema، وتشخّصه صح"
      - "تعالج الـ SIADH حسب الشدة"
      - "تفهم ميكانيزمات الـ IGF-II hypoglycemia وليه علاجها كده"
    status: unverified
    steps:
      - kind: explain
        page: 38
        quote: "3) Syndrome of Inappropriate ADH ectopic secretion \"SIADH\"\nEtiology\n  - Small cell lung Ca.\n  - Carcinoid Tumor.\n  - CNS lesions.\n  - GIT tumor.\n  - Genitourinary tumor.\n  - Ovarian tumor.\nPathogenesis\n  Increased vasopressin (ADH) secretion.\n  Increased ANP secretion."
        title: "الـ SIADH: مين وإزاي"
        text: |
          **الأسباب في الكتاب:** ==small cell lung Ca==، carcinoid، CNS lesions، GIT، genitourinary، ovarian tumours.

          **الميكانيزم:** **vasopressin (ADH) ↑** و **ANP ↑**.

          ليه الاتنين؟ التفسير المقبول (مش في الكتاب): الـ **ADH** بيفتح قنوات المية في الـ collecting duct، فالكلية تحبس مية حرة **مهما** الدم كان مخفف، وده معنى inappropriate. المية الزيادة بتمدّ الأذين، فالقلب يفرز **ANP** يطرد صوديوم في البول. النتيجة: مية جوه وصوديوم بره، فالصوديوم يقع من الناحيتين. والـ small cell تاني على راس القايمة لأنه neuroendocrine، نفس سبب الـ ACTH.
      - kind: explain
        page: 39
        quote: "The net result is\n  Inappropriate retention of water.\n  Inappropriate urine concentration."
        title: "SIADH"
        text: |
          الـ antidiuretic hormone (ADH) ↑ والـ atrial natriuretic peptide (ANP) ↑ النتيجة بتاعتهم في الكتاب: ==inappropriate water retention== و **inappropriate urine concentration**.

          **الصورة:** غالبًا hyponatremia بالصدفة؛ أو lethargy، weakness، nausea، confusion، seizure؛ ووزن بيزيد ==من غير oedema==.
      - kind: reveal
        page: 39
        quote: "Clinical picture\n  Asymptomatic: accidentally discovered hyponatremia.\n  Lethargy, weakness, nausea, confusion and seizure.\n  Increased body weight due to retention of water without oedema."
        prompt: "ليه المية محبوسة بس مفيش oedema؟"
        answer: "المية الحرة بتتوزع على كل الـ compartments، وتلتينها جوه الخلايا. والـ ANP العالي بيطلّع صوديوم، فالـ extracellular volume مش بيزيد بالقدر اللي يعمل oedema. (ده تفسير فسيولوجي؛ الكتاب ذكر الـ ANP والنتيجة.)"
      - kind: explain
        remind: [endo.L03.041]
        page: 39
        quote: "Diagnosis\n  Hyponatremia and decreased plasma osmolality in the setting of inappropriate normal or increased urine osmolality.\n  Low blood urea nitrogen and uric acid.\n  Exclude hypothyroidism and hypocortisolism."
        title: "التشخيص"
        text: |
          - Hyponatremia و plasma osmolality واطية، مع urine osmolality ==normal أو عالية== (inappropriate).
          - **blood urea nitrogen (BUN) و uric acid واطيين**.
          - ==استبعد hypothyroidism و hypocortisolism==.

          ليه البول المركّز هو المفتاح؟ لأن الدم المخفف المفروض يقفل الـ ADH، فالكلية تطلّع بول **مخفف جدًا**. لو البول normal أو مركّز يبقى في ADH شغال من غير سبب. وليه الـ BUN والـ uric acid واطيين؟ التفسير المقبول (مش في الكتاب): المية الزيادة بتخفّفهم، والـ volume الزيادة بتزوّد خروجهم في البول. وليه نستبعد الـ hypothyroid والـ hypocortisol؟ لأن الاتنين بيعملوا نفس الصورة بالظبط، فلازم يتشالوا قبل ما نقول SIADH.
      - kind: table
        page: 39
        quote: "Treatment\n  Mild cases Fluid restriction to less than urine output.\n  Moderate cases Demeclocycline 150-300 mg three times daily. Slow action up to weeks. It antagonizes AVP action on renal tubules.\n  Severe cases (Na less than 110mEq/L) Hypertonic Saline with furesemide.\n  4) Ectopic IGFII secretion hypoglycemia Etiology\n  Mesenchymal tumor.\n  Hepatic tumor."
        title: "العلاج"
        columns: ["Severity", "Treatment"]
        rows:
          - ["Mild", "Fluid restriction < urine output"]
          - ["Moderate", "Demeclocycline 150-300 mg tds (weeks)"]
          - ["Severe (Na <110)", "Hypertonic saline + furosemide"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 39
        quote: "Moderate cases Demeclocycline 150-300 mg three times daily. Slow action up to weeks. It antagonizes AVP action on renal tubules."
        prompt: "ليه العلاج بيبدأ بالـ fluid restriction، وليه الـ furosemide مع الـ hypertonic saline في الـ severe؟"
        answer: |
          - **Fluid restriction أقل من البول**: المشكلة مية زيادة، فلو دخّلت أقل من اللي بيخرج، الرصيد يقل والصوديوم يعلى لوحده.
          - **Demeclocycline**: الكتاب بيقول إنه **antagonizes AVP action on renal tubules**، يعني بيعمل nephrogenic DI صغير مقصود. بس بطيء، **weeks**.
          - **Hypertonic saline + furosemide**: التفسير المقبول (مش في الكتاب): الـ saline بيدخّل صوديوم، والـ furosemide بيخلّي الكلية تطرد **مية** أكتر من الصوديوم (بيبوّظ قدرة التركيز)، فالمحصلة إن الصوديوم يعلى من غير ما المية تزيد.
      - kind: update
        page: 39
        quote: "Treatment\n  Mild cases Fluid restriction to less than urine output.\n  Moderate cases Demeclocycline 150-300 mg three times daily. Slow action up to weeks. It antagonizes AVP action on renal tubules.\n  Severe cases (Na less than 110mEq/L) Hypertonic Saline with furesemide.\n  4) Ectopic IGFII secretion hypoglycemia Etiology\n  Mesenchymal tumor.\n  Hepatic tumor."
        text: "الكتاب: severe cases (Na أقل من 110) تاخد hypertonic saline مع furosemide. الإرشادات الأوروبية (2014) بتبدأ بالـ fluid restriction، وبعدها urea أو loop diuretic جرعة صغيرة مع oral sodium chloride (NaCl)، وبتنصح ضد الـ vaptans والـ demeclocycline. توصيات الـ American expert panel (Verbalis et al., 2013) بتحط الـ tolvaptan كاختيار. وعلشان الـ osmotic demyelination: الأوروبية بتحدد تصحيح الـ chronic hyponatremia بـ 10 mmol/L في أول 24 ساعة و 8 في كل يوم بعدها، والـ American panel بـ 10–12 في الـ 24 ساعة (و 8 لو العيان high risk). في الامتحان اكتب إجابة الكتاب."
        ref: "European clinical practice guideline on hyponatraemia 2014; Hyponatremia treatment guidelines: expert panel recommendations (Verbalis et al.) 2013"
      - kind: explain
        page: 39
        quote: "Pathogenesis\n  Increased consumption of glucose by tumor cells.\n  Decreased gluoneogensis by studded liver by metastasis.\n  Decreased counter regulatory hormones like GH.\n  Increased ectopic IGFII (Big IGFII) that can react with insulin receptors."
        title: "IGF-II hypoglycemia"
        text: |
          **الأسباب:** ==mesenchymal== و **hepatic** tumors.

          **الميكانيزم:**
          - الورم بياكل glucose.
          - الكبد المليان metastases مش بيعمل gluconeogenesis.
          - Counter-regulatory hormones (زي growth hormone (GH)) قليلة.
          - ==Big IGF-II== بيشتغل على الـ insulin receptors.
          - الـ insulin-like growth factor (IGF) binding protein 3 مبيتكونش، فالـ IGF-II يفضل active.

          **الصورة:** fasting hypoglycemia متكررة. **العلاج:** small frequent meals، IV glucose بالليل، glucagon، GH، corticosteroids.

          ليه الـ insulin بيبقى **واطي**؟ لأن السكر واطي فعلًا، والـ pancreas سليم فبيقفل الـ insulin صح. اللي شغال على الـ receptors هو الـ big IGF-II. وليه العلاج كده؟ الوجبات الصغيرة والـ glucose **بالليل** عشان الصيام هو اللي بيكشف المشكلة. والـ glucagon والـ GH والـ steroids هما الـ counter-regulatory hormones اللي الكتاب قال إنها ناقصة، فبنرجّعها.
