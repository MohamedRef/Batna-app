        text: |
          الـ sarcoid بيوصل الكلية بكذا طريقة، والعلاج على قد كل واحدة:

          - **Hypercalcemia و hypercalciuria:** steroid **0.3-0.5 mg/kg/d** (أقل جرعة في الجدول)، أو **HCQ** أو **ketoconazole**، مع IV hydration، شمس أقل، calcium و vit D و oxalate أقل، و ==Avoid thiazide==. التفسير المقبول (مش في الكتاب): الـ granulomas بتعمل 1-alpha-hydroxylase فبتطلّع **vitamin D نشط** لوحدها، والـ steroid والـ HCQ والـ ketoconazole كلهم بيقللوا ده، والشمس بتزوّد مادة الـ vitamin D.
          - **Granulomatous interstitial nephritis (GIN):** steroid **1 mg/kg** (major) أو **0.5** (mild)، وبدائل azathioprine و MMF و infliximab. ==Add a steroid-sparing agent== لو **relapse** أو **صعب تنزّل الـ steroid**.
          - **Glomerular** و **tubular dysfunction:** steroid **1 mg/kg**، وبعدين بدائل الـ GIN، أو **methotrexate 10-20 mg/week** مع **folic acid**.
          - **Nephrolithiasis و nephrocalcinosis:** **metabolic control** وضبط الكالسيوم، والحصوة ممكن جراحة.

          النتيجة: الـ steroid هو أساس كل الأنواع، والفرق في الجرعة وفي الدوا اللي بيوفّر الـ steroid.
