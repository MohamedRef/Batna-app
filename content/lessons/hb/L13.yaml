        title: "الـ prognosis قبل العلاج"
        text: |
          الـ prevalence في northern Europe: 1.9 لكل 100,000 في السنة.

          Table 3 بيقولك المريض رايح على فين من شكله أول ما ييجي. كل ما الالتهاب أعنف، كل ما النتيجة أوحش:

          - ==Bridging== أو ==multilobular necrosis==: 82% cirrhosis في 5 سنين، و 45% mortality في 5 سنين.
          - **Cirrhosis**: 58% mortality في 5 سنين.
          - Aspartate aminotransferase (AST) ≥ 10×: 50% mortality في 3 سنين.
          - AST ≥ 5× مع gamma globulin ≥ 2×: 90% mortality في 10 سنين.
          - AST < 10× مع gamma globulin < 2×: 49% cirrhosis في 15 سنة، و 10% mortality في 10.
          - **Interface hepatitis** بس: 17% cirrhosis في 5 سنين، والـ 5-year survival طبيعي.

          وبعد العلاج، دي علامات وحشة (high mortality):

          - مفيش تحسّن (failure to improve).
          - **Hyperbilirubinemia** لسه موجودة بعد أسبوعين علاج.
          - مفيش remission خلال 4 سنين.
