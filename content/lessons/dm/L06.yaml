            <text x="165" y="325" text-anchor="middle" class="t-b">Diabetic foot ulcer</text>
          </svg>
      - kind: match
        page: 67
        quote: "Intrinsic muscles Imbalance & Wasting Dry Skin"
        prompt: "وصّل كل ذراع بالسلسلة بتاعته:"
        pairs:
          - ["PVD", "Ischaemia + trauma"]
          - ["Sensory neuropathy", "Loss of protective sensation + trauma"]
          - ["Motor neuropathy", "Muscle wasting → deformity → high pressure"]
          - ["Autonomic neuropathy", "Less sweating → dry skin → cracks"]
        why: "الـ autonomic بيقلل العرق فالجلد ينشف ويتشقق؛ الـ motor بيضعف الـ intrinsic muscles فالصوابع تتلوي وتعمل نقط ضغط؛ الـ sensory بيشيل الإحساس فالجرح يعدّي؛ والـ PVD بيقطع الدم."
      - kind: reveal
        page: 67
        quote: "Intrinsic muscles Imbalance & Wasting Dry Skin"
        prompt: "ليه الـ autonomic neuropathy بتعمل جلد ناشف؟"
        answer: |
          الغدد العرقية متغذية بأعصاب **sympathetic** (autonomic). لما تموت، العرق يقل، فالجلد يفقد الترطيب الطبيعي ويبقى **dry skin**، ويتشقق **cracks and fissures** تبقى باب للميكروب وبداية للقرحة.

          علشان كده نصيحة الـ **moisturizing cream** في الـ foot care مش رفاهية.
      - kind: explain
        page: 67
        title: "الـ DF stages"
        quote: "High-risk Foot: Presence of Neuropathy, Ischemia &/or Deformity."
        text: |
          1. ==High-risk foot==: neuropathy, ischemia and/or deformity
          2. **Ulcerated foot**: neuropathic or ischaemic ulcer
          3. **Infected foot**: local ulcer infection, cellulitis and/or osteomyelitis
          4. **Necrotic foot**: wet or dry necrosis
      - kind: table
        page: 68
        quote: "Wet Necrosis (Neuropathic Foot)"
        title: "الـ necrosis: مبلولة ولا ناشفة؟"
        columns: [Necrosis, Foot type]
        rows:
          - ["Wet", "Neuropathic"]
          - ["Dry", "Ischaemic"]
        hide: [[0, 1], [1, 1]]
      - kind: reveal
        page: 68
        quote: "Dry Necrosis (Ischaemic Foot)."
        prompt: "ليه الـ ischaemic foot بيعمل dry necrosis والـ neuropathic بيعمل wet؟"
        answer: |
          في الـ **ischaemic foot** الدم مش واصل، فالنسيج بيموت وينشف ويسود (**mummification**)، وغالبًا من غير infection كبيرة.

          في الـ **neuropathic foot** الدم واصل، فالنسيج الميت بيتعفن مع infection ويبقى مبلول وريحته وحشة (**wet**). (تفسير فسيولوجي؛ التقسيم من الكتاب.)
      - kind: check
        page: 68
        quote: "Dry Necrosis (Ischaemic Foot)."
        question: "Black, shrivelled, cold toe with a clear demarcation line and absent pulses. Stage?"
        options: ["Necrotic: dry (ischaemic)", "Necrotic: wet (neuropathic)", "Infected foot", "High-risk foot"]
        answer: 0
        why:
          - "صح: dry necrosis = ischaemic foot."
          - "الـ wet مع الـ neuropathic foot، ومبلولة."
          - "الـ infected = infection أو cellulitis أو osteomyelitis من غير necrosis."
          - "الـ high-risk مفيهوش ulcer أصلًا."
      - kind: aside
        tone: exam
        page: 68
        quote: "Among Diabetic Patients, There is an AMPUTATION every 30 Seconds Throughout the World."
        text: "رقم الـ Lancet: كل ==30 seconds== فيه **amputation** لرجل مريض سكر في العالم. على ما تخلص الدرس ده، حوالي 16 رجل اتقطعت."
      - kind: try
        items: [dm.L06.001, dm.L06.008, dm.L06.010, dm.L06.011, dm.L06.013]
    recap:
      - "40–60% من مرضى السكر هيعملوا PN؛ الألم بيبدأ من الرجل ويطلع، وبعدين loss of sensation."
      - "4 أذرع للـ DFU: PVD (ischaemia + trauma)، sensory (LOPS + trauma)، motor (deformity ← high pressure)، autonomic (dry skin ← cracks)."
      - "Stages: high-risk ← ulcerated ← infected ← necrotic."
      - "Wet necrosis = neuropathic، dry = ischaemic. Amputation كل 30 ثانية."
    practice: [dm.L06.001, dm.L06.002, dm.L06.003, dm.L06.004, dm.L06.005, dm.L06.006, dm.L06.007, dm.L06.008, dm.L06.009, dm.L06.010, dm.L06.011, dm.L06.012, dm.L06.013, dm.L06.014, dm.L06.015, dm.L06.054]
  # ------------------------------------------------------------------
  - id: dm.L06.lesson2
    title: "الفحص: أعصاب، نبض، وضغط القدم"
    hook: "الـ NCS مش محتاجه، والنبض الموجود مش بيطمّنك: فخين في فحص رجل السكري."
    minutes: 8
    pages: [68, 72]
    topics: [neuro, vascular, pressure]
    goals:
      - "تعرف أدوات الفحص العصبي وامتى تطلب NCS"
      - "تفسر النبض والـ ABI بجدول المحاضرة دي"
      - "تعرف دور الـ plantar pressure والـ insoles والـ footwear"
    status: unverified
    steps:
      - kind: explain
        page: 69
        title: "الـ neurological evaluation"
        quote: "Vibration Perception Threshold (VPT)"
        text: |
          تلات أدوات على السرير:
          - **10-gram monofilament**
          - **Vibration sense** بالـ tuning fork
          - **Vibration Perception Threshold (VPT)** بالجهاز

          (تفاصيل الطريقة والأماكن في محاضرة **Diabetic foot** اللي قبلها.)
      - kind: explain
        page: 70
        title: "والـ NCS؟"
        quote: "Only indicated if you are suspecting non-diabetic cause for neurogenic dysfunction!"
        text: |
          الـ **nerve conduction studies** ==NOT necessary== علشان تشخص **diabetic peripheral neuropathy**.

          بتطلبها **بس** لو شاكك إن فيه **non-diabetic cause** للمشكلة العصبية (مثلًا ضعف غير متماثل، أو تقدم سريع).
      - kind: check
        page: 69
        quote: "NOT necessary to assess diabetic peripheral neuropathy."
        question: "Symmetric burning feet, monofilament lost at 3 sites, reduced vibration. Next step to confirm DPN?"
        options: ["No more tests: NCS not necessary", "NCS for everyone", "Sural nerve biopsy", "Lumbar MRI"]
        answer: 0
        why:
          - "صح: الصورة typical، والـ NCS مش لازمة."
          - "الـ NCS بس لو شاكك في سبب non-diabetic."
          - "الـ biopsy مش جزء من التقييم."
          - "الصورة symmetric distal، مش spine."
      - kind: explain
        page: 70
        title: "النبض بيكدب"
        quote: "Palpable foot pulses: Can NOT exclude PAD."
        text: |
          - **Absent foot pulses** = ==severe PAD==
          - **Palpable foot pulses** = ==can NOT exclude PAD==
          - الـ **mild-to-moderate PAD** بيتكشف بالـ **ABI**

          يعني النبض الغايب بيقولك حاجة أكيدة، والموجود ما بيقولكش حاجة.
      - kind: table
        page: 70
        quote: "Normal 0.9 - 1.3 Mild PAD 0.7- 0.9 Moderate PAD 0.4 - 0.7 Severe PAD <0.4"
        title: "الـ ABI (محاضرة 6)"
        columns: [Interpretation, ABI]
        rows:
          - ["Normal", "0.9–1.3"]
          - ["Mild PAD", "0.7–0.9"]
          - ["Moderate PAD", "0.4–0.7"]
          - ["Severe PAD", "<0.4"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: mnemonic
        page: 70
        quote: "Normal 0.9 - 1.3 Mild PAD 0.7- 0.9 Moderate PAD 0.4 - 0.7 Severe PAD <0.4"
        word: "974"
        parts:
          - { key: "9", text: "0.9: below it = PAD (normal 0.9–1.3)" }
          - { key: "7", text: "0.7: below it = moderate" }
          - { key: "4", text: "0.4: below it = severe" }
        hook: "**974** زي رقم أوتوبيس: كل ما تنزل محطة، الـ PAD يتقل."
      - kind: aside
        tone: trap
        page: 70
        quote: "Normal 0.9 - 1.3 Mild PAD 0.7- 0.9 Moderate PAD 0.4 - 0.7 Severe PAD <0.4"
        text: "محاضرة 5 كاتبة «>0.9 normal، 0.8 claudication، <0.4 rest pain»، ومحاضرة 6 كاتبة جدول mild/moderate/severe. مش متعارضين: الـ 0.9 والـ 0.4 هما هما. لو السؤال بيقول **mild/moderate/severe** استخدم جدول محاضرة 6."
      - kind: case
        page: 70
        quote: "Palpable foot pulses: Can NOT exclude PAD."
        stem: "66-year-old smoker with diabetes, HTN and dyslipidemia. Small ulcer on the big-toe tip. Foot pulses palpable but weak."
        steps:
          - question: "PAD excluded?"
            options: ["No", "Yes", "Only if he is under 50", "Only with absent reflexes"]
            answer: 0
            why: "الـ palpable pulses ما بتستبعدش PAD؛ اعمل ABI."
          - reveal: "ABI 0.78."
            question: "Class?"
            options: ["Mild PAD", "Moderate PAD", "Severe PAD", "Normal"]
            answer: 0
            why: "0.7–0.9 = mild PAD."
      - kind: explain
        page: 71
        title: "ضغط باطن الرجل"
        quote: "Predictive value of foot pressure assessment when part of a population based diabetes disease management programme."
        text: |
          الـ **plantar pressure** بيتقاس بـ pressure plate: العيان يقف أو يمشي عليها والجهاز يرسم خريطة ألوان، والأحمر والبنفسجي = ==high pressure points==.

          دي نفس النقط اللي الـ motor neuropathy والـ deformity بيعملوها، وهي أماكن القرح الجاية.
      - kind: explain
        page: 72
        title: "النعل والجزمة"
        quote: "Pressure-relieving Insoles: Cushion the plantar surface & redistribute pressure over a wider surface area."
        text: |
          - ==Pressure-relieving insoles==: بتعمل **cushion** لباطن الرجل وتوزّع الضغط على مساحة أوسع.
          - العيان اللي عنده **gross foot deformities** مش هتنفعه الجزمة العادية: محتاج **therapeutic footwear**.
      - kind: reveal
        page: 72
        quote: "Pressure-relieving Insoles: Cushion the plantar surface & redistribute pressure over a wider surface area."
        prompt: "إزاي توزيع الضغط على مساحة أوسع بيمنع القرحة؟"
        answer: |
          الـ **pressure = force ÷ area**. وزن العيان ثابت، فلو كبّرت المساحة اللي شايلاه، الضغط على كل نقطة يقل.

          زي ما الجمل ما بيغرزش في الرمل علشان خفه واسع: الـ **insole** بيعمل للرجل خف جمل. 🐪
      - kind: try
        items: [dm.L06.017, dm.L06.021, dm.L06.023, dm.L06.028, dm.L06.056]
    recap:
      - "الفحص العصبي: monofilament، tuning fork، VPT. الـ NCS مش لازمة إلا لو شاكك في سبب non-diabetic."
      - "Absent pulses = severe PAD؛ palpable ما بتستبعدش PAD."
      - "ABI: 0.9–1.3 normal، 0.7–0.9 mild، 0.4–0.7 moderate، <0.4 severe (974)."
      - "Insoles بتوزّع الضغط؛ الـ gross deformity محتاجة therapeutic footwear."
    practice: [dm.L06.016, dm.L06.017, dm.L06.018, dm.L06.019, dm.L06.020, dm.L06.021, dm.L06.022, dm.L06.023, dm.L06.024, dm.L06.025, dm.L06.026, dm.L06.027, dm.L06.028, dm.L06.029, dm.L06.052, dm.L06.055, dm.L06.056]
  # ------------------------------------------------------------------
  - id: dm.L06.lesson3
    title: "نعالج الوجع إزاي؟ 30% هي النجاح"
    hook: "الألم مش هيختفي 100%. اعرف امتى تكمّل، امتى تغيّر، وامتى تضيف."
    minutes: 9
    pages: [72, 75]
    topics: [causal, pain]
    goals:
      - "تفرّق causal عن symptomatic therapies"
      - "تعرف الـ DCCT والـ insulin neuritis"
      - "تحفظ جرعات وآثار pregabalin و gabapentin و duloxetine"
      - "تمشي على قاعدة الـ 30%"
    status: unverified
    steps:
      - kind: table
        page: 72
        quote: "Target the underlying pathogenesis."
        title: "استراتيجيتين"
        columns: [Strategy, Aims]
        rows:
          - ["Causal", "Target pathogenesis; hold progress"]
          - ["Symptomatic", "Relieve pain; improve quality of life"]
        hide: [[0, 1], [1, 1]]
      - kind: explain
        page: 73
        title: "الـ causal: ظبط السكر"
        quote: "Intensive treatment significantly reduced both the incidence & progression of DN in patients with T1DM."
        text: |
          الـ ==DCCT==: الـ **intensive treatment** قلل الـ **incidence** والـ **progression** بتاع الـ diabetic neuropathy في **T1DM** بشكل significant.

          في الرسم بتاع الكتاب: الـ **abnormal nerve conduction** كان حوالي 40% في الـ conventional ونزل لأقل من 20% مع الـ intensive.
      - kind: explain
        page: 73
        title: "مفاجأة: الإنسولين وجّع"
        quote: "Occur in poorly-controlled patients shortly after starting aggressive insulin therapy."
        text: |
          ==Insulin neuritis== (treatment-associated neuralgia):
          - **neuropathic pain** بيظهر في عيان **poorly-controlled**
          - **shortly after** ما يبدأ **aggressive insulin therapy**
          - الفرق عن الـ DPN: **no sensory loss** و **no weakness**
          - العلاج: ==temporarily relaxing glycemic control==
      - kind: aside
        tone: joke
        page: 73
        quote: "Temporarily relaxing glycemic control."
        text: "العيان: «يا دكتور أنا ماكنتش بتوجع وسكري 400، ظبطته بقيت بتوجع!» إنت: «معلش، نهدّي اللعب شوية». ده بالظبط العلاج: **relax glycemic control** مؤقتًا 😅"
      - kind: check
        page: 73
        quote: "DD from DPN: No Sensory loss and No weakness."
        question: "HbA1c 13% → intensive insulin 4 weeks ago. Now burning feet, but no sensory loss and no weakness. Best step?"
        options: ["Temporarily relax glycemic control", "Intensify insulin", "NCS and biopsy", "Stop insulin"]
        answer: 0
        why:
          - "صح: insulin neuritis، والعلاج إنك تهدّي ظبط السكر مؤقتًا."
          - "التصحيح السريع هو السبب، مش العلاج."
          - "الصورة typical، مش محتاجة NCS."
          - "مريض T1DM عمره ما يوقف الإنسولين."
      - kind: table
        page: 74
        quote: "Pregabalin is effective in a dose of 150–600 mg/day."
        title: "أدوية الألم"
        columns: [Drug, Dose, Note]
        rows:
          - ["Pregabalin", "150–600 mg/d", "Twice daily"]
          - ["Gabapentin", "900–3600 mg/d", "TDS, slow titration"]
          - ["Duloxetine", "60–120 mg/d", "SNRI"]
        hide: [[0, 1], [1, 1], [1, 2], [2, 1]]
      - kind: sort
        page: 74
        quote: "SEs: Nausea, constipation, dizziness & sedation."
        prompt: "الأثر الجانبي ده بتاع مين؟ (dizziness و sedation مشتركين، فشلناهم)"
        bins: ["Pregabalin / gabapentin", "Duloxetine"]
        cards:
          - { text: "Ankle edema", bin: 0 }
          - { text: "Weight gain", bin: 0 }
          - { text: "Nausea", bin: 1 }
          - { text: "Constipation", bin: 1 }
        why: "الـ gabapentinoids: dizziness، sedation، **ankle edema**، **weight gain**. الـ duloxetine: **nausea**، **constipation**، dizziness، sedation، وبتزيد مع الجرعة العالية."
      - kind: mnemonic
        page: 74
        quote: "Gabapentin needs slow titration."
        word: "PG2 G3"
        parts:
          - { key: "P", text: "Pregabalin" }
          - { key: "G", text: "Given..." }
          - { key: "2", text: "...twice daily (better GI absorption)" }
          - { key: "G", text: "Gabapentin" }
          - { key: "3", text: "three times daily (tds), slow titration" }
        hook: "**Pre**gabalin مرتين، **Gaba**pentin تلاتة: الأقدم محتاج مرات أكتر."
      - kind: explain
        page: 75
        title: "قاعدة الـ 30%"
        quote: "A decrease in pain > 30%: ―Effective‖ therapy."
        text: |
          - ==Be realistic==: الـ **complete disappearance** للألم نادر.
          - نزول الألم **أكتر من 30%** = **effective**.
          - ابدأ بـ **anticonvulsant** أو **antidepressant**، وعلّي الجرعة **تدريجيًا**.
          - **Not effective** (<30%) ← **STOP** وجرّب دوا من **class تاني**.
          - **Effective بس الألم لسه مضايق** ← ==ADD== دوا من class تاني (antidepressant + anticonvulsant).
