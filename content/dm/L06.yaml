    tags: [numbers]
  - id: dm.L06.015
    kind: mcq
    topic: stages
    stem: A diabetic woman has a black, shrivelled, cold second toe with a clear line of demarcation and absent foot pulses. In this lecture's staging, what is it?
    options: [Necrotic foot with dry necrosis (ischaemic), Necrotic foot with wet necrosis (neuropathic), Infected foot, Ulcerated foot, High-risk foot]
    answer: 0
    why:
      - "Correct: dry necrosis belongs to the ischaemic foot (p68)."
      - Wet necrosis is the neuropathic pattern.
      - Infected foot = ulcer infection, cellulitis or osteomyelitis without necrosis as the main feature.
      - Ulcerated foot = neuropathic or ischaemic ulcer.
      - High-risk foot has neuropathy, ischemia or deformity without ulcer.
    src: { page: 68, quote: "Dry Necrosis (Ischaemic Foot)." }
    status: unverified
