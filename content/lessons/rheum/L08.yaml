      - kind: reveal
        page: 160
        prompt: "الـ Buerger بيقطع الرجل بس مش بيموّت. ليه الفرق ده؟"
        quote: "Non necrotizing vasculitis."
        answer: |
          الكتاب: **thromboangiitis obliterans** = **non necrotizing** vasculitis، السبب مش معروف، بيصيب أعمار **19–45**، الدراعات والرجلين مع **claudication**، و ==amputation of limb but not lethal==.

          التفسير المقبول (مش في الكتاب): الالتهاب والجلطة **في شرايين وأوردة الأطراف** بس، مش في الكلية ولا القلب ولا المخ، فالطرف يموت من الـ ischaemia بس العيان نفسه يعيش. وكونه **non necrotizing** يعني الجدار مش بيتهد زي الـ PAN، فمفيش aneurysms ولا نزيف.

          وده بيفرّقه عن الـ atherosclerosis: شاب **تحت 45** بيدخّن وعنده claudication في **الإيدين كمان**، مش راجل كبير عنده رجلين بس.
      - kind: explain
        page: 162
        title: "أعراض الـ cryoglobulinaemia: كل عرض من أنهي ناحية"
        quote: "Neuropathy."
        text: |
          الكتاب: **purpura**، **weakness**، **arthralgias**، **Raynaud's**، **neuropathy**، و **GN**.

          التفسير المقبول (مش في الكتاب): فكّر في الـ cryoglobulin كبروتين **بيتجمّد في البرد ويترسّب كـ immune complex** في الأوعية الصغيرة:
          - **Purpura**: الترسيب في أوعية الجلد، وأكتر في الرجلين لأنها أبرد وتحت ضغط أعلى.
          - **Raynaud's**: الصوابع الباردة بتخلي البروتين يتجمّد ويقفل الدورة.
          - **Neuropathy**: الأوعية الصغيرة اللي بتغذي الأعصاب (vasa nervorum) بتتقفل.
          - **GN**: الـ immune complexes بتقعد في الـ ==glomerulus== زي أي immune-complex disease.
          - **Weakness و arthralgias**: الالتهاب العام.

          يعني التتراد اللي تفتكره: **purpura + arthralgia + weakness**، ولو معاهم GN أو neuropathy اسأل على الـ hepatitis C.
