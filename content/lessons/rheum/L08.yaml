            <text x="85" y="166" text-anchor="middle" class="t-sm t-mut">over GC alone</text>
            <rect x="170" y="125" width="150" height="55" rx="8" class="fg-box"/>
            <text x="245" y="148" text-anchor="middle" class="t-sm">High-dose / pulse GC</text>
            <text x="245" y="166" text-anchor="middle" class="t-sm">+ cyclophosphamide</text>
            <path d="M85 180 V205" class="fg-arrow" marker-end="url(#L08p)"/>
            <path d="M245 180 V205" class="fg-arrow" marker-end="url(#L08p)"/>
