  - id: endo.L04.244
    kind: essay
    topic: crf-hpt
    prompt: What are the effects of CKD on the parathyroid gland?
    outline:
      - Secondary HPT driven by hypocalcaemia
      - Reduced 1,25(OH)2 D3 synthesis (key role)
      - Hyperphosphataemia suppresses 1α-hydroxylase
      - Fewer parathyroid calcitriol receptors
      - Loss of vitamin D's antiproliferative effect causes marked PTH and nodular hyperplasia
