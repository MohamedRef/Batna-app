  - id: res.L10.lesson6
    title: "تقرا إزاي وتقرا إيه؟ أنواع الـ publications"
    hook: "Original، review، systematic review، guideline: 4 أنواع ورق، ولكل واحد وقته."
    minutes: 9
    pages: [77, 87]
    topics: [sources]
    goals:
      - "تعدّ مستويات القراءة التلاتة"
      - "تفرّق بين الـ 4 types of publications"
      - "تعرف ليه Sackett قال احرقوا الكتب"
    status: unverified
    steps:
      - kind: explain
        page: 77
        quote: "Three levels of reading the scientific literature have been described:\n  (1) Browsing — flicking through actual books and articles, looking for anything of interest, and browsing topic-related sites on the Internet;\n  (2) Reading for information — approaching the literature in search of an answer to a specific question\n  (3) Reading for research — reading in order to obtain a comprehensive view of the existing state of knowledge on a specific topic."
        title: "3 مستويات قراءة"
        text: |
          الـ **scientific literature** موجودة في كتب وتقارير حكومية وjournals وpolicy statements ومؤتمرات. وبنقراها على 3 مستويات:
          - ==Browsing==: بتقلّب في الكتب والمقالات والمواقع على أي حاجة تشدّك. كده بنعرف معظم اللي نعرفه.
          - **Reading for information**: عندك **سؤال محدد** وبتدوّر على إجابته («الـ dose بتاعة الـ enoxaparin في الـ CKD كام؟»).
          - ==Reading for research==: عايز **صورة كاملة** للمعروف عن موضوع (قبل ما تكتب الـ MSc protocol).
      - kind: check
        page: 77
        quote: "(3) Reading for research — reading in order to obtain a comprehensive view of the existing state of knowledge on a specific topic."
        question: "Reading to obtain a comprehensive view of the existing state of knowledge on a topic is:"
        options: ["Reading for research", "Reading for information", "Browsing"]
        answer: 0
        why:
          - "صح: صورة كاملة للمعروف = reading for research."
          - "ده لإجابة سؤال واحد محدد."
          - "ده تقليب على أي حاجة تشدّك."
      - kind: explain
        page: 78
        quote: "We focus primarily on journal publications because they have gone through a process of peer review to enhance the quality of the information and are the closest thing to a gold standard that is available."
        title: "ليه الـ journals؟"
        text: |
          عشان الـ literature review يبقى **structured**، بنركّز على الـ ==journal publications==: عدّت على **peer review** بيحسّن جودة المعلومة، وهي **أقرب حاجة لـ gold standard** عندنا.
      - kind: figure
        page: 79
        quote: "When conducting a search of the scientific literature, there are four types of publications to look for:\n  1. Original research articles:\n  The papers written by the authors who conducted the research."
        title: "4 أنواع publications"
        alt: "Four boxes in a row: original research articles written by the researchers; review articles, a narrative summary; systematic reviews, a structured integration with meta-analysis giving a summary estimate; and guidelines, formal advice for practice."
        caption: "**Original** (الباحثين نفسهم) ← **review** (ملخص سردي) ← **systematic review** (منظم، والـ meta-analysis بتطلع رقم واحد) ← **guidelines** (نصيحة للممارسة)."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L10p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="145" height="80" rx="8" class="fg-box"/>
            <text x="82" y="34" text-anchor="middle" class="t-sm t-b">1 Original research</text>
            <text x="82" y="54" text-anchor="middle" class="t-sm t-mut">by the researchers</text>
            <text x="82" y="70" text-anchor="middle" class="t-sm t-mut">methods, results</text>
            <rect x="175" y="10" width="145" height="80" rx="8" class="fg-thin"/>
            <text x="247" y="34" text-anchor="middle" class="t-sm t-b">2 Review article</text>
            <text x="247" y="54" text-anchor="middle" class="t-sm t-mut">narrative summary</text>
            <text x="247" y="70" text-anchor="middle" class="t-sm t-bad">not always systematic</text>
            <rect x="10" y="110" width="145" height="80" rx="8" class="fg-acc"/>
            <text x="82" y="134" text-anchor="middle" class="t-sm t-b">3 Systematic review</text>
            <text x="82" y="154" text-anchor="middle" class="t-sm t-mut">organized, structured</text>
            <text x="82" y="170" text-anchor="middle" class="t-sm t-mut">meta-analysis: 1 estimate</text>
            <rect x="175" y="110" width="145" height="80" rx="8" class="fg-good"/>
            <text x="247" y="134" text-anchor="middle" class="t-sm t-b">4 Guidelines</text>
            <text x="247" y="154" text-anchor="middle" class="t-sm t-mut">formal advice</text>
            <text x="247" y="170" text-anchor="middle" class="t-sm t-mut">research → practice</text>
            <path d="M155 50H171" class="fg-arrow" marker-end="url(#L10p)"/>
            <path d="M247 90L90 108" class="fg-arrow" marker-end="url(#L10p)"/>
            <path d="M155 150H171" class="fg-arrow" marker-end="url(#L10p)"/>
          </svg>
      - kind: explain
        page: 80
        quote: "2. Review articles:\n  A narrative summary of what is known on a particular topic (a review article presents a summary of original research articles).\n  Limitation: do not always follow systematic approaches, a practice that sometimes leads to inconsistent results."
        title: "Original ضد review"
        text: |
          - **Original research articles**: كتبها اللي **عملوا البحث**، فيها الـ methods والـ results ومعناها.
          - ==Review articles==: **narrative summary** للمعروف عن موضوع (ملخص للـ original articles)، زي الـ Annual Review of Public Health. عيبها: **مش دايمًا systematic**، فأحيانًا النتايج بتطلع **inconsistent**.
      - kind: explain
        page: 82
        quote: "3. Systematic review\n  An approach that provides a systematic, organized, and structured way of integrating the findings of individual research studies.\n  In meta-analysis, researchers produce a summary statistical estimate of the measure of association.\n  For example, the Cochrane Collaboration (www.cochrane.org)"
        title: "Systematic review وmeta-analysis"
        text: |
          ==Systematic review== = طريقة **systematic, organized, structured** تجمع بيها نتايج الدراسات الفردية.

          والـ ==meta-analysis== بتزوّد **summary statistical estimate** واحد للـ measure of association (رقم واحد بدل 20 دراسة).

          المثال: الـ **Cochrane Collaboration**؛ حاجات كتير ببلاش، والـ full reports محتاجة membership عن طريق مؤسسة.

          الدكتورة فرّقت في الشرح بين الاتنين: الـ systematic review ممكن **يخلص من غير meta-analysis** لو الدراسات مختلفة جدًا (heterogeneous) أو مش قابلة تتجمع إحصائيًا. يعني كل meta-analysis جواها systematic review، بس مش العكس.
      - kind: check
        page: 82
        quote: "3. Systematic review\n  An approach that provides a systematic, organized, and structured way of integrating the findings of individual research studies."
        question: "An organized approach of integrating the findings of individual research studies is called:"
        options: ["A systematic review", "A review", "Practice guidelines", "None of the above"]
        answer: 0
        why:
          - "صح: systematic, organized, structured integration."
          - "الـ narrative review ملخص، بس مش دايمًا systematic."
          - "الـ guidelines نصيحة رسمية للممارسة."
          - "الإجابة موجودة: a."
      - kind: explain
        page: 84
        quote: "4. Guidelines:\n  Practice guidelines are formal statements that offer advice to clinicians, public health practitioners, managed-care organizations, and the public on how to improve the effectiveness and impact of clinical and public health interventions.\n  Guidelines translate the findings of research and demonstration projects into accessible and useable information for public health practice."
        title: "Practice guidelines"
        text: |
          الـ **practice guidelines** = ==formal statements== بتنصح الأطباء وممارسي الـ public health والـ managed-care organizations والناس ==إزاي يحسّنوا فعالية وأثر التدخلات==.

          وبتحوّل ==نتايج الأبحاث== لمعلومة سهلة ومفيدة للممارسة.

          ليه مهمة؟ الطبيب مش هيقرا ألف بحث، فالـ guideline بتلخّصهم في توصية يقدر يطبقها. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 85
        quote: "There are several examples of useful guidelines. The terminology used within them differs across the globe. Thus, in the European Community, directives are stronger than recommendations, which are stronger than guidelines. No such hierarchy exists in North America."
        title: "Guidelines"
        text: |
          ==Practice guidelines== = **formal statements** بتنصح الأطباء وناس الـ public health والـ managed-care organizations والناس، إزاي يحسّنوا تأثير الـ interventions. بتترجم نتايج الأبحاث لمعلومة تتطبّق.

          الأسماء بتختلف: في الـ **European Community**: **directives** أقوى من **recommendations**، أقوى من **guidelines**. في **North America** مفيش الترتيب ده.
      - kind: order
        page: 85
        quote: "Thus, in the European Community, directives are stronger than recommendations, which are stronger than guidelines."
        prompt: "في الـ European Community، رتّبهم من الأقوى للأضعف:"
        steps: ["Directives", "Recommendations", "Guidelines"]
        why: "Directives > recommendations > guidelines. وفي North America مفيش hierarchy."
      - kind: aside
        tone: joke
        page: 86
        quote: "To find the best quality evidence for medical decision making, Sackett and colleagues recommended that practitioners burn their (traditional) textbooks."
        text: |
          ==Sackett== وزمايله قالوا للأطباء: «**احرقوا الـ textbooks**» عشان تلاقوا أحسن evidence.

          بس قبل ما تولّع في كتاب الـ internal medicine: إجابة امتحانك لسه **من الكتاب**. الحرق بعد يناير 2027 إن شاء الله.
      - kind: reveal
        page: 87
        quote: "To stay up to date in clinical practice, a textbook may need to be revised on a yearly basis.\n  However, research and publication of results in a journal is a deliberative process that often takes years from the germination of an idea, to obtaining funding, carrying out the study, analyzing data, writing up results, submitting to a journal, and waiting out the peer-review process and publication lag for a journal."
        prompt: "ليه الـ textbook محدود في معلومات الـ cause والـ diagnosis والـ prognosis والـ treatment؟"
        answer: |
          عشان يفضل **up to date** محتاج يتراجع **كل سنة**، والبحث نفسه بياخد **سنين**: فكرة، funding، دراسة، تحليل، كتابة، submission، **peer review**، وانتظار النشر. فالكتاب دايمًا متأخر خطوة.

          عشان كده الـ **review articles** والـ **guidelines** shortcut مفيد للمشغول.
      - kind: try
        items: [res.L10.063, res.L10.066, res.L10.071]
    recap:
      - "3 levels: browsing، reading for information، reading for research."
      - "الـ journals: peer review، أقرب حاجة للـ gold standard."
      - "4 types: original، review (narrative)، systematic review (+ meta-analysis)، guidelines."
      - "Europe: directives > recommendations > guidelines؛ North America مفيش hierarchy."
      - "Sackett: burn the textbooks، لأن الكتاب بيتأخر عن البحث."
    practice: [res.L10.063, res.L10.064, res.L10.065, res.L10.066, res.L10.067, res.L10.068, res.L10.069, res.L10.070, res.L10.071, res.L10.072, res.L10.113]
