        title: "أشكال الـ immunofluorescence"
        image: { file: neph/L08-if-patterns.webp, book: true }
        alt: "Eight immunofluorescence panels: mesangial IgA, mesangial and capillary wall IgG, peripheral granular C3 in type I MPGN, band-like C3 in type II MPGN, coarse granular C3 in post-infectious GN, fine granular IgG in membranous, linear IgG in anti-GBM and chunky IgG in fibrillary GN."
        caption: "من الكتاب: 8 أشكال للـ immunofluorescence (IF). أهمها: ==linear== = anti-GBM، **fine granular** على الـ capillary wall = membranous، **mesangial IgA** = IgA nephropathy."
      - kind: explain
        page: 218
        title: "ليه كل شكل في الـ IF بيقول مرض؟"
        quote: "Major immunofluorescence pathological patterns"
        text: |
          الـ **major immunofluorescence pathological patterns** في الكتاب 8، بس فيهم منطق واحد: **الشكل بيقولك الـ antibody قاعدة على إيه**.

          التفسير المقبول (مش في الكتاب):
          - ==Linear== (anti-GBM): الـ antibody لازقة في الـ GBM **نفسه**، والـ antigen موزّع على الغشا كله بالتساوي، فالخط ناعم ومتصل.
          - **Granular** (membranous، post-infectious، MPGN): الـ antibody في **immune complexes** متجمّعة في نقط، فتطلع حبيبات. الحبيبات **الناعمة** على الجدار = complexes صغيرة تحت الـ podocyte (membranous)، و**الخشنة** = humps كبيرة (post-infectious).
          - **Mesangial** (IgA): الـ complexes الكبيرة بتتحجز في الـ mesangium، علشان هو مفتوح على الدم من غير GBM.
          - **Band-like C3** (type II MPGN): C3 ماشي **جوّه** الغشا نفسه كشريط، من غير IgG.
          - **Chunky** (fibrillary): كتل خشنة من الـ fibrils المترسبة.

          يعني ما تحفظش 8 صور؛ اسأل: الخط متصل ولا حبيبات؟ على الجدار ولا في النص؟ IgG ولا C3 بس؟

          إزاي تفتكر الأشكال؟ التفسير المقبول (مش في الكتاب): فكّر في **مين بيتمسك** وفين:
          - antibody ماسك في **الغشا نفسه** كله (antigen موزع بانتظام) ← خط مستمر = **linear** (anti-GBM).
          - antibody ماسك في **حتت** متفرقة (immune complexes) ← نقط = **granular** (membranous، lupus، post-infectious).
          - كل الـ deposits في **الـ mesangium** ← شكل شجرة = IgA.
          - **مفيش** حاجة خالص ← pauci-immune (ANCA) أو podocytopathy (MCD، FSGS).
          فشكل الـ IF مش حفظ، ده نتيجة مكان الـ antigen.
