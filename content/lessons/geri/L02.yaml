  - id: geri.L02.lesson5
    title: "ملح وبوتاسيوم وميه: ليه الكلية العجوزة بتقع؟"
    hook: "ما تمنعش الملح خالص، وخلي بالك من الكرنب، واسقيه في الحر. كل نصيحة منهم ليها سبب في الكلية."
    minutes: 9
    pages: [28, 29]
    topics: [physiology]
    goals:
      - "تفهم ليه الكبار بيتعبوا من نقص الملح ومن الـ hyperkalemia ومن الجفاف"
      - "تعرف الأدوية الأربعة اللي بترفع البوتاسيوم"
      - "تحفظ رقم الـ glomerular filtration rate (GFR) مع كل عشر سنين"
    status: unverified
    steps:
      - kind: explain
        page: 28
        title: "الملح: لا تزوّده ولا تمنعه خالص"
        quote: "Physiological changes in elders\n  ↑ night excretion of Na+/K+/total solutes.\n  Caution: intense Na+ restriction → volume contraction\n    ↓ Renal functions\n    Orthostatic hypotension\n    ↑ Plasma ANP (Cardiodilatin ).\n    ↓ RAAS → hyper kalemia.\n  Caution: K. sparing diuretic, RAAS blockade, NSAIDs, BBs.\n    Urinary dilution\n  Water load → low hourly free water clearance (Nephron loss, high ADH)\n    Urinary concentration\n    ↓ Capacity to maximally concentrate the urine (defective Na re-absorption in ALOH)."
        text: |
          - إخراج الـ **Na و K** والـ solutes بيزيد ==بالليل== ← ده جزء من ليه الحاج بيصحى يدخل الحمام.
          - الكلية العجوزة **مش بتعرف تحافظ على الصوديوم**. علشان كده الـ ==intense Na restriction== ← volume contraction ← وظايف الكلى تقل ← **orthostatic hypotension**.
          - الـ **atrial natriuretic peptide (ANP)** بيعلى، وده بيزوّد خروج الصوديوم.

          ليه الحاج بيخسر ملح؟ التفسير المقبول (مش في الكتاب): الـ tubules أقصر، والـ **ANP عالي** بيقول للكلية "طلّعي ملح"، والـ **RAAS واطي** فمفيش aldosterone كفاية يمسكه. يعني الكلية بتسرّب صوديوم طول الوقت، ولو انت كمان منعته خالص من الأكل، الحجم يقع.
      - kind: explain
        remind: [geri.L02.013]
        page: 28
        title: "الـ RAAS نايم ← البوتاسيوم بيعلى"
        quote: "Physiological changes in elders\n  ↑ night excretion of Na+/K+/total solutes.\n  Caution: intense Na+ restriction → volume contraction\n    ↓ Renal functions\n    Orthostatic hypotension\n    ↑ Plasma ANP (Cardiodilatin ).\n    ↓ RAAS → hyper kalemia.\n  Caution: K. sparing diuretic, RAAS blockade, NSAIDs, BBs.\n    Urinary dilution\n  Water load → low hourly free water clearance (Nephron loss, high ADH)\n    Urinary concentration\n    ↓ Capacity to maximally concentrate the urine (defective Na re-absorption in ALOH)."
        text: |
          الـ **renin** والـ **aldosterone** بيقلوا مع السن ← ==hyperkalemia== أسهل.

          خلّي بالك من أربع أدوية:
          - **K-sparing diuretics**
          - **renin–angiotensin–aldosterone system (RAAS) blockade**: angiotensin-converting enzyme inhibitor (ACEI) و angiotensin II receptor blocker (ARB)
          - **non-steroidal anti-inflammatory drugs (NSAIDs)**
          - **Beta-blockers**

          ليه الأربعة دول بالذات؟ كل واحد بيقفل حتة من طريق خروج البوتاسيوم، والـ aldosterone هو اللي بيطلّعه في الـ distal tubule:
          - **K-sparing diuretics** بتمنع الـ aldosterone يشتغل.
          - **ACEI و ARB** بيقللوا الـ angiotensin II، فالـ aldosterone يقل.
          - **NSAIDs** بتقلل الـ prostaglandins اللي بتحفّز الـ renin.
          - **Beta-blockers** بتقلل الـ renin (اللي بيطلع بالـ sympathetic) وبتقلل دخول الـ K للخلايا. (التفسير المقبول، مش في الكتاب.)

          والحاج أصلًا الـ renin عنده واطي، فأي دوا منهم بيكمّل عليه.
      - kind: mnemonic
        page: 28
        quote: "Physiological changes in elders\n  ↑ night excretion of Na+/K+/total solutes.\n  Caution: intense Na+ restriction → volume contraction\n    ↓ Renal functions\n    Orthostatic hypotension\n    ↑ Plasma ANP (Cardiodilatin ).\n    ↓ RAAS → hyper kalemia.\n  Caution: K. sparing diuretic, RAAS blockade, NSAIDs, BBs.\n    Urinary dilution\n  Water load → low hourly free water clearance (Nephron loss, high ADH)\n    Urinary concentration\n    ↓ Capacity to maximally concentrate the urine (defective Na re-absorption in ALOH)."
        word: "KRNB"
        parts:
          - { key: "K", text: "K-sparing diuretics" }
          - { key: "R", text: "RAAS blockade (ACEI, ARB)" }
          - { key: "N", text: "NSAIDs" }
          - { key: "B", text: "Beta-blockers" }
        hook: "**«كرنب»**: KRNB. الحاج اللي بياكل كرنب وواخد الأربعة دول، البوتاسيوم عنده هيطلع السما."
      - kind: case
        page: 28
        quote: "Physiological changes in elders\n  ↑ night excretion of Na+/K+/total solutes.\n  Caution: intense Na+ restriction → volume contraction\n    ↓ Renal functions\n    Orthostatic hypotension\n    ↑ Plasma ANP (Cardiodilatin ).\n    ↓ RAAS → hyper kalemia.\n  Caution: K. sparing diuretic, RAAS blockade, NSAIDs, BBs.\n    Urinary dilution\n  Water load → low hourly free water clearance (Nephron loss, high ADH)\n    Urinary concentration\n    ↓ Capacity to maximally concentrate the urine (defective Na re-absorption in ALOH)."
        stem: "An 81-year-old man on lisinopril and bisoprolol is given spironolactone, a K-sparing diuretic, on top of his RAAS blockade, and buys ibuprofen, an NSAID, for knee pain."
        steps:
          - question: "Which electrolyte do you fear most?"
            options:
              - "Hyperkalemia"
              - "Hypernatremia"
              - "Hypocalcemia"
              - "Hypokalemia"
            answer: 0
            why: "Low renin and aldosterone with age, plus all four KRNB drugs at once."
          - reveal: "K+ comes back 6.4 mmol/L."
            question: "Which drug is the easiest first one to stop?"
            options:
              - "Ibuprofen"
              - "Lisinopril"
              - "Bisoprolol"
              - "Nothing; K+ is fine at his age"
            answer: 0
            why: "The non-steroidal anti-inflammatory drugs (NSAID) adds nothing for his heart and also harms the kidney; stop it first, then review spironolactone. (Clinical reasoning; the drug list is from the book.)"
      - kind: explain
        page: 28
        title: "الميه: لا بيخففها ولا بيركّزها"
        quote: "Physiological changes in elders\n  ↑ night excretion of Na+/K+/total solutes.\n  Caution: intense Na+ restriction → volume contraction\n    ↓ Renal functions\n    Orthostatic hypotension\n    ↑ Plasma ANP (Cardiodilatin ).\n    ↓ RAAS → hyper kalemia.\n  Caution: K. sparing diuretic, RAAS blockade, NSAIDs, BBs.\n    Urinary dilution\n  Water load → low hourly free water clearance (Nephron loss, high ADH)\n    Urinary concentration\n    ↓ Capacity to maximally concentrate the urine (defective Na re-absorption in ALOH)."
        text: |
          - **Dilution:** لو شرب ميه كتير، الـ free water clearance بتبقى قليلة، علشان الـ nephrons قليلة والـ **antidiuretic hormone (ADH)** عالي ← ممكن **hyponatremia**.
          - **Concentration:** مش بيعرف يركّز البول للآخر، علشان الـ Na reabsorption في الـ ==ascending loop of Henle== ضعيف.
          - وفوق ده ==الـ thirst بيقل==.

          النتيجة: في الحر، الحاج بيخسر ميه ومش عطشان ← **hypernatremia** و dehydration.

          يعني الكلية العجوزة واقعة في المشكلتين من الناحيتين: لو شرب **كتير** ما بتعرفش تطلّع الميه الزيادة بسرعة، ولو شرب **قليل** ما بتعرفش تحوّش. الهامش ضيق، زي ما المحاضرة بدأت.
      - kind: reveal
        page: 28
        quote: "Physiological changes in elders\n  ↑ night excretion of Na+/K+/total solutes.\n  Caution: intense Na+ restriction → volume contraction\n    ↓ Renal functions\n    Orthostatic hypotension\n    ↑ Plasma ANP (Cardiodilatin ).\n    ↓ RAAS → hyper kalemia.\n  Caution: K. sparing diuretic, RAAS blockade, NSAIDs, BBs.\n    Urinary dilution\n  Water load → low hourly free water clearance (Nephron loss, high ADH)\n    Urinary concentration\n    ↓ Capacity to maximally concentrate the urine (defective Na re-absorption in ALOH)."
        prompt: "ليه ضعف الـ Na reabsorption في الـ ascending loop يبوّظ تركيز البول؟"
        answer: |
          الـ ascending loop بيطلّع **sodium chloride (NaCl)** في الـ medulla من غير ميه، وده اللي بيعمل الـ **medullary gradient**. الـ collecting duct بعد كده بيسحب الميه على الـ gradient ده بالـ ADH.

          لو الـ loop ضعيف، الـ gradient يقل، فحتى مع ADH عالي الكلية مش هتقدر **maximally concentrate the urine**. (تفسير فسيولوجي.)
      - kind: figure
        page: 28
        title: "الـ nephron كله: من الـ capsule للـ collecting duct"
        image: { file: geri/L02-nephron.webp, book: true }
        alt: "The book's classic drawing of nephrons across the kidney: glomerular capsule, first convoluted tubule, Henle's loop with descending and ascending limbs dipping into the medulla, the second convoluted tubule, junctional tubule, collecting tubule and duct of Bellini, with afferent and efferent vessels, interlobular artery and vein, arterial and venous arches and arteriae rectae; labels on the right mark cortical substance, boundary zone and medullary substance."
        caption: |
          رسمة الكتاب في ص 28 للـ nephron كله، ونازلة من الـ cortex للـ medulla:

          - **على اليمين** تلات أقواس: **Cortical substance** فوق، و **Boundary zone** في النص، و **Medullary substance** تحت.
          - **فوق**: الـ **Glomerular capsule** والـ 1st convoluted tubule، وجنبها الـ afferent والـ efferent vessels.
          - **في النص على الشمال**: ==Henle's loop== بالـ descending والـ **ascending limb**، نازلة جوه الـ medulla.
          - **تحت**: الـ collecting tubule والـ duct of Bellini، والـ arteriae rectae جنبهم.

          اللي تاخده: الـ ascending limb هو المكان اللي الصوديوم بيتشال فيه علشان الـ medulla تبقى مركّزة، وده اللي ==defective Na reabsorption== بيبوّظه في الكبير، فالبول ما يتركّزش.
      - kind: figure
        page: 29
        title: "الكلية والسن: الأرقام"
        quote: "GFR: ↓ ⁓ 10 ml/decade) above 40 years\nRPF: ↓ ⁓ 10% decade above 40 years"
        alt: "Bar chart of an approximate GFR by age: about 120 at 40, falling by about 10 ml per decade to about 80 at 80; beside it arrows showing reduced response to vasodilators and increased response to vasoconstrictors."
        caption: "بعد الـ 40: الـ ==GFR== بيقل حوالي **10 ml كل عشر سنين**، والـ renal plasma flow (RPF) حوالي **10%** كل عشر سنين. الأرقام في الرسمة توضيحية على أساس الـ rule ده."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="20" class="t-sm t-b">GFR (ml/min), illustrative</text>
            <path d="M40 200 H320" class="fg-arrow"/>
