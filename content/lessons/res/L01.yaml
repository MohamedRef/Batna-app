          - **Statement of the problem**: what is the problem and why study it?
          - **Literature review**: what information is available?
          - ==Research objectives==: why do the research, what do we hope to achieve? (general, specific, hypotheses)
          - ==Research methodology==: what data do we need, and how will we collect them?
          - **Work plan**: who will do what, and when?
          - **Budget**: what resources do we need, and what do we have?
          - **Administration and utilisation**: how will the project be run and its results used?
          - **Proposal summary**: how will we present it to authorities, community and funders?
