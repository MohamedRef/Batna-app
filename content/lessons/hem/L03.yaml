  - id: hem.L03.lesson10
    title: "لما المناعة تهاجم الكرة: الـ AIHA"
    hook: "جسمك ممكن يعمل antibodies ضد كراتك. سخنة ولا باردة؟ الإجابة بتغيّر العلاج كله."
    minutes: 9
    pages: [37, 39]
    topics: [aiha]
    goals:
