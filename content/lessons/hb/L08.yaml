          </svg>
      - kind: table
        page: 126
        title: "Predictable ولا unpredictable؟"
        columns: ["", "Predictable", "Unpredictable"]
        rows:
          - ["Dose", "Dose related", "Not dose related"]
          - ["Drug", "Intrinsically hepatotoxic", "— (not stated)"]
          - ["Onset", "Acute (hours)", "Weeks to months"]
          - ["How common", "— (not stated)", "Rare: 0.01–1.0%"]
          - ["Picture", "Necrosis; fulminant acute hepatitis", "Immune or metabolic idiosyncrasy"]
          - ["Example", "Acetaminophen", "Phenytoin; INH"]
        hide: [[0, 1], [0, 2], [2, 1], [2, 2], [3, 2], [5, 1]]
      - kind: aside
        tone: joke
        page: 126
        text: |
          الـ **acetaminophen** زي الشطة: معلقة صغيرة تحلّي الأكل، إزازة كاملة تولّع الدنيا. ده معنى **predictable = dose related**. 🌶️

          أما الـ idiosyncratic فزي الحساسية من الفراولة: مش بالكمية، بالحظ.
      - kind: mnemonic
        page: 127
        word: "FARE"
        parts:
          - { key: "F", text: "Fever" }
          - { key: "A", text: "Arthralgia" }
          - { key: "R", text: "Rash" }
          - { key: "E", text: "Eosinophilia" }
        hook: |
          الـ immune idiosyncrasy (hypersensitivity) بيدفّعك **FARE**: تمن التذكرة = حمى، مفاصل، طفح، و eosinophils.
      - kind: sort
        page: 127
        prompt: "حط كل دوا في النوع اللي الكتاب حاطه فيه:"
        bins: ["Immune idiosyncrasy", "Metabolic idiosyncrasy", "Predictable (dose)"]
        cards:
          - { text: "Phenytoin", bin: 0 }
          - { text: "Sulfonamides", bin: 0 }
          - { text: "Valproate", bin: 0 }
          - { text: "INH", bin: 1 }
          - { text: "Ketoconazole", bin: 1 }
          - { text: "Diclofenac", bin: 1 }
          - { text: "Acetaminophen", bin: 2 }
        why: "Immune (hypersensitivity): **phenytoin، sulfonamides، valproate**. Metabolic (toxic metabolites): **INH، ketoconazole، diclofenac**. Predictable: **acetaminophen**."
      - kind: explain
        page: 128
        title: "كل خلية وإصابتها"
        text: |
          رسمة الـ cells في صفحة 128 بتقول إن الدوا بيعمل مرض حسب الخلية اللي ضربها:

          - **Hepatocyte**: acute و chronic hepatitis، cholestasis، cirrhosis، steatosis، phospholipidosis، steatohepatitis، granulomatous hepatitis.
          - **Cholangiocyte**: acute و chronic cholangitis، sclerosing cholangitis.
          - **Endothelial cell**: veno-occlusive disease، sinusoidal dilation، peliosis hepatis، Budd-Chiari.
          - **Ito (stellate) cell**: perisinusoidal fibrosis.

          المنطق سهل: الـ hepatocyte بيعمل كل حاجة فبيتصاب بكل حاجة. القنوات بتلتهب. الأوعية بتتسد. والـ stellate هي مصنع الـ fibrosis (زي ما شفنا في L01).

          و histologically فيه 3 أنواع بس:

          - ==Hepatocellular==: الضرب في الـ hepatocytes.
          - ==Cholestatic==: الضرب في الـ bile ducts أو الـ canaliculi.
          - ==Mixed==: الاتنين.
      - kind: figure
        page: 128
        title: "كل خلية والإصابة بتاعتها"
        alt: "Sketch of a sinusoid. Top: a row of hepatocytes with the bile canaliculus between them draining to a bile duct lined by cholangiocytes. Middle: the space of Disse with a stellate (Ito) cell. Bottom: the sinusoid lined by endothelial cells. Labels: hepatocyte, hepatitis, cholestasis, steatosis, granulomas; cholangiocyte, cholangitis, sclerosing cholangitis; stellate cell, perisinusoidal fibrosis; endothelial cell, veno-occlusive disease, sinusoidal dilation, peliosis, Budd-Chiari."
        caption: "الخلية اللي الدوا ضربها هي اللي بتحدد المرض: **hepatocyte** (hepatitis، steatosis)، **cholangiocyte** (cholangitis)، **stellate** (fibrosis)، **endothelium** (VOD، peliosis)."
