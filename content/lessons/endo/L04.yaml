      - kind: explain
        page: 73
        quote: "Adrenal invasion by CMV is noted in up to 50% of patients with adrenal pathology. Mycobacterium avium complex, Kaposi's sarcoma, C. Neoformans, and Histoplasma capsulatum involve the adrenal glands in 5 to 12% of cases."
        title: "مين بيضرب الـ adrenal؟"
        text: |
          الـ adrenal هو ==أكتر غدة بتتأثر== في الـ acquired immunodeficiency syndrome (AIDS)، بس الـ **insufficiency** نفسها في **أقل من 8%**. يعني الغدة بتتصاب كتير، بس نادرًا لدرجة إنها تفشل، لأن لازم أغلب الـ cortex يتدمر قبل ما تبان.

          تلات طرق، زي ما قال الكتاب في ص 65:
          1. **عدوى**: الـ cytomegalovirus (CMV) في **لحد 50%** من اللي عندهم adrenal pathology. والـ Mycobacterium avium complex (MAC) و Kaposi's sarcoma و Cryptococcus neoformans و Histoplasma capsulatum في **5-12%**.
          2. **أدوية**: ==ketoconazole== بيعمل adrenal dysfunction (بيوقف تصنيع الـ steroids)، و ==rifampin== بيزوّد الـ **clearance** بتاع الـ cortisol.
          3. **Central** (ص 75).
