  - id: neph.L07.lesson2
    title: "برّه الكلية: كبد وأنيوريزم وتشخيص بالسونار"
    hook: "عيان ADPKD بيموت أحيانًا من المخ مش من الكلية. ومين نعمله MRA؟ ومين نقوله عندك المرض من السونار؟"
    minutes: 9
    pages: [151, 156]
    topics: [adpkd-extrarenal, adpkd-dx]
    goals:
      - "تعرف الـ PLD والـ aneurysms والقلب والأكياس التانية بالأرقام"
      - "تعرف مين يتعمله screening للـ aneurysm وبإيه"
      - "تطبّق الـ ultrasound criteria حسب السن"
    status: unverified
    steps:
      - kind: explain
        page: 151
        title: "الكبد: أشهر حاجة برّه الكلية"
        quote: "Polycystic Liver Disease PLD is the most common extrarenal manifestation of ADPKD. PLD is associated with both PKD1 and PKD2 genotypes. In contrast to the Hepatic cysts are exceedingly rare in children with ADPKD. Their frequency increases with age and may have been underestimated by age than men. Women who have multiple pregnancies or who have used oral contraceptives (OCs) or estrogen replacement therapy (ERT) in the postmenopausal period may have worse disease. After menopause Typically, PLD is asymptomatic, but reported symptoms have become more frequent as the life span of patients with ADPKD is prolonged with dialysis and transplantation. Symptoms result from mass effect or from complications related to the cysts themselves. Symptoms include dyspnea, orthopnea, early satiety, gastroesophageal reflux, mechanical low back pain, uterine prolapse, and even rib fracture. Other complications caused directly by mass effect include hepatic venous outflow obstruction, IVC compression, portal vein compression, and bile duct compression presenting as obstructive jaundice. Hepatic venous outflow."
        text: |
          الـ ==polycystic liver disease== هو **أشهر extrarenal manifestation**، مع PKD1 و PKD2.

          نادر جدًا في الأطفال ويزيد مع السن. أوحش في الستات اللي حملوا كتير أو خدوا **oral contraceptives (OCs) أو estrogen replacement therapy (ERT)** (الـ estrogen بيكبّر الأكياس).

          غالبًا asymptomatic، ولما يكبر: **dyspnea، early satiety، gastro-oesophageal reflux disease، ألم ضهر**، وكمان ضغط على الـ hepatic veins والـ inferior vena cava (IVC) والـ portal vein والـ bile duct (**obstructive jaundice**).
      - kind: explain
        page: 151
        title: "الـ intracranial aneurysm بالأرقام"
        quote: "Intracranial aneurysms occur in about 8% of patients with ADPKD. There is some familial clustering; intracranial aneurysms occur in 6% of patients with a negative family history and 16% of those with a positive family history. Most are asymptomatic. Focal findings, such as cranial nerve palsy and seizure, may result from compression of local structures by an enlarging aneurysm (Fig. 44.5). Yearly rupture rates increase with size, ranging from less than 0.5% for aneurysms smaller than 5 mm in diameter to 4% for aneurysms larger than 10 mm. Rupture carries a 35% to 55% risk for combined severe morbidity and mortality."
        text: |
          - موجودة في حوالي ==8%==: **6%** من غير family history و **16%** لو فيه.
          - أغلبها asymptomatic؛ اللي بتكبر ممكن تعمل **cranial nerve palsy أو seizure**.
          - الـ rupture السنوي: أقل من **0.5%** لو أقل من 5 mm، و **4%** لو أكبر من 10 mm. والـ rupture = **35–55%** morbidity و mortality.
          - متوسط السن عند الـ rupture ==39 سنة== (مقابل 51 في الناس العادية)، و **29%** ضغطهم طبيعي!
      - kind: mnemonic
        page: 152
        quote: "Screening is not indicated for all patients with ADPKD because Indications for screening in patients with a good life expectancy include family history of intracranial aneurysm or subarachnoid hemorrhage, previous aneu- rysmal rupture, preparation for elective surgery with potential hemo-dynamic instability, high-risk occupations (e.g., airline pilots), and significant patient anxiety despite adequate information about the risks."
        word: "FRESH"
        parts:
          - { key: "F", text: "Family history of aneurysm or subarachnoid hemorrhage (SAH)" }
          - { key: "R", text: "Rupture before (previous aneurysmal rupture)" }
          - { key: "E", text: "Elective surgery with possible hemodynamic instability" }
          - { key: "S", text: "Scary job: high-risk occupation (airline pilot)" }
          - { key: "H", text: "Huge anxiety despite good information" }
        hook: "**FRESH**: مين يتعمله ==screening==؟ ومش للكل. والفحص **MRA** (من غير contrast)، والـ CTA بديل."
      - kind: check
        page: 152
        quote: "Magnetic resonance angiography is the diagnostic imaging modality of choice for presymptomatic screening because it is noninvasive and does not require IV contrast administration. CT angiography is a sat-isfactory alternative if there is no contraindication to IV contrast. Repeated screening of patients with a strong family history of intra-cranial aneurysms or aneurysmal rupture after 5 to 10 years is recommended."
        question: "Why is MRA the screening test of choice for aneurysms in ADPKD?"
        options:
          - "Noninvasive and needs no IV contrast"
          - "It is cheaper than ultrasound"
          - "It also treats the aneurysm"
          - "It is the only test that sees aneurysms"
        answer: 0
        why:
          - "صح: noninvasive ومن غير contrast، ودي ميزة كبيرة لعيان كلى."
          - "مش هو السبب."
          - "التشخيص بس."
          - "الـ computed tomography (CT) angiography بديل مرضي."
      - kind: sort
        page: 153
        quote: "Others Cyst formation has been described in such diverse organs as the pancreas, seminal vesicles, and arachnoid membrane (Fig. 44.7). Seminal vesicle cysts, usually multiple and bilateral, are found in 40% of ADPKD compared with 2% of non affected males. Ovarian cysts are not associated with ADPKD. Pancreas and arachnoid membrane cysts are present in 5% and 8% of patients, respectively. Pancreatic cysts are almost always asymptomatic, with rare occurrences of recurrent pancreatitis tumor or carcinoma. Epididymal and prostate cysts also may occur with increased frequency. Sperm abnormalities with defective motility are common in ADPKD and rarely may be a cause of male infertility."
        prompt: "ADPKD: إيه اللي ليه علاقة وإيه لأ؟"
        bins: ["Associated", "Not associated"]
        cards:
          - { text: "Mitral valve prolapse (25%)", bin: 0 }
          - { text: "Seminal vesicle cysts (40%)", bin: 0 }
          - { text: "Arachnoid cysts (8%)", bin: 0 }
          - { text: "Pancreatic cysts (5%)", bin: 0 }
          - { text: "Thoracic aortic dissection", bin: 0 }
          - { text: "Ovarian cysts", bin: 1 }
        why: "الكتاب صريح: ==ovarian cysts مش مرتبطة== بالـ autosomal dominant polycystic kidney disease (ADPKD). والـ echo بيتعمل **بس لو فيه murmur**."
      - kind: explain
        page: 153
        title: "حاجات تانية"
        quote: "Spinal meningeal diverticula may occur with increased frequency and rarely manifest with intracranial hypotension (orthostatic headache, diplopia, hearing loss, ataxia) caused by cerebrospinal fluid leak. The prevalence of colonic and duodenal diverticula also may be increased."
        text: |
          - **Pericardial effusion** صغير في لحد **35%** على الـ CT.
          - **Sperm** حركته ضعيفة، ونادرًا infertility.
          - **Spinal meningeal diverticula**: نادرًا cerebrospinal fluid (CSF) leak و ==intracranial hypotension== (صداع وهو واقف، diplopia، ataxia).
          - **Colonic و duodenal diverticula** ممكن تزيد.
      - kind: explain
        page: 154
        title: "نعمل screening؟"
        quote: "Only individuals who have been properly informed about the advantages and disadvantages of screening should be offered presymptomatic screening. If ADPKD is diagnosed, the patient should receive appropriate genetic counseling, and risk factors such as hypertension can be identified and treated early. If ADPKD is absent, the patient can be reassured. Disadvantages of presymptomatic screening relate to insurability and employability. Presymptomatic screening of children is not recommended until more effective therapy for the disease becomes available."
        text: |
          الـ screening بس للي **فاهم مميزاته وعيوبه**:
          - لو موجود: **genetic counseling**، ونعالج الضغط بدري.
          - لو مش موجود: نطمّنه.
          - العيوب: ==insurability و employability==.

          **الأطفال**: مش بنعملهم screening لحد ما يبقى فيه علاج أحسن. والأداة **ultrasound** علشان رخيص وآمن.
      - kind: table
        page: 155
