    - جملة صحيحة.
    - 'صحيحة: الـ ES والـ CI.'
    - صحيحة.
  - kind: explain
    page: 35
    quote: |-
      Statistically: The probability that the statistical test will reject the null hypothesis when the null hypothesis is false (i.e., the probability of not committing a type II error, or making a false negative decision).
      In RCT: It is the probability of the test reporting a statistically significant effect for a real effect of a given magnitude.
    title: 'الـ power: متفوّتش أثر حقيقي'
    text: |-
      ==Power== = احتمال إن الـ test **يرفض الـ null hypothesis وهي فعلًا غلط**، يعني احتمال إنك **ما تعملش type II error** (false negative).

      وفي الـ RCT: احتمال إن الـ test يطلّع effect significant لـ **real effect** بحجم معيّن.

      الـ **power analysis** بتحدد الـ ==sample size== المناسب؛ عينة صغيرة = power قليل، وعينة أكبر = power أكتر.
  - kind: aside
    tone: analogy
    text: 'الـ power زي جهاز كشف معادن: لو حساسيته ضعيفة (عينة صغيرة) هيعدّي على الدهب ومش هيصفّر = false negative. عينة أكبر = جهاز أقوى.'
  - kind: check
    page: 35
    quote: 'Statistically: The probability that the statistical test will reject the null hypothesis when the null hypothesis is false (i.e., the probability of not committing a type II error, or making
      a false negative decision).'
    question: Power of a study is the probability of NOT committing which error?
    options:
    - Type II error (false negative)
    - Type I error (false positive)
    - Recall bias
    - Selection bias
    answer: 0
    why:
