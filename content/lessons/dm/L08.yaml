  - id: dm.L08.lesson4
    title: "الهرم دور دور: نشويات وخضار وفاكهة ولبن ولحمة"
    hook: "كل دور في الهرم ليه عدد حصص، وكل رقم ليه سبب."
    minutes: 9
    pages: [92, 94]
    topics: [pyramid]
    goals:
      - "تحفظ حصص كل مجموعة"
      - "تعرف مغذيات كل مجموعة وليه بنفضّل الـ whole grain والـ skimmed"
      - "تحسب حصص اللحمة"
    status: unverified
    steps:
      - kind: figure
        page: 92
        quote: "Cereal and Grains\n  The base of the food pyramid.\n  6 – 11 servings per day.\n  Grain group foods come from plants.\n  Examples: Bread, cereal, rice, pasta, crackers, tortillas."
        title: "الهرم بالحصص"
        alt: "A food pyramid in four tiers. Base: cereal and grains 6 to 11 servings. Second tier: vegetables 3 to 5 and fruit 2 to 4. Third tier: milk, yogurt, cheese 2 to 3 and meat, fish, poultry 2 to 3. Top: fats, oils, sweets, use sparingly."
        caption: "كل ما تطلع، الحصص تقل: ==grains 6–11== تحت، والـ **fats و sweets** فوق «sparingly»."
        svg: |
          <svg viewBox="0 0 330 290" xmlns="http://www.w3.org/2000/svg">
            <path d="M165 15 L205 75 L125 75 Z" class="fg-bad"/>
            <text x="165" y="62" text-anchor="middle" class="t-sm t-b">Fats</text>
            <text x="230" y="50" class="t-sm">sparingly</text>
            <path d="M120 82 L210 82 L245 140 L85 140 Z" class="fg-acc"/>
            <text x="125" y="108" class="t-sm t-b">Milk</text>
            <text x="125" y="126" class="t-sm">2–3</text>
            <text x="172" y="108" class="t-sm t-b">Meat</text>
            <text x="172" y="126" class="t-sm">2–3</text>
            <path d="M80 147 L250 147 L285 205 L45 205 Z" class="fg-good"/>
            <text x="90" y="172" class="t-sm t-b">Vegetables</text>
            <text x="90" y="190" class="t-sm">3–5</text>
            <text x="185" y="172" class="t-sm t-b">Fruit</text>
            <text x="185" y="190" class="t-sm">2–4</text>
            <path d="M40 212 L290 212 L320 275 L10 275 Z" class="fg-box"/>
            <text x="165" y="240" text-anchor="middle" class="t-sm t-b">Cereal and grains</text>
            <text x="165" y="260" text-anchor="middle" class="t-sm">6–11 servings</text>
          </svg>
      - kind: match
        page: 92
        quote: "Vegetables\n  Above grains and next to fruit.\n  3 -5 servings per day.\n  Examples of group:"
        prompt: "وصّل كل مجموعة بعدد حصصها في اليوم:"
        pairs:
          - ["Cereal and grains", "6–11"]
          - ["Vegetables", "3–5"]
          - ["Fruit", "2–4"]
          - ["Meat or milk", "2–3"]
        why: "الـ grains قاعدة الهرم (6–11)، الخضار أكتر من الفاكهة (3–5 قدام 2–4)، والـ milk والـ meat كل واحد 2–3."
      - kind: explain
        page: 92
        title: "Grains و vegetables"
        quote: "Whole-grain foods (which are made with whole wheat flour) are less processed and retain more valuable vitamins, minerals, and fiber than foods made with white flour."
        text: |
          **Grains:** bread، rice، pasta. الـ ==whole-grain== أقل processing وفيه vitamins و minerals و **fiber** أكتر من الدقيق الأبيض.

          **Vegetables:** قليلة **fat و calories** (الطبخ هو اللي بيزوّدهم). كل نوع فيه مغذيات مختلفة، فنوّع. الكتاب بيقول:
          - الخضرا ← **vitamin A**
          - البرتقالي الغامق والأخضر الغامق ← **vitamin C**
          - **Broccoli** وقرايبه ← **iron و calcium**

          ليه الـ whole grain أحسن لمريض السكر بالذات؟ التفسير المقبول (مش في الكتاب): الـ **fiber** بيعمل زي شبكة في المعدة والمصارين، فالـ glucose بيدخل الدم بالراحة بدل ما يقفز مرة واحدة. ده نفس الكلام اللي هيرجع في الـ glycemic index آخر المحاضرة.
      - kind: aside
        tone: trap
        page: 92
        quote: "Vegetables like broccoli and related plants contain iron and calcium."
        text: "المعروف إن الخضار (vegetables) **البرتقالي الغامق** (جزر) غني بـ **vitamin A (beta-carotene)**. الكتاب كاتب العكس تقريبًا؛ في الامتحان اكتب جملة الكتاب لو اتسألت عليها نصًا."
      - kind: reveal
        page: 92
        quote: "Vegetables contain many vitamins and minerals; however, different vegetables contain different nutrients, so it is essential to eat a wide variety of types."
        prompt: "ليه «Vary your veggies» مش «كُل خضار وخلاص»؟"
        answer: |
          الكتاب بيقول كل نوع خضار فيه **different nutrients**، فلازم **wide variety**. الأخضر حاجة، والبرتقالي الغامق حاجة، والـ broccoli حاجة.

          وفيه فخ تاني في نفس الصفحة: الخضار **very low in fats and calories**، بس **cooking can often add these**. يعني الكوسة المحشية بالسمنة مش هي الكوسة المسلوقة. لمريض السكر: نوّع، واطبخ بزيت قليل.

      - kind: explain
        page: 93
        title: "فاكهة ولبن"
        quote: "These include apples, oranges, plums, bananas, etc. Processing fruits when canning or making them into juices may add sugars and remove nutrients."
        text: |
          **Fruit (2–4):** قليلة سعرات ودهون، فيها natural sugars و **fiber** و vitamins. ==Canning أو juicing== ممكن يزوّد سكر ويشيل مغذيات.

          **Milk, yogurt, cheese (2–3):** **calcium** أساسًا، ومعاه protein و phosphorus و vitamin A و D. بس كتير منها عالي **saturated fat**، فالـ **skimmed** بديل. للكبار: **3 cups** في اليوم.

          والفاكهة ممكن تتاكل **fresh, frozen, canned, dried, pureed, or juiced**، بس افتكر إن الـ canning والعصير بيزوّدوا سكر ويشيلوا مغذيات، فالطازة أو المجمّدة من غير سكر أحسن لمريض السكر.

          ليه الـ skimmed؟ لأن الـ calcium والـ protein في الجزء المايّة من اللبن، والدهن هو اللي فيه الـ saturated fat والـ cholesterol. لما تشيل الدهن بتشيل المشكلة وتسيب الفايدة.
      - kind: reveal
        page: 93
        quote: "These include apples, oranges, plums, bananas, etc. Processing fruits when canning or making them into juices may add sugars and remove nutrients."
        prompt: "ليه البرتقانة أحسن من كوباية عصير برتقان لمريض السكر؟"
        answer: |
          العصير بيشيل الـ **fiber** اللي بيبطّأ امتصاص السكر، وبتشرب سكر 3–4 برتقانات في دقيقة، وأحيانًا بيتزود سكر.

          علشان كده الـ **orange juice** على جدول الـ GI (57) أعلى من الـ **apple** الكاملة (36)، والكتاب بيقول الـ processing بيزوّد سكر ويشيل مغذيات.
      - kind: check
        page: 93
        quote: "However, many dairy products are high in saturated fat and cholesterol compared to vegetables, fruits, and whole grains; skimmed products are available as an alternative."
        question: "A diabetic with high LDL asks how to keep his three cups of dairy a day. Best advice from the lecture?"
        options:
          - "Choose skimmed products"
          - "Stop all dairy"
          - "Switch to ice cream and chocolate milk"
          - "Replace dairy with fruit juice"
        answer: 0
        why:
          - "صح: الـ skimmed بيشيل الـ saturated fat والـ cholesterol ويسيب الـ calcium والـ protein."
          - "الكتاب بيقول 3 cups للكبار؛ اللبن مصدر الـ calcium الأساسي."
          - "دول في المجموعة بس عاليين دهن وسكر."
          - "العصير مش فيه calcium اللبن، وبيزوّد سكر."

      - kind: explain
        page: 94
        title: "اللحمة"
        quote: "The food guide pyramid suggests that adults eat 2–3 servings per day. One serving of meat is 4 oz (110 g)."
        text: |
          **Meat** = **protein** و **iron** و **zinc** و **vitamin B12**.

          - **2–3 servings** في اليوم، و ==الحصة 4 oz (110 g)==
          - **Alternatives:** eggs، dry beans، nuts، tofu، lentils، chick peas
          - بس اللحمة ممكن تبقى عالية **fat و cholesterol و sodium**: شيل الدهن الظاهر.

          ليه البقول والمكسرات مع اللحمة؟ لأن الكتاب بيقول فيها **many of the same nutrients**، يعني protein وحديد. والفرق إنها مش شايلة نفس الـ saturated fat، فهي بديل كويس لمريض السكر اللي أصلًا الـ cholesterol عنده مشكلة.
      - kind: check
        page: 94
        quote: "The food guide pyramid suggests that adults eat 2–3 servings per day. One serving of meat is 4 oz (110 g)."
        question: "A man eats 450 g of meat a day. How many servings?"
        options: ["About 4 (above 2–3)", "About 2 (fine)", "About 9", "About 1"]
        answer: 0
        why:
          - "صح: 450 ÷ 110 ≈ 4، أكتر من 2–3."
          - "ده لو الحصة 225 g."
          - "ده لو الحصة 50 g."
          - "ده لو الحصة 450 g."
      - kind: check
        page: 94
        quote: "Fats, oils, and sweets\n  Top of the pyramid.\n  To be used sparingly.\n  Examples of group: Candy, Soda, Cookies, Mayonnaise, Chips. Doughnuts"
        question: "Where are fats, oils and sweets in the pyramid, and how much should be eaten?"
        options:
          - "Top of the pyramid, used sparingly"
          - "Base of the pyramid, 6–11 servings"
          - "Middle, 2–3 servings"
          - "Not part of the pyramid"
        answer: 0
        why:
          - "صح: top of the pyramid، to be used sparingly: candy و soda و cookies و chips."
          - "دي الـ cereal and grains."
          - "دي الـ milk أو الـ meat."
          - "هي المجموعة السادسة في الهرم."
      - kind: try
        items: [dm.L08.011, dm.L08.013, dm.L08.022, dm.L08.024, dm.L08.026]
    recap:
      - "Grains 6–11 (قاعدة)، veg 3–5، fruit 2–4، milk 2–3، meat 2–3، fats sparingly (السن)."
      - "Whole grain فيه fiber بيبطّأ السكر؛ العصير بيشيل الـ fiber ويزوّد سكر."
      - "Dairy = calcium؛ الـ skimmed بيشيل الـ saturated fat. 3 cups للكبار."
      - "Meat = protein، iron، zinc، B12؛ الحصة 110 g؛ البقول والمكسرات بدايل."
