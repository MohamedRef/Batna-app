    status: unverified
  - id: geri.L04.086
    kind: card
    topic: delirium-treatment
    front: How is haloperidol maintained after loading in delirium?
    back: Half the loading dose in divided doses over the next 24 hours, tapered over the next few days as agitation resolves.
