schema: batna.lesson/v1
lecture: res.L15
lessons:
- id: res.L15.lesson1
  title: 'الإحصاء: من العيّنة للناس كلها'
  hook: إنت بتقيس ضغط 100 عيان في العيادة، بس عايز تتكلم عن كل الناس. إزاي ده يبقى صح؟
  minutes: 8
  pages: [4, 12]
  topics: [intro]
  goals:
  - تعرف الإحصاء بيعمل إيه في 6 خطوات
  - تفرّق بين الـ population والـ sample ورموزهم
  - تفرّق بين الـ descriptive والـ analytic والـ vital statistics
  status: unverified
  steps:
  - kind: explain
    page: 4
    quote: |-
      Definition
      Statistics is the scientific field that deals with
      collection,
      classification,
      presentation
      description
      analysis
      & interpretation of data.
    title: الإحصاء بيعمل إيه؟
    text: |-
      الإحصاء مش «حسابات وبس». هو علم بيمسك الـ **data** من أولها لآخرها:

      - ==collection== (تجمع) ← **classification** (تصنّف) ← **presentation** (تعرض)
      - **description** (توصف) ← **analysis** (تحلل) ← ==interpretation== (تفسّر)

      ولما الكلام ده يتطبّق على الطب والعلوم البيولوجية اسمه **biostatistics**.
    remind: [res.L15.001]
  - kind: explain
    page: 5
    quote: |-
      Some definitions
      Population (target population)
      Is the population about which one wishes to make an inference. It is a large set of individuals( human) or other living organisms (animals ,insects ,plant or non living organisms (water ,vaccines)
      Sample:
      Is a subset of the population selected in a way that is representative of the target population.
      It should reflect the similarities and differences found in the population .Result from it can be generalized to the population
    title: الـ population والـ sample
    text: |-
      - **Population (target population)**: الناس (أو الكائنات، أو حتى ماية ولقاحات) اللي ==عايز تطلع عليهم استنتاج==.
      - **Sample**: جزء منهم، بتختاره بطريقة تخليه ==representative==: يشيل نفس التشابه والاختلاف اللي في الـ population.

      ليه representative؟ لأن النتيجة هتتعمم على الناس كلها، مش على الـ 100 اللي قستهم وبس.
  - kind: figure
    page: 6
    quote: |-
      Population: quantity (count) = N; mean = μ; standard deviation = σ
      Sample: quantity (count) = n; mean = x̄; standard deviation = s
    title: نفس المقاييس، رموز مختلفة
    svg: |-
      <svg viewBox="0 0 340 170" xmlns="http://www.w3.org/2000/svg">
        <defs><marker id="L15a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
        <ellipse cx="96" cy="80" rx="90" ry="62" class="fg-box"/>
        <text x="96" y="30" text-anchor="middle" class="t-sm t-b">Population</text>
        <g class="fg-dot-acc"><circle cx="50" cy="60" r="4"/><circle cx="70" cy="90" r="4"/><circle cx="96" cy="55" r="4"/><circle cx="120" cy="100" r="4"/><circle cx="140" cy="70" r="4"/><circle cx="60" cy="115" r="4"/><circle cx="100" cy="120" r="4"/><circle cx="150" cy="105" r="4"/><circle cx="35" cy="88" r="4"/><circle cx="118" cy="45" r="4"/></g>
        <text x="96" y="160" text-anchor="middle" class="t-sm">N · μ · σ</text>
        <path d="M190 80H226" class="fg-arrow" marker-end="url(#L15a)"/>
        <text x="208" y="70" text-anchor="middle" class="t-sm t-mut">select</text>
        <ellipse cx="282" cy="80" rx="52" ry="40" class="fg-acc"/>
        <text x="282" y="34" text-anchor="middle" class="t-sm t-b">Sample</text>
        <g class="fg-dot-acc"><circle cx="262" cy="72" r="4"/><circle cx="290" cy="64" r="4"/><circle cx="300" cy="92" r="4"/><circle cx="270" cy="96" r="4"/></g>
        <text x="282" y="160" text-anchor="middle" class="t-sm">n · x̄ · s</text>
        <path d="M282 124C250 150 140 150 110 146" class="fg-arrow-acc" marker-end="url(#L15a)"/>
        <text x="196" y="138" text-anchor="middle" class="t-sm t-acc">generalize</text>
      </svg>
    caption: الـ population ليها N وμ وσ، والعيّنة ليها n وx̄ وs. العيّنة بتتعمم على الـ population.
    alt: A large ellipse labelled population with N, mu, sigma and a smaller ellipse labelled sample with n, x-bar, s; an
      arrow selects the sample and another generalizes back.
  - kind: table
    page: 6
    quote: |-
      Population: quantity (count) = N; mean = μ; standard deviation = σ
      Sample: quantity (count) = n; mean = x̄; standard deviation = s
    title: احفظ الرموز
    columns:
    - Measure
    - Population
    - Sample
    rows:
    - - Count
      - N
      - n
    - - Mean
      - μ
      - x̄
    - - Standard deviation
      - σ
      - s
    hide:
    - - 0
      - 2
    - - 1
      - 1
    - - 2
      - 2
  - kind: aside
    page: 6
    quote: |-
      Population: quantity (count) = N; mean = μ; standard deviation = σ
      Sample: quantity (count) = n; mean = x̄; standard deviation = s
    tone: tip
    text: |-
      قاعدة سهلة: **اليوناني والكابيتال للـ population** (N، μ، σ)، و**اللاتيني الصغير للـ sample** (n، x̄، s). الكبير للكل، والصغير للجزء.
  - kind: explain
    page: 8
    quote: |-
      2- Analytic statistics:
      Concerned with the use of data from a sample of population to make inferences about the population (ex: to come to a conclusion about the relation between a condition ( disease and its cause) to be generalized over the population
      Example : relation between smoking and lung cancer
    title: 3 فروع
    text: |-
      - **Descriptive statistics**: بتلخّص العيّنة، زي ==% age and sex distribution== أو **average blood pressure**.
      - **Analytic statistics**: بتستخدم العيّنة عشان ==تستنتج== حاجة عن الـ population، زي علاقة **smoking** بالـ **lung cancer**.
      - **Vital statistics**: الحكومة بتجمع على طول births، deaths، marriage، divorces، والحالات الصحية، ومكتب الصحة هو اللي بيبلّغ.
    remind: [res.L15.010]
  - kind: check
    page: 8
    quote: |-
      2- Analytic statistics:
      Concerned with the use of data from a sample of population to make inferences about the population (ex: to come to a conclusion about the relation between a condition ( disease and its cause) to be generalized over the population
      Example : relation between smoking and lung cancer
    question: A study concludes, from a sample, that smoking is related to lung cancer in the population. Which branch?
    options:
    - Analytic statistics
    - Descriptive statistics
    - Vital statistics
    answer: 0
    why:
    - 'صح: استنتاج من العيّنة عن علاقة في الـ population.'
    - الـ descriptive بيلخّص العيّنة بس من غير استنتاج.
    - الـ vital دي سجلات الحكومة للمواليد والوفيات وغيرها.
  - kind: explain
    page: 12
    quote: |-
      Statistics is helpful to assess:
      Diagnostic testing
      Effects of new drugs and treatment modalities.
      Epidemiologists need to know how to:
      Calculate rates
      Compare between groups and to decide how likely the differences in comparison groups could be due to chance.
    title: طب ليه الدكتور يتعب نفسه؟
    text: |-
      لأنك هتقرا papers طول عمرك، ولازم تعرف ==تقيّم وتنقد== اللي فيها. الإحصاء بيساعدك تقيّم:

      - **diagnostic testing** و**effects of new drugs**.
      - والـ epidemiologist بيحسب **rates** ويقارن الـ groups ويسأل: الفرق ده ==ممكن يكون chance==؟
    remind: [res.L15.014]
  - kind: aside
    page: 11
    quote: |-
      Uses in Medicine:
      Biostatistics is necessary for both clinical and preventive medicine.
      Physicians should have the basic knowledge for evaluation and criticism of researches published in medical journals.
    tone: joke
    text: |-
      الدكتور اللي مبيعرفش إحصاء بيقرا الـ abstract ويصدّق. واللي بيعرف بيبص على الـ n الأول. 😄
  - kind: try
    items: [res.L15.001, res.L15.003, res.L15.004, res.L15.007]
  recap:
  - 'الإحصاء: collection → classification → presentation → description → analysis → interpretation.'
  - الـ sample لازم تكون representative عشان النتيجة تتعمم.
  - N، μ، σ للـ population؛ n، x̄، s للـ sample.
  - descriptive يلخّص، analytic يستنتج، vital سجلات الحكومة.
  practice: [res.L15.001, res.L15.002, res.L15.003, res.L15.004, res.L15.005, res.L15.006, res.L15.007, res.L15.008, res.L15.009,
    res.L15.010, res.L15.011, res.L15.012, res.L15.013, res.L15.014]
- id: res.L15.lesson2
  title: 'أنواع المتغيرات: بتقيس ولا بتعد ولا بتصنّف؟'
  hook: الوزن والنبض الاتنين أرقام. بس واحد continuous والتاني discrete. الفرق ده بيحدد الجدول والرسمة والتست.
  minutes: 9
  pages: [14, 21]
  topics: [variables]
  goals:
  - تفرّق بين الـ constant data والـ variables
  - 'تصنّف أي متغير: continuous، discrete، ordinal، nominal'
  - تتجنب فخ الـ pulse وعدد العيال
  status: unverified
  steps:
  - kind: explain
    page: 14
    quote: |-
      Types of data:
      Data are classified into:
      Constant data:
      These are observations which do not vary from one person to another such as number of eyes, fingers, ears... etc
      Variables:
      These are observations, which vary from one person to another or from one group of members to others and are subdivided into the following:
    title: ثابت ولا متغير؟
    text: |-
      - **Constant data**: ==مبتتغيرش== من شخص للتاني: عدد العينين، الصوابع، الودان.
      - **Variables**: بتتغير من شخص لشخص أو من group لـ group، ودي اللي الإحصاء بيشتغل عليها.
  - kind: figure
    page: 15
    quote: |-
      Quantitative variables:
      These may be continuous or discrete.
      a- Continuos quantitative variable:
      Which are obtained by measurement and its value could be integer or fractionated value.
      Examples:
      Weight, height, hemoglobin, age, income, volume of urine.
    title: شجرة المتغيرات
    svg: |-
      <svg viewBox="0 0 340 196" xmlns="http://www.w3.org/2000/svg">
        <defs><marker id="L15b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
        <rect x="120" y="4" width="100" height="26" rx="6" class="fg-ink"/>
        <text x="170" y="21" text-anchor="middle" class="t-sm t-b">Data</text>
        <path d="M150 30L70 50" class="fg-arrow" marker-end="url(#L15b)"/>
        <path d="M190 30L270 50" class="fg-arrow" marker-end="url(#L15b)"/>
        <rect x="20" y="52" width="100" height="26" rx="6" class="fg-thin"/>
        <text x="70" y="69" text-anchor="middle" class="t-sm">Constant</text>
        <rect x="220" y="52" width="100" height="26" rx="6" class="fg-box"/>
        <text x="270" y="69" text-anchor="middle" class="t-sm t-b">Variables</text>
        <path d="M245 78L130 98" class="fg-arrow" marker-end="url(#L15b)"/>
        <path d="M295 78L280 98" class="fg-arrow" marker-end="url(#L15b)"/>
        <rect x="40" y="100" width="130" height="26" rx="6" class="fg-acc"/>
        <text x="105" y="117" text-anchor="middle" class="t-sm t-b">Quantitative</text>
        <rect x="210" y="100" width="124" height="26" rx="6" class="fg-good"/>
        <text x="272" y="117" text-anchor="middle" class="t-sm t-b">Qualitative</text>
        <rect x="4" y="142" width="80" height="48" rx="6" class="fg-box"/>
        <text x="44" y="160" text-anchor="middle" class="t-sm t-b">Continuous</text>
        <text x="44" y="176" text-anchor="middle" class="t-sm t-mut">measured</text>
        <rect x="90" y="142" width="80" height="48" rx="6" class="fg-box"/>
        <text x="130" y="160" text-anchor="middle" class="t-sm t-b">Discrete</text>
        <text x="130" y="176" text-anchor="middle" class="t-sm t-mut">counted</text>
        <rect x="180" y="142" width="74" height="48" rx="6" class="fg-box"/>
        <text x="217" y="160" text-anchor="middle" class="t-sm t-b">Ordinal</text>
        <text x="217" y="176" text-anchor="middle" class="t-sm t-mut">ordered</text>
        <rect x="260" y="142" width="76" height="48" rx="6" class="fg-box"/>
        <text x="298" y="160" text-anchor="middle" class="t-sm t-b">Nominal</text>
        <text x="298" y="176" text-anchor="middle" class="t-sm t-mut">no order</text>
        <path d="M90 126L48 140M120 126L130 140M255 126L222 140M290 126L298 140" class="fg-arrow"/>
      </svg>
    caption: الـ variables يا كمية (continuous بتتقاس، discrete بتتعد) يا نوعية (ordinal ليها ترتيب، nominal ملهاش).
    alt: 'Tree: data splits into constant and variables; variables into quantitative (continuous, discrete) and qualitative
      (ordinal, nominal).'
  - kind: explain
    page: 16
    quote: |-
      B- Discret or discontinus quantitative variables:
      Which are obtained by enumeration and its value is always integer value.
      Examples:
      Pulse
      Family size
      Number of live births
      Number of abortions.
    title: 'الكمي: قِسته ولا عدّيته؟'
    text: |-
      - **Continuous**: جه من ==measurement==، ينفع يبقى كسر: weight، height، hemoglobin، age، income، volume of urine.
      - **Discrete**: جه من ==enumeration== (عد)، دايمًا رقم صحيح: pulse، family size، number of live births، number of abortions.

      السؤال السحري: **«ينفع يبقى 2.5؟»** لو آه → continuous. لو لأ (مفيش 2.5 عيل) → discrete.
  - kind: aside
    page: 16
    quote: |-
      B- Discret or discontinus quantitative variables:
      Which are obtained by enumeration and its value is always integer value.
      Examples:
      Pulse
      Family size
      Number of live births
      Number of abortions.
    tone: trap
    text: |-
      الـ **pulse** في السلايدز ==discrete==، لأنك بتعد الضربات. ومتتلخبطش: الـ age والـ income في السلايدز continuous.
  - kind: explain
    page: 19
    quote: |-
      b- Nominal qualitative variables :
      Can not be put in order and is further subdivided into:
      Dichotomous
      Examples
      Sex
      Yes / no variables
      Multichotomous
      Examples
      Marital status:
      (married, single, divorced, widow)
      Blood groups: A, B, AB, O
    title: 'النوعي: ليه ترتيب ولا لأ؟'
    text: |-
      - **Ordinal**: فئات ليها ==ترتيب==: degree of success (excellent، very good، good، fair)، degree of disease (mild، moderate، severe).
      - **Nominal**: فئات ==ملهاش ترتيب==:
        - **Dichotomous** (اتنين بس): sex، yes/no.
        - **Multichotomous** (أكتر): marital status، blood groups A، B، AB، O.
  - kind: sort
    page: 20
    quote: |-
      Exercises
      I: Classify each of the following measured variables by the type of variable
      | Variable measured | Type of variable |
      |---|---|
      | 1- The presence of type II diabetes (Yes or No) |  |
      | 2- Number of new H1N1 cases in Mexico in a given month (n=118) |  |
      | 3- Income of a group of workers (L.E) |  |
      | 4- High density lipoprotein level (mg / dL) |  |
      | 5- degree of success of medical students (excellent, very good, good, fair, and weak) |  |
    prompt: حط كل متغير في نوعه
    bins:
    - Continuous
    - Discrete
    - Ordinal
    - Nominal
    cards:
    - text: HDL level (mg/dL)
      bin: 0
    - text: Income of workers (L.E)
      bin: 0
    - text: New H1N1 cases in a month
      bin: 1
    - text: Family size
      bin: 1
    - text: Degree of success
      bin: 2
    - text: Mild / moderate / severe
      bin: 2
    - text: Type II diabetes yes/no
      bin: 3
    - text: Blood group
      bin: 3
    why: 'اسأل: اتقاس (continuous)؟ اتعد (discrete)؟ فئات مترتبة (ordinal)؟ فئات من غير ترتيب (nominal)؟'
  - kind: check
    page: 21
    quote: |-
      2- All of the following are examples of quantitative variable EXCEPT:
      a- blood pressure b- blood group
      c- Hb percent d- length of hospital stay
    question: 'All of the following are quantitative EXCEPT:'
    options:
    - Blood group
    - Blood pressure
    - Hb percent
    - Length of hospital stay
    answer: 0
    why:
    - 'صح: blood group فئة (nominal).'
    - الضغط بيتقاس.
    - الـ Hb بيتقاس.
    - مدة الإقامة رقم أيام.
  - kind: check
    page: 16
    quote: |-
      B- Discret or discontinus quantitative variables:
      Which are obtained by enumeration and its value is always integer value.
      Examples:
      Pulse
      Family size
      Number of live births
      Number of abortions.
    question: Which of these is a discrete quantitative variable?
    options:
    - Number of live births
    - Age
    - Income
    - Volume of urine
    answer: 0
    why:
    - 'صح: بيتعد ودايمًا صحيح، زي عدد العيال (وده اللي الدكتورة نبّهت عليه).'
    - الـ age في السلايدز continuous.
    - الـ income في السلايدز continuous.
    - الحجم بيتقاس.
  - kind: try
    items: [res.L15.018, res.L15.019, res.L15.023, res.L15.027]
  recap:
  - Constant data مبتتغيرش (عدد الصوابع)؛ الـ variables بتتغير.
  - Continuous = measurement (ينفع كسر)، discrete = enumeration (صحيح دايمًا).
  - Ordinal ليه ترتيب، nominal ملهوش (dichotomous أو multichotomous).
  - الـ pulse وعدد العيال discrete.
  practice: [res.L15.015, res.L15.016, res.L15.017, res.L15.018, res.L15.019, res.L15.020, res.L15.021, res.L15.022, res.L15.023,
    res.L15.024, res.L15.025, res.L15.026, res.L15.027, res.L15.028, res.L15.029, res.L15.030]
- id: res.L15.lesson3
  title: 'الجدول الصح: من كومة أرقام لـ frequency table'
  hook: 57 وزن متكومين على السلايد. في 5 دقايق هتحوّلهم لجدول نضيف من 7 فئات.
  minutes: 10
  pages: [23, 54]
  topics: [tables]
  goals:
  - تعرف طرق عرض البيانات الـ 3 وأنواع الجداول الـ 4
  - 'تبني frequency table: أول فئة، الـ width، وعدد الفئات'
  - تحسب الـ width والـ midpoint للـ continuous والـ discrete
  status: unverified
  steps:
  - kind: explain
    page: 23
    quote: |-
      Data presentation
      I. Numerical presentation:
      II. Graphical presentation
      III. Mathematical presentation
    title: 3 طرق تعرض بيها البيانات
    text: |-
      - **Numerical**: أرقام وجداول.
      - **Graphical**: رسومات.
      - **Mathematical**: أرقام بتلخّص، زي ==mean، median، mode، range، standard deviation==.

      والـ numerical نوعين: **simple** للبيانات القليلة (أوزان 5 أطفال: 8، 6، 9، 5، 7 kg)، و**tabular** للكتير (==grouped data==).
    remind: [res.L15.031, res.L15.032]
  - kind: explain
    page: 29
    quote: |-
      Tabular presentation
      I. Simple frequency distribution table
      II- Table of an association or contingency table
      2 X 2
      c x r
      III. Comparing frequency distribution table
      IV. Two way table or two way classification table
    title: 4 أنواع جداول
    text: |-
      1. **Simple frequency distribution table**: متغير واحد.
      2. **Table of association (contingency)**: ==2 × 2== أو ==c × r==.
      3. **Comparing frequency distribution table**.
      4. **Two way classification table**.
    remind: [res.L15.034]
  - kind: figure
    page: 31
    quote: |-
      Title
      what, who, where & when
      | Variable | Frequency (Number or percent) |
      |---|---|
      | Categories |  |
      | Total | n |
      Source of data
