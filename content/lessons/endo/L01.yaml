  - id: endo.L01.lesson7
    title: "باقي MEN 1 والحاجات اللي بتقلّدها"
    hook: "الـ adrenal والـ carcinoid والـ lipoma بيكمّلوا الصورة، وفي أدوية معدة ممكن تعمل لك prolactinoma مزيّف."
    minutes: 7
    pages: [7, 8]
    topics: [men1-other, men1-ddx]
    goals:
      - "تعرف باقي أورام MEN 1 ونسبها، وليه الـ carcinoid ساكت"
      - "تعرف الـ differential diagnosis وتشرح إزاي كل mimic بيقلّد"
    status: unverified
    steps:
      - kind: explain
        remind: [endo.L01.048]
        page: 7
        quote: "Adrenocortical lesions\n  20-40% MEN1.\n  Usually bilateral, hyperplastic, non-functional.\n  No consensus on management of these lesions."
        title: "أورام تانية في MEN 1"
        text: |
          - **Adrenocortical lesions**: 20–40%، غالبًا bilateral، hyperplastic، non-functional. مفيش consensus على علاجها.
          - **Carcinoid**: 3%، في الـ bronchi أو gastrointestinal tract (GIT) أو pancreas أو thymus، وغالبًا ==asymptomatic== من غير carcinoid syndrome.
          - **Lipomas**: cutaneous و visceral، في لحد ثلث المرضى، ومبترجعش بعد ما تتشال.
          - كمان: benign thyroid tumors، central nervous system (CNS) ependymomas، collagenomas، angiofibromas.

          ليه الـ adrenal lesions مالهاش consensus؟ لأنها **non-functional** وغالبًا hyperplasia حميدة، يعني مش بتعمل هرمون ولا بتأذي، فمفيش سبب واضح نشيلها. وليه الـ carcinoid هنا ساكت؟ التفسير المقبول (مش في الكتاب): الـ carcinoid syndrome محتاج كمية كبيرة من الـ serotonin توصل للدورة العامة، وده بيحصل غالبًا لما يبقى في liver mets؛ الأورام الصغيرة دي مش بتوصل لكده.
      - kind: check
        page: 7
        quote: "Carcinoid\n  3% of MEN1 – bronchi, gi tract, pancreas, or thymus.\n  Mostly asymptomatic no signs of carcinoid syndrome."
        question: "A carcinoid found in a patient with MEN 1 most typically:"
        options: ["Is asymptomatic, without carcinoid syndrome", "Presents with flushing and diarrhoea", "Arises only in the appendix", "Occurs in about 40% of patients"]
        answer: 0
        why:
          - "صح: الكتاب بيقول **mostly asymptomatic**، من غير signs of carcinoid syndrome."
          - "الـ flushing والإسهال هما الـ carcinoid syndrome، وده مش الشكل المعتاد هنا."
          - "أماكنه في MEN 1: bronchi، GI tract، pancreas، thymus."
          - "الـ carcinoid **3%** بس؛ الـ 20–40% دي للـ adrenocortical lesions."
      - kind: reveal
        page: 8
        quote: "LIPOMAS\n  Cutaneous and visceral.\n  Up to 1/3 of MEN1 patients.\n  Tend not to recur once excised."
        prompt: "مريض MEN 1 عنده lipoma في دراعه ومضايقه شكلها. نشيلها ولا نسيبها؟"
        answer: "نشيلها لو مضايقاه: الـ lipomas في MEN 1 بتيجي في لحد **ثلث** المرضى، cutaneous أو visceral، و**tend not to recur once excised**. يعني عكس الـ parathyroid اللي بيرجع، الـ lipoma لما تتشال بتخلص."
      - kind: check
        page: 8
        quote: "Differential Diagnosis of MEN 1\n  Sporadic or familial tumors of the pituitary, parathyroid or pancreatic islets.\n  Hypercalcemia from any cause may cause.\n  GIT symptoms and increased gastrin levels, simulating a gastrinoma.\n  Treatment of GIT symptoms with H2 blockers or metoclopramide may cause hyper- prolactinemia, simulating a pituitary prolactinoma."
        question: "A dyspeptic patient on metoclopramide has a mildly high prolactin. The best interpretation:"
        options: ["Drug-induced hyperprolactinaemia can mimic a prolactinoma", "Confirms MEN 1", "Metoclopramide causes hypercalcaemia", "Indicates a gastrinoma"]
        answer: 0
        why:
          - "صح: الـ H2 blockers والـ metoclopramide ممكن يرفعوا الـ prolactin ويقلّدوا prolactinoma."
          - "الدوا mimic، مش دليل."
          - "مش سبب hypercalcemia في الكتاب."
          - "الـ prolactin مالوش علاقة بتشخيص الـ gastrinoma."
      - kind: figure
        page: 8
        quote: "Differential Diagnosis of MEN 1\n  Sporadic or familial tumors of the pituitary, parathyroid or pancreatic islets.\n  Hypercalcemia from any cause may cause.\n  GIT symptoms and increased gastrin levels, simulating a gastrinoma.\n  Treatment of GIT symptoms with H2 blockers or metoclopramide may cause hyper- prolactinemia, simulating a pituitary prolactinoma."
        title: "إزاي الـ mimic بيقلّد"
        alt: "Two chains of boxes. Top chain: hypercalcaemia from any cause leads to raised gastrin, which looks like a gastrinoma. Bottom chain: H2 blockers or metoclopramide lead to raised prolactin, which looks like a prolactinoma."
        caption: "سلسلتين: الكالسيوم العالي يرفع الـ gastrin، وأدوية المعدة ترفع الـ prolactin. الاتنين ممكن يلبّسوك MEN 1 غلط."
        svg: |
          <svg viewBox="0 0 330 170" xmlns="http://www.w3.org/2000/svg">
