  # ---------- p23: epidemiology ----------
  - id: neph.L02.001
    kind: card
    topic: epidemiology
    front: Roughly how many people had CKD worldwide in 2017, and what fraction of the population is that?
    back: "About 843.6 million people, roughly 1 in 10: extremely common."
    src: { page: 23, quote: "Epidemiology of chronic kidney disease: an update 2022\n  Extremely common: 843,6 Million in 2017; Approximately 1 in 10\n  More prevalent in: Individuals with diabetes mellitus; Racial minorities; Women; Elderly; Individuals with hypertension\n  Increasing death rate: +41.5% 1990 to 2017\n    Rank in cause of death: 19th (2013); 13th (2016); 12th (2017); 5th (2040)\n  Large burden in low- and middle-income countries\n  Among the top 10 causes of death in Singapore, Greece, and Israel\n  CONCLUSION: Chronic kidney disease (CKD) occurs frequently and has devastating consequences. This should prompt major efforts to develop preventative and therapeutic measures that are effective. The aim of these measures should be lowering the incidence of CKD and slowing its progression." }
    status: unverified
