    kind: card
    topic: hla
    front: Does the degree of HLA mismatch predict early rejection or long-term graft survival?
    back: Long-term graft survival, not early rejection; best in HLA-identical (especially living related) and worst in randomly matched cadaver kidneys.
    src: { page: 328, quote: "Human MHC molecules are called human leucocyte antigens (HLA,s)The degree of mismatching is associated with long-term graft survival, though not early rejection. Long-term survival is best in HLA-identical, particularly living related, kidneys and worst in randomly matched cadaver kidneys. Alloimmune response is strong and does not require priming (a relatively higher frequency of T cell precursors that responds to foreign MHC than those responds to antigens of infecting organisms) Two different molecular mechanisms of allorecognition; direct and indirect." }
