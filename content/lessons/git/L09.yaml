        page: 254
        title: "أشعة ومناظير"
        quote: "Wirelessintestinalcapsulecanvisualizeallthesmallintestines."
        text: |
          **أشعة**: ERCP، MRCP، CT، MRI، و abdominal أو endoscopic ultrasound (للبنكرياس والقنوات).

          **مناظير**:
          - **Upper endoscopy (EGD)** + biopsies من الـ duodenum (celiac، lymphangiectasia)، بس مش specific.
          - **Enteroscopy** (double balloon، single balloon، spiral): يشوف ويـbiopsy الـ small bowel.
          - ==Wireless capsule==: يشوف الـ small bowel **كله**.
