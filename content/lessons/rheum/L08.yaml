  - id: rheum.L08.lesson3
    title: "الكبار: GCA و PMR و Takayasu"
    hook: "صداع ووجع في الفك عند ست عندها 75 سنة: عندك ساعات قبل ما تفقد النظر."
    minutes: 10
    pages: [131, 137]
    topics: [gca, pmr, tak, lvv-rx]
    goals:
      - "تحسب الـ GCA score وتعرف الـ biopsy rules"
      - "تحسب الـ PMR score"
      - "تعرف الـ Takayasu criteria وعلاج الـ LVV والـ PMR"
    status: unverified
    steps:
      - kind: explain
        page: 131
        title: "GCA: systemic و local"
        quote: "Polymyalgia Rheumatica. Temporal Headache. Fever. Blindness. Anorexia. Scalp Necrosis. Malaise. Jaw Claudication."
        text: |
          - **Systemic:** ==polymyalgia rheumatica==، fever، anorexia، malaise، weight loss، **ESR عالي**، abnormal LFTs، anaemia
          - **Local:** **temporal headache**، ==blindness==، scalp necrosis، **jaw claudication**، cranial و peripheral neuropathies

          المنطق: الشريان اللي بيغذي الجلد والفك والعين ضاق، فكل حاجة بيغذيها تشتكي.
      - kind: figure
        page: 131
        quote: "In the presence of 3 points or more out of 11 with at least one point belonging to domain I along with all entry criteria"
        title: "عدّاد الـ GCA score"
        alt: "A scoring board. Entry: age 50 or more and no exclusion criteria. Domain I items: headache 1, visual disturbance 1, PMR 2, jaw claudication 1, abnormal temporal artery up to 2. Domain II: fever or anaemia 1, ESR 50 or more 1, pathology up to 2. A bar at the bottom marks 3 of 11 as the threshold with at least one domain I point."
        caption: "لازم **age ≥50** ومفيش exclusion، وبعدين ==≥3 من 11== ومنهم نقطة على الأقل من **Domain I**."
        svg: |
          <svg viewBox="0 0 330 350" xmlns="http://www.w3.org/2000/svg">
            <rect x="15" y="10" width="300" height="40" rx="8" class="fg-thin"/>
            <text x="165" y="35" text-anchor="middle" class="t-sm t-b">Entry: age ≥50 + no exclusion criteria</text>
            <rect x="15" y="62" width="300" height="140" rx="10" class="fg-acc"/>
            <text x="25" y="82" class="t-sm t-b t-acc">Domain I (clinical)</text>
            <text x="25" y="104" class="t-sm">New localized headache</text><text x="300" y="104" text-anchor="end" class="t-sm t-b">1</text>
            <text x="25" y="124" class="t-sm">Sudden visual disturbance</text><text x="300" y="124" text-anchor="end" class="t-sm t-b">1</text>
            <text x="25" y="144" class="t-sm">Polymyalgia rheumatica</text><text x="300" y="144" text-anchor="end" class="t-sm t-b">2</text>
            <text x="25" y="164" class="t-sm">Jaw claudication</text><text x="300" y="164" text-anchor="end" class="t-sm t-b">1</text>
            <text x="25" y="184" class="t-sm">Abnormal temporal artery</text><text x="300" y="184" text-anchor="end" class="t-sm t-b">≤2</text>
            <rect x="15" y="212" width="300" height="80" rx="10" class="fg-good"/>
            <text x="25" y="232" class="t-sm t-b t-good">Domain II (lab, pathology)</text>
            <text x="25" y="252" class="t-sm">Fever and/or anaemia (not with PMR)</text><text x="300" y="252" text-anchor="end" class="t-sm t-b">1</text>
            <text x="25" y="270" class="t-sm">ESR ≥50 mm/h</text><text x="300" y="270" text-anchor="end" class="t-sm t-b">1</text>
            <text x="25" y="288" class="t-sm">Compatible pathology</text><text x="300" y="288" text-anchor="end" class="t-sm t-b">≤2</text>
            <rect x="15" y="302" width="300" height="38" rx="8" class="fg-bad"/>
            <text x="165" y="326" text-anchor="middle" class="t-sm t-b">GCA: ≥3 of 11, with ≥1 from Domain I</text>
          </svg>
      - kind: check
        page: 131
        quote: "Polymyalgia Rheumatica (PMR) 2p 1 Jaw Claudication 1p 2 Abnormal temporal artery up to 2p"
        question: "Age 70, new headache (1), PMR (2), ESR 60. No exclusions. GCA score and verdict?"
        options:
          - "4: GCA established"
          - "3: GCA established"
          - "2: not yet"
          - "5: GCA established"
        answer: 0
        why:
          - "صح: headache 1 + PMR 2 + ESR ≥50 = 1 → 4، ومنهم نقط من Domain I."
          - "نسيت نقطة: الـ PMR بـ 2 مش 1."
          - "فاتك الـ ESR والـ PMR."
          - "مفيش jaw claudication أو artery points هنا."
      - kind: aside
        tone: trap
        page: 132
        quote: "E It must be ignored in the presence of PMR."
        text: |
          نقطة **fever and/or anaemia** ==بتتلغي لو فيه PMR==: الـ PMR نفسها بتعمل الحاجات دي، فما ينفعش تعدّها مرتين.
      - kind: explain
        page: 132
        title: "الـ biopsy صح"
        quote: "Biopsy abnormal site. Occipital or facial. 4-6 cm. if not obviously abnormal. If strong suspicion and normal biopsy, then biopsy opposite side."
        text: |
          1. خُد من **المكان الـ abnormal** (temporal، occipital أو facial)
          2. لو الشريان شكله سليم: خُد ==4–6 cm== (علشان الـ skip lesions)
          3. الشك قوي والـ biopsy سليمة؟ ==biopsy the opposite side==
          4. الـ **Doppler guidance** ممكن يساعد
      - kind: explain
        page: 133
        title: "PMR: الكتف والحوض الصبح"
        quote: "Muscle Pain Persisting for at Least 1 Month: Shoulders. Pelvic Girdle. Severe Morning Stiffness and Gelling."
        text: |
          - **≥50 سنة**، غالبًا Caucasian
          - وجع في ==shoulders و pelvic girdle== (والرقبة) **≥1 month**، بداية مفاجئة
          - **Severe morning stiffness** و gelling، malaise، night sweats، low-grade fever
          - ESR و CRP عاليين، **no pathognomonic test**، و ==no myopathy== (الـ CK عادي، العضلة نفسها سليمة)
      - kind: table
        page: 133
        quote: "Morning stiffness >45 minutes 6.2 (3.2, 11.8) 2. Hip pain or limited range of motion 2.1 (1.1, 4.0) 1."
        title: "PMR score (من غير ultrasound)"
        columns: [Item, Points]
        rows:
          - ["Required", "Age ≥50, bilateral shoulder aching, high ESR/CRP"]
          - ["Morning stiffness >45 min", "2"]
          - ["Hip pain or limited ROM", "1"]
          - ["Normal RF or ACPA", "2"]
          - ["No other joint pain", "1"]
          - ["Cut-off", "4"]
        hide: [[1, 1], [3, 1], [5, 1]]
      - kind: aside
        tone: tip
        page: 133
        quote: "Normal RF or ACPA 3.0 (1.3, 6.8) 2. Absence of other joint pain 2.7 (1.4, 5.0) 1. Optimal cut-off point = 4."
        text: |
          احفظها **2-1-2-1 = 4**: stiffness 2، hip 1، **normal** RF/ACPA 2، مفيش مفاصل تانية 1، والـ cut-off **4**.

          الـ RF الطبيعي بياخد نقطتين لأنه بيبعدك عن **RA** اللي ممكن تبدأ بنفس الشكل في الكبار.
      - kind: explain
        page: 135
        title: "Takayasu: الشابة اللي مالهاش نبض"
        quote: "Three major criteria 1. Left mid subclavian artery lesion"
        text: |
          **3 major:**
          1. **Left mid subclavian** lesion (من 1 cm قبل الـ vertebral لحد 3 cm بعدها)
          2. **Right mid subclavian** lesion
          3. أعراض **≥1 month**: limb claudication، ==pulselessness==، فرق ضغط **>10 mmHg**، fever، neck pain، amaurosis، syncope

          **10 minor:** ESR >20، carotid tenderness (مش عضلات الرقبة)، HTN (>140/90 brachial أو >160/90 popliteal)، AR، pulmonary artery، left mid carotid، brachiocephalic، thoracic aorta، abdominal aorta، coronary (<30 سنة من غير risk factors).
      - kind: reveal
        page: 136
        quote: "Coronary artery lesion Documented on angiography below the age of 30 years in the absence of risk factors"
        prompt: "ليه الـ coronary lesion بتتحسب بس تحت 30 سنة ومن غير risk factors؟"
        answer: |
          لأن فوق كده أو مع **hyperlipidaemia** أو **diabetes**، الـ atherosclerosis تفسرها. الشرط ده بيخلي الـ lesion **مالهاش تفسير تاني** غير الـ arteritis.
      - kind: explain
        page: 136
        title: "العلاج"
        quote: "High dose glucocorticoid therapy (40-60 mg/day prednisone-equivalent) should be initiated immediately for induction of remission"
        text: |
          - أكّد الـ LVV بـ **imaging أو histology**
          - **GCA/TAK active:** ==prednisone 40–60 mg/day immediately==
          - **GCA refractory/relapsing** أو خطر steroids عالي: ==tocilizumab== (أو methotrexate)
          - **TAK:** non-biologic steroid-sparing لكل العيانين، و biologics للـ refractory
          - **No routine** antiplatelets أو anticoagulants
          - **PMR:** prednisone **15 mg**، taper على **12–18 months**، MTX second line، **GIOP prophylaxis**، ودوّر على temporal arteritis
      - kind: check
        page: 137
        quote: "Treatment of PMR Prednisone 15 mg. Slow taper over 12 to 18 months. Possible mtx use as 2nd line agent. GIOP prophylaxis."
        question: "Pure PMR, no GCA features. Starting prednisone dose in the book?"
        options:
          - "15 mg"
          - "40–60 mg/day"
          - "1 mg/kg/day"
          - "Pulse methylprednisolone"
        answer: 0
        why:
          - "صح: PMR = 15 mg و taper بطيء 12–18 شهر."
          - "40–60 mg ده للـ GCA/TAK."
          - "1 mg/kg ده الـ high-dose في PAN."
          - "الـ pulse للـ severe vasculitis مش PMR."
      - kind: try
        items: [rheum.L08.049, rheum.L08.055, rheum.L08.061, rheum.L08.066, rheum.L08.083]
    recap:
      - "GCA: age ≥50، score ≥3 من 11 ومنهم Domain I. الـ fever/anaemia تتلغي مع PMR."
      - "Biopsy: المكان الـ abnormal، 4–6 cm، والناحية التانية لو الشك قوي."
      - "PMR: 3 required + 2-1-2-1، cut-off 4. علاجها 15 mg و 12–18 شهر."
      - "Takayasu: 3 major + 10 minor. LVV: 40–60 mg فورًا، tocilizumab للـ GCA الصعبة، ومفيش routine antiplatelets."
    practice: [rheum.L08.046, rheum.L08.047, rheum.L08.048, rheum.L08.049, rheum.L08.050, rheum.L08.051, rheum.L08.052, rheum.L08.053, rheum.L08.054, rheum.L08.055, rheum.L08.056, rheum.L08.057, rheum.L08.058, rheum.L08.059, rheum.L08.060, rheum.L08.061, rheum.L08.062, rheum.L08.063, rheum.L08.064, rheum.L08.065, rheum.L08.066, rheum.L08.067, rheum.L08.068, rheum.L08.069, rheum.L08.070, rheum.L08.071, rheum.L08.072, rheum.L08.073, rheum.L08.074, rheum.L08.075, rheum.L08.076, rheum.L08.077, rheum.L08.078, rheum.L08.079, rheum.L08.080, rheum.L08.081, rheum.L08.082, rheum.L08.083, rheum.L08.084, rheum.L08.190, rheum.L08.191, rheum.L08.193]
