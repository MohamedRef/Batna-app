  # ---------- p52: secondary hyperparathyroidism ----------
  - id: endo.L04.069
    kind: enumerate
    topic: crf-hpt
    prompt: Causes of the hypocalcaemia that drives secondary hyperparathyroidism in CRF.
    points:
      - Reduced 1,25(OH)2 D3 synthesis in the proximal tubules (the key role)
      - Hyperphosphataemia, which suppresses renal 1α-hydroxylase
      - Fewer calcitriol receptors in the parathyroid
    pass: 3
    hook: "الكالسيوم بيقع في CRF من 3 «فيتامين، فوسفات، مستقبلات»: 1,25(OH)2 D3 أقل من الـproximal tubules (ده الأساس)، hyperphosphataemia تكتم 1α-hydroxylase، وcalcitriol receptors أقل في الـparathyroid."
    src: { page: 52, quote: "c) 2ry Hyperparathyriodism (HPT) A) HPT is the result of hypocalcaemia which develops due to the following causes:\n  a) Reduced synthesis of 1,25(OH) D3 in CRD (The key role in pathogenesis of HPT as it is formed in the proximal renal tubules).\n  b) Hyperphosphatemia (it has a suppressive effect on the renal 1 a – hydroxylase).\n  c) A decrease in the number of calcitriol receptors in parathyroid in CRF. B) Since vit D also has an antiproliferative effect on parathyroid cells, this may provide an explanation for marked PTH secretion as well as the abnormal growth pattern characteristic of the nodular hypeparathyroidism." }
    status: unverified
    tags: [high-yield]
