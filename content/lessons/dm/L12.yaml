      - kind: check
        page: 145
        quote: "Treatment\n  1. Optimize glucose control to reduce the risk or slow progression of DKD .\n  2. For patients with type 2 diabetes and chronic kidney disease, consider use of a sodium–glucose cotransporter 2 inhibitor or glucagon-like peptide 1 receptor agonist shown to reduce the risk of chronic kidney disease progression, cardiovascular events, or both."
        question: "Type 2 DM with CKD: which drug classes reduce CKD progression and CV events?"
        options:
          - "SGLT2 inhibitors or GLP-1 receptor agonists"
          - "Sulfonylureas or glinides (secretagogues)"
          - "DPP-4 inhibitors only, at a renal dose"
          - "Thiazolidinediones such as pioglitazone"
        answer: 0
        why:
          - "صح: الكتاب p145 بيقول consider SGLT2 inhibitor (SGLT2i) أو GLP-1 RA."
          - "دول بيزوّدوا الـ hypoglycemia ومالهمش renal benefit."
          - "مش مذكورين كـ renoprotective هنا."
          - "مش في التوصية دي."
      - kind: explain
        page: 145
        title: "ليه الأرقام دي في الأكل؟"
        quote: "For people with non-dialysis-dependent DKD, dietary protein intake should\n         be ~0.8 g/kg body weight per day (the recommended daily allowance)"
        text: |
          - **Protein ~0.8 g/kg/day** (الـ RDA، يعني الطبيعي مش أقل منه): التفسير المقبول (مش في الكتاب) إن البروتين الكتير بيوسّع الـ afferent ويزوّد الـ **hyperfiltration**، فبيتعب الـ glomeruli الفاضلة. وما بنقللوش تحت الطبيعي عشان العيان ما يتسوّءش تغذية.
          - **Dialysis ← بروتين أكتر**: الكتاب بيقول السبب: ==malnutrition== مشكلة كبيرة عند بعض عيانين الـ dialysis، وكمان الـ dialysis نفسه بيسحب amino acids (التفسير المقبول، مش في الكتاب).
          - **Sodium <2,300 mg/day**: عشان يتحكم في الـ **blood pressure** ويقلل الـ cardiovascular risk؛ الملح بيشيل مية والضغط يعلى.
          - **Sodium و potassium individualized**: لأن عيان على ACEi أو عنده eGFR واطي ممكن الـ K يعلى، وعيان تاني على diuretic ممكن يقل.

          والعلاج: ==optimize glucose== عشان يبطّأ الـ DKD، وفي الـ type 2 مع CKD فكّر في **SGLT2i** أو **GLP-1 RA** لأنهم أثبتوا إنهم بيقللوا الـ CKD progression والـ cardiovascular events.
      - kind: check
        page: 145
        quote: "For people with non-dialysis-dependent DKD, dietary protein intake should\n         be ~0.8 g/kg body weight per day (the recommended daily allowance)"
        question: "A 75 kg man with DKD (eGFR 40, not on dialysis) asks about protein. Advice?"
        options:
          - "About 60 g a day (0.8 g/kg)"
          - "About 30 g a day (0.4 g/kg)"
          - "About 110 g a day (1.5 g/kg)"
          - "No protein limit; eat freely"
        answer: 0
        why:
          - "صح: 0.8 × 75 = 60 g، وده الـ recommended daily allowance."
          - "أقل من الطبيعي وهيعرّضه للـ malnutrition؛ الكتاب ما قالش كده."
          - "الكمية العالية دي للي على dialysis، مش قبله."
          - "الكتاب بيحدد ~0.8 g/kg للـ non-dialysis DKD."
      - kind: explain
        page: 146
        title: "الـ ACEi / ARB"
        quote: "In nonpregnant patients with diabetes and hypertension, either an ACE inhibitor or an angiotensin receptor blocker is recommended for those with a modestly elevated urinary albumin-to-creatinine ratio (30–299 mg/g creatinine). It is strongly recommended for individuals with a urinary albumin-to-creatinine ratio of≥300 mg/g creatinine and/or an estimated glomerular filtration rate of <60 mL/min/1.73 m²."
        text: |
          عيان سكر + ضغط، مش حامل:

          - Albumin-to-creatinine ratio (ACR) **30–299** ← ACE inhibitor (ACEi) أو angiotensin II receptor blocker (ARB) ==recommended==.
          - ACR **≥300** و/أو eGFR **<60** ← ==strongly recommended==.

          وتابع **creatinine + potassium** بانتظام مع ACEi وARB والـ diuretics.

          ليه الـ ACEi و الـ ARB بالذات؟ التفسير المقبول (مش في الكتاب): الـ **angiotensin II** بيقفل الـ **efferent arteriole** (المخرج)، فالضغط جوه الـ glomerulus بيعلى والـ albumin بيتسرّب. لما تمنعه، الـ efferent بيرتاح، الضغط جوه ينزل، والـ albuminuria تقل، وده بيحمي الكلية على المدى الطويل. وعشان كده كل ما الـ ACR يعلى، التوصية بتقوى.
      - kind: aside
        tone: trap
        page: 146
        quote: "Do not discontinue renin-angiotensin system blockade for minor increases in serum creatinine (<30%) in the absence of volume depletion."
        text: "الـ creatinine طلع 15–20% بعد الـ ACEi؟ ده متوقّع (الـ efferent بيرتاح). ==ما توقفش== طول ما الزيادة **<30%** ومفيش **volume depletion**. أما لو الـ eGFR وقع **>30%**، ده من الـ clues للـ non-DKD (p144). والكتاب كرّر البندين دول 3 مرات في الصفحة، فاحفظهم كويس 😄"
      - kind: case
        page: 146
        quote: "Periodically monitor serum creatinine and potassium levels for the development of increased creatinine or changes in potassium when ACE inhibitors, angiotensin receptor blockers, or diuretics are used."
