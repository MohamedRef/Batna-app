  - id: hem.L03.lesson11
    title: "الـ HUS: الإسهال اللي بيوقف الكلية"
    hook: "طفل أكل برجر مش مستوي، جاله إسهال بدم، وبعد أسبوع البول قل. ده الـ HUS، وأغلب اللي هتعمله هو اللي ما تعملوش."
    minutes: 10
    pages: [45, 49]
    topics: [hus]
    goals:
      - "تعرف الـ triad وليه الـ Coombs سالب"
      - "تفرّق الـ typical من الـ atypical في السبب والسن والمآل"
      - "تعرف التشخيص والـ DD والعلاج وإيه الممنوع وليه"
    status: unverified
    steps:
      - kind: explain
        remind: [hem.L03.126]
        page: 45
        title: "الـ HUS"
        quote: "HUS has two variants termed typical and atypical HUS: The typical variant is caused by Shiga-like toxin (verotoxin) produced by E. coli (O157: H7) and Shiga toxin by Shigella dysenteriae."
        text: |
          الـ triad: **thrombocytopenia** + ==acute renal impairment== + **MAHA**، والـ Coombs **سالب** (mechanical). ليه سالب؟ لأن الكرة مش بيتعلّم عليها antibody؛ هي بتتقطع **ميكانيكيًا** على الجلطات الصغيرة في جدار الأوعية.

          من أهم أسباب الـ AKI في **الأطفال**. الحدث الأول ==endothelial damage==.

          **Typical**: **Shiga-like toxin** من **E. coli O157:H7** (لحمة مش مستوية، لبن مش مبستر) أو Shigella.

          أدوية: mitomycin C، cyclosporine، cisplatin، cocaine، quinine.
      - kind: explain
        page: 46
        title: "ليه الكلية؟ والـ typical غير الـ atypical"
        quote: "Damage to endothelial cells is the primary event in the pathogenesis of hemolytic-uremic syndrome (HUS)."
        text: |
          الحدث الأول في الـ HUS هو ==endothelial damage==. الـ lesion الأساسي: **microthrombi** في الـ arterioles والـ capillaries + **RBC fragmentation**.

          الـ HUS بيتقسم حسب الـ **Shiga-like toxin (Stx)**. اسمه كده لأنه اتعرف الأول في الـ **Shigella dysenteriae**، بس الـ **E. coli** بتعمله كمان.

          - **Typical (Stx-HUS)**: الشكل الكلاسيكي والـ epidemic. أطفال **أقل من 2–3 سنين**، غالبًا بإسهال (**D+HUS**)، وربعهم من غير إسهال (D-HUS). AKI في 55–70%، بس **70–85%** الكلى بترجع.
          - **Atypical (non-Stx)**: أي سن، أكتر في **الكبار**، من غير إسهال. ممكن sporadic أو familial، والـ familial مرتبط بعيوب في ==complement regulatory proteins==. المآل وحش: لحد **50%** يوصلوا ESRD أو brain damage، ولحد **25%** بيموتوا في الـ acute phase.

          ليه الكلية أكتر عضو؟ التفسير المقبول (مش في الكتاب): الـ glomerular endothelium فيه receptors كتير للـ toxin، والدم بيعدّي فيه بكمية كبيرة، فبياخد أكبر جرعة.
      - kind: table
        page: 46
        quote: "Typical HUS (Shiga-like toxin–associated HUS [Stx-HUS]) is the classic, primary or epidemic, form of HUS. Stx-HUS is largely a disease of children younger than 2-3 years and often results in diarrhea (denoted D+HUS). One fourth of patients present without diarrhea (denoted D-HUS). Acute kidney injury occurs in 55-70% of patients, but they have a favorable prognosis, and as many as 70-85% of patients recover renal function."
        title: "Typical ولا atypical HUS؟"
        columns: [Feature, Typical, Atypical]
        rows:
          - ["Who", "Kids < 2–3 y", "Adults"]
          - ["Diarrhoea", "D+ mostly", "D-"]
          - ["Outcome", "70–85% recover", "50% ESRD"]
          - ["Cause", "Shiga toxin", "Complement"]
        hide: [[1, 2], [2, 1], [2, 2], [3, 2]]
      - kind: explain
        page: 47
        title: "الـ atypical: إيه اللي بيولّعه؟"
        quote: "In rare cases, other underlying medical conditions (eg, antiphospholipid syndrome [APL], systemic lupus erythematosus ."
        text: |
          الـ sporadic non-Stx HUS ليه triggers:
          - **Nonenteric infections** و **viruses**.
          - **Drugs**: الكتاب ذكر قبل كده mitomycin C، cyclosporine، cisplatin، cocaine، quinine، ونادرًا tacrolimus و interferon alpha.
          - **Malignancies**.
          - **Transplantation**.
          - **Pregnancy**.
          - نادرًا: **antiphospholipid syndrome (APL)** و **SLE**.

          ومن الأسباب التانية في الكتاب: Mycoplasma pneumoniae، Clostridium difficile، HIV، histoplasmosis، coxsackievirus، و H1N1.

          الفكرة: التفسير المقبول (مش في الكتاب) الـ complement في العيان ده متفلت أصلًا أو على الحافة، وأي trigger من دول بيجرح الـ endothelium ويشغّل الـ complement عليه. عشان كده علاج الـ atypical بيوقف الـ complement.
