  # ------------------------------------------------------------------
  - id: neph.L14.lesson6
    title: "HUS: الإسهال ولا الـ complement؟"
    hook: "طفل بإسهال بدم وبعدها بأسبوع بطّل يعمل بول. الحكاية بدأت من سندوتش لحمة نيّة."
    minutes: 10
    pages: [471, 474]
    topics: [hus]
    goals:
      - "تفرّق بين الـ typical والـ atypical والـ secondary HUS"
      - "تفهم ليه الـ aHUS بيرجع وبيوصل ESRD"
      - "تعرف أسباب الـ secondary aHUS وليه الـ S. pneumoniae حالة خاصة"
      - "تشرح طريق الـ Shiga toxin والأربع طرق للـ endothelial damage"
    status: unverified
    steps:
      - kind: explain
        page: 471
        title: "الـ HUS: يعني إيه وأنواعه"
        quote: "Hemolytic uremic syndrome (HUS) is a thrombotic microangiopathy (TMA) characterized by thrombocytopenia, microangiopathic hemolytic anemia, and AKI.\nHUS is most commonly caused by Shiga toxin (typical HUS) or, less commonly, infections or genetic abnormalities activating the alternative complement pathway (atypical HUS).\nAdditional causes can be secondary to malignancy, autoimmune disorders, genetic mutations, and medication use.\nTypical HUS\nShiga toxin-producing Escherichia coli (STEC), called typical HUS, is the most common cause of HUS.\nTypical HUS comprises 90% to 95% of HUS cases and commonly arises from consuming contaminated food or drink and through person-to-person contact."
        text: |
          - الـ ==hemolytic uremic syndrome (HUS)== نوع من الـ thrombotic microangiopathy (TMA): **thrombocytopenia** + **microangiopathic hemolytic anemia** + **acute kidney injury (AKI)**.
          - **Typical HUS** سببه الـ Shiga toxin-producing Escherichia coli (STEC)، وهو الأشهر: ==90-95%== من الحالات، من أكل أو شرب ملوّث أو من شخص لشخص.
          - **Atypical HUS (aHUS)** أقل، من infections أو genetic abnormalities بتشغّل الـ alternative complement pathway.

          ليه الاسم كده؟ **Hemolytic** = الكرات الحمرا بتتكسر في الأوعية، **uremic** = الكلية بتقع واليوريا تعلى. والفرق بينه وبين الـ TTP إن الكلية هنا هي البطل، والمخ أقل. والفرق بين الـ typical والـ atypical هو الـ **trigger**: في الـ typical توكسين جاي من برا، في الـ atypical فرامل الـ complement من جوه بايظة، فأي عدوى بسيطة تكفي.
      - kind: table
        page: 472
        quote: "Atypical HUS (aHUS) constitutes 5% to 10% of HUS cases and is linked to genetic mutations affecting the alternative complement pathway.\nUnder physiological conditions, the alternative complement system is continuously active at low levels. However, inflammatory conditions such as infections can induce endothelial damage, triggering the activation of the coagulation cascade and causing a TMA presentation.\nThe initial clinical manifestation of aHUS typically involves nonspecific symptoms like fatigue, pallor, or somnolence. These symptoms can progress to signs of AKI, including oliguria, uremia, and fluid overload. The risk of progression to stage 3 or 4 CKD and ESRD in aHUS is high.\nIn contrast to typical HUS, patients with aHUS often fail to regain kidney function without treatment. Untreated, approximately 50% of aHUS cases progress to dialysis dependency, with a mortality rate of 25%.\nSimilar to typical HUS, aHUS may exhibit extrarenal manifestations, notably cardiac and neurological, including HF, pulmonary HTN, seizures, coma, and blindness. These manifestations significantly contribute to the morbidity and mortality associated with aHUS. In contrast to typical HUS, patients with aHUS commonly relapse; patients must be monitored closely for relapse after treatment is discontinued."
        title: "Typical vs atypical HUS"
        columns: [Feature, Typical (STEC), Atypical]
        rows:
          - [Share, "Most cases (the rest)", "5-10%"]
          - [Cause, "Shiga toxin E. coli", "Complement mutations"]
          - [Untreated outcome, "Usually recovers", "~50% dialysis, 25% death"]
          - [Relapse, Uncommon, Common]
        hide: [[0, 2], [1, 2], [2, 2]]
      - kind: explain
        page: 472
        title: "STEC-HUS بالأرقام"
        quote: "The incidence of HUS among individuals infected with STEC ranges from 5% to 15%, predominantly affecting children younger than 5."
        text: |
          - **5-15%** من عدوى الـ Shiga toxin-producing Escherichia coli (STEC) بيعملوا hemolytic uremic syndrome (HUS)، أغلبهم **أطفال تحت 5**.
          - **Bloody diarrhea** يوم **2-3** بعد التعرض، والـ HUS بعدها بـ **3-10 أيام**.
          - Vomiting **67%**، fever **37%**، abdominal pain **29%**.

          ليه الأطفال تحت 5؟ التفسير المقبول (مش في الكتاب): عندهم Gb3 أكتر في الـ glomeruli ومناعة أقل ضد التوكسين. وليه الـ HUS بييجي بعد الإسهال بأيام؟ لأن التوكسين محتاج وقت يعدّي من الأمعاء للدم ويوصل الكلية.
      - kind: explain
        page: 472
        title: "ليه الـ aHUS بيبان من غير مقدمات، وليه بيرجع؟"
        quote: "Under physiological conditions, the alternative complement system is continuously active at low levels. However, inflammatory conditions such as infections can induce endothelial damage, triggering the activation of the coagulation cascade and causing a TMA presentation."
        text: |
          الكتاب بيدّيك الأساس: الـ alternative complement ==continuously active at low levels== طول الوقت. يعني فيه **فرامل** شغالة دايمًا تمنعه يأذي خلايانا. في الـ aHUS الفرامل دي فيها **mutation**، فأي ==infections== تعمل endothelial damage تشغّل الـ coagulation وتطلع الـ TMA.

          وده بيفسّر الصورة اللي في الكتاب:
          - البداية **nonspecific**: fatigue، pallor، somnolence، وبعدين oliguria و uremia و fluid overload.
          - ==often fail to regain kidney function without treatment==: حوالي **50%** dialysis و **25%** وفيات من غير علاج.
          - **commonly relapse**: لأن الـ mutation لسه موجودة، وأي عدوى جاية هتشغّلها تاني. عشان كده لازم متابعة بعد ما توقف العلاج.
          - Extrarenal زي الـ typical: HF، pulmonary HTN، seizures، coma، blindness.
      - kind: aside
        tone: trap
        text: "الـ **S. pneumoniae** هو السبب الوحيد لـ **Coombs-positive** HUS (الـ neuraminidase بيكشف antigens)، وهنا الـ **antibiotics بدري** مطلوبة. أما STEC-HUS: **ممنوع** antibiotics و antimotility."
      - kind: explain
        page: 473
        title: "الـ secondary aHUS: والمرض اللي وراه"
        quote: "S pneumoniae releases neuraminidase, exposing cellular antigens and activating the alternative complement system. This is the only cause of Coombs-positive HUS, and early antibiotic administration is indicated."
        text: |
          الـ secondary HUS بيبان زي الـ aHUS (complement شغال غلط)، بس فيه **سبب** تقدر تلاقيه.

          أهم واحد: **S. pneumoniae**، **5-15%** من الـ HUS في الأطفال. الـ ==neuraminidase== بيكشف ==cellular antigens== على سطح الخلايا، فيحصل حاجتين: الـ complement يشتغل، والـ antibodies الموجودة تلزق في الكرات الحمرا، عشان كده ده ==the only cause of Coombs-positive HUS==. والعلاج **early antibiotic**.

          الباقي في الكتاب: inherited **B12** disorders، **DGKE** mutations، **HIV**، **influenza**، autoimmune (SLE، APS)، أدوية (**quinine**، CNI، chemo)، **malignant hypertension**، و **COVID-19**.

          والحمل؟ الكتاب بيقول **Pregnancy triggers aHUS activation**، فالست اللي عندها aHUS معروف مضاعفات الحمل عندها أكتر.
      - kind: order
        page: 473
        quote: "HUS is typically associated with bacterial infection resulting from the consumption of undercooked beef, unpasteurized milk.\nOnce ingested, STEC penetrates the mucous layer of the intestine and secretes Shiga toxin, which binds to the receptor Gb3."
        prompt: "رتّب طريق الـ Shiga toxin:"
        steps:
          - "STEC is eaten"
          - "Shiga toxin secreted in the gut"
          - "Toxin binds Gb3"
          - "Protein synthesis blocked, apoptosis"
          - "Glomerular endothelial damage, TMA"
        why: "العدوى بتيجي من **undercooked beef** أو **unpasteurized milk**. الـ Gb3 أكتر حاجة في الـ glomerular microvasculature، عشان كده الكلية أول ضحية. والتوكسين كمان بيثبّط factor H فيشغّل الـ complement."
      - kind: explain
        page: 474
        title: "أربع طرق والتوكسين بيبوّظ الـ endothelium"
        quote: "Endothelial damage is caused by 1) direct cytotoxicity of Shiga toxin, 2) disturbance of the hemostatic pathway, 3) increased cytokine release, and 4) alternative pathway activation."
        text: |
          الـ Shiga toxin بيلزق في الـ **Gb3**، وأعلى تركيز ليه ==in the glomerular microvasculature==، عشان كده الكلية أول ضحية.

          وبعدها بيأذي الـ endothelium بأربع طرق:
          1. **Direct cytotoxicity:** بيوقف الـ protein synthesis في الـ ribosomes فالخلية تموت (apoptosis).
          2. **Hemostatic pathway:** الـ endothelium الميت بيكشف اللي تحته فالصفايح تلزق.
          3. **Cytokines:** التهاب زيادة.
          4. **Alternative pathway:** التوكسين ==inhibiting complement factor H==.

          النقطة الرابعة مهمة: يعني الـ typical HUS نفسه فيه حتة complement، وده اللي هيفسّر بعد كده ليه الـ complement الواطي ==not specific== للـ aHUS.

          وفي الـ aHUS: نفس الـ pathway بس العيب في **Factor H that stabilizes C3 and inactivates C3b**، يعني الفرامل نفسها بايظة. والـ secondary ماشي بنفس الطريقة.
