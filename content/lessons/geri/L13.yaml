        quote: "The World Health Organization's (WHO) analgesic ladder has traditionally been the framework most often cited for the management of malignant and nonmalignant persistent pain syndromes. Under the WHO analgesic ladder, patients rate their pain as mild (1-4 on a 10-point scale), moderate (5-6), or severe (7-10), and an analgesic is prescribed based on the patient's pain level."
