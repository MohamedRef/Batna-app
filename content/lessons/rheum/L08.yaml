        title: "Hypersensitivity vasculitis: الدوا هو المتهم"
        quote: "Medication at Disease Onset."
        text: |
          الـ ACR criteria للـ **hypersensitivity vasculitis**:
          1. السن **>16** سنة عند البداية.
          2. ==Medication at disease onset==.
          3. **Palpable purpura**.
          4. **Maculopapular rash**.
          5. **Biopsy** فيها arteriole و venule و **granulocytes** حوالين الوعاء أو براه.

          التفسير المقبول (مش في الكتاب): الدوا بيعمل **immune complexes** صغيرة، بتترسّب في أصغر الأوعية في الجلد، فالصورة **small vessel**: purpura في الرجلين و rash. ودي من الـ **secondary** vasculitis اللي اتكلمنا عنها في أول المحاضرة: أول علاج إنك **توقف الدوا**. وشرط **>16 سنة** عشان يفرّقها عن الـ HSP اللي في الأطفال.
