            <circle cx="195" cy="55" r="4" class="fg-dot-acc"/><circle cx="212" cy="70" r="4" class="fg-dot-good"/><circle cx="215" cy="50" r="4" class="fg-dot-bad"/>
            <circle cx="280" cy="55" r="4" class="fg-dot-acc"/><circle cx="298" cy="70" r="4" class="fg-dot-good"/><circle cx="300" cy="50" r="4" class="fg-dot-bad"/>
            <circle cx="195" cy="125" r="4" class="fg-dot-acc"/><circle cx="212" cy="140" r="4" class="fg-dot-good"/><circle cx="215" cy="120" r="4" class="fg-dot-bad"/>
            <circle cx="280" cy="125" r="4" class="fg-dot-acc"/><circle cx="298" cy="140" r="4" class="fg-dot-good"/><circle cx="300" cy="120" r="4" class="fg-dot-bad"/>
            <text x="250" y="180" text-anchor="middle" class="t-sm t-mut">whole clusters sampled</text>
          </svg>
      - kind: explain
        page: 42
        quote: "Clusters are often:\n  geographic units (e.g., districts, shiakhat, villages) or\n  organizational units (e.g., clinics, heath facilities, schools).\nFor example, in a KAP study related to family planning in rural communities of a region, a list is made of all the villages. Using this list, a random sample of villages is chosen and all study units in the selected villages are interviewed."
        title: "الـ clusters بتبقى إيه؟"
        text: |
          الـ clusters غالبًا:

          - ==Geographic units==: districts، شياخات، قرى.
          - ==Organizational units==: clinics، health facilities، مدارس.

          مثال السلايد: knowledge, attitude and practice (KAP) study عن تنظيم الأسرة في ريف محافظة: list بكل القرى، تختار ==قرى random==، وتقابل كل اللي في القرى دي.

          ليه القرية كلها؟ لأن الوصول للقرية هو المكلّف، وبعد ما وصلت مقابلة الكل أرخص من التنقل بين قرى كتير. التفسير المقبول (مش في الكتاب).
      - kind: check
        page: 43
        quote: "Advantages :\nCuts down on the cost of preparing a sampling frame.\nThis can reduce travel and other administrative costs.\nDisadvantages:\nsampling error is higher over a simple random sample of same size."
        question: "What is the main disadvantage of cluster sampling?"
        options: ["Higher sampling error than a simple random sample of the same size", "It needs a complete list of every individual", "It raises travel costs", "It cannot be random"]
        answer: 0
        why:
          - "صح: الناس جوه الـ cluster الواحدة شبه بعض أكتر، فالـ sampling error أعلى."
          - "بالعكس، ميزته إنه بيوفّر تكلفة تجهيز الـ sampling frame."
          - "بالعكس، بيقلل الـ travel والتكاليف الإدارية."
          - "الـ clusters نفسها بتتختار random."
      - kind: explain
        page: 44
        quote: "Two types of cluster sampling methods.\nOne-stage sampling. All of the elements within selected clusters are included in the sample.\nTwo-stage sampling. A subset of elements within selected clusters are randomly selected for inclusion in the sample."
        title: "One-stage ولا two-stage؟"
        text: |
          - **One-stage**: كل الناس جوه الـ clusters المختارة بيدخلوا.
          - **Two-stage**: بتسحب **random** جزء من الناس جوه كل cluster مختار.

          مثال الشريحة: الـ **immunization coverage** في محافظة = **30 cluster × 7 أطفال** (12–23 شهر)، يعني **210** أطفال. الدكتورة نبّهت إن الأرقام دي مثال تعليمي، مش sample size جاهز لأي survey.

          وفي الشرح اتأكد الفرق: في الـ **stratified** بتاخد من **كل** طبقة، وفي الـ **cluster** بتختار **بعض** الـ clusters بس.
      - kind: explain
        page: 45
        quote: "Determining proportion of undernourished five year olds in a village.\nInvestigating nutritional status of preschool children.\nSelecting maternity records for the study of previous abortions or duration of postnatal stay.\nIn estimation of immunization coverage in a province, data on seven children aged 12-23 months in 30 clusters are used to determine proportion of fully immunized children in the province."
        title: "استخدامات الـ cluster في السلايد"
        text: |
          أمثلة بيتنصح فيها بالـ cluster sampling:

          - ==نسبة سوء التغذية== في أطفال خمس سنين في قرية.
          - الحالة الغذائية لأطفال ما قبل المدرسة.
          - اختيار ==maternity records== لدراسة الإجهاض السابق أو مدة الإقامة بعد الولادة.
          - ==Immunization coverage== في محافظة: 7 أطفال (12-23 شهر) من 30 cluster.

          ليه الأمثلة دي؟ كلها ناس متفرقين جغرافيًا، فالسحب بالقرية أو بالعيادة أوفر. التفسير المقبول (مش في الكتاب).
      - kind: check
        page: 45
        quote: "Determining proportion of undernourished five year olds in a village.\nInvestigating nutritional status of preschool children.\nSelecting maternity records for the study of previous abortions or duration of postnatal stay.\nIn estimation of immunization coverage in a province, data on seven children aged 12-23 months in 30 clusters are used to determine proportion of fully immunized children in the province."
        question: "Immunization coverage in a province is estimated from seven children aged 12-23 months in each of 30 clusters. Which sampling method is this?"
        options:
          - "Cluster sampling"
          - "Quota sampling"
          - "Systematic sampling"
          - "Snowball sampling"
        answer: 0
        why:
          - "صح: الـ 30-cluster immunization survey مثال السلايد للـ cluster."
          - "الـ quota بيملا عدد من كل category من غير random."
          - "الـ systematic كل K واحد من list كاملة."
          - "الـ snowball بيمشي ورا ترشيحات."
      - kind: explain
        page: 46
        quote: "Sampling\n  Probability: Simple random; Systematic; Stratified random; Cluster; Multi-stage\n  Non-probability: Quota; Purposive; Snowball; Self-selection; Convenience\n    Purposive: Extreme case; Heterogeneous; Homogeneous; Critical case; Typical case"
        title: "شجرة الـ sampling: probability"
        text: |
          في تقسيم المحاضرة، الـ ==probability sampling== فيه:

          1. Simple random
          2. Systematic
          3. Stratified random
          4. Cluster
          5. ==Multi-stage== (بيجمع اللي فاتوا)

          والـ non-probability: quota، purposive، snowball، self-selection، convenience.

          ليه نحفظ الشجرة؟ أسئلة «which is a probability sampling» إجابتها غالبًا ==all of the above== لو الأربعة الأولانيين. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 47
        quote: "Is done in successive stages; each successive sampling unit is nested in the previous sampling unit\nAdvantage: Introduces flexibility in sampling\nFor example, in large country surveys, states are chosen, then districts, then villages, then every 10th person in village as final sampling unit\nin a school survey: Districts schools classes students by systmatic random technique"
        title: "5. Multistage sampling"
        text: |
          ==Multistage sampling== = sampling على **مراحل**، كل وحدة **جوه** اللي قبلها، وميزته الـ **flexibility**.

          - في survey على مستوى دولة: محافظات ← مراكز ← قرى ← كل عاشر واحد في القرية.
          - في survey على المدارس: districts ← schools ← classes ← students (بالـ systematic random).
