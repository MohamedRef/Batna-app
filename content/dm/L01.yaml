items:
  # ---------- p1: glucose and definition ----------
  - id: dm.L01.001
    kind: card
    topic: definition
    front: Why does the lecture call glucose essential?
    back: It is the only source of energy for every organism in the body and fuels both aerobic and anaerobic cellular respiration.
    src: { page: 1, quote: "The only source of energy for every organism in the body Essential to fuel both aerobic and anaerobic cellular respiration." }
    status: unverified
  - id: dm.L01.002
    kind: enumerate
    topic: definition
    prompt: In which forms does glucose often enter the body?
    points:
      - "Monosaccharides: galactose and fructose"
      - "Disaccharides: lactose and sucrose"
      - "Polysaccharide: starch"
    pass: 3
    src: { page: 1, quote: "Often enters the body as galactose and fructose (monosaccharides), lactose and sucrose (disaccharides), or starch (polysaccharide)." }
    status: unverified
  - id: dm.L01.003
    kind: cloze
    topic: definition
    text: "Excess glucose is stored as {{c1::glycogen}}, released in fasting; glucose can also be made from fat and protein breakdown by {{c2::gluconeogenesis}}."
    src: { page: 1, quote: "Our body stores excess glucose as glycogen, which becomes liberated in times of fasting." }
    status: unverified
  - id: dm.L01.004
    kind: card
    topic: definition
    front: Which two hormones play the pivotal role in glucose metabolism?
    back: Insulin and glucagon.
    src: { page: 1, quote: "Insulin and glucagon play a pivotal role in its metabolism" }
    status: unverified
  - id: dm.L01.005
    kind: card
    topic: definition
    front: Define diabetes mellitus.
    back: A group of chronic metabolic disorders of carbohydrate metabolism in which glucose is underutilized and overproduced (inappropriate gluconeogenesis and glycogenolysis), causing hyperglycemia; due to defects of insulin secretion, action, or both.
    src: { page: 1, quote: "glucose is both underutilized as an energy source and overproduced due to inappropriate gluconeogenesis and glycogenolysis, resulting in hyperglycemia." }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.006
    kind: cloze
    topic: definition
    text: "Diabetes results from defects of {{c1::insulin secretion}}, {{c2::insulin action}}, or both."
    src: { page: 1, quote: "It results from defects of insulin secretion, insulin action or both." }
    status: unverified
  - id: dm.L01.007
    kind: cloze
    topic: definition
    text: "Diabetes has {{c1::specific microvascular}} complications (retina, kidney, peripheral nerves) and {{c2::non-specific macrovascular}} complications (coronary, cerebral, peripheral vessels)."
    src: { page: 1, quote: "specific microvascular (retina, renal, peripheral nerves), and non-specific macrovascular (coronary, cerebral, peripheral blood vessels) complications." }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.008
    kind: enumerate
    topic: definition
    prompt: Name the targets of the macrovascular complications of diabetes.
    points: [Coronary vessels, Cerebral vessels, Peripheral blood vessels]
    pass: 3
    src: { page: 1, quote: "non-specific macrovascular (coronary, cerebral, peripheral blood vessels) complications." }
    status: unverified
  # ---------- p2: epidemiology ----------
  - id: dm.L01.009
    kind: card
    topic: epidemiology
    front: Why is diabetes a major public health problem worldwide?
    back: The number of people affected keeps rising (an epidemic), and it carries high morbidity and mortality.
    src: { page: 2, quote: "Increased number of persons affected (Epidemic) - The associated morbidity and mortality." }
    status: unverified
  - id: dm.L01.010
    kind: cloze
    topic: epidemiology
    text: "Prevalence of diabetes in Egypt: {{c1::9.5%}} in the age group {{c2::20–79}} years."
    src: { page: 2, quote: "Prevalence rate in Egypt: 9.5% in the age group 20-79years." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L01.011
    kind: cloze
    topic: epidemiology
    text: "The ratio of type 1 to type 2 diabetes is {{c1::1:9}}."
    src: { page: 2, quote: "The ratio between type 1 to type 2 diabetes is 1:9." }
    status: unverified
    tags: [numbers]
  - id: dm.L01.012
    kind: card
    topic: epidemiology
    front: Incidence of type 1 vs type 2 diabetes, and which sex is more affected by type 2?
    back: Type 1 incidence is very low, type 2 very high; type 2 affects females more than males.
    src: { page: 2, quote: "Incidence (new cases per year) of type 1 diabetes is very low, but for type 2 is very high." }
    status: unverified
  # ---------- p2-3: classification ----------
  - id: dm.L01.013
    kind: card
    topic: classification
    front: What causes type 1 diabetes in the classification?
    back: Autoimmune β-cell destruction leading to absolute insulin deficiency (LADA included).
    src: { page: 2, quote: "leading to absolute insulin deficiency, including LAD A" }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.014
    kind: card
    topic: classification
    front: What causes type 2 diabetes in the classification?
    back: A non-autoimmune, progressive loss of adequate β-cell insulin secretion.
    src: { page: 2, quote: "Type 2 diabetes (due to a non-autoimmune progressive loss of adequate" }
    status: unverified
  - id: dm.L01.015
    kind: cloze
    topic: classification
    text: "Type 2 diabetes is predominantly insulin resistance in {{c1::80%}} ({{c2::obese}}) and predominantly an insulin secretory defect in {{c3::20%}} (non-obese)."
    src: { page: 2, quote: "Predominantly insulin resistance (80%, obese) - Predominantly insulin secretory defect (20%, non-obese)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L01.016
    kind: enumerate
    topic: classification
    prompt: Enumerate the types of primary diabetes mellitus.
    points: [Type 1 diabetes, Type 2 diabetes, Gestational diabetes mellitus]
    pass: 3
    src: { page: 2, quote: "1- Primary Diabetes Mellitus" }
    status: unverified
  - id: dm.L01.017
    kind: enumerate
    topic: classification
    prompt: Enumerate the pancreatic diseases that cause secondary diabetes.
    points: [Pancreatitis, Pancreatectomy, Neoplasia, Hemochromatosis]
    pass: 3
    src: { page: 2, quote: "Pancreatic diseases: Pancreatitis, pancreatectomy, neoplasia, and hemochromatosis." }
    status: unverified
  - id: dm.L01.018
    kind: enumerate
    topic: classification
    prompt: Enumerate the endocrinopathies that cause secondary diabetes.
    points: [Acromegaly, Cushing's syndrome, Pheochromocytoma, Hyperthyroidism]
    pass: 3
    src: { page: 2, quote: "Endocrinopathies: acromegaly, Cushing's syndrome, pheochromocytoma, and hyperthyroidism." }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.019
    kind: enumerate
    topic: classification
    prompt: Enumerate the drugs that cause secondary diabetes.
    points: [Corticosteroids, Thiazide diuretics, Thyroid hormone, β-adrenergic agonists]
    pass: 3
    src: { page: 3, quote: "Drugs or chemicals induced: corticosteroid, thiazide diuretics, thyroid hormone, β-adrenergic agonists." }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.020
    kind: table
    topic: classification
    title: Classification of diabetes mellitus
    columns: [Group, Members]
    rows:
      - ["Primary", "Type 1 (incl. LADA); type 2 (insulin resistant 80% / secretory defect 20%); GDM"]
      - ["Secondary: pancreatic", "Pancreatitis, pancreatectomy, neoplasia, hemochromatosis"]
      - ["Secondary: endocrine", "Acromegaly, Cushing's, pheochromocytoma, hyperthyroidism"]
      - ["Secondary: drugs", "Corticosteroids, thiazides, thyroid hormone, β-agonists"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 2, quote: "2-Secondary Diabetes: - Pancreatic diseases: Pancreatitis, pancreatectomy, neoplasia, and hemochromatosis." }
    status: unverified
    tags: [high-yield]
  # ---------- p3-4: type 1 pathogenesis ----------
  - id: dm.L01.021
    kind: card
    topic: t1-pathogenesis
    front: What causes type 1 diabetes, and which factors contribute?
    back: Destruction of the insulin-producing cells; a strong genetic component plus extragenetic (immunologic and environmental, e.g. viral) factors.
    src: { page: 3, quote: "Type 1 diabetes is caused by destruction of the insulin producing cells." }
    status: unverified
  - id: dm.L01.022
    kind: order
    topic: t1-pathogenesis
    prompt: Put the six stages of the natural history of type 1 diabetes in order.
    steps:
      - Genetic susceptibility
      - Triggering by environmental factors
      - Immune activation
      - Progressive loss of glucose-stimulated insulin secretion
      - Overt diabetes
      - Endless beta cell failure
    src: { page: 3, quote: "Natural history of type 1 diabetes comprised 6 stages" }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.023
    kind: cloze
    topic: t1-pathogenesis
    text: "Stage I of type 1 diabetes: {{c1::one diabetogenic gene within the HLA}} is necessary; {{c2::95%}} of patients are HLA-{{c3::DR3 and/or DR4}} positive."
    src: { page: 3, quote: "One diabetogenic gene within the HLA is necessary." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L01.024
    kind: card
    topic: t1-pathogenesis
    front: What is the only proven environmental trigger of type 1 diabetes?
    back: Congenital rubella.
    src: { page: 3, quote: "Congenital rubella is the only proved environmental factor." }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.025
    kind: enumerate
    topic: t1-pathogenesis
    prompt: Other suggested environmental triggers of type 1 diabetes (besides congenital rubella)?
    points: [Mumps, Coxsackie B, Reovirus, Herpes, Chemicals and toxins]
    pass: 4
    src: { page: 3, quote: "Other suggested viruses include; mumps, coxsackie-B, reovirus and herpes." }
    status: unverified
  - id: dm.L01.026
    kind: card
    topic: t1-pathogenesis
    front: What happens in stage III (immune activation) of type 1 diabetes?
    back: Autoimmune insulitis with β-cell destruction; autoantibodies appear (islet cell antibodies, GAD and insulin antibodies).
    src: { page: 3, quote: "Autoimmune insulitis and destruction. Autoantibodies: ICS, GAD and insulin antibodies." }
    status: unverified
  - id: dm.L01.027
    kind: cloze
    topic: t1-pathogenesis
    text: "Frank (overt) type 1 diabetes appears when more than {{c1::90%}} of β cells are destroyed."
    src: { page: 3, quote: "When more than 90% of these cells have destroyed — frank diabetes." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L01.028
    kind: card
    topic: t1-pathogenesis
    front: "Stage VI of type 1 diabetes (endless β-cell failure): what are insulin and C-peptide levels?"
    back: Absent or very low.
    src: { page: 4, quote: "Stage VI: Endless beta cell failure: Plasma insulin and c-peptide levels are absent or very low." }
    status: unverified
  # ---------- p4-5: type 2 pathogenesis ----------
  - id: dm.L01.029
    kind: card
    topic: t2-pathogenesis
    front: What causes type 2 diabetes?
    back: A combination of decreased insulin action and inadequate insulin secretion.
    src: { page: 4, quote: "Type 2 diabetes is caused by a combination of decreased insulin action and inadequate insulin secretion." }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.030
    kind: card
    topic: t2-pathogenesis
    front: What are the two main risk factors for type 2 diabetes, and what kind of genetics?
    back: Genetic susceptibility (likely multigenic) and environmental factors.
    src: { page: 4, quote: "Genetic susceptibility: which is likely multigenic." }
    status: unverified
  - id: dm.L01.031
    kind: enumerate
    topic: t2-pathogenesis
    prompt: Enumerate the environmental risk factors for type 2 diabetes.
    points: [Obesity, Sedentary lifestyle, Physical inactivity, Hypertension, Dyslipidemia, Increased age, Smoking, Stress]
    pass: 6
    src: { page: 4, quote: "Obesity. Sedentary life style. Physical inactivity. Hypertension. Dyslipidemia. Increased age Smoking. Stress." }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.032
    kind: card
    topic: t2-pathogenesis
    front: The two pathogenic defects of type 2 diabetes?
    back: A pancreatic defect (↓ insulin secretion) and a target-tissue defect (↓ insulin action = insulin resistance). Which comes first is still controversial.
    src: { page: 4, quote: "These factors lead to two pathogenic defects: 1- Pancreatic defect" }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.033
    kind: card
    topic: t2-pathogenesis
    front: In type 2 diabetes, what is the major contributor to fasting hyperglycemia?
    back: Increased hepatic glucose production (HGP) from reduced insulin action in the liver.
    src: { page: 4, quote: "hepatic glucose production (HGP): the major contributor to fasting hyperglycemia." }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.034
    kind: table
    topic: t2-pathogenesis
    title: Reduced insulin action in type 2 diabetes, by tissue
    columns: [Tissue, Result]
    rows:
      - [Liver, "↑ hepatic glucose production: the major cause of fasting hyperglycemia"]
      - [Adipose tissue, "↑ lipolysis → ↑ circulating free fatty acids"]
      - [Muscle, "↓ glucose uptake"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 4, quote: "Adipose tissue: f lipolysis leads to f circulating free fatty acids (FFAs)" }
    status: unverified
  - id: dm.L01.035
    kind: card
    topic: t2-pathogenesis
    front: Define glucotoxicity.
    back: High blood glucose levels further impair β-cell function.
    src: { page: 5, quote: "Glucotoxicity: high BG levels further impair" }
    status: unverified
  - id: dm.L01.036
    kind: card
    topic: t2-pathogenesis
    front: Define lipotoxicity.
    back: High circulating free fatty acids impair β-cell function and insulin action.
    src: { page: 5, quote: "Lipotoxicity: high circulating FFAs impair" }
    status: unverified
  - id: dm.L01.037
    kind: order
    topic: t2-pathogenesis
    prompt: When insulin resistance is the primary defect, order the steps to hyperglycemia.
    steps:
      - Insulin resistance in peripheral tissues
      - β cells secrete more insulin to compensate (hyperinsulinemia)
      - β cells can no longer secrete more insulin
      - Insulin secretion falls
      - Hyperglycemia
    src: { page: 5, quote: "the pancreatic beta cells secrete more insulin to compensate for the peripheral defects of insulin action (hyperinsulinemia)." }
    status: unverified
  # ---------- p6-8: hyperglycemia ----------
  - id: dm.L01.038
    kind: card
    topic: hyperglycemia
    front: Define hyperglycemia.
    back: "Blood glucose above normal values: an excessive amount of glucose circulating in the blood plasma."
    src: { page: 6, quote: "Hyperglycemia is elevated blood glucose levels above the normal values, or is a condition in which an excessive amount of glucose circulates" }
    status: unverified
  - id: dm.L01.039
    kind: cloze
    topic: hyperglycemia
    text: "Hyperglycemia becomes symptomatic (polyuria, polydipsia) when glucose exceeds the renal threshold, on average {{c1::180 mg/dl}}."
    src: { page: 6, quote: "When the blood glucose level reaches above the renal threshold of the individual, which is on average 180mg/dl" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L01.040
    kind: card
    topic: hyperglycemia
    front: Commonest cause of symptomatic hyperglycemia?
    back: Diabetes mellitus, especially type 1.
    src: { page: 6, quote: "The commonest cause is DM, especially Type1." }
    status: unverified
  - id: dm.L01.041
    kind: card
    topic: hyperglycemia
    front: How does primary diabetes present as symptomatic hyperglycemia, type 1 vs type 2?
    back: "Type 1: acute, classic and severe. Type 2: a-classic or subacute."
    src: { page: 6, quote: "Acute, classic, and severe presentation: Type1 A classic, or subacute presentation: Type 2" }
    status: unverified
  - id: dm.L01.042
    kind: enumerate
    topic: hyperglycemia
    prompt: Causes of symptomatic hyperglycemia from secondary diabetes?
    points: [Endocrinopathies, Pancreatic diseases, "Drugs (corticosteroids, thiazide diuretics)"]
    pass: 3
    src: { page: 7, quote: "Endocrinopathies. Pancreatic diseases Drugs like corticosteroids and thiazide diuretics." }
    status: unverified
  - id: dm.L01.043
    kind: table
    topic: hyperglycemia
    title: The acute classic presentation and its mechanism
    columns: [Symptom, Mechanism]
    rows:
      - ["Polyuria (>2.5 L/day)", Osmotic diuresis]
      - [Polydipsia, Cellular dehydration]
      - [Polyphagia, Cellular starvation]
      - [Weight loss, Loss of fluids and increased catabolism]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 7, quote: "Polydipsia: due to cellular dehydration. - Polyphagia: due to cellular starvation." }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.044
    kind: cloze
    topic: hyperglycemia
    text: "Polyuria is a urine output above {{c1::2.5 liters/day}}; in diabetes it is due to {{c2::osmotic diuresis}}."
    src: { page: 7, quote: "Polyuria: urine output >2.5 liters/day due to osmotic diuresis." }
    status: unverified
    tags: [numbers]
  - id: dm.L01.045
    kind: card
    topic: hyperglycemia
    front: Why does weight fall in the acute classic presentation?
    back: Loss of fluids and increased catabolism.
    src: { page: 7, quote: "Weight loss: loss of fluids, and increased catabolism." }
    status: unverified
  - id: dm.L01.046
    kind: enumerate
    topic: hyperglycemia
    prompt: Enumerate the features of the subacute presentation (older patient, over several months).
    points: ["Thirst, weight loss and polyuria", Lack of energy, Blurring of vision, Balanitis or pruritus vulvae]
    pass: 3
    src: { page: 7, quote: "Subacute: older, several months - Thirst, weight loss, and polyuria. - Lack of energy. - Blurring of vision." }
    status: unverified
  - id: dm.L01.047
    kind: card
    topic: hyperglycemia
    front: Clinical signs in acute classic type 1 diabetes?
    back: Usually none; in fulminant cases, signs of severe dehydration and acidosis (DKA).
    src: { page: 7, quote: "No clinical signs related. - In fulminant cases: signs of severe dehydration and acidosis (DKA)." }
    status: unverified
  - id: dm.L01.048
    kind: card
    topic: hyperglycemia
    front: Who is commonly asymptomatic among people with hyperglycemia?
    back: A large number of those with type 2 diabetes, IGT and GDM.
    src: { page: 7, quote: "A large number of individuals currently diagnosed as having DM (type 2), IGT, and GDM are asymptomatic." }
    status: unverified
  - id: dm.L01.049
    kind: enumerate
    topic: hyperglycemia
    prompt: Enumerate the causes of asymptomatic hyperglycemia.
    points: ["Primary diabetes, mostly type 2", "Prediabetes (IFG and IGT)", GDM]
    pass: 3
    src: { page: 8, quote: "Causes of Asymptomatic Hyperglycemia 1- Primary Diabetes mellitus: mostly Type 2" }
    status: unverified
  - id: dm.L01.050
    kind: cloze
    topic: hyperglycemia
    text: "Asymptomatic type 2 diabetes is discovered by accident (glycosuria, routine glucose) or presents with chronic complications in {{c1::10–20%}}: {{c2::macrosomic baby}}, peripheral neuropathy, premature atherosclerosis."
    src: { page: 8, quote: "Presented by chronic complications (10-20% of cases): Macrosomic baby, PN. and premature atherosclerosis." }
    status: unverified
    tags: [numbers]
  - id: dm.L01.051
    kind: enumerate
    topic: hyperglycemia
    prompt: Enumerate the signs of asymptomatic type 2 diabetes.
    points:
      - Pruritus vulvae or balanitis
      - Loss of ankle reflexes
      - Loss of peripheral sensation
      - "Hypertension and atherosclerosis (weak dorsalis pedis, carotid bruit)"
      - "Insulin resistance (acanthosis nigricans, PCOS)"
    pass: 4
    src: { page: 8, quote: "Signs of Asymptomatic Hyperglycemia In type 2 DM, this depends on the mode of presentation" }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.052
    kind: card
    topic: hyperglycemia
    front: Two signs of insulin resistance named in the lecture?
    back: Acanthosis nigricans and polycystic ovary syndrome.
    src: { page: 8, quote: "Signs of insulin resistance e.g. Acanthosis Nigricans or Polycystic ovary syndrome." }
    status: unverified
  - id: dm.L01.053
    kind: cloze
    topic: lab
    text: "About {{c1::one third}} of diabetes cases are undiagnosed, and {{c2::10–20%}} of type 2 patients already have serious vascular disease at presentation."
    src: { page: 8, quote: "One third of cases are undiagnosed 10-20% of cases of type 2 diabetes have serious vascular disease at presentation." }
    status: unverified
    tags: [numbers, high-yield]
  # ---------- p8-11: laboratory diagnosis ----------
  - id: dm.L01.054
    kind: card
    topic: lab
    front: How is diabetes diagnosed in the laboratory?
    back: By raised glucose in venous plasma or a raised A1C.
    src: { page: 8, quote: "Diabetes can be diagnosed by demonstrating increased concentrations of glucose in venous plasma or increased A1C in the blood." }
    status: unverified
  - id: dm.L01.055
    kind: card
    topic: lab
    front: Is glycosuria diagnostic of diabetes? What does it require?
    back: No; it is not a diagnostic tool, but it requires urgent blood glucose measurement.
    src: { page: 9, quote: "It requires urgent blood glucose measurements: 3- It is not used as a diagnostic tool for diabetes." }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.056
    kind: cloze
    topic: lab
    text: "The renal threshold for glucose is about {{c1::180 mg/dL}} and shows {{c2::individual variation}}."
    src: { page: 9, quote: "The renal threshold for glucose is approximately 180 mg/dL and exhibits individual variations." }
    status: unverified
    tags: [numbers]
  - id: dm.L01.057
    kind: card
    topic: lab
    front: Two advantages of venous plasma glucose testing?
    back: Inexpensive and widely available.
    src: { page: 9, quote: "These assays are inexpensive 2- Widely available." }
    status: unverified
  - id: dm.L01.058
    kind: enumerate
    topic: lab
    prompt: Enumerate the disadvantages of venous plasma glucose testing.
    points:
      - High diurnal variation and the fasting requirement
      - Difficulty fasting a full 8 h, or misreported fasting
      - Affected by recent physical activity, illness or acute stress
      - Glycolysis gives falsely low values if samples are not processed promptly
    pass: 3
    src: { page: 9, quote: "The high diurnal variation in glucose and fasting requirement." }
    status: unverified
  - id: dm.L01.059
    kind: card
    topic: lab
    front: Why can a glucose sample read falsely low?
    back: Glycolysis continues in the tube if the sample is not processed promptly or stored properly.
    src: { page: 9, quote: "Glucose concentrations will be falsely low if samples are not processed promptly or appropriately stored prior to analysis." }
    status: unverified
  - id: dm.L01.060
    kind: enumerate
    topic: lab
    prompt: The three venous plasma glucose tests used for diagnosis?
    points: [Random plasma glucose, Fasting plasma glucose, 2-h plasma glucose after a 75 g oral glucose load]
    pass: 3
    src: { page: 9, quote: "The following 3 blood tests are used for diagnosis" }
    status: unverified
  - id: dm.L01.061
    kind: cloze
    topic: lab
    text: "Fasting for FPG means no caloric intake for at least {{c1::8}} hours, up to {{c2::12}} hours (overnight)."
    src: { page: 9, quote: "No caloric intake for at least 8 hours up to 12 hours." }
    status: unverified
    tags: [numbers]
  - id: dm.L01.062
    kind: cloze
    topic: lab
    text: "The 2h-PPPG test: plasma glucose 2 hours after {{c1::75 g}} of oral glucose dissolved in {{c2::250 ml}} water."
    src: { page: 10, quote: "blood sample taken 2 hours after a person has consumed a 75 g oral glucose powder dissolved in 250 ml water" }
    status: unverified
    tags: [numbers]
  - id: dm.L01.063
    kind: cloze
    topic: lab
    text: "With classic symptoms, diabetes is diagnosed by one test: random glucose {{c1::≥200}} mg/dl, FPG {{c2::≥126}} mg/dl, or 2h-PPPG {{c3::≥200}} mg/dl."
    src: { page: 10, quote: "Random plasma glucose: > 200 mg/dl. Or 2- Fasting plasma glucose: > 126 mg/dl. Or 3- 2h-PPPG: > 200 mg/dl" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L01.064
    kind: card
    topic: lab
    front: Without unequivocal hyperglycemia, what does the diagnosis of diabetes require?
    back: Two abnormal results, from the same sample or at two time points; either the same test repeated or a different test, done promptly.
    src: { page: 10, quote: "In the absence of unequivocal hyperglycemia, diagnosis requires two abnormal test results obtained at the same time or at two different time points." }
    status: unverified
    tags: [high-yield]
  - id: dm.L01.065
    kind: cloze
