  - id: hb.L06.lesson7
    title: "السكر في الـ cirrhosis والأدوية الجديدة"
    hook: "إمتى نقول insulin بس؟ وليه دوا من عيلة الـ thyroid بقى أول دوا معتمد للـ MASH؟"
    minutes: 10
    pages: [110, 112]
    topics: [cirrhosis-dm, new-drugs]
    goals:
      - "تختار دوا السكر الصح في compensated و decompensated cirrhosis"
      - "تعرف قصة obeticholic acid و resmetirom بالأرقام"
      - "تمشي في الـ ADA treatment algorithm حسب الـ fibrosis stage"
    status: unverified
    steps:
      - kind: explain
        page: 110
        quote: "FIGURE 1: The selection and warning of antidiabetic medications for patients with type 2 diabetes and liver cirrhosis.\nPatients with type 2 diabetes and liver cirrhosis\n| Patients with compensated liver cirrhosis | |\n|---|---|\n| Metformin | Be cautious of cirrhotic decompensation |\n| Sulfonylurea | Initiation from low doses to avoid hypoglycemia |\n| Alpha-glucosidase inhibitor | May be useful but with limited data |\n| Thiazolidinedione | Be cautious of cardiovascular events |\n| Dipeptidyl peptidase-4 inhibitor | Be cautious of cirrhotic decompensation and hepatic failure |\n| Glucagon-like peptide-1 receptor agonist | Limited data |\n| Sodium glucose cotransporters type 2 inhibitor | Limited data |\nPatients with decompensated liver cirrhosis:\n  Basal long-acting insulin with or without rapid-acting insulin analogs\n  Close titration of insulin doses and monitoring of glucose levels"
        title: "T2DM + cirrhosis: افصل الأول compensated ولا لأ"
        text: |
          أول سؤال: الـ cirrhosis ==compensated== ولا ==decompensated==؟ الإجابة بتغيّر الخطة كلها.

          في الـ compensated، كل دوا ينفع بس معاه تحذير:

          - **Metformin**: be cautious of cirrhotic decompensation.
          - **Sulfonylurea**: ابدأ low doses علشان الـ hypoglycemia.
          - **Alpha-glucosidase inhibitor**: may be useful، بس limited data.
          - **Thiazolidinedione**: be cautious of cardiovascular events.
          - **DPP-4 inhibitor**: be cautious of decompensation and hepatic failure.
          - **GLP-1 receptor agonist (GLP-1 RA) و sodium–glucose cotransporter 2 (SGLT2) inhibitor**: limited data.

          في الـ decompensated، الكتاب بيقفل الباب على الأقراص: basal long-acting ==insulin== ± rapid-acting insulin analog، مع close titration و monitoring of glucose.
      - kind: figure
        page: 110
        quote: "FIGURE 1: The selection and warning of antidiabetic medications for patients with type 2 diabetes and liver cirrhosis."
        title: "شكل 1 في الكتاب: دوا السكر في الـ cirrhosis"
        image: { file: hb/L06-cirrhosis-antidiabetic-tree.webp, book: true }
        alt: "Book FIGURE 1 flowchart: patients with type 2 diabetes and liver cirrhosis split into compensated (left) and decompensated (right). Compensated branches to seven drugs, each with a blue warning box: metformin, be cautious of cirrhotic decompensation; sulfonylurea, initiation from low doses to avoid hypoglycemia; alpha-glucosidase inhibitor, may be useful but with limited data; thiazolidinedione, be cautious of cardiovascular events; dipeptidyl peptidase-4 inhibitor, be cautious of cirrhotic decompensation and hepatic failure; GLP-1 receptor agonist and SGLT2 inhibitor share one box, limited data. Decompensated: basal long-acting insulin with or without rapid-acting insulin analogs, then close titration of insulin doses and monitoring of glucose levels."
        caption: |
          الشجرة بتبدأ من **Patients with type 2 diabetes and liver cirrhosis** وبتتقسم اتنين:

          - **الشمال: compensated liver cirrhosis** ← 7 أدوية، وتحت كل واحد صندوق أزرق فيه التحذير:
            - **Metformin**: خلي بالك من الـ decompensation.
            - **Sulfonylurea**: ابدأ بجرعة صغيرة عشان الـ hypoglycemia.
            - **Alpha-glucosidase inhibitor**: ممكن يفيد بس الداتا قليلة.
            - **Thiazolidinedione**: خلي بالك من الـ cardiovascular events.
            - **Dipeptidyl peptidase-4 (DPP-4) inhibitor**: decompensation و hepatic failure.
            - **GLP-1 receptor agonist** و **SGLT2 inhibitor**: الاتنين بيروحوا لصندوق واحد: **Limited data**.
          - **اليمين: decompensated liver cirrhosis** ← دوا واحد بس: **basal long-acting insulin** ± rapid-acting، ومعاه **close titration** ومتابعة السكر.

          يعني في الـ compensated ==كل دوا ينفع بس بتحذير==، وفي الـ decompensated ==insulin بس==.
      - kind: reveal
        page: 110
        quote: "FIGURE 1: The selection and warning of antidiabetic medications for patients with type 2 diabetes and liver cirrhosis.\nPatients with type 2 diabetes and liver cirrhosis\n| Patients with compensated liver cirrhosis | |\n|---|---|\n| Metformin | Be cautious of cirrhotic decompensation |\n| Sulfonylurea | Initiation from low doses to avoid hypoglycemia |\n| Alpha-glucosidase inhibitor | May be useful but with limited data |\n| Thiazolidinedione | Be cautious of cardiovascular events |\n| Dipeptidyl peptidase-4 inhibitor | Be cautious of cirrhotic decompensation and hepatic failure |\n| Glucagon-like peptide-1 receptor agonist | Limited data |\n| Sodium glucose cotransporters type 2 inhibitor | Limited data |\nPatients with decompensated liver cirrhosis:\n  Basal long-acting insulin with or without rapid-acting insulin analogs\n  Close titration of insulin doses and monitoring of glucose levels"
        prompt: "ليه الأقراص بتتشال كلها في الـ decompensated cirrhosis ونفضل على الـ insulin؟"
        answer: |
          الكتاب بيقول «insulin» ويحذّر من كل قرص؛ والمنطق (physiology مقبول):

          - الكبد المتعب مابيكسّرش الأدوية كويس، ومخزون الـ glycogen والـ **gluconeogenesis** عنده ضعاف، فأقراص زي الـ sulfonylurea ممكن تعمل **hypoglycemia** طويلة.
          - الـ metformin مرتبط بالـ decompensation (والكتاب بيحذّر منه حتى في compensated).
          - الـ insulin بقى الوحيد اللي تقدر **تظبطه بالوحدة** وتراقبه، فده معنى **close titration**.
      - kind: check
        page: 110
        quote: "FIGURE 1: The selection and warning of antidiabetic medications for patients with type 2 diabetes and liver cirrhosis.\nPatients with type 2 diabetes and liver cirrhosis\n| Patients with compensated liver cirrhosis | |\n|---|---|\n| Metformin | Be cautious of cirrhotic decompensation |\n| Sulfonylurea | Initiation from low doses to avoid hypoglycemia |\n| Alpha-glucosidase inhibitor | May be useful but with limited data |\n| Thiazolidinedione | Be cautious of cardiovascular events |\n| Dipeptidyl peptidase-4 inhibitor | Be cautious of cirrhotic decompensation and hepatic failure |\n| Glucagon-like peptide-1 receptor agonist | Limited data |\n| Sodium glucose cotransporters type 2 inhibitor | Limited data |\nPatients with decompensated liver cirrhosis:\n  Basal long-acting insulin with or without rapid-acting insulin analogs\n  Close titration of insulin doses and monitoring of glucose levels"
        question: "A 64-year-old man with MASH cirrhosis, ascites and prior hepatic encephalopathy has HbA1c 8.6%. Which treatment fits the lecture?"
        options:
          - "Basal insulin with or without rapid-acting insulin"
          - "Metformin, titrated up to 2 g daily"
          - "Glimepiride once daily with breakfast"
          - "Pioglitazone 30 mg once daily"
        answer: 0
        why:
          - "صح: ascites و HE = **decompensated**، يعني insulin only مع close titration."
          - "الـ metformin محتاج caution حتى في الـ compensated."
          - "الـ sulfonylureas للـ compensated وبجرعة صغيرة."
          - "الـ TZDs مش للـ decompensated (وفي الـ compensated: caution cardiovascular (CV) events)."
      - kind: explain
        page: 110
        quote: "Optocollic Acid (Ocaliva)\nObeticholic acid is a bile acid analogue of chenodeoxycholic acid but 100x more potent\nObeticholic Acid 5mg and 10mg\nFirst-In-Class Selective Potent Farnesoid-X Receptor agonist with an anti-inflammatory and anti-Fibrotic effect\nFDA rejection twice for treatment of MASLD (NASH)"
        title: "Obeticholic acid: القصة اللي ماكملتش"
        text: |
          - **إيه هو؟** **Obeticholic acid** (Ocaliva): bile acid analogue of chenodeoxycholic acid، بس 100× more potent.
          - **بيشتغل إزاي؟** First-in-class selective potent ==farnesoid X receptor (FXR)== (farnesoid-X receptor) agonist، وليه anti-inflammatory و anti-fibrotic effect.
          - **حصل إيه؟** ==US Food and Drug Administration (FDA) rejection twice== كعلاج للـ metabolic dysfunction-associated steatotic liver disease (MASLD) (NASH).

          يعني الآلية كانت مبشرة على الورق، بس ماعدّاش. وده بيمهّد للدوا اللي عدّى في الخطوة الجاية.
      - kind: figure
        page: 110
        quote: "Optocollic Acid (Ocaliva)"
        title: "Obeticholic acid: شريحة الكتاب"
        image: { file: hb/L06-obeticholic-acid.webp, book: true }
        alt: "Book slide: a boxed heading 'Obeticholic acid is a bile acid analogue of chenodeoxycholic acid but 100x more potent'. Below, in red, 'Obeticholic Acid 5mg and 10mg', with photos of two Ocaliva bottles on the left and two Nashiliv boxes on the right. A blue arrow points down to an orange box: 'First-In-Class Selective Potent Farnesoid-X Receptor agonist with an anti-inflammatory and anti-Fibrotic effect'."
        caption: |
          الشريحة من فوق لتحت:

          - **الصندوق فوق**: obeticholic acid هو **bile acid analogue** من الـ **chenodeoxycholic acid**، بس **أقوى 100 مرة**.
          - **في النص**: بالأحمر **5mg و10mg**، وصور العلب: **Ocaliva** (الإزازتين شمال) و**Nashiliv** (العلبتين يمين).
          - **السهم الأزرق لتحت** ← الصندوق البرتقاني: أول دوا من نوعه، ==farnesoid X receptor (FXR) agonist== قوي وانتقائي، وتأثيره anti-inflammatory و==anti-fibrotic==.

          الشريحة بتشرح الفكرة اللي كانت واعدة، والسطر اللي تحتها في الكتاب بيقول النهاية: الـ FDA رفضته مرتين للـ MASH.
      - kind: explain
        page: 110
        quote: "Rezdiffra (Resmetirom) FDA approval for MASLD 14/3/2024 MASLD F2, F3 in conjuction with diet and exercise."
        title: "Resmetirom (Rezdiffra): أول واحد عدّى"
        text: |
          - **Approval**: FDA approval for MASLD في 14/3/2024.
          - **لمين؟** MASLD ==F2 و F3==، in conjunction with diet and exercise. يعني مش بديل عن الـ lifestyle، ده فوقه.
          - **بيشتغل إزاي؟** ==THR-β== (thyroid hormone receptor-beta) agonist. لما الـ receptors دي تتنشط في الكبد، الـ intrahepatic triglyceride accumulation بيقل.
          - **بيتاخد إزاي؟** Oral، once daily.
          - **النتايج**: NASH resolution في 30%، و fibrosis regression بمرحلة على الأقل في 26%.
      - kind: aside
        tone: analogy
        page: 110
        quote: "A thyroid hormone receptor-beta agonist that acticates the receptors. In the liver, The activated receptors leads to reduced intrahepatic triglyceride accumulation."
        text: |
          الـ thyroid hormone هو **ترموستات الحرق** في الجسم. الـ resmetirom بيدوّر الترموستات ده **في الكبد بس** (لأنه بيختار receptor **β** اللي موجود في الكبد)، فالكبد يحرق دهونه من غير ما القلب يتعب ويدق جامد زي ما يحصل مع thyroid hormone عادي.

          (الكتاب بيقول THR-β agonist يقلل الـ TG في الكبد؛ حكاية «القلب» شرح physiology مقبول.)
