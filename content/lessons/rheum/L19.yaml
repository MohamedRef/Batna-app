  - id: rheum.L19.lesson3
    title: "الجلد والمفاصل والصدر"
    hook: "فراشة على الخدود، صوابع زي رقبة البجعة بترجع لمكانها، ونَفَس بيوجع."
    minutes: 9
    pages: [316, 318]
    topics: [skin-msk, cardiopulmonary]
    goals:
      - "تفرّق الـ malar من الـ discoid"
      - "تفهم ليه الـ Jaccoud مش erosive"
      - "تعرف أشيع حاجة في الرئة والقلب"
    status: unverified
    steps:
      - kind: explain
        page: 316
        title: "الجلد"
        quote: "Cutaneous vascular lesions. - Photosensitivity. - Butterfly rash (Malar Rash). - Oral/nasopharyngeal ulcers. - Alopecia."
        text: |
          الـ dermatologic: **cutaneous vascular lesions**، ==photosensitivity==، **butterfly (malar) rash**، **oral/nasopharyngeal ulcers**، **alopecia**.
      - kind: figure
