          لاحظ إن الـ ascites و الـ encephalopathy في القايمة. يعني فيه مرضى بييجوا وهم already عندهم cirrhosis، وده بيرجّعنا لـ Table 3: الـ cirrhosis عند التشخيص معناها prognosis أوحش.
