        quote: "Table 1: Sub classifications of autoimmune Hepatitis based on Auto antibodies\n| Clinical | Type1 | Type2 | Type3 |\n|---|---|---|---|\n| Conventional autoantibodies | Smooth muscle nuclear | Liver/kidney microsome type 1 | None |\n| Novel autoantiboies | pANCA actin Asialoglycoprotein receptor possible | CYP2D6 | Transfer ribonucleoprotein (tRNP) involved in selenocysteine metabolism |\n| Age (years) | Bimodal (10-20 and 45-70) | Pediatric(2-14) | Adults (30-50) |\n| Women (%) | 78 | 89 | 90 |\n| Concurrent immune diseases (%) | 41 | 34 | 58 |\n| Organ-specific antibodies (%) | 4 | 30 | Uncertain |\n| Gamma globulin Elevation | Marked | Mild | Moderate |\n| Low IgA | No | Occasional | No |\n| HLA associations | -B8-DR3,-c4A | -B14,-DR3,-C4A-Q0,-DR7 | Uncertain |\n| Allelic risk factors | DRB1*0301 and *0401 (white North Americans northern Europeans | DRB1*07 (Germans and Brazilians) | Uncertain |\n| Glucocorticoid responsive | +++ | +++ | +++ |"
        title: "Table 1: الـ 3 types (اكشف الخانات الفاضية)"
        columns: ["Feature", "Type 1", "Type 2", "Type 3"]
        rows:
          - ["Conventional antibodies", "ANA, SMA", "anti-LKM1", "None"]
          - ["Novel antibodies", "pANCA, actin, ASGPR", "CYP2D6", "tRNP (selenocysteine)"]
