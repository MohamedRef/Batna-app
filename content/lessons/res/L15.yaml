- id: res.L15.lesson7
  title: 'التشتت: المدى والانحراف المعياري'
  hook: مجموعتين متوسطهم 5 الاتنين، بس واحدة متلمّة والتانية مفروشة. المتوسط لوحده مش كفاية.
  minutes: 9
  pages: [128, 141]
  topics: [dispersion]
  goals:
  - تفهم ليه محتاجين measure of dispersion
  - تحسب الـ range والـ SD والـ variance
  - تعرف إمتى تقسم على n − 1 وإمتى على n
  status: unverified
  steps:
  - kind: figure
    page: 128
    quote: |-
      Measures of Variability
      What is variability?
      The degree of dispersion (spread) of data points in a distribution
      Data set: 3 5 7 (x̄ = 5)
      Data points all fairly "close" together
      Data set: 0 5 10 (x̄ = 5)
      Data points relatively "far" apart
    title: نفس المتوسط، فرشة مختلفة
    svg: |-
      <svg viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 40H300M20 96H300" class="fg-ink"/>
        <g class="t-sm t-mut"><text x="20" y="22">3, 5, 7</text><text x="20" y="78">0, 5, 10</text></g>
        <g class="fg-dot-acc"><circle cx="132" cy="40" r="5"/><circle cx="160" cy="40" r="5"/><circle cx="188" cy="40" r="5"/>
        <circle cx="90" cy="96" r="5"/><circle cx="160" cy="96" r="5"/><circle cx="230" cy="96" r="5"/></g>
        <path d="M160 26V110" class="fg-thin"/>
        <text x="160" y="118" text-anchor="middle" class="t-sm t-acc">x̄ = 5 for both</text>
        <text x="300" y="34" text-anchor="end" class="t-sm t-good">close</text>
        <text x="300" y="90" text-anchor="end" class="t-sm t-bad">far apart</text>
      </svg>
    caption: '3، 5، 7 و 0، 5، 10: الاتنين x̄ = 5، بس التانية مفروشة أكتر.'
    alt: 'Two number lines: 3, 5, 7 close together and 0, 5, 10 far apart, both centred on 5.'
  - kind: explain
    page: 129
    quote: |-
      Measures of Dispersion (variability)
      Range
      Variance
      Standard Deviation
      IQR
      Standard Error
      Confidence Intervals
    title: مقاييس التشتت
    text: |-
      الـ **variability** = درجة ==انتشار== البيانات. مقاييسها في السلايد: **range**، **variance**، ==standard deviation==، **IQR**، **standard error**، **confidence intervals**.
    remind: [res.L15.108]
  - kind: explain
    page: 130
    quote: |-
      The Range
      Conceptual definition: difference between the 2 extreme scores in the distribution
      Calculated: range = X max – X min
      Scores: 4, 8, 10, 16, 26
      Range: 26 – 4 = 22
      | Advantages | Disadvantages |
      |---|---|
      | Easy to calculate | Only uses the 2 extreme scores |
      | Makes conceptual sense | Not resistant to outliers |
    title: Range
    text: |-
      **Range = X max − X min**: 4، 8، 10، 16، 26 ← 26 − 4 = **22**.

      - مزاياه: ==سهل== ومفهوم.
      - عيوبه: بيستخدم ==أكبر وأصغر قيمة بس==، ومش resistant للـ outliers.
  - kind: explain
    page: 131
    quote: |-
      Standard Deviation σ
      The standard deviation abbreviated as S.D and symbolically represented as sigma is the most important and wide used measure of dispersion.
      It is defined as the positive square root of deviation of values from their mean i.e. it is the square root of the means of square deviation of values from their mean. The square of the s.d. is called the variance.
      It is the typical (standard) difference (deviation) of an observation from the mean
      It is the average distance a data point is from the mean.
    title: Standard deviation
    text: |-
      أهم وأشهر مقياس تشتت. هو ==متوسط بُعد النقطة عن الـ mean==: الجذر التربيعي الموجب لمتوسط مربعات الانحرافات.

      ومربعه هو الـ ==variance==.
  - kind: order
    page: 132
    quote: |-
      Standard Deviation (S)
      First step
      is obtaining the deviation of each value from the arithmetic mean.
      Second step
      is to square the deviation from the mean.
      Third step:
      The squared deviations are summed and divided by the number of observations minus one (n-1) to get the variance (S2)
      Fourth step:
      The square root of variance (S2) gives us the standard deviation(S).
    prompt: رتّب خطوات حساب الـ SD
    steps:
    - Deviation of each value from the mean
    - Square each deviation
    - Sum and divide by n − 1 → variance (S²)
    - Square root → SD (S)
    why: انحراف، تربيع، جمع وقسمة (variance)، وبعدين جذر (SD). التربيع عشان السالب والموجب ميلغوش بعض.
  - kind: aside
    page: 133
    quote: 'N.B.: If n is equal to or more than 30 we divide only by n instead of n-1.'
    tone: exam
    text: |-
      الـ sample بنقسم على ==n − 1==، بس لو ==n ≥ 30== بنقسم على **n**. والـ population formula على **N**. والدكتورة قالت إن القانون هيجي مع السؤال في الامتحان: ركّز على الخطوات والتعويض.
  - kind: update
    page: 133
    quote: 'N.B.: If n is equal to or more than 30 we divide only by n instead of n-1.'
    text: 'بالدقة: كتب الإحصاء بتقسم الـ sample SD على ==n − 1== دايمًا. مع n كبير الفرق صغير، فبعض الكورسات بتقبل القسمة على n لما n ≥ 30 كتقريب. في الامتحان اكتب قاعدة السلايد.'
    ref: Altman, Practical Statistics for Medical Research, 1991; Kirkwood and Sterne, Essential Medical Statistics, 2003
  - kind: case
    page: 134
    quote: |-
      Example: Find the standard deviation of the following weight values 5, 7, 4, 8 and 6 Kg.
      Solution:
      1- X̄ = ΣX / n = 30 / 5 = 6 Kg
      2- Deviation of values from X̄
      5 – 6 = - 1
      7 – 6 = + 1
      4 – 6 = - 2
      8 – 6 = + 2
      6 – 6 = 0
      3- Square the deviation and sum
      (-1)² + (+1)² + (-2)² + (+2)² + (0)² = 1+1+4+4= 10
      S = √[ Σ(X – X̄)² / (n – 1) ] = √(10/4) = √2.5 = 1.58 Kg
    stem: Find the standard deviation of the weights 5, 7, 4, 8 and 6 kg.
    steps:
    - question: 'The mean is:'
      options:
      - 6 kg
      - 5 kg
      - 30 kg
      answer: 0
      why: 30 ÷ 5 = 6.
    - question: 'Sum of squared deviations:'
      options:
      - '10'
      - '0'
      - '2.5'
      answer: 0
      why: (−1)² + 1² + (−2)² + 2² + 0² = 10. ومجموع الانحرافات من غير تربيع = 0 دايمًا.
    - question: 'The SD is:'
      options:
      - 1.58 kg
      - 2.5 kg
      - 1.41 kg
      answer: 0
      why: 10 ÷ (5 − 1) = 2.5 (variance)، √2.5 = 1.58. و1.41 لو قسمت غلط على 5.
  - kind: explain
    page: 139
    quote: |-
      S = √[ (ΣfX² – (ΣfX)²/Σf) / (Σf – 1) ] = √[ (76800 – (1860)²/50) / 50 ] = √[ (76800 – 69192) / 50 ]
      = √(7608/50) = √152.15 = 12.3353 years
    title: SD من جدول (grouped)
    text: |-
      هات الـ midpoints، وبعدين **fX** و**fX²** ومجاميعهم، وعوّض:

      S = √[(ΣfX² − (ΣfX)² ÷ Σf) ÷ (Σf − 1)]

      مثال السلايد: (76800 − 1860² ÷ 50) = 7608. ولأن ==n = 50 ≥ 30== السلايد قسم على **50**: 152.15 (بالضبط 152.16) ← ==S = 12.34 years==.
  - kind: check
    page: 141
    quote: |-
      Variance
      standard deviation squared
    question: 'If SD = 3, the variance is:'
    options:
    - '9'
    - '1.73'
    - '6'
    answer: 0
    why:
    - 'صح: الـ variance = مربع الـ SD، يعني 3 × 3.'
    - 1.73 ده √3.
    - 6 ده 2 × 3.
  - kind: try
    items: [res.L15.107, res.L15.109, res.L15.112, res.L15.113]
  recap:
  - 'الـ mean لوحده مش كفاية: لازم measure of dispersion.'
  - 'Range = max − min: سهل بس بيتأثر بالـ outliers.'
  - 'SD: انحراف ← تربيع ← جمع ÷ (n − 1) ← جذر؛ n ≥ 30 قسمة على n.'
  - الـ variance = مربع الـ standard deviation.
  practice: [res.L15.107, res.L15.108, res.L15.109, res.L15.110, res.L15.111, res.L15.112, res.L15.113, res.L15.114, res.L15.115,
    res.L15.116, res.L15.117, res.L15.118]
