  - id: endo.L04.lesson2
    title: "القلب الفاشل والغدة الدرقية"
    hook: "مريض hypothyroid نبضه 55 وضغطه 100/95. ليه الـ diastolic بالذات هو اللي عالي؟ وليه الـ heart failure بتاعته اتبهدلت فجأة؟"
    minutes: 9
    pages: [45, 47]
    topics: [heart-failure, thyroid-heart]
    goals:
      - "تعدّ الهرمونات اللي بتتنشط في الـ heart failure وتعرف مين بيتنبأ بالـ prognosis"
      - "تشرح الـ systolic والـ diastolic dysfunction في الـ hypothyroidism"
      - "تعدّ تلات ميكانيزمات للـ diastolic hypertension وأثر الـ thyroxine"
    status: unverified
    steps:
      - kind: explain
        remind: [endo.L04.018]
        page: 45
        quote: "Plasma noradrenaline levels, which are often taken as an index of \"global sympathetic outflow\" have been shown to predict prognosis. That is, patients with extremely high venous noradrenaline levels have a worse prognosis as a group than do those with normal levels."
        title: "الهرمونات في الـ heart failure"
        text: |
          لما القلب يفشل، الجسم بيحس إن الدم اللي واصل قليل، فبيشغّل أربع أنظمة عشان يرفع الضغط ويحفظ الملح والمية:
          1. ==renin–angiotensin system (RAS) activation==: الكتاب بيقول إن الـ renin عالي بشكل غير طبيعي في الـ **renal venous blood**. التفسير المقبول (مش في الكتاب): الكلية بتشوف perfusion قليل فبتفرز renin.
          2. **Aldosterone**: بيمسك الصوديوم والمية، فالحجم يزيد.
          3. ==Sympathetic==: النشاط بتاعه زايد في الـ cardiac failure من زمان. والـ venous **noradrenaline** بيتاخد كمقياس للـ «global sympathetic outflow»، وكل ما يعلى، الـ **prognosis أوحش** كمجموعة.
          4. **Neuropeptide Y**: vasoconstrictor قوي في الـ **coronary circulation**، ومستواه في البلازما ماشي مع مستوى الـ noradrenaline.

          يعني كلهم بيعوّضوا على المدى القصير، بس على المدى الطويل بيحمّلوا القلب الضعيف شغل أكتر.
      - kind: mnemonic
        page: 45
        quote: "Hormones in Heart Failure\n  1- Activation of the renin-angiotensin system: Abnormally high renin levels in renal venous blood in patients with heart failure.\n  2- Aldosterone.\n  3- Sympathetic system."
        word: "RASN"
        parts:
          - { key: "R", text: "Renin–angiotensin system" }
          - { key: "A", text: "Aldosterone" }
          - { key: "S", text: "Sympathetic (noradrenaline = prognosis)" }
          - { key: "N", text: "Neuropeptide Y" }
        hook: "الـ heart failure بيـ «RASN» الجسم كله: أربع هرمونات بالترتيب بتاع الكتاب."
      - kind: reveal
        page: 45
        quote: "That is, patients with extremely high venous noradrenaline levels have a worse prognosis as a group than do those with normal levels."
        prompt: "ليه الـ noradrenaline العالي معناه prognosis أوحش؟"
        answer: "الكتاب بيدّي الملاحظة بس: الـ noradrenaline = مقياس للـ global sympathetic outflow، واللي عنده عالي جدًا الـ prognosis بتاعه أوحش. التفسير المقبول (مش في الكتاب): الـ sympathetic بيسرّع القلب ويضيّق الأوعية، فالقلب الضعيف بيضخ ضد مقاومة أعلى ويستهلك أكسجين أكتر، وده بيفسّر برضه ليه الـ neuropeptide Y اللي ماشي معاه بيضيّق الـ coronaries نفسها."
      - kind: explain
        page: 45
        quote: "For people with almost any type of heart disease, disorders of the thyroid gland can worsen old cardiac symptoms or cause new ones, and can accelerate the underlying heart problem."
        title: "الغدة بتلعب في القلب"
        text: |
          لأي حد عنده heart disease تقريبًا من أي نوع، أمراض الـ thyroid ممكن تعمل تلات حاجات:
          - **تزوّد الأعراض القديمة**.
          - **تعمل أعراض جديدة**.
          - **تسرّع** المرض نفسه.

          ليه؟ لأن الـ thyroid hormone هو اللي بيظبط سرعة القلب وقوة انقباضه وارتخائه (زي ما هنشوف في الصفحة الجاية)، فأي زيادة أو نقص بيلخبط قلب هو أصلًا مش مستحمل.
      - kind: explain
        page: 46
        quote: "In hypothyroidism the heart muscle is weakened in both its contraction phase, and also its relaxation phase. This means that the heart cannot pump as vigorously as it should, and the amount of blood it ejects with each heart beat is reduced systolic dysfunction. In addition, because the heart muscle does not relax normally in between heart beats, a potentially serious condition called diastolic dysfunction may result."
        title: "عضلة كسلانة في الاتجاهين"
        text: |
          في الـ ==hypothyroidism== عضلة القلب ضعيفة في:
          - الـ **contraction**: مش بتضخ بالقوة اللي المفروض، فالدم اللي بيطلع مع كل نبضة بيقل = ==systolic dysfunction==.
          - الـ **relaxation**: مش بترتاح طبيعي بين النبضات، فمش بتتملي كويس = ==diastolic dysfunction==، والكتاب بيوصفها إنها «potentially serious».

          والنبض بيقل **10-20 beat/min** عن الطبيعي، لأن الـ heart rate نفسه بيتظبط بالـ thyroid hormone، وده بيبان أكتر في اللي عندهم heart disease. بس رغم الـ bradycardia، الـ **premature ventricular contractions (PVCs)** وحتى **atrial fibrillation (AF)** ممكن يزيدوا.
      - kind: check
        page: 46
        quote: "However, hypothyroidism may worsen the tendency for premature beats (such as pvcs) and even tachycardias such as atrial fibrillation. (Hypothyroidism and the heart)."
        question: "Which arrhythmia can hypothyroidism make worse, despite bradycardia?"
        options: ["Atrial fibrillation", "Complete heart block only", "WPW", "None"]
        answer: 0
        why:
          - "صح: الكتاب بيقول premature beats (PVCs) وحتى AF."
          - "مش مذكور."
          - "مش مذكور."
          - "الكتاب بيقول بيزوّد الـ PVCs والـ AF."
      - kind: figure
        page: 46
        quote: "1- Because the arteries are stiffer in hypothyroidism, (dt reduction of the amount of nitric oxide in the lining of the blood vessels, causing them to be stiff this leads to increase in the diastolic blood pressure (Hypothyroidism & CVS)."
        title: "ليه الـ diastolic بيعلى؟"
        alt: "Three boxes feeding into diastolic hypertension. One: less nitric oxide in the vessel lining makes arteries stiff. Two: more sympathetic activity, fewer beta receptors so alpha responses dominate. Three: SIAD expands extracellular volume and raises systemic vascular resistance. Below: thyroxine brings diastolic pressure to 90 or less in 32 percent."
        caption: "تلات أسباب، والعلاج بالـ thyroxine بيظبط الـ diastolic في 32%."
