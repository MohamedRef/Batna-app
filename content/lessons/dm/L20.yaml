  - id: dm.L20.lesson2
    title: "ليه الـ HDL واطي؟ وإزاي نعلّيه من غير دوا"
    hook: "لوز برتقاني، طحال كبير، وتنميل في الرجلين. ده مش كرتون، ده Tangier disease. وبعدين: سيجارة، كرش، وbeta-blocker."
    minutes: 8
    pages: [254, 256]
    topics: [primary, secondary, lifestyle]
    goals:
      - "تعرف الـ 4 primary causes وعيب كل واحد"
      - "تعد الـ secondary causes"
      - "تحفظ أرقام الـ lifestyle: 3 kg، 7-20%، 30-60 يوم"
    status: unverified
    steps:
      - kind: explain
        page: 254
        title: "Tangier disease"
        quote: "Tangier Disease\n  1. Autosomal dominant disorder.\n  2. ABC A1 Transporter gene defect.\n  3. Decreased cholesterol efflux.\n  1. Marked reduction in HDL-C.\n  2. Cholesterol accumulation: Enlarged orange tonsils, hepatosplenomegaly, Peripheral neuropathy.\n  3. Premature atherosclerotic vascular disease.\n  4. Cause of Death: Premature CAD."
        text: |
          - ==ATP-binding cassette transporter A1 (ABCA1)== transporter gene defect، فالـ **cholesterol efflux** بيقل.
          - الكتاب بيقول **autosomal dominant**.
          - **High-density lipoprotein cholesterol (HDL-C) واطي جدًا**.
          - الكوليسترول بيتراكم: **لوز برتقاني كبير**، **hepatosplenomegaly**، **peripheral neuropathy**.
          - **Premature atherosclerosis**، وسبب الوفاة **premature coronary artery disease (CAD)**.
      - kind: update
        page: 254
        quote: "Tangier Disease\n  1. Autosomal dominant disorder.\n  2. ABC A1 Transporter gene defect.\n  3. Decreased cholesterol efflux.\n  1. Marked reduction in HDL-C.\n  2. Cholesterol accumulation: Enlarged orange tonsils, hepatosplenomegaly, Peripheral neuropathy.\n  3. Premature atherosclerotic vascular disease.\n  4. Cause of Death: Premature CAD."
        text: "مراجع الوراثة (OMIM) بتوصف Tangier disease إنه **autosomal recessive** (الـ allele الاتنين)، والـ heterozygote عنده high-density lipoprotein (HDL) نص الطبيعي. في الامتحان اكتب إجابة الكتاب: autosomal dominant."
        ref: "OMIM #205400, Tangier disease"
      - kind: aside
        tone: joke
        page: 254
        quote: "Tangier Disease\n  1. Autosomal dominant disorder.\n  2. ABC A1 Transporter gene defect.\n  3. Decreased cholesterol efflux.\n  1. Marked reduction in HDL-C.\n  2. Cholesterol accumulation: Enlarged orange tonsils, hepatosplenomegaly, Peripheral neuropathy.\n  3. Premature atherosclerotic vascular disease.\n  4. Cause of Death: Premature CAD."
        text: "الـ ABCA1 هو **باب الخروج** من الخلية. في Tangier الباب مقفول، فالـ **cholesterol accumulation** بيبدأ: الكوليسترول بيقعد جوّه **يعمل حفلة**: اللوز يبقى برتقاني، والطحال والكبد يتنفخوا. حتى الكوليسترول عايز يخرج ومش لاقي باب."
      - kind: table
        page: 254
        quote: "Familial Hypoalphalipoproteinemia:\n  1. Due to Apo AI Gene defect.\n  2. Autosomal dominant.\n  3. Premature CAD and Strokes."
        title: "الـ primary causes"
        columns: [Disorder, Defect, Result]
        rows:
          - ["Tangier", "ABCA1", "Orange tonsils, HSM, neuropathy, CAD"]
          - ["Familial hypoalpha", "ApoA-I (AD)", "Premature CAD, strokes"]
          - ["CETP ↑ activity", "CETP polymorphism", "Premature CAD"]
          - ["LCAT ↓ activity", "LCAT mutation", "Premature CAD"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: check
        page: 254
        quote: "Familial Hypoalphalipoproteinemia:\n  1. Due to Apo AI Gene defect.\n  2. Autosomal dominant.\n  3. Premature CAD and Strokes."
        question: "Familial hypoalphalipoproteinemia is due to a defect in:"
        options:
          - "ApoA-I gene"
          - "ABCA1 gene"
          - "LCAT gene"
          - "CETP gene"
        answer: 0
        why:
          - "صح: ApoA-I، autosomal dominant، premature CAD و strokes."
          - "ده Tangier."
          - "ده decreased LCAT activity."
          - "ده increased CETP activity (polymorphism)."
      - kind: explain
        remind: [dm.L20.024]
        page: 255
        title: "Secondary causes"
        quote: "Secondary Causes of Low HDL-C\n  1. Smoking\n  2. Obesity (visceral fat)\n  3. Very-low-fat diet\n  4. Drugs\n    1. Beta-blockers"
        text: |
          1. **Smoking**
          2. **Obesity** (==visceral fat==)
          3. **Very-low-fat diet**
          4. أدوية: **beta-blockers** و ==androgenic steroids==
      - kind: sort
        page: 255
        quote: "Secondary Causes of Low HDL-C\n  1. Smoking\n  2. Obesity (visceral fat)\n  3. Very-low-fat diet\n  4. Drugs\n    1. Beta-blockers"
        prompt: "يوطّي الـ HDL ولا يعلّيه؟"
        bins: ["Lowers HDL-C", "Raises HDL-C"]
        cards:
          - { text: "Smoking", bin: 0 }
          - { text: "Beta-blocker", bin: 0 }
          - { text: "Anabolic steroids", bin: 0 }
          - { text: "Very-low-fat diet", bin: 0 }
          - { text: "Running, dose-dependent", bin: 1 }
          - { text: "Losing 3 kg", bin: 1 }
          - { text: "Niacin", bin: 1 }
        why: "التدخين والكرش والـ beta-blockers والـ androgens والـ very-low-fat diet بيوطّوه. الرياضة والوزن والـ niacin بيعلّوه."
      - kind: explain
        page: 255
        title: "أرقام الـ lifestyle"
        quote: "For every 3 kg of weight loss, HDL-C levels increase 1 mg/dl."
        text: |
          - **الوزن**: كل ==3 kg== تنزلهم ← HDL-C يعلى **1 mg/dL**.
          - **التدخين**: الـ HDL-C عند المدخنين أقل بـ **7-20%**، ويرجع طبيعي خلال **30-60 يوم** من الإيقاف.
          - **الرياضة**: الـ HDL بيعلى بس مع رياضة ==intense و frequent==. الـ aerobic (زي الجري) بتعلّيه **dose-dependent**.
      - kind: aside
        tone: exam
        page: 256
        quote: "HDL-C levels return to normal within 30–60 days after smoking cessation."
        text: "رقمين بيتلخبطوا: **3 kg ← 1 mg/dL** (وزن)، و **30-60 يوم** (تدخين). فكّر: 3 كيلو = 1، وشهر لشهرين ويرجع."
      - kind: check
        page: 255
        quote: "For every 3 kg of weight loss, HDL-C levels increase 1 mg/dl."
        question: "A patient loses 12 kg. Expected HDL-C rise from weight loss alone?"
        options:
          - "4 mg/dL"
          - "12 mg/dL"
          - "1 mg/dL"
          - "36 mg/dL"
        answer: 0
        why:
          - "صح: 12 ÷ 3 = 4 mg/dL."
          - "ده 1 لكل كيلو؛ غلط."
          - "ده لـ 3 kg بس."
          - "ده ضرب مش قسمة."
      - kind: try
        items: [dm.L20.013, dm.L20.016, dm.L20.024, dm.L20.029, dm.L20.030]
    recap:
      - "Tangier: ABCA1، AD في الكتاب، لوز برتقاني و HSM و neuropathy، والوفاة premature CAD."
      - "Familial hypoalphalipoproteinemia: ApoA-I، AD، CAD و strokes."
      - "CETP ↑ (polymorphism) و LCAT ↓ (mutation): premature CAD."
      - "Secondary: تدخين، visceral obesity، very-low-fat diet، beta-blockers، androgens."
      - "3 kg ← 1 mg/dL؛ المدخن أقل 7-20% ويرجع في 30-60 يوم؛ رياضة intense و frequent."
    practice: [dm.L20.013, dm.L20.014, dm.L20.015, dm.L20.016, dm.L20.017, dm.L20.018, dm.L20.019, dm.L20.020, dm.L20.021, dm.L20.022, dm.L20.023, dm.L20.024, dm.L20.025, dm.L20.026, dm.L20.027, dm.L20.028, dm.L20.029, dm.L20.030, dm.L20.031, dm.L20.032, dm.L20.055, dm.L20.056, dm.L20.058, dm.L20.059]
