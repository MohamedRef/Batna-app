        quote: "Glucocorticoids should be used at the minimum dose and length of time necessary to control active systemic disease."
        prompt: "ليه الـ EULAR مصرّة على أقل جرعة وأقصر مدة glucocorticoids (minimum dose)، وتبعتها بـ immunosuppressant كـ GC-sparing؟"
        answer: |
          التفسير المقبول (مش في الكتاب): Sjögren مرض **مزمن** لسنين، والـ steroids الطويلة بتعمل osteoporosis وسكر وضغط وعدوى (زي ما شفنا في الـ RA). فبتطفّي بيها النار في الـ organ اللي بيتأذي، وبعدين الـ **immunosuppressant** يشيل الشغل علشان تقلّل الجرعة (الكتاب: ==GC-sparing==).

          والكتاب بيقول **مفيش دليل** إن immunosuppressant أحسن من التاني، فالاختيار على حسب العيان. والـ **B-cell targeted** للـ severe refractory بس: منطقي، لأن المرض أصلًا B cells متحفّزة (BAFF).
