  - id: geri.L09.lesson1
    title: "المناعة لما تكبر: immunosenescence"
    hook: "جدّك بيقاوم البرد اللي عاشره 70 سنة، بس أول فيروس جديد بيوقّعه. ليه؟"
    minutes: 9
    pages: [155, 156]
    topics: [overview, replicative]
    goals:
      - "تعرف إيه اللي بيتغير في الـ thymus والـ T والـ B cells مع السن، وليه"
      - "تفهم الـ replicative senescence وليه القديم سليم والجديد صعب"
      - "تعرف الـ immune risk phenotype وبيوصل لإيه"
    status: unverified
    steps:
      - kind: explain
        page: 155
        title: "الفكرة كلها في سطر"
        quote: "This situation implies increased susceptibility to infections and cancer due to decreased capacity in the immune system to respond to antigenic stimulation."
        text: |
          مع السن الـ ==immune function بتقل==، فالجهاز المناعي ما بيعرفش يرد كويس على الـ antigenic stimulation.

          النتيجة: **infections** أكتر و **cancer** أكتر.

          ليه الاتنين مع بعض، infection و cancer؟ التفسير المقبول (مش في الكتاب): نفس الجهاز اللي بيمسك الميكروب الغريب هو اللي بيمسك الخلية بتاعتك لما تبوظ. يعني لما الـ response للـ antigen يضعف، الاتنين بيعدّوا: الميكروب من برّه، والخلية السرطانية من جوّه.
      - kind: table
        page: 155
        quote: "Aging is associated with a decline in immune function."
        title: "صورة الكتاب: الـ immune function، إيه اللي بيطلع وإيه اللي بينزل؟"
        columns: [Part, Changes with age]
        rows:
          - ["Thymus", "↓ output، ↑ fat، ↓ IL-7"]
          - ["T cells", "↓ naive، ↑ memory، ↓ CD4، ↑ CD8"]
          - ["B cells", "↓ IgM و IgD، ↑ IgG و IgA"]
          - ["Inflamm-aging", "↑ IL-6 و CRP"]
        hide: [[1, 1], [2, 1]]
      - kind: explain
        page: 155
        quote: "Figure: Thymic involution: ↓ Thymic output; ↑ Adiposity in thymus; ↓ Thymic epithelial cells; ↓ IL-7 production. T lymphocytes: ↓ Naive T cell pool; ↑ Memory T cell; ↓ TCR diversity; ↑ CD8 ↓ CD4. B lymphocytes: ↓ Naive B cell pool; ↑ Memory B cell; ↓ IgM, IgD serum levels; ↑ IgG, IgA serum levels. Overall changes: ↓ Telomerase activity; ↑ Tumor incidence; ↑ Infection susceptibility; ↑ Autoimmune/inflammatory reactions; ↓ Immune response to vaccination. Inflamm-aging: ↑ Inflammatory mediators; ↑ IL-6, C reactive protein; ↑ Tissue dysfuction"
        title: "الـ thymus: منين بتبدأ الحكاية"
        text: |
          صورة الكتاب في الصفحة دي بتبدأ من الـ **thymic involution** (الـ thymus بيضمر):
          - الـ thymic output بيقل
          - الـ ==adiposity بتزيد== جوّه الـ thymus
          - الـ thymic epithelial cells بتقل
          - والـ IL-7 production بيقل

          والنتيجة على الـ T lymphocytes: الـ **naive pool بيقل**، والـ memory بتزيد، والـ ==TCR diversity بتقل==، والـ CD8 بيزيد والـ CD4 بيقل.

          ليه ده مهم؟ التفسير المقبول (مش في الكتاب): الـ thymus هو «المدرسة» اللي الـ T cell الجديدة بتتخرج منها. لما المدرسة تتملي دهون والمدرسين (الـ epithelial cells) يقلوا، الخريجين الجداد يقلوا. وكل T cell جديدة معاها «مفتاح» مختلف (الـ receptor)، فلما الجداد يقلوا، عدد المفاتيح يقل، يعني فيه «أقفال» (antigens) جديدة مش هتلاقي مفتاحها.

          وفي آخر الصورة الكتاب بيجمع الـ **overall changes**: الـ telomerase activity بتقل، والـ tumour incidence بتزيد، والـ infection susceptibility بتزيد، والـ autoimmune/inflammatory reactions بتزيد، والـ ==immune response to vaccination بيقل==.
      - kind: aside
        tone: exam
        page: 155
        quote: "Aging is associated with a decline in immune function."
        text: "ركّز على الـ antibodies: الـ **immunoglobulin M (IgM) و immunoglobulin D (IgD) بيقلوا**، والـ **immunoglobulin G (IgG) و immunoglobulin A (IgA) بيزيدوا**. والـ immune function عمومًا بتقل، مش كل حاجة بتقل."
      - kind: check
        page: 155
        quote: "Figure: Thymic involution: ↓ Thymic output; ↑ Adiposity in thymus; ↓ Thymic epithelial cells; ↓ IL-7 production. T lymphocytes: ↓ Naive T cell pool; ↑ Memory T cell; ↓ TCR diversity; ↑ CD8 ↓ CD4. B lymphocytes: ↓ Naive B cell pool; ↑ Memory B cell; ↓ IgM, IgD serum levels; ↑ IgG, IgA serum levels. Overall changes: ↓ Telomerase activity; ↑ Tumor incidence; ↑ Infection susceptibility; ↑ Autoimmune/inflammatory reactions; ↓ Immune response to vaccination. Inflamm-aging: ↑ Inflammatory mediators; ↑ IL-6, C reactive protein; ↑ Tissue dysfuction"
        question: "Which thymic change comes with age, per the book figure?"
        options:
          - "More fat (adiposity) in the thymus"
          - "More IL-7 production"
          - "More thymic epithelial cells"
          - "Larger naive T-cell output"
        answer: 0
        why:
          - "صح: الـ thymus بيضمر و ==الدهون فيه بتزيد==."
          - "الـ IL-7 production **بيقل** مش بيزيد."
          - "الـ thymic epithelial cells **بتقل**."
          - "الـ thymic output بيقل، فالـ naive T cells بتقل."
      - kind: figure
        page: 156
        quote: "The decrease in naive cells and the increase in memory cells, make the immune system with an intact capacity to defend against previously recognized pathogen& decrease ability to respond to novel antigen."
        title: "الخزنة اتملت بالـ memory"
        alt: "Two bars of T cells. In youth most are naive cells ready for new antigens. In old age most are memory cells, so old pathogens are handled but new antigens meet few naive cells."
        caption: "الـ ==naive== بيقلوا والـ **memory** بيزيدوا: الحماية من القديم سليمة، والرد على الجديد ضعيف."
        svg: |
