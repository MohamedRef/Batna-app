      - kind: check
        page: 298
        quote: "High flux filters have membranes with much higher hydraulic permeability."
        question: "A patient on long-term haemodialysis has joint pain from beta-2 microglobulin build-up. Which filter clears it better, and how?"
        options:
          - "High flux filter, by convection"
          - "Low flux filter, by diffusion"
          - "Low flux filter, by adsorption only"
          - "Neither; only transplant removes it"
        answer: 0
        why:
          - "صح: الـ ==high flux== ليه UF coefficient 20–50 و cut-off حوالي 20 kD، فبيعدّي الـ middle molecules (11,800 D) بالـ convection."
          - "الـ diffusion بيشتغل مع الـ small solutes، والـ low flux نفاذيته قليلة (2–10)."
          - "الـ adsorption للـ hydrophobic compounds."
          - "الفلتر الصح بيشيله؛ الكتاب بيحط الـ β2-microglobulin كـ middle molecule."
      - kind: explain
        page: 299
        title: "الـ HD بيشتغل بإيه أساسًا؟"
        quote: "Hemodialysis: The main mechanism of solute removal in hemodialysis is diffusion, which is chiefly effective in the removal of small solutes. Hemodialysis involves the use of a hemodialyzer, where blood and dialysate solution circulate counter-current or co-current. A counter-current configuration is preferred because the average concentration gradient is kept higher along the whole length of the dialyzer."
        text: |
          الـ haemodialysis (HD) أساسه ==diffusion==، وده قوي مع الـ **small solutes**. والـ **counter-current** أحسن من الـ co-current لأنه بيخلي الـ gradient عالي على طول الفلتر. الـ **high-flux filters** بتضيف convection مهم.

          ليه الـ counter-current أحسن؟ التفسير المقبول (مش في الكتاب): لو الدم والمحلول ماشيين في نفس الاتجاه، المحلول بيتملي urea في أول الفلتر، والفرق بينه وبين الدم يقل لحد ما يقف في النص. لو عكس بعض، الدم «النضيف» في آخر الفلتر بيقابل محلول **جديد خالص**، فلسه فيه فرق يسحب. يعني كل سنتي في الفلتر شغال. وده نفس مبدأ الـ countercurrent في الـ loop of Henle.

          وإزاي تزوّد الـ clearance في الـ HD؟ التفسير المقبول (مش في الكتاب): من الفكرة نفسها: زوّد الـ **blood flow** (دم أكتر يقابل الغشا)، زوّد الـ **dialysate flow** (المحلول يفضل نضيف)، كبّر **مساحة الفلتر**، أو طوّل **وقت الجلسة**. ولو عايز middle molecules: high flux أو HDF. عشان كده الـ fistula الكويسة (flow عالي) هي أساس الغسيل الكافي.
