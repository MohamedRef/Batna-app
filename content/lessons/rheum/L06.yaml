  - id: rheum.L06.lesson5
    title: "الـ thymus والـ costimulation والـ CTL"
    hook: "الـ T cell بتعدّي امتحان في الـ thymus، وبعدين محتاجة مفتاحين عشان تشتغل، وفرامل بتطلع لوحدها."
    minutes: 9
    pages: [99, 101]
    topics: [t-cells, ctl]
    goals:
      - "تشرح اختيار الـ CD4 والـ CD8 في الـ thymus"
      - "تشرح الـ B7–CD28 والـ CTLA-4 وليه الفرامل مهمة"
      - "تعرف إزاي الـ CTL بيقتل الخلية المصابة بالـ virus"
    status: unverified
    steps:
      - kind: explain
        page: 99
        title: "الـ thymus بيختار"
        quote: "Thymus: Precursor (from bone marrow)\n  No β chain gene rearrangement → Death\n  β chain gene rearranged; other β chain rearrangement blocked → αβ TCR expression → Double positive (CD4+, CD8+) cell undergoes selection by MHC class I and II molecules:\n    No affinity of TCR for MHC → Death\n    High affinity of TCR for MHC → Death\n    Moderate affinity for MHC class I → CD8 T cell\n    Moderate affinity for MHC class II → CD4 T cell"
        text: |
          الـ T cell بتيجي من الـ bone marrow للـ thymus، وتبقى **double positive (CD4+CD8+)**، وبعدين تتختبر على الـ major histocompatibility complex (MHC):
          - **No affinity** ← تموت، لأنها مش هتعرف تشوف حاجة.
          - **High affinity** ← تموت، لأنها خطر autoimmunity.
          - ==Moderate affinity== لـ **class I** ← **CD8**، ولـ **class II** ← **CD4**.

          وعلى السطح: الـ **CD4** بيمسك في الـ class II، والـ **CD8** في الـ class I، والاتنين بيبعتوا إشارة عن طريق **p56lck**.
      - kind: reveal
        page: 99
        quote: "Thymus: Precursor (from bone marrow)\n  No β chain gene rearrangement → Death\n  β chain gene rearranged; other β chain rearrangement blocked → αβ TCR expression → Double positive (CD4+, CD8+) cell undergoes selection by MHC class I and II molecules:\n    No affinity of TCR for MHC → Death\n    High affinity of TCR for MHC → Death\n    Moderate affinity for MHC class I → CD8 T cell\n    Moderate affinity for MHC class II → CD4 T cell"
        prompt: "ليه الـ thymus بيموّت الـ T cell اللي الـ TCR بتاعها ما بيمسكش الـ MHC خالص، مع إنها مش خطر على حد؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ T cell **ما بتشوفش الـ antigen لوحده**، بتشوفه بس وهو معروض على **MHC** (ده الـ mechanism التاني للـ HLA disease في ص 91).

          فلو مش بتمسك الـ MHC خالص، عمرها ما هتشوف أي عدو، يعني **ملهاش لازمة**، والجسم مش هيصرف عليها. واللي **بتمسك جامد أوي** بتموت عشان دي اللي هتهاجم الجسم نفسه. اللي بتعيش هي **الوسط** بس.
      - kind: figure
        page: 100
