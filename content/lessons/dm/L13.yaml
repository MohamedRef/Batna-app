schema: batna.lesson/v1
lecture: dm.L13
lessons:
  # ------------------------------------------------------------------
  - id: dm.L13.lesson1
    title: "سكر قبل الحمل ولا سكر الحمل؟"
    hook: "تلات ستات، تلات أنواع سكر، وكل واحدة ليها قاعدة تشخيص مختلفة. تعرف تفرّق؟"
    minutes: 9
    pages: [161, 165]
    topics: [burden, diagnosis]
    goals:
      - "تفرّق بين pre-existing DM و overt T2DM و GDM"
      - "تحفظ أرقام الـ one-step والـ two-step"
      - "تفهم ليه الـ HAPO غيّر الـ criteria"
    status: unverified
    steps:
      - kind: explain
        page: 161
        quote: "16% of total pregnancies globally were affected by some form of hyperglycemia"
        title: "واحدة من كل ست حوامل"
        text: |
          حوالي ==16%== من الحمل في العالم فيه نوع من الـ **hyperglycemia**، و **21.4 million** مولود معرّضين للسكر جوه الرحم.

          والـ ==GDM== لوحده حوالي **84%** من دول. ومع وباء السمنة، بقى فيه ستات كتير داخلين الحمل بـ **T2DM** محدش شخّصه.
      - kind: explain
        page: 161
        quote: "it is reasonable to test women with risk factors for T2DM at their initial prenatal visit, using standard diagnostic criteria."
        title: "عشان كده: افحص بدري"
        text: |
          الست اللي عندها **risk factors** لـ T2DM تتفحص في ==أول زيارة== حمل، بالـ **standard diagnostic criteria** (نفس أرقام غير الحامل).

          ليه؟ لأن لو عندها سكر من قبل الحمل ومستني لحد الأسبوع 24، تكون فاتتك فترة تكوين الأعضاء كلها.
      - kind: table
        page: 162
        quote: "Mrs. Fatima (The Majority, Gestational Diabetes (GDM))"
        title: "التلات ستات اللي الكتاب بيحكي عنهم"
        columns: ["الست", "النوع"]
        rows:
          - ["Halima, 23", "Type 1 DM من 15 سنة، حامل من شهر"]
          - ["Karima, 37", "Undiagnosed T2DM: FPG ≥126 و 2-h ≥200 في الـ 1st trimester"]
          - ["Fatima, 28", "GDM: اتشخصت في الـ 2nd trimester (الأغلبية)"]
        hide: [[1, 1], [2, 1]]
      - kind: mnemonic
        page: 162
        quote: "FPG ≥ 126 mg/dL (Fasting is defined as no caloric intake for at least 8 h)"
        word: "FOAR"
        hook: "أربع أبواب لتشخيص الـ DM، أي باب واحد كفاية:"
        parts:
          - { key: "F", text: "Fasting PG ≥126 mg/dL (صيام 8 ساعات على الأقل)" }
          - { key: "O", text: "OGTT 75 g: 2-h PG ≥200 mg/dL" }
          - { key: "A", text: "A1C ≥6.5% (معمل NGSP، standardized to DCCT)" }
          - { key: "R", text: "Random PG ≥200 mg/dL مع أعراض أو hyperglycemic crisis" }
      - kind: explain
        page: 163
        quote: "Any degree of glucose intolerance that was first recognized during pregnancy (2nd or 3rd trimester of pregnancy"
        title: "تعريف الـ GDM"
        text: |
          الـ ==GDM== = أي درجة **glucose intolerance** اتعرفت لأول مرة في الـ **2nd أو 3rd trimester**، ومش pre-existing type 1 أو type 2.

          ووقت الفحص للي مش معروف عندها سكر: ==24-28 weeks==.
      - kind: check
        page: 161
        quote: "it is reasonable to test women with risk factors for T2DM at their initial prenatal visit, using standard diagnostic criteria."
        question: "A 36-year-old at 7 weeks, BMI 32: FPG 132, random glucose 216 mg/dL with polyuria. Diagnosis today?"
        options:
          - "Pre-existing type 2 DM"
          - "Gestational DM"
          - "Impaired fasting glucose of pregnancy"
          - "Wait for a 75 g OGTT at 24-28 weeks"
        answer: 0
        why:
          - "صح: أرقام الـ standard criteria في أول زيارة = سكر كان موجود قبل الحمل (overt)."
          - "الـ GDM بيتعرف في الـ 2nd/3rd trimester ومش pre-existing. ده سؤال الكتاب نفسه."
          - "الأرقام دي diabetes كاملة، مش منطقة وسط."
          - "هي already عندها criteria، الاستنى هيأخر العلاج."
      - kind: explain
        page: 163
        quote: "For most complications, there was no threshold for risk."
        title: "الـ HAPO: مفيش رقم أمان"
        text: |
          دراسة **HAPO** على أكتر من **23,000** حامل لقت إن الخطر على الأم والجنين ==بيزيد باستمرار== مع سكر الأم عند 24-28 أسبوع، حتى جوه الأرقام اللي كانت بتتقال normal.

          ولمعظم المضاعفات: **no threshold**. عشان كده الـ criteria اتراجعت ونزلت.
      - kind: aside
        tone: analogy
        page: 163
        quote: "Risk of adverse maternal, fetal & neonatal outcomes continuously increased as a function of maternal glycemia"
        text: |
          الـ HAPO زي سرعة العربية: مفيش سرعة "آمنة تمامًا" وبعدها فجأة حادثة. كل ما تزود شوية، الخطر يزيد شوية. فلازم تختار خط، والخط اتحط أوطى من الأول.
      - kind: figure
        page: 164
        quote: "If any one of the following plasma glucose values are met or exceeded, GDM is diagnosed"
        title: "One-step ضد two-step"
        alt: "Two stacked panels. Top: one-step 75 g OGTT after an 8-hour fast with thresholds fasting 92, 1 hour 180, 2 hours 153 mg/dL, any one value diagnoses GDM. Bottom: two-step, step 1 a 50 g non-fasting load with 1-hour value at least 130 leads to step 2, a fasting 100 g OGTT with Carpenter-Coustan thresholds 95, 180, 155, 140, two of four values diagnose GDM."
        caption: "الـ one-step: رقم واحد يكفي. الـ two-step: screen بـ 50 g وبعدين 100 g ومحتاج رقمين من أربعة."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L13a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker></defs>
            <rect x="10" y="10" width="310" height="130" rx="8" class="fg-acc"/>
            <text x="20" y="34" class="t-b">One-step: 75 g OGTT</text>
            <text x="20" y="54" class="t-sm t-mut">Morning, after an overnight fast ≥8 h</text>
            <rect x="20" y="66" width="90" height="44" rx="6" class="fg-box"/>
            <text x="65" y="84" text-anchor="middle" class="t-sm">Fasting</text>
            <text x="65" y="103" text-anchor="middle" class="t-b t-acc">92</text>
            <rect x="120" y="66" width="90" height="44" rx="6" class="fg-box"/>
            <text x="165" y="84" text-anchor="middle" class="t-sm">1 hour</text>
            <text x="165" y="103" text-anchor="middle" class="t-b t-acc">180</text>
            <rect x="220" y="66" width="90" height="44" rx="6" class="fg-box"/>
            <text x="265" y="84" text-anchor="middle" class="t-sm">2 hours</text>
            <text x="265" y="103" text-anchor="middle" class="t-b t-acc">153</text>
            <text x="165" y="130" text-anchor="middle" class="t-sm t-b">ANY ONE value ≥ → GDM</text>
            <rect x="10" y="155" width="310" height="60" rx="8" class="fg-box"/>
            <text x="20" y="178" class="t-b">Two-step, step 1: 50 g GLT</text>
            <text x="20" y="200" class="t-sm">Non-fasting · 1-hour glucose ≥130 →</text>
            <path d="M165 216v18" class="fg-arrow-acc" marker-end="url(#L13a)"/>
            <rect x="10" y="238" width="310" height="116" rx="8" class="fg-box"/>
            <text x="20" y="260" class="t-b">Step 2: fasting 100 g OGTT</text>
            <text x="20" y="282" class="t-sm t-mut">Carpenter/Coustan (NDDG)</text>
            <text x="20" y="304" class="t-sm">Fasting 95 (105) · 1 h 180 (190)</text>
            <text x="20" y="324" class="t-sm">2 h 155 (165) · 3 h 140 (145)</text>
            <text x="20" y="344" class="t-sm t-b">TWO of four ≥ → GDM</text>
          </svg>
      - kind: reveal
        page: 165
        quote: "increase the incidence of GDM (5–6% to 15–20%), primarily because only one abnormal value (not two) became sufficient"
        prompt: "لو حوّلنا من two-step لـ one-step، الـ GDM هيزيد ولا يقل؟ وليه؟"
        answer: "هيزيد جامد: من **5-6%** لـ **15-20%**. السبب الأساسي إن **رقم واحد غلط** بقى كفاية بدل رقمين."
      - kind: check
        page: 164
        quote: "GDM is diagnosed if at least two of the following four readings are met or exceeded."
        question: "Fasting 100 g OGTT (Carpenter/Coustan): fasting 93, 1 h 185, 2 h 160, 3 h 130. Result?"
        options:
          - "GDM: two values are abnormal"
          - "Not GDM: only one value is abnormal"
          - "GDM: one value is enough"
          - "Overt type 2 DM"
        answer: 0
        why:
          - "صح: 185 ≥180 و 160 ≥155، يعني رقمين."
          - "عدّ تاني: الساعة والساعتين الاتنين فوق الحد."
          - "رقم واحد يكفي في الـ one-step 75 g بس."
          - "مفيش رقم بيوصل لـ standard criteria."
      - kind: try
        items: [dm.L13.009, dm.L13.014, dm.L13.017, dm.L13.019, dm.L13.006]
    recap:
      - "Risk factors → افحص في أول زيارة بالـ standard criteria. الباقي 24-28 weeks."
      - "GDM = اتعرف في الـ 2nd/3rd trimester ومش pre-existing."
      - "One-step 75 g: 92 / 180 / 153، رقم واحد. Two-step: 50 g ≥130 ثم 100 g، رقمين من أربعة."
      - "HAPO: الخطر بيزيد باستمرار ومفيش threshold."
    practice: [dm.L13.001, dm.L13.002, dm.L13.003, dm.L13.004, dm.L13.005, dm.L13.006, dm.L13.007, dm.L13.008, dm.L13.009, dm.L13.010, dm.L13.011, dm.L13.012, dm.L13.013, dm.L13.014, dm.L13.015, dm.L13.016, dm.L13.017, dm.L13.018, dm.L13.019, dm.L13.020, dm.L13.021, dm.L13.098, dm.L13.101, dm.L13.104]
  # ------------------------------------------------------------------
  - id: dm.L13.lesson2
    title: "اتجهّزي قبل ما تحملي"
    hook: "أهم شغل في حمل الست السكرية بيحصل قبل ما الحمل يبدأ أصلًا."
    minutes: 9
    pages: [162, 172]
    topics: [preconception, risks]
    goals:
      - "تحفظ الـ 4 main points للـ preconception care"
      - "تعدّ مخاطر السكر غير المنضبط على الأم والجنين"
      - "تعرف جرعة الـ aspirin وأرقام الضغط"
    status: unverified
    steps:
      - kind: mnemonic
        page: 162
        quote: "Provide preconception counseling to keep glycemic control as close to normal as is safely possible, ideally A1C < 6.5%."
        word: "GFTR"
        hook: "الأربع نقط الرئيسية قبل الحمل:"
        parts:
          - { key: "G", text: "Glycemia أقرب للطبيعي بأمان: ideally A1C <6.5%" }
          - { key: "F", text: "Family planning و effective contraception" }
          - { key: "T", text: "Teratogenic drugs: ACE inhibitors و statins" }
          - { key: "R", text: "Retinopathy: خطر إنها تظهر أو تتقدم" }
      - kind: aside
        tone: joke
        page: 163
        quote: "Risks related to certain medications. (Potentially teratogenic medications as ACE inhibitors & statins)."
        text: |
          الـ ==ACE inhibitor== والـ **statin** في درج المريضة السكرية زي الحماة في أوضة الفرح: مفيدين جدًا في العادي، بس قبل الحمل لازم حد يقعد معاهم ويراجع وجودهم.
      - kind: explain
        page: 171
        quote: "Folic acid supplement (400-800 jug/day routine)"
        title: "الـ checklist (Table 15.1)"
        text: |
          الـ ADA عامل checklist طويل قبل الحمل. أهم حاجاته:

          - **Nutrition**: الوزن، meal planning، النواقص، الـ caffeine، وتحضير الأكل بأمان.
          - **Lifestyle**: رياضة معتدلة، ==avoid hyperthermia== (hot tubs)، ونوم كفاية.
          - **Folic acid** ==400-800 µg/day== روتين.
          - **Counseling**: DKA، الـ hypoglycemia الشديدة، الـ retinopathy، والمخاطر: miscarriage، stillbirth، malformations، macrosomia، preterm، hypertensive disorders.
      - kind: explain
        page: 172
        quote: "comprehensive foot exam; comprehensive ophthalmologic exam; ECG in individuals starting at age 35 years who have cardiac signs or symptoms"
        title: "الـ screening قبل الحمل"
        text: |
          في السكر الموجود قبل الحمل: **foot exam**، **eye exam**، **ECG** من سن 35 لو فيه أعراض أو risk factors، **lipid panel**، **creatinine**، **TSH**، و **urine ACR**.

          كمان **anemia**، والـ **genetic carrier status** حسب التاريخ (cystic fibrosis، sickle cell، Tay-Sachs، thalassemia)، والـ infections والتطعيمات.

          والخطة: ==contraception لحد ما الـ glycemic goals تتحقق==.
      - kind: sort
        page: 165
        quote: "Increase the risk of obesity & T2DM in offspring later in life"
        prompt: "حط كل خطر في مكانه:"
        bins: ["الجنين / المولود", "الأم", "الطفل لما يكبر"]
        cards:
          - { text: "Spontaneous abortion", bin: 0 }
          - { text: "Fetal anomalies", bin: 0 }
          - { text: "Macrosomia", bin: 0 }
          - { text: "Neonatal hypoglycemia", bin: 0 }
          - { text: "Neonatal hyperbilirubinemia", bin: 0 }
          - { text: "Preeclampsia", bin: 1 }
          - { text: "Later T2DM and CVS morbidity", bin: 1 }
          - { text: "Obesity and T2DM", bin: 2 }
        why: "الكتاب بيعدّ 6 مخاطر قريبة (abortion، anomalies، preeclampsia، macrosomia، neonatal hypoglycemia و hyperbilirubinemia)، واتنين بعيدين: T2DM و CVS للأم، و obesity و T2DM للطفل."
      - kind: reveal
        page: 165
        quote: "Pregnancy is a ketogenic state, ↑↑risk for DKA even at lower BG levels than in the non-pregnant state (Euglycemic DKA)."
        prompt: "حامل T1DM عندها DKA والسكر 190 بس. إزاي؟"
        answer: "الحمل **ketogenic state**: الجنين بيسحب جلوكوز طول الوقت، فالأم بتحرق دهون أسرع. فالـ ==DKA== ممكن ييجي على سكر أوطى (**euglycemic DKA**). عشان كده: **ketone strips** في البيت و **sick-day rules**."
      - kind: check
        page: 165
        quote: "Women with preexisting diabetes, especially T1DM, need ketone strips at home & education on DKA prevention (sick day rules) & detection."
        question: "A 27-year-old with T1DM at 22 weeks asks why she has urine ketone strips. Best explanation?"
        options:
          - "Pregnancy is ketogenic; DKA can occur at lower glucose"
          - "DKA in pregnancy occurs only with glucose >350 mg/dL"
          - "Ketone testing is unnecessary with CGM"
          - "DKA risk is lower in pregnancy"
        answer: 0
        why:
          - "صح، ودي إجابة سؤال الكتاب."
          - "بالعكس، بيحصل على أرقام أوطى."
          - "الـ CGM بيقيس جلوكوز مش كيتونات."
          - "الخطر أعلى في الحمل مش أقل."
      - kind: figure
        page: 165
        quote: "low-dose aspirin 60–150 mg/day (usual dose 81 mg/day) from the end of the 1st trimester until the baby is born"
        title: "الأسبرين: من إمتى لإمتى"
        alt: "A horizontal pregnancy timeline from conception to birth split into three trimesters. A bar labelled low-dose aspirin 60 to 150 mg per day, usual 81 mg, starts at the end of the first trimester and runs to delivery, to lower preeclampsia risk in type 1 or type 2 diabetes."
        caption: "Aspirin من آخر الـ 1st trimester لحد الولادة، لكل ست عندها T1 أو T2DM."
        svg: |
          <svg viewBox="0 0 330 150" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="40" width="100" height="30" class="fg-box"/>
            <rect x="110" y="40" width="100" height="30" class="fg-box"/>
            <rect x="210" y="40" width="110" height="30" class="fg-box"/>
            <text x="60" y="60" text-anchor="middle" class="t-sm">1st</text>
            <text x="160" y="60" text-anchor="middle" class="t-sm">2nd</text>
            <text x="265" y="60" text-anchor="middle" class="t-sm">3rd</text>
            <text x="10" y="28" class="t-sm t-mut">Conception</text>
            <text x="320" y="28" text-anchor="end" class="t-sm t-mut">Birth</text>
            <rect x="105" y="85" width="215" height="26" rx="6" class="fg-acc"/>
            <text x="212" y="103" text-anchor="middle" class="t-sm t-b">Aspirin 60-150 mg/day (usual 81)</text>
            <text x="165" y="138" text-anchor="middle" class="t-sm t-mut">Goal: lower preeclampsia risk (T1DM or T2DM)</text>
          </svg>
      - kind: aside
        tone: trap
        page: 166
        quote: "The rapid implementation of tight glycemic control in the setting of retinopathy is associated with a worsening of retinopathy."
        text: |
          **Take care**: لو فيه **retinopathy**، ضبط السكر ==بسرعة== ممكن يخلّيها أسوأ. التحسين مطلوب، بس تابع العين.
      - kind: table
        page: 166
        quote: "a blood pressure threshold of 140/90 mmHg for initiation or titration of therapy is associated with better pregnancy outcomes"
        title: "الضغط مع السكر في الحمل (ADA 2025)"
        columns: ["البند", "الرقم"]
        rows:
          - ["ابدأ أو زوّد العلاج", "140/90 mmHg"]
          - ["قلّل العلاج تحت", "90/60 mmHg"]
          - ["الـ target المقترح", "110-135/85 mmHg"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 166
        quote: "with no increase in the risk of small-for-gestational-age birth weight"
        title: "ليه 140/90 مش بس الضغط الشديد؟"
        text: |
          العلاج من **140/90** أحسن للحمل من إنك تستنى الـ **severe hypertension**، و==من غير زيادة في الـ small-for-gestational-age (SGA)== birth weight. والـ target **110-135/85** عشان يقلل الـ accelerated maternal hypertension.
      - kind: try
        items: [dm.L13.022, dm.L13.035, dm.L13.039, dm.L13.041, dm.L13.040]
    recap:
      - "قبل الحمل: A1C <6.5% بأمان، contraception، راجع ACE inhibitors و statins، والعين."
      - "Folic acid 400-800 µg/day."
      - "الحمل ketogenic: euglycemic DKA، ketone strips في البيت."
      - "Aspirin 60-150 (81) mg/day من آخر الـ 1st trimester للولادة."
      - "الضغط: ابدأ 140/90، قلّل تحت 90/60، target 110-135/85."
    practice: [dm.L13.022, dm.L13.023, dm.L13.024, dm.L13.025, dm.L13.026, dm.L13.027, dm.L13.028, dm.L13.029, dm.L13.030, dm.L13.031, dm.L13.032, dm.L13.033, dm.L13.034, dm.L13.035, dm.L13.036, dm.L13.037, dm.L13.038, dm.L13.039, dm.L13.040, dm.L13.041, dm.L13.042, dm.L13.043, dm.L13.044, dm.L13.099, dm.L13.100]
  # ------------------------------------------------------------------
  - id: dm.L13.lesson3
    title: "الأرقام المستهدفة والـ CGM"
    hook: "في الحمل الصيام بيوطى والفطار بيعلى. والـ A1C مش هو الحَكَم."
    minutes: 8
    pages: [166, 169]
    topics: [targets]
    goals:
      - "تشرح ليه الـ fasting أوطى والـ postprandial أعلى في الحمل"
      - "تحفظ 95 / 140 / 120"
      - "تقرا تقرير AGP في 3 خطوات"
    status: unverified
    steps:
      - kind: figure
        page: 166
        quote: "Fasting BG levels are lower than in the non-pregnant state due to insulin-independent glucose uptake by the fetus &placenta."
        title: "الحمل بيشد السكر في اتجاهين"
        alt: "Two stacked boxes. Top: fasting glucose goes down because the fetus and placenta take up glucose without insulin. Bottom: postprandial glucose goes up because diabetogenic placental hormones cause carbohydrate intolerance."
        caption: "الجنين بياكل جلوكوز طول الليل، والمشيمة بتفرز هرمونات ضد الإنسولين بعد الأكل."
        svg: |
          <svg viewBox="0 0 330 210" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="90" rx="8" class="fg-good"/>
            <text x="20" y="36" class="t-b">Fasting glucose ↓</text>
            <text x="20" y="60" class="t-sm">Fetus + placenta take up glucose</text>
            <text x="20" y="80" class="t-sm">independent of insulin</text>
            <rect x="10" y="112" width="310" height="90" rx="8" class="fg-bad"/>
            <text x="20" y="138" class="t-b">Postprandial glucose ↑</text>
            <text x="20" y="162" class="t-sm">Diabetogenic placental hormones</text>
            <text x="20" y="182" class="t-sm">→ carbohydrate intolerance</text>
          </svg>
      - kind: explain
        page: 166
        quote: "In pregnancy, SMBG is more important than HbA1C (2ry measure)."
        title: "الـ A1C في الحمل"
        text: |
          - ==SMBG== هو الأساس، والـ **A1C** مقياس تاني (2ry).
          - كرات الدم الحمرا بتتجدد بسرعة في الحمل، فالـ A1C بيتقاس ==monthly==.
          - أقل مضاعفات للجنين مع **A1C <6-6.5%**.
      - kind: mnemonic
        page: 167
        quote: "recommend the following targets for women with pre-gestational T1 or T2DM (the same for GDM)"
        word: "FOT"
        hook: "أرقام ACOG و ADA (نفسها لـ T1، T2، و GDM):"
        parts:
          - { key: "F", text: "Fasting ≤95 mg/dL" }
          - { key: "O", text: "One-hour postprandial ≤140 mg/dL" }
          - { key: "T", text: "Two-hour postprandial ≤120 mg/dL (واحد من الاتنين بعد الأكل)" }
      - kind: aside
        tone: tip
        page: 167
        quote: "Postprandial monitoring is associated with better glycemic control & lower risk of preeclampsia."
        text: |
