  - id: res.L09.lesson9
    title: "الـ REC: ليه حد بيراقب بحثك؟"
    hook: "اللجنة مش عقبة: من غيرها مفيش funding ولا نشر في journal كويسة."
    minutes: 8
    pages: [67, 76]
    topics: [rec]
    goals:
      - "تعرف الـ REC = IRB وليه بنحتاج ethics review"
      - "تعدّ فوايد المراجعة للباحث"
      - "تعرف المشاريع اللي محتاجة REC والـ 7 items في الـ application"
    status: unverified
    steps:
      - kind: explain
        page: 67
        quote: "Research Ethics Committee (REC) = Institutional Review Board (IRB)"
        title: "REC = IRB"
        text: |
          ==Research Ethics Committee (REC)== هي نفسها ==Institutional Review Board (IRB)==: اسمين لنفس اللجنة.

          ليه اسمين؟ ده الاسم في بلاد والتاني في بلاد تانية (الـ IRB هو المستخدم في أمريكا)، فلو شفت أي واحد منهم في سؤال اعرف إنه نفس الحاجة. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 68
        quote: "What is a Research Ethics Committee (REC)?\n  A committee formed by an institution to review, approve the initiation of, and to conduct periodic review of research involving human subjects\n  The primary purpose of a REC is to assure the protection of the rights and welfare of human subjects"
        title: "الـ REC = IRB"
        text: |
          ==Research Ethics Committee (REC)== هي نفسها الـ **Institutional Review Board (IRB)** (slide 67).

          لجنة بتعملها المؤسسة عشان **تراجع وتوافق على بداية** البحث على البشر، و**تراجعه بشكل دوري**. هدفها الأساسي: **حماية حقوق وسلامة المشاركين**.
      - kind: explain
        page: 69
        quote: "Why Ethics Review?\n  History of abuses in research activities\n  Growing concerns worldwide on the need to put in additional safeguards for the protection of human subjects; Declaration of Helsinki\n  Increase in research involving human participants\n  Requirement for funding – National Institutes of Health (USA)"
        title: "ليه ethics review أصلًا؟"
        text: |
          أسباب السلايد:

          - ==History of abuses== في الأبحاث.
          - قلق عالمي متزايد إن لازم safeguards زيادة لحماية المشاركين (Declaration of Helsinki).
          - زيادة الأبحاث اللي فيها human participants.
          - ==Requirement for funding== (National Institutes of Health في أمريكا).

          ليه آخر سبب مهم عمليًا؟ لأن من غير موافقة لجنة مفيش تمويل، فالمراجعة بقت شرط مش اختيار. التفسير المقبول (مش في الكتاب).
      - kind: explain
        remind: [res.L09.064]
        page: 71
        quote: "Why Do We Need Someone Watching Over Us?\n  Objectivity:\n    We underestimate the risks of what we're comfortable doing\n    We overestimate the benefits of what we believe in\n  Social context\n  Inherent conflicts of interest\n  Maintain public trust"
        title: "ليه محتاجين حد يراقبنا؟"
        text: |
          - **Objectivity**: بنصغّر خطر الحاجة اللي متعودين عليها، وبنكبّر فايدة الحاجة اللي مصدقينها.
          - **Social context**.
          - **Conflicts of interest**.
          - **Public trust**.

          وكمان بتفيدك (slide 72): بحث أحسن، سمعة أحسن، موافقات بتطلبها الجهات العلمية، **نشر في مجلات كويسة**، و**funding**.
      - kind: aside
        tone: joke
        page: 71
        quote: "Why Do We Need Someone Watching Over Us?\n  Objectivity:\n    We underestimate the risks of what we're comfortable doing\n    We overestimate the benefits of what we believe in\n  Social context\n  Inherent conflicts of interest\n  Maintain public trust"
        text: |
          زي الأم اللي بتشوف ابنها أحلى عيل في الدنيا: إنت كمان شايف بحثك آمن جدًا ومفيد جدًا. اللجنة هي «الخالة» اللي هتقولك بهدوء: «طب والعيل ده نايم كام ساعة؟».
      - kind: explain
        page: 72
        quote: "Why Do We Need Someone Watching Over Us?\n  Make research studies better!! Enhance study design & protection of subjects\n  Enhance researcher reputation\n  Increased requirements for ethical approval in different scientific bodies\n  More likely to get published in good journals\n  More likely to get funding/ grants."
        title: "اللجنة بتفيدك إنت كمان"
        text: |
          الـ ethics review بيفيد الباحث:

          - ==Better studies==: design أحسن وحماية أحسن للمشاركين.
          - ==سمعة== الباحث بتعلى.
          - بيقابل شروط الـ ethical approval في الهيئات العلمية.
          - ==فرصة نشر== أكبر في journals كويسة.
          - فرصة funding أكبر.

          ليه بنقولها كده؟ لأن ناس كتير شايفة اللجنة عقبة، والسلايد بتقولك إنها بتزوّد فرصك. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 73
        quote: "Why Do We Need Someone Watching Over Us?\nInternational guidelines require that an independent committee perform an Ethical and Scientific review of biomedical research. (Declaration of Helsinki/CIOMS)"
        title: "Independent committee: ethical و scientific"
        text: |
          الـ international guidelines (Declaration of Helsinki و CIOMS) بتطلب إن ==independent committee== تعمل ==ethical and scientific review== لأي biomedical research.

          ليه scientific كمان؟ لأن بحث design بتاعه ضعيف مش هيطلع بنتيجة، يبقى عرّض الناس لخطر من غير فايدة، وده في حد ذاته مش أخلاقي. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 74
        quote: "Examples of projects that will require REC review\n  Chart/ medical record reviews.\n  Surveys, interviews, group discussions.\n  Randomized intervention and control group.\n  Data analysis of primary or secondary data from data registries or tissue repositories that contain identifiers or codes."
        title: "مشاريع لازم تروح للـ REC"
        text: |
          أمثلة السلايد:

          - ==Chart / medical record reviews==.
          - Surveys و interviews و group discussions.
          - Randomized intervention and control group.
          - تحليل primary أو secondary data من registries أو tissue repositories ==فيها identifiers أو codes==.

          ليه حتى مراجعة الملفات؟ لأن مفيش حقنة بس فيه ==identifiable private information==، والخطر هنا على الـ privacy. التفسير المقبول (مش في الكتاب).
      - kind: check
        page: 74
        quote: "Examples of projects that will require REC review\n  Chart/ medical record reviews.\n  Surveys, interviews, group discussions.\n  Randomized intervention and control group.\n  Data analysis of primary or secondary data from data registries or tissue repositories that contain identifiers or codes."
        question: "A project only analyses registry data that still contain patient codes. Does it need REC review?"
        options:
          - "Yes: registry data with identifiers or codes is on the slide's list"
          - "No: there is no intervention"
          - "No: the data were collected for another purpose"
          - "Only if it is funded"
        answer: 0
        why:
          - "صح: السلايد كاتبة data من registries فيها identifiers أو codes."
          - "مفيش intervention بس فيه identifiable information."
          - "حتى الـ secondary data محتاجة مراجعة لو فيها codes."
          - "التمويل مش هو المعيار."
      - kind: explain
        page: 76
        quote: "The Application: answers to the following 7 items\n  1. Subject selection\n  2. Procedures\n  3. Risks/benefits\n  4. Confidentiality\n  5. Informed consent\n  6. Additional protection for Vulnerable groups\n  7. Conflict of interest"
        title: "الـ 7 items في الـ application"
        text: |
          الـ application بيجاوب على 7 حاجات:

          1. Subject selection
          2. Procedures
          3. Risks/benefits
          4. Confidentiality
          5. Informed consent
          6. Additional protection for vulnerable groups
          7. Conflict of interest

          ليه الترتيب ده؟ هو نفس أسئلة المبادئ: مين (justice)، هتعمل إيه وخطره قد إيه (beneficence)، وهتحترمه إزاي (respect). التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 76
        quote: "1. Subject selection 2.Procedures 3. Risks/benefits 4.Confidentiality 5.Informed consent 6.Additional protection for Vulnerable groups 7. Conflict of interest"
        title: "رحلة البحث عند الـ REC"
        alt: "The application lists 7 items: subject selection, procedures, risks and benefits, confidentiality, informed consent, vulnerable groups, conflict of interest. It goes to the REC, also called IRB, for independent ethical and scientific review, which approves the start. The study runs and returns to the committee for periodic review. A box below says the ultimate responsibility stays with the principal investigator."
        caption: |
          الدرس كله في رسمة واحدة:

          - **الشمال**: الـ application بالـ 7 items بتوع slide 76.
          - **الصندوق الملوّن**: الـ ==REC== (هي نفسها الـ IRB)، لجنة **independent** بتراجع الأخلاق **والعلم** مع بعض.
          - توافق على ==البداية==، والدراسة تشتغل، والسهم المنحني بيرجّعها للجنة في **periodic review** (slide 68).
          - تحت: الموافقة ماتنقلش المسؤولية. ==الـ PI== هو المسؤول النهائي (slide 66).

          لو سؤال سألك «اللجنة بتعمل إيه؟» افتكر الاتنين: approve the initiation **و** periodic review.
        svg: |
