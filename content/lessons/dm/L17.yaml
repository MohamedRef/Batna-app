        page: 224
        quote: "Postmenopausal women with osteoporosis or at high risk for the disease should be considered for drug (or hormonal) therapy."
        prompt: "مين ياخد الأكل والرياضة، ومين ياخد دوا كمان؟"
        answer: |
          الكتاب واضح:
          - الأكل والرياضة وبطّل السجاير: ==لكل الستات== بعد سن اليأس (universally).
          - الدوا أو الهرمونات: اللي عندها ==osteoporosis== أو ==high risk==.

          ليه التقسيمة دي؟ عشان الإجراءات العامة رخيصة ومن غير أعراض جانبية تذكر، فتتعمل لكل الناس، لكن الدوا ليه تمن وأعراض، فبيتحجز للي هيستفيد أكتر. الدرس الجاي هيقولك العتبات بالأرقام.
