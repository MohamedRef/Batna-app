          </svg>
      - kind: explain
        page: 415
        title: "الكلية بتتأذي بتلات طرق"
        quote: "The mechanisms of AKI are due to uric acid nephropathy, cytokine release and nephrocalcinosis."
        text: |
          الكتاب بيقول ==three mechanisms==. التفسير المقبول (مش في الكتاب) لكل واحد:

          - **Uric acid nephropathy:** الـ uric acid مش بيدوب كويس في البول الحمضي اللي في آخر الـ tubules، فبيعمل **crystals** تسد الأنابيب من جوه.
          - **Nephrocalcinosis:** لما الـ calcium × phosphate يعدّي حد معين، بيترسّبوا مع بعض في نسيج الكلية (ودي نفس اللي بتعمل الـ hypocalcemia).
          - **Cytokine release:** الخلايا الميتة بتطلّع cytokines بتعمل التهاب وتوسّع أوعية، فالكلية بتتضرب من غير crystals خالص.

          يعني حتى لو ظبطت الـ uric acid، لسه فيه طريقين تانيين. وده هيفسّر خطوات العلاج في الدرس الجاي.
      - kind: sort
        page: 415
        quote: "Tumor-Related Risk Factors for TLS: Acute lymphocytic/lymphoblastic leukemia, WBC > 100,000; Acute myeloid leukemia, WBC > 50,000; Burkitt, lymphoblastic, diffuse large B-cell lymphoma; Large tumor burden; LDH > 1500 IU; Chemotherapy responsive tumor; Extensive BM involvement. Patient-Related Risk Factors for TLS: Older age; Reduced GFR; Dehydration/volume depletion; Baseline hyperuricemia; Splenomegaly; CNS/Renal involvement by tumor; Mediastinal mass."
        prompt: "Figure 5 (ص 415): الـ risk factor ده بتاع الورم ولا بتاع العيان؟"
        bins: ["Tumor-related", "Patient-related"]
        cards:
          - { text: "LDH > 1500 IU", bin: 0 }
          - { text: "AML with WBC > 50,000", bin: 0 }
          - { text: "Chemotherapy responsive tumor", bin: 0 }
          - { text: "Reduced GFR", bin: 1 }
          - { text: "Dehydration", bin: 1 }
          - { text: "Baseline hyperuricemia", bin: 1 }
          - { text: "Splenomegaly", bin: 1 }
        why: "عوامل الورم بتقول «قد إيه هيتكسر»: كتلة كبيرة (LDH، WBC) وبتستجيب للعلاج. عوامل العيان بتقول «الكلية هتستحمل قد إيه»: GFR واطي ومية قليلة و uric acid عالي من الأول."
      - kind: reveal
        page: 415
        quote: "Tumor-Related Risk Factors for TLS: Acute lymphocytic/lymphoblastic leukemia, WBC > 100,000; Acute myeloid leukemia, WBC > 50,000; Burkitt, lymphoblastic, diffuse large B-cell lymphoma; Large tumor burden; LDH > 1500 IU; Chemotherapy responsive tumor; Extensive BM involvement. Patient-Related Risk Factors for TLS: Older age; Reduced GFR; Dehydration/volume depletion; Baseline hyperuricemia; Splenomegaly; CNS/Renal involvement by tumor; Mediastinal mass."
        prompt: "ليه الـ dehydration والـ reduced GFR بيزوّدوا الخطر، مع إنهم مش بيكسّروا خلايا زيادة؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ TLS معادلة فيها طرفين: **قد إيه بيطلع** من الخلايا، و **قد إيه الكلية بتطلّع**.

          الورم بيتحكم في الطرف الأول. والعيان بيتحكم في التاني: لو المية قليلة، البول بطيء ومركّز فالـ crystals بتترسب أسهل. ولو الـ GFR واطي، الـ K والـ phosphate والـ uric acid بيتراكموا. وده بالظبط ليه الـ **hydration** هو أول خطوة في العلاج.
      - kind: try
        items: [neph.L12.023, neph.L12.031, neph.L12.035, neph.L12.039, neph.L12.040]
    recap:
      - "الـ TLS = الخلية بتطلّع اللي جواها: K، phosphate، uric acid عالي، والـ Ca واطي secondary."
      - "الأورام: large burden + rapid growth (NHL، Burkitt، AML، ALL، كتل كبيرة)."
