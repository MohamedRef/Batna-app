        quote: "DVT, pulmonary embolism and ischaemic stroke are the principal thrombotic manifestations, but any vessel may be involved, including the microvasculature, for example renal thrombotic microangiopathy. A characteristic of APS in an individual patient is the tendency to recurrent problems in the same vascular bed."
        text: |
          الأشهر: **Deep vein thrombosis (DVT)** و **PE** و **ischemic stroke**، بس أي وعاء ممكن، حتى الـ microvasculature (renal thrombotic microangiopathy).

