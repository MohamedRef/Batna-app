      - kind: reveal
        page: 253
        quote: "small intestinal bacterial overgrowth may give false positive result with early increase in the level of hydrogen in exhaled air"
        prompt: "الـ breath hydrogen test طلع إيجابي بدري جدًا بعد اللاكتوز. ده lactase deficiency أكيد؟"
        answer: "مش شرط. الفكرة إن الكربوهيدرات اللي ما اتمصّتش بتتخمّر في **القولون** وتطلّع hydrogen في النَفَس. بس لو فيه **SIBO**، البكتيريا موجودة **فوق** في الـ small bowel، فالـ hydrogen يطلع **بدري**، وده **false positive**. (والـ **OGTT**: لو الجلوكوز ما طلعش كفاية في الدم = malabsorption.)"
      - kind: explain
        page: 253
        title: "الـ Schilling test: 4 أسئلة لـ B12"
        quote: "Its 4 stages determine whether the deficiency results from pernicious anemia, pancreatic exocrine insufficiency, bacterial overgrowth, or ileal disease."
        text: |
          **Stage 1**: B12 مُعلَّم بالبُق + **1000 mcg B12 IM** (علشان يملا أماكن الربط في الكبد)، وتجمع بول 24 ساعة. أقل من ==8%== = في malabsorption.

          بعد كده تعيد وتضيف حاجة كل مرة. **اللي يصلّح الرقم هو التشخيص**:
          - **Stage 2** + intrinsic factor ← **pernicious anemia**
          - **Stage 3** + pancreatic enzymes ← **pancreatic insufficiency**
          - **Stage 4** بعد antibiotics (anaerobic) ← **bacterial overgrowth**
          - ولا حاجة صلّحت؟ ← **ileal disease أو resection**
      - kind: mnemonic
        page: 254
        quote: "Stage 2: If stage 1 is abnormal, the test is repeated with the addition of intrinsic factor."
        word: "BIPA"
        parts:
          - { key: "B", text: "Stage 1: B12 alone (labelled oral + IM flush)" }
          - { key: "I", text: "Stage 2: Intrinsic factor fixes it = pernicious anemia" }
          - { key: "P", text: "Stage 3: Pancreatic enzymes fix it = pancreatic insufficiency" }
          - { key: "A", text: "Stage 4: Antibiotics fix it = bacterial overgrowth" }
        hook: "**BIPA**: بتضيف حرف كل مرحلة. ولو الأربعة فشلوا، العيب في الـ **ileum** نفسه."
      - kind: update
        page: 254
        quote: "Stage 1: The patient is given 1 mcg of radiolabeled cyanocobalamin po concurrent with 1000 mcg of nonlabeled cobalamin IM"
        text: "الـ **Schilling test** مش متاح تقريبًا في أي حتة دلوقتي، لأن الـ radiolabelled cobalamin اتسحب من السوق. الشغل بقى بـ serum B12 و anti-intrinsic factor antibodies وتحاليل تانية. في الامتحان اكتب مراحل الكتاب الأربعة."
        ref: "BSH guideline on cobalamin and folate disorders, 2014"
