  - id: neph.L14.lesson15
    title: "اضرب الـ clone، والـ sarcoid والكلية"
    hook: "العلاج مش على شكل الـ biopsy، على نوع الخلية اللي بتطلّع البروتين."
    minutes: 9
    pages: [499, 503]
    topics: [dysprot, sarcoid]
    goals:
      - "تحدد الـ light chain وقفت فين وإيه اللي بيحصل"
      - "تفهم ليه العلاج clone-directed وليه الـ diuretics بتختلف"
      - "تعرف الـ bortezomib والـ VGPR والـ stem cell transplant"
      - "تعالج الـ sarcoid في الكلية حسب الـ lesion وتعرف ليه الـ thiazide ممنوع"
    status: unverified
    steps:
      - kind: figure
