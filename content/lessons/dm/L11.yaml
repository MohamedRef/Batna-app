      - kind: explain
        remind: [dm.L11.017]
        page: 134
        title: "ليه نبدأ بالـ basal؟"
        quote: "Advantages:\n  1. 1 injection with no mixing\n  2. Insulin pens for increased acceptance\n  3. Slow, safe, simple titration\n  4. Low dosage\n  5. Effective improvement in glycemic control"
        text: |
          الستة مزايا، وجنب كل واحدة السبب (التفسير المقبول، مش في الكتاب):

          - ==1 injection with no mixing==: حقنة واحدة في اليوم، فالعيان مش هيلخبط ولا هيخلط قلمين، والالتزام بيبقى أعلى.
          - **Insulin pens**: العيان بيتقبّلها أكتر، لأن الإبرة صغيرة والجرعة بتتلف بزرار، وده بيرد على خوف الـ needles.
          - **Slow, safe, simple titration**: بتظبط على رقم واحد بس (الـ fasting)، وبتزوّد كل كام يوم، فصعب تغلط.
          - **Low dosage**: لأنها بتغطي الـ hepatic glucose output بالليل بس، مش الأكل، فالجرعة المطلوبة صغيرة.
          - **Effective** improvement in control: عشان الصيام هو الأرضية، فلما ينزل كل اليوم ينزل معاه.
          - **Limited weight gain**: جرعة صغيرة و hypoglycemia أقل، يعني أكل أقل لعلاج الـ hypo ووزن أقل.
      - kind: mnemonic
        page: 134
        quote: "IDEAL BASAL INSULIN:\n  1. Closely mimic normal pancreatic basal insulin secretion\n  2. No distinct peak effect\n  3. Continued effect over 24 hours\n  4. Reduce nocturnal hypoglycemia\n  5. Once-daily administration for patient compliance"
        word: "MPLNOP"
        parts:
