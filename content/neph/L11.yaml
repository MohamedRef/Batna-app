  - id: neph.L11.166
    kind: card
    topic: tx-risk
    front: Why do predamaged grafts fail faster in pregnancy?
    back: With fewer functioning nephrons already hyperfiltering, they have no reserve for the pregnancy load.
    src: { page: 383, quote: "Several factors predicting adverse outcomes and graft loss during pregnancy are, hereby. A history of previous rejections and significant proteinuria can also negatively impact allograft function. According to Davison et al.(95) a baseline serum creatinine level of more than 1.5 mg/dl and proteinuria of more than 500 mg/24 h were strong predictors of irreversible graft loss during pregnancy. Fischer(92) reported that patients with a baseline serum creatinine of more than 1.9 mg/dl are more likely to suffer a rapid deterioration in kidney function during pregnancy that could progress to ESRD, consistent with expert consensus opinion. Predamaged kidneys with fewer functioning nephrons already exhibiting hyper filtration do not have sufficient reserves, thereby, accelerating allograft failure. (93)" }
    status: unverified
  - id: neph.L11.167
    kind: cloze
    topic: tx-risk
    text: "Acute rejection during pregnancy occurs in {{c1::2-14.5%}}; urinary tract infection affects up to {{c2::40%}} of pregnant transplant recipients."
    src: { page: 384, quote: "The majority of transplant recipients do not encounter acute rejection episodes during pregnancy; its incidence ranges from 2 to 14.5%. Acute rejection in pregnancy can be challenging to diagnose. Acute rejection may lead to allograft dysfunction and preeclampsia, and, thereby, is associated with inferior perinatal outcomes. Differential diagnoses can include urinary tract infections that affect up to 40% of pregnant transplant recipients. In addition, hypertension can get worse during pregnancy with increasing proteinuria, making the diagnosis of preeclampsia versus acute rejection rather challenging.(94)" }
    status: unverified
    tags: [numbers]
  - id: neph.L11.168
    kind: card
    topic: tx-risk
    front: Why is acute rejection hard to diagnose in pregnancy, and how is it confirmed and treated?
    back: It overlaps with UTI and with preeclampsia (worsening BP and proteinuria). Confirm with allograft biopsy before changing immunosuppression; high-dose steroids are first-line.
    src: { page: 384, quote: "Allograft biopsy should be done to confirm acute rejection before modifying immunosuppression. High-dose steroids have been successful in treating allograft rejection during pregnancy and remain the first-line therapy. Data on the use of other agents like antithymocyte globulin and rituximab for treating acute rejection in pregnancy are limited and there are no specific recommendations. (94)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.169
    kind: cloze
    topic: tx-risk
    text: "The pregnancy rate in kidney transplant recipients is {{c1::5.5-8.3}} per 1,000 women."
    src: { page: 384, quote: "Impact of transplantation on the outcomes of pregnancy In kidney transplant patients, the estimated pregnancy rate ranges from 5.5 to 8.3 per 1000 women. For transplant recipients, pregnancy remains challenging due to the possibility of adverse maternal complications, side effects of immunosuppressive drugs, and adverse fetal outcomes.(94)" }
    status: unverified
    tags: [numbers]
