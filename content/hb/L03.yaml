  # --- Own MCQs (vignettes from the lecture text) ---
  - id: hb.L03.086
    kind: mcq
    topic: acute-bleeding
    stem: A 50-year-old man with alcoholic cirrhosis presents with hematemesis. BP 90/60, Hb 6.8 g/dL, INR 1.9, platelets 60,000/µL. Octreotide and ceftriaxone are started. Which additional measure is most appropriate before endoscopy?
    options:
      - Transfuse packed red cells to an Hb of about 7–9 g/dL
      - Transfuse packed red cells to an Hb of at least 10 g/dL
      - Give fresh frozen plasma to correct the INR
      - Give platelet concentrate to above 100,000/µL
      - Give large-volume crystalloids to normalise the BP
    answer: 0
    why:
      - Correct. Careful volume replacement to Hb 7–9 g/dL (book p48).
      - Over-transfusion raises portal pressure and rebleeding.
      - FFP is ineffective and harmful in variceal bleeding (more failure at 5 days and deaths at 42 days).
      - Variceal bleeding is not due to haemostatic failure; platelets are likely ineffective and carry transfusion risks.
      - Aggressive volume expansion raises portal pressure; replacement should be careful.
    src: { page: 48, quote: "Careful replacement of volemia: Hb between 7 and 9 g/dl" }
    status: unverified
  - id: hb.L03.087
    kind: mcq
    topic: primary-prophylaxis
    stem: A 58-year-old woman with compensated HCV cirrhosis has large esophageal varices without red signs on screening endoscopy. She has never bled and has no contraindication to beta-blockers. What is the preferred primary prophylaxis according to the lecture?
    options:
      - A non-selective beta-blocker such as carvedilol
      - Isosorbide mononitrate alone
      - TIPS
      - Sclerotherapy
      - No treatment; repeat endoscopy in 2–3 years
    answer: 0
    why:
      - Correct. Beta-blockers are the treatment of choice; carvedilol lowers HVPG more than propranolol (p45, p47).
      - Long-acting nitrates alone are only an option assessed when beta-blockers cannot be used.
      - TIPS is salvage therapy for acute bleeding or secondary prophylaxis, not primary prophylaxis.
      - Sclerotherapy is not used for primary prophylaxis; EBL is the endoscopic option.
      - Large varices carry >25% bleeding risk at 2 years and need prophylaxis.
    src: { page: 45, quote: "Beta-blockers should be the treatment of choice offering EBL to those patients with moderate or large varices and contraindications or intolerance to Beta-blockers" }
    status: unverified
  - id: hb.L03.088
    kind: mcq
    topic: csph
    stem: In a patient with cirrhosis, HVPG is measured at 14 mmHg. What does this value imply according to the lecture?
    options:
      - CSPH, with a pressure high enough for varices to rupture
      - Normal portal pressure
      - Portal hypertension but below the threshold for varices to form
      - Pre-sinusoidal portal hypertension only
      - A haemodynamic response to beta-blockers
    answer: 0
    why:
      - Correct. CSPH is HVPG >10 mmHg and rupture occurs above 12 mmHg (p43).
      - Normal HVPG is far below 10 mmHg.
      - Varices form once HVPG exceeds 10 mmHg, so 14 is above that threshold.
      - Pre-sinusoidal disease gives a normal wedged pressure and a normal HVPG; an HVPG of 14 means sinusoidal disease.
      - A response is an HVPG fall of ≥20% or to <12 mmHg; one value alone cannot show a response.
    src: { page: 43, quote: "Increased portal pressure (HVPG > 10 mmHg) → Formation of varices → Dilatation → Rupture of varices (HVPG > 12 mmHg)" }
    status: unverified
  - id: hb.L03.089
    kind: mcq
    topic: rescue-tips
    stem: Three weeks after a covered TIPS for refractory variceal bleeding, a 70-year-old man with Child B cirrhosis becomes confused and drowsy. What is the most likely cause?
    options:
      - Hepatic encephalopathy
      - TIPS-associated hemolysis
      - Stent infection
      - Recurrent variceal bleeding
      - Stent occlusion
    answer: 0
    why:
      - Correct. Encephalopathy is the most important medical complication after TIPS, typically within 2–3 weeks; age and liver dysfunction add risk (p55–56).
      - Hemolysis is rare with coated stents and causes jaundice and anaemia, not isolated confusion.
      - Vegetative stent infection was reported mainly with bare stents and presents with fever and bacteraemia.
      - There is no bleeding in the vignette, and TIPS lowers rebleeding.
      - Occlusion raises portal pressure again and would reduce, not cause, shunt encephalopathy.
    src: { page: 56, quote: "It typically presents with acute worsening of mental status within 2 to 3 weeks of shunt placement." }
    status: unverified
  - id: hb.L03.090
    kind: mcq
    topic: acute-bleeding
    stem: A man with Child C cirrhosis and variceal bleeding is haemodynamically unstable. Which antibiotic does the lecture favour as prophylaxis?
    options:
      - Intravenous ceftriaxone
      - Oral norfloxacin
      - No antibiotic unless infection is proven
      - Oral rifaximin
      - Intravenous vancomycin
    answer: 0
    why:
      - Correct. IV ceftriaxone may be superior in advanced liver disease with haemodynamic instability (p50).
      - Oral quinolones are less suitable in advanced disease and shock, and oral intake is unsafe while bleeding.
      - Short-term prophylaxis is standard of care and improves survival (p49).
      - Rifaximin is for hepatic encephalopathy, not prophylaxis in bleeding.
      - Vancomycin does not cover the gram-negative gut organisms that cause these infections.
    src: { page: 50, quote: "intravenous ceftriaxone may be a superior option in patients with advanced liver disease and hemodynamic instability." }
    status: unverified

