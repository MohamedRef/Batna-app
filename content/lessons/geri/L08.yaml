  - id: geri.L08.lesson6
    title: "PMR و GCA: الكتاف المتخشبة والعين اللي في خطر"
    hook: "تيبس الصبح في الكتفين ممكن يكون أول خيط لمرض ياخد النظر لو اتأخرت."
    minutes: 7
    pages: [152, 154]
    topics: [pmr]
    goals:
      - "تعرف صورة الـ PMR وتشخيصه وجرعته"
