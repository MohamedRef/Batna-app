          ليه الـ appendix carcinoid نادرًا بيعمل syndrome؟ لأنه بيتلاقى صغير وصدفة، وأغلبه ما بيوصلش الكبد، والهرمون اللي بيطلع منه بيعدّي على الكبد ويتكسّر.
      - kind: explain
        page: 94
        quote: "Patients usually present in their 50s with recurrent pneumonia, cough, hemoptysis or chest pain."
