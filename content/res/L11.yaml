schema: batna.content/v1
lecture: res.L11
title: Sampling methods and sample size determination
author: Prof. Heba El-Weshahi
book: { chapter: 1, pages: [1, 95] }
topics:
  - { id: population, title: "Population, study units, sample and the sampling process" }
  - { id: probability, title: "Probability sampling: simple random, systematic, stratified, cluster, multistage" }
  - { id: nonprobability, title: "Non-probability sampling: convenience, consecutive, purposive, snowball, quota" }
  - { id: requirements, title: "Requirements of sample size calculation" }
  - { id: calculation, title: "Calculating the sample size: surveys, case-control, cohort and trials (Epi Info)" }
items:
  # ---------------- population (slides 2-13) ----------------
  - id: res.L11.001
    kind: enumerate
    topic: population
    prompt: When we draw a sample from a population, which three questions do we face?
    points:
      - Which group of people (the study population) do we draw the sample from?
      - How many people do we need in the sample (sample size)?
      - How will these people be selected (sampling method)?
    pass: 3
    hook: "الـ 3 أسئلة «مين؟ كام؟ إزاي؟» = study population، sample size، وsampling method."
    src: { page: 3, quote: "What is the group of people (study population) from which we want to draw a sample?\nHow many people do we need in our sample?\nHow will these people be selected?\nSampling Methods and Sample Size" }
    status: unverified
    tags: [high-yield]
  - id: res.L11.002
    kind: card
    topic: population
    front: Define a population in a research study.
    back: >-
      A well-defined group of people or objects that share common characteristics, about which some information is
      sought (e.g. all immigrants from Egypt, or all patients with left hemiplegia).
    src: { page: 4, quote: "A population is as a well-defined group of people or objects that share common characteristics\nE.g. All immigrants from Egypt or all patients with left hemiplegia.\nA population in a research study is a group about which some information is sought." }
    status: unverified
  - id: res.L11.003
    kind: card
    topic: population
    front: What can a study population consist of, and what is a study unit?
    back: >-
      Besides persons, a study population may consist of villages, institutions, records, etc. Each study population is
      made of study units; how we define the population and its unit depends on the problem and the study objectives.
    src: { page: 5, quote: "The study population has to be clearly defined. Apart from persons, a study population may consist of villages, institutions, records, etc.\nEach study population consists of STUDY UNITS. The way we define our study population and our study unit depends on the problem we want to investigate and on the objectives of the study." }
    status: unverified
  - id: res.L11.004
    kind: table
    topic: population
    title: Study population and study unit (examples)
    columns: [Problem, Study population, Study unit]
    rows:
      - [Malnutrition related to weaning in district X, All children 6-24 months of age in district X, One child 6-24 months in district X]
      - [High dropout rates in primary schools in district Y, All primary schools in district Y, One primary school in district Y]
      - [Poor record-keeping for leprosy patients in hospital Z, All records on leprosy patients in hospital Z, One record on a leprosy patient in hospital Z]
    blanks: [[0, 2], [1, 2], [2, 1], [2, 2]]
    src: { page: 6, quote: "Example of Study Population and Study Units\n| Problem | Study population | Study unit |\n|---|---|---|\n| Malnutrition related to weaning in district X | All children 6-24 months of age in District X | One child between 6-24 months in District X |\n| High dropout rates in primary schools in District Y | All primary schools in District Y | One primary school in District Y |\n| Inappropriate record-keeping for leprosy patients registered in Hospital Z | All records on leprosy patients in hospital Z | One record on a leprosy patient registered in hospital Z |" }
    status: unverified
  - id: res.L11.005
    kind: card
    topic: population
    front: Why do we sample instead of studying the whole population?
    back: >-
      Studying the entire population would be ideal (it allows generalization), but usually the population is too large or
      too spread out over time and distance to measure every member. So a small portion is sampled and the results are
      generalized to the whole population.
    src: { page: 7, quote: "In clinical research it would be ideal to include the entire population\nGENERALIZATION\nHowever, in most cases, the population in question is too large or too spread out over time and distance to allow for measuring or evaluating each member of the population." }
    status: unverified
  - id: res.L11.006
    kind: table
    topic: population
    title: Sampling instead of studying everyone
    columns: [Side, Points]
    rows:
      - [Advantages, "Fewer subjects; more time efficient; less costly; potentially more accurate (easier to keep control over fewer subjects)"]
      - [Disadvantage, "Potential bias in selecting subjects, which may reduce how far the results generalize beyond the subjects studied"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 9, quote: "Advantages:\n  a smaller number of subjects\n  more time efficient\n  less costly\n  potentially more accurate (since it is more feasible to maintain control over a smaller number of subjects).\nDisadvantages:\n  Potential bias in the selection of subjects, which may decrease the ability to generalize the results beyond the subjects actually studied" }
    status: unverified
  - id: res.L11.007
    kind: mcq
    topic: population
    stem: Why may a sample be more accurate than studying the whole population?
    options:
      - It is more feasible to keep control over a smaller number of subjects
      - A sample is free of selection bias
      - A sample always includes every small subgroup
      - Statistical tests need fewer subjects to be valid
    answer: 0
    why:
      - Fewer subjects means measurements and quality can be controlled better.
      - Selection bias is the main disadvantage of sampling, not something it removes.
      - Small subgroups can be missed by a simple random sample; that is why stratified sampling exists.
      - Too few subjects weakens a test; the sample must be large enough for a fair analysis.
    src: { page: 9, quote: "Advantages:\n  a smaller number of subjects\n  more time efficient\n  less costly\n  potentially more accurate (since it is more feasible to maintain control over a smaller number of subjects).\nDisadvantages:\n  Potential bias in the selection of subjects, which may decrease the ability to generalize the results beyond the subjects actually studied" }
    status: unverified
  - id: res.L11.008
    kind: card
    topic: population
    front: What is a sample, and what is a representative sample?
    back: >-
      A sample is a small subset of the population chosen to be studied. It should represent the population and be large
      enough for a fair statistical analysis. A representative sample has all the important characteristics of the
      population it is drawn from.
    src: { page: 11, quote: "A sample is a small subset of the population that has been chosen to be studied.\nThe sample should represent the population and have sufficient size to be subjected to a fair statistical analysis.\nA representative sample has all the important characteristics of the population from which it is drawn." }
    status: unverified
    tags: [high-yield]
  - id: res.L11.009
    kind: enumerate
    topic: population
    prompt: Enumerate the 3 factors that influence how representative a sample is.
    points:
      - Sampling procedure
      - Sample size
      - Participation (response rate)
    pass: 3
    hook: "الـ representativeness على 3 رجول «إزاي، كام، ومين رد»: sampling procedure، sample size، participation (response rate)."
    src: { page: 12, quote: "3 factors that influence sample representativeness\n  Sampling procedure\n  Sample size\n  Participation (response rate)\nWhen might you sample the entire population?\n  When your population is very small\n  When you have extensive resources\n  When you don't expect a very high response" }
    status: unverified
    tags: [high-yield]
  - id: res.L11.010
    kind: enumerate
    topic: population
    prompt: When might you sample the entire population?
    points:
      - When the population is very small
      - When you have extensive resources
      - When you don't expect a very high response
    pass: 3
    hook: "تاخد الكل في 3 حالات «صغير، غني، ومش هيردّوا»: population very small، extensive resources، ومش متوقع very high response."
    src: { page: 12, quote: "3 factors that influence sample representativeness\n  Sampling procedure\n  Sample size\n  Participation (response rate)\nWhen might you sample the entire population?\n  When your population is very small\n  When you have extensive resources\n  When you don't expect a very high response" }
    status: unverified
  - id: res.L11.011
    kind: order
    topic: population
    prompt: Put the stages of the sampling process in order.
    steps:
      - Define the population of concern
      - Specify a sampling frame
      - Specify a sampling method
      - Determine the sample size
      - Implement the sampling plan
      - Sample and collect the data
    src: { page: 13, quote: "Process of sampling\nThe sampling process comprises several stages:\n  Defining the population of concern\n  Specifying a sampling frame, a set of persons, units or events possible to measure\n  Specifying a sampling method for selecting individuals or events from the frame\n  Determining the sample size\n  Implementing the sampling plan\n  Sampling and data collecting" }
    status: unverified
    tags: [high-yield]
  # ---------------- probability (slides 14-47) ----------------
  - id: res.L11.012
    kind: card
    topic: probability
    front: What are the two main categories of sampling?
    back: Probability and non-probability sampling.
    src: { page: 14, quote: "There are two main categories of sampling, probability and nonprobability." }
    status: unverified
  - id: res.L11.013
    kind: card
    topic: probability
    front: Define probability sampling.
    back: >-
      Each unit of the sample is chosen on the basis of chance: every unit of the study population has an equal, or at
      least a known, chance of being included. This requires selecting subjects at random (randomization).
    src: { page: 15, quote: "Each unit of the sample is chosen on the basis of chance. All units of the study population should have an equal, or at least a known chance of being included in the sample.\nThat guarantee requires subjects to be selected at random, or that randomization be employed." }
    status: unverified
    tags: [high-yield]
  - id: res.L11.014
    kind: card
    topic: probability
    front: What is a sampling frame, and how is it usually defined?
    back: >-
      The portion of the population from which the sample is selected, usually defined by geographical listings, maps,
      directories, membership, hospital admission lists or other kinds of lists.
    src: { page: 16, quote: "The portion of the population from which a sample is to be selected.\nUsually defined by geographical listings, maps, directories, membership, hospital admission list or other kinds of lists." }
    status: unverified
  - id: res.L11.015
    kind: card
    topic: probability
    front: What is simple random sampling?
    back: Like a lottery, it gives everyone in the population an equal chance of being picked for the sample.
    src: { page: 17, quote: "This is similar to lottery method that provides everyone in the population the equal chance to be picked as sample." }
    status: unverified
  - id: res.L11.016
    kind: enumerate
    topic: probability
    prompt: Enumerate the methods of simple random sampling.
    points:
      - Lottery method (the "fishbowl" technique)
      - Tables of random numbers
      - Computer software
    pass: 3
    hook: "الـ simple random بـ 3 أدوات «ورق، جدول، كمبيوتر»: lottery method، tables of random numbers، computer software."
    src: { page: 21, quote: "Applicable for small, homogenous and readily available populations\nA sampling frame is essential\nMethods of Simple random sampling:\n  Lottery method (Ideal bowel technique)\n  Tables of random numbers\n  Computer software." }
    status: unverified
  - id: res.L11.017
    kind: mcq
    topic: probability
    stem: Simple random sampling is best suited to which population?
    options:
      - A small, homogeneous and readily available population with a sampling frame
      - A large, heterogeneous population with known subgroup proportions
      - A population with no list of its members
      - A population scattered over a whole country
    answer: 0
    why:
      - "Slide 21: applicable for small, homogeneous, readily available populations, and a sampling frame is essential."
      - A large heterogeneous population with known strata calls for stratified sampling.
      - Without a list there is no sampling frame, which simple random sampling needs.
      - A scattered population is cheaper to reach by cluster or multistage sampling.
    src: { page: 21, quote: "Applicable for small, homogenous and readily available populations\nA sampling frame is essential\nMethods of Simple random sampling:\n  Lottery method (Ideal bowel technique)\n  Tables of random numbers\n  Computer software." }
    status: unverified
  - id: res.L11.018
    kind: card
    topic: probability
    front: What is systematic sampling?
    back: >-
      Individuals are chosen at regular intervals (for example every fifth) from the sampling frame. Ideally a random number
      tells us where to start. A sampling frame is essential.
    src: { page: 22, quote: "In SYSTEMATIC sampling individuals are chosen at regular intervals (for example every fifth) from the sampling frame.\nIdeally we randomly select a number to tell us where to start selecting individuals from the list.\nA sampling frame is essential" }
    status: unverified
    tags: [high-yield]
  - id: res.L11.019
    kind: case
    topic: probability
    stem: A systematic sample of 100 is to be selected from the 1200 students of a school.
    steps:
      - question: What is the sampling fraction?
        options: ["100/1200 (1 in 12)", "1200/100", "100/1100", "1/100"]
        answer: 0
        why: Sampling fraction = sample size / study population = 100/1200.
      - question: What is the sampling interval?
        options: ["12", "100", "1/12", "1200"]
        answer: 0
        why: Interval K = population / sample = 1200 / 100 = 12.
      - question: The random start, picked blindly from papers numbered 1-12, is 6. Which students are selected?
        options: ["6, 18, 30, 42 ... until 100 are selected", "6, 12, 18, 24 ...", "1, 13, 25, 37 ...", "Every 6th student"]
        answer: 0
        why: Start at 6 and add the interval 12 each time.
    src: { page: 24, quote: "The sampling interval is, therefore, 12. The number of the first student to be included in the sample is chosen randomly, for example by blindly picking one out of twelve pieces of paper, numbered 1- 12.\nif number 6 is picked, then every twelfth student will be included in the sample, starting with student number 6, until 100 students are selected: then numbers selected would be 6, 18, 30, 42, etc." }
    status: unverified
    tags: [high-yield, numbers]
  - id: res.L11.020
    kind: cloze
    topic: probability
    text: >-
      In systematic sampling, the sampling interval K = total number of units in the {{c1::population}} / total number of
      units in the {{c2::sample}}, and every Kth unit on the list is chosen.
    src: { page: 28, quote: "Based on sampling fraction: Every Kth unit is chosen in the population list, where K is chosen by sampling interval\nSampling Interval (K) Q = Total no. of units in population/ total no. of units in sample\nApplicable for large populations where complete list of individuals is available" }
    status: unverified
  - id: res.L11.021
    kind: mcq
    topic: probability
    stem: >-
      From a list of N = 100, a systematic sample of n = 20 is wanted. The random number chosen from 1-5 is 4. Which
      units are taken?
    options: ["4, 9, 14, 19 ... (every 5th from 4)", "4, 8, 12, 16 ...", "1, 6, 11, 16 ...", "5, 10, 15, 20 ..."]
    answer: 0
    why:
      - N/n = 100/20 = 5, so start at 4 and take every 5th unit.
      - That uses an interval of 4, the random start, not N/n.
      - That starts at 1, not at the chosen number 4.
      - That ignores the random start and so is not random at all.
    src: { page: 25, quote: "Systematic Random Sampling\nN = 100\nwant n = 20\nN/n = 5\nselect a random number from 1-5: chose 4\nstart with #4 and take every 5th unit" }
    status: unverified
    tags: [numbers]
  - id: res.L11.022
    kind: card
    topic: probability
    front: What is the advantage and the risk of systematic sampling compared with simple random sampling?
    back: >-
      It is usually less time-consuming and easier. But there is a risk of bias when the sampling interval coincides with a
      systematic variation in the sampling frame (e.g. counting clinic attendance every 7 days: all days fall on the same
      weekday, which might be market day).
    src: { page: 27, quote: "Systematic sampling is usually less time consuming and easier to perform than simple random sampling. However, there is a risk of bias, as the sampling interval may coincide with a systematic variation in the sampling frame.\nFor instance, if we want to select a random sample of days on which to count clinic attendance, systematic sampling with a sampling interval of 7 days would be inappropriate, as all study days would fall on the same day of the week, which might, for example, be market day." }
    status: unverified
    tags: [high-yield]
  - id: res.L11.023
    kind: mcq
    topic: probability
    stem: >-
      To count clinic attendance, a researcher picks study days by systematic sampling with an interval of 7 days. What is
      the problem?
    options:
      - Every study day falls on the same weekday, so the interval matches a systematic variation
      - Systematic sampling needs no sampling frame
      - The sample will be too large
      - Systematic sampling cannot use a random start
    answer: 0
    why:
      - If that weekday is market day, attendance is biased; the interval coincides with the weekly cycle.
      - It does need a sampling frame (slide 22).
      - The interval sets which days are picked, not an excessive size.
      - A random start is the ideal way to begin a systematic sample.
    src: { page: 27, quote: "Systematic sampling is usually less time consuming and easier to perform than simple random sampling. However, there is a risk of bias, as the sampling interval may coincide with a systematic variation in the sampling frame.\nFor instance, if we want to select a random sample of days on which to count clinic attendance, systematic sampling with a sampling interval of 7 days would be inappropriate, as all study days would fall on the same day of the week, which might, for example, be market day." }
    status: unverified
  - id: res.L11.024
    kind: card
    topic: probability
    front: For which population is systematic sampling applicable?
    back: Large populations where a complete list of individuals is available.
    src: { page: 28, quote: "Based on sampling fraction: Every Kth unit is chosen in the population list, where K is chosen by sampling interval\nSampling Interval (K) Q = Total no. of units in population/ total no. of units in sample\nApplicable for large populations where complete list of individuals is available" }
    status: unverified
  - id: res.L11.025
    kind: card
    topic: probability
    front: Which weakness of simple random sampling does stratified sampling fix?
    back: >-
      Small groups the researcher is interested in may hardly appear in a simple random sample. When the sample must include
      representative units of small groups (urban and rural residents, religious or ethnic groups), stratify.
    src: { page: 29, quote: "The simple random sampling method has a disadvantage that small groups in which the researcher is interested may hardly appear in the sample.\nIf it is important that the sample includes representative study units of small groups with specific characteristics (for example, residents from urban and rural areas, or different religious or ethnic groups)," }
    status: unverified
  - id: res.L11.026
    kind: card
    topic: probability
    front: Define stratified sampling and its precondition.
    back: >-
      Dividing the population into smaller groups (strata) and randomly sampling from each. It is only possible when we know
      what proportion of the study population belongs to each group.
    src: { page: 30, quote: "Dividing up the population into smaller groups (Strata) , and randomly sampling from each group.\nStratified sampling is only possible when we know what proportion of the study population belongs to each group we are interested in." }
    status: unverified
    tags: [high-yield]
  - id: res.L11.027
    kind: case
    topic: probability
    stem: >-
      A grant supports a survey of 200 staff members of the Faculty of Medicine. The population is 1000: 700 males and 300
      females.
    steps:
      - question: With proportional allocation, how many females and males are selected?
        options: ["60 females and 140 males", "100 females and 100 males", "30 females and 70 males", "300 females and 700 males"]
        answer: 0
        why: Each stratum keeps its share of the population, 30% and 70% of 200 = 60 and 140.
      - question: With disproportional (equal) allocation, how many of each?
        options: ["100 females and 100 males", "60 females and 140 males", "150 females and 50 males", "200 of each"]
        answer: 0
        why: Equal allocation takes the same number from each stratum, 100 + 100 = 200.
      - question: In the equal-allocation sample, what must the analysis do?
        options:
          - Weight the data so males get proportionally more weight, because females are overrepresented
          - Nothing, because random selection removes the imbalance
          - Drop 40 females to restore the proportion
          - Report the females only
        answer: 0
        why: Each female had a much higher chance of selection, so weighting restores the population's proportions.
    src: { page: 34, quote: "This approach creates an adequate sample size, but it presents problems for data analysis because the characteristics of one group (in this case, the females) will be overrepresented in the sample.\nFortunately, this effect can be controlled by weighting the data so the males receive a proportionally larger mathematical representation in the analysis of scores than the females." }
    status: unverified
    tags: [high-yield, numbers]
  - id: res.L11.028
    kind: mcq
    topic: probability
    stem: >-
      In a population of 1000 (30% females, 70% males), a stratified sample of 200 is drawn in proportion to each
      category. How many females are selected?
    options: ["60", "30", "100", "140"]
    answer: 0
    why:
      - 30% of 200 = 60 females (and 140 males).
      - 30 is the percentage, not the number.
      - 100 is equal (disproportional) allocation.
      - 140 is the number of males.
    src: { page: 35, quote: "Calculating proportional weights involves determining the probability that any one male or female will be selected.\nFor example, In a population of 1000, sample of 200 is to be drawn based on the proportion of each category in the study population(30% females and 70% mares). Means that I will select randomly 60 females and 140 males." }
    status: unverified
    tags: [numbers]
  - id: res.L11.029
    kind: card
    topic: probability
    front: In a disproportional (equal-allocation) stratified sample, what is the problem and how is it solved?
    back: >-
      It gives an adequate size from each category, but the smaller group (e.g. females) is overrepresented, which causes
      problems in analysis. It is controlled by weighting the data so the larger group gets proportionally more weight.
    src: { page: 34, quote: "This approach creates an adequate sample size, but it presents problems for data analysis because the characteristics of one group (in this case, the females) will be overrepresented in the sample.\nFortunately, this effect can be controlled by weighting the data so the males receive a proportionally larger mathematical representation in the analysis of scores than the females." }
    status: unverified
  - id: res.L11.030
    kind: cloze
    topic: probability
    text: >-
      Proportional allocation: the sample from each stratum n(h) = n x N(h) / N. With 1,600 students to draw from 20,031,
      the first year (5,000 students) gets {{c1::399}} and the fourth year (6,296) gets {{c2::503}}.
    src: { page: 36, quote: "Table 1 Proportional allocation of 1,600 students to four strata defined by college year\n| Year | Population Size: Total Enrollment | Sample Size: nh = nNh/N | Sample Size: Rounded Values |\n|---|---|---|---|\n| First | 5,000 | 399.4 | 399 |\n| Second | 4,058 | 324.1 | 324 |\n| Third | 4,677 | 373.6 | 374 |\n| Fourth | 6,296 | 502.9 | 503 |\n| Total | 20,031 | 1,600.0 | 1,600 |" }
    status: unverified
    tags: [numbers]
  - id: res.L11.031
    kind: enumerate
    topic: probability
    prompt: Summarize stratified random sampling (how, when, and why it is better).
    points:
      - A non-homogeneous population is converted into homogeneous groups (strata) and a random sample is drawn from each, in proportion to its size
      - Applicable for large non-homogeneous populations
      - Gives a more representative sample than simple random sampling
      - None of the categories is under- or over-represented
    pass: 3
    hook: "الـ stratified في 4: «قسّم، كبير ومتلخبط، أمثل، ومحدش مظلوم» = homogeneous strata، large non-homogeneous، more representative من الـ simple random، none under- or over-represented."
    src: { page: 37, quote: "Non-homogenous population is converted to homogenous groups/classes (strata); sample is drawn from each strata at random, in proportion to its size\nApplicable for large non-homogenous population\nGives more representative sample than simple random sampling\nNone of the categories is under or over-represented" }
    status: unverified
    tags: [high-yield]
  - id: res.L11.032
    kind: card
    topic: probability
    front: When is cluster sampling used instead of simple random sampling?
    back: >-
      When a complete sampling frame of the units does not exist, or logistics make random sampling of individuals hard
      (people scattered over a large area). If a list of groupings (villages, schools) exists or is easy to compile, some
      groupings are selected at random.
    src: { page: 39, quote: "However, when a list of groupings of study units is available (e.g., villages or schools) or can be easily compiled, a number of these groupings can be randomly selected.\nThe selection of groups of study units (clusters) instead of the selection of study units individually is called CLUSTER SAMPLING." }
    status: unverified
  - id: res.L11.033
    kind: card
    topic: probability
    front: Define cluster sampling.
    back: >-
      Selecting groups of study units (clusters) at random instead of individual units. The population is divided into
      clusters that are externally homogeneous but internally heterogeneous: each cluster is a mini-representation of the
      whole population.
    src: { page: 40, quote: "Cluster sampling is a sampling method in which the entire population of the study is divided into externally homogeneous but internally heterogeneous groups called clusters. Essentially, each cluster is a mini-representation of the entire population." }
    status: unverified
    tags: [high-yield]
  - id: res.L11.034
    kind: table
    topic: probability
    title: Strata versus clusters
    columns: [Feature, Strata, Clusters]
    rows:
      - [Inside each group, Homogeneous, Heterogeneous (a mini-population)]
      - [Between groups, Different, Similar to each other]
      - [What is sampled at random, Units from every stratum, Some whole clusters]
    blanks: [[0, 1], [0, 2], [2, 2]]
    src: { page: 40, quote: "Cluster sampling is a sampling method in which the entire population of the study is divided into externally homogeneous but internally heterogeneous groups called clusters. Essentially, each cluster is a mini-representation of the entire population." }
    status: unverified
    tags: [high-yield]
  - id: res.L11.035
    kind: card
    topic: probability
    front: What units are clusters usually, and give the slide's example?
    back: >-
      Geographic units (districts, shiakhat, villages) or organizational units (clinics, health facilities, schools). In a
      family-planning KAP study in rural communities, all villages are listed, a random sample of villages is chosen, and
      all study units in those villages are interviewed.
    src: { page: 42, quote: "Clusters are often:\n  geographic units (e.g., districts, shiakhat, villages) or\n  organizational units (e.g., clinics, heath facilities, schools).\nFor example, in a KAP study related to family planning in rural communities of a region, a list is made of all the villages. Using this list, a random sample of villages is chosen and all study units in the selected villages are interviewed." }
    status: unverified
  - id: res.L11.036
    kind: table
    topic: probability
    title: Cluster sampling
    columns: [Side, Points]
    rows:
      - [Advantages, "Cuts the cost of preparing a sampling frame; reduces travel and other administrative costs"]
