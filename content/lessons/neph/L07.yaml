        title: "مين بيضرب فين؟"
        alt: "Drug target map for ADPKD. Vasopressin on the V2 receptor raises cAMP, blocked by tolvaptan (TEMPO and REPRISE: slower decline). Somatostatin receptors lower cAMP in kidney and liver, used by octreotide, lanreotide and pasireotide (kidney growth halts for a year, liver volume falls 4 to 6 percent). mTOR drives growth, blocked by sirolimus and everolimus (worked in rodents, no benefit in two large human trials)."
