  - id: res.L03.lesson7
    title: "الفرضية والعنوان"
    hook: "الفرضية تنبؤ بتراهن عليه، والعنوان هو أول حاجة المراجع هيقراها. الاتنين لازم يبقوا محددين."
    minutes: 9
    pages: [66, 84]
    topics: [hypotheses, title]
    goals:
      - "تعرّف الـ hypothesis وتعرف إمتى بنحتاجها"
      - "تفرّق بين null و directional و non-directional"
      - "تكتب عنوان 10–12 كلمة من غير كلام زيادة ولا اختصارات"
    status: unverified
    steps:
      - kind: explain
        page: 66
        quote: "a prediction or explanation of the relationship between two or more variables"
        title: "يعني إيه hypothesis؟"
        text: |
          الـ ==hypothesis== هي **a prediction or explanation of the relationship between two or more variables**.

          بتترجم الـ problem statement لتنبؤ **precise, unambiguous** بالنتيجة المتوقعة.

          وبتتكتب **from the research question before the start of the study**، وبتوجّه: الـ study design، الـ population، الـ data اللي هتتجمع، والـ analysis. ومعاييرها هي نفس **PICOT**.
      - kind: reveal
        page: 66
        quote: "Hypothesis statements are most applicable for analytic and intervention or evaluative studies."
        prompt: "ليه الـ descriptive study عادةً مش محتاجة hypothesis؟"
        answer: |
          لأن الـ hypothesis بتتنبأ بـ **relationship between variables**، والـ descriptive أو exploratory studies **generally do not test relationships between variables**.

          علشان كده الـ hypotheses ==most applicable for analytic and intervention (evaluative) studies==.
      - kind: explain
        page: 69
        quote: "Post-menopausal women who received hormone replacement therapy, (of a specified type and duration), are more likely to develop endometrial cancer"
        title: "من سؤال لفرضية"
        text: |
          - **Question:** Does post-menopausal HRT predispose women to develop endometrial cancer
          - **Hypothesis:** Post-menopausal women who received HRT (of a specified type and duration) are ==more likely to develop endometrial cancer== than those who did not.

          السؤال بيسأل، والفرضية بتراهن على إجابة.
      - kind: figure
        page: 72
        quote: "Null: There will be no difference in scores on Hudson’s self-esteem scale between men and women."
        title: "التلات أنواع"
        alt: "Three stacked panels comparing men and women on a self-esteem score. Null: two equal bars with an equals sign. Non-directional: two bars with a not-equal sign and a question mark over which is higher. Directional: women's bar higher with a greater-than sign."
        caption: "Null = مفيش فرق. Non-directional = فيه فرق بس مش قايل مين أعلى. Directional = فيه فرق وقايل اتجاهه."
        svg: |
          <svg viewBox="0 0 330 390" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="20" class="t-b">Null</text>
            <rect x="10" y="28" width="310" height="100" rx="8" class="fg-box"/>
            <rect x="60" y="58" width="50" height="60" class="fg-acc"/>
            <rect x="200" y="58" width="50" height="60" class="fg-good"/>
            <text x="155" y="95" text-anchor="middle" class="t-lg t-b">=</text>
            <text x="85" y="52" text-anchor="middle" class="t-sm">Men</text>
            <text x="225" y="52" text-anchor="middle" class="t-sm">Women</text>
            <text x="10" y="150" class="t-b">Non-directional</text>
            <rect x="10" y="158" width="310" height="100" rx="8" class="fg-box"/>
            <rect x="60" y="188" width="50" height="60" class="fg-acc"/>
            <rect x="200" y="188" width="50" height="60" class="fg-good"/>
            <text x="155" y="225" text-anchor="middle" class="t-lg t-b">≠</text>
            <text x="225" y="182" text-anchor="middle" class="t-sm">which is higher? not said</text>
            <text x="10" y="280" class="t-b">Directional</text>
            <rect x="10" y="288" width="310" height="100" rx="8" class="fg-box"/>
            <rect x="60" y="338" width="50" height="40" class="fg-acc"/>
            <rect x="200" y="308" width="50" height="70" class="fg-good"/>
            <text x="155" y="360" text-anchor="middle" class="t-lg t-b">&lt;</text>
            <text x="85" y="332" text-anchor="middle" class="t-sm">Men</text>
            <text x="270" y="330" class="t-sm t-b">Women</text>
            <text x="270" y="346" class="t-sm t-b">higher</text>
          </svg>
      - kind: sort
        page: 72
        quote: "Nondirectional: There will be a difference by gender in Hudson’s self-esteem scale scores."
        prompt: "صنّف كل فرضية:"
        bins: ["Null", "Non-directional", "Directional"]
        cards:
          - { text: "There will be no difference in self-esteem scores between men and women", bin: 0 }
          - { text: "Shisha smokers and non-smokers will not differ in FEV1", bin: 0 }
          - { text: "There will be a difference by gender in self-esteem scores", bin: 1 }
          - { text: "Residents' and consultants' burnout scores will differ", bin: 1 }
          - { text: "Women will have higher self-esteem scores than men", bin: 2 }
          - { text: "Children of fathers who smoke >20 cigarettes/day have lower birth weight", bin: 2 }
        why: "مفيش فرق = **null**. فيه فرق من غير اتجاه = **non-directional**. فيه فرق واتجاهه مكتوب (higher/lower) = **directional**."
      - kind: check
        page: 74
        quote: "Motorcycle riders who wear helmets sustain fewer injuries."
        question: "(Lecture quiz) \"Motorcycle riders who wear helmets sustain fewer injuries.\" Research question or research hypothesis?"
        options:
          - "Research hypothesis"
          - "Research question"
          - "Neither of these"
          - "Both of these"
        answer: 0
        why:
          - "صح: جملة بتتنبأ بعلاقة (helmet ← fewer injuries). إجابة الـ quiz."
          - "مفيهاش علامة استفهام ولا بتسأل."
          - "هي تنبؤ واضح وقابل للاختبار."
          - "الجملة يا سؤال يا عبارة."
      - kind: aside
        tone: trap
        page: 74
        quote: "A hypothesis is commonly used in quantitative studies, but is not appropriate for qualitative studies."
        text: |
          الـ quiz بيقول: "A hypothesis is commonly used in quantitative studies, but is not appropriate for qualitative studies." والإجابة: ==False==.

          وسؤال تاني: لو بتعمل **predictive statement**، تستخدم إيه؟ ==Hypothesis==.
      - kind: table
        page: 73
        quote: "To investigate the clinical efficacy of LIPUS in the management of patellar tendinopathy symptoms."
        title: "سؤال، فرضية، هدف: دراسة واحدة منشورة (LIPUS)"
        columns: ["Part", "In the study"]
        rows:
          - ["Research question", "How does LIPUS compare with a placebo device in managing the symptoms of patellar tendinopathy?"]
          - ["Hypothesis", "Pain is reduced with daily active LIPUS for 12 weeks compared with inactive LIPUS (placebo)"]
          - ["Objective", "To investigate the clinical efficacy of LIPUS in the management of patellar tendinopathy symptoms"]
        hide: [[1, 1], [2, 1]]
      - kind: explain
        page: 80
        quote: "A good title should be short, accurate, and concise"
        title: "وأخيرًا: العنوان"
        text: |
          دلوقتي تقدر تكتب العنوان. لازم يكون **in line with your general objective** ويقول للقارئ الدراسة عن إيه وهتتعمل فين.

          - ==short, accurate, and concise==، وعمومًا ==10–12 words==.
          - يوضّح الـ **central objectives and variables** والـ **population**.
          - من غير كلام زيادة زي **"Observations on"** أو **"A study of"**.
          - ==No abbreviations==.
      - kind: check
        page: 82
        quote: "Unnecessary words, not clear or specific, no population or place"
        question: "Which title would the lecture accept?"
        options:
          - "Prevalence and risk factors of iron deficiency anaemia among school children in Alexandria"
          - "A study on iron deficiency anaemia"
          - "Assessment of quality of medical care provided to IHD patients"
          - "Observations on attendants of dermatology outpatient clinic regarding age, sex, marital status, residence and socioeconomic status"
        answer: 0
        why:
          - "صح: clear، specific، مفيش كلام زيادة، وفيه population و place."
          - "كلام زيادة (A study on)، مش specific، ومفيش population ولا place."
          - "فيه abbreviation (IHD)، وناقصه المكان."
          - "Specific بس مش concise: طويل وفيه unnecessary words."
      - kind: try
        items: [res.L03.083, res.L03.089, res.L03.094, res.L03.099]
    recap:
      - "Hypothesis = prediction of the relationship between two or more variables، بتتكتب من السؤال قبل الدراسة."
      - "مناسبة للـ analytic و intervention studies؛ الـ descriptive عادةً من غيرها."
      - "Null = no difference. Non-directional = difference من غير اتجاه. Directional = difference واتجاهه."
      - "Predictive statement = hypothesis. Quiz: hypothesis \"not appropriate for qualitative\" = False."
      - "العنوان: in line with the general objective، 10–12 كلمة، population و place، من غير A study of ولا اختصارات."
    practice: [res.L03.083, res.L03.084, res.L03.085, res.L03.086, res.L03.087, res.L03.088, res.L03.089, res.L03.090, res.L03.091, res.L03.092, res.L03.093, res.L03.094, res.L03.095, res.L03.096, res.L03.097, res.L03.098, res.L03.099, res.L03.100, res.L03.101, res.L03.102, res.L03.103, res.L03.104, res.L03.029]
