  - id: endo.L01.lesson8
    title: "علاج MEN 2: نشيل الدرقية بدري، ونحافظ على الـ cortex"
    hook: "في MEN 2 بنعمل عملية لطفل سليم شكلًا، وبنشيل نص الـ adrenal بس. كل قرار هنا ليه سبب."
    minutes: 9
    pages: [11, 12]
    topics: [men2-treatment, mixed]
    goals:
      - "تعرف علاج الـ MTC في الأطفال والكبار وليه الـ central LN dissection"
      - "تعرف ليه بنشيل الـ adrenal المصابة بس، وإمتى cortical-sparing"
      - "تعرف الـ mixed syndromes"
    status: unverified
    steps:
      - kind: explain
        page: 11
        quote: "In adults with MTC > 1 cm in size metastases to the regional lymph nodes are common (> 75%), total thyroidectomy with central lymph node dissection."
        title: "علاج MEN 2: الـ MTC"
        text: |
          - في 2B الـ MTC ==aggressive== وبيظهر في الـ 3rd أو 4th decade، فالـ **prophylactic thyroidectomy** advisable مع الـ mucosal neuromas.
          - **الأطفال اللي شايلين الجين**: early thyroidectomy + central lymph node dissection بعد اكتشاف المتلازمة على طول (general consensus).
          - **الكبار مع MTC أكبر من 1 cm**: الـ nodal mets أكتر من **75%**، فـ ==total thyroidectomy + central lymph node (LN) dissection==.
          - Extensive local mets: external irradiation (مش شافي). Chemo (adriamycin، vincristine، cyclophosphamide، dacarbazine) للـ palliation.

          ليه بنعمل عملية لطفل الدرقية بتاعته شكلها سليم؟ لأن الجين بيقول إن الـ MTC جاي في **أكتر من 90%**، والـ MTC بينتشر للـ lymph nodes بدري (أكتر من **75%** لما يعدّي 1 cm). يعني لو استنينا الـ nodule، هنكون اتأخرنا. وليه **central** LN dissection؟ لأن الـ central compartment هو أول محطة للـ drainage بتاع الدرقية.
      - kind: update
        page: 11
        quote: "Early thyroidectomy for MTC. A general consensus to do this operation in children who carry the mutant gene and central lymph node dissection performed soon after identification of the syndrome."
        text: "الكتاب بيقول thyroidectomy بدري + central LN dissection لكل طفل شايل الجين. الـ American Thyroid Association (ATA) 2015 بتحدد التوقيت حسب الـ codon: **codon 918 (MEN 2B)** في أول سنة من العمر؛ **codon 634** في سن **5** أو قبلها حسب الـ calcitonin؛ والـ **moderate risk** لما الـ calcitonin يبدأ يعلى، مع متابعة calcitonin و neck ultrasound من سن 5 لحد كده. والـ central neck dissection في الـ high risk بس لو الـ calcitonin أعلى من **40 pg/mL** أو في nodes مشكوك فيها، عشان نحمي الـ parathyroids. في الامتحان اكتب إجابة الكتاب."
        ref: "ATA revised guidelines for the management of medullary thyroid carcinoma (Wells et al., Thyroid 2015)"
      - kind: update
        page: 11
        quote: "Chemotherapy with combination of Adriamycin, vincristine, cyclophosphamide, and dacarbazine may provide palliation."
        text: "الكتاب بيدّي chemo (adriamycin، vincristine، cyclophosphamide، dacarbazine) للـ palliation بس. دلوقتي في الـ metastatic MTC اللي بيكبر أو عامل أعراض، الـ **kinase inhibitors** خدوا مكان الـ chemo: **vandetanib** (US Food and Drug Administration (FDA) 2011) أو **cabozantinib** (FDA 2012)، والـ selective inhibitor **selpercatinib** (FDA 2020) للأورام اللي فيها mutation في جين الـ MEN 2. في الامتحان اكتب إجابة الكتاب."
        ref: "ATA revised guidelines for the management of medullary thyroid carcinoma (Wells et al., Thyroid 2015); FDA approval of selpercatinib 2020"
      - kind: explain
        page: 11
        quote: "Pheochromocytoma: In spite of the possibility of malignancy ( < 15 reported cases ), the high probability of developing pheochromocytoma in the apparently unaffected gland over an 8 -10-year period, and the risk of adrenal insufficiency, yet most clinicians recommend removal of the affected gland."
        title: "علاج الـ pheo"
        text: |
          معظم الدكاترة بيشيلوا ==الغدة المصابة بس==:
          - الـ malignancy نادرة (أقل من 15 حالة متسجلة).
          - الغدة التانية احتمال تعمل pheo خلال 8–10 سنين، بس شيل الاتنين = خطر **adrenal insufficiency**.
          - لو شلنا الاتنين: **glucocorticoids + mineralocorticoids** mandatory.
          - ==Cortical-sparing adrenalectomy==: نشيل الـ pheo والـ medulla ونسيب الـ cortex، فمفيش steroid replacement، بس الـ pheo ممكن يرجع في نسبة صغيرة.

          ليه الـ pheo بيرجع بعد الـ cortical-sparing؟ التفسير المقبول (مش في الكتاب): لأن حتة صغيرة من الـ medulla ممكن تفضل ملزوقة في الـ cortex، وهي شايلة نفس الجين. يعني ده تمن بنقبله عشان نوفّر على المريض steroids طول العمر.
