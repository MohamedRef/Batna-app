  - id: neph.L09.lesson5
    title: "الـ peritoneal dialysis: البطن كفلتر"
    hook: "متر مربع واحد من الـ peritoneum، بس الـ microvilli بتخليه 40. والسحر كله في السكر."
    minutes: 9
    pages: [311, 314]
    topics: [pd-principles, pd-solutions]
    goals:
      - "تفهم الـ peritoneum كغشا والـ three-pore model"
      - "تعرف تركيب المحلول وليه السكر مشكلة"
      - "تعرف البدايل (icodextrin والـ amino acids) وامتى كل واحد"
    status: unverified
    steps:
      - kind: explain
        page: 311
        title: "الغشا"
        quote: "Semipermeable membrane is: peritoneam The size of the peritoneum is one square metre, which, compared to the surface of a filter for haemodialysis, is small. In addition, only the visceral parts (representing around 10-15%) are relevant for dialysis. However, the microvilli, small blebs and fingers of the mesothelial surface, increase it by a factor of 40 During the first weeks of dialysis the peritoneum often looses microvilli and to a greater extent the mesothelial cells. EDTNA|ERCA JOURNAL 2005 XXXI 3"
        text: |
          الـ peritoneum حوالي ==1 m²==، وده صغير جنب فلتر الـ haemodialysis (HD). والـ **visceral part** بس (10–15%) هو اللي بيشتغل، بس الـ microvilli بتكبّره **40 مرة**. وفي أول أسابيع الـ peritoneal dialysis (PD) بيخسر microvilli و mesothelial cells.

          **الطريقة**: diffusion و convection و ==osmosis==. المحلول يقعد (dwell)، يتصرف (effluent)، وييجي غيره. الـ **osmotic gradient** هو اللي بيسحب المية والـ solutes.

          ليه الـ visceral بس هو اللي بيشتغل؟ التفسير المقبول (مش في الكتاب): الغسيل بيحصل بين **الدم في الـ capillaries** والمحلول، والـ capillaries كتير في الـ visceral (حوالين الأمعاء والـ mesentery). والـ parietal على الجدار أقل في الأوعية. وليه الـ microvilli مهمة؟ لأنها بتكبّر المساحة اللي المحلول بيلمسها. ولما الـ microvilli والـ mesothelium يضيعوا بالسنين من السكر والـ peritonitis، الغشا بيتليف، وده بداية الـ UF failure.

          وليه الـ osmosis بالذات في الـ PD؟ التفسير المقبول (مش في الكتاب): في الـ HD الماكينة بتعمل **ضغط** (TMP) يسحب المية. في البطن ما ينفعش تعمل ضغط، فالبديل **مادة بتشد المية**: الـ glucose بتركيز عالي. وده سبب إن السكر في قلب الـ PD، وسبب كل مشاكله: المية بتتسحب طول ما الـ glucose في البطن أعلى من الدم، وبعد ما يتمص المية ترجع.
      - kind: figure
        page: 311
        quote: "Fig.2. A schematic representation of the pathways of peritoneal fluid transport. From: Coester AM et al. NDT Plus 2009;2:104-110."
        title: "الـ 3-pore model زي ما الكتاب رسمه"
        image: { file: neph/L09-three-pore.webp, book: true }
        alt: "Diagram of fluid transport according to the 3-pore model: a peritoneal capillary on the left, the interstitium in the middle and the mesothelial cell layer and peritoneal cavity on the right; arrows show small-pore transport about 60 percent, free-water transport about 40 percent through the endothelial cell, and occasional large-pore transport, together making transcapillary ultrafiltration."
        caption: |
          الطريق اللي الميه بتمشيه من الدم للبطن:

          - **على الشمال**: الـ **peritoneal capillary** (الدايرة) بالـ endothelial cell والـ basement membrane.
          - **في النص**: الـ interstitium اللي الميه لازم تعدّيه.
          - **على اليمين**: الـ mesothelial cells وبعدها الـ peritoneal cavity.
          - **الأسهم من فوق لتحت**: ==SPT== (small pores، حوالي 60%)، و **FWT** (free water من الـ aquaporins في خلية الـ endothelium نفسها، حوالي 40%)، و **LPT** (large pores، قليل). التلاتة مع بعض = ==TCUF==.

          اللي تاخده: الـ aquaporin بيعدّي ميه بس من غير أملاح، وده سبب الـ sodium sieving في أول الـ dwell.
      - kind: table
        page: 312
        quote: "SPT small pore transport, FWT free water transport( aquaporin).LPT large pore transport (LP occurs occasional) TCUF :transcapillary UF. Aquaporins allows water but not of solutes with radii exceeding 5 Ǻ Kidney Int 1991; 40: 315–325."
        title: "الـ three-pore model"
        columns: [Pore, What passes]
        rows:
          - ["Small pores (SPT)", "Water + small solutes"]
          - ["Aquaporins (FWT)", "Free water only"]
          - ["Large pores (LPT)", "Macromolecules, occasional"]
        hide: [[1, 1], [2, 1]]
      - kind: explain
        page: 312
        title: "ليه تلات أنواع مسام؟"
        quote: "Aquaporins allows water but not of solutes with radii exceeding 5"
        text: |
          الكتاب: ==SPT== = small pore transport، **FWT** = free water transport (aquaporin)، **LPT** = large pore transport (occasional)، و TCUF = transcapillary UF. والـ **aquaporins** بتعدّي مية بس، مش solutes أكبر من 5 Å. وكمان صورة الـ **Tenckhoff catheter**، والمحلول ==شبه الـ interstitial fluid== بس **hypertonic** للبلازما علشان يسحب مية.

          ليه ده مهم؟ التفسير المقبول (مش في الكتاب):
          - في أول الـ dwell، السكر بيسحب **مية صافية** من الـ aquaporins، فالـ Na في المحلول يقل (sodium sieving)، وده دليل إن الـ aquaporins شغالة.
          - الـ small pores بتعدّي مية ومعاها urea و creatinine، فدي اللي بتعمل الـ clearance.
          - الـ large pores قليلة، بس هي اللي بيضيع منها **البروتين**، عشان كده عيان الـ PD بيخسر albumin.
          يعني لو الـ UF قل، اسأل: الـ aquaporins اتعطلت، ولا الـ gradient بيختفي بسرعة؟

          وإزاي الـ UF failure بيتشخّص من الفكرة دي؟ التفسير المقبول (مش في الكتاب): لو الـ **sodium sieving** اختفى (الـ Na في المحلول ما بيقلش في أول ساعة)، يبقى الـ aquaporins مش شغالة. لو الـ sieving موجود بس الـ UF قليل، يبقى المشكلة في إن الـ glucose بيتمص بسرعة (fast transporter). والفرق ده بيغيّر الحل: الأول غالبًا تليف في الغشا ومحتاج تحويل لـ HD، والتاني ممكن يتحل بـ dwells أقصر أو icodextrin.
      - kind: figure
        page: 312
        quote: "Tenckhoff catheter used in peritoneal dialysis."
        title: "الـ Tenckhoff catheter"
        image: { file: neph/L09-tenckhoff.webp, book: true }
        alt: "Side-view drawing of a Tenckhoff catheter passing from outside through skin, subcutaneous layer and muscle into the abdominal cavity among bowel loops, with two Dacron cuffs marked along its tunnel; the chest cavity is labelled at the top right."
        caption: |
          مقطع جانبي في البطن:

          - **فوق على اليمين**: الـ ==Tenckhoff catheter== طالع برّه الجسم.
          - **في النص**: بيعدّي من الـ **skin** والـ **subcutaneous layer** والـ **muscle**، وعليه ==اتنين Dacron cuffs== (الخطين اللي نازلين من كلمة Dacron cuff).
          - **تحت**: طرفه جوه الـ **abdominal cavity** بين الـ bowel loops.

          اللي تاخده: الـ cuffs بتمسك الـ catheter وبتقفل الطريق قدام البكتيريا من الجلد للبطن، والـ catheter نفسه 3 أجزاء: برّه، tunnel، وجوه.
      - kind: explain
        page: 313
        title: "المحلول والسكر"
        quote: "IP GLUCOSE: carbohydrate load: Truncal fattness, Dyslipidemia. All leads to Insulin resistance, New onset diabetes, CV disease. BrownleeM.Diabetes 2005, 541615-25."
        text: |
          محلول الـ PD شبه الـ interstitial fluid بس ==hypertonic== للبلازما علشان يسحب مية. فيه **lactate** 35–40 كـ buffer، و glucose 1.5–4.25 g/dL، و **pH 5.2–5.5**.

          العيان بيمص ==100–300 g glucose في اليوم== (30–100 kg في السنة!). النتيجة: تغيّر في الـ peritoneum، hyperglycaemia و superoxide، truncal obesity و dyslipidaemia، insulin resistance، new-onset diabetes، و cardiovascular (CV) disease. والـ glucose من البطن بيعمل hyperglycaemia و hyperinsulinaemia **أطول** من اللي بالبُق.

          ليه الـ pH واطي كده (5.2–5.5)؟ التفسير المقبول (مش في الكتاب): الـ glucose لو اتعقم بالحرارة في pH عادي بيتكسر ويعمل **glucose degradation products (GDP)**، والـ pH الحامض بيقلل ده. بس المحلول الحامض بيحرق الـ mesothelium. وليه الـ lactate مش bicarbonate؟ لأن الـ bicarbonate مع الـ Ca والـ Mg بيترسب في نفس الكيس (زي ما شفنا في الـ HD). فالحل الحديث أكياس بأوضتين بتتخلط وقت الاستعمال، وده اللي بيتسمى biocompatible.
      - kind: aside
