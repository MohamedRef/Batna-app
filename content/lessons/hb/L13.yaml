        title: "الـ variants: AIH بس فيها حاجة زيادة"
        text: |
          Table 2 فيه 4 variants. كلهم شبه الـ autoimmune hepatitis (AIH)، بس فيه حاجة زيادة بتلمّح لمرض قنوات:

          - ==AIH + primary biliary cholangitis (PBC)==: AIH features و **antimitochondrial antibody (AMA)** موجب.
          - ==AIH + primary sclerosing cholangitis (PSC)==: AIH features مع **CUC** (chronic ulcerative colitis)، و AMA سالب، و cholangiogram مش طبيعي.
          - ==Autoimmune cholangitis==: ANA و/أو SMA، و AMA سالب، ومفيش CUC، والـ cholangiogram طبيعي.
          - **Cryptogenic chronic hepatitis**: AIH features من غير autoantibodies خالص، مع HLA-B8 أو DR3.

          الـ histology في التلاتة الأولانيين **cholangitis**، وفي الـ cryptogenic interface hepatitis.

          العلاج كله **empirical**:

          - **AIH + PBC**: prednisone لوحده لو alkaline phosphatase (ALP) ≤ 2× normal؛ و prednisone + UDCA لو ALP > 2× و/أو **florid duct lesions**.
          - **AIH + PSC**: prednisone + UDCA لو ALP > 2× و/أو florid duct lesions.
          - **Autoimmune cholangitis**: prednisone و/أو UDCA (من غير شرط ALP).
          - **Cryptogenic chronic hepatitis**: الـ conventional AIH regimens.

          المنطق: الـ prednisone للجزء الـ hepatitic، والـ UDCA للجزء الـ cholestatic. كل ما الـ ALP يعلى، كل ما الـ cholestasis يبقى أوضح.
