  - id: endo.L04.lesson6
    title: "العضلات والدم والـ granulomas"
    hook: "عيل hypothyroid عضلاته ضخمة زي هرقل، بس ضعيف. والـ CK عالي. إمتى الـ CK بيعلى في أمراض الغدد؟"
    minutes: 8
    pages: [58, 64]
    topics: [myopathy, haematology, granulomatous, genetic-immune]
    goals:
      - "تعرف إمتى الـ CK بيعلى في الـ endocrine myopathy"
      - "تفرّق بين myopathy كل غدة"
      - "تعرف علاقة الغدد بالأنيميا والـ sarcoid والـ leprosy"
    status: unverified
    steps:
      - kind: explain
        page: 58
        quote: "Many endocrine disorders cause weakness. Muscle fatigue is more common than true myopathy. The cause of weakness is not well known. The serum CK is often normal (except in hypothyroidism & hypoparathyroidism & Conn s syndrome) & muscle histology is characterized by atrophy rather than the destruction of muscle fibers. Nearly, all endocrine myopathies respond to treatment."
        title: "قواعد الـ endocrine myopathy"
        text: |
          - الـ **fatigue** أشيع من الـ true myopathy.
          - الـ creatine kinase (CK) غالبًا ==طبيعي==، **إلا** في: hypothyroidism، hypoparathyroidism، و Conn's.
          - الـ histology: ==atrophy== مش destruction.
          - وكلهم تقريبًا ==بيتحسنوا بالعلاج==.
      - kind: mnemonic
        page: 58
        quote: "Many endocrine disorders cause weakness. Muscle fatigue is more common than true myopathy. The cause of weakness is not well known. The serum CK is often normal (except in hypothyroidism & hypoparathyroidism & Conn s syndrome) & muscle histology is characterized by atrophy rather than the destruction of muscle fibers. Nearly, all endocrine myopathies respond to treatment."
        word: "HHC"
        parts:
          - { key: "H", text: "Hypothyroidism" }
          - { key: "H", text: "Hypoparathyroidism (after tetany)" }
          - { key: "C", text: "Conn's syndrome (K depletion)" }
        hook: "«الـ CK بيقول HHC»: دول التلاتة اللي الـ CK فيهم بيعلى. أي endocrine myopathy تانية، الـ CK طبيعي."
      - kind: explain
        page: 59
        quote: "a) Proximal muscular weakness in about 1/3 of patients.\nb) Muscular camps, pain & stiffness.\nc) Slow muscular contraction in about 25 %of pts.\nd) Serum CK is often high.\ne) Debre- kocher-Semelaigne syndrome. It may occur in severely hypothyroid children esp boys. It is characterized by weakness, slowness of movement & striking muscle hypertrophy, causing an \"infant Hercules appearance\".\nf) Hoffman's syndrome. In adult hypothyroid results in prominant muscle enlargement & weakness with muscle stiffness. The cause of muscle enlargement in these 2 syndromes has not been determined."
        title: "الـ hypothyroid myopathy"
        text: |
          - Proximal weakness في **1/3**، cramps وألم و stiffness، و slow contraction في **25%**. والـ CK غالبًا عالي.
          - ==Kocher–Debré–Semelaigne==: أطفال hypothyroid (خصوصًا الولاد)، ضعف وبطء وعضلات ضخمة = «**infant Hercules**».
          - ==Hoffman's==: نفس الصورة في الـ **كبار**، مع stiffness.
      - kind: check
        page: 59
        quote: "a) Proximal muscular weakness in about 1/3 of patients.\nb) Muscular camps, pain & stiffness.\nc) Slow muscular contraction in about 25 %of pts.\nd) Serum CK is often high.\ne) Debre- kocher-Semelaigne syndrome. It may occur in severely hypothyroid children esp boys. It is characterized by weakness, slowness of movement & striking muscle hypertrophy, causing an \"infant Hercules appearance\".\nf) Hoffman's syndrome. In adult hypothyroid results in prominant muscle enlargement & weakness with muscle stiffness. The cause of muscle enlargement in these 2 syndromes has not been determined."
        question: "An adult hypothyroid man with big, stiff, weak muscles has:"
        options: ["Hoffman's syndrome", "Kocher–Debré–Semelaigne syndrome", "Cushing's myopathy", "Acromegaly"]
        answer: 0
        why:
          - "صح: Hoffman's للكبار."
          - "ده في الأطفال."
          - "الـ Cushing's فيه wasting، مش تضخم."
          - "مش hypothyroid."
      - kind: table
        page: 60
        quote: "Adrenal Disorders\n  1- Cushing syndrome:\n    It is the commonest diagnosed endocrine myopathy.\n    Striking proximal muscular wasting.\n    Cushingoid appearance precedes or accompanied myopathy.\n    Histological section demonstrates muscle fiber atrophy.\n  2- Adrenal insufficiency:\n    Commonly, it causes muscle fatigue.\n    Mild objective weakness is less common.\n  3- Primary aldosteronism \"Conn s syndrome\":\n    Persistent proximal muscular weakness & wasting in long standing hyperaldosteronism due to K depletion."
        title: "Myopathy كل غدة"
        columns: ["Disorder", "Key muscle feature"]
        rows:
          - ["Hyperthyroidism", "Proximal weakness + atrophy; periodic paralysis; MG; CK normal"]
          - ["Hyperparathyroidism", "Proximal weakness, wasting, brisk reflexes"]
          - ["Hypoparathyroidism", "Tetany cramps; CK may rise; overt myopathy rare"]
          - ["Cushing's", "Commonest diagnosed; striking proximal wasting"]
          - ["Adrenal insufficiency", "Fatigue; mild weakness less common"]
          - ["Conn's", "Weakness and wasting from K depletion"]
          - ["Acromegaly", "Big but weak muscles; duration, not GH, matters"]
        hide: [[0, 1], [3, 1], [5, 1], [6, 1]]
      - kind: aside
        tone: exam
        page: 60
        quote: "Acromegaly\n  Muscle hypertrophy early in the disease.\n  Proximal muscular weakness without atrophy.\n  The muscles appear enlarged but with diminished force.\n  The duration of acromegaly rather than the serum GH levels, correlates with the degree of myopathy."
        text: "سؤال محبوب: في الـ acromegaly، درجة الـ myopathy ماشية مع **مدة المرض** مش مستوى الـ growth hormone (GH). وأشيع endocrine myopathy متشخصة = **Cushing's**."
      - kind: explain
        page: 61
        quote: "Diabetes Mellitus\n  1- Diabetic amyotrophy It is known to be neuropathic, affecting the proximal major nerve trunks & lumbosacral plexus. More appropriate term include \"Diabetic proximal neuropathy & lumbosacral radiculoplexopthy\".\n  2- Ischemic infarction of the thigh musles\n    It occurs in poorly controlled diabetics.\n    Present with acute onset of pain, tenderness & edema of one thigh with a palpable mass.\n    Thigh adductors & biceps femoris are the most ofen affected muscles.\n    CT (MRI can demonstrate focal abnormalities)."
        title: "الـ DM والعضلات"
        text: |
          - ==Diabetic amyotrophy==: اسمها خادع، هي **neuropathic** (lumbosacral radiculoplexopathy).
          - ==Thigh muscle infarction==: في السكر المش متظبط. ألم مفاجئ وورم و tenderness في فخذ واحد مع mass. أكتر عضلات: **adductors** و **biceps femoris**. والـ magnetic resonance imaging (MRI) بيبيّنها.
      - kind: explain
        remind: [endo.L04.136, endo.L04.131]
        page: 62
        quote: "In Addisons disease the anemia is more severe, depending on the level of thyroid & androgen hormones dysfunction. However, anemia may be masked by hypovolemia. Once pts are given volume replacement, Hb level may drop rapidly."
        title: "الغدد والدم"
        text: |
          الـ androgens بتزوّد الـ erythropoiesis، والـ oestrogen والإخصاء بيقللوه. علشان كده الراجل الـ Hb بتاعه أعلى.

          - **Hypoproliferative anaemia**: hypothyroid، pituitary deficiency، **Addison's** (الأنيميا مستخبية ورا الـ hypovolaemia، وبعد المحاليل الـ Hb يقع بسرعة)، و hyperparathyroidism (HPT) (أثر الكالسيوم على الكلية).
          - **Haemolytic**: sickle (impotence، infertility)، thalassaemia (haemochromatosis).
          - **Plasma cell dyscrasias** (Waldenström): الـ paraprotein بيمسك الـ thyroid hormones، وبيبوّظ الـ immunoassay.
          - **polyneuropathy, organomegaly, endocrinopathy, M protein, skin changes (POEMS)**: Polyneuropathy، Organomegaly، Endocrinopathy، M-protein، Skin.
      - kind: explain
        page: 63
        quote: "Granulomatous Diseases & Endocrine Disorders\n  a- Sarcoidosis The hypothalamic pituitary axis is the part of endocrine system most commonly involved. This condition usually presents as:\n  DI.\n  Dificiency in one or more of the pituitary homone.\n  Complete hypopituitarism is rarey.\n  Adrenal cortical involvement results in Addison s disease.\n  Reproductive organs may be involved but infertility is rare.\n  Pregnancy is not affected by sarcoidosis. It may improve during pregnancy but it may flare in the postpartum period; presumably from fluctuation in endogenous gulcocorticoid production."
        title: "الـ granulomas"
        text: |
          - ==Sarcoidosis==: أكتر حاجة بتتأثر الـ **hypothalamic–pituitary axis**: **diabetes insipidus (DI)**، نقص هرمون أو أكتر (complete hypopituitarism نادر)، Addison's، والـ infertility نادرة. بتتحسن في الحمل وممكن تـ flare بعد الولادة.
          - ==Lepromatous leprosy==: testicular atrophy في **10-20%** بالـ invasion المباشر. الـ tubules الأول، بعدين الـ Leydig.
          - Schistosomiasis، و **Wegener's** مع hyperthyroidism.
      - kind: explain
        remind: [endo.L04.143, endo.L04.145]
        page: 64
        quote: "Mongenic Disorders Genetic & Endocrine\n  1- MODY.\n  2- DI.\n  3- Thyroid hormone resistance.\n  4- Male limetd precocious puberty.\n  5- Congenital adrenal hyperplasia.\n  6- Androgen insensitivity.\n  7- Ataxia telangiectasia\n  8- Myotonia dystrophica:\n    Hypothyroidism\n    DM\n  9- 1ry gonadal failure 9- Noon syndrome:\n    Short stature.\n    Thyroiditis.\n  10- Fanconi syndrome :\n    Short stature.\n    Bone marrow hypoplasia.\n  11- Abnormal skin pigmentation 11- Werner syndrome :\n    Premature aging, cataract.\n    DM.\n    Papillary carcinoma of thyroid.\n    Gonadal atrophy.\n  12- Male to female sex reversal.\n  13- Obesity."
        title: "الوراثة والمناعة"
        text: |
          - **Monogenic**: maturity-onset diabetes of the young (MODY)، DI، thyroid hormone resistance، male-limited precocious puberty، congenital adrenal hyperplasia (CAH)، androgen insensitivity، ataxia telangiectasia، و **myotonic dystrophy** (hypothyroidism و DM)، و primary gonadal failure، و abnormal skin pigmentation، و male-to-female sex reversal، و obesity.
          - **Noonan**: قصر و thyroiditis. **Fanconi**: قصر و bone marrow hypoplasia. ==Werner==: شيخوخة مبكرة، cataract، diabetes mellitus (DM)، **papillary thyroid cancer**، gonadal atrophy.
          - **Immune**: polyglandular autoimmune (PGA) I و II، insulin receptor antibodies، autoimmune insulin syndrome (hypoglycaemia)، antithyroid antibodies، و ataxia telangiectasia (DM، gonadoblastoma في البنات).
      - kind: try
        items: [endo.L04.107, endo.L04.112, endo.L04.119, endo.L04.132, endo.L04.137]
    recap:
