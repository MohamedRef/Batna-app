lessons:
  # ------------------------------------------------------------------
  - id: hb.L13.lesson1
    title: "الـ AIH: تشخيص بالاستبعاد"
    hook: "مناعة الجسم قررت تهاجم الكبد... بس قبل ما تتهمها، لازم تبرّئ كل المشتبه فيهم التانيين."
    minutes: 8
    pages: [204, 206]
    topics: [aih-diagnosis]
    goals:
      - "تعرّف الـ AIH بالتلات حاجات اللي بتميّزها"
      - "تفرّق بين interface hepatitis و lobular hepatitis"
      - "تمشي في الـ diagnostic algorithm من الأول للآخر وتفرّق definite من probable"
    status: unverified
    steps:
      - kind: explain
        page: 204
        title: "يعني إيه autoimmune hepatitis؟"
        quote: "Autoimmune hepatitis (AIH) is a self-perpetuating hepatocellular inflammation of unknown cause"
        text: |
          الكتاب بيعرّفها إنها self-perpetuating hepatocellular inflammation of unknown cause.

          - **Self-perpetuating**: الالتهاب بيغذّي نفسه. مفيش فيروس ولا دوا لازم يفضل موجود علشان المرض يكمّل.
          - **Unknown cause**: محدش عارف إيه اللي بدأه. علشان كده مفيش test واحد يأكده.

          وبتتميّز بتلات حاجات:

          - ==Interface hepatitis== في الـ biopsy.
          - ==Hypergammaglobulinemia== و ==autoantibodies== في الـ serum.
          - بتتشخّص بعد استبعاد باقي الـ chronic liver diseases.

          خلّي بالك من التالتة. الـ autoimmune hepatitis (AIH) تشخيص بالاستبعاد: الـ antibodies والـ biopsy بيدعموا التشخيص، والاستبعاد هو اللي بيقفله.
      - kind: explain
        page: 205
        quote: "Interface hepatitis The limiting plate of the portal tract is disrupted by a lymphoplasmacytic infiltrate."
        title: "Interface hepatitis vs lobular hepatitis"
        text: |
          الفرق كله في مكان الخلايا الالتهابية:

          - ==Interface hepatitis==: الـ ==limiting plate== (أول صف hepatocytes على حدود الـ portal tract) بيتكسر بـ ==lymphoplasmacytic infiltrate==. ده الـ hallmark بتاع الـ AIH.
          - **Lobular hepatitis**: **mononuclear cells** بتصطف جوه الـ sinusoids نفسها، بعيد عن الـ portal tract.

          الاتنين عادةً بييجوا مع بعض. بس الـ lobular hepatitis بتبان أكتر في الـ acute presentation، لأن الالتهاب ساعتها منتشر في الـ lobule كله.

          ومعلومة تربط (استنتاج مننا، مش من الكتاب): الـ **plasma cells** هي اللي بتعمل الـ immunoglobulins، فده منطقي يتماشى مع الـ hypergammaglobulinemia اللي في الـ serum.
      - kind: figure
        page: 204
        quote: "Autoimmune Hepatitis Autoimmune hepatitis (AIH) is a self-perpetuating hepatocellular inflammation of unknown cause."
        title: "الـ AIH تحت الميكروسكوب"
        image: { file: hb/L13-aih-histology.webp, book: true }
        alt: "Liver histology in pink H&E stain showing a dense infiltrate of small dark inflammatory cells among pale hepatocytes, with two black arrows pointing at the infiltrate."
        caption: |
          النقط الغامقة الكتير دي هي الـ inflammatory cells، والأسهم عليها، وهي وسط الـ hepatocytes الباهتة.

          الكتاب حاطط الصورة جنب التعريف: ==interface hepatitis== هو الـ hallmark اللي من غيره مفيش definite AIH.
      - kind: figure
        page: 205
        title: "الـ lobular hepatitis تحت الميكروسكوب"
        image: { file: hb/L13-lobular-hepatitis.webp, book: true }
        alt: "Pale pink liver histology of the lobule with no portal tract in view. Small dark mononuclear cells lie scattered in rows between the plates of hepatocytes; two black arrows in the lower half point at small clusters of them."
        caption: |
          الصورة دي في ص 205 قبل عنوان **Lobular hepatitis** على طول، ومن غير caption مطبوع. التفسير المقبول (مش في الكتاب):

          - الخلفية البمبي الباهتة كلها صفوف **hepatocytes**، ومفيش portal tract باين في الصورة.
          - النقط الغامقة الصغيرة متفرقة **جوه الـ lobule** بين الصفوف: دي الـ **mononuclear cells** اللي بتصطف في الـ sinusoids.
          - السهمين في النص التحتاني (واحد ناحية الشمال والتاني ناحية اليمين) بيشاوروا على تجمعات صغيرة منها.

          قارنها بالصورة اللي فوق: هناك الالتهاب كتلة كثيفة على حدود الـ portal tract (==interface hepatitis==)، وهنا متفرق في الـ lobule كله (==lobular hepatitis==). والاتنين مع بعض هما الـ "interface hepatitis ± lobular hepatitis" اللي في الـ algorithm.
      - kind: aside
        tone: analogy
        page: 205
        quote: "Interface hepatitis The limiting plate of the portal tract is disrupted by a lymphoplasmacytic infiltrate."
        text: |
          تخيّل الـ portal tract قسم شرطة والـ limiting plate هو السور اللي حواليه.

          في الـ interface hepatitis الـ lymphocytes والـ plasma cells بتنط من على السور وتهاجم البيوت اللي جنبه على طول. ولو انتشروا في الشوارع نفسها (الـ sinusoids) يبقى ده lobular hepatitis.
      - kind: check
        page: 205
        quote: "The limiting plate of the portal tract is disrupted by a lymphoplasmacytic infiltrate. This histologic pattern is the hallmark of autoimmune hepatitis."
        question: "What is the histologic hallmark of autoimmune hepatitis?"
        options:
          - "Interface hepatitis"
          - "Florid bile duct lesion"
          - "Onion-skin periductal fibrosis"
          - "Storiform fibrosis"
        answer: 0
        why:
          - "صح: lymphoplasmacytic infiltrate بيكسر الـ limiting plate، وده الـ hallmark بتاع الـ AIH."
          - "دي stage I بتاعة الـ **primary biliary cholangitis (PBC)** (هتشوفها في درس الـ PBC)."
          - "دي علامة الـ **primary sclerosing cholangitis (PSC)**."
          - "دي علامة الـ IgG4-related disease."
      - kind: explain
        remind: [hb.L13.007, hb.L13.006]
        page: 205
        quote: "Immunoserologic tests A. Antinuclear antibodies (ANA). B. Smooth muscle antibodies (SMA). C. Liver/kidney microsome type 1 (anti-LKM1). D. Perinuclear anti-neutrophil cytoplasmic antibodies (pANCAs) are common in type 1 AIH."
        title: "الـ diagnostic criteria والـ serology"
        text: |
          الكتاب بيعدّ 4 حاجات في الـ diagnostic criteria:

          - ميلها إنها تيجي **acute**، ونادرًا **fulminant**. يعني ممكن تبان زي acute viral hepatitis.
          - وجود **lobular hepatitis**.
          - تغيّرات **cholestatic** في الـ histology، منها bile duct injury و **ductopenia**.
          - الـ immunoserologic tests.

          والـ antibodies الأربعة:

          - ==Antinuclear antibodies (ANA)==: antinuclear antibody.
          - ==SMA==: smooth muscle antibody.
          - Anti-LKM1: liver/kidney microsome type 1.
          - **Perinuclear antineutrophil cytoplasmic antibodies (pANCA)**: perinuclear antineutrophil cytoplasmic antibodies (ANCA)، شائع في type 1.

          مثال: ست جاية بـ acute hepatitis والـ viral markers سالبة. الـ ANA و SMA هما أول حاجة تطلبها، لأنهم بيحددوا type 1.
      - kind: explain
        remind: [hb.L13.011, hb.L13.020]
        page: 206
        quote: "Is justified when findings are compatible with AIH but insufficient of a definite diagnosis. Patients who lack conventional autoantibodies but who are seropositive for investigational markers ."
        title: "Definite ولا probable؟"
        text: |
          ==Definite AIH== محتاجة التلاتة مع بعض:

          - استبعاد الأمراض الشبهها.
          - Labs بتقول إن فيه immunoreactivity واضحة (antibodies و gamma globulin).
          - **Interface hepatitis** في الـ histology.

          ==Probable AIH==: الصورة متوافقة مع الـ AIH، بس مش كفاية للـ definite.

          ومن أشهر أمثلتها: مريض الـ conventional antibodies عنده سالبة، بس عنده investigational marker:

          - **Anti-ASGPR**: asialoglycoprotein receptor.
          - **Anti-SLA/LP**: soluble liver antigen/liver-pancreas.
          - **Antiactin**.
          - Anti-LC1: liver cytosol type 1.

          ليه مش بنرفض التشخيص؟ لأن الـ ANA و SMA مش موجودين في كل الحالات. لو اعتمدنا عليهم بس، هيفوتنا مرضى ممكن يتعالجوا.
      - kind: figure
        remind: [hb.L13.012]
        page: 206
        quote: "Fig(1): Diagnostic algorithm for autoimmune hepatitis"
        title: "شكل 1 في الكتاب: الـ diagnostic algorithm للـ AIH"
        image: { file: hb/L13-aih-algorithm.webp, book: true }
        alt: "Book flow chart. Three gold boxes from top to bottom: abnormal AST and gamma globulin with a raised AST to alkaline phosphatase ratio; then AMA negative, normal ceruloplasmin and alpha-1 antitrypsin phenotype, normal or nonspecific iron, HBsAg, anti-HCV and IgM anti-HAV negative; then interface hepatitis with or without lobular hepatitis. It branches into a grey Definite box on the left (gamma globulin at least 1.5 times normal, ANA, SMA or LKM1 at least 1:80, no drugs or blood products, alcohol under 25 g a day) and a grey Probable box on the right (gamma globulin at least 1.5 times normal, titre at least 1:40, previous drugs, blood products or alcohol, other liver autoantibodies). At the bottom two purple boxes: Type 1, ANA and/or SMA, on the left, and Type 2, LKM1, on the right."
        caption: |
          الشكل بيتقري من فوق لتحت: 3 صناديق صفرا، وبعدين بيتفرع.

          - **الصندوق الأول** (فوق خالص): AST و gamma globulin (GG) عاليين، ونسبة AST : alkaline phosphatase عالية (الرقم بعد علامة > مش مطبوع في الكتاب). يعني صورة hepatocellular مش cholestatic.
          - **التاني**: الاستبعاد. antimitochondrial antibody (AMA) سالب (مش PBC)، ceruloplasmin طبيعي (مش Wilson)، الـ α1-antitrypsin phenotype طبيعي، الحديد طبيعي أو nonspecific (مش hemochromatosis)، و HBsAg و anti-HCV و IgM anti-HAV سالبين (مش viral).
          - **التالت**: الـ biopsy فيها ==interface hepatitis== ± lobular hepatitis.
          - بعدها بيتقسم: **Definite** على الشمال (GG ≥ 1.5× normal، و ANA أو SMA أو LKM1 ≥ ==1:80==، من غير أدوية أو نقل دم، و alcohol أقل من 25 g/day)، و **Probable** على اليمين (نفس الـ GG، بس الـ titre ≥ ==1:40==، أو فيه أدوية أو نقل دم أو alcohol، أو autoantibodies تانية للكبد).
          - تحت خالص الصندوقين البنفسجي: **Type 1** شمال = ANA و/أو SMA، و **Type 2** يمين = LKM1.

          يعني الشكل بيلخّص الدرس كله: الـ AIH مش بتتشخّص من antibody لوحده. لازم labs واستبعاد و biopsy، والـ titre هو اللي بيفرّق definite من probable.
      - kind: mnemonic
        page: 206
        quote: "Figure 1: Diagnostic algorithm for autoimmune hepatitis\nAbnormal AST and GG levels, AST: Alkaline Phosphatase >\n↓ AMA- ceruloplasmin normal α1 antitrypsin phenotype normal, Normal or nonspecific iron level, HBsAg, anti -HCV, IgM anti-HAV-\n↓ Interface hepatitis ± lobular hepatitis\n| Definite | Probable |\n|---|---|\n| GG ≥ 1.5 normal | GG ≥ 1.5 normal |\n| ANA, SMA or LKM 1 ≥ 1:80 | ANA, SMA or LKM 1 ≥ 1:40 |\n| No drugs or blood products | Previous drugs or blood products |\n| Alcohol < 25 gm/d | Alcohol use |\n| | Other liver-related authoantibodies |\n| Type 1: ANA and/or SMA+ | Type 2: LKM1+ |"
        word: "CAVIA"
        parts:
          - { key: "C", text: "Ceruloplasmin normal (no Wilson)" }
          - { key: "A", text: "Antimitochondrial antibody (AMA) negative (no PBC)" }
          - { key: "V", text: "Viral markers negative: hepatitis B surface antigen (HBsAg), anti-HCV, immunoglobulin M (IgM) anti-HAV" }
          - { key: "I", text: "Iron level normal or nonspecific (no hemochromatosis)" }
          - { key: "A", text: "Alpha-1 antitrypsin phenotype normal" }
        hook: |
          **Cavia** يعني «فار تجارب» (guinea pig). قبل ما تقول AIH، الكبد لازم يتعمل عليه **CAVIA**: يتفحص لكل المتهمين التانيين الأول. ولو فاتك واحد، انت اللي بقيت فار التجارب في الامتحان. 😄
      - kind: sort
        page: 206
        quote: "Figure 1: Diagnostic algorithm for autoimmune hepatitis\nAbnormal AST and GG levels, AST: Alkaline Phosphatase >\n↓ AMA- ceruloplasmin normal α1 antitrypsin phenotype normal, Normal or nonspecific iron level, HBsAg, anti -HCV, IgM anti-HAV-\n↓ Interface hepatitis ± lobular hepatitis\n| Definite | Probable |\n|---|---|\n| GG ≥ 1.5 normal | GG ≥ 1.5 normal |\n| ANA, SMA or LKM 1 ≥ 1:80 | ANA, SMA or LKM 1 ≥ 1:40 |\n| No drugs or blood products | Previous drugs or blood products |\n| Alcohol < 25 gm/d | Alcohol use |\n| | Other liver-related authoantibodies |\n| Type 1: ANA and/or SMA+ | Type 2: LKM1+ |"
        prompt: "حط كل نقطة في الخانة الصح:"
        bins: ["Definite AIH", "Probable AIH"]
        cards:
          - { text: "ANA, SMA or LKM1 titre ≥ 1:80", bin: 0 }
          - { text: "No drugs or blood products", bin: 0 }
