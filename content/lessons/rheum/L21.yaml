            <rect x="15" y="334" width="300" height="56" rx="12" class="fg-good"/>
            <text x="165" y="358" text-anchor="middle" class="t-b t-good">Total ≥9 = systemic sclerosis</text>
            <text x="165" y="377" text-anchor="middle" class="t-sm">(threshold from the 2013 paper)</text>
          </svg>
      - kind: table
        page: 345
        quote: "| Criteria domain | Sub-criteria | Weight |\n|---|---|---|\n| Skin thickening (count the higher of the three) | Skin thickening of the fingers of both hands extending proximal to the MCP joints | 9 |\n| | Puffy fingers | 2 |\n| | Whole finger, distal to MCP joint | 4 |\n| Fingertip lesions (count the higher of the two) | Digital tip ulcers | 2 |\n| | Pitting scars | 3 |\n| Telangiectasia | | 2 |\n| Abnormal nailfold capillaries | | 2 |\n| Lung involvement | PAH and/or ILD | 2 |\n| Raynaud's phenomenon | | 3 |\n| SSc-related antibodies | Any of ACA, ATA (anti-Scl 70), RNA polimerase | 3 |"
        title: "النقط: غطّي وافتكر"
        columns: [Item, Points]
        rows:
          - ["Skin thickening proximal to MCPs", "9"]
          - ["Sclerodactyly", "4"]
