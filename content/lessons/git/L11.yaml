          - **أي gastric varices تانية**: ==tissue adhesive== (**N-butyl-cyanoacrylate**)، وممكن **thrombin**.

          ليه band مش sclerotherapy؟ الكتاب: **less rebleeding** و **fewer side effects**. التفسير المقبول (مش في الكتاب): الـ band بيخنق الدالية فتموت وتقع، من غير مادة كيماوية تعمل قرحة أو stricture. وليه الغِرا في الـ gastric؟ لأن دوالي المعدة كبيرة وعميقة، الـ band ما بيلمّهاش كلها وممكن يقع ويسيب حفرة، والـ cyanoacrylate بيتجمد جوه الوعا ويسده.
