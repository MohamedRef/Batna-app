          في العينة الصغيرة نقطة شاذة واحدة (**outlier**) بتشد الخط كله وتطلع r مضلّل.
      - kind: explain
        page: 34
        quote: "Case reports and case series are near the bottom of the hierarchy of what counts as reliable evidence for clinical decision-making.\nA case report (or case study) usually describes a single unique case or finding of interest (unusual finding)."
        title: "Case report: عيان واحد غريب"
        text: |
          الـ ==case report== بيوصف **حالة واحدة** فريدة أو finding غير معتاد. وهو مع الـ case series ==near the bottom== في هرم الأدلة.

          مثال المحاضرة: راجل كبير عنده Alzheimer بياكل **20–30 بيضة يوميًا** لمدة 15 سنة تقريبًا، والـ low-density lipoprotein (LDL) بتاعه 142 mg/dL بس ومن غير atherosclerosis مهمة. جسمه اتأقلم: قلّل امتصاص الكوليسترول، قلّل تصنيعه، وزوّد تحويله لـ bile acid.
