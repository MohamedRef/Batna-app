            <rect x="120" y="178" width="200" height="94" rx="10" class="fg-acc"/>
            <text x="135" y="198" class="t-sm">1. Chlorambucil first</text>
            <text x="135" y="216" class="t-sm">2. Steroids if AIHA</text>
            <text x="135" y="234" class="t-sm">3. COP · 4. Fludarabine</text>
            <text x="135" y="252" class="t-sm">5. Pentostatin</text>
            <text x="135" y="268" class="t-sm t-mut">+ antibiotics, IVIG</text>
          </svg>
      - kind: explain
        page: 131
        title: "العلاج في الكتاب"
        quote: "Chemotherapy\n  1. Chlorambucil (less commonly, cyclophosphamide) is usually the first chemotherapeutic agent used. 0.1 mg/kg daily until the desired effect is obtained, then the dose is adjusted for maintenance and is continued for 6 to 12 months.\n  2. Corticosteroid if autoimmune haemalytic anaemia is present."
        text: |
          بنعالج **Rai III و IV** (survival وحش). الاختيارات:
          1. ==Chlorambucil== (أقل: cyclophosphamide) **0.1 mg/kg** يوميًا، وبعدين maintenance **6–12 شهر**
          2. **Corticosteroids** لو فيه **autoimmune haemolytic anaemia (AIHA)**

          ليه نستنى في الـ early stage؟ التفسير المقبول (مش في الكتاب): كتير من العيانين بيفضلوا مستقرين سنين، والعلاج المبكر في الكتاب ما بيطوّلش العمر، فهتدّي سُمّية من غير مكسب. وليه الـ steroids للـ AIHA؟ لأنها بتكتم الـ autoantibodies اللي بتكسّر الكرات.
      - kind: explain
        page: 132
        title: "باقي الاختيارات والمضاعفات"
        quote: "Treatment of complications as infections by using prepare antibiotics and intravenous immunoglobulin (400 mg/kg every 3-4 days)."
        text: |
          3. **COP** regimen (cyclophosphamide، vincristine [Oncovin]، prednisone)
          4. ==Fludarabine==
          5. **Pentostatin**
          6. المضاعفات زي الـ infections: **antibiotics** و ==intravenous immunoglobulin (IVIG) 400 mg/kg كل 3–4 أيام==

          ليه الـ IVIG؟ التفسير المقبول (مش في الكتاب): العيان عنده **hypogammaglobulinaemia** (من درس التشخيص)، فالـ IVIG بيدّيله الـ antibodies اللي الـ B cells بتاعته مش قادرة تعملها. وخلي بالك إن الـ fludarabine نفسه بيكتم الـ T cells، فالـ infections بتبقى أكتر بعده.
      - kind: update
        page: 131
        quote: "Chemotherapy\n  1. Chlorambucil (less commonly, cyclophosphamide) is usually the first chemotherapeutic agent used. 0.1 mg/kg daily until the desired effect is obtained, then the dose is adjusted for maintenance and is continued for 6 to 12 months.\n  2. Corticosteroid if autoimmune haemalytic anaemia is present."
        text: "النهارده أول علاج للـ CLL بدل الـ **chlorambucil** هو **Bruton's tyrosine kinase (BTK) inhibitor** (ibrutinib، acalabrutinib، zanubrutinib) أو **venetoclax + obinutuzumab**، وبنعالج المرض الـ active مش الـ stage لوحده (iwCLL 2018). في الامتحان: الكتاب."
        ref: "iwCLL 2018; NCCN CLL/SLL guideline 2024"
