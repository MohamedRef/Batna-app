          - question: "First drug?"
            options: ["Adrenaline immediately", "Oral antihistamine", "Skin prick test"]
            answer: 0
            why: "الكتاب: constriction of the bronchioles lethal، give adrenaline immediately."
      - kind: aside
        tone: exam
        page: 59
        quote: "Clinically anaphylaxis is a form of extreme shock (anaphylactic shock) that can kill within minutes of exposure to the antigen."
        text: "أي سؤال فيه anaphylaxis: الإجابة الأولى **adrenaline**. الـ antihistamine والـ steroid بييجوا بعدين، مش بدل منه."
      - kind: check
        page: 59
        quote: "Anaphylactic shock is most frequently observed in individuals sensitized to insect stings, peanuts, seafood or penicillin."
        question: "A woman gets IV penicillin for cellulitis and within minutes has stridor, wheeze and BP 70/40. Why does she need adrenaline rather than an antihistamine first?"
        options: ["Bronchiolar constriction and vasodilation can kill within minutes", "Antihistamines raise IgE", "Adrenaline removes the penicillin", "Antihistamines cause anaphylaxis"]
