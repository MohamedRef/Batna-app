      - kind: explain
        page: 11
        quote: "IL-12 stimulates the differentiation of naive CD4+ T cells to the Th1 subset of effector cells."
        title: "ليه الـ cytokine هو اللي بيختار الطريق؟"
        text: |
          الـ naive CD4+ T cell ممكن يبقى أكتر من نوع، واللي بيحدد هو **الـ cytokine اللي حواليه** وقت ما بيتنشّط.

          التفسير المقبول (مش في الكتاب) للمنطق:
          - ==IL-12== بييجي من macrophages و dendritic cells شافت ميكروب **جوه الخلايا**، فالرد المناسب Th1 اللي بينشّط الـ macrophage يقتل اللي جواه.
          - **IL-1 + IL-6** إشارة التهاب حاد من الـ innate، فالرد Th17 اللي بيجيب الـ neutrophils.
          - **IL-33** من عيلة IL-1، والرد Th2 اللي بيجيب الـ antibodies والـ eosinophils.

          يعني الـ innate بيشوف نوع الخطر، وبيبعت الـ cytokine اللي يختار الـ Th المناسب ليه.
      - kind: check
        page: 11
        quote: "IL-33 stimulates the differentiation of naive CD4+ T cells to the Th2 subset of effector cells."
        question: "Which cytokine drives naive CD4+ T cells to Th2 in this lecture?"
        options: ["IL-33", "IL-12", "IL-6", "IFN-γ"]
        answer: 0
        why:
          - "صح: IL-33 (من عيلة IL-1) ← Th2."
          - "IL-12 ← Th1."
          - "IL-6 مع IL-1 ← Th17، ولوحده بيساعد الـ antibodies."
          - "IFN-γ بيدعم Th1 وبيكبت Th2."
      - kind: table
        page: 14
        quote: "Help for IgE production Eosinophil and mast cell production Macrophage activation Delayed-type hypersensitivity"
        title: "Th1 ولا Th2؟"
        columns: ["Function", "TH1", "TH2"]
        rows:
          - ["Total antibody help", "+", "++"]
          - ["IgE help", "-", "++"]
          - ["Eosinophils and mast cells", "-", "++"]
          - ["Macrophage activation", "++", "-"]
          - ["Delayed-type hypersensitivity", "++", "-"]
          - ["Tc-cell activation", "++", "-"]
        hide: [[1, 2], [3, 1], [4, 1]]
      - kind: explain
        page: 14
        quote: "CD8 CTLs also secrete cytokines but their array is more restricted (cytotoxic T lymphocytes)."
        title: "ليه نوع الـ Th بيحدد شكل المناعة؟"
        text: |
          الكتاب واضح: الفرق في الـ cytokines اللي كل subset بيفرزها هو اللي بيحدد **نوع الـ immune response** ضد الـ antigen.

          - الـ **CD4 Th cells** بيعملوا أغلب شغلهم كـ helpers عن طريق الـ ==secreted cytokines==، مش بالقتل المباشر.
          - الـ **Th1 و Th2** بنفرّقهم بالـ cytokines اللي بيفرزوها.
          - الـ **CD8 CTLs** كمان بيفرزوا cytokines، بس المجموعة **محدودة أكتر**.

          ليه الـ CD8 محدود؟ التفسير المقبول (مش في الكتاب): شغلته الأساسية إنه يقتل الخلية المصابة بنفسه، فمش محتاج يوجّه الجيش كله زي الـ CD4.
      - kind: aside
        tone: analogy
