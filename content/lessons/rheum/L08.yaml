            <text x="85" y="232" text-anchor="middle" class="t-sm t-b">Remission:</text>
            <text x="85" y="250" text-anchor="middle" class="t-sm">non-GC agent 18 mo</text>
            <text x="85" y="266" text-anchor="middle" class="t-sm t-mut">+ GC taper</text>
