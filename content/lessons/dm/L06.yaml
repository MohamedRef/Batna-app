  - id: dm.L06.lesson3
    title: "نعالج الوجع إزاي؟ 30% هي النجاح"
    hook: "الألم مش هيختفي 100%. اعرف امتى تكمّل، امتى تغيّر، وامتى تضيف."
    minutes: 9
    pages: [72, 75]
    topics: [causal, pain]
    goals:
      - "تفرّق causal عن symptomatic therapies"
      - "تعرف الـ DCCT والـ insulin neuritis"
      - "تحفظ جرعات وآثار pregabalin و gabapentin و duloxetine"
      - "تمشي على قاعدة الـ 30%"
    status: unverified
    steps:
      - kind: table
        page: 72
        quote: "Causal Therapies:\n  Target the underlying pathogenesis.\n  To hold the progress of neuropathy."
        title: "استراتيجيتين"
        columns: [Strategy, Aims]
        rows:
          - ["Causal", "Target pathogenesis; hold progress"]
          - ["Symptomatic", "Relieve pain; improve quality of life"]
        hide: [[0, 1], [1, 1]]
      - kind: explain
        page: 73
        title: "الـ causal: ظبط السكر"
        quote: "Glycemic Control\n  DCCT: Intensive treatment significantly reduced both the incidence & progression of DN in patients with T1DM."
        text: |
          الـ ==Diabetes Control and Complications Trial (DCCT)==: الـ **intensive treatment** قلل الـ **incidence** والـ **progression** بتاع الـ diabetic neuropathy في **type 1 diabetes mellitus (T1DM)** بشكل significant.

          في الرسم بتاع الكتاب: الـ **abnormal nerve conduction** كان حوالي 40% في الـ conventional ونزل لأقل من 20% مع الـ intensive.

          ليه ظبط السكر بيحمي العصب؟ التفسير المقبول (مش في الكتاب): الـ glucose العالي بيدخل العصب من غير ما يستنى insulin، ويتحول لمواد (sorbitol و AGEs) بتبوّظ الخلية والأوعية الصغيرة اللي بتغذيها. لما السكر ينزل، المصدر نفسه يقل، فالـ neuropathy تبطّأ. عشان كده دي **causal therapy**: بتضرب السبب، مش الوجع.
      - kind: figure
        page: 73
        title: "رسمة الكتاب ص 73: الـ DCCT والأعصاب"
        image: { file: dm/L06-dcct-neuropathy.webp, book: true }
        alt: "Book bar chart, percentage of patients after 5 years, white bars conventional and black bars intensive treatment. Confirmed neuropathy about 10 vs 3; clinical neuropathy about 15 vs 7; abnormal nerve conduction about 40 vs 16; abnormal autonomic function about 5 vs 2."
        caption: |
          الأعمدة **البيضا** = conventional، و**السودا** = intensive، بعد 5 سنين.

          في **الأربع مجموعات** العمود الأسود أقصر. أكبر فرق في **التالت من الشمال**، الـ ==abnormal nerve conduction==: حوالي **40%** نزلت لحوالي **16%**.
      - kind: explain
        page: 73
        title: "مفاجأة: الإنسولين وجّع"
        quote: "Treatment-associated Neuralgia \"Insulin Neuritis\":\n  a. Treatment-associated neuropathic pain.\n  b. Occur in poorly-controlled patients shortly after starting aggressive insulin therapy.\n  c. DD from DPN: No Sensory loss and No weakness.\n  d. R/: Temporarily relaxing glycemic control."
        text: |
          ==Insulin neuritis== (treatment-associated neuralgia):
          - **neuropathic pain** بيظهر في عيان **poorly-controlled**
          - **shortly after** ما يبدأ **aggressive insulin therapy**
          - الفرق عن الـ diabetic peripheral neuropathy (DPN): **no sensory loss** و **no weakness**
          - العلاج: ==temporarily relaxing glycemic control==

          ليه بيحصل؟ التفسير المقبول (مش في الكتاب): العصب اللي اتعوّد على سكر عالي، لما السكر ينزل فجأة، بيحصل له نقص في الدم الواصل للعصب نفسه، والألياف الصغيرة اللي بتحاول تتجدد بتبعت إشارات ألم. الكتاب بيدّيك المفتاح: **no sensory loss** و **no weakness**، يعني العصب مش ميت، ده عصب **متضايق** من التغيير السريع، فالحل إنك تبطّأ التغيير.
      - kind: aside
        tone: joke
        page: 73
        quote: "Treatment-associated Neuralgia \"Insulin Neuritis\":\n  a. Treatment-associated neuropathic pain.\n  b. Occur in poorly-controlled patients shortly after starting aggressive insulin therapy.\n  c. DD from DPN: No Sensory loss and No weakness.\n  d. R/: Temporarily relaxing glycemic control."
