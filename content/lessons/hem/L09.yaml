schema: batna.lesson/v1
lecture: hem.L09
lessons:
  # ------------------------------------------------------------------
  - id: hem.L09.lesson1
    title: "عيلة الـ MPN: تلات إخوات وتلات طفرات"
    hook: "PV و ET و PMF ولاد عم: نفس الـ stem cell، نفس الطفرات، وممكن الواحد يتحول للتاني."
    minutes: 10
    pages: [133, 136]
    topics: [mpn, et-diagnosis]
    goals:
      - "تعرّف الـ MPN وتعدّ الـ classical three (سؤال كتاب)"
      - "تحفظ نسب JAK2 و CALR و MPL وتفهم ليه الـ PV ما فيهاش CALR"
      - "تكتب WHO criteria بتاعة الـ ET وتعرف كل criterion موجود ليه"
    status: unverified
    steps:
      - kind: explain
        page: 133
        title: "يعني إيه MPN؟"
        quote: "Myeloproliferative neoplasms (MPNs) refer to clonal disorders of hemopoietic stem cells that lead to an increase in the numbers of one or more mature blood cell progeny."
        text: |
          الـ **myeloproliferative neoplasms** هي ==clonal disorders of hemopoietic stem cells==: خلية جذعية واحدة اتعيّبت، وولادها بقوا **كتير** بس **mature** وشغالين.

          يعني مش زي الـ acute leukemia (blasts مش بتنضج). هنا الإنتاج زيادة في **خط أو أكتر** (one or more mature blood cell progeny).

          ليه الخلايا بتطلع ناضجة؟ التفسير المقبول (مش في الكتاب): الطفرة بتدوس على **بنزين** النمو (إشارة "اتكاثر") بس ما بتبوّظش **فرامل** النضج، فالمصنع بيطلّع منتج سليم بكمية أكبر من اللازم. وعشان كده المشكلة الأساسية في الـ MPN هي **الكَمّ** (تجلط، طحال كبير)، مش خلايا مش شغالة.
      - kind: explain
        remind: [hem.L09.002]
        page: 133
        title: "الـ classical three"
        quote: "Classical BCR/ABL-Negative Myeloproliferative Neoplasms (MPNs)\n  Polycythemia vera (PV)\n  Essential thrombocythemia (ET)\n  Primary myelofibrosis (PMF)"
        text: |
          الـ **classical breakpoint cluster region (BCR)/ABL-negative myeloproliferative neoplasms (MPNs)** تلاتة:
          - **Polycythemia vera (PV)**: كرات حمرا كتير
          - **Essential thrombocythemia (ET)**: صفائح كتير
          - **Primary myelofibrosis (PMF)**: النخاع بيتليّف

          جمّعهم **William Dameshek** سنة **1951**. وكلمة ==BCR/ABL-negative== معناها إننا شلنا الـ chronic myeloid leukaemia (CML) من القايمة.
      - kind: aside
        tone: exam
        page: 133
        quote: "- They share clinical, morphological and molecular features and can transform, in their course, into one another. They also have, to varying degrees, the potential to transform into acute myeloid leukemia (AML)."
        text: |
          التلاتة بيشتركوا في **clinical, morphological and molecular features**، وممكن ==يتحولوا لبعض==، وكمان لـ **acute myeloid leukaemia (AML)** بدرجات مختلفة.

          سؤال «disease progression» في آخر المحاضرة بيبدأ من الجملة دي.
      - kind: explain
        page: 133
        title: "الطفرات: مين عنده إيه؟"
        quote: "- Approximately half the cases of ET carry the JAK2 V617F mutation (55%), as do half the cases of PMF and nearly all cases of PV."
        text: |
          - ==Janus kinase 2 (JAK2) V617F==: **nearly all PV**، و **حوالي النص** في ET (55%) وفي PMF.
          - **CALR** (calreticulin): حوالي **30%**، في الـ ET والـ PMF اللي JAK2 عندهم سليم.
          - **Thrombopoietin receptor gene (MPL)** (الـ **thrombopoietin receptor**): حوالي **5%**.

          والـ **JAK2** gene قاعد على **9p24** (short arm of chromosome 9).
      - kind: figure
        page: 134
        quote: "It is located on the short (p) arm of chromosome 9 at position 24. (9p24)"
        title: "صورة الكتاب: مكان الـ JAK2 على كروموسوم 9"
        image: { file: hem/L09-jak2-locus.webp, book: true }
        alt: "Book ideogram of chromosome 9 lying horizontally: black and white bands with the short arm on the left, a hatched centromere region, and the long arm on the right; band labels from 9p24.2 on the far left to 9q34.2 on the far right; a yellow arrow points down at the tip of the short arm (9p24)."
        caption: |
          ده **كروموسوم 9** نايم بالعرض، والشرايط السودا والبيضا هي الـ **bands**:

          - **الشمال**: الـ **short arm (p)**، وأرقامه تحت من **9p24.2** على الطرف لحد **9p12**.
          - **النص** المخطط: منطقة الـ **centromere** (9q12).
          - **اليمين**: الـ **long arm (q)** لحد **9q34.2** على الطرف.
          - **السهم الأصفر** فوق على الشمال بيشاور على طرف الـ short arm: ده ==9p24==، مكان الـ ==JAK2 gene==.

          خد بالك إن الطرف التاني، **9q34**، هو مكان الـ ABL اللي بيتنقل في الـ CML (المحاضرة اللي فاتت). نفس الكروموسوم، طرفين، ومرضين مختلفين.
      - kind: figure
        page: 134
        quote: "Distribution of JAK2, MPL, and CALR mutations"
        title: "صورة الكتاب: توزيع الطفرات في التلاتة"
        image: { file: hem/L09-mutation-pies.webp, book: true }
        alt: "Book slide titled Distribution of JAK2, MPL, and CALR mutations, with three pie charts. Left, polycythemia vera (N=382): almost all dark blue JAK2 mutation with a thin grey nonmutated sliver. Middle, essential thrombocythemia (N=311): about half JAK2, a large red CALR mutation slice, a thin light-blue MPL slice and a grey nonmutated slice. Right, primary myelofibrosis (N=203): about half JAK2, a large red CALR slice, a small MPL slice and a thin nonmutated sliver. Source Klampfl 2013, N Engl J Med."
        caption: |
          تلات دواير، واحدة لكل أخ من الـ MPNs، من الشمال لليمين:

          - **Polycythemia vera** (N=382): الدايرة كلها تقريبًا **أزرق غامق** = ==JAK2 mutation==، وشريحة رمادي رفيعة فوق = **nonmutated**.
          - **Essential thrombocythemia** (N=311): نص الدايرة تقريبًا أزرق (JAK2)، وشريحة **حمرا** كبيرة على الشمال = ==CALR mutation==، وشريحة **لبني** صغيرة تحت = **MPL mutation**، ورمادي فوق = nonmutated (الـ **triple-negative**).
          - **Primary myelofibrosis** (N=203): نفس شكل الـ ET تقريبًا: JAK2 نص، CALR كبيرة، MPL صغيرة، ورمادي رفيع.

          تحت على اليمين المرجع (Klampfl 2013). اللي تاخده: ==PV = JAK2== تقريبًا لوحده، والـ **CALR والـ MPL** بيظهروا بس في الـ ET والـ PMF اللي JAK2 بتاعهم سليم.
      - kind: mnemonic
        page: 133
        quote: "- Many JAK2-unmutated patients with ET or PMF harbor mutations in calreticulin (CALR) (30%) and a small proportion (5%) carry mutations of the thrombopoietin receptor (MPL)."
        word: "JCM"
        parts:
          - { key: "J", text: "JAK2 V617F: nearly all PV, about half of ET (55%) and PMF" }
          - { key: "C", text: "CALR: about 30%, only in JAK2-unmutated ET and PMF" }
          - { key: "M", text: "MPL (thrombopoietin receptor): about 5%" }
        hook: "**J-C-M** بالترتيب من الأكتر للأقل: **55 / 30 / 5**. والـ PV ما بيظهرش غير في الـ J."
      - kind: reveal
        page: 133
        quote: "- Many JAK2-unmutated patients with ET or PMF harbor mutations in calreticulin (CALR) (30%) and a small proportion (5%) carry mutations of the thrombopoietin receptor (MPL)."
        prompt: "ليه طفرة في الـ MPL بالذات تعمل صفائح كتير؟"
        answer: |
          الكتاب بيقول إن الـ **MPL** هو **thrombopoietin receptor**. والـ TPO هو الإشارة الأساسية اللي بتقول للـ megakaryocyte «اكبر واعمل صفائح».

          التفسير المقبول (مش في الكتاب): لو الـ receptor بقى شغال على طول من غير TPO، الـ megakaryocytes تفضل تتكاثر من غير ما حد يطلب، فالصفائح تعلى (ET) والـ megakaryocytes الكتير ممكن تليّف النخاع (PMF).
      - kind: reveal
        page: 133
        quote: "- Approximately half the cases of ET carry the JAK2 V617F mutation (55%), as do half the cases of PMF and nearly all cases of PV."
        prompt: "طب ليه الـ JAK2 موجودة في التلاتة، والـ CALR والـ MPL في ET و PMF بس، ومش في PV؟"
        answer: |
          الكتاب بيدّيك التوزيع: **JAK2** في كل الـ PV تقريبًا ونص ET و PMF، و **CALR** و **MPL** في الـ JAK2-unmutated ET و PMF.

          التفسير المقبول (مش في الكتاب): الـ ==JAK2== هو الـ kinase اللي بيشغّل receptors كتير: بتاع الـ **erythropoietin** (كرات حمرا) وبتاع الـ **TPO** (صفائح). فلو اتعيّب، ممكن يزوّد أي خط، وأولهم الكرات الحمرا (PV).

          أما الـ **CALR** والـ **MPL** فشغلهم كله عن طريق **receptor الـ TPO** بس، فبيزوّدوا خط الـ megakaryocyte لوحده. عشان كده بيعملوا **ET** أو **PMF**، ومش بيعملوا PV.
      - kind: check
        page: 133
        quote: "- Approximately half the cases of ET carry the JAK2 V617F mutation (55%), as do half the cases of PMF and nearly all cases of PV."
        question: "Which MPN carries JAK2 V617F in nearly all cases?"
        options: ["Polycythemia vera", "Essential thrombocythemia", "Primary myelofibrosis", "CML"]
        answer: 0
        why:
          - "صح: الـ PV تقريبًا كلها JAK2 V617F."
          - "الـ ET حوالي النص بس (55%)."
          - "الـ PMF كمان حوالي النص."
          - "الـ CML هي BCR-ABL1 ومش من الـ BCR/ABL-negative MPNs أصلًا."
      - kind: explain
        page: 135
        title: "الـ ET: مين وإمتى؟"
        quote: "The median age at onset is 50–55 years, with a small second peak in women of reproductive age and, although it can occur at any age, it is rare in childhood."
        text: |
          - الـ incidence حوالي **1.5–2.0 لكل 100,000** في السنة، زي الـ PV.
          - الـ median age **50–55 سنة**، ومعاه ==small second peak in women of reproductive age==.
          - ممكن في أي سن، بس **نادر في الأطفال**.

          ليه الـ peak التاني ده مهم؟ عشان معناه إنك هتقابل ET في **ست شابة عايزة تحمل**. والأدوية اللي بتنزّل الصفائح (hydroxyurea و anagrelide) بتأذي الجنين، فالـ **ET and pregnancy** ليها قواعد خاصة هنشوفها في درس العلاج.
      - kind: table
        page: 135
        quote: "WHO criteria for essential thrombocythemia (ET)\n  Major criteria:\n    1. Platelet count equal to or greater than 450 x 10⁹/uL\n    2. Bone marrow biopsy showing proliferation mainly of the megakaryocyte lineage with increased numbers of enlarged, mature megakaryocytes with hyperlobulated nuclei. No significant increase or left-shift of neutrophil granulopoiesis or erythropoiesis and very rarely minor increase in reticulin fibers.\n    3. Not meeting WHO criteria for BCR-ABL1+ CML, PV, PMF, myelodysplastic syndromes, or other myeloid neoplasms\n    4. Presence of JAK2, CALR or MPL mutation\n  Minor criteria:\n    Presence of a clonal marker or absence of evidence for reactive thrombocytosis\nDiagnosis of ET requires meeting all four major criteria or the first three major criteria and one of the minor criteria"
        title: "WHO criteria for ET"
        columns: [Criterion, Content]
        rows:
          - ["Major 1", "Platelets ≥450 × 10⁹/L"]
          - ["Major 2", "Marrow: enlarged mature hyperlobulated megakaryocytes; no left shift; very rarely minor reticulin"]
          - ["Major 3", "Not CML, PV, PMF, MDS or other myeloid neoplasm"]
          - ["Major 4", "JAK2, CALR or MPL mutation"]
          - ["Minor", "Clonal marker, or no evidence of reactive thrombocytosis"]
          - ["Diagnosis", "All 4 major, or first 3 major + minor"]
        hide: [[0, 1], [1, 1], [3, 1], [4, 1], [5, 1]]
      - kind: explain
        page: 135
        title: "كل criterion موجود ليه؟"
        quote: "WHO criteria for essential thrombocythemia (ET)\n  Major criteria:\n    1. Platelet count equal to or greater than 450 x 10⁹/uL\n    2. Bone marrow biopsy showing proliferation mainly of the megakaryocyte lineage with increased numbers of enlarged, mature megakaryocytes with hyperlobulated nuclei. No significant increase or left-shift of neutrophil granulopoiesis or erythropoiesis and very rarely minor increase in reticulin fibers.\n    3. Not meeting WHO criteria for BCR-ABL1+ CML, PV, PMF, myelodysplastic syndromes, or other myeloid neoplasms\n    4. Presence of JAK2, CALR or MPL mutation\n  Minor criteria:\n    Presence of a clonal marker or absence of evidence for reactive thrombocytosis\nDiagnosis of ET requires meeting all four major criteria or the first three major criteria and one of the minor criteria"
        text: |
          ما تحفظش الـ criteria كقايمة. كل واحد بيجاوب على سؤال:
          - **Platelets ≥450**: هل فيه ==thrombocytosis== أصلًا؟
          - **النخاع**: هل الزيادة جاية من **خط الـ megakaryocytes لوحده** (megakaryocytes كبار mature hyperlobulated، من غير left shift في الـ granulocytes أو الـ erythroid)؟ ده اللي بيفرّقها عن الـ PV (الكرات الحمرا كمان) والـ PMF (atypia و fibrosis).
          - **مش CML ولا PV ولا PMF ولا MDS**: عشان كل دول ممكن يطلّعوا صفائح عالية، والـ CML بالذات علاجها مختلف خالص.
          - **الطفرة**: دليل إن الموضوع **clonal**، يعني ورم مش رد فعل.

          والـ **minor** (clonal marker أو مفيش reactive cause) موجود عشان الـ triple-negative. التفسير المقبول (مش في الكتاب) لترتيب التفكير ده: أغلب الصفائح العالية في الدنيا **reactive** (الكتاب بيقولها في ص 138)، فلازم تثبت إن الحالة مش رد فعل قبل ما تسمّيها ورم.
      - kind: aside
        tone: trap
        page: 135
        quote: "WHO criteria for essential thrombocythemia (ET)\n  Major criteria:\n    1. Platelet count equal to or greater than 450 x 10⁹/uL\n    2. Bone marrow biopsy showing proliferation mainly of the megakaryocyte lineage with increased numbers of enlarged, mature megakaryocytes with hyperlobulated nuclei. No significant increase or left-shift of neutrophil granulopoiesis or erythropoiesis and very rarely minor increase in reticulin fibers.\n    3. Not meeting WHO criteria for BCR-ABL1+ CML, PV, PMF, myelodysplastic syndromes, or other myeloid neoplasms\n    4. Presence of JAK2, CALR or MPL mutation\n  Minor criteria:\n    Presence of a clonal marker or absence of evidence for reactive thrombocytosis\nDiagnosis of ET requires meeting all four major criteria or the first three major criteria and one of the minor criteria"
        text: |
          الفخ: «مفيش طفرة يبقى مش ET». غلط!

          الـ **minor criterion** (==absence of evidence for reactive thrombocytosis==) بيقوم مكان الـ major 4. يعني **triple-negative ET** بتتشخص بالـ **exclusion**.
      - kind: figure
        page: 136
        title: "نخاع الـ ET في الكتاب"
        image: { file: hem/L09-et-megakaryocytes.webp, book: true }
        alt: "Book figure: two bone marrow panels in ET. Left, a cellular trephine with scattered large megakaryocytes among fat spaces. Right, a close view of two giant megakaryocytes with deeply lobulated (staghorn) nuclei."
        caption: |
          الـ **megakaryocytes** كبار و **mature** ونواتهم ==hyperlobulated== (فصوص كتير).

          ومفيش زيادة واضحة في خط الـ granulocytes أو الـ erythroid. ده الـ **major criterion 2**.
      - kind: check
        page: 135
        quote: "WHO criteria for essential thrombocythemia (ET)\n  Major criteria:\n    1. Platelet count equal to or greater than 450 x 10⁹/uL\n    2. Bone marrow biopsy showing proliferation mainly of the megakaryocyte lineage with increased numbers of enlarged, mature megakaryocytes with hyperlobulated nuclei. No significant increase or left-shift of neutrophil granulopoiesis or erythropoiesis and very rarely minor increase in reticulin fibers.\n    3. Not meeting WHO criteria for BCR-ABL1+ CML, PV, PMF, myelodysplastic syndromes, or other myeloid neoplasms\n    4. Presence of JAK2, CALR or MPL mutation\n  Minor criteria:\n    Presence of a clonal marker or absence of evidence for reactive thrombocytosis\nDiagnosis of ET requires meeting all four major criteria or the first three major criteria and one of the minor criteria"
        question: "Platelets 780, typical ET marrow, BCR-ABL1/JAK2/CALR/MPL all negative, no reactive cause. Diagnosis?"
        options: ["ET (3 major + minor)", "Not ET: no driver mutation", "Reactive thrombocytosis", "PMF"]
        answer: 0
        why:
          - "صح: أول 3 major + الـ minor (مفيش reactive cause) = ET."
          - "الـ minor criterion بيغني عن الطفرة."
          - "اتشال كل سبب reactive."
          - "الـ PMF محتاج atypia و fibrosis grade 2–3."
      - kind: try
        items: [hem.L09.005, hem.L09.006, hem.L09.009, hem.L09.013, hem.L09.018]
    recap:
      - "MPN = clonal stem cell disorder بيزوّد خلايا mature. التلاتة: PV، ET، PMF (Dameshek 1951)."
      - "بيتحولوا لبعض ولـ AML."
      - "J-C-M: JAK2 (كل الـ PV، نص ET و PMF)، CALR 30%، MPL (TPO receptor) 5%. JAK2 على 9p24."
