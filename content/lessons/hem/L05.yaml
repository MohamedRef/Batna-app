      - kind: explain
        page: 82
        title: "علاج الجلطة"
        quote: "These patients should remain on indefinite oral anticoagulation, maintaining an International Normalized Ratio (INR) of 3–4."
        text: |
          - ==Indefinite oral anticoagulation==.
          - الـ target كان **international normalised ratio (INR) 3–4**، بس دراستين randomized أثبتوا إن **INR 2–3** كفاية لأغلب المرضى.
          - شوية فيهم small-vessel thrombosis (lacunar infarcts على الـ magnetic resonance imaging (MRI)) لسه محتاجين **3–4** علشان الـ cerebral thrombosis ما ترجعش.
          - **Immunosuppression**: مش في الـ primary antiphospholipid syndrome (APS)، إلا لو الجلطة رجعت مع anticoagulation قوي.
          - **Catastrophic APS**: antithrombotics + **corticosteroids** + immunomodulators زي **rituximab**، life saving.
      - kind: reveal
        page: 82
        quote: "However, two subsequent prospective randomized studies both indicated that a lower target INR of 2–3 is effective in preventing recurrent thrombosis in the majority of patients."
        prompt: "ليه ما نخليش كل مرضى الـ APS على INR 3–4 ونرتاح؟"
        answer: |
          لأن الـ INR الأعلى معناه **نزيف أكتر**، والكتاب بيقول إن دراستين randomized لقوا إن ==INR 2–3== كفاية يمنع الجلطة في أغلب المرضى.

          فبندّي الأعلى (3–4) بس للي محتاجه: الـ **small-vessel** (lacunar infarcts) اللي الـ cerebral thrombosis بترجعلهم. والـ immunosuppression مش في الـ primary APS لأن المشكلة جلطة، والعلاج ضد الجلطة كفاية إلا لو فشل.
      - kind: update
        page: 82
        quote: "However, two subsequent prospective randomized studies both indicated that a lower target INR of 2–3 is effective in preventing recurrent thrombosis in the majority of patients. There is less certainty for those with arterial thrombosis as the number of patients was smaller; clinical observation suggests that there is a significant subpopulation of APS with small-vessel thrombosis, some evident as lacunar infarcts on magnetic resonance imaging, who appear to require a target INR of 3–4 to prevent recurrent cerebral thrombosis."
