          </svg>
      - kind: explain
        page: 158
        title: "تجلط أكتر من نزيف"
        quote: "3. Thrombotic complications\n  Serious esp in untreated patient\n  Arterial (MI, strokes, TIA, scotomata, mesentric artery occlusion, limb ischemia)\n  Venous thrombosis, splanchnic vessels, mesentreic, splenic, hepatoportal. Superficial thrombophlebitis, DVT, pulmonary embolism.\n  Microvascular occlusions affecting extremities (erythromelalgia) burning sensation of fingers and toes."
        text: |
          - **Bleeding** نادر (**1%**): epistaxis، gum bleeding، ecchymosis، gastrointestinal (GI).
          - **Thrombosis** خطير، خصوصًا ==in untreated patient==:
          - **Arterial**: Myocardial infarction (MI)، stroke، transient ischaemic attack (TIA)، scotomata، mesenteric، limb ischemia.
          - **Venous**: splanchnic (mesenteric، splenic، hepatoportal)، thrombophlebitis، deep vein thrombosis (DVT)، PE.
          - **Microvascular**: **erythromelalgia** = حرقان في صوابع الإيد والرجل.

          «خصوصًا من غير علاج» دي مفتاح العلاج كله: الجلطة هي اللي بتقتل، والعلاج (فصد، aspirin) بيقللها. عشان كده هدف العلاج الأول هيكون **منع الجلطة**.
      - kind: mnemonic
        page: 159
        quote: "Causes (of thrombosis in PV):\n  1. Increased PCV → increase viscosity, rheological abnormality of RBCs\n  2. Abnormal platelet-endothelial contact\n  3. Thrombocytosis\n  4. Pro-coagulant changes of the platelet\n  5. Pre-existing vascular disease"
        word: "VEPTP"
        parts:
          - { key: "V", text: "Viscosity: raised PCV and abnormal red blood cell (RBC) rheology" }
          - { key: "E", text: "Endothelium: abnormal platelet–endothelial contact" }
          - { key: "P", text: "Platelets too many: thrombocytosis" }
          - { key: "T", text: "Turned pro-coagulant platelets" }
          - { key: "P", text: "Pre-existing vascular disease" }
        hook: "خمس أسباب للتجلط في الـ PV: الدم **تقيل**، الصفائح **كتير** و**شرسة**، والوعاء **أصلًا تعبان**."
      - kind: explain
        page: 159
        title: "باقي العلامات، وكل واحدة ليه"
        quote: "7. Pruritus is due to increased histamine levels released from increased basophils and mast cells and usually is exacerbated by a warm bath or shower and iron deficiency anemia. This occurs in up to 40% of patients."
        text: |
          الكتاب بيدّي السبب مع كل علامة تقريبًا:
          - **Abdominal pain**: **peptic ulcer** لأن الـ **histamine** والـ gastric acidity عاليين، أو **Budd–Chiari**، أو portal/mesenteric thrombosis.
          - **Splenomegaly** (**75%**) و **hepatomegaly** (حوالي **30%**): الاتنين **extramedullary hematopoiesis**. الطحال الكبير بيضغط على المعدة فيعمل **early satiety**، ونادرًا **infarction**.
          - **Weight loss**: من الـ early satiety، أو من الـ **clone** الشغال اللي بيصرف طاقة.
          - ==Pruritus== (لحد **40%**): histamine من الـ **basophils والـ mast cells** الزيادة، وبيزيد بعد **دُش دافي** ومع **iron deficiency anemia**.
          - **Plethora** (rosacea-like): وش و palms و nail beds و mucosa و conjunctiva حمرا، من الـ **red cell mass** الزيادة.
          - **Hypertension** شائع.
      - kind: reveal
        page: 159
        quote: "10. Hypertension commonly is found in patients with PV. The red cell mass should differentiate PV from Gaisbock syndrome, which is hypertension and pseudo-polycythemia (high hemoglobin levels due to low plasma volume)."
        prompt: "راجل عنده hypertension و Hb عالي. إزاي تفرق بين PV و Gaisbock syndrome؟"
        answer: |
          الـ ==Gaisbock syndrome== = **hypertension + pseudo-polycythemia**: الـ Hb عالي علشان **البلازما قليلة**.

          الفيصل: **red cell mass**. في الـ PV عالي، وفي الـ Gaisbock طبيعي.
      - kind: aside
        tone: joke
        page: 159
        quote: "7. Pruritus is due to increased histamine levels released from increased basophils and mast cells and usually is exacerbated by a warm bath or shower and iron deficiency anemia. This occurs in up to 40% of patients."
        text: "عيان الـ polycythaemia vera (PV) هو الوحيد اللي بيطلع من الدُش أوحش ما دخل: سخن، أحمر، وبيهرش (pruritus). لو حد قالك «بهرش بعد الحمّام» ووشه طماطم، اطلب **complete blood count (CBC)**."
      - kind: check
        page: 159
        quote: "7. Pruritus is due to increased histamine levels released from increased basophils and mast cells and usually is exacerbated by a warm bath or shower and iron deficiency anemia. This occurs in up to 40% of patients."
        question: "Plethoric man with splenomegaly and itching after hot showers. Cause of the itch?"
        options: ["Histamine from basophils and mast cells", "Cholestasis with bile salt retention", "Uremia from kidney involvement", "Iron overload from repeated venesection"]
        answer: 0
        why:
          - "صح: الـ basophils والـ mast cells الزيادة بتطلع histamine."
          - "مفيش jaundice أو Budd–Chiari."
          - "مفيش kidney failure."
          - "بالعكس، الـ iron deficiency هي اللي بتزوّد الهرش."
      - kind: figure
        page: 160
        quote: "Natural history of PV\n  PV present with proliferative phase when control of erythrocytosis and prevention of thrombosis is urgent priority.\n  Followed by stable phase of variable short duration, normal count maintained without treatment (decrease proliferative potential and early myelofibrosis).\n  Followed by an advanced or spent phase (extensive myelofibrosis, progressive hepato-slenomegaly and pancytopenia)10-15% after 10 years and >30% after 20 years , median survival <18 months"
        title: "عمر الـ PV في تلات مراحل"
        alt: "A timeline with three blocks. Proliferative phase: control erythrocytosis and prevent thrombosis. Stable phase: normal counts without treatment, early fibrosis. Spent phase: extensive myelofibrosis, hepatosplenomegaly, pancytopenia, in 10-15% at 10 years and over 30% at 20 years, median survival under 18 months."
        caption: "الـ ==spent phase== = post-PV myelofibrosis: **10–15%** بعد 10 سنين و **>30%** بعد 20، والـ survival بعدها **<18 شهر**."
        svg: |
