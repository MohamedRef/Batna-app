  - id: git.L05.lesson8
    title: "الـ ESGE: تشيل البوليب بإيه حسب حجمه"
    hook: "6 mm؟ snare بارد. 15 mm؟ سخن بعد حقنة. 25 mm؟ EMR. وفيه علامة invasion؟ تاتو 3 سنتي ومركز متخصص."
    minutes: 8
    pages: [200, 202]
    topics: [polypectomy]
    goals:
      - "تمشي في الـ ESGE algorithm للـ sessile والـ flat بالحجم"
      - "تعرف تعمل إيه لو فيه شك في submucosal invasion"
      - "تعرف الـ pedunculated الكبير محتاج إيه قبل الـ snare"
    status: unverified
    steps:
      - kind: explain
        page: 200
        quote: "cold snare polypectomy to achieve en bloc resection"
        title: "تحت 10 mm: cold snare، حتة واحدة"
        text: |
          الـ **ESGE** في الكتاب، للـ superficial colorectal neoplastic polyps الـ **sessile أو flat**:
          - **Diminutive** (5 mm أو أقل) و **small** (5-9 mm): ==cold snare polypectomy to achieve en bloc resection==.
          - **10 mm أو أكتر**: **advanced endoscopic imaging** علشان تدوّر على **submucosal invasion** الأول.

          التفسير المقبول (مش في الكتاب): ليه «en bloc» (حتة واحدة)؟ لأن الـ pathologist محتاج يشوف البوليب كله بحوافه علشان يقول اتشال كله ولا لأ، وهل فيه سرطان. ولو اتقطّع حتت، ممكن تسيب حتة صغيرة ترجع تكبر. وليه نبص الأول على الـ invasion في الكبير؟ لأن البوليب اللي فيه سرطان غازي عميق ما ينفعش يتشال بالمنظار، وشيله الغلط بيبوّظ فرصة الجراحة الصح.
      - kind: case
        page: 200
        quote: "ESGE Guidelines: Superficial Colorectal Neoplastic polyps\nSessile or Flat\n  Diminutive size ≤5mm: cold snare polypectomy to achieve en bloc resection\n  Small size 5-9mm: cold snare polypectomy to achieve en bloc resection\n  Size ≥ 10 mm\n    Advanced endoscopic imaging to identify the presence of submucosal invasion\n      Non-invasive lesion\n      Suspected submucosal invasion\nPedunculated"
        stem: "Colonoscopy in a 64-year-old man finds three lesions."
        steps:
          - reveal: "A 6 mm flat adenoma in the sigmoid."
            question: "How do you remove it?"
            options: ["Cold snare, en bloc", "Hot snare after injection", "Surgery", "Hot forceps"]
            answer: 0
            why: "Small 5-9 mm sessile: cold snare polypectomy to achieve en bloc resection."
          - reveal: "A 15 mm non-invasive sessile adenoma in the transverse colon."
            question: "And this one?"
            options: ["Hot snare, consider submucosal injection first", "Cold snare without injection", "Tattoo the site and refer for surgery", "ESD in all cases of this size"]
            answer: 0
            why: "Intermediate 10-19 mm non-invasive: hot snare polypectomy; submucosal injection reduces deep thermal injury."
          - reveal: "A pedunculated polyp, head 22 mm, stalk 8 mm."
            question: "And this?"
            options: ["Adrenaline 1:10 000 and/or mechanical hemostasis, then hot snare", "Hot snare alone, with no injection or clip", "Cold snare, then watch for bleeding", "Refer for surgical resection of the polyp"]
            answer: 0
            why: "Head 20 mm or more (or stalk 10 mm or more) needs bleeding prophylaxis first."
      - kind: reveal
        page: 201
        quote: "Submucosal injection prior to HSP should be considered to reduce the risk of deep thermal injury"
        prompt: "ليه بنحقن تحت البوليب قبل الـ hot snare؟"
        answer: |
          الـ ESGE: الـ **10-19 mm** non-invasive: **hot snare polypectomy (HSP)**، و ==submucosal injection prior to HSP== يتفكر فيها علشان تقلل **deep thermal injury**.

          التفسير المقبول (مش في الكتاب): الحقنة بتعمل «مخدة» سوايل في الـ submucosa، فالبوليب يترفع بعيد عن العضلة. لما الكهربا تشتغل، الحرارة بتتوزع في المخدة بدل ما توصل للعضلة والـ serosa، فخطر الخرم يقل. وكمان لو البوليب **ما اترفعش** مع الحقنة (non-lifting)، ده ممكن يكون علامة إنه ماسك في الطبقات اللي تحت، يعني invasion.
      - kind: figure
        page: 201
        quote: "ESGE Guidelines: Size ≥ 10 mm\nNon-invasive lesion\n  Intermediate Size 10-19 mm. Hot Snare Polypectomy (HSP). Submucosal injection prior to HSP should be considered to reduce the risk of deep thermal injury.\n  Large Size ≥20 mm. En bloc endoscopic mucosal resection (EMR) to achieve R0 Resection. Piecemeal EMR if en bloc not feasible or not safe. If lesion is sized >40 mm or Complex refer to expert center.\nSuspected submucosal invasion\n  Suspected superficial submucosal invasion. Colonic tattoo 3 cm distal to the lesion. Refer to expert center for consideration of en bloc EMR or endoscopic submucosal dissection (ESD) or surgery.\n  Suspected deep submucosal invasion. Colonic tattoo 3 cm distal to the lesion. Refer for surgical resection."
        title: "ESGE: الشجرة كلها، زي اللي في الكتاب"
        alt: "Decision tree. Superficial colorectal neoplastic polyp, sessile or flat. 5 mm or less and 5 to 9 mm: cold snare en bloc. 10 mm or more: advanced imaging for submucosal invasion. Non-invasive 10 to 19 mm: hot snare, consider submucosal injection. Non-invasive 20 mm or more: en bloc EMR, piecemeal if not feasible, over 40 mm or complex to expert centre. Suspected superficial invasion: tattoo 3 cm distal, expert centre for EMR, ESD or surgery. Suspected deep invasion: tattoo, surgery. Pedunculated: head under 20 and stalk under 10 mm hot snare; otherwise adrenaline or clip then hot snare."
        caption: "تحت 10 mm: cold snare. فوق 10: بص الأول على الـ invasion. Non-invasive: hot snare أو EMR حسب الحجم. Invasion: تاتو، و expert أو جراحة."
        svg: |
