  - id: rheum.L12.lesson10
    title: "الـ Biologics وآخر الخط"
    hook: "قبل أول حقنة biologic لازم ورقة فيها TB test سلبي. وكل biologic ليه النوع اللي بيحبه."
    minutes: 8
    pages: [208, 209]
    topics: [biologics]
    goals:
      - "تعرف مشاكل الـ biologics في الأطفال وإيه لازم قبلها"
      - "تختار الـ biologic حسب النوع: ERA، uveitis، systemic"
      - "تعرف مكان الـ IVIg والـ stem-cell transplant والجراحة"
    status: unverified
    steps:
      - kind: explain
        page: 208
        quote: "The cases of reactivated tuberculosis have been particularly difficult; so all children should have a documented negative TB skin test before starting any biologic therapy."
        title: "الـ Biologics"
        text: |
          مشاكلها في الأطفال: infections (خصوصًا **varicella**)، التطعيمات، أثرها على مناعة لسه بتتكون، malignancy، و central nervous system (CNS) demyelination.

          - لازم ==negative tuberculosis (TB) skin test== موثق قبل أي biologic.
          - **Live vaccines ممنوعة** وهو عليها.
          - **Anti-TNF**: ممتاز في **enthesitis-related arthritis (ERA)**، أضعف بكتير في **systemic**.
          - **Infliximab > etanercept** للـ uveitis.
          - Anti-TNF ممكن يبطّأ الـ radiologic damage ويزود الـ bone density.
      - kind: reveal
        page: 208
        quote: "The cases of reactivated tuberculosis have been particularly difficult; so all children should have a documented negative TB skin test before starting any biologic therapy.\n  Live vaccines are contraindicated while patients are receiving biologic therapy."
        prompt: "ليه الـ TB والـ varicella والـ live vaccines بالذات هم الخوف الأكبر مع الـ biologics؟"
        answer: |
          الكتاب بيقول الـ reactivated TB كانت ==particularly difficult==، فلازم **documented negative TB skin test** قبل أي biologic، و ==live vaccines ممنوعة== وهو عليها.

          التفسير المقبول (مش في الكتاب): الـ TNF هو اللي بيمسك الـ granuloma اللي حابسة الـ TB نايمة في الجسم، فلما توقفه الـ granuloma بتتفك والـ TB تصحى. والـ varicella والتطعيمات الحية فيروسات محتاجة نفس المناعة الخلوية علشان تتحبس، فممكن تنتشر.
      - kind: figure
        page: 208
        quote: "Anti-TNF medications appear to be highly effective in enthesitis-related arthritis but are significantly less effective in systemic arthritis.\n  Infliximab is more effective than etanercept for JIA-related uveitis"
        title: "كل biologic ونوعه"
        alt: "Three rows. Enthesitis-related arthritis points to anti-TNF, highly effective. JIA uveitis points to infliximab, better than etanercept. Systemic arthritis points to tocilizumab (anti-IL-6 receptor), with anti-TNF marked as much less effective there."
        caption: "==ERA== ← anti-TNF ممتاز. **Uveitis** ← infliximab أحسن من etanercept. ==Systemic== ← الـ anti-TNF أضعف بكتير، والـ IL-6 هو المهم فـ tocilizumab."
        svg: |
