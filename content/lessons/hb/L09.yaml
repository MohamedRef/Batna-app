  - id: hb.L09.lesson7
    title: "المية اتلوّثت: SBP و SFP"
    hook: "مريض داخل بـ confusion بس، من غير سخونية ولا ألم. البزل هو اللي هيقولك الحقيقة."
    minutes: 10
    pages: [166, 171]
    topics: [sbp, sfp]
    goals:
      - "تعدّ الـ risk factors وتشرح الـ leaky gut"
      - "تشخّص SBP بالـ PMN وتفرقها عن secondary peritonitis"
      - "تعالج وتعمل prophylaxis، وتعرف الـ SFP"
    status: unverified
    steps:
      - kind: explain
        page: 166
        title: "SBP يعني إيه؟"
        text: |
          **Acute bacterial infection of the ascitic fluid** من غير **أي intra-abdominal source**. من هنا كلمة **spontaneous**: محدش خرم حاجة.

          **الـ pathogenesis:** **leaky gut** بسبب الـ PH (permeability و motility بايظين) → البكتيريا تعدّي للـ **mesenteric lymph nodes** ثم للـ ascites، والـ **local and systemic immunity** ضعيفة فمش قادرة تسيطر.
      - kind: mnemonic
        page: 166
        word: "BLP"
        parts:
          - { key: "B", text: "acute GI Bleeding" }
          - { key: "L", text: "Low ascitic protein (< 1 g/dL)" }
          - { key: "P", text: "Previous SBP episode" }
        hook: |
          اقراها **«BLeeP»** زي صوت المونيتور في العناية: تلات risk factors بس في الكتاب. وزوّد عليهم إن الـ prevalence عالية في **Child-Pugh C**، والـ **long-term PPI** بيزوّد الـ risk لأنه بيكثّر البكتيريا في الأمعاء ويسهّل الـ translocation.
      - kind: aside
        tone: trap
        page: 167
        text: |
          الـ SBP **frequently asymptomatic**. ممكن تيجي بـ low-grade fever وألم وقيء وإسهال، بس كتير جدًا بتيجي بس بـ **hepatic encephalopathy مش مفهومة** أو **renal dysfunction جديدة (HRS-AKI)**.

          علشان كده: **كل** مريض cirrhosis + ascites **داخل المستشفى** يتعمله **diagnostic paracentesis**، وكل واحد حالته تسوء.
      - kind: explain
        page: 167
        title: "التشخيص"
        text: |
          - **PMN ≥250 cells/mm³** = **neutrocytic ascites** = SBP، سواء الـ culture positive ولا لأ.
          - الـ ascitic **protein <1 g/dl**.
          - الـ culture غالبًا **monomicrobial** و **Gram-negative** (E. coli و Klebsiella). أقل: Strep، Staph، Enterococci.
          - الـ **leukocyte esterase dipstick** بيلقط الـ PMN العالي جنب السرير (**100% sensitivity**). والـ procalcitonin والـ calprotectin تحت الدراسة.
      - kind: figure
        page: 168
