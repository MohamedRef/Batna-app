  # ---------- p3-4: entero-pancreatic overview ----------
  - id: endo.L01.018
    kind: cloze
    topic: men1-gep
    text: Entero-pancreatic tumours occur in {{c1::30–75%}} of MEN 1 patients and are {{c2::multicentric}}.
    src: { page: 3, quote: "Entero-pancreatic tumors\n  Prevalence ranges from 30-75%.\n  Multicentric lesions.\n  Micro/macroadenomas -> invasive malignencies-> metastaic carcinoma.\n  As a result of the effective treatment available for parathyroid & pituitary manifestations in MEN-1 the malignant potential of these entero-pancreatic lesions is now the primary life-threatening manifestation of the syndrome." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.019
    kind: card
    topic: men1-gep
    front: What is now the primary life-threatening manifestation of MEN 1, and why?
    back: The malignant potential of the entero-pancreatic tumours, because parathyroid and pituitary disease are now treated effectively.
    src: { page: 3, quote: "Entero-pancreatic tumors\n  Prevalence ranges from 30-75%.\n  Multicentric lesions.\n  Micro/macroadenomas -> invasive malignencies-> metastaic carcinoma.\n  As a result of the effective treatment available for parathyroid & pituitary manifestations in MEN-1 the malignant potential of these entero-pancreatic lesions is now the primary life-threatening manifestation of the syndrome." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.020
    kind: order
    topic: men1-gep
    prompt: Natural progression of MEN 1 entero-pancreatic lesions.
    steps:
      - Micro- or macroadenomas
      - Invasive malignancy
      - Metastatic carcinoma
    src: { page: 3, quote: "Entero-pancreatic tumors\n  Prevalence ranges from 30-75%.\n  Multicentric lesions.\n  Micro/macroadenomas -> invasive malignencies-> metastaic carcinoma.\n  As a result of the effective treatment available for parathyroid & pituitary manifestations in MEN-1 the malignant potential of these entero-pancreatic lesions is now the primary life-threatening manifestation of the syndrome." }
    status: unverified
  # ---------- p4-5: gastrinoma ----------
  - id: endo.L01.021
    kind: cloze
    topic: gastrinoma
    text: Gastrinoma is the most common entero-pancreatic tumour in MEN 1, about {{c1::50%}} of them; MEN 1 gastrinomas are mostly in the {{c2::duodenum}}, small and multiple, and {{c3::50%}} have metastasised at diagnosis.
    src: { page: 4, quote: "Gastrinoma\n  Most common – represent 50% of all entero-pancreatic tumors in MEN1 tend to be small & multiple lesions.\n  MEN1 gastrinomas mostly in duodenum, 50% metastasized at Diagnosis.\n  Poor prognosis with pancreatic (not duodenal); metastases & higher gastrin level.\n  Diagnosis including: hypergastrinemia, multiple peptic ulcers & high gastric acid output.\n  Imaging & Biochemical:– U/S, CT/MRI & portal venous sampling." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L01.022
    kind: card
    topic: gastrinoma
    front: Poor prognostic factors in MEN 1 gastrinoma?
    back: Pancreatic (rather than duodenal) site, metastases and a higher gastrin level.
    src: { page: 4, quote: "Gastrinoma\n  Most common – represent 50% of all entero-pancreatic tumors in MEN1 tend to be small & multiple lesions.\n  MEN1 gastrinomas mostly in duodenum, 50% metastasized at Diagnosis.\n  Poor prognosis with pancreatic (not duodenal); metastases & higher gastrin level.\n  Diagnosis including: hypergastrinemia, multiple peptic ulcers & high gastric acid output.\n  Imaging & Biochemical:– U/S, CT/MRI & portal venous sampling." }
    status: unverified
  - id: endo.L01.023
    kind: card
    topic: gastrinoma
    front: Diagnosis of gastrinoma (biochemical, clinical and imaging)?
    back: Hypergastrinaemia, multiple peptic ulcers and high gastric acid output; imaging with US, CT/MRI and portal venous sampling.
    src: { page: 4, quote: "Gastrinoma\n  Most common – represent 50% of all entero-pancreatic tumors in MEN1 tend to be small & multiple lesions.\n  MEN1 gastrinomas mostly in duodenum, 50% metastasized at Diagnosis.\n  Poor prognosis with pancreatic (not duodenal); metastases & higher gastrin level.\n  Diagnosis including: hypergastrinemia, multiple peptic ulcers & high gastric acid output.\n  Imaging & Biochemical:– U/S, CT/MRI & portal venous sampling." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.024
    kind: card
    topic: gastrinoma
    front: Medical treatment of gastrinoma?
    back: Proton pump inhibitors, e.g. omeprazole.
    src: { page: 4, quote: "Medical Treatment\nPPI's – Omeprazole." }
    status: unverified
  - id: endo.L01.025
    kind: card
    topic: gastrinoma
    front: Why is surgery for MEN 1 gastrinoma controversial when a solitary sporadic gastrinoma is simply resected?
    back: MEN 1 gastrinomas are frequently multiple and metastatic.
    src: { page: 4, quote: "Surgical Treatment\n  For solitary sporadic gastrinoma - complete resection.\n  MEN1 gastrinomas freq mult/mets – controversial role of surgery.\n  Intraop US.\n  \"Gastrinoma triangle\" – pancreas/duodenum/CBD.\n  Duodenotomy.\n  Tumors head pancreas-enucleated.\n  Tumors body/tail pancreas – distal pancreatectomy +- splenectomy.\n  Liver mets- wedge resection." }
    status: unverified
  - id: endo.L01.026
    kind: card
    topic: gastrinoma
    front: What are the boundaries of the gastrinoma triangle?
    back: The pancreas, the duodenum and the common bile duct.
    src: { page: 4, quote: "Surgical Treatment\n  For solitary sporadic gastrinoma - complete resection.\n  MEN1 gastrinomas freq mult/mets – controversial role of surgery.\n  Intraop US.\n  \"Gastrinoma triangle\" – pancreas/duodenum/CBD.\n  Duodenotomy.\n  Tumors head pancreas-enucleated.\n  Tumors body/tail pancreas – distal pancreatectomy +- splenectomy.\n  Liver mets- wedge resection." }
    status: unverified
    tags: [high-yield]
