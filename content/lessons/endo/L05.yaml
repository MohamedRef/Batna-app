  - id: endo.L05.lesson4
    title: "جلد وإسهال: glucagonoma و VIPoma"
    hook: "ست عندها rash غريب بيلف حوالين بقها ورجليها، وسكر جديد، وخسّت. والراجل التاني بيصرف 10 لتر مية في اليوم. ورمين في البنكرياس، كل واحد ليه بصمة."
    minutes: 9
    pages: [90, 92]
    topics: [glucagonoma, vipoma]
    goals:
      - "تعرف البصمة الإكلينيكية للـ glucagonoma وليه بتحصل"
      - "تشرح الـ WDHA وكل الـ electrolyte changes بتاعتها"
      - "تحفظ الـ cut-offs: glucagon > 500، VIP > 200، والعلاج"
    status: unverified
    steps:
      - kind: explain
        remind: [endo.L05.066]
        page: 90
        quote: "Glucagonoma Syndrome\n  Tumor of α-cells → excess glucagon.\n  Typically arises in the pancreatic tail.\n  Often malignant with liver metastases.\n  Occurs in older adults, slight female predominance."
        title: "الـ glucagonoma"
        text: |
          ورم الـ **α-cells**، غالبًا في الـ **tail**، وكتير malignant بـ liver mets. كبار السن، ستات شوية أكتر.

          - البصمة: ==necrolytic migratory erythema== (NME)، rash كتير بيتشخص غلط.
          - Diabetes خفيف لمتوسط، weight loss، glossitis/cheilitis/stomatitis، diarrhoea، **thromboembolism**، أعراض نفسية، zinc و amino acids واطيين.
          - التشخيص: glucagon **أكتر من 500 pg/mL**، و p-CgA و p-glucagon ممكن يبقوا **10-20 مرة** الطبيعي. والـ histopathology: argyrophil staining، CgA، glucagon. والـ radiology: Octreoscan، EUS، CT-angiography، MRI.

          كل الأعراض ليها منطق واحد: الـ glucagon هرمون **catabolic** بيعمل عكس الإنسولين، فالسكر يعلى (diabetes)، والجسم يحرق البروتين والدهون (weight loss، amino acids واطية). التفسير المقبول (مش في الكتاب) للـ rash: الجلد والغشا المخاطي (glossitis، cheilitis) محتاجين amino acids و zinc عشان يتجددوا، فلما يقلوا بيتكسّروا.
      - kind: reveal
        page: 90
        quote: "Treatment\n  Surgical resection if localized.\n  Somatostatin analogs for symptom control.\n  Chemotherapy for metastatic disease.\n  Arterial Embolization.\n  Nutritional support (zinc, amino acids) may help NME."
        prompt: "ليه الـ zinc والـ amino acids ممكن يحسّنوا الـ rash؟"
        answer: "الـ glucagon الكتير بيحرق الـ amino acids في الـ gluconeogenesis، والجلد بيتغذى عليها، ومع الـ zinc الواطي الجلد بيتكسّر. التعويض بيساعد الـ NME، مع الجراحة أو الـ SSA أو الـ chemo أو الـ embolization."
      - kind: aside
        tone: tip
        page: 90
        quote: "Clinical Features\n  Necrolytic migratory erythema (NME): hallmark rash, often misdiagnosed\n  Diabetes mellitus (mild to moderate)\n  Weight loss\n  Glossitis, cheilitis, stomatitis\n  Diarrhea\n  Thromboembolism\n  Neuropsychiatric symptoms\n  Low zinc and amino acid levels"
        text: "احفظها كده: الـ glucagonoma هو الـ **4D**: Dermatitis (NME)، Diabetes، و«D» التالتة للـ thromboembolism (زي الـ deep vein thrombosis (DVT))، والرابعة للـ neuropsychiatric symptoms (زي الـ depression). الكتاب بيقول thromboembolism و neuropsychiatric symptoms، والـ D's دي مجرد شمّاعة للحفظ."
      - kind: explain
        remind: [endo.L05.073]
        page: 91
        quote: "Over secretion of VIP:\n  Causes watery diarrhea, marked hypokalemia.\n  80% are associated with the pancreas.\n  Metastasis occurs in ~70% of patients.\n  Complete resection results in 5 year survival of 95%."
        title: "الـ VIPoma = WDHA"
        text: |
          **Verner-Morrison** أو ==watery diarrhea, hypokalemia, achlorhydria (WDHA)==: Watery Diarrhoea، Hypokalaemia، Achlorhydria.

          - **80% في البنكرياس**، وكمان lung و ganglioneuromas. أكتر من 80% malignant.
          - Metastasis حوالي **70%**، و complete resection ← **95% 5-year**.
          - إسهال secretory من **3 لـ 20 لتر في اليوم**.
          - كمان: hypomagnesaemia، **hypercalcaemia**، acidosis، dehydration، flushing أحيانًا، **flaccid distended gallbladder**، ileus.
          - Marker: plasma vasoactive intestinal peptide (VIP) **أكتر من 200 pg/ml**.

          الإسهال هنا **secretory**، يعني الأمعاء نفسها بتفرز مية، مش أكل مش متهضم. علشان كده بيفضل حتى لو المريض صام، وده اللي بيفرّقه عن الـ osmotic diarrhoea.
