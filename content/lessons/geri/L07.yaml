        quote: "The Geriatric MDT\n  Core Members:\n    Geriatrician\n    Nurse\n    Social Worker\n    Occupational Therapist\n    Physiotherapist"
        title: "ليه الخمسة دول هما الـ core؟"
        text: |
          الكتاب بيقول الـ ==core members== خمسة: **geriatrician**، **nurse**، **social worker**، **occupational therapist**، **physiotherapist**.

          التفسير المقبول (مش في الكتاب) لدور كل واحد، عشان تفهم ليه ما ينفعش حد فيهم يغيب:
          - **Geriatrician**: التشخيص والأدوية وتجميع الصورة.
          - **Nurse**: معاه 24 ساعة، فبيشوف الأكل والـ continence والجلد والتوهان بالليل.
          - **Social worker**: البيت والفلوس ومين بيرعاه. وده سؤال الكتاب رقم 3: هو الـ core member الوحيد في الاختيارات.
          - **Occupational therapist (OT)**: الـ ADL والـ IADL، وتقييم مخاطر البيت (الكتاب بيقول كده صراحة في ص 113).
          - **Physiotherapist**: المشي والتوازن والقوة.

          يعني الخمسة بيغطّوا: المرض، الرعاية، الحياة الاجتماعية، الوظيفة، والحركة.
