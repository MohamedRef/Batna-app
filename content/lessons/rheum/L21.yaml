  - id: rheum.L21.lesson3
    title: "علاج SSc: سلاح لكل عضو"
    hook: "مفيش دوا واحد بيعالج الـ SSc كله، فالكتاب بيقسّم: immunosuppressants، antifibrotics، وبعدين كل عضو وعلاجه."
    minutes: 7
    pages: [350, 352]
    topics: [treatment, organ-treatment]
    goals:
      - "تعدّ الـ immunosuppressants والـ antifibrotics"
      - "تعرف إمتى الـ steroids مسموحة"
      - "توصّل كل عضو بعلاجه"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L21.035]
        page: 350
        title: "Immunosuppressants"
        quote: "Cyclosporine.\nMTX.\nMMF.\nRapamycin.\nAutologous stem cell transplantation."
        text: |
          - **Cyclophosphamide** مع plasma exchange أو glucocorticoid
          - **Glucocorticoids** (بشروط، تحت)
          - **Cyclosporine**، ==methotrexate (MTX)==، ==mycophenolate mofetil (MMF)==، **rapamycin**
          - **Autologous stem cell transplantation**

          ليه immunosuppressants في مرض fibrosis؟ لأن الـ fibrosis بيبدأ بالتهاب (T cells و B cells و cytokines، الدرس الأول)، فلو هدّيت الالتهاب بدري بتقلل الـ collagen اللي هيتعمل.
      - kind: explain
        remind: [rheum.L21.036]
        page: 350
        title: "الـ steroids بس في دول"
        quote: "Glucocorticoid (restricted to pts with myositis, active fibrosing alveolitis, symptomatic serositis, early edematouse phase of the skin, refractory arthritis, and tenosynovitis)."
        text: |
          الـ **glucocorticoid** في الـ systemic sclerosis (SSc) ==restricted== لـ:
          1. Myositis
          2. Active fibrosing alveolitis
          3. Symptomatic serositis
          4. Early **edematous** phase of the skin
          5. Refractory arthritis
          6. Tenosynovitis

          وافتكر: **prednisone > 15 mg** risk factor للـ renal crisis.

          يعني الـ steroids مقصورة على الحالات اللي فيها **التهاب نشط** (myositis، alveolitis، serositis، early edematous skin، arthritis، tenosynovitis). السبب: الجرعة العالية بتجيب renal crisis، والـ fibrosis القديم مش هيستجيب ليها.
      - kind: explain
        remind: [rheum.L21.037]
        page: 350
        title: "Antifibrotics وتحت الدراسة"
        quote: "Antifibrotic drugs\n  D-penicillamine.\n  Interferon alpha.\n  Relaxin.\n  Prostacyclin analouge (Aloprost).\n  Anticytokine therapy (CAT-192 = anti TGF-β1)."
        text: |
          **Antifibrotic:** **D-penicillamine**، interferon alpha، **relaxin**، prostacyclin analogue (**iloprost**؛ الكتاب كاتبها «Aloprost»)، و==anti TGF-β1== (CAT-192).

          **Under investigation:** **imatinib**، rituximab، intravenous immunoglobulin (IVIG)، epigenetic (deacetylase inhibitor)، و oral bovine type 1 collagen للـ tolerance.

          **Biologics تانية:** **tocilizumab** (IL-6R) و**abatacept**.

          ليه الـ anti TGF-β1؟ لأن الـ TGF-β من الـ cytokines اللي بتخلّي الـ fibroblast يطلّع collagen (الدرس الأول)، فالدوا بيضرب المرض من مصدره. والـ tocilizumab نفس الفكرة مع الـ IL-6.
      - kind: table
        page: 351
        quote: "Calcium channel blockers, ARB blocker (lozartan), prostacycline analouges, phosphodiestrase inhibitors, nitroglycerine patch and chemical and digital sympathectomy."
        title: "كل عضو وعلاجه"
        columns: [Problem, Book treatment]
        rows:
          - ["Raynaud phenomenon", "CCB first; losartan, prostacyclin, PDE inhibitor, nitrate patch, sympathectomy"]
          - ["Digital ulcers", "Endothelin receptor antagonist, atorvastatin"]
          - ["Pruritus", "Antihistamines, lubricant creams, capsaicin"]
          - ["Calcinosis cutis", "Minocycline, MTX, infliximab, rituximab, surgery"]
          - ["Myositis", "Steroids, MTX, azathioprine"]
          - ["GIT", "PPI, prokinetics"]
        hide: [[0, 1], [1, 1], [5, 1]]
      - kind: reveal
        page: 351
        quote: "Calcium channel blockers, ARB blocker (lozartan), prostacycline analouges, phosphodiestrase inhibitors, nitroglycerine patch and chemical and digital sympathectomy."
        prompt: "ليه كل أدوية الـ Raynaud في الكتاب vasodilators، وليه الـ sympathectomy في آخرها؟"
        answer: |
          لأن الـ Raynaud **vasospasm**: الشرايين الصغيرة في الصوابع بتنقبض جامد مع البرد. فكل دوا في القايمة بيفتح الوعاء من طريق مختلف:
          - ==Calcium channel blockers== (أول دوا)، **losartan**، **prostacyclin analogues**، **PDE inhibitors**، و **nitroglycerin patch**.
          - ولو الأدوية مانفعتش: **chemical أو digital sympathectomy** بيقطع الإشارة العصبية اللي بتقبض الوعاء.

          والـ **digital ulcers** (لما الـ ischemia تطوّل) لها **endothelin receptor antagonist** و **atorvastatin**. الترتيب ده منطقي: من الأبسط والأأمن للأكتر تدخّلًا (التفسير المقبول للترتيب، مش في الكتاب).
      - kind: check
        page: 351
        quote: "Digital ulcers: endothelin receptor antagonist and atorstatin."
