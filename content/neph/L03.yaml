    pass: 3
    src: { page: 69, quote: "Mechanism of damage in CRS-1. ACE, angiotensin-converting enzyme; CKD, chronic kidney disease; CRS, cardiorenal syndrome; RAA" }
    status: unverified
  - id: neph.L03.018
    kind: order
    topic: pathogenesis
    prompt: Order the humoral pathway from acute heart failure to acute kidney disease in CRS-1 (Figure 2).
    steps:
      - Humoral signaling
      - Endothelial activation
      - Cytokine secretion
      - Acute renal disease
    src: { page: 69, quote: "Mechanism of damage in CRS-1. ACE, angiotensin-converting enzyme; CKD, chronic kidney disease" }
    status: unverified
  - id: neph.L03.019
    kind: card
    topic: pathogenesis
    front: In CRS-1 (Figure 2), how do the drugs given for heart failure harm the kidney?
    back: Diuretics and ACE inhibitors cause toxicity and vasoconstriction that feed into acute renal disease.
    src: { page: 69, quote: "Diuretic and ACE inhibitor Toxicity, Vasoconstriction" }
    status: unverified
  - id: neph.L03.020
    kind: card
    topic: pathogenesis
    front: In CRS-1 (Figure 2), what does hemodynamically mediated damage do to the kidney?
    back: It decreases renal perfusion and increases renal venous pressure.
    src: { page: 69, quote: "Hemodynamically mediated damage Decreased perfusion, increased venous pressure" }
    status: unverified
