  - { id: tls, title: "Tumor lysis syndrome" }
  - { id: infiltration, title: "Tumor infiltration and urinary tract obstruction" }
  - { id: tma, title: "Thrombotic microangiopathy" }
  - { id: drugs, title: "Drug-associated nephrotoxicity and nephrectomy" }
  - { id: glomerular, title: "Paraneoplastic glomerular diseases" }
  - { id: electrolytes, title: "Sodium, potassium, magnesium and phosphate disorders" }
