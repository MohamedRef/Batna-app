  # ------------------------------------------------------------------
  - id: git.L03.lesson3
    title: "الـ functional dyspepsia: مين، وليه، وإمتى نقلق"
    hook: "عسر الهضم أشهر شكوى في العيادة. إمتى نطمّن ونقول FD، وإمتى المنظار لازم النهارده؟"
    minutes: 9
    pages: [100, 103]
    topics: [dyspepsia]
    goals:
      - "تعرف أعراض الـ dyspepsia وعوامل خطر الـ FD"
      - "تعدّ الآليات وتعرف ليه مش كلها في كل مريض"
      - "تطبّق الـ history المركّز ومعايير الـ NICE للمنظار والـ CT"
    status: unverified
    steps:
      - kind: explain
        remind: [git.L03.105]
        page: 100
        quote: "In terms of risk factors for FD, these include younger age, female sex, higher levels of somatoform-type symptom reporting, and other DGBI, including IBS"
        title: "الـ indigestion اللي الكل بيشتكي منه"
        text: |
          الـ ==dyspepsia== (indigestion) شائعة جدًا: ألم أو حرقان في أعلى البطن، شبع بدري في نص الأكل، أو تقل بعد الأكل.

          الـ **risk factors** لـ FD:
          - **Younger age** و **female sex**.
          - **Somatoform-type symptom reporting** أعلى.
          - وجود disorders of gut-brain interaction (DGBI) تاني، خصوصًا ==irritable bowel syndrome (IBS)==.

          التفسير المقبول (مش في الكتاب): ليه الـ IBS من عوامل الخطر؟ لأن الاتنين disorders of gut–brain interaction، وبيتشاركوا نفس الآليات (hypersensitivity، بوابة الألم)، فاللي عنده واحد غالبًا عنده التاني.
      - kind: figure
        page: 100
        quote: "BOX 14-1 Causes of Dyspepsia"
        title: "أسباب الـ dyspepsia"
        image: { file: git/L03-dyspepsia-causes.webp, book: true }
        alt: "Book box of the causes of dyspepsia in four groups: luminal GI tract (functional dyspepsia, volvulus, ischemia, food intolerance, neoplasm, infections, gastroparesis, GERD, infiltrative disorders, IBS, parasites, PUD), medications (from acarbose and NSAIDs to theophylline), systemic conditions, and pancreaticobiliary disorders."
        caption: |
          قبل ما تقول **functional dyspepsia** افتكر الأربع مجموعات دي: **luminal GI tract**، **medications**، **systemic conditions**، و**pancreaticobiliary**.

          وبص على عمود ==Medications==: NSAIDs، iron، potassium chloride، digitalis، theophylline وغيرهم. سؤال واحد عن الأدوية ممكن يحل الحالة.
      - kind: explain
        remind: [git.L03.114]
        page: 101
        quote: "FD is a DGBI associated with abnormalities in motility, including delayed gastric emptying and impaired fundic accommodation visceral sensitivity to both physical and chemical stimuli, central nervous system processing, psychopathology, immune function, changes in the gastric and small bowel microbiome, epithelial permeability, and genetics."
        title: "إيه اللي بايظ في المعدة؟"
        text: |
          الـ FD ليه أكتر من آلية:

          - **Motility:** ==delayed gastric emptying== و ==impaired fundic accommodation==.
          - **Visceral sensitivity** للمنبهات الـ physical والـ chemical.
          - CNS processing، psychopathology، immune function.
          - تغيّر الـ gastric و small bowel **microbiome**، الـ epithelial permeability، والـ genetics.

          ومش كل الحاجات دي موجودة عند كل مريض، وعلاقتها بالأعراض لسه محتاجة توضيح.
      - kind: aside
        tone: analogy
        page: 101
        quote: "FD is a DGBI associated with abnormalities in motility, including delayed gastric emptying and impaired fundic accommodation visceral sensitivity to both physical and chemical stimuli, central nervous system processing, psychopathology, immune function, changes in the gastric and small bowel microbiome, epithelial permeability, and genetics."
        text: |
          الـ **fundus** الطبيعي زي شنطة سفر بتوسع لوحدها لما تحط فيها هدوم: المعدة بترتخي وتستقبل الأكل من غير ما الضغط يعلى.

          في الـ **impaired accommodation** الشنطة مش بتوسع، فبعد كام لقمة الضغط بيعلى والمريض يحس إنه شبع (**early satiation**). ولو التفريغ بطيء كمان، الأكل يقعد فيحس بـ **postprandial fullness**.
      - kind: reveal
        page: 101
        quote: "Not all of these abnormalities are present in all patients, and if and how they associate with each other, and with dyspeptic symptoms themselves, requires clarification"
        prompt: "ليه مفيش دوا واحد بيعالج كل مرضى الـ FD؟"
        answer: |
          الكتاب: الآليات كتير (delayed gastric emptying، impaired fundic accommodation، visceral sensitivity، CNS، psychopathology، immune، microbiome، permeability، genetics)، بس ==not all of these abnormalities are present in all patients==، وعلاقتها ببعض وبالأعراض لسه محتاجة توضيح.

          التفسير المقبول (مش في الكتاب): يعني مريضين بنفس التشخيص ممكن يكون واحد معدته بطيئة والتاني معدته طبيعية بس حساسة. الأول ممكن يستفيد من prokinetic، والتاني من pain modulator. علشان كده الكتاب بيقسّم الـ FD لـ **PDS** و **EPS**: كل subtype بيقرّب لمجموعة آليات، فيختار العلاج على أساسها.
      - kind: explain
        remind: [git.L03.117]
        page: 102
        quote: "Symptoms compatible with FD\nFD-focused history taking and physical examination:\n  Assess for presence of alarm symptoms or signs\n  Date of onset and duration of symptoms of dyspepsia\n  Evidence of postinfection onset, or after acute or chronic stress or psychological trauma\n  Assess for presence of other upper gastrointestinal symptoms\n  If epigastric pain is present, confirm this is not related to a change in bowel habit or relieved by defaecation; this is likely to be IBS\n  Assess for presence of gastro-oesophageal reflux symptoms (heartburn or regurgitation); if present in isolation this is not FD\n  Assess for weight loss (amount lost and over what time period)\n  Elicit lower gastrointestinal symptoms for presence of other DGBI\n  Assess for presence of other functional non-gastrointestinal disorders\n  Family history of gastro-oesophageal cancer or coeliac disease\n  Medications (including NSAIDs and opioids)\nBaseline investigations:\n  Full blood count in patients aged ≥55 years and coeliac serology in patients with overlap of IBS-type symptoms\n  Breath or stool testing for H. pylori"
        title: "الـ history اللي بيفرق"
        text: |
          في الـ FD-focused history دوّر على:

          - **Alarm symptoms** (الخطوة الجاية)، وإمتى بدأت وطولها، وهل بعد infection أو stress أو psychological trauma.
          - لو الألم بيتغيّر مع الـ bowel habit أو بيروح بالتبرّز: ده ==likely IBS==.
          - لو heartburn أو regurgitation لوحدهم: ده **not FD**.
          - Weight loss، family history لـ gastro-oesophageal cancer أو coeliac، والأدوية (**nonsteroidal anti-inflammatory drugs (NSAIDs)** و **opioids**).

          الـ **baseline tests**: full blood count (FBC) لو العمر 55 أو أكتر، coeliac serology لو فيه overlap مع IBS، و ==H. pylori== بالـ breath أو stool test.

          يعني الـ history هنا مش روتين، كل سؤال فيه بيبعد تشخيص تاني ليه علاج مختلف.
      - kind: explain
        page: 102
        quote: "if epigastric pain is present, confirm this is not related to a change in bowel habit or relieved by defaecation, this is likely to be IBS"
        title: "أسئلة الـ history وليه كل سؤال"
        text: |
          الـ **FD-focused history** في الكتاب بيسأل عن:
          - الـ **alarm symptoms** أو signs.
          - **بداية** الأعراض ومدتها.
          - بداية بعد **infection** أو **stress** حاد أو مزمن، أو **psychological trauma**.
          - الألم الـ epigastric: لو مرتبط بتغيّر الـ **bowel habit** أو بيروح مع **defaecation**، يبقى غالبًا ==IBS==.
          - **Heartburn** أو **regurgitation**: لو لوحدهم، ==this is not FD==.
          - **Weight loss**: قد إيه وفي قد إيه.
          - أعراض تحت (DGBI تانية)، وأمراض functional برّه الجهاز الهضمي.
          - **Family history** لـ gastro-oesophageal cancer أو **coeliac disease**.
          - الأدوية (**NSAIDs** و **opioids**).

          والفحوصات الأساسية: **full blood count** لو 55 سنة أو أكتر، **coeliac serology** لو فيه أعراض IBS معاه، و **H. pylori** بالـ breath أو stool.

          التفسير المقبول (مش في الكتاب): كل سؤال بيستبعد حاجة تتعالج بشكل مختلف: الـ NSAIDs قرحة، الـ heartburn GERD، الـ defaecation IBS، الـ family history cancer أو coeliac. واللي يفضل بعد كده هو الـ FD.

          يعني لو المريض بياخد NSAIDs، أو عنده heartburn بس، أو ألمه بيروح بالحمام، ما تكتبش FD قبل ما تتعامل مع السبب ده الأول، علشان علاجه مختلف.
      - kind: check
        page: 102
        quote: "Box 1: Upper gastrointestinal alarm symptoms or signs* that are referral criteria for suspected gastro-oesophageal cancer according to NICE.\nDefinite referral criteria for urgent endoscopy to assess for gastro-oesophageal cancer\n  1. People of any age with dysphagia\n  2. People aged ≥55 years with weight loss and any of the following:\n    i. Dyspepsia.\n    ii. Upper abdominal pain.\n    iii. Reflux.\nProbable referral criteria for non-urgent endoscopy to assess for gastro-oesophageal cancer\n  1. People with haematemesis.\n  2. People aged ≥55 years with:\n    i. Treatment-resistant dyspepsia.\n    ii. Dyspepsia with raised platelet count or nausea or vomiting.\n    iii. Upper abdominal pain with low haemoglobin, raised platelet count or nausea or vomiting.\n    iv. Reflux with raised platelet count, or nausea or vomiting.\n    v. Nausea or vomiting with any of the following: weight loss, reflux, dyspepsia, or upper abdominal pain.\n*An upper abdominal mass felt to be consistent with stomach cancer is a probable referral criterion for an outpatient clinic appointment within 2 weeks."
        question: "According to the NICE criteria in the lecture, which patient needs urgent endoscopy"
        options:
          - "A 30-year-old with dysphagia"
          - "A 35-year-old with epigastric burning after meals"
          - "A 50-year-old with dyspepsia and no weight loss"
          - "A 45-year-old with bloating relieved by defecation"
        answer: 0
        why:
          - "صح: **dysphagia at any age** = urgent endoscopy."
          - "صغير ومفيش alarm: ده شكل EPS، والطريق positive diagnosis."
          - "الـ dyspepsia لوحدها بتبقى alarm لما يبقى السن 55 أو أكتر مع weight loss."
          - "الأعراض اللي بتروح بالتبرّز أقرب لـ IBS، ومفيش alarm."
      - kind: explain
        page: 103
        quote: "Box 1\nIn the absence of other upper gastrointestinal alarm symptoms or signs (see Table 2), only request 2-week wait endoscopy in the presence of:\n  Dyspepsia and weight loss if age ≥55 years\n  Dyspepsia and age >40 years from an area at increased risk of gastric cancer or with a family history of gastro-oesophageal malignancy\nConsider non-urgent endoscopy in the presence of:\n  Treatment-resistant dyspepsia if age ≥55 years\n  Dyspepsia with either a raised platelet count or with nausea or vomiting if age ≥55 years\nConsider urgent CT scan in the presence of:\n  Abdominal pain and weight loss if age ≥60 years\nConsider abdominal ultrasound in the presence of:\n  Epigastric pain <1 year with the characteristics of biliary colic"
        title: "إمتى منظار، وإمتى CT؟"
        text: |
          **2-week wait endoscopy** (من غير alarm تانية):
          - **Dyspepsia + weight loss** والسن 55 أو أكتر.
          - **Dyspepsia + age >40** من منطقة فيها gastric cancer عالي، أو فيه family history.

          **Non-urgent endoscopy** (55 أو أكتر): treatment-resistant dyspepsia، أو dyspepsia مع raised platelets أو nausea/vomiting.

          - **Urgent computed tomography (CT):** abdominal pain + weight loss والسن 60 أو أكتر.
          - **Abdominal US:** epigastric pain أقل من سنة بشكل ==biliary colic==.

          ولو مفيش حاجة من دول: ==make a positive diagnosis of FD== واشرح الـ gut–brain axis للمريض.

          التفسير المقبول (مش في الكتاب): ليه السن 55 و 60؟ لأن الـ gastric والـ pancreatic cancer بيزيدوا مع السن، فنفس العرض (dyspepsia مع weight loss) معناه مختلف في واحد عنده 25 وواحد عنده 60. وليه الـ CT في الألم مع weight loss؟ علشان البنكرياس مش بيبان في المنظار.
      - kind: figure
        page: 103
        title: "مفيش alarm؟ اعمل positive diagnosis"
        image: { file: git/L03-fd-positive-diagnosis.webp, book: true }
        alt: "Book flow chart: consider whether the patient needs further limited investigation; if not, make a positive diagnosis of FD, explain it in the context of the gut-brain axis, discuss treatment options, consider previous treatments and agree a follow-up plan. If yes, explain that FD is still likely; normal investigations lead back to the positive diagnosis, abnormal ones to treating the organic disease."
        caption: |
          الرسالة: الـ FD مش «تشخيص بالاستبعاد» وخلاص. لو مفيش alarm، اعمل ==positive diagnosis of FD== واشرحه في إطار الـ **gut-brain axis**، واتفق مع المريض على **follow-up plan** وتوقعات واقعية.

          ولو احتاج فحوصات محدودة وطلعت **abnormal**: عالج المرض الـ organic.
      - kind: reveal
        page: 103
        quote: "Explanation of the condition in the context of the gut"
        prompt: "ليه الكتاب بيقول positive diagnosis، مش «مفيش حاجة»؟"
        answer: |
          الكتاب: لو مفيش alarm features، ==explain a diagnosis of FD is still likely== والـ rationale ورا الفحوصات المحدودة، و**make a positive diagnosis of FD**، واشرح الحالة في إطار الـ **gut–brain axis**، وناقش العلاج، وخد في الاعتبار العلاجات اللي قبل كده وتفضيلات المريض، و**manage expectations** واتفق على follow-up. وكل ده بـ **empathy** و **active listening**.

          التفسير المقبول (مش في الكتاب): لو قلت للمريض «التحاليل سليمة، مفيش حاجة»، هيروح لدكتور تاني يعمل نفس الفحوصات. لكن لو قلت «عندك FD، ودي أسبابه، وده علاجه»، المريض بيحس إنه اتصدّق، فبيلتزم ويبطّل يلف على الدكاترة. والـ expectations مهمة لأن العلاج بيحسّن مش بيشفي 100%.
      - kind: case
        page: 102
        quote: "People aged =55 years with weight loss and any of the following:"
        stem: "Two patients have dyspepsia. A is 32 with no alarm features. B is 58 with dyspepsia and a 6 kg weight loss over 3 months."
        steps:
          - question: "Which patient meets the NICE definite criteria for urgent endoscopy?"
            options: ["Patient B", "Patient A", "Both", "Neither"]
            answer: 0
            why: "الكتاب: **55 أو أكتر** مع **weight loss** وأي من (dyspepsia، ألم فوق، reflux) = urgent endoscopy."
          - question: "What should patient A get first in the lecture's pathway?"
            options: ["H. pylori breath or stool test and a positive diagnosis of FD", "Urgent CT", "ERCP", "Colonoscopy"]
            answer: 0
            why: "من غير alarm features: **H. pylori testing**، شرح التشخيص، و **positive diagnosis of FD**. التفسير المقبول (مش في الكتاب): المنظار في شاب من غير alarm نادرًا ما بيغيّر العلاج."
      - kind: try
        items: [git.L03.105, git.L03.115, git.L03.117, git.L03.119, git.L03.129]
    recap:
      - "Dyspepsia: ألم أو حرقان فوق، شبع بدري، تقل بعد الأكل. خطر FD: سن أصغر، ستات، somatoform، DGBI تانية زي IBS."
      - "الآليات كتير ومش كلها في كل مريض: emptying، accommodation، sensitivity، CNS، immune، microbiome، permeability، genetics."
      - "Heartburn لوحده مش FD؛ ألم بيروح مع defaecation غالبًا IBS؛ FBC لو 55+، coeliac لو IBS overlap، H. pylori للكل."
      - "NICE urgent: dysphagia أي سن، أو 55+ مع weight loss و dyspepsia/ألم/reflux. CT عاجل: ألم و weight loss و 60+. US لو biliary colic."
      - "Positive diagnosis، شرح بالـ gut–brain axis، و manage expectations."
    practice: [git.L03.104, git.L03.105, git.L03.106, git.L03.114, git.L03.115, git.L03.116, git.L03.117, git.L03.118, git.L03.119, git.L03.120, git.L03.121, git.L03.129, git.L03.130]
