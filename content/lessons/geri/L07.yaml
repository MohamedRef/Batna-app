  # Split from lesson1 on 2026-11-13 (#828): indications and benefits of CGA.
  - id: geri.L07.lesson6
    title: "مين محتاج الـ CGA، وبيكسب منه إيه؟"
    hook: "وقعة بسبب منوّم جديد شكلها «حاجة بسيطة وهتروح». الكتاب بيقول: لأ، دي indication."
    minutes: 8
    pages: [108, 109]
    topics: [indications, benefits]
    goals:
      - "تعدّ الـ 6 indications وتعرف ليه كل واحدة"
      - "تفهم ليه السبب الـ reversible مش بيلغي الـ CGA"
      - "تعدّ الـ benefits وتربطها ببعض"
    status: unverified
    steps:
      - kind: explain
        remind: [geri.L07.013]
        page: 108
        title: "مين محتاج CGA؟"
        quote: "1) Elderly with frailty or one of the frailty syndromes as falls, confusion, reduced mobility and increasing incontinence, even if these appear to be due to a reversible cause (such as a new medication or minor infection)."
        text: |
          1. ==Frailty== أو frailty syndrome: **falls، confusion، reduced mobility، increasing incontinence**، حتى لو السبب باين إنه reversible (دوا جديد أو infection بسيطة).
          2. **At risk of frailty**.
          3. بعد الـ **discharge**، خصوصًا لو دخل بـ frailty syndrome أو قعد كتير لسبب تافه.
          4. كل اللي في **care homes**.
          5. الـ **perioperative period**.
          6. أي حد اتحوّل لـ CGA.

          ليه السبب الـ **reversible** مش بيلغي الـ CGA؟ عشان الكتاب بيقصد إن الوقعة أو التوهان من **حاجة بسيطة** (دوا جديد، infection بسيطة) دليل إن الاحتياطي قليل. الشاب ما بيقعش من منوّم واحد.

          ومنطق باقي القايمة:
          - **At risk of frailty**: الوقاية أسهل من العلاج، والكتاب بيقول الـ CGA ممكن **يعكس** الـ frailty.
          - **بعد الـ discharge**، خصوصًا لو القعدة **طويلة لسبب تافه**: يعني فيه حاجة خلّت الخروج صعب (function، بيت، رعاية)، وده اللي الـ CGA بيدوّر عليه.
          - **Care homes**: كلهم تقريبًا عندهم frailty و multiple pathology.
          - **Perioperative**: العملية stress كبير على احتياطي قليل، والكتاب في الـ benefits بيقول الـ CGA بيقلل مضاعفات وقعدة ما بعد العملية.
      - kind: figure
        page: 108
        quote: "1) Elderly with frailty or one of the frailty syndromes as falls, confusion, reduced mobility and increasing incontinence, even if these appear to be due to a reversible cause (such as a new medication or minor infection)."
