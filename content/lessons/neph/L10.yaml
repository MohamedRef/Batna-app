  - id: neph.L10.lesson4
    title: "الـ UTI من الأول للآخر"
    hook: "أرقام الـ culture، الميكروبات بالنسبة، العلاج بالجرعة، والحامل والقسطرة. كله في درس واحد."
    minutes: 10
    pages: [344, 351]
    topics: [uti-basics, uti-organisms, uti-tx, uti-special]
    goals:
      - "تعرف أرقام تشخيص الـ UTI حسب نوع العينة"
      - "تحفظ الميكروبات بالنسب وتفهم طريق العدوى والدفاعات"
      - "تعالج الـ UTI البسيطة والـ pyelonephritis والـ recurrent والقسطرة والحمل"
    status: unverified
    steps:
      - kind: explain
        page: 344
        title: "يعني إيه UTI؟"
        quote: "colony counts of 102 to 104/mL generally indicate infection"
        text: |
          ميكروبات في البول أو الـ urethra أو المثانة أو الكلية أو البروستاتا.

          - **Clean-catch midstream**: أكتر من ==10^5== organisms/mL = infection.
          - **Suprapubic aspiration** أو **in-and-out catheter**: ==10^2 لـ 10^4==/mL كفاية.

          ولو فيه dysuria و urgency و frequency **من غير** bacteriuria مهمة، اسمها ==acute urethral syndrome==.
      - kind: reveal
        page: 344
        quote: "In urine specimens obtained by suprapubic aspiration or"
        prompt: "ليه رقم الـ suprapubic أقل بكتير من الـ midstream؟"
        answer: "عينة الـ midstream بتعدّي على الـ urethra والجلد فممكن تتلوث، فلازم رقم عالي يثبت إنها عدوى حقيقية. الـ suprapubic جاية من المثانة على طول، فأي نمو حقيقي = infection."
      - kind: explain
        page: 345
        title: "مين بيجيله وإزاي؟"
        quote: "it is uncommon in men and children, and the urinary tract is often abnormal and requires investigation"
        text: |
          - **في الستات شائع**، وغالبًا الـ tract **طبيعي**. البكتيريا بتستعمر حوالين الـ urethra وتطلع. بعد الـ menopause الـ mucosa الضامرة وتغيّر الـ flora بيزوّدوا الخطر.
          - **في الرجالة والأطفال نادر**، والـ tract غالبًا ==فيه مشكلة== ولازم يتعمله investigation.
          - في المثانة، **البول المتبقي** (residual urine) بيسهّل العدوى.

          المصدر: ==bowel flora== بتاعة المريض نفسه، والطريق غالبًا **ascending transurethral** (وممكن دم، lymphatics، أو vesicocolic fistula).
      - kind: explain
        page: 345
        title: "دفاعات المسالك"
        quote: "Regular complete bladder emptying"
        text: |
          - **High urine flow**: البول بيغسل.
          - **Regular complete bladder emptying**: تفريغ المثانة كامل وبانتظام.
          - ==Tamm–Horsfall mucoprotein== والـ glycosaminoglycans: بيمسكوا الـ E. coli فما تلزقش في الـ urothelium.
          - **Mucosal defence**: طبقة glycosaminoglycans، IgA و IgG، و phagocytosis.
      - kind: table
        page: 346
        quote: "Proteus mirabilis 12"
        title: "الميكروبات بالنسبة"
        columns: [Organism, "%"]
        rows:
          - ["E. coli and coliforms", "68"]
          - ["Proteus mirabilis", "12"]
          - ["Staph saprophyticus or epidermidis", "10"]
          - ["Enterococcus faecalis", "6"]
          - ["Klebsiella aerogenes", "4"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
      - kind: aside
        tone: tip
        page: 346
        quote: "Escherichia coli and other 68"
        text: |
          الأرقام تنازلي ومجموعها 100: **68 – 12 – 10 – 6 – 4**. افتكر **E-P-S-E-K** (E. coli، Proteus، Staph، Enterococcus، Klebsiella).
      - kind: explain
        page: 346
        title: "العدوى اللي بتعمل acute TIN"
        quote: "Acute pyelonephritis leads to inflammation of the tubules, producing a neutrophilic cellular infiltrate."
        text: |
          - ==Acute pyelonephritis==: التهاب في الـ tubules بـ **neutrophils** (مش eosinophils زي الحساسية).
          - **Systemic infections**: فيروسات (EBV، HIV، measles، adenovirus)، بكتيريا (Legionella، Leptospira، streptococci، Mycoplasma، Brucella، Chlamydia)، Leishmania، Toxoplasma.
          - **في الكلية المزروعة**: ==CMV و HSV==.

          العلاج: اقضي على العدوى بالمضاد الحيوي أو الـ antiviral المناسب.
      - kind: figure
        page: 347
        title: "الـ vesicoureteric reflux ودرجاته"
        image: { file: neph/L10-vur-grades.webp, book: true }
        caption: "شمال: الصبغة بترجع من المثانة لفوق في الحالبين والكليتين. يمين: الدرجات من **I** (الحالب بس) لحد **V** (توسع والتواء شديد في الحالب والـ pelvis والـ calyces). والـ ==reflux nephropathy== أول اسم في قايمة أسباب الـ chronic TIN."
        alt: "Book figure: on the left a cystogram with contrast refluxing from the bladder up both ureters into both kidneys; on the right a drawing of vesicoureteric reflux grades I to V, from reflux into the ureter only to a grossly dilated, tortuous ureter and calyces."
      - kind: explain
        page: 347
        title: "الأعراض والتشخيص والعلاج"
        quote: "Treatment is over 3-5 days with:"
        text: |
          **الأعراض**: frequency بالليل والنهار، dysuria، ألم suprapubic، hematuria، بول ريحته وحشة.

          **التشخيص**: quantitative culture لعينة midstream (==10^5/mL== على الأقل) ووجود أو غياب الـ pyuria.

          **Single isolated attack**: الـ culture مستحب مش لازم؛ في الـ primary care الـ dipstick (nitrite و leucocyte esterase) كفاية. العلاج ==3–5 أيام==:
          - Amoxicillin 250 mg × 3
          - Nitrofurantoin 50 mg × 3
          - Trimethoprim 200 mg × 2
          - أو oral cephalosporin. والـ resistant: co-amoxiclav أو ciprofloxacin.
      - kind: check
        page: 348
        quote: "High fever, loin pain and tenderness (acute pyelonephritis)"
        question: "High fever, rigors, loin pain and vomiting in a young woman. Best start?"
        options:
          - "IV cefuroxime, then oral for 7 more days"
          - "Oral nitrofurantoin for 3 days"
          - "Wait for the culture"
          - "Oral amoxicillin 250 mg for 5 days"
        answer: 0
        why:
          - "صح: acute pyelonephritis = IV broad-spectrum (cefuroxime، cipro، أو gentamicin 2–5 mg/kg/day)، وبعدين oral 7 أيام."
          - "الكورس القصير للـ cystitis البسيطة بس."
          - "عيانة جدًا؛ ما تستناش."
          - "نفس الكلام: مش للـ pyelonephritis."
      - kind: explain
        page: 348
        title: "الـ recurrent والقسطرة"
        quote: "So long as the bladder catheter is in situ, antibiotic treatment is likely to be"
        text: |
          **Recurrent**: culture **قبل وبعد** العلاج ==إجباري== علشان تفرّق **relapse** من **reinfection**. لو relapse، دوّر على السبب (حصوة، كلية فيها scars) وشيله.

          **القسطرة**: بعد كام يوم المثانة بتتستعمر عادي (biofilm). طول ما الـ **catheter in situ**، المضاد الحيوي غالبًا مش هيشتغل. عالج **بس** لو فيه أعراض أو دليل عدوى، و==غيّر القسطرة== معاه.
      - kind: aside
        tone: analogy
        page: 348
        quote: "partly due to organisms forming biofilms"
        text: |
          الـ **organisms forming biofilms** زي الطحلب جوّه خرطوم الجنينة: تغسله بالكلور من برّه وهو لسه جوّه، يرجع تاني. الحل إنك ==تغيّر الخرطوم==.
      - kind: explain
        page: 349
        title: "الـ sterile pyuria والحمل"
        quote: "The urine of pregnant women must always be cultured as 2-6% have asymptomatic bacteriuria."
        text: |
          **Abacteriuric frequency/dysuria**: postcoital bladder trauma، vaginitis، atrophic vaginitis أو urethritis في الكبار، interstitial cystitis. ست صغيرة عندها **sterile pyuria**؟ استبعد ==Chlamydia و TB==.

          **الحمل**: لازم culture لكل حامل، لأن ==2–6%== عندهم asymptomatic bacteriuria. لو ما اتعالجتش: pyelonephritis شديدة بعدين و premature labour؛ ومع مرض كلى قديم: pre-eclampsia، anaemia، وأطفال صغيرين أو premature. لازم تتعالج ونتأكد إنها راحت.
      - kind: sort
        page: 349
        quote: "Drugs that must be avoided in pregnancy"
        prompt: "UTI in pregnancy: must be avoided, or can be used?"
        bins: ["Avoid", "Can be used"]
        cards:
