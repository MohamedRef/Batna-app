  - id: geri.L01.lesson6
    title: "علاج الـ HF: السلّم والجرعات وحذر الكبار"
    hook: "تبدأ صغير وتطلع ببطء. ده مش بس مبدأ، دي الجرعات بالمللي اللي في الكتاب."
    minutes: 10
    pages: [19, 24]
    topics: [hf-treatment, elderly-drugs]
    goals:
      - "تمشي على الـ heart failure with reduced ejection fraction (HFrEF) algorithm (ESC 2016)"
      - "تعرف جرعات البداية والـ target"
      - "تعرف قواعد الـ diuretics والـ sodium–glucose cotransporter 2 inhibitor (SGLT2i)"
      - "تتجنب فخاخ الأدوية عند الكبار"
    status: unverified
    steps:
      - kind: explain
        page: 19
        title: "Systolic CHF: الأدوات"
        quote: "Treatment of CHF due to systolic dysfunction\n  Diet\n  Exercise\n  Diuretics\n  ACE inhibitors and angiotensin II receptor antagonists"
        text: |
          علاج الـ congestive heart failure (CHF) بسبب الـ systolic dysfunction:
          - Diet و exercise
          - **Diuretics**
          - ==angiotensin-converting enzyme (ACE) inhibitors و angiotensin II receptor blockers (ARBs)==
          - **Digoxin**
          - Vasodilators
          - ==Beta-blockers==
      - kind: figure
        page: 20
        quote: "Treatment of HFrEF (ESC Guidelines 2016)\nPatient with symptomatic HFrEF\nTherapy with ACE-I and beta-blocker (Up-titrate to maximum tolerated evidence-based doses)\nStill symptomatic and LVEF ≤35%? No: no further action required. Yes:\nAdd MR antagonist (up-titrate to maximum tolerated evidence-based dose)\nStill symptomatic and LVEF ≤35%? No: no further action required. Yes:\n  Able to tolerate ACEI (or ARB): ARNI to replace ACE-I\n  Sinus rhythm, QRS duration ≥130 msec: Evaluate need for CRT\n  Sinus rhythm, HR ≥70 bpm: Ivabradine\nThese above treatments may be combined if indicated\nResistant symptoms\n  Yes: Consider digoxin or H-ISDN or LVAD, or heart transplantation\n  No: No further action required. Consider reducing diuretic dose\nThroughout: diuretics to relieve symptoms and signs of congestion; if LVEF ≤35% despite OMT or a history of symptomatic VT/VF, implant ICD"
        title: "سلّم الـ HFrEF (ESC 2016)"
        alt: "Ladder: symptomatic HFrEF; start ACE inhibitor and beta-blocker; if still symptomatic with LVEF 35% or less, add MR antagonist; if still symptomatic, three branches: ARNI to replace ACEI, CRT if sinus rhythm with QRS 130 ms or more, ivabradine if sinus rhythm with heart rate 70 or more; resistant symptoms lead to digoxin, H-ISDN, LVAD or transplant. Side bars: diuretics for congestion, ICD if LVEF 35% or less despite therapy."
        caption: "كل درجة: لو لسه **symptomatic** و **left ventricular ejection fraction (LVEF) ≤35%** اطلع اللي بعدها. والـ diuretics للـ congestion في أي درجة، والـ implantable cardioverter-defibrillator (ICD) لو LVEF ≤35% رغم العلاج."
        svg: |
          <svg viewBox="0 0 330 370" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L01c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="60" y="6" width="210" height="30" rx="8" class="fg-acc"/>
            <text x="165" y="26" text-anchor="middle" class="t-sm t-b">Symptomatic HFrEF</text>
            <path d="M165 36 V52" class="fg-arrow" marker-end="url(#L01c)"/>
            <rect x="40" y="54" width="250" height="40" rx="8" class="fg-good"/>
            <text x="165" y="72" text-anchor="middle" class="t-sm t-b">ACE-I + beta-blocker</text>
            <text x="165" y="87" text-anchor="middle" class="t-sm">up-titrate to max tolerated</text>
            <path d="M165 94 V116" class="fg-arrow" marker-end="url(#L01c)"/>
            <text x="172" y="110" class="t-sm t-acc">still sympt., EF ≤35%</text>
            <rect x="40" y="118" width="250" height="32" rx="8" class="fg-good"/>
            <text x="165" y="139" text-anchor="middle" class="t-sm t-b">Add MR antagonist</text>
            <path d="M165 150 V172" class="fg-arrow" marker-end="url(#L01c)"/>
            <text x="172" y="166" class="t-sm t-acc">still sympt., EF ≤35%</text>
