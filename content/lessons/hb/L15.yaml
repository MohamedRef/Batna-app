        pairs:
          - ["Every patient, on admission", "Abdominal ultrasound"]
          - ["Not improving at 72 h", "Contrast CT"]
          - ["Pregnant, need to see necrosis", "T2 MRI without gadolinium"]
          - ["Suspected 3 mm CBD stone", "MRCP"]
