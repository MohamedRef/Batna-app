items:
  # ---------- p54: definitions ----------
  - id: geri.L04.001
    kind: card
    topic: definitions
    front: Define dementia.
    back: A progressive, global decline in cognitive and behavioural functioning that interferes with daily living activities and social relationships.
    src: { page: 54, quote: "Dementia = a progressive, global decline in cognitive and behavioural functioning that interferes with daily living activities and social relationships" }
    status: unverified
    tags: [high-yield]
  - id: geri.L04.002
    kind: card
    topic: definitions
    front: What is age-associated memory impairment?
    back: A decline in short-term memory that sometimes accompanies ageing ("benign senescent forgetfulness").
    src: { page: 54, quote: "Age-associated memory impairment = A decline in short-term memory that sometimes accompanies aging" }
    status: unverified
  - id: geri.L04.003
    kind: card
    topic: definitions
    front: Define Alzheimer's disease.
    back: "An age-related primary degenerative brain disease, the commonest cause of dementia in older people, marked by progressive irreversible declines in memory, routine tasks, language and communication, abstract thinking, and the ability to learn and calculate."
    src: { page: 54, quote: "commonest cause of dementia among older people marked by progressive irreversible declines in memory,performance of routine tasks" }
    status: unverified
    tags: [high-yield]
  - id: geri.L04.004
    kind: enumerate
    topic: definitions
    prompt: "Enumerate the three dementia-related terms the lecture lists after defining Alzheimer's disease."
    points: ["Dementia of the Alzheimer's type (DAT)", "Non-Alzheimer's dementias", Pseudodementia]
    pass: 3
    src: { page: 54, quote: "Dementia of the Alzheimer's Type (DAT) Non-Alzheimer's Dementias Pseudodementia" }
    status: unverified
