  - id: hb.L03.lesson6
    title: "لما الرباط ما يكفيش: gastric varices و TIPS"
    hook: "سوبر جلو جوه المعدة، بالونة في المريء، وماسورة جوه الكبد. وبعدين: إزاي نمنع النزيف يرجع؟"
    minutes: 10
    pages: [52, 56]
    topics: [endoscopy, rescue-tips, secondary-prophylaxis]
    goals:
      - "تعرف أرقام الـ gastric varices وعلاجها (cyanoacrylate و thrombin)"
      - "تمشي في الـ algorithm لحد الـ rescue TIPS"
      - "تقارن الـ balloon tamponade بالـ covered metal stent"
      - "تعرف الـ TIPS: تشريحه، early TIPS، ومضاعفاته"
      - "تختار الـ secondary prophylaxis"
    status: unverified
    steps:
      - kind: explain
        page: 52
        title: "الـ gastric varices"
        text: |
          - موجودة في **5–30%** من مرضى الـ cirrhosis.
          - مسؤولة عن **10–15%** من نوبات الـ variceal bleeding.
          - **Risk factors** للنزيف: **size، Child class، presence of red spots**.
          - **Standard endoscopic therapy: cyanoacrylate.**
      - kind: table
        page: 53
        title: "Cyanoacrylate for gastric varices"
        columns: ["Pros", "Cons"]
        rows:
          - ["Effective; most studied", "High risk of complications: local and systemic (embolic)"]
          - ["Standard first line in many centres", "High rebleeding rate"]
          - ["May avoid further interventions", "Cumbersome, difficult to use"]
          - ["Cost-effective", "Can damage the scope; not approved in the USA and other countries"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: aside
        tone: analogy
        page: 53
        text: |
          الـ **cyanoacrylate** هو نفس كيميا **السوبر جلو**. 😄

          وزي ما السوبر جلو بيلزق صوابعك في بعض، ممكن **يلزق في المنظار ويبوّظه**، ولو نقطة هربت في الدم تعمل **embolism**. وعلشان كده الـ **thrombin** بديل: بيحوّل الـ **fibrinogen لـ fibrin clot**، human (Evithrom) أو bovine، **5000 U/vial**، حوالي **5–10 mL** في الجلسة، و **no important side effects**.
      - kind: figure
        page: 54
        title: "الـ algorithm لحد الـ rescue"
        alt: "Flowchart. Cirrhosis with acute bleeding. Two parallel starts: general management (antibiotics, careful replacement of volume) and an early drug (terlipressin, somatostatin, octreotide or vapreotide). Then endoscopy with band ligation or sclerotherapy, keeping the drug for 2 to 5 days. If bleeding is not controlled or there is early rebleeding, a second course of endoscopic therapy. If that fails or rebleeding recurs, rescue covered TIPS, with balloon tamponade or a covered metal stent as a bridge."
        caption: "خطة واحدة: إنعاش + دوا بدري ← منظار ← منظار تاني لو فشل ← **rescue covered TIPS**، والبالونة أو الـ stent **كوبري** لحد ما توصل للـ TIPS. الصورة دي بتقول الدوا **2–5 أيام**، والنص في صفحة 48 بيقول **3–5**."
        svg: |
          <svg viewBox="0 0 330 470" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
