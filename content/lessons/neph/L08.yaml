    title: "Case 8: الـ amyloid، والـ fibrils بالنانومتر"
    hook: "M-band في الدم، ومادة pink في الـ glomeruli بتنوّر أخضر تحت الـ polarized light. وبعدين: اقرا الـ IF والـ EM لوحدك."
