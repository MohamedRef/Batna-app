          </svg>
      - kind: reveal
        page: 113
        quote: "If thyroxine is to be given it must be given after the administration of glucorticoids, to avoid exacerbation of the cardiovascular collapse after correction of the metabolic rate."
        prompt: "ليه الـ thyroxine لازم ييجي بعد الـ glucocorticoid؟"
        answer: "الـ thyroxine بيرفع الـ **metabolic rate** فالجسم بيستهلك cortisol أكتر. لو مفيش cortisol أصلًا، الـ **cardiovascular collapse** هيزيد. نفس القاعدة في أي hypopituitarism."
      - kind: aside
        tone: joke
        page: 113
        quote: "If thyroxine is to be given it must be given after the administration of glucorticoids, to avoid exacerbation of the cardiovascular collapse after correction of the metabolic rate."
        text: "الـ thyroxine من غير steroid زي ما تدوس بنزين في عربية مفيهاش زيت: هتتحرك ثانيتين وبعدين المكنة تقف وييجي **cardiovascular collapse**. **Glucocorticoids first**."
      - kind: explain
        page: 113
        quote: "Routine early transsphenoidal surgery, especially when there are visual acuity or visual field abnormalities, as recovery is greater."
        title: "نعمل جراحة ولا نستنى؟"
        text: |
          - **Routine early transsphenoidal surgery (TSS)**، خصوصًا لو فيه مشكلة في الـ **visual acuity** أو الـ **visual field**، لأن الـ recovery بيبقى أكبر.
          - لو **مفيش visual deficit**، أو الـ deficit بيتحسن لوحده: بعض الدراسات لقت إن الجراحة البدري **مش بتحسّن** الـ neuro-ophthalmological outcome ولا الـ endocrine deficiencies مقارنة بالـ ==conservative management==.
          - بعد ما يستقر: **full endocrine investigation** علشان نعرف محتاج hormone replacement إيه، و ==lifelong follow-up==.

          الكتاب بيقول كمان إن ظهور نقص هرمونات pituitary تانية **highly probable**، يعني متكتفيش بالـ cortisol. التفسير المقبول (مش في الكتاب): الـ optic chiasm قاعد فوق الـ pituitary على طول، فكل ساعة ضغط عليه بتقلل فرصة رجوع النظر؛ علشان كده النظر هو اللي بيقرر توقيت الجراحة.
      - kind: check
        page: 113
        quote: "Some studies have found that, in patients in whom there is no visual deficit, or the deficit is resolving spontaneously, early surgical intervention does not offer any improvement in outcomes in terms of final neuro-ophthalmological defect or endocrine deficiencies compared with conservative management."
        question: "Pituitary apoplexy on hydrocortisone. Visual fields were mildly cut on day 1 and are now returning to normal. What does the lecture support?"
        options: ["Conservative management with close follow-up", "Urgent transsphenoidal surgery today", "Stop hydrocortisone now that vision improves", "Start thyroxine before steroids"]
        answer: 0
        why:
          - "صح: الـ deficit بيتحسن لوحده، والجراحة البدري هنا مش بتحسّن النتيجة."
          - "الجراحة البدري لما فيه deficit ثابت أو بيزيد."
          - "الـ cortisol deficiency لسه موجودة؛ الـ steroid مكمّل."
          - "الـ thyroxine دايمًا بعد الـ glucocorticoid."
      - kind: try
        items: [endo.L07.001, endo.L07.003, endo.L07.005, endo.L07.009, endo.L07.012]
    recap:
      - "سبع طوارئ: apoplexy، myxedema coma، storm، hypo/hypercalcaemia، adrenal crisis، pheo crisis."
      - "Apoplexy = نزيف في adenoma؛ أخطر حاجة نقص الـ cortisol."
      - "Triad: headache، diplopia، hypopituitarism. الـ DD: SAH و meningitis."
      - "Hydrocortisone 100 mg IV كل 6 ساعات؛ thyroxine بعده بس."
      - "TSS بدري لو فيه visual deficit."
    practice: [endo.L07.001, endo.L07.002, endo.L07.003, endo.L07.004, endo.L07.005, endo.L07.006, endo.L07.007, endo.L07.008, endo.L07.009, endo.L07.010, endo.L07.011, endo.L07.012, endo.L07.013, endo.L07.100]
