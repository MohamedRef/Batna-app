  - id: endo.L07.091
    kind: card
    topic: pheo
    front: Oral treatment after stabilizing a pheochromocytoma crisis?
    back: Nifedipine or labetalol are oral choices; then phenoxybenzamine 10 mg twice daily titrated to BP; propranolol added later to optimize for surgery.
    src: { page: 136, quote: "The use of nitroprusside should be brief, due to possible cyanide toxicity.\nOral choices are nifedipine or labetalol.\nOnce the patient is stable, oral phenoxybenzamine 10 mg twice daily is initiated and the dose titrated according to the blood pressure." }
    update:
      text: "Labetalol is not recommended as initial therapy in phaeochromocytoma: its beta-blockade is much stronger than its alpha-blockade, so it can cause paradoxical hypertension. Start alpha-blockade (or a calcium channel blocker) first and add a beta-blocker only after adequate alpha-blockade. In the exam give the book's answer."
      ref: "Endocrine Society clinical practice guideline on pheochromocytoma and paraganglioma (Lenders et al., 2014)"
    status: unverified
