        title: "ISTH 2020"
        columns: [Situation, Do]
        rows:
          - [Initial, "PEX + steroids (strong)"]
          - [First acute event, "+ rituximab (conditional)"]
          - [Relapse, "PEX + steroids + rituximab + caplacizumab"]
          - [Remission with low ADAMTS13, Prophylactic rituximab]
          - [Pregnant with low ADAMTS13, Prophylactic plasma infusion]
