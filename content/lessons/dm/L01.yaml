        text: "العيان بياكل كتير وبيخس. ده مش ريجيم سحري: الخلايا **جعانة** والسكر واقف برا الباب في الدم، والبول بياخد الباقي. أغلى ريجيم في الدنيا، تمنه الكلى والعين."
      - kind: explain
        page: 7
        title: "Acute ولا subacute؟"
        quote: "Subacute: older, several months - Thirst, weight loss, and polyuria. - Lack of energy. - Blurring of vision."
        text: |
          - **Acute, classic, severe (type 1):** polyuria، polydipsia، polyphagia، weight loss. ومفيش **signs**، إلا في الحالات الـ ==fulminant==: dehydration و acidosis (**DKA**).
          - **Subacute (type 2، أكبر سنًا، على شهور):** thirst، weight loss، polyuria، **lack of energy**، **blurred vision**، و **balanitis أو pruritus vulvae**.
      - kind: check
        page: 6
        quote: "When the blood glucose level reaches above the renal threshold of the individual, which is on average 180mg/dl"
        question: "A patient's glucose runs at 160 mg/dl. Why might he have no polyuria?"
        options:
          - "It is below the average renal threshold of 180 mg/dl"
          - "Polyuria needs ketones"
          - "Polyuria only occurs in type 1"
          - "160 is a normal glucose"
        answer: 0
        why:
          - "صح: تحت الـ threshold الكلية بترجّع السكر كله، فمفيش osmotic diuresis."
          - "الـ polyuria من الجلوكوز نفسه، مش من الـ ketones."
          - "Type 2 كمان بيعمل polyuria في الـ subacute presentation."
          - "160 مش طبيعي؛ ده hyperglycemia بس asymptomatic."
      - kind: explain
        page: 8
        title: "الـ Asymptomatic: الأغلبية الصامتة"
        quote: "Presented by chronic complications (10-20% of cases): Macrosomic baby, PN. and premature atherosclerosis."
        text: |
          ناس كتير بـ **type 2** و **IGT** و **GDM** مالهمش أعراض. الأسباب: **primary DM (غالبًا type 2)**، **prediabetes**، **GDM**.

          بيتكشف إزاي؟
          - **بالصدفة:** glycosuria أو تحليل روتيني.
          - **بالمضاعفات (==10–20%==):** macrosomic baby، peripheral neuropathy، premature atherosclerosis.
      - kind: explain
        page: 8
        title: "علامات تدوّر عليها في الكشف"
        quote: "Signs of insulin resistance e.g. Acanthosis Nigricans or Polycystic ovary syndrome."
        text: |
          في الـ **type 2** اللي من غير أعراض:
          1. **Pruritus vulvae** أو **balanitis** (السكر في البول بيأكّل الفطريات).
          2. **Loss of ankle reflexes**.
          3. **Loss of peripheral sensation**.
          4. **Hypertension** وعلامات atherosclerosis: dorsalis pedis ضعيف، **carotid bruit**.
          5. علامات ==insulin resistance==: **acanthosis nigricans**، **PCOS**.
