  - id: geri.L01.112
    kind: essay
    topic: aging
    prompt: List common cardiovascular disorders in the elderly.
    outline:
      - Age-associated changes:
        - Amyloid heart disease (conduction disease, restrictive cardiomyopathy)
        - Atrial fibrillation, one-third, often lone
        - LV stiffness and diastolic heart failure
        - Postural hypotension (20%) and syncope
        - Calcific aortic and mitral valve disease
        - Sick sinus syndrome and AV block
      - Hypertension:
        - Mainly systolic, from a stiff calcified aorta
        - Treat 65–79 at SBP ≥140, ≥80 at SBP ≥160
      - Coronary artery disease:
        - 85% of CAD deaths after 65
        - Angina in 80%; dyspnea on exertion common
        - Silent and atypical MI, especially over 80
      - Heart failure:
        - 6–10% over 65
        - Systolic (CAD most common) and diastolic (30–50%, rises with age, females)
    src: { page: 2, quote: "Coronary Atherosclerosis is common and Silent MI." }
    status: unverified
    tags: [book-question]
  - id: geri.L01.113
    kind: essay
    topic: mi
    prompt: What are the atypical presentations of cardiac disorders in the elderly?
    outline:
      - Coronary disease:
        - Exertional angina hard to elicit (limited activity)
        - Dyspnea on exertion instead of pain
        - Palpitation, weakness, unexplained sweating, indigestion, neck and shoulder pain
        - Rest or rapidly progressive angina is frequent
      - Myocardial infarction (especially over 80):
        - Silent MI
        - Early dyspnea, confusion, syncope
        - GI complaints; conduction defects
      - Other:
        - Postural hypotension and syncope
        - Digoxin toxicity with headache and neurological signs
    src: { page: 12, quote: "The presenting symptoms of (MI) can be quite atypical, specially in patients over age 80 or Silent MI" }
    status: unverified
    tags: [book-question]
