    status: unverified
  - id: endo.L06.033
    kind: mcq
    topic: pregnancy
    stem: At 10 weeks a woman has a TSH of 0.08 mU/L, a mildly raised FT4, no goitre and no eye signs. TRAb is negative. What is the most likely explanation?
    options: [hCG stimulating the TSH receptor (gestational), Graves' disease, Toxic adenoma, Assay interference from TBG]
    answer: 0
    why:
      - "Correct: a transient first-trimester FT4 rise from hCG acting on the TSH receptor."
      - "Negative TRAb and no eye signs argue against Graves'."
      - "Nothing suggests a nodule."
      - "TBG rises total, not free, hormones."
    src: { page: 105, quote: "3. Pregnancy:\n  Pregnancy has a significant impact on hpt physiology.\n  Tbg ↑as a consequence of oestrogen-induced increased hepatic synthesis, together with reduced degradation.\n  Total t4 and t3 ↑ to 150% of non-pregnant values during the first half of pregnancy and maintained until parturition.\n  Transient ↑ in ft4 in first trimester is due to the stimulatory effects of ↑ hcg acting on the tsh receptor.\n  In hyperemesis gravidarum women become overtly thyrotoxic with a fully suppressed tsh.\n  In this setting, it is important to distinguish gestational hyperthyroidism from other causes of thyrotoxicosis (e.g. Graves' disease) & (trab) measurement is helpful." }
    status: unverified
  # ---------- p106: levothyroxine ----------
  - id: endo.L06.034
    kind: table
    topic: levothyroxine
    title: Anomalous TFTs on levothyroxine (book table, p106)
    columns: [Pattern, Cause]
    rows:
      - ["A. Normal TSH, mildly ↑FT4", Normal physiological variant]
      - ["B. ↑TSH, low-normal or ↓FT4 (needs high L-T4)", "Maladministration, malabsorption, ↑TH metabolism or excretion, ↑TH binding capacity"]
      - ["C. Unexpected change in dose needs", Change in L-T4 preparation]
      - ["D. ↑TSH, normal FT4", TSH assay interference]
      - ["E. Persistent ↑TSH with ↓, ↑ or normal FT4 on high doses", Poor compliance]
      - ["F. Supraphysiologic L-T4 needed; ↑FT4 and ↑FT3", Resistance to thyroid hormone]
    blanks: [[0, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 106, quote: "Causes of anomalous TFTs in patients receiving levothyroxine therapy\n| TFT patterns/LT4 dosage requirements | Cause | Explanation |\n|---|---|---|\n| A. Normal TSH, mildly ↑FT4; (± higher than predicted L-T4 requirements) | Normal physiological variant | To abolish symptoms and normalise TSH concentrations, some individuals exhibit mildly elevated FT4 (possibly reflecting less efficient deiodination of T4 to T3); FT3 is typically normal |\n| B. ↑TSH, low normal or ↓FT4; (Requirement for high L-T4 dosages to normalise TSH) | (i) Maladministration | Patients should be advised to take L-T4 on an empty stomach; certain foodstuffs (e.g. fibre, espresso coffee) and some medications (e.g. iron, calcium, PPIs, sucralfate, aluminium hydroxide, cholestyramine, colestipol) may impair L-T4 absorption |\n|  | (ii) Malabsorption syndromes | L-T4 malabsorption occurs with coeliac disease, achlorhydria, lactose intolerance (lactose is a constituent of some L-T4 preparations) |\n|  | (iii) Increased TH metabolism or excretion | Phenytoin, carbamazepine, phenobarbitone, rifampicin and some tyrosine kinase inhibitors (e.g. Imatinib) increase L-T4 requirements by enhancing hepatic metabolism of TH; occasional cases of increased urinary TH loss complicating nephrotic syndrome have also been reported |\n|  | (iv) Increased TH binding capacity | Oral oestrogen therapy or gonadotrophin-induced rise in oestrogen concentrations (e.g. IVF treatment) results in a marked increase in TBG and hence TH binding capacity, necessitating an increase in L-T4 therapy; similar effects are seen with SERMs and mitotane |\n| C. Unexpected change in L-T4 dosage requirements to maintain clinical and biochemical euthyroidism | Change in LT4 preparation | Not all L-T4 preparations are of comparable potency/bioavailability; changes in preparation are generally best avoided but, if necessary, should prompt more frequent TFT monitoring |\n| D. ↑TSH, normal FT4 | TSH assay interference | Heterophilic antibody interference in the TSH assay may yield falsely elevated results; FT3 is normal |\n| E. Persistent ↑TSH, with ↓, ↑ or normal FT4, despite treatment with high L-T4 dosages | Poor compliance | Owing to their differing half-lives, intermittent thyroxine ingestion may result in normal or even elevated TH concentrations, but fails to normalize TSH |\n| F. Supraphysiologic L-T4 required to normalise TSH, but with resultant ↑FT4 (and ↑FT3) | Resistance to thyroid hormone | Typically seen following inappropriate thyroid ablation or concomitant primary hypothyroidism in a patient harbouring a mutation in the human thyroid hormone receptor β (THRB) gene |\nIn athyreotic individuals total daily levothyroxine requirements can be estimated based on body weight and usually fall in the range 1.6–2.0 mcg/kg (NB: the elderly typically require lower dosages, and caution must be exercised when commencing treatment in those with confirmed/suspected ischaemic heart disease or arrhythmias)." }
    status: unverified
    tags: [high-yield]
