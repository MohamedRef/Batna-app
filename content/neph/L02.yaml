  - id: neph.L02.101
    kind: card
    topic: acidosis
    front: How does acidosis damage the kidney in CKD (Figure 4)?
    back: Acid retention raises renal ammonium (NH4+), endothelin and RAS activity, which drive tubulointerstitial fibrosis; acidemia also causes muscle catabolism.
    src: { page: 54, quote: "Figure 4: Mechanisms of acid-mediated tubulointerstitial fibrosis in chronic kidney disease (CKD). Abbreviations: ET-A, endothelin-A; ET-B, endothelin-B; NH4+, ammonium ion; RAS, renin-angiotensin system.\nCKD → Acidemia\nMuscle catabolism → Amino acids → Renal NH4+\nBone resorption → buffers Acidemia (−)\nAcidemia → Renal NH4+ → Complement activation → Interstitial fibrosis\nAcidemia → RAS activation → Interstitial fibrosis; H+ secretion\nAcidemia → Endothelin → ET-A receptors → Interstitial fibrosis\nEndothelin → ET-B receptors → H+ secretion\nInterstitial fibrosis → CKD (+)" }
    status: unverified
