      - kind: order
        page: 5
        quote: "New Product Development: A Risky and Expensive Proposition\n  Discovery (2–10 Years): 5,000–10,000 Screened\n  Preclinical Testing, Laboratory and Animal Testing: 250 Enter Preclinical Testing\n  Phase I: 20–80 Healthy Volunteers Used to Determine Safety and Dosage\n  Phase II: 100–300 Patient Volunteers Used to Look for Efficacy and Side Effects\n  Phase III: 1,000–5,000 Patient Volunteers Used to Monitor Adverse Reactions to Long-Term Use (5 Enter Clinical Testing)\n  FDA Review Approval: 1 Approved by the FDA\n  Additional Post-Marketing Testing\nNet Cost: $802 Million Invested Over 15 Years (Source: Tufts Center for the Study of Drug Development)"
        prompt: "رتّب مشوار الـ drug development من الفكرة للسوق:"
        steps:
          - "Discovery"
          - "Preclinical: laboratory and animal testing"
          - "Safety and dosage in 20-80 healthy volunteers"
          - "Efficacy and side effects in 100-300 patients"
          - "Long-term adverse reactions in 1,000-5,000 patients"
          - "FDA review approval"
          - "Additional post-marketing testing"
      - kind: explain
        remind: [res.L06.053]
        page: 37
        quote: "Phase I:\n  To find safe range of dose\n  On healthy volunteers (Except cancer and HIV)\n  Test pharmacokinetics and dose response characteristics\n  Open label\n  Non randomized\n  Uncontrolled\n  Enroll up to 100 healthy volunteers"
        title: "Phase I: هل هو آمن؟ وبأنهي جرعة؟"
        text: |
          - الهدف: ==To find safe range of dose==، ونختبر **pharmacokinetics** و **dose-response**.
          - على **healthy volunteers**، **إلا في الـ cancer والـ human immunodeficiency virus (HIV)**.
          - **Open label**، **non randomized**، **uncontrolled**.
          - لحد **100** متطوع.
      - kind: reveal
        page: 37
        quote: "Phase I:\n  To find safe range of dose\n  On healthy volunteers (Except cancer and HIV)\n  Test pharmacokinetics and dose response characteristics\n  Open label\n  Non randomized\n  Uncontrolled\n  Enroll up to 100 healthy volunteers"
        prompt: "ليه phase I في الـ cancer والـ HIV بيتعمل على **عيانين** مش متطوعين أصحاء؟"
        answer: |
          لأن أدوية الـ cancer (chemotherapy) والـ HIV ليها toxicity عالية. مينفعش أخلاقيًا تدّي سم لواحد سليم مش هيستفيد حاجة.

          العيان على الأقل عنده فرصة يستفيد، فالـ risk بيبقى ليه مقابل.
      - kind: explain
        remind: [res.L06.056]
        page: 38
        quote: "Phase II (Therapeutic exploratory):\n  clinical trials to evaluate efficacy (and safety) in selected patients\n  Objectives may focus on dose-response, type of patient, frequency of dosing.\nPhase III:\n  Large sample (1000-3000)\n  Randomized\n  Active-controlled\n  Double blind\n  Parallel\n  Multicentre"
        title: "Phase II و Phase III"
        text: |
          **Phase II (therapeutic exploratory)**: على **selected patients** علشان نشوف الـ **efficacy** (والـ safety). الأسئلة: الـ dose-response، أنهي نوع عيانين، كام مرة في اليوم.

          **Phase III**: التجربة «الكبيرة»:
          - ==Large sample (1000-3000)==
          - **Randomized**، **active-controlled**، **double blind**، **parallel**، **multicentre**.
          - بنقارن بالـ **current gold standard**.
      - kind: table
        page: 36
        quote: "New Drug Clinical Trials\n| Phase 1 | Phase 2 | Phase 3 | FDA Review / Phase 4 trials |\n|---|---|---|---|\n| Checking for Safety | Checking for Efficacy | Confirm results | |\n| 20-100 volunteers. 1st state of testing in humans | 100-500 patients. How well does the drug work? | 1,000–5,000 patients. Drug MUST be safe; Comparison with current 'gold standard' treatment | Safety surveillance in 'Real-life' patients |"
        title: "الـ 4 phases في جدول"
        columns: ["Phase", "Question", "Who and how many"]
        rows:
          - ["Phase 1", "Safety (first in humans)", "20-100 volunteers"]
          - ["Phase 2", "Efficacy: how well does it work?", "100-500 patients"]
          - ["Phase 3", "Confirm; compare with the gold standard", "1,000-5,000 patients"]
          - ["Phase 4", "Safety surveillance", "Real-life patients"]
        hide: [[0, 1], [1, 1], [2, 2], [3, 1]]
      - kind: aside
        tone: trap
        page: 38
        quote: "Phase II (Therapeutic exploratory):\n  clinical trials to evaluate efficacy (and safety) in selected patients\n  Objectives may focus on dose-response, type of patient, frequency of dosing.\nPhase III:\n  Large sample (1000-3000)\n  Randomized\n  Active-controlled\n  Double blind\n  Parallel\n  Multicentre"
        text: |
          الأرقام مختلفة شوية بين الشرايح: شريحة بتقول phase I **20–80** وشريحة **20–100** (وشريحة تانية «up to 100»)، و phase III **1,000–5,000** في مكان و **1000–3000** في مكان.

          في الامتحان الـ multiple choice question (MCQ) غالبًا بيسأل عن **الترتيب**: phase I أقل من 100، phase II بالمئات، phase III بالآلاف. لو الاختيارات فيها رقم من الشرايح، اختار اللي في نفس الـ range.
      - kind: explain
        page: 39
        quote: "Phase IV, Postmarketing Surveillance (Uncontrolled, Observational):\n  Involve long term safety surveillance to detect rare side effects\n  Sometimes mandated by the FDA for additional testing including interactions with other drugs and testing on certain populations.\n  Adverse effects detected by Phase IV trials may result in withdrawal or restriction of a drug; recent examples include Vioxx."
        title: "Phase IV: بعد ما الدوا نزل"
        text: |
          ==Postmarketing surveillance==: **long-term safety surveillance** علشان نلقط الـ **rare side effects**.

          - ساعات الـ FDA بتطلبها: interactions مع أدوية تانية، أو فئات معينة.
          - لو ظهرت adverse effects ممكن الدوا **يتسحب أو يتقيّد**. المثال: **Vioxx**.
          - وهي **uncontrolled, observational**.

          ليه الـ rare side effects مبتظهرش قبل كده؟ side effect بيحصل لواحد من 10,000 مش هيظهر في phase III فيها 3,000 عيان.
      - kind: check
        page: 40
        quote: "Which of the following characterizes phase III drug testing?\n  a. It usually requires small patient numbers.\n  b. It can be done without approval.\n  c. It usually involves a comparison between different treatments.\n  d. It always demonstrates superiority of the new approach.\nAnswer: c"
        question: "Which of the following characterizes phase III drug testing?"
        options:
          - "It usually requires small patient numbers."
          - "It can be done without approval."
          - "It usually involves a comparison between different treatments."
          - "It always demonstrates superiority of the new approach."
        answer: 2
        why:
          - "Phase III بالآلاف."
          - "كل phase محتاج approval."
          - "صح: active-controlled، بيقارن بالـ gold standard."
          - "مفيش «always»؛ ممكن يطلع non-inferior أو يفشل."
      - kind: case
        page: 41
        quote: "Eighty-two patients, whose duodenal ulcers were recurrent, were entered in a treatment protocol of \"triple therapy\" course to eradicate Helicobacter pylori (HP) infection. Duodenal ulcer healed in 78 patients available for endoscopy. Their inference that in patients with duodenal ulcers, triple therapy is the therapy of choice is:\n  a. Correct\n  b. Incorrect because it is not based on rates\n  c. Incorrect because there is no comparison group\n  d. None of the above\nAnswer: c"
        stem: "82 patients with recurrent duodenal ulcers got triple therapy to eradicate H. pylori. The ulcer healed in 78 of those available for endoscopy. The authors say triple therapy is the therapy of choice."
