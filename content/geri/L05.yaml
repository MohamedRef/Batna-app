schema: batna.content/v1
lecture: geri.L05
title: Cerebrovascular disorders in the elderly
author: Dr. Mohammed Mehanna
book: { chapter: 7, pages: [84, 90] }
topics:
  - { id: definition, title: "Stroke: definition and types" }
  - { id: tia, title: "Transient ischemic attacks" }
