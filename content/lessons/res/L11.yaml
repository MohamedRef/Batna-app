  - id: res.L11.lesson4
    title: "Non-probability: لما الصدفة مش هي اللي بتختار"
    hook: "أغلب أبحاث المستشفيات بتاخد «اللي جه العيادة». ده اسمه إيه، وإمتى يبقى مقبول؟"
    minutes: 9
    pages: [50, 62]
    topics: [nonprobability]
    goals:
      - "تفرّق بين convenience و consecutive و purposive و snowball و quota"
      - "تعرف ليه الـ consecutive أحسن non-probability"
      - "تقارن الـ quota بالـ stratified"
    status: unverified
    steps:
      - kind: figure
        remind: [res.L11.055, res.L11.042]
        page: 50
        quote: "Sampling\nProbability: Simple random; Systematic; Stratified random; Cluster; Multi-stage\nNon-probability: Quota; Purposive; Snowball; Self-selection; Convenience\nPurposive: Extreme case; Heterogeneous; Homogeneous; Critical case; Typical case"
        title: "شجرة الـ sampling"
        alt: "A tree. Sampling splits into probability and non-probability. Probability leads to simple random, systematic, stratified random and cluster, which combine into multistage. Non-probability leads to quota, purposive, snowball, self-selection and convenience; purposive branches into extreme case, heterogeneous, homogeneous, critical case and typical case."
        caption: "يمين الشجرة **probability** (بالصدفة)، وشمالها **non-probability** (باختيار الباحث)."
        svg: |
          <svg viewBox="0 0 330 254" xmlns="http://www.w3.org/2000/svg">
            <rect x="120" y="6" width="90" height="24" rx="6" class="fg-ink"/>
            <text x="165" y="22" text-anchor="middle" class="t-sm t-b">Sampling</text>
            <path d="M165 30V40M78 40H252M78 40V50M252 40V50" class="fg-arrow"/>
            <rect x="18" y="50" width="120" height="24" rx="6" class="fg-good"/>
            <text x="78" y="66" text-anchor="middle" class="t-sm t-b">Probability</text>
            <rect x="192" y="50" width="120" height="24" rx="6" class="fg-bad"/>
            <text x="252" y="66" text-anchor="middle" class="t-sm t-b">Non-probability</text>
            <text x="20" y="96" class="t-sm">Simple random</text>
            <text x="20" y="114" class="t-sm">Systematic</text>
            <text x="20" y="132" class="t-sm">Stratified random</text>
            <text x="20" y="150" class="t-sm">Cluster</text>
            <text x="20" y="176" class="t-sm t-acc">→ Multistage</text>
            <text x="194" y="96" class="t-sm">Convenience</text>
            <text x="194" y="114" class="t-sm">Quota</text>
            <text x="194" y="132" class="t-sm">Snowball</text>
            <text x="194" y="150" class="t-sm">Self-selection</text>
            <text x="194" y="168" class="t-sm">Purposive:</text>
            <text x="204" y="186" class="t-sm t-mut">extreme, typical,</text>
            <text x="204" y="204" class="t-sm t-mut">critical case,</text>
            <text x="204" y="222" class="t-sm t-mut">heterogeneous,</text>
            <text x="204" y="240" class="t-sm t-mut">homogeneous</text>
          </svg>
      - kind: explain
        page: 51
        quote: "Is probably the most commonly used technique in clinical research today\nWith convenience sampling, subjects are selected because of their convenient accessibility to the researcher.\nThese subjects are chosen simply because they are the easiest to obtain for the study."
        title: "Convenience sampling: اللي قدامك"
        text: |
          ==Convenience sampling== = بتختار اللي **سهل توصله**: الموجودين وقت جمع الداتا. وهو غالبًا **الأكثر استخدامًا** في الأبحاث الإكلينيكية.

          **مثال الشريحة**: عايز تعرف رأي أهل القرية في خدمات تنظيم الأسرة، فتقابل كل الكبار اللي جم العيادة الخارجية **في يوم واحد**. أسهل من random sample، وبيدي **first impression** مفيد.
      - kind: explain
        page: 55
        quote: "Some units may be over- selected, others under selected or missed altogether.\nIt is impossible to adjust for such a distortion - if you need to be representative you have to use another sampling method."
        title: "سهل ورخيص… بس"
        text: |
          **الحلو**: سهل، سريع، والأرخص.

          **الوحش**: الـ sample ممكن تكون ==unrepresentative== خالص: ناس **over-selected** وناس **under-selected** أو مش موجودين أصلًا.

          والمهم: **مينفعش تصلّح** التشويه ده بعدين. لو محتاج representative sample، غيّر الطريقة.

          ومقبول إمتى؟ في **أول الدراسة** وانت بتستكشف، أو لو الـ informants **شبه بعض** ومعندكش تفضيل، أو **مفيش غيرهم**.
      - kind: check
        page: 53
        quote: "A researcher wants to study the attitudes of villagers towards family planning services provided by a MCH clinic.\nHe decides to interview all adult patients who visit the out patient clinic during one particular day.\nThis is more convenient than taking a random sample of people in the village, and it gives a useful first impression."
        question: "A researcher interviews all adults visiting the outpatient clinic on one day to learn villagers' attitudes to family-planning services. Which sampling?"
        options: ["Convenience", "Simple random", "Cluster", "Quota"]
        answer: 0
        why:
          - "صح: اللي صادف إنه موجود يومها؛ أسهل من random sample."
          - "مفيش قرعة من list أهل القرية."
          - "مفيش قرى اتختارت random."
          - "مفيش quota محدد لكل فئة."
      - kind: explain
        page: 54
        quote: "This technique is easy, fast and usually the least expensive and troublesome.\nA drawback of convenience sampling is that the sample may be quite unrepresentative of the population you want to study."
        title: "Convenience: سهل وسريع بس"
        text: |
          - ==سهل وسريع== وغالبًا ==الأرخص== وأقل مشاكل.
          - العيب: الـ sample ممكن يبقى ==مش ممثّل خالص== للـ population.

          ليه مش ممثّل؟ اللي موجودين في المكان وقت الجمع مختلفين عن اللي مش موجودين (مثلًا العيانين اللي بييجوا العيادة غير اللي قاعدين في البيت)، والتحيز ده مايتصلحش في التحليل. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 56
        quote: "CONVENIENCE SAMPLING is a method in which, for convenience sake, the study units that happen to be available at the time of data collection are selected in the sample.\nThis may happen at the beginning of a study when researchers are merely orienting themselves, or, when there are many similar informants and the researchers do not (yet) have a preference for specific categories. When there seems no other choice (no one else available for an interview) researchers may also sample conveniently."
        title: "إمتى الـ convenience مقبول؟"
        text: |
          الـ convenience = تاخد ==اللي متاح وقت جمع الـ data==. ده ممكن يحصل:

          - ==في أول الدراسة== لما الباحث لسه بيتعرف على المكان.
          - لما فيه ==informants كتير شبه بعض== ولسه مفيش تفضيل لـ categories معينة.
          - لما مفيش اختيار تاني (مفيش حد تاني متاح للمقابلة).

          ليه دول بالذات؟ في الحالات دي الهدف استكشاف مش تعميم، فالتحيز أقل ضرر. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 57
        quote: "is a strict version of convenience sampling where every available subject is selected, i.e., the complete accessible population is studied.\nThis is the best choice of the non-probability sampling techniques since by studying everybody available, a good representation of the overall population is possible in a reasonable period of time."
        title: "Consecutive sampling: الـ convenience المحترم"
        text: |
          ==Consecutive sampling== = نسخة **strict** من الـ convenience: بتاخد **كل** subject متاح، يعني الـ accessible population **كلها**.

          (زي «كل مريض stroke دخل القسم من يناير لمارس»، مش «اللي لحقته».)

          وده ==أحسن non-probability technique==: لأنك أخدت الكل، بيدي representation كويسة في وقت معقول.

          بس الدكتورة نبّهت: مهما كانت أحسن من انتقاء «اللي لحقته»، الـ consecutive **مش بتتحول لـ probability sample** للـ population العامة؛ هي كل المؤهلين اللي عدّوا في فترة محددة بمعايير ثابتة.
      - kind: explain
        page: 58
        quote: "Qualitative research methods are typically used when focusing on a limited number of informants, whom we select strategically so that their in-depth information will give optimal insight into an issue about which little is known.\nThis is called purposeful sampling. Subjects usually are selected because the researcher believes that certain subjects are likely to benefit or be more compliant."
        title: "Purposive و snowball: بتختار بالقصد"
        text: |
          ==Judgmental (purposive) sampling==: في الـ **qualitative research**، بتختار عدد قليل من الـ informants **بالقصد** عشان معلوماتهم العميقة تفهّمك موضوع محدش يعرف عنه كتير.

          ==Snowball (chain) sampling==: تبدأ بواحد أو اتنين **key informants** وتسألهم «مين كمان يعرف؟». لو نفس الاسم اتقالك من 2 أو 3، غالبًا هو key informant ممتاز.

          الـ snowball مفيد لو انت **جديد** في المكان، أو الناس **صعب توصلهم**.
      - kind: aside
        tone: analogy
        page: 59
        quote: "Snowball or chain sampling\nThis approach is particularly suitable for locating key informants or critical cases. You start with one or two information-rich key informants and ask them if they know persons who know a lot about your topic of interest. If a particular person is recommended to you by two or three different people you can be quite sure that he or she will be a valuable key informant.\nThe same approach can be used if an in-depth interview leads to discoveries, which seem rewarding to follow-up by a number of interviews with an additional group of informants."
        text: |
          الـ **snowball** زي ما تدوّر على سبّاك كويس في منطقة جديدة: تسأل البواب، يقولك على واحد، وتسأل الجيران فيقولوا نفس الاسم… خلاص، ده الـ **key informant**. 🔧
      - kind: check
        page: 60
        quote: "For example, in an exploratory study on coping behaviour among AIDS orphans, it seemed that child-headed households managed by girls survived better than those managed by boys. The researcher then interviewed more adolescent boys and girls heading households, to see whether this gender difference in the ability to cope was real, and how it could be explained.\nThis sampling technique is especially valuable when the researcher is new to the study site, and also important for identifying individuals who have rich information but are difficult to reach."
        question: "In an exploratory study on coping among AIDS orphans, girl-headed households seemed to cope better, so the researcher interviewed more adolescent boys and girls heading households. Which sampling is this?"
        options:
          - "Snowball (chain) sampling"
          - "Quota sampling"
          - "Stratified sampling"
          - "Consecutive sampling"
        answer: 0
        why:
          - "صح: مثال السلايد لمتابعة اكتشاف بمقابلات زيادة، أسلوب الـ snowball."
          - "مفيش quota محددة من الأول."
          - "مفيش sampling frame ولا random."
          - "الباحث اختار بالقصد، مش كل اللي بييجي ورا بعض."
      - kind: table
        page: 62
        quote: "It is similar to stratified sample in that:\nPopulation is divided into categories and elements are selected from each category based on certain proportions\nIt is different from stratified sample in that:\nNo sampling frame\nNo random selection\nThreatened by selection bias"
        title: "Quota ضد stratified"
        columns: ["", "Quota", "Stratified"]
        rows:
          - ["Categories with set proportions", "Yes", "Yes"]
          - ["Sampling frame", "No", "Yes"]
          - ["Random selection", "No", "Yes"]
          - ["Selection bias", "Threatened", "Protected"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: check
        page: 61
        quote: "A method that ensures that a certain number of sample units from different categories with specific characteristics appear in the sample so that all these characteristics are represented.\nIn this method the investigator interviews as many people in each category of study unit as he can find until he has filled his quota."
        question: "An interviewer must get 50 smokers and 50 non-smokers and stops each group once filled, with no list and no random selection. Which sampling?"
        options: ["Quota sampling", "Stratified sampling", "Snowball sampling", "Consecutive sampling"]
        answer: 0
        why:
          - "صح: فئات بأعداد محددة، يملاها لحد ما الـ **quota** يكمل."
          - "الـ stratified محتاج sampling frame و random selection."
          - "مفيش referrals من informants."
          - "مش بياخد كل اللي متاح؛ بيقف عند الرقم."
      - kind: try
        items: [res.L11.047, res.L11.052, res.L11.058, res.L11.059, res.L11.060]
    recap:
      - "Convenience: اللي متاح؛ الأكثر استخدامًا، رخيص، بس unrepresentative ومينفعش يتصلّح."
      - "Consecutive: كل subject متاح؛ أحسن non-probability."
      - "Purposive للـ qualitative؛ snowball بالـ referrals للـ key informants والناس الصعب توصلهم."
      - "Quota زي stratified في الفئات، بس من غير frame ولا random، فـ selection bias."
    practice: [res.L11.047, res.L11.048, res.L11.049, res.L11.050, res.L11.051, res.L11.052, res.L11.053, res.L11.054, res.L11.055, res.L11.056, res.L11.057, res.L11.058, res.L11.059, res.L11.060]
