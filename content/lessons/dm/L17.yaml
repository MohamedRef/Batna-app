  - id: dm.L17.lesson4
    title: "نقيس العضم، وبعدين لبن ومشي وبطّل سجاير"
    hook: "أربع أجهزة لقياس الكثافة، واحد بس هو الـ method of choice. وتلات حاجات من غير دوا."
    minutes: 10
    pages: [221, 224]
    topics: [bmd, nondrug]
    goals:
      - "تفهم الـ T-score والـ Z-score زي ما الكتاب كاتبهم"
      - "تقارن SPA و DPA و QCT و DEXA وتعرف ليه الـ DEXA كسب"
      - "تحفظ جرعات الكالسيوم والـ vitamin D والرياضة وليه"
    status: unverified
    steps:
      - kind: explain
        page: 221
        title: "الـ cut-off في الكتاب"
        quote: "Bone-density measurement:\n  1. Generally, a bone density measurement of 1 SD below the mean for age [Z score=-1, which equals T score=-2.5 below the mean of young adults with the same sex] is associated with an increased fracture risk and indicates the need for treatment. This is an arbitrary cutoff point, however, and longitudinal studies are needed to more accurately determine the density at which treatment should begin."
        text: |
          الـ bone density بتتنبأ بالـ fracture risk وبتحدد مين محتاج علاج.

          الكتاب بيقول: **1 standard deviation (SD) below the mean for age** (Z score = -1)، و"بيساويها" بـ ==T score = -2.5== (مقارنة بالشباب من نفس الـ sex)، وده بيدل على **increased fracture risk** وحاجة للعلاج. وبيقول إنه **arbitrary cutoff**، يعني رقم اتفقوا عليه، ومحتاج دراسات طويلة تحدد امتى العلاج يبدأ بالظبط.
      - kind: update
        page: 221
        quote: "Bone-density measurement:\n  1. Generally, a bone density measurement of 1 SD below the mean for age [Z score=-1, which equals T score=-2.5 below the mean of young adults with the same sex] is associated with an increased fracture risk and indicates the need for treatment. This is an arbitrary cutoff point, however, and longitudinal studies are needed to more accurately determine the density at which treatment should begin."
        text: "التعريف المعتمد: **T-score ≤ -2.5 = osteoporosis**، وبين -1 و -2.5 = **osteopenia**. الـ Z-score (مقارنة بنفس السن) غير الـ T-score، والـ Z = -1 مش بيساوي T = -2.5."
        ref: "WHO criteria 1994; BHOF Clinician's Guide 2022"
      - kind: figure
        page: 221
        quote: "Bone-density measurement:\n  1. Generally, a bone density measurement of 1 SD below the mean for age [Z score=-1, which equals T score=-2.5 below the mean of young adults with the same sex] is associated with an increased fracture risk and indicates the need for treatment. This is an arbitrary cutoff point, however, and longitudinal studies are needed to more accurately determine the density at which treatment should begin."
        title: "سلّم الـ T-score"
        alt: "A vertical number ladder of T-scores from 0 down to -3: 0 to -1 normal, -1 to -2.5 osteopenia, -2.5 and below osteoporosis; side marks show the lecture's NOF treatment thresholds at -1.5 with risk factors and -2.0 without, and the European threshold at -2.5."
        caption: "الألوان = تعريف الـ WHO. العلامات على اليمين = عتبات العلاج اللي في الكتاب (p225): **National Osteoporosis Foundation (NOF)** تحت -2.0، أو تحت -1.5 مع risk factors، و **Europe** عند -2.5."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L17t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fg-head-acc"/></marker></defs>
