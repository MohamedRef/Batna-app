    kind: card
    topic: social-meds
    front: Give examples of long-term risk-reduction medicines that may matter less with a limited lifespan.
    back: Antihypertensives, treatment for renal disease in diabetes, and lipid lowering.
    src: { page: 126, quote: "Finally, many medicines are given for long-term risk reduction (e.g. hypertension, renal disease in diabetes, lipid lowering), which may be less relevant to patients with a limited lifespan, and their use may not reflect current priorities." }
