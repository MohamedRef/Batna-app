    topic: function
    front: "ADL versus IADL: what is the difference in the examples used?"
    back: ADL (Katz) are basic self-care tasks (bathing, dressing, toileting, transferring, continence, feeding). IADL (Lawton) are tasks for living independently (telephone, shopping, cooking, housework, laundry, transport, medications, finances).
