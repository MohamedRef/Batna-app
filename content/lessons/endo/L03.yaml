  - id: endo.L03.lesson4
    title: "SIADH، سكر واطي، hCG وعضم طري"
    hook: "صوديوم واطي من غير وذمة، سكر واطي مع insulin واطي، راجل عنده ثدي، وعضم بيتكسر من ورم صغير في الأنف."
    minutes: 9
    pages: [38, 41]
    topics: [siadh, igf2, hcg, osteomalacia, gh]
    goals:
      - "تشخّص وتعالج الـ SIADH حسب الشدة"
      - "تفهم ميكانيزم الـ IGF-II hypoglycemia"
      - "تعرف صورة الـ ectopic hCG والـ oncogenic osteomalacia"
    status: unverified
    steps:
      - kind: explain
        page: 39
        quote: "Inappropriate retention of water. Inappropriate urine concentration."
        title: "SIADH"
        text: |
          **الأسباب:** small cell lung Ca، carcinoid، CNS lesions، GIT، genitourinary، ovarian tumors.

          **الميكانيزم:** ADH ↑ و ANP ↑، والنتيجة ==inappropriate water retention== و **inappropriate urine concentration**.

          **الصورة:** غالبًا hyponatremia بالصدفة؛ أو lethargy، weakness، nausea، confusion، seizure؛ ووزن بيزيد ==من غير oedema==.
      - kind: reveal
        page: 39
        quote: "Increased body weight due to retention of water without oedema."
        prompt: "ليه المية محبوسة بس مفيش oedema؟"
        answer: "المية الحرة بتتوزع على كل الـ compartments، وتلتينها جوه الخلايا. والـ ANP العالي بيطلّع صوديوم، فالـ extracellular volume مش بيزيد بالقدر اللي يعمل oedema. (ده تفسير فسيولوجي؛ الكتاب ذكر الـ ANP والنتيجة.)"
      - kind: explain
        page: 39
        quote: "Low blood urea nitrogen and uric acid. Exclude hypothyroidism and hypocortisolism."
        title: "التشخيص"
        text: |
          - Hyponatremia و plasma osmolality واطية، مع urine osmolality ==normal أو عالية== (inappropriate).
          - **BUN و uric acid واطيين**.
          - ==استبعد hypothyroidism و hypocortisolism==.
      - kind: table
        page: 39
        quote: "Severe cases (Na less than 110mEq/L) Hypertonic Saline with furesemide."
        title: "العلاج"
        columns: ["Severity", "Treatment"]
        rows:
          - ["Mild", "Fluid restriction < urine output"]
          - ["Moderate", "Demeclocycline 150-300 mg tds (weeks)"]
          - ["Severe (Na <110)", "Hypertonic saline + furosemide"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: update
        page: 39
        quote: "Severe cases (Na less than 110mEq/L) Hypertonic Saline with furesemide."
        text: "الكتاب: severe cases (Na أقل من 110) تاخد hypertonic saline مع furosemide. الإرشادات الحالية بتضيف الـ vaptans (tolvaptan)، وبتحدد تصحيح الـ chronic hyponatremia بحوالي 8-10 mmol/L في 24 ساعة علشان الـ osmotic demyelination."
        ref: "European clinical practice guideline on hyponatraemia 2014"
      - kind: explain
        page: 39
        quote: "Increased ectopic IGFII (Big IGFII) that can react with insulin receptors."
        title: "IGF-II hypoglycemia"
        text: |
          **الأسباب:** ==mesenchymal== و **hepatic** tumors.

          **الميكانيزم:**
          - الورم بياكل glucose.
          - الكبد المليان metastases مش بيعمل gluconeogenesis.
          - Counter-regulatory hormones (زي GH) قليلة.
          - ==Big IGF-II== بيشتغل على الـ insulin receptors.
          - الـ IGF binding protein 3 مبيتكونش، فالـ IGF-II يفضل active.

          **الصورة:** fasting hypoglycemia متكررة. **العلاج:** small frequent meals، IV glucose بالليل، glucagon، GH، corticosteroids.
      - kind: check
        page: 39
        quote: "Mesenchymal tumor. Hepatic tumor."
        question: "Fasting hypoglycaemia with LOW insulin in a patient with a big retroperitoneal tumour suggests:"
        options: ["IGF-II-secreting mesenchymal tumour", "Insulinoma", "Ectopic ACTH", "Ectopic PTHrP"]
        answer: 0
        why:
          - "صح: الـ insulin واطي لأن الـ big IGF-II هو اللي شغال على الـ receptors."
          - "الـ insulinoma الـ insulin عالي."
          - "بيعمل hyperglycemia."
          - "بيعمل hypercalcemia."
      - kind: explain
        page: 40
        quote: "Alpha subunit is similar to that of LH, FSH, and TSH."
        title: "Ectopic hCG"
        text: |
          - الـ hCG من subunitين. ==Alpha== زي LH و FSH و TSH، والـ **beta** مختلف (بيه بنفرّق ونتابع).
          - **الأسباب:** hydatidiform mole، teratoma، seminoma، و non-gonadal (choriocarcinoma، lung، hepatoma، breast، colon).
          - **الميكانيزم:** steroidogenesis و ==aromatase== ↑ ← E2 عالي.
      - kind: table
        page: 41
        quote: "Young patient precocious puberty. Adult female uterine bleeding. Adult male gynecomastia."
        title: "الصورة حسب السن والجنس"
        columns: ["Patient", "Picture"]
        rows:
          - ["Young", "Precocious puberty"]
          - ["Adult female", "Uterine bleeding"]
          - ["Adult male", "Gynecomastia"]
          - ["Any", "Hyperthyroid features possible"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 41
        quote: "There may be manifestations of hyperthyroidism."
        prompt: "ليه الـ hCG ممكن يعمل hyperthyroidism؟"
        answer: "الـ alpha subunit بتاع الـ hCG زي بتاع الـ TSH، والجزيء كله شبهه، فلو الكمية كبيرة جدًا بينبّه الـ TSH receptor. (زي ما شفنا في الحمل في المحاضرة 2: direct effect of hCG on the thyroid.)"
      - kind: explain
        page: 41
        quote: "Increased fibroblast growth factor 23 secreted by tumor cells leads to decreased phosphate reabsorption by the kidney"
        title: "Oncogenic osteomalacia"
        text: |
          - أورام ==mesenchymal غريبة، غالبًا benign==: "strange tumor in strange place"، زي hemangiopericytoma و angiosarcoma و chondrosarcoma في الجلد أو العضلات أو الـ paranasal sinuses.
          - الورم بيفرز ==FGF-23== (phosphatonin): phosphate reabsorption ↓، و 1,25-vit D ↓.
          - **Labs:** phosphate ↓، ALP ↑، **calcium normal**، vit D ↓.
          - **الصورة:** bone pain، muscle weakness، fractures، waddling gait.

          وآخر حاجة: **GH و GHRH** ectopic نادر جدًا (lung، stomach، breast، ovary)، وعلاجه **octreotide**.
      - kind: aside
        tone: joke
        page: 41
        quote: "Unusual mesenchymal tumors. Mostly benign. Strange tumor in strange place"
        text: "الـ oncogenic osteomalacia: strange tumor in strange place. ورم mesenchymal صغير، غالبًا benign، ومؤدب ومستخبي في الجيوب الأنفية، وفي نفس الوقت مكسّر عضم المريض كله. أكتر ورم في الكتاب بيعمل مشاكل وهو قاعد في حاله."
