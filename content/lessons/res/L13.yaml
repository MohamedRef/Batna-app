  - id: res.L13.lesson8
    title: "تكتب مرجع كتاب بالـ Vancouver"
    hook: "Lodish H, Baltimore D... كل نقطة ومسافة في السطر ده ليها مكان. هنركّبه حتة حتة."
    minutes: 10
    pages: [78, 90]
    topics: [book-article]
    goals:
      - "ترتّب الـ 8 عناصر في مرجع الكتاب"
      - "تكتب الطبعة والصفحات والـ series صح"
    status: unverified
    steps:
      - kind: explain
        page: 78
        quote: "Citing a \"book\"\n1. Name/s of author/s, editor/s, compiler/s or the institution responsible.\n2. Title of publication and subtitle if any\n3. Edition, if other than first edition\n4. Place of publication\n5. Publisher\n6. Year of publication\n7. Page numbers (if applicable)\n8. Series title and individual volume (if any)."
        title: "مرجع الكتاب: 8 عناصر بالترتيب"
        text: |
          1. المؤلف/المحرر/الجهة.
          2. العنوان (والـ subtitle).
          3. الطبعة (لو مش الأولى).
          4. مكان النشر.
          5. الناشر.
          6. السنة.
          7. الصفحات (لو فيه).
          8. الـ series والـ volume (لو فيه).
      - kind: explain
        page: 79
        quote: "Citing a \"book\"\nThe essential details required are (in order):\n1. Name/s of author/s, editor/s, compiler/s or the institution responsible.\nWhere there are 6 or less authors you must list all authors.\nWhere there are 7 or more authors, only the first 6 are listed and add \"et al\" (et al means \"and others\").\nPut a comma and 1 space between each name. The last author must have a full-stop after their initial(s)."
        title: "المؤلفين"
        text: |
          - ==6 أو أقل==: اكتبهم كلهم.
          - ==7 أو أكتر==: أول 6 وبعدين «**et al**» (and others).
          - الشكل: **surname مسافة initials** (من غير مسافات أو نقط بين الحروف)، وبين الأسامي **فاصلة ومسافة**، وآخر واحد بعده **نقطة**: Smith AK, Jones BC.
          - مافيش مؤلف؟ ماتكتبش «Anonymous»؛ ابدأ **بالعنوان**.
      - kind: check
        page: 80
        quote: "Citing a \"book\"\nFormat: surname (1 space) initial/s (no spaces or punctuation between initials) (full-stop OR if further names comma, 1 space)\nExample 1.1: Smith AK, Jones BC, editors.\nExample 1.2: Smith AK, Jones BC, Bloggs TC, Ashe PT, Fauci AS, Wilson JD et al.\nExample 1.3: The Cardiac Society of Australia and New Zealand.\nExample 1.4: When no author is given \"Anonymous\" or \"Anon\" is unnecessary. Us the title of the article or book."
        question: "Which author list is correct Vancouver?"
        options: ["Smith AK, Jones BC, editors.", "Smith, A.K., Jones, B.C., editors.", "SMITH A. K. and JONES B. C. (eds)", "A.K. Smith & B.C. Jones, editors."]
        answer: 0
        why:
          - "صح: surname ثم initials لازقين، وفاصلة ومسافة بين الأسامي."
          - "مافيش نقط بين الـ initials ولا فاصلة بين الاسم والحروف."
          - "Capitals و and دي طريقة تانية."
          - "الـ surname الأول، ومن غير &."
      - kind: explain
        page: 81
        quote: "Citing a \"book\"\n2. Title of publication and subtitle if any\nDo not use italics or underlining.\nOnly the first word of journal articles or book titles (and words that normally begin with a capital letter) are capitalized."
        title: "العنوان والطبعة"
        text: |
          - العنوان **من غير italics ولا underline**، و**أول كلمة بس** Capital (والأسامي): «Harrison's principles of internal medicine.»
          - الطبعة لو **مش الأولى**: «==3rd ed.==»؛ و**ed.** = edition، ماتلخبطهاش بـ editor.
      - kind: explain
        page: 83
        quote: "Citing a \"book\"\n3. Edition, if other than first edition.\nAbbreviate the word edition to:- ed. (Do not confuse with editor.)\nFormat: edition statement (fullstop, 1 space)\nExample 3.1: 3rd ed."
        title: "الطبعة: ed. مش editor"
        text: |
          الـ ==edition== بتتكتب ==بس لو مش الطبعة الأولى==.

          - اختصرها لـ ==«ed.»== (ماتلخبطهاش مع editor).
          - الشكل: edition statement ثم full stop ومسافة. مثال: 3rd ed.

          ليه الأولى لأ؟ لأن أي كتاب من غير طبعة مكتوبة مفهوم إنه أول طبعة، فكتابتها زيادة. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 84
        quote: "Citing a \"book\"\n4. Place of publication\nIf the publishers are located in more than one city, cite the name of the city that is printed first.\nWrite the place name in full.\nIf the place name is not well known, add a comma, 1 space and the state or the country for clarification.\nFor places in the USA, add after the place name the 2 letter postal code for the state. This must be in upper case\n– eg. Hartford (CN): (where CN=Connecticut)."
        title: "المكان والناشر والسنة والصفحات"
        text: |
          - **المكان**: أول مدينة مكتوبة، بالكامل؛ لو مش مشهورة زوّد الولاية أو البلد؛ وفي أمريكا كود الولاية حرفين كابيتال: Hartford (CN). وبعده ==colon==.
          - **الناشر**: بالكامل، وبعده ==semicolon==: Raven Press;
          - **السنة**: وبعدها نقطة: 1999.
          - **الصفحات**: «p.» وماتكررش الأرقام: p. 122-9. و p. 1129-57.
      - kind: explain
        page: 88
        quote: "Citing a \"book\"\n7. Page numbers (if applicable).\nAbbreviate the word page to \"p.\".\nNOTE: do not repeat digits unnecessarily – abbreviate.\nFormat: p (full-stop, 1 space) page numbers (full-stop).\nExample 7.1: p. 122-9.\nExample 7.2: p. 1129-57.\nExample 7.3: p. 333,338,340-5. (when article not on continuous pages)"
        title: "أرقام الصفحات من غير تكرار"
        text: |
          - اختصر page لـ ==«p.»==.
          - ==ماتكررش الأرقام== من غير لازمة: p. 122-9، و p. 1129-57.
          - لو الصفحات مش ورا بعض: ==فواصل==: p. 333,338,340-5.

          ليه الاختصار؟ «1129-57» واضحة: الرقم التاني بياخد أوله من الأول، فالتكرار مالوش لازمة. التفسير المقبول (مش في الكتاب).
      - kind: check
        page: 88
        quote: "Citing a \"book\"\n7. Page numbers (if applicable).\nAbbreviate the word page to \"p.\".\nNOTE: do not repeat digits unnecessarily – abbreviate.\nFormat: p (full-stop, 1 space) page numbers (full-stop).\nExample 7.1: p. 122-9.\nExample 7.2: p. 1129-57.\nExample 7.3: p. 333,338,340-5. (when article not on continuous pages)"
        question: "A chapter runs from page 1129 to page 1157. How is it written?"
        options:
          - "p. 1129-57."
          - "p. 1129-1157."
          - "pp. 1129 to 1157."
          - "p. 1129-7."
        answer: 0
        why:
          - "صح: ماتكررش الأرقام اللي من غير لازمة، بس سيب اللي بتتغير (57)."
          - "بيكرر «11» من غير لازمة."
          - "الاختصار «p.» والـ range بشرطة."
          - "«-7» معناها 1127، قبل أول صفحة."
      - kind: explain
        page: 89
        quote: "Citing a \"book\"\n8. Series title and individual volume (if any).\nPut in brackets.\nAbbreviate the word volume to \"vol\".\nFormat: (Series title (semi-colon, 1 space) vol (1 space) volume number) full stop outside brackets\nExample 8.1: (Annals of the New York academy of sciences; vol 288)."
        title: "Series title و volume"
        text: |
          لو الكتاب جزء من series:

          - حطها ==بين قوسين==.
          - اختصر volume لـ ==«vol»==.
          - الـ ==full stop برّه القوس==.

          مثال: (Annals of the New York academy of sciences; vol 288).

          ليه بين قوسين؟ علشان القارئ يفرّق بين اسم الكتاب نفسه واسم السلسلة اللي هو جزء منها. التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 90
        quote: "Citing a \"book\"\nExamples of Citing Books:\nOne to six authors\nGetzen TE. Health economics: fundamentals of funds. New York: John Wiley & Sons; 1997.\nExplanation of above citation:\nAUTHOR Getzen TE.\nTITLE Health economics: fundamentals and flow of funds.\nPLACE OF PUBLICATION New York:\nPUBLISHER John Wiley & Sons;\nYEAR OF PUBLICATION 1997.\nLodish H, Baltimore D, Berk A, Zipursky SL, Matsudaira P, Darnell J. Molecular cell biology. 3rd ed. New York: Scientific American; 1995."
        title: "مرجع كتاب متفكّك"
        alt: "The reference Getzen TE. Health economics: fundamentals and flow of funds. New York: John Wiley & Sons; 1997. split into labelled chips: Author with full stop, Title with full stop, Place with colon, Publisher with semicolon, Year with full stop. The punctuation marks are highlighted."
        caption: "شوف العلامة بعد كل حتة: **نقطة** بعد المؤلف والعنوان والسنة، **colon** بعد المكان، **semicolon** بعد الناشر."
        svg: |
          <svg viewBox="0 0 330 190" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="10" width="95" height="40" rx="8" class="fg-box"/><text x="52" y="27" text-anchor="middle" class="t-sm t-mut">Author</text><text x="52" y="43" text-anchor="middle" class="t-sm t-b">Getzen TE<tspan class="t-acc">.</tspan></text>
            <rect x="105" y="10" width="220" height="40" rx="8" class="fg-box"/><text x="215" y="27" text-anchor="middle" class="t-sm t-mut">Title</text><text x="215" y="43" text-anchor="middle" class="t-sm t-b">Health economics: ... funds<tspan class="t-acc">.</tspan></text>
            <rect x="5" y="62" width="110" height="40" rx="8" class="fg-box"/><text x="60" y="79" text-anchor="middle" class="t-sm t-mut">Place</text><text x="60" y="95" text-anchor="middle" class="t-sm t-b">New York<tspan class="t-acc">:</tspan></text>
            <rect x="120" y="62" width="135" height="40" rx="8" class="fg-box"/><text x="187" y="79" text-anchor="middle" class="t-sm t-mut">Publisher</text><text x="187" y="95" text-anchor="middle" class="t-sm t-b">John Wiley &amp; Sons<tspan class="t-acc">;</tspan></text>
            <rect x="260" y="62" width="65" height="40" rx="8" class="fg-box"/><text x="292" y="79" text-anchor="middle" class="t-sm t-mut">Year</text><text x="292" y="95" text-anchor="middle" class="t-sm t-b">1997<tspan class="t-acc">.</tspan></text>
            <rect x="5" y="118" width="320" height="64" rx="8" class="fg-acc"/>
