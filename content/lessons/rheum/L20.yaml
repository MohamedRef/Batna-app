            <text x="18" y="176" class="t-sm">joint damage</text>
            <text x="18" y="210" class="t-sm t-b">C*06:02</text>
            <text x="18" y="228" class="t-sm">milder, late</text>
            <text x="18" y="244" class="t-sm">arthritis</text>
            <rect x="170" y="10" width="152" height="280" rx="10" class="fg-box"/>
            <text x="246" y="34" text-anchor="middle" class="t-b">Non-HLA</text>
            <text x="246" y="56" text-anchor="middle" class="t-sm t-mut">inflammation</text>
            <text x="180" y="90" class="t-sm t-b">IL-23 receptor</text>
            <text x="180" y="108" class="t-sm">IL-17 pathway</text>
            <text x="180" y="142" class="t-sm t-b">TNF-induced</text>
            <text x="180" y="160" class="t-sm t-b">protein 3</text>
            <text x="180" y="178" class="t-sm">TNF inflammation</text>
            <text x="180" y="212" class="t-sm t-b">Phosphatase 22</text>
            <text x="180" y="230" class="t-sm">immune regulation</text>
          </svg>
      - kind: reveal
        page: 327
        quote: "TNF Alpha-induced Protein 3; involved in TNF-alpha-induced inflammation"
        prompt: "إيه الفايدة إنك تعرف إن جينات الـ non-HLA فيها IL-23 receptor و TNF alpha-induced protein 3؟"
        answer: |
          لأن الجينات دي هي نفسها **خريطة العلاج**:
          - جين الـ **IL-23 receptor** «involved in the IL-17 pathway» ← وعلشان كده عندنا **ustekinumab** (IL-12/23) و **secukinumab** (IL-17A).
          - جين الـ **TNF alpha-induced protein 3** في الـ TNF inflammation ← وعلشان كده الـ ==TNF inhibitors== هما الـ first-line biologic.

          يعني الوراثة مش معلومة للحفظ بس؛ هي اللي بتقولك ليه الأدوية دي بالذات شغالة في الـ PsA (هتشوفها في درس العلاج).
      - kind: try
        items: [rheum.L20.001, rheum.L20.003, rheum.L20.005, rheum.L20.007, rheum.L20.009]
    recap:
      - "PsA: 5–20% من الصدفية؛ axial، peripheral، nails، skin، entheses؛ progressive و destructive."
      - "33–50% عندهم قريب درجة أولى بـ PsO أو PsA."
      - "جينات PsA و PsO مش متطابقة؛ وفيه جينات بتحدد الـ phenotype."
      - "B27 axial/enthesitis، B8 damage، C*06:02 أخف؛ non-HLA زي IL-23R و TNF-induced protein 3."
    practice: [rheum.L20.001, rheum.L20.002, rheum.L20.003, rheum.L20.004, rheum.L20.005, rheum.L20.006, rheum.L20.007, rheum.L20.008, rheum.L20.009, rheum.L20.010]
