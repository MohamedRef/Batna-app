  - id: hb.L05.lesson3
    title: "الـ DAAs: نضرب الفيروس في 3 أماكن"
    hook: "من شهور interferon لحد حباية بتشفي أكتر من 95%. تعالى نفهم كل دوا بيقص فين."
    minutes: 9
    pages: [92, 93]
    topics: [daas]
    goals:
      - "تعرّف SVR12 تعريف الامتحان"
      - "تربط كل DAA class بالـ target بتاعها من آخر اسم الدوا"
      - "تحفظ الـ regimens الأربعة ومددها، وتعرف مين مش pangenotypic"
    status: unverified
    steps:
      - kind: explain
        page: 92
        title: "إمتى نقول اتعالج؟"
        quote: "Sustained Virologic Response (SVR) = undetectable HCV RNA 12 weeks after treatment (SVR12 = cure)."
        text: |
          - **SVR (Sustained Virologic Response)**: الـ HCV RNA undetectable بعد 12 أسبوع من نهاية العلاج.
          - ==SVR12 = cure==: الكتاب بيعتبره شفا.

          لاحظ الفخ: الـ 12 أسبوع بتتعد **بعد** ما العلاج يخلص، مش آخر يوم في العلاج.

          ليه نستنى؟ لأن الـ RNA ممكن يبقى negative وهو لسه على الدوا، وبعدين يرجع لو فيه فيروس استخبى. لو عدّت 12 أسبوع من غير دوا والـ RNA لسه مش باين، يبقى الفيروس مشي فعلًا. (ده شرح مقبول، مش نص الكتاب.)
      - kind: table
        page: 92
        title: "Old vs modern HCV treatment"
        columns: ["Feature", "Interferon ± Ribavirin", "DAAs"]
        rows:
          - ["Route", "Injections (old regimen)", "Oral"]
          - ["Duration", "Long", "Short"]
          - ["Safety", "Toxic", "Well tolerated"]
          - ["Efficacy", "Low", "> 95% cure"]
        hide: [[1, 2], [2, 1], [3, 2]]
      - kind: aside
        tone: joke
        text: |
          الفرق بين الـ interferon والـ DAAs زي الفرق بين إنك تسافر من إسكندرية لأسوان **بالحنطور** وإنك تركب **الطيارة**: الحنطور طويل ومتعب وممكن ماتوصلش، والطيارة قصيرة ومريحة وبتوصل أكتر من 95% من المرات 😄
      - kind: explain
        page: 92
        title: "الفيروس بيشتغل إزاي، وإحنا بنضربه فين؟"
        text: |
          الـ RNA بتاع الفيروس بيتترجم لبروتين واحد طويل اسمه **polyprotein**. الشريط ده لازم يتقص لحتت علشان يطلع منه إنزيمات الفيروس، وبعدين الإنزيمات دي تنسخ الـ RNA من جديد.

          الـ DAAs بتضرب في 3 محطات على الخط ده (جدول الكتاب):

          - ==NS3/4A protease inhibitors== (grazoprevir، glecaprevir): بتمنع viral polyprotein cleavage. المقص اتكسر، فالشريط مابيتقصش.
          - ==NS5A inhibitors== (ledipasvir، velpatasvir، pibrentasvir): بتضرب الـ replication complex، يعني «المصنع» اللي النسخ بيحصل جواه.
          - ==NS5B polymerase inhibitors== (sofosbuvir): بتوقف viral RNA replication. الآلة اللي بتنسخ الـ RNA نفسها وقفت.

          الـ DAA اسمها direct-acting لأنها بتضرب بروتين الفيروس نفسه، مش زي الـ interferon اللي كان بيشغّل مناعة الجسم كلها.
      - kind: figure
        page: 93
        title: "3 أهداف على شريط واحد"
        alt: "A long bar labelled HCV polyprotein with three highlighted segments. NS3/4A protease is blocked by previr drugs, grazoprevir and glecaprevir, which stop polyprotein cleavage. NS5A is blocked by asvir drugs, ledipasvir, velpatasvir and pibrentasvir, acting on the replication complex. NS5B polymerase is blocked by buvir, sofosbuvir, which stops RNA replication."
        caption: "اقرا آخر اسم الدوا تعرف بيضرب فين: **-previr** على الـ protease، **-asvir** على NS5A، **-buvir** على NS5B."
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L05d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
