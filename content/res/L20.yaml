  kind: card
  topic: conclusion
  front: What strategy does the lecture recommend for strengths and weaknesses?
  back: 'Come up with three strengths and three weaknesses. Strengths come from the overall effect and statistical or clinical significance. Weaknesses (limitations) can be inherent to the study design
    or author-specific: funding source, population sampling, biases, non-blinding, non-randomization.'
  src:
