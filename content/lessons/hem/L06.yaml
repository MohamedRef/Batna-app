  - id: hem.L06.lesson4
    title: "بعد ما الكيس يخلص"
    hook: "العيان روّح كويس، ورجع بعد أسبوع أصفر أو مليان purpura. وفي العنبر، عيان قلب اتخنق من كيس زيادة."
    minutes: 9
    pages: [97, 101]
    topics: [delayed-reactions, non-immune]
    goals:
      - "تعرف الـ DHTR والـ PTP: الميعاد والسبب والعلاج"
      - "تعرف الـ bacterial contamination والـ TACO"
      - "تحفظ الـ TTIs والـ hemosiderosis"
    status: unverified
    steps:
      - kind: explain
        page: 97
        title: "DHTR"
        quote: "Occurs within 1 to 3 weeks post transfusion. Presentation: triad of fever, hyperbilirubinemia and anemia. DAT is +ve."
        text: |
          - الميعاد: **1–3 weeks** بعد النقل.
          - الـ triad: ==fever، hyperbilirubinemia، anemia==، و **DAT +ve**.
          - **No hemoglobinuria** لأن الـ hemolysis **extravascular**.
          - السبب: **anamnestic reaction** في عيان اتعمله alloimmunization قبل كده (transfusion أو pregnancy).
          - العلاج: self-limited، تابع الـ Hb. لو hemolysis شغّالة: **glucocorticoid** أو **IVIG** أو **rituximab**، و hydration للكلية.
          - الوقاية: أي دم بعد كده **antigen-negative** للـ antibody ده.
      - kind: reveal
        page: 97
        quote: "Mechanism: Anamnestic reaction in a previously alloimmunized patient (by transfusion or pregnancy) upon re-exposure to the offending Ag."
        prompt: "ليه الـ DHTR بيستنى أسبوع ومش بيحصل فورًا زي الـ AHTR؟"
        answer: |
          العيان عنده **memory cells** من حمل أو نقل قديم، بس الـ antibody نفسه نزل لمستوى ما بيبانش في الـ cross-match.

          لما يقابل الـ antigen تاني، الـ memory بتصحى وتعمل ==IgG== كتير في أيام (anamnestic). الـ IgG بيغطي الكرات والطحال يشيلها (**extravascular**)، فمفيش hemoglobinuria.
      - kind: explain
        page: 98
        title: "Post-transfusion purpura"
        quote: "Rare sudden profound thrombocytopenia 5-10 days after transfusion of PLT-containing blood components, usually RBCs."
        text: |
          - نادر: **sudden profound thrombocytopenia** بعد ==5–10 days== من component فيه platelets، غالبًا **RBCs**.
          - السبب: antibody ضد **HPA-1a** (الأشهر) من نقل أو حمل أو transplant قبل كده.
          - الغريب: بيكسّر **platelets العيان نفسه** كمان. نظريات: passive transfer، antibody ضد **GPIIb/IIIa** بتاع العيان، immune complexes، أو الـ alloantigen بيلزق على platelets العيان.
          - العلاج: ممكن self-limited، ولو شديد **IVIG** أو **plasma exchange**. الوقاية: دم **antigen-negative**.
          - التحاليل في reference labs: immunofluorescence، ELISA، PCR genotyping، **MAIPA**.
      - kind: check
        page: 98
        quote: "Anti-HPA-1a is the most common culprit"
        question: "A week after 3 units of red cells, a woman has purpura and platelets 5,000/mm³. Culprit antibody?"
        options: ["Anti-HPA-1a", "Anti-IgA", "Anti-A IgM", "Anti-D"]
        answer: 0
        why:
          - "صح: الـ PTP بعد 5–10 أيام، والـ anti-HPA-1a أشهر سبب."
          - "الـ anti-IgA بيعمل anaphylaxis في الدقايق الأولى."
          - "الـ anti-A بيعمل AHTR في الكرات الحمرا."
          - "الـ anti-D مشكلة Rh في الحمل والكرات الحمرا."
      - kind: explain
        page: 99
        title: "Bacterial contamination"
        quote: "PLT are stored at room temp. and thus more susceptible to bacterial growth. Commonly implicated bacteria in PLT: staphylococci & streptococci."
        text: |
          الصورة: rigors، fever، vomiting، bloody diarrhea، hemolysis، hypotension، shock، **DIC**.
          - في الـ **RBCs**: بكتيريا بتستحمل البرد، **Yersinia** و **Pseudomonas**.
          - في الـ **platelets**: محفوظة في ==room temperature==، فالبكتيريا بتكبر، غالبًا **staph و strep**.

          العلاج: **broad-spectrum antibiotics** و shock. الوقاية: تلاجات مضبوطة **2–6°C**، وما تطلبش كذا كيس وتسيبهم بره.
      - kind: aside
        tone: joke
        page: 99
        quote: "never obtain multiple units for the same patient and leave unused units at room temp. until needed."
        text: |
          الـ **multiple units** اللي بتستناك على الترابيزة في **room temp** "لحد ما نخلّص اللي قبله" ده بيتحوّل لـ **culture medium** ببلاش. البكتيريا بتحب الدم الدافي زي ما احنا بنحب الشاي.

          اطلب كيس كيس، والباقي يفضل في التلاجة.
      - kind: explain
        page: 100
        title: "TACO"
        quote: "There is increase in CVP and cardiac failure. Pulm. edema is cardiogenic in origin"
        text: |
          في خطر أكتر: **أطفال**، **كبار**، ومرضى **قلب أو رئة**.
          - الصورة: cough، dyspnea، cyanosis، **orthopnea**، rales، **congested neck veins**، tachycardia.
          - ==CVP يعلى== والـ pulmonary edema **cardiogenic**.
          - العلاج: **stop**، O2، diuresis، phlebotomy لو لازم.
          - الوقاية: كميات أقل وأبطأ **1–4 ml/kg/h**، وأي كيس ما يعدّيش **4 hours**.
      - kind: sort
        page: 100
        quote: "There is increase in CVP and cardiac failure. Pulm. edema is cardiogenic in origin"
        prompt: "ده يشاور على TACO ولا على anaphylaxis؟"
        bins: ["TACO", "Anaphylaxis"]
        cards:
          - { text: "Raised JVP", bin: 0 }
          - { text: "Orthopnea", bin: 0 }
          - { text: "Elderly with heart failure", bin: 0 }
          - { text: "Raised CVP", bin: 0 }
          - { text: "Stridor and laryngeal edema", bin: 1 }
          - { text: "IgA deficiency", bin: 1 }
          - { text: "Generalized edema with hypotension", bin: 1 }
        why: "الاتنين ضيق نفس، بس الـ TACO **حمل زيادة على القلب** (CVP و JVP عاليين، orthopnea، كبار ومرضى قلب)، والـ anaphylaxis **مناعة** (anti-IgA، stridor، hypotension)."
      - kind: table
        page: 100
        quote: "Retroviruses: HIV1, and HIV2, HTLV I and HTLV II. Herpesviruses: CMV, EBV."
        title: "Transfusion-transmitted infections"
        columns: [Group, Agents]
        rows:
          - ["Hepatotropic", "HAV (very rare), HBV, HCV"]
          - ["Retroviruses", "HIV-1, HIV-2, HTLV I, II"]
          - ["Herpes", "CMV, EBV"]
          - ["Others", "Parvovirus B19, West Nile"]
          - ["Bacteria", "TB, brucellosis, syphilis"]
          - ["Parasites", "Malaria, trypanosoma, leishmania, toxoplasma"]
          - ["Prions", "CJD"]
        hide: [[1, 1], [4, 1], [5, 1]]
      - kind: explain
        page: 101
        title: "Hemosiderosis"
        quote: "Prevention: consider chelation for > 20 unit RBC burden &/or serum ferritin > 1000 ng/ml"
        text: |
          بيحصل بعد ==أكتر من 20 transfusion==. كل وحدة فيها **200–250 mg iron**، والجسم مالوش طريق يطلّع الحديد.
          - الصورة: **bronze skin**، hepatic fibrosis، **diabetes**، endocrine dysfunction، **cardiac failure**.
          - الوقاية: **chelation** لو أكتر من **20 units** و/أو **ferritin >1000 ng/ml**.
      - kind: try
        items: [hem.L06.075, hem.L06.080, hem.L06.087, hem.L06.092, hem.L06.097]
    recap:
      - "DHTR: 1–3 weeks، fever + jaundice + anemia، DAT +ve، extravascular، anamnestic."
      - "PTP: 5–10 days، platelets تختفي، anti-HPA-1a، IVIG أو plasma exchange."
      - "Bacteria: RBCs (Yersinia، Pseudomonas)، platelets في room temp (staph، strep)."
      - "TACO: كبار ومرضى قلب، CVP عالي، cardiogenic edema. 1–4 ml/kg/h، أقصى 4 ساعات."
      - "Hemosiderosis: >20 units، 200–250 mg/unit، chelation لو ferritin >1000."
    practice: [hem.L06.075, hem.L06.076, hem.L06.077, hem.L06.078, hem.L06.079, hem.L06.080, hem.L06.081, hem.L06.082, hem.L06.083, hem.L06.084, hem.L06.085, hem.L06.086, hem.L06.087, hem.L06.088, hem.L06.089, hem.L06.090, hem.L06.091, hem.L06.092, hem.L06.093, hem.L06.094, hem.L06.095, hem.L06.096, hem.L06.097, hem.L06.098, hem.L06.099, hem.L06.100]
