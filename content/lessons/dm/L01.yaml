        text: |
          1. **Genetic susceptibility:** لازم **one diabetogenic gene within the human leukocyte antigen (HLA)**؛ و **95%** من العيانين **HLA-DR3 و/أو DR4**.
          2. **Environmental trigger:** ==congenital rubella== هو الوحيد اللي **proved**. الباقي مقترح: mumps، coxsackie-B، reovirus، herpes، و chemicals/toxins.
          3. **Immune activation:** autoimmune **insulitis**، و autoantibodies: islet cell antibodies (الكتاب كاتبها ICS)، **glutamic acid decarboxylase (GAD)**، insulin antibodies.
          4. **Progressive loss of glucose-stimulated insulin secretion.**
          5. **Overt diabetes:** لما أكتر من **90%** من الـ β-cells تموت.
          6. **Endless β-cell failure:** insulin و **C-peptide** absent أو very low.

          ليه السكر ما يبانش غير بعد ما **90%** تموت؟ التفسير المقبول (مش في الكتاب): البنكرياس عنده احتياطي كبير، والـ β-cells اللي فاضلة بتشتغل زيادة وتغطي. عشان كده الـ autoantibodies ممكن تكون موجودة سنين قبل أول عَرَض، والعيان بييجي فجأة مع إن التدمير بدأ من زمان.
