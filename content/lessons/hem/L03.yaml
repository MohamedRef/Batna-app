          وفوق ده الحديد بيزيد من سببين: الـ **ineffective erythropoiesis** بتزوّد امتصاصه من الأمعاء، و**النقل**. عشان كده الـ ==ferritin عالي== والـ storage iron زايد.

          التفسير المقبول (مش في الكتاب): لو ادّيت عيان thalassaemia حديد على إنه iron deficiency، إنت بتزوّد الـ overload. اعرف الفرق قبل ما تكتب الحديد.
