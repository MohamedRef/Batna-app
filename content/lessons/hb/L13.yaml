  - id: hb.L13.lesson7
    title: "الـ IgG4-RD: المرض اللي بيعمل نفسه tumour"
    hook: "عضو منفوخ زي الورم، وبيخف بالـ steroids. السر في الـ biopsy: حصيرة collagen و plasma cells."
    minutes: 8
    pages: [240, 244]
    topics: [igg4-diagnosis]
    goals:
      - "تعدّ الـ organs والـ shared features"
      - "تمشي في الـ diagnostic algorithm"
      - "تحفظ الـ cut-offs: 135، 50/100، 40%"
      - "تعرف الـ 3 pathological characteristics"
    status: unverified
    steps:
      - kind: explain
        page: 241
        title: "إيه هو الـ IgG4-RD؟"
        text: |
          **Fibro-inflammatory process** مرتبط بالـ immunomodulation.

          **أشهر organs:** pancreas، bile duct، major salivary glands، lacrimal glands، retroperitoneum، و lymphatic ducts.

          **الحاجات المشتركة:**

          - العضو بيتورّم **وشكله زي الـ neoplasm**.
          - **Lymphoplasmacytic infiltrate** غني بـ **IgG4+ plasma cells**.
          - **Fibrosis** بدرجات، بـ **storiform pattern**.
          - **Serum IgG4** عالي في **60–70%**.
          - الأغلبية بتستجيب للـ **glucocorticoids**.

          **Epidemiology:** أكتر في الرجالة (**M:F 2.8:1**)، ومفيش familial cases معروفة. والأعراض بتعتمد على العضو، وممكن تشبه أمراض أشهر بكتير.
      - kind: aside
        tone: analogy
        page: 244
        text: |
          كلمة **storiform** جاية من اللاتيني **storea** يعني **حصيرة**. الـ collagen fibres بتبقى **radially arranged** ومتشابكة زي الحصيرة المجدولة، أو زي عجلة عربية الكارو. أول ما تشوف «حصيرة» تحت الميكروسكوب، افتكر IgG4.
      - kind: figure
        page: 242
        title: "الـ algorithm (Fig. 3)"
        alt: "Vertical flow chart. Clinical suspicion. Imaging: CT organ swelling or pseudotumour, MRI hypointense on T2. Labs: serum IgG4 over 135 mg/dl, hypergammaglobulinemia, eosinophilia, raised IgE; 30 to 50 percent may have normal IgG4. 18F-FDG PET/CT for staging and to find a biopsy target. Rule out neoplasm, infection and other inflammatory disease. Biopsy: storiform fibrosis, obliterative phlebitis, lymphoplasmacytic and eosinophilic infiltrate, IgG4 to IgG ratio over 0.4. If not diagnostic, repeat the biopsy or review old material."
        caption: "شك، صور، labs (ومتطمّنش لو الـ IgG4 طبيعي)، PET لتحديد مكان الـ biopsy، وبعدين الـ biopsy هي اللي بتحكم. الصندوق الأحمر مش خطوة في السلسلة: في الكتاب هو فرع **No**؛ أي مرحلة ماتأكدتش، فكّر في الـ alternative diagnoses."
