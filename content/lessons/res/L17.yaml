          | 19 | 1.328 | 1.729 | 2.093 | 2.539 | 2.861 | 3.883 |
          | 20 | 1.325 | 1.725 | 2.086 | 2.528 | 2.845 | 3.850 |
          | 21 | 1.323 | 1.721 | 2.080 | 2.518 | 2.831 | 3.819 |
          | 22 | 1.321 | 1.717 | 2.074 | 2.508 | 2.819 | 3.792 |
          | 23 | 1.319 | 1.714 | 2.069 | 2.500 | 2.807 | 3.767 |
          | 24 | 1.318 | 1.711 | 2.064 | 2.492 | 2.797 | 3.745 |
        question: "From the t table, what is the critical t at 5% with 24 degrees of freedom?"
        options:
          - "2.064"
          - "1.711"
          - "2.797"
          - "2.060"
        answer: 0
        why:
          - "صح: صف 24، عمود 5%."
          - "ده عمود الـ 10%."
          - "ده عمود الـ 1%."
          - "ده صف 25 مش 24."
      - kind: explain
        page: 17
        quote: |
          P-value
          P-value is known as the observed level of significance (probability of the chance).
          Instead of stating our findings in the form of there is a significant difference or there is no significant difference, it is preferable to report the exact probability (referred to by P-value)
        title: "الـ P value"
        text: |
          الـ ==P value== اسمها **observed level of significance**، يعني احتمال الصدفة اللي طلع من بياناتك.

          وأحسن من إنك تكتب «significant» أو «not significant» وخلاص، ==اكتب الرقم بالظبط== (مثلًا p = 0.03).
      - kind: update
        page: 17
        quote: "P-value is known as the observed level of significance (probability of the chance)."
        text: "بالدقة: الـ P-value (observed level of significance) هي probability نتيجة بالتطرف ده أو أكتر لو الـ H0 صح. مش احتمال إن الـ H0 صح، ومش مقياس لحجم الأثر."
        ref: "Wasserstein and Lazar, ASA statement on p-values, 2016"
      - kind: explain
        page: 18
        quote: "Making a decision\nMaking a decision depends on the critical value which, in turn, depends on the level of significance and degree of freedom."
        title: "القرار بيتاخد إزاي؟"
        text: |
          سلايد 18 بتلخّص السلسلة كلها في سطر: القرار بيعتمد على الـ ==critical value==، والـ critical value نفسه بيعتمد على حاجتين: الـ ==level of significance== (α) والـ ==degree of freedom==.

          ليه السلسلة دي؟ لأن الـ α بتحدد قد إيه انت متشدد، والـ df بتحدد شكل التوزيع حسب حجم العيّنة، والاتنين مع بعض بيطلّعوا الرقم اللي هتقارن بيه من الجدول. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 19
        quote: |
          If the test value is ≥ to the critical value then a decision is made to reject the null hypothesis.
          If the test value is < than the critical value, a decision is made to accept the null hypothesis and, concluding that there is no significant difference in the parameter of interest between the 2 groups.
        title: "القرار"
        text: |
          القرار بيعتمد على الـ critical value، اللي بيعتمد على الـ **level of significance** والـ **df**.

          - الـ test value ==≥ الـ critical value==: ارفض الـ H0.
          - الـ test value ==< الـ critical value==: اقبل الـ H0، مفيش فرق significant بين المجموعتين.
      - kind: update
        page: 19
        quote: "If the test value is < than the critical value, a decision is made to accept the null hypothesis and, concluding that there is no significant difference in the parameter of interest between the 2 groups."
        text: "الإحصائيين بيقولوا «fail to reject H0» بدل «accept»: عدم الـ significance معناه إن الدليل مش كفاية، مش إن المجموعتين متساويتين أكيد."
        ref: "Altman and Bland, BMJ 1995"
      - kind: check
        page: 19
        quote: |
