        quote: "Required for abnormal results from all other tests"
        prompt: "ليه الـ colonoscopy كل 10 سنين بس، والـ FIT كل سنة؟"
        answer: |
          الكتاب: الـ colonoscopy بتفحص ==القولون كله==، وبتاخد biopsy وتشيل البوليب، وبتشخّص أمراض تانية، وهي **required** بعد أي نتيجة abnormal من باقي الـ tests. كل **10 years**. والـ FIT **annual**، و slightly أحسن لو معاه flexible sigmoidoscopy كل 5.

          التفسير المقبول (مش في الكتاب): الـ adenoma بياخد **سنين كتير** علشان يبقى سرطان. فلو الـ colonoscopy نضفت القولون النهارده، أي بوليب جديد هيحتاج وقت طويل قبل ما يبقى خطر، فالـ 10 سنين آمنة. أما الـ FIT فبيدوّر على دم في عينة واحدة، والورم مش بينزف كل يوم، فالتكرار السنوي بيعوّض الحساسية القليلة لكل مرة.
      - kind: explain
        page: 181
        quote: "Hx of HNPCC: Full colon every 1-2y (20-30y) then full colon yearly after 40y."
        title: "الـ surveillance في الـ high risk"
        text: |
          - **Hereditary non-polyposis colorectal cancer (HNPCC)**: full colon كل 1-2 سنة من 20-30، وبعد 40 كل سنة.
          - **Adenomatous polyps**: كرر بعد 3 سنين، ولو التاني normal كل 5.
          - **Colon cancer**: full colon خلال سنة، لو normal بعد 3، وبعدين كل 5.
          - **Familial adenomatous polyposis (FAP)**: ==counseling== و flexible sigmoidoscopy كل 12 شهر.

          يعني كل ما الخطر أعلى والطريق للسرطان أسرع، المسافة بين المناظير بتقصر والبداية بتبقى أبدري، لأن البوليب الجديد ممكن يبقى سرطان قبل المنظار الجاي لو المسافة طويلة.
      - kind: reveal
        page: 181
        quote: "Hx of HNPCC: Full colon every 1-2y (20-30y) then full colon yearly after"
        prompt: "ليه الـ HNPCC بيبدأ في العشرينات وبيبقى كل سنة أو سنتين؟"
        answer: |
          الكتاب: الـ **HNPCC**: full colon كل ==1-2 سنة من 20-30==، وبعد 40 كل سنة. والـ **FAP**: counseling و flexible sigmoidoscopy كل 12 شهر.

          التفسير المقبول (مش في الكتاب): في الـ Lynch الطريق من adenoma لسرطان **سريع** (الـ mismatch repair بايظ)، فبوليب صغير ممكن يبقى سرطان بين منظار والتاني لو المسافة طويلة. والسرطان بييجي حوالي 45، يعني لازم تبدأ قبله بكتير. وليه **full colon**؟ لأن الأورام غالبًا right sided. أما في الـ FAP فالـ sigmoidoscopy كفاية للمتابعة لأن البوليبات في كل حتة، فأول ما تظهر في الشمال تعرف إن القولون كله بدأ.
