  - id: geri.L06.lesson2
    title: "الـ hypothyroidism اللي مالوش شكل"
    hook: "مافيش زيادة وزن ولا برد. فيه وقعات، وتبوّل لاإرادي، وتوهان. ده الـ hypothyroidism عند جدّتك."
    minutes: 8
    pages: [94, 97]
    topics: [hypo]
    goals:
      - "تفرّق overt من subclinical"
      - "تعدّ الأسباب والأدوية اللي بتعمله أو بتمنع امتصاص الـ L-T4"
      - "تعرف الـ presentation الـ atypical وعلاقته بالـ cognition"
    status: unverified
    steps:
      - kind: explain
        page: 94
        quote: "Subclinical hypothyroidism is characterized by increased TSH values with normal FT3 and FT4 values."
        title: "Overt ولا subclinical؟"
        text: |
          - ==Overt==: **TSH ↑** مع **FT3 وFT4 ↓**. مرتبط بـ global mortality أعلى وcardiovascular events.
          - ==Subclinical==: **TSH ↑** مع **FT3 وFT4 normal**.

          والـ **2013 ETA** قسّمت الـ subclinical لاتنين: TSH من **4 لـ 10**، وأكتر من **10**.
      - kind: explain
        page: 95
        quote: "Chronic autoimmune thyroiditis (Hashimoto thyroiditis) is the most frequent cause of subclinical hypothyroidism in the elderly."
        title: "الأسباب"
        text: |
          - ==Hashimoto thyroiditis==: أشهر سبب للـ subclinical عند الكبار.
          - بعد **thyroidectomy** أو **radioiodine** مع replacement مش كفاية.
          - **Iatrogenic** (بيرجع لما توقف الدوا): methimazole، PTU، tyrosine-kinase inhibitors، β-blockers، interferon-α، IL-2، **lithium**.
          - أدوية بتمنع **امتصاص الـ L-T4**، وده سبب شائع عند الكبار حتى مع جرعة مظبوطة.
      - kind: sort
        page: 95
        quote: "bile acid sequestrates, ferrous sulphate, sucralfate, calcium carbonate, aluminium-containing antacids, phosphate binders, raloxifene and proton-pump inhibitors"
        prompt: "الدوا ده بيعمل hypothyroidism إزاي؟"
        bins: ["Causes it (iatrogenic)", "Blocks L-T4 absorption"]
        cards:
          - { text: "Lithium", bin: 0 }
          - { text: "Interferon-α", bin: 0 }
          - { text: "Tyrosine-kinase inhibitors", bin: 0 }
          - { text: "Methimazole", bin: 0 }
          - { text: "Calcium carbonate", bin: 1 }
          - { text: "Ferrous sulphate", bin: 1 }
          - { text: "Proton-pump inhibitors", bin: 1 }
          - { text: "Sucralfate", bin: 1 }
          - { text: "Phosphate binders", bin: 1 }
        why: "الأولانيين بيأثروا على الغدة نفسها (وبيرجعوا لما توقف). التانيين بيمسكوا الـ levothyroxine في الأمعاء أو بيقلّلوا الحموضة اللي محتاجها علشان يتمص، فافصل بينهم وبين الحباية بكام ساعة."
      - kind: explain
        page: 95
        quote: "Hypothyroid patients ≥70 years are significantly less likely to report weight gain, muscle cramps or cold intolerance"
        title: "الصورة المتخفية"
        text: |
          عند الكبير الـ presentation **varied, non-specific, insidious**. اللي فوق 70 أقل بكتير في:
          - **weight gain**، **muscle cramps**، **cold intolerance**.

          وبدلها ==non-specific geriatric syndromes==: confusion، anorexia، **weight loss** (أيوه، نقص!)، **falls**، **incontinence**، decreased mobility، arthralgia.

          وأحيانًا **noninflammatory effusions** في المفاصل والـ pleura والـ pericardium والـ peritoneum.
      - kind: aside
        tone: trap
        page: 95
        quote: "Confusion, anorexia, weight loss, falling, incontinence, and decreased mobility, arthralgias and muscular aches."
        text: "الفخ: **weight loss** مع hypothyroidism؟ عند الكبير أيوه، من الـ anorexia. فالأعراض بتتنسب للـ «السن» أو لأمراض تانية. أي كبير بيقع وبيتوه ومش بياكل: اطلب **TSH**."
      - kind: explain
        page: 96
        quote: "Hypothyroidism is associated with increase incidence of IHD and heart failure."
        title: "القلب والمخ"
        text: |
          - القلب **sensitive** لأي تغيير صغير في الهرمون. الـ hypothyroidism مرتبط بـ **IHD** و**heart failure**.
          - بس في الـ **Cardiovascular Health Study** (فوق 65)، المرضى ماكانش عندهم risk factors أسوأ (BMI، LDL، HTN، DM).
          - ==Myxoedema madness==: confusion، disorientation، psychosis مع الـ hypothyroidism الشديد.
          - مرتبط بضعف في learning، word fluency، visual-spatial.
      - kind: reveal
        page: 96
        quote: "there is a lack of evidence to show that there is complete resolution of neurocognitive deficits following treatment of hypothyroidism."
        prompt: "الكتب بتقول hypothyroidism = reversible dementia. الكتاب ده بيقول إيه؟"
        answer: "إن مفيش evidence على **complete resolution** للـ neurocognitive deficits بعد العلاج. وتجربتين كبار (منهم **Birmingham elderly thyroid study**) ماحسّنوش الـ cognition. والـ **PAQUID**: الـ TSH العالي مرتبط بالـ **depression** مش بالـ cognition. ودراسة كبيرة قالت العلاقة **coincidental rather than causal**. يعني اطلب TSH، بس ماتوعدش العيلة إن الذاكرة هترجع."
      - kind: check
        page: 97
        quote: "There is little evidence to clearly link overt hypothyroidism with reduced mobility or increased frailty."
        question: "Which statement matches the lecture?"
        options: ["Little evidence links overt hypothyroidism to frailty", "Treating hypothyroidism reverses dementia", "Raised TSH causes cognitive decline (PAQUID)", "Hypothyroid elders usually gain weight"]
        answer: 0
        why:
          - "صح: little evidence للـ mobility والـ frailty."
          - "مفيش evidence على complete resolution."
          - "الـ PAQUID ربطه بالـ depression مش الـ cognition."
          - "اللي فوق 70 أقل في الـ weight gain، وممكن يخسوا."
      - kind: try
        items: [geri.L06.018, geri.L06.021, geri.L06.023, geri.L06.026]
    recap:
      - "Overt: TSH ↑، FT4 ↓. Subclinical: TSH ↑، FT4 normal؛ ETA 2013: 4-10 أو أكتر من 10."
      - "Hashimoto أشهر سبب subclinical؛ lithium، interferon، TKIs، amiodarone-like iatrogenic."
      - "Ca، iron، PPIs، sucralfate، binders بيمنعوا امتصاص الـ L-T4."
      - "فوق 70: مافيش weight gain ولا cold intolerance؛ falls، confusion، incontinence، anorexia."
      - "مفيش proof إن العلاج بيرجّع الـ cognition."
    practice: [geri.L06.018, geri.L06.019, geri.L06.020, geri.L06.021, geri.L06.022, geri.L06.023, geri.L06.024, geri.L06.025, geri.L06.026, geri.L06.027, geri.L06.028, geri.L06.029, geri.L06.030, geri.L06.031, geri.L06.032, geri.L06.033, geri.L06.082, geri.L06.083]
