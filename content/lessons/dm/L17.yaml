        quote: "calcitriol has been reported to be effective in preventing glucocorticoid-induced and posttransplant-related bone loss."
        text: |
          - **Nasal calcitonin 200 IU/day**: less popular، تأثير متواضع على الـ BMD.
          - ==Calcitriol==: نتايجه mixed في الـ postmenopausal، بس مفيد في **glucocorticoid-induced** و **post-transplant** bone loss. لازم **low-calcium diet** ومتابعة hypercalcemia و hypercalciuria و renal function.
          - **Estrogen 0.625 + alendronate 10**: نفس التأثير، والاتنين مع بعض **slightly more effective**. Combinations تانية بتزوّد الكثافة بس **مفيش fracture data**.
      - kind: try
        items: [dm.L17.084, dm.L17.085, dm.L17.089, dm.L17.093, dm.L17.099]
    recap:
      - "Alendronate/risedronate/estrogen بيمنعوا الـ hip؛ raloxifene و ibandronate لسه vertebral بس."
      - "Alendronate 10/70، risedronate 5/35، ibandronate 150 شهري أو 3 IV كل 3 شهور، ZA 5 IV سنويًا."
      - "Raloxifene: breast ↓، endometrium سليم، VTE ↑."
      - "PTH متقطع = anabolic. Denosumab = anti-RANKL كل 6 شهور، صحّح الكالسيوم الأول."
      - "Calcitriol: steroid و transplant bone loss، مع low-calcium diet."
    practice: [dm.L17.083, dm.L17.084, dm.L17.085, dm.L17.086, dm.L17.087, dm.L17.088, dm.L17.089, dm.L17.090, dm.L17.091, dm.L17.092, dm.L17.093, dm.L17.094, dm.L17.095, dm.L17.096, dm.L17.097, dm.L17.098, dm.L17.099, dm.L17.100, dm.L17.101, dm.L17.102, dm.L17.103, dm.L17.104]
  # ------------------------------------------------------------------
  - id: dm.L17.lesson6
    title: "مين يتعالج، بإيه، لحد امتى، وإزاي نتابع"
    hook: "الـ drug holiday مش لكل الناس، والـ denosumab بالذات ممنوع يوقف فجأة."
    minutes: 10
    pages: [225, 232]
    topics: [choice, duration, monitoring]
    goals:
      - "تعرف عتبات الـ NOF للعلاج"
      - "ترتب اختيار الدوا: bisphosphonate ← raloxifene ← PTH"
      - "تحفظ مواعيد الـ reassessment والـ holiday، والـ markers في المتابعة"
    status: unverified
    steps:
      - kind: explain
        page: 225
        title: "مين ياخد دوا؟"
        quote: "postmenopausal women with T-scores less than -2.0, as measured by central DXA, regardless of risk factors for fracture"
        text: |
          الكتاب ماشي بالـ ==NOF approach==:
          - **T-score < -2.0** على الـ central DXA: عالج، أيًا كانت الـ risk factors.
          - **T-score < -1.5** مع risk factors: عالج.
          - أوروبا: **-2.5 or less**.
      - kind: update
        page: 225
        quote: "This strategy differs somewhat from guidelines in Europe, which recommend intervention for individuals with a T- score of -2.5 or less"
        text: "الـ BHOF (الـ NOF سابقًا) دلوقتي: عالج لو فيه **hip أو vertebral fracture**، أو **T ≤ -2.5**، أو T بين -1 و -2.5 مع **FRAX ≥ 20%** major أو **≥ 3%** hip."
        ref: "BHOF Clinician's Guide 2022"
      - kind: order
        page: 228
        quote: "We recommend bisphosphonates as first-line therapy for postmenopausal osteoporosis."
        prompt: "رتّب اختيار الدوا زي الكتاب:"
        steps:
          - "Oral alendronate or risedronate"
          - "IV ibandronate if GI intolerance"
          - "Raloxifene if no bisphosphonate is tolerated"
          - "PTH (not first line)"
        why: "Bisphosphonates first line، والمفضل alendronate أو risedronate لأن الـ ibandronate مفيش data إنه بيمنع الـ hip. الـ IV ibandronate للـ GI intolerance. الـ raloxifene أضعف فبيتحجز. الـ PTH غالي وحقن وفيه قلق osteosarcoma."
      - kind: aside
        tone: trap
        page: 229
        quote: "Given its cost, subcutaneous route of administration, long-term safety concerns (including osteosarcoma), and the availability of other agents"
        text: "الـ PTH أقوى دوا بيبني عضم، بس **مش first line**: ==cost==، حقن subcutaneous، و **osteosarcoma** concern. بيتحجز للـ very high risk."
      - kind: figure
        page: 229
        quote: "Fracture risk should be reassessed after 3 years of treatment with parenteral and 5 years of oral"
        title: "خط الزمن لكل دوا"
        alt: "Horizontal timelines in years 0 to 10: PTH bar to 2 years then an antiresorptive; IV bisphosphonate reassess at 3; zoledronic acid reassess at 3 and continue to 6 if stable; oral bisphosphonate reassess at 5 then holiday up to 5 years if low or moderate risk; denosumab reassess at 5 to 10 with no holiday."
        caption: "الـ **oral** بيتقيّم عند **5**، الـ **parenteral** عند **3**. الـ **ZA** يكمل لحد **6** لو الـ BMD stable. الـ **denosumab** مفيش holiday. الـ **PTH** سنتين بس."
        svg: |
