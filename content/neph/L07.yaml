  - id: neph.L07.145
    kind: card
    topic: tsc
    front: When should RCC be suspected in TSC, and how is it treated?
    back: In enlarging fat-poor lesions or lesions with intratumoral calcification; confirm by biopsy. Because it is often bilateral, use renal-sparing surgery whenever possible.
    src: { page: 176, quote: "TSC-associated RCC should be suspected in enlarging, fat-poor lesions or when intratumoral calcifications are present and should be confirmed by biopsy. Because TSC-associated RCC are frequently bilateral, renal-sparing surgery should be performed whenever possible." }
    status: unverified
    tags: [high-yield]
