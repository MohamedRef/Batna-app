    status: unverified
    steps:
      - kind: explain
        page: 296
        title: "Lomitapide: نقفل خط تجميع الـ VLDL"
        quote: "MTP transfers TG, phospholipids, and cholesteryl esters to the ApoB in the endoplasmic reticulum"
        text: |
          الـ ==MTP== في الكبد والأمعاء بيحمّل TG و phospholipids و cholesteryl esters على الـ **apo B** في الـ ER، فيتعمل **VLDL** و **chylomicrons**.

          **Lomitapide** بيمنع الـ MTP ← VLDL أقل. الـ FDA وافق عليه لـ **homozygous FH**.
          الأعراض: **aminotransferases عالية** (دهون في الكبد) و GI tolerability وحشة.
      - kind: explain
        page: 297
        title: "Mipomersen: نوقف الـ apo B من الـ mRNA"
        quote: "Mipomersen is a synthetic 20-nucleotide antisense oligonucleotide that can bind to ApoB mRNA"
        text: |
          - الـ **apo B** هو البروتين الأساسي في كل الـ atherogenic lipoproteins، وتركيزه بيعدّ عددهم (حتى الـ small dense LDL).
          - ==Mipomersen== **antisense oligonucleotide** (20 nucleotide) بيلزق في الـ apo B mRNA ← apo B أقل.
          - موافق عليه لـ **HoFH**.
          - الأشهر: **injection-site reactions**. الأخطر: **liver toxicity** و steatosis.
      - kind: check
        page: 297
        quote: "Mipomersen is a synthetic 20-nucleotide antisense oligonucleotide that can bind to ApoB mRNA"
        question: "Which drug is an antisense oligonucleotide against apolipoprotein B?"
        options:
