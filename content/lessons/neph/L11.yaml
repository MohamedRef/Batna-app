        quote: "colorectal cancers.(37,46) In comparison to combined hormonal contraceptives, progestin-only pills have a lower cardiovascular risk. (47) The fourth-generation oral progestin, drospirenone, may theoretically increase potassium levels because of its anti- mineralocorticoid activity.(48) A meta-analysis of studies of women without kidney failure showed that the thrombotic risk was higher in women using progestin-only injections than non-users (relative ratio [RR], 2.67; 95% CI, 1.29-5.53), while progestin-only pills or intrauterine devices did not increase this risk.(49) In the general population, long-term use of progestin-only injection, depot medroxyprogesterone acetate, has been associated with bone mass loss and osteoporosis.(50) Intrauterine devices remain the preferred method of contraception because of low failure rates and are not associated with an increased risk of hypertension, thrombotic events, or cardiovascular events. Barrier methods, which include condoms, diaphragms, cervical caps, and sponges, are nonhormonal contraceptives and not recommended for use because of their high failure rate. Sterilization, which includes female tubal ligation and male vasectomy, is the only permanent contraceptive method available.(47)"
