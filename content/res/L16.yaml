- id: res.L16.006
  kind: card
  topic: normal
  front: If you measure a variable in a representative sample of sufficient size, what shape will the scores take?
  back: 'A distribution similar to the normal curve: most scores fall around the mean and there are relatively few extreme
    scores.'
  src:
    page: 5
    quote: |-
      Normal distribution curve
      That is: if you measure something, a variable, in a representative sample of sufficient size, the resulting score will assume a distribution that is similar to the normal curve.
      Most of the scores will fall around the mean and there will be relatively few extreme score.
      2.2% | 13.6% | 34.1% | 34.1% | 13.6% | 2.2%
      X-3SD | X-2SD | X-1SD | mean | X+1SD | X+2SD | X+3SD
      68%
      95%
      99%
  status: unverified
- id: res.L16.007
  kind: mcq
  topic: normal
  stem: In a normal distribution curve, where do the mean, median and mode lie?
  options:
  - All three coincide at the centre
  - The mean lies to the right of the median
  - The mode lies to the left of the mean
  - The median lies at +1 SD
  answer: 0
  why:
  - The curve is perfectly symmetrical, so the three measures of central tendency coincide at its peak.
  - That happens in a positively skewed distribution, not a normal one.
  - 'That happens in a positively skewed distribution: the mode sits at the peak and the mean is pulled right.'
  - The median splits the values in half, so it sits at the centre (the mean), not at +1 SD.
  src:
    page: 11
    quote: 1 It is a theoretically perfect frequency polygon in which the mean, median and mode all coincide in the center.
  status: unverified
  tags: [high-yield]
- id: res.L16.008
  kind: enumerate
  topic: normal
  prompt: Enumerate the three properties of the normal distribution curve on the slide.
  points:
  - A theoretically perfect frequency polygon in which the mean, median and mode all coincide in the centre
  - A symmetrical bell-shaped curve of infinite range
  - Approximately 68% of scores fall within ±1 SD, 95% within ±2 SD and 99% (99.7%) within ±3 SD
  pass: 3
  hook: 'منحنى «الجرس» 3 صفات: «الـ 3 M في النص» (mean = median = mode)، «جرس متماثل ملوش آخر» (symmetrical, infinite range)،
    و«68 / 95 / 99.7» على 1 و2 و3 SD.'
  src:
    page: 11
    quote: |-
      Normal distribution curve
      1 It is a theoretically perfect frequency polygon in which the mean, median and mode all coincide in the center.
      2 It takes the form of a symmetrical bell-shaped curve of infinite range.
      3 Approximately,
      68% of the scores fall between ± 1 SD
      95% of the scores fall between ± 2 SD
      99% of the scores fall between ± 3 SD
  status: unverified
  tags: [high-yield]
- id: res.L16.009
  kind: mcq
  topic: normal
  stem: Which statement about the range of the normal curve is correct?
  options:
  - 'It is infinite: the tails never touch the base line'
  - It ends at exactly ±3 SD
  - It ends at the largest observed value
  - It ends at ±2 SD, where 95% of values lie
  answer: 0
  why:
  - 'The slide calls it a symmetrical bell-shaped curve of infinite range: the tails get closer to the base line but never
    end.'
  - About 99.7% lies within ±3 SD, so a few values lie beyond it.
  - The theoretical curve does not stop at any observed value.
  - About 5% of values lie beyond ±2 SD.
  src:
    page: 11
    quote: 2 It takes the form of a symmetrical bell-shaped curve of infinite range.
  status: unverified
