  # ------------------------------------------------------------------
  - id: hb.L09.lesson6
    title: "الكلية سليمة بس واقفة: Hepatorenal syndrome"
    hook: "كلية لو زرعتها في جسم سليم تشتغل فورًا. طب ليه بتفشل هنا؟"
    minutes: 10
    pages: [158, 166]
    topics: [hrs]
    goals:
      - "تشرح ليه الـ HRS functional ومن أين جه الـ structural component"
      - "تشخّص HRS-AKI بالـ KDIGO والـ exclusion criteria"
      - "تعالج بالـ vasoconstrictor + albumin وتعرف مكان TIPS و RRT و LT"
    status: unverified
    steps:
      - kind: explain
        page: 158
        quote: "the development of renal dysfunction in patients with severe liver disease (acute or chronic) in the absence of any other identifiable causes"
        title: "التعريف"
        text: |
          **Hepatorenal syndrome (HRS)**: renal dysfunction في مريض عنده severe liver disease (acute أو chronic)، من غير أي سبب كلوي تاني.

          قد إيه شائع؟ حوالي 20% من مرضى الـ ascites اللي كليتهم سليمة بيعملوا HRS خلال سنة، و 39% خلال 5 سنين.

          هو functional ولا structural؟
          - زمان كان بيتقال ==functional==: الكلية نفسها سليمة. والدليل الكلاسيكي (التفسير المقبول، مش في الكتاب) إن كلية مريض HRS لو اتزرعت في جسم سليم بتشتغل.
          - دلوقتي فيه **structural component** كمان، وفيه درجة من الـ kidney parenchymal damage.

          والـ HRS مش مرض جديد. هو ==continuum== لنفس الـ hemodynamic disturbances اللي عملت الـ ascites، بس وصلت للآخر.
      - kind: figure
        page: 159
        quote: "a severe decrease in renal blood flow and glomerular filtration rate occurs associated with corticomedullary shunting leading to development of HRS"
        title: "الـ HRS: آخر محطة في نفس الخط"
        alt: "Severe splanchnic vasodilatation lowers systemic vascular resistance and causes severe arterial underfilling. RAAS, SNS and ADH are fully active; cirrhotic cardiomyopathy lowers cardiac output. In the kidney a seesaw: vasoconstrictors (endothelin-1, thromboxane A2, leukotriene E4) outweigh local vasodilators (nitric oxide, prostaglandins, kallikrein-kinin). Renal blood flow and GFR fall with corticomedullary shunting, giving HRS. A dashed box adds the structural part: gut bacteria and cytokines."
        caption: "الـ HRS ==continuum== للـ ascites: نفس الـ vasodilatation بس أقوى. الكفة بتميل ناحية الـ vasoconstrictors (impaired autoregulation)."
        svg: |
          <svg viewBox="0 0 330 520" xmlns="http://www.w3.org/2000/svg">
          <defs><marker id="L09f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
          <rect x="12" y="10" width="306" height="40" rx="7" class="fg-box"/>
          <text x="165" y="27" text-anchor="middle" class="t-b">Severe splanchnic vasodilatation</text>
          <text x="165" y="42" text-anchor="middle" class="t-sm">SVR falls a lot: severe arterial underfilling</text>
          <path d="M165 52v16" class="fg-arrow" marker-end="url(#L09f)"/>
          <rect x="12" y="72" width="306" height="40" rx="7" class="fg-acc"/>
          <text x="165" y="89" text-anchor="middle" class="t-b">RAAS + SNS + ADH at full blast</text>
          <text x="165" y="104" text-anchor="middle" class="t-sm">cirrhotic cardiomyopathy: low CO makes it worse</text>
          <path d="M165 114v16" class="fg-arrow" marker-end="url(#L09f)"/>
          <text x="165" y="150" text-anchor="middle" class="t-b">Inside the kidney: a tug of war</text>
          <path d="M30 230L300 196" class="fg-ink" style="stroke-width:3px"/>
          <path d="M165 213l-12 40h24z" class="fg-ink"/>
          <rect x="10" y="236" width="140" height="70" rx="7" class="fg-bad"/>
          <text x="80" y="254" text-anchor="middle" class="t-sm t-b t-bad">Vasoconstrictors</text>
          <text x="80" y="270" text-anchor="middle" class="t-sm">endothelin-1</text>
          <text x="80" y="284" text-anchor="middle" class="t-sm">thromboxane A2</text>
          <text x="80" y="298" text-anchor="middle" class="t-sm">leukotriene E4</text>
          <rect x="180" y="160" width="140" height="70" rx="7" class="fg-good"/>
          <text x="250" y="178" text-anchor="middle" class="t-sm t-b t-good">Local vasodilators</text>
          <text x="250" y="194" text-anchor="middle" class="t-sm">nitric oxide</text>
          <text x="250" y="208" text-anchor="middle" class="t-sm">prostaglandins</text>
          <text x="250" y="222" text-anchor="middle" class="t-sm">kallikrein-kinin</text>
          <text x="165" y="330" text-anchor="middle" class="t-sm t-mut">vasodilators lose: impaired autoregulation</text>
          <path d="M165 338v16" class="fg-arrow" marker-end="url(#L09f)"/>
          <rect x="12" y="358" width="306" height="40" rx="7" class="fg-bad"/>
          <text x="165" y="375" text-anchor="middle" class="t-b">RBF and GFR collapse</text>
          <text x="165" y="390" text-anchor="middle" class="t-sm">plus corticomedullary shunting</text>
          <path d="M165 400v16" class="fg-arrow" marker-end="url(#L09f)"/>
          <rect x="12" y="420" width="306" height="40" rx="7" class="fg-bad"/>
          <text x="165" y="445" text-anchor="middle" class="t-b t-lg">HRS (functional kidney)</text>
          <rect x="12" y="470" width="306" height="40" rx="7" class="fg-thin"/>
          <text x="165" y="487" text-anchor="middle" class="t-sm t-b">+ structural part: gut bacteria, cytokines</text>
          <text x="165" y="502" text-anchor="middle" class="t-sm">more NO, more splanchnic vasodilatation</text>
          </svg>
      - kind: figure
        page: 160
        quote: "Figure 4: Pathophysiology of hepatorenal syndrome."
        title: "الـ HRS في صورة واحدة"
        image: { file: hb/L09-hrs-pathophysiology.webp, book: true }
        alt: "Book flowchart of hepatorenal syndrome. Advanced cirrhosis leads to portal hypertension with vasodilator mediators, cirrhotic cardiomyopathy with low cardiac output, bacterial translocation and DAMPs. Splanchnic arterial vasodilation and low output give effective arterial hypovolaemia, which activates RAAS, SNS and AVP, then renal vasoconstriction and lower GFR. A parallel inflammatory response with cytokines adds kidney tissue injury."
        caption: "امشي من فوق لتحت: الـ ==splanchnic arterial vasodilation== والقلب الضعيف بيعملوا ==effective arterial hypovolaemia==، والجسم يرد بـ RAAS و SNS و AVP، فالكلية تنقبض. والسهم المنقط على اليمين هو الـ ==inflammatory response== اللي بيضيف tissue injury."
      - kind: reveal
        page: 159
        quote: "The presence of cirrhotic cardiomayopathy with diastolic dysfunction may aggravate vascular underfilling by decreasing cardiac output resulting in worsened renal vasoconstriction"
        prompt: "إيه دخل القلب في فشل الكلية هنا؟"
        answer: |
          الـ **cirrhotic cardiomyopathy** مع **diastolic dysfunction** بتقلل الـ **cardiac output**. يعني الـ underfilling يزيد، الـ renal vasoconstriction يزيد، والكلية تجوع أكتر.

          والـ structural part؟ **bacterial translocation** → **cytokines** → **NO** أكتر → vasodilatation أكتر.
      - kind: explain
        page: 160
        quote: "HRS-AKI is defined by the Kidney Disease: Improving Global Outcomes (KDIGO) criteria for AKI in addition to exclusion of other causes of AKI"
        title: "التقسيم (ICA)"
        text: |
          التقسيم حسب الـ **International Club of Ascites (ICA)**:

          ==HRS-AKI==:
          - KDIGO criteria للـ AKI + exclusion of other causes.
          - سريع وبيزيد، وأكتر حاجة بتعمله **SBP**.

          ==HRS-non-AKI==، وجواه نوعين:
          - **HRS-AKD** (acute kidney disease): eGFR أقل من 60 لمدة أقل من 3 شهور، أو eGFR نزل 35% أو أكتر، أو creatinine زاد 50% أو أكتر في أقل من 3 شهور.
          - **HRS-CKD**: eGFR أقل من 60 لمدة 3 شهور أو أكتر.

          الـ non-AKI هادي وثابت (moderate and stable reduction in GFR)، وغالبًا بييجي مع **diuretic-resistant ascites**.

          الفرق في جملة: الـ AKI حريقة لازم تتطفي في ساعات، والـ non-AKI نار هادية بتاكل الكلية على شهور.
      - kind: mnemonic
        page: 161
        quote: "No current or recent treatment with nephrotoxic drugs."
        word: "SNAP"
        parts:
          - { key: "S", text: "no Shock" }
          - { key: "N", text: "no current or recent Nephrotoxic drugs" }
          - { key: "A", text: "no response after 2 days of diuretic withdrawal + Albumin 1 g/kg/day (max 100 g)" }
          - { key: "P", text: "no Parenchymal disease: proteinuria <500 mg/day, RBC <50/HPF, normal renal US" }
        hook: |
          الكلية في الـ HRS عملت **SNAP** (اتقصفت) من غير سبب واضح. علشان تقول HRS-AKI لازم تشيل الأسباب التانية بالحروف دي. والـ KDIGO قبلهم: creatinine ↑≥0.3 في 48 ساعة، أو ↑≥50% في 7 أيام، و/أو urine ≤0.5 ml/kg/h لمدة ≥6 ساعات.
      - kind: check
        page: 161
        quote: "Increase in serum creatinine ≥0.3 mg/dL (26.5 mol/L) in < 48 hours."
        question: "A cirrhotic with grade 3 ascites: creatinine rose from 1.0 to 1.4 mg/dL in 36 h. Diuretics stopped and albumin given for 2 days; no improvement. No shock, no NSAIDs, urine protein 150 mg/day, normal renal US. Diagnosis?"
        options:
          - "HRS-AKI"
          - "HRS-CKD"
          - "Prerenal AKI"
          - "Acute tubular necrosis"
        answer: 0
        why:
          - "صح: ↑0.4 في <48 h (KDIGO) + **SNAP** كلها سلبية = **HRS-AKI**."
          - "الـ CKD محتاجة eGFR <60 لمدة ≥3 شهور."
          - "الـ prerenal كان هيستجيب للـ albumin وإيقاف الـ diuretics."
          - "الـ ATN غالبًا بيبان في الـ urine (وفي الـ NGAL الأعلى)؛ وهنا الـ urine نضيفة."
      - kind: explain
        page: 161
        quote: "Additional criteria associated with HRS-AKI include - Low urinary sodium excretion (< 10 mmol/L)."
        title: "الـ urine في HRS: كلية «بتوفّر»"
        text: |
          الكلية في الـ HRS سليمة، بس بتتصرف كأن الجسم في dehydration شديد، فبتحبس كل حاجة. وده بيبان في التحاليل:
          - **Urinary Na منخفض**: أقل من 10 mmol/L (p. 161). وفي p. 163 الكتاب بيقول إن أقل من 5 mmol/L risk للـ HRS.
          - ==FENa أقل من 0.1%==: علامة على renal vasoconstriction.
          - **Urine osmolality عالي**: الـ free water clearance قليل.
          - **Plasma osmolality واطي** و serum Na أقل من 130: المية محبوسة.

          ونستبعد الأسباب الـ structural:
          - **Urine analysis**: proteinuria أقل من 500 mg/day، و microhematuria مش موجودة أو أقل من 50 RBC/HPF.
          - **NGAL** في البول: أعلى في الـ ATN-AKI من الـ HRS-AKI والـ prerenal.
          - **Renal ultrasound**: طبيعي في الـ HRS، ومفيد علشان نستبعد hydronephrosis و intrinsic renal disease.
          - **Ascitic tap**: لازم في الـ HRS-AKI، علشان الـ SBP.
      - kind: aside
        tone: exam
        page: 163
        quote: "Intrarenal (acute tubular necrosis (ATN), acute interstitial nephritis, acute glomerular and vasculitic renal diseases)."
        text: |
          الممتحن بيحب يسأل الـ **differential**: **prerenal** (diuretics زيادة، **lactulose diarrhea**، نزيف)، **intrarenal** (ATN، interstitial nephritis، GN، vasculitis)، و **postrenal** (obstruction).

          والـ HRS-CKD نفرقها من: alcohol-related renal disease، **IgA** deposits، GN من الـ **HBV/HCV**، diabetic و hypertensive nephropathy، و renal vascular disease.
      - kind: explain
        page: 164
        quote: "Without treatment, HRS-AKI has 80% mortality at 2 weeks after the onset of renal failure."
        title: "الـ prognosis والـ prevention"
        text: |
          **Prognosis**:
          - HRS-AKI من غير علاج: 80% mortality خلال أسبوعين من بداية الفشل الكلوي.
          - HRS-non-AKI: median survival 3–6 شهور.
          - الـ vasoconstrictors + albumin ممكن يحسّنوا الـ survival.

          **Prevention**، وكل بند بيقفل باب من أبواب الـ underfilling:
          - **Diuretics بحذر** ومتابعة: علشان منعملش dehydration.
          - **اكتشف بدري** أي electrolyte imbalance أو نزيف أو عدوى.
          - **ابعد عن nephrotoxic drugs**: خصوصًا NSAIDs و aminoglycosides.
          - **صرّف الـ tense ascites**: الضغط العالي في البطن بيضغط على الكلية، والتصريف بيحسّن الـ renal hemodynamics.
          - ==Salt-poor albumin==: mandatory بعد total volume paracentesis وبعد الـ SBP.
          - ==Prophylactic antibiotics==: لكل مريض عمل SBP قبل كده.
      - kind: case
        page: 164
        quote: "Stop diuretics, beta blockers and other nephrotoxic drugs."
        stem: "A 60-year-old with cirrhosis and grade 3 ascites on spironolactone, furosemide, propranolol and lactulose (6 loose stools a day). Creatinine 2.0 mg/dL (0.9 last week)."
        steps:
          - question: "First move?"
            options:
              - "Stop diuretics, propranolol and nephrotoxic drugs"
              - "Increase furosemide for the fluid"
              - "Start hemodialysis"
              - "Give IV contrast CT to look for obstruction"
            answer: 0
            why: "الـ general measures: **stop diuretics, beta blockers** وأي nephrotoxic drug على طول."
          - reveal: "Lactulose is reduced. Albumin 1 g/kg is given for 2 days. Creatinine is 2.2. Ascitic PMN 90/mm³."
            question: "Now what is first-line?"
            options:
              - "Terlipressin plus albumin"
              - "Norepinephrine on the ward without a central line"
              - "TIPS today"
              - "Simultaneous liver-kidney transplant"
            answer: 0
            why: "**Vasoconstrictor + albumin** هو الـ first-line لـ HRS-AKI. الـ norepinephrine لازم central line و ICU. الـ TIPS لو العلاج الدوائي فشل. والـ SLKT لما الـ renal recovery مستبعد."
      - kind: table
        page: 165
        quote: "Terlipressin (vasopressin analogue) administered as intravenous bolus (initial dose 0.5–1 mg every 4–6 hours) or as a continuous intravenous infusion (initial dose of 2 mg/day)"
        title: "الـ vasoconstrictors في HRS-AKI"
        columns: ["Drug", "Dose", "Note"]
        rows:
          - ["Albumin 20%", "20–40 g/day IV", "Given with every vasoconstrictor"]
          - ["Terlipressin", "0.5–1 mg IV every 4–6 h, or 2 mg/day infusion", "Vasopressin analogue"]
          - ["Norepinephrine", "0.5–3 mg/h IV infusion", "Central line, ICU monitoring"]
          - ["Midodrine + octreotide", "7.5 mg/8 h oral (max 15) + 50 mcg/h IV or 100–200 mcg/8 h SC", "Less effective; only if the others are unavailable"]
        hide: [[0, 1], [1, 1], [2, 2], [3, 2]]
      - kind: update
        page: 165
        quote: "Terlipressin (vasopressin analogue) administered as intravenous bolus (initial dose 0.5–1 mg every 4–6 hours) or as a continuous intravenous infusion (initial dose of 2 mg/day)"
        ref: "FDA terlipressin (Terlivaz) label 2022"
        text: |
          بعد الـ CONFIRM trial، الـ FDA وافقت على الـ terlipressin سنة 2022 مع **boxed warning** للـ **respiratory failure**: ميتديش لو الـ SpO2 أقل من 90%، وخلي بالك من الـ volume overload. في الامتحان، الجرعات اللي في الكتاب هي الإجابة.
      - kind: explain
        page: 166
        quote: "Simultaneous liver kidney transplantation (SLKT) is the procedure of choice in HRS-AKI, if renal recovery is unlikely with liver transplant"
        title: "لو مفيش فايدة"
        text: |
          لو العلاج الدوائي مكفاش:
          - **TIPS**: بيحسّن الـ renal perfusion ويقلل نشاط الـ RAAS. بنستخدمه لما الـ medical management يفشل، كـ bridge to LT.
          - **Renal replacement therapy (RRT)**: لمين ما استجابش للـ vasoconstrictors، وللـ end-stage kidney disease. والـ **continuous RRT** غالبًا أحسن تحمّلًا من الـ hemodialysis، لأن الضغط عند المرضى دول واطي أصلًا.
          - ==Liver transplantation==: الـ definitive treatment، لأنه بيصلّح السبب الأصلي. والـ vasoconstrictors + albumin ممكن يحسّنوا الكلية لحد ما الزرع ييجي elective.
          - **Simultaneous liver kidney transplantation (SLKT)**: الـ procedure of choice في الـ HRS-AKI لو الكلية مش متوقع ترجع بزرع الكبد لوحده، أو لو فيه significant CKD.
      - kind: try
        items: [hb.L09.109, hb.L09.112, hb.L09.128]
    recap:
      - "HRS = فشل كلوي functional في liver disease شديد من غير سبب تاني؛ 20% في سنة، 39% في 5."
      - "Vasodilatation شديدة → underfilling → vasoconstrictors تكسب جوه الكلية؛ cardiomyopathy وبكتيريا بيزوّدوا."
      - "HRS-AKI = KDIGO + **SNAP**؛ urine نضيفة، FENa <0.1%، US طبيعي."
      - "Untreated HRS-AKI: 80% يموتوا في أسبوعين؛ non-AKI: 3–6 شهور."
      - "Stop diuretics/BB → albumin + terlipressin (أو NE في ICU) → TIPS/RRT → LT (أو SLKT)."
    practice: [hb.L09.103, hb.L09.104, hb.L09.105, hb.L09.106, hb.L09.107, hb.L09.108, hb.L09.109, hb.L09.110, hb.L09.111, hb.L09.112, hb.L09.113, hb.L09.114, hb.L09.115, hb.L09.116, hb.L09.117, hb.L09.118, hb.L09.119, hb.L09.120, hb.L09.121, hb.L09.122, hb.L09.123, hb.L09.124, hb.L09.125, hb.L09.126, hb.L09.127, hb.L09.128, hb.L09.129, hb.L09.130, hb.L09.131, hb.L09.132, hb.L09.133, hb.L09.134, hb.L09.135, hb.L09.136, hb.L09.137, hb.L09.138, hb.L09.178, hb.L09.182, hb.L09.189]

