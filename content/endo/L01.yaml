  # ---------- p8: differential diagnosis ----------
  - id: endo.L01.049
    kind: enumerate
    topic: men1-ddx
    prompt: Differential diagnosis of MEN 1.
    points:
      - Sporadic or familial tumours of the pituitary, parathyroid or pancreatic islets
      - Hypercalcaemia from any cause
      - GI symptoms with raised gastrin simulating gastrinoma
      - H2 blockers or metoclopramide causing hyperprolactinaemia that simulates a prolactinoma
    pass: 3
    hook: "قبل ما تقول MEN 1 افتكر 4 «مقلّدين»: ورم sporadic أو familial في pituitary أو parathyroid أو islets، hypercalcaemia من أي سبب، أعراض GI مع gastrin عالي شبه gastrinoma، وH2 blockers أو metoclopramide يعلّوا prolactin ويعملوا نفسهم prolactinoma."
    src: { page: 8, quote: "Differential Diagnosis of MEN 1\n  Sporadic or familial tumors of the pituitary, parathyroid or pancreatic islets.\n  Hypercalcemia from any cause may cause.\n  GIT symptoms and increased gastrin levels, simulating a gastrinoma.\n  Treatment of GIT symptoms with H2 blockers or metoclopramide may cause hyper- prolactinemia, simulating a pituitary prolactinoma." }
    status: unverified
