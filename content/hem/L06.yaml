  - id: hem.L06.117
    kind: case
    topic: components
    stem: A 34-year-old man is 2 weeks away from an allogeneic stem cell transplant for AML. He needs red cells and platelets.
    steps:
      - question: Which modification must his products have?
        options: [Irradiation, Washing only, None, CMV-positive units]
        answer: 0
        why: "Stem cell transplant patients need irradiated products from at least 30 days before and indefinitely after (p90), to prevent TA-GVHD."
      - question: Why are his products also leukoreduced?
        options: ["To prevent FNHTR, CMV/HTLV transmission and HLA alloimmunization", "To remove potassium", "To add clotting factors", "To raise the platelet count"]
        answer: 0
        why: "LR removes 99.9% of WBCs, cutting FNHTR, CMV, HTLV, EBV and TRALI risk (p89), and non-leukoreduced platelets drive immune refractoriness (p90)."
      - reveal: "After transplant his platelet increments become poor. He has fever and splenomegaly."
        question: Which type of refractoriness is most likely?
        options: [Non-immune, Immune HLA alloimmunization, Post-transfusion purpura, Hemosiderosis]
        answer: 0
        why: "Fever, infection and splenomegaly are non-immune causes (p90). Immune refractoriness follows repeated non-LR transfusions or multiparity."
