      - kind: explain
        page: 135
        title: "مين بيقرر الـ K اللي في البول؟"
        quote: "Total body K balance is regulated by renal excretion: K is freely filtered at the glomerulus and is reabsorbed by the PCT (75%), the loop of Henle (15%), and cells of the collecting duct and is tightly controlled by aldosterone in the DCT and collecting duct."
        text: |
          الكتاب: الـ K بيترشح كله، والـ **PCT** بيرجّع **75%**، والـ **loop** **15%**، والتحكم الدقيق بالـ ==aldosterone== في الـ DCT والـ collecting duct.

          التفسير المقبول (مش في الكتاب): الـ PCT والـ loop بيرجّعوا نسبة ثابتة تقريبًا مهما كان الجسم محتاج. اللي **بيتغيّر** حسب الاحتياج هو الإفراز في الآخر. يعني:
          - **Aldosterone عالي** = K بيخرج أكتر = **hypokalemia**.
          - **Aldosterone واطي أو متقفل** = K بيتحبس = **hyperkalemia**.

          افتكر الجملة دي، لأن نص أسباب الـ K العالي والواطي هتطلع aldosterone بشكل أو بآخر.
      - kind: explain
        page: 136
        title: "الكلية عندها ساعة"
        quote: "K+ handling by the kidney exhibits a circadian rhythm characterized by lower excretion at night and in the early morning hours and then increasing in the afternoon:"
        text: |
          إخراج الـ K (K excretion) له ==circadian rhythm==: **قليل بالليل والصبح بدري**، ويعلى **بعد الضهر**.

          ليه؟ بيمشي مع مواعيد الأكل اللي فيه K، ومع rhythm في الـ genes بتاعة بروتينات إفراز الـ K، ومع rhythm الـ glucocorticoids والـ aldosterone مع النوم والصحيان.
      - kind: check
        page: 136
        quote: "K+ handling by the kidney exhibits a circadian rhythm characterized by lower excretion at night and in the early morning hours and then increasing in the afternoon:"
        question: "When is renal K excretion lowest?"
        options:
          - "At night and in the early morning"
          - "In the afternoon"
          - "Right after lunch"
          - "It is constant over 24 hours"
        answer: 0
        why:
          - "صح: الإخراج قليل بالليل والصبح بدري."
          - "ده وقت ما الإخراج بيعلى، مع مواعيد الأكل."
          - "بعد الضهر الإخراج بيزيد، مش بيقل."
          - "الكتاب بيقول له circadian rhythm، مش ثابت."
      - kind: explain
        page: 137
        title: "Pseudohyperkalemia: العينة هي العيانة"
        quote: "Pseudohyperkalemia is a laboratory artifact in which there is marked elevation in serum K+ concentration (>0.5 mEq/L) without clinical evidence of electrolyte imbalance."
        text: |
          الـ ==pseudohyperkalemia==: K عالي في المعمل (بأكتر من 0.5) والعيان سليم.

          أسبابها في **سحب العينة**: tourniquet، قبض الإيد، إبرة رفيعة، خبط العينة في الـ pneumatic tube. وأسباب مرضية: **platelets فوق 500,000** و **white blood cell (WBC) حوالي 70,000** (بيطلّعوا K وهي بتتجلط).

          الـ ==reverse pseudohyperkalemia==: **plasma K** عالي والـ **serum K** طبيعي، في الـ **hematologic malignancy**، من الـ **heparin** اللي بيبوّظ غشاء الخلايا الهشة (أو الـ WBC الكتير مستهلكة الطاقة فالـ pump بيقف).

          والـ serum أعلى من الـ plasma في الحالة الكلاسيكية **لأن** الـ serum بيتعمل بعد ما الدم يتجلط، والتجلط هو اللي بيطلّع الـ K من الـ platelets (التفسير المقبول، مش في الكتاب).
      - kind: explain
        page: 137
        title: "ليه العينة بتكدب؟"
        quote: "This phenomenon most commonly occurs during specimen collection when increased K+ release from cells is caused by the application of tourniquets, fist clenching, use of small bore needles, and mechanical trauma during pneumatic tube transport."
        text: |
          الكتاب بيعدّ الأسباب، والتفسير المقبول (مش في الكتاب) إن كلهم بيطلّعوا K من الخلايا **بعد** ما الدم خرج من الجسم أو في حتة صغيرة منه:

          - **Fist clenching**: العضلة وهي بتنقبض بتطلّع K في الوريد اللي بتسحب منه بالظبط.
          - **Tourniquet** طويل: الدم بيقف ويتركّز حوالين الإبرة.
          - **إبرة رفيعة** و **خبط الـ pneumatic tube**: كرات الدم الحمرا بتتكسر (hemolysis)، و98% من الـ K كان جوّاها.
          - **Platelets** و **WBC** كتير: وهي بتتجلط في الأنبوبة بتطلّع الـ K بتاعها، فالـ **serum** يعلى والـ plasma لأ.

          وفي الـ ==reverse== العكس: الـ **heparin** في أنبوبة الـ plasma بيكسر الخلايا السرطانية الهشة.
      - kind: check
        page: 137
        quote: "Refers to a false elevation in plasma K+ concentration when serum K+ concentration is normal. This condition most commonly occurs in the setting of hematologic malignancy and is due to heparin-induced cell membrane damage. Several hypotheses exist in explaining this phenomenon such theory explains that the dysplastic white blood cells of leukemia and lymphoma exhibit increased fragility that makes these cells prone to lysis."
        question: "CLL patient: heparin-tube K 6.9, clotted-tube K 4.2, normal ECG. What is this?"
        options:
          - "Reverse pseudohyperkalemia"
          - "Classic pseudohyperkalemia"
          - "True hyperkalemia"
          - "Hypokalemia"
        answer: 0
        why:
          - "صح: الـ plasma (heparin) عالي والـ serum طبيعي في malignancy."
          - "الكلاسيكي العكس: الـ serum هو اللي عالي."
          - "لو حقيقي كان الاتنين هيعلوا."
          - "الـ K مش واطي."
      - kind: sort
        page: 138
        quote: "Causes of Hyperkalaemia Increased potassium release from cells"
        prompt: "الـ K عالي ليه؟ حط كل سبب في مكانه:"
        bins: ["Release from cells", "Drugs", "Reduced urine excretion"]
        cards:
          - { text: "Rhabdomyolysis", bin: 0 }
          - { text: "Metabolic acidosis", bin: 0 }
          - { text: "Red cell transfusion", bin: 0 }
          - { text: "Angiotensin-converting enzyme inhibitor (ACEI) + angiotensin II receptor blocker (ARB)", bin: 1 }
          - { text: "Heparin", bin: 1 }
          - { text: "High-dose trimethoprim", bin: 1 }
          - { text: "Gordon syndrome", bin: 2 }
          - { text: "Ureterojejunostomy", bin: 2 }
        why: "الـ heparin بيقلل الـ **aldosterone**؛ الـ digoxin بس في الـ **toxicity**. والـ ureterojejunostomy: الأمعاء بتمص الـ K من البول تاني."
      - kind: explain
        page: 138
        remind: [neph.L06.072]
        title: "ليه كل سبب بيعلّي الـ K؟"
        quote: "Heparin and LMW heparins (inhibit aldosterone release)."
        text: |
          الكتاب بيقول الـ **heparin** بيمنع إفراز الـ aldosterone. والباقي **السبب** فيه بالتفسير المقبول (مش في الكتاب)، وكله راجع لفكرتين: **الـ K طلع من الخلايا**، أو **الـ aldosterone اتقفل**.

          **Release from cells**:
          - **Metabolic acidosis**: الـ H+ بيدخل الخلايا والـ K يطلع مكانه.
          - **Insulin deficiency و hyperosmolality**: مفيش insulin يدخّل الـ K، والميه وهي خارجة من الخلايا بتسحب K معاها.
          - **Rhabdomyolysis، tumour lysis، transfusion، مجهود شديد**: خلايا اتكسرت وطلّعت الـ 98% اللي جوّاها.

          **Drugs**:
          - **ACEI و ARB** بيقللوا الـ aldosterone، و **spironolactone و eplerenone** بيقفلوا الـ receptor بتاعه.
          - **NSAIDs** بتقلل الـ renin، فالـ aldosterone يقل.
          - **High-dose trimethoprim** بيقفل قناة الـ Na في الـ collecting duct زي الـ amiloride، فمفيش تبادل يطلّع K.
          - **Digoxin toxicity** بيقفل الـ Na/K-ATPase نفسها، و **beta-blockers** بيقفلوا الـ beta-2 اللي بيدخّل الـ K.

          **Reduced excretion**: aldosterone قليل، أو Na وميه قليلين بيوصلوا للـ distal nephron فمفيش حاجة تتبادل مع الـ K، أو ==ureterojejunostomy== (الأمعاء بتمص الـ K من البول تاني)، أو CKD.
      - kind: aside
        tone: trap
        page: 138
        quote: "Digoxin toxicity (but not therapeutic levels of digoxin)."
        text: "الكتاب واضح: الـ digoxin بيعلّي الـ K في الـ ==toxicity== بس، **مش** في الجرعة العلاجية. ولو شفت عيان digoxin مع K عالي جدًا وغثيان واضطراب في الرؤية، فكّر في الـ toxicity مش في الدوا العادي."
      - kind: try
        items: [neph.L06.064, neph.L06.066, neph.L06.069, neph.L06.073, neph.L06.077]
    recap:
      - "98% من الـ K جوّه الخلايا؛ الـ insulin والـ beta-2 بيدخّلوه بالـ Na/K-ATPase (3:2) وبيحموا القلب بعد الأكل."
      - "الفرق بين جوّه وبرّه هو الـ resting voltage، فأي لخبطة بتظهر في القلب والعضلات والأعصاب."
      - "PCT 75%، loop 15%، والقرار في الآخر بالـ aldosterone في الـ DCT والـ collecting duct."
      - "الإخراج له circadian rhythm: قليل بالليل والصبح بدري، يعلى بعد الضهر."
      - "Pseudo: K في الـ serum عالي (>0.5) والعيان سليم: tourniquet، قبضة، إبرة رفيعة، pneumatic tube، platelets >500,000، WBC 70,000. Reverse: الـ plasma عالي في الـ hematologic malignancy من الـ heparin."
      - "الأسباب: خروج من الخلايا (acidosis، insulin deficiency، cell lysis)، أدوية بتقفل الـ aldosterone أو قنواته (ACEI/ARB، spironolactone، NSAIDs، heparin، trimethoprim، digoxin toxicity، beta-blockers)، وإخراج قليل (Gordon، ureterojejunostomy، kidney disease)."
    practice: [neph.L06.062, neph.L06.063, neph.L06.064, neph.L06.065, neph.L06.066, neph.L06.067, neph.L06.068, neph.L06.069, neph.L06.070, neph.L06.071, neph.L06.072, neph.L06.073, neph.L06.074, neph.L06.075, neph.L06.076, neph.L06.077]
