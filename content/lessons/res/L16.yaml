  - kind: explain
    page: 29
    quote: Negative, left-hand skew
    title: شكل البيانات بيحدد التلخيص
    text: |-
      الدكتورة ربطت الشكل بطريقة التلخيص (شرح سلايدات 26–33):

      - بيانات ==normal== ← لخّصها بالـ **mean** والـ **SD**.
      - بيانات ==skewed== ← لخّصها بالـ **median** والـ ==IQR== (interquartile range)، لأن الـ mean بيتشد ناحية الذيل.

      ولما تقارن **sample 1** و**sample 2** (سلايد 30–31): لو الاتنين normal ← **parametric tests**، ولو فيه skew ← **non-parametric tests**. التفاصيل في المحاضرات الجاية.
  - kind: explain
    page: 31
    quote: |-
      Sample 1
      Sample 2
      Positive, right-hand skew
    title: ليه شكل كل عيّنة مهم وانت بتقارن؟
    text: |
      السلايد بترسم Sample 1 و Sample 2، وشكل واحدة فيهم ==positive, right-hand skew==. لما تقارن عيّنتين، شكل البيانات في كل واحدة بيحدد الـ test:

      - بيانات ==normal== ← ==parametric tests== (مبنية على الـ mean والـ SD).
      - بيانات skewed ← non-parametric tests.

      ده شرح المحاضِرة لسلايد 30 و 31، والـ tests نفسها جاية في المحاضرات الجاية. ليه؟ لأن الـ mean والـ SD مش بيوصفوا البيانات المايلة كويس، فالـ test اللي مبني عليهم يضلّل.
