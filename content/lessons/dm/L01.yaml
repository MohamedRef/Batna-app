  - id: dm.L01.lesson8
    title: "الـ A1C: متوسط شهور على كرة الدم"
    hook: "تحليل واحد من غير صيام بيقولك السكر كان عامل إيه آخر تلت شهور. بس ليه مش بيكفي لوحده؟"
    minutes: 8
    pages: [10, 11]
    topics: [lab, types]
    goals:
      - "تفهم الـ A1C بيقيس إيه وليه مش محتاج صيام"
      - "تعرف عيوبه وإمتى ما تستخدمهوش (عمر كرة الدم)"
      - "تعرف مين يكسب لو الـ A1C والسكر اختلفوا، وفئتين الـ glucose intolerance"
    status: unverified
    steps:
      - kind: explain
        page: 10
        title: "الـ A1C: سكر متسجّل على كرة الدم"
        quote: "A1C reflects glucose bound to hemoglobin over the life span of the erythrocyte 120 days)."
        text: |
          الـ ==A1C== = جلوكوز **لازق في الـ hemoglobin** على عمر كرة الدم الحمرا (**120 يوم**).

          **مميزاته (الكتاب):**
          - **Greater convenience:** مفيش صيام.
          - **Fewer day-to-day variations** مع الـ stress والأكل والمرض.

          ليه أقل تقلّب؟ يعني بدل ما تاخد صورة للسكر في لحظة، الـ A1C زي **متوسط** شهرين تلاتة. ساعة stress أو وجبة كبيرة مش هتحرّك المتوسط كتير. وعشان كده هو نفسه بيحل عيوب سكر البلازما اللي في ص 9: الصيام والـ diurnal variation.
      - kind: figure
        page: 10
        quote: "A1C reflects glucose bound to hemoglobin over the life span of the erythrocyte 120 days)."
        title: "كرة الدم بتشرب سكر 120 يوم"
        alt: "A red cell timeline of 120 days. A normal cell lives the full span and collects glucose on its haemoglobin all along, giving a true A1C. A young cell from erythropoietin, bleeding or haemolysis lives a shorter time in the blood, so it collects less glucose and the A1C reads falsely low."
        caption: "الـ A1C بيفترض إن كل كرة عاشت عمرها كامل. لو الكرات **أصغر سنًا** من الطبيعي، السكر اللازق أقل والرقم ==falsely low==، والسكر الحقيقي أعلى."
        svg: |
          <svg viewBox="0 0 330 210" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L01f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <path d="M20 30 H315" class="fg-arrow" marker-end="url(#L01f)"/>
            <text x="20" y="20" class="t-sm t-mut">day 0</text>
            <text x="300" y="20" text-anchor="end" class="t-sm t-mut">day 120</text>
            <rect x="20" y="48" width="280" height="40" rx="10" class="fg-good"/>
            <circle cx="60" cy="68" r="5" class="fg-dot-good"/>
            <circle cx="110" cy="68" r="5" class="fg-dot-good"/>
            <circle cx="160" cy="68" r="5" class="fg-dot-good"/>
            <circle cx="210" cy="68" r="5" class="fg-dot-good"/>
            <circle cx="260" cy="68" r="5" class="fg-dot-good"/>
            <text x="160" y="108" text-anchor="middle" class="t-sm">Normal life span: true A1C</text>
            <rect x="20" y="126" width="110" height="40" rx="10" class="fg-bad"/>
            <circle cx="55" cy="146" r="5" class="fg-dot-bad"/>
            <circle cx="95" cy="146" r="5" class="fg-dot-bad"/>
            <text x="140" y="151" class="t-sm">short life: less glucose</text>
            <text x="160" y="190" text-anchor="middle" class="t-sm t-bad t-b">EPO, bleeding, haemolysis → falsely low</text>
          </svg>
      - kind: explain
        remind: [dm.L01.016]
        page: 11
        title: "عيوب الـ A1C"
        quote: "Disadvantages include:\n  1- The A1C test should be performed using a well-standardized method\n  2- Lower sensitivity of A1C compared with that of glucose tests\n  3- Greater cost and limited access\n  4- Limited to use for GDM diagnosis and sudden onset and early discovery of type 1 diabetes 5- A1C may not be a suitable diagnostic test in people with anemia, people treated with erythropoietin, or people undergoing hemodialysis or HIV treatment 7- Some hemoglobin variants can interfere with A1C like sickle cell trait"
        text: |
          **عيوبه:** لازم method **standardized**، **sensitivity** أقل، أغلى، محدود في **gestational diabetes mellitus (GDM)** و type 1 المفاجئ، و ==not suitable== في **anemia، erythropoietin، hemodialysis، human immunodeficiency virus (HIV) treatment**، و **Hb variants** (sickle cell trait).

          الـ **lower sensitivity** معناها إنه بيفوّت ناس عندهم سكر فعلًا. والـ GDM والـ type 1 المفاجئ؟ لأن الـ A1C متوسط **شهور**، فلو السكر لسه طالع من أسابيع، المتوسط مش هيلحق يعلى.
      - kind: reveal
        page: 11
        quote: "Disadvantages include:\n  1- The A1C test should be performed using a well-standardized method\n  2- Lower sensitivity of A1C compared with that of glucose tests\n  3- Greater cost and limited access\n  4- Limited to use for GDM diagnosis and sudden onset and early discovery of type 1 diabetes 5- A1C may not be a suitable diagnostic test in people with anemia, people treated with erythropoietin, or people undergoing hemodialysis or HIV treatment 7- Some hemoglobin variants can interfere with A1C like sickle cell trait"
        prompt: "إيه اللي بيجمع الـ anemia والـ erythropoietin والـ hemodialysis؟"
        answer: |
          كلهم بيغيّروا **عمر كرات الدم الحمرا**. الـ A1C بيفترض إن الكرة عاشت حوالي **120 يوم** وهي بتشرب سكر.

          لو الكرات **جديدة** (EPO، نزيف، hemolysis) ← وقت أقل ← A1C **falsely low**. ولو الـ Hb نفسه شكله مختلف (sickle trait) ← الجهاز يقرأ غلط. (تفسير فسيولوجي؛ القائمة من الكتاب.)
      - kind: check
        page: 11
        quote: "A1C may not be a suitable diagnostic test in people with anemia, people treated with erythropoietin, or people undergoing hemodialysis or HIV treatment"
        question: "A man on regular hemodialysis is being checked for diabetes. Which test is least suitable?"
        options:
          - "A1C"
          - "Fasting plasma glucose"
          - "2-h plasma glucose after 75 g"
          - "Random plasma glucose with symptoms"
        answer: 0
        why:
          - "صح: الكتاب بيقول الـ A1C **may not be suitable** في الـ hemodialysis، لأن الـ anemia والـ erythropoietin بيقصّروا عمر الكرات."
          - "سكر البلازما مش معتمد على عمر الكرة، فمناسب."
          - "نفس الكلام: بيقيس السكر نفسه."
          - "مع أعراض، random 200 يكفي ومش متأثر بالـ dialysis."
      - kind: explain
        page: 11
        title: "قواعد الـ A1C"
        quote: "Facts for using A1C in diabetes diagnosis\n  A1C > 6.5%: Diabetes diagnosis, A1C > 5.7%: prediabetes diagnosis.\n  The use of A1C alone for diabetes diagnosis is not accurate because it has several limitations\n  In cases of discrepancies between A1C and glycemia, plasma glucose criteria should be used to diagnose diabetes\n  A1C is commonly used to:\n    1- Determine the chronicity of hyperglycemia\n    2- Follow up for long-term control of DM"
        text: |
          - **≥6.5%** = diabetes، **≥5.7%** = prediabetes.
          - الـ A1C ==لوحده== مش دقيق للتشخيص.
          - لو الـ A1C والسكر **مختلفين** ← ==plasma glucose criteria== هي اللي بتحكم.
          - استخدامه الأشهر: يعرّفك الـ hyperglycemia **من إمتى** (chronicity)، و **متابعة** الـ control على المدى الطويل.
      - kind: reveal
        page: 11
        quote: "In cases of discrepancies between A1C and glycemia, plasma glucose criteria should be used to diagnose diabetes"
        prompt: "A1C 6.7% بس الـ FPG 94 والـ 2-h 128. تمشي ورا مين؟ وليه؟"
        answer: |
          ورا ==plasma glucose==. الكتاب صريح: لو فيه **discrepancies** بين الـ A1C والسكر، **plasma glucose criteria** هي اللي بتشخّص. فالعيان ده مش diabetic بالكتاب.

          ليه؟ لأن الـ A1C **قياس غير مباشر**: بيقيس أثر السكر على الـ hemoglobin، وده بيتأثر بعمر الكرة وشكل الـ Hb زي ما شفنا. أما الجلوكوز فهو المرض نفسه. وعشان كده الكتاب بيقول كمان إن الـ A1C **alone** مش دقيق للتشخيص.
      - kind: update
        page: 11
        quote: "Facts for using A1C in diabetes diagnosis\n  A1C > 6.5%: Diabetes diagnosis, A1C > 5.7%: prediabetes diagnosis.\n  The use of A1C alone for diabetes diagnosis is not accurate because it has several limitations\n  In cases of discrepancies between A1C and glycemia, plasma glucose criteria should be used to diagnose diabetes\n  A1C is commonly used to:\n    1- Determine the chronicity of hyperglycemia\n    2- Follow up for long-term control of DM"
        text: "الـ American Diabetes Association (ADA) بيكتب الحدود **≥6.5%** و prediabetes **5.7–6.4%**. الكتاب كاتب «>»، والرقمين نفسهم. في الامتحان اكتب الأرقام زي الكتاب."
        ref: "ADA Standards of Care in Diabetes 2025, section 2"
