  - id: geri.L07.lesson5
    title: "الأكل والأدوية والهدف: MUST و MNA و STOPP/START"
    hook: "وزن بينزل بهدوء ودوا بقاله 15 سنة: اتنين بيضرّوا العجوز من غير صوت."
    minutes: 9
    pages: [123, 130]
    topics: [nutrition, social-meds]
    goals:
      - "تحفظ risk factors الـ malnutrition وتحسب الـ MUST"
      - "تعرف bands الـ MNA"
      - "تعرف ليه الـ medication review قلب الـ CGA"
    status: unverified
    steps:
      - kind: explain
        page: 123
        title: "Malnutrition: خطير بس بيتعالج"
        quote: "Involuntary weight loss (more than 5% over the last month or more than 10% over the last six months)."
        text: |
          مشاكل التغذية في الكبير **poor prognosis** بس **potentially treatable**، وممكن تكون علامة لمرض تاني.

          Risk factors:
          - **Involuntary weight loss** ==>5% في شهر== أو **>10% في 6 شهور**
          - ==BMI <20== لو **≥65 سنة**
          - Decreased appetite أو reduced food intake
      - kind: aside
        tone: trap
        page: 123
        quote: "BMI less than 20 for elderly (≥ 65y)."
        text: "في الكبير الـ BMI cut-off هنا **20** مش 18.5. والسؤال 7 في الكتاب: «Increased appetite» هو اللي **مش** risk factor."
      - kind: figure
        page: 123
        quote: "Acute disease effect score"
        title: "MUST: 3 خطوات تتجمع"
        alt: "Three boxes add together: Step 1 BMI score (over 20 is 0, 18.5 to 20 is 1, under 18.5 is 2), Step 2 weight loss in 3 to 6 months (under 5 percent 0, 5 to 10 percent 1, over 10 percent 2), Step 3 acute disease effect (acutely ill with no intake over 5 days is 2). They sum to Step 4: 0 low, 1 medium, 2 or more high risk."
        caption: "==MUST== = BMI + weight loss + acute disease. **0** low، **1** medium، **≥2** high."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="G07b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="10" y="10" width="310" height="62" rx="10" class="fg-box"/>
            <text x="20" y="30" class="t-sm t-b t-acc">Step 1  BMI (kg/m²)</text>
            <text x="20" y="50" class="t-sm">&gt;20 = 0 · 18.5–20 = 1 · &lt;18.5 = 2</text>
            <rect x="10" y="80" width="310" height="62" rx="10" class="fg-box"/>
            <text x="20" y="100" class="t-sm t-b t-acc">Step 2  Unplanned weight loss, 3–6 months</text>
            <text x="20" y="120" class="t-sm">&lt;5% = 0 · 5–10% = 1 · &gt;10% = 2</text>
            <rect x="10" y="150" width="310" height="62" rx="10" class="fg-box"/>
            <text x="20" y="170" class="t-sm t-b t-acc">Step 3  Acute disease effect</text>
            <text x="20" y="190" class="t-sm">Acutely ill + no intake &gt;5 days = 2</text>
            <path d="M165 214 V240" class="fg-arrow" marker-end="url(#G07b)"/>
            <rect x="10" y="245" width="310" height="75" rx="10" class="fg-acc"/>
            <text x="20" y="267" class="t-sm t-b">Step 4  Add the scores</text>
            <circle cx="35" cy="294" r="9" class="fg-dot-good"/>
            <text x="50" y="299" class="t-sm">0 Low</text>
            <circle cx="125" cy="294" r="9" class="fg-dot-acc"/>
            <text x="140" y="299" class="t-sm">1 Medium</text>
            <circle cx="230" cy="294" r="9" class="fg-dot-bad"/>
            <text x="245" y="299" class="t-sm">≥2 High</text>
          </svg>
      - kind: case
        page: 123
        quote: "Overall risk of malnutrition"
        stem: "79-year-old, BMI 19, lost 8% of weight in 4 months, eating normally, not acutely ill."
        steps:
          - question: "MUST score?"
            options: ["2", "1", "3", "0"]
            answer: 0
            why: "BMI 18.5–20 = **1**، weight loss 5–10% = **1**، مفيش acute disease effect = 0. المجموع **2**."
          - question: "Risk?"
            options: ["High", "Medium", "Low", "Cannot tell"]
            answer: 0
            why: "**2 or more = high risk**."
      - kind: table
        page: 124
        quote: "Mini Nutritional Assessment"
        title: "MNA: screening ثم assessment"
        columns: [Band, "Screening /14", "Total /30"]
        rows:
          - ["Normal", "12–14", "24–30"]
          - ["At risk", "8–11", "17–23.5"]
          - ["Malnourished", "0–7", "<17"]
        hide: [[1, 1], [2, 1], [0, 2], [2, 2]]
      - kind: aside
        tone: tip
        page: 124
        quote: "Mini Nutritional Assessment"
        text: |
          الـ **MNA screening** 6 أسئلة (A–F): الأكل قلّ في 3 شهور، الوزن نزل، mobility، stress أو acute disease، neuropsychological problems، BMI.

          لو ==11 أو أقل== كمّل الـ assessment (G–R): بيعيش لوحده؟ **>3 prescription drugs**؟ pressure sores؟ وجبات، protein، سوائل، MAC (<21 = 0)، calf circumference (<31 = 0).
      - kind: explain
        page: 126
        title: "Social history: أكتر من كلمة «متجوز»"
        quote: "How often have you seen a social history comprising one word 'married'?"
        text: "أغلب الكشوفات بتحصل **بعيد عن البيت** ومن غير الـ next of kin أو الـ carers. والكتاب بيسأل: كام مرة شفت social history كلمة واحدة: ==«married»==؟ اسأل مين بيساعده، البيت شكله إيه، بيصرف منين."
      - kind: explain
        page: 126
        title: "الـ medication review: قلب الـ CGA"
        quote: "Medication review is a core component of CGA."
        text: |
          - الـ guidelines اتعملت على trials **ما كانش فيها** frail elderly.
          - دوا قديم ممكن يبقى مالوش لازمة: المرض خلص، الـ ==physiology اتغيّرت==، أو كان بيعالج **side effect** لدوا تاني.
          - أدوية **long-term risk reduction** (ضغط، renal disease في السكر، lipid lowering) أقل أهمية مع **limited lifespan**.

          الحل: علاج **individualized** باستخدام ==STOPP & START==.
      - kind: reveal
        page: 126
        quote: "or the reason for their prescription may have been to treat another drug's side effect."
        prompt: "عيانة بتاخد amlodipine، وبعدين furosemide لورم الرجل منه، وبعدين potassium علشان الـ furosemide. إيه المشكلة؟"
        answer: "دي **prescribing cascade**: دوا بيعالج **side effect** دوا تاني. الكتاب بيقول إن الدوا ممكن يكون اتكتب «to treat another drug's side effect». الـ review ممكن يشيل التلاتة بدل ما يزوّد رابع. (المثال للتوضيح، والفكرة من الكتاب.)"
      - kind: explain
        page: 126
        title: "QoL والهدف"
        quote: "Quality Of Life Scale (QOL). WHO Quality of Life Scale"
        text: "آخر حاجتين: **Quality of life** (QOL scale و ==WHO Quality of Life Scale==)، و **goals of care، advance care preferences و spirituality**: العيان نفسه عايز إيه."
      - kind: check
        page: 126
        quote: "treatment should be individualized, and we should use older people prescription criteria e.g. STOPP & START."
        question: "What is a critical component of medication review in CGA?"
        options:
          - "Using STOPP & START criteria to individualize treatment"
          - "Prescribing as many medications as possible"
          - "Avoiding all long-term medications"
          - "Discontinuing all supplements"
        answer: 0
        why:
          - "صح: سؤال الكتاب رقم 8، والإجابة individualized بـ STOPP & START."
          - "الأدوية الكتير ممكن تضر أكتر ما تنفع، خصوصًا مع بعض."
          - "الـ long-term بتتراجع، مش بتتمنع كلها."
          - "مفيش إيقاف بالجملة."
      - kind: try
        items: [geri.L07.093, geri.L07.095, geri.L07.098, geri.L07.104, geri.L07.105]
    recap:
      - "Malnutrition: weight loss >5%/شهر أو >10%/6 شهور، BMI <20 فوق 65، شهية قليلة."
      - "MUST = BMI + weight loss + acute disease (2 لو مفيش أكل >5 أيام). ≥2 = high."
      - "MNA screening من 14 (≤11 كمّل)، total من 30: <17 malnourished."
      - "Medication review: trials ما فيهاش frail elderly، cascades، long-term risk reduction ← STOPP & START."
    practice: [geri.L07.092, geri.L07.093, geri.L07.094, geri.L07.095, geri.L07.096, geri.L07.097, geri.L07.098, geri.L07.099, geri.L07.100, geri.L07.101, geri.L07.102, geri.L07.103, geri.L07.104, geri.L07.105, geri.L07.106, geri.L07.107, geri.L07.108]
