      - kind: match
        page: 420
        quote: "Various glomerular diseases have been associated with chronic lymphocytic leukemia, with the most frequently reported findings of membranoproliferative glomerulonephritis (36%) and MN (19%)."
        prompt: "وصّل الـ lesion بالسرطان اللي بيتذكر معاها (Figure 9):"
        pairs:
