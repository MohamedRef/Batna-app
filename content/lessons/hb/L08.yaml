      - kind: explain
        page: 132
        title: "إنزيمات عالية من غير أعراض"
        text: |
          **Asymptomatic elevation of liver enzymes** ليها مصيرين:

          - ==Drug tolerance==: no progress despite continued use. الكبد بيتعوّد. أمثلة: INH، phenytoin، chlorpromazine.
          - **Progression with continued use**: AST & ALT 3–5× ULN، و may progress to hepatic failure.

          يعني ارتفاع الإنزيمات لوحده مش هو القصة كلها؛ المهم هو بيتقدّم ولا لأ.
      - kind: aside
        tone: joke
        page: 132
        text: |
          الـ **drug tolerance** زي ساكن جديد في وسط البلد: أول أسبوع متضايق من الزحمة والكلاكسات (enzymes طالعة)، وبعدين يتعوّد ويكمّل عادي. 🚕

          الكبد مع **INH، phenytoin، chlorpromazine** بيعمل كده.
      - kind: explain
        page: 133
        title: "الـ acute hepatocellular (direct toxic)"
        text: |
          - ==ALT and AST==: marked elevation.
          - ==ALP==: normal or minimally elevated، يعني R عالي (hepatocellular).
          - **Bilirubin**: variably increased، ولو عالي → worse prognosis (هتشوف السبب في آخر درس).
          - **FHF share**: مسؤول عن 1/3 من الـ fulminant hepatic failure في أمريكا: 20% acetaminophen و 12–15% other drugs.
      - kind: table
        page: 133
        title: "الـ pattern بيقولك مين"
        columns: ["Pattern", "Points to"]
        rows:
          - ["AST 2–3× ALT, AST < 300 IU, ALT < 100 IU", "Alcohol"]
          - ["ALT and AST 5,000–10,000 IU", "Drugs (acetaminophen), chemical toxins, toxic mushrooms, shock liver"]
          - ["Towering levels in viral hepatitis", "Unusual"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: mnemonic
        page: 133
        word: "MAST"
        parts:
          - { key: "M", text: "Mushrooms (toxic)" }
          - { key: "A", text: "Acetaminophen (drugs)" }
          - { key: "S", text: "Shock liver" }
          - { key: "T", text: "Toxins (chemical)" }
        hook: |
          إنزيمات **towering (ALT and AST 5,000–10,000 IU)**؟ طالعة لفوق زي **صاري المركب (MAST)**. والفيروسات نادرًا بتطلع الصاري ده.
      - kind: check
