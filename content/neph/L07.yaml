  - id: neph.L07.016
    kind: enumerate
    topic: adpkd-renal
    prompt: Mention the renal manifestations of ADPKD.
    points:
      - Flank or loin pain from large cysts (acute pain suggests cyst rupture or bleeding)
      - Dipstick-positive hematuria, with or without episodic frank hematuria
      - Raised BP
      - Nocturia and polyuria (loss of concentrating ability)
      - Low-grade proteinuria, usually under 1 g/day
      - Uremic symptoms if presenting late
    pass: 5
    hook: "كلية ADPKD «بتوجع، بتنزّف، بترفع الضغط، بتصحّيك بالليل، بتسرّب شوية بروتين، وفي الآخر يوريا»: flank pain (المفاجئ ← cyst rupture أو نزيف)، dipstick hematuria ± frank hematuria على نوبات، raised BP، nocturia وpolyuria (concentrating ability راحت)، low-grade proteinuria عادة أقل من 1 g/day، وuremic symptoms لو جه متأخر. 6."
    src: { page: 147, quote: "Clinical manifestations\nKidney\n  Flank or loin pain arising from large cysts. Acute pain may suggest cyst rupture or bleeding.\n  Dipstick-positive haematuria ± episodic frank haematuria.\n  ↑ BP.\n  Nocturia and polyuria (loss of urinary concentrating ability).\n  Low-grade proteinuria may be present (usually <1g/day).\n  If presenting late, uraemic symptoms (p. 212)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.017
    kind: card
    topic: adpkd-renal
    front: Why do ADPKD patients have nocturia and polyuria?
    back: Loss of urinary concentrating ability.
    src: { page: 147, quote: "Nocturia and polyuria (loss of urinary concentrating ability)." }
    status: unverified
  - id: neph.L07.018
    kind: cloze
