          - ["Angiomyolipoma", "Women 5:1, fifth decade, solitary"]
          - ["Simple hepatic cyst", "Solitary, developmental: just follow-up"]
          - ["Biliary papillomatosis", "Thick mucus, obstruction without a mass"]
        why: "الـ peliosis والـ hemangioma الاتنين blood-filled، والفرق في الجدار و **الـ steroids**."
      - kind: aside
        tone: exam
        page: 317
        quote: "Mention the classification of benign liver tumors."
        text: |
          أسئلة المحاضرة التلاتة، وإجابتها في الدروس دي:
          - **Classification of benign liver tumors**: الـ 3 عائلات (الدرس الأول).
          - **Treatment of hepatic adenoma**: stop hormones، SLaP M، TAE (الدرس الأول).
          - **Hemangioma by contrast CT**: peripheral nodular ← centripetal fill-in ← no washout (هنا، ومن الـ guideline).
