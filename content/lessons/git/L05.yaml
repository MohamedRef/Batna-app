        title: "FAP في سطر"
        text: "**Familial adenomatous polyposis (FAP)**: hereditary polyposis، ==autosomal dominant==، **thousands of adenomatous polyps** في القولون والمستقيم، وممكن extra-intestinal manifestations، وعندها malignant potential. (التفاصيل في محاضرة 4.)\n\nالتفسير المقبول (مش في الكتاب): ليه autosomal dominant مهمة هنا؟ لأن كل ابن أو بنت عندهم 50% يورثوا الجين، فالتشخيص في مريض واحد معناه فحص العيلة كلها."
      - kind: figure
        page: 194
        title: "الـ FAP في المنظار"
        image: { file: git/L05-fap-colonoscopy.webp, book: true }
        alt: "Book colonoscopy picture of the colon wall covered by countless small adenomatous polyps."
        caption: |
          الحيطة كلها مغطية بـ ==آلاف البوليبات الصغيرة==. شوف الفرق عن البوليب الواحد.
      - kind: explain
        page: 194
        quote: "Juvenile Polyposis syndrome"
        title: "Juvenile polyposis syndrome و FAP: ليه الاتنين في نفس الصفحة؟"
        text: |
          الكتاب بيحط صورة **juvenile polyposis syndrome** وبعدها ==FAP== كـ hereditary polyposis syndrome: **autosomal dominant**، thousands of adenomatous polyps في القولون والمستقيم، وممكن **extra-intestinal manifestations**، وعندها **malignant potential**.

          التفسير المقبول (مش في الكتاب): الاتنين «polyposis» (بوليبات كتير) وبيتورثوا autosomal dominant، بس نوع البوليب مختلف: الـ juvenile **hamartoma** والـ FAP **adenoma**. والفرق ده بيبان في المنظار (الـ juvenile أحمر أملس على stalk، والـ FAP سجادة adenomas صغيرة) وفي الـ biopsy. يعني «كتير» لوحدها مش تشخيص، لازم تعرف كتير من إيه.
