        quote: "Cardinal signs of MI\n  1- Suggestive pain > 30 min\n  2- ECG\n  3- Increased cardiac enzymes"
        text: "الـ **Fourth Universal Definition** بيشترط **troponin** يعلى أو ينزل، وقيمة منه فوق الـ 99th percentile، **+** دليل ischemia: أعراض، أو ECG جديد، أو Q waves، أو imaging، أو thrombus. في الامتحان: الـ cardinal signs التلاتة بتوع الكتاب."
