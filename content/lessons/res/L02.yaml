  - id: res.L02.lesson5
    title: "Secondary attack rate: العدوى في البيت"
    hook: "طفل جاب hepatitis A من الحضانة، وبعد فترة حضانة أخوه وأمه تعبوا. نحسب البيت إزاي من غير ما نعدّ الطفل الأول؟"
    minutes: 7
    pages: [44, 50]
    topics: [secondary]
    goals:
      - "تكتب الـ SAR formula وتعرف تشيل مين من المقام"
      - "تحل أمثلة الـ shigellosis والـ hepatitis A"
    status: unverified
    steps:
      - kind: explain
        page: 44
        quote: "The primary case is excluded from both the numerator and denominator."
        title: "الـ SAR"
        text: |
          الـ **secondary attack rate** بيقيس الحالات الجديدة بين ==contacts== حالة معروفة (الـ primary case). مهم في الأمراض اللي بتنتقل person-to-person: TB، measles، shigellosis، varicella.

          - **SAR = exposed persons who develop the disease within the incubation period ÷ total exposed susceptible contacts × 100**

          يعني بتعدّ بس اللي تعبوا ==within the incubation period==، وبتقسم على الـ **susceptible** contacts.

          والقاعدة الذهبية: الـ **primary case** بيطلع من البسط والمقام.
      - kind: reveal
        page: 46
        quote: "subtract the number of primary cases from the total number living in the households. Immune individuals should also be subtracted."
        prompt: "مين تاني بيطلع من المقام غير الـ primary case؟ وليه؟"
        answer: |
          الـ ==immune individuals== (متطعمين أو جالهم قبل كده).

          المقام = **susceptibles** بس. اللي مش ممكن يتعدي مالوش مكان فيه. علشان كده slide 45 بيقول إن الـ **incubation period** والـ **state of immunity** مهمين.
      - kind: case
        page: 48
        quote: "17 ----------------------------------- x100 68"
        stem: "Shigellosis: 18 شخص في 18 بيت مختلف تعبوا، والقرية 1,000. بعد incubation period، 17 كمان تعبوا في نفس البيوت. الـ 18 بيت فيهم 86 شخص."
        steps:
          - question: "Overall attack rate in the community?"
            options: ["1.8%", "18%", "3.5%"]
            answer: 0
            why: "18/1,000 × 100 = 1.8%."
          - question: "SAR denominator?"
            options: ["68", "86", "69", "1,000"]
            answer: 0
            why: "86 − 18 primary = 68 susceptible contacts."
          - question: "Secondary attack rate?"
            options: ["25%", "19.8%", "94%", "1.7%"]
            answer: 0
            why: "17/68 × 100 = 25%. لو قسمت على 86 (19.8%) نسيت تشيل الـ primary cases."
      - kind: check
        page: 49
        quote: "Seven cases of hepatitis A occurred among 70 children attending a"
        question: "7 of 70 nursery children get hepatitis A, each from a different family. The 7 families hold 32 people; 5 family members fall ill one incubation period later. Secondary attack rate?"
        options: ["20%", "15.6%", "10%", "7.1%"]
        answer: 0
        why:
          - "صح: at risk = 32 − 7 = 25، و5/25 = 20%."
          - "5/32: نسيت تشيل الأطفال الـ primary."
          - "ده الـ attack rate في الحضانة (7/70)."
          - "5/70: مقام غلط خالص."
      - kind: aside
        tone: trap
        page: 47
        quote: "One incubation period later, 17 persons in the same households as these \"primary\" cases developed shigellosis."
        text: |
          في الامتحان هتلاقي رقمين: ==عدد البيت كله== و==عدد الـ primary cases==. اطرح دايمًا، وبعدين اسأل نفسك: هل فيه immune مذكورين؟ اطرحهم كمان.
      - kind: explain
        page: 50
        quote: "The no. of recoveries from a certain disease in a certain period of time in a certain area"
        title: "Recovery rate"
        text: |
          - **Recovery rate = recoveries from a disease ÷ ill persons in the same period and area × 100**

          يعني نسبة اللي ==خفّوا== من العيانين.

          افتكر البانيو: ده حجم بلاعة الـ **recovery**.
      - kind: try
        items: [res.L02.038, res.L02.039, res.L02.042]
    recap:
      - "SAR = حالات بين الـ contacts خلال الـ incubation period ÷ susceptible contacts × 100."
      - "اطرح الـ primary cases والـ immune من المقام، والـ primary من البسط."
      - "Recovery rate = recoveries ÷ ill persons × 100."
    practice: [res.L02.038, res.L02.039, res.L02.040, res.L02.041, res.L02.042, res.L02.060]
