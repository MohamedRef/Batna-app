    hook: "تسكين الـ insulinoma المنتشر 5: «كيماوي، سدّ، كحول، تلج، ونار» = chemotherapy، chemoembolisation، alcohol injection، cryotherapy، radiofrequency ablation."
    src: { page: 5, quote: "Surgery for Malignant Insulinoma\n  Curative.\n  Whipple's or subtotal pancreatectomy - splenectomy, excision of liver metastases.\n  Palliation for metastatic disease.\n  ChemoRx.\n  Chemoembolization.\n  Alcohol injections, cryotherapy, radiofrequency ablation." }
