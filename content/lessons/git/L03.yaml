      - kind: explain
        page: 121
        quote: "Patient with recurrent abdominal pain or discomfort and altered bowel habit\nRome criteria:\n  No: Appropriate symptom-guided evaluation\n  Yes: Warning signs?\nWarning signs:\n  Rectal bleeding\n  Anemia\n  Weight loss\n  Fever\n  Family history of colon cancer\n  Onset of first symptom after 50 yr of age\n  Major change in symptoms\nNo warning signs: Serologic testing for celiac sprue\n  Negative: No further evaluation: IBS diagnosis confirmed\n  Positive: Full evaluation for celiac sprue; Negative: IBS diagnosis confirmed\nWarning signs present: Further evaluation needed\n  Complete cell count\n  Blood chemical studies\n  Measurement of thyrotropin levels\n  Stool testing for occult blood and ova and parasites\n  Colonoscopy and other symptom-guided diagnostic testing; Negative: IBS diagnosis confirmed"
        title: "إمتى ما تقولش IBS على طول"
        text: |
          حتى لو الـ Rome criteria موجودة، الـ **warning signs** دي محتاجة evaluation الأول:

          - ==Rectal bleeding==، anemia، weight loss، fever.
          - **Family history of colon cancer**.
          - ==Onset after 50 years==، أو تغيّر كبير في الأعراض.

          ومن الجدول: anemia، platelets أو erythrocyte sedimentation rate (ESR) عالي، albumin واطي، perianal disease، bloody stools و tenesmus، fecal white blood cell (WBC) أو occult blood كلها مع **inflammatory bowel disease (IBD)** مش IBS.

          الـ tests: Complete blood count (CBC)، **celiac serology**، **thyroid-stimulating hormone (TSH)**، وكولونوسكوبي حسب السن والـ red flags. والـ differential diagnosis (DDx): Crohn's، ulcerative colitis (UC)، coeliac، colon cancer، و giardiasis.
