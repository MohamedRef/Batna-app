    topic: adpkd-tx
    front: Which antibiotics are agents of choice for cyst infection in ADPKD, and why?
    back: Trimethoprim-sulfamethoxazole and fluoroquinolones. They are lipophilic and reach good intracystic concentrations in both gradient and non-gradient cysts.
