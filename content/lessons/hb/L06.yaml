      - kind: reveal
        page: 105
        prompt: "ليه نزول الوزن بيشتغل على كل مراحل الـ MASLD؟"
        answer: |
          ارجع لمسار الدرس التاني: الـ **drivers** هم **obesity، insulin resistance و free fatty acids**.

          نزول الوزن بيقلل الدهون، فيقل الـ **FFA flux** للكبد ويتحسّن الـ **IR**، فتقل الـ steatosis، والـ inflammation تهدى، والـ stellate cells تهدى. يعني بتقفل الحنفية من أولها بدل ما تمسح الأرض. (ربط physiology من الدروس، والكتاب بيسميه **main option** في الـ conclusions.)
      - kind: explain
        page: 106
        title: "Antioxidants"
        text: |
          ليه antioxidants أصلًا؟ الخلية المليانة دهون بتطلّع oxidative stress، وده جزء من اللي بيحوّل steatosis لـ NASH. (ربط physiology مقبول.) الكتاب بيعدّ:

          - **Vitamin E و vitamin C**: والـ vitamin E بالذات ==only recommended in adults with NASH who do not have diabetes or cirrhosis==.
          - **Resveratrol**: natural phenol موجود في قشر العنب الأحمر.
          - **Green tea extract**: قلّل زيادة الوزن، والدهون الكلية والـ visceral، والـ IR، والـ steatosis، والـ cholesterol.
          - **Coffee**: بيقلل خطر T2DM، ومرتبط بـ less fibrosis in NASH.
          - **Garlic**: فيه S-allylmercaptocysteine (SAMC)، وليه دور في DM و NASH.
          - **Ginger**: مذكور في القايمة من غير تفاصيل.
      - kind: aside
        tone: trap
        page: 106
        quote: "vitamin E is only recommended in adults with NASH who do not have diabetes or cirrhosis"
        text: |
          الـ **vitamin E** هو الوحيد في القايمة اللي الكتاب قال عليه **recommended**، وبشروط تلاتة:

          **adult** + **NASH** + **مفيش diabetes ولا cirrhosis**.

          لو المريض في السؤال عنده سكر أو cirrhosis، الـ vitamin E غلط.
