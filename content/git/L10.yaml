    stem: A 45-year-old has retrosternal burning despite twice-daily PPI. EGD is normal and pH-impedance shows normal acid exposure, but his symptoms line up with physiological reflux episodes. Diagnosis?
    options: [Reflux hypersensitivity, Functional heartburn, Non-erosive reflux disease with abnormal acid exposure, Eosinophilic esophagitis, Achalasia]
