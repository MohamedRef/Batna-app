        why: "السونار للكل، الـ CT لما المريض ميتحسنش، الـ MRI لما الصبغة ممنوعة، الـ MRCP للحصوة الصغيرة والـ duct، والـ EUS لدور المخبر في الـ idiopathic."
      - kind: explain
        page: 283
        title: "مش كل وجع epigastric بنكرياس"
        text: |
          **Differential diagnosis** في الكتاب، مقسومة على حسب العضو:
          - قلب وأوعية: myocardial infarction، dissecting aortic aneurysm، mesenteric ischemia.
          - أمعاء: volvulus، intussusception.
          - معدة: perforated PUD.
          - مرارة: biliary colic، acute cholecystitis.

          لاحظ إن أول مجموعة هي اللي لو فاتتك بتموّت، وكمان بتعلّي الـ amylase أحيانًا (زي الـ ischemia). علشان كده ECG ونظرة على الأورطي قبل ما تقفل على "pancreatitis".
      - kind: explain
        page: 284
        title: "أول ساعة، ومين في خطر"
        text: |
          **Initial assessment** بالترتيب:
          - **Hemodynamic evaluation**: فورًا، وابدأ resuscitation.
          - **Risk assessment**: قسّم المرضى higher-risk و lower-risk.
          - **Organ failure**: أي حد عنده يدخل **ICU** لو ينفع.

          ليه الاستعجال؟ لأن الـ **severe AP** حوالي 25% من المرضى، والوفيات فيه حوالي 15%، وتوصل 35% لو حصلت **infection**.

          **Risk factors for severe course** (4 مجموعات):
          - **Patient**: age أكبر من 55، obesity (BMI أكبر من 30)، altered mental status، comorbid disease.
          - **SIRS**: أكتر من 2 من المعايير في الكتاب.
          - **Lab**: BUN أكبر من 20 أو بيعلى، HCT أكبر من 44 أو بيعلى، creatinine عالي.
          - **Radiology** (ص 285): pleural effusions، pulmonary infiltrates، multiple or extensive extra-pancreatic collections.

          الخيط اللي بيربطهم: كلهم علامات إن الالتهاب خرج بره البنكرياس وبدأ يأثر على الجسم كله (الرئة، الكلى، الدورة الدموية).
      - kind: reveal
        page: 284
        prompt: "ليه الـ **Hct العالي** والـ **BUN العالي** علامات وحشة في الـ AP؟"
        answer: |
          المنطق (physiology مقبولة):

          البنكرياس الملتهب بيسرّب سوائل كتير للـ retroperitoneum (**third spacing**). الدم بيتركّز، فالـ **Hct يعلى** (hemoconcentration)، والكلية بتاخد دم أقل، فالـ **BUN يعلى** (prerenal).

          والدم المركّز البطيء بيوصل للبنكرياس أقل، وده بيزوّد خطر الـ **necrosis**. علشان كده الكتاب بيقول إن **هدف الـ hydration هو إن الـ BUN ينزل** (الدرس الخامس).
      - kind: update
        page: 284
        ref: "SIRS consensus definition (ACCP/SCCM 1992)"
        text: |
          الكتاب كاتب **PaCO2 > 32 mm Hg** و > 2 معايير. التعريف القياسي للـ SIRS: **PaCO2 < 32 mmHg**، و ≥ 2 معايير بيكفوا.

          في الامتحان اكتب كلام الكتاب، بس افهم إن الـ hyperventilation بيـنزّل الـ PaCO2.
      - kind: sort
        page: 285
        prompt: "صنّف الـ risk factors للـ severe course زي ما الكتاب مقسّمها:"
        bins: ["Patient", "SIRS", "Lab", "Radiology"]
        cards:
          - { text: "Age > 55", bin: 0 }
          - { text: "BMI > 30", bin: 0 }
          - { text: "Pulse > 90", bin: 1 }
          - { text: "Temperature < 36 °C", bin: 1 }
          - { text: "Rising BUN", bin: 2 }
          - { text: "HCT > 44", bin: 2 }
          - { text: "Pleural effusion", bin: 3 }
          - { text: "Pulmonary infiltrates", bin: 3 }
        why: "الـ patient: السن والوزن والوعي والأمراض. الـ SIRS: نبض، تنفس، حرارة، WBC. الـ lab: BUN و HCT و creatinine. الـ radiology: الصدر والـ collections."
      - kind: try
        items: [hb.L15.044, hb.L15.045, hb.L15.046, hb.L15.057, hb.L15.059]
    recap:
      - "السونار لكل مريض on admission. الـ CT مش روتين: التشخيص واضح، حساسيته واطية بدري، والصبغة ممكن تأذي."
      - "Contrast CT لو: التشخيص مش أكيد، مفيش تحسن في 48–72 h، أو > 40 من غير سبب."
      - "CTSI = grade (0–4) + necrosis (0/2/4/6). لو ≥ 3 اعمل CT تاني بعد 7–10 أيام."
      - "MRI لو الصبغة ممنوعة، MRCP للحصوة لحد 3 mm، EUS للـ recurrent idiopathic."
      - "Severe AP ~25%: age > 55، BMI > 30، SIRS، BUN/HCT عاليين أو بيعلوا، pleural effusion."
