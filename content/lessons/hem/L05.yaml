  - id: hem.L05.lesson3
    title: "Vitamin K، الكبد، والـ DIC"
    hook: "تلات طرق تخسر بيها الـ factors: ما تتعملش، الكبد ما يعملهاش، أو تتحرق كلها في جلطات صغيرة."
    minutes: 10
    pages: [76, 80]
    topics: [vitamin-k, dic, other-acquired]
    goals:
      - "تحفظ الـ vitamin K-dependent factors وأسباب النقص"
      - "تفرّق liver disease عن vitamin K deficiency"
      - "تجاوب سؤال الكتاب: causes and diagnosis of DIC"
    status: unverified
    steps:
      - kind: explain
        page: 76
        title: "الـ prothrombin complex"
        quote: "The prothrombin complex or group which consist of factors II, VII, IX, X which are produced in the liver."
        text: |
          الـ ==prothrombin complex== = **II و VII و IX و X**، بيتعملوا في الـ **liver**.

          الـ vitamin K (fat soluble) لازم للـ **carboxylase** اللي بيضيف **-COOH** للبروتينات دي في آخر خطوة، ومن غيرها مش بتشتغل كويس.
      - kind: mnemonic
        page: 76
        quote: "The prothrombin complex or group which consist of factors II, VII, IX, X which are produced in the liver."
        word: "1972"
        parts:
          - { key: "1", text: "X (ten): the 1 of 10" }
          - { key: "9", text: "IX" }
          - { key: "7", text: "VII" }
          - { key: "2", text: "II" }
        hook: "سنة **1972**: عشرة، تسعة، سبعة، اتنين. ده سهل تفتكره في الامتحان."
      - kind: explain
        page: 77
        title: "أسباب النقص"
        quote: "Secondary to oral anticoagulants 3- Prolonged treatment with broad spectrum antibiotics in association with low dietary intake in severly ill patients."
        text: |
          1. **Impaired absorption**: ==biliary obstruction==، pancreatic disease، steatorrhea (vitamin K fat soluble، محتاج bile).
          2. **Oral anticoagulants** (warfarin).
          3. **Broad-spectrum antibiotics** لفترة طويلة مع أكل قليل في العيان التعبان.
          4. **Hemorrhagic disease of the newborn**.

          مصدرها: **green vegetables** و **bacterial synthesis in the gut**.
      - kind: reveal
        page: 77
        quote: "N.B vit K is obtained form green vegetables and bacterial synthesis in the gut"
        prompt: "ليه عيان الـ ICU اللي بياخد meropenem أسبوعين ومش بياكل بيطوّل الـ PT؟"
        answer: |
          مصدرين بس للـ vitamin K: **الأكل** (green vegetables) و **بكتيريا الأمعاء**.

          العيان ده مش بياكل، والـ antibiotic قتل البكتيريا. المصدرين اتقفلوا مع بعض، والـ II و VII و IX و X ما بقوش بيتعملوا صح.
      - kind: explain
        page: 77
        title: "الصورة والعلاج"
        quote: "Bruises, echymoses and mucous membrane bleeding. Lab findings PT increased APTT increased"
        text: |
          - **Clinically**: bruises، ecchymoses، mucous membrane bleeding.
          - **Labs**: ==PT increased== و **APTT increased**.
          - **العلاج**: **vitamin K** (10–20 mg في الكبار) و **FFP**.
      - kind: explain
        page: 77
        title: "Liver disease: أكتر من vitamin K"
        quote: "Impaired synthesis of factors V and fibrinogen. 3. Thrombocytopenia-due to folate depletion, alcoholism and/or hypersplenism. 4. Fibrinolysis."
        text: |
          1. نقص تصنيع **II و VII و IX و X**
          2. نقص ==factor V== و **fibrinogen** (مش vitamin K-dependent)
          3. **Thrombocytopenia**: folate depletion، alcohol، hypersplenism
          4. **Fibrinolysis**

          التشخيص زي الـ vitamin K deficiency **مع clotting defects زيادة**. النزيف غالبًا mild، بس ممكن severe من الـ **varices**. العلاج: السبب، و vitamin K (لوحده **ممكن ما ينفعش**)، و FFP.
      - kind: check
        page: 78
        quote: "Vitamin K (which alone may be relatively ineffective) fresh frozen plasma."
        question: "Cirrhotic man, long PT that does not correct with vitamin K, low factor V. Why?"
        options: ["Failed hepatic synthesis", "Hemophilia B", "Vitamin K overdose", "Heparin"]
        answer: 0
        why:
          - "صح: الكبد مش قادر يعمل الـ factors أصلًا، فالـ vitamin K لوحده مش كفاية، والـ V الواطي بيأكد."
          - "الـ hemophilia B وراثية وبتطوّل الـ APTT بس."
          - "الجرعة الزيادة مش هتصلّح تصنيع فاشل."
          - "الـ heparin بيطوّل الـ TT، ومالوش دعوة بالـ V."
      - kind: explain
        page: 78
        title: "DIC: أسبابه"
        quote: "Bacterial toxin e.g. gram negative septicemia, miningoccacal septicaemia. 3. Other infection e.g. falciparm maleria. 4. Hypovolaemic shock."
        text: |
          - **Bacterial toxins**: ==gram-negative septicemia==، meningococcal septicemia
          - **Other infections**: falciparum malaria
          - **Hypovolemic shock**
          - **Obstetric**: amniotic fluid embolism، abruptio placentae، intrauterine death
          - **Tissue factor release**: trauma، burns، malignancy
      - kind: figure
        page: 79
        quote: "Widespread activation of coagulation"
        title: "الـ DIC: بيجلّط وبينزف في نفس الوقت"
        alt: "A loop. Widespread activation of coagulation and generalized platelet aggregation make microthrombi. Microthrombi consume clotting factors and platelets, which leads to bleeding. Microthrombi also trigger fibrinolysis, raising FDPs, which worsens bleeding. Red cells passing the microthrombi fragment into schistocytes."
        caption: "الـ microthrombi بتاكل الـ ==factors والـ platelets==، فالعيان ينزف، والـ fibrinolysis بتطلّع FDPs، والـ RBCs بتتقطّع (schistocytes)."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L05c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="45" y="10" width="240" height="44" rx="10" class="fg-acc"/>
            <text x="165" y="30" text-anchor="middle" class="t-sm t-b">Widespread coagulation</text>
            <text x="165" y="46" text-anchor="middle" class="t-sm">+ platelet aggregation</text>
            <path d="M165 54 V80" class="fg-arrow" marker-end="url(#L05c)"/>
            <rect x="85" y="82" width="160" height="32" rx="10" class="fg-ink"/>
            <text x="165" y="103" text-anchor="middle" class="t-b">Microthrombi</text>
            <path d="M120 114 L70 150" class="fg-arrow" marker-end="url(#L05c)"/>
            <path d="M165 114 V150" class="fg-arrow" marker-end="url(#L05c)"/>
            <path d="M210 114 L260 150" class="fg-arrow" marker-end="url(#L05c)"/>
            <rect x="5" y="152" width="110" height="50" rx="10" class="fg-box"/>
            <text x="60" y="173" text-anchor="middle" class="t-sm">Factors and</text>
            <text x="60" y="190" text-anchor="middle" class="t-sm">platelets used up</text>
            <rect x="120" y="152" width="90" height="50" rx="10" class="fg-box"/>
            <text x="165" y="173" text-anchor="middle" class="t-sm">Fibrinolysis</text>
            <text x="165" y="190" text-anchor="middle" class="t-sm">FDPs, D-dimer</text>
            <rect x="215" y="152" width="110" height="50" rx="10" class="fg-box"/>
            <text x="270" y="173" text-anchor="middle" class="t-sm">RBCs cut:</text>
            <text x="270" y="190" text-anchor="middle" class="t-sm">schistocytes</text>
            <path d="M60 202 L130 250" class="fg-arrow-bad" marker-end="url(#L05c)"/>
            <path d="M165 202 V248" class="fg-arrow-bad" marker-end="url(#L05c)"/>
            <path d="M270 202 V248" class="fg-arrow" marker-end="url(#L05c)"/>
            <rect x="95" y="250" width="140" height="32" rx="10" class="fg-bad"/>
            <text x="165" y="271" text-anchor="middle" class="t-b t-bad">Bleeding</text>
            <rect x="225" y="250" width="100" height="32" rx="10" class="fg-bad"/>
            <text x="275" y="271" text-anchor="middle" class="t-sm t-b">MAHA</text>
            <text x="165" y="315" text-anchor="middle" class="t-sm t-mut">Low platelets, long PT/APTT/TT, low fibrinogen</text>
          </svg>
      - kind: sort
        page: 79
        quote: "Fibrinogen level-decreased, fibrin degredation products (FDP) and D-dimers presents."
        prompt: "في الـ DIC، ده بيعلى ولا بيقل؟"
        bins: ["Up or prolonged", "Down"]
        cards:
          - { text: "PT", bin: 0 }
          - { text: "APTT", bin: 0 }
          - { text: "Thrombin time", bin: 0 }
          - { text: "D-dimer, FDPs", bin: 0 }
          - { text: "Platelets", bin: 1 }
          - { text: "Fibrinogen", bin: 1 }
        why: "اللي بيتاكل في الجلطات (platelets و fibrinogen) بيقل، والتحاليل اللي بتقيس وقت التجلّط بتطول، ونواتج التكسير (FDPs و D-dimer) بتعلى."
      - kind: explain
        page: 80
        title: "علاج الـ DIC وباقي الأسباب"
        quote: "Treatment of the underlying disease e.g. antibiotics in septicemia. 2. General supportive measure e.g. treatment of hypoxia and shock."
        text: |
          1. ==Treat the underlying disease== (antibiotics في الـ septicemia)
          2. **Support**: hypoxia و shock
          3. النزيف: **fresh blood**، **FFP** و **cryoprecipitate**، **platelet concentrates**
          4. **Heparin**: لسه **controversial**

          **Circulating inhibitors**: antibodies ضد FVIII، و non-specific inhibitors في **SLE** و **RA**.
          **Miscellaneous**: heparin و thrombolytics، **L-asparaginase**، **massive transfusion**.
      - kind: try
        items: [hem.L05.041, hem.L05.043, hem.L05.048, hem.L05.056, hem.L05.088]
    recap:
      - "Vitamin K factors **1972**: X، IX، VII، II. الأسباب: absorption (biliary، pancreas)، warfarin، antibiotics + أكل قليل، newborn."
      - "Vitamin K deficiency: PT و APTT طوال. العلاج vitamin K و FFP."
      - "Liver disease = نفس الكلام + V و fibrinogen واطيين + platelets واطية + fibrinolysis."
      - "DIC: sepsis، malaria، shock، obstetric، tissue factor. Platelets ↓، fibrinogen ↓، PT/APTT/TT ↑، FDPs/D-dimer، schistocytes."
      - "علاج DIC: السبب أولًا، support، replacement، والـ heparin controversial."
