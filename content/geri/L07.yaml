  # ---------- p108: indications ----------
  - id: geri.L07.011
    kind: enumerate
    topic: indications
    prompt: Enumerate the indications for CGA.
    points:
      - Frailty or a frailty syndrome (falls, confusion, reduced mobility, increasing incontinence), even if the cause looks reversible
      - Elderly at risk of frailty
      - After hospital discharge, especially if admitted for a frailty syndrome or a long stay for a trivial reason
      - All elderly in care homes
      - Elderly patients in the perioperative period
      - Any elderly person referred for CGA
    pass: 5
    hook: "مين ياخد CGA؟ «6»: الـfrail أو عنده frailty syndrome (وقعات، لخبطة، حركة قليلة، incontinence بتزيد) حتى لو السبب شكله reversible، اللي على وش frailty، الخارج من المستشفى، كل اللي في دور الرعاية، اللي في الـperioperative period، وأي حد اتحوّل للـCGA."
    src: { page: 108, quote: "1) Elderly with frailty or one of the frailty syndromes as falls, confusion, reduced mobility and increasing incontinence, even if these appear to be due to a reversible cause (such as a new medication or minor infection)." }
    status: unverified
    tags: [high-yield]
  - id: geri.L07.012
    kind: card
    topic: indications
    front: An older person has new falls that seem due to a new medication. Is CGA still indicated?
    back: Yes. Frailty syndromes are an indication even if they appear to be due to a reversible cause, such as a new medication or a minor infection.
    src: { page: 108, quote: "1) Elderly with frailty or one of the frailty syndromes as falls, confusion, reduced mobility and increasing incontinence, even if these appear to be due to a reversible cause (such as a new medication or minor infection)." }
    status: unverified
  - id: geri.L07.013
    kind: enumerate
    topic: indications
    prompt: Name the frailty syndromes the lecture lists as indications for CGA.
    points: [Falls, Confusion, Reduced mobility, Increasing incontinence]
    pass: 4
    hook: "الـ frailty syndromes «يقع، يتلخبط، يقعد، ويسرّب»: falls، confusion، reduced mobility، وincontinence بتزيد."
    src: { page: 108, quote: "1) Elderly with frailty or one of the frailty syndromes as falls, confusion, reduced mobility and increasing incontinence, even if these appear to be due to a reversible cause (such as a new medication or minor infection)." }
    status: unverified
  - id: geri.L07.014
    kind: card
    topic: indications
    front: Which patients discharged from hospital especially need a CGA?
    back: Those admitted for one of the frailty syndromes, or those with a long hospital stay for an otherwise trivial reason.
    src: { page: 108, quote: "3) After discharge from a hospital especially if the cause of admission was one of the frailty syndromes or there was a long hospital stay for an otherwise trivial reason." }
    status: unverified
  - id: geri.L07.015
    kind: mcq
    topic: indications
    stem: What is a key indication for initiating a CGA?
    options:
      - "Elderly patients with a single acute illness and no other problems"
      - "Older people with frailty or a frailty syndrome (e.g., falls, confusion)"
      - "Patients under 50 years of age with chronic pain"
      - "Stable, fully independent older adults on no medicines"
      - "Individuals with normal cognitive function and good mobility"
    answer: 1
    why:
      - A single acute illness alone is not on the list.
      - "Correct: frailty, a frailty syndrome, or being at risk of frailty are indications (p108)."
      - CGA is for older people, not patients under 50.
      - Fit, independent older adults are not on the indication list.
      - Normal cognition is not an indication; confusion is.
    src: { page: 108, quote: "2) Elderly at risk of frailty." }
    status: unverified
    tags: [book-question]
  - id: geri.L07.016
    kind: mcq
    topic: indications
    stem: Which of these older people does NOT have an indication for CGA listed in the lecture?
    options:
      - A fit 68-year-old marathon runner seen for a routine eye test
      - A 79-year-old living in a care home
      - An 83-year-old due for hip replacement next week
      - An 88-year-old discharged after 3 weeks in hospital for a mild chest infection
      - An 81-year-old with new urinary incontinence after starting a diuretic
    answer: 0
    why:
      - "Correct: he is not frail, not at risk, not in care, not perioperative and not referred (p108)."
      - All elderly in care homes need a CGA.
      - The perioperative period is an indication.
      - A long stay for a trivial reason is an indication after discharge.
      - Increasing incontinence is a frailty syndrome, even with a reversible cause like a new drug.
    src: { page: 108, quote: "Indication for CGA\n  1) Elderly with frailty or one of the frailty syndromes as falls, confusion, reduced mobility and increasing incontinence, even if these appear to be due to a reversible cause (such as a new medication or minor infection).\n  2) Elderly at risk of frailty.\n  3) After discharge from a hospital especially if the cause of admission was one of the frailty syndromes or there was a long hospital stay for an otherwise trivial reason.\n  4) All elderly at care homes.\n  5) Elderly patients at the perioperative period.\n  6) Any Elderly referred for CGA" }
    status: unverified
