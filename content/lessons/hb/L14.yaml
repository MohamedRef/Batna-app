            <path d="M120 300q50-30 110-6q24 18 0 40q-60 26-110 6q-24-18 0-40z" class="fg-box"/>
            <text x="175" y="322" text-anchor="middle" class="t-sm t-b">Liver</text>
            <text x="14" y="278" class="t-sm">Venous</text>
            <text x="14" y="292" class="t-sm">pressure ↑</text>
            <text x="14" y="376" class="t-sm t-b">Congestive hepatopathy</text>
            <text x="14" y="394" class="t-sm">Cholestatic: GGT, ALP, bilirubin ↑</text>
            <text x="14" y="410" class="t-sm">Transaminases normal or moderate</text>
            <text x="14" y="436" class="t-sm t-mut">Hepatojugular reflux · pulsatile liver</text>
            <text x="14" y="452" class="t-sm t-mut">Often asymptomatic</text>
          </svg>
      - kind: explain
        page: 255
        title: "الـ congestive hepatopathy"
        text: |
          في الـ cardiac hepatopathy فيه mechanism-ين أساسيين:

          - ==Forward failure==: الدم الشرياني الداخل للكبد بيقل (reduced arterial perfusion). النتيجة **hypoxic hepatopathy**، والضرر بيزيد لو فيه hypoxia معاه. ده اللي بيغلب في الـ acute HF.
          - ==Backward failure==: الـ systemic venous pressure العالي بيرجّع الدم على الكبد (passive congestion). النتيجة **congestive hepatopathy**. ده اللي بيغلب في الـ chronic HF.

          **شكل الـ congestive hepatopathy**:

          - غالبًا asymptomatic.
          - أحيانًا jaundice، و ascites، و hepatomegaly مع **hepatojugular reflux**، و **pulsatile liver**.

          **Labs**: cholestatic أساسًا (GGT و ALP و bilirubin مرتفعين). والـ transaminases طبيعية أو مرتفعة شوية، إلا لو فيه forward component شديد معاها.

          ليه cholestatic؟ الكتاب ما بيقولش. التفسير الفسيولوجي المعروف: الاحتقان بيبدأ حوالين الـ central veins (zone 3) وبيأثّر على خروج الصفرا قبل ما يموّت خلايا كتير.
      - kind: check
        page: 255
        question: "A man with long-standing heart failure has tender hepatomegaly, hepatojugular reflux and raised GGT, ALP and bilirubin; transaminases are near normal. What is the likely mechanism?"
        options:
          - "Passive congestion (backward failure)"
          - "Acute arterial hypoperfusion (forward failure)"
          - "Cirrhotic cardiomyopathy"
          - "Drug-induced autoimmune hepatitis"
        answer: 0
        why:
          - "صح: chronic HF + pattern **cholestatic** + hepatojugular reflux = **congestive hepatopathy**."
          - "الـ forward failure بيعمل **transaminase spike** في الـ **acute** HF."
          - "دي عكس الاتجاه: الكبد هو اللي بيأذي القلب."
          - "مفيش drug ولا pattern hepatocellular هنا."
      - kind: explain
        page: 256
        title: "الـ cirrhotic cardiomyopathy"
        text: |
          الـ cirrhosis بتأثر على القلب حتى من غير أي مرض قلب تاني: systolic dysfunction، و diastolic dysfunction، و electrophysiological abnormalities.

          التعريف: clinical syndrome في مريض الـ cirrhosis، القلب فيه بيستجيب للـ stress استجابة ضعيفة (blunted). الـ stress ممكن يكون physiologic أو pathologic أو pharmacologic. بس وهو مرتاح (at rest)، الـ cardiac output والـ contractility طبيعيين أو زيادة.

          ليه مهمة؟

          - لحد 50% من المرضى اللي بيعملوا transplant عندهم cardiac dysfunction.
          - 7–21% من الوفيات بعد الـ OLT سببها overt heart failure.

          **الـ criteria**:

          - ==Systolic dysfunction==: blunted زيادة في الـ cardiac output مع exercise أو volume أو drugs، و/أو resting **LVEF** أقل من 55%.
          - ==Diastolic dysfunction==.
          - **Supportive criteria**: electrophysiological abnormalities، و abnormal chronotropic response، و electromechanical dyssynchrony، و **prolonged QT**، و enlarged LA، و increased myocardial mass، و **BNP** و **troponins** مرتفعين.
      - kind: aside
        tone: analogy
        page: 256
        text: |
          الـ cirrhotic cardiomyopathy زي عربية قديمة شغّالة كويس في الركنة (**normal at rest**)، بس أول ما تدوس بنزين على الطريق الصحراوي (**stress**: exercise، نزيف، transplant) ما بتسحبش. علشان كده بتتكشف بعد الـ TIPS أو الـ transplant.
      - kind: check
        page: 256
        question: "Which finding is part of the systolic criterion for cirrhotic cardiomyopathy?"
        options:
          - "Resting LVEF < 55%"
          - "Prolonged QT interval"
          - "Raised BNP"
          - "Low cardiac output at rest"
        answer: 0
        why:
          - "صح: الـ systolic criterion = blunted response للـ stress و/أو resting LVEF < 55%."
          - "الـ prolonged QT من الـ **supportive** criteria."
          - "الـ BNP برضه **supportive**."
          - "بالعكس: الـ cardiac output at rest **normal أو زيادة**."
      - kind: try
        items: [hb.L14.003, hb.L14.004, hb.L14.007, hb.L14.010]
    recap:
      - "لو مفيش سبب واضح للـ LFTs والمريض عنده systemic disease، عالج الـ systemic disease الأول. الـ 6 مجموعات: **CHIC GI**."
      - "Acute HF → forward failure → hypoxic hepatopathy (transaminases)."
      - "Chronic HF → backward failure → congestive hepatopathy (cholestatic pattern، hepatojugular reflux، pulsatile liver)."
      - "Cirrhotic cardiomyopathy: normal at rest بس blunted مع الـ stress. Systolic (LVEF < 55%) + diastolic + supportive."
    practice: [hb.L14.001, hb.L14.002, hb.L14.003, hb.L14.004, hb.L14.005, hb.L14.006, hb.L14.007, hb.L14.008, hb.L14.009, hb.L14.010, hb.L14.011, hb.L14.012, hb.L14.095, hb.L14.097, hb.L14.118]

