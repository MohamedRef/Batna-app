      - kind: explain
        page: 94
        title: "FNHTR: الأشهر"
        quote: "Defined by > 1°C increase in temperature. It is a diagnosis of exclusion (AHTR, TRALI and sepsis)."
        text: |
          ==Most common== transfusion reaction.
          - التعريف: الحرارة تعلى **أكتر من 1°C**، وهو **diagnosis of exclusion** (استبعد **acute haemolytic transfusion reaction (AHTR)** و **transfusion-related acute lung injury (TRALI)** و **sepsis**).
          - الصورة: fever، chills، rigors، tachycardia، tachypnea، nausea، headache.
          - السبب: **cytokines** اتجمعت في الكيس وقت التخزين.
          - العلاج: **بطّأ** النقل و **paracetamol**.
          - الوقاية: **leukodepletion**، شيل الـ plasma، و antipyretic premedication.

          ليه diagnosis of exclusion؟ لأن نفس الحرارة ممكن تكون أول علامة لحاجة بتموّت (AHTR أو TRALI أو كيس ملوّث). فالـ FNHTR الأشهر، بس ما تقولهوش غير لما تستبعد الخطير.
      - kind: check
        page: 94
        quote: "Management: slow the rate of transfusion, and antipyretic (paracetamol)."
        question: "Halfway through a platelet transfusion, temperature rises 1.2°C with chills. BP normal, no back pain, no rash, no dyspnoea. Management?"
        options: ["Slow the transfusion and give paracetamol", "Give adrenaline", "Give antihistamine only", "Start broad-spectrum antibiotics and stop all products for a week"]
        answer: 0
        why:
          - "صح: صورة FNHTR بعد ما استبعدت الخطير: بطّأ وادّي paracetamol."
          - "الـ adrenaline للـ anaphylaxis، ومفيهاش حرارة."
          - "الـ antihistamine للـ urticaria."
          - "مفيش علامات sepsis (shock، hypotension)؛ ده over-treatment."
      - kind: reveal
        page: 94
        quote: "Mechanism: Cytokines in blood component bag accumulated during storage passively transferred from the donor to the recipient in the blood component."
        prompt: "ليه الـ leukoreduction بيمنع الـ FNHTR؟"
        answer: |
          الـ **cytokines** اللي بتعمل الحرارة بتفرزها ==WBCs المتبرع== وهي قاعدة في الكيس في التخزين.

          لو شلنا الـ WBCs بالـ filter بدري (قبل التخزين)، مفيش مصنع cytokines، فمفيش حرارة.
      - kind: explain
        page: 95
        title: "Allergic مقابل anaphylactic"
        quote: "Mechanism: presence of anti-IgA in an IgA deficient patient. These Abs react with IgA in the transfused plasma."
        text: |
          **Mild allergic/urticarial**: شائع، erythema و pruritus و urticaria جنب الـ IV site. **Immunoglobulin E (IgE)** ضد plasma proteins المتبرع ← histamine. العلاج **antihistamines**. مش بيتطوّر لـ anaphylaxis ومش لازم يتكرر.

          **Anaphylactic**: لا متوقع ولا ممكن منعه. flushing، vomiting، diarrhea، **hypertension ثم hypotension**، edema، wheeze، stridor، laryngeal edema، shock. ==Fever is not a feature==.
          السبب: **anti-IgA** في عيان **Immunoglobulin A (IgA) deficient**. العلاج: **stop**، **adrenaline**، steroids، circulatory support.

          ليه عيان الـ IgA deficiency بالذات؟ التفسير المقبول (مش في الكتاب): جسمه عمره ما عمل IgA، فبيشوف الـ IgA اللي في plasma المتبرع **بروتين غريب** ويعمل ضده antibodies. وعشان كده الـ **washed PRBCs** (من غير plasma) من indications الدرس اللي فات.
      - kind: aside
        tone: exam
        page: 95
        quote: "Presentation: flushing, chills, vomiting, diarrhea, initial hypertension followed by hypotension, generalized edema, dyspnea, wheezing, coughing, stridor, laryngeal edema respiratory distress and shock. Fever is not a feature."
        text: |
          عيان وقع shock وهو بياخد دم ومفيش حرارة؟ فكّر ==anaphylaxis== (anti-IgA). عيان وقع shock **ومعاه** حرارة وألم ضهر؟ فكّر **AHTR**. الحرارة هي اللي بتفرق.
      - kind: explain
        remind: [hem.L06.067]
        page: 95
        title: "AHTR: الكيس الغلط"
        quote: "Mechanism: destruction of transfused RBCs by pre-formed, naturally occurring isohemagglutinins of the IgM class in the recipient's plasma (anti-A &/or anti-B)"
        text: |
          ==AHTR = ABO incompatibility = mismatched transfusion==.
          - الـ **Immunoglobulin M (IgM) anti-A/anti-B** الجاهزين في العيان بيكسّروا الكرات المتنقلة.
          - الصورة: fever، chills، **flank/back pain**، dyspnea، chest pain، anxiety، flushing، throbbing head، nausea، وفي الشديد **hypotension** و **renal failure** و shock و death.

          ليه بالشدة دي؟ لأن الـ antibodies **IgM جاهزة** (naturally occurring، من أول الدرس الأول) فبتهجم في **ثواني**، والتفسير المقبول (مش في الكتاب): الـ IgM بيشغّل الـ complement فالكرات تتفرتك **جوه الأوعية** (intravascular)، والـ free Hb يوصل للكلية ويأذيها، ومعاه الـ hypotension.
      - kind: order
        page: 96
        quote: "Management:\n  - Stop transfusion.\n  - Support of BP and renal blood flow with fluids and pressors and induction of diuresis to maintain urine output > 100 ml/hour.\n  - Check the identity of the patient and units transfused.\n  - Obtain blood samples (repeat type, cross match, DAT (should be +ve), HCT decrease, LDH increase, bilirubin increase (within 6-10 Hs) as indicators of hemolysis."
        prompt: "رتّب أول خطوات الـ AHTR:"
        steps:
          - "Stop the transfusion"
          - "Fluids and pressors; diuresis to keep urine >100 ml/h"
          - "Check the patient's identity and the units"
          - "Send repeat type, cross-match, DAT, Hct, LDH, bilirubin"
        why: "الأول وقّف المصدر، وبعدين احمي الكلية والضغط، وبعدين اعرف حصل إزاي (غالبًا خطأ هوية)، وآخر حاجة التحاليل. الـ diuresis فوق 100 ml/h عشان الكلية تفضل شغالة وتغسل الـ free Hb."
      - kind: explain
        page: 96
        title: "التشخيص"
        quote: "At least two laboratory findings must be present, such as:\n  1. Decreased fibrinogen\n  2. Decreased haptoglobin\n  3. Elevated bilirubin\n  4. Elevated (LDH)\n  5. Hemoglobinemia\n  6. Hemoglobinuria\n  7. Plasma discoloration from free hemoglobin, or\n  8. Spherocytes on the peripheral blood smear.\nDiagnosis is confirmed by a positive direct antiglobulin test for anti-IgG and/or anti-C3 and positive elution test with alloantibody present on the transfused red blood cells (RBCs)."
        text: |
          لازم **اتنين على الأقل** من علامات الـ hemolysis: fibrinogen ↓، haptoglobin ↓، bilirubin ↑، lactate dehydrogenase (LDH) ↑، hemoglobinemia، hemoglobinuria، plasma discoloration، spherocytes.

          التأكيد: ==positive direct antiglobulin test (DAT)== (anti-IgG و/أو anti-C3) و **positive elution** بالـ alloantibody على الكرات المتنقلة.
          لو الـ serology **negative** ولقيت سبب physical (thermal، osmotic، mechanical، chemical) ← **non-immune** hemolysis.

          ليه الـ haptoglobin بيقل والـ LDH بيعلى؟ التفسير المقبول (مش في الكتاب): الـ haptoglobin بيمسك الـ free Hb ويتشال معاه فبيخلص، والـ LDH بيطلع من جوه الكرات اللي اتفرتكت. واتنين على الأقل عشان علامة واحدة لوحدها ممكن تيجي من حاجة تانية.
      - kind: figure
        page: 94
        quote: "1. Febrile Non-hemolytic Transfusion Reaction\n  Most common blood transfusion reaction\n  Defined by > 1°C increase in temperature. It is a diagnosis of exclusion (AHTR, TRALI and sepsis)."
        title: "الـ timeline"
        alt: "A timeline from minutes to weeks. During transfusion: FNHTR, allergic, anaphylaxis, AHTR, sepsis, TACO, hypocalcemia. After 5 to 10 days: post-transfusion purpura. After 1 to 3 weeks: DHTR. After more than 20 units: hemosiderosis. Infections appear later."
        caption: "اللي بيحصل ==وانت لسه معلّق الكيس== acute، وبعد أيام لأسابيع delayed: **Post-transfusion purpura (PTP)** بعد 5–10 أيام و **delayed haemolytic transfusion reaction (DHTR)** بعد 1–3 أسابيع."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L06a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
