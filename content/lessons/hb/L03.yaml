            <text x="184" y="363" class="t-sm t-mut">(secondary prophylaxis)</text>
            <path d="M176 351H96" class="fg-arrow-acc" marker-end="url(#L03e)"/>
            <rect x="8" y="376" width="150" height="44" rx="8" class="fg-dot-bad"/>
            <text x="18" y="396" class="t-b">Rebleeding</text>
            <text x="18" y="412" class="t-sm t-b">63% at 2 years</text>
