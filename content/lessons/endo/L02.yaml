        alt: "A horizontal timeline of three trimesters. First trimester: medical therapy by severity, then surgery in the second. Second trimester: surgery is the treatment of choice. Late third trimester: medical therapy and surgery after delivery. Below: metyrapone is the drug of choice; watch for adrenal insufficiency."
