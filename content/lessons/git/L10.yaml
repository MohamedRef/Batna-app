  - id: git.L10.lesson4
    title: "الـ corkscrew والحلقات: DES و EoE"
    hook: "مريء بيلف زي البريمة، ومريء عامل نفسه trachea. الاتنين سؤال essay في آخر المحاضرة."
    minutes: 8
    pages: [280, 283]
    topics: [des, eoe]
    goals:
      - "تعرّف الـ DES وتعرف معايير الـ manometry بتاعته"
      - "تفرّق بين DES و spastic nutcracker"
      - "تشخّص الـ EoE وتعرف علاجه، وده سؤال essay"
    status: unverified
    steps:
      - kind: explain
        page: 280
        quote: "A generalized neurogenic disorder of the esophageal motility in which phasic non propulsive contraction replace normal peristalsis"
        title: "Diffuse esophageal spasm"
        text: |
          الـ ==DES== = **generalized neurogenic** motility disorder، فيه **phasic non-propulsive contractions** بتاخد مكان الـ peristalsis الطبيعي، وساعات الـ LES كمان بيبوظ.

          المريض بييجي بـ **intermittent dysphagia** و **chest pain**، وبتزيد مع الـ **emotional stress**.
      - kind: figure
        page: 280
        quote: "Barium study: DES has been characterized by tertiary contractions"
        title: "Corkscrew ضد rings"
        alt: "Two side-by-side vertical sketches. Left, DES: an esophagus whose wall is pinched by many irregular indentations into a spiral corkscrew shape. Right, EoE: a narrow esophagus with many evenly spaced horizontal concentric rings like a trachea."
        caption: "شمال: الـ corkscrew في الـ DES، انقباضات tertiary عشوائية. يمين: الـ EoE، مريء رفيع بحلقات concentric زي الـ trachea (trachealization)."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <text x="80" y="18" text-anchor="middle" class="t-b">DES</text>
            <path d="M60 30c30 15-25 25 5 40s-30 25 0 40s-30 25 0 40s-30 25 0 40s-30 25 0 40" class="fg-ink" stroke-width="3"/>
            <path d="M100 30c-30 15 25 25-5 40s30 25 0 40s30 25 0 40s30 25 0 40s30 25 0 40" class="fg-ink" stroke-width="3"/>
            <text x="80" y="290" text-anchor="middle" class="t-sm t-mut">corkscrew</text>
            <text x="245" y="18" text-anchor="middle" class="t-b">EoE</text>
            <rect x="228" y="30" width="34" height="240" rx="10" class="fg-acc"/>
            <path d="M228 55h34M228 80h34M228 105h34M228 130h34M228 155h34M228 180h34M228 205h34M228 230h34" class="fg-ink"/>
            <text x="245" y="290" text-anchor="middle" class="t-sm t-mut">concentric rings</text>
          </svg>
      - kind: explain
        page: 280
        quote: "spontaneous and repetitive contractions (> 2 peaks), or high amplitude contractions (> 180 mmHg) and prolonged contractions (> 6 sec)."
        title: "الـ manometry في الـ DES"
        text: |
          افتكر الطبيعي: 30-180 mmHg، 2-6 ثواني، single peak. الـ DES بيعدّي كل ده:
          - **Uncoordinated (spastic)** activity في الـ distal esophagus.
          - **Repetitive** contractions: ==more than 2 peaks==.
          - **High amplitude**: ==more than 180 mmHg==.
          - **Prolonged**: ==more than 6 seconds==.
      - kind: reveal
        page: 281
        quote: "Diffuse esophageal spasm is similar but primarily defined by a rapid propagation at the onset of the contraction."
        prompt: "الـ spastic nutcracker والـ DES الاتنين انقباضات عنيفة متكررة. إيه اللي بيفرّق بينهم على الـ pressure topography؟"
        answer: |
          - **Spastic nutcracker**: انقباضات vigorous و repetitive بس **normal peristaltic onset**.
          - **DES**: نفس الشكل تقريبًا، بس اللي بيعرّفه ==rapid propagation at the onset==.

          يعني الـ nutcracker لسه ماشي بالدور، والـ DES بيضرب المريء كله تقريبًا في نفس اللحظة.
      - kind: explain
        page: 282
        quote: "Anticholinergic, nitrates, calcium channel blockers, hydralazine, botulinum toxin, anxiolytics and Pneumatic dilatation may be helpful."
        title: "علاج الـ DES"
        text: |
          - **Medical**: anticholinergics، nitrates، calcium channel blockers، hydralazine، anxiolytics.
          - **Endoscopic**: botulinum toxin، pneumatic dilatation.
          - **Surgery** (long myotomy أو حتى esophagectomy): ==only== لو فيه **severe weight loss** أو **severe pain**.
      - kind: check
        page: 282
        quote: "Surgical therapy (long myotomy or even esophagectomy) should be considered only with severe weight loss or severe pain."
        question: "When does the lecture say surgery should be considered in DES?"
        options:
          - "Only with severe weight loss or severe pain"
          - "As first-line therapy in all patients"
          - "Whenever barium shows a corkscrew"
          - "After one failed nitrate trial"
        answer: 0
        why:
          - "صح: long myotomy أو esophagectomy بس مع severe weight loss أو pain."
          - "الأول medical و endoscopic."
          - "الـ corkscrew تشخيص مش indication للجراحة."
          - "فيه خيارات كتير قبل الجراحة."
      - kind: explain
        page: 282
        quote: "A history of allergies or atopic conditions (asthma, eczema, hay fever) is present in over half of patients."
        title: "Eosinophilic esophagitis"
        text: |
          الـ ==EoE== = food أو environmental **antigens** بتعمل inflammatory response في المريء. أكتر من **نص** المرضى عندهم allergy أو atopy (asthma، eczema، hay fever).

          - **Adults**: dysphagia للأكل الناشف من زمان، أو **food impaction**. ممكن heartburn أو chest pain.
          - **Children**: abdominal pain، vomiting، failure to thrive.
          - **Labs**: قليلين بس عندهم eosinophilia أو IgE عالي.
          - **Barium**: small-caliber esophagus، strictures، أو **multiple concentric rings**.
      - kind: mnemonic
        page: 283
        quote: "Endoscopic appearances include edema, concentric rings"
        word: "FERES"
        parts:
          - { key: "F", text: "Furrows (vertical lines)" }
          - { key: "E", text: "Exudates (white plaques)" }
          - { key: "R", text: "Rings (trachealization)" }
          - { key: "E", text: "Edema" }
          - { key: "S", text: "Strictures" }
        hook: |
          **FERES** زي "فِرِس"، الحصان 🐎 اللي اللقمة دايمًا بتقف في زوره. ومع ذلك، المريء ممكن يبان **normal** في لحد 5%.
      - kind: explain
        page: 283
        quote: "Multiple biopsies (4–8) from the proximal and distal esophagus should be obtained to demonstrate multiple (greater than 15/high-powered field)"
        title: "التشخيص بالـ biopsy"
        text: |
          خد ==4-8 biopsies== من الـ **proximal والـ distal** esophagus، والمطلوب ==more than 15 eosinophils/HPF==.

          ليه من الحتتين؟ لأن الـ GERD بيعمل eosinophils في الـ distal بس، والـ EoE بيمسك المريء كله.
      - kind: aside
        tone: exam
        page: 282
        quote: "Treatment options include proton pump inhibitors, topical corticosteroids, food elimination diets, and esophageal dilation."
        text: |
          سؤال الكتاب: **Outline management of eosinophilic esophagitis**. اكتبه كده:
          - **PPIs**
          - **Topical corticosteroids**
          - **Food elimination diets**
          - **Esophageal dilation**
          - الجديد: **biologic** anti-IL، اسمه **dupilumab**
      - kind: update
        page: 282
        quote: "Newer treatment options include biological treatment (Anti-IL named dupilumab)"
        text: |
          الـ **dupilumab** بيقفل الـ IL-4 receptor alpha (يعني IL-4 و IL-13)، واتوافق عليه للـ EoE في الكبار 2022 والأطفال من سنة 2024. في الامتحان اكتب كلام الكتاب: anti-IL dupilumab.
        ref: "FDA dupilumab EoE approval 2022, paediatric extension 2024"
      - kind: case
        page: 283
        quote: "Multiple biopsies (4–8) from the proximal and distal esophagus should be obtained to demonstrate multiple (greater than 15/high-powered field)"
        stem: "A 23-year-old with asthma presents with a piece of meat stuck for 3 hours. After removal, he admits years of slow eating."
        steps:
          - question: "Most likely diagnosis?"
            options: ["Eosinophilic esophagitis", "Achalasia", "DES", "Peptic stricture"]
            answer: 0
            why: "شاب atopic، dysphagia للأكل الناشف من زمان، و food impaction = EoE."
          - reveal: "Endoscopy shows rings, furrows and white plaques."
            question: "How do you confirm it?"
            options: ["4-8 proximal and distal biopsies, >15 eos/HPF", "Serum IgE", "HRM", "Barium swallow"]
            answer: 0
            why: "الـ biopsy من فوق وتحت هي اللي بتأكد. الـ IgE عالي في قليلين بس."
      - kind: try
        items: [git.L10.066, git.L10.071, git.L10.075, git.L10.076, git.L10.080]
    recap:
      - "DES = neurogenic، non-propulsive contractions، dysphagia و chest pain متقطعين، بيزيدوا مع الـ stress."
      - "Barium: corkscrew. Manometry: أكتر من 2 peaks، أكتر من 180 mmHg، أكتر من 6 ثواني. Rapid propagation at onset يفرّقه عن الـ spastic nutcracker."
      - "علاج DES: medical و botox و dilatation. الجراحة بس مع severe weight loss أو pain."
      - "EoE: atopic، food impaction. FERES. 4-8 biopsies فوق وتحت، أكتر من 15 eos/HPF. علاج: PPI، topical steroids، diet، dilation، dupilumab."
    practice: [git.L10.063, git.L10.064, git.L10.065, git.L10.066, git.L10.067, git.L10.068, git.L10.069, git.L10.070, git.L10.071, git.L10.072, git.L10.073, git.L10.074, git.L10.075, git.L10.076, git.L10.077, git.L10.078, git.L10.079, git.L10.080, git.L10.143]
