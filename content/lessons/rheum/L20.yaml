        text: |
          **X-ray:** pencil-in-cup، **periostitis**، **ankylosis**، **tuft osteolysis**، asymmetric syndesmophytes و sacroiliac (SI) changes. وحتى مع الـ disease-modifying antirheumatic drugs (DMARDs)، ==47%== بيحصلهم damage في أول سنتين.

          **Ultrasound (US):** أحسن من الكشف في الـ **subclinical synovitis** والـ **enthesitis**، وبيتابع الاستجابة.

          **MRI:** للـ spine و الـ sacroiliac joints (SIJs)، خصوصًا الـ **HLA-B27** active axial psoriatic arthritis (PsA).

          يعني كل أداة ليها سؤال: الـ X-ray بيوريك الضرر اللي حصل، والـ US بيلقط الالتهاب بدري قبل ما الضرر يحصل، والـ MRI للـ axial اللي الـ X-ray متأخر فيه (التفسير المقبول للتقسيم، مش في الكتاب).
      - kind: reveal
        page: 335
        quote: "Despite treatment with DMARDs, PsA results in radiographic damage in about 47% of patients during the first two years of the disease."
        prompt: "الرقم 47% في أول سنتين بيقولك إيه عن الـ PsA؟"
        answer: |
          إن الـ PsA ==مش مرض خفيف== زي ما كانوا فاكرين زمان: تقريبًا **نص** العيانين بيحصلهم damage في الأشعة في **أول سنتين**، **حتى مع** الـ DMARDs.

          وعلشان كده الكتاب في العلاج بيقول «should be started **early**» وبيستعمل **treat-to-target**. وده سبب إن الـ **erosions** بالذات بتنقلك على طول لـ TNF inhibitor (درس الاستراتيجية): العضم اللي اتاكل مش بيرجع.
      - kind: check
        page: 335
        quote: "Is more sensitive than clinical examination in detecting subclinical synovitis and enthesitis in early psa."
        question: "Which imaging tool does the lecture say is more sensitive than clinical examination for subclinical synovitis and enthesitis in early PsA?"
        options: ["Musculoskeletal ultrasound", "Plain X-ray", "Bone scan", "CT of the hands"]
        answer: 0
        why:
          - "صح: الـ US بيلقط الـ subclinical، وبيتابع الاستجابة كمان."
          - "الـ X-ray بيبيّن الضرر بعد ما يحصل (pencil-in-cup، periostitis)."
          - "مش في كلام الكتاب عن الـ PsA."
