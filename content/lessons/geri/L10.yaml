schema: batna.lesson/v1
lecture: geri.L10
lessons:
  # ------------------------------------------------------------------
  - id: geri.L10.lesson1
    title: "الرئة لما تصلّح نفسها غلط"
    hook: "الرئة بتتعوّر كل يوم وبتلم نفسها. الـ DPLD هي اللحظة اللي الترميم فيها بيبوظ والجرح يبقى ندبة."
    minutes: 7
    pages: [169, 170]
    topics: [intro, epidemiology]
    goals:
      - "تفهم إزاي الـ repair الغلط بيعمل restrictive lung وليه الأكسجين بيقل"
      - "تعرف أرقام الـ diffuse parenchymal lung disease (DPLD) والـ idiopathic pulmonary fibrosis (IPF) في السن الكبير"
      - "تعرف ليه الـ DPLD بتزيد في الكبار"
    status: unverified
    steps:
      - kind: explain
        page: 169
        quote: "The normal host response to such insults is to eradicate the etiologic agent, to repair the injury caused by the agent and repair the injury caused by the associated inflammatory process."
        title: "الرد الطبيعي"
        text: |
          الرئة بتجيب الهوا لحد جنب الدم عشان الـ gas exchange، فبتبقى معرّضة لكل حاجة في الهوا: عدوى، تراب، دخان.

          الرد الطبيعي تلات خطوات:

          - ==eradicate== السبب.
          - تصلّح الأذى اللي عمله السبب.
          - تصلّح الأذى اللي عمله الالتهاب نفسه.

          والنتيجة: resolution ورئة طبيعية تاني.
      - kind: reveal
        page: 169
        quote: "However, this also exposes the lung to a variety of potentially injurious infectious and noninfectious environmental agents."
        prompt: "ليه الرئة بالذات من أكتر الأعضاء اللي بتتأذي من البيئة؟"
        answer: |
          الكتاب بيقولها: الرئة بتجيب **الهوا اللي بنتنفسه** لحد جنب الـ **systemic circulation** عشان الـ gas exchange.

          يعني نفس الميزة هي نفس العيب: أي حاجة في الهوا، **infectious** (فيروس، بكتيريا) أو **noninfectious** (تراب، دخان، أدوية بتوصل بالدم)، بتلاقي سطح رقيق جدًا قدامها. فالرئة بتتعوّر كتير، ولازم يكون عندها نظام ترميم شاطر.
      - kind: aside
        tone: analogy
        page: 169
        quote: "This complex but tightly regulated host response leads to eventual resolution of injury and restoration of normal lung architecture and function."
        text: "الـ repair الطبيعي زي مقاول شاطر: بيشيل الردم، يبني الحيطة، ويمشي العمال لما الشغل يخلص. الكتاب بيسميه **tightly regulated**. الـ DPLD هي المقاول اللي نسي يقفل الموقع، فالعمال فضلوا يصبّوا أسمنت."
      - kind: explain
        page: 170
        quote: "However, if the inflammatory and/or repair response is dysregulated, a chronic alveolar/interstitial remodeling process with varying degrees of inflammation and fibrosis ensues."
        title: "لما الرد يبوظ"
        text: |
          لو الالتهاب أو الـ repair بقى ==dysregulated==، بيحصل **chronic alveolar/interstitial remodeling** فيه درجات مختلفة من inflammation و fibrosis.

          ده اللي بيدّي الـ **restrictive physiology** ومشاكل الـ gas exchange اللي بتميّز الـ diffuse parenchymal lung diseases (DPLDs). هي مجموعة كبيرة ومختلفة، بس متجمّعة مع بعض لأن الصورة الإكلينيكية والأشعة والوظايف شبه بعض.
      - kind: figure
        page: 170
        quote: "This results in the restrictive physiology and gas-exchange abnormalities characteristic of the diffuse parenchymal lung diseases (DPLDs)."
        title: "طريقين بعد الإصابة"
        alt: "A flow from lung injury to host response, which splits in two. The regulated branch ends in resolution and normal lung. The dysregulated branch goes to chronic remodelling with inflammation and fibrosis, then to restrictive physiology and gas-exchange failure: DPLD."
        caption: "نفس الإصابة، نهايتين: ترميم مظبوط ← رئة طبيعية؛ ترميم بايظ ← fibrosis و restriction."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="GL10a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="85" y="8" width="160" height="34" rx="8" class="fg-ink"/>
            <text x="102" y="30" class="t-b">Injurious agent</text>
            <path d="M165 42v22" class="fg-arrow" marker-end="url(#GL10a)"/>
            <rect x="85" y="68" width="160" height="34" rx="8" class="fg-box"/>
            <text x="110" y="90">Host response</text>
            <path d="M130 102L75 132" class="fg-arrow" marker-end="url(#GL10a)"/>
            <path d="M200 102L255 132" class="fg-arrow" marker-end="url(#GL10a)"/>
            <rect x="8" y="136" width="145" height="70" rx="8" class="fg-good"/>
            <text x="18" y="158" class="t-sm t-b t-good">Regulated</text>
            <text x="18" y="178" class="t-sm">eradicate + repair</text>
            <text x="18" y="196" class="t-sm">resolution</text>
            <rect x="177" y="136" width="145" height="70" rx="8" class="fg-bad"/>
            <text x="187" y="158" class="t-sm t-b t-bad">Dysregulated</text>
            <text x="187" y="178" class="t-sm">chronic remodelling</text>
            <text x="187" y="196" class="t-sm">inflammation + fibrosis</text>
            <path d="M80 206v34" class="fg-arrow" marker-end="url(#GL10a)"/>
            <path d="M250 206v34" class="fg-arrow" marker-end="url(#GL10a)"/>
            <text x="30" y="262" class="t-b t-good">Normal lung</text>
            <text x="200" y="262" class="t-b t-bad">DPLD</text>
            <text x="324" y="284" text-anchor="end" class="t-sm t-mut">restriction, poor gas exchange</text>
          </svg>
      - kind: explain
        page: 170
        quote: "This results in the restrictive physiology and gas-exchange abnormalities characteristic of the diffuse parenchymal lung diseases (DPLDs)."
        title: "ليه restrictive؟ وليه الأكسجين بيقل؟"
        text: |
          الكتاب بيقول النتيجة: **restrictive physiology** و**gas-exchange abnormalities**. التفسير المقبول (مش في الكتاب) للاتنين:

          - **Restrictive**: الـ fibrosis بيخلي الرئة ==ناشفة== (stiff). الرئة الناشفة مش بتتملي هوا كويس، فالـ volumes كلها بتصغر. زي بلونة جلدها تخين: تنفخ بالعافية وتاخد هوا قليل.
          - **Gas exchange**: الندبة بتتحط في الـ interstitium، الحيطة اللي بين الـ alveolus والـ capillary. الحيطة لما تتخن، الأكسجين بياخد وقت أطول عشان يعدّي، فبيقل في الدم، خصوصًا مع المجهود.

          عشان كده هتلاقي في الـ PFT بعدين **TLC قليل** (الرئة صغرت) و**DLCO قليل** (الحيطة تخنت).
      - kind: check
        page: 170
        quote: "DPLDs comprise a large and heterogeneous group of diseases that are grouped into a single category based on common features in their clinical, radiographic, and physiological presentations."
        question: "Why are the many different DPLDs grouped into one category?"
        options:
          - "They share clinical, radiographic and physiological features"
          - "They all have one known cause"
          - "They all have the same histology"
          - "They all respond to steroids"
        answer: 0
        why:
          - "صح: مختلفين في الأصل، بس شبه بعض في الإكلينيك والأشعة والوظايف، فاتجمعوا في category واحدة."
          - "بالعكس، فيهم known cause وفيهم idiopathic."
          - "الكتاب بيقول heterogeneous: الـ histology مختلفة (UIP، ARDS-like، granulomas)."
          - "مش كلهم: الـ IPF مثلًا الـ steroids مش بتفيده."
      - kind: explain
        page: 170
        quote: "The median age of onset of IPF ranges from 50 to 70 years and the diagnosis is almost never made in a patient aged 40 years or younger."
        title: "مرض الكبار"
        text: |
          - الـ diffuse parenchymal lung disease (DPLD): **20 to 40 per 100000** في أمريكا، وفوق الـ 75 سنة ممكن تعدّي **175 per 100000**.
          - أشهرها في الكبار: ==idiopathic pulmonary fibrosis (IPF)==، fibrosis مزمن سببه مش معروف.
          - الـ median age of onset من **50 لـ 70**، وتقريبًا عمره ما يتشخّص في حد عنده **40 أو أقل**.

          وليه بيزيد؟ أدوية سامة للرئة بتتاخد أكتر في الكبار (للسرطان والقلب)، والناس نفسها بتكبر.
      - kind: check
        page: 170
        quote: "The median age of onset of IPF ranges from 50 to 70 years and the diagnosis is almost never made in a patient aged 40 years or younger."
        question: "A 38-year-old has diffuse lung fibrosis. Per the book, how likely is IPF?"
        options: ["Almost never diagnosed at 40 or younger", "The most likely diagnosis at any age", "Common: median onset is 30-40", "Only in women under 40"]
        answer: 0
        why:
          - "صح: الكتاب بيقول تقريبًا عمره ما يتشخّص في سن 40 أو أقل، فدور على سبب تاني."
          - "الـ IPF أشهر واحد في الكبار مش في الشباب."
          - "الـ median من 50 لـ 70."
          - "الكتاب مقالش حاجة عن الجنس هنا."
      - kind: reveal
        page: 170
        quote: "The increased use of pneumotoxic drugs to treat malignant and cardiovascular diseases in the elderly as well the rising median age of the U.S. population contribute to an increased incidence."
        prompt: "دكتور القلب كتب amiodarone لراجل عنده 78 سنة. إزاي ده بيشرح إن الـ DPLD بتزيد في الكبار؟"
        answer: |
          الكتاب بيدّي سببين للزيادة:

          - **Pneumotoxic drugs** بتتاخد أكتر في الكبار، لأن هما اللي عندهم **malignant** و**cardiovascular diseases** (amiodarone للقلب، bleomycin للسرطان).
          - و**الـ median age** للناس نفسه بيعلى، فعدد الكبار المعرّضين بيزيد.

          يعني أي مسن عنده fibrosis جديد: أول سؤال **«بتاخد أدوية إيه؟»**.
      - kind: aside
        tone: exam
        page: 170
        quote: "In patients older than the age of 75 years, the prevalence may exceed 175 per 100000."
        text: "أرقام بتتسأل: الـ DPLD **20 لـ 40 في الـ 100000** عمومًا، وفوق **75 سنة** ممكن تعدّي **175**. يعني فوق الـ 75 الرقم بيتضاعف أربع خمس مرات، وده اللي بيخلي الـ DPLD موضوع جوّه كتاب الـ geriatrics."
      - kind: try
        items: [geri.L10.001, geri.L10.002, geri.L10.004, geri.L10.005, geri.L10.006]
    recap:
      - "الرئة قريبة من الهوا عشان الـ gas exchange، فبتتعوّر كتير؛ الرد الطبيعي: eradicate + repair + repair للالتهاب."
      - "DPLD: الـ repair بيبوظ، فيحصل remodeling و fibrosis، والنتيجة restriction (رئة ناشفة) و gas-exchange failure (حيطة تخينة)."
      - "IPF أشهر DPLD في الكبار؛ onset من 50 لـ 70، تقريبًا مش بيحصل تحت 40."
      - "DPLD 20–40 في الـ 100000، فوق 75 سنة ممكن > 175؛ بتزيد بسبب الأدوية السامة للرئة وكبر السن."
    practice: [geri.L10.001, geri.L10.002, geri.L10.003, geri.L10.004, geri.L10.005, geri.L10.006, geri.L10.007]
