  - id: rheum.L02.lesson2
    title: "الـ uric acid مش لوحده: القلب والسكر والكلية المزروعة"
    hook: "الـ urate العالي بيسبق الضغط والسكر. ولو المريض كلية مزروعة، فيه فخ دوائي ممكن يموّته."
    minutes: 8
    pages: [27, 31]
    topics: [associations]
    goals:
      - "تعرف علاقة الـ hyperuricaemia بالضغط والسكر"
      - "تمشي مراحل الـ gout من normouricaemia لـ tophi"
      - "تحفظ الـ urate transporters وتتجنب فخ azathioprine + XOI"
    status: unverified
    steps:
      - kind: explain
        page: 27
        quote: "Precedes and predicts hypertension. Precedes and predicts Type 2 diabetes."
        title: "بيسبق وبيتنبأ"
        text: |
          الـ ==hyperuricaemia==:

          - بتسبق وتتنبأ بالـ **hypertension** و **type 2 diabetes**.
          - موجودة في **26%** من مرضى الضغط، و **58%** من اللي بياخدوا أدوية ضغط.
          - بتحصل في **تلت** اللي بياخدوا diuretic.
          - بتشارك في الـ **cardio-renal disease**.
      - kind: order
        page: 27
        quote: "Disease progression in gout"
        prompt: "رتّب مراحل الـ gout زي رسمة الكتاب:"
        steps:
          - "Normouricaemia"
          - "Hyperuricaemia"
          - "MSU crystal deposition"
          - "Recurrent gout flares"
          - "Chronic tophaceous gout"
        why: "كل خطوة ليها محرّك: genes و diet و الكلى ← hyperuricaemia؛ solubility و nucleation ← deposition؛ acute inflammation ← flares؛ chronic granulomatous inflammation ← tophi."
      - kind: figure
        page: 28
        quote: "GLUTA in the basolateral membrane and URAT1 in the apical membrane of proximal tubule cells mediate renal urate reabsorption."
        title: "مين بيرجّع ومين بيطلّع"
        alt: "A proximal tubule cell. Left side is blood (basolateral), right side is urine (apical). URAT1 on the apical side and GLUT9 on the basolateral side carry urate back to blood (reabsorption). NPT1 and ABCG2 on the apical side push urate into urine (excretion). A note: ABCG2 also exports urate in the gut."
        caption: "URAT1 و GLUT9 بيرجّعوا الـ urate للدم. NPT1 و ABCG2 بيطلّعوه. لو ABCG2 بايظ ← urate يعلى ← gout."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R02b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
              <marker id="R02c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <text x="10" y="20" class="t-sm t-mut">Blood</text>
            <text x="270" y="20" class="t-sm t-mut">Urine</text>
            <rect x="70" y="30" width="190" height="200" rx="14" class="fg-box"/>
            <text x="100" y="52" class="t-sm t-b">Proximal tubule cell</text>
            <circle cx="260" cy="90" r="23" class="fg-bad"/>
            <text x="260" y="94" text-anchor="middle" class="t-sm">URAT1</text>
            <circle cx="70" cy="90" r="23" class="fg-bad"/>
            <text x="70" y="94" text-anchor="middle" class="t-sm">GLUT9</text>
            <path d="M234 90H97" class="fg-arrow-bad" marker-end="url(#R02b)"/>
            <path d="M45 90H8" class="fg-arrow-bad" marker-end="url(#R02b)"/>
            <text x="110" y="82" class="t-sm t-bad">reabsorption</text>
            <circle cx="260" cy="150" r="23" class="fg-good"/>
            <text x="260" y="154" text-anchor="middle" class="t-sm">NPT1</text>
            <circle cx="260" cy="200" r="23" class="fg-good"/>
            <text x="260" y="204" text-anchor="middle" class="t-sm">ABCG2</text>
            <path d="M140 150H233" class="fg-arrow" marker-end="url(#R02c)"/>
            <path d="M140 200H233" class="fg-arrow" marker-end="url(#R02c)"/>
            <path d="M280 150H320" class="fg-arrow" marker-end="url(#R02c)"/>
            <path d="M280 200H320" class="fg-arrow" marker-end="url(#R02c)"/>
            <text x="90" y="178" class="t-sm t-good">excretion</text>
            <text x="70" y="252" class="t-sm t-mut">ABCG2 also exports urate in the gut</text>
          </svg>
      - kind: check
        page: 28
        quote: "a gain-of-function mutation in the gene encoding NPT1 results in increased renal urate excretion and can decrease the risk of gout."
        question: "A gain-of-function mutation in which transporter LOWERS gout risk?"
        options: ["NPT1", "URAT1", "GLUT9", "ABCG2 (dysfunctional variant)"]
        answer: 0
        why:
          - "صح: NPT1 بيطلّع urate، فلو اشتغل أكتر الـ urate ينزل."
          - "URAT1 بيرجّع urate؛ شغل زيادة يرفعه."
          - "GLUT9 بيرجّع urate من الناحية الـ basolateral."
          - "الـ ABCG2 البايظ بيرفع الـ urate والخطر."
      - kind: explain
        page: 29
        quote: "Risk factors - Age. - Obesity. - High-protein diet. - High alcohol consumption. - Type IV Hyperlipidaemia."
        title: "عوامل الخطر"
        text: |
          Age، obesity، high-protein diet، alcohol، **type IV hyperlipidaemia**، DM/insulin resistance، metabolic syndrome، IHD/smoking، hypertension، family history.

          والعلاقة مع الـ ==insulin resistance==: الـ hyperinsulinaemia بتزوّد **urate reabsorption** في الكلى ← hyperuricaemia ← endothelial dysfunction. وفي الـ diabetic nephropathy الـ uric acid بيشغّل inflammation و RAAS ويقلل NO.
      - kind: explain
        page: 30
        quote: "Coprescription of azathiorine and xanthine oxydase (allopurinol and febuxostat) inhibitors is hazardous."
        title: "الكلية المزروعة"
        text: |
          الـ gout شائع بعد الزرع بسبب **calcineurin inhibitors** (ciclosporin و tacrolimus) اللي بتأذي الكلى.

          ==Azathioprine + allopurinol أو febuxostat = خطر==.

          الحل:
          1. بدّل الـ calcineurin inhibitor بـ **mycophenolate mofetil**.
          2. بدّل الـ azathioprine بـ **MMF**، وساعتها تقدر تدي XO inhibitor.
          3. لو مستحيل: **benzbromarone**، أو **amlodipine** للضغط اللي عامله الـ ciclosporin.
      - kind: aside
        tone: trap
        page: 30
        quote: "Coprescription of azathiorine and xanthine oxydase (allopurinol and febuxostat) inhibitors is hazardous."
        text: "ليه خطر؟ الـ xanthine oxidase هو اللي بيكسّر الـ azathioprine (6-mercaptopurine). اقفله، الدوا يتراكم ويضرب الـ bone marrow. ده تفسير فارماكولوجي مقبول؛ الكتاب بيقول hazardous بس."
      - kind: case
        page: 30
        quote: "Replacement of azathioprine with mycophenolate mofetil, allowing use of XO inhibitors."
        stem: "A renal transplant patient on ciclosporin and azathioprine has recurrent gout and needs urate-lowering therapy."
        steps:
          - question: "What is the book's safe first move?"
            options: ["Swap azathioprine for mycophenolate, then give an XO inhibitor", "Add allopurinol now", "Add febuxostat now"]
            answer: 0
            why: "الـ MMF بيشيل المشكلة ويسمح بالـ XOI. allopurinol أو febuxostat مع azathioprine خطر."
          - question: "If the switch is impossible, which uricosuric does the book name?"
            options: ["Benzbromarone", "Probenecid", "Pegloticase"]
            answer: 0
            why: "الكتاب: If impossible ← benzbromarone، أو amlodipine لو فيه ciclosporin-induced hypertension."
      - kind: try
        items: [rheum.L02.021, rheum.L02.023, rheum.L02.025, rheum.L02.033, rheum.L02.034]
    recap:
      - "Hyperuricaemia بتسبق الضغط والسكر؛ 26% من مرضى الضغط."
      - "Normo ← hyper ← deposition ← flares ← tophi."
      - "URAT1 و GLUT9 بيرجّعوا؛ NPT1 و ABCG2 بيطلّعوا."
      - "Azathioprine + XOI = خطر؛ بدّل لـ MMF."
    practice: [rheum.L02.021, rheum.L02.022, rheum.L02.023, rheum.L02.024, rheum.L02.025, rheum.L02.026, rheum.L02.027, rheum.L02.028, rheum.L02.029, rheum.L02.030, rheum.L02.031, rheum.L02.032, rheum.L02.033, rheum.L02.034, rheum.L02.035, rheum.L02.036]
