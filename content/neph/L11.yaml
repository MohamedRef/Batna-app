    kind: card
    topic: dialysis-htn
    front: Why is preeclampsia hard to diagnose in women on dialysis, and how is it diagnosed?
    back: Anuria makes the protein creatinine ratio useless. Use new or worsening hypertension after 20 weeks plus symptoms (headache, nausea, vomiting, epigastric pain, visual change) and labs (hemolysis, low platelets, liver dysfunction, high uric acid).
