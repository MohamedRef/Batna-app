schema: batna.lesson/v1
lecture: hb.L05
lessons:
  # ------------------------------------------------------------------
  - id: hb.L05.lesson1
    title: "فيروس C: مين هو وبيتنقل إزاي؟"
    hook: "فيروس RNA صغير كان ساكن في كبد مصر كلها، ودلوقتي بيتعالج بحباية. نبدأ نعرفه."
    minutes: 7
    pages: [90, 91]
    topics: [virology, transmission]
    goals:
      - "تعرف الـ family والـ genome والـ genotypes اللي بتتسأل"
      - "تفهم ليه C فيروس دم في الأساس"
      - "تعدّ الـ risk groups الخمسة من غير ما تبص"
    status: unverified
    steps:
      - kind: explain
        page: 90
        title: "الصورة الكبيرة في سطرين"
        text: |
          **HCV** فيروس **RNA** بيصيب الكبد، وغالبًا بيعمل **chronic infection**.

          وهو من أهم أسباب الـ **chronic liver disease** والـ **cirrhosis** والـ **HCC**.

          والخبر الحلو اللي المحاضرة بتبدأ بيه: **Effective cures now exist**. يعني ده من الأمراض القليلة في الكبد اللي بنقول فيها «اتعالج وخلص».
      - kind: explain
        page: 90
        title: "البطاقة الشخصية للفيروس"
        text: |
          - **Family:** Flaviviridae، **Genus:** Hepacivirus.
          - **Genome:** single-stranded positive-sense RNA.
          - **Genotypes:** من **1 لـ 7**. الأشهر في مصر والشرق الأوسط: **1 و 3 و 4**.
          - حوالي **58 million** عايشين بـ chronic HCV (**WHO, 2024**).
      - kind: reveal
        page: 90
        prompt: "يعني إيه **positive-sense** RNA؟ وده هيفرق معانا في العلاج في إيه؟"
        answer: |
          الـ positive-sense RNA بيشتغل كأنه **mRNA جاهز**: الخلية بتقراه على طول وتعمل منه بروتين واحد طويل (polyprotein) لازم يتقص لحتت علشان الفيروس يشتغل.

          والأهم: مفيش مرحلة DNA ولا نسخة بتستخبى في نواة الخلية (عكس HBV). علشان كده لما توقف تكاثره كفاية، بيختفي خالص، وده سر إن C **بيتعالج نهائيًا**. (ده شرح physiology مقبول، مش من نص الكتاب.)
      - kind: check
        page: 90
        question: "HCV belongs to which family, and what is its genome?"
        options:
          - "Flaviviridae; single-stranded positive-sense RNA"
          - "Hepadnaviridae; partially double-stranded DNA"
          - "Picornaviridae; single-stranded positive-sense RNA"
          - "Flaviviridae; double-stranded DNA"
        answer: 0
        why:
          - "صح: Flaviviridae، genus Hepacivirus، والـ genome ssRNA positive-sense."
          - "ده **HBV**، وهو الـ DNA virus الوحيد في الـ hepatitis viruses المشهورة."
          - "دي family بتاعة **HAV**، مش C."
          - "الـ family صح بس الـ genome غلط: C فيروس RNA."
      - kind: aside
        tone: joke
        page: 90
        text: |
          الكتاب بيقول إن مصر كانت **the highest HCV prevalence globally**. زمان كلمة «فيروس» لوحدها في أي عيادة في مصر كانت مفهومة إنها C من غير ما حد يسأل «أنهي فيروس؟» 😅

          والحمد لله إن الـ **national screening/treatment campaigns** قلبت الحكاية دي، وده هنرجعله في آخر درس.
      - kind: explain
        page: 90
        title: "بيتنقل إزاي؟ الدم أولًا"
        text: |
          الـ mode الأساسي: **Blood-borne (primary)**، ومنه:

          - **Needle sharing** (IV drug use)
          - **Blood transfusions**
          - **Unsafe medical procedures**

          وبعدين حاجات أقل بكتير:

          - **Vertical transmission (rare)**
          - **Sexual transmission (less common)**
      - kind: figure
        page: 91
        title: "سلّم طرق العدوى"
        alt: "Three horizontal bars of decreasing length. Blood-borne (primary): needle sharing, transfusion, unsafe procedures, the longest bar. Sexual: less common, a medium bar. Vertical: rare, the shortest bar."
        caption: "الدم هو الطريق الرئيسي. الـ sexual **less common**، والـ vertical **rare**. لو الممتحن قلب الترتيب ده، اعرف إنه بيختبرك."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="18" text-anchor="middle" class="t-b t-lg">HCV transmission</text>
            <rect x="10" y="34" width="310" height="58" rx="8" class="fg-bad"/>
            <text x="22" y="56" class="t-b t-bad">Blood-borne (primary)</text>
            <text x="22" y="78" class="t-sm">needles (IVDU), transfusion, unsafe procedures</text>
            <rect x="10" y="108" width="190" height="50" rx="8" class="fg-acc"/>
            <text x="22" y="130" class="t-b">Sexual</text>
            <text x="22" y="148" class="t-sm t-mut">less common</text>
            <rect x="10" y="174" width="110" height="50" rx="8" class="fg-thin"/>
            <text x="22" y="196" class="t-b">Vertical</text>
            <text x="22" y="214" class="t-sm t-mut">rare</text>
            <text x="320" y="244" text-anchor="end" class="t-sm t-mut">bar length = how important, not exact numbers</text>
          </svg>
      - kind: mnemonic
        page: 91
        word: "DRINK"
        parts:
          - { key: "D", text: "hemoDialysis patients" }
          - { key: "R", text: "Recipients of unscreened blood" }
          - { key: "I", text: "IV drug users" }
          - { key: "N", text: "Needlestick injuries (healthcare workers)" }
          - { key: "K", text: "Kids born to HCV-positive mothers" }
        hook: |
          الـ **risk groups** الخمسة في الكتاب = **DRINK**. وماتقلقش، مالهاش دعوة بالشرب خالص: C فيروس دم، بيعدّي من الإبرة مش من الكوباية.
      - kind: sort
        page: 91
        prompt: "حط كل طريقة في مكانها حسب الكتاب:"
        bins: ["Primary (blood-borne)", "Less common or rare"]
        cards:
          - { text: "Needle sharing (IVDU)", bin: 0 }
          - { text: "Blood transfusions", bin: 0 }
          - { text: "Unsafe medical procedures", bin: 0 }
          - { text: "Sexual transmission", bin: 1 }
          - { text: "Vertical transmission", bin: 1 }
        why: "الكتاب حط الإبر والـ transfusion والـ unsafe procedures تحت **Blood-borne (primary)**، والـ sexual **less common** والـ vertical **rare**."
      - kind: check
        page: 91
        question: "Which of these is NOT one of the HCV risk groups listed in the lecture?"
        options:
          - "Hemodialysis patients"
          - "Healthcare workers with needlestick injuries"
          - "Children born to HCV-positive mothers"
          - "People who eat raw shellfish"
        answer: 3
        why:
          - "موجودة: الـ D في DRINK."
          - "موجودة: الـ N في DRINK."
          - "موجودة: الـ K في DRINK."
          - "صح: دي **fecal-oral** زي HAV. فيروس C بيمشي في الدم."
      - kind: try
        items: [hb.L05.001, hb.L05.003, hb.L05.007, hb.L05.008, hb.L05.009]
    recap:
      - "HCV: **Flaviviridae / Hepacivirus**، ssRNA **positive-sense**، genotypes **1–7** (مصر والشرق الأوسط: 1 و 3 و 4)."
      - "حوالي **58 million** عندهم chronic HCV (WHO 2024). مصر كانت الأعلى في العالم، والحملات القومية قللت العبء."
      - "العدوى **blood-borne** في الأساس. الـ sexual **less common** والـ vertical **rare**."
      - "الـ risk groups: **DRINK** (Dialysis، Recipients of unscreened blood، IVDU، Needlestick، Kids of HCV+ mothers)."
    practice: [hb.L05.001, hb.L05.002, hb.L05.003, hb.L05.004, hb.L05.005, hb.L05.006, hb.L05.007, hb.L05.008, hb.L05.009, hb.L05.054]

  # ------------------------------------------------------------------
  - id: hb.L05.lesson2
    title: "الفيروس الساكت: natural history والتشخيص"
    hook: "من كل 100 واحد اتعدوا، كام هيخف لوحده وكام هيوصل لـ cirrhosis؟ وإزاي تعرف إن العدوى لسه شغالة؟"
    minutes: 9
    pages: [91, 92]
    topics: [natural-history, clinical, diagnosis]
    goals:
      - "تحفظ أرقام الـ clearance والـ chronicity والـ cirrhosis صح"
      - "تعدّ الـ extrahepatic manifestations الأربعة"
      - "تفرّق بين screening test و confirmatory test وتعرف ليه"
    status: unverified
    steps:
      - kind: explain
        page: 91
        title: "الأرقام اللي الممتحن بيحبها"
        text: |
          - **Acute infection:** **15–45%** بيعملوا **spontaneous clearance**.
          - **Chronic infection:** **55–85%** الفيروس بيفضل معاهم **أكتر من 6 شهور**.

          والمضاعفات: **chronic hepatitis**، و **cirrhosis (~15–30% over 20 years)**، و **HCC** (أغلبه **mainly with cirrhosis**).
      - kind: figure
        page: 91
        title: "100 واحد اتعدوا: هيروحوا فين؟"
        alt: "A funnel. 100 people with acute HCV split into 15 to 45 percent spontaneous clearance and 55 to 85 percent chronic infection over 6 months. Chronic infection leads to chronic hepatitis, then cirrhosis in about 15 to 30 percent over 20 years, then HCC, mainly in cirrhosis."
        caption: "الفيروس بيكسب الجولة الأولى مع أغلب الناس (55–85% chronic). وبعد كده الـ cirrhosis بتيجي ببطء على مدى **20 سنة**، والـ HCC غالبًا فوق الـ cirrhosis."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L05a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="L05b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="75" y="10" width="180" height="46" rx="8" class="fg-ink"/>
            <text x="165" y="30" text-anchor="middle" class="t-b">100 with acute HCV</text>
            <text x="165" y="47" text-anchor="middle" class="t-sm t-mut">often asymptomatic</text>
            <path d="M120 56L72 96" class="fg-arrow" marker-end="url(#L05a)"/>
            <path d="M210 56L258 96" class="fg-arrow-bad" marker-end="url(#L05b)"/>
            <rect x="8" y="100" width="140" height="56" rx="8" class="fg-good"/>
            <text x="78" y="122" text-anchor="middle" class="t-b t-good">15–45%</text>
            <text x="78" y="142" text-anchor="middle" class="t-sm">spontaneous clearance</text>
            <rect x="182" y="100" width="140" height="56" rx="8" class="fg-bad"/>
            <text x="252" y="122" text-anchor="middle" class="t-b t-bad">55–85%</text>
            <text x="252" y="142" text-anchor="middle" class="t-sm">chronic (&gt;6 months)</text>
            <path d="M252 156v30" class="fg-arrow-bad" marker-end="url(#L05b)"/>
            <rect x="152" y="190" width="170" height="40" rx="8" class="fg-box"/>
            <text x="237" y="215" text-anchor="middle" class="t-sm t-b">Chronic hepatitis</text>
            <path d="M237 230v30" class="fg-arrow-bad" marker-end="url(#L05b)"/>
            <text x="230" y="250" text-anchor="end" class="t-sm t-mut">~20 years</text>
            <rect x="122" y="264" width="200" height="56" rx="8" class="fg-bad"/>
            <text x="222" y="286" text-anchor="middle" class="t-b t-bad">Cirrhosis ~15–30%</text>
            <text x="222" y="306" text-anchor="middle" class="t-sm">over 20 years</text>
            <path d="M222 320v30" class="fg-arrow-bad" marker-end="url(#L05b)"/>
            <rect x="122" y="354" width="200" height="56" rx="8" class="fg-bad"/>
            <text x="222" y="377" text-anchor="middle" class="t-b t-bad">HCC</text>
            <text x="222" y="397" text-anchor="middle" class="t-sm">mainly with cirrhosis</text>
            <text x="10" y="190" class="t-sm t-good">no chronic</text>
            <text x="10" y="206" class="t-sm t-good">disease</text>
          </svg>
      - kind: aside
        tone: exam
        page: 91
        text: |
          ركّز في الأرقام كأزواج: **15–45** يخفّوا و **55–85** يزمنوا. الاتنين بيكمّلوا بعض لـ 100 (45 + 55 = 100، و 15 + 85 = 100).

          والـ cirrhosis رقمين برضه: **15–30%** في **20 سنة**.
      - kind: check
        page: 91
        question: "A nurse develops acute HCV after a needlestick injury. Which statement is most accurate?"
        options:
          - "Most patients (55–85%) stay infected beyond 6 months"
          - "Almost all patients clear the virus spontaneously"
          - "Cirrhosis develops in most patients within 5 years"
          - "HCC usually arises in a non-cirrhotic liver"
        answer: 0
        why:
          - "صح: الـ chronicity **55–85%**، والـ clearance بس **15–45%**."
          - "بالعكس: الأقلية هي اللي بتخف لوحدها (15–45%)."
          - "الـ cirrhosis في **15–30%** وعلى مدى **20 سنة**، مش أغلبهم في 5."
          - "الكتاب: HCC **mainly with cirrhosis**."
      - kind: explain
        page: 92
        title: "الأعراض: الساكت اللي بيتكلم أحيانًا"
        text: |
          **Acute HCV:** غالبًا **asymptomatic**، أو أعراض nonspecific: **fatigue, anorexia, nausea, jaundice**.

          **Chronic HCV:** غالبًا **silent for years**، وأحيانًا **fatigue, RUQ discomfort, arthralgia**.

          وفيه وش تاني برة الكبد، **extrahepatic**: **cryoglobulinemia, glomerulonephritis, lymphoma, insulin resistance**.
      - kind: mnemonic
        page: 92
        word: "CLING"
        parts:
          - { key: "C", text: "Cryoglobulinemia" }
          - { key: "L", text: "Lymphoma" }
          - { key: "I", text: "Insulin resistance" }
          - { key: "NG", text: "Nephritis: Glomerulonephritis" }
        hook: |
          فيروس C **بيلزق (CLING)** في الجسم كله مش في الكبد بس. الأربعة اللي في الكتاب: Cryoglobulinemia، Lymphoma، Insulin resistance، و GlomeruloNephritis (الـ NG).
      - kind: aside
        tone: analogy
        text: |
          ليه الكلى والجلد والـ lymph nodes؟ الشرح المقبول (مش من نص الكتاب): الفيروس بيحفّز الـ **B cells** باستمرار، فتطلّع **cryoglobulins** (immune complexes) تترسب في الأوعية الصغيرة: في الجلد (purpura)، في المفاصل، وفي الـ **glomeruli** (GN). ونفس التحفيز المزمن للـ B cells ممكن يوصل لـ **B-cell lymphoma**.

          تخيّلها زي ماسورة بتنقّط **غِرا** في كل أوضة في البيت.
      - kind: explain
        page: 92
        title: "التشخيص: اختبارين ولكل واحد شغلانة"
        text: |
          - **Screening test:** **HCV Ab (anti-HCV)**.
          - **Confirmatory test:** **HCV RNA (PCR)** أو **HCV core antigen**.
          - **Genotyping:** for treatment planning، بس **less critical now** بسبب الـ **pangenotypic DAAs**.
          - **Fibrosis assessment:** non-invasive: **FibroScan, APRI, FIB-4**. والـ **liver biopsy rarely used now**.
      - kind: reveal
        page: 92
        prompt: "واحد عنده **anti-HCV positive** بس **HCV RNA negative**. ده معناه إيه؟ وليه مانكتفيش بالـ antibody؟"
        answer: |
          الـ antibody زي **الندبة**: بتقول إن الجسم شاف الفيروس قبل كده، مش إن الفيروس لسه موجود.

          افتكر إن **15–45%** بيعملوا **spontaneous clearance**، وكمان اللي اتعالجوا: الاتنين بيفضل عندهم anti-HCV positive. علشان كده لازم **RNA (أو core antigen)** يثبت إن العدوى **active**. وللسبب ده برضه الـ cure بيتقاس بالـ **RNA** مش بالـ antibody.
      - kind: figure
        page: 92
        title: "خطوات التشخيص"
        alt: "Flow chart. Anti-HCV screening. If negative, no infection. If positive, test HCV RNA by PCR or core antigen. If RNA negative, past or cleared infection. If RNA positive, active infection: assess fibrosis with FibroScan, APRI or FIB-4 and plan DAAs; genotype is less critical with pangenotypic DAAs."
        caption: "الـ antibody بيفرز، والـ RNA بيأكد. بعد التأكيد: قيّم الـ fibrosis (FibroScan، APRI، FIB-4) واختار العلاج."
        svg: |
          <svg viewBox="0 0 330 420" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L05c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="65" y="10" width="200" height="46" rx="8" class="fg-acc"/>
            <text x="165" y="30" text-anchor="middle" class="t-b">Anti-HCV (screening)</text>
            <text x="165" y="47" text-anchor="middle" class="t-sm t-mut">HCV Ab</text>
            <path d="M110 56L70 92" class="fg-arrow" marker-end="url(#L05c)"/>
            <path d="M220 56L250 92" class="fg-arrow" marker-end="url(#L05c)"/>
            <text x="74" y="78" text-anchor="end" class="t-sm t-mut">negative</text>
            <text x="256" y="78" class="t-sm t-mut">positive</text>
            <rect x="8" y="96" width="120" height="40" rx="8" class="fg-good"/>
            <text x="68" y="121" text-anchor="middle" class="t-sm t-b">No infection</text>
            <rect x="160" y="96" width="162" height="56" rx="8" class="fg-ink"/>
            <text x="241" y="118" text-anchor="middle" class="t-b">HCV RNA (PCR)</text>
            <text x="241" y="138" text-anchor="middle" class="t-sm">or HCV core antigen</text>
            <path d="M200 152L150 196" class="fg-arrow" marker-end="url(#L05c)"/>
            <path d="M270 152L282 196" class="fg-arrow" marker-end="url(#L05c)"/>
            <text x="160" y="176" text-anchor="end" class="t-sm t-mut">negative</text>
            <text x="286" y="176" class="t-sm t-mut">positive</text>
            <rect x="8" y="200" width="170" height="56" rx="8" class="fg-thin"/>
            <text x="93" y="222" text-anchor="middle" class="t-sm t-b">Past / cleared infection</text>
            <text x="93" y="242" text-anchor="middle" class="t-sm t-mut">antibody = old scar</text>
            <rect x="190" y="200" width="132" height="56" rx="8" class="fg-bad"/>
            <text x="256" y="222" text-anchor="middle" class="t-b t-bad">Active HCV</text>
            <text x="256" y="242" text-anchor="middle" class="t-sm">confirmed</text>
            <path d="M256 256v30" class="fg-arrow" marker-end="url(#L05c)"/>
            <rect x="60" y="290" width="262" height="56" rx="8" class="fg-box"/>
            <text x="191" y="312" text-anchor="middle" class="t-sm t-b">Fibrosis: FibroScan, APRI, FIB-4</text>
            <text x="191" y="332" text-anchor="middle" class="t-sm t-mut">biopsy rarely used now</text>
            <path d="M191 346v24" class="fg-arrow" marker-end="url(#L05c)"/>
            <rect x="60" y="374" width="262" height="40" rx="8" class="fg-good"/>
            <text x="191" y="399" text-anchor="middle" class="t-sm t-b">Plan DAAs (genotype less critical)</text>
          </svg>
      - kind: check
        page: 92
        question: "A 34-year-old blood donor is anti-HCV positive. He feels well and his ALT is normal. Next step?"
        options:
          - "HCV RNA by PCR"
          - "Start sofosbuvir/velpatasvir now"
          - "HCV genotyping"
          - "Liver biopsy"
        answer: 0
        why:
          - "صح: الـ antibody screening بس. لازم **RNA (أو core antigen)** يأكد إن العدوى active."
          - "مش قبل ما تتأكد إن فيه viremia: ممكن تكون عدوى قديمة خفت لوحدها."
          - "الـ genotype للتخطيط بعد التأكيد، وبقى **less critical** مع الـ pangenotypic DAAs."
          - "الكتاب: الـ biopsy **rarely used now**، والـ fibrosis بتتقيّم non-invasive."
      - kind: try
        items: [hb.L05.010, hb.L05.011, hb.L05.016, hb.L05.018, hb.L05.020]
    recap:
      - "Acute: **15–45%** clearance. Chronic: **55–85%** (> 6 months)."
      - "Cirrhosis **~15–30% over 20 years**، والـ HCC **mainly with cirrhosis**."
      - "Acute غالبًا asymptomatic، و chronic **silent for years** (fatigue، RUQ discomfort، arthralgia)."
      - "Extrahepatic: **CLING** (Cryoglobulinemia، Lymphoma، Insulin resistance، Glomerulonephritis)."
      - "Screening = **anti-HCV**، confirm = **HCV RNA or core Ag**. Fibrosis: FibroScan، APRI، FIB-4."
    practice: [hb.L05.010, hb.L05.011, hb.L05.012, hb.L05.013, hb.L05.014, hb.L05.015, hb.L05.016, hb.L05.017, hb.L05.018, hb.L05.019, hb.L05.020, hb.L05.043, hb.L05.047, hb.L05.049, hb.L05.055, hb.L05.056]

  # ------------------------------------------------------------------
  - id: hb.L05.lesson3
    title: "الـ DAAs: نضرب الفيروس في 3 أماكن"
    hook: "من شهور interferon لحد حباية بتشفي أكتر من 95%. تعالى نفهم كل دوا بيقص فين."
    minutes: 9
    pages: [92, 93]
    topics: [daas]
    goals:
      - "تعرّف SVR12 تعريف الامتحان"
      - "تربط كل DAA class بالـ target بتاعها من آخر اسم الدوا"
      - "تحفظ الـ regimens الأربعة ومددها، وتعرف مين مش pangenotypic"
    status: unverified
    steps:
      - kind: explain
        page: 92
        title: "إمتى نقول اتعالج؟"
        quote: "Sustained Virologic Response (SVR) = undetectable HCV RNA 12 weeks after treatment (SVR12 = cure)."
        text: |
          الهدف: **SVR** = **undetectable HCV RNA** بعد **12 أسبوع** من **نهاية** العلاج. والـ **SVR12 = cure**.

          لاحظ: 12 أسبوع **بعد** ما العلاج يخلص، مش آخر يوم في العلاج.
      - kind: table
        page: 92
        title: "Old vs modern HCV treatment"
        columns: ["Feature", "Interferon ± Ribavirin", "DAAs"]
        rows:
          - ["Route", "Injections (old regimen)", "Oral"]
          - ["Duration", "Long", "Short"]
          - ["Safety", "Toxic", "Well tolerated"]
          - ["Efficacy", "Low", "> 95% cure"]
        hide: [[1, 2], [2, 1], [3, 2]]
      - kind: aside
        tone: joke
        text: |
          الفرق بين الـ interferon والـ DAAs زي الفرق بين إنك تسافر من إسكندرية لأسوان **بالحنطور** وإنك تركب **الطيارة**: الحنطور طويل ومتعب وممكن ماتوصلش، والطيارة قصيرة ومريحة وبتوصل أكتر من 95% من المرات 😄
      - kind: explain
        page: 92
        title: "الفيروس بيشتغل إزاي، وإحنا بنضربه فين؟"
        text: |
          الـ RNA بتاع الفيروس بيتترجم لبروتين واحد طويل (**polyprotein**) لازم يتقص علشان يطلع منه إنزيمات الفيروس. الـ DAAs بتضرب في 3 أماكن (جدول الكتاب):

          - **NS3/4A protease inhibitors** (Grazoprevir، Glecaprevir): بتمنع **viral polyprotein cleavage**.
          - **NS5A inhibitors** (Ledipasvir، Velpatasvir، Pibrentasvir): بتضرب الـ **replication complex**.
          - **NS5B polymerase inhibitors** (Sofosbuvir): بتوقف **viral RNA replication**.
      - kind: figure
        page: 93
        title: "3 أهداف على شريط واحد"
        alt: "A long bar labelled HCV polyprotein with three highlighted segments. NS3/4A protease is blocked by previr drugs, grazoprevir and glecaprevir, which stop polyprotein cleavage. NS5A is blocked by asvir drugs, ledipasvir, velpatasvir and pibrentasvir, acting on the replication complex. NS5B polymerase is blocked by buvir, sofosbuvir, which stops RNA replication."
        caption: "اقرا آخر اسم الدوا تعرف بيضرب فين: **-previr** على الـ protease، **-asvir** على NS5A، **-buvir** على NS5B."
