      - kind: explain
        page: 54
        quote: "Crude death rate = Number of deaths (all causes) / Estimated midyear population x 1,000\nExample: Atlanta, Georgia, with a population of 2 million, reported a total of 12,000 deaths from all causes in 1985. The annual crude mortality rate is 12,000/2,000,000 x 1000 = 6, or 6 deaths per 1000 population per year."
        title: "Crude death rate"
        text: |
          **Crude death rate = deaths (all causes) ÷ estimated midyear population × 1000**

          مثال slide 54: مدينة 2 مليون، 12,000 وفاة في السنة: 12,000 ÷ 2,000,000 × 1000 = ==6 per 1000 per year==.

          ليه «crude»؟ لأنه بيحط كل الأعمار وكل الأسباب في رقم واحد، فمدينة كبار السن هيبان معدلها أعلى حتى لو خدمتها الصحية أحسن. التفسير المقبول (مش في الكتاب).

          وليه **midyear**؟ لأن السكان بيتغيروا طول السنة، ونص السنة أحسن تقدير لعدد الناس اللي كانوا معرضين. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 55
        quote: "Age-Specific Mortality Rate\nNumber of people who died in a particular age group\nTotal midyear population of the same age group during the same year\n×1000"
        title: "Age-specific mortality rate"
        text: |
          **= deaths in a particular age group ÷ midyear population of ==the same age group== in the same year × 1000**

          البسط والمقام من **نفس الفئة العمرية**. ليه؟ علشان تقارن الأعمار ببعض من غير ما حجم كل فئة يلخبطك: فئة عدد وفياتها أكبر ممكن تكون ببساطة عدد ناسها أكبر.
      - kind: check
        page: 56
        quote: "Table 5.1: Pneumocystis carinii pneumonia in Miami, Florida, 1989\n| Age group in years | Cases in Miami | Population of Miami | Deaths in Miami | State population of Florida |\n|---|---|---|---|---|\n| 17 to 27 | 100 | 50,000 | 50 | 1,000,000 |\n| 28 to 47 | 300 | 150,000 | 750 | 2,500,000 |\n| > 48 | 350 | 250,000 | 1000 | 4,000,000 |\n| Total | 800 | 450,000 | 1800 | 7,500,000 |\nExample: The group that has the highest age-specific mortality rate from pneumocystis carinii pneumonia per 1000 population is found as follows:\n  17-27 (50/50,000) x 1000 = 1.0 per 1000 population\n  28-47 (750/150,000) x 1000 = 5.0 per 1000 population\n  > 48 (1000/250,000) x 1000 = 4.0 per 1000 population"
        question: "PCP in Miami: 17-27 had 50 deaths in 50,000; 28-47, 750 in 150,000; >48, 1000 in 250,000. Which group has the highest age-specific mortality rate?"
        options:
          - "28-47 (5.0 per 1000)"
          - ">48 (4.0 per 1000)"
          - "17-27 (1.0 per 1000)"
          - "All are equal"
        answer: 0
        why:
          - "صح: 750 ÷ 150,000 × 1000 = 5.0، الأعلى رغم إن عدد وفياتها مش الأكبر."
          - "الـ >48 فيها أكتر وفيات (1000) بس سكانها أكتر كمان: 1000 ÷ 250,000 × 1000 = 4.0. ده الفخ اللي المقام بيحلّه."
          - "50 ÷ 50,000 × 1000 = 1.0، الأقل."
          - "الأرقام بعد القسمة مختلفة."
      - kind: explain
        page: 57
        quote: "Cause-Specific Mortality Rate\nNumber of deaths due a specific disease\nTotal midyear population\n×1000"
        title: "Cause-specific mortality rate"
        text: |
          **= deaths due to a specific disease ÷ ==total midyear population== × 1000**

          قارنه بالـ age-specific: هنا المقام **كل السكان**، مش فئة. ليه؟ لأن السؤال «المرض ده بيموّت قد إيه من البلد كلها؟»، فالمقام هو كل اللي ممكن يموتوا بيه.
      - kind: case
        page: 59
        quote: "Proportionate Mortality Rate = Total number of deaths due to a certain disease / Total number of deaths from all causes x 100, which is usually expressed as a percentage.\nExample: There were 6000 deaths (1200 leukemia, 1750 stroke, 250 pneumonia, 250 Hodgkin's disease, and 2500 acute myocardial infarction) in Cook County, which had a population of 2.5 million in 1991. The proportionate mortality rate for leukemia is: (1200/6000) x 100 = 20%"
        stem: "مقاطعة فيها 2.5 مليون، و6000 وفاة في السنة: 1200 leukemia، 1750 stroke، 250 pneumonia، 250 Hodgkin، 2500 acute myocardial infarction (MI)."
        steps:
          - question: "Cause-specific mortality rate for acute MI?"
            options: ["1 per 1000", "41.7%", "2.4 per 1000"]
            answer: 0
            why: "2500/2,500,000 × 1000 = 1 per 1000 (slide 58)."
          - question: "Proportionate mortality rate for leukemia?"
            options: ["20%", "0.48 per 1000", "2%"]
            answer: 0
            why: "1200/6000 × 100 = 20% (slide 59)."
          - question: "Crude death rate?"
            options: ["2.4 per 1000", "6 per 1000", "24 per 1000"]
            answer: 0
            why: "6000/2,500,000 × 1000 = 2.4 per 1000."
      - kind: explain
        page: 60
        quote: "Case Fatality Rate = Number of deaths due to a disease / Number of people with the same disease x 100, which is usually expressed as a percentage.\nExample: In Bergen County, there were 500 HIV-positive people of whom five died within a year after their initial diagnosis. The case fatality rate is 5/500 x 100 = 1%"
        title: "Case fatality rate"
        text: |
          **CFR = deaths due to a disease ÷ ==people with the same disease== × 100**، وبيتكتب **percentage**.

          مثال slide 60: 500 HIV-positive، 5 ماتوا في سنة من التشخيص: 5 ÷ 500 × 100 = **1%**.

          ليه المقام العيانين بس؟ لأن السؤال عن **خطورة المرض** على اللي جاله، مش عن خطره على البلد. علشان كده هو مقياس الـ severity في الـ acute disease.
      - kind: check
        page: 61
        quote: "Which of the following is a good measure of the severity of an acute disease?\n  (a) Standardized mortality ratio\n  (b) Cause-specific death rate\n  (c) Case fatality rate\n  (d) Age-specific death rate"
        question: "Which is a good measure of the severity of an acute disease?"
        options:
          - "Case fatality rate"
          - "Standardized mortality ratio"
          - "Cause-specific death rate"
          - "Age-specific death rate"
        answer: 0
        why:
          - "صح: من اللي جالهم المرض، كام مات منه؟ ده بالظبط «قد إيه خطير»."
          - "الـ standardized mortality ratio (SMR) بيقارن الوفيات الفعلية بالمتوقعة في population."
          - "مقامه الناس كلها، فبيخلط «منتشر قد إيه» مع «خطير قد إيه»."
          - "وفيات فئة عمرية من كل الأسباب."
      - kind: check
        page: 62
        quote: "At the end of year 2000, the population of a tribal district was 2,00,000 and number of cases of tuberculosis were 800. At the end of the year 2001, the population was 2,10,000 and 200 new cases were detected and 12 cases had died. Based on this data, all of the following rates can be calculated except:\n  (a) Prevalence\n  (b) Incidence\n  (c) Proportional mortality\n  (d) Case fatality\nAnswer (c)"
        question: "Tuberculosis (TB) district: 800 cases in a population of 200,000 at the end of 2000; in 2001, 200 new cases and 12 TB deaths, population 210,000. Which rate can NOT be calculated?"
        options: ["Proportional mortality", "Prevalence", "Incidence", "Case fatality rate"]
        answer: 0
        why:
          - "صح، ودي إجابة الـ slide: الـ proportionate mortality rate (PMR) محتاج ==كل الوفيات== من كل الأسباب، ومش مذكورة."
          - "حالات موجودة ÷ population."
          - "حالات جديدة ÷ at risk."
          - "وفيات الـ TB ÷ حالات الـ TB."
      - kind: try
        items: [res.L02.044, res.L02.045, res.L02.047, res.L02.043]
    recap:
      - "المقام بيحدد: population ← cause-specific (×1000)، all deaths ← proportionate (%)، المرضى ← case fatality (%)."
      - "Case fatality = **severity**."
      - "Infant/neonatal/under-5 ÷ live births × 1000. Perinatal ÷ (fetal deaths + live births). MMR ÷ live births × 100,000."
      - "Perinatal I = 28 أسبوع حمل لـ 7 أيام. Neonatal = 28 يوم."
    practice: [res.L02.043, res.L02.044, res.L02.045, res.L02.046, res.L02.047, res.L02.048, res.L02.049, res.L02.055, res.L02.065, res.L02.068, res.L02.069]  # ------------------------------------------------------------------
