  # ---------- p5-6: insulinoma ----------
  - id: endo.L01.030
    kind: card
    topic: insulinoma
    front: Clinical picture of insulinoma?
    back: Hypoglycaemia after fasting or exertion that improves with glucose intake, with inappropriately elevated insulin.
    src: { page: 5, quote: "Insulinoma\n  Patient develop hypoglycemia after fasting or exertion; improve with glucose intake & inappropriately elevated insulin.\n  90% solitary and benign.\n  Head, body and tail pancreas.\n  Malignancy - size > 6cm or liver/nodal mets." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.031
    kind: cloze
    topic: insulinoma
    text: "Insulinomas are {{c1::90%}} solitary and benign, found in the head, body and tail of the pancreas; malignancy is suggested by size {{c2::more than 6 cm}} or {{c3::liver or nodal metastases}}."
    src: { page: 5, quote: "Insulinoma\n  Patient develop hypoglycemia after fasting or exertion; improve with glucose intake & inappropriately elevated insulin.\n  90% solitary and benign.\n  Head, body and tail pancreas.\n  Malignancy - size > 6cm or liver/nodal mets." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L01.032
    kind: card
    topic: insulinoma
    front: Medical treatment of insulinoma before surgery?
    back: Control symptoms before surgery with frequent small carbohydrate meals until operated, and octreotide.
    src: { page: 5, quote: "Medical Treatment\n  Control Symptoms prior to surgery.\n  Frequent small CHO meals until operated.\n  Octreotide therapy." }
    status: unverified
  - id: endo.L01.033
    kind: card
    topic: insulinoma
    front: Curative surgery for malignant insulinoma?
    back: Whipple's operation or subtotal pancreatectomy with splenectomy, and excision of liver metastases.
    src: { page: 5, quote: "Surgery for Malignant Insulinoma\n  Curative.\n  Whipple's or subtotal pancreatectomy - splenectomy, excision of liver metastases.\n  Palliation for metastatic disease.\n  ChemoRx.\n  Chemoembolization.\n  Alcohol injections, cryotherapy, radiofrequency ablation." }
    status: unverified
  - id: endo.L01.034
    kind: enumerate
    topic: insulinoma
    prompt: Palliation for metastatic insulinoma.
    points:
