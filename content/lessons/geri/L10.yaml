        question: "Which drug is NOT among the book's examples of pneumotoxic drugs to ask about?"
        options: ["Metformin", "Amiodarone", "Bleomycin", "Nitrofurantoin"]
        answer: 0
        why:
          - "صح: الـ metformin مش في القايمة."
          - "أول دوا في القايمة (للقلب)."
          - "دوا سرطان سام للرئة."
