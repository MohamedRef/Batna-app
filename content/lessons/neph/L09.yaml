  # ------------------------------------------------------------------
  - id: neph.L09.lesson1
    title: "اختيار الـ RRT وماكينة الغسيل من جوّه"
    hook: "قبل ما تختار غسيل ولا زراعة، لازم تعرف الماكينة بتعمل إيه في الـ 4 ساعات دول."
    minutes: 9
    pages: [292, 295]
    topics: [intro, modalities, hd-machine, hd-dose]
    goals:
      - "تعرف الـ RRT المثالي لازم يحقق إيه، وإزاي تختار بين HD و PD والزراعة"
      - "تفرّق CRRT و SLED/PIRRT و HD العادي بالوقت والماكينة"
      - "تفهم الـ dialyser والـ dialysate والمية والإنذارات، وجرعة الغسيل"
    status: unverified
    steps:
      - kind: explain
        page: 293
        title: "الـ RRT المثالي"
        quote: "Prevent further deterioration of renal function. Preserve residual renal"
        text: |
          الـ RRT المثالي بيعمل 6 حاجات:
          - ينضّف الـ **uraemic toxins**.
          - يظبط الـ **electrolytes** والـ **acid–base**.
          - يحافظ على الـ ==residual renal function== وما يبوّظش الكلية أكتر.
          - يسرّع رجوع الكلية في الـ **AKI**.
          - مريح ومرن (tolerance, flexibility).
          - ما يضيّعش nutrients.
      - kind: explain
        page: 293
        title: "HD ولا PD ولا زراعة؟"
        quote: "The outcome comparison suggest that RT is a better overall treatment forESRD patients."
        text: |
          الـ ESRD ليه 3 حلول: **HD**، **PD**، و ==renal transplantation==. الزراعة **أحسن في المجمل** (better overall treatment).

          بين HD و PD الدراسات متضاربة؛ مفيش واحد ينفع الكل. الاختيار حسب المريض: السن، الأمراض التانية، فيه متبرع ولا لأ، الفلوس، الظروف الاجتماعية، وجودة الحياة. وفي العالم كله حوالي ==80%== على الـ HD.
      - kind: aside
        tone: exam
        page: 293
        quote: "Councelling for RRT should be in stage 4CKD, to allow time for hepatitis B vaccination"
        text: |
          الكلام عن الـ RRT يبدأ في ==CKD stage 4==. ليه؟ علشان الـ **hepatitis B vaccine** محتاج وقت، والـ **AV fistula** محتاجة شهور تنضج.
      - kind: table
        page: 294
        quote: "PIRRT or SLED 6-12h /session (can be done with the usual dialysis"
        title: "كل modality قد إيه؟"
        columns: [Modality, Session]
        rows:
          - ["CRRT (CKRT)", "24 h/day, special machine"]
          - ["SLED / PIRRT", "6–12 h, usual machine"]
          - ["Conventional HD", "4–5 h"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: figure
        page: 294
        quote: "blood circulates while dialysate flows countercurrent(to maintain conc gradients"
        title: "الـ dialyser: دم في اتجاه ومحلول في الاتجاه التاني"
        alt: "A long horizontal dialyser drawn as a tube. Blood enters on the left inside hollow fibres and leaves on the right. Dialysate enters on the right outside the fibres and leaves on the left. Small dots (urea, potassium) cross from blood into dialysate along the whole length; a note says the gradient stays high everywhere because the flows are countercurrent."
        caption: "الـ ==countercurrent== بيخلي الفرق في التركيز عالي على طول الفلتر كله، فالـ urea بتفضل تعدّي من الدم للمحلول من أوله لآخره."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="N9a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
              <marker id="N9b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="30" y="50" width="270" height="100" rx="40" class="fg-box"/>
            <rect x="45" y="85" width="240" height="30" rx="12" class="fg-bad"/>
            <path d="M5 100 L42 100" class="fg-arrow-bad" marker-end="url(#N9a)"/>
            <path d="M288 100 L325 100" class="fg-arrow-bad" marker-end="url(#N9a)"/>
            <text x="5" y="92" class="t-sm t-bad t-b">Blood in</text>
            <text x="270" y="130" class="t-sm t-bad">out</text>
            <path d="M325 62 L270 62" class="fg-arrow-acc" marker-end="url(#N9b)"/>
            <path d="M60 138 L5 138" class="fg-arrow-acc" marker-end="url(#N9b)"/>
            <text x="230" y="44" class="t-sm t-acc t-b">Dialysate in</text>
            <text x="5" y="160" class="t-sm t-acc">Dialysate out</text>
            <circle cx="100" cy="90" r="3" class="fg-dot-bad"/>
            <circle cx="110" cy="72" r="3" class="fg-dot-bad"/>
            <circle cx="170" cy="92" r="3" class="fg-dot-bad"/>
            <circle cx="182" cy="74" r="3" class="fg-dot-bad"/>
            <circle cx="240" cy="90" r="3" class="fg-dot-bad"/>
            <circle cx="250" cy="73" r="3" class="fg-dot-bad"/>
            <text x="165" y="185" text-anchor="middle" class="t-sm t-mut">Urea and K+ cross along the whole length</text>
          </svg>
      - kind: explain
        page: 294
        title: "الـ dialysate بيتعمل إزاي؟"
        quote: "to prevent formation of insoluble calcium and magnesium salts with bicarbonate"
        text: |
          لو حطيت الـ **bicarbonate** مع الـ **calcium** و **magnesium** في جركن واحد، هيترسّبوا أملاح مش بتدوب. علشان كده المحلول من ==جزئين==:
          - **Bicarbonate concentrate** (دلوقتي cartridges بودرة ناشفة علشان العدوى).
          - **Acid concentrate**: كل الأملاح من غير bicarbonate، مركّز **34–36 مرة**، وفيه acetate قليل (3 mEq/L).

          الماكينة تخلطهم مع **مية متنقية**. في 4 ساعات الدم بيشوف ==120 لتر مية== (dialysate flow 500 mL/min)!
      - kind: order
        page: 294
        quote: "filtration, softening, activated charcoal filtration and reverse osmosis"
        prompt: "120 لتر بتلمس دم العيان. رتّب تنقية المية:"
        steps:
          - "Filtration"
          - "Softening"
          - "Activated charcoal"
          - "Reverse osmosis"
        why: "الكتاب: filtration ← softening ← activated charcoal ← reverse osmosis، علشان تشيل الـ chloramines والميكروبات والأملاح الدايبة."
      - kind: explain
        page: 294
        title: "الدايرتين والإنذارات"
        quote: "Conductivity (reflection of sodium, bicarbonate conc)"
        text: |
          **دايرة الـ dialysate**: heating، deaeration، proportioning، monitoring، UF، disinfection. إنذاراتها: ==conductivity== (يعني تركيز الـ Na والـ bicarbonate)، الحرارة، والـ **haemoglobin** (blood leak).

          **دايرة الدم**: blood pump، وإنذارات inflow pressure و outflow pressure و ==air detector==.
      - kind: check
        page: 294
        quote: "Conductivity (reflection of sodium, bicarbonate conc)"
        question: "The haemoglobin detector alarms during dialysis. What does it mean?"
        options:
          - "Blood leak into the dialysate"
          - "Wrong sodium concentration"
          - "Air in the blood line"
          - "Dialysate too cold"
        answer: 0
        why:
          - "صح: الـ haemoglobin sensor في دايرة المحلول = blood leak (الفلتر مخروم)."
          - "ده الـ conductivity alarm."
          - "ده الـ air detector في دايرة الدم."
          - "ده الـ temperature alarm."
      - kind: explain
        page: 295
        title: "الجرعة والـ heparin"
        quote: "Dialysis should be delivered at least three times per week and the total duration should be at least 12 h per week."
        text: |
          - على الأقل ==3 مرات في الأسبوع== و **12 ساعة** في الأسبوع.
          - زوّد الوقت أو المرات لو: haemodynamic أو CV instability، resistant hypertension، phosphate مش مظبوط.
          - **الحامل**: ==5 جلسات و 20 ساعة== في الأسبوع على الأقل.
          - **Incremental**: نبدأ أقل ونزوّد مع الوقت لو فيه residual renal function، ونقيسها كل فترة.

          **Anticoagulation**: unfractionated أو LMWH للعادي (1A)، قلّل أو الغي لو فيه خطر نزيف (1C)، و non-heparin لو عنده heparin allergy (1A).
      - kind: aside
        tone: joke
        page: 295
        quote: "Pregnant women should receive at least 5 sessions/w, minimum duration of 20h/w."
        text: |
          الحامل على الغسيل بتقضي في الوحدة **20 ساعة** في الأسبوع. يعني الممرضات هيعرفوا اسم البيبي قبل باباه 😄
      - kind: try
        items: [neph.L09.001, neph.L09.008, neph.L09.011, neph.L09.019, neph.L09.023]
    recap:
      - "الزراعة أحسن RRT في المجمل؛ HD و PD حسب المريض، و 80% في العالم على HD."
      - "الكلام عن الـ RRT من CKD stage 4: HBV vaccine و fistula."
      - "CRRT 24 ساعة، SLED/PIRRT 6–12، HD العادي 4–5."
      - "Dialysate من جزئين علشان الـ Ca و Mg ما يترسبوش مع الـ bicarbonate؛ 120 لتر مية في 4 ساعات."
      - "3 مرات و 12 ساعة في الأسبوع؛ الحامل 5 مرات و 20 ساعة."
    practice: [neph.L09.001, neph.L09.002, neph.L09.003, neph.L09.004, neph.L09.005, neph.L09.006, neph.L09.007, neph.L09.008, neph.L09.009, neph.L09.010, neph.L09.011, neph.L09.012, neph.L09.013, neph.L09.014, neph.L09.015, neph.L09.016, neph.L09.017, neph.L09.018, neph.L09.019, neph.L09.020, neph.L09.021, neph.L09.022, neph.L09.023, neph.L09.075]
