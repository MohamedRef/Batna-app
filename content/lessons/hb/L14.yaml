  - id: hb.L14.lesson2
    title: "الروماتيزم وأدويته والكبد"
    hook: "الـ Still's بيرفع الـ ALT، الـ vasculitis بترفع الـ ALP، والـ azathioprine عامل 3 مصايب لوحده."
    minutes: 8
    pages: [257, 260]
    topics: [ctd, rheum-drugs]
    goals:
      - "تعرف شكل الكبد في كل collagen disease"
      - "تفرّق lupus hepatitis عن AIH/SLE overlap"
      - "تحفظ جدول الـ rheumatologic drugs (سؤال امتحان)"
    status: unverified
    steps:
      - kind: explain
        page: 257
        title: "الكبد في الـ connective tissue disease"
        text: |
          الكبد في الـ CTD:

          - إصابته شائعة، وغالبًا asymptomatic.
          - بس ممكن يبقى فيه أعراض، واتوصف حتى **fulminant hepatitis**.
          - قبل ما تقول «ده من المرض نفسه»، لازم تستبعد drug toxicity، و viral hepatitis، و autoimmune liver disease.

          النوعين:

          - ==Hepatocellular==: ALT و AST مرتفعين.
          - ==Cholestatic==: ALP و GGT مرتفعين.

          الارتفاع عمومًا خفيف، ومرتبط بالـ **disease activity**. بس كل مرض ليه طبعه:

          - **Adult-onset Still's disease**: أعلى ALT.
          - **Vasculitis syndrome**: أعلى ALP و GGT.
          - **Rheumatoid arthritis**: الـ transaminases والـ bilirubin عادةً طبيعيين، بس الـ ALP مرتفع في 18–46%، والـ GGT في 23–77%، ومرتبط بالـ activity.
      - kind: sort
        page: 257
        prompt: "مين بيرفع إيه أكتر؟"
        bins: ["Highest ALT", "Highest ALP / GGT"]
        cards:
          - { text: "Adult-onset Still's disease", bin: 0 }
          - { text: "Vasculitis syndrome", bin: 1 }
          - { text: "Hepatocellular pattern", bin: 0 }
          - { text: "Cholestatic pattern", bin: 1 }
        why: "الـ **Still's** هو بطل الـ ALT (hepatocellular)، والـ **vasculitis** بطلة الـ ALP و GGT (cholestatic)."
      - kind: explain
        page: 258
        title: "RA و SLE"
        text: |
          **RA ومشتقاته** (Still's و Felty's): الـ LFTs بايظة كتير. وممكن تلاقي:

          - **PBC**.
          - **Autoimmune hepatitis**.
          - ==Nodular regenerative hyperplasia== (NRH).
          - **Necrotizing arteritis**.
          - **Amyloidosis**.
          - وحتى **rheumatoid nodules** في الكبد.

          **SLE**:

          - Liver dysfunction في 8.6–59.7%، و ALT مرتفع في 21%.
          - السبب مش المرض بس: ممكن drugs، أو fatty infiltration، أو overlapping autoimmune disease.
          - ==Lupus hepatitis==: hypertransaminasemia، والـ ALT فيها بيطلع وينزل مع نشاط الـ SLE. غالبًا subclinical و fluctuating، وبتستجيب لـ prednisone (moderate لـ high) من غير ما توصل لـ end-stage.
          - أشهر histology: **steatosis**، ومش لازم تكون بسبب الـ steroids.
          - **SLE + AIH** مع بعض uncommon. بس الـ AIH ممكن تعمل fulminant failure أو cirrhosis، فلازم تفرّق بينها وبين الـ lupus hepatitis.
      - kind: reveal
        page: 258
        prompt: "ليه مهم تفرّق lupus hepatitis عن AIH/SLE overlap، طالما الاتنين بيتعالجوا بـ steroids؟"
        answer: |
          لأن المصير مختلف:

          - الـ **lupus hepatitis** subclinical و fluctuating، ومش بتوصل لـ end-stage liver disease.
          - الـ **AIH** ممكن تتطور لـ **fulminant hepatic failure** أو **cirrhosis**.

          يعني لو سمّيتها lupus hepatitis وهي AIH، ممكن تفوّت مرض بيمشي لقدّام.
      - kind: explain
        page: 259
        title: "HPS و PAN و GCA"
        text: |
          ==Reactive hemophagocytic syndrome (HPS)==:

          - ممكن يموّت. بيحصل مع neoplasms، و viral infections، و autoimmune diseases منها **SLE**.
          - الصورة: high fever، و lymphadenopathy، و hepatosplenomegaly، و **pancytopenia**، و LFTs عالية، و **hyperferritinemia**، و coagulopathy.
          - **الـ mechanism**: الـ macrophages بتفضل متنشّطة (sustained activation) بعد cytokines زي IL-6 و **TNF-α**. ودي اللي بتعمل الحرارة والـ liver dysfunction والـ coagulopathy.

          ==Polyarteritis nodosa==: **necrotizing arteritis** في شرايين الكبد، والنتيجة **infarction**.

          **Polymyalgia rheumatica–giant cell arteritis**: **granulomatous arteritis** ممكن تتشاف في الكبد.
      - kind: figure
        page: 259
        title: "الـ HPS: macrophages ما بتهداش"
        alt: "A loop. A trigger, such as a neoplasm, a viral infection or SLE, activates macrophages. Activated macrophages release IL-6 and TNF-alpha, and these cytokines keep the macrophages activated, closing the loop. The loop leads to the clinical picture: high fever, hepatosplenomegaly and lymphadenopathy, pancytopenia, raised liver enzymes, hyperferritinemia and coagulopathy."
        caption: "الـ cytokines بتنشّط الـ macrophages، والـ macrophages بتطلّع cytokines أكتر. والدايرة دي هي اللي بتعمل الحرارة والـ liver dysfunction والـ coagulopathy."
        svg: |
