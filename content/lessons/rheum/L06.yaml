          - "B7-2 مع CD28 ده الـ on (costimulation)."
          - "CD4 مع class II بيثبّت التعرّف، مش off."
          - "TCR مع الـ peptide هو signal 1."
      - kind: reveal
        page: 100
        quote: "During activation, CTLA-4 is induced and its binding to B7-1 on the APC is"
        prompt: "دوا اسمه abatacept هو CTLA-4 لازق في Fc. هيعمل إيه في الـ T cells، وليه بيستعملوه في الـ RA؟"
        answer: |
          من كلام الكتاب: الـ **CTLA-4** بيمسك الـ **B7**. فالدوا هيلف على الـ B7 اللي على الـ APC ويغطيه، فالـ **CD28** على الـ T cell مش هيلاقي B7 يمسكه.

          النتيجة: **مفيش costimulation** ← الـ T cell ما تتنشّطش. وده منطقي في مرض زي الـ RA اللي الـ T cells فيه شغالة ضد الجسم. (معلومة الدوا نفسه مش في الكتاب.)
      - kind: explain
        page: 101
        title: "الـ CTL بيقتل الـ virus"
        quote: "Virus particles excereted from a virally infected cell are endocytosed by APCs and presented to TH cells These provide activation signals for CTLs that have TCR specificity for related viral peptides presented by class I MHC molecules on the target cell surface."
        text: |
          1. جزيئات الـ virus بتتبلع بالـ **antigen-presenting cell (APC)** وتتعرض على **class II** للـ **T helper 1 (TH1)**.
          2. الـ TH1 يبعت للـ **Cytotoxic T lymphocyte (CTL)** إشارات تنشيط: **IFN-γ** و **IL-2**.
          3. الـ CTL يشوف الـ viral peptide على **class I** في الخلية المصابة.
          4. يقتلها بطريقتين: ==apoptosis== بالـ **lymphotoxin**، أو **ثقوب** بالـ **perforin**.
      - kind: order
        page: 101
        quote: "CTLs can kill target cells by (i) inducing suicide (apoptosis) through lymphotoxin release or (ii) forming pores in the target cell through perforin action."
        prompt: "رتّب خطوات قتل الخلية المصابة بالـ virus:"
        steps:
          - "APC endocytoses virus particles"
          - "Viral peptide on class II to TH1"
          - "TH1 sends IFN-γ and IL-2 to the CTL"
          - "CTL sees viral peptide on class I"
          - "Lymphotoxin or perforin kills the target"
        why: "الـ helper الأول، وبعدين الـ killer. الـ CTL محتاج إذن الـ TH1، وبعدين يدوّر على الخلية اللي شايلة الـ peptide على class I."
      - kind: check
        page: 101
        quote: "CTLs can kill target cells by (i) inducing suicide (apoptosis) through lymphotoxin release or (ii) forming pores in the target cell through perforin action."
        question: "A cytotoxic T cell punches holes in a virus-infected cell. Which molecule does this?"
