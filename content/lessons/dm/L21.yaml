  - id: dm.L21.lesson3
    title: "الـ TG العالي: لوحده ولا مع صاحبه؟"
    hook: "Familial hypertriglyceridemia وFamilial combined: اتنين شبه بعض، والفرق بيتحسم بالكوليسترول والـ xanthoma."
    minutes: 8
    pages: [265, 267]
    topics: [fhtg, fchl]
    goals:
      - "تعرف الـ triad بتاع الـ FHTG وأرقامه"
      - "تعرف إيه اللي بيزوّد الـ VLDL"
      - "تفرّق الـ FCHL وتعرف علاجه"
    status: unverified
    steps:
      - kind: explain
        page: 265
        title: "Familial hypertriglyceridemia"
        quote: "Familial hypertriglyceridemia\n  Type IV Fredrickson Hyperlipoproteinaemia\n  Frequency: The most common type\n  Genetics: Genetically heterogeneous"
        text: |
          - Fredrickson ==Type IV==، **the most common type**، genetically **heterogeneous**.
          - العيب: **VLDL synthesis** زيادة، أو **VLDL catabolism** ضعيف، أو الاتنين.

          "Heterogeneous" يعني مش جين واحد: أي عيب يزوّد **تصنيع** الـ very-low-density lipoprotein (VLDL) أو يبطّأ **تكسيره** بيوصّل لنفس الصورة. عشان كده هو أشهر نوع: طرق كتير بتوصّل لنفس النتيجة.
      - kind: mnemonic
        page: 265
        quote: "The diagnosis of FHTG is suggested by the triad of:\n  1. Elevated levels of plasma triglycerides (250–1000 mg/dL),\n  2. Normal or only mildly increased cholesterol levels (<250 mg/dL), and\n  3. Reduced plasma levels of HDL-C."
        word: "TCH"
        parts:
          - { key: "T", text: "TG 250-1000 mg/dL" }
          - { key: "C", text: "Cholesterol normal or mildly up, under 250 mg/dL" }
          - { key: "H", text: "HDL-C reduced" }
        hook: "**TCH**: الـ triad. لاحظ الـ **250** بتتكرر: TG فوقها، والكوليسترول تحتها."
      - kind: explain
        remind: [dm.L21.033]
        page: 265
        title: "إيه اللي بيولّعها، وليه؟"
        quote: "Increased intake of simple carbohydrates, obesity, insulin resistance, alcohol use, and estrogen treatment, all of which increase VLDL synthesis, can exacerbate this syndrome."
        text: |
          الكتاب بيقول السبب المشترك: كلهم بيزوّدوا ==VLDL synthesis==:
          - **Simple carbohydrates**
          - **Obesity** و **insulin resistance**
          - **Alcohol use**
          - **Estrogen treatment**

          إزاي كل واحد بيزوّده؟ التفسير المقبول (مش في الكتاب): السكر الزيادة الكبد بيحوّله دهون ويبعتها VLDL؛ الكرش والـ insulin resistance بيغرّقوا الكبد بـ free fatty acids؛ الكحول بيخلّي الكبد يحرقه هو الأول ويخزّن الدهون؛ والـ estrogen بيزوّد تصنيع الـ VLDL مباشرة.

          والـ risk في الكتاب: **strong**، خصوصًا **coronary heart disease (CHD)** (premature)، وأقل في الـ peripheral والـ cerebrovascular.
      - kind: explain
        page: 266
        title: "Eruptive xanthoma"
        quote: "Eruptive Xanthoma\n  1. These occur in crops on the back, buttocks, legs and abdomen.\n  2. They are small, firm in consistency and sometimes they resemble pustules.\n  They contain triglycerides."
        text: |
          في الـ familial hypertriglyceridaemia (FHTG) مفيش xanthoma مميز، بس ممكن ==eruptive xanthoma==:
          - بتطلع **crops** (مجموعات) على الضهر والـ buttocks والرجلين والبطن.
          - صغيرة، **firm**، وساعات شبه pustules.
          - جواها **triglycerides**.

          الفرق عن الـ FH: الـ tendon xanthoma **كوليسترول** وبطيء، والـ eruptive **TG** وبيطلع فجأة (عشان كده "eruptive"). التفسير المقبول (مش في الكتاب): بيظهر لما الـ TG يعلى جامد، وبيختفي لما ينزل.
      - kind: explain
        remind: [dm.L21.036]
        page: 266
        title: "علاج الـ FHTG"
        quote: "For more moderate elevations in triglyceride levels (250-500 mg/dL), statins are effective at lowering triglyceride levels."
        text: |
          **Diet**: تقليل السعرات والوزن، **low-carbohydrate**، تقليل الكوليسترول، polyunsaturated بدل saturated.

          **Drugs**: ==fibrates== و **niacin**. ولو الـ triglycerides (TG) متوسط (**250-500 mg/dL**) الـ **statins** بتنفع.

          ليه low-carbohydrate مش low-fat بس؟ لأن الكتاب قال إن الـ simple carbohydrates بتزوّد الـ VLDL synthesis. والـ fibrates بتشغّل الـ PPAR-α فيزيد تكسير الـ TG، والـ niacin بيقلل تصنيع الـ VLDL (التفسير المقبول، مش في الكتاب).
      - kind: check
        page: 265
        quote: "The diagnosis of FHTG is suggested by the triad of:\n  1. Elevated levels of plasma triglycerides (250–1000 mg/dL),\n  2. Normal or only mildly increased cholesterol levels (<250 mg/dL), and\n  3. Reduced plasma levels of HDL-C."
        question: "TG 700 mg/dL, cholesterol 230 mg/dL, low HDL-C, no tendon xanthomas. Which primary disorder?"
        options:
          - "Familial hypertriglyceridemia"
          - "Familial hypercholesterolemia"
          - "Familial hyperchylomicronemia"
          - "Tangier disease"
        answer: 0
        why:
          - "صح: الـ triad: TG 250-1000، chol أقل من 250، HDL واطي."
          - "الـ FH فيها LDL عالي جدًا و TG طبيعي."
          - "Type I فيه TG أعلى بكتير مع pancreatitis وكوليسترول طبيعي."
          - "Tangier = HDL واطي جدًا مع لوز برتقاني، مش TG."
      - kind: explain
        remind: [dm.L21.040]
        page: 266
        title: "Familial combined hyperlipidemia"
        quote: "Characterized by moderate elevations in plasma levels of triglycerides (VLDL) and cholesterol (LDL) and reduced plasma levels of HDL-C"
        text: |
          - الكتاب بيقول ==Type V==.
          - **TG (VLDL)** و **cholesterol (LDL)** عاليين **باعتدال**، و **high-density lipoprotein cholesterol (HDL-C) واطي**.
          - Genetically heterogeneous.
          - Pathogenesis: **VLDL overproduction**، clearance ضعيف للـ VLDL والـ chylomicrons، و **partial lipoprotein lipase (LPL) deficiency**.

          ليه الاتنين بيعلوا مع بعض؟ التفسير المقبول (مش في الكتاب): الـ VLDL الزيادة بيتكسّر لـ IDL وبعدين LDL، فالـ TG (في الـ VLDL) والـ cholesterol (في الـ LDL) يعلوا سوا من نفس المصدر.
      - kind: update
        page: 266
        quote: "Type V Fredrickson Hyperlipoproteinaemia"
        text: "أغلب المراجع بتحط الـ familial combined hyperlipidaemia (FCHL) في **Fredrickson IIb** أساسًا (وممكن IIa أو IV في نفس العيلة)، والـ Type V هو VLDL + chylomicrons. في الامتحان اكتب إجابة الكتاب: Type V."
        ref: "Harrison's Principles of Internal Medicine 21e (2022), lipoprotein disorders"
      - kind: explain
        remind: [dm.L21.041]
