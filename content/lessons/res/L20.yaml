  steps:
  - kind: explain
    page: 30
    quote: |-
      II. DISCUSSION
      The discussion part can be divided into two parts:
      Discussing the results of the study
      Assessing the statistical methods.
      With respect to the statistical methods, it is important to focus on one main statistical method that the authors used and use it to convey whether they met their objectives.
      When presenting the results of a study, it is impossible to present every table, chart, and figure. Two to three figures should be chosen to represent the majority of the results and must be explained thoroughly with attention to the clinically significant results.
    title: المناقشة جزئين
    text: |-
      المناقشة بتتقسم لـ:
      - **Discussing the results**.
      - **Assessing the statistical methods**.

      ركّز على ==one main statistical method== الباحثين استخدموه، وشوف حققوا الـ objectives ولا لأ. ومتعرضش كل جدول: اختار **2–3 figures** يمثلوا أغلب النتايج واشرحهم بتركيز على الـ **clinically significant** results.
  - kind: aside
    tone: tip
    text: '**A negative study is not a bad study**: لو الدراسة ملقتش علاقة، مش معناها إنها ملهاش لازمة؛ هي بتضيف معرفة و**بتستبعد عوامل** ممكن متكونش ليها علاقة.'
    page: 31
    quote: |-
      A negative study is not a bad study.
      If a study fails to detect a relationship, then that does not mean that the study is useless. Rather, it presents further knowledge on the topic and rules out certain factors that may not be associated with it.
