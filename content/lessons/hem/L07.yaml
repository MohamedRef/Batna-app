      - kind: explain
        page: 107
        title: "الـ AML blast وليه الـ Auer rod مهم"
        quote: "Leukemic cells in AML typically are 12 to 20 um in diameter with discrete nuclear chromatin, multiple nucleate and cytoplasm that usually contains a zurophilic granules, auer rods which are slender, fusiform cytoplasmic inclusions that stain red with Giemsa stain, are pathognomic of AML."
        text: |
          الـ **AML blast**: **12–20 µm**، chromatin منفصلة، **nucleoli كتير**، وفي الـ cytoplasm ==azurophilic granules==.

          الـ ==Auer rods==: inclusions رفيعة مغزلية بتلوّن **أحمر** بالـ Giemsa، وهي **pathognomonic** للـ AML. ليه pathognomonic؟ التفسير المقبول (مش في الكتاب): هي granules من نفس النوع اللي في الـ myeloid cells اتلزقت في عصاية، فمستحيل تطلع في lymphoblast مفيهوش granules أصلًا.
      - kind: explain
        page: 107
        title: "L1 وL2 وL3"
        quote: "The leukemic cells in ALL are smaller than AML blasts and devoid of granules. L1 blasts are uniform in size with scanty cytoplasm, L2 blasts are are larger and more variable in size and may have nucleoli, L3 blasts are quite distinct with prominent nucleoli and deeply basophilic cytoplasm with vacuoles."
        text: |
          الـ **ALL blasts** أصغر من الـ AML ومن غير granules:
          - **L1**: حجمها **uniform** و cytoplasm قليلة.
          - **L2**: أكبر و **variable** وممكن فيها nucleoli.
          - ==L3==: مميزة: **prominent nucleoli** و cytoplasm **deeply basophilic** فيها ==vacuoles== (Burkitt-like).

          يعني من غير أي تحليل غالي: **granules أو Auer rod** = اتجاه myeloid، **صغيرة ومن غير granules** = اتجاه lymphoid. وبعدين الـ markers تأكد.
      - kind: check
        page: 107
        quote: "Leukemic cells in AML typically are 12 to 20 um in diameter with discrete nuclear chromatin, multiple nucleate and cytoplasm that usually contains a zurophilic granules, auer rods which are slender, fusiform cytoplasmic inclusions that stain red with Giemsa stain, are pathognomic of AML."
        question: "Slender red fusiform cytoplasmic inclusions on Giemsa stain are pathognomonic of:"
        options:
          - "AML"
          - "L3 ALL"
          - "CLL"
          - "Leukemoid reaction"
        answer: 0
        why:
          - "صح: الـ Auer rods = AML، pathognomonic."
          - "الـ L3 فيها vacuoles وcytoplasm basophilic، مفيش Auer rods."
          - "الـ CLL خلاياها lymphocytes ناضجة صغيرة."
          - "الـ leukemoid reaction خلايا myeloid بتنضج طبيعي."
      - kind: explain
        page: 108
        title: "الـ markers: الكارنيه بتاع الخلية"
        quote: "Cluster differentiating antigens (CD) are cell surface antigens which react with monoclonal antibodies, AML express CD13, CD14, CD33 and CD34 in ALL approximately 60% of case express the common ALL antigen or CALLA (CD10)."
        text: |
          الـ **CD antigens** زي كارنيه على سطح الخلية بيتقرا بـ monoclonal antibodies:
          - **AML**: ==CD13، CD14، CD33، CD34==
          - **ALL**: حوالي **60%** عندها **CALLA (CD10)** = early B cell
          - حوالي **20%** من الـ ALL **T-cell**: CD4، CD3، CD2

          ومن جوه الخلية: ==Terminal deoxynucleotidyl transferase (TdT)== (nuclear enzyme) في **أكتر من 90%** من الـ ALL lymphoblasts، ومش موجود في الخلايا الناضجة.

          ليه الـ markers مهمة لو الميكروسكوب قال؟ لأن blasts كتير شبه بعض (M0 و M1 تقريبًا من غير granules)، والـ CD بيحسم. والـ CALLA معناها إن الخلية وقفت في مرحلة **early B cell**.
      - kind: sort
        page: 108
        quote: "Cluster differentiating antigens (CD) are cell surface antigens which react with monoclonal antibodies, AML express CD13, CD14, CD33 and CD34 in ALL approximately 60% of case express the common ALL antigen or CALLA (CD10)."
        prompt: "الـ marker ده يشاور على إيه؟"
        bins: ["AML", "ALL"]
        cards:
          - { text: "CD13", bin: 0 }
          - { text: "CD33", bin: 0 }
          - { text: "CD14", bin: 0 }
          - { text: "CD10 (CALLA)", bin: 1 }
          - { text: "TdT", bin: 1 }
          - { text: "CD3, CD2", bin: 1 }
        why: "الـ CD13 وCD14 وCD33 (وCD34) بتاعة AML. الـ CALLA (CD10) والـ TdT والـ T-cell antigens (CD4، CD3، CD2) بتاعة ALL."
      - kind: reveal
        page: 108
        quote: "Only one in commonly used clinically deoxy nucleotidy transferone (TDT) a nuclear enzyme that is found in more than 90% of cases of ALL lymphblasts. It is not found on normal mature myeloid or, lymphoid cells."
        prompt: "ليه الـ TdT بيتلاقي في الـ lymphoblasts ومش في الخلايا الناضجة؟"
