  - id: res.L07.098
    kind: card
    topic: quasi
    front: Why are quasi-experiments a concern for internal validity, and what is internal validity?
    back: >-
      The treatment and control groups may not be comparable at baseline. Internal validity is how sure the researcher can be
      that the treatment caused the change in the experimental group.
    src: { page: 100, quote: "Quasi-experiments are subject to concerns regarding internal validity, because the treatment and control groups may not be comparable at baseline (pre-intervention characteristics).\nInternal validity refers to the degree to which a researcher can be sure that the treatment was responsible for the change in the experimental group." }
    status: unverified
    tags: [high-yield]
  # ---------------- practice (slides 19, 107-121) ----------------
  - id: res.L07.099
    kind: mcq
    topic: practice
    stem: In a randomized controlled trial (RCT), a planned crossover design
    options:
      - Requires standardization
      - Must take into account possible residual effects
      - Enhances generalisability of the study
      - Eliminates the need for monitoring compliance
    answer: 1
    why:
      - Every trial needs standardization; it is not specific to crossover.
      - The first treatment can carry over into the second period, so a washout is needed.
      - A crossover suits chronic stable disease only, which narrows generalisability.
      - Compliance must still be monitored in each period.
    src: { page: 19, quote: "Question 5: In a RCT, a planned crossover design:\n  a. Requires standardization\n  b. Must take into account possible residual effects\n  c. Enhances generalisability of the study\n  d. Eliminates need for monitoring compliance/non compliance" }
    status: unverified
  - id: res.L07.100
    kind: card
    topic: practice
    front: When the sample size of a trial is increased, what happens to the confidence interval, the power and randomization balance?
    back: The confidence interval narrows, the power increases, and the risk of unbalanced randomization decreases.
    src: { page: 107, quote: "When increasing the sample size (e.g. by including more participants in a trial), which of the following statements are true:\n  a) The confidence interval increases\n  b) The confidence interval decreases\n  c) The power increases\n  d) The power decreases\n  e) The risk of unbalanced randomization decreases\nAnswer: b, c, e" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.101
    kind: mcq
    topic: practice
    stem: Comparing randomized controlled trials (RCTs) with cohort studies, which is generally true?
    options:
      - Both are prospective
      - RCT results are less likely to be generalisable than cohort results
      - RCT results are less likely to be affected by confounding
      - A, B and C are all true
      - None of the above is true
    answer: 2
    why:
      - Cohorts can be retrospective too, so this is not generally true.
      - The slide keys the confounding option; generalisability depends on the trial.
      - Randomization balances known and unknown confounders, which a cohort cannot do.
      - Only the confounding statement is keyed true.
      - The confounding statement is true.
    src: { page: 108, quote: "When comparing randomized controlled trials (RCT) to cohort studies, which of the following is generally true?\n  a. Both are prospective\n  b. The results of the RCT are less likely to be generalisable than the results of the cohort study.\n  c. The results of the RCT are less likely to be affected by confounding\n  d. A, B and C are all true\n  e. None of the above statements is true" }
    status: unverified
  - id: res.L07.102
    kind: mcq
    topic: practice
    stem: The purpose of a double-blind (double-masked) study is to
    options:
      - Achieve comparability of treated and untreated subjects
      - Reduce the effects of sampling variation
      - Avoid observer and subject bias
      - Introduce observer and subject bias
    answer: 2
    why:
      - Comparable groups come from randomization.
      - Sampling variation is reduced by a larger sample.
      - Hiding the treatment from both subject and observer stops each from biasing the outcome.
      - Blinding removes these biases.
    src: { page: 47, quote: "Step 10 - Ensure Blinding:\n  Knowledge of whether the participant is in a treatment or control group can influence behaviour\n  Overcome through blinding the participants and/or observer and/or data reviewer" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.103
    kind: mcq
    topic: practice
    stem: The major purpose of random assignment in a randomized controlled trial (RCT) is to
    options:
      - Facilitate double blinding
      - Facilitate measurement of outcome variables
      - Ensure study groups are comparable on baseline characteristics
      - Reduce ascertainment bias
    answer: 2
    why:
      - It helps blinding, but that is not its main purpose.
      - Measurement depends on protocols, not on allocation.
      - Randomization makes the groups comparable at baseline, including on unknown factors.
      - Ascertainment bias is reduced by blinding.
    src: { page: 110, quote: "The major purpose of random assignment in a RCT is to:\n  a. Facilitate double blinding\n  b. Facilitate measurement of outcome variables\n  c. Ensure study groups are comparable on baseline characteristics\n  d. Reduce ascertainment bias." }
    status: unverified
    tags: [high-yield]
  - id: res.L07.104
    kind: mcq
    topic: practice
    stem: Phase 1 trials are
    options:
      - Trials that recruit large numbers of subjects to compare treatments
      - Done after approval for post-marketing surveillance of rare effects
      - Multi-centred trials of efficacy against the standard treatment
      - Small studies of 20-80 subjects looking at the toxic and pharmacological effects of drugs
    answer: 3
    why:
      - Large numbers belong to phase 3.
      - Post-marketing surveillance is phase 4.
      - Multicentre trials are typically phase 3.
      - Phase 1 is the first, small, safety and pharmacology step.
    src: { page: 111, quote: "Phase 1 trials are:\n  a. Trials with large number of subjects are recruited\n  b. Done for post marketing surveillance\n  c. Multi-centered\n  d. Small studies with 20-80 patients looking at toxic & pharmacological effects of drugs\nAnswer: d" }
    status: unverified
  - id: res.L07.105
    kind: mcq
    topic: practice
    stem: >-
      Researchers used police and phone records to find 699 people with cell phones who had a car accident, and compared phone use
      just before the accident with phone use at the same time on a previous day. The risk was four times higher when using a phone.
      This study is
    options:
      - A randomized comparative experiment
      - An experiment without randomization
      - An observational study
      - A simple random sample
    answer: 2
    why:
      - Nobody was assigned to use a phone.
      - An experiment needs the investigator to assign the exposure.
      - The investigators only looked at records of what people did, so it is observational.
      - A simple random sample is a sampling method, not a design.
    src: { page: 112, quote: "Does using a cell phone while driving make an accident more likely? Researchers compared telephone company and police records to find 699 people who had cell phones and were also involved in an auto accident. Using phone billing records, they compared cell phone use in the period of the accident with cell phone use the same period on a previous day. Result: the risk of an accident was four times higher when using a cell phone. This study is:\n  a. A randomized comparative experiment\n  b. An experiment but without randomization\n  c. An observational study\n  d. A simple random sample\nAnswer: c" }
    status: unverified
