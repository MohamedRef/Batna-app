  - id: res.L09.020
    kind: card
    topic: ethics-basics
    front: "How is research defined (45 CFR 46.102(d))?"
    back: "A systematic investigation, including research development, testing and evaluation, designed to develop or contribute to generalizable knowledge."
    src: { page: 23, quote: "WHAT IS RESEARCH?\nResearch is defined as; \"a systematic investigation, including research development, testing and evaluation, designed to develop or contribute to GENERALIZABLE knowledge.\" 45 CFR 46.102(d)" }
    status: unverified
    tags: [definition, high-yield]
  - id: res.L09.021
    kind: card
    topic: ethics-basics
    front: "Define human subject research."
    back: "Research involving living individuals about whom the researcher obtains either data through intervention or interaction, or identifiable private information or human material."
    src: { page: 24, quote: "Human Subject Research\nA research Involving living individuals about whom the researcher obtains:\n  Data through intervention or interaction\n  OR\n  Identifiable Private/Human material AND information" }
    status: unverified
    tags: [definition, high-yield]
  - id: res.L09.022
    kind: card
    topic: ethics-basics
    front: "Research ethics balances which two goals?"
    back: "Advancement of science against protection of subject welfare and rights."
    src: { page: 25, quote: "BALANCING TWO GOALS\n  Advancement of Science\n  Protection of Subject Welfare/Rights" }
    status: unverified
