  - id: rheum.L13.lesson3
    title: "الـ Capillaroscopy: الطريقة والـ patterns"
    hook: "عدسة على جلد الضافر بتشوف أصغر أوعية في الجسم. لو اتعملت غلط هتشوف حاجات مش موجودة."
    minutes: 8
    pages: [215, 216]
    topics: [nfc, patterns]
    goals:
      - "تعرف ليه وإزاي بنعمل capillaroscopy"
      - "تفرّق الـ normal والـ early والـ active والـ late patterns وتعرف ليه بيمشوا بالترتيب ده"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L13.025]
        page: 215
        quote: "Nailfold capillaroscopy (NFC) is a non-invasive technique that visualizes the capillaries at the nailfold to assess microvascular involvement."
        title: "يعني إيه capillaroscopy؟"
        text: |
          ==Nailfold capillaroscopy (NFC)==: طريقة non-invasive بتشوف الـ capillaries عند الـ nailfold عشان تقيّم الـ microvascular involvement.

          بنعملها عشان:

          - تلقط **early microangiopathy** في الـ systemic sclerosis (SSc) والـ connective tissue diseases (CTDs) التانية.
          - تفرّق **primary من secondary Raynaud's**.
          - تتنبأ بالـ **internal organ involvement** في الـ SSc.
      - kind: explain
        page: 215
        quote: "Acclimatize patient to room temperature (20–22°C) for 15–20 minutes."
        title: "الـ Technique"
        text: |
          - **المكان**: nailfold صوابع **2 لـ 5**، والإبهام غالبًا بيتشال
          - **الأجهزة**: dermatoscope، videocapillaroscope، أو ophthalmoscope، مع ==immersion oil== أو gel
          - **التحضير**: المريض يقعد في أوضة **20–22 درجة** لمدة **15–20 دقيقة**، ومن غير caffeine أو سجاير أو برد قبلها

          ليه الـ nailfold بالذات؟ التفسير المقبول (مش في الكتاب): عند حافة الضافر الـ capillaries بتنام ==موازية للجلد== فتبان كلها بطولها كـ hairpin، في أي حتة تانية بتطلع عمودية فتشوف نقطة بس. والـ oil بيخلي طبقة الجلد الميتة شفافة.
      - kind: reveal
        page: 215
        quote: "Avoid caffeine, smoking, or cold exposure before the exam."
        prompt: "ليه نمنع السجاير والقهوة والبرد قبل الفحص؟"
        answer: "الـ caffeine والـ smoking والـ cold exposure التلاتة بيعملوا vasoconstriction في الأوعية الصغيرة، فالـ capillaries تبان أقل أو مقفولة ونقول dropout وهو مش موجود (false finding). والـ oil بيخلي الجلد شفاف فنشوف أوضح."
      - kind: figure
        page: 216
        quote: "Late pattern: Severe capillary loss, disorganized architecture, ramified capillaries."
        title: "من الطبيعي للـ late"
        alt: "Four panels stacked. Normal: a neat row of identical hairpin loops. Early: mostly normal loops with one or two enlarged loops and a small haemorrhage. Active: several giant loops, haemorrhage dots and a gap where loops are lost. Late: few loops left, wide empty avascular gaps and bushy branched capillaries."
        caption: "الصف بيبوظ تدريجيًا: loops أكبر، بعدين giant و نزيف، وفي الآخر فراغات و ramified capillaries."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <text x="5" y="18" class="t-sm t-b">Normal</text>
            <path d="M30 70V35a6 6 0 0 1 12 0V70M70 70V35a6 6 0 0 1 12 0V70M110 70V35a6 6 0 0 1 12 0V70M150 70V35a6 6 0 0 1 12 0V70M190 70V35a6 6 0 0 1 12 0V70M230 70V35a6 6 0 0 1 12 0V70M270 70V35a6 6 0 0 1 12 0V70" class="fg-ink"/>
            <text x="5" y="98" class="t-sm t-b">Early</text>
            <path d="M30 150V115a6 6 0 0 1 12 0V150M70 150V115a6 6 0 0 1 12 0V150M150 150V115a6 6 0 0 1 12 0V150M190 150V115a6 6 0 0 1 12 0V150M270 150V115a6 6 0 0 1 12 0V150" class="fg-ink"/>
            <path d="M105 150V112a12 12 0 0 1 24 0V150M225 150V112a12 12 0 0 1 24 0V150" class="fg-arrow-acc"/>
            <circle cx="168" cy="108" r="3" class="fg-dot-bad"/>
            <text x="5" y="178" class="t-sm t-b">Active</text>
            <path d="M30 230V195a6 6 0 0 1 12 0V230M260 230V195a6 6 0 0 1 12 0V230" class="fg-ink"/>
            <path d="M60 230V192a22 22 0 0 1 44 0V230M165 230V192a22 22 0 0 1 44 0V230" class="fg-arrow-acc"/>
