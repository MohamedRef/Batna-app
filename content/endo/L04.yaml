  # ---------- p58-61: myopathies ----------
  - id: endo.L04.106
    kind: card
    topic: myopathy
    front: In endocrine disorders, which is more common, muscle fatigue or true myopathy?
    back: Muscle fatigue is more common than true myopathy.
    src: { page: 58, quote: "Many endocrine disorders cause weakness. Muscle fatigue is more common than true myopathy. The cause of weakness is not well known. The serum CK is often normal (except in hypothyroidism & hypoparathyroidism & Conn s syndrome) & muscle histology is characterized by atrophy rather than the destruction of muscle fibers. Nearly, all endocrine myopathies respond to treatment." }
    status: unverified
