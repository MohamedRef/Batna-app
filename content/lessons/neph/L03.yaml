        quote: "Table 7: Pharmacologic treatments for heart failure\n| Medication | Benefits in patients with HFrEF not on dialysis | Benefits in patients with HFrEF on dialysis |\n| Beta blockers | Carvedilol, metoprolol, and bisoprolol; Increase survival; Improve symptoms and decrease HF hospitalization | Uncertain. Possible improvement in symptoms |\n| ACEI/ARB | Increases survival, improves symptoms, and decreases HF hospitalization | CONSENSUS, SOLVD-Treatment, Val-HeFT, CHARM. |\n| Mineralocorticoid receptor antagonists | Increases survival, improves symptoms, and decreases HF hospitalization | RALES Trial, EMPHASIS-HF Trial, EPHESUS Trial |\n| Loop diuretics | Reduces symptom burden | Minimizes weight gains between treatments if residual kidney function is present |\n| Digoxin | May improve symptoms, quality of life, and exercise tolerance in mild to moderate heart failure; no mortality benefit | Risks likely outweigh any potential benefits |\n| SGLT2 Inhibitors | Increases survival and decreases HF hospitalization | DAPA-HF, EMPEROR-Reduced, DELIVER, EMPEROR-Preserved. |\n| Angiotensin receptor-neprilysin antagonists | Increases survival and decreases HF hospitalization | PARADIGM-HF Trial |"
        title: "ليه الـ digoxin خطر على الغسيل؟"
        text: |
          الكتاب (Table 7): الـ **digoxin** على الـ dialysis = **risks likely outweigh any potential benefits**، وحتى من غير dialysis مالوش mortality benefit.

          التفسير المقبول (مش في الكتاب): الـ digoxin **بيطلع من الكلية**، **فـ** في الـ ESKD بيتراكم. والجلسة بتنزّل الـ K بسرعة، والـ K الواطي **بيزوّد** سُمّية الـ digoxin على القلب (arrhythmias). يعني عيان على الغسيل عنده الـ مستوى عالي والـ K بيتهز: أسوأ تركيبة.
      - kind: explain
        page: 76
        title: "Table 8: ICD و CRT"
        quote: "Table 8: Indications for primary prevention ICD and CRT\n| ICD | CRT |\n| LVEF ≤ 35% | LVEF ≤ 35% |\n| ≥40 d post MI if no revascularization, 3 mo if revascularized post-MI | Sinus rhythm with left bundle branch block and QRS ≥ 130 ms |\n| Expected survival > 1 y | Sinus rhythm with non-LBBB and QRS ≥ 150 ms |\n| ≥NYHA class 2 symptoms on appropriate medical therapy | ≥NYHA class 2 symptoms on appropriate medical therapy |\nAbbreviations: CRT, cardiac resynchronization therapy; ICD, implantable cardiac defibrillator; LVEF, left ventricular ejection fraction; MI, myocardial infarction; LBBB, left bundle branch block; NYHA, New York Heart Association."
        text: |
          الاتنين محتاجين ==left ventricular ejection fraction (LVEF) ≤35%== و **≥New York Heart Association (NYHA) class 2** على علاج مناسب.

          - **implantable cardiac defibrillator (ICD):** ≥**40 يوم** بعد الـ myocardial infarction (MI) لو من غير revascularization، أو **3 شهور** لو اتعمله، و expected survival >**1 سنة**.
          - **cardiac resynchronisation therapy (CRT):** sinus rhythm مع **left bundle branch block (LBBB) و QRS ≥130 ms**، أو **non-LBBB و QRS ≥150 ms**.

          الخطوة الجاية بتشرح **ليه** الشروط دي بالذات.
      - kind: explain
        page: 76
        quote: "Table 8: Indications for primary prevention ICD and CRT\n| ICD | CRT |\n| LVEF ≤ 35% | LVEF ≤ 35% |\n| ≥40 d post MI if no revascularization, 3 mo if revascularized post-MI | Sinus rhythm with left bundle branch block and QRS ≥ 130 ms |\n| Expected survival > 1 y | Sinus rhythm with non-LBBB and QRS ≥ 150 ms |\n| ≥NYHA class 2 symptoms on appropriate medical therapy | ≥NYHA class 2 symptoms on appropriate medical therapy |\nAbbreviations: CRT, cardiac resynchronization therapy; ICD, implantable cardiac defibrillator; LVEF, left ventricular ejection fraction; MI, myocardial infarction; LBBB, left bundle branch block; NYHA, New York Heart Association."
        title: "ليه الشروط دي بالذات للـ ICD و CRT؟"
        text: |
          الكتاب (Table 8): الـ **ICD** بعد **40 يوم** من الـ MI (أو **3 شهور** بعد revascularization) و **expected survival > 1 سنة**. الـ **CRT** مع **LBBB و QRS ≥ 130 ms** أو non-LBBB و QRS ≥ 150 ms.

          التفسير المقبول (مش في الكتاب):

          - **الانتظار بعد الـ MI:** الـ LVEF ممكن **يتحسّن** بعد الـ MI أو الـ revascularization، **فـ** بنستنى نشوف الرقم الحقيقي قبل ما نركّب جهاز.
          - **Survival > 1 سنة:** الـ ICD بيمنع **sudden death** بس، **يعني** لو العيان هيموت قريب من سبب تاني، الجهاز مش هيفرق.
          - **LBBB والـ QRS العريض:** البطين الشمال بينقبض **متأخر ومش متزامن**. الـ CRT بيرجّع الجزئين ينقبضوا مع بعض، **عشان** كده الفايدة أكبر كل ما الـ QRS أعرض والشكل LBBB.
      - kind: explain
        page: 76
        title: "الـ furosemide stress test"
        quote: "A loop diuretic challenge or furosemide stress test can be performed in patients with AKI by measuring the urine output after a dose of 1.0 to 1.5 mg/kg of intravenous furosemide.\nPatients who have a urine output <200 ml over the first 2 h are at increased risk of progressive AKI and potential need for renal replacement therapy (RRT); a 6-h urine output <600 ml is predictive of the need for RRT in patients with stage III AKI."
        text: |
          عيان عنده acute kidney injury (AKI): ادّيله ==1.0–1.5 mg/kg intravenous (IV) furosemide== وقيس البول.

          - أقل من **200 ml في أول 2 ساعة** ← risk أعلى لـ **progressive AKI** واحتمال **renal replacement therapy (RRT)**.
          - أقل من **600 ml في 6 ساعات** ← بيتنبأ بالحاجة لـ RRT في **stage III AKI**.

          التفسير المقبول (مش في الكتاب): العيان اللي الـ tubules بتاعته لسه شغالة بيطلّع بول كتير بعد الـ furosemide، **فـ** البول القليل **يعني** إن الـ injury شديد وغالبًا هيحتاج RRT.
      - kind: reveal
        page: 76
        quote: "A loop diuretic challenge or furosemide stress test can be performed in patients with AKI by measuring the urine output after a dose of 1.0 to 1.5 mg/kg of intravenous furosemide.\nPatients who have a urine output <200 ml over the first 2 h are at increased risk of progressive AKI and potential need for renal replacement therapy (RRT); a 6-h urine output <600 ml is predictive of the need for RRT in patients with stage III AKI."
        prompt: "ليه الـ furosemide بيقيس صحة الـ tubules؟"
        answer: |
          الـ furosemide لازم **يتفرز** من الـ proximal tubule علشان يوصل الـ loop ويشتغل. لو الـ tubules سليمة هيوصل ويطلّع **urine output** كتير؛ لو مجروحة مش هيوصل والـ urine هيفضل قليل، فالعيان في risk لـ **progressive AKI**.

          فالـ test عامل زي **stress test للقلب**، بس للـ tubules. (الشرح فسيولوجي؛ الأرقام من الكتاب.)
