  # ---------- p148: kidney size, hypertension, ESRD ----------
  - id: neph.L07.019
    kind: card
    topic: adpkd-renal
    front: What correlates with the manifestations of ADPKD?
    back: The severity of the structural abnormality (kidney enlargement) correlates with pain, hematuria, hypertension and renal impairment; enlargement eventually occurs in 100% of patients.
    src: { page: 148, quote: "Renal size increases with age, and renal enlargement eventually occurs in 100% of patients with ADPKD. The severity of the structural abnormality correlates with the manifestations of ADPKD, such as pain, hematuria, hypertension, and renal impairment.1 Massive renal enlargement can lead to compression of local structures, resulting in such complica-tions as inferior vena cava (IVC) compression and digestive symp-enlargement of renal cysts. The Consortium for Radiologic Imaging Studies of Polycystic Kidney Disease (CRISP), a prospective study of 241 patients by annual MRI, has shown that total kidney volume and cyst volumes increased exponentially.22 Rates of growth were relatively constant, averaging 5.3% per year, but highly variable from patient to patient. Baseline total kidney volume predicted the subsequent rate of increase in renal volume and decline in GFR.23 An imaging classification." }
    status: unverified
  - id: neph.L07.020
    kind: card
    topic: adpkd-renal
    front: What can massive renal enlargement compress?
    back: Local structures, such as the inferior vena cava, and the gut (digestive symptoms).
    src: { page: 148, quote: "Renal size increases with age, and renal enlargement eventually occurs in 100% of patients with ADPKD. The severity of the structural abnormality correlates with the manifestations of ADPKD, such as pain, hematuria, hypertension, and renal impairment.1 Massive renal enlargement can lead to compression of local structures, resulting in such complica-tions as inferior vena cava (IVC) compression and digestive symp-enlargement of renal cysts. The Consortium for Radiologic Imaging Studies of Polycystic Kidney Disease (CRISP), a prospective study of 241 patients by annual MRI, has shown that total kidney volume and cyst volumes increased exponentially.22 Rates of growth were relatively constant, averaging 5.3% per year, but highly variable from patient to patient. Baseline total kidney volume predicted the subsequent rate of increase in renal volume and decline in GFR.23 An imaging classification." }
    status: unverified
