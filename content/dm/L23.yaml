    text: "Inclisiran lowered LDL-C by {{c1::40-50%}} over {{c2::1.5 years}}, in FH and in non-FH high LDL-C."
    src: { page: 294, quote: "Inclisiran successfully lowered LDL-C levels by 40–50% over a 1.5-year period" }
    status: unverified
    tags: [numbers]
  # ---------- p295: bempedoic acid ----------
  - id: dm.L23.043
    kind: card
    topic: bempedoic
    front: What enzyme does bempedoic acid inhibit, and how is it given?
    back: ATP citrate lyase, a key enzyme in cholesterol biosynthesis (upstream of HMG-CoA reductase). It is an oral, once-daily, non-statin LDL-lowering drug (Nexletol).
    src: { page: 295, quote: "An inhibitor of ATP citrate lyase, a key enzyme involved In the cholesterol biosynthesis pathway." }
    status: unverified
    tags: [high-yield]
  - id: dm.L23.044
    kind: card
    topic: bempedoic
    front: What are the book's indications for bempedoic acid?
    back: "Adjunct to diet and maximally tolerated statin in adults with heterozygous FH or established ASCVD who need more LDL-C lowering."
    src: { page: 295, quote: "Bempedoic acid is indicated as an adjunct to diet and maximally tolerated statin therapy" }
