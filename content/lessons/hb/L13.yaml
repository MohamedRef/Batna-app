          </svg>
      - kind: explain
        page: 231
        title: "الأدوية الجديدة في جمل قصيرة"
        text: |
          - **24-norUDCA:** ناقصه **methylene group** فمبيتعملوش conjugation، بيدخل الـ **cholehepatic shunt** ويعمل **bicarbonate-rich choleresis**. Phase II (161): ALP نزل بالجرعة. القلق: progression في الـ **dominant strictures**.
          - **OCA (AESOP):** 5–10 mg/day نزّل الـ ALP. أهم side effect: **dose-dependent pruritus**.
          - **Cilofexor:** FXR agonist non-steroidal، نزّل ALP و GGT، well tolerated.
          - **NGM282** (FGF19 analog): الـ ALP **ما اتغيرش**، بس الـ fibrosis biomarkers اتحسنت.
          - **ATRA:** بيمنع الـ bile acid synthesis عن طريق FXR/RXR.
          - **Maralixibat** (ASBT inhibitor): **مفيش** تغيير مهم.
          - **Fibrates (PPAR):** ALP نزل 40% والهرش اتحسن، بس الـ **liver stiffness زادت** والـ ALP رجع بعد الإيقاف.
          - **Simtuzumab** (anti-LOXL2): **فشل** في الـ fibrosis.
          - **Immune drugs:** timolumab (anti-VAP-1)، cenicriviroc (ALP −18%)، vedolizumab (mixed)، vidofludimus (ALP طبيعي في 27.7%). الـ immunosuppressants التقليدية: فايدة مش واضحة، و **budesonide** زوّد الـ osteoporosis، و **infliximab** ما نفعش.
          - **Microbiome:** **vancomycin** نزّل الـ ALP والـ Mayo score، **minocycline** نفع و **rifaximin** لأ، **FMT** واعد، **probiotics** لأ.
          - **Others:** curcumin لأ، **DHA** نزّل الـ ALP، bexotegrast (αvβ6/αvβ1 → TGF-β)، hymecromone، Orbcel-C.
      - kind: sort
        page: 234
        prompt: "صنّف الأدوية حسب الـ mechanism:"
        bins: ["Bile acid / nuclear receptor", "Antifibrotic", "Immune", "Gut microbiome"]
        cards:
