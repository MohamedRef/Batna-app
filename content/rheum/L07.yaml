items:
  # ---------- p105-106: overview ----------
  - id: rheum.L07.001
    kind: card
    topic: overview
    front: Define the complement system and explain its name.
    back: A group of plasma and membrane proteins with a key role in innate and adaptive immunity. "Complement" refers to their ability to assist (complement) the antimicrobial activity of antibodies.
    src: { page: 105, quote: "Complement is a collective term for a group of plasma & membrane proteins that play a key role in innate and adaptive immunity. The term complement refers to the ability of these proteins to assist, or complement, the antimicrobial activity of antibodies. These proteins are activated in a cascade sequence consisting of proenzymes that undergo sequential proteolytic cleavage, in a mech similar to coagulation pathway." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.002
    kind: card
    topic: overview
    front: How are complement proteins activated?
    back: In a cascade of proenzymes that undergo sequential proteolytic cleavage, by a mechanism similar to the coagulation pathway.
    src: { page: 105, quote: "Complement is a collective term for a group of plasma & membrane proteins that play a key role in innate and adaptive immunity. The term complement refers to the ability of these proteins to assist, or complement, the antimicrobial activity of antibodies. These proteins are activated in a cascade sequence consisting of proenzymes that undergo sequential proteolytic cleavage, in a mech similar to coagulation pathway." }
    status: unverified
  - id: rheum.L07.003
    kind: card
    topic: overview
    front: Where are most complement components made, and by which other cells?
    back: Mostly by hepatocytes in the liver; also by blood monocytes, tissue macrophages, fibroblasts, and epithelial cells of the GI and genitourinary tracts.
    src: { page: 105, quote: "Most complement components are synthesized in the liver by hepatocytes, also by other cell types including: – blood monocytes, tissue macrophages, fibroblasts, – epithelial cells of gastrointestinal tracts, and genitourinary tracts." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.004
    kind: card
    topic: overview
    front: What is the most important function of complement?
    back: Modifying the pathogen membrane by coating its surface with clusters of complement activation fragments (opsonization).
    src: { page: 105, quote: "The most imp function of the complement system is to modify the membrane of a pathogen by coating its surface with clusters of C activation fragments (opsonization). The second function, is to activate cells to promote" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.005
    kind: card
    topic: overview
    front: What is the second general function of complement?
    back: Activating cells to promote inflammatory and immune responses, preparing the local environment for defense against infection.
    src: { page: 106, quote: "inflammatory & immune responses, thus prepares the local environment for defense against infection." }
    status: unverified
  - id: rheum.L07.006
    kind: cloze
    topic: overview
    text: "The low molecular weight fragments {{c1::C4a, C3a and C5a}} are called {{c2::anaphylatoxins}}, because in excess they cause a reaction resembling anaphylaxis."
    src: { page: 106, quote: "During the proteolytic steps of complement activation, mediators are released that activate nearby cells. These low MW fragments (C4a, C3a, C5a) are termed anaphylatoxins, because if released in excessive amounts can induce reaction resembling anaphylaxis." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.007
    kind: enumerate
    topic: overview
    prompt: Enumerate the three complement activation cascades.
    points: [Classical pathway, Alternative pathway, Lectin pathway]
    pass: 3
    hook: "الـ complement بيتفتح من 3 أبواب «الكلاسيكي، البديل، والـ lectin»: classical، alternative، lectin."
    src: { page: 106, quote: "There are three activation cascades:\n  Classic pathway (CP).\n  Alternative pathway (AP).\n  Lectin pathway (LP).\n    These pathways depend on different molecules for their initiation, but they converge to activate C3, which is the most abundant C protein in plasma (generate the same set of effect or molecules)." }
    status: unverified
  - id: rheum.L07.008
    kind: card
    topic: overview
    front: Where do the three complement pathways converge?
    back: On activating C3, the most abundant complement protein in plasma; they then generate the same set of effector molecules.
    src: { page: 106, quote: "These pathways depend on different molecules for their initiation, but they converge to activate C3, which is the most abundant C protein in plasma (generate the same set of effect or molecules)." }
    status: unverified
    tags: [high-yield]
