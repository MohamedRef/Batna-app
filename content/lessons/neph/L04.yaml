      - kind: explain
        page: 82
        quote: "| Category | Systolic blood pressure (mmHg) | Diastolic blood pressure (mmHg) |\n| Blood pressure: Optimal | <120 and | <80 |\n| Normal | 120-129 and/or | <80-84 |\n| High normal | 130-139 and/or | 85-89 |\n| Hypertension: Grade 1 (mild) | 140-159 and/or | 90-99 |\n| Grade 2 (moderate) | 160-179 and/or | 100-109 |\n| Grade 3 (severe) | ≥180 | ≥110 |\n| Isolated systolic hypertension: Grade 1 | 140-149 | <90 |\n| Grade 2 | >160 | <90 |\nThe European Societies of Hypertension and Cardiology Guidelines 2007 are based on clinical blood pressure and not values for ambulatory blood pressure measurement. Threshold blood pressure levels for the diagnosis of hypertension using self/home monitoring are >135/85 mmHg. For ambulatory monitoring, 24-hour values are >125/80 mmHg. If systolic blood pressure and diastolic blood pressure fall into different categories, the higher value should be taken for classification. \"Equivalent to prehypertension."
        title: "ليه ناخد الفئة الأعلى؟"
        text: |
          الكتاب: لو الـ SBP والـ DBP وقعوا في فئتين مختلفتين، **خد الأعلى**. والـ **isolated systolic** ليها grades لوحدها (140–149، و ≥160 مع DBP < 90).

          التفسير المقبول (مش في الكتاب): الخطر بيمشي ورا **الرقم الأوحش**. عيان 165/85 خطره زي grade 2، مش grade 1 **عشان** الـ diastolic طبيعي. والـ isolated systolic شائع في الكبار **لأن** الشرايين الكبيرة بتنشف، فالـ systolic يعلى والـ diastolic يقع.
      - kind: explain
        remind: [neph.L04.018, neph.L04.019, neph.L04.020]
        page: 82
        title: "الأسباب الثانوية"
        quote: "Endocrine:\n  Cushing's syndrome\n  Acromegaly\n  Thyroid disease\n  Hyperparathyroid disease\nCardiovascular:\n  Aortic coarctation\nAdrenal:\n  Conn's syndrome\n  Adrenal hyperplasia\n  Phaeochromocytoma\nDrugs:\n  NSAIDS\n  Oral contraceptives\n  Steroids\n  Carbenoxalone\n  Liquorice\n  Sympathomimetics\n  Vasopressin\n  Monoamine oxidase inhibitors (withtyramine)\nRenal:\n  Diabetic nephropathy\n  Chronic glomerulonephritis\n  Adult polycystic disease\n  Chronic tubulointerstitial nephritis\n  Renovascular disease"
        text: |
          - ==Renal==: diabetic nephropathy، chronic glomerulonephritis (GN)، adult polycystic disease، chronic tubulointerstitial nephritis (TIN)، **renovascular disease**.
          - **Endocrine:** Cushing، acromegaly، thyroid، hyperparathyroid.
          - **Adrenal:** **Conn**، adrenal hyperplasia، **phaeochromocytoma**.
          - **Cardiovascular:** aortic coarctation.
          - **Drugs:** non-steroidal anti-inflammatory drugs (NSAIDs)، oral contraceptive pills، steroids، carbenoxolone، liquorice، sympathomimetics، vasopressin، monoamine oxidase (MAO) inhibitors مع tyramine.

          التفسير المقبول (مش في الكتاب): الأسباب الـ **renal** أولهم **لأن** الكلية هي اللي بتظبط الصوديوم والـ renin، فأي مرض فيها بيرفع الضغط. والـ **endocrine/adrenal** بيرفعوه بهرمونات بتحبس صوديوم (Conn، Cushing) أو بتضيّق الأوعية (pheo).
      - kind: explain
        page: 82
        quote: "Endocrine:\n  Cushing's syndrome\n  Acromegaly\n  Thyroid disease\n  Hyperparathyroid disease\nCardiovascular:\n  Aortic coarctation\nAdrenal:\n  Conn's syndrome\n  Adrenal hyperplasia\n  Phaeochromocytoma\nDrugs:\n  NSAIDS\n  Oral contraceptives\n  Steroids\n  Carbenoxalone\n  Liquorice\n  Sympathomimetics\n  Vasopressin\n  Monoamine oxidase inhibitors (withtyramine)\nRenal:\n  Diabetic nephropathy\n  Chronic glomerulonephritis\n  Adult polycystic disease\n  Chronic tubulointerstitial nephritis\n  Renovascular disease"
        title: "ليه الأدوية دي بترفع الضغط؟"
        text: |
          الكتاب بيعدّ أدوية بترفع الضغط: NSAIDs، oral contraceptives، steroids، carbenoxolone، liquorice، sympathomimetics، vasopressin، و MAO inhibitors مع tyramine.

          التفسير المقبول (مش في الكتاب):

          - **NSAIDs:** بتقفل الـ prostaglandins اللي بتوسّع أوعية الكلية وتطلّع صوديوم، **فـ** الصوديوم يتحبس.
          - **Liquorice و carbenoxolone:** بيوقفوا الإنزيم اللي بيكسّر الـ cortisol في الكلية، **فـ** الـ cortisol يشتغل زي aldosterone: Na عالي و K واطي.
          - **Oral contraceptives:** الـ estrogen بيزوّد الـ angiotensinogen.
          - **Sympathomimetics و MAO inhibitors مع tyramine:** noradrenaline أكتر = vasoconstriction.
