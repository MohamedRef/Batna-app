        text: "الـ **transdermal** oestrogen مش بيعلّي الـ TBG، بس الـ **oral** بيعلّيه (بيعدّي على الكبد الأول). سؤال امتحان كلاسيكي."
      - kind: explain
        remind: [endo.L06.064]
        page: 109
        quote: "Drugs that bring competition for TH binding sites on TBG, albumin and transthyretin, include:\n  Furosemide (especially with doses >80 mg/day and when given intravenously).\n  Aspirin.\n  Nonsteroidal antiinflammatory drugs.\n  Phenytoin.\n  Heparin."
        title: "أدوية بتزاحم على الـ binding sites"
        text: |
          بتطرد الـ T4 والـ T3 من الـ TBG والـ albumin والـ transthyretin وبتبوّظ الـ FT4/FT3:

          - **Furosemide** (أكتر من 80 mg/day و intravenous (IV)).
          - **Aspirin**، **non-steroidal anti-inflammatory drugs (NSAIDs)**، **phenytoin**.
          - ==Heparin==: متقيسش FT4 أصلًا لو تقدر؛ ولو لازم، خد العينة **بعد 10 ساعات على الأقل** من آخر حقنة وحللها على طول.
      - kind: reveal
        page: 109
        quote: "Measurement of FT4 and FT3 is best avoided in patients receiving heparin therapy, However, when indicated, taking a blood sample ≥ 10 h after the last injection of heparin, and analysing it without delay, can help reduce the risk of artifactual hyperthyroxinaemia."
        prompt: "ارجع للـ hook: الـ FT4 العالي على الـ heparin جه منين؟ وليه «حلله على طول»؟"
        answer: "الكتاب بيسميه **artifactual hyperthyroxinaemia**، يعني رقم مش مرض. والـ heparin واحد من الأدوية اللي بتزاحم على الـ binding sites. التفسير المقبول (مش في الكتاب): الـ heparin بيشغّل إنزيم (lipase) بيطلّع free fatty acids، وهي اللي بتطرد الـ T4 من البروتين، والإنزيم بيفضل شغال **جوه الأنبوبة** بعد السحب. علشان كده الكتاب بيقول: اسحب بعد 10 ساعات على الأقل من الحقنة، وحلل العينة من غير تأخير."
      - kind: explain
        page: 109
        quote: "9. Distinguishing resistance to thyroid hormone (TRb RTH) from a TSH-secreting pituitary tumour (TSHoma).\nSomatostatin receptor ligand therapy →Most TSHomas respond."
        title: "RTH ولا TSHoma: ليه كل علامة بتفرق"
        text: |
          الاتنين بيدّوا **FT4 و FT3 عاليين مع TSH مش واطي**، فالتحليل لوحده مش هيفرّق. الكتاب بيدّي تلات علامات:
          - **Somatostatin receptor ligand (SRL)**: أغلب الـ TSHomas بتستجيب، لأن الورم عليه somatostatin receptors (زي ما شفنا في الـ NETs)، فالـ TSH يقع والهرمونات تنزل. في الـ RTH **مفيش تغيير مهم**.
          - **الأقارب من الدرجة الأولى** عندهم نفس الـ TFTs في الـ RTH، لأنه **وراثي**. الـ TSHoma ورم مش بيتورث كده.
          - **جين THRB**: موجود في الـ RTH، يعني الـ receptor بايظ والـ pituitary مش حاسس بالهرمون فبيفضل يفرز TSH.

          وده إجابة جزء من سؤال 2 في ص 110 عن الـ discordant TFTs.
