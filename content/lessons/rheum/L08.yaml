        answer: |
          لأن الـ major criteria نفسها بتقول المكان: **mid subclavian artery** في الناحيتين. الـ subclavian هو اللي بيغذي **الدراع**.

          التفسير المقبول (مش في الكتاب): لما ناحية تضيق أكتر من التانية، الدم اللي بيوصل للدراع ده **أقل**، فالضغط فيه **أوطى** والنبض **أضعف أو مش موجود**، والدراع بيوجع لما يشتغل (**limb claudication**). عشان كده اسمه زمان "**pulseless disease**". وعشان كده لازم **تقيس الضغط في الدراعين** في أي شابة عندها ضغط أو أعراض مش مفهومة.
      - kind: reveal
        page: 136
        quote: "Abdominal aorta lesion Narrowing, dilation or aneurysm, luminal irregularity or any combination 10. Coronary artery lesion Documented on angiography below the age of 30 years in the absence of risk factors like hyperlipidemia or diabetes mellitus."
        prompt: "ليه الـ coronary lesion بتتحسب بس تحت 30 سنة ومن غير risk factors؟"
        answer: |
          لأن فوق كده أو مع **hyperlipidaemia** أو **diabetes**، الـ atherosclerosis تفسرها. الشرط ده بيخلي الـ lesion **مالهاش تفسير تاني** غير الـ arteritis.
      - kind: figure
