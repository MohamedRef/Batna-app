items:
  # ---------- p40: interventions and history ----------
  - id: git.L02.001
    kind: card
    topic: history
    front: What does "intervention" mean in GIT?
    back: Any interference made to diagnose and treat a disease or to follow up its course.
    src: { page: 40, quote: "Interventions mean any interference which may occurs to diagnose and treat the disease or to follow-up its course." }
    status: unverified
  - id: git.L02.002
    kind: order
    topic: history
    prompt: Put these milestones of endoscopy in historical order.
    steps:
      - Fiber optic gastroscope (1958)
      - Colonoscopic polypectomy (1969)
      - Endoscopic sphincterotomy with bile duct stone extraction (1974)
      - Percutaneous endoscopic gastrostomy (1979)
      - Electronic (charge coupled device) endoscope (1983)
      - Endoscopic variceal ligation (1990)
      - Self-expanding metal stents (1996)
      - Endomicroscopy gives histological mucosal definition (2008)
    src: { page: 40, quote: "1958 Development of fiber optic gastroscope" }
    status: unverified
  - id: git.L02.003
    kind: cloze
    topic: history
    text: The fiber optic gastroscope was developed in {{c1::1958}}, and endoscopic variceal ligation was introduced in {{c2::1990}}.
    src: { page: 40, quote: "1990 Endoscopic variceal ligation" }
    status: unverified
    tags: [numbers]
  - id: git.L02.004
    kind: cloze
    topic: history
    text: Percutaneous endoscopic gastrostomy dates from {{c1::1979}}, and endoscopic injection sclerotherapy from {{c2::1980}}.
    src: { page: 40, quote: "1979 Percutaneous endoscopic gastrostomy 1980 Endoscopic injection sclerotherapy" }
    status: unverified
    tags: [numbers]
  - id: git.L02.005
    kind: cloze
    topic: history
    text: Endoscopic retrograde pancreatography came in {{c1::1968}} and endoscopic retrograde cholangiography in {{c2::1970}}.
    src: { page: 40, quote: "1968 Endoscopic retrograde pancreatography" }
    status: unverified
    tags: [numbers]
  # ---------- p41-43: enteroscopy ----------
  - id: git.L02.006
    kind: card
    topic: enteroscopy
    front: What is enteroscopy, and what is its major indication?
    back: Endoscopic examination of the small bowel. Its major indication is locating the site of obscure GI bleeding.
    src: { page: 41, quote: "The major indication is to locate a site of obscure GIT bleeding." }
    status: unverified
    tags: [high-yield]
  - id: git.L02.007
    kind: card
    topic: enteroscopy
    front: What do the enteroscope's working channels allow?
    back: Tissue sampling and therapeutic interventions in the small intestine.
    src: { page: 41, quote: "The enteroscope have working channels which allow tissue sampling & therapeutic interventions in the small intestine." }
    status: unverified
  - id: git.L02.008
    kind: enumerate
    topic: enteroscopy
    prompt: Enumerate the types of small bowel enteroscopy.
    points:
      - Enteroscopy using a colonoscope
      - Sonde enteroscope
      - Push enteroscope
      - Double balloon (push and pull) enteroscope
      - Intraoperative enteroscope
      - Spiral enteroscope
    pass: 5
    src: { page: 41, quote: "Enteroscopy using a colonoscope.  Sonde enteroscope.  Push enteroscope.  Double balloon (push and pull) enteroscope." }
    status: unverified
    tags: [high-yield]
  - id: git.L02.009
    kind: cloze
    topic: enteroscopy
    text: Enteroscopy is a {{c1::day-case}} procedure that takes between {{c2::45 minutes and 2 hours}} depending on the indication.
    src: { page: 41, quote: "Is a day-case procedure.  Takes between 45 m-2 h depending on the indication." }
    status: unverified
    tags: [numbers]
  - id: git.L02.010
    kind: card
    topic: enteroscopy
    front: Which gas insufflates the small bowel during enteroscopy, and why?
    back: Carbon dioxide, which minimizes bloating.
    src: { page: 41, quote: "Carbon dioxide is used to insufflate the small bowel which minimize bloating." }
    status: unverified
  - id: git.L02.011
    kind: card
    topic: enteroscopy
    front: How is the route of enteroscopy chosen, and what anesthesia is used?
    back: Through the mouth or the rectum depending on which part of the small bowel needs assessment; under sedation or short-acting general anesthesia, sometimes with fluoroscopy.
    src: { page: 41, quote: "Is performed through the mouth or the rectum depending on which part of the small bowel needs to be assessed." }
    status: unverified
  - id: git.L02.012
    kind: table
    topic: enteroscopy
    title: Indications for enteroscopy (book p41-42)
    columns: [Group, Indications]
    rows:
      - [Diagnostic, "Obscure GI bleeding; malabsorption and unexplained diarrhea; radiographic small bowel abnormalities; small bowel malignancy"]
      - [Therapeutic, "Thermocoagulation of bleeding lesions; placement of a jejunostomy tube"]
      - [Surveillance, Polyposis syndrome]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 42, quote: "Thermo coagulation of bleeding lesions. o Placement of jejonostomy tube. c) Surveillance o Polyposis syndrome." }
    status: unverified
    tags: [high-yield]
  - id: git.L02.013
    kind: enumerate
    topic: enteroscopy
    prompt: Enumerate the diagnostic indications for enteroscopy.
    points:
      - Obscure GI bleeding
      - Malabsorption and unexplained diarrhea
      - Exploration of radiographic small bowel abnormalities
      - Investigation of small bowel malignancy
    pass: 3
    src: { page: 41, quote: "Mal absorption and unexplained diarrhea. o Exploration of radiographic abnormalities of the small bowel." }
    status: unverified
  - id: git.L02.014
    kind: card
    topic: enteroscopy
    front: Which surveillance indication does the lecture give for enteroscopy?
    back: Polyposis syndrome.
    src: { page: 42, quote: "c) Surveillance o Polyposis syndrome." }
    status: unverified
  - id: git.L02.015
    kind: card
    topic: enteroscopy
    front: Which two approaches of double balloon enteroscopy does the lecture show?
    back: Antegrade (oral) DBE and retrograde (anal) DBE.
    src: { page: 43, quote: "Antegrade (oral) DBE Retrograde (anal) DBE" }
    status: unverified
  # ---------- p43-47: capsule ----------
  - id: git.L02.016
    kind: card
    topic: capsule
    front: What is wireless capsule endoscopy?
    back: A painless imaging system that shows the entire small bowel; the capsule transmits its images to a recording device.
    src: { page: 43, quote: "A new painless image system to show the entire small bowel." }
    status: unverified
  - id: git.L02.017
    kind: cloze
    topic: capsule
    text: The wireless capsule measures {{c1::11 x 25 mm}} and takes {{c2::2 frames per second}}.
    src: { page: 43, quote: "The capsule which measures 11x25 mm takes 2frames/sec and transmits the images to a recording device." }
    status: unverified
    tags: [high-yield, numbers]
  - id: git.L02.018
    kind: enumerate
    topic: capsule
    prompt: Enumerate the exclusion criteria for capsule endoscopy.
    points:
      - Mental or physical disorders
      - Swallowing problems
      - History of major GI surgery
      - Known fixed stricture or obstruction
    pass: 4
    src: { page: 44, quote: "Patients with mental or physical disorders  Swallowing problems  History of major GI surgery  Known fixed stricture or obstruction." }
    status: unverified
    tags: [high-yield]
  - id: git.L02.019
    kind: card
    topic: capsule
    front: Why is a known fixed stricture a contraindication to capsule endoscopy?
    back: It is a listed exclusion criterion; the capsule could get stuck at the narrowing.
    src: { page: 44, quote: "Known fixed stricture or obstruction." }
    status: unverified
  - id: git.L02.020
    kind: enumerate
    topic: capsule
    prompt: Mention the small bowel findings the lecture shows on capsule endoscopy (its answer to "indications of capsule endoscopy").
    points:
      - Tumors and masses (lymphoma, GIST, polypoid mass, polyp)
      - Vascular lesions and bleeding (phlebectasia, AVM, bleeding lesion)
      - Lymphangiectasia
      - NSAID stricture
      - Radiation enteritis
      - Sprue and villous drop-out
    pass: 4
    src: { page: 46, quote: "Lymphoma" }
    status: unverified
    tags: [book-question]
  - id: git.L02.021
    kind: card
    topic: capsule
    front: Which landmarks does the lecture's capsule sequence pass?
    back: The GE junction, jejunum and ileocecal valve.
    src: { page: 45, quote: "GE Junction" }
    status: unverified
  # ---------- p48: UTEGD ----------
  - id: git.L02.022
    kind: cloze
    topic: utegd
    text: Ultrathin EGD (UTEGD) became feasible with an ultrathin endoscope of {{c1::5.3 mm}}, as an alternative to {{c2::sedated trans-oral}} endoscopy.
    src: { page: 48, quote: "UTEGD became feasible with the introduction of ultrathin endoscope (5.3 mm) as an alternative to traditional sedated trans-oral endoscopy." }
    status: unverified
    tags: [numbers]
  - id: git.L02.023
    kind: card
    topic: utegd
    front: Why is UTEGD useful in cirrhosis?
    back: It needs no sedation and is well tolerated, so it is a rapid screening tool for the presence and size of varices.
    src: { page: 48, quote: "well tolerated in patients with liver cirrhosis as a rapid screening tool for detecting the presence and size of varices." }
    status: unverified
    tags: [high-yield]
  - id: git.L02.024
    kind: card
    topic: utegd
    front: Main disadvantage of UTEGD?
    back: The fiber-optic quality of the picture.
    src: { page: 48, quote: "The main disadvantage is the fiber-optic quality of the picture." }
    status: unverified
  # ---------- p48-55: image enhancement ----------
  - id: git.L02.025
    kind: enumerate
    topic: image-enhancement
    prompt: Mention the techniques for improving visualization of the GI surface.
    points:
      - Magnifying endoscopy
      - Tissue staining (chromoscopy)
      - Stereo-microscopy and real-time video processing to enhance image contrast
    pass: 3
    src: { page: 48, quote: "Stereo-microscopy and real-time video processing for enhancing endoscopic image contrast." }
    status: unverified
  - id: git.L02.026
    kind: enumerate
    topic: image-enhancement
    prompt: What does magnifying endoscopy require?
    points:
      - Deep sedation, because the focus range is limited (about 1 mm)
      - A flexible plastic cap on the tip to keep a close, fixed focus
      - Use of dyes
      - Electronic structure enhancement at the maximal level
    pass: 3
    src: { page: 48, quote: "Deep sedation: to avoid patient's movements as focus range is limited (about 1 mm)." }
    status: unverified
    tags: [high-yield]
  - id: git.L02.027
    kind: card
    topic: image-enhancement
    front: Why does magnifying endoscopy need deep sedation?
    back: To avoid patient movement, because the focus range is limited to about 1 mm.
    src: { page: 48, quote: "Deep sedation: to avoid patient's movements as focus range is limited (about 1 mm)." }
    status: unverified
  - id: git.L02.028
    kind: card
    topic: image-enhancement
    front: Cost and benefit of magnifying endoscopy?
    back: It is time consuming (about 3 times the examination time) but gives more accurate diagnosis, biopsies and subsequent excellent mucosal resection.
    src: { page: 48, quote: "Although it is a time consuming (examination time x3), magnifying endoscopy provides more accurate diagnosis" }
    status: unverified
  - id: git.L02.029
    kind: card
    topic: image-enhancement
    front: In whom is chromoendoscopy recommended as an add-on to conventional upper endoscopy?
    back: Patients at high risk for malignancy. It is easy, inexpensive, acceptable to patients and improves detection of dysplasia.
    src: { page: 49, quote: "It is recommended that it should be added to conventional upper GI endoscopy in patients at high risk for malignancy." }
    status: unverified
    tags: [high-yield]
  - id: git.L02.030
    kind: card
    topic: image-enhancement
    front: Which combination is important for detecting early malignant change and for successful endoscopic mucosal resection?
    back: Chromoendoscopy with high-resolution video endoscopy, magnifying endoscopy or endosonography.
    src: { page: 49, quote: "A combination of chromo-endoscopy, high resolution video endoscopy, magnifying endoscopy or endo-sonography is very important for detection of early malignant changes" }
    status: unverified
  - id: git.L02.031
    kind: table
    topic: image-enhancement
    title: Dyes used in chromoendoscopy (book p49)
    columns: [Dye class, Examples]
    rows:
      - [Absorptive, "Methylene blue, toluidine blue, crystal violet, Lugol's iodine"]
      - [Contrast, Indigo carmine]
      - [Reactive, "Congo red, phenol red"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 49, quote: "Absorptive dyes (methylene blue, toluidine blue, crystal violet, and Lugol's iodine)," }
    status: unverified
    tags: [high-yield]
  - id: git.L02.032
    kind: cloze
    topic: image-enhancement
    text: Indigo carmine is a {{c1::contrast}} dye, while Congo red and phenol red are {{c2::reactive}} dyes.
    src: { page: 49, quote: "Contrast dyes (indigo carmine),  Reactive dyes (Congo red and phenol red)." }
    status: unverified
  - id: git.L02.033
    kind: card
    topic: image-enhancement
    front: Chromoendoscopy with magnification can enlarge images how much?
    back: Several hundred-fold, by adjustable lenses.
    src: { page: 49, quote: "allows a several hundred-fold magnification of images by means of adjustable lenses." }
    status: unverified
  - id: git.L02.034
    kind: card
    topic: image-enhancement
    front: What is the big advantage of virtual (digital) chromoendoscopy over dye spraying?
    back: Chromoendoscopy-like images in a short time at the press of a button, without dyes, while keeping the traditional white-light view option.
    src: { page: 50, quote: "Generation of chromoendoscopy-like images in a short time, simply by pressing a button on the endoscope" }
    status: unverified
  - id: git.L02.035
    kind: card
    topic: image-enhancement
    front: In the lecture's gastric tumor example, what did indigo carmine spraying show?
    back: The margin of the tumor could be recognized endoscopically.
    src: { page: 50, quote: "After Indigo carmine dye-spraying, the margin" }
    status: unverified
  - id: git.L02.036
    kind: cloze
    topic: image-enhancement
    text: NBI can provide up to {{c1::1000}}-fold magnification and typically uses {{c2::blue and green}} light.
    src: { page: 52, quote: "NBI can provide up to 1000-fold magnification." }
    status: unverified
    tags: [high-yield, numbers]
  - id: git.L02.037
    kind: card
    topic: image-enhancement
    front: Why does NBI show superficial capillaries so well?
    back: Blue light is better absorbed by hemoglobin, which images superficial capillaries and mucosal patterns.
    src: { page: 52, quote: "Blue light is better absorption by hemoglobin, enabling imaging of superficial capillaries and superficial mucosal patterns." }
    status: unverified
    tags: [high-yield]
  - id: git.L02.038
    kind: cloze
    topic: image-enhancement
    text: The correlation between pathologic and NBI findings was {{c1::85.3%}}.
    src: { page: 52, quote: "The correlation between pathologic and NBI findings was 85.3%." }
    status: unverified
    tags: [numbers]
  - id: git.L02.039
    kind: cloze
    topic: image-enhancement
    text: Chromoendoscopy and NBI are {{c1::equally effective}} for differentiating neoplasia from non-neoplasia, with {{c2::100%}} sensitivity and {{c3::75%}} specificity.
    src: { page: 52, quote: "Chromoendoscopy and NBI are equally effective for differentiating neoplasia from non neoplasia, with 100% sensitivity and 75% specificity." }
    status: unverified
    tags: [high-yield, numbers]
  - id: git.L02.040
    kind: card
    topic: image-enhancement
    front: How does NBI compare with conventional endoscopy in early colorectal cancer?
    back: NBI is superior for the diagnosis of early-stage colorectal cancer.
    src: { page: 52, quote: "NBI is superior to conventional endoscopy for the diagnosis of early-stage colorectal cancer." }
    status: unverified
  - id: git.L02.041
    kind: card
    topic: image-enhancement
    front: What is FICE and how does it work?
    back: Flexible spectral imaging color enhancement, a software system that changes image colour in real time using virtual optical filters (changing the wavelength), creating 10 different images.
    src: { page: 53, quote: "FICE creates a contrast difference by changing the wave length of light by means of virtual optical filters and the software creates 10 different images." }
    status: unverified
  - id: git.L02.042
    kind: card
    topic: image-enhancement
    front: What contrast does FICE produce best?
    back: The greatest contrast between normal mucosa and early-stage neoplastic tissue.
    src: { page: 53, quote: "produces the greatest contrast between normal mucosa and early stage neoplastic tissue." }
    status: unverified
  - id: git.L02.043
    kind: card
    topic: image-enhancement
    front: How does I-Scan differ from NBI and chromoendoscopy?
    back: It is software-based, uses no dye (unlike chromoendoscopy) and no wavelength contrast (unlike NBI); it modifies each image element of the white-light image.
    src: { page: 53, quote: "I-SCAN does not make use of the contrast created by light of different wave lengths, as does NBI." }
    status: unverified
    tags: [high-yield]
  - id: git.L02.044
    kind: card
    topic: image-enhancement
    front: Which light source does confocal laser endomicroscopy (CLE) use?
    back: A laser rather than white light.
    src: { page: 54, quote: "CLE uses a laser rather than white light as a light source." }
    status: unverified
  - id: git.L02.045
    kind: card
    topic: image-enhancement
    front: What concept did CLE introduce?
    back: Optical biopsy, real-time noninvasive assessment of the cellular and molecular properties of tissue with in vivo histologic diagnosis.
    src: { page: 54, quote: "resulting in the concept of optical biopsy." }
    status: unverified
    tags: [high-yield]
  - id: git.L02.046
    kind: enumerate
    topic: image-enhancement
    prompt: Mention the features of the CLE system.
    points:
      - A miniature microscope on the endoscope tip gives in vivo histology
      - Images magnified several hundred-fold, with contrast media for cellular and molecular images
      - Two monitors, one for microscopic images and one for endoscopy
      - Horizontal cross-sectional images at various depths
      - Images can be recorded, stored and re-examined
    pass: 3
    src: { page: 54, quote: "The system also enables acquisition of horizontal cross-sectional images at various depths." }
    status: unverified
