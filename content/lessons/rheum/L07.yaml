        answer: |
          الكتاب بيقول الـ channel بيخلّي الـ **ions** والـ **small molecules** يعدّوا بحرية، والنتيجة **cell lysis**.

          التفسير المقبول (مش في الكتاب): الخلية جواها بروتينات كتير ما تقدرش تخرج من الثقب، فالمية بتدخل ورا الأيونات (شكل ص 117 راسم المية داخلة)، والخلية **تنفخ لحد ما تنفجر**. وعشان كده الـ **poly-C9** مهم: كذا C9 بيلفّوا حلقة فالماسورة تبقى واسعة كفاية.
