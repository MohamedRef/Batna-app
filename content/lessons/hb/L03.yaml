              - "Non-selective beta-blocker (e.g. nadolol) and iron"
              - "Band ligation of the small varices"
              - "Argon plasma coagulation"
              - "Liver transplantation"
            answer: 0
            why: "ده **PHG** (mosaic/snakeskin في الـ proximal stomach). مصدره الضغط نفسه، فالعلاج إنك تنزّل الـ portal pressure بـ non-selective beta-blocker (NSBB) ومعاه iron. الـ varices الصغيرة مش هي اللي بتنزف."
          - reveal: "Woman 2: Hb 7.3. Flat red stripes radiate from the pylorus in the antrum, with some oozing."
            question: "Which treatment would be least effective here?"
            options:
              - "TIPS"
              - "Argon plasma coagulation"
              - "Endoscopic radiofrequency ablation"
              - "Antrectomy"
            answer: 0
            why: "ده **gastric antral vascular ectasia (GAVE) (watermelon stomach)**: خطوط في الـ **antrum**، ومش بيتسبب من الـ portal pressure، فالـ TIPS ما بيفيدش. العلاج موضعي (APC، radiofrequency ablation (RFA)، heater probe) أو جراحة. الفرق: PHG في الـ fundus وبتتحسن بنزول الضغط، GAVE في الـ antrum ومالهاش دعوة بالضغط."
