        why: "الهدف ← فين هتدوّر ← بأنهي كلمات ← دوّر وضيّق ← رتّب الورق ← طلّع المعلومة في matrix ← لخّص واستخدم."
      - kind: explain
        page: 97
        quote: "1. Review the Issue Statement and Purpose of the Search\n  The purpose of the search should be well outlined.\n  Keep in mind that searching is an iterative process, and a key is the ability to ask one or more answerable questions.\n  The overarching questions include: “Which evidence is relevant to my questions?” and “What conclusions can be drawn regarding effective intervention approaches based on the literature assembled?”"
        title: "خطوة 1: الهدف من الـ search"
        text: |
          - ==الهدف من الـ search== لازم يبقى واضح.
          - الـ search ==iterative process==، والمفتاح إنك تسأل سؤال أو أكتر ==answerable==.
          - الأسئلة الكبيرة: «Which evidence is relevant to my questions?» و «What conclusions can be drawn regarding effective intervention approaches based on the literature assembled?»

          ليه iterative؟ أول search بيعلّمك كلمات جديدة، فبترجع تعدّل السؤال وتدوّر تاني. التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 98
        title: "شريحة 98: قواعد البيانات اللي تختار منها"
        image: { file: res/L10-s98-databases.webp, book: true }
        alt: "Table 7-1, Computer-stored bibliographic databases, with columns database, dates, subjects covered, fee and website. PubMed, 1966 to present, the premier source for biomedical literature with references and abstracts from over 5200 journals, no fee. Current Contents, past year updated weekly, tables of contents of leading journals, fee. PsycINFO, 1887 to present, psychology and behavioral sciences, fee. Dissertation Abstracts Online, 1861 to present, American and Canadian doctoral dissertations, fee. CANCERLIT, 1966 to present, cancer literature, no fee. TOXLINE, 1980 to present, biochemical, pharmacologic, physiologic and toxicologic effects of drugs and other chemicals, no fee."
        caption: |
          دي الجدول اللي في خطوة **2. Select a bibliographic database**:

          - **الأعمدة**: اسم الـ database، من إمتى، بيغطي إيه، **Fee** (بفلوس ولا لأ)، والـ website.
          - **أول صف**: **PubMed** من 1966، أكبر مصدر للـ biomedical literature (أكتر من 5200 مجلة)، و**مجاني**.
          - **الباقي**: database للـ psychology، وواحدة لرسايل الدكتوراه، وواحدة للـ cancer، وواحدة للـ toxicology؛ وبعضها بفلوس.

          اللي تاخده: اختار الـ database ==حسب موضوعك==؛ والمحاضرة بتركّز على ==PubMed== لأنه الأكبر والمجاني.
      - kind: explain
        page: 99
        quote: "MEDLINE “PubMed”\n  It is a widely used database by scholars and the public for searching the biomedical literature.\n  It is maintained by the National Library of Medicine and has several advantages over other databases: it is free to users, updated frequently, and relatively user friendly."
        title: "MEDLINE (PubMed)"
        text: |
          - database مستخدمة جدًا من الباحثين والناس للـ ==biomedical literature==.
          - بتاعة ==National Library of Medicine==.
          - مميزاتها: ==free==، بتتحدث كتير، وسهلة نسبيًا.

          ليه نبدأ بيها؟ مجانية ومتحدثة، فأي باحث يقدر يوصلها من غير اشتراك. التفسير المقبول (مش في الكتاب).
