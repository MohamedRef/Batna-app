        alt: "Two book photomicrographs, H&E X400: above, proximal tubules with a pink brush border marked by arrows; below, tubules with a pale pink hyaline cast in one lumen marked by an arrow."
      - kind: explain
        page: 209
        title: "الـ proximal غير الـ distal"
        quote: "Normal histology of the kidney (Nephron tubules) Normal tubules"
        text: |
          الكتاب بيوري الـ **nephron tubules** من الـ proximal للـ collecting، وبعدين **normal tubules** بالـ H&E: الـ **proximal tubule** ليه ==brush border==، وأحيانًا تلاقي **hyaline cast** في الـ lumen. وفي الصفحة اللي بعدها: الـ **proximal tubules** ليها **prominent eosinophilic cytoplasm**، والـ **distal tubules** ليها ==clear less abundant cytoplasm==، وبينهم **interstitium** رفيع.

          ليه الفرق ده؟ التفسير المقبول (مش في الكتاب): الـ proximal tubule بيرجّع معظم الـ filtrate، فمحتاج **microvilli** كتير (الـ brush border) علشان مساحة الامتصاص، و **mitochondria** كتير علشان الطاقة، والـ mitochondria دي هي اللي بتخلّي الـ cytoplasm أحمر (eosinophilic). الـ distal شغله أقل فخلاياه أفتح. وعلشان كده لما الـ brush border يختفي في biopsy، ده من أول علامات الـ **acute tubular injury**.

          ليه ده بيهم في الـ cases؟ التفسير المقبول (مش في الكتاب): كل مرض بيضرب جزء معين. الـ **proximal** فيه brush border وبيشتغل كتير فبيتعب من الـ ischemia والسموم (ATN). الـ **distal** هو المكان اللي الـ light chains بتمسك فيه في الـ Tamm–Horsfall وتعمل casts (case 9)، وفي Fabry الـ distal tubules هي اللي اتملت vacuoles (case 11). يعني لما التقرير يقول «distal tubules showed…» فده مفتاح.
