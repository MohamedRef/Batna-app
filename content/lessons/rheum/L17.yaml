  - id: rheum.L17.lesson7
    title: "الكورس والتحاليل والصور: من الـ DISH للـ bamboo spine"
    hook: "الضهر ممكن يلحم كله والعيان يفضل شغال، إلا لو الـ hip اتمسك. والـ X-ray بيتأخر سنين، والـ MRI بيشوف النار بدري."
    minutes: 9
    pages: [285, 286]
    topics: [course, imaging]
    goals:
      - "تعرف الـ prognosis وليه الـ hips بتحدده"
