          - { text: "Claimants exaggerate pain to raise compensation", bin: 1 }
          - { text: "High-risk people refuse to join the survey", bin: 2 }
          - { text: "Only survivors are studied in a case-control study", bin: 2 }
        why: "Recall = ذاكرة مختلفة بين المرضى والأصحاء. Prevarication = بيغيّر الحقيقة عن قصد. Selection = مين دخل الدراسة أصلًا."
      - kind: check
