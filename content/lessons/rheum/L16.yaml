      - kind: check
        page: 242
        quote: "Macrophage produce:\n  IL6: stimulates acute phase response (ESR CRP).\n  IL-8 chemotactic to polymorphs → * Toxic oxygen radicals.\n  Prostaglandins.\n  Leukotrienes."
        question: "العيانة عندها ESR و CRP عاليين. مين الـ cytokine المسؤول في الكتاب؟"
        options: ["IL-6", "IL-2", "IL-8", "IFN-γ"]
        answer: 0
        why:
          - "صح: الـ IL-6 من الـ macrophage بيشغّل الـ acute phase response."
          - "IL-2 من الـ Th1 بيشغّل الـ lymphocytes."
          - "IL-8 بينادي على الـ polymorphs."
          - "IFN-γ بيشغّل الـ macrophage."
      - kind: explain
        page: 242
        title: "IL-1 و TNF: الاتنين اللي بيهدّوا"
        quote: "IL1—TNF\n I. Activate synovial fibroblasts and chondrocytes\n a) Metalloproteinases  cartilage destruction.\n b) PGE2  demineralization and destruction of bone."
        text: |
          الكتاب بيدّي الـ **IL-1** والـ **TNF** تلات شغلانات، وكل واحدة ليها سبب واضح:

          - **بيشغّلوا الـ synovial fibroblasts والـ chondrocytes**: يطلّعوا ==metalloproteinases== تاكل الغضروف، و **PGE2** يعمل demineralization للعضم. التفسير المقبول (مش في الكتاب): الـ metalloproteinases إنزيمات بتقطّع الـ collagen والـ proteoglycans اللي الغضروف معمول منها، والـ PGE2 بيشغّل الـ osteoclasts اللي بتاكل العضم. يعني الغضروف بيتهدّ **من جوّه** بإيد خلاياه هو.
          - **Adhesion molecules**: الأوعية تبقى "لزقة" فخلايا الالتهاب تمسك فيها وتعدّي للمفصل.
          - **Angiogenesis**: أوعية جديدة تغذّي الـ synovium اللي بيتكاثر.

          وعلشان كده لما نوصل للعلاج، أقوى دوا بيوقف حاجة واحدة هو الـ ==anti-TNF==: انت بتقطع الراس اللي بتشغّل التلات حاجات دول مرة واحدة. والـ **IL-17** من الـ Th17 بيزوّد النار.
      - kind: reveal
        page: 242
        quote: "II. Upregulation of adhestion molecules with cell recruitement. III. Stimulation of angiogenesis to supply the proliferating synovium."
        prompt: "ليه الـ IL-1 و TNF بيعملوا angiogenesis؟ إيه فايدة الأوعية الجديدة للمرض؟"
        answer: "الـ **synovium** بيتكاثر وبيتحوّل لنسيج تخين، ومحتاج دم يغذّيه. الأوعية الجديدة هي خط الإمداد بتاع الـ pannus. ومع **adhesion molecules** زيادة، خلايا التهاب أكتر بتدخل."
      - kind: check
        page: 242
        quote: "Th1 produce:\n - IL2,  stimulates lymphocytes.\n  IFN : stimulate macrophage."
        question: "مين اللي بيرجع يشغّل الـ macrophage في الحلقة المفرغة بتاعة الـ RA؟"
        options: ["IFN-γ من الـ Th1", "IL-6 من الـ macrophage", "IL-8 من الـ macrophage", "PGE2 من الـ fibroblasts"]
        answer: 0
        why:
          - "صح: الـ macrophage يقدّم antigen للـ Th1، والـ Th1 يرد بـ IFN-γ يشغّله أكتر. دي الحلقة اللي بتخلّي المرض يكمّل لوحده."
          - "الـ IL-6 بيروح للكبد يعمل acute phase response (ESR و CRP)."
          - "الـ IL-8 بينادي الـ polymorphs."
          - "الـ PGE2 بيعمل demineralization للعضم."
      - kind: explain
        page: 242
        title: "والـ B cells؟"
        quote: "Some contribution of B lymphocytes → plasma cells →antibodies → immune complexes that may be responsible for some of extra- articular features."
        text: |
          الأساس **cell-mediated** (macrophage + Th1).

          بس الـ **B cells** ليها دور: بتبقى plasma cells تعمل antibodies و ==immune complexes==، ودي ممكن تكون سبب جزء من الـ **extra-articular features**.
      - kind: try
        items: [rheum.L16.004, rheum.L16.006, rheum.L16.010, rheum.L16.011, rheum.L16.013]
    recap:
      - "RA: symmetrical deforming polyarthritis؛ 1%؛ F:M = 2:1."
      - "Gene (DR1، DR4، shared epitope) = استعداد؛ antigen محتمل = شرارة؛ autoimmunity بتكمّل لوحدها."
      - "Macrophage ↔ Th1 (IL-2، IFN-γ) حلقة مفرغة. Macrophage: IL-6 (ESR/CRP)، IL-8 (polymorphs)."
      - "IL-1 + TNF: metalloproteinases (غضروف)، PGE2 (عضم)، adhesion، angiogenesis. IL-17 من Th17."
      - "B cells → immune complexes → جزء من الـ extra-articular features."
    practice: [rheum.L16.001, rheum.L16.002, rheum.L16.003, rheum.L16.004, rheum.L16.005, rheum.L16.006, rheum.L16.007, rheum.L16.008, rheum.L16.009, rheum.L16.010, rheum.L16.011, rheum.L16.012, rheum.L16.013, rheum.L16.014, rheum.L16.015]
