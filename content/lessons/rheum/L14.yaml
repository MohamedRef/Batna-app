        title: "الـ FRAX"
        text: |
          الـ ==Fracture Risk Assessment Tool (FRAX)== بيقدّر احتمال الكسر في **10 سنين**:

          - **Hip fracture**.
          - **Major osteoporotic fracture**.

          وينفع **بالـ BMD أو من غيره**. أهميته: مريضة osteopenia بس الـ FRAX عالي، تتعالج.

          التفسير المقبول (مش في الكتاب): ليه محتاجينه؟ لأن الـ T-score بيقيس الكثافة بس، والـ FRAX بيضيف السن والـ risk factors، فبيلقط اللي رقمها لسه ما وصلش −2.5 وخطرها عالي.
