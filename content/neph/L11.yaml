  - id: neph.L11.097
    kind: cloze
    topic: dialysis-contraception
    text: "Only {{c1::46%}} of US nephrologists counseled women about contraception, and contraceptive use on dialysis was only {{c2::5.3%}}."
    src: { page: 368, quote: "by both gynecologists and nephrologists, it is often overlooked by nephrologists. A survey performed in the United States by Sachdeva et a (39) showed that only 46% of nephrologists or their staff members counseled childbearing women about contraception. There is limited education and training on how to discuss and address reproductive health for women with kidney failure, which may result in a lack of confidence. Consequently, contraceptive use in female patients on maintenance dialysis is low. A retrospective cohort study evaluated contraceptive use in>35,000 women receiving dialysis included in the United States Renal Data System and reported it to be only 5.3%. (40) Increased education and knowledge are needed in the community to encourage more robust conversations with health care providers regarding family planning, leading to shared decision-making and ultimately improving care." }
    status: unverified
    tags: [numbers]
  - id: neph.L11.098
    kind: card
    topic: dialysis-contraception
    front: In which dialysis patients should combined estrogen-progestin contraceptives be used with caution, and why?
    back: Uncontrolled hypertension, or lupus with positive antiphospholipid antibodies, because estrogen raises cardiovascular and thrombotic risk.
    src: { page: 368, quote: "Contraceptive methods include agents containing estrogen and progesterone (pill, ring, and patch), progesterone-only agents (injection and pill), intrauterine devices, barrier methods, and sterilization. Fig2 outlines the advantages and disadvantages associated with various contraceptive options. Oral contraceptive agents containing estrogen/progestin are commonly recommended to women of childbearing age as an effective birth control method and are associated with benefits, such as protection against ovarian cancer and endometrial cancer.(41,42) On the contrary, combined hormonal contraceptives are associated with an increased risk of hypertension, cervical cancer, breast cancer, and ischemic stroke.(43,44) Combined hormonal contraceptives, containing both estrogen and progesterone, should be used with caution in patients receiving dialysis with uncontrolled hypertension or systemic lupus with positive antiphospholipid antibodies, because estrogen-containing contraceptives are associated with increased cardiovascular and thrombotic risks.(45) Progestin-only contraceptives may be used as an alternative as they have not been linked with worsening hypertension or ovarian, endometrial, and" }
    status: unverified
    tags: [high-yield]
