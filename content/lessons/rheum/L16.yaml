  - id: rheum.L16.lesson4
    title: "الـ RA برّه المفصل: من العين لحد الرقبة"
    hook: "الـ RA مش مرض مفاصل وبس. ده بيلف على الجسم كله، وأخطر محطة فيه الرقبة."
    minutes: 9
    pages: [250, 256]
    topics: [extra-general, vasculitis-eye, heart-lung, neuro]
    goals:
      - "تعدّ الـ extra-articular features بالترتيب"
      - "تفرّق episcleritis من scleritis"
      - "تعرف الـ RA effusion و Caplan و الـ atlantoaxial subluxation"
    status: unverified
    steps:
      - kind: figure
        page: 250
        quote: "Fever, fatigue, weight loss, susceptibility to infection."
        title: "خريطة الجسم"
        alt: "A body map listing extra-articular features of RA by system from top to bottom: eye (episcleritis, scleritis, scleromalacia, corneal melting, Sjogren), neck (atlantoaxial subluxation), chest (pleurisy, effusion, interstitial fibrosis, nodules and Caplan, bronchiolitis obliterans; pericarditis, myocarditis, heart block, valve regurgitation), blood (anaemia, thrombocytosis, splenomegaly and Felty), skin (nodules, vasculitis), nerves (entrapment, neuropathy, mononeuritis multiplex)."
        caption: "لفّة على الجسم من فوق لتحت. كل صندوق = system ليه أسئلته. وفوقهم كلهم أعراض **systemic**: fever، fatigue، weight loss، و susceptibility to infection."
        svg: |
          <svg viewBox="0 0 330 380" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="50" rx="8" class="fg-acc"/>
            <text x="20" y="30" class="t-b">Eye</text>
            <text x="20" y="48" class="t-sm">episcleritis, scleritis, scleromalacia, cornea, Sjogren</text>
            <rect x="10" y="68" width="310" height="40" rx="8" class="fg-bad"/>
            <text x="20" y="93" class="t-b">Neck: atlantoaxial subluxation</text>
            <rect x="10" y="116" width="310" height="60" rx="8" class="fg-box"/>
            <text x="20" y="136" class="t-b">Lung</text>
            <text x="20" y="153" class="t-sm">pleurisy, effusion (low glucose), fibrosis,</text>
            <text x="20" y="168" class="t-sm">nodules (Caplan), bronchiolitis obliterans</text>
            <rect x="10" y="184" width="310" height="45" rx="8" class="fg-box"/>
            <text x="20" y="204" class="t-b">Heart</text>
            <text x="20" y="220" class="t-sm">pericarditis 30%, myocarditis, block, AR/MR</text>
            <rect x="10" y="237" width="310" height="45" rx="8" class="fg-box"/>
            <text x="20" y="257" class="t-b">Blood + spleen</text>
            <text x="20" y="273" class="t-sm">ACD, iron deficiency, platelets up, Felty</text>
            <rect x="10" y="290" width="310" height="40" rx="8" class="fg-box"/>
            <text x="20" y="315" class="t-sm"><tspan class="t-b">Skin:</tspan> nodules, vasculitis, pyoderma</text>
            <rect x="10" y="338" width="310" height="38" rx="8" class="fg-box"/>
            <text x="20" y="362" class="t-sm"><tspan class="t-b">Nerves:</tspan> entrapment, neuropathy, MNM</text>
          </svg>
      - kind: explain
        page: 251
        title: "الدم"
        quote: "Normochromic normocytic anaemia, of chronic disease."
        text: |
          - **Anaemia of chronic disease**: normochromic normocytic.
          - **Iron deficiency**: من erosions في الـ GIT بسبب الـ ==NSAIDs== والـ steroids.
          - **Thrombocytosis** = المرض ==active==.
          - **Splenomegaly** و **Felty's syndrome**.
      - kind: explain
        page: 251
        title: "الـ nodules"
        quote: "found at sites of pressure or friction sites such as extensor surface of forearm, sacrum, Achilles tendon and toes."
        text: |
          الـ ==rheumatoid nodules== في الـ **seropositive**. ممكن تكون طرية ومتحركة أو ناشفة وثابتة.

          مكانها: أماكن **الضغط والاحتكاك**: extensor forearm (الكوع)، الـ sacrum، الـ Achilles، الصوابع.
      - kind: explain
        page: 252
        title: "الـ vasculitis"
        quote: "Digital arteries: nailfold infarcts. Palpable purpura. Ulcers. Pyoderma gangrenosum. Mononeuritis multiplex."
        text: |
          - Digital arteries: ==nailfold infarcts==
          - Palpable purpura، ulcers، pyoderma gangrenosum
          - **Mononeuritis multiplex**
          - نادرًا medium arteries: mesenteric، renal، coronary occlusion.
      - kind: table
        page: 253
        quote: "Episcleritis: red- painless-begnin-no discharge."
        title: "العين الحمرا في الـ RA"
        columns: ["Lesion", "Pain?", "Key"]
        rows:
          - ["Episcleritis", "Painless", "Benign, no discharge"]
          - ["Scleritis", "Painful", "Uveitis, glaucoma, vision loss"]
          - ["Scleromalacia", "Painless", "Thin sclera, blue choroid"]
          - ["Corneal melt", "Painful", "Thinning, perforation"]
        hide: [[0, 1], [1, 1], [2, 2], [3, 2]]
      - kind: aside
        tone: tip
        page: 253
        quote: "Scleritis: red- painful may lead to uveitis-secondary glaucoma –visual impairment."
        text: "قاعدة سريعة: عين حمرا **مش بتوجع** = episcleritis (اطمّن). عين حمرا **بتوجع** = **scleritis**، ودي ممكن تاخد النظر (uveitis، glaucoma)."
      - kind: explain
        page: 253
        title: "القلب والرئة"
        quote: "Interstitial fibrosis: Most common pulmonary manifestation, asymptomatic- lower lobes."
        text: |
          **القلب**: **pericarditis** في **30%** بس صامت (echo بيكشفه)، myocarditis، heart block، endocarditis، AR و MR، coronary vasculitis.

          **الرئة**:
          - cricoarytenoid: ألم في الحنجرة، dysphonia، ألم في البلع
          - pleurisy و **effusion**: ==low glucose== و LDH عالي؛ رجالة seropositive، صغير وفي ناحية واحدة
          - ==Interstitial fibrosis==: **الأشهر**، صامت، في الـ lower lobes
          - Nodules (ممكن تعمل cavity) + pneumoconiosis = **Caplan**
          - Bronchiolitis obliterans: ضيق نفس و hyperinflation، ممكن يموّت.
      - kind: match
        page: 253
        quote: "Rheumatoid nodule + pneumoconiosis Caplan‘s syndrome."
        prompt: "وصّل الوصف بالتشخيص:"
        pairs:
          - ["RA nodules + coal dust", "Caplan syndrome"]
          - ["Most common RA lung lesion", "Interstitial fibrosis"]
          - ["Dyspnoea + hyperinflation, may kill", "Bronchiolitis obliterans"]
          - ["RA + splenomegaly", "Felty syndrome"]
        why: "Caplan = nodules + pneumoconiosis. الـ fibrosis أشهر حاجة. الـ bronchiolitis obliterans هو اللي فيه hyperinflation. والـ Felty من الـ lymphatic features."
      - kind: explain
        page: 254
        title: "الأعصاب"
        quote: "Median nerve: carpal tunnel syndrome (C.T.S). Posterior tibial: tarsal tunnel syndrome (T.T.S)."
        text: |
          **Entrapment**: الـ synovium المنفوخ بيخنق العصب في نفق ضيق:
          - Median: ==carpal tunnel==
          - Posterior tibial: tarsal tunnel
          - Ulnar عند الكوع
          - Peroneal عند رأس الـ fibula

          وكمان peripheral neuropathy و mononeuritis multiplex.
      - kind: explain
        page: 255
        title: "أخطر محطة: الرقبة"
        quote: "erosion of transverse ligament around the posterior aspect of the odontoid peg. On neck flexion, peg moves posteriorly indenting the cord."
        text: |
          الـ ==transverse ligament== هو الحزام اللي ماسك الـ **odontoid peg** في مكانه. الـ RA بياكله.

          لما العيان يحني رقبته لقدّام، الـ peg يرجع لورا **ويدوس على الـ cord**:
          - occipital headache
          - paraesthesia و "كهربا" في الدراع
          - ضعف لحد **quadriparesis**.

          التشخيص: lateral X-ray في flexion و extension. المسافة بين الـ peg والـ atlas **أكتر من 3 mm** في الـ flexion = ==subluxation==.
      - kind: figure
        page: 256
        title: "Atlantoaxial subluxation في الكتاب"
        image: { file: rheum/L16-atlantoaxial-xray.webp, book: true }
        alt: "Book lateral cervical spine X-ray in flexion with a double-headed arrow marking a widened gap between the anterior arch of the atlas and the odontoid peg."
        caption: "السهم بيقيس المسافة بين الـ atlas والـ odontoid peg. لو **أكتر من 3 mm** في الـ flexion يبقى subluxation."
      - kind: case
        page: 255
        quote: "Lateral x ray in flexion and in extention if in flexion distance between odontoid peg and atlas > 3mm subluxation."
        stem: "A 60-year-old woman with 18 years of erosive RA is going for hip surgery. She mentions electric shocks in both arms when she looks down."
        steps:
          - question: "What do you fear?"
            options: ["Atlantoaxial subluxation", "Carpal tunnel syndrome", "Scleritis", "Caplan syndrome"]
            answer: 0
            why: "Neck flexion pushes the peg back on the cord when the transverse ligament is eroded (p255)."
          - question: "Which test?"
            options: ["Lateral cervical X-ray in flexion and extension", "Nerve conduction", "Echocardiography", "Hand X-ray"]
            answer: 0
            why: "Lateral views in flexion and extension; over 3 mm gap in flexion = subluxation."
      - kind: aside
        tone: exam
        page: 255
        quote: "Symptoms occipital headache, parathesia, electric shock in the arm, motor weakness (Quadreparesis)."
        text: "عيان RA قديم داخل عملية؟ اسأل عن الرقبة: **occipital headache**، paraesthesia، كهربا في الدراع. الـ **intubation** فيها neck flexion، وده بالظبط اللي بيخلي الـ peg يدوس على الـ cord."
      - kind: try
        items: [rheum.L16.060, rheum.L16.065, rheum.L16.070, rheum.L16.077, rheum.L16.081]
    recap:
      - "Blood: ACD، iron deficiency (NSAIDs)، thrombocytosis = active، Felty."
      - "Nodules في الـ seropositive عند أماكن الضغط."
      - "Vasculitis: nailfold infarcts، purpura، ulcers، pyoderma، MNM."
      - "Episcleritis مش بتوجع؛ scleritis بتوجع وخطيرة؛ scleromalacia زرقا."
      - "Pericarditis 30% صامت. Effusion: low glucose، LDH عالي. Fibrosis الأشهر. Caplan = nodules + pneumoconiosis."
      - "Atlantoaxial: transverse ligament اتاكل؛ أكتر من 3 mm في الـ flexion."
