  # ------------------------------------------------------------------
  - id: neph.L08.lesson1
    title: "إزاي تقرا renal biopsy"
    hook: "الـ biopsy مش صورة واحدة: دي presentation بتوجّهك، وخمس أنواع GN حسب اللي اترسّب، و4 compartments لازم تلف عليهم."
    minutes: 9
    pages: [199, 203]
    topics: [approach, classification]
    goals:
      - "تعرف خطوات قراءة الـ biopsy وتربطها بالـ presentation"
      - "تعرف ليه كل مرض في لستة الـ nephrotic أو الـ nephritic"
      - "تحفظ التقسيم الـ pathogenetic الخماسي للـ GN والتقسيم الجديد للـ MPGN وتفهم ليه الـ IF هو اللي بيقسم"
    status: unverified
    steps:
      - kind: explain
        page: 199
        title: "المحاضرة دي شكلها مختلف"
        quote: "An algorithmic approach to renal biopsy interpretation of glomerular diseases. Don't let what is expected based on clinical findings to cause you to see what is not present in the specimen."
        text: |
          المحاضرة دي كلها **cases** حقيقية من قسم الكلى في إسكندرية: عيان، labs، وبعدين **biopsy** بالـ light microscopy (LM) والـ immunohistochemistry (IH) والـ electron microscopy (EM)، وسؤال «What is your diagnosis?».

          علشان تحلها لازم الأول تعرف ==algorithmic approach== للـ biopsy: تبدأ بالـ **clinical data**، بعدين **light microscopy**، بعدين **immunohistology** و **electron microscopy**، وفي الآخر **integration** لكل حاجة مع بعض.

          وتحذير الكتاب: ما تخليش اللي **expected based on clinical findings** يخليك تشوف حاجة مش موجودة في العينة. «It does happen!» زي ما تكون مستني صاحبك، فكل واحد لابس قميص أزرق تفتكره هو.

          إزاي تذاكر المحاضرة دي؟ التفسير المقبول (مش في الكتاب): كل case امشي فيها بنفس الترتيب: **مين** العيان (سن، نوع، حمل، transplant)، وبعدين **أنهي presentation** من الستة، وبعدين الـ **labs** اللي بتشطب (C3، ANA، ANCA، anti-PLA2R، SPEP)، وفي الآخر الـ **biopsy**: LM يوصف، IF يقول النوع، EM يقول المكان. لو عملت كده كل مرة، الـ case بتتحل قبل ما توصل لسطر التشخيص، والسؤال في الامتحان بيبقى مجرد تأكيد.
      - kind: order
        page: 199
        quote: "An algorithmic approach to renal biopsy interpretation of glomerular diseases. Don't let what is expected based on clinical findings to cause you to see what is not present in the specimen."
        prompt: "رتّب خطوات قراءة الـ biopsy"
        steps:
          - "Preliminary review of clinical data"
          - "Light microscopy"
          - "Immunohistology and electron microscopy"
          - "Integration of all pathological and clinical data"
        why: "الكلينيك بيوجّه، الـ LM بيشوف الشكل، الـ immunofluorescence (IF) والـ EM بيقولوا الـ deposits فين ونوعها إيه، والـ integration بيقفل التشخيص."
      - kind: explain
        remind: [neph.L08.003]
        page: 199
        title: "6 presentations"
        quote: "Clinical presentations of different glomerular diseases Asymptomatic. Macroscopic hematuria. Nephritic syndrome. Nephrotic syndrome. RPGN. Chronic GN."
        text: |
          الـ glomerular disease بييجي بواحدة من ستة: **asymptomatic**، **macroscopic hematuria**، **nephritic**، **nephrotic**، **rapidly progressive glomerulonephritis (RPGN)**، و **chronic GN**.

          الـ ==nephrotic== = protein بيهرب من **podocyte** متعوّر (غالبًا من غير التهاب). الـ ==nephritic== = التهاب و cells بتكسّر الـ capillary، فـ **red blood cells (RBCs)** بتنزل.

          ليه ستة بالظبط؟ التفسير المقبول (مش في الكتاب): كل presentation بتجاوب على سؤالين: **فين** الضرر (podocyte ولا endothelium ولا mesangium) و **بأي سرعة**.
          - **asymptomatic** و **macroscopic hematuria**: ضرر خفيف غالبًا في الـ mesangium، فالـ RBCs بتعدي من غير ما الفلتر يقع.
          - **nephritic**: التهاب في الـ capillary نفسه، فالفلتر بيقل والضغط والـ edema بيطلعوا.
          - **RPGN**: نفس الالتهاب بس بيكسر الجدار ويعمل crescents، فالكلية بتقع في أسابيع.
          - **chronic GN**: أي واحد من دول لما يسيب scar.
          يعني لما تقرا الـ case الأول اسأل: أنهي واحدة من الستة؟ ده بيضيّق الـ DD قبل ما تبص للـ biopsy.
      - kind: sort
        page: 200
        quote: "Diseases typically causing nephrotic syndrome Focal segmental glomerulosclerosis (all variants). Idiopathic membranous glomerulopathy. Minimal change glomerulopathy."
        prompt: "Nephrotic ولا nephritic؟ (حسب لستة الكتاب)"
        bins: ["Nephrotic syndrome", "Hematuria and nephritis"]
        cards:
          - { text: "Minimal change glomerulopathy", bin: 0 }
          - { text: "Idiopathic membranous", bin: 0 }
          - { text: "Amyloidosis", bin: 0 }
          - { text: "Diabetic glomerulosclerosis", bin: 0 }
          - { text: "IgA nephropathy", bin: 1 }
          - { text: "Postinfectious GN", bin: 1 }
          - { text: "Alport syndrome", bin: 1 }
          - { text: "Thin basement membrane lesion", bin: 1 }
        why: "الأمراض اللي بتضرب الـ **podocyte** أو تملا الـ membrane بـ deposits (MCD، membranous، amyloid، diabetes) = nephrotic. الأمراض اللي فيها التهاب أو glomerular basement membrane (GBM) ضعيف (IgA، post-infectious glomerulonephritis (PIGN)، Alport، thin basement membrane) = hematuria و nephritis."
      - kind: explain
        page: 200
        title: "ليه الأمراض دي nephrotic والتانية nephritic؟"
        quote: "Diseases typically causing nephrotic syndrome Focal segmental glomerulosclerosis (all variants). Idiopathic membranous glomerulopathy. Minimal change glomerulopathy."
        text: |
          لستة الكتاب للـ **nephrotic syndrome** طويلة (14 مرض)، ولستة الـ **hematuria and nephritis** 8 أمراض. بدل ما تحفظهم رص، اسأل سؤال واحد: **المرض بيعمل إيه في الـ capillary wall؟**

          التفسير المقبول (مش في الكتاب)، علشان كل مرض يقعد في مكانه:
          - **بيضرب الـ podocyte من غير التهاب** (==minimal change==، **FSGS**، والـ preeclampsia): الفلتر بيسرّب protein، بس الـ capillary سليم فمفيش RBCs.
          - **بيرسّب حاجة في الغشا أو الـ mesangium** (**membranous**، **diabetic glomerulosclerosis**، **amyloidosis**، **fibrillary**، **immunotactoid**، **monoclonal immunoglobulin deposition disease (MIDD)**، **collagenofibrotic**، **C1q nephropathy**، والـ **MPGN type I** و **dense deposit disease**): الغشا بيتخن ويتشوّه فيعدّي protein كتير.
          - **التهاب بيكسّر الـ capillary** (**lupus**، **IgA**، **postinfectious**، **idiopathic immune complex proliferative GN**، **pauci-immune (ANCA)**، **anti-GBM**): الـ RBCs بتنزل مع الـ inflammation، يعني nephritic.
          - **غشا رفيع أو ضعيف من الولادة** (**thin basement membrane lesion** و **Alport**): الـ RBCs بتعدّي من شقوق صغيرة، يعني hematuria من غير التهاب.

          خلي بالك إن الكتاب حط الـ **MPGN type I** والـ **dense deposit disease** في الـ nephrotic، رغم إن فيهم proliferation. علشان كده الكلمة «typically»: ده الوش الغالب مش الوحيد.
      - kind: explain
        remind: [neph.L08.008, neph.L08.009]
        page: 201
        title: "أمراض مش GN بس بتعمل failure"
        quote: "Diseases other than GN that typically cause ARF:\n  Thrombotic microangiopathy (all types).\n  Acute tubulointerstitial nephritis.\n  Acute tubular necrosis.\n  Atheroembolization.\n  Light chain cast nephropathy.\n  Cortical necrosis."
        text: |
          **acute renal failure (ARF)** من غير GN: **thrombotic microangiopathy (TMA)** بكل أنواعه، **acute tubulointerstitial nephritis (TIN)**، **acute tubular necrosis (ATN)**، **atheroembolization**، ==light chain cast nephropathy==، و **cortical necrosis**.

          **chronic renal failure (CRF)** من غير GN: **arterionephrosclerosis**، **chronic sclerosing GN**، **end-stage renal disease (ESRD) not otherwise specified (NOS)**، و **chronic TIN**.

          ليه الكتاب حاطط القايمة دي في محاضرة عن الـ GN؟ التفسير المقبول (مش في الكتاب): لأن الـ biopsy بيتعمل عشان creatinine طالع، ومش كل creatinine طالع جاي من الـ glomerulus. القايمة مقسومة بالمكان:
          - **الأوعية**: TMA، atheroembolization، cortical necrosis، و arterionephrosclerosis.
          - **الـ tubules والـ interstitium**: TIN، ATN، و light chain cast nephropathy.
          - **ندبة نهائية**: chronic sclerosing GN و ESRD NOS، وهنا الـ biopsy مش هيقول السبب الأصلي.
          فلو الـ glomeruli في التقرير سليمة والـ creatinine عالي، روح على طول للـ tubules والأوعية. وده بالظبط اللي هتشوفه في case 9 (casts) و case 5 (TMA).
      - kind: mnemonic
        page: 201
        quote: "Pathogenetic classification of GN:\n  1. Immune-complex GN.\n  2. Pauci-immune GN.\n  3. Anti-GBM GN.\n  4. Monoclonal Ig GN.\n  5. C3 glomerulopathy."
        word: "IPAMC"
        parts:
          - { key: "I", text: "Immune-complex GN: IgA, lupus, infection-related" }
          - { key: "P", text: "Pauci-immune GN: MPO-ANCA, PR3-ANCA, ANCA-negative" }
          - { key: "A", text: "Anti-GBM GN" }
          - { key: "M", text: "Monoclonal Ig GN: monoclonal immunoglobulin deposition disease (MIDD), immunotactoid" }
          - { key: "C", text: "C3 glomerulopathy" }
        hook: "«I Pay A Monthly Check»: خمس أنواع للـ GN حسب السبب، مش حسب الشكل."
      - kind: explain
        page: 202
        title: "كل نوع وليه score"
        quote: "| Pathogenetic type | Specific disease entity | Pattern of injury: Focal or diffuse | Score or class |\n| Immune-complex GN | IgA nephropathy, IgA vasculitis, lupus nephritis, infection-related GN, fibrillary GN with polyclonal Ig deposits. | Mesangial, endocapillary, exudative, membranoproliferative, necrotizing, crescentic, sclerosing or multiple | Oxford/MEST scores for IgA nephropathy & ISN/RPS class for lupus nephritis |\n| Pauci-immune GN | MPO-ANCA GN, proteinase 3-ANCA GN, ANCA-negative GN | Necrotizing, crescentic, sclerosing, or multiple | Focal, crescentic, mixed, or sclerosing class (Berden/EUVAS class) |"
        text: |
          - **IgA nephropathy** ← ==Oxford/mesangial, endocapillary, segmental sclerosis, tubular atrophy (MEST)== score
          - **Lupus nephritis** ← ==International Society of Nephrology (ISN)/Renal Pathology Society (RPS)== class
          - **Pauci-immune GN** ← **Berden/European Vasculitis Study Group (EUVAS)** class: focal، crescentic، mixed، أو sclerosing

          ولاحظ إن الـ **fibrillary GN** ممكن يبقى immune-complex (polyclonal Ig) أو monoclonal Ig GN.

          ليه كل مرض ليه score لوحده؟ التفسير المقبول (مش في الكتاب): الـ score بيترجم الصورة لقرار علاج و prognosis.
          - الـ **MEST** في الـ IgA: كل حرف حاجة بتفرق في المآل؛ الـ mesangial والـ endocapillary نشاط ممكن يتعالج، والـ segmental sclerosis والـ tubular atrophy ندبة مش هترجع.
          - الـ **ISN/RPS** في الـ lupus: الـ class هو اللي بيقول محتاج induction قوي ولا لأ.
          - الـ **Berden** في الـ pauci-immune: نسبة الـ glomeruli السليمة مقابل الـ sclerosed بتتنبأ بالكلية هترجع ولا لأ.
          يعني التقرير من غير score نصه ناقص؛ الـ score هو اللي بيكلم الـ clinician.
      - kind: check
        page: 202
        quote: "Monoclonal Ig GN Monoclonal Ig deposition disease, proliferative GN with monoclonal Ig deposits, immunotactoid glomerulopathy, fibrillary GN with monoclonal Ig deposits."
        question: "A fibrillary GN biopsy shows deposits made of one light-chain type only (monoclonal). Which pathogenetic type is it?"
        options:
          - "Monoclonal Ig GN"
          - "Immune-complex GN"
          - "Pauci-immune GN"
          - "C3 glomerulopathy"
        answer: 0
        why:
          - "صح: الـ fibrillary GN بيتقسم حسب الـ Ig: لو **monoclonal** يبقى monoclonal Ig GN."
          - "الـ immune-complex هو الـ fibrillary اللي فيه **polyclonal** Ig. هنا الـ Ig من نوع واحد."
          - "الـ pauci-immune معناه تقريبًا مفيش Ig خالص."
          - "الـ C3 glomerulopathy فيه C3 من غير Ig."
      - kind: figure
        page: 203
        quote: "New classification of membranoproliferative GN\n  MPGN\n    Positive IgGs±C3 → Ig-mediated\n      Monoclonal gammopathies\n      Autoimmune diseases\n      Infections\n    Negative IgGs + C3 → Complement-mediated\n      C3 glomerulopathies\n        DDD\n        C3GN"
        title: "التقسيم الجديد للـ MPGN"
        alt: "Tree: MPGN splits by immunofluorescence. IgG plus C3 positive means immunoglobulin-mediated MPGN, from monoclonal gammopathies, autoimmune diseases or infections. IgG negative with C3 means complement-mediated MPGN, the C3 glomerulopathies: dense deposit disease and C3 GN."
        caption: "الـ IF هو اللي بيقسم: ==immunoglobulin G (IgG) + C3== = Ig-mediated، و **C3 لوحده** = complement-mediated (C3 glomerulopathy)."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="N8a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
