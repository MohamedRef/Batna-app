        image: { file: neph/L09-is-drug-classes.webp, book: true }
        alt: "Nine coloured tiles of immunosuppressive medications in transplant: CNIs cyclosporine and tacrolimus; antimetabolites MMF, MPA and azathioprine; mTOR inhibitors everolimus and sirolimus; IL-2 receptor antagonist basiliximab; antibody to human lymphocyte antigens thymoglobulin; anti-CD20 rituximab; plasma cell targeting bortezomib; complement inhibition eculizumab; costimulation blockade by CD80/86 belatacept."
        caption: |
          9 مربعات، كل واحد مجموعة ومثالها، من فوق لتحت:

          - **الصف الأول** (الـ maintenance): **CNIs** (cyclosporine، tacrolimus)، **antimetabolites** (MMF، MPA، azathioprine)، **mTOR inhibitors** (everolimus، sirolimus).
          - **الصف التاني** (الـ induction والـ antibodies): **IL-2 receptor antagonist** (basiliximab)، thymoglobulin، و anti-CD20 (rituximab).
          - **الصف التالت** (الأحدث، للـ antibody-mediated rejection وغيره): ==bortezomib== (plasma cells)، ==eculizumab== (complement)، و **belatacept** (costimulation blockade).

          اللي تاخده: الصف الأخير مش في قايمة الـ protocol اللي فوق؛ دول أدوية بتتوجّه للـ antibodies نفسها أو لـ signal 2.
