  - id: hem.L09.lesson9
    title: "علاج الـ PMF: شفا واحد وكتير من الدعم"
    hook: "الـ transplant بيشفي بس لقليلين، والـ ruxolitinib غيّر اللعبة، والطحال له تلات حلول كلهم ليهم تمن."
    minutes: 10
    pages: [151, 154]
    topics: [pmf-treatment]
    goals:
      - "تعرف مين ينفع له الـ allogeneic SCT ونتايجه"
      - "تعرف الـ ruxolitinib: فايدته وأعراضه وليه"
      - "ترتب علاج الأنيميا والطحال (سؤال كتاب)"
    status: unverified
    steps:
      - kind: explain
        page: 151
        title: "الشفا الوحيد: allogeneic SCT"
        quote: "The only curative treatment for PMF is allogeneic stem cell transplantation (SCT).\nSCT is only appropriate for a small proportion of patients, while for the remaining cases therapy remains supportive aiming at alleviating symptoms, but has little impact on the relatively poor survival of PMF patients.\nIn recent years, JAK inhibitors, specifically Ruxolitinib, have radically altered the therapeutic algorithm for the management of PMF."
        text: |
          ==The only curative treatment for PMF is allogeneic stem cell transplantation (SCT)==، بس مناسب لنسبة صغيرة.
          - الباقي العلاج **supportive**: بيخفّف الأعراض، و **little impact** على الـ survival.
          - الـ **JAK inhibitors** (الـ ruxolitinib) **radically altered** طريقة العلاج.
          - القرار حسب المريض: **age and general fitness**.

          ليه الـ transplant بس اللي بيشفي؟ التفسير المقبول (مش في الكتاب): المرض في الـ **stem cell** نفسها. أي دوا بيهدّي الـ clone بس سايبه موجود؛ الـ allogeneic SCT بيشيل النخاع كله ويحط **stem cells من متبرع** سليم، وكمان مناعة المتبرع بتهاجم أي clone فاضل.
      - kind: reveal
        page: 152
        quote: "It is only a realistic option in young patients who represent perhaps 10% of all cases.\nThe long-term survival of patients ≤45 years is approx. 50%, with a 30% transplant-related mortality.\nFor patients ≥45 years, outcomes are much worse, with long-term survival of 10–20%."
        prompt: "طالما بيشفي، ليه مش بنعمله لكل مرضى الـ PMF؟"
        answer: |
          لأنه ==only a realistic option in young patients== (حوالي **10%** بس)، وتمنه غالي:
          - **≤45 سنة**: long-term survival حوالي **50%**، و **transplant-related mortality 30%**.
          - **≥45**: survival **10–20%** بس.

          يعني حتى في الصغير، تقريبًا واحد من كل تلاتة بيموت من الـ transplant نفسه. وأغلب مرضى الـ PMF في **العقد السادس**، فالحسبة ما بتقفش معاهم.
      - kind: explain
        page: 152
        title: "Ruxolitinib"
        quote: "Evaluated in the Phase III COMFORT trials, ruxolitinib delivers benefit in control of symptoms and reduces splenomegaly, as well as improving survival for patients with intermediate-risk-2 and high-risk PMF, regardless of their JAK mutation status. These studies led to its FDA approval in PMF."
        text: |
          الـ **COMFORT trials**: الـ ==ruxolitinib== (JAK1/2 inhibitor) بيحسّن الأعراض، وبيصغّر الطحال، وبيحسّن الـ survival في **intermediate-2 و high-risk**، **regardless of Janus kinase (JAK) mutation status**.

          أعراضه:
          - **Anemia**: Hb بينزل حوالي **10%**، أقصاه في **12–16 أسبوع** وبعدين يتحسن.
          - **Thrombocytopenia**: الصفائح تنزل حوالي **40%**.
          - العلاج: dose modification، و erythropoietin (EPO) أو androgens.
          - **Rebound** للأعراض والطحال لو وقّفته.
          - **Herpes reactivation** و opportunistic infections.

          ليه بيشتغل حتى في اللي ما عندوش JAK2 mutation؟ وليه بيعمل أنيميا؟ التفسير المقبول (مش في الكتاب): الـ CALR والـ MPL برضه بيعدّوا إشارتهم **عن طريق JAK2**، فكل الـ MPN عندها نفس الطريق شغال زيادة. وفي نفس الوقت الـ EPO والـ TPO الطبيعيين محتاجين JAK2 عشان يعملوا كرات حمرا وصفائح، فلما توقّفه، النخاع السليم كمان بيقل. والـ **herpes** لأن الـ JAK بيشغّل إشارات المناعة كمان.
      - kind: figure
        page: 152
        quote: "Ruxolitinib causes anemia (a predictable fall in hemoglobin levels by 10%, peaking at 12–16 weeks and gradually resolving thereafter) and thrombocytopenia (fall in platelet levels by 40%)."
        title: "الـ Hb على الـ ruxolitinib"
        alt: "A line graph of hemoglobin over 30 weeks on ruxolitinib. It falls by about 10 percent to a lowest point at 12 to 16 weeks, shaded, then slowly recovers toward baseline."
        caption: "النزول ==متوقع== وبيرجع. ما توقفش الدوا بسببه؛ عدّل الجرعة."
        svg: |
