  - id: endo.L06.073
    kind: case
    topic: levothyroxine
    stem: A 45-year-old woman with post-thyroidectomy hypothyroidism needs 250 µg of levothyroxine but her TSH stays at 12 mU/L.
    steps:
      - question: What do you check first?
