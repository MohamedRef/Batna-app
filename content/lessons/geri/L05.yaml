        why: "ده ترتيب الكتاب في ص 87: الـ vertebrobasilar system هو اللي بيغذي الـ brain stem، والأعراض بتعتمد على أنهي فرع."
        lecturer:
          - tone: exam
            text: |
              من شرح د. علام: **Wallenberg** (الـ PICA في الكتاب) اسمه كمان **lateral medullary syndrome**، لأن الـ PICA بتغذي الـ lateral medulla، وهي حتة زحمة (مش في الكتاب):
              - في نفس الناحية: pain و temperature في الوش، **Horner syndrome**، **bulbar palsy** (بلع وصوت)، و**cerebellar** signs، ومعاهم vertigo.
              - في الناحية التانية: pain و temperature في نص الجسم.
              الوش في ناحية والجسم في التانية = ==crossed sensory loss==، دي علامته (مش في الكتاب).
      - kind: aside
        tone: analogy
        page: 87
        quote: "Locked in Syndrome: massive brain stem damage below third nerve nuclei, he has functioning cerebral cortex, but can not move or communicate except by vertical eye movements."
        text: "الـ **locked-in** زي واحد قاعد في أوضة بابها اتقفل عليه: المخ (الـ cortex) شغال ١٠٠٪ وسامع كل حاجة، بس الكابلات اللي نازلة اتقطعت. اللي فاضل له **vertical eye movements** بس. اوعى تتكلم قدامه كأنه مش فاهم."
      - kind: explain
        page: 87
        quote: "Occlusion of small penetrating branch of the major cerebral arteries (to the basal ganglia, thalamus, internal capsule & pons)? Due to atherosclerosis or degenerative changes in the arterial walls related to hypertension & possibly diabetes."
        title: "الـ lacunar والـ hypertensive encephalopathy"
        text: |
          **الـ lacunar infarct**: سدّة في ==small penetrating branch== من الشرايين الكبيرة، رايحة للـ basal ganglia، thalamus، internal capsule، pons.
          - السبب: atherosclerosis، أو تغيّرات في جدار الشريان من الـ **hypertension**، وممكن الـ diabetes.

          **الـ hypertensive encephalopathy**: severe headache، transient ischaemic attack (TIA)، stroke، ونادرًا subarachnoid Hge.
      - kind: explain
        page: 88
        quote: "Dementia that may follow a succession of cerebrovascular events or less commonly a single stroke."
        title: "لما الجلطات تتراكم: MID"
        text: |
          الـ ==multi-infarct dementia==: dementia بعد سلسلة **cerebrovascular events** (أو أقل: stroke واحدة)، لأن أوعية كتير بتغذي الـ cortex والـ subcortical اتصابت.

          ومعاها غالبًا **pseudobulbar syndrome** و**parkinsonism**.
      - kind: explain
        page: 88
        quote: "Border zone cerebral infarction:\n  Multiple cortical infarcts following prolonged periods of very low perfusion → memory loss, intellectual impairment & cortical blindness."
        title: "الـ PCA والـ border zone"
        text: |
          - **Posterior cerebral artery infarction**: hemianopic visual loss و**cortical blindness** (الـ PCA بتغذي الـ occipital).
          - ==Border zone infarction==: cortical infarcts كتير بعد فترات طويلة من **very low perfusion**، فيحصل memory loss، intellectual impairment، وcortical blindness.

          ليه الـ PCA بتعمل عمى؟ لأنها بتغذي الـ **occipital lobe** اللي فيه مركز النظر، فالعين نفسها سليمة بس المخ مش شايف (cortical blindness). وليه الـ border zone بتعمل memory loss وintellectual impairment؟ لأنها cortical infarcts **كتير** في نفس الوقت، فالضرر منتشر زي الـ multi-infarct dementia.
      - kind: reveal
        page: 88
        quote: "Border zone cerebral infarction:\n  Multiple cortical infarcts following prolonged periods of very low perfusion → memory loss, intellectual impairment & cortical blindness."
        prompt: "ليه الـ low perfusion بيضرب الـ border zone بالذات؟"
        answer: "الـ **border zone** هي آخر الخط بين منطقتين شريانين. لما الضغط يقع، الدم بيوصل للقريب الأول، والأطراف البعيدة (زي آخر بيت في آخر الشارع لما الميه تضعف) هي اللي تجوع. علشان كده بتشوفها بعد **cardiac arrest** أو hypotension طويل."
