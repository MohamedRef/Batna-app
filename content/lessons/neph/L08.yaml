  - id: neph.L08.lesson6
    title: "Spot diagnoses: casts و LCAT و Fabry"
    hook: "Casts متكسّرة، foam cells، ونيفروسيت شكلها دانتيل. تلات تشخيصات من نظرة."
    minutes: 9
    pages: [264, 277]
    topics: [cast, lcat, fabry]
    goals:
      - "تتعرف على الـ cast nephropathy من شكل الـ casts"
      - "تفكّر في LCAT deficiency عند nephrotic مع HDL واطي"
      - "تعرف Fabry وطريقة وراثته ومتابعته"
    status: unverified
    steps:
      - kind: explain
        page: 264
        title: "Case 9"
        quote: "2 months later, the patient presented to us with a sCr of 12 mg/dL and proteinuria 15.7 g/day."
        text: |
          ست **57 سنة** عندها HTN. الـ creatinine **3.5** بالصدفة، وبعد شهرين ==12 mg/dL== مع **proteinuria 15.7 g/day**. الكلى طبيعية على الـ U/S، والـ immune markers سلبية.

          جلسة HD واحدة، والـ biopsy اتأخر، فـ **pulse steroids** 5 أيام، والـ creatinine نزل لـ 5.5.
      - kind: reveal
        page: 265
        quote: "Tubules showed moderate injury with hyaline casts, some of them were fractured, lamellated and surrounded by a cellular reaction."
        prompt: "Casts في الـ tubules: fractured، lamellated، وحواليها cellular reaction. بتفكّرك بإيه؟"
        answer: "**Light chain cast nephropathy** (myeloma kidney). التقرير كتب «suggestive of a cast nephropathy, for clinical and serological evaluation»؛ يعني دوّر على الـ **monoclonal protein**."
      - kind: aside
        tone: tip
        page: 266
        quote: "Acute Tubular Injury, Suggestive of a Cast Nephropathy. For Clinical and Serological Evaluation."
        text: |
          التقرير مش بيقفل التشخيص لوحده: «==for clinical and serological evaluation==». يعني الـ pathologist بيقولك: الـ casts دي شكلها **light chains**، روح أكّد بالـ serology.

          وفاكر الـ list بتاعة أول المحاضرة؟ **Light chain cast nephropathy** من الأمراض اللي بتعمل ARF من غير GN.
      - kind: explain
        page: 269
        title: "Case 10: nephrotic مش بيرد على أي حاجة"
        quote: "Picture is Compatible with Lecithin- Cholesterol Acyltransferase Deficiency."
        text: |
          ست **29 سنة** بـ nephrotic (uPCR 8.9)، أخدت immunosuppression من غير فايدة. TG 260، **VLDL 52**.

          الـ biopsy: subendothelial hyaline deposits، GBM duplication، و ==foamy histiocytes== مالية الـ mesangium والـ capillaries.

          التشخيص: ==LCAT deficiency==.
      - kind: explain
        page: 270
        title: "LCAT بيعمل إيه؟"
        quote: "Lecithin-cholesterol acyltransferase (LCAT) is involved in the esterification of free cholesterol and in the cholesterol esters transport from peripheral tissues to the liver."
        text: |
          الـ **LCAT** بيعمل **esterification** للـ free cholesterol، وبيساعد ينقل الـ cholesterol esters من الأنسجة للكبد (جوّه الـ **HDL**).

          - **Partial** = ==fish eye disease== (القرنية بس)
          - **Complete** = **familial LCAT deficiency** (أنسجة كتير منها الكلى)

          أشهر complication: **proteinuria** في العقد الرابع. والتشخيص النهائي: **gene analysis** و functional activity.
      - kind: mnemonic
        page: 271
        quote: "Patient had a fish eye appearance (corneal opacity). Her HDL level was very low 11 mg/dl, high VLDL 52 mg/dl."
        word: "FISH"
        parts:
          - { key: "F", text: "Foam cells in the glomeruli" }
          - { key: "I", text: "Immunosuppression fails" }
          - { key: "S", text: "Sight: corneal opacity (fish eye)" }
          - { key: "H", text: "HDL very low (11), ApoA1 low" }
        hook: "عيانة nephrotic عينها شكل عين السمكة وHDL واطي = LCAT. «الكلى بتغرق في الكوليسترول.»"
      - kind: check
        page: 271
        quote: "Withdraw immunosuppression and control BP using an ACEi."
        question: "Case 10 is confirmed LCAT deficiency. What does the book do?"
        options:
          - "Withdraw immunosuppression, ACEi for BP"
          - "Add rituximab"
          - "Pulse steroids again"
          - "Plasma exchange"
        answer: 0
        why:
          - "صح: المرض مش immune؛ ==supportive== بـ ACEi، و transplant لو وصل ESKD."
          - "Rituximab للأمراض الـ immune، مش enzyme deficiency."
          - "الـ steroids فشلت قبل كده ومش هتصلّح enzyme."
          - "Plasma exchange مش في خطة الكتاب."
      - kind: explain
        page: 273
        title: "Case 11: podocytes شكلها دانتيل"
        quote: "The overlying visceral podocytes showed a swollen pale lacy cytoplasm."
        text: |
          شاب **29 سنة**، creatinine 1.9، uPCR 2. الـ biopsy: 36 من 43 glomeruli sclerosed، و ==swollen pale lacy podocytes==، و distal tubules فيها **vacuolated foamy cytoplasm**، والـ IF سلبي.

          التشخيص: ==advanced Fabry disease==.
      - kind: explain
        page: 275
        title: "Fabry في سطرين"
        quote: "Fabry disease is a rare genetic X-linked disease with a deficiency of the enzyme alpha-galactosidase A (a-Gal A)"
        text: |
          **X-linked lysosomal storage disorder**: نقص ==alpha-galactosidase A==، فالـ **Gb3** (globotriaosylceramide) يتراكم في الخلايا. وفيه **early onset** و **late onset**.
      - kind: figure
