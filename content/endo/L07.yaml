  # ---------- cases ----------
  - id: endo.L07.097
    kind: case
    topic: storm
    stem: A 32-year-old woman develops palpitations, fever 39.8°C and agitation 12 hours after a thyroid operation. Pulse 170 in AF.
    steps:
      - question: Most likely diagnosis?
        options: [Thyroid storm, Thyroxine overdose, Hypocalcaemia, Sepsis alone]
        answer: 0
        why: "Surgery is a classic precipitant; fever with tachycardia out of proportion and agitation."
      - question: Which drug blocks synthesis and T4 to T3 conversion?
        options: [Propylthiouracil 200 mg 4-hourly, Carbimazole 30 mg twice daily, Lugol's iodine, Dexamethasone]
        answer: 0
        why: "PTU blocks synthesis and conversion; Lugol's and steroids block conversion/release."
      - question: For the rate, if no contraindication?
        options: ["Propranolol orally or IV, titrated to pulse 100", Digoxin loading first as rate control, Amiodarone IV for rhythm control, Adenosine IV bolus to slow the rate]
        answer: 0
        why: "Propranolol is the choice; CCBs or digoxin only if β-blockers are contraindicated."
      - question: For her fever?
        options: [Paracetamol and external cooling, Aspirin and external cooling, "Ibuprofen only, no cooling", "No antipyretic; let it run"]
        answer: 0
        why: "Avoid salicylates; they displace thyroid hormone and worsen the storm."
    src: { page: 117, quote: "The treatment principles are to:\n  Decrease the production and release of thyroid hormones,\n  Block the effects of circulating t4 and t3.\n  Deal with the underlying precipitants.\n  To block the thyroid hormone synthesis:\n  Intravenous methimazole 20 mg every 4–6 hours until the patient is able to take oral carbimazole 30 mg twice daily, or\n  Propylthiouracil 200 mg every 4 hours (orally or via nasogastric tube) as it will also block T4 to T3 conversion." }
    status: unverified
  - id: endo.L07.098
    kind: case
    topic: hypercalcemia
    stem: A 24-year-old man with parathyroid carcinoma presents confused and dehydrated. Calcium 16 mg/dl, PTH very high.
    steps:
      - question: First step?
        options: ["0.9% saline 4-8 l per 24 h", Furosemide 80 mg straight away, Oral bisphosphonate, Surgery tonight]
        answer: 0
