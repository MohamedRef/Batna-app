          التفسير المقبول (مش في الكتاب): الولد الـ X-linked عمره ما عمل α5 سليم، فالـ immune system **ما اتعلمش** إن البروتين ده "من الجسم". أول ما الكلية الجديدة تيجي بـ α5 طبيعي، بيتعامل معاه كأنه غريب.

          بس ده **مش contraindication** للزرع: النسبة صغيرة، والزرع لسه أحسن علاج للـ ESRD.
