items:
  # ---------- p197: definition, incidence, criteria ----------
  - id: rheum.L12.001
    kind: card
    topic: definition
    front: Define juvenile idiopathic arthritis (JIA).
    back: A heterogeneous group of disorders with childhood-onset chronic arthritis of unknown cause.
    src: { page: 197, quote: "heterogeneous group of disorders characterized by childhood-onset chronic arthritis of unknown cause." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L12.002
    kind: cloze
    topic: definition
    text: JIA is the most common chronic inflammatory rheumatic disease of childhood, with a prevalence of {{c1::50–200}} cases per {{c2::100,000}} children.
    src: { page: 197, quote: "most common chronic inflammatory rheumatic disease in childhood, with a prevalence of 50–200cases per 100,000 children." }
    status: unverified
    tags: [numbers]
  - id: rheum.L12.003
    kind: enumerate
    topic: definition
    prompt: The three conditions that must all be met to diagnose JIA.
    points:
      - Arthritis persisting for longer than 6 weeks
      - Arthritis beginning before 16 years of age
      - Exclusion of other conditions associated with or mimicking arthritis
    pass: 3
    src: { page: 197, quote: "All three conditions must be met Arthritis persisting for longer than 6 weeks. Arthritis beginning before 16 years of age." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L12.004
    kind: cloze
    topic: definition
    text: JIA begins before the age of {{c1::16}} years and persists for more than {{c2::6 weeks}}.
    src: { page: 197, quote: "It begins before the age of 16 years and persist for more than 6 weeks." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L12.005
    kind: card
    topic: definition
    front: When were the juvenile arthritides first described, and is the cause known?
    back: First described in 1890; the etiology remains unclear.
    src: { page: 197, quote: "Although these arthritidies were first described in 1890, the etiology remains unclear." }
    status: unverified
  - id: rheum.L12.006
    kind: table
    topic: epidemiology
    title: Share of new JIA cases by onset type (p197)
    columns: [Onset type, Share of cases]
    rows:
      - [Systemic onset, 10% to 15%]
      - [Polyarticular, 15% to 20%]
      - [Pauciarticular, 65% to 75%]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 197, quote: "Systemic Onset: 10% to 15% of cases 2. Polyarticular: 15% to 20% of new cases. 3. Pauciarticular: 65% to 75% of new cases." }
    status: unverified
    tags: [numbers]
  - id: rheum.L12.007
    kind: card
    topic: epidemiology
    front: Which onset type of JIA is the most common?
    back: Pauciarticular (oligoarticular), 65% to 75% of new cases.
    src: { page: 197, quote: "Pauciarticular: 65% to 75% of new cases." }
    status: unverified
    tags: [high-yield]
  # ---------- p198: age, sex, pathophysiology ----------
  - id: rheum.L12.008
    kind: cloze
    topic: epidemiology
    text: The peak incidence of JRA (US series) is at {{c1::1 to 3}} years of age, mostly in {{c2::girls}}; a second smaller peak at {{c3::8 to 10}} years includes more boys with oligoarticular JIA.
    src: { page: 198, quote: "the peak incidence of JRA occurred at one to three years of age, with a preponderance of girls in this age group." }
    status: unverified
    tags: [numbers]
  - id: rheum.L12.009
    kind: cloze
    topic: epidemiology
    text: The overall female-to-male ratio in JIA ranges from {{c1::2:1 to 3:1}}.
    src: { page: 198, quote: "The female-to-male ratio ranges from 2:1 to 3:1" }
    status: unverified
    tags: [numbers]
  - id: rheum.L12.010
    kind: card
    topic: epidemiology
    front: How high can the female preponderance be in oligoarticular JIA under 8 years, and when is it highest?
    back: As high as 8:1, especially if iridocyclitis is present.
    src: { page: 198, quote: "oligoarticular JIA affecting children under eight years old may have a female preponderance as high as 8:1, especially if iridocyclitis is present." }
    status: unverified
  - id: rheum.L12.011
    kind: card
    topic: epidemiology
    front: Which JIA forms are commoner in boys, and which shows no sex preference?
    back: Late-onset HLA-B27-related disease is commoner in males; systemic JIA shows little or no sex discrimination.
    src: { page: 198, quote: "late-onset human leukocyte antigen (HLA) B27-related disease occurs more commonly in males." }
    status: unverified
  - id: rheum.L12.012
    kind: card
    topic: pathophysiology
    front: How do T cells accumulate in the JIA joint?
    back: Recruitment by up-regulated adhesion molecules on the synovial endothelium, and retention of activated cells in the joint.
    src: { page: 198, quote: "recruitment to the joint by up-regulation of adhesion molecules on synovial endothelium, and retention in the joint of activated cells." }
    status: unverified
  - id: rheum.L12.013
    kind: table
    topic: pathophysiology
    title: Cytokines in the JIA joint (p198)
    columns: [Source or group, Cytokines]
    rows:
      - [From T cells (raised), "TNF, IFN, IL-2"]
      - [From monocytes (raised), "TNF, IL-1, IL-6, IL-8, IL-12"]
      - [Anti-inflammatory (reduced), "IL-4, IL-10, TGF-β"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 198, quote: "released from T- cells (TNF, INF, IL2) and from monocytes (TNF, IL1, IL6, IL8, IL12)." }
    status: unverified
  - id: rheum.L12.014
    kind: card
    topic: pathophysiology
    front: Which HLA antigen is associated with early-onset oligoarthritis in girls?
    back: HLA-A2.
    src: { page: 198, quote: "HLA-A2 is associated with early onset oligoarthritis in girls." }
    status: unverified
  # ---------- p199: ILAR table, oligoarticular ----------
  - id: rheum.L12.015
    kind: table
    topic: classification
    title: Categories of JIA (book table, p199)
    columns: [Category, Definition]
    rows:
      - [Systemic onset (SO), "Arthritis, fever and 1 of: rash, enlarged LN, liver or spleen, serositis"]
      - [Oligoarticular (PO or EO), "≤ 4 joints in the first 6 months: persistent or extended"]
      - [RF-negative polyarthritis, "≥ 5 joints in the first 6 months and RF-ve"]
      - [RF-positive polyarthritis, "≥ 5 joints in the first 6 months and RF+ve"]
      - [Enthesitis related (ERA), Arthritis and enthesitis]
      - [Psoriatic (PsA), Arthritis and psoriasis]
      - [Undifferentiated (UnA), "Fulfils criteria in no category or > 1 category"]
    blanks: [[0, 1], [1, 1], [2, 1], [4, 1], [5, 1], [6, 1]]
    src: { page: 199, quote: "Oligoarticular JIA (PO or EO) < 4 joints in the first 6 months" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L12.016
    kind: cloze
    topic: classification
    text: Oligoarticular JIA involves {{c1::≤ 4}} joints in the first 6 months; polyarticular JIA involves {{c2::≥ 5}} joints in the first 6 months.
    src: { page: 199, quote: "Oligoarticular JIA (PO or EO) < 4 joints in the first 6 months" }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L12.017
    kind: card
    topic: classification
    front: When is JIA labelled undifferentiated?
    back: When it fulfils the criteria of no category, or of more than one category.
    src: { page: 199, quote: "Undifferentiated JIA (UnA) Fulfils criteria in no category or > 1 category" }
    status: unverified
  - id: rheum.L12.018
    kind: card
    topic: oligo
    front: Sex ratio and typical age of oligoarticular JIA?
    back: Girls more than boys, 4:1; typically 1 to 3 years old (onset before 16).
    src: { page: 199, quote: "More in girls than boys 4:1. - 1-3 years old age." }
    status: unverified
  - id: rheum.L12.019
    kind: cloze
    topic: oligo
    text: For oligoarticular JIA, active synovitis must last {{c1::3 months}} in the EULAR criteria and {{c2::6 weeks}} in the ACR criteria.
    src: { page: 199, quote: "Active synovitis 3 months in the (EULAR) criteria, and 6 weeks (ACR) criteria." }
    status: unverified
    tags: [numbers]
  - id: rheum.L12.020
    kind: card
    topic: oligo
    front: What is extended oligoarticular JIA?
    back: Oligoarticular disease that goes on to involve 4–5 joints after the first 6 months of disease.
    src: { page: 199, quote: "4-5 joints involving after 6 months of disease onset (extended Oligoarticular)" }
    status: unverified
  - id: rheum.L12.021
    kind: card
    topic: oligo
    front: Which children with oligoarticular JIA are at risk of progressing to polyarticular disease with a poor prognosis?
    back: Young girls with early involvement of small joints.
    src: { page: 199, quote: "Young girls with early involvement of small joints are at risk for progression to polyarticular involvement and have a poor prognosis." }
    status: unverified
  - id: rheum.L12.022
    kind: card
    topic: oligo
    front: Which joints are typical in oligoarticular JIA, and which are spared?
    back: Large joints, sparing the hips and shoulders.
    src: { page: 199, quote: "Large joints affection, excluding hips and shoulders." }
    status: unverified
  - id: rheum.L12.023
    kind: card
    topic: oligo
    front: Which eye disease complicates oligoarticular JIA, and which antibody raises its risk?
    back: Chronic anterior uveitis (iridocyclitis); a positive ANA carries a greater risk.
    src: { page: 199, quote: "Chronic anterior uveitis Presence of ANA with a greater risk of complicating eye disease (iridocyclitis)." }
    status: unverified
    tags: [high-yield]
  # ---------- p200: oligo clinical, polyarticular ----------
  - id: rheum.L12.024
    kind: card
    topic: oligo
    front: What does the presence of constitutional manifestations mean for a diagnosis of oligoarthritis?
    back: It excludes the diagnosis of oligoarthritis.
    src: { page: 200, quote: "Constitutional manifestations if present excludes the diagnosis of oligoarthritis." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L12.025
    kind: card
    topic: oligo
    front: How does the joint typically present in oligoarticular JIA?
    back: Swelling rather than pain; two thirds present with a single joint, sometimes with juxta-articular muscle atrophy.
    src: { page: 200, quote: "Joint swelling rather than pain, two thirds of patients present with single joint disease there may be associated juxta- articular muscle atrophy." }
    status: unverified
  - id: rheum.L12.026
    kind: enumerate
    topic: oligo
    prompt: Joints affected in oligoarticular JIA.
    points:
      - Ankles
      - Knees
      - Elbows
      - 1 to 2 small hand joints
      - Occasionally the temporomandibular joint and cervical spine
    pass: 4
    src: { page: 200, quote: "Ankles, knees, elbows, and 1 to2 small hand joints may be affected (sparing hips and shoulders)." }
    status: unverified
  - id: rheum.L12.027
    kind: enumerate
    topic: oligo
    prompt: Eye involvement in oligoarticular JIA.
    points:
      - Iridocyclitis
      - Band keratopathy
      - Glaucoma
      - Cataract
      - Blindness
    pass: 4
    src: { page: 200, quote: "Eye involvement: iridocyclitis, band keratopathy, glucoma, cataract, and blindness." }
    status: unverified
  - id: rheum.L12.028
    kind: cloze
    topic: oligo
    text: Patients who remain pauciarticular for {{c1::5 years}} are less likely to develop a polyarticular pattern.
    src: { page: 200, quote: "Patients who remains pauciarticular for 5 years are less likely to develop polyarticular disease pattern." }
    status: unverified
    tags: [numbers]
  - id: rheum.L12.029
    kind: enumerate
    topic: oligo
    prompt: Complications of oligoarticular JIA.
    points:
      - Leg length discrepancy with flexion contracture of the affected knee
      - Acute lower limb pain and swelling from ruptured synovial cysts
    pass: 2
    src: { page: 200, quote: "Leg length discrepancy with flexion contracture of the affected knee." }
    status: unverified
  - id: rheum.L12.030
    kind: card
    topic: poly
    front: How is RF positivity defined in RF-positive polyarticular JIA?
    back: RF positive on at least two occasions 3 months apart (typically adolescent girls with adult-type RA).
    src: { page: 200, quote: "RF positive group occurs on at least two occasions 3 months apart" }
    status: unverified
  - id: rheum.L12.031
    kind: card
    topic: poly
    front: What fever and rash pattern can occur in polyarticular JIA, and what is absent?
    back: Low-grade fever and a transient rash for 1–2 days early on; no lymphadenopathy, hepatosplenomegaly or visceral involvement.
    src: { page: 200, quote: "Low grade fever and transient rash 1-2 days early in the disease , no lymphadenopathy, hepatomegaly, Splenomegaly, or visceral involvement." }
    status: unverified
  - id: rheum.L12.032
    kind: card
    topic: poly
    front: What dominates the clinical picture of polyarticular JIA, and which hand deformities are common?
    back: Rapidly progressive joint disease; boutonniere and swan-neck deformities from carpal fusion and tendinopathies.
    src: { page: 200, quote: "Rapidly progressive joint disease domenates the clinical picture." }
    status: unverified
  # ---------- p201: poly continued, systemic ----------
  - id: rheum.L12.033
    kind: enumerate
    topic: poly
    prompt: Joint features of polyarticular JIA besides the hands.
    points:
      - Shoulders commonly involved; elbow flexion contracture
      - Tarsal fusion, tenosynovitis and bursitis
      - Flexion deformities of knees and hips
      - Aseptic necrosis of the hip
      - Cervical spine and TMJ involvement, like RA
    pass: 4
    src: { page: 201, quote: "Shoulders are commonly involved and flexion contracture occur in elbow involvement." }
    status: unverified
  - id: rheum.L12.034
    kind: card
    topic: systemic
    front: Sex, age of onset and suspected cause of systemic-onset JIA?
    back: Equal sex; onset at 2–3 years; viral etiology suspected, with genetic heterogeneity on HLA studies.
    src: { page: 201, quote: "Equal sex Age of onset 2-3 years. Viral etiology HLA studies demonstrates genetic heterogenity." }
    status: unverified
  - id: rheum.L12.035
    kind: card
    topic: systemic
    front: Joint pattern in systemic-onset JIA?
    back: Ankles, elbows, wrists; hips almost bilateral and, when present, linked to polyarticular disease; hands more than feet; carpal and tarsal tenosynovitis common.
    src: { page: 201, quote: "Arthritis of ankles, elbows, wrists, hip involvement almost bilaterally and if present it is associated with polyarticular disease." }
    status: unverified
  - id: rheum.L12.036
    kind: card
    topic: systemic
    front: Fever requirement for systemic JIA in ACR vs EULAR terms?
    back: ACR requires 2 weeks of fever plus the characteristic rash; EULAR requires another feature besides fever and arthritis.
    src: { page: 201, quote: "ACR required 2 weeks peroid of fever and the the presence of the characteristic rash." }
    status: unverified
  - id: rheum.L12.037
    kind: card
    topic: systemic
    front: Describe the rash of systemic JIA.
    back: Pale pink, blanching, small macules or maculopapules; transient, non-pruritic, mostly on the trunk; erythematous and evanescent.
    src: { page: 201, quote: "The rash is pale pink, blanching, and is characterized by small macules or maculopapules, transient, non pruritic and mostly on the trunk." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L12.038
    kind: card
    topic: systemic
    front: What is the hallmark of systemic arthritis, and which eye feature is rare?
    back: Serosal involvement (pericarditis, pleuritis; tamponade may occur). Uveitis is rare.
    src: { page: 201, quote: "Involvement of serosal surface is the hallmark of systemic arthritis, pericardial tamponade may occur." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L12.039
    kind: card
    topic: systemic
    front: Which vascular and CNS features can occur in systemic JIA?
    back: Severe vasculitis with secondary consumption coagulopathy (responds to intensive steroids); CNS irritability and lethargy.
    src: { page: 201, quote: "Severe vasculitis with secondary consumption coagulopathy, resposive to intensive steroid therapy." }
    status: unverified
  # ---------- p202: systemic death, ILAR systemic criteria, psoriatic ----------
  - id: rheum.L12.040
    kind: card
    topic: systemic
    front: Most common cause of death in systemic-onset JIA?
    back: Amyloidosis with secondary renal failure, followed by infection.
    src: { page: 202, quote: "Amyloidosis with secondary renal failure (The most common cause of death in systemic onset) followed by infection." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L12.041
    kind: enumerate
    topic: systemic
    prompt: ILAR classification criteria for systemic JIA (book Table 1).
    points:
      - "Fever ≥ 2 weeks, quotidian (≥ 39 °C at least once a day, back to ≤ 37 °C), documented daily for ≥ 3 days"
      - "Arthritis in ≥ 1 joint for ≥ 6 weeks"
      - "At least one of: evanescent erythematous rash, generalized lymph node enlargement, hepatomegaly and/or splenomegaly, serositis"
    pass: 3
    src: { page: 202, quote: "Fever =2 weeks, quotidien in pattern" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L12.042
    kind: cloze
    topic: systemic
    text: "ILAR systemic JIA: quotidian fever for ≥ {{c1::2 weeks}}, reaching ≥ {{c2::39 °C}} at least once a day, documented daily for ≥ {{c3::3 days}}."
    src: { page: 202, quote: "Fever =2 weeks, quotidien in pattern" }
    status: unverified
    tags: [numbers]
  - id: rheum.L12.043
    kind: card
    topic: psoriatic
    front: Pattern and age of onset of juvenile psoriatic arthritis?
    back: Asymmetric arthritis of large and small joints, typically starting in mid childhood.
    src: { page: 202, quote: "Juvenile psoriatic arthritis is characterized as an asymmetric arthritis that can affect both large and small joints and typically has an onset in mid childhood." }
    status: unverified
  - id: rheum.L12.044
    kind: enumerate
    topic: psoriatic
    prompt: Juvenile psoriatic arthritis without the rash needs arthritis plus any two of these.
    points:
      - Psoriasis in a first-degree relative
      - "Dactylitis (diffuse finger swelling beyond the joint margin)"
      - Nail pitting
    pass: 3
    src: { page: 202, quote: "the presence of arthritis and the typical psoriatic rash, or any two of the following if the rash is absent" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L12.045
    kind: card
    topic: psoriatic
    front: Define dactylitis.
    back: Diffuse swelling of a finger extending beyond the joint margin.
    src: { page: 202, quote: "Dactylitis (diffuse swelling of fingers extending beyond the joint margin)." }
    status: unverified
  - id: rheum.L12.046
    kind: card
    topic: psoriatic
    front: Which eye and serological findings may occur in juvenile psoriatic arthritis?
    back: Uveitis; ANA-positive, and HLA-B27-positive especially with axial disease.
    src: { page: 202, quote: "These children also may be found to be ANA-positive and HLA-B27– positive, especially when there axial affection." }
    status: unverified
  # ---------- p203: ERA, labs ----------
  - id: rheum.L12.047
    kind: card
    topic: era
    front: Who typically gets enthesitis-related arthritis, and what defines it?
    back: Boys over 8 years; arthritis with enthesitis, most are HLA-B27 positive.
    src: { page: 203, quote: "Children affected by enthesitis-related arthritis generally are boys >8 years of age of arthritis is characterized by the presence of enthesitis." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L12.048
    kind: card
    topic: era
    front: Typical complaints in enthesitis-related arthritis?
    back: Pain, stiffness and loss of mobility of the lower back, and arthritis of lower-limb joints.
    src: { page: 203, quote: "Patients typically complain of pain, stiffness, and loss of mobility of the lower back, and can present with arthritis in lower extremity joints." }
    status: unverified
  - id: rheum.L12.049
    kind: card
    topic: labs
    front: What is key to diagnosing childhood arthritis, and is there a diagnostic test?
    back: A careful history and physical examination; there is no diagnostic test.
    src: { page: 203, quote: "A careful history and physical examination are key to the proper diagnosis of childhood arthritis." }
    status: unverified
  - id: rheum.L12.050
    kind: card
    topic: labs
    front: A child with JIA has a persistently raised ESR but no other laboratory sign of inflammation. What rare condition does this suggest?
    back: Hyperfibrinogenaemia.
    src: { page: 203, quote: "A persistent elevated ESR with no other evidence of inflammation on other laboratory tests, might suggest the rare condition of hyperfibrinogenaemia." }
    status: unverified
  - id: rheum.L12.051
    kind: cloze
    topic: labs
    text: In JIA, ANA is present in {{c1::40 up to 75%}} of cases (its level does not track activity), and RF is positive in {{c2::5%}}.
    src: { page: 203, quote: "ANA is present in 40 up to 75% of cases with no evidence that its level correlates with disease activity." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L12.052
    kind: card
    topic: labs
    front: Acute phase reactants in JIA in general, and in polyarticular JIA?
    back: Usually normal or mildly raised; in polyarticular JIA ESR, CRP and white count can be raised or normal (non-specific).
    src: { page: 203, quote: "The acute phase reactants are usually normal or mildly raised." }
    status: unverified
  # ---------- p204: systemic labs, prognosis, eye screening ----------
  - id: rheum.L12.053
    kind: enumerate
    topic: labs
    prompt: Laboratory findings in systemic-onset JIA.
    points:
      - Anaemia, thrombocytosis, leucocytosis
      - Raised acute phase reactants
      - Most are seronegative for RF and ANA
      - Hypoalbuminaemia (multifactorial); with heavy proteinuria think of amyloidosis
    pass: 3
    src: { page: 204, quote: "Anaemia, thrombocytosis, leucocytosis. 2- Raised acute phase reactants. 3- Most childrens are sero negative for RF and ANA." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L12.054
    kind: card
    topic: labs
    front: Systemic JIA with hypoalbuminaemia and heavy proteinuria. What must you suspect?
    back: Amyloidosis.
    src: { page: 204, quote: "if present with heavy proteinuria the suscpicion of amyloidosis should be considered." }
    status: unverified
  - id: rheum.L12.055
    kind: card
    topic: prognosis
    front: Is JIA prognosis tied more to onset type or to course? Which course is best?
    back: To the disease course; persistent oligoarticular disease has the best articular outcome.
    src: { page: 204, quote: "Prognosis is related more to the disease course than to the onset type persistant oligoarticular disease is associated with the best articular outcome" }
    status: unverified
  - id: rheum.L12.056
    kind: enumerate
    topic: prognosis
    prompt: Poor prognostic factors in JIA.
    points:
      - "Systemic onset with infection, secondary amyloidosis or MAS"
      - Polyarticular disease (and extended oligo within 1–2 years)
      - Positive RF and anti-CCP
      - Need for systemic corticosteroids
      - Younger age at onset
      - Female gender
    pass: 4
    src: { page: 204, quote: "Positive RF& anti-CCP d- Need for treatment with systemic corticosteroids. e- Younger age at onset of disease. f- Female gender." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L12.057
    kind: cloze
    topic: prognosis
    text: Children with iridocyclitis and ANA-positive oligoarthritis need slit-lamp examination every {{c1::4 months}}; ANA-negative children every {{c2::6 months}}.
    src: { page: 204, quote: "Those with iridocyclitis and ANA positive oligoarthritis require slit lamp evaluation every 4 months." }
    status: unverified
    tags: [numbers, high-yield]
  # ---------- p205: MAS ----------
  - id: rheum.L12.058
    kind: cloze
    topic: mas
    text: About {{c1::5–8%}} of children with systemic JIA develop the life-threatening {{c2::macrophage activation syndrome}}.
    src: { page: 205, quote: "About 5–8% of children with systemic juvenile idiopathic arthritis develop a life-threatening complication known as macrophage activation syndrome." }
    status: unverified
    tags: [numbers]
  - id: rheum.L12.059
    kind: enumerate
    topic: mas
    prompt: Clinical features of macrophage activation syndrome.
    points:
      - Sudden sustained fever
      - Pancytopenia
      - Hepatosplenomegaly
      - Liver insufficiency
      - Coagulopathy with haemorrhage
      - Neurological symptoms
    pass: 5
    src: { page: 205, quote: "sudden onset of sustained fever, pancytopenia, hepato splenomegaly, liver insufficiency, coagulopathy with haemorrhagic manifestations, and neurological symptoms." }
