  # ---------- p385-386: planning ----------
  - id: neph.L11.172
    kind: card
    topic: tx-plan
    front: Does the preconception immunosuppressive regimen affect graft survival or pregnancy outcome?
    back: No, although stopping MMF/MPA or mTOR inhibitors was thought to raise the risk of acute rejection.
    src: { page: 385, quote: "Planning a pregnancy Successful pregnancy depends on thorough pre-pregnancy counseling, family planning, regular antenatal follow-up, and multidisciplinary teamwork. Table 4 shows a summary of criteria to improve outcomes for renal transplant patients based on European and American guidelines. Failure to meet these criteria places patients in a higher risk group. (97) Preconception immunosuppressive types have no impact on allograft survival, and on obstetric and perinatal outcomes, even though discontinuation of mycophenolate mofetil (MMF), mycophenolic acid (MPA), or mTOR inhibitors were postulated to increase the patient's risk of acute rejection. (96)" }
    status: unverified
  - id: neph.L11.173
    kind: enumerate
    topic: tx-plan
    prompt: "Table 2: mention the criteria for a safe pregnancy in a kidney transplant recipient."
    points:
      - At least 1 year after transplantation
      - Stable graft, creatinine <2.0 (preferably <1.5) mg/dL
      - No acute rejection in the past 6 months
      - Stable minimal pregnancy-safe immunosuppression (cyclosporine or tacrolimus, azathioprine, steroids)
      - Normotensive or controlled on one drug
      - Proteinuria minimal (<300 mg/24 h) or none
      - Normal graft ultrasound
    pass: 5
    hook: "حمل آمن بعد الزرع = «سنة، 2، 6 شهور، دوا، ضغط، 300، سونار»: سنة على الأقل بعد الزرع، graft ثابت وcreatinine أقل من 2.0 (والأحسن أقل من 1.5) mg/dL، مفيش acute rejection آخر 6 شهور، immunosuppression قليلة وثابتة وآمنة في الحمل (cyclosporine أو tacrolimus، azathioprine، steroids)، ضغط طبيعي أو متظبط على دوا واحد، proteinuria قليلة (أقل من 300 mg/24 h) أو مفيش، وgraft ultrasound طبيعي."
    src: { page: 386, quote: "Table 2: Suggested criteria for safe pregnancy in kidney transplant recipients\n1. No less than 1-year posttransplantation\n2. Stable allograft function with serum creatinine <2.0 mg/dl, preferably <1.5 mg/dl\nAn eGFR of 40ml/min/1.73 m2 entitles the lowest GFR range to plan pregnancy\n3. No episodes of acute rejection within the past 6 months\n4. Stable (and minimal) pregnancy-safe immunosuppression, preferably with cyclosporine (or TAC), AZA, and steroids\n5. Normotensive or well-controlled hypertension on one antihypertensive agent\n6. Minimal (<300mg/24h) or no proteinuria\n7. Normal allograft ultrasound" }
