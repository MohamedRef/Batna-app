  # ---------- p359-360: outcomes ----------
  - id: neph.L11.049
    kind: cloze
    topic: aki-outcomes
    text: "In Liu's meta-analysis, maternal deaths were {{c1::13.3%}} with pregnancy-related AKI versus {{c2::4.2%}} without, with a {{c3::2.1-day}} longer ICU stay."
    src: { page: 360, quote: "deaths (13.3% vs. 4.2%), and a longer intensive care unit stay of 2.1 days than did women without pregnancy- related AKI. Pregnancy-related AKI was also associated with a 1.5-fold higher likelihood of cesarean deliveries, a 1.3-fold high likelihood of hemorrhage, a 1.9- fold higher likelihood of HELLP (21) syndrome, and a 2.0-fold higher likelihood of placental abruption. A recent study from the United States reported a 13.5-fold higher likelihood of inpatient mortality and a 10-fold higher likelihood of cardiovascular events with pregnancy-related AKI hospitalizations as compared to hospitalizations with no AKI. Of all pregnancy-related AKI hospitalizations, 8.9% required acute dialysis. As compared to non-AKI pregnancy-related hospitalizations, pregnancy-related AKI requiring acute dialysis was associated with a 32-fold (5) higher adjusted odds. AKI during pregnancy increases the risk of progression to chronic kidney disease and ESKD. About 2.4% of women with (21) pregnancy-related AKI progress to ESKD needing dialysis. A Canadian study showed that 1 in 10000 pregnancies were complicated by AKI needing dialysis and 3.9% remained on dialysis four months after delivery. Women with pregnancy- related AKI needing dialysis initiation had a 3.4 fold higher risk of low birth weight, small for gestational age, or preterm birth as compared to the (22) general population. Pregnancy-related AKI is associated with a lower mean gestational age at delivery (−0.70 week), lower mean birth weight (−740 grams), and a 3.4-fold higher likelihood of stillbirths and perinatal deaths as compared to (21) women without pregnancy-related AKI. Since routine monitoring of serum creatinine is not done prior to or during pregnancy, there is a need for continued research on early recognition and treatment of AKI. Early identification of AKI in pregnancy may reduce fetal and maternal mortality and lessen the risk of developing ESKD later in life." }
    status: unverified
