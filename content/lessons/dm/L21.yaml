        title: "شكل الـ FCHL وعلاجه"
        quote: "These patients do not develop xanthomas."
        text: |
          - **Premature CHD** risk عالي جدًا.
          - ممكن يظهر في الطفولة، بس غالبًا يكتمل في **الكبر**.
          - معاه **metabolic syndrome**: obesity، glucose intolerance، insulin resistance، hypertension.
          - ==مفيش xanthomas==.

          **العلاج**: TLC diet، ضبط السكر بشدة في الـ diabetics، و **statins**، وكتير محتاجين **دوا تاني** (cholesterol absorption inhibitor، niacin، fibrate، fish oil).

          ليه دوا تاني؟ لأن فيه مشكلتين: الـ statin بيضرب الـ LDL أساسًا، والـ TG محتاج حد تاني. وليه مفيش xanthoma؟ التفسير المقبول (مش في الكتاب): الارتفاع **معتدل**، مش كفاية يترسّب في الجلد والأوتار.
