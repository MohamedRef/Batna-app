  - id: git.L03.lesson7
    title: "آخر المشوار: الـ anorectal disorders"
    hook: "سلس، ألم في المستقيم، وزق من غير نتيجة. موضوع محرج للمريض، فالـ history الكويس هو نص التشخيص."
    minutes: 9
    pages: [136, 142]
    topics: [anorectal]
    goals:
      - "تفرّق passive و urge incontinence و fecal seepage"
      - "تعرف work-up وعلاج الـ fecal incontinence"
      - "تفرّق levator ani syndrome و proctalgia fugax"
      - "تفهم الفرق بين F3a و F3b"
    status: unverified
    steps:
      - kind: explain
        page: 136
        quote: "Fecal incontinence is defined as involuntary passage of fecal matter through the anus or inability to control the discharge of bowel contents."
        title: "Fecal incontinence: ابدأ بالثقة"
        text: |
          الـ ==fecal incontinence==: نزول براز من غير إرادة، أو عدم القدرة على التحكم. وشدّتها من flatus بيفلت أحيانًا لحد تفريغ كامل.

          أول خطوة: ==trusting relationship==، وبعدها تسأل عن:
          - الـ leakage: **flatus** ولا **liquid** ولا **solid** stool.
          - أثرها على الـ quality of life.
          - بتحصل إمتى وفي أنهي ظروف.

          ومن الـ history المهم: الولادة (forceps، tears، repairs)، جراحة أو إصابة في الضهر، diabetes، والأدوية والكافيين.
      - kind: table
        page: 136
        quote: "Fecal retention with overflow"
        title: "ليه بيحصل؟"
        columns: ["Mechanism", "Causes", "Result"]
        rows:
          - ["Anal sphincter muscles", "Hemorrhoidectomy, neuropathy, obstetric injury", "Weak sphincter, lost sampling reflex"]
          - ["Pudendal nerve", "Excessive straining, obstetric or surgical injury", "Weak sphincter, sensory loss"]
          - ["Fecal impaction", "Dyssynergic defecation", "Retention with overflow"]
          - ["Loose stool", "Drugs, bile salt malabsorption, infection, IBD, IBS", "Urgency, impaired accommodation"]
        hide: [[0, 2], [2, 2], [3, 2]]
      - kind: sort
        page: 137
        quote: "Passive incontinence, the involuntary discharge of fecal matter or flatus without any awareness."
        prompt: "أنهي نوع؟"
        bins: ["Passive", "Urge", "Seepage"]
        cards:
          - { text: "Leaks without noticing it", bin: 0 }
          - { text: "Loss of perception or rectoanal reflexes", bin: 0 }
          - { text: "Rushes to the toilet but cannot hold it", bin: 1 }
          - { text: "Disrupted sphincter, small rectal capacity", bin: 1 }
          - { text: "Stains after a bowel movement, otherwise continent", bin: 2 }
          - { text: "Incomplete evacuation; sphincters mostly intact", bin: 2 }
        why: "**Passive** = من غير ما يحس (perception أو reflexes). **Urge** = حاسس بس مش قادر يمسك (sphincter أو capacity). **Seepage** = تسريب بعد التبرّز، والسبب incomplete evacuation أو rectal sensation ضعيف."
      - kind: explain
        page: 137
        quote: "Anorectal manometry is a useful method for assessing IAS and EAS pressures as well as rectal sensation"
        title: "الفحوصات"
        text: |
          - ==Anorectal manometry==: ضغط الـ **IAS** والـ **EAS**، الـ rectal sensation، الـ rectoanal reflexes، والـ compliance.
          - **Balloon expulsion test**: بسيط وبيكشف الـ dyssynergic defecation.
          - **Anal endosonography** أو MRI: defects وسُمك الـ sphincters. والـ US هو الأكتر توافرًا.
          - **Defecography**، **neurophysiology** (EMG، PNTML)، و saline infusion test.
          - **Sigmoidoscopy/colonoscopy** تستبعد mucosal lesions زي solitary rectal ulcer أو inflammation أو malignancy.
      - kind: figure
        page: 139
        quote: "Trial of loperamide, diphenoxylate and atropine, or other antidiarrheal agent"
        title: "مسار الـ fecal incontinence"
        alt: "Five stacked steps: history and examination with digital rectal exam; if diarrhea, colonoscopy, blood tests and a trial of loperamide or another antidiarrheal; if not improved, anorectal manometry, anal endosonography and balloon expulsion test; for a weak sphincter, impaired sensation or dyssynergia, neuromuscular training; if ineffective, sphincter repair, sacral nerve stimulation, artificial bowel sphincter or colostomy."
        caption: "الأسهل الأول: لو فيه diarrhea عالجه، لأن البراز الطري أصعب في المسك. بعدها الفحوصات، وبعدها التدريب، والجراحة في الآخر."
        svg: |
          <svg viewBox="0 0 330 290" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03fi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
