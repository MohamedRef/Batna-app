  - id: hem.L05.lesson5
    title: "الفرامل والمنظّف: inhibitors و fibrinolysis"
    hook: "جلطة من غير فرامل تسدّ الجسم كله. اعرف مين بيوقف التجلط عند حدود الجرح، ومين بيدوّب الجلطة بعد ما تخلص شغلها."
    minutes: 8
    pages: [72, 73]
    topics: [inhibitors, fibrinolysis]
    goals:
      - "تعدّ الـ natural inhibitors الأربعة وتعرف كل واحد بيوقف إيه"
      - "تشرح ليه الـ heparin شغال عن طريق antithrombin III"
      - "تعرف الـ plasmin بيتعمل إزاي وبيهضم إيه"
    status: unverified
    steps:
      - kind: explain
        remind: [hem.L05.010]
        page: 72
        title: "الفرامل: natural inhibitors"
        quote: "Coagulation factor inhibitors\n  1. Tissue factor pathway inhibitors which is present in the plasma and platelet and accumulation at the site of injury caused by local platelet activation. It inhibits factors Xa and VIIa and tissue factor to limit the main in vivo pathway.\n  2. Antithrombin III, most potent. It inactivate seriene proteases by combining with them. Heparin potentiates its action markedly.\n  3. Protein C and protein S\n  4. Thrombin binds to an endothelial surface receptor thrombomodulin. The resulting complex activate the vitamin K dependent serine protease C with the help of PS they inactivate V and VIII preventing thrombin synthesis."
        text: |
          1. **TFPI** (tissue factor pathway inhibitor): في الـ plasma والـ platelets، بيوقف **Xa** و **Activated factor VII (VIIa)** والـ tissue factor.
          2. ==Antithrombin III==: **الأقوى**، بيلزق في الـ serine proteases ويوقفها. والـ **heparin** بيقوّيه جدًا.
          3. **Protein C** و **protein S**.
          4. **Thrombomodulin**: الـ thrombin يلزق فيه على الـ endothelium، فيشغّل **protein C**، اللي مع **protein S** يكسّر **V** و **VIII**.

          ليه أربع فرامل؟ كل واحدة بتمسك السلسلة من حتة مختلفة:

          - **TFPI** بيقفل **أول** الـ extrinsic (VIIa والـ tissue factor) و Xa، فبيحدّد الجلطة بمكان الجرح اللي الـ platelets اتجمعت فيه.
          - **Antithrombin III** بيمسك الـ **serine proteases** نفسها، يعني الإنزيمات الشغالة، عشان كده هو الأقوى.
          - **Protein C/S** بيكسّروا **V و VIII**، ودول المساعدين اللي من غيرهم X و IX مش بيشتغلوا بسرعة، فإنتاج الـ thrombin بيقع.
      - kind: aside
        tone: analogy
        page: 72
        quote: "Coagulation factor inhibitors\n  1. Tissue factor pathway inhibitors which is present in the plasma and platelet and accumulation at the site of injury caused by local platelet activation. It inhibits factors Xa and VIIa and tissue factor to limit the main in vivo pathway.\n  2. Antithrombin III, most potent. It inactivate seriene proteases by combining with them. Heparin potentiates its action markedly.\n  3. Protein C and protein S\n  4. Thrombin binds to an endothelial surface receptor thrombomodulin. The resulting complex activate the vitamin K dependent serine protease C with the help of PS they inactivate V and VIII preventing thrombin synthesis."
        text: |
          الـ **thrombin** هنا زي الجهاز اللي بيقفل نفسه: طول ما هو في الجرح بيجلّط، ولما يوصل للـ endothelium السليم ويمسك في **thrombomodulin** يتحوّل لفرامل ويشغّل **protein C**. كده الجلطة ما تكبرش بره الجرح.
      - kind: reveal
        page: 72
        quote: "2. Antithrombin III, most potent. It inactivate seriene proteases by combining with them. Heparin potentiates its action markedly."
        prompt: "الـ heparin نفسه مش بيوقف أي factor. طب بيمنع التجلط إزاي؟"
        answer: |
          الكتاب بيقول إن الـ heparin ==potentiates== الـ **antithrombin III** جدًا. يعني الـ heparin مش فرامل لوحده، هو بيدوس على فرامل موجودة أصلًا.

          التفسير المقبول (مش في الكتاب): عشان كده لو العيان عنده نقص antithrombin، الـ heparin بيبقى أضعف بكتير من المتوقع.
      - kind: check
        page: 72
        quote: "4. Thrombin binds to an endothelial surface receptor thrombomodulin. The resulting complex activate the vitamin K dependent serine protease C with the help of PS they inactivate V and VIII preventing thrombin synthesis."
        question: "Activated protein C, helped by protein S, inactivates which factors?"
        options: ["V and VIII", "Xa and VIIa", "II and X", "XII and XI"]
        answer: 0
        why:
          - "صح: بيكسّر **V و VIII**، فإنتاج الـ thrombin يقف."
          - "دول اللي بيوقفهم **TFPI**."
          - "الـ protein C مش بيكسّر prothrombin ولا X."
          - "دول أول الـ intrinsic، مش هدف الـ protein C."
      - kind: explain
        remind: [hem.L05.018]
        page: 72
        title: "Fibrinolysis: المنظّف"
        quote: "(Like coagulation) is a normal haemostatic response to vascular injury. Plasminogen is a β globulin proenzyme in the blood and tissue fluid, is converted to the plasmin by activators. either from the vessel wall or from the tissue. The most important route follows the release of tPA (Tissue plasminogen activator) from endothelium."
        text: |
          - **Plasminogen** (globulin proenzyme) بيتحوّل لـ **plasmin** بـ activators من جدار الوعاء أو الأنسجة.
          - أهم طريق: ==Tissue plasminogen activator (tPA)== من الـ endothelium، وهو serine protease بيلزق في الـ fibrin.
          - **Activated protein C** بيزوّد الـ fibrinolysis لأنه بيكسّر الـ tPA inhibitors.
          - الـ **plasmin** بيهضم fibrinogen و fibrin و factor V و VIII.

          ليه الـ tPA **بيلزق في الـ fibrin**؟ عشان يشتغل على الجلطة نفسها مش في الدم كله. والكتاب بيقول إن الـ fibrinolysis ==normal haemostatic response== زي التجلط بالظبط: الجسم بيبني الجلطة ويبدأ يهدّها في نفس الوقت، فالجلطة ما تكبرش أكتر من اللازم وتتشال لما الجرح يلم.
      - kind: figure
        page: 73
        quote: "Thrombin Fibrinogen Plasmin Fibrinolysis"
        title: "التجلّط والتدويب"
        alt: "Three panels left to right. Coagulation: thrombin converts fibrinogen to fibrin polymer. Clot. Fibrinolysis: thrombin also activates plasmin, which breaks the fibrin polymer into fibrin fragments."
        caption: "نفس الـ **thrombin** اللي بيبني الجلطة بيشغّل كمان الـ fibrinolysis: ==plasmin== بيكسّر الـ fibrin لـ **fibrin fragments** (FDPs)."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L05b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="110" y="10" width="110" height="30" rx="8" class="fg-bad"/><text x="165" y="30" text-anchor="middle" class="t-b">Thrombin</text>
            <rect x="10" y="80" width="100" height="30" rx="8" class="fg-box"/><text x="60" y="100" text-anchor="middle" class="t-sm">Fibrinogen</text>
            <path d="M110 95 H140" class="fg-arrow" marker-end="url(#L05b)"/>
            <path d="M150 40 V75" class="fg-arrow" marker-end="url(#L05b)"/>
            <rect x="140" y="78" width="80" height="36" rx="8" class="fg-acc"/><text x="180" y="100" text-anchor="middle" class="t-sm t-b">Fibrin</text>
            <path d="M200 40 Q270 50 270 135" class="fg-arrow-acc" marker-end="url(#L05b)"/>
            <text x="270" y="150" text-anchor="middle" class="t-sm t-b">Plasmin</text>
            <path d="M180 114 V170" class="fg-arrow" marker-end="url(#L05b)"/>
            <rect x="120" y="172" width="120" height="34" rx="8" class="fg-good"/><text x="180" y="194" text-anchor="middle" class="t-sm">Fibrin fragments</text>
            <path d="M260 158 L240 180" class="fg-arrow" marker-end="url(#L05b)"/>
          </svg>
      - kind: check
        page: 72
        quote: "Plasmin in Capable of digesting fibrinogen, fibrin, factor V and VIII."
        question: "Which of these does plasmin NOT digest, according to the lecture?"
        options: ["Factor IX", "Fibrin", "Fibrinogen", "Factor V", "Factor VIII"]
        answer: 0
        why:
          - "صح: القايمة fibrinogen و fibrin و V و VIII بس."
          - "الـ fibrin هو الهدف الأساسي."
          - "الـ plasmin بيهضم الـ fibrinogen كمان."
          - "الـ V في القايمة."
          - "الـ VIII في القايمة."
      - kind: try
        items: [hem.L05.010, hem.L05.012, hem.L05.013, hem.L05.016, hem.L05.018]
    recap:
      - "Inhibitors: TFPI (Xa، VIIa، tissue factor)، antithrombin III (الأقوى، heparin يقوّيه)، protein C/S (يكسّروا V و VIII) عن طريق thrombomodulin."
      - "كل فرامل بتمسك حتة: TFPI أول الطريق، antithrombin الإنزيمات الشغالة، protein C المساعدين V و VIII."
      - "Fibrinolysis: tPA من الـ endothelium بيلزق في الـ fibrin ← plasmin يهضم fibrinogen و fibrin و V و VIII."
      - "Activated protein C بيزوّد الـ fibrinolysis لأنه بيكسّر الـ tPA inhibitors."
    practice: [hem.L05.010, hem.L05.011, hem.L05.012, hem.L05.013, hem.L05.014, hem.L05.015, hem.L05.016, hem.L05.017, hem.L05.018, hem.L05.019]
