items:
  # ---------- p292-293: introduction ----------
  - id: neph.L09.001
    kind: enumerate
    topic: intro
    prompt: Mention what an optimal renal replacement therapy should fulfil.
    points:
      - Purification of uraemic toxins
      - Electrolyte and acid–base homeostasis
      - Prevent further deterioration; preserve residual renal function
      - Accelerate recovery of acute kidney failure
      - Tolerance and flexibility of technique
      - No significant nutrient loss
    pass: 4
    src: { page: 293, quote: "Prevent further deterioration of renal function. Preserve residual renal" }
    status: unverified
  - id: neph.L09.002
    kind: card
    topic: intro
    front: What are the main renal replacement therapies for ESRD, and which gives the best overall outcome?
    back: Haemodialysis, peritoneal dialysis and renal transplantation; transplantation is the better overall treatment.
    src: { page: 293, quote: "The outcome comparison suggest that RT is a better overall treatment forESRD patients." }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.003
    kind: card
    topic: intro
    front: Is haemodialysis or peritoneal dialysis better for ESRD patients?
    back: Studies conflict; neither suits all patients, so the choice is made per patient (demographics, comorbidity, donor availability, economics, social circumstances, quality of life).
    src: { page: 293, quote: "Neither treatment modality is best suited for all patients." }
    status: unverified
  - id: neph.L09.004
    kind: cloze
    topic: intro
    text: "Most dialysis patients in the world are on haemodialysis, about {{c1::80%}}."
    src: { page: 293, quote: "In practice, most patients in the world are treated with hemodialysis (80%)." }
    status: unverified
    tags: [numbers]
  - id: neph.L09.005
    kind: card
    topic: intro
    front: At which CKD stage should RRT counselling start, and why then?
    back: Stage 4 CKD, to allow time for hepatitis B vaccination and for creating and maturing an arteriovenous fistula.
    src: { page: 293, quote: "Councelling for RRT should be in stage 4CKD, to allow time for hepatitis B vaccination" }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.006
    kind: mcq
    topic: intro
    stem: A 55-year-old with CKD stage 4 (eGFR 22) asks when he should start learning about dialysis and transplant. What does the book advise?
    options:
      - Now, at stage 4, to allow hepatitis B vaccination and fistula maturation
      - Only when eGFR falls below 10
      - Only once uraemic symptoms appear
      - At stage 5D, after the first dialysis
    answer: 0
    why:
      - "Correct: counselling belongs in stage 4 CKD (p293)."
      - Waiting this long leaves no time for a fistula to mature.
      - Symptoms mean he may start on a catheter, with no vaccination.
      - 5D means he is already on dialysis.
    src: { page: 293, quote: "Councelling for RRT should be in stage 4CKD, to allow time for hepatitis B vaccination" }
    status: unverified
