            answer: 0
            why: "Intermediate 10-19 mm non-invasive: hot snare polypectomy; submucosal injection reduces deep thermal injury."
          - reveal: "A pedunculated polyp, head 22 mm, stalk 8 mm."
            question: "And this?"
            options: ["Adrenaline 1:10 000 and/or mechanical hemostasis, then hot snare", "Hot snare alone", "Cold snare", "Refer for surgery"]
            answer: 0
            why: "Head 20 mm or more (or stalk 10 mm or more) needs bleeding prophylaxis first."
      - kind: table
        page: 203
        quote: "People with sessile adenomas that are removed in pieces"
        title: "ACS: لو كان عنده polyps قبل كده"
        columns: ["Finding", "Next look"]
