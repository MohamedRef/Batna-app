        title: "الـ UTI والـ stones"
        quote: "Urinary Tract Infection and Cyst Infection Urinary tract infection (UTI) is common in ADPKD, but its incidence may have been overestimated because sterile pyuria is common in these patients. UTI presents as cystitis, acute pyelonephritis, cyst infection, and perinephric abscesses. As in the general population, women are affected more frequently than men. Most infections are caused by Esch-erichia coli, Klebsiella and Proteus species, and other Enterobacteriaceae. The route of infection in acute pyelonephritis and cyst infection is usually retrograde from the bladder; therefore cystitis should be promptly treated to prevent complicated infections. Both CT and MRI are sensitive to detect complicated cysts and can.\nNephrolithiasis Renal stone disease occurs in about 20% of patients with ADPKD. Most stones are composed of uric acid, calcium oxalate, or both. Uric acid stones are more common in ADPKD than in stone formers without tubular ectasia, found in 15% of patients with ADPKD. CT urography has replaced IV urography in many centers; it is more sensitive in detect-ing small or radiolucent stones and for differentiating stones from tumor, clot, and cyst wall or parenchymal calcification. Dual-energy CT is increasingly used to distinguish between calcium and uric acid stones."
        text: |
          **urinary tract infection (UTI)**: شائعة بس ممكن تتقدّر بزيادة لأن الـ **sterile pyuria** شائع. الميكروبات: **E. coli، Klebsiella، Proteus**. الطريق **retrograde من المثانة**، علشان كده عالج الـ cystitis بسرعة.

          **Stones** في حوالي ==20%==: أغلبها **uric acid** أو calcium oxalate. الأحسن **computed tomography (CT) urography** (أحسن للـ radiolucent)، والـ **dual-energy CT** يفرّق الـ calcium من الـ uric acid.

          ليه الـ CT أحسن من السونار هنا؟ التفسير المقبول (مش في الكتاب): السونار بيشوف أكياس كتير فيها calcification في جدارها، فيصعب يفرّق الحصوة من جدار كيس متكلّس. والـ uric acid stones مش بتبان على الأشعة العادية (radiolucent) بس بتبان على الـ CT. وليه uric acid كتير؟ لأن البول في الـ ADPKD حامضي وفيه ammonia قليل، والبول الحامضي بيرسّب الـ uric acid.
