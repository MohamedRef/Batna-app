  - id: neph.L07.165
    kind: order
    topic: alport
    prompt: Order the evaluation of hematuria with a positive family history (book algorithm).
    steps:
      - Audiogram (if deafness suspected or family ESRD)
      - Ophthalmic examination
      - Skin biopsy with immunostaining for α5(IV)
      - Kidney biopsy with EM and α3, α4, α5 staining
      - Molecular genetics if tissue studies are not conclusive
    src: { page: 181, quote: "Evaluation of Patient with Hematuria and a Positive Family History\n  No proteinuria; No family history of ESRD\n    Audiogram: Yes – if any clinical suspicion of deafness\n    Ophthalmic examination: No\n    Skin biopsy with IHC for α5(IV) chain: Normal – Supports diagnosis of TBMN; Abnormal – Diagnostic of XLAS\n    Kidney biopsy with EM + IHC for α3, α4, and α5(IV) chains: Often unnecessary\n    Molecular genetics: Often unnecessary\n  No proteinuria; Family history of ESRD\n    Audiogram: Yes\n    Ophthalmic examination: May be helpful\n    Skin biopsy with IHC for α5(IV) chain: Abnormal – Diagnostic of XLAS; Normal – Does not rule out XLAS, ARAS, ADAS\n    Kidney biopsy with EM + IHC for α3, α4, and α5(IV) chains: Often diagnostic; May not be needed if affected relative has biopsy-proven AS; If patient very young, biopsy of older relative may be more informative\n    Molecular genetics: May be helpful when full clinical and tissue evaluation fails to provide firm diagnosis or\n  Proteinuria; Family history of hematuria and/or ESRD\n    Audiogram: Yes\n    Ophthalmic examination: May be helpful\n    Skin biopsy with IHC for α5(IV) chain: Abnormal – Diagnostic of XLAS; Normal – Does not rule out XLAS, ARAS, ADAS\n    Kidney biopsy with EM + IHC for α3, α4, and α5(IV) chains: Often diagnostic; May not be needed if affected relative has biopsy-proven AS; If patient very young, biopsy of older relative may be more informative\n    Molecular genetics: May be helpful when full clinical and tissue evaluation fails to provide firm diagnosis or" }
    status: unverified
  - id: neph.L07.166
    kind: card
    topic: alport
    front: What does light microscopy show in Alport syndrome by age?
    back: No pathognomonic lesion. Before age 5 usually normal; then mesangial hypercellularity and matrix expansion; later FSGS, and interstitial fibrosis with tubular atrophy in boys over 10.
    src: { page: 182, quote: "Alport syndrome (LM) There are no pathognomonic lesions by light microscopy or immuno- fluorescence in AS. In affected males, biopsies obtained before 5 years of age typically show no light microscopy changes. Mesangial hyper-cellularity and matrix expansion are typically observed in older children and adolescents. Glomeruli of affected males eventually show focal segmental glomerulosclerosis (FSGS), and interstitial fibrosis and tubular atrophy are often found in affected boys older than 10 years.21 Light Alport syndrome (IF) Fig. 46.4 Immunohistochemistry of kidney in patient with autosomal recessive Alport syndrome." }
    status: unverified
  - id: neph.L07.167
    kind: card
    topic: alport
    front: What is the characteristic EM finding in Alport syndrome?
    back: Variable thickening (up to 1200 nm), thinning, basket weaving and lamellation of the GBM, with the lamina densa split into strands around lucent areas that may hold 20–90 nm granules.
    src: { page: 183, quote: "Alport syndrome (EM) EM frequently reveals diagnostic abnormalities. In most patients with AS there is variable thickening, thinning, basket weaving, and lamellation of the GBM (Fig. 46.7). The thick segments measure up to 1200 nm in depth, usually have irregular outer and inner contours, and are found more frequently in males than in females. The lamina densa is transformed into a heterogeneous network of membranous strands, which enclose clear electron-lucent areas that may contain round granules of variable density measuring 20 to 90 nm in diameter. There are variable degrees of epithelial foot process fusion." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.168
    kind: cloze
    topic: tbm
    text: "A GBM width of {{c1::250}} nm separates normal adults from thin basement membrane nephropathy; in children the cut-off is {{c2::200–250}} nm."
    src: { page: 184, quote: "Light and immunofluorescence microscopy are unremarkable in typical cases of TBMN. Most patients exhibit diffuse thinning of the whole GBM and of the lamina densa (Fig. 46.9). GBM width is age and gender dependent in normal individuals.40 Both the lamina densa and the GBM make comparisons with published data meaningful. Typically, a value of 250 nm will accurately separate adults with normal GBM from those with TBMN. For children, the cut- off is in the range of 200 to 250 nm." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.169
    kind: enumerate
    topic: alport
    prompt: Mention the management of Alport syndrome.
    points:
      - No specific treatment
      - Early BP control, ACEI or ARB, and proteinuria reduction (including female carriers)
      - Screen family members for hematuria and raised BP
      - Genetic counselling
    pass: 3
    hook: "Alport مالوش specific treatment، فـ «احمي، افحص، انصح»: اضبط الضغط بدري بـ ACEI أو ARB وقلّل الـ proteinuria (حتى في الـ female carriers)، افحص العيلة لـ hematuria والضغط، وgenetic counselling."
    src: { page: 185, quote: "No specific treatment for Alport syndrome. As with all progressive nephropathies, good control of BP, use of ACE-I/ARB, and proteinuria reduction should be considered early; this includes ♀ carriers." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.170
    kind: card
    topic: alport
    front: What special risk follows kidney transplantation in Alport syndrome? Does it forbid transplant?
    back: In under 5%, de novo anti-GBM antibodies against the donor α5(IV) chain cause RPGN. It is not a contraindication to transplantation.
    src: { page: 185, quote: "Transplantation and Alport syndrome In <5%, transplanted Alport patients may develop de novo anti-GBM anti-bodies that cause an RPGN; i.e. donor a5 type IV collagen is recognized as non-self. It is not a contraindication to transplantation." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.171
    kind: card
    topic: tbm
    front: How are patients with thin basement membrane nephropathy followed?
    back: "Reassure but don't lose them: the risk of chronic renal impairment is small (under 5%) but real. Urinalysis, BP and renal function every 1–2 years."
