      - kind: explain
        page: 123
        title: "الـ resistance للـ imatinib"
        quote: "primary resistance may be due to overexpression of the BCR/ABL oncoprotein and overexpression of P- Glycoprotein which lead to effux of the drug"
        text: |
          ممكن تبقى **primary** أو **secondary**. الأسباب:
          - **Overexpression** للـ BCR/ABL نفسه (القفل كتير والمفاتيح قليلة)
          - **Overexpression** للـ ==P-glycoprotein== (بيطرد الدوا بره الخلية)
          - **Point mutations** في الـ ABL kinase domain، وأخطرها ==T315I==

          ويتوقع الاستجابة الأحسن: **low IC50** للـ imatinib، و **hOCT-1** طبيعي أو عالي (هو اللي بيدخّل الدوا).
      - kind: update
        page: 123
        quote: "seem to be especially resistant to the inhibitory action of imatinib and all other TKIs."
        text: "النهارده الـ **ponatinib** والـ **asciminib** شغالين على الـ T315I. في الامتحان: الكتاب بيقول بيقاوم كل الـ TKIs."
        ref: "ELN CML recommendations 2020; FDA approval of asciminib 2021"
      - kind: match
        page: 124
        quote: "side effects have included headaches, nausea, GIT disturbance, pancreatitis raised bilirubin level, prolonged QT intered."
        prompt: "وصّل الـ TKI بأهم حاجة فيه:"
        pairs:
          - ["Dasatinib", "Pleural effusion, 100 mg once daily"]
          - ["Nilotinib", "Long QT, pancreatitis, 400 mg twice daily"]
          - ["Bosutinib", "Diarrhea"]
          - ["Imatinib", "Needs hOCT-1 to enter cells"]
        why: "الـ dasatinib أوسع وأكتر myelosuppression ومعروف بالـ pleural effusion. الـ nilotinib أقوى 30 مرة من الـ imatinib وفيه QT وpancreatitis وbilirubin. الـ bosutinib سُمّيته الأساسية diarrhea. الـ imatinib بيدخل الخلية بالـ hOCT-1."
      - kind: aside
        tone: joke
        page: 124
        quote: "It is about 30 times more active than imatinib, the recommended dose, 400 mg twice daily"
        text: "الـ **nilotinib** أقوى من الـ imatinib **30 مرة**، بس زي الأخ الكبير اللي بيتعصب بسرعة: ==QT== طويل وpancreatitis. خليك جنبه بـ ECG."
      - kind: explain
        page: 125
        title: "باقي الأدوية والمراحل المتأخرة"
        quote: "Change of therapy from busulfan to hydroxyurea or vice versa is successful in 10 to 25% of patients."
        text: |
          **Cytogenetic directed therapy**: ==α-interferon== (5 million U/m2/day SC؛ آلام عضلات، حرارة، رعشة، **depression**، نزول وزن، alopecia خفيفة)، chemo زي AML، **imatinib (Gleevec)**، **BMT**.

          - **Accelerated phase**: بدّل ==busulfan ↔ hydroxyurea== (ينجح في 10–25%)، أو aggressive chemo، أو signal transduction inhibitor.
          - **Blast crisis**: عالجها **حسب نوع الـ acute leukemia** (myeloid ولا lymphoid).
      - kind: try
        items: [hem.L08.043, hem.L08.045, hem.L08.046, hem.L08.052, hem.L08.057]
    recap:
      - "فوري بس لو WBC >200,000، leukostasis، أو طحال بيوجع."
      - "Busulfan 4–8 mg، وقّف عند 20,000 (**BUSLF**). Hydroxyurea 1–4 g، وقّف عند 5,000."
