      - kind: explain
        page: 253
        title: "الـ D-xylose: البنكرياس بريء؟"
        quote: "D-Xylose is absorbed by SB by passive diffusion and does not require pancreatic enzymes for digestion and excreted in urine. D-xylose test can be useful to differentiate SB cause from pancreatic insufficiency. After administration of a 25-g dose orally to a well-hydrated patient, 5 g or more are normally excreted in the urine over 5 hours, and blood levels should reach 25 mg/dL 2 hours after the test dose. Low urine excretion and blood levels suggest disease of the mucosa of the proximal small intestine such as celiac disease."
        text: |
          الـ ==D-xylose== سكر بيتمص بالـ **passive diffusion** في الـ small bowel، و**مش محتاج pancreatic enzymes**، وبيطلع في البول.

          اديله **25 g** بالبُق: الطبيعي **5 g أو أكتر** في البول خلال **5 ساعات**، والدم يوصل **25 mg/dL** بعد ساعتين.

          لو **قليل** = المشكلة في الـ **mucosa** بتاعة الـ proximal small bowel (زي celiac). لو **طبيعي** مع steatorrhea = دوّر على البنكرياس.
