items:
  # ---------- p283-284: ESC/EAS 2019 risk categories ----------
  - id: dm.L23.001
    kind: card
    topic: risk
    front: Which guideline does the "what's new" lecture build its risk categories and LDL-C goals on?
    back: The 2019 ESC/EAS Guidelines for the management of dyslipidaemias (European Heart Journal 2020).
    src: { page: 283, quote: "2019 ESC/EAS Guidelines for the management of dyslipidaemias: lipid modification to reduce cardiovascular risk" }
    status: unverified
    update:
      text: "ESC/EAS published a 2025 focused update of the 2019 dyslipidaemia guidelines, and since the 2021 ESC prevention guidelines risk is estimated with SCORE2 / SCORE2-OP (fatal and non-fatal events), not the old SCORE (fatal only). Answer exam questions with the book's 2019 numbers."
      ref: "ESC CVD prevention guidelines 2021; ESC/EAS dyslipidaemia focused update 2025"
  - id: dm.L23.002
    kind: enumerate
    topic: risk
    prompt: "List the five groups the ESC/EAS 2019 places at very-high CV risk."
    points:
      - Documented ASCVD, clinical or unequivocal on imaging
      - "DM with target organ damage, ≥ 3 major risk factors, or early-onset T1DM of long duration (> 20 years)"
      - "Severe CKD (eGFR < 30)"
      - "Calculated SCORE ≥ 10% for 10-year risk of fatal CVD"
      - FH with ASCVD or with another major risk factor
    pass: 4
    src: { page: 283, quote: "FH with ASCVD or with another major risk factor." }
    status: unverified
    tags: [high-yield]
  - id: dm.L23.003
    kind: card
    topic: risk
    front: What counts as "unequivocally documented ASCVD on imaging" (ESC/EAS 2019)?
    back: "Findings that predict clinical events: significant plaque on coronary angiography or CT (multivessel disease, two major epicardial arteries > 50% stenosis), or on carotid ultrasound."
    src: { page: 283, quote: "multivessel coronary disease with two major epicardial arteries having >50% stenosis" }
    status: unverified
  - id: dm.L23.004
    kind: enumerate
    topic: risk
    prompt: "List the high-risk groups in the ESC/EAS 2019 table."
    points:
      - "Markedly elevated single risk factor: TC > 310 mg/dL, LDL-C > 190 mg/dL, or BP ≥ 180/110"
      - FH without other major risk factors
      - "DM without target organ damage, duration ≥ 10 years or another risk factor"
      - "Moderate CKD (eGFR 30-59)"
      - "SCORE ≥ 5% and < 10%"
    pass: 4
    src: { page: 284, quote: "Markedly elevated single risk factors, in particular TC >8 mmol/L (>310 mg/dL), LDL-C >4.9 mmol/L (>190 mg/dL)" }
    status: unverified
