  - kind: explain
    page: 7
    quote: |-
      In order to dissect a journal article, one should divide it into three main sections: the introduction, discussion, and conclusion.
      The introduction should further encompass four main elements:
      Article identifiers
      study type/PICO(T)
      A review of the medical literature
    title: المقدمة فيها 4 عناصر
    text: |-
      المقدمة في الـ appraisal لازم تغطي **4 عناصر**:

      - **Article identifiers**: مين كتبه وفين اتنشر.
      - **Study type / PICO(T)**: نوع الدراسة والسؤال.
      - **A review of the medical literature**.
      - **Methods (study design)**.

      افتكرها «==مين، إيه، ليه، إزاي==».
  - kind: check
    page: 8
    quote: |-
      In critical appraisal of a journal article, which of the following is NOT an element of the introduction section?
      A. Article identifiers
      B. PICO question
      C. Results
      D. A review of the medical literature
      E. Methods (study design)
      C
    question: In critical appraisal of a journal article, which of the following is NOT an element of the introduction section?
    options:
    - Results
    - Article identifiers
    - PICO question
    - Methods (study design)
    answer: 0
    why:
    - 'صح: الـ results في الـ discussion.'
    - أول عنصر في المقدمة.
    - تاني عنصر (study type/PICO).
    - آخر عنصر في المقدمة.
  - kind: explain
    page: 9
    quote: |-
      The main article identifiers are:
      The article name (Title) [what, who, where]
      Author
      Title of publication (Journal name, year, volume, issue, page numbers)
    title: الـ article identifiers = البطاقة الشخصية للمقال
    text: |-
      الـ identifiers الأساسية:

      - **Title**: بيقول what وwho وwhere.
      - **Author**.
      - **Title of publication**: اسم الـ journal، السنة، الـ volume، الـ issue، وأرقام الصفحات.

      دي بتفتح بيها الـ presentation كلها.
  - kind: check
    page: 11
    quote: |-
      In critical appraisal of a research article, the main article identifiers are all of the following EXCEPT:
      A. The article title
      B. The name and affiliation of the author(s)
      C. The year of publication
      D. The objective of the study
      D
    question: 'In critical appraisal of a research article, the main article identifiers are all of the following EXCEPT:'
    options:
    - The objective of the study
    - The article title
    - The name and affiliation of the author(s)
    - The year of publication
    answer: 0
    why:
    - 'صح: الـ objective مكانه مع الـ study type/PICO، مش في الـ identifiers.'
    - العنوان أول identifier.
    - الكاتب identifier.
    - السنة جزء من الـ title of publication.
  - kind: try
    items:
    - res.L20.001
    - res.L20.003
    - res.L20.004
    - res.L20.011
  recap:
  - 'Critical appraisal = systematic process لنقاط القوة والضعف: usefulness، applicability، validity.'
  - 'أهم حاجتين: التصميم مناسب للسؤال، ومتنفّذ صح.'
  - Prevalence ← cross-sectional، diagnosis ← gold standard، etiology ← cohort/case-control، prognosis ← cohort، intervention ← RCT.
  - 'المقدمة: identifiers، study type/PICO، literature review، methods.'
