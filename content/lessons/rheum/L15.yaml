  - id: rheum.L15.lesson2
    title: "سونار و MRI جديد، ومين معرّض"
    hook: "الـ X-ray بيشوف الـ OA لما يبقى متأخر. الأجهزة الجديدة بتسمع الـ cartilage وهو بيلين."
    minutes: 7
    pages: [235, 236]
    topics: [imaging, risk-types, treatment]
    goals:
      - "تعرف الجديد في السونار والـ MRI"
      - "تحفظ الـ risk factors وأماكنها والأنواع"
      - "تعرف أهداف العلاج وخطواته"
    status: unverified
    steps:
      - kind: table
        page: 235
        quote: "Superb microvascular Doppler could detect low-velocity blood flow. It is superior detect low-grade inflammation in knee OA."
        title: "الجديد في السونار"
        columns: ["Technique", "Shows"]
        rows:
          - ["Shear wave elastography", "Soft cartilage (low SWV), early OA"]
          - ["3D US", "Early osteophytes, cartilage volume"]
          - ["Superb microvascular Doppler", "Low-velocity flow, low-grade inflammation"]
          - ["Contrast-enhanced US", "Microbubble perfusion, mild synovitis"]
        hide: [[0, 1], [2, 1], [3, 1]]
      - kind: reveal
        page: 235
        quote: "Lower shear wave velocity (SWV) values indicate a softening in cartilage this may help in the diagnosis of early-stage OA."
        prompt: "ليه الـ shear wave velocity الواطية معناها cartilage تعبان؟"
        answer: "الموجة بتمشي أسرع في النسيج الجامد وأبطأ في الطري. الـ **cartilage** السليم جامد ومرن؛ لما يبدأ يبوظ بيلين، فالـ **SWV** تقل. وده بيحصل قبل ما الـ joint space يضيق في الـ X-ray."
      - kind: explain
        page: 235
        quote: "Determine the amount and network integrity of collagen, the amount of proteoglycans."
        title: "الـ Biochemical MRI"
        text: |
          الـ ==quantitative MRI== الجديد بيقيس:

          - مكونات الـ articular cartilage.
          - كمية و integrity الـ **collagen**، وكمية الـ **proteoglycans**.
          - الـ **perfusion** في الـ synovium والأنسجة التانية بالأرقام.
          - Lesions مرتبطة بالالتهاب: **infrapatellar fat pad** و **bone marrow lesions**.
      - kind: table
        page: 236
        quote: "Obesity (most sites, but more marked for the knee than other joints)."
        title: "الـ Risk factors"
        columns: ["Factor", "Sites"]
        rows:
          - ["Age", "All sites"]
          - ["Female sex", "Knee and hand mainly"]
          - ["Race", "Variable"]
          - ["Genetics", "All sites"]
          - ["Obesity", "Most sites, knee most"]
          - ["Trauma, occupation", "Repetitive activities"]
        hide: [[0, 1], [1, 1], [4, 1]]
      - kind: check
        page: 236
        quote: "Obesity (most sites, but more marked for the knee than other joints)."
        question: "Obesity is the most marked risk for OA at the:"
        options: ["Knee", "Hip", "Hand", "Shoulder"]
        answer: 0
        why:
          - "صح: most sites، بس أوضح في الركبة."
          - "الكتاب قال السمنة مش مرتبطة بـ hip OA أكتر."
          - "موجودة، بس الركبة أوضح."
          - "مش مذكورة."
      - kind: explain
        page: 236
        quote: "Primary: Nodular type. Erosive. Inflammatory. 2- Secondary to any MSK disease, diseases, trauma, metabolic and congenital conditions."
        title: "الأنواع والعلاج"
        text: |
          **الأنواع**:

          - **Primary**: nodular، ==erosive==، inflammatory.
          - **Secondary**: لأي MSK disease، trauma، metabolic أو congenital.

          **أهداف العلاج**: control pain، improve function، minimize disability، وتحسين الـ quality of life.

          **الخطوات**: education، moderate exercise، weight loss، physiotherapy، mechanical aids، أدوية، وجراحة.
      - kind: mnemonic
        page: 236
        quote: "Education. Moderate exercises. Weight loss programs. Physiotherapy for the joints. Mechanical aids or appliances."
        word: "EMWPAMS"
        parts:
          - { key: "E", text: "Education" }
          - { key: "M", text: "Moderate exercise" }
          - { key: "W", text: "Weight loss" }
          - { key: "P", text: "Physiotherapy" }
          - { key: "A", text: "Aids and appliances" }
          - { key: "M", text: "Medications" }
          - { key: "S", text: "Surgery" }
        hook: |
          اقراها كده: **Every Monday We Practice And Move Slowly**. من التثقيف للجراحة بالترتيب، والجراحة آخر حاجة.
      - kind: aside
        tone: trap
        page: 236
        quote: "Education. Moderate exercises. Weight loss programs. Physiotherapy for the joints. Mechanical aids or appliances."
        text: "سؤال الكتاب (ص 240) بيقولك: quadriceps strengthening **contraindicated** في الـ knee OA؟ لأ، ده الغلط. الرياضة والـ physiotherapy من أساسيات العلاج."
      - kind: try
        items: [rheum.L15.016, rheum.L15.018, rheum.L15.019, rheum.L15.021, rheum.L15.023]
    recap:
      - "SWE: SWV واطية = cartilage طري = early OA."
      - "Superb microvascular Doppler و contrast US: التهاب خفيف."
      - "Biochemical MRI: collagen و proteoglycans و perfusion."
      - "Obesity أوضح في الركبة؛ age و genetics كل الأماكن."
      - "Primary: nodular، erosive، inflammatory؛ العلاج يبدأ education و exercise و weight loss."
    practice: [rheum.L15.015, rheum.L15.016, rheum.L15.017, rheum.L15.018, rheum.L15.019, rheum.L15.020, rheum.L15.021, rheum.L15.022, rheum.L15.023, rheum.L15.044, rheum.L15.045, rheum.L15.052, rheum.L15.053]
  # ------------------------------------------------------------------
  - id: rheum.L15.lesson3
    title: "مستقبل علاج الـ OA: حقن وخلايا وجينات"
    hook: "الحباية مش بتوصل للـ cartilage. فالعلم قرر يدخل المفصل بنفسه بالحقنة."
    minutes: 8
    pages: [237, 240]
    topics: [ia-cell, dmoad]
    goals:
      - "تفهم ليه الـ intra-articular route"
      - "تعرف MSCs و gene therapy و ACI و PRP + HA"
      - "تعرف الـ DMOADs والـ MISHA وإمتى نحوّل لـ joint replacement"
    status: unverified
    steps:
      - kind: explain
        page: 237
        quote: "due to the local immune and paracrine dysregulation in the joint, paired with the avascular nature of articular cartilage."
        title: "ليه الحقن جوه المفصل؟"
        text: |
          الـ **oral drugs** صعب توصل بتركيز يغيّر الخلايا عشان:

          - الـ **local immune و paracrine dysregulation** في المفصل.
          - الـ cartilage ==avascular==.
          - والـ systemic route ممكن يعمل **toxicity**.

          الحل: ==intra-articular route== بـ local bioavailability أعلى وأمان أكتر.

          (الكتاب بيشير كمان لـ **ESCEO** stepwise algorithm للـ knee OA.)
      - kind: figure
        page: 237
        quote: "Intra-articular route for drugs can potentially enhance the local bioavailability, thereby maximizing therapeutic effects locally in the joint with a higher safety profile"
        title: "الحباية ضد الحقنة"
        alt: "Two paths to a knee joint. Top: a pill goes through the bloodstream, most of it spreads to the whole body with a warning of systemic toxicity, and only a thin arrow reaches the avascular cartilage. Bottom: a syringe injects directly into the joint with a thick arrow labelled high local level."
        caption: "الحباية بتتوزع على الجسم كله والـ cartilage مالوش أوعية. الحقنة بتحط الدوا في المكان على طول."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R15b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="R15c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="10" y="20" width="60" height="30" rx="15" class="fg-box"/>
            <text x="22" y="40" class="t-sm t-b">Oral</text>
            <path d="M75 35H150" class="fg-arrow" marker-end="url(#R15b)"/>
            <rect x="155" y="15" width="80" height="40" rx="6" class="fg-bad"/>
            <text x="162" y="33" class="t-sm">systemic</text>
            <text x="162" y="48" class="t-sm">toxicity</text>
            <path d="M195 58L255 100" class="fg-thin" marker-end="url(#R15b)"/>
            <text x="200" y="95" class="t-sm t-mut">little</text>
            <rect x="250" y="95" width="70" height="60" rx="10" class="fg-acc"/>
            <text x="258" y="120" class="t-sm t-b">Joint</text>
            <text x="258" y="138" class="t-sm">avascular</text>
            <rect x="10" y="185" width="60" height="30" rx="4" class="fg-box"/>
            <text x="16" y="205" class="t-sm t-b">IA shot</text>
            <path d="M75 200L245 150" class="fg-arrow-acc" stroke-width="5" marker-end="url(#R15c)"/>
            <text x="110" y="215" class="t-sm t-acc">high local level, safer</text>
          </svg>
      - kind: table
        page: 237
        quote: "Multiple sources (bone marrow, adipose, synovium). Their ability to self-renew, immunomodulatory properties."
        title: "الـ Cellular و gene therapy"
        columns: ["Therapy", "Key point"]
        rows:
          - ["MSCs", "Bone marrow, adipose, synovium; self-renew, immunomodulate, make chondrocytes"]
          - ["IA adipose MSCs", "Finished phase 4 trial, July 2021"]
          - ["Gene therapy", "Allogeneic chondrocytes + GP2-293 cells overexpressing TGF-β"]
          - ["ACI", "Large defects, durable; but invasive, needs lab culture"]
        hide: [[1, 1], [2, 1]]
      - kind: explain
        page: 238
        quote: "TGF-β is an anti-inflammatory cytokine that controls chondrocyte proliferation and differentiation, as well as ECM accumulation."
        title: "ليه TGF-β في الـ gene therapy؟"
        text: |
          الـ ==TGF-β== هنا **anti-inflammatory cytokine** بيتحكم في تكاثر وتمايز الـ chondrocytes وتراكم الـ **ECM**.

          الكتاب بيقول إن تجربتين phase 3 كبار كانوا شغالين في أمريكا (أكتوبر 2022).
      - kind: aside
        tone: trap
        page: 238
        quote: "TGF-β is an anti-inflammatory cytokine that controls chondrocyte proliferation and differentiation, as well as ECM accumulation."
        text: "لاحظ: الكتاب ذكر TGF-β مع IL-1β و TNF-α كـ cytokines بتأذي في الـ pathogenesis (ص 234)، وبعدين بيستخدمه كـ anti-inflammatory في الـ gene therapy (ص 238). لو اتسألت، جاوب حسب الجزء اللي السؤال جاي منه."
      - kind: explain
        page: 238
        quote: "PRP combined with HA is more effective than PRP or HA alone at inhibiting synovial inflammation"
        title: "الحقن التانية"
        text: |
          ==PRP + HA== أحسن من أي واحد لوحده في:

          - تقليل الـ synovial inflammation.
          - تحسين الألم والـ function.
          - أعراض جانبية أقل.

          والـ guidelines: **AAOS**، **ACR** (CR = conditionally recommended، CRA = conditionally recommended against)، **ESCEO**، **NICE**، **OARSI**، **PANLAR**، و **EULAR recommendations for IA therapies 2021**.
      - kind: match
        page: 239
        quote: "OARSI: Osteoarthritis Research Society International."
        prompt: "وصّل الاختصار بمعناه:"
        pairs:
          - ["OARSI", "Osteoarthritis Research Society International"]
          - ["ESCEO", "European Society for Clinical and Economic Aspects of Osteoporosis"]
          - ["AAOS", "American Academy of Orthopaedic Surgeons"]
          - ["CRA", "Conditionally recommended against"]
          - ["PANLAR", "Pan-American League of Rheumatology Associations"]
        why: "الكتاب بيعرّف الاختصارات دي في ص 238–239 عشان توصيات الـ IA therapies."
      - kind: explain
        page: 239
        quote: "Lorecivivint, intra-articular Wnt pathway inhibitor."
        title: "DMOADs والـ implant"
        text: |
          - ==Lorecivivint==: **intra-articular Wnt pathway inhibitor**؛ بيحسن صحة الـ chondrocytes ويقلل الالتهاب. نجح في **phase 2b (24 أسبوع)** في الـ knee OA، و phase III بدأت.
          - **MISHA Knee System** (FDA 2023): **shock-absorbing implant** للـ refractory knee OA، تحت الجلد في الـ medial extra-capsular space ومتثبت في الـ tibia والـ femur بـ screws، outpatient.
      - kind: explain
        page: 239
        quote: "Do not exclude people with osteoarthritis from referral for joint replacement because of their age, sex or gender, smoking, comorbidities, overweight or obesity."
        title: "إمتى نحوّل لـ joint replacement؟"
        text: |
          Hip أو knee أو shoulder OA لو:

          - الأعراض (ألم، stiffness، function أقل، deformity) ==substantially impacting quality of life==.
          - والـ non-surgical management فشل أو مش مناسب.

          و**ما تستبعدش** حد عشان: السن، الجنس، السجاير، الـ comorbidities، أو السمنة.
      - kind: case
        page: 239
        quote: "Their joint symptoms (such as pain, stiffness, reduced function or progressive joint deformity) are substantially impacting their quality of life ."
        stem: "A 76-year-old woman, BMI 36, smoker, with diabetes, cannot shop or climb stairs because of knee OA despite a year of physiotherapy, weight-loss attempts and analgesia."
        steps:
          - question: "Refer for knee replacement?"
            options: ["Yes", "No, too old", "No, BMI too high", "No, she smokes"]
            answer: 0
            why: "Symptoms substantially affect quality of life and non-surgical care failed; age, obesity, smoking and comorbidity must not exclude her."
          - question: "Her neighbour has early knee OA with mild synovitis. Which imaging can show mild synovitis?"
            options: ["Contrast-enhanced ultrasound", "Plain X-ray", "Shear wave elastography only", "DEXA"]
            answer: 0
            why: "Microbubble contrast US shows perfusion and helps detect mild synovitis."
