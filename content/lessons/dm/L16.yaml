        title: "الـ hypokalaemia بتعمل إيه؟"
        quote: "The clinical features of hypokalemia may vary with involvement of neuromuscular, CV & GIT systems, the most common manifestation being mild weakness of lower extremities & easy fatigability."
        text: |
          - الأشهر: ==ضعف خفيف في الرجلين== و **easy fatigability**.
