        quote: "Nonpharmacological interventions which may help prevent gout include"
        title: "ليه الأكل ده بيعلّي اليوريك؟"
        text: |
          الكتاب: قلّل **alcohol**، **meats**، و**high-fructose corn syrup**. وجدول الـ gout diet بيمنع الـ organ meats (كبدة، كلاوي، قلب) والـ shellfish، وبيسمح بالبروتين النباتي والألبان قليلة الدسم والمية.

          التفسير المقبول (مش في الكتاب):

          - الـ ==purines== بتتحول لـ uric acid. والأعضاء الداخلية والسمك الصغير زي السردين مليانين purines.
          - الـ ==fructose== بيتكسّر في الكبد بسرعة وبيستهلك ATP، وتكسير الـ ATP بيطلّع uric acid.
          - الـ **alcohol** (خصوصًا البيرة): فيها purines، والـ lactate اللي بيطلع من الكحول بينافس الـ urate على الخروج من الكلية.
          - الألبان قليلة الدسم بتزوّد خروج الـ urate في البول.

          **النتيجة**: purines أقل وfructose أقل **يعني** uric acid أقل.
