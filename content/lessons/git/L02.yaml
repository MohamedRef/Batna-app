            options: ["Locating obscure GIT bleeding", "Polyposis surveillance", "Jejunostomy tube placement", "Unexplained diarrhoea"]
            answer: 0
            why: "الكتاب: الـ **major indication** هي تحديد مكان الـ **obscure GIT bleeding**. التفسير المقبول (مش في الكتاب): منظار المعدة والقولون نضاف، فالمصدر غالبًا في المنطقة اللي بينهم."
          - question: "If a bleeding lesion is found, what can the enteroscope do in the same session?"
            options: ["Thermo coagulation of the lesion", "Nothing; it only takes pictures", "Stretta", "Z-POEM"]
            answer: 0
            why: "الكتاب: من الـ **therapeutic** indications **thermo coagulation of bleeding lesions**، لأن فيه **working channel**."
