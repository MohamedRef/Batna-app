  - id: rheum.L16.lesson5
    title: "التحاليل: RF، anti-CCP والـ synovial fluid"
    hook: "الـ RF مشهور بس بيتلكّك في أمراض كتير. الـ anti-CCP هو الشاهد اللي ما بيكدبش."
    minutes: 7
    pages: [257, 259]
    topics: [monitoring, serology, xray-fluid]
    goals:
      - "تقسّم التحاليل حسب الهدف: تشخيص، activity، damage، safety"
      - "تقارن الـ RF بالـ anti-CCP بالأرقام"
      - "تقرا الـ X-ray والـ synovial fluid بتاع الـ RA"
    status: unverified
    steps:
      - kind: explain
        page: 257
        title: "كل تحليل وليه"
        quote: "To monitor disease activity and drug efficacy."
        text: |
          - **التشخيص**: الـ criteria، ESR و CRP، الـ RF، X-ray، synovial fluid.
          - **الـ activity والدوا شغّال؟**: pain (VAS)، morning stiffness بالدقايق، عدد المفاصل الملتهبة، الـ APR، و ==DAS 28/44==.
          - **الـ damage**: X-rays و **HAQ** (Health Assessment Questionnaire).
          - **أمان الدوا**: urine، biochemistry، CBC.
      - kind: aside
        tone: trap
        page: 257
        quote: "Elevated in widespread disease. But may be normal in isolated small joint synovitis."
        text: "**CRP** طبيعي مش معناه إن المرض هادي. الـ APR بيعلى في المرض المنتشر (widespread disease)، بس ممكن يبقى طبيعي في **isolated small joint synovitis**."
      - kind: explain
        page: 257
        title: "الـ rheumatoid factor"
        quote: "Antiglobulin antibody of class 1gM, IgG, or IgA against Fc fragment of IgG."
        text: |
          الـ ==RF== = antibody (IgM أو IgG أو IgA) **ضد الـ Fc fragment بتاع الـ IgG**. يعني antibody ضد antibody.

          الـ agglutination tests بتكشف الـ **IgM RF**:
          - **Latex**: polystyrene particles عليها human IgG.
          - **Rose-Waaler**: sheep RBCs عليها rabbit anti-erythrocyte antibody. ==أقل sensitive بس أكتر specific==.
      - kind: explain
        page: 258
        title: "أرقام الـ RF"
        quote: "RF is positive in 85% of patients but early in 70% only."
        text: |
          - موجب في **85%** من الـ RA، بس في الأول **70%** بس.
          - الـ titre ==مالوش prognostic significance==.
          - وموجب كمان في: **Sjogren**، connective tissue diseases، **chronic liver disease**، sarcoidosis، multiple myeloma، و chronic infections (TB، leprosy، syphilis).
      - kind: explain
        page: 258
        title: "من antikeratin لـ anti-CCP"
        quote: "Their primary target antigen is the filament aggregating protein filaggrin."
        text: |
          الـ **antikeratin antibodies** (1970) هدفها الحقيقي ==filaggrin==. واتكشفت بـ immunofluorescence على rat oesophagus.

          اكتشفوا إنها بتمسك أجزاء فيها **citrulline** (arginine اتعدّل بعد الـ translation). فدلوقتي بنعمل ELISA للـ ==anti-CCP== (cyclic citrullinated peptides). والـ **ACPA** تقدير أوسع.
      - kind: figure
        page: 259
        quote: "Sensitivity in RA is 40% to 70%. Specificity may be 98%."
        title: "RF ضد anti-CCP"
        alt: "Two columns compared. RF: positive in 85% (70% early), also positive in many other diseases, titre has no prognostic value. Anti-CCP: sensitivity 40 to 70%, specificity up to 98%, found early and preclinically and in some RF-negative cases, predicts severity."
