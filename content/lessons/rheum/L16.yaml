  - id: rheum.L16.lesson5
    title: "التحاليل: ليه كل تحليل، والـ RF ضد الـ anti-CCP"
    hook: "الـ RF مشهور بس بيتلكّك في أمراض كتير. الـ anti-CCP هو الشاهد اللي ما بيكدبش."
    minutes: 8
    pages: [257, 259]
    topics: [monitoring, serology]
    goals:
      - "تقسّم التحاليل حسب الهدف وتعرف ليه"
      - "تفهم ليه الـ RF بيطلع في أمراض تانية"
      - "تقارن الـ RF بالـ anti-CCP بالأرقام والسبب"
    status: unverified
    steps:
      - kind: explain
        page: 257
        title: "كل تحليل وليه"
        quote: "To monitor disease activity and drug efficacy."
        text: |
          - **التشخيص**: الـ criteria، erythrocyte sedimentation rate (ESR) و C-reactive protein (CRP)، الـ rheumatoid factor (RF)، X-ray، synovial fluid.
          - **الـ activity والدوا شغّال؟**: pain (VAS)، morning stiffness بالدقايق، عدد المفاصل الملتهبة، الـ acute phase reaction (APR)، و ==Disease Activity Score (DAS) 28/44==.
          - **الـ damage**: X-rays و **Health Assessment Questionnaire (HAQ)** (Health Assessment Questionnaire).
          - **أمان الدوا**: urine، biochemistry، complete blood count (CBC).

          يعني كل تحليل بتطلبه لازم تعرف هو بيجاوب على أنهي سؤال من الأربعة.
      - kind: reveal
        page: 257
        quote: "To monitor drug safety.\n  Urine analysis Biochemistry Haematology."
        prompt: "ليه بنعمل CBC و LFT و urine لعيان حاسس إنه كويس؟"
        answer: |
          لأن الهدف هنا **drug safety** مش المرض. الأدوية اللي هتتعلمها في الـ csDMARDs بتأذي حاجات بعينها: الـ methotrexate الـ **marrow** والكبد، والـ ciclosporin الكلى. التفسير المقبول (مش في الكتاب): الضرر ده بيبدأ **صامت**، فلو استنيت الأعراض هتلاقيه متأخر.

          ونفس المنطق للـ **damage**: الـ erosions ما بترجعش، فبتتابعها بالـ X-ray والـ **health assessment questionnaire** علشان تغيّر العلاج قبل ما تزيد.
      - kind: aside
        tone: trap
        page: 257
        quote: "Acute phase response:\n  Elevated in widespread disease.\n  But may be normal in isolated small joint synovitis."
        text: "**CRP** طبيعي مش معناه إن المرض هادي. الـ APR بيعلى في المرض المنتشر (widespread disease)، بس ممكن يبقى طبيعي في **isolated small joint synovitis**."
      - kind: explain
        page: 257
        title: "الـ rheumatoid factor"
        quote: "Antiglobulin antibody of class 1gM, IgG, or IgA against Fc fragment of IgG."
        text: |
          الـ ==RF== = antibody (IgM أو Immunoglobulin G (IgG) أو Immunoglobulin A (IgA)) **ضد الـ Fc fragment بتاع الـ IgG**. يعني antibody ضد antibody.

          الـ agglutination tests بتكشف الـ **IgM RF**:
          - **Latex**: polystyrene particles عليها human IgG.
          - **Rose-Waaler**: sheep red blood cells (RBCs) عليها rabbit anti-erythrocyte antibody. ==أقل sensitive بس أكتر specific==.
      - kind: explain
        remind: [rheum.L16.089]
        page: 258
        title: "أرقام الـ RF"
        quote: "RF is positive in 85% of patients but early in 70% only."
        text: |
          - موجب في **85%** من الـ rheumatoid arthritis (RA)، بس في الأول **70%** بس.
          - الـ titre ==مالوش prognostic significance==.
          - وموجب كمان في: **Sjogren**، connective tissue diseases، **chronic liver disease**، sarcoidosis، multiple myeloma، و chronic infections (TB، leprosy، syphilis).

          يعني RF سالب في أول المرض ما يستبعدش الـ RA، و RF موجب لوحده ما يثبتهوش.
      - kind: reveal
        page: 258
        quote: "Chronic infections: TB, leprosy syphilis."
        prompt: "ليه الـ RF بيطلع موجب في الـ TB والـ chronic liver disease والـ myeloma؟ وده بيعمل إيه في قيمته؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ RF = antibody ضد الـ **Fc بتاع الـ IgG**. أي مرض فيه **تحفيز مزمن للمناعة** (infection مزمنة، كبد ملتهب، sarcoidosis، Sjogren) بيعمل IgG كتير و immune complexes، والجسم يرد بـ antibodies ضدهم. والـ **multiple myeloma** بيطلّع antibody من clone واحد ممكن يكون هو RF.

          فالـ RF موجب **مش** معناه RA. ده اللي بيخلّي الـ anti-CCP (ص 259) أهم في التشخيص، وبيخلّي الكتاب يقول إن الـ RF titre ==مالوش prognostic significance==.
      - kind: check
        page: 258
        quote: "RF titer has no prognostic significance."
        question: "Per the book, what does a very high RF titre tell you about prognosis?"
        options: ["Nothing: RF titre has no prognostic significance", "Erosions will be severe", "Extra-articular disease is certain", "Remission is unlikely"]
        answer: 0
        why:
          - "صح: الكتاب صريح: RF titer has no prognostic significance."
          - "الـ anti-CCP هو اللي بيتنبأ بالشدّة، مش رقم الـ RF."
          - "الكتاب ما ربطش رقم الـ RF بالـ extra-articular."
          - "الكتاب ما ربطش رقم الـ RF بالـ remission."
      - kind: explain
        page: 258
        title: "من antikeratin لـ anti-CCP"
        quote: "Anticitrulline antibody.\n  Antikeratin antibodies were described in 1970.\n  Their primary target antigen is the filament aggregating protein filaggrin.\n  Done on cryosection of rat oesaphagus by indirect immunofluorescence.\n  These antibodies actually bind to epitopes on filaggrin that contain citrulline derived by post-translational deamination of arginine.\n  Elisa determination of antibodies to citrullinated antigens is now used (Anticyclic citrullinated peptides or anti-CCP)."
        text: |
          الـ **antikeratin antibodies** (1970) هدفها الحقيقي ==filaggrin==. واتكشفت بـ immunofluorescence على rat oesophagus.

          اكتشفوا إنها بتمسك أجزاء فيها **citrulline** (arginine اتعدّل بعد الـ translation). فدلوقتي بنعمل enzyme-linked immunosorbent assay (ELISA) للـ ==anti-CCP== (cyclic citrullinated peptides). والـ **anti-citrullinated protein antibodies (ACPA)** تقدير أوسع.

          يعني الـ antikeratin والـ anti-CCP بيدوّروا على نفس الهدف (الـ citrulline)؛ اللي اتغيّر هو طريقة القياس: ELISA أسهل وأدق من الـ immunofluorescence على نسيج فار.
      - kind: figure
        page: 259
        quote: "Anti CCP antibodies are found in:\n  Early RA as well as in preclinical phase.\n  Some RF negative RA cases.\n  Anti CCP are predictors of severity of RA.\n  Sensitivity in RA is 40% to 70%.\n  Specificity may be 98%.\n    ACPA (anti citrullinated protein antibody) a broader estimation."
        title: "RF ضد anti-CCP"
        alt: "Two columns compared. RF: positive in 85% (70% early), also positive in many other diseases, titre has no prognostic value. Anti-CCP: sensitivity 40 to 70%, specificity up to 98%, found early and preclinically and in some RF-negative cases, predicts severity."
        caption: "الـ RF شبكته واسعة بس بيصطاد حاجات تانية. الـ **anti-CCP** شبكته أضيق بس **98% specific** وبيتنبأ بالشدّة."
        svg: |
