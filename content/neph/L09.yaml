  # ---------- p294: haemodialysis machine ----------
  - id: neph.L09.009
    kind: enumerate
    topic: hd-machine
    prompt: Besides vascular access, what are the essential components of haemodialysis?
    points:
      - Filter (dialyser)
      - Lines
      - Dialysate
      - Blood and dialysate delivery system (dialysis machine)
    pass: 3
    hook: "الغسيل غير الـ access = «فلتر، خراطيم، مية، ومكنة»: dialyser، lines، dialysate، والـ dialysis machine اللي بتوصّل الدم والـ dialysate."
    src: { page: 294, quote: "Esseential components of dialysis beside vascular access of the patient are: Filter/Dialyser - lines - dialysate - blood and dialysate delivery system (dialysis machine)." }
    status: unverified
  - id: neph.L09.010
    kind: card
    topic: hd-machine
    front: Describe the hollow-fibre dialyser and why dialysate flows countercurrent.
    back: A plastic chamber of capillary tubes (large surface area) through which blood circulates, while dialysate flows countercurrent outside the fibres to keep the solute concentration gradients.
    src: { page: 294, quote: "Dialyser: hollow fiber dialyser most commonly used: composed of plastic chamber including capillary tubes(to increase surface area) through which blood circulates while dialysate flows countercurrent(to maintain conc gradients of solutes) on the outside of the fiber bundles." }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.011
    kind: card
    topic: hd-machine
    front: Why is the dialysate made from two separate concentrates?
    back: To prevent insoluble calcium and magnesium salts forming with bicarbonate; a bicarbonate concentrate and an acid concentrate (all other solutes, no bicarbonate) are mixed with purified water by the machine.
    src: { page: 294, quote: "Dialysate: to prevent formation of insoluble calcium and magnesium salts with bicarbonate the final dialysate is formed from two separate components the bicarbonate concentrate (now commercially available dry powder bicarbonate cartridges to avoid infection) and acid concentrate ,the later contains all solutes(but no bicarbonate) in a concentration 34-36times that of final dialysate and contains small amount of acetate(3mEq/L in final dilution).The dialysate delivery system of dialysis machine draws up the two components separetaly and mixes them with purified treated water . For a session of 4 hours the patient blood is exposed to 120 litres of water, (dialysate flow 500ml/min). To get purified water it should be subjected to filtration, softening, activated charcoal filtration and reverse osmosis to remove chloramines, microbiologic contaminants and dissolved ions." }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.012
    kind: cloze
    topic: hd-machine
    text: "The acid concentrate holds all solutes except bicarbonate at {{c1::34–36}} times the final dialysate concentration, with a small amount of {{c2::acetate}} ({{c3::3 mEq/L}} in final dilution)."
