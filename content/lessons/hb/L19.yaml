          - **Gall stones**: صورة ERCP. المنظار عند الـ papilla، والصبغة ملت القنوات والمرارة، والحصوات باينة ==filling defects==: فراغات جوّه الصبغة.

          ليه فراغ؟ لأن الحصوة مش بتاخد صبغة، فالصبغة بتلفّ حواليها. ودي لغة كل الصور اللي فيها صبغة: الـ ERCP والـ PTC والـ cholecystography (تفسير مقبول).
