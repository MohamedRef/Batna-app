  - id: res.L17.027
    kind: card
    topic: significance
    front: "What is the P value, and how should it be reported?"
    back: "The observed level of significance (the probability of chance). Rather than only stating \"significant\" or \"not significant\", it is preferable to report the exact probability, the P value."
    src: { page: 17, quote: "P-value\nP-value is known as the observed level of significance (probability of the chance).\nInstead of stating our findings in the form of there is a significant difference or there is no significant difference, it is preferable to report the exact probability (referred to by P-value)" }
    status: unverified
    update: { text: "Precisely, P is the probability of a result at least as extreme as the one observed if H0 were true. It is not the probability that H0 is true, and it does not measure the size of an effect.", ref: "Wasserstein and Lazar, ASA statement on p-values, 2016" }
  - id: res.L17.028
    kind: mcq
    topic: significance
    stem: "The P value is also known as:"
    options:
      - "The level of significance chosen before the study"
      - "The observed level of significance"
      - "The critical value"
      - "The degree of freedom"
      - "The power of the study"
    answer: 1
    why:
      - "That is α, fixed in advance; P comes from the data."
      - "The slide: P-value is the observed level of significance (probability of the chance)."
      - "The critical value comes from the table."
      - "Degrees of freedom count independent pieces of information."
      - "Power is 1 − β, not P."
    src: { page: 17, quote: "P-value is known as the observed level of significance (probability of the chance)." }
    status: unverified
  - id: res.L17.029
    kind: cloze
    topic: significance
    text: "Making a decision depends on the {{c1::critical value}}, which in turn depends on the {{c2::level of significance}} and the {{c3::degree of freedom}}."
    src: { page: 18, quote: "Making a decision\nMaking a decision depends on the critical value which, in turn, depends on the level of significance and degree of freedom." }
    status: unverified
    tags: [numbers, high-yield]
  - id: res.L17.030
    kind: card
    topic: significance
    front: "How do you decide using the critical value?"
    back: "If the test value is ≥ the critical value, reject the null hypothesis. If it is < the critical value, accept the null hypothesis: there is no significant difference in the parameter of interest between the 2 groups."
    src: { page: 19, quote: "If the test value is ≥ to the critical value then a decision is made to reject the null hypothesis.\nIf the test value is < than the critical value, a decision is made to accept the null hypothesis and, concluding that there is no significant difference in the parameter of interest between the 2 groups." }
    status: unverified
