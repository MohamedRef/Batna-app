        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 488
        title: "ليه الـ DAA الأول، وإمتى تزوّد؟"
        quote: "5.2: We recommend that patients with HCV-associated glomerular disease be treated for HCV (1A)."
        text: |
          - **Biopsy** لأي HCV فيه دليل على glomerular disease: لأن الـ lesions كتير وعلاجها مختلف.
          - **عالج الـ HCV** للكل (**1A**): لأن الفيروس هو اللي بيشغّل الـ clone. شيل السبب، الـ antigen يقل والـ cryoglobulins تقل.
          - Function **مستقرة** و/أو **non-nephrotic**: **DAA** لوحده في الأول.
          - **Cryoglobulinemic flare** أو **nephrotic** أو **rapidly progressive**: DAA **+ immunosuppression ± plasma exchange**. التفسير المقبول (مش في الكتاب): هنا الكلية بتضيع أسرع من ما الـ DAA يلحق، والـ PEX بيشيل الـ cryoglobulins من الدم على طول.
          - Active ومش بيستجيب للـ antiviral (خصوصًا cryoglobulinemic): immunosuppression، و **rituximab first-line** لأنه بيضرب الـ **B-cell clone** نفسه.
      - kind: check
        page: 488
        quote: "We recommend that patients with cryoglobulinemic flare, nephrotic syndrome, or rapidly progressive kidney failure be treated, in addition to DAA treatment, with immunosuppressive agents with or without plasma exchange (1C)."
        question: "An HCV patient has cryoglobulinemic GN with creatinine rising weekly and nephrotic proteinuria. What does KDIGO advise?"
        options:
          - "DAA plus immunosuppression, with or without plasma exchange"
          - "DAA alone, then reassess in 6 months"
          - "Immunosuppression alone; defer DAA"
          - "Plasma exchange alone"
        answer: 0
        why:
          - "صح: flare أو nephrotic أو rapidly progressive = DAA + immunosuppression ± PEX."
          - "الـ DAA لوحده للي الـ function مستقرة و non-nephrotic."
          - "الـ HCV لازم يتعالج للكل (1A)."
          - "الـ PEX إضافة، مش لوحده."
      - kind: explain
        page: 489
        title: "HBV: الـ MN، ومين ياخد علاج"
        quote: "The most common pattern of glomerular injury seen in HBV infection is MN."
        text: |
          - الأشهر **MN**. الأقل: IgAN، MPGN، FSGS، crescentic. ونادرًا **MCD** بيعمل remission بعد الـ antiviral.
          - فيه مرضى HBV + MN عندهم ==anti-PLA2R== كمان. التفسير المقبول (مش في الكتاب): يعني ممكن الاتنين يكونوا مع بعض صدفة، فالـ anti-PLA2R الإيجابي مش بينفي إن الـ HBV له دور.
          - الـ extrahepatic: vasculitis، خصوصًا **polyarteritis nodosa**، و cryoglobulinemia type II و III.

          العلاج: **replicative** (HBV DNA ≥**2000 IU/mL**) + GN = **nucleos(t)ide analogues** زي الناس العادية. وليه تقريبًا الكل؟ الكتاب بيقول عشان ==poor prognosis of untreated HBV== (HCC، cirrhosis، GN، vasculitis) ووجود أدوية فعالة (==effective (but not curative)==).
      - kind: match
        page: 489
        quote: "The most common pattern of glomerular injury seen in HBV infection is MN."
        prompt: "وصّل الفيروس بأشهر lesion:"
        pairs:
          - ["HCV", "Cryoglobulinemic MPGN"]
          - ["HBV", "Membranous nephropathy"]
          - ["HIV", "HIVAN (collapsing FSGS) and others"]
        why: "الـ hepatitis C virus (HCV) بيعمل membranoproliferative glomerulonephritis (MPGN) من الـ cryoglobulins (type II 90%)، وكمان membranous glomerulonephritis (MGN). الـ hepatitis B virus (HBV) أشهر حاجة membranous nephropathy (MN). والـ human immunodeficiency virus (HIV) ليه الـ HIV-associated nephropathy (HIVAN)، والـ HCV ممكن يعمل focal segmental glomerulosclerosis (FSGS) زيه بأذى مباشر للـ podocyte."
      - kind: explain
        page: 490
        title: "HIV: الـ biopsy مش دايمًا HIVAN"
        quote: "Breakdown of diagnoses (n):\nImmune complex GN\nDiabetic nephropathy\nHIVAN\nTenofovir toxicity\nFocal segmental glomerulosclerosis (NOS)\nGlobal sclerosis (NOS)\nAcute tubular injury\nOther tubulointerstitial disease\nOther glomerular disease\nOther vascular disease\nDual diagnoses were present in 17% of cases"
        text: |
          الـ figure بيوريك إن الـ biopsy في مرضى HIV فيها تشخيصات كتير: **immune complex GN**، **diabetic nephropathy**، **HIVAN**، **tenofovir toxicity**، FSGS، global sclerosis، acute tubular injury وغيرهم، و ==Dual diagnoses were present in 17%==.

          ليه ده مهم؟ التفسير المقبول (مش في الكتاب): مريض HIV عايش أطول دلوقتي، فبيجيله سكر وضغط زي أي حد، وكمان الأدوية نفسها (tenofovir) بتأذي الـ tubules. فمتفترضش إن كل كلية واقعة = HIVAN.

          والتوصية: ابدأ **ART** لكل مريض HIV مع CKD، خصوصًا **HIVAN**، ==regardless of CD4 count== ومظبوطة على الـ kidney function.
