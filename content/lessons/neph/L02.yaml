      - kind: explain
        page: 61
        quote: "If medications are discontinued during an acute illness or before a"
        title: "ليه الأدوية دي بالذات في يوم المرض؟"
        text: |
          الكتاب بيوقف metformin و ACEi و ARBs و diuretics و SGLT2i قبل العملية أو في المرض الحاد، ولما الأدوية تتوقف (**discontinued**) بيقول **اكتب خطة ترجعها إمتى**.

          التفسير المقبول (مش في الكتاب): لما المريض يرجّع أو يسهل أو مايقدرش ياكل، الـ volume يقل. الكلية بتدافع عن الـ GFR بإنها تضيّق الـ efferent (angiotensin) وتوسّع الـ afferent (prostaglandins). والأدوية دي بتشيل الدفاع ده:

          - ==ACEi/ARB== بيمنعوا تضييق الـ efferent، والـ NSAIDs بتمنع توسيع الـ afferent.
          - الـ **diuretics** بتسحب volume أكتر.
          - الـ **metformin** بيتجمع لو حصل AKI ويعمل lactic acidosis.
          - الـ **SGLT2i** مع قلة الأكل = ketoacidosis.

          وليه خطة الرجوع مهمة؟ لأن أدوية زي الـ RAASi والـ SGLT2i هي اللي بتحمي الكلية، ولو ماحدش رجّعها، المريض يخسر الحماية للأبد.
      - kind: figure
        page: 61
        quote: "Figure 42: Essential steps for appropriate sick day rule implementation. From Hall RK et al. Nature Rev Nephrol (submitted)."
        title: "شكل 42 في الكتاب: الـ sick day rule"
        image: { file: neph/L02-sick-day-steps.webp, book: true }
        alt: "Book strip, Figure 42, of five steps with icons: sick (a person in bed); identifies dehydrating illness (a glass of water); recalls or retrieves the list of pills to stop (a head); identifies and stops pills (a pill bottle); recovers and resumes pills (a green tick)."
        caption: |
          5 صور من الشمال لليمين، وتحت كل واحدة خطوة:

          1. **Sick** (واحد في السرير).
          2. **Identifies dehydrating illness** (كوباية مية): يعرف إن ده مرض بيجفّف (إسهال، ترجيع، حرارة).
          3. **Recalls or retrieves list of pills to stop** (دماغ): يفتكر القايمة.
          4. **Identifies and stops pills** (علبة دوا): يوقف الأدوية دي.
          5. **Recovers and resumes pills** (علامة صح خضرا): لما يخف ==يرجّعها==.

          الخطوة الأخيرة هي اللي بتتنسي، ومن غيرها المريض يفضل من غير ==RAASi و SGLT2i== اللي بيحموا كليته.
      - kind: explain
        page: 61
        quote: "Consider planned discontinuation of medications (such as metformin, ACEi, ARBs, diuretics and SGLT2i) in the 48–72 hours prior to elective surgery or during the acute management of adverse effects."
        title: "الـ sick-day rules والعمليات"
        text: |
          المريض **يعرف** إنه عنده dehydrating illness ← **يفتكر** قايمة الأدوية ← **يوقفها** ← لما يخف **يرجّعها**.

          قبل عملية elective بـ ==48–72 ساعة==: وقّف **metformin، ACE inhibitor (ACEi)، angiotensin II receptor blocker (ARB)، diuretics، SGLT2 inhibitor (SGLT2i)**. ودايمًا اكتب ==إمتى يرجّعها==.


          - ACEi/ARB ← hypotension، acute kidney injury (AKI)
          - Diuretics ← volume depletion، AKI
          - SGLT2i ← ketoacidosis
          - NSAIDs ← AKI، acute interstitial nephritis (AIN)

          التفسير المقبول (مش في الكتاب): بنوقفهم **لأن** مع الجفاف كل دوا منهم بيزوّد خطر الـ AKI أو الـ acidosis، ونرجّعهم بعد ما يخف **عشان** فايدتهم على المدى الطويل متضيعش.
      - kind: update
        page: 61
        quote: "Consider planned discontinuation of medications (such as metformin, ACEi, ARBs, diuretics and SGLT2i) in the 48–72 hours prior to elective surgery or during the acute management of adverse effects."
        text: "الكتاب قال 48–72 ساعة لكل الأدوية دي، بس الـ **SGLT2i** بالذات: الـ FDA غيّرت الـ label سنة 2020 إنه يتوقف **3 أيام على الأقل** قبل العملية (والـ **ertugliflozin 4 أيام**)، بسبب الـ ==euglycemic ketoacidosis==. والـ American Diabetes Association (ADA) بتقول نفس الكلام. في الامتحان اكتب إجابة الكتاب: **48–72 ساعة**."
        ref: "FDA SGLT2 inhibitor label change 2020; ADA Standards of Care in Diabetes 2024, section 16"
      - kind: explain
        page: 61
        quote: "Risks and benefits of imaging studies should be determined on an"
        title: "الصبغة: ليه group II و III؟"
        text: |
          الكتاب: الفايدة والخطر من أي imaging بيتحددوا **لكل مريض لوحده**، وفي الـ MRI مع **GFR < 30** استخدم gadolinium من ==American College of Radiology group II أو III==.

          التفسير المقبول (مش في الكتاب): الـ gadolinium بيطلع من الكلية. لما الـ GFR يبقى واطي جدًا بيقعد في الجسم أطول، والأنواع القديمة (group I) كانت مرتبطة بمرض خطير في الجلد والأعضاء اسمه **nephrogenic systemic fibrosis**. الـ group II و III أكثر ثباتًا فالخطر أقل بكتير.

          وفي ص 62 للصبغة اليودية: الـ risk factors هي السن والسكر والضغط والـ volume depletion والـ nephrotoxins، والـ **eGFR < 30** = خطر عالي. والـ **hydration** ماتتعملش لو المريض hypervolemic أو عنده heart failure.
      - kind: figure
        page: 62
        title: "الصبغة والـ AKI: رسمة الكتاب"
        image: { file: neph/L02-contrast-aki.webp, book: true }
        alt: "Book flowchart: high risk of contrast-associated acute kidney injury? (eGFR under 30, or eGFR 30-44 with additional risk factors). Left note: use validated tools to estimate risk. Right note: risk factors include age, diabetes, hypertension, volume depletion and concomitant nephrotoxins. No: proceed with planned intervention, no need for prophylactic measures, consider holding diuretics and nephrotoxic medications. Yes: discuss whether an equivalent alternative to the planned study is available. Yes: proceed with alternative study. No: hold diuretics and nephrotoxic agents, administer prophylactic isotonic saline, use the lowest necessary dose of iodinated contrast media. Note: hydration is not indicated in cases of hypervolemia or decompensated heart failure."
        caption: |
          - **فوق**: **High risk of contrast-associated AKI؟** يعني **eGFR <30**، أو **30–44** مع risk factors (يمين: السن، السكر، الضغط، الجفاف، أدوية nephrotoxic).
          - **No (يمين)** ← اعمل الأشعة عادي، ==مفيش prophylaxis==، وفكّر توقف الـ diuretics والأدوية الضارة.
          - **Yes (شمال)** ← فيه **بديل** يدّي نفس المعلومة من غير صبغة؟
            - **Yes** ← **Proceed with alternative study**.
            - **No** ← وقّف الـ diuretics والـ nephrotoxins، **isotonic saline** وقاية، و==أقل جرعة== iodinated contrast.
          - **تحت يمين**: **Hydration is not indicated** في الـ hypervolemia أو الـ decompensated heart failure.

          الرسمة بتقول إن ==الـ eGFR <30== هو الحد اللي يخليك تفكر، وإن المية مش للكل.
      - kind: reveal
        page: 61
        quote: "In MRI → American Colleague of Radiology group II and III Gadolinium- Based Contrast agents if GFR <30 ml/min per 1.73 m2 (CKD G4–G5)."
        prompt: "مريض eGFR 24 محتاج MRI بصبغة، ومريض تاني eGFR 40 + diabetes محتاج CT بصبغة. تعمل إيه؟"
        answer: "الـ **magnetic resonance imaging (MRI)**: استخدم gadolinium من **American College of Radiology (ACR) group II أو III** (GFR < 30). الـ **computed tomography (CT)**: eGFR 30–44 + risk factor = **high risk** للـ contrast AKI: شوف بديل، وقّف الـ diuretics والـ nephrotoxins، **isotonic saline** (لو مفيش overload)، و**أقل dose** صبغة."
