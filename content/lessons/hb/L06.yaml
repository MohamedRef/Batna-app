            <text x="165" y="432" text-anchor="middle" class="t-b t-good">Insulin only</text>
            <text x="165" y="452" text-anchor="middle" class="t-sm">basal long-acting ± rapid-acting analog</text>
            <text x="165" y="472" text-anchor="middle" class="t-sm">close titration, glucose monitoring</text>
          </svg>
      - kind: reveal
        page: 110
        prompt: "ليه الأقراص بتتشال كلها في الـ decompensated cirrhosis ونفضل على الـ insulin؟"
        answer: |
          الكتاب بيقول «insulin» ويحذّر من كل قرص؛ والمنطق (physiology مقبول):

          - الكبد المتعب مابيكسّرش الأدوية كويس، ومخزون الـ glycogen والـ **gluconeogenesis** عنده ضعاف، فأقراص زي الـ sulfonylurea ممكن تعمل **hypoglycemia** طويلة.
          - الـ metformin مرتبط بالـ decompensation (والكتاب بيحذّر منه حتى في compensated).
          - الـ insulin بقى الوحيد اللي تقدر **تظبطه بالوحدة** وتراقبه، فده معنى **close titration**.
      - kind: check
        page: 110
        question: "A 64-year-old man with MASH cirrhosis, ascites and prior hepatic encephalopathy has HbA1c 8.6%. Which treatment fits the lecture?"
        options:
          - "Basal insulin with or without rapid-acting insulin"
          - "Metformin"
          - "Glimepiride"
          - "Pioglitazone"
        answer: 0
        why:
          - "صح: ascites و HE = **decompensated**، يعني insulin only مع close titration."
          - "الـ metformin محتاج caution حتى في الـ compensated."
          - "الـ sulfonylureas للـ compensated وبجرعة صغيرة."
          - "الـ TZDs مش للـ decompensated (وفي الـ compensated: caution CV events)."
      - kind: explain
        page: 110
        title: "Obeticholic acid: القصة اللي ماكملتش"
        text: |
          - **إيه هو؟** **Obeticholic acid** (Ocaliva): bile acid analogue of chenodeoxycholic acid، بس 100× more potent.
          - **بيشتغل إزاي؟** First-in-class selective potent ==FXR== (farnesoid-X receptor) agonist، وليه anti-inflammatory و anti-fibrotic effect.
          - **حصل إيه؟** ==FDA rejection twice== كعلاج للـ MASLD (NASH).

          يعني الآلية كانت مبشرة على الورق، بس ماعدّاش. وده بيمهّد للدوا اللي عدّى في الخطوة الجاية.
      - kind: explain
        page: 110
        title: "Resmetirom (Rezdiffra): أول واحد عدّى"
        text: |
          - **Approval**: FDA approval for MASLD في 14/3/2024.
          - **لمين؟** MASLD ==F2 و F3==، in conjunction with diet and exercise. يعني مش بديل عن الـ lifestyle، ده فوقه.
          - **بيشتغل إزاي؟** ==THR-β== (thyroid hormone receptor-beta) agonist. لما الـ receptors دي تتنشط في الكبد، الـ intrahepatic triglyceride accumulation بيقل.
          - **بيتاخد إزاي؟** Oral، once daily.
          - **النتايج**: NASH resolution في 30%، و fibrosis regression بمرحلة على الأقل في 26%.
      - kind: aside
        tone: analogy
        page: 110
        text: |
          الـ thyroid hormone هو **ترموستات الحرق** في الجسم. الـ resmetirom بيدوّر الترموستات ده **في الكبد بس** (لأنه بيختار receptor **β** اللي موجود في الكبد)، فالكبد يحرق دهونه من غير ما القلب يتعب ويدق جامد زي ما يحصل مع thyroid hormone عادي.

          (الكتاب بيقول THR-β agonist يقلل الـ TG في الكبد؛ حكاية «القلب» شرح physiology مقبول.)
      - kind: update
        page: 111
        text: "Semaglutide 2.4 mg (Wegovy) أخد FDA accelerated approval للـ non-cirrhotic MASH مع F2–F3 fibrosis في أغسطس 2025. في الامتحان: الكتاب بيقول resmetirom هو الـ newly approved."
        ref: "FDA approval of Wegovy for MASH, August 2025"
      - kind: table
        page: 111
        title: "ADA MASLD treatment algorithm (prediabetes or diabetes)"
        columns: ["Stage", "Diabetes drugs", "MASH drugs"]
        rows:
          - ["F0–F1", "Prefer GLP-1RA, dual GIP/GLP-1RA, pioglitazone, SGLT2i", "Not indicated"]
          - ["F2–F3 (at-risk MASH)", "Prefer GLP-1RA, dual GIP/GLP-1RA, pioglitazone", "Resmetirom, GLP-1RA"]
          - ["Compensated cirrhosis", "As F2–F3, with caution", "Avoid"]
          - ["Decompensated cirrhosis", "Only use insulin", "Avoid"]
        hide: [[0, 2], [1, 2], [2, 2], [3, 1]]
      - kind: aside
        tone: trap
        page: 111
        text: |
          الـ **resmetirom** للـ **F2–F3** بس:

          - **F0–F1**: MASH drugs **not indicated**.
          - **Cirrhosis** (compensated أو decompensated): **avoid**.

          وفي الـ ADA، بنفكر فيه **بعد 6–12 شهر** من تظبيط علاج الـ obesity و/أو الـ diabetes.
      - kind: case
        page: 111
        stem: "A 60-year-old woman with MASLD cirrhosis (Child-Pugh A, no varices) has T2DM on metformin and glimepiride."
        steps:
          - question: "Her doctor wants to add resmetirom. Is that right?"
            options: ["No; avoid resmetirom in cirrhosis", "Yes; F4 is the main indication", "Yes, together with vitamin E", "Only after 3 months of metformin"]
            answer: 0
            why: "الـ resmetirom approved لـ **F2–F3**، والـ ADA بيقول **avoid** في الـ cirrhosis."
          - reveal: "A year later she develops ascites and hepatic encephalopathy."
            question: "How should her diabetes be treated now?"
            options: ["Insulin only", "Add pioglitazone", "Keep metformin and glimepiride", "Switch to a DPP-4 inhibitor"]
            answer: 0
            why: "بقت **decompensated**: basal ± rapid-acting insulin مع close titration."
      - kind: explain
        page: 112
        title: "الخلاصة بتاعة الكتاب"
        text: |
          المحاضرة كلها في 4 جمل، وكل جملة بترجعك لدرس:

          - **الاسم** (درس 1): SLD اسم جديد بدل NAFLD، بيحدد السبب بدقة (أو المختلط) ومن غير stigma.
          - **العلاج الأساسي** (درس 5): diet و lifestyle modification و treatment of components of metabolic syndrome هما الـ main options.
          - **الجديد** (الدرس ده): ==resmetirom== newly FDA-approved بنتايج مبشرة.
          - **أدوية السكر** (درس 6): بعضها بيحسّن الـ histology، وده يبرر استخدامها بس في مرضى السكر اللي عندهم MASLD لو فيه indication.
      - kind: try
        items: [hb.L06.058, hb.L06.061, hb.L06.062, hb.L06.067, hb.L06.068]
    recap:
      - "Compensated cirrhosis: metformin (decompensation)، SU (low dose، hypoglycemia)، TZD (CV events)، DPP-4 (hepatic failure)، GLP-1/SGLT2 (limited data)."
      - "Decompensated: **insulin only** (basal ± rapid)، close titration."
