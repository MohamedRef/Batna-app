  - id: dm.L10.008
    kind: card
    topic: power
    front: What is the power of insulin, and what limits its use?
    back: It has essentially unlimited power to lower plasma glucose; the primary limitation is hypoglycemia.
    src: { page: 126, quote: "The primary limitation to insulin's usefulness as a diabetes drug is hypoglycemia." }
    status: unverified
    tags: [high-yield]
