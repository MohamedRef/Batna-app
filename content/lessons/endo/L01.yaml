        hide: [[0, 1], [2, 1], [3, 1]]
      - kind: update
        page: 9
        quote: "1- Prolactinomas with dopamine antagonists (bromocreptine or cabergolin) normalizes serum prolactin and prevents further tumor growth."
        text: "الكتاب كاتب إن الـ bromocriptine والـ cabergoline **dopamine antagonists**، والصح إنهم **dopamine (D2) agonists**: الـ dopamine هو اللي بيقفل الـ prolactin. الأدوية وتأثيرها زي الكتاب بالظبط، بس لو كتبت النوع في الامتحان اكتب agonist."
        ref: "Endocrine Society clinical practice guideline: hyperprolactinemia 2011"
      - kind: explain
        page: 9
        quote: "These are multicentric, malignant in 1/3 and cause death in 10 to 20% of patients."
        title: "3. الـ pancreatic islet tumors"
        text: |
          - **Multicentric**، malignant في ==1/3==، وبيموّتوا **10–20%**.
          - شيل كل الـ islets = **diabetes**.
          - **Zollinger–Ellison syndrome (ZES)**: الـ H2 antagonists والـ H+,K+-ATPase inhibitors (omeprazole، lansoprazole) بيحسّنوا الـ cure rate.
          - **Early total pancreatectomy** مبرر في عائلات فيها نسبة عالية من الأورام الخبيثة.
          - **Octreotide, lanreotide**: للـ carcinoid والـ watery diarrhoea syndrome.
          - **Bilateral adrenalectomy**: ممكن للـ ectopic adrenocorticotropic hormone (ACTH) syndrome.

          ليه شيل الـ islets كلها بيعمل **diabetes**؟ لأن الـ islets هي مصنع الـ insulin الوحيد، فمفيش بديل. وليه الـ octreotide بيشتغل على الـ carcinoid والـ watery diarrhoea؟ التفسير المقبول (مش في الكتاب): الأورام دي عليها **somatostatin receptors**، والـ somatostatin هو الفرامل الطبيعية لإفراز الهرمونات، فالـ analogue بيقفل الإفراز. وليه بنحتاج **bilateral adrenalectomy** أحيانًا؟ لأن الـ ACTH جاي من ورم مش عارفين نشيله، فبنشيل الغدد اللي بترد عليه.
      - kind: check
        page: 9
        quote: "Removal of all pancreatic islets causes diabetes."
        question: "Why isn't total pancreatectomy done for every multiple endocrine neoplasia (MEN) 1 islet tumour?"
        options: ["It causes diabetes; it is kept for high-malignancy families", "Islet tumours are never malignant", "Octreotide cures them", "They are always single"]
        answer: 0
        why:
          - "صح: شيل كل الـ islets بيعمل diabetes، فبنعمله بدري بس في العائلات اللي فيها أورام خبيثة كتير."
          - "خبيثة في الثلث."
          - "الـ octreotide بيتحكم في الأعراض، مش علاج شافي."
          - "هما multicentric."
      - kind: explain
        page: 9
        quote: "Hepatic artery embolization or Chemotherapy: 5fluorouracil, streptozocin, chlorozotocin, doxorubicin or dacarbazine may reduce tumor mass, control symptoms of hormone excess and prolong life. However, these treatments are never curative."
        title: "لما يوصل للكبد"
        text: |
          الـ islet cell carcinoma بيعمل metastasis للكبد كتير. التفسير المقبول (مش في الكتاب): دم البنكرياس كله بيصب في الـ **portal vein**، فأول فلتر الخلايا الخبيثة بتقابله هو الكبد.

          **Hepatic artery embolization** أو chemo (5-FU، streptozocin، chlorozotocin، doxorubicin، dacarbazine) ممكن يصغّروا الورم، يتحكموا في الأعراض، ويطوّلوا العمر، بس ==never curative==.
      - kind: aside
        tone: exam
        page: 9
        quote: "Somatostatin analouges e.g octeriotide,Lanreotide are useful in the managmement of carcinoid and the watery diarrhoea syndrome."
        text: "الـ octreotide بيظهر في المحاضرة دي في كل حتة تقريبًا: insulinoma، gastrinoma metastatic، glucagonoma، growth hormone (GH) tumors، carcinoid، و vasoactive intestinal peptide-secreting tumour (VIPoma). لو سؤال \"drug used in many MEN 1 tumours\" يبقى غالبًا somatostatin analogue."
