  - id: res.L01.lesson6
    title: "تختار موضوع رسالتك إزاي؟ (2) الباقي والترتيب"
    hook: "عدّى البوابة؟ فاضل 5 أسئلة، وبعدها جدول بالأرقام يقولك مين يكسب."
    minutes: 8
    pages: [41, 52]
    topics: [priority]
    goals:
      - "تعرف معنى urgency وpolitical acceptability وfeasibility وapplicability وethical acceptability"
      - "تقيّم موضوع بالـ rating scale 1-3 وتجمع الدرجة"
    status: unverified
    steps:
      - kind: explain
        page: 41
        quote: "3. Urgency of data needed (timeliness)\n How urgently are the results needed for\nmaking a decision or developing\ninterventions at various levels (from\ncommunity to policy)?\nConsider which research should be done\nfirst, and which can be done later."
        title: "3. Urgency of data needed"
        text: |
          النتايج ==محتاجينها قد إيه دلوقتي== علشان قرار أو intervention، من مستوى المجتمع لحد الـ policy؟

          فكّر إيه يتعمل **الأول** وإيه ممكن **يستنى**.

          ليه ده معيار؟ لأن بحث نتيجته جت بعد ما القرار اتاخد خلاص مابقاش له لازمة، حتى لو ممتاز. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 42
        quote: "4. Political acceptability\n In general, it is advisable to research a topic that\nhas the interest and support of the local/national\nauthorities. This will increase the chance that the\nresults of the study will be implemented.\nUnder certain circumstances, however, you may\nfeel that a study is required to show that the\ngovernment’s policy needs adjustment. If so, you\nshould make an extra effort to involve the policy-\nmakers concerned at an early stage, in order to\nlimit the chances for confrontation later."
        title: "4. Political acceptability"
        text: |
          الأفضل موضوع عليه ==interest and support of the authorities==، المحلية أو القومية. ليه؟ لأن ده بيزوّد فرصة إن النتايج **تتنفذ**: اللي في إيده القرار مهتم يسمعها.

          بس أحيانًا البحث نفسه هدفه يثبت إن **سياسة الحكومة محتاجة تتعدل**. ساعتها اشرك الـ policy-makers ==at an early stage==، علشان تقلل فرص الـ confrontation بعدين.
      - kind: figure
        page: 43
        quote: "Look at the project you are proposing and consider the complexity of the problem and the resources you will require carrying out your study. Thought should be given first to manpower, time, equipment and money that are locally available.\nIn situations where the local resources necessary to carry out the project are not sufficient, you might consider resources available at the national level; for example, in research units, research councils or local universities.\nFinally, explore the possibility of obtaining technical and financial assistance from external sources."
        title: "5. Feasibility: تدوّر على الموارد بالترتيب ده"
        svg: |
          <svg viewBox="0 0 330 188" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L01f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="20" y="8" width="290" height="44" rx="8" class="fg-acc"/>
            <text x="165" y="27" text-anchor="middle" class="t-sm t-b">Local resources first</text>
            <text x="165" y="43" text-anchor="middle" class="t-sm t-mut">manpower, time, equipment, money</text>
            <path d="M165 54v14" class="fg-arrow" marker-end="url(#L01f)"/>
            <rect x="20" y="72" width="290" height="44" rx="8" class="fg-box"/>
            <text x="165" y="91" text-anchor="middle" class="t-sm t-b">National level</text>
            <text x="165" y="107" text-anchor="middle" class="t-sm t-mut">research units, councils, local universities</text>
            <path d="M165 118v14" class="fg-arrow" marker-end="url(#L01f)"/>
            <rect x="20" y="136" width="290" height="44" rx="8" class="fg-box"/>
            <text x="165" y="155" text-anchor="middle" class="t-sm t-b">External sources</text>
            <text x="165" y="171" text-anchor="middle" class="t-sm t-mut">technical and financial assistance</text>
          </svg>
        caption: "بص على تعقيد المشكلة والموارد اللي محتاجها. ابدأ باللي عندك محليًا، ولو مش كفاية روح للمستوى القومي، وآخر حاجة مساعدة من برّه. ليه بالترتيب ده؟ لأن الأقرب أسهل توصله وأضمن يكمّل معاك. التفسير المقبول (مش في الكتاب) للسبب."
        alt: "Three stacked boxes: local resources, then national level, then external technical and financial assistance."
      - kind: explain
        page: 44
        quote: "Is it likely that the recommendations from the study will be applied?\nThis will depend not only on the management capability within the team and the blessing of the authorities, but also on the availability of resources for implementing the recommendations.\nLikewise, the opinion of the potential clients and of responsible staff will influence the implementation of recommendations."
        title: "6. Applicability of results"
        text: |
          هل التوصيات **هتتطبق** فعلًا؟ ده بيعتمد على:

          - ==management capability== جوه الفريق.
          - **blessing of the authorities**.
          - الموارد المتاحة لتنفيذ التوصيات.
          - رأي الـ **potential clients** والـ **responsible staff**.

          لاحظ الفرق: الـ feasibility سؤال عن **البحث** (أقدر أعمله؟)، والـ applicability سؤال عن **التوصيات** بعده (هتتنفذ؟).
      - kind: explain
        page: 45
        quote: "We should always consider the possibility that we may inflict harm on others while carrying out research.\nTherefore, review the study you are proposing and consider important ethical issues such as:\n  How acceptable is the research to those who will be studied? (Cultural sensitivity must be given careful consideration). Is the problem shared by target group and health staff/researchers?\n  Can informed consent be obtained from the research subjects?"
        title: "7. Ethical acceptability"
        text: |
          ممكن نأذي ناس وإحنا بنعمل بحث، فاسأل:

          - البحث **acceptable** للناس اللي هتدرسهم؟ (==cultural sensitivity==) والمشكلة مشتركة بين الـ target group والباحثين؟
          - نقدر ناخد ==informed consent==؟
      - kind: check
        page: 46
        quote: "Will the condition of the subjects be taken into\naccount? For example, if individuals are identified\nduring the study who require treatment, will this\ntreatment be given? What if such treatment\ninterferes with your study results?\nWill the results be shared with those who are\nbeing studied? Will the results be helpful in\nimproving the lives or health of those studied?"
        question: "During a community HCV study you find people who need treatment, and treating them could change your results. What does slide 46 ask you to consider?"
        options:
          - "Whether this treatment will be given, even if it interferes with the results"
          - "Leaving them untreated until the study ends to protect the results"
          - "Dropping them from the sample without telling them"
          - "Nothing: ethics ends once consent is signed"
        answer: 0
        why:
          - "صح: «Will the condition of the subjects be taken into account?» العلاج يتقدّم، والتأثير على النتايج مشكلة تتحسب في الـ design، مش في المريض."
          - "النتايج مش أهم من صحة المشارك؛ ده عكس الـ ethical acceptability."
          - "إخفاء اللي لقيته عنه ضد إن النتايج تتشارك مع اللي اتدرسوا."
          - "slide 46 بيكمّل بعد الـ consent: حالة المشاركين، ومشاركة النتايج، وهل هتحسّن حياتهم."
      - kind: explain
        page: 47
        quote: "Group Work: CRITERIA FOR PRIORITIZING TOPICS FOR RESEARCH\nIn order to assist a group in selecting and rating different research topics, we will use the nominal group technique (NGT)"
        title: "الـ group work: الـ NGT"
        text: |
          علشان مجموعة تختار وتقيّم مواضيع مختلفة، المحاضرة بتستخدم ==nominal group technique (NGT)==.

          الفكرة (التفسير المقبول، مش في الكتاب): كل واحد يقيّم **لوحده الأول**، وبعدين الدرجات تتجمع. ليه؟ علشان أعلى صوت في المجموعة مايفرضش رأيه، وكل واحد يدّي رأيه من غير ضغط.
      - kind: table
        page: 51
        quote: "SCALES FOR RATING RESEARCH TOPICS\nRelevance:\n  1 = Not relevant\n  2 = Relevant\n  3 = Very relevant\nAvoidance of duplication:\n  1 = Sufficient information already available\n  2 = Some information available but major issues not covered\n  3 = No sound information available on which to base problem-solving\nUrgency:\n  1 = Information not urgently needed\n  2 = Information could be used right away but a delay of some months would be acceptable\n  3 = Data very urgently needed for decision-making\nPolitical acceptability:\n  1 = Topic not acceptable to high level policymakers\n  2 = Topic more or less acceptable\n  3 = Topic fully acceptable\nFeasibility:\n  1 = Study not feasible, considering available resources\n  2 = Study feasible, considering available resources\n  3 = Study very feasible, considering available resources\nApplicability:\n  1 = No chance of recommendations being implemented\n  2 = Some chance of recommendations being implemented\n  3 = Good chance of recommendations being implemented\nEthical acceptability:\n  1 = Major ethical problems\n  2 = Minor ethical problems\n  3 = No ethical problems"
        title: "Scales for rating research topics (2 = in between)"
        columns: ["Criterion", "Score 1 (low)", "Score 3 (high)"]
        rows:
          - ["Relevance", "Not relevant", "Very relevant"]
          - ["Avoidance of duplication", "Sufficient info already available", "No sound info available"]
          - ["Urgency", "Not urgently needed", "Very urgently needed"]
          - ["Political acceptability", "Not acceptable", "Fully acceptable"]
          - ["Feasibility", "Not feasible", "Very feasible"]
          - ["Applicability", "No chance of implementation", "Good chance"]
          - ["Ethical acceptability", "Major ethical problems", "No ethical problems"]
        hide: [[1, 1], [1, 2], [6, 1], [6, 2]]
      - kind: aside
        tone: exam
        page: 51
        quote: "SCALES FOR RATING RESEARCH TOPICS\nRelevance:\n  1 = Not relevant\n  2 = Relevant\n  3 = Very relevant\nAvoidance of duplication:\n  1 = Sufficient information already available\n  2 = Some information available but major issues not covered\n  3 = No sound information available on which to base problem-solving\nUrgency:\n  1 = Information not urgently needed\n  2 = Information could be used right away but a delay of some months would be acceptable\n  3 = Data very urgently needed for decision-making\nPolitical acceptability:\n  1 = Topic not acceptable to high level policymakers\n  2 = Topic more or less acceptable\n  3 = Topic fully acceptable\nFeasibility:\n  1 = Study not feasible, considering available resources\n  2 = Study feasible, considering available resources\n  3 = Study very feasible, considering available resources\nApplicability:\n  1 = No chance of recommendations being implemented\n  2 = Some chance of recommendations being implemented\n  3 = Good chance of recommendations being implemented\nEthical acceptability:\n  1 = Major ethical problems\n  2 = Minor ethical problems\n  3 = No ethical problems"
        text: |
          الـ **3 دايمًا = أحسن** للموضوع. فخ الامتحان: في **avoidance of duplication**، الـ 3 معناها ==مفيش معلومات كفاية== (وده كويس للبحث)، والـ 1 معناها المعلومات موجودة. وفي الـ ethics، الـ 3 = no ethical problems.
