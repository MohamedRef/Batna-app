    src: { page: 18, quote: "What is the problem and why should it be studied? What information is available?" }
    status: unverified
    tags: [high-yield]
  - id: res.L01.023
    kind: mcq
    topic: process
    stem: In the proposal-development table, "Who will do what, and when?" is answered by which step?
    options: [Work plan, Budget, Research methodology, Proposal summary]
    answer: 0
    why:
      - Correct. The work plan holds human resources and the timetable.
      - The budget answers "What resources do we need and have?"
      - Methodology answers what data we need and how to collect them.
      - The summary answers how we present the proposal to authorities and funders.
    src: { page: 18, quote: "Who will do what, and when?" }
    status: unverified
  - id: res.L01.024
    kind: mcq
    topic: process
    stem: In the proposal-development table, under which step do ethical considerations and a pre-test or pilot study appear?
    options: [Research methodology, Work plan, Literature review, Plan for project administration]
    answer: 0
    why:
      - Correct. Methodology covers variables, study type, data collection, sampling, plans for collection and analysis, ethics and the pilot.
      - The work plan covers human resources and the timetable.
      - The literature review covers literature and other available information.
      - Administration covers administration, monitoring and potential users.
    src: { page: 18, quote: "ethical considerations pre-test or pilot study" }
    status: unverified
