  - id: rheum.L19.lesson2
    title: "الحطام النووي والأجسام المضادة"
    hook: "الخلايا بتموت كتير والزبالة مش بتتشال، فالجسم يعمل antibodies ضد الـ DNA بتاعه."
    minutes: 9
    pages: [312, 316]
    topics: [immunology, antibodies, pathology]
    goals:
      - "تفهم دور الـ B cells والـ T cells والـ apoptosis"
      - "توصّل كل antibody بمرضه ونسبته"
      - "تعرف الـ pathology، والكلية أوضح مثال"
    status: unverified
    steps:
      - kind: explain
        page: 312
        title: "الـ B cells"
        quote: "associated with the loss of B-cell tolerance, B-cell dysregulation and autoantibody production."
        text: |
          الـ SLE فيه ==loss of B-cell tolerance== و B-cell dysregulation.

          الـ immune stimulation + impaired regulation ← **polyclonal activation** للـ B cells ← autoantibodies كتير ضد **nuclear self antigens**.

          الـ antibodies دي بتعمل **immune complexes** مع الـ nuclear antigens، تترسب في الأنسجة، وتعمل **inflammation**.
      - kind: explain
        page: 313
        title: "والـ T cells كمان"
        quote: "Regulatory T cells have been shown to be low in SLE and their suppressive function impaired."
        text: |
          - **Abnormal signaling** وبيطلّعوا cytokines تزوّد الالتهاب.
          - ==Regulatory T cells== قليلة ووظيفتها ضعيفة.
          - الـ **cytotoxic** والـ **suppressor T cells** (اللي المفروض تهدّي المناعة) قليلة.

          يعني الفرامل بايظة والبنزين زيادة.
      - kind: figure
        page: 314
        quote: "Apoptosis (programmed cell death) of lymphoid cells leads to release of DNA constituents"
        title: "الـ pathogenesis في أربع خطوات"
        alt: "Four stacked boxes with arrows. Genetically susceptible person plus environmental trigger; apoptosis of lymphoid cells releases DNA constituents, with defective clearance and antigens in surface blebs; T lymphocytes stimulate B cells; autoantibodies form immune complexes that deposit and cause inflammation and vasculitis."
        caption: "المشكلة الأساسية: ==apoptosis زيادة + clearance ضعيف==. الـ autoantigens بتتجمع في الـ **surface blebs** للخلايا الميتة، فالمناعة تشوفها."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L19a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="25" y="10" width="280" height="56" rx="10" class="fg-acc"/>
            <text x="165" y="33" text-anchor="middle" class="t-sm t-b">Susceptible genes</text>
            <text x="165" y="52" text-anchor="middle" class="t-sm">+ UV, virus, drug, oxidative stress</text>
            <path d="M165 66 V88" class="fg-arrow" marker-end="url(#L19a)"/>
            <rect x="25" y="90" width="280" height="72" rx="10" class="fg-box"/>
            <text x="165" y="113" text-anchor="middle" class="t-sm t-b">Apoptosis of lymphoid cells</text>
            <text x="165" y="131" text-anchor="middle" class="t-sm">DNA and hidden antigens exposed</text>
            <text x="165" y="149" text-anchor="middle" class="t-sm t-mut">in surface blebs; clearance defective</text>
            <path d="M165 162 V184" class="fg-arrow" marker-end="url(#L19a)"/>
            <rect x="25" y="186" width="280" height="56" rx="10" class="fg-box"/>
            <text x="165" y="209" text-anchor="middle" class="t-sm t-b">T lymphocytes stimulate B cells</text>
            <text x="165" y="228" text-anchor="middle" class="t-sm t-mut">low Treg, abnormal signaling</text>
            <path d="M165 242 V264" class="fg-arrow" marker-end="url(#L19a)"/>
            <rect x="25" y="266" width="280" height="80" rx="10" class="fg-bad"/>
            <text x="165" y="289" text-anchor="middle" class="t-sm t-b t-bad">Autoantibodies</text>
            <text x="165" y="308" text-anchor="middle" class="t-sm">immune complexes deposit</text>
            <text x="165" y="327" text-anchor="middle" class="t-sm">inflammation, vasculitis, fibrinoid</text>
          </svg>
      - kind: order
        page: 314
        quote: "Apoptosis (programmed cell death) of lymphoid cells leads to release of DNA constituents"
        prompt: "رتّب الـ pathogenesis زي الكتاب:"
        steps:
          - "Trigger in a susceptible person"
          - "Lymphoid cells die and release DNA"
          - "T cells stimulate B cells"
          - "Autoantibodies against DNA constituents"
        why: "الـ trigger بيزوّد الـ oxidative stress والـ apoptosis، فالـ DNA يطلع، والـ T cells تساعد الـ B cells تعمل antibodies ضده."
      - kind: table
        page: 315
        quote: "Anti dsDNA 70 % Increased risk for Lupus Nephritis Anti-histone Drug Induced LE"
        title: "الـ antibodies اللي لازم تحفظها"
        columns: [Antibody, Disease, "%"]
        rows:
          - ["Anti-dsDNA", "SLE, lupus nephritis", "70%"]
          - ["Anti-Sm", "SLE, CNS and kidney", "10–25%"]
          - ["Anti-histone", "Drug-induced LE", "–"]
          - ["Anti-U1-RNP", "SLE, MCTD, overlap", "30%"]
          - ["Anti-centromere", "Limited SSc, PBC", "70%"]
          - ["Anti-topo-1", "Diffuse SSc", "30%"]
          - ["Antiphospholipid", "SLE, APS, abortions", "10–30%"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
      - kind: match
        page: 315
        quote: "Anti-topoisomerase-1 Diffuse Cutaneous Systemic Sclerosis 30%"
        prompt: "لعبة التوصيل: كل antibody بمرضه"
        pairs:
          - ["Anti-dsDNA", "Lupus nephritis risk"]
          - ["Anti-histone", "Drug-induced lupus"]
          - ["Anti-centromere", "Limited systemic sclerosis"]
          - ["Anti-topoisomerase-1", "Diffuse cutaneous systemic sclerosis"]
          - ["Anti-Ro / anti-La", "Neonatal lupus, Sjögren"]
          - ["Anti-U1-RNP", "Mixed connective tissue disease"]
        why: "الـ dsDNA للكلية، الـ histone للدوا، الـ centromere للـ limited و الـ topo للـ diffuse SSc، الـ Ro/La للـ Sjögren وقلب الجنين، والـ U1-RNP للـ MCTD."
      - kind: aside
        tone: exam
        page: 315
        quote: "associated with CNS and kidney diseases"
        text: "فخ متكرر: الـ **anti-dsDNA** أشيع (70%) ومرتبط بالـ nephritis، أما الـ **anti-Sm** أقل (10–25%) ومرتبط بالـ **CNS والكلية**. الـ anti-Ro/La في الجدول مع **Sjögren** و **SSc** و **cardiac neonatal lupus**."
      - kind: explain
        page: 316
        title: "الـ pathology والكلية"
        quote: "Immune complex deposition seen in mesangium & subendothelial/subepithelial surface of basement membrane."
        text: |
          **الأساسيات (p315):** inflammation، **band or occlusive vasculopathy**، vasculitis، immune complex deposition. والـ **fibrinoid** (مادة eosinophilic) على الأوعية والألياف.

          **الكلية** أوضح organ:
          - **Light/IF:** mesangial proliferation، **fibrinoid necrosis**، inflammation، Ig أو complement deposits.
          - **EM:** deposits في الـ ==mesangium== والـ **subendothelial / subepithelial** surfaces.
      - kind: check
        page: 315
        quote: "Anti dsDNA 70 % Increased risk for Lupus Nephritis Anti-histone Drug Induced LE"
        question: "A man on hydralazine gets arthritis and serositis. ANA positive, anti-dsDNA negative. Which antibody do you expect?"
        options: ["Anti-histone", "Anti-Sm", "Anti-centromere", "Anti-topoisomerase-1"]
        answer: 0
        why:
          - "صح: hydralazine من أدوية الـ lupus، والـ anti-histone علامة الـ drug-induced LE."
          - "الـ anti-Sm للـ SLE مع CNS والكلية."
          - "الـ anti-centromere للـ limited SSc."
          - "الـ anti-topo-1 للـ diffuse SSc."
      - kind: try
        items: [rheum.L19.029, rheum.L19.031, rheum.L19.035, rheum.L19.032, rheum.L19.043]
    recap:
      - "Loss of B-cell tolerance ← polyclonal B cells ← immune complexes ← inflammation."
      - "T cells: abnormal signaling، Treg قليلة، cytotoxic و suppressor قليلين."
      - "Apoptosis زيادة + clearance ضعيف؛ الـ antigens في الـ blebs."
      - "dsDNA 70% nephritis؛ Sm 10–25% CNS/kidney؛ histone drug؛ U1-RNP MCTD؛ centromere limited، topo diffuse."
      - "الكلية: mesangial proliferation، fibrinoid؛ EM: mesangium + subendothelial/subepithelial."
    practice: [rheum.L19.028, rheum.L19.029, rheum.L19.030, rheum.L19.031, rheum.L19.032, rheum.L19.033, rheum.L19.034, rheum.L19.035, rheum.L19.036, rheum.L19.037, rheum.L19.038, rheum.L19.039, rheum.L19.040, rheum.L19.041, rheum.L19.042, rheum.L19.043, rheum.L19.044, rheum.L19.045]
