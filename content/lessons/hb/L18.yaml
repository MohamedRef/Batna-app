      - kind: update
        page: 362
        text: "في الـ **BCLC 2022**: الـ **A** بقت single tumour **أي حجم** أو لحد 3 nodules كل واحدة ≤3 cm مع PS 0، والـ **C** بقت **PS 1–2**، والـ **D** = **end-stage liver function**. والـ liver function ماعدتش بتتحدد بنقط Child-Pugh لوحدها. في الامتحان: **نسخة الكتاب**."
        ref: "BCLC 2022 update (Reig et al., J Hepatol 2022)"
      - kind: check
        page: 362
        question: "Child-Pugh A6, ECOG 0, five HCC nodules (largest 4 cm), no vascular invasion or spread. BCLC stage per the book?"
        options:
          - "B: intermediate"
          - "A: early"
          - "C: advanced"
          - "0: very early"
        answer: 0
        why:
          - "صح: multifocal **أكتر من معايير A** (أكتر من 3 nodules)، PS 0، liver preserved، مفيش invasion = **B**."
          - "الـ A محتاجة single ≤5 cm أو **≤3 nodules** كلهم ≤3 cm."
          - "الـ C محتاجة **vascular invasion أو extrahepatic spread** (أو PS لحد 2)."
          - "الـ 0 single **≤2 cm** بس."
      - kind: explain
        page: 362
        title: "ALBI: liver function من رقمين بس"
        text: |
          الـ **Child-Pugh** فيه **ascites و encephalopathy**، ودول بيختلفوا من دكتور لدكتور (interobserver variation)، ومش validated كويس في الـ HCC. فعملوا **ALBI**: **simple، objective، evidence-based**.

          - **Linear predictor = (log10 bilirubin × 0.66) + (albumin × −0.085)**، الـ bilirubin بالـ **micromol/L** والـ albumin بالـ **g/L**.
          - **Grade I ≤ −2.60**، **Grade II > −2.60 to ≤ −1.39**، **Grade III > −1.39**.
          - بيستخدم كمان في الـ **risk stratification للـ TACE**.

          والـ scoring systems التانية في الكتاب: **TNM**، **CLIP**، و **Okuda** (حجم الورم = نسبة أكبر cross-sectional area للورم لأكبر area للكبد).
      - kind: reveal
        page: 363
        prompt: "احسب: bilirubin **34 micromol/L** و albumin **30 g/L**. الـ ALBI grade كام؟"
        answer: |
          - log10(34) ≈ **1.53** × 0.66 ≈ **1.01**
          - 30 × −0.085 = **−2.55**
          - المجموع ≈ **−1.54** → أكبر من −2.60 وأقل من −1.39 → **Grade II**.

          ونصيحة: الرقم **كل ما يبقى سالب أكتر، الكبد أحسن** (لأن الـ albumin بيدخل بإشارة سالبة).
