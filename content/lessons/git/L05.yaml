            <ellipse cx="80" cy="205" rx="12" ry="6" class="fg-box"/>
            <ellipse cx="60" cy="228" rx="12" ry="6" class="fg-box"/>
            <text x="125" y="175" class="t-b t-acc">Type 2: adenoma</text>
            <text x="125" y="198" class="t-sm">browner than background</text>
            <text x="125" y="218" class="t-sm">brown vessels around</text>
            <text x="125" y="238" class="t-sm">oval/branched white parts</text>
