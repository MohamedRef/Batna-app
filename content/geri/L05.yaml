  - { id: risk, title: "Risk factors for stroke" }
  - { id: syndromes, title: "Presentation of cerebral infarction" }
  - { id: hemorrhage, title: "Intracranial hemorrhage" }
  - { id: management, title: "Management of stroke" }
items:
  # ---------- p84: definition, TIA ----------
  - id: geri.L05.001
    kind: card
    topic: definition
    front: What is the commonest presenting symptom of cerebrovascular disease in the elderly?
    back: Stroke. CVD is a major cause of morbidity and mortality in the elderly.
    src: { page: 84, quote: "The commonest presenting symptom is stroke." }
    status: unverified
  - id: geri.L05.002
    kind: card
    topic: definition
    front: Define stroke.
    back: A syndrome of acute-onset neurologic deficit that persists for at least 24 hours, reflects focal involvement of the CNS, and results from a disturbance of the cerebral circulation.
    src: { page: 84, quote: "Stroke is a syndrome characterized by the acute onset of neurologic deficit that persists for at least 24 hours" }
    status: unverified
    tags: [high-yield]
  - id: geri.L05.003
    kind: cloze
    topic: definition
    text: "Causes of stroke: thromboembolic infarction {{c1::80%}}, cerebral and cerebellar hemorrhage {{c2::10%}}, subarachnoid hemorrhage {{c3::5%}}."
    src: { page: 84, quote: "Thromboembolic infarction 80% - Cerebral & cerebellar Hge 10% - Subarachnoid Hge 5%" }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L05.004
    kind: card
    topic: tia
    front: How does the lecture describe a transient ischemic attack?
    back: A sudden loss of function that starts within seconds and lasts minutes or hours.
    src: { page: 84, quote: "Sudden loss of function for seconds lasts for minutes or hours." }
    status: unverified
    update:
      text: "TIA is now defined by tissue, not time: a transient episode of neurological dysfunction from focal brain, spinal cord or retinal ischaemia without acute infarction on imaging. Most resolve within 1 hour."
      ref: AHA/ASA scientific statement on the definition of TIA, 2009
  - id: geri.L05.005
    kind: card
    topic: tia
    front: What usually causes recurrent TIAs?
    back: Thrombosis or embolism arising within the cerebral circulation.
    src: { page: 84, quote: "Recurrent TIA's are usually caused by thrombosis or embolism arising within the cerebral circulation." }
    status: unverified
  - id: geri.L05.006
    kind: card
    topic: definition
    front: What are the two pathogenetic mechanisms of stroke?
    back: Ischemia or hemorrhage.
    src: { page: 84, quote: "Pathogenesis:- Ischemia or hemorrhage." }
    status: unverified
  # ---------- p85: ischemic stroke ----------
  - id: geri.L05.007
    kind: cloze
    topic: ischemic
    text: About {{c1::2/3}} of ischemic strokes are due to thrombosis and {{c2::1/3}} to embolism.
    src: { page: 85, quote: "About 2/3 are due to thrombosis, 1/3 due to embolism." }
    status: unverified
    tags: [numbers]
  - id: geri.L05.008
    kind: enumerate
    topic: ischemic
    prompt: Enumerate the vessels that thrombosis may occlude in ischemic stroke.
    points:
      - "Large cerebral arteries: internal carotid, middle cerebral or basilar"
      - "Small penetrating arteries (lacunar)"
      - "Cerebral veins or venous sinuses"
    pass: 3
    src: { page: 85, quote: "large cerebral arteries internal carotid, middle cerebral or basilar arteries. b- Small penetrating arteries(lacunar) c- cerebral veins or venous sinuses." }
    status: unverified
  - id: geri.L05.009
    kind: card
    topic: ischemic
    front: What often precedes thrombotic stroke, and in whom is it more common?
    back: It is preceded by TIAs and is more common in elderly atherosclerotic patients.
    src: { page: 85, quote: "Thrombosis is preceded by TIA's, it more common in elderly atherosclerotic pt's." }
    status: unverified
  - id: geri.L05.010
    kind: card
    topic: ischemic
    front: Which arteries does atherosclerosis affect in cerebrovascular disease?
    back: The large extracerebral arteries in the neck and at the base of the brain, and large and medium-sized elastic and muscular arteries.
    src: { page: 85, quote: "Atherosclerosis affects the large extra cerebral arteries in the neck & at the base of the brain" }
    status: unverified
  - id: geri.L05.011
    kind: order
    topic: ischemic
    prompt: Order the steps by which atherosclerosis develops, per the lecture.
    steps:
      - Dysfunction of the vascular endothelial cells
      - Subintimal deposition of lipoprotein
      - Formation of an atheromatous plaque
    src: { page: 85, quote: "Atherosclerosis results from dysfunction of the vascular endothelial cells, subintimal deposition of lipoprotein, formation of an atheromatous plaque." }
    status: unverified
  - id: geri.L05.012
    kind: card
    topic: ischemic
    front: Define cerebral embolism and name its sources.
    back: Passage of a thrombus from the heart, the aortic arch or the large cerebral arteries.
    src: { page: 85, quote: "Passage of a thrombus from heart, aortic arch or large cerebral arteries." }
    status: unverified
  - id: geri.L05.013
    kind: cloze
    topic: ischemic
    text: Emboli in the anterior cerebral circulation often occlude the {{c1::middle cerebral artery}} (which carries {{c2::85%}} of hemispheric blood flow); emboli in the posterior circulation lodge at the {{c3::apex of the basilar artery}}.
    src: { page: 85, quote: "Emboli in anterior cerebral circulation often occlude the middle cerebral artery (85% of hemispheric blood flow)" }
    status: unverified
    tags: [high-yield, numbers]
  - id: geri.L05.014
    kind: card
    topic: ischemic
    front: How does the deficit of an embolic stroke evolve?
    back: Embolic strokes are usually maximal at the onset.
    src: { page: 85, quote: "Embolic strokes are usually maximal at the onset." }
    status: unverified
  # ---------- p86: GCA, hemorrhage, risk factors ----------
  - id: geri.L05.015
    kind: card
    topic: ischemic
    front: Describe giant cell arteritis as a cause of cerebrovascular disease in the elderly.
    back: "A granulomatous arteritis of large arteries, associated with polymyalgia rheumatica in the elderly. Features: headache, tender scalp, jaw claudication, and sudden temporary or permanent loss of vision."
    src: { page: 86, quote: "Granulomatous arteritis of large arteries, in association with polymyolgia rheumatica (in the elderly), headache, tender scalp, claudication of the jaw" }
    status: unverified
    tags: [high-yield]
  - id: geri.L05.016
    kind: card
    topic: hemorrhage
    front: How does intracranial hemorrhage damage the brain?
    back: The blood compresses brain tissue and vascular structures, causing secondary ischemia and edema according to its location (intracerebral, subarachnoid, subdural or epidural).
    src: { page: 86, quote: "Compression of brain tissue & vascular structure leads to secondary ischemia & edema according to its location" }
    status: unverified
  - id: geri.L05.017
    kind: enumerate
    topic: risk
    prompt: Enumerate the atherosclerotic risk factors for stroke.
    points: [Hypertension, Diabetes mellitus, Hyperlipidemia, Hyperhomocysteinemia, Cigarette smoking]
    pass: 4
    src: { page: 86, quote: "Risk factors for atherosclerosis:- - Hypertension, - D.M., - Hyperlipidemia, - Hyperhomocysteinemia, - Cigarette smoking." }
    status: unverified
    tags: [high-yield]
  - id: geri.L05.018
    kind: enumerate
    topic: risk
    prompt: Enumerate the other (non-atherosclerotic) risk factors for stroke.
    points:
      - Polycythaemia
      - Endocarditis
      - Migraine
      - "Vasculitis (giant cell arteritis, PAN, SLE)"
      - Chronic use of COX-2 inhibitors
      - Anticardiolipin antibodies
      - "Thrombocythemia and thrombophilia (protein C deficiency, factor V)"
    pass: 5
    src: { page: 86, quote: "Polycythaemia, - Endocarditis, - Migraine, - Vasculitis (Giant cell arteritis, PAN, SLE) - Chronic use of coxII inhibitors." }
    status: unverified
  - id: geri.L05.019
    kind: card
    topic: risk
    front: Which kind of thrombosis do thrombophilias (protein C deficiency, factor V) mainly cause?
    back: Venous thrombosis rather than arterial.
    src: { page: 86, quote: "Thrombocythemia & thrombophilia (protein c deficiency, factor V --- Venous thrombosis rather than arterial)." }
    status: unverified
  # ---------- p87: presentation ----------
  - id: geri.L05.020
    kind: card
    topic: syndromes
    front: What is the most common cerebral infarction, and what does it cause?
    back: Infarction of the internal capsule from thrombosis or embolism of the middle cerebral artery, causing contralateral hemiplegia and facial paralysis.
    src: { page: 87, quote: "The most common is infarction of the internal capsule due to thrombosis or embolism of the middle cerebral artery" }
    status: unverified
    tags: [high-yield]
  - id: geri.L05.021
    kind: card
    topic: syndromes
    front: What else characterises internal capsule infarction (consciousness, speech, course)?
    back: Consciousness is usually preserved; aphasia occurs if the dominant hemisphere is affected; weakness is maximal at first and recovery is gradual.
    src: { page: 87, quote: "Consciousness is usually present, aphasia of the dominant hemisphere is affected, weakness Maximal at first, recovery is gradual." }
    status: unverified
  - id: geri.L05.022
    kind: table
    topic: syndromes
    title: Brain stem infarction (vertebrobasilar system)
    columns: [Vessel or level, Syndrome]
    rows:
      - [Main basilar artery, "Tetraparesis, sensory loss"]
      - [Posterior inferior cerebellar artery, Wallenberg syndrome]
      - [Brain stem at the level of the 3rd cranial nerve, Weber syndrome]
      - [Massive damage below the 3rd nerve nuclei, Locked-in syndrome]
      - [Lower brain stem (bilateral pyramidal), Pseudobulbar syndrome]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 87, quote: "Posterior inferior cerebellar artery (Wallenberg Syndrome). - Brain stem lesion at level of 3rd cranial nerve Weber Syndrome." }
    status: unverified
    tags: [high-yield]
  - id: geri.L05.023
    kind: card
    topic: syndromes
    front: Describe the locked-in syndrome.
    back: Massive brain stem damage below the third nerve nuclei. The cerebral cortex works, but the patient cannot move or communicate except by vertical eye movements.
    src: { page: 87, quote: "Locked in Syndrome: massive brain stem damage below third nerve nuclei, he has functioning cerebral cortex" }
    status: unverified
  - id: geri.L05.024
    kind: card
    topic: syndromes
    front: What is the pseudobulbar syndrome, per the lecture?
    back: Bilateral pyramidal lesions from lower brain stem damage, with emotional and sphincteric disturbance.
    src: { page: 87, quote: "Pseudo bulbar syndrome: (bilateral pyramidal lesions, emotional & sphincteric disturbance), lower brain stem damage." }
    status: unverified
  - id: geri.L05.025
    kind: card
    topic: syndromes
    front: What is a lacunar infarct, and what causes it?
    back: Occlusion of a small penetrating branch of a major cerebral artery (to the basal ganglia, thalamus, internal capsule and pons), from atherosclerosis or degenerative arterial wall changes related to hypertension and possibly diabetes.
    src: { page: 87, quote: "Occlusion of small penetrating branch of the major cerebral arteries (to the basal ganglia, thalamus, internal capsule & pons)" }
    status: unverified
    tags: [high-yield]
  - id: geri.L05.026
    kind: card
    topic: syndromes
    front: How may hypertensive encephalopathy present?
    back: Severe headache, TIA, stroke, or rarely subarachnoid hemorrhage.
    src: { page: 87, quote: "Hypertensive encephalopathy:- Severe headache, TIA, stroke or rarely subarachnoid Hge." }
    status: unverified
  # ---------- p88: MID, PCA, border zone, ICH ----------
  - id: geri.L05.027
    kind: card
    topic: syndromes
    front: Define multi-infarct dementia and its mechanism.
    back: Dementia following a succession of cerebrovascular events (less commonly a single stroke), from involvement of several vessels supplying the cerebral cortex and subcortical structures.
    src: { page: 88, quote: "Dementia that may follow a succession of cerebrovascular events or less commonly a single stroke." }
    status: unverified
  - id: geri.L05.028
    kind: card
    topic: syndromes
    front: Which two signs usually accompany multi-infarct dementia?
    back: Pseudobulbar syndrome and parkinsonism.
    src: { page: 88, quote: "Usually there is pseudo bulbar syndrome & parkinsonism." }
    status: unverified
  - id: geri.L05.029
    kind: card
    topic: syndromes
    front: What does posterior cerebral artery infarction cause?
    back: Hemianopic visual loss and cortical blindness.
    src: { page: 88, quote: "Posterior cerebral artery infarction: Hemianopic visual loss & cortical Blindness." }
    status: unverified
  - id: geri.L05.030
    kind: card
    topic: syndromes
    front: What is border zone cerebral infarction and how does it present?
    back: Multiple cortical infarcts after prolonged periods of very low perfusion, causing memory loss, intellectual impairment and cortical blindness.
    src: { page: 88, quote: "Multiple cortical infarcts following prolonged periods of very low perfusion memory loss, intellectual impairment & cortical blindness." }
    status: unverified
  - id: geri.L05.031
    kind: card
    topic: hemorrhage
    front: "Intracerebral hemorrhage: usual cause, course, and what distinguishes it from infarction?"
    back: Usually chronic hypertension; usually massive and fatal. It may mimic thromboembolic infarction, but there is usually severe headache and coma.
    src: { page: 88, quote: "Usually related to chronic hypertension, usually massive & fatal, may simulate thromboembolic infarction, but there is usually severe headache & coma." }
    status: unverified
    tags: [high-yield]
  - id: geri.L05.032
    kind: card
    topic: hemorrhage
    front: Which imaging is more helpful in the initial diagnosis of intracerebral hemorrhage?
    back: CT is more helpful than MRI.
    src: { page: 88, quote: "CT more helpful than MRI in initial diagnosis." }
    status: unverified
  - id: geri.L05.033
    kind: card
    topic: hemorrhage
    front: How does the second hemorrhage type in the lecture's list ("cerebral", with cerebellar signs) present?
    back: Headache and deterioration of consciousness with cerebellar signs.
    src: { page: 88, quote: "Headache, deterioration of consciousness with cerebellar signs." }
    status: unverified
  # ---------- p89: SAH, SDH, EDH, management ----------
  - id: geri.L05.034
    kind: card
    topic: hemorrhage
    front: What usually causes subarachnoid hemorrhage?
    back: Rupture of a congenital berry aneurysm at the base of the brain, or of an arteriovenous malformation.
    src: { page: 89, quote: "Usually due to rupture of congenital Berry aneurysms at the base of the brain, or rupture of arterio venous malformations" }
    status: unverified
    tags: [high-yield]
  - id: geri.L05.035
    kind: order
    topic: hemorrhage
    prompt: Order the presentation of subarachnoid hemorrhage as the lecture gives it.
    steps:
      - Severe headache
      - Drowsiness or coma
      - Neck stiffness and signs of meningeal irritation
    src: { page: 89, quote: "Presents by severe headache, drowsy or comatosed followed by neck stiffness & signs of meningeal irritation." }
    status: unverified
  - id: geri.L05.036
    kind: card
    topic: hemorrhage
    front: "Subdural haematoma: mechanism, timing, and who gets it?"
    back: Rupture of a vein in the subdural space, following head injury by days or months. Common in the elderly and alcoholics; it may resolve.
    src: { page: 89, quote: "Rupture of a vein in the subdural space follows head injury by days or months. Common in elderly & alcoholics, may resolve." }
    status: unverified
    tags: [high-yield]
  - id: geri.L05.037
    kind: card
    topic: hemorrhage
    front: "Extradural hemorrhage: cause and who manages it?"
    back: A skull fracture tears the middle meningeal artery; it is a neurosurgical problem.
    src: { page: 89, quote: "Follows skull fracture tear of middle meningeal artery, (neurosurgical problem)." }
    status: unverified
  - id: geri.L05.038
    kind: enumerate
    topic: management
    prompt: Enumerate the general measures in the management of stroke.
    points:
      - Check blood pressure
      - Care for the unconscious patient
      - Maintain the airway
      - O2 mask
      - CT (may detect hemorrhage early; neurosurgery may be needed)
    pass: 4
    src: { page: 89, quote: "Check blood pressure - Care for unconscious pts. - Maintain air way - O2mask" }
    status: unverified
  - id: geri.L05.039
    kind: cloze
    topic: management
    text: "Cerebral infarction: IV tissue plasminogen activator (alteplase) {{c1::0.9 mg/kg}} as an IV infusion over {{c2::one hour}}, unless contraindicated."
    src: { page: 89, quote: "give I.V. tissue plasminogen activator (Alteplase) 0.9mg/kg. I.V. infusion over one hour." }
    status: unverified
    tags: [numbers, high-yield]
    update:
      text: "Alteplase 0.9 mg/kg (max 90 mg): 10% as an IV bolus over 1 minute, the rest over 60 minutes, within 4.5 hours of onset. Aspirin is started 24-48 hours after alteplase, not with it."
      ref: AHA/ASA acute ischemic stroke guideline, 2019
  - id: geri.L05.040
    kind: card
    topic: management
    front: Which aspirin dose does the lecture give in acute cerebral infarction?
    back: Aspirin 300 mg/day.
    src: { page: 89, quote: "Aspirin 300 mg /day + anti thrombolytic therapy (unless contraindicated)" }
    status: unverified
    tags: [numbers]
  # ---------- p90: long term ----------
  - id: geri.L05.041
    kind: table
    topic: management
    title: Long-term treatment after stroke
    columns: [Measure, Detail]
    rows:
      - [Risk factors, "Treat hypertension, atherosclerosis and any underlying cause"]
      - [Antiplatelet, "Aspirin 75 mg, clopidogrel 75 mg, or aspirin 75 mg + dipyridamole 200 mg twice daily"]
      - [Anticoagulation, "If AF, arrhythmias or a cardiac valve lesion"]
      - [Endarterectomy, If internal carotid artery stenosis]
      - [Rehabilitation, Physiotherapy and speech therapy]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 90, quote: "anti–platlet therapy: Aspirin 75 mg, clopidogrel 75mg, combination of Aspirin 75mg & Dipyridamole 200 mg twice daily" }
    status: unverified
    tags: [high-yield]
  - id: geri.L05.042
    kind: card
    topic: management
    front: When is anticoagulation indicated after a stroke, per the lecture?
    back: If there is AF, another arrhythmia, or a cardiac valve lesion.
    src: { page: 90, quote: "Anticoagulation: If AF, arrhythmias or cardiac valve lesion." }
    status: unverified
  - id: geri.L05.043
    kind: card
    topic: management
    front: When is endarterectomy indicated after a stroke, per the lecture?
    back: If there is internal carotid artery stenosis.
    src: { page: 90, quote: "Endartere-ctomy: If there is internal carotid artery stenosis." }
    status: unverified
  # ---------- MCQs ----------
  - id: geri.L05.044
    kind: mcq
    topic: definition
    stem: A 74-year-old man has sudden right-sided weakness that is still present 36 hours later. What proportion of strokes like his are due to thromboembolic infarction, per the lecture?
    options: ["80%", "10%", "5%", "50%", "95%"]
    answer: 0
    why:
      - "Correct: thromboembolic infarction 80%."
      - "10% is cerebral and cerebellar hemorrhage."
      - "5% is subarachnoid hemorrhage."
      - "Not a figure from the lecture."
      - "Too high: hemorrhage makes up the rest."
    src: { page: 84, quote: "Thromboembolic infarction 80%" }
    status: unverified
  - id: geri.L05.045
    kind: mcq
    topic: ischemic
    stem: A 79-year-old woman with atrial fibrillation develops sudden left hemiplegia that is maximal at onset. Which artery does an embolus in the anterior circulation most often occlude?
    options: [Middle cerebral artery, Anterior cerebral artery, Apex of the basilar artery, Posterior inferior cerebellar artery, Small penetrating arteries]
    answer: 0
    why:
      - "Correct: the MCA carries 85% of hemispheric blood flow, so emboli go there."
      - "The ACA takes far less flow."
      - "That is where posterior circulation emboli lodge."
      - "PICA is posterior circulation (Wallenberg)."
      - "Small penetrating arteries are the site of lacunar thrombosis."
    src: { page: 85, quote: "Emboli in anterior cerebral circulation often occlude the middle cerebral artery (85% of hemispheric blood flow)" }
    status: unverified
    tags: [high-yield]
  - id: geri.L05.046
    kind: mcq
    topic: ischemic
    stem: A 76-year-old woman has new temporal headache, a tender scalp, pain in the jaw on chewing and aching shoulders. Which complication must you fear most?
    options: [Sudden loss of vision, Subarachnoid hemorrhage, Subdural haematoma, Locked-in syndrome, Extradural hemorrhage]
    answer: 0
    why:
      - "Correct: giant cell arteritis causes sudden temporary or permanent loss of vision."
      - "SAH comes from berry aneurysms or AVMs, not GCA."
      - "Subdural haematoma follows head injury."
      - "Locked-in is massive brain stem damage."
      - "Extradural follows skull fracture."
    src: { page: 86, quote: "headache, tender scalp, claudication of the jaw, sudden temporary or permanent loss of vision." }
    status: unverified
    tags: [high-yield]
  - id: geri.L05.047
    kind: mcq
    topic: risk
    stem: Which of these is listed in the lecture as a stroke risk factor that acts mainly through venous rather than arterial thrombosis?
    options: [Protein C deficiency, Hypertension, Hyperhomocysteinemia, Cigarette smoking, Diabetes mellitus]
    answer: 0
    why:
      - "Correct: thrombophilias such as protein C deficiency and factor V cause venous thrombosis rather than arterial."
      - "Hypertension is an atherosclerotic (arterial) risk factor."
      - "Hyperhomocysteinemia is listed with the atherosclerotic risk factors."
      - "Smoking is an atherosclerotic risk factor."
      - "Diabetes is an atherosclerotic risk factor."
    src: { page: 86, quote: "Thrombocythemia & thrombophilia (protein c deficiency, factor V --- Venous thrombosis rather than arterial)." }
    status: unverified
  - id: geri.L05.048
    kind: mcq
    topic: syndromes
    stem: A 68-year-old man after a brain stem stroke is fully conscious and understands speech but cannot move his limbs or speak. He answers by looking up and down. What is the syndrome?
    options: [Locked-in syndrome, Weber syndrome, Wallenberg syndrome, Pseudobulbar syndrome, Multi-infarct dementia]
    answer: 0
    why:
      - "Correct: massive brain stem damage below the third nerve nuclei; cortex works, only vertical eye movements remain."
      - "Weber is a lesion at the level of the 3rd nerve."
      - "Wallenberg is PICA territory."
      - "Pseudobulbar gives emotional and sphincteric disturbance from bilateral pyramidal lesions."
      - "MID is a dementia, and he is cognitively intact."
    src: { page: 87, quote: "he has functioning cerebral cortex, but can not move or communicate except by vertical eye movements." }
    status: unverified
    tags: [high-yield]
  - id: geri.L05.049
    kind: mcq
    topic: syndromes
    stem: Which syndrome follows occlusion of the posterior inferior cerebellar artery?
    options: [Wallenberg syndrome, Weber syndrome, Locked-in syndrome, Cortical blindness, Pseudobulbar syndrome]
    answer: 0
    why:
      - "Correct: PICA = Wallenberg."
      - "Weber is a brain stem lesion at the 3rd cranial nerve level."
      - "Locked-in is massive damage below the 3rd nerve nuclei."
      - "Cortical blindness is posterior cerebral artery or border zone infarction."
      - "Pseudobulbar is bilateral pyramidal, lower brain stem."
    src: { page: 87, quote: "Posterior inferior cerebellar artery (Wallenberg Syndrome)." }
    status: unverified
  - id: geri.L05.050
    kind: mcq
    topic: syndromes
    stem: An 81-year-old man had a cardiac arrest with prolonged hypotension. After recovery he has memory loss, intellectual impairment and cannot see despite normal pupils. Which infarction is most likely?
    options: [Border zone infarction, Lacunar infarct, Internal capsule infarction, Wallenberg syndrome, Hypertensive encephalopathy]
    answer: 0
    why:
      - "Correct: multiple cortical infarcts after prolonged very low perfusion give memory loss, intellectual impairment and cortical blindness."
      - "Lacunar infarcts come from small penetrating artery occlusion."
      - "Internal capsule infarction gives contralateral hemiplegia."
      - "Wallenberg is PICA occlusion."
      - "Hypertensive encephalopathy needs severe hypertension, not hypotension."
    src: { page: 88, quote: "Multiple cortical infarcts following prolonged periods of very low perfusion memory loss, intellectual impairment & cortical blindness." }
    status: unverified
  - id: geri.L05.051
    kind: mcq
    topic: syndromes
    stem: An 80-year-old man with several strokes over 3 years now has stepwise cognitive decline. Which two findings usually accompany this dementia?
    options: [Pseudobulbar syndrome and parkinsonism, Cortical blindness and hemianopia, Neck stiffness and photophobia, Jaw claudication and scalp tenderness, Tetraparesis and sensory loss]
    answer: 0
    why:
      - "Correct: multi-infarct dementia usually has pseudobulbar syndrome and parkinsonism."
      - "These are posterior cerebral artery infarction."
      - "These are meningeal signs of SAH."
      - "These are giant cell arteritis."
      - "This is main basilar artery occlusion."
    src: { page: 88, quote: "Usually there is pseudo bulbar syndrome & parkinsonism." }
    status: unverified
  - id: geri.L05.052
    kind: mcq
    topic: hemorrhage
    stem: A 72-year-old hypertensive man collapses with severe headache and is comatose. Which first imaging test does the lecture prefer?
    options: [CT brain, MRI brain, Carotid Doppler, Cerebral angiography, Lumbar puncture]
    answer: 0
    why:
      - "Correct: CT is more helpful than MRI in the initial diagnosis of hemorrhage."
      - "MRI is less helpful early for hemorrhage, per the lecture."
      - "Doppler looks for carotid stenosis later, not acute bleeding."
      - "Angiography is for aneurysms or AVMs once SAH is confirmed."
      - "LP comes after a CT and is dangerous with a mass lesion."
    src: { page: 88, quote: "CT more helpful than MRI in initial diagnosis." }
    status: unverified
  - id: geri.L05.053
    kind: mcq
    topic: hemorrhage
    stem: An 84-year-old man who drinks heavily is brought by his family because of increasing confusion and drowsiness over 3 weeks. He fell at home a month ago. Which lesion is most likely?
    options: [Subdural haematoma, Extradural hemorrhage, Subarachnoid hemorrhage, Lacunar infarct, Hypertensive encephalopathy]
    answer: 0
    why:
      - "Correct: venous rupture in the subdural space follows head injury by days or months; common in elderly and alcoholics."
      - "Extradural follows skull fracture with middle meningeal artery tear and is acute."
      - "SAH presents with sudden severe headache and meningism."
