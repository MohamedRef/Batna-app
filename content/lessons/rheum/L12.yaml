  - id: rheum.L12.lesson5
    title: "علاج الـ JIA: من الـ NSAID للـ biologic"
    hook: "الـ MTX بالمتر المربع مش بالكيلو، والـ sulfasalazine ممنوع في نوع واحد. تفاصيل صغيرة بتجيب درجات كبيرة."
    minutes: 10
    pages: [206, 210]
    topics: [nsaids, steroids, dmards, biologics]
    goals:
      - "تعرف مكان الـ NSAIDs والـ steroids بجرعاتها"
      - "تحفظ جرعات الـ DMARDs وممنوعاتها"
      - "تعرف الـ biologics: مين لمين، وإيه لازم قبلها"
    status: unverified
    steps:
      - kind: explain
        page: 206
        quote: "General approach to JIA treatment only 25-33%, mainly oligoarticular respond well 4-6 weeks duration to assess its efficacy"
        title: "البداية: الـ NSAIDs"
        text: |
          - بس **25–33%** بيردوا كويس، وأغلبهم **oligoarticular**.
          - محتاج **4–6 أسابيع** عشان تحكم على الفايدة.
          - هي ==disease-modifying== مش remission-inducing: بتقلل الألم والالتهاب وبتحافظ على القوة و range of motion والـ endurance.
      - kind: aside
        tone: trap
        page: 206
        quote: "Diagnostic criteria for MAS"
        text: "الكتاب كاتب عنوان **Diagnostic criteria for MAS** في صفحة 206 من غير ما يكتب المعايير، والفقرة اللي بعدها (25–33%) مكتوبة من غير عنوان الدوا. فهمنا من السياق إنها الـ NSAIDs (الرقم 1 قبل 2- Corticosteroids)."
      - kind: table
        page: 206
        quote: "Pulse methyl prednisolone 30 mg\\kg up to 1 gm for severe or life threatening disease."
        title: "الـ Corticosteroids"
        columns: ["Regimen", "For"]
        rows:
          - ["Intra-articular", "Remission ≥ 6 months in the joint"]
          - ["Low dose", "Pain, mobilise severe resistant polyarthritis"]
          - ["Moderate-high", "Systemic symptoms not controlled by NSAIDs"]
          - ["Pulse MP 30 mg/kg, max 1 g", "Severe or life-threatening disease"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 206
        quote: "Accepted initial dose is 10 mg \\m 2 \\week (0ral /parentral) if not effective"
        title: "الـ Methotrexate: الأساس"
        text: |
          ==Methotrexate== هو **cornerstone** لأغلب الـ JIA مع polyarthritis.

          - البداية **10 mg/m²/week** (oral أو parenteral).
          - لو مش كفاية: لحد **15 mg/m²** أو 0.5–1 mg/kg parenteral. أكتر من كده مفيش فايدة.
          - أحيانًا بيبدأ خلال **8–12 أسبوع** من الـ NSAIDs في الـ poly.
          - **Folic acid 1 mg/day** + multivitamin، ومتابعة الكبد والدم.
      - kind: mnemonic
        page: 207
        quote: "Contraindicated in sulfa-allergic or aspirin-sensitive patients. Useful in oligo or polyarticular subgroups. Not for use in systemic onset JIA."
        word: "SAS"
        parts:
          - { key: "S", text: "Sulfa allergy: contraindicated" }
          - { key: "A", text: "Aspirin sensitivity: contraindicated" }
          - { key: "S", text: "Systemic onset JIA: not for use (and can trigger MAS)" }
        hook: |
          الـ sulfasalazine بيقولك **SAS**: ممنوع مع sulfa، aspirin، و systemic. الجرعة 15–25 mg/kg/d على مرتين، max 1500 mg، والـ enteric-coated أريح.
      - kind: table
        page: 207
        quote: "If < 20 kg: 100mg loading dose + 10 mg/d PO."
        title: "Leflunomide بالوزن"
        columns: ["Weight", "Regimen"]
        rows:
          - ["< 20 kg", "100 mg once, then 10 mg/d"]
          - ["20–40 kg", "100 mg/d × 2 days, then 10 mg/d"]
          - ["> 40 kg", "100 mg/d × 3 days, then 20 mg/d"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 207
        quote: "Accepted dose 6 mg \\kg daily up to 200mg\\day with ophthalmologic examination every 6 months to monitor for evidence of retinal toxicity."
        title: "باقي الـ DMARDs"
        text: |
          - **Leflunomide**: بديل للـ MTX؛ headache، diarrhoea، abdominal pain.
          - **Hydroxychloroquine**: 6 mg/kg/day لحد 200 mg، و eye exam كل **6 شهور** للـ retinal toxicity.
          - **Azathioprine**: 2.5–5 mg/kg/day؛ abdominal pain، transaminases، cytopenias، rash في أول شهرين.
          - ==Cyclosporin==: فعال في الـ **MAS**؛ لوحده مش بيعالج الـ arthritis فبيتجمع مع MTX؛ 3–5 mg/kg/day؛ مشكلته HTN و nephrotoxicity.
      - kind: check
        page: 207
        quote: "Not for use in systemic onset JIA."
        question: "Which drug should NOT be used in systemic onset JIA?"
        options: ["Sulfasalazine", "Methotrexate", "Corticosteroids", "Cyclosporin"]
        answer: 0
        why:
          - "صح: not for use in systemic onset، وكمان trigger للـ MAS."
          - "الـ MTX مستخدم."
          - "الـ steroids لأعراض الـ systemic الشديدة."
          - "الـ cyclosporin بيعالج الـ MAS."
      - kind: explain
        page: 208
        quote: "all children should have a documented negative TB skin test before starting any biologic therapy."
        title: "الـ Biologics"
        text: |
          مشاكلها في الأطفال: infections (خصوصًا **varicella**)، التطعيمات، أثرها على مناعة لسه بتتكون، malignancy، و CNS demyelination.

          - لازم ==negative TB skin test== موثق قبل أي biologic.
          - **Live vaccines ممنوعة** وهو عليها.
          - **Anti-TNF**: ممتاز في **ERA**، أضعف بكتير في **systemic**.
          - **Infliximab > etanercept** للـ uveitis.
          - Anti-TNF ممكن يبطّأ الـ radiologic damage ويزود الـ bone density.
      - kind: sort
        page: 209
        quote: "Interleukin 6 is also an important cytokine in the pathogenesis of systemic arthritis."
        prompt: "أنهي اختيار للحالة دي؟"
        bins: ["Good choice", "Poor choice"]
        cards:
