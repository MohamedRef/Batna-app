          </svg>
      - kind: reveal
        page: 109
        quote: "Thrombocytopenia is usually present causing petechiae, echymoses bleeding gums, epistaxis or hemorrhage most pathetns with acute leukemia at diagnosis are significantly granulocytopenic leading to significant or life threatening infections at presentation."
        prompt: "عيان الـ WBC بتاعه 80,000. ليه جاي بـ infection خطيرة؟ مش عنده WBCs كتير؟"
        answer: |
          الـ 80,000 دول أغلبهم ==blasts==، والـ blast ما بتعرفش تحارب بكتيريا. الكتاب بيقول إن أغلب العيانين **granulocytopenic** وقت التشخيص.

          يعني اسأل دايمًا: كام **neutrophil** ناضج؟ مش كام WBC.
      - kind: explain
        page: 110
        title: "الـ infiltration: ALL أشطر"
        quote: "In addition to suppressing normal marrow function, leukemic cells can infiltrate normal organs, ALL tends to infiltrate normal organs more often than AML. Enlargement of L.N, liver and spleen is common at diagnosis bone pain, thought to result from leukemic infiltration of the periosteum or expansion of the medullary cavity, is a common complaint, particularly in children with ALL, in many of whom the original diagnosis was juvenile rheumatoid arthritis, leukemic cells may infiltrate, the leptomeninges, causing leukemic meningitis, leading to headache nausea, nerve palsies and seizures."
        text: |
          الـ ==acute lymphoblastic leukaemia (ALL)== بتـ infiltrate الأعضاء **أكتر من acute myeloid leukaemia (AML)**:
          - **Lymph nodes** و **liver** و **spleen** كبار وقت التشخيص.
          - **Bone pain**: من infiltration الـ **periosteum** أو تمدد الـ **medullary cavity**، خصوصًا في الأطفال.
          - **Leukemic meningitis** (leptomeninges): headache، nausea، **nerve palsies**، seizures.

          ليه الألم في العضم؟ الكتاب بيقول: infiltration الـ periosteum أو تمدد الـ medullary cavity. يعني النخاع اتملى لدرجة إنه بيضغط على العضمة من جوه.
      - kind: aside
        tone: trap
