      - kind: figure
        page: 267
        title: "شكل الـ anti-TNF من جوه"
        image: { file: rheum/L16-anti-tnf-structure.webp, book: true }
        alt: "Five antibody drawings. Infliximab: dark murine Fv arms on a human Fc. Etanercept: two chains of human TNF receptor 2 beads on a human Fc. Adalimumab and golimumab: fully human Fv and Fc. Certolizumab pegol: a single humanized Fab' arm attached to polyethylene glycol, with no Fc."
        caption: |
          - **الـ infliximab**: الأذرع **غامقة** = ==murine Fv== (فار) على Fc بشري.
          - **الـ etanercept**: مش antibody؛ **حبات الـ TNF receptor 2** متركبة على Fc.
          - **الـ adalimumab و الـ golimumab**: كله بشري.
          - **الـ certolizumab pegol**: دراع واحد (**Fab'**) متركب على **PEG**، من غير Fc.

          يعني الحتة الغامقة في الـ infliximab هي اللي الجسم ممكن يعمل ضدها antibodies، وده سبب إنه ==لازم مع methotrexate==.
      - kind: explain
        page: 266
        title: "الـ infliximab ليه لازم MTX؟"
        quote: "Only infliximab needs to be combined with methotrexate to prevent development of antibodies to the mouse component of the drug."
        text: |
          الـ ==infliximab== **chimeric**: ربعه فار (الـ antigen-binding region) والباقي إنسان. الجسم ممكن يعمل antibodies ضد الحتة الفار، فبنحطّ معاه **methotrexate** يمنع ده.

          بياخد **3 mg/kg** IV على ساعتين: أسبوع 0 و 2 و 6، وبعدين كل **8 أسابيع**. ممكن يوصل 10 mg/kg كل 4 أسابيع.

          وبيموّت الخلايا اللي عليها tumour necrosis factor (TNF) بالـ antibody-dependent cell-mediated cytotoxicity (ADCC) والـ complement.
      - kind: explain
        page: 268
        title: "اقرا الاسم تعرف التركيب"
        quote: "Chimeric IgG1 anti TNF antibody containing the antigen-binding region of the mouse antibody (one fourth of the molecule) and the constant region of the human antibody."
        text: |
          الكتاب بيوصف تركيب كل واحد، والاسم بيساعدك تفتكره. التفسير المقبول (مش في الكتاب): آخر الاسم بيقول قد إيه الجزيء "فار":

          - **-ximab** = ==chimeric==: الـ **infliximab** (ربعه فار)، والـ rituximab كمان.
          - **-zumab** = **humanized**: حتة صغيرة جدًا بس من الفار. الـ **certolizumab** (Fab' fragment عليه polyethylene glycol) والـ tocilizumab.
          - **-umab** = **human** بالكامل: الـ **adalimumab** والـ **golimumab**.
          - **-cept** = **receptor** ملزوق في Fc: الـ ==etanercept== (TNF receptor type II، p75، على Fc بتاع IgG1)، والـ abatacept.

          وكل ما الجزيء "إنساني" أكتر، الجسم أقل يعمل antibodies ضده. علشان كده الـ infliximab بالذات هو اللي محتاج methotrexate.
      - kind: match
        page: 268
        quote: "Soluble TNF receptor fusion protein."
        prompt: "وصّل كل anti-TNF بتركيبه:"
        pairs:
          - ["Infliximab", "Chimeric IgG1 antibody"]
          - ["Etanercept", "Soluble TNF receptor fusion protein"]
          - ["Adalimumab", "Recombinant human IgG1 antibody"]
          - ["Certolizumab pegol", "Humanized Fab' with polyethylene glycol"]
        why: "Infliximab = -ximab (chimeric). Etanercept = -cept (receptor). Adalimumab = -umab (human). Certolizumab = -zumab (humanized) و pegol = الـ polyethylene glycol."
      - kind: table
        page: 268
        quote: "C- Adalimumab (Humira)\n  Recombinant human IgG1 monoclonal antibody.\n  Subcut 40 mg every other week."
        title: "جرعات الـ anti-TNF"
        columns: ["Drug", "Dose"]
        rows:
          - ["Etanercept", "50 mg SC weekly (or 25 mg twice)"]
          - ["Adali\u00admumab", "40 mg SC every other week"]
          - ["Golimumab", "50 mg SC monthly"]
          - ["Certoli\u00adzumab", "400 mg wk 0, 2, 4; then 200 mg every 2 wk"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 268
        quote: "This fusion protein binds both TNF- and TNFB preventing interaction with receptors."
        prompt: "الـ etanercept ينفع لوحده (monotherapy)، والـ infliximab لأ. ليه؟ وإيه اللي بيعمله الـ etanercept زيادة؟"
        answer: |
          الـ **infliximab** فيه ==ربع فار== (mouse antigen-binding region)، فالكتاب بيقول لازم methotrexate يمنع الـ antibodies ضده. الـ **etanercept** معمول من receptor إنساني على Fc إنساني، فممكن **monotherapy أو مع MTX**.

          والـ etanercept **receptor عايم** (decoy): بيمسك ==TNF-α و TNF-β== الاتنين قبل ما يوصلوا للـ receptor الحقيقي. الـ infliximab بيمسك الـ TNF-α، وكمان **بيقتل** الخلايا اللي عليها TNF بالـ ADCC والـ complement.
      - kind: mnemonic
        page: 269
        quote: "Infections:\n  Serious bacterial infections, TB, fungal, atypical mycobacteria."
        word: "LAMPS"
        parts:
          - { key: "L", text: "Lymphoma (non-Hodgkin); cancer overall not increased" }
          - { key: "A", text: "Autoantibodies (ANA, double-stranded DNA (dsDNA)); drug lupus rare" }
          - { key: "M", text: "MS: worsened or new demyelination, so avoid" }
          - { key: "P", text: "Puncture (injection) site reactions" }
          - { key: "S", text: "Serious infections: TB, fungi, atypical mycobacteria" }
        hook: "الـ anti-TNF بيطفّي **LAMPS** المناعة. وزوّد عليهم abnormal LFT و cytopenia."
      - kind: explain
        page: 269
        title: "الـ TB قبل الـ anti-TNF"
        quote: "If positive and chest X-ray normal: isonazid (300 mg) and vit B6 (50mg) for 9 month with anti TNF.\n  Upper Resp tract infection or skin infections and ulcer with held then restart.\n  Withheld 1 or 2 weeks before surgery restarted 2 weeks later."
        text: |
          الـ TNF هو اللي ماسك الـ granuloma قافل على الـ tuberculosis (TB). توقفه، الـ latent TB يصحى.

          1. Screening: **Purified protein derivative (PPD)** أو ==QuantiFERON-Gold==.
          2. موجب والـ Chest X-ray (CXR) طبيعي ← ==isoniazid 300 mg + B6 50 mg لمدة 9 شهور== مع الـ anti-TNF.

          وكمان: وقّفه **1-2 أسبوع قبل العملية** وارجعله بعدها بأسبوعين. ووقّفه في الـ upper respiratory tract infection (URTI) أو skin infection وارجعله.

          يعني الـ screening مش روتين: الدوا نفسه هو اللي ممكن يصحّي الـ TB.
      - kind: update
        page: 269
        quote: "If positive and chest X-ray normal: isonazid (300 mg) and vit B6 (50mg) for 9 month with anti TNF.\n  Upper Resp tract infection or skin infections and ulcer with held then restart.\n  Withheld 1 or 2 weeks before surgery restarted 2 weeks later."
        text: "الـ guidelines الحالية بتفضّل regimens أقصر للـ latent TB: 3HP (isoniazid + rifapentine أسبوعي 3 شهور)، أو 4R (rifampicin 4 شهور)، أو three months of daily isoniazid plus rifampicin (3HR). في الامتحان: الكتاب = isoniazid (INH) 9 شهور."
        ref: "NTCA/CDC latent TB treatment guidelines, 2020"
      - kind: reveal
        page: 269
        quote: "Withheld 1 or 2 weeks before surgery restarted 2 weeks later."
        prompt: "ليه بنوقف الـ anti-TNF قبل العملية بأسبوع أو اتنين، ونرجع بعدها بأسبوعين؟ (withheld before surgery)"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ TNF جزء أساسي من دفاع الجسم ضد البكتيريا ومن التئام الجرح. العملية = جرح مفتوح وخطر infection، فبنستنى الدوا يقل في الدم قبل العملية، ونرجع بعد ما الجرح يقفل.

          ونفس المنطق في الكتاب مع **upper respiratory tract infection أو skin infection**: وقّف، عالج، ارجع. لأن البند الأول في أعراضه الجانبية **serious infections**.
      - kind: check
