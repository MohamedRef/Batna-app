          صورة بالـ slit lamp للعين: النور عامل خط رفيع على العدسة، و==السهم الأبيض== بيشاور على الوش القدامي بتاعها: ==بارز لقدام زي المخروط== مش مدوّر ناعم.

          ده الـ **anterior lenticonus** في الـ ==Alport syndrome== (حوالي 20%)، والعدسة المخروطية دي بتعمل distorted vision.
