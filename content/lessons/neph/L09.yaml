          </svg>
      - kind: order
        page: 297
        quote: "It was suggest to use (in a descending order of preference) the right jugular vein, the femoral vein, the left jugular vein or the subclavian vein for insertion of a dialysis catheter in patients with AKI. (not graded) (iii) Ultrasound guidance for dialysis catheter insertion was recommended. (2A) Femoral vein is usually less preferable for fear of infection and if planned for kidney transplantation, subclavian is prohibited for fear of stenosis (prohibit permanent vascular access creation on this side) translumbar or transhepatic approach to IVC may be required if no available central vein."
        prompt: "AKI محتاج catheter. رتّب الأوردة من الأحسن للأوحش:"
        steps:
          - "Right jugular"
          - "Femoral"
          - "Left jugular"
          - "Subclavian"
        why: "Right jugular أقصر وأقل مشاكل. الـ femoral فيه infection ويتجنب لو هيزرع. والـ subclavian آخر واحد لأنه بيعمل ==stenosis== تمنع أي fistula في الدراع ده. وكل ده تحت ultrasound (2A)."
      - kind: mnemonic
        page: 297
        quote: "It was suggest to use (in a descending order of preference) the right jugular vein, the femoral vein, the left jugular vein or the subclavian vein for insertion of a dialysis catheter in patients with AKI. (not graded) (iii) Ultrasound guidance for dialysis catheter insertion was recommended. (2A) Femoral vein is usually less preferable for fear of infection and if planned for kidney transplantation, subclavian is prohibited for fear of stenosis (prohibit permanent vascular access creation on this side) translumbar or transhepatic approach to IVC may be required if no available central vein."
        word: "RFLS"
        parts:
          - { key: "R", text: "Right jugular" }
          - { key: "F", text: "Femoral" }
          - { key: "L", text: "Left jugular" }
          - { key: "S", text: "Subclavian: last, stenosis" }
        hook: |
          "**R**eally **F**ast, **L**ast **S**ubclavian": الـ subclavian آخر واحد، لأنه بيقفل طريق الـ fistula.
      - kind: table
        page: 297
        quote: "Important definitions Semipermeable membrane: allows the passage of small molecules while preventing that of large molecules. Diffusion solute transfer across the membrane down a concentration gradient from blood to dialysate. Diffusion provides efficient clearance of low-molecular-weight solutes (< 500-1,500 Daltons)."
        title: "إزاي الحاجة بتعدّي الغشا؟"
        columns: [Mechanism, How, Best for]
        rows:
          - ["Diffusion", "Concentration gradient", "Small (<500–1,500 D)"]
          - ["Convection", "Dragged with water (UF)", "Larger, faster"]
          - ["Adsorption", "Sticks to membrane", "Hydrophobic"]
        hide: [[0, 2], [1, 1], [2, 2]]
      - kind: aside
        tone: analogy
        page: 297
        quote: "Convection is the process where by solutes pass through membrane pores, dragged by fluid movement (ultrafiltration) caused by a hydrostatic and/or osmotic transmembrane pressure gradient. Compared to diffusive transport, convective transport permits the removal of higher molecular weight solutes at a higher rate."
        text: |
          الـ **diffusion** زي نقطة شاي في كوباية مية: بتنتشر لوحدها من الكتير للقليل، وده بيمشي مع الحاجات الصغيرة.

          الـ ==convection== زي السيل: المية بتجري وبتشد معاها أي حاجة قدها، حتى الكبيرة.
      - kind: explain
        page: 298
        title: "UF وأحجام الـ solutes"
        quote: "Middle molecules MW 500-15000 B12(1355). B2 microglobulin (11800) Large solutes MW>15000D:, myoglobulin (17800),albumin (68000 daltons) Low flux filters have membranes with low water permeability.UF coefficient when using blood 2-10 ml/h/mmHg/m2."
        text: |
          الـ ==ultrafiltration== = مية البلازما بتعدّي الغشا بسبب فرق الضغط (TMP). الـ **ultrafiltration coefficient (KUF)** = نفاذية الغشا للمية لكل mmHg ولكل m²، والـ **dialyser ultrafiltration coefficient (DKUF)** = KUF × مساحة الفلتر.

          **الأحجام**:
          - **Small** (<500 D): Na، P، K، urea 60، creatinine 113، uric acid 186، glucose 180.
          - ==Middle== (500–15,000): B12 1355، **β2-microglobulin 11,800**.
          - **Large** (>15,000): myoglobin 17,800، albumin 68,000.

          **Low flux**: ultrafiltration (UF) coefficient 2–10. **High flux**: 20–50، cut-off حوالي 20 kD، وبيعمل convection كبير.
      - kind: check
        page: 298
        quote: "Middle molecules MW 500-15000 B12(1355). B2 microglobulin (11800) Large solutes MW>15000D:, myoglobulin (17800),albumin (68000 daltons) Low flux filters have membranes with low water permeability.UF coefficient when using blood 2-10 ml/h/mmHg/m2."
        question: "Which solute is a middle molecule?"
        options:
          - "Beta-2 microglobulin"
          - "Urea"
          - "Albumin"
          - "Potassium"
        answer: 0
        why:
          - "صح: 11,800 D، بين 500 و 15,000."
          - "الـ urea 60 D: small."
          - "الـ albumin 68,000: large."
          - "الـ K small."
      - kind: explain
        page: 299
        title: "الـ HD بيشتغل بإيه أساسًا؟"
        quote: "Hemodialysis: The main mechanism of solute removal in hemodialysis is diffusion, which is chiefly effective in the removal of small solutes. Hemodialysis involves the use of a hemodialyzer, where blood and dialysate solution circulate counter-current or co-current. A counter-current configuration is preferred because the average concentration gradient is kept higher along the whole length of the dialyzer."
        text: |
          الـ haemodialysis (HD) أساسه ==diffusion==، وده قوي مع الـ **small solutes**. والـ **counter-current** أحسن من الـ co-current لأنه بيخلي الـ gradient عالي على طول الفلتر. الـ **high-flux filters** بتضيف convection مهم.
      - kind: try
        items: [neph.L09.024, neph.L09.028, neph.L09.032, neph.L09.037, neph.L09.041]
    recap:
