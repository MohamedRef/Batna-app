            <text x="230" y="106" text-anchor="middle" class="t-sm t-b">Exact values matter most?</text>
            <path d="M200 118L170 158" class="fg-arrow" marker-end="url(#L13b)"/><text x="160" y="140" text-anchor="end" class="t-sm t-mut">yes</text>
            <rect x="120" y="160" width="90" height="32" rx="8" class="fg-acc"/><text x="165" y="181" text-anchor="middle" class="t-sm t-b">Table</text>
