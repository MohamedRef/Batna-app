  - id: geri.L07.009
    kind: mcq
    topic: cga
    stem: What is the primary goal of Comprehensive Geriatric Assessment (CGA)?
    options:
      - "To reduce healthcare costs by cutting hospital stays and tests"
      - "To give a holistic, multidimensional assessment and individual care plan"
      - "To replace family caregivers with professional care staff"
      - "To focus solely on pharmacological treatments and drug review"
      - "To eliminate the need for hospitalization in older adults"
    answer: 1
    why:
      - Fewer admissions may follow, but saving money is not the goal.
      - "Correct: CGA is a holistic multidimensional assessment that leads to an individual plan (p107)."
      - CGA plans with the family and carers; it does not replace them.
      - Medicines are one of 12 components, not the whole of CGA.
      - CGA lowers admission rates; it cannot remove the need for hospital.
    src: { page: 107, quote: "Comprehensive Geriatric Assessment (CGA) is a process of care comprising a number of steps. Initially, a multidimensional holistic assessment of an older person considers health and wellbeing and leads to the formulation of a plan to address issues which are of concern to the older person (and their family and carers when relevant). Interventions are then arranged in support of the plan. Progress is reviewed and the original plan reassessed at appropriate intervals with the interventions reconsidered accordingly." }
    status: unverified
    tags: [book-question]
