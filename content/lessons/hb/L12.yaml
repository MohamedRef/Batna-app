schema: batna.lesson/v1
lecture: hb.L12
lessons:
  # ------------------------------------------------------------------
  - id: hb.L12.lesson1
    title: "الكحول والكبد: من الدهون للتليف"
    hook: "أكتر من 90% من اللي بيشربوا كتير عندهم fatty liver. والكتاب بيقول: ده مش benign زي ما كانوا فاكرين."
    minutes: 9
    pages: [195, 196]
    topics: [ald, ald-mx]
    goals:
      - "ترسم الـ spectrum بتاع ALD وتشرح ليه الـ steatosis مش بريئة"
      - "تحفظ كمية الكحول والمدة اللي بتتوقع steatohepatitis و cirrhosis"
      - "تعدّ الـ modifiers of ALD risk"
      - "تعدّ خطوط العلاج الأربعة"
    status: unverified
    steps:
      - kind: explain
        page: 195
        title: "تلات محطات"
        quote: "the most characteristic being fatty liver (i.e., steatosis), hepatitis, and fibrosis/cirrhosis."
        text: |
          الـ **heavy ethanol consumption** بيعمل **wide spectrum** من الـ lesions، وأشهرهم تلاتة:

          - **Fatty liver (steatosis)**
          - **Alcoholic hepatitis**
          - **Fibrosis / cirrhosis**

          الـ **steatosis** هي **الأبدر والأشهر**: بتحصل في **أكتر من 90%** من الـ problem drinkers اللي بيشربوا **4-5 standard drinks في اليوم** على مدى سنين طويلة، يعني decades.
      - kind: figure
        page: 195
        title: "الـ spectrum"
        alt: "Three stacked boxes joined by arrows: steatosis in more than 90 percent of heavy drinkers, then alcoholic hepatitis, then fibrosis and cirrhosis. Beside steatosis, fat raises lipid peroxidation and oxidative damage, which pushes toward fibrosis. A return arrow from steatosis says abstinence resolves it."
        caption: "الـ steatosis أول محطة، والدهون نفسها بتزقّ لقدّام بالـ lipid peroxidation. والـ **abstinence** هو اللي بيرجّعك من أول محطة."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L12a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
              <marker id="L12b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <text x="165" y="18" text-anchor="middle" class="t-b t-lg">Alcoholic liver disease</text>
            <rect x="20" y="36" width="190" height="56" rx="8" class="fg-acc"/>
            <text x="32" y="58" class="t-b">1. Steatosis</text>
            <text x="32" y="78" class="t-sm">earliest, most common: &gt; 90%</text>
            <path d="M115 92v26" class="fg-arrow-bad" marker-end="url(#L12a)"/>
            <rect x="20" y="122" width="190" height="56" rx="8" class="fg-bad"/>
            <text x="32" y="144" class="t-b">2. Alcoholic hepatitis</text>
            <text x="32" y="164" class="t-sm">steroids if moderate to severe</text>
            <path d="M115 178v26" class="fg-arrow-bad" marker-end="url(#L12a)"/>
            <rect x="20" y="208" width="190" height="56" rx="8" class="fg-bad"/>
            <text x="32" y="230" class="t-b">3. Fibrosis / cirrhosis</text>
            <text x="32" y="250" class="t-sm">end stage: liver transplant</text>
            <rect x="222" y="36" width="100" height="78" rx="8" class="fg-box"/>
            <text x="272" y="56" text-anchor="middle" class="t-sm t-b">Fat itself:</text>
            <text x="272" y="72" text-anchor="middle" class="t-sm">lipid</text>
            <text x="272" y="86" text-anchor="middle" class="t-sm">peroxidation,</text>
            <text x="272" y="100" text-anchor="middle" class="t-sm">oxidative damage</text>
            <path d="M272 114v120h-56" class="fg-arrow-bad" marker-end="url(#L12a)"/>
            <path d="M20 302h-12V64" class="fg-thin"/>
            <path d="M8 64h8" class="fg-arrow-acc" marker-end="url(#L12b)"/>
            <rect x="20" y="284" width="290" height="36" rx="8" class="fg-good"/>
            <text x="165" y="306" text-anchor="middle" class="t-sm t-b">Abstinence: resolves steatosis, improves survival</text>
          </svg>
      - kind: reveal
        page: 195
        prompt: "زمان كانوا بيقولوا الـ alcoholic steatosis «benign». الكتاب بيقول لأ. ليه؟"
        answer: |
          لأن المرضى اللي عندهم **chronic steatosis** بيبقوا **more susceptible to fibrotic liver disease**.

          والسبب: وجود الدهون نفسه بيعني **greater risk for lipid peroxidation and oxidative damage**. الدهون مش ضيف ساكت، دي وقود جاهز للحريقة.
      - kind: explain
        page: 195
        title: "تحت الميكروسكوب"
        text: |
          الـ histology: **centrilobular macrovesicular steatosis** مع درجات مختلفة من الـ **fibrosis**.

          **Centrilobular** يعني حوالين الـ central vein، يعني **zone 3**. فاكر من L01؟ الـ alcoholism بيبدأ الـ fibrosis في zone 3. (والسبب المقبول: zone 3 فيها أقل oxygen وأكتر إنزيمات بتكسّر الكحول.)

          والـ **differential diagnosis** اللي الكتاب كاتبه: **Diabetes** و **Obesity**: الاتنين بيعملوا fatty liver برضه.
      - kind: explain
        page: 195
        title: "كام جرام؟ وكام سنة؟"
        quote: "Intake of 40 to 80 grams ethanol/day by males and of 20 to 40 grams/day by females for 10 to 12 years"
        text: |
          ده **general predictor** لـ **alcoholic steatohepatitis, fibrosis, and cirrhosis**:

          - **رجالة: 40-80 g/day**
          - **ستات: 20-40 g/day**
          - لمدة **10-12 سنة**

          لاحظ إن رقم الستات **نص** رقم الرجالة. افتكرها كده: **الست بنص الكمية بتوصل لنفس المكان**.
      - kind: mnemonic
        page: 195
        word: "SWAG POV"
        parts:
          - { key: "S", text: "Smoking: higher risk of alcoholic cirrhosis" }
          - { key: "W", text: "Women are more susceptible" }
          - { key: "A", text: "Age: older adults (65 and up) are more vulnerable" }
          - { key: "G", text: "Genetics: family history of liver disease" }
          - { key: "P", text: "Pattern of consumption and beverage type (amount and years)" }
          - { key: "O", text: "Obesity: high BMI adds to the damage" }
          - { key: "V", text: "Viral infections: HCV and HBV speed fibrosis, cirrhosis and HCC" }
        hook: |
          من الـ **POV** بتاع الكبد، الكحول ملوش أي **SWAG**. 😎 السبع حروف هما الـ **modifiers of ALD risk** اللي في الكتاب.
      - kind: reveal
        page: 195
        prompt: "ليه الستات أكثر عرضة بنفس الكمية؟"
        answer: |
          الكتاب بيقول **women are more susceptible** من غير ما يشرح. التفسير المقبول:

          - **body water** أقل، فنفس الكمية بتعمل تركيز أعلى في الدم.
          - **gastric alcohol dehydrogenase** أقل، فالمعدة بتكسّر كحول أقل قبل ما يوصل الكبد.

          علشان كده الحد عند الستات **20-40 g** مش 40-80.
      - kind: check
        page: 195
        question: "By the book's predictor, which drinker is at risk of alcoholic steatohepatitis, fibrosis and cirrhosis?"
        options:
          - "A woman drinking 30 g/day for 11 years"
          - "A man drinking 30 g/day for 12 years"
          - "A woman drinking 30 g/day for 3 years"
          - "A man drinking 60 g/day for 2 years"
        answer: 0
        why:
          - "صح: الست في الـ range (**20-40 g**) وللمدة (**10-12 سنة**)."
          - "30 g أقل من حد الرجالة (**40-80 g**)."
          - "الكمية مظبوطة بس المدة قصيرة؛ المطلوب **10-12 سنة**."
          - "الكمية في الـ range بس سنتين بس، مش 10-12."
      - kind: aside
        tone: joke
        page: 196
        text: |
          المريض: «أنا بشرب في المناسبات بس يا دكتور».
          انت: «طب عندك كام مناسبة في الأسبوع؟»
          المريض: «...كل يوم فيه مناسبة».

          علشان كده الكتاب بيتكلم عن **Pattern of Consumption**، مش بس «بتشرب ولا لأ». 😄
      - kind: explain
        page: 196
        title: "العلاج: أربع خطوط"
        text: |
          - **Abstinence:** مش بس **بيخلّص الـ alcoholic steatosis**، كمان **بيحسّن الـ survival** في الـ cirrhotic patients. ده أهم علاج.
          - **Corticosteroids:** أكتر علاج اتستخدم، خصوصًا في **moderate to severe alcoholic hepatitis**، لأنها بت**suppress الـ immune response** و الـ **proinflammatory cytokine response**.
          - **Zinc supplementation:** liver function اتحسنت في مرضى ALD و HCV بـ **50 mg elemental zinc**.
          - **Liver transplantation:** الـ **standard of care** لـ **end-stage liver disease**.
      - kind: update
        page: 196
        text: |
          الـ guidelines بتحدد الـ steroids (prednisolone 40 mg لمدة 28 يوم) لـ **severe** alcoholic hepatitis (مثلًا Maddrey ≥ 32 أو MELD > 20)، وبتوقفها لو **Lille score** يوم 7 بيقول no response. **في الامتحان: «moderate to severe» زي الكتاب.**
        ref: "EASL ALD guidelines 2018; AASLD ALD guidance 2019"
      - kind: match
        page: 196
        prompt: "وصّل كل علاج باللي الكتاب قاله عنه:"
        pairs:
          - ["Abstinence", "Resolves steatosis and improves survival in cirrhosis"]
          - ["Corticosteroids", "Moderate to severe alcoholic hepatitis"]
          - ["Zinc 50 mg elemental", "Improved liver function in ALD and HCV"]
          - ["Liver transplantation", "Standard of care in end-stage liver disease"]
        why: "الـ abstinence هو الوحيد اللي الكتاب قال إنه بيحسّن الـ survival في الـ cirrhosis؛ الباقيين ليهم مكان محدد."
      - kind: aside
        tone: exam
        page: 195
        text: |
          سؤال المحاضرة: **«Discuss the most significant risk factor for the progression from steatosis to alcoholic hepatitis»**.

          ابدأ بـ **الكمية والمدة** (40-80 g رجالة / 20-40 g ستات لمدة 10-12 سنة، و pattern of consumption)، وبعدين ليه الـ steatosis مش benign (**lipid peroxidation**)، واختم بباقي **SWAG POV**.
      - kind: try
        items: [hb.L12.001, hb.L12.006, hb.L12.007, hb.L12.011, hb.L12.069]
    recap:
      - "ALD: **steatosis → hepatitis → fibrosis/cirrhosis**. الـ steatosis في **> 90%** من الـ heavy drinkers."
      - "الـ steatosis **مش benign**: الدهون = lipid peroxidation و oxidative damage."
      - "Histology: **centrilobular macrovesicular steatosis**. DD: diabetes و obesity."
      - "**40-80 g/day رجالة، 20-40 g/day ستات، 10-12 سنة**."
      - "Modifiers: **SWAG POV**."
      - "العلاج: **abstinence** (أهمهم)، steroids لـ moderate-severe AH، zinc 50 mg، و LT لـ ESLD."
    practice: [hb.L12.001, hb.L12.002, hb.L12.003, hb.L12.004, hb.L12.005, hb.L12.006, hb.L12.007, hb.L12.008, hb.L12.009, hb.L12.010, hb.L12.011, hb.L12.012, hb.L12.013, hb.L12.014, hb.L12.053, hb.L12.054, hb.L12.055, hb.L12.069]
  # ------------------------------------------------------------------
  - id: hb.L12.lesson2
    title: "الحديد اللي مش لاقي باب يقفله"
    hook: "هرمون صغير اسمه hepcidin هو اللي بيقرر الحديد يدخل ولا لأ. لو غاب، الجسم بيفتح البوابات على الآخر."
    minutes: 8
    pages: [196, 198]
    topics: [hh-path]
    goals:
      - "تعرّف الـ hemochromatosis وتقول بيتورث إزاي ومين أكتر عرضة"
      - "ترسم سلسلة الـ pathogenesis من الجين لحد الـ HCC"
      - "تفرّق بين الـ 4 types بالجين والميزة"
    status: unverified
    steps:
      - kind: explain
        page: 196
        title: "يعني إيه hemochromatosis؟"
        text: |
          **Inherited disease** الجسم فيه **بيمتص حديد أكتر من اللازم من الأكل**.

          علشان المرض يظهر لازم المريض يورث **two defective genes, one from each parent**.

          و**الرجالة أكتر بكتير** من الستات، والـ prevalence **بتزيد مع السن**.
      - kind: reveal
        page: 197
        prompt: "ليه الرجالة أكتر؟ وليه المرض بيزيد مع السن؟"
        answer: |
          - الستات بيخسروا حديد كل شهر (الدورة) ومع الحمل، فده زي **phlebotomy طبيعي** بيأخّر التراكم. (تفسير مقبول، الكتاب قال الملاحظة بس.)
          - الحديد بيتراكم **سنة ورا سنة**، فكل ما السن يزيد المخزون يكبر. والكتاب قال إن الأعراض ممكن تاخد **20-30 سنة** تظهر (الدرس الجاي).
      - kind: explain
        page: 197
        title: "Hepcidin: المتحكم الأول"
        text: |
          الـ **central regulator of systemic iron homeostasis** هو **hepcidin**: **peptide hormone** بيعمله الـ **hepatocytes** أساسًا.

          الـ hemochromatosis سببها **deficiency or impairment** في الـ **hepcidin synthesis or function**، بسبب variants في جينات بتنظّم إنتاجه أو شغله.

          النتيجة:
          - **↑ intestinal iron absorption**
          - **↑ iron release from macrophages**
          - **expanded circulating iron pool**، وده بيبان في **↑ transferrin saturation**
      - kind: figure
        page: 197
        title: "من الجين للـ HCC"
        alt: "A vertical chain. Pathogenic variants in genes regulating hepcidin lead to low hepcidin. Low hepcidin leaves the ferroportin iron exit door open on gut cells and macrophages, so absorption and macrophage release both rise. That expands the circulating iron pool, seen as raised transferrin saturation. Iron goes to the liver first; when it is full, to the heart, pituitary and pancreas. Untreated, the liver goes to fibrosis, cirrhosis and HCC."
        caption: "الـ hepcidin بيقفل باب خروج الحديد (**ferroportin**) في الأمعاء والـ macrophages. لو قلّ، البابين بيفضلوا مفتوحين. الكبد بيتملي الأول، وبعده القلب والـ pituitary والـ pancreas."
        svg: |
          <svg viewBox="0 0 330 520" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L12c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="15" y="8" width="300" height="44" rx="8" class="fg-ink"/>
            <text x="165" y="26" text-anchor="middle" class="t-sm t-b">Pathogenic variants in genes</text>
            <text x="165" y="42" text-anchor="middle" class="t-sm">regulating hepcidin (HFE, HJV, HAMP, TFR2)</text>
            <path d="M165 52v16" class="fg-arrow" marker-end="url(#L12c)"/>
            <rect x="65" y="72" width="200" height="40" rx="8" class="fg-bad"/>
            <text x="165" y="90" text-anchor="middle" class="t-b">↓ Hepcidin</text>
            <text x="165" y="105" text-anchor="middle" class="t-sm">(made by hepatocytes)</text>
            <path d="M120 112l-40 22M210 112l40 22" class="fg-arrow" marker-end="url(#L12c)"/>
            <rect x="10" y="138" width="148" height="70" rx="8" class="fg-acc"/>
            <text x="84" y="158" text-anchor="middle" class="t-sm t-b">Gut enterocyte</text>
            <text x="84" y="176" text-anchor="middle" class="t-sm">ferroportin door open</text>
            <text x="84" y="196" text-anchor="middle" class="t-sm t-bad t-b">↑ iron absorption</text>
            <rect x="172" y="138" width="148" height="70" rx="8" class="fg-acc"/>
            <text x="246" y="158" text-anchor="middle" class="t-sm t-b">Macrophage</text>
            <text x="246" y="176" text-anchor="middle" class="t-sm">ferroportin door open</text>
            <text x="246" y="196" text-anchor="middle" class="t-sm t-bad t-b">↑ iron release</text>
            <path d="M84 208l50 22M246 208l-50 22" class="fg-arrow" marker-end="url(#L12c)"/>
            <rect x="35" y="234" width="260" height="44" rx="8" class="fg-bad"/>
            <text x="165" y="252" text-anchor="middle" class="t-sm t-b">Expanded circulating iron pool</text>
            <text x="165" y="268" text-anchor="middle" class="t-sm">= ↑ transferrin saturation</text>
            <path d="M165 278v16" class="fg-arrow" marker-end="url(#L12c)"/>
            <rect x="35" y="298" width="260" height="40" rx="8" class="fg-acc"/>
            <text x="165" y="322" text-anchor="middle" class="t-sm t-b">Liver stores iron first</text>
            <path d="M165 338v16" class="fg-arrow" marker-end="url(#L12c)"/>
            <rect x="15" y="358" width="300" height="56" rx="8" class="fg-acc"/>
            <text x="165" y="378" text-anchor="middle" class="t-sm t-b">When liver storage is exhausted:</text>
            <text x="165" y="398" text-anchor="middle" class="t-sm">heart, pituitary, pancreas and elsewhere</text>
            <path d="M165 414v16" class="fg-arrow" marker-end="url(#L12c)"/>
            <rect x="35" y="434" width="260" height="44" rx="8" class="fg-bad"/>
            <text x="165" y="452" text-anchor="middle" class="t-sm t-b">Untreated liver:</text>
            <text x="165" y="468" text-anchor="middle" class="t-sm">fibrosis → cirrhosis → HCC</text>
            <text x="165" y="504" text-anchor="middle" class="t-sm t-mut">ferroportin as the exit door: accepted physiology</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 197
        text: |
          الـ **hepcidin** زي **مدير الجمارك**: بيقرر الحديد يعدّي من الأمعاء والـ macrophages للدم ولا لأ.

          في الـ hemochromatosis المدير **في إجازة مفتوحة**. البوابات مفتوحة 24 ساعة، والحديد داخل بالكونتينرات، والمخزن الأول (الكبد) يتملي، وبعدين الحديد يتشحن على القلب والـ pituitary والـ pancreas.
      - kind: order
        page: 197
        prompt: "رتّب سلسلة الـ pathogenesis:"
        steps:
          - "Pathogenic variant in a gene regulating hepcidin"
          - "Hepcidin deficiency or impaired function"
          - "More gut absorption and macrophage iron release"
          - "Raised transferrin saturation"
          - "Iron stored in the liver first"
          - "Heart, pituitary and pancreas loaded"
        why: "الكتاب: الـ liver هو **first organ to store iron**، ولما الـ **storage capacity is exhausted** الحديد بيكمل على القلب والـ pituitary والـ pancreas."
      - kind: table
        page: 197
        title: "Types of hemochromatosis"
        columns: ["Type", "Gene", "Key point"]
        rows:
          - ["Type 1 (classic)", "HFE, bi-allelic", "Common in Caucasians"]
          - ["Type 2A (juvenile)", "HJV", "Rare; severe overload before 30"]
          - ["Type 2B (juvenile)", "HAMP (encodes hepcidin)", "Rare; severe overload before 30"]
          - ["Type 3", "TFR2", "Overload with a later onset"]
          - ["Type 4 (ferroportin disease)", "Ferroportin", "Autosomal dominant, milder; transport not absorption"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 2]]
      - kind: aside
        tone: tip
        page: 197
        text: |
          ترتيب الجينات من Type 1 لـ Type 4 بالحروف الأولى:

          **Have Juicy Hamburgers, Then Fries** 🍔🍟

          - Have = **HFE** (Type 1)
          - Juicy = **HJV** (Type 2A)
          - Hamburgers = **HAMP** (Type 2B)
          - Then = **TFR2** (Type 3)
          - Fries = **Ferroportin** (Type 4)
      - kind: aside
        tone: trap
        page: 198
        text: |
          الكتاب قال في صفحة 196-197 إن المرض محتاج **two defective genes, one from each parent** (يعني recessive)، وبعدين في صفحة 198: **Type 4 (Ferroportin disease) = autosomal dominant**.

          الاتنين صح: الـ recessive للـ classic، والـ **dominant هو Type 4 بس**. لو اتسألت «which type is autosomal dominant?» → **Type 4**.
      - kind: check
        page: 197
        question: "Which gene directly **encodes hepcidin**?"
        options:
          - "HAMP"
          - "HFE"
          - "HJV"
          - "TFR2"
        answer: 0
        why:
          - "صح: **HAMP** هو جين الـ hepcidin نفسه، وده Type 2B الـ juvenile."
          - "HFE بينظّم إنتاج الـ hepcidin، وهو Type 1 الـ classic."
          - "HJV (hemojuvelin) بينظّم الـ hepcidin، وده Type 2A."
          - "TFR2 هو Type 3، اللي بيبدأ متأخر."
      - kind: try
        items: [hb.L12.017, hb.L12.018, hb.L12.021, hb.L12.022, hb.L12.023]
    recap:
      - "HH = inherited، بيمتص حديد زيادة؛ classic محتاج **جينين معيوبين**؛ **الرجالة أكتر** وبيزيد مع السن."
      - "**Hepcidin** (من الـ hepatocytes) قليل → ↑ absorption و ↑ macrophage release → **↑ transferrin saturation**."
      - "الكبد بيتملي الأول، بعدين القلب والـ pituitary والـ pancreas؛ من غير علاج: fibrosis، cirrhosis، HCC."
      - "Types: **HFE → HJV / HAMP → TFR2 → Ferroportin** (Type 4 = AD، أخف، transport)."
    practice: [hb.L12.015, hb.L12.016, hb.L12.017, hb.L12.018, hb.L12.019, hb.L12.020, hb.L12.021, hb.L12.022, hb.L12.023, hb.L12.056, hb.L12.057]
