  # ---------- p345: pathogenesis ----------
  - id: rheum.L21.001
    kind: enumerate
    topic: pathogenesis
    prompt: Which HLA types, together with environmental factors, does the lecture link to systemic sclerosis?
    points:
      - HLA-B8
      - HLA-DR3
      - HLA-DR5
      - HLA-DR52
    pass: 3
    src: { page: 345, quote: "HLAB8, HLADR3, HLADR5, HLADR52 + environmental factors leads to:" }
    status: unverified
  - id: rheum.L21.002
    kind: card
    topic: pathogenesis
    front: Which cells are stimulated in the pathogenesis of systemic sclerosis?
    back: T cells, B cells, macrophages, mast cells and fibroblasts.
    src: { page: 345, quote: "T cell + Bcell + macrophage + mast cell + fibroblasts stimulation" }
    status: unverified
  - id: rheum.L21.003
    kind: cloze
    topic: pathogenesis
    text: "In SSc, stimulated cells secrete IL-4, IL-6, {{c1::TGF-β}}, PGF and {{c2::CTGF}}, which increase collagen types {{c3::I, III, V, VII}}, proteoglycans and fibronectin."
    src: { page: 345, quote: "Inflammatory cytokine secretion (IL-4, IL-6, TGF-β, PGF & CTGF)" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L21.004
    kind: enumerate
    topic: pathogenesis
    prompt: List the four pathogenic processes of systemic sclerosis in the lecture.
    points:
      - Immune and fibroblast stimulation, cytokines, more collagen
      - Apoptosis with free radical release
      - Expression of adhesion molecules
      - VEGF and anti-endothelial cell antibodies → scarring and vascular dysfunction
    pass: 4
    src: { page: 345, quote: "2. Apoptosis with free radical release. 3. Expression of adhesion molecules. 4. VEGF & anti endothelial cells Ab = scarring & vascular dysfunction." }
    status: unverified
  - id: rheum.L21.005
    kind: order
    topic: pathogenesis
    prompt: Order the fibrosis pathway in systemic sclerosis.
    steps:
      - HLA susceptibility plus environmental factors
      - T, B, macrophage, mast cell and fibroblast stimulation
      - Cytokine secretion (IL-4, IL-6, TGF-β, PGF, CTGF)
      - More collagen, proteoglycans and fibronectin
    src: { page: 345, quote: "Inflammatory cytokine secretion (IL-4, IL-6, TGF-β, PGF & CTGF)" }
    status: unverified
  # ---------- p345-346: criteria ----------
  - id: rheum.L21.006
    kind: table
    topic: criteria
    title: 2013 ACR/EULAR classification criteria for SSc (book table, p345)
    columns: [Item, Weight]
    rows:
      - ["Skin thickening of fingers of both hands proximal to MCPs", "9"]
      - ["Whole finger distal to MCP (sclerodactyly)", "4"]
      - [Puffy fingers, "2"]
      - [Pitting scars, "3"]
      - [Digital tip ulcers, "2"]
      - [Telangiectasia, "2"]
      - [Abnormal nailfold capillaries, "2"]
      - [Lung involvement (PAH and/or ILD), "2"]
      - [Raynaud phenomenon, "3"]
      - ["SSc antibodies (ACA, anti-Scl-70, RNA polymerase III)", "3"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [8, 1], [9, 1]]
    src: { page: 345, quote: "Skin thickening of the fingers of both hands extending proximal to the MCP joints" }
    status: unverified
    tags: [high-yield, numbers]
    update:
      text: "The book's table omits the threshold: a total score of 9 or more classifies definite SSc, and skin thickening proximal to the MCPs (9 points) is sufficient on its own."
      ref: "ACR/EULAR classification criteria for systemic sclerosis, 2013"
  - id: rheum.L21.007
    kind: card
    topic: criteria
    front: In the 2013 SSc criteria, how are the skin and fingertip domains scored?
    back: Count only the highest item in each domain; skin (puffy 2, sclerodactyly 4, proximal to MCPs 9) and fingertips (ulcers 2, pitting scars 3).
    src: { page: 345, quote: "Skin thickening (count the higher of the three)" }
    status: unverified
  - id: rheum.L21.008
    kind: card
    topic: criteria
    front: Which antibodies count as SSc-related in the 2013 criteria?
    back: Anticentromere (ACA), anti-topoisomerase I (anti-Scl-70) and anti-RNA polymerase III; any one scores 3.
    src: { page: 345, quote: "Any of ACA, ATA (anti-Scl 70), RNA polimerase" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L21.009
    kind: card
    topic: criteria
    front: What are the ARA major and minor features of scleroderma?
    back: Major, centrally located skin sclerosis of the arms, face and/or neck. Minor, sclerodactyly, fingertip erosions or atrophy, and bilateral lung fibrosis.
    src: { page: 346, quote: "Minor features include sclerodactyly, erosions, atrophia of the fingertips, and bilateral lung fibrosis." }
    status: unverified
  - id: rheum.L21.010
    kind: cloze
    topic: criteria
    text: "By the ARA criteria, SSc is diagnosed with {{c1::1 major}} and {{c2::2 minor}} criteria."
    src: { page: 346, quote: "SSc is diagnosed when a patient has 1 major and 2 minor criteria." }
    status: unverified
  - id: rheum.L21.011
    kind: card
    topic: criteria
    front: Who usually gets malignant scleroderma, and what is its course?
    back: Most often men, usually elderly; an accelerated course that leads to death.
    src: { page: 346, quote: "Malignant scleroderma most often occurs in men, usually in elderly men." }
    status: unverified
  - id: rheum.L21.012
    kind: mcq
    topic: criteria
    stem: "A 45-year-old woman has Raynaud phenomenon, puffy fingers and positive anticentromere antibody (ACA), and nothing else. What is her 2013 ACR/EULAR score?"
    options: ["8", "9", "6", "5", "11"]
    answer: 0
    why:
      - "Correct: Raynaud 3 + puffy fingers 2 + SSc antibody 3 = 8 (p345), one short of the usual threshold of 9."
      - Nine would need one more point, such as telangiectasia or abnormal capillaries.
      - Each of Raynaud and antibodies scores 3, not 2.
      - Raynaud and antibodies alone already make 6.
      - Eleven would need sclerodactyly (4) instead of puffy fingers.
    src: { page: 345, quote: "Any of ACA, ATA (anti-Scl 70), RNA polimerase" }
    status: unverified
