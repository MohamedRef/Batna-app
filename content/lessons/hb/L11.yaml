  - id: hb.L11.lesson3
    title: "مين ممنوع يتزرع؟"
    hook: "8 موانع مطلقة، 8 عوامل خطر بنتناقش فيها، وساعة الـ MELD اللي بتتسرّع كل ما المريض يتعب."
    minutes: 9
    pages: [191, 192]
    topics: [contraindications, evaluation]
    goals:
      - "تعدّ الـ contraindications الـ 8 للـ LDLT"
      - "تفرّق بين contraindication و high risk factor"
      - "تقول الـ MELD بيتحدّث كل قد إيه"
      - "تعدّ الـ recipient criteria للـ living donor transplant"
    status: unverified
    steps:
      - kind: explain
        page: 191
        title: "الموانع: Exclusion criteria"
        text: |
          - **Age > 70**، والـ **physiological age** بيتقيّم case by case.
          - **Active uncontrolled systemic infection**، يعني sepsis.
          - **Advanced cardio/pulmonary disease**.
          - **HIV**، متأكد بـ **ELISA و PCR مرتين**.
          - **Active ongoing alcoholism or substance abuse** في **آخر 6 شهور**.
          - **HCC beyond acceptable criteria**.
          - **Cholangiocarcinoma**.
          - **Total / extensive occlusion of splanchnic venous inflow (SMV)**.

          الفكرة الواحدة ورا الكل: **هل الكبد الجديد هيعيش، والمريض هيستفيد؟** عدوى شغالة + immunosuppression = كارثة، قلب ضعيف مش هيستحمل العملية، ورم برّه الكبد هيرجع، وإدمان شغال هيبوّظ الكبد الجديد.
      - kind: mnemonic
        page: 191
        word: "CASH CASH"
        parts:
          - { key: "C", text: "Cardio/pulmonary disease, advanced" }
          - { key: "A", text: "Age > 70 (physiological age case by case)" }
          - { key: "S", text: "Sepsis: active uncontrolled systemic infection" }
          - { key: "H", text: "HIV, confirmed with ELISA and PCR twice" }
          - { key: "C", text: "Cholangiocarcinoma" }
          - { key: "A", text: "Alcoholism or substance abuse, active in the last 6 months" }
          - { key: "S", text: "SMV: total / extensive occlusion of splanchnic venous inflow" }
          - { key: "H", text: "HCC beyond acceptable criteria" }
        hook: |
          **CASH CASH**: ثمانية موانع، كل حرف مرتين. ومتقلقش، الكتاب ما قالش ولا كلمة عن الفلوس. 😄
      - kind: reveal
        page: 191
        prompt: "ليه الـ total SMV occlusion مانع مطلق، بس الـ portal vein thrombosis مجرد high risk؟"
        answer: |
          الكبد الجديد لازم ياخد دم **portal** داخل عليه. لو الـ **splanchnic venous inflow كله مسدود**، مفيش وريد نوصّل عليه الكبد أصلًا.

          أما الـ **PVT** لوحده فالجراح غالبًا يقدر يتعامل معاه وقت العملية، فالكتاب حاطه في **high risk factors** اللي بتتقيّم case by case. (التفسير منطق جراحي مقبول، الكتاب كاتب التقسيم بس.)
      - kind: explain
        page: 191
        title: "High risk factors: صعب، مش مستحيل"
        quote: "These factors are evaluated on a case by case basis and do not necessarily preclude transplantation."
        text: |
          - **Active variceal hemorrhage**
          - **Renal failure / HRS**
          - **Multiple previous hepatobiliary operations**
          - **Severe malnutrition / cachexia**
          - **Diabetes Mellitus**
          - **Previous organ transplant**
          - **Need for simultaneous organ transplant** (زي liver/kidney)
          - **Portal vein thrombosis**

          دول بيخلّوا العملية أصعب أو أخطر، بس **مش بيقفلوا الباب**.
      - kind: sort
        page: 191
        prompt: "مانع مطلق ولا high risk بنتناقش فيه؟"
        bins: ["Contraindication", "High risk factor"]
        cards:
          - { text: "HIV confirmed by ELISA and PCR twice", bin: 0 }
          - { text: "Cholangiocarcinoma", bin: 0 }
          - { text: "Stopped drinking 3 months ago", bin: 0 }
          - { text: "Total SMV occlusion", bin: 0 }
          - { text: "Portal vein thrombosis", bin: 1 }
          - { text: "Hepatorenal syndrome", bin: 1 }
          - { text: "Diabetes mellitus", bin: 1 }
          - { text: "Previous kidney transplant", bin: 1 }
          - { text: "Active variceal hemorrhage", bin: 1 }
        why: "الـ alcohol لازم يكون بطّل **أكتر من 6 شهور**؛ 3 شهور يبقى لسه **active in the last 6 months** = مانع. والـ variceal bleeding النشط والـ HRS والـ PVT كلهم high risk، مش موانع."
      - kind: aside
        tone: joke
        page: 191
        text: |
          الكتاب قال «Age more than 70» وبعدين على طول «physiological age is considered».

          يعني فيه حاج عنده 72 بيلعب كورة كل جمعة بعد الصلاة، وفيه واحد عنده 45 بيقعد يرتاح على بسطة الدور التاني. العمر في البطاقة حاجة، والعمر في الركب حاجة تانية. 😄
      - kind: aside
        tone: trap
        page: 191
        text: |
          الـ contraindications في **L01 (صفحة 18)** مش زي **L11** بالظبط:

          - L01 بيقول age > 70 **relative**، وبيضيف **morbid obesity** و **poor patient understanding**.
          - L11 بيقول age > 70 **exclusion** (مع physiological age case by case)، وبيضيف **HIV** و **cholangiocarcinoma** و **SMV occlusion**.

          جاوب من المحاضرة اللي السؤال جاي منها.
      - kind: figure
        page: 192
        title: "ساعة الـ MELD"
        alt: "Three rows, one per MELD band. MELD below 18: update monthly, one dot per month. MELD 18 to 25: every 2 weeks, two dots per month. MELD above 25: weekly, four dots per month."
        caption: "كل ما الـ MELD يعلى، المريض بيتغيّر أسرع، فبنحدّث رقمه أسرع: **شهري → كل أسبوعين → أسبوعي**."
        svg: |
