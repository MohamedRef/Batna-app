    src: { page: 261, quote: "Phase I: Clinical diagnosis of Rheumatoid Arthritis\n  No contraindication for methotrexate: Start methotrexate\n  + Combine with short-term glucocorticoids (reduce and stop as rapidly as possible)\n  Contraindication for methotrexate: Start leflunomide or sulfasalazine\n  Improved at 3 months and achieved target at 6 months? Yes: Continue → Dose reduction in sustained remission\nPhase II (No):\n  Poor prognostic factors present (RF/ACPA, esp. at high levels; high disease activity; early joint damage; failure of ≥ 2 csDMARDs): Add a bDMARD; Consider use of a JAK-inhibitor only after risk assessment\n  Poor prognostic factors absent: Change to or add a second conventional synthetic DMARD (Leflunomide, sulfasalazine, alone or csDMARD combination (plus glucocorticoids)), then back to Phase I assessment\n  Improved at 3 months and achieved target at 6 months? Yes: Continue → Dose reduction / interval increase in sustained remission; No: Phase III" }
