    prompt: Outline the kidney in monoclonal gammopathies (MGUS, MGRS, myeloma).
    outline:
      - "MGUS vs MGRS vs myeloma; 20-30% of myeloma present with low GFR"
      - "Cast nephropathy: FLC + Tamm-Horsfall in distal tubule; PTC injury via cubilin-megalin"
      - "Others: AL amyloid, MIDD, Fanconi, PGNMID, C3 glomerulopathy"
