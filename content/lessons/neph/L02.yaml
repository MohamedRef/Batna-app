      - kind: explain
        page: 47
        quote: "Indication RAASi in CKD"
        title: "ليه الـ RAASi أقوى كل ما الـ albuminuria تزيد؟"
        text: |
          جدول ص 47: الـ RAASi **1B recommend** في A3 (بسكر أو من غيره) وفي A2 مع السكر، و **2C suggest** في A2 من غير سكر.

          التفسير المقبول (مش في الكتاب): الـ ACEi و ARB بيوسّعوا الـ ==efferent arteriole==، فالضغط جوه الـ glomerulus ينزل، والـ albumin اللي بيعدّي يقل. يعني الفايدة على قد الـ albuminuria: اللي بيرمي albumin كتير بيكسب كتير، واللي A1 الفايدة على الكلية صغيرة (وبيتدّى لو فيه سبب تاني زي الضغط أو القلب).

          والسكر بيزوّد الـ recommendation لأن الـ hyperfiltration فيه أقوى، والدراسات على مرضى السكر أكتر.
      - kind: explain
        page: 48
        quote: "Highest approved dose tolerated to achieve the benefits Continue even when the eGFR falls below 30 ml/min per 1.73 m2."
        title: "قواعد الـ RAASi"
        text: |
          - ==ممنوع== أي combination من ACE inhibitor (ACEi) + angiotensin II receptor blocker (ARB) + DRI (1B)
          - **أعلى dose** المريض يستحمله، و**كمّل** حتى لو الـ estimated glomerular filtration rate (eGFR) نزل تحت 30
          - قلّل أو وقّف بس في: **hypotension** بأعراض، **hyperkalemia** مش متحكم فيها، أو لتقليل الـ **uremic symptoms** وهو eGFR < 15

          التفسير المقبول (مش في الكتاب): الـ combination ممنوع **لأن** الدراسات لقت hyperkalemia و AKI أكتر من غير فايدة إضافية. ونكمّل تحت 30 **عشان** الحماية بتفضل موجودة طول ما المريض مستحمل.
      - kind: explain
        page: 48
        quote: "Avoiding any combination of ACEi, ARB, and direct renin inhibitor (DRI)"
        title: "ليه ممنوع الجمع، وليه نكمّل تحت 30؟"
        text: |
          - **ممنوع ACEi + ARB + DRI** (1B). التفسير المقبول (مش في الكتاب): التلاتة بيقفلوا **نفس السكة**، فالجمع مابيزوّدش حماية للكلية، بس بيزوّد الـ ==hyperkalemia== والـ AKI والـ hypotension.
          - **أعلى dose متحمّلة**: الحماية بتزيد مع الجرعة، مش بس الضغط.
          - **كمّل تحت eGFR 30** (الكتاب): التفسير المقبول إن الكلية اللي فاضل منها قليل هي اللي محتاجة الحماية أكتر، والـ dip الأولاني مش ضرر.
          - **وقّف أو قلّل** في الـ hypotension بأعراض، أو hyperkalemia مش متحكم فيها، أو eGFR < 15 علشان الـ uremic symptoms: هنا الضرر بقى أكبر من الفايدة.
      - kind: figure
        page: 48
        title: "بعد ما تبدأ ACEi/ARB: رسمة الكتاب"
        image: { file: neph/L02-raasi-optimizing.webp, book: true }
        alt: "Book flowchart: initiate ACEi or ARB; monitor serum creatinine and potassium within 2-4 weeks after starting or changing dose. Three branches: normokalemia with under 30% increase in creatinine, increase dose or continue at maximally tolerated dose (loop back to monitoring); hyperkalemia, review concurrent drugs, moderate potassium intake, consider diuretics, sodium bicarbonate, GI cation exchangers; over 30% increase in creatinine, review for causes of AKI, correct volume depletion, reassess concomitant medications (diuretics, NSAIDs), consider renal artery stenosis. Both lower branches end at 'reduce dose or stop ACEi or ARB as last resort', which loops back to monitoring."
        caption: |
          1. **فوق**: **Initiate ACEi or ARB** ← **Monitor creatinine and potassium** خلال **2–4 أسابيع** من البداية أو تغيير الجرعة.
          2. **3 فروع**:
             - **شمال: Normokalemia و creatinine زاد <30%** ← **زوّد الجرعة** أو كمّل على أعلى جرعة، والسهم الأحمر يرجع للمتابعة.
             - **النص: Hyperkalemia** ← راجع الأدوية التانية، قلّل البوتاسيوم في الأكل، وفكّر في diuretics، sodium bicarbonate، أو GI cation exchangers.
             - **يمين: creatinine زاد >30%** ← دوّر على سبب **AKI**، صحّح الـ volume depletion، راجع الـ diuretics والـ NSAIDs، وفكّر في **renal artery stenosis**.
          3. **تحت**: الفرعين بيوصلوا لـ **Reduce dose or stop ACEi or ARB ==as last resort==**.

          الرسمة بتثبت إن ارتفاع الـ creatinine ==لحد 30%== متوقع ومش سبب توقف، وإن حتى الـ hyperkalemia بتتعالج الأول قبل ما نوقف الدوا.
