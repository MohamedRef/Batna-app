  - id: geri.L03.lesson4
    title: "اكتب صح: ابدأ قليل وامشي بالراحة"
    hook: "أحسن روشتة للحاج ساعات بتبقى اللي فيها دوا أقل، مش دوا زيادة."
    minutes: 9
    pages: [48, 51]
    topics: [principles, high-risk]
    goals:
      - "تعرف الـ principles والـ rational prescribing بالترتيب"
      - "تحفظ الـ high risk drugs"
      - "تعرف أشهر الـ drug-drug و drug-disease interactions"
    status: unverified
    steps:
      - kind: explain
        page: 48
        title: "قبل ما تكتب أي دوا"
        quote: "Ask: Is treatment warranted? Are nonpharmacologic alternatives available? Consider risk vs. benefit of drug therapy Establish goals of therapy"
        text: |
          - هل العلاج **warranted** أصلًا؟
          - في **nonpharmacologic** بديل؟
          - الـ **risk vs benefit**.
          - حدد الـ goals: ==quality of care، quality of life، functional status==.
          - شوف **الإنسان كله**، مش مرض واحد ولا دوا واحد.
          - الـ **guidelines** معمولة لمرض واحد، ومع أمراض كتير ممكن ما تنفعش.
      - kind: explain
        page: 49
        title: "Appropriate مش زي Polypharmacy"
        quote: "The potential benefit outweighs the potential risk. which is different from Polypharmacy -- the concurrent use of many medications."
        text: |
          - ==Appropriateness==: الفايدة المتوقعة أكبر من الضرر المتوقع.
          - **Polypharmacy**: أدوية كتير في نفس الوقت.

          ممكن الحاج ياخد 7 أدوية كلهم appropriate، وممكن ياخد 2 منهم واحد inappropriate.
      - kind: order
        page: 49
        quote: "Determine if a drug is needed at all Indeed, review all drugs to see if they are still needed If a drug is needed"
        prompt: "رتّب خطوات الـ rational prescribing:"
        steps:
          - "Is a drug needed at all? Review all drugs"
          - "Assess frailty and co-morbidities"
          - "Review prior and current drugs"
          - "Assess ability to comply"
          - "Pick a drug and dose"
          - "Check with explicit criteria"
          - "Ask a pharmacist if unsure"
        why: "الأول تسأل محتاج دوا ولا لأ، وبعدين تقيّم الحاج، وبعدين تختار وتراجع اختيارك."
      - kind: explain
        page: 50
        title: "التوصيات"
        quote: "Well documented pharmacotherapy - Avoid new drugs and drugs with long half-lifes Avoid polypharmacy Start low, go slow"
        text: |
          - هل الدوا **ضروري**؟ تشخيص واضح، وجرّب البدائل.
          - **Well documented**: ابعد عن الأدوية الجديدة واللي الـ half-life بتاعها طويل.
          - **Avoid polypharmacy**.
          - ==Start low, go slow==.
          - فكّر في الـ **unusual side effects**.
          - ودايمًا اسأل تلات أسئلة: ينفع أوقف دوا؟ فاهم العلاج؟ يقدر يمشي عليه؟
      - kind: aside
        tone: joke
        quote: "Can a drug be stopped? unprescribing or „pruning\" of drug regimen"
        page: 50
        text: "الكتاب بيسميها **pruning**: تقليم الشجرة. الروشتة زي شجرة الجنينة، لو ما قلّمتهاش كل زيارة هتلاقيها غابة، والحاج تايه جواها."
      - kind: explain
        page: 50
        title: "أدوية خطر على الكبار"
        quote: "High Risk Drugs for Elderly Warfarin Digoxin > 0.125/day Meperidine Ticlodipine Antihistamines (esp Diphenhydramine-Benadryl!) Chlorpropamide"
        text: |
          - **Warfarin**
          - **Digoxin** فوق ==0.125 mg/day==
          - **Meperidine**
          - **Ticlopidine**
          - **Antihistamines**، خصوصًا الـ diphenhydramine
          - **Chlorpropamide**
          - **NSAIDs**، خصوصًا الـ ==indomethacin==
          - **Propoxyphene**
