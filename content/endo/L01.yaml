  # ---------- p8-9: treatment of MEN 1 ----------
  - id: endo.L01.051
    kind: card
    topic: men1-treatment
    front: Which MEN 1 patients with hyperparathyroidism should undergo parathyroid exploration (book, p8)?
    back: Serum calcium above 12 mg/dL with calcium nephrolithiasis or renal dysfunction, neuropathic or muscular symptoms, or bone involvement.
    src: { page: 8, quote: "1- Hyperparathyroidism If serum ca is > 12mg/dl, with evidence of ca nephrolithiasis or renal dysfunction, neuropathic or muscular symptoms or bone involvement should undergo parathyroid exploration, all parathyroid tissue should be removed , (the goal is to reduce post operative PTH to < 50% of basal value) and parathyroid tissue implanted in the non-dominant forearm." }
    status: unverified
    tags: [high-yield, numbers]
