  - id: geri.L08.lesson2
    title: "الوتر الزعلان: tendinopathy"
    hook: "كتف بيوجع بالليل، وجنب الورك بيوجع لما تنام عليه: إمتى tendon وإمتى frozen shoulder؟"
    minutes: 9
    pages: [135, 139]
    topics: [tendinopathy, tendon-clinic, tendon-mx]
    goals:
      - "تفهم ليه الوتر بيبوظ (tension، compression، stress-shielding)"
      - "تفرّق rotator cuff tendinopathy عن frozen shoulder"
      - "تعرف العلاج والـ PRP"
    status: unverified
    steps:
      - kind: explain
        page: 135
        title: "يعني إيه tendinopathy؟"
        quote: "Tendinopathy is a musculoskeletal disorder characterized by tendon pain during an activity, tendon swelling and localized tenderness upon palpation, and loss of function."
        text: |
          ==Tendon pain during activity==، swelling، **localized tenderness**، و loss of function.

          تحت الميكروسكوب: **collagen degeneration**، mucoid ground substance زيادة، و tenocytes أكتر بتتحول myofibroblasts (repair cells).
      - kind: explain
        page: 135
        title: "3 أنواع ضغط بتبوّظ الوتر"
        quote: "not only excessive tensile stress, but also excessive compressive stress as well as ―stress-shielding‖"
        text: |
          1. **Excessive tensile load**: زيادة مفاجئة في الحِمل أو مدته أو تكراره ← micro-injury.
          2. **Excessive compressive stress**.
          3. ==Stress-shielding==: الوتر **مش واخد حِمل كفاية**، فالخلايا بتكسل والوتر يضعف.

          والطبقات **العميقة** بتتشد أكتر من السطحية.
      - kind: aside
        tone: analogy
        page: 135
        quote: "the lack of adequate local stress producing understimulation of the tendon cells"
        text: "الوتر زي الحبل في مركب: لو شدّيته جامد مرة واحدة يتقطع، ولو سبته مرمي سنين يعفّن. الـ **stress-shielding** هو الحبل المرمي."
      - kind: order
        page: 136
        quote: "High levels of tendon compression and the associated tissue hypoxia stimulate the fibrocartilaginous metaplasia of tenocytes"
        prompt: "إزاي بيحصل الـ calcific tendinopathy؟ رتّب:"
        steps:
          - "High compression"
          - "Tissue hypoxia"
          - "Tenocyte fibrocartilaginous metaplasia"
          - "Calcium deposits (hydroxyapatite)"
        why: "الضغط ← hypoxia ← الـ tenocytes تتحول chondrocyte-like cells ← تعمل calcium deposits أغلبها **hydroxyapatite** = calcific tendinopathy."
      - kind: explain
        page: 136
        title: "مين معرّض؟"
        quote: "The individual factors that should be considered are genes, age, sex, biomechanics, and body composition."
        text: |
          **Individual:** genes، age، sex، biomechanics، body composition، ==obesity== وأمراضها، systemic diseases.

          **Extrinsic:** الـ **weight bearing** للرجلين، و الـ **overload movements** للإيدين.
      - kind: table
        page: 136
        quote: "Frozen shoulder is an idiopathic and self-limiting condition in which movement of the shoulder becomes restricted in both active and passive external rotation."
        title: "الكتف: tendon ولا frozen؟"
        columns: [Feature, Rotator cuff, Frozen shoulder]
        rows:
          - ["Nature", "Degenerative, old age", "Idiopathic, self-limiting"]
          - ["Pain", "Night pain → deltoid", "Restricted shoulder"]
          - ["External rotation", "Active lost", "Active AND passive lost"]
        hide: [[2, 1], [2, 2]]
      - kind: check
        page: 136
        quote: "Movement testing helps to distinguish rotator cuff degenerative tendinopathy from frozen shoulder (adhesive capsulitis)."
        question: "Active external rotation is weak, but you can rotate the arm passively. Diagnosis?"
        options:
          - "Rotator cuff degenerative tendinopathy"
          - "Frozen shoulder"
          - "Gluteal tendinopathy"
          - "Calcific Achilles tendinopathy"
        answer: 0
        why:
          - "صح: الـ passive سليم = المشكلة في العضلة/الوتر نفسه (rotator cuff)."
          - "الـ frozen shoulder بيقفل الـ active والـ passive مع بعض."
          - "ده الورك."
          - "دي الرجل."
      - kind: explain
        page: 136
        title: "Gluteal tendinopathy"
        quote: "This pain presents in the lateral hip and is aggravated with activities (such as walking and other weight-bearing activities) and side-lying on the affected side."
        text: |
          ألم **low-grade** في ==lateral hip==، بيزيد بالمشي والـ weight bearing و **النوم على الجنب المصاب**.

          الصورة: ست كبيرة، overweight، عندها ألم ضهر أو ورك، hip abductors ضعيفة، مشيها متغير، و psychological distress.
      - kind: explain
        page: 137
        title: "العلاج"
        quote: "conservative treatment through exercise and load management should be the first source of treatment"
        text: |
          1. ==Exercise و load management== أول حاجة، ومعاهم **ESWT** (shockwave).
          2. **Corticosteroid** حوالين الوتر: moderate relief بس **أقل من 4 أسابيع**.
          3. **PRP**: preliminary evidence في الـ gluteal tendinopathy.
          4. **Surgery** آخر حل، بعد فشل الـ conservative **6–12 شهر**.
      - kind: explain
        page: 138
        title: "الـ PRP بيتعمل إزاي؟"
        quote: "The platelets are collected and concentrated from 2 to 8 times their normal number."
        text: |
          تسحب أنبوبة أو كام من **دمه**، تلفّها في **centrifuge**، تركّز الـ platelets ==2 لـ 8 مرات==، تخلطها في plasma، وتحقنها مكان الإصابة (أحيانًا بالـ ultrasound).

          الـ platelets بتطلّع **growth factors** تزوّد الـ reparative cells. بيتستخدم في minor rotator cuff و Achilles tears و tennis/golfer's elbow. والـ risk: **infection** بعيد.
      - kind: try
        items: [geri.L08.028, geri.L08.035, geri.L08.038, geri.L08.043, geri.L08.045]
    recap:
      - "Tendinopathy = ألم مع النشاط، swelling، tenderness، loss of function."
      - "السبب: tension زيادة، compression زيادة، أو stress-shielding."
      - "Compression + hypoxia ← metaplasia ← hydroxyapatite = calcific tendinopathy."
      - "Rotator cuff: active ER ضعيف؛ frozen shoulder: active و passive."
      - "Exercise + load management أولًا؛ steroid <4 أسابيع؛ surgery بعد 6–12 شهر."
    practice: [geri.L08.025, geri.L08.026, geri.L08.027, geri.L08.028, geri.L08.029, geri.L08.030, geri.L08.031, geri.L08.032, geri.L08.033, geri.L08.034, geri.L08.035, geri.L08.036, geri.L08.037, geri.L08.038, geri.L08.039, geri.L08.040, geri.L08.041, geri.L08.042, geri.L08.043, geri.L08.044, geri.L08.045, geri.L08.046, geri.L08.047, geri.L08.048, geri.L08.049, geri.L08.050]
  # ------------------------------------------------------------------
  - id: geri.L08.lesson3
    title: "الـ osteoarthritis: مش بس «استهلاك»"
    hook: "الـ OA طلع فيه inflammation ومناعة، مش غضروف اتآكل وخلاص."
    minutes: 8
    pages: [139, 143]
    topics: [oa, oa-mx]
    goals:
      - "تعرّف primary و secondary arthritis وأرقام الـ WHO"
      - "تشرح الـ vicious cycle (سؤال كتاب)"
      - "تعرف التشخيص والعلاج"
    status: unverified
    steps:
      - kind: explain
        page: 139
        title: "Primary ولا secondary؟"
        quote: "Primary or idiopathic arthritis is without a specific or known antecedent and primarily affects the hands, hips, knees, and spine."
        text: |
          - ==Primary (idiopathic)==: من غير سبب معروف، في **hands، hips، knees، spine**.
          - **Secondary**: وراه سبب: trauma، rheumatologic، metabolic، أو infectious.
      - kind: table
        page: 139
        quote: "the WHO states that 10% of men and 20% of women over the age of 60 have symptomatic osteoarthritis."
        title: "أرقام الـ WHO"
        columns: [Fact, Number]
        rows:
          - ["Men over 60 with symptomatic OA", "10%"]
          - ["Women over 60 with symptomatic OA", "20%"]
          - ["Expected symptomatic OA by 2050", "130 million"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: figure
        page: 140
        quote: "additional inflammatory mediators and mechanical stress create a ―vicious cycle‖ of cartilage degeneration."
        title: "الـ vicious cycle بتاع الغضروف"
        alt: "A loop of four boxes: low-grade synovial inflammation and mechanical stress, less functional collagen and fewer proteoglycans, more inflammatory mediators, cartilage degeneration, then back to inflammation. A side box shows ageing chondrocytes feeding in."
        caption: "Inflammation + mechanical stress ← collagen و proteoglycans أقل ← mediators أكتر ← تكسير أكتر. والـ ==ageing chondrocyte== بيغذّي الدايرة."
        svg: |
          <svg viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="G08b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker></defs>
            <rect x="60" y="10" width="210" height="48" rx="10" class="fg-bad"/>
            <text x="165" y="30" text-anchor="middle" class="t-sm t-b">Low-grade synovitis</text>
            <text x="165" y="48" text-anchor="middle" class="t-sm">+ mechanical stress</text>
            <rect x="170" y="100" width="155" height="56" rx="10" class="fg-box"/>
            <text x="247" y="122" text-anchor="middle" class="t-sm t-b">Less collagen,</text>
            <text x="247" y="142" text-anchor="middle" class="t-sm t-b">fewer proteoglycans</text>
            <rect x="60" y="195" width="210" height="48" rx="10" class="fg-box"/>
            <text x="165" y="224" text-anchor="middle" class="t-sm t-b">More inflammatory mediators</text>
            <rect x="5" y="100" width="150" height="56" rx="10" class="fg-acc"/>
            <text x="80" y="122" text-anchor="middle" class="t-sm t-b">Cartilage</text>
            <text x="80" y="142" text-anchor="middle" class="t-sm t-b">degeneration</text>
            <path d="M250 60 V95" class="fg-arrow-bad" marker-end="url(#G08b)"/>
            <path d="M247 158 V190" class="fg-arrow-bad" marker-end="url(#G08b)"/>
            <path d="M60 219 H30 V160" class="fg-arrow-bad" marker-end="url(#G08b)"/>
            <path d="M80 98 V62" class="fg-arrow-bad" marker-end="url(#G08b)"/>
            <rect x="20" y="258" width="290" height="56" rx="10" class="fg-thin"/>
            <text x="165" y="280" text-anchor="middle" class="t-sm t-b">Ageing chondrocyte</text>
            <text x="165" y="300" text-anchor="middle" class="t-sm">telomeres, oxidative damage, apoptosis</text>
          </svg>
      - kind: explain
        page: 139
        title: "التعريف الجديد"
        quote: "a complex multifactorial joint pathology caused by inflammatory and metabolic factors underlying joint damage."
        text: |
          الـ OA دلوقتي ==complex multifactorial joint pathology== سببها **inflammatory و metabolic factors**:
          - **Low-grade chronic synovitis**
          - مناعة **innate و adaptive**
          - **Neuroinflammation و central sensitization**: علشان كده الألم بيبقى chronic حتى لو المفصل «مش وحش أوي».
      - kind: reveal
        page: 140
        quote: "there is likely an inherent age-associated change in the chondrocyte phenotype that also impairs cartilage homeostasis."
        prompt: "ليه الكبير بالذات؟ هو الحِمل الميكانيكي بس؟"
        answer: |
          لأ. فيه **تغيّر في الـ chondrocyte نفسه مع السن**:
          - altered gene expression (senescence)
          - ==DNA و telomere dysfunction==
          - altered protein secretion، **oxidative damage**
          - decreased growth factor response، **apoptosis**
      - kind: explain
        page: 141
        title: "الصورة الإكلينيكية"
        quote: "Osteoarthritis can affect any joint but is most common in the knees, hips, spine and small joints in the hands."
        text: |
          **Pain، swelling، stiffness، صعوبة حركة**. ومع قلة الحركة العضلات تضعف.

          الأشهر: ==knees، hips، spine، small joints of hands==. chronic و progressive، وفي الشديد المفصل يبوظ والألم حتى وقت الراحة.
      - kind: sort
        page: 141
        quote: "Although there's no blood test for osteoarthritis, certain tests can help rule out other causes of joint pain, such as rheumatoid arthritis."
        prompt: "الفحص ده بيعمل إيه في الـ OA؟"
        bins: ["Shows OA", "Rules out others", "Rarely needed"]
        cards:
          - { text: "X-ray: joint space narrowing", bin: 0 }
          - { text: "X-ray: bone spurs", bin: 0 }
          - { text: "Blood tests (RA)", bin: 1 }
          - { text: "Joint fluid (gout, infection)", bin: 1 }
          - { text: "MRI", bin: 2 }
        why: "مفيش **blood test** للـ OA؛ الدم والـ joint fluid بيستبعدوا RA و gout و infection. الغضروف ما بيظهرش على X-ray، بس الـ **narrowing** والـ **spurs** بيظهروا. الـ **MRI** not commonly needed."
      - kind: explain
        page: 143
        title: "العلاج"
        quote: "Cortisone injections. Lubrication injections. Realigning bones. Joint replacement."
        text: |
          1. **Acetaminophen**: للـ mild–moderate pain؛ الجرعة الزيادة = ==liver damage==.
          2. **NSAIDs**.
          3. **Physical therapy**: تقوية العضلات حوالين المفصل والـ flexibility؛ والمشي أو العوم بنفس الفايدة. الكتاب راسم strengthening و aerobic و range of motion.
          4. **Cortisone injections**، **lubrication injections**.
          5. **Realigning bones** و **joint replacement**.
      - kind: update
        page: 143
        quote: "Taking more than the recommended dose of acetaminophen can cause liver damage."
        text: "الـ **ACR 2019**: topical NSAIDs strongly recommended للركبة، والـ oral NSAIDs أقوى دوا بالبُق؛ والـ acetaminophen conditional بس لفترات قصيرة. في الامتحان ترتيب الكتاب."
        ref: "ACR/Arthritis Foundation OA guideline 2019"
      - kind: try
        items: [geri.L08.053, geri.L08.057, geri.L08.060, geri.L08.063, geri.L08.124]
    recap:
      - "Primary OA: hands، hips، knees، spine من غير سبب؛ secondary وراه سبب."
      - "WHO: 10% رجالة و20% ستات فوق 60؛ 130 مليون في 2050."
      - "OA = inflammatory + metabolic: synovitis، مناعة، central sensitization، chondrocyte عجوز."
      - "X-ray: narrowing و spurs؛ blood و fluid يستبعدوا؛ MRI مش محتاجه غالبًا."
      - "علاج: acetaminophen، NSAIDs، PT، injections، realignment، replacement."
