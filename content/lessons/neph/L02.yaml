        text: |
          ص 27 فيها **Prevention of CKD** بصورة قواعد ذهبية لكلى سليمة (من حملة World Kidney Day): افحص وظيفة الكلى، **تحكّم في السكر** بانتظام، **كُل أكل صحي وحافظ على وزنك**، و**اشرب مية كفاية**.

          التفسير المقبول (مش في الكتاب) لليه دول بالذات: كل قاعدة بتقفل باب من أبواب الـ hyperfiltration أو الأذى المباشر:

          - السكر المظبوط ← الـ macula densa تشتغل صح والـ afferent مايتوسّعش.
          - الوزن المظبوط ← حمل فلترة أقل على نفس عدد النفرونات.
          - المية الكفاية ← مفيش dehydration يعمل pre-renal AKI، ومفيش stones.
          - الفحص ← تمسك المرض بدري وهو لسه ACR بس.
