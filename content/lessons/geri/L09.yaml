  - id: geri.L09.lesson5
    title: "المناعة الفطرية في الكبير: خلية خلية"
    hook: "خط الدفاع الأول عند الكبير بيوصل متأخر، وبيضرب أضعف، وفي نفس الوقت بيعمل دوشة التهاب. إزاي؟"
    minutes: 9
    pages: [157, 158]
    topics: [innate]
    goals:
      - "تفهم «وش يانوس»: ضعف ومعاه التهاب في نفس الوقت"
      - "تحفظ تغيّرات الـ innate immunity خلية خلية وليه كل تغيير بيفرق"
      - "تكتب إجابة سؤال الامتحان عن الـ innate immunity"
    status: unverified
    steps:
      - kind: explain
        page: 157
        quote: "Figure: IMMUNE SENESCENCE: YOUNG: ROBUST IMMUNE FUNCTION: High vaccination efficiency; High resistance to infections. Aging, Immune Dysfunction → ELDERLY: DECLINE IN IMMUNE FUNCTION: Lower vaccination efficiency; Decreased immune surveillance; Decreased resistance to infections; Increased onset of malignancies; Increased Inflammation; Autoimmune activation. The Janus Head of Immune Aging: Age-related immunodeficiency: Shrinking naive T and B cell compartments; Contraction in T and B cell receptor diversity; Decreased T cell receptor sensitivity to respond to stimuli. Age-related inflammatory syndrome: Preponderance of myeloid over lymphoid lineages; Excess production of inflammatory cytokines (e.g. IL-6, TNF); Failing self-tolerance with production of autoantibodies."
        title: "وش يانوس: ضعيف ومولّع في نفس الوقت"
        text: |
          الكتاب في الصفحة دي حاطط صورتين. الأولى **Immune Senescence**:
          - **الصغير**: robust immune function: vaccination efficiency عالية و resistance للـ infections عالية.
          - **الكبير** (بالـ aging والـ immune dysfunction): vaccination efficiency أقل، immune surveillance أقل، resistance للـ infections أقل، malignancies أكتر، ==inflammation أكتر==، و autoimmune activation.

          والتانية **The Janus Head of Immune Aging**، وشّين:
          - **Age-related immunodeficiency**: الـ naive T و B compartments بتصغر، والـ receptor diversity بتاعة الـ T والـ B بتقل، والـ T cell receptor أقل حساسية للـ stimuli.
          - **Age-related inflammatory syndrome**: الـ myeloid بتغلب الـ lymphoid، ==excess inflammatory cytokines== (زي IL-6 و TNF)، والـ self-tolerance بتفشل فيطلع autoantibodies.

          ليه «يانوس»؟ التفسير المقبول (مش في الكتاب): يانوس إله روماني ليه وشّين بيبصّوا في اتجاهين. ومناعة الكبير كده بالظبط: وش **ضعيف** قدام الميكروب والورم، ووش **زيادة عن اللزوم** ضد نفسه. يعني المشكلة مش «مناعة قليلة» وبس، دي مناعة **مش مظبوطة**.
