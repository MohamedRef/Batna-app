        word: "PALLL"
        parts:
          - { key: "P", text: "Palpable splenomegaly" }
          - { key: "A", text: "Anemia not due to a comorbid condition" }
          - { key: "L", text: "Leukocytosis >11 × 10⁹/L" }
          - { key: "L", text: "LDH above the upper normal limit" }
          - { key: "L", text: "Leukoerythroblastosis" }
        hook: "**PAL** مع تلات **L**: الـ minor criteria الخمسة. التشخيص = **3 major + واحد منهم على الأقل**، متأكد منه في **two consecutive determinations**."
