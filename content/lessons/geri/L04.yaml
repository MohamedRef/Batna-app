          - "الـ MMSE مش جزء من الـ CAM."
      - kind: aside
        tone: tip
        page: 71
        quote: "In which the first 2 and either of the latter 2 are required for diagnosis."
        text: "إزاي تكشف الـ **inattention** (feature 2) على السرير؟ (التفسير المقبول (مش في الكتاب)) اطلب منه يعدّ أيام الأسبوع بالعكس، أو يضغط على إيدك كل ما تقول حرف معيّن. اللي سرحان هيتوه في النص. ولو الـ inattention مش موجودة، وقّف: الـ CAM مش هيقول delirium مهما كان باقي الصورة."
      - kind: explain
        page: 71
        quote: "Diagnosing Delirium\n  3-Delirium rating scales\n    It has 16- items\n      13 of which assess the severity.\n      3 items are of diagnostic significance.\n    From 0 (no impairment) to 3 (severe impairment) .\n    And a severity score > 15"
        title: "الـ rating scales"
        text: |
          - ==Delirium Rating Scale==: **16 items** (13 severity + 3 diagnostic)، كل واحد 0-3. Severity أكتر من **15** أو total أكتر من **18** = delirium.

          ليه نحتاج scale بعد الـ CAM؟ لأن الـ CAM بيقول **فيه ولا مفيش**، والـ scale بيقول **قد إيه**: higher scores = higher severity. التفسير المقبول (مش في الكتاب): فتقدر تتابع المريض يوم بيوم وتعرف العلاج شغال ولا لأ.
      - kind: explain
        remind: [geri.L04.071]
        page: 72
        quote: "Memorial delirium assessment scale (MDAS)"
        title: "الـ MDAS ودوّر على السبب"
        text: |
          - ==Memorial Delirium Assessment Scale (MDAS)==: **10 items**، كل واحد **0-3**، على الـ arousal والـ level of consciousness، والـ memory والـ attention والـ orientation والـ thinking، والـ psychomotor activity. بيتقيّم من المقابلة الحالية أو من سلوك المريض في **الساعات اللي فاتت**.

          وبعد التشخيص، الـ ==work up==:
          1. **Detailed assessment** للـ predisposing factor: infection، dehydration، electrolytes، **polypharmacy**، مرض حاد، تغيير في العلاج، chronic condition اتلخبطت، مشاكل نظر، history of dementia، **constipation** و**urinary retention**.
          2. **Physical examination**: infection، volume depletion، abdominal pathology، thyroid، anaemia، **deep vein thrombosis (DVT)**، والـ neurological examination.

          ليه الساعات اللي فاتت مش اللحظة بس؟ لأن الـ delirium بيـ **fluctuate**، فممكن تشوفه في لحظة صفا وتقول سليم.

          وليه الـ exam فيها **DVT** والـ **abdominal pathology**؟ التفسير المقبول (مش في الكتاب): لأن الاتنين ممكن يبانوا عند الكبير confusion بس من غير شكوى واضحة: الـ DVT ممكن يوصل pulmonary embolism وhypoxaemia، والبطن ممكن يكون retention أو constipation أو surgical abdomen ساكت.
      - kind: reveal
        page: 72
        quote: "constipation and urinary retention"
        prompt: "إمساك واحتباس بول في قايمة أسباب الـ delirium؟ إزاي؟"
        answer: "الكتاب حاططهم في الـ **work up** صراحة. التفسير المقبول (مش في الكتاب): الاتنين **ألم وانزعاج** عند مريض مش قادر يعبّر، فيطلع هياج وتلخبط. والـ urinary retention كمان كتير بييجي من **anticholinergic** drugs، فهي علامة على دوا غلط. افحص البطن والمثانة في أي delirium، وده سبب إن الـ constipation في القايمة."
      - kind: explain
        page: 73
        quote: "Neuroimaging:\n  Perform CT scan of the head (indications are focal neurological deficits, TIA, and history of a previous stroke)\n  Magnetic resonance imaging (MRI) of the head may be helpful in the diagnosis of stroke, hemorrhage, and structural lesions."
        title: "الـ work-up"
        text: |
          - **Labs**: urinalysis وculture، chest X-ray (CXR)، electrocardiogram (ECG) وtroponin، complete blood count (CBC)، electrolytes، glucose، liver/renal، thyroid.
          - ==computed tomography (CT) head==: لو **focal deficit**، transient ischaemic attack (TIA)، أو stroke قبل كده.
          - **magnetic resonance imaging (MRI)**: stroke، hemorrhage، structural lesions.
          - ==Lumbar puncture==: لو شاكك في **central nervous system (CNS) infection** أو الـ systemic source مش لاقيه.

          ليه الـ CT مش لكل الناس؟ لأن أغلب الـ delirium سببه **systemic** (دوا، عدوى، أملاح)، والـ CT هيطلع نضيف ويأخّر العلاج. بيفيد لما فيه علامة على المخ نفسه: **focal deficit** أو TIA أو stroke قديمة. وكل test في القايمة ليه سبب في الكتاب: الـ CBC للـ infection والـ anaemia، الـ glucose للـ hypoglycaemia والـ DKA، الـ thyroid للـ hypothyroidism، والـ urine analysis للـ UTI.
      - kind: check
        page: 73
        quote: "Perform CT scan of the head (indications are focal neurological deficits, TIA,"
        question: "A delirious 81-year-old has a new right-arm weakness. Which test does the book indicate for this focal deficit?"
        options: ["CT scan of the head", "Lumbar puncture first", "Electroencephalogram", "No imaging needed"]
        answer: 0
