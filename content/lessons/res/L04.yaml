        why:
          - "مفيش حد اتسأل يفتكر حاجة، فمفيش recall bias."
          - "صح: داتا على مستوى **المحافظة** اتطبقت على **الفرد**."
          - "الـ publication bias عن النتايج اللي بتتنشر."
