  - id: neph.L12.lesson4
    title: "الأملاح في السرطان: Na و K و Mg و phosphate"
    hook: "الصوديوم الواطي ممكن يكون أول علامة لسرطان لسه محدش شافه."
    minutes: 8
    pages: [420, 422]
    topics: [electrolytes]
    goals:
      - "تعرف الـ hyponatremia في السرطان وتشخّص الـ SIAD بالـ Table 8"
      - "تقسّم أسباب الـ hypokalemia لتلات أبواب وتفهم كل واحد"
      - "تعرف ليه الـ Mg والـ phosphate بيقلوا"
    status: unverified
    steps:
      - kind: explain
        page: 420
        title: "Hyponatremia"
        quote: "Hyponatremia can be a subsequent cancer risk marker of occult neoplasms in other patients with undiagnosed cancer."
        text: |
          - موجودة في لحد **47%** من عيانين السرطان في المستشفى (أغلب الدراسات **24-44%**)، وأغلبها **mild**.
          - ممكن تبقى ==marker== لسرطان مستخبي.
          - أشهر سبب: **SIADH**، حوالي **ثلث** الحالات.

          ليه ممكن تبقى أول علامة؟ التفسير المقبول (مش في الكتاب): بعض الأورام (زي الـ small cell lung cancer) بتطلّع **ADH** من نفسها، فالصوديوم بيقع قبل ما الورم يبان. فلو لقيت SIAD من غير سبب واضح، دوّر على ورم.
      - kind: check
        page: 421
        quote: "Table 8: Diagnosis of Syndrome of Inappropriate Antidiuresis Plasma serum osmolality <275 mOsmol/kg H2O Presence of euvolemia on physical examination (as defined by the absence of signs of hypovolemia or hypervolemia) Elevated urinary sodium (>20-30 mEq/L or mmol/L) Inappropriate urinary concentration (Uosm >100 mOsmol/kg H2O) Absence of other potential causes of hyponatremia, such as diuretic use, severe hypothyroidism, adrenal insufficiency"
        question: "A man with small cell lung cancer has Na 122 mmol/L, plasma osmolality 255 mOsm/kg, urine osmolality 480 mOsm/kg and urine Na 45 mEq/L. He is euvolemic, off diuretics, with normal thyroid and adrenal tests. Diagnosis?"
        options:
          - "Syndrome of inappropriate antidiuresis (SIAD)"
          - "Hypovolemic hyponatremia from vomiting"
          - "Primary polydipsia"
          - "Adrenal insufficiency"
        answer: 0
        why:
          - "صح: osmolality أقل من 275، euvolemic، urine Na أكتر من 20-30، urine osm أكتر من 100، والباقي اتشال. ده Table 8 بالحرف."
          - "الـ hypovolemic بيبقى العيان ناشف والـ urine Na واطي."
          - "في الـ polydipsia الـ urine osmolality بتبقى واطية جدًا (أقل من 100)."
          - "اتعمل test للـ adrenal وطلع طبيعي، وده شرط في Table 8."
      - kind: table
        page: 421
        quote: "Table 8: Diagnosis of Syndrome of Inappropriate Antidiuresis\nPlasma serum osmolality <275 mOsmol/kg H2O\nPresence of euvolemia on physical examination (as defined by the absence of signs of hypovolemia or hypervolemia)\nElevated urinary sodium (>20-30 mEq/L or mmol/L)\nInappropriate urinary concentration (Uosm >100 mOsmol/kg H2O)\nAbsence of other potential causes of hyponatremia, such as diuretic use, severe hypothyroidism, adrenal insufficiency"
        title: "Table 8: تشخيص الـ SIAD"
        columns: [Criterion, Value]
        rows:
          - ["Plasma osmolality", "<275 mOsm/kg"]
