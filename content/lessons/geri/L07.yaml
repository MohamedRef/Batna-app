  - id: geri.L07.lesson8
    title: "الوقعة: مين نقيّمه، ونفحص إيه، وFRAT"
    hook: "الوقعة مش «اتكعبل». هي عرض، وغالبًا ليها كذا سبب مع بعض."
    minutes: 9
    pages: [113, 114]
    topics: [falls]
    goals:
      - "تعرف مين محتاج multifactorial falls assessment وليه"
      - "تعرف كل جزء في الفحص بيدوّر على إيه"
      - "تحسب الـ Falls Risk Assessment Tool (FRAT) وتعرف ليه الوقعة القريبة بتاخد أعلى نقط"
    status: unverified
    steps:
      - kind: explain
        page: 113
        title: "مين ياخد multifactorial falls assessment؟"
        quote: "The following patients should receive a multifactorial risk assessment for falls:\n  Two or more falls in the past 12 months.\n  Presentation for medical attention with a fall.\n  Difficulty with walking or balance."
        text: |
          - ==Two or more falls== في آخر **12 month**
          - جه للدكتور **بسبب وقعة**
          - **Difficulty with walking or balance**

          والتقييم فيه: history مفصّل للوقعة، comorbidities، **medication review**، فحص، ==lying and standing blood pressure (BP)==، **Get up and Go** و **Falls Risk Assessment Tool (FRAT)**، وتقييم مخاطر البيت (عادة الـ **occupational therapist**).

          ليه التلات مجموعات دول بالذات؟ التفسير المقبول (مش في الكتاب): وقعة واحدة ممكن تكون حادثة، لكن:
          - **وقعتين أو أكتر** في سنة معناها إن فيه سبب جوه العيان بيتكرر.
          - اللي **جه للدكتور بسبب وقعة** غالبًا اتعوّر أو اتخض، يعني الوقعة كانت جامدة أو أثّرت عليه.
          - و **difficulty with walking or balance** معناها إن الوقعة جاية حتى لو لسه ما حصلتش.

          وليه **multifactorial**؟ عشان زي ما شفنا في خصائص المرض: **multiple aetiological factors**. الوقعة الواحدة ممكن تكون دوا ضغط + نظر ضعيف + سجادة.
      - kind: explain
        page: 113
        quote: "Perform an examination focusing on:\n  i. Vision\n  ii. Heart rhythm and rate\n  iii. Muscle strength\n  iv. Other neurological impairment\n  V. Knee exam\n  Vi. Peripheral sensation\n  vii. Feet/footwear\n  viii. A baseline cognitive assessment"
        title: "كل جزء في الفحص بيدوّر على إيه؟"
        text: |
          الكتاب بيقول الفحص يركّز على: **vision**، **heart rhythm and rate**، **muscle strength**، **other neurological impairment**، **knee exam**، **peripheral sensation**، **feet/footwear**، و **baseline cognitive assessment**.

          التفسير المقبول (مش في الكتاب) للسبب ورا كل واحد:
          - **Vision**: مش شايف السلمة أو حرف السجادة.
          - **Heart rhythm and rate**: arrhythmia بتعمل syncope، فالوقعة تبقى إغماء مش تكعبل.
          - **Muscle strength** و **knee**: الرجل الضعيفة أو الركبة اللي بتوجع مش بتلحق تصلّح التوازن.
          - **Peripheral sensation**: الـ neuropathy بتخلّي الرجل مش حاسة بالأرض، فالتوازن بيعتمد على النظر بس، وبالليل بيقع.
          - **Feet/footwear**: الشبشب الواسع أو رجل بتوجع.
          - **Cognition**: الحكم على الخطر بيضعف، فبيقوم لوحده وهو مش قادر.

          وبعدها **lying and standing BP**: عشان الـ ==postural hypotension== (من الأدوية أو الجفاف) بتوقّعه أول ما يقف.
