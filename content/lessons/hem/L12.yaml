      - kind: explain
        page: 195
        quote: "Nodular sclerosis\nYoung adults, only type more common in\nwomen,\npresence of Lacunar RS variants,\nfibrosis surrounding nodules."
        title: "الـ NS والـ MC: الاتنين الكبار"
        text: |
          - ==Nodular sclerosis== أكتر من **50%**: young adults، **الوحيد الأكتر في الستات**، فيه **lacunar RS variants**، و **fibrosis** حوالين الـ nodules.
          - **Mixed cellularity** أكتر من **30%**: RS أكتر، و infiltrate غني بالـ inflammatory cells.
          - **Lymphocyte predominance** 10%: أصغر سنًا، RS نادرة، lymphocytes كتير، غالبًا **stage 1 أو 2**.

          ليه اسمه «nodular sclerosis»؟ لأن الـ **fibrosis** (sclerosis) بتقسم الغدة لـ **nodules**، والاسم بيوصف اللي بتشوفه بالظبط. والـ lacunar cell شكلها كأنها قاعدة في **فجوة** (lacuna)، دي علامة الـ NS اللي هتتسأل عليها.
