lecture: geri.L08
lessons:
  # ------------------------------------------------------------------
  - id: geri.L08.lesson1
    title: "العضلة اللي بتختفي: sarcopenia"
    hook: "الكبير اللي «رجله مش شايلاه» مش دايمًا كسلان. ممكن تكون عضلته بتختفي، وده ليه اسم وليه screening."
    minutes: 9
    pages: [131, 134]
    topics: [intro, sarcopenia]
    goals:
      - "تعرف التلاتي (sarcopenia، tendinopathy، arthritis) وليه هو خطر على الكبير"
      - "تعرّف الـ sarcopenia وتفرّق probable و confirmed و severe وتعرف ليه الترتيب ده"
      - "تحسب الـ SARC-F وتعرف إمتى تكمّل تقييم"
    status: unverified
    steps:
      - kind: explain
        page: 131
        title: "التلاتي اللي بيقعّد الكبير"
        quote: "AGENDA\n  1. Sarcopenia.\n  2. Tendinopathy.\n  3. Osteoarthritis.\n  4. Gout & Pseudogout.\n  5. Osteoporosis.\n  6. Fibromyalgia.\n  7. Polymyagia Rheumatica.\n    Musculoskeletal disorders are debilitating conditions that significantly impair the state of health, especially in elderly subjects, since they are associated with pain, mobility disorders, increased risk of falls and fractures, and impaired ability to perform activities of daily living. A pathological triad of inter-related disorders that are highly prevalent in elderly subjects consists of the following main \"components\": sarcopenia, tendinopathies, and arthritis."
        text: |
          أمراض العضم والعضل في الكبير معناها: **pain**، مشاكل حركة، **falls و fractures** أكتر، وصعوبة في الـ activities of daily living (ADL).

          والكتاب بيقول فيه ==pathological triad== مترابط: **sarcopenia**، **tendinopathies**، و **arthritis**. والمحاضرة ماشية عليهم بالترتيب، وبعدين gout و osteoporosis و fibromyalgia و polymyalgia rheumatica (PMR).

          ليه «triad»؟ لأن الكتاب بيسميهم **inter-related**. التفسير المقبول (مش في الكتاب) للحلقة: المفصل اللي بيوجع (arthritis) بيخلّي الكبير يتحرك أقل، فالعضلة تضمر (sarcopenia)، والعضلة الضعيفة بتسيب الحِمل كله على الأوتار والمفاصل، فالوتر يتعب (tendinopathy) والمفصل يوجع أكتر. يعني كل واحد بيغذّي التاني، وآخرها **falls** و **fractures** و ADL واقعة، وده بالظبط اللي الكتاب بيعدّه.
      - kind: explain
        page: 131
        title: "يعني إيه sarcopenia؟"
        quote: "Sarcopenia is the loss of skeletal muscle mass and function that occurs during the aging process (primary sarcopenia) or due to the presence of an underlying disease or medication (secondary sarcopenia). While secondary sarcopenia relies on the diagnosis and treatment for the underlying causation, primary sarcopenia has been more challenging to characterize."
        text: |
          ==Loss of skeletal muscle mass and function==.
          - **Primary:** من السن نفسه، وده الأصعب في التحديد.
          - **Secondary:** من مرض أو دوا، وعلاجها إنك تعالج السبب.

          والـ **European Working Group on Sarcopenia in Older People (EWGSOP)** وصفتها: syndrome فيه فقد progressive و generalized للكتلة والقوة، مع خطر disability و poor quality of life (QoL) و death.

          ليه الـ primary أصعب؟ الكتاب بيقول الـ secondary علاجها في **تشخيص وعلاج السبب**، يعني فيه حاجة واضحة تمسكها. الـ primary مافيهاش سبب غير السن، فالسؤال يبقى: إمتى الضعف ده «طبيعي للسن» وإمتى مرض؟ وعشان كده الـ EWGSOP حطّت تعريف فيه **مخاطر** (disability، QoL، death): يعني بنسميها مرض لما تبدأ تأذي.
      - kind: aside
        tone: exam
        page: 132
        quote: "Epidemiological studies showed that from the second to the eighth decade of life, whole body and appendicular lean mass decline by about 20% in men and 30% in women. Sarcopenia, therefore, is prevalent in older adults, especially women, and presents substantial variations depending on age and geographic area."
        text: "من العقد التاني للتامن: الـ lean mass بتقل حوالي **20% في الرجالة** و **30% في الستات**. علشان كده الـ sarcopenia أكتر في **الستات**."
      - kind: figure
        page: 132
        quote: "(1) Low muscle strength is identified as a key characteristic and a primary indicator of probable sarcopenia."
        title: "3 درجات: probable، confirmed، severe"
        alt: "Three stacked steps: low muscle strength gives probable sarcopenia; adding low muscle quantity or quality confirms it; adding low physical performance makes it severe."
        caption: "القوة الأول (==probable==)، الكمية/الجودة بتأكد (**confirmed**)، والأداء بيحدد الشدة (**severe** لو التلاتة)."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="G08a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="10" y="10" width="310" height="55" rx="10" class="fg-acc"/>
            <text x="20" y="32" class="t-sm t-b">Low muscle STRENGTH</text>
            <text x="20" y="52" class="t-sm">→ probable sarcopenia (key feature)</text>
            <path d="M165 67 V87" class="fg-arrow" marker-end="url(#G08a)"/>
            <rect x="10" y="92" width="310" height="55" rx="10" class="fg-box"/>
            <text x="20" y="114" class="t-sm t-b">+ Low muscle QUANTITY or QUALITY</text>
            <text x="20" y="134" class="t-sm">→ sarcopenia confirmed</text>
            <path d="M165 149 V169" class="fg-arrow" marker-end="url(#G08a)"/>
            <rect x="10" y="174" width="310" height="55" rx="10" class="fg-bad"/>
            <text x="20" y="196" class="t-sm t-b">+ Low physical PERFORMANCE</text>
            <text x="20" y="216" class="t-sm">→ severe sarcopenia</text>
          </svg>
      - kind: explain
        page: 132
        quote: "(1) Low muscle strength is identified as a key characteristic and a primary indicator of probable sarcopenia."
        title: "ليه القوة الأول؟"
        text: |
          الكتاب بيرتّب الـ clinical presentation كده:
          1. **Low muscle strength**: الـ **key characteristic** والـ primary indicator لـ ==probable sarcopenia==.
          2. **Low muscle quantity or quality**: هي اللي **بتأكد** التشخيص.
          3. **Low physical performance**: بتتنبأ بالـ adverse outcomes، فبتحدد **الشدة**. والتلاتة مع بعض = **severe**.

          التفسير المقبول (مش في الكتاب) للترتيب ده:
          - القوة بتقع **أسرع وأبدري** من حجم العضلة، وسهل تقيسها في العيادة (grip). يعني هي أحسن «جرس إنذار».
          - الكمية محتاجة جهاز (DXA مثلًا)، فبتيجي بعد ما الجرس يرن، عشان تأكد.
          - والأداء (المشي، القيام من الكرسي) هو اللي العيان بيعيشه، فهو اللي بيقول هيقع ولا لأ، عشان كده بيحدد الشدة.
      - kind: explain
        remind: [geri.L08.011]
        page: 132
        title: "Screening"
        quote: "Tools used for screening require high sensitivity and should be widely available, user-friendly, efficient, non-invasive and cheap. Several tools meet these requirements, specifically the SARC-F questionnaire, mid-arm muscle circumference (MAMC), calf circumference (CC), hand grip strength and gait speed. However, the combination of different tools to identify low muscle mass increases sensitivity even further."
        text: |
          الـ screening tool لازم **high sensitivity**، متاح، سهل، رخيص، و non-invasive. والأدوات:
          - ==SARC-F== questionnaire
          - **mid-arm muscle circumference (MAMC)** و **calf circumference**
          - **hand grip strength** و **gait speed**

          والأحسن تجمع: **SARC-F + calf circumference (CC) أو MAMC + grip أو gait speed** (Ishii و EWGSOP).

          ليه **high sensitivity** بالذات؟ لأن الـ screening هدفه **ما يفوّتش حد**: اللي يطلع إيجابي بيتأكد بعدين، لكن اللي يطلع سلبي غلط مش هيرجع. وليه نجمع أدوات؟ الكتاب بيقول الـ combination **increases sensitivity even further**: كل أداة بتلقط ناس الأداة التانية بتفوّتهم (واحد سؤاله تمام بس سمانة رجله رفيعة).
      - kind: mnemonic
        page: 133
        quote: "Strength: How much difficulty do you have in lifting and carrying 10 pounds?\n  None 0.\n  Some 1.\n  A lot or unable 2."
        word: "SARCF"
        parts:
          - { key: "S", text: "Strength: lifting and carrying 10 pounds" }
          - { key: "A", text: "Assistance in walking: across a room" }
          - { key: "R", text: "Rise from a chair or bed" }
          - { key: "C", text: "Climb a flight of 10 stairs" }
          - { key: "F", text: "Falls in the past year (4 or more = 2)" }
        hook: "الاسم نفسه هو الـ mnemonic. كل سؤال 0 أو 1 أو 2، والمجموع من 10، و ==≥4== يستاهل تقييم أعمق."
      - kind: explain
        page: 134
        quote: "Data suggests that a SARC-F score of .4 best predicts the need for further, more comprehensive evaluation."
        title: "الـ SARC-F: ليه 4؟"
        text: |
          الـ SARC-F خمس أسئلة، كل واحد **0 أو 1 أو 2**، والمجموع من **10**. الكتاب بيقول score ==4 أو أكتر== هو اللي **best predicts** الحاجة لتقييم أعمق.

          لاحظ إن الأسئلة كلها عن **الحياة اليومية** مش عن العضلة: الشيل، المشي في الأوضة، القيام من الكرسي، السلم، والوقعات. التفسير المقبول (مش في الكتاب): العيان مش هيعرف يقولك «عضلتي ضمرت»، لكن هيعرف يقولك «السلم بقى صعب». يعني الـ SARC-F بيترجم الضعف للغة العيان.

          والكتاب بيقول إنه **internally consistent and valid** في كذا دراسة، منها **NHANES**، يعني اتجرب على ناس كتير وطلع بيتنبأ بالـ adverse outcomes فعلًا.
      - kind: check
        page: 134
        quote: "Data suggests that a SARC-F score of .4 best predicts the need for further, more comprehensive evaluation."
        question: "SARC-F total 5. Next step?"
        options:
          - "Further comprehensive evaluation"
          - "Diagnose severe sarcopenia now"
          - "Normal: no action"
          - "Start a sarcopenia drug"
        answer: 0
        why:
          - "صح: 4 أو أكتر = محتاج evaluation أشمل (الكتاب كاتبها «.4»، يعني ≥4)."
          - "الـ SARC-F screen، مش تشخيص ولا grading."
          - "4 أو أكتر مش طبيعي."
          - "مفيش دوا approved."
      - kind: try
        items: [geri.L08.003, geri.L08.008, geri.L08.011, geri.L08.014, geri.L08.123]
    recap:
      - "التلاتي: sarcopenia، tendinopathy، arthritis، وكل واحد بيغذّي التاني لحد falls و fractures."
      - "Sarcopenia = فقد كتلة ووظيفة العضل؛ primary من السن، secondary من مرض أو دوا."
      - "القوة = probable، الكمية/الجودة = confirmed، الأداء = severity؛ التلاتة = severe."
      - "Screening sensitive: SARC-F + CC أو MAMC + grip أو gait speed. SARC-F ≥4 ← تقييم أعمق."
    practice: [geri.L08.001, geri.L08.002, geri.L08.003, geri.L08.004, geri.L08.005, geri.L08.006, geri.L08.007, geri.L08.008, geri.L08.009, geri.L08.010, geri.L08.011, geri.L08.012, geri.L08.013, geri.L08.014, geri.L08.015, geri.L08.016, geri.L08.017, geri.L08.018, geri.L08.123]
