        quote: "Induces weight loss, suppression of appetite and delayed gastric emptying"
        title: "GLP-1 analogue: liraglutide"
        text: |
          الـ ==liraglutide== بيشتغل على أكتر من جبهة في نفس الوقت (أفعاله في الكتاب):

          - **Controls serum glucose**
          - **Induces insulin secretion**
          - **Reduces glucagon secretion**
          - **Weight loss**، مع suppression of appetite و delayed gastric emptying

          وزن أقل = دهون أقل رايحة للكبد، فده اللي بيربطه بالـ metabolic dysfunction-associated steatotic liver disease (MASLD).
      - kind: figure
        page: 108
        title: "الـ GLP-1 بيعمل إيه في كل عضو"
        image: { file: hb/L06-glp1-organs.webp, book: true }
        alt: "Book diagram with GLP-1 drawn as a chain of beads in a central circle, with arrows to organs. GI tract (left, grey): GLP-1 is secreted from L cells in the ileum. Heart (top left): up arrows, cardioprotection and cardiac output. Brain (top): up arrow neuroprotection, down arrow appetite. Stomach (top right): down arrow gastric emptying. Pancreas (right): up insulin biosynthesis, up beta-cell proliferation, down beta-cell apoptosis. Liver (bottom): down glucose production, through up insulin secretion and down glucagon secretion. Muscle (bottom left, with a question mark): up insulin sensitivity."
        caption: |
          الـ GLP-1 في الدايرة في النص (السلسلة الوردي)، ومنه أسهم لكل عضو. السهم الأزرق لفوق = بيزوّد، والأحمر لتحت = بيقلّل:

          - **الشمال: GI Tract**: هو اللي بيفرز الـ GLP-1 (من الـ L cells في الـ ileum).
          - **فوق شمال: Heart**: ↑ cardioprotection و↑ cardiac output.
          - **فوق: Brain**: ↑ neuroprotection و**↓ Appetite**.
          - **فوق يمين: Stomach**: **↓ Gastric emptying**.
          - **يمين: Pancreas**: ↑ insulin، ↑ β cell proliferation، ↓ β cell apoptosis.
          - **تحت: Liver**: **↓ Glucose production**، عن طريق ↑ insulin و↓ glucagon (السهم الراجع من البنكرياس).
          - **تحت شمال: Muscle**: ↑ insulin sensitivity، وجنبها **"?"** لأن التأثير المباشر مش مؤكد.

          دي نفس النقط اللي الكتاب كاتبها في ص107: ==أقل شهية وتفريغ معدة أبطأ== = نزول وزن، و==insulin أكتر وglucagon أقل== = سكر أحسن. الاتنين بيخدموا الكبد.
      - kind: figure
        page: 108
        title: "LEAN: الـ liraglutide 48 أسبوع"
        image: { file: hb/L06-lean-liraglutide.webp, book: true }
        alt: "Book slide 'LEAN: Liraglutide for 48 Wks', a randomized, double-blind phase II trial of overweight patients with NASH (Armstrong MJ et al., Lancet 2016;387:679-690). Bar chart of percent of patients, liraglutide (blue, n=23) vs placebo (orange, n=22): resolution of NASH 39 vs 9 (P=.019); improved ballooning 61 vs 32 (P=.05); improved inflammation 48 vs 55 (P=.65); improved fibrosis 26 vs 14 (P=.46); worsened fibrosis 9 vs 36 (P=.04)."
        caption: |
          تجربة **LEAN** (Liraglutide Efficacy and Action in NASH): randomized، double-blind، phase II، على مرضى NASH عندهم وزن زيادة، 48 أسبوع. العمود **الأزرق = liraglutide (23)** و**البرتقاني = placebo (22)**، والـ P فوق كل زوج:

          1. **Resolution of NASH**: **39% مقابل 9%** (P = .019) ← فرق حقيقي.
          2. **Improved ballooning**: 61 مقابل 32 (P = .05).
          3. **Improved inflammation**: 48 مقابل 55 (P = .65) ← مفيش فرق.
          4. **Improved fibrosis**: 26 مقابل 14 (P = .46) ← مفيش فرق.
          5. **Worsened fibrosis**: **9% مقابل 36%** (P = .04) ← الـ liraglutide منع التدهور.

          الأرقام الصغيرة تحت كل عمود (9/23، 2/22...) هي العدد الفعلي. الخلاصة: الـ liraglutide ==بيحلّ الـ NASH== و==بيمنع التليف يزيد==، بس ماثبتش إنه بيرجّع التليف. ودي دراسة صغيرة.
      - kind: aside
        tone: analogy
        text: |
          الـ GLP-1 زي **بوّاب العمارة الشاطر**: بيفتح الباب للـ insulin، ويقفل في وش الـ glucagon، ويقول للمعدة «براحة، واحد واحد» (delayed gastric emptying)، ويقفل التلاجة بالليل (appetite). والنتيجة وزن أقل ودهون أقل في الكبد.
