      - HIV
      - Estrogen-containing contraceptives
      - Pregnancy
    pass: 4
    src: { page: 478, quote: "Antiplatelet drugs, immunosuppressive agents, HIV, estrogen-containing birth control, and pregnancy are the most commonly listed triggers" }
    status: unverified
