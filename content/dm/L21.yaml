      - [IIa, LDL, ↑↑, Normal, "10"]
      - [IIb, LDL and VLDL, ↑↑, ↑↑, "40"]
      - [III, IDL, ↑↑, ↑↑↑, "<1"]
      - [IV, VLDL, Normal to ↑, ↑↑, "45"]
      - [V, VLDL and chylomicrons, ↑ to ↑↑, ↑↑↑↑, "6"]
    blanks: [[0, 1], [1, 1], [1, 3], [2, 1], [3, 1], [4, 1], [5, 1]]
