    steps:
      - kind: explain
        page: 96
        quote: "Patients with diarrhea could be treated with cyproheptadine, a serotonin antagonist, while those with gastric carcinoids that elaborate histamine would be treated a histamine blocker."
        title: "العلاج الطبي: كل هرمون وعكسه"
        text: |
          - **Somatostatin analog (octreotide)**: الأساس، لأنه بيقفل إفراز كل الهرمونات مرة واحدة.
          - **Cyproheptadine** للإسهال، لأنه **serotonin antagonist**، والـ serotonin هو اللي بيعمل الإسهال (جدول ص 95).
          - **Histamine blocker** للـ gastric carcinoid اللي بيفرز **histamine**، لأن الـ foregut carcinoid بيعمل histamine (جدول ص 98)، والـ histamine بيعمل flushing.

          يعني لو عرفت الهرمون، عرفت الدوا.
      - kind: explain
        page: 96
        quote: "Carcinoid Crises: Octreotide i.v. 50-100 μg/hr (Foregut carcinoid with histamine production, continue with H 1 and H 2 receptor blockers)."
        title: "الـ octreotide بالجرعات"
        text: |
          - الجرعة: **100-600 µg/day s.c.** على 2-3 جرعات (experimental: 1,500-3,000).
          - **قبل العملية**: 100 µg s.c. قبلها بنص ساعة، وبعدين **50 µg/hr IV** أثناء وبعد.
          - ==Carcinoid crisis==: **IV 50-100 µg/hr**، ولو foregut بيفرز histamine كمّل **H1 + H2 blockers**.
          - **long-acting release (LAR)**: 20-30 mg intramuscular (IM) كل 4 أسابيع، علشان المريض ما يتحقنش 2-3 مرات كل يوم طول عمره.

          ليه الـ H1 + H2 في الـ foregut بالذات؟ لأن الـ foregut carcinoid بيفرز **histamine** (جدول ص 98)، والـ octreotide لوحده مش كفاية يقفل أثره، فبتقفل المستقبلين.
          - كمان: **cyproheptadine** (serotonin antagonist) للإسهال، و histamine blocker للـ gastric carcinoid اللي بيفرز histamine.
