  # ---------- cases ----------
  - id: rheum.L15.049
    kind: case
    topic: diagnosis
    stem: "A 63-year-old woman, BMI 34, has had right knee pain for 2 years."
    steps:
      - reveal: "Pain on walking, relieved by rest; 10 minutes of morning stiffness; no fever or weight loss."
        question: "Which feature argues against an inflammatory systemic arthritis?"
        options: ["Absence of constitutional symptoms with short self-limited stiffness", "Obesity", "Female sex", "Age over 60"]
        answer: 0
        why: "Essentials of OA diagnosis: activity pain, self-limited stiffness, no prominent constitutional symptoms."
      - reveal: "Exam: bony enlargement at the joint margins, crepitus, medial joint-line tenderness. X-ray: medial joint space narrowing and osteophytes."
        question: "Diagnosis?"
        options: ["Knee osteoarthritis", "Rheumatoid arthritis", "Gout", "Septic arthritis"]
        answer: 0
        why: "Classic knee OA findings on exam and X-ray."
      - question: "Which risk factor here is modifiable and most marked for the knee?"
        options: ["Obesity", "Female sex", "Age", "Genetics"]
        answer: 0
        why: "Obesity affects most sites but is most marked for the knee."
      - question: "Which first-line measures fit?"
        options: ["Education, moderate exercise, weight loss, physiotherapy", "Immediate knee replacement", "Systemic steroids", "Bed rest"]
        answer: 0
        why: "The book's treatment list starts with education, exercise, weight loss and physiotherapy."
    src: { page: 235, quote: "Knee osteoarthritis with medial joint space narrowing and osteophytes." }
    status: unverified
  - id: rheum.L15.050
    kind: case
    topic: ia-cell
    stem: "A 58-year-old man with knee OA asks about 'new injections and cell treatments'."
    steps:
      - question: "Why do oral drugs struggle to modify the disease in the joint?"
        options: ["Avascular cartilage and local immune/paracrine dysregulation", "They are too potent", "Cartilage is highly vascular", "The synovium blocks all drugs"]
        answer: 0
