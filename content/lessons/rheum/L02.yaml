  - id: rheum.L02.lesson2
    title: "الـ uric acid مش لوحده: القلب والسكر والكلية المزروعة"
    hook: "الـ urate العالي بيسبق الضغط والسكر. ولو المريض كلية مزروعة، فيه فخ دوائي ممكن يموّته."
    minutes: 9
    pages: [27, 31]
    topics: [associations]
    goals:
      - "تعرف علاقة الـ hyperuricaemia بالضغط والسكر"
      - "تمشي مراحل الـ gout من normouricaemia لـ tophi"
      - "تحفظ الـ urate transporters وتتجنب فخ azathioprine + XOI"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L02.021]
        page: 27
        quote: "Precedes and predicts hypertension.\nPrecedes and predicts Type 2 diabetes."
        title: "بيسبق وبيتنبأ"
        text: |
          الـ ==hyperuricaemia==:

          - بتسبق وتتنبأ بالـ **hypertension** و **type 2 diabetes**.
          - موجودة في **26%** من مرضى الضغط، و **58%** من اللي بياخدوا أدوية ضغط.
          - بتحصل في **تلت** اللي بياخدوا diuretic.
          - بتشارك في الـ **cardio-renal disease**.

          التفسير المقبول (مش في الكتاب): ليه الـ urate يسبق الضغط والسكر؟ الـ urate العالي بيأذي بطانة الأوعية (endothelial dysfunction) ويشغّل الـ RAAS في الكلى، فالضغط يعلى مع الوقت. يعني الـ hyperuricaemia مش مجرد نتيجة، ممكن تبقى جزء من السبب. وعشان كده مريض الـ gout محتاج كشف على الضغط والسكر والكلى، مش المفصل بس.
      - kind: explain
        page: 27
        quote: "Develops in 1/3 of patients treated with a diuretic."
        title: "ليه الرقم بيقفز مع أدوية الضغط؟"
        text: |
          الكتاب بيقول **26%** من مرضى الضغط عندهم hyperuricaemia، والرقم بيوصل **58%** في اللي بياخدوا أدوية ضغط، وإنها بتحصل في **تلت** اللي بياخدوا diuretic.

          ليه القفزة دي؟ عشان أشهر أدوية الضغط القديمة هي الـ ==thiazide و loop diuretics==، ودول في قايمة الأدوية اللي بتقلل إخراج الـ urate (صفحة 26).

          والعكس كمان صحيح: الكتاب بيقول إن الـ hyperuricaemia **بتسبق وتتنبأ** بالضغط والسكر. يعني مش بس نتيجة، ممكن تبقى **جزء من السبب**، وده اللي صفحة 29 و 30 بيشرحوه في الـ insulin resistance والـ diabetic nephropathy.
      - kind: order
        page: 27
        quote: "Disease progression in gout\n| Clinical manifestation | Disease progression | Risk factor or cause |\n|---|---|---|\n| No disease | Normouricaemia | |\n| Asymptomatic state | Hyperuricaemia | Genetic factors (e.g. SNPs in urate transporter genes); Environmental factors (e.g. diet and BMI); Impaired kidney function; Increasing age; Male sex; Medications; High cell turnover states, etc. |\n| Asymptomatic state | MSU crystal deposition | Reduced solubility of urate; Increased nucleation of MSU crystals; Growth of MSU crystals |\n| Symptomatic disease | Recurrent gout flares | Acute inflammatory response to deposited MSU crystals |\n| Symptomatic disease with complications | Chronic gouty arthritis and tophaceous gout | Chronic granulomatous inflammatory response to deposited crystals |"
        prompt: "رتّب مراحل الـ gout زي رسمة الكتاب:"
        steps:
          - "Normouricaemia"
          - "Hyperuricaemia"
          - "MSU crystal deposition"
          - "Recurrent gout flares"
          - "Chronic tophaceous gout"
        why: "كل خطوة ليها محرّك: genes و diet و الكلى ← hyperuricaemia؛ solubility و nucleation ← deposition؛ acute inflammation ← flares؛ chronic granulomatous inflammation ← tophi."
      - kind: figure
        page: 28
        quote: "GLUTA in the basolateral membrane and URAT1 in the apical membrane of proximal tubule cells mediate renal urate reabsorption."
