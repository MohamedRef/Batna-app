      - kind: explain
        page: 137
        title: "PBC ولا drug-induced chronic cholestasis (DICC)؟"
        text: |
          الاتنين ممكن يعملوا pruritus، hypercholesterolemia، xanthomas، و vanishing bile ducts. فإزاي تفرّق؟

          - **Gender/age**: الـ PBC middle-aged women. الـ DICC both sexes، all ages.
          - ==AMA==: positive في الـ PBC، negative في الـ DICC. ده أسرع فرق.
          - **Onset**: PBC insidious، DICC acute. والـ jaundice late في PBC و acute في DICC.
          - **Biopsy**: portal infiltrates +++ و granulomas في PBC.
          - **Prognosis**: PBC غالبًا يوصل biliary cirrhosis. الـ DICC الـ jaundice usually resolves، ونادرًا cirrhosis.

          الخلاصة: لو فيه دوا في القصة، والبداية فجأة، والـ AMA سالب، فكّر في الـ DICC.
