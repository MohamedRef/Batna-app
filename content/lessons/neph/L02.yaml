  - id: neph.L02.lesson8
    title: "الـ eGFR والـ ACR: الأرقام ممكن تكدب"
    hook: "الـ creatinine جاي من العضل، والـ ACR مقامه creatinine. اعرف إمتى الرقم بيخدعك."
    minutes: 9
    pages: [27, 30]
    topics: [egfr, albuminuria]
    goals:
      - "تعرف إمتى تضيف cystatin C"
      - "تعرف الحالات اللي بتخدع الـ creatinine وليه"
      - "تعرف حد الـ GFR بالسن وإيه اللي بيغيّر الـ ACR"
    status: unverified
    steps:
      - kind: explain
        page: 27
        quote: "eGFRcr-cys demonstrated much more linear associations with log term"
        title: "ليه نضيف الـ cystatin C؟"
        text: |
          الكتاب بيقول إن ==eGFRcr-cys== (الـ creatinine والـ cystatin C مع بعض) ليه علاقة **linear** أكتر بالـ outcomes على المدى الطويل. وفي Figure 8: لو شاكك إن الـ eGFR بالـ creatinine مش دقيق، **قيس cystatin C**. ولو محتاج دقة أكتر من كده، قيس الـ GFR مباشرة.

          التفسير المقبول (مش في الكتاب): الـ ==creatinine== بييجي من **العضلات** واللحمة. فأي حاجة بتغيّر العضل أو الأكل بتغيّر الـ creatinine من غير ما الكلية تتغير. الـ **cystatin C** بتطلّعه تقريبًا كل خلايا الجسم، فمش مربوط بالعضل قوي.

          يعني الاتنين مع بعض بيغطّوا عيوب بعض، وده اللي بيخلّي الرقم أقرب للحقيقة.
      - kind: figure
        page: 28
        quote: "Spinal cord injury"
        title: "الـ creatinine جاي منين؟"
        alt: "A flow from muscle mass and meat intake into blood creatinine, then out through glomerular filtration and a smaller arrow of tubular secretion. Labels: less muscle or a vegetarian diet means less creatinine made, so eGFR looks too high; more muscle, creatine supplements or blocked secretion mean more creatinine, so eGFR looks too low."
        caption: "الـ eGFR بيفترض إن **الداخل ثابت**، والجدول بيعدّ اللي بيكسره زي **spinal cord injury** والـ amputation. لو العضل أو الأكل أو الـ secretion اتغيّر، الـ creatinine يتغيّر والكلية زي ما هي."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="N2e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="20" width="95" height="50" rx="8" class="fg-acc"/>
            <text x="57" y="42" text-anchor="middle" class="t-sm t-b">Muscle</text>
            <text x="57" y="58" text-anchor="middle" class="t-sm">+ meat</text>
            <line x1="105" y1="45" x2="128" y2="45" class="fg-arrow" marker-end="url(#N2e)"/>
            <rect x="130" y="20" width="80" height="50" rx="8" class="fg-box"/>
            <text x="170" y="42" text-anchor="middle" class="t-sm t-b">Blood</text>
            <text x="170" y="58" text-anchor="middle" class="t-sm">creatinine</text>
            <line x1="210" y1="38" x2="233" y2="38" class="fg-arrow" marker-end="url(#N2e)"/>
            <line x1="210" y1="56" x2="233" y2="56" class="fg-thin" marker-end="url(#N2e)"/>
            <text x="238" y="42" class="t-sm">filtered</text>
            <text x="238" y="60" class="t-sm t-mut">secreted</text>
            <rect x="10" y="100" width="310" height="58" rx="8" class="fg-good"/>
            <text x="165" y="120" text-anchor="middle" class="t-sm t-b">Less muscle or vegetarian</text>
            <text x="165" y="138" text-anchor="middle" class="t-sm">less creatinine made</text>
            <text x="165" y="152" text-anchor="middle" class="t-sm t-good">eGFR looks too HIGH</text>
            <rect x="10" y="170" width="310" height="62" rx="8" class="fg-bad"/>
            <text x="165" y="190" text-anchor="middle" class="t-sm t-b">More muscle, creatine, blocked secretion</text>
            <text x="165" y="208" text-anchor="middle" class="t-sm">more creatinine in blood</text>
            <text x="165" y="224" text-anchor="middle" class="t-sm t-bad">eGFR looks too LOW</text>
          </svg>
      - kind: sort
        page: 28
        quote: "| Domain | Specific clinical condition |\n| Body habitus and changes in muscle mass | Anorexia nervosa |\n| | Extreme sport/exercise/body builder |\n| | Above knee amputation |\n| | Spinal cord injury with paraplegia/paraparesis or quadriplegia/quadriparesis |\n| | Class III obesity (BMI>40 kg/m2) |\n| Lifestyle | Smoking |\n| Diet | Low protein diet |\n| | Keto-diets |\n| | Vegetarian |\n| | High protein diets and creatine supplements |\n| Illness other than CKD | Malnutrition |\n| | Cancer |\n| | Heart failure |\n| | Cirrhosis |\n| | Catabolic consuming diseases |\n| | Muscle wasting diseases |\n| Medication effects | Steroids (anabolic, hormone) |\n| | Decreases in tubular secretion |\n| | Broad spectrum antibiotics that decrease extrarenal elimination |"
        prompt: "الـ creatinine هيتغير إزاي بعيد عن الـ GFR؟"
        bins: ["Creatinine falsely LOW (eGFR too high)", "Creatinine falsely HIGH (eGFR too low)"]
        cards:
          - { text: "Above-knee amputation", bin: 0 }
          - { text: "Anorexia nervosa", bin: 0 }
          - { text: "Cirrhosis", bin: 0 }
          - { text: "Vegetarian diet", bin: 0 }
          - { text: "Body builder", bin: 1 }
          - { text: "Creatine supplements", bin: 1 }
          - { text: "Drug that blocks tubular secretion", bin: 1 }
      - kind: explain
        page: 28
        quote: "Spinal cord injury"
        title: "ليه الحالات دي بتخدع الـ eGFR؟"
        text: |
          جدول ص 28 بيعدّ حاجات بتغيّر الـ creatinine **بعيد عن الـ GFR**. التفسير المقبول (مش في الكتاب) بنفس منطق الرسمة:

          - **عضل أقل**: anorexia nervosa، above-knee amputation، **spinal cord injury** مع paraplegia أو quadriplegia، cirrhosis، cancer، heart failure، muscle wasting. creatinine أقل، فالـ eGFR يطلع **أحسن من الحقيقة** وممكن تفوّت CKD.
          - **عضل أكتر**: extreme sport و body builders. والـ **class III obesity** بتخلّي المعادلة تغلط لأن الجسم بعيد عن المتوسط.
          - **الأكل**: low protein و vegetarian بيقلّلوا الـ creatinine؛ high protein و **creatine supplements** بيعلّوه.
          - **الأدوية**: اللي بتقلّل الـ **tubular secretion** بتعلّي الـ creatinine من غير أذى حقيقي، والـ steroids بتغيّر العضل.

          يعني لو المريض مش "متوسط"، شك في الرقم وفكّر في الـ ==cystatin C==.
      - kind: table
        page: 29
        quote: "| Age | GFR threshold for diagnosis of CKD |\n| <40 years | < 75 mL/min |\n| 40-65 years | < 60 mL/min |\n| >65 years | < 45 mL/min |"
        title: "حد الـ GFR بيتغير مع السن"
        columns: [Age, GFR threshold]
        rows:
          - ["< 40 years", "< 75"]
          - ["40–65 years", "< 60"]
          - ["> 65 years", "< 45"]
        hide: [[0, 1], [2, 1]]
      - kind: explain
        page: 29
        quote: "GFR threshold for"
        title: "ليه الحد بيقل مع السن؟"
        text: |
          جدول ص 29 بيدّي حد للـ GFR بيتغير مع السن: **< 75** تحت 40 سنة، **< 60** من 40 لـ 65، و **< 45** فوق 65.

          التفسير المقبول (مش في الكتاب): الـ GFR بينزل بالراحة مع السن حتى في الكلية السليمة. فـ GFR 55 عند واحد عنده 80 سنة ممكن يبقى شيخوخة طبيعية، وفي واحد عنده 30 سنة نفس الرقم يبقى ==مرض==. الحد اللي بيتحرك مع السن بيمنع إننا نسمّي كل كبار السن مرضى، ويمنع إننا نفوّت الشباب.

          ونفس المنطق في أمثلة الـ ==CKD-EPI 2021== في نفس الصفحة: نفس الـ creatinine 1.3 بيدّي eGFR مختلف جدًا حسب السن والنوع.
      - kind: reveal
        page: 29
        quote: "Examples of eGFR calculation\nCKD-Epi 2021 updated formula\n| | Creatinine 1.3 mg/dl | Creatinine 4.5 mg/dl |\n| Male 24 yrs old | 78.7 ml/min/1.73m2 | 17.7 ml/min/1.73m2 |\n| Male 60 yrs old | 62.9 ml/min/1.73m2 | 14.2 ml/min/1.73m2 |\n| Female 24 yrs old | 58.9 ml/min/1.73m2 | 13.3 ml/min/1.73m2 |\n| Female 60 yrs old | 47.1 ml/min/1.73m2 | 10.6 ml/min/1.73m2 |"
        prompt: "شاب عنده 24 سنة وست عندها 60 سنة، الاتنين creatinine 1.3. نفس الكلى؟"
        answer: "لأ خالص. بالـ CKD-EPI 2021: الشاب **78.7** والست **47.1** (يعني G3a). الـ creatinine لوحده بيخدع: لازم السن والنوع. وعند creatinine 4.5 الأرقام 17.7 مقابل 10.6."
      - kind: explain
        remind: [neph.L02.029]
        page: 30
        quote: "Table 17: Factors causing biological variation in urine albumin or urine protein. ACR, albumin-to-creatinine ratio; AKI, acute kidney injury; PCR, protein-to-creatinine ratio\n| | Factor | False positive | False negative |\n| Variability in urine albumin or protein | Hematuria | Increases albumin and protein in the urine | |\n| | Menstruation | Increases albumin and protein in the urine | |\n| | Exercise | Increases albumin more than other proteins in the urine | |\n| | Infection | Symptomatic urinary infection can cause production of protein from the organism. | |\n| | Non-albumin proteins | | Other proteins may be missed by albumin reagent strips |\n| Variability in urinary creatinine concentration | Biological sex | Females have lower creatinine excretion, therefore higher ACR. | Males have higher creatinine excretion, therefore lower ACR. |\n| | Weight | High creatinine excretion consistent with high weight can cause low ACR or PCR relative to timed excretion | Low creatinine excretion consistent with low weight can cause high ACR or PCR relative to timed excretion |\n| | Changes in creatinine excretion | Lower urinary creatinine concentration with AKI | Increased urinary creatinine concentration with meat intake or exercise |"
        title: "الـ ACR ممكن يكدب"
        text: |
          في البالغين بنقيس ==albuminuria== (ACR)، وفي الأطفال proteinuria.

          **Albumin عالي غلط**: hematuria، menstruation، exercise، urinary tract infection (UTI).

          **الـ creatinine في البول** هو المقام، فأي حاجة بتغيره بتغير الـ ratio:

          - **ستات** و**وزن قليل** و**AKI** ← creatinine أقل ← ==ACR أعلى==
          - **رجالة** و**وزن كبير** و**لحمة/رياضة** ← creatinine أكتر ← ACR أقل

          التفسير المقبول (مش في الكتاب): عشان كده لو ACR عالي في واحدة عندها الدورة أو بعد تمرين، **السبب** ممكن يبقى مؤقت: عيد التحليل بعد ما السبب يروح قبل ما تحكم.
      - kind: aside
        page: 30
        quote: "Table 17: Factors causing biological variation in urine albumin or urine protein. ACR, albumin-to-creatinine ratio; AKI, acute kidney injury; PCR, protein-to-creatinine ratio\n| | Factor | False positive | False negative |\n| Variability in urine albumin or protein | Hematuria | Increases albumin and protein in the urine | |\n| | Menstruation | Increases albumin and protein in the urine | |\n| | Exercise | Increases albumin more than other proteins in the urine | |\n| | Infection | Symptomatic urinary infection can cause production of protein from the organism. | |\n| | Non-albumin proteins | | Other proteins may be missed by albumin reagent strips |\n| Variability in urinary creatinine concentration | Biological sex | Females have lower creatinine excretion, therefore higher ACR. | Males have higher creatinine excretion, therefore lower ACR. |\n| | Weight | High creatinine excretion consistent with high weight can cause low ACR or PCR relative to timed excretion | Low creatinine excretion consistent with low weight can cause high ACR or PCR relative to timed excretion |\n| | Changes in creatinine excretion | Lower urinary creatinine concentration with AKI | Increased urinary creatinine concentration with meat intake or exercise |"
        tone: analogy
        text: "الـ ACR زي سعر الكيلو: لو الميزان (الـ creatinine) بيقيس أقل من الحقيقة، السعر يطلع أغلى من غير ما البضاعة تتغير. 🧮"
      - kind: check
        page: 30
        quote: "Females have lower"
        question: "A thin elderly woman (female sex: lower creatinine excretion) has ACR 40 mg/g. Why might this overestimate her albuminuria?"
        options:
          - "Low urine creatinine raises the ratio"
