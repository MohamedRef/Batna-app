  - id: dm.L02.lesson3
    title: "شجرة الـ ADA: العضو قبل السكر"
    hook: "قبل ما تسأل «السكر كام؟» اسأل «القلب والكلى عاملين إيه؟». الدوا بيتختار بالعضو."
    minutes: 10
    pages: [23, 24]
    topics: [pharm-t1, pharm-t2]
    goals:
      - "تعرف علاج الـ type 1"
      - "تمشي على فروع الـ ADA algorithm: ASCVD، HF، CKD"
      - "تفرّق كفاءة الأدوية على الوزن والسكر"
    status: unverified
    steps:
      - kind: explain
        page: 23
        title: "Type 1: insulin زي الطبيعة"
        quote: "Most individuals with type 1 diabetes should be treated with multiple daily injections of prandial and basal insulin, or continuous subcutaneous insulin infusion."
        text: |
          أغلب الـ **type 1**:
          - ==MDI==: **prandial + basal** insulin، أو **CSII** (pump).
          - **Rapid-acting analogs** علشان تقلل الـ hypoglycemia.

          الفكرة: تقلّد البنكرياس الطبيعي، basal طول اليوم و bolus مع كل أكلة.
      - kind: explain
        page: 24
        title: "Type 2: هدفين ماشيين مع بعض"
        quote: "Goal: Cardiovascular and Kidney Risk Reduction in High-Risk Individuals with Type 2 Diabetes"
        text: |
          الـ algorithm فيه عمودين:
          1. ==Cardiovascular and kidney risk reduction== في الـ high risk، **بغض النظر عن الـ A1C**.
          2. **Weight and glycemic goals**.

          يعني لو العيان عنده **ASCVD** أو **HF** أو **CKD**، الدوا بيتختار علشان العضو ده الأول.
      - kind: figure
        page: 24
        quote: "GLP-1 RA with proven CVD benefit OR SGLT2i with proven CVD benefit"
        title: "الفروع التلاتة"
        alt: "Decision tree. ASCVD or high CVD risk: GLP-1 RA or SGLT2i with proven CVD benefit. Heart failure: SGLT2i with proven HF benefit. CKD on maximal ACEi or ARB: SGLT2i with CKD evidence, start at eGFR 20 or more, or GLP-1 RA with CKD benefit."
        caption: "الـ **SGLT2i** موجود في التلات فروع، والـ **GLP-1 RA** في اتنين. الـ HF ليه ==SGLT2i== بس."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L02a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker></defs>
            <rect x="40" y="6" width="250" height="34" rx="10" class="fg-bad"/>
            <text x="165" y="28" text-anchor="middle" class="t-b">High-risk type 2</text>
            <path d="M165 40 V56" class="fg-arrow-bad" marker-end="url(#L02a)"/>
            <rect x="10" y="60" width="310" height="76" rx="10" class="fg-box"/>
            <text x="20" y="80" class="t-b">+ ASCVD / high CVD risk</text>
            <text x="20" y="100" class="t-sm">GLP-1 RA with proven CVD benefit</text>
            <text x="20" y="116" class="t-sm t-b t-acc">OR</text>
            <text x="44" y="116" class="t-sm">SGLT2i with proven CVD benefit</text>
            <text x="20" y="131" class="t-sm t-mut">above goal: add the other, or pioglitazone</text>
            <rect x="10" y="144" width="310" height="54" rx="10" class="fg-box"/>
            <text x="20" y="164" class="t-b">+ Heart failure (HFrEF / HFpEF)</text>
            <text x="20" y="184" class="t-sm">SGLT2i with proven HF benefit</text>
            <rect x="10" y="206" width="310" height="118" rx="10" class="fg-box"/>
            <text x="20" y="226" class="t-b">+ CKD on max ACEi / ARB</text>
            <text x="20" y="243" class="t-sm t-mut">eGFR &lt;60 or ACR ≥3 mg/mmol (repeat)</text>
            <text x="20" y="262" class="t-sm">SGLT2i: start eGFR ≥20, keep until dialysis</text>
            <text x="20" y="278" class="t-sm t-mut">glucose effect falls below eGFR 45</text>
            <text x="20" y="296" class="t-sm t-b t-acc">OR</text>
            <text x="44" y="296" class="t-sm">GLP-1 RA with proven CKD benefit</text>
            <text x="20" y="314" class="t-sm t-mut">above goal on SGLT2i: add GLP-1 RA</text>
          </svg>
      - kind: reveal
        page: 24
        quote: "SGLT2i can be started with eGFR ≥20 mL/min/1.73 m2 Continue until initiation of dialysis or transplantation"
        prompt: "ليه الـ SGLT2i بنكمّله في الـ CKD لحد الـ dialysis، مع إن مفعوله على السكر بيقل تحت eGFR 45؟"
        answer: |
          لأننا هنا مش عايزينه علشان السكر. بيحمي الكلية: بيقلل الـ **intraglomerular pressure** (tubuloglomerular feedback)، فيبطّأ الـ **CKD progression**.

          السكر بيتصرّف في البول بقدر ما الكلية بتفلتر، فلما الـ eGFR يقل، الجلوكوز اللي بيخرج يقل. لكن الحماية الكلوية مستمرة. (تفسير فسيولوجي؛ الأرقام **≥20** و **<45** من الكتاب.)
      - kind: check
        page: 24
        quote: "SGLT2i with proven HF benefit in this population"
        question: "Type 2 diabetes with HFpEF, A1C 7.1%. Preferred glucose-lowering class?"
        options: ["SGLT2i with proven HF benefit", "Pioglitazone", "Sulfonylurea", "DPP-4i"]
        answer: 0
        why:
          - "صح: فرع الـ **HF** فيه SGLT2i بس، والـ A1C مش مهم هنا."
          - "الـ pioglitazone بيعمل **edema**، ودي آخر حاجة عايزها في الـ HF."
          - "مفيش HF benefit."
          - "مفيش HF benefit."
      - kind: explain
        page: 24
        title: "العمود التاني: الوزن والسكر"
