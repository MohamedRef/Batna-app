          - **Bilateral basal ==Velcro-like== late-inspiratory crackles**: العلامة المميزة. ليه basal؟ لأن الـ UIP نفسه basal و subpleural. وليه late-inspiratory؟ التفسير المقبول (مش في الكتاب): الـ alveoli الناشفة بتفضل لازقة لحد آخر الشهيق، وبعدين تتفتح مرة واحدة بصوت فرقعة.
          - أحيانًا wheeze أو rhonchi؛ وفي الأول الصدر ممكن يبقى طبيعي.
          - **Clubbing**: relatively common في الـ IPF، أقل في diffuse parenchymal lung diseases (DPLDs) تانية.
          - المتقدم: resting tachycardia و tachypnea.
          - مع الـ pulmonary hypertension و cor pulmonale: **loud P2**، tricuspid insufficiency، right ventricle (RV) heave، edema.
