  - id: hem.L06.lesson3
    title: "العيان سخن وهو بياخد دم"
    hook: "حرارة، هرش، ضيق نفس، أو ألم في الضهر: كل عرض بيقولك أنهي reaction، وكل reaction ليها خطوة أولى."
    minutes: 9
    pages: [94, 96]
    topics: [acute-reactions]
    goals:
      - "تقسّم الـ reactions: acute/delayed × immune/non-immune"
      - "تفرّق FNHTR و allergic و anaphylaxis و AHTR"
      - "تعرف management الـ AHTR خطوة بخطوة"
    status: unverified
    steps:
      - kind: table
        page: 94
        quote: "Immunologic -FNHTR DHTR -Allergic PTP -AHTR"
        title: "خريطة الـ reactions"
        columns: [Type, Acute, Delayed]
        rows:
          - ["Immune", "FNHTR, allergic, AHTR", "DHTR, PTP"]
          - ["Non-immune", "Bacteria, low Ca, TACO", "Infections, hemosiderosis"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2]]
      - kind: explain
        page: 94
        title: "FNHTR: الأشهر"
        quote: "Defined by > 1°C increase in temperature. It is a diagnosis of exclusion (AHTR, TRALI and sepsis)."
        text: |
          ==Most common== transfusion reaction.
          - التعريف: الحرارة تعلى **أكتر من 1°C**، وهو **diagnosis of exclusion** (استبعد **AHTR** و **TRALI** و **sepsis**).
          - الصورة: fever، chills، rigors، tachycardia، tachypnea، nausea، headache.
          - السبب: **cytokines** اتجمعت في الكيس وقت التخزين.
          - العلاج: **بطّأ** النقل و **paracetamol**.
          - الوقاية: **leukodepletion**، شيل الـ plasma، و antipyretic premedication.
      - kind: reveal
        page: 94
        quote: "Mechanism: Cytokines in blood component bag accumulated during storage passively transferred from the donor to the recipient"
        prompt: "ليه الـ leukoreduction بيمنع الـ FNHTR؟"
        answer: |
          الـ **cytokines** اللي بتعمل الحرارة بتفرزها ==WBCs المتبرع== وهي قاعدة في الكيس في التخزين.

          لو شلنا الـ WBCs بالـ filter بدري (قبل التخزين)، مفيش مصنع cytokines، فمفيش حرارة.
      - kind: explain
        page: 95
        title: "Allergic مقابل anaphylactic"
        quote: "Mechanism: presence of anti-IgA in an IgA deficient patient. These Abs react with IgA in the transfused plasma."
        text: |
          **Mild allergic/urticarial**: شائع، erythema و pruritus و urticaria جنب الـ IV site. **IgE** ضد plasma proteins المتبرع ← histamine. العلاج **antihistamines**. مش بيتطوّر لـ anaphylaxis ومش لازم يتكرر.

          **Anaphylactic**: لا متوقع ولا ممكن منعه. flushing، vomiting، diarrhea، **hypertension ثم hypotension**، edema، wheeze، stridor، laryngeal edema، shock. ==Fever is not a feature==.
          السبب: **anti-IgA** في عيان **IgA deficient**. العلاج: **stop**، **adrenaline**، steroids، circulatory support.
      - kind: aside
        tone: exam
        page: 95
        quote: "laryngeal edema respiratory distress and shock. Fever is not a feature."
        text: |
          عيان وقع shock وهو بياخد دم ومفيش حرارة؟ فكّر ==anaphylaxis== (anti-IgA). عيان وقع shock **ومعاه** حرارة وألم ضهر؟ فكّر **AHTR**. الحرارة هي اللي بتفرق.
      - kind: explain
        page: 95
        title: "AHTR: الكيس الغلط"
        quote: "destruction of transfused RBCs by pre-formed, naturally occurring isohemagglutinins of the IgM class in the recipient‘s plasma (anti-A &/or anti-B)"
        text: |
          ==AHTR = ABO incompatibility = mismatched transfusion==.
          - الـ **IgM anti-A/anti-B** الجاهزين في العيان بيكسّروا الكرات المتنقلة.
          - الصورة: fever، chills، **flank/back pain**، dyspnea، chest pain، anxiety، flushing، throbbing head، nausea، وفي الشديد **hypotension** و **renal failure** و shock و death.
      - kind: order
        page: 96
        quote: "Stop transfusion. - Support of BP and renal blood flow with fluids and pressors and induction of diuresis to maintain urine output > 100 ml/hour."
        prompt: "رتّب أول خطوات الـ AHTR:"
        steps:
          - "Stop the transfusion"
          - "Fluids and pressors; diuresis to keep urine >100 ml/h"
          - "Check the patient's identity and the units"
          - "Send repeat type, cross-match, DAT, Hct, LDH, bilirubin"
        why: "الأول وقّف المصدر، وبعدين احمي الكلية والضغط، وبعدين اعرف حصل إزاي (غالبًا خطأ هوية)، وآخر حاجة التحاليل."
      - kind: explain
        page: 96
        title: "التشخيص"
        quote: "Diagnosis is confirmed by a positive direct antiglobulin test for anti-IgG and/or anti-C3 and positive elution test"
        text: |
          لازم **اتنين على الأقل** من علامات الـ hemolysis: fibrinogen ↓، haptoglobin ↓، bilirubin ↑، LDH ↑، hemoglobinemia، hemoglobinuria، plasma discoloration، spherocytes.

          التأكيد: ==positive DAT== (anti-IgG و/أو anti-C3) و **positive elution** بالـ alloantibody على الكرات المتنقلة.
          لو الـ serology **negative** ولقيت سبب physical (thermal، osmotic، mechanical، chemical) ← **non-immune** hemolysis.
      - kind: figure
        page: 94
        quote: "Febrile Non-hemolytic Transfusion Reaction Most common blood transfusion reaction"
        title: "الـ timeline"
        alt: "A timeline from minutes to weeks. During transfusion: FNHTR, allergic, anaphylaxis, AHTR, sepsis, TACO, hypocalcemia. After 5 to 10 days: post-transfusion purpura. After 1 to 3 weeks: DHTR. After more than 20 units: hemosiderosis. Infections appear later."
        caption: "اللي بيحصل ==وانت لسه معلّق الكيس== acute، وبعد أيام لأسابيع delayed: **PTP** بعد 5–10 أيام و **DHTR** بعد 1–3 أسابيع."
