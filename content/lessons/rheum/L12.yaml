  - id: rheum.L12.lesson2
    title: "Oligo و Poly: ركبة بنت صغيرة ولا إيد بنت كبيرة؟"
    hook: "الـ oligo ركبة وارمة مش بتوجع وعين ساكتة. الـ poly إيد بتتشوه بسرعة. الفرق بينهم بيقرر العلاج والمتابعة."
    minutes: 8
    pages: [199, 201]
    topics: [oligo, poly]
    goals:
      - "تعرف صورة الـ oligo وخطر العين"
      - "تعرف إمتى الـ oligo يبقى extended"
      - "تعرف صورة الـ polyarticular وتشوهاته"
    status: unverified
    steps:
      - kind: explain
        page: 199
        quote: "More in girls than boys 4:1. - 1-3 years old age."
        title: "الـ Oligoarticular"
        text: |
          - **بنات أكتر من ولاد 4:1**، سن **1–3 سنين**.
          - **Large joints** ما عدا ==hips and shoulders==.
          - الـ active synovitis: **3 شهور** في EULAR، و **6 أسابيع** في ACR.
          - لو وصل **4–5 مفاصل بعد أول 6 شهور** = **extended oligoarticular**.
          - البنات الصغيرين اللي فيهم small joints بدري: خطر يقلبوا poly، و prognosis وحش.
      - kind: figure
        page: 200
        quote: "Ankles, knees, elbows, and 1 to2 small hand joints may be affected (sparing hips and shoulders)."
        title: "خريطة الـ oligo"
        alt: "A simple stick figure of a child. Elbows, small hand joints, knees and ankles are marked as affected. Both shoulders and both hips carry a red cross as spared. One eye is marked in red for uveitis."
        caption: "الركب والكعوب والكوع، وواحد أو اتنين من الـ small hand joints. الحوض والكتف سليمين، والعين هي الخطر الحقيقي."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <circle cx="165" cy="32" r="20" class="fg-box"/>
            <circle cx="158" cy="29" r="4" class="fg-dot-bad"/>
            <text x="195" y="30" class="t-sm t-bad">eye: uveitis</text>
            <path d="M165 52V165M115 70H215M135 165H195" class="fg-ink"/>
            <path d="M115 70L100 125L95 175M215 70L230 125L235 175" class="fg-ink"/>
            <path d="M135 165L130 230L128 285M195 165L200 230L202 285" class="fg-ink"/>
            <path d="M107 62l16 16M123 62l-16 16M207 62l16 16M223 62l-16 16" class="fg-arrow-bad"/>
            <path d="M127 157l16 16M143 157l-16 16M187 157l16 16M203 157l-16 16" class="fg-arrow-bad"/>
            <circle cx="100" cy="125" r="7" class="fg-dot-acc"/>
            <circle cx="230" cy="125" r="7" class="fg-dot-acc"/>
            <circle cx="95" cy="182" r="5" class="fg-dot-acc"/>
            <circle cx="235" cy="182" r="5" class="fg-dot-acc"/>
            <circle cx="130" cy="230" r="8" class="fg-dot-acc"/>
            <circle cx="200" cy="230" r="8" class="fg-dot-acc"/>
            <circle cx="128" cy="285" r="6" class="fg-dot-acc"/>
            <circle cx="202" cy="285" r="6" class="fg-dot-acc"/>
            <text x="232" y="74" class="t-sm t-bad">shoulder spared</text>
            <text x="244" y="129" class="t-sm t-acc">elbow</text>
            <text x="246" y="186" class="t-sm t-acc">hand joints</text>
            <text x="212" y="162" class="t-sm t-bad">hip spared</text>
            <text x="214" y="234" class="t-sm t-acc">knee</text>
            <text x="214" y="289" class="t-sm t-acc">ankle</text>
          </svg>
      - kind: explain
        page: 200
        quote: "Joint swelling rather than pain, two thirds of patients present with single joint disease"
        title: "الصورة الإكلينيكية"
        text: |
          - **Swelling أكتر من الألم**، وتلتين المرضى بيبدأوا بمفصل واحد، وممكن juxta-articular muscle atrophy.
          - وجود ==constitutional manifestations== **يلغي** تشخيص الـ oligoarthritis.
          - أحيانًا TMJ و cervical spine.
          - **العين**: iridocyclitis، band keratopathy، glaucoma، cataract، وممكن blindness.
          - لو فضل pauciarticular **5 سنين**، احتمال يقلب poly أقل.
      - kind: aside
        tone: trap
        page: 199
        quote: "Chronic anterior uveitis Presence of ANA with a greater risk of complicating eye disease (iridocyclitis)."
        text: "الطفل مش بيشتكي من عينه. الـ chronic anterior uveitis ساكت، و الـ ANA الإيجابي بيرفع الخطر. عشان كده بنعمل slit lamp دوري حتى لو العين شكلها سليم."
      - kind: check
        page: 200
        quote: "Constitutional manifestations if present excludes the diagnosis of oligoarthritis."
        question: "A child with 2 swollen joints also has daily fever and weight loss. Oligoarticular JIA?"
        options: ["No: constitutional features exclude it", "Yes: ≤ 4 joints", "Yes, if ANA positive", "Only if hips are spared"]
        answer: 0
        why:
          - "صح: الـ constitutional manifestations بتلغي الـ oligo؛ فكّر في systemic."
          - "العدد لوحده مش كفاية."
          - "الـ ANA مش بيعمل التشخيص."
          - "المفاصل مش هي المشكلة هنا، المشكلة الحمى."
      - kind: explain
        page: 200
        quote: "Leg length discrepancy with flexion contracture of the affected knee."
        title: "مضاعفات الـ oligo"
        text: |
          - **Leg length discrepancy** مع flexion contracture في الركبة المصابة (الالتهاب بيزود الدم لـ growth plate فالرجل بتطول).
          - **ألم وتورم حاد** في الرجل من ==ruptured synovial cyst==.
      - kind: explain
        page: 200
        quote: "Rapidly progressive joint disease domenates the clinical picture."
        title: "الـ Polyarticular"
        text: |
          - **RF+ve**: بنات مراهقات، زي adult RA. الـ RF لازم يطلع موجب **مرتين بينهم 3 شهور**.
          - **RF-ve**: **5 مفاصل على الأقل** في أول 6 شهور.
          - Low-grade fever و rash عابر 1–2 يوم في الأول، بس **مفيش** LN ولا organomegaly ولا visceral involvement.
          - ==Rapidly progressive joint disease== هي اللي مسيطرة.
          - **Boutonniere و swan neck** في الإيد (carpal fusion و tendinopathy).
      - kind: explain
        page: 201
        quote: "Shoulders are commonly involved and flexion contracture occur in elbow involvement."
        title: "باقي مفاصل الـ poly"
        text: |
          - **Shoulders** شائعة (عكس الـ oligo)، و flexion contracture في الكوع.
          - Tarsal fusion، tenosynovitis، bursitis، flexion deformities في الركبة والحوض.
          - ==Aseptic necrosis of the hip== ممكن تحصل.
          - Cervical spine و TMJ شائعين، زي الـ RA.
      - kind: sort
        page: 201
        quote: "Cervical spine involvement and tempromandibular joint affection are common and resembles that of rheumatoid arthritis."
        prompt: "الملامح دي أقرب لأنهي نوع؟"
        bins: ["Oligoarticular", "Polyarticular"]
        cards:
          - { text: "Hips and shoulders spared", bin: 0 }
          - { text: "Swelling more than pain, single joint", bin: 0 }
          - { text: "ANA and silent iridocyclitis", bin: 0 }
          - { text: "Swan neck and boutonniere", bin: 1 }
          - { text: "Shoulders commonly involved", bin: 1 }
          - { text: "Aseptic necrosis of the hip", bin: 1 }
          - { text: "Adolescent girl, RF positive twice", bin: 1 }
        why: "الـ oligo بيسيب الحوض والكتف وخطره العين؛ الـ poly بيمسك الكتف والحوض ويشوّه الإيد زي الـ RA."
      - kind: try
        items: [rheum.L12.019, rheum.L12.022, rheum.L12.024, rheum.L12.027, rheum.L12.033]
    recap:
      - "Oligo: بنات 4:1، 1–3 سنين، large joints ما عدا hip و shoulder."
      - "Constitutional symptoms تلغي تشخيص الـ oligo."
      - "ANA + oligo = خطر iridocyclitis الساكت."
      - "Extended oligo = 4–5 مفاصل بعد أول 6 شهور."
      - "Poly: progressive، swan neck/boutonniere، shoulder و hip، RF+ve مرتين بينهم 3 شهور."
    practice: [rheum.L12.018, rheum.L12.019, rheum.L12.020, rheum.L12.021, rheum.L12.022, rheum.L12.023, rheum.L12.024, rheum.L12.025, rheum.L12.026, rheum.L12.027, rheum.L12.028, rheum.L12.029, rheum.L12.030, rheum.L12.031, rheum.L12.032, rheum.L12.033, rheum.L12.093, rheum.L12.094, rheum.L12.095, rheum.L12.112]
  # ------------------------------------------------------------------
  - id: rheum.L12.lesson3
    title: "Systemic و Psoriatic و ERA: تلات وشوش تانية"
    hook: "حمى كل يوم الساعة 6 وطفح يختفي قبل ما توريه للدكتور: ده الـ systemic JIA بيلعب استغماية."
    minutes: 9
    pages: [201, 203]
    topics: [systemic, psoriatic, era]
    goals:
      - "تعرف ILAR criteria للـ systemic JIA وشكل الحمى والطفح"
      - "تعرف الـ hallmark وسبب الوفاة"
      - "تعرف معايير الـ psoriatic JIA وصورة الـ ERA"
    status: unverified
    steps:
      - kind: explain
        page: 201
        quote: "Equal sex Age of onset 2-3 years. Viral etiology HLA studies demonstrates genetic heterogenity."
        title: "الـ Systemic onset JIA"
        text: |
          - **Equal sex**، سن **2–3 سنين**، و viral etiology متوقعة.
          - Ankles، elbows، wrists؛ الـ ==hip== غالبًا bilateral ولو موجود يبقى معاه polyarticular disease.
          - الإيد أكتر من الرجل، و tenosynovitis في الـ carpus و tarsus.
      - kind: figure
        page: 202
        quote: "Fever =2 weeks, quotidien in pattern"
        title: "الحمى الـ quotidian"
        alt: "A temperature chart over three days. Each day the line spikes once above 39 degrees then falls back to 37 or below. A pink rash icon appears at each spike."
        caption: "كل يوم الحرارة بتطلع 39 درجة أو أكتر مرة على الأقل، وبعدين ترجع 37 درجة أو أقل. والطفح بيظهر مع الحمى ويختفي."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 20V170H320" class="fg-ink"/>
            <path d="M30 60H320" class="fg-thin"/>
            <path d="M30 130H320" class="fg-thin"/>
            <text x="2" y="64" class="t-sm">39°</text>
            <text x="2" y="134" class="t-sm">37°</text>
            <path d="M30 135L70 135L95 45L120 135L160 135L185 40L210 135L250 135L275 50L300 135L320 135" class="fg-arrow-bad"/>
            <circle cx="95" cy="30" r="6" class="fg-dot-acc"/>
            <circle cx="185" cy="25" r="6" class="fg-dot-acc"/>
            <circle cx="275" cy="35" r="6" class="fg-dot-acc"/>
            <text x="60" y="190" class="t-sm">day 1</text>
            <text x="155" y="190" class="t-sm">day 2</text>
            <text x="245" y="190" class="t-sm">day 3</text>
            <text x="200" y="15" class="t-sm t-acc">rash with spikes</text>
          </svg>
      - kind: table
        page: 202
        quote: "Fever =2 weeks, quotidien in pattern"
        title: "ILAR criteria للـ systemic JIA"
        columns: ["Criterion", "Detail"]
        rows:
          - ["1. Fever", "≥ 2 weeks, quotidian, ≥ 39 °C daily, ≥ 3 days documented"]
          - ["2. Arthritis", "≥ 1 joint for ≥ 6 weeks"]
          - ["3. One of", "Evanescent rash, generalized LN, hepato/splenomegaly, serositis"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 201
        quote: "The rash is pale pink, blanching, and is characterized by small macules or maculopapules, transient, non pruritic and mostly on the trunk."
        title: "الطفح والـ serositis"
        text: |
          - الـ **rash**: pale pink، blanching، macules صغيرة، transient، **non-pruritic**، أغلبه على الـ trunk (evanescent).
          - ACR: **2 weeks fever** + الـ rash المميز. EULAR: لازم feature تالتة غير الحمى والـ arthritis.
          - ==Serositis== هي الـ **hallmark**: pericarditis، pleuritis، وممكن **tamponade**.
          - الـ **uveitis نادر** هنا (عكس الـ oligo).
          - Severe vasculitis مع consumption coagulopathy (بترد على steroids)، و CNS: irritability و lethargy.
      - kind: aside
        tone: exam
        page: 202
        quote: "Amyloidosis with secondary renal failure (The most common cause of death in systemic onset) followed by infection."
        text: "سؤال كلاسيكي: أشهر سبب وفاة في الـ systemic onset JIA؟ **Amyloidosis with secondary renal failure**، وبعده infection."
      - kind: check
        page: 201
        quote: "Pericarditis, pleuritis, but uveitis is rare. Involvement of serosal surface is the hallmark of systemic arthritis"
        question: "Which is the hallmark of systemic onset JIA?"
        options: ["Serosal involvement", "Chronic anterior uveitis", "Positive RF", "Enthesitis", "Nail pitting"]
        answer: 0
        why:
          - "صح: pericarditis و pleuritis، وممكن tamponade."
          - "الـ uveitis نادر في الـ systemic."
          - "أغلبهم seronegative."
          - "دي بتاعة الـ ERA."
          - "دي بتاعة الـ psoriatic."
      - kind: explain
        page: 202
        quote: "the presence of arthritis and the typical psoriatic rash, or any two of the following if the rash is absent"
        title: "Juvenile psoriatic arthritis"
        text: |
          **Asymmetric arthritis** في large و small joints، بيبدأ في **mid childhood**.

          التشخيص: arthritis + psoriatic rash، **أو** لو مفيش rash، **أي اتنين** من:

          - Psoriasis في first-degree relative.
          - ==Dactylitis==: تورم الصباع كله لبعد حدود المفصل (sausage finger).
          - **Nail pitting**.

          وممكن uveitis، و ANA+ و HLA-B27+ خصوصًا مع axial disease.
      - kind: explain
        page: 203
        quote: "Children affected by enthesitis-related arthritis generally are boys >8 years of age of arthritis is characterized by the presence of enthesitis."
        title: "Enthesitis-related arthritis (ERA)"
        text: |
