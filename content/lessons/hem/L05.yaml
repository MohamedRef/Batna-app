        text: |
          الـ ==prothrombin complex== = **II و VII و IX و X**، بيتعملوا في الـ **liver**.

          الـ vitamin K (fat soluble) لازم للـ **carboxylase** اللي بيضيف **-COOH** للبروتينات دي في آخر خطوة، ومن غيرها مش بتشتغل كويس.

          يعني من غير vitamin K الكبد بيعمل الـ factors، بس بتطلع ==ناقصة الـ COOH== فمش بتشتغل. التفسير المقبول (مش في الكتاب) لأهمية الـ COOH: هي اللي بتمسك الـ **calcium** فالـ factor يلزق على الـ phospholipid اللي اتكلمنا عنه في رسمة ص 71.
