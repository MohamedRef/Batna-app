  # ---------- p390-392: immunosuppression ----------
  - id: neph.L11.187
    kind: card
    topic: tx-drugs
    front: Which immunosuppressants are withdrawn before a transplant recipient tries to conceive, and for how long is contraception continued?
    back: MMF/MPA and sirolimus; continue contraception for at least 3 months after withdrawal.
    src: { page: 390, quote: "MMF/MPA and sirolimus should be withdrawn before attempting conception and replaced with other immunosuppressant regimens" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.188
    kind: card
    topic: tx-drugs
    front: What are the fetal effects of mycophenolate?
    back: Early pregnancy loss and congenital malformation in 27%, mostly craniofacial (cleft lip and palate, microtia or anotia with ear canal atresia, hypertelorism, coloboma, micrognathia) and cardiac (conotruncal, aortic arch).
    src: { page: 390, quote: "with early pregnancy loss and a 27% incidence of congenital fetal malformation" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.189
    kind: cloze
    topic: tx-drugs
    text: "MMF is replaced by {{c1::azathioprine}} at a dose of {{c2::2 mg/kg or less}}."
    src: { page: 391, quote: "MMF should be replaced with azathioprine, in a dosage of 2 mg/kg or less" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.190
    kind: card
    topic: tx-drugs
    front: What do guidelines advise about mTOR inhibitors in pregnancy?
    back: Avoid sirolimus and everolimus (FDA category C, fetal deaths in animals, no safety data); switch to a CNI and prednisolone.
    src: { page: 391, quote: "advise against using sirolimus and everolimus in pregnant transplant recipients" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.191
    kind: card
    topic: tx-drugs
    front: What is the caution with cyclosporine in pregnancy?
    back: Not teratogenic, but linked to growth retardation and prematurity (probably vasoconstriction); CNI metabolism may rise, so monitor and adjust the dose.
    src: { page: 391, quote: "There have been reports of intrauterine growth retardation and prematurity in some cases with cyclosporine use" }
    status: unverified
  - id: neph.L11.192
    kind: card
    topic: tx-drugs
    front: Why is prednisolone safe in pregnancy?
    back: Although it crosses the placenta, it does not suppress fetal corticotropin and no consistent anomalies are reported.
    src: { page: 391, quote: "prednisolone does not suppress fetal corticotropin" }
    status: unverified
