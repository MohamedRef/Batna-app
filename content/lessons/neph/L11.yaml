      - kind: reveal
        page: 388
        quote: "Evidence indicates that the combined hormonal patch and the combined vaginal ring provide safety and pharmacokinetic profiles comparable to combined oral contraceptives, with similar hormone formulations. However, a potentially favorable aspect is the fact that transdermal and vaginal preparations do not undergo first-pass liver metabolism; therefore, they have a lower risk of potentially dangerous pharmacologic interferences involving the cytochrome P 450 3A4. This is particularly important in the case of CNIs, metabolized by the same pathway. (103) Combined oral contraceptive and progestin-only contraceptives have an inhibitory effect on P 450 3A4, thus increasing the concentration of CNI (particularly cyclosporine). However, CNIs (in particular tacrolimus) have an inductive effect on P 450 3A4, potentially reducing the contraceptive efficacy.(101)"
