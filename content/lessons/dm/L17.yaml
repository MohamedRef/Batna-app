      - kind: explain
        page: 228
        title: "Calcitonin، calcitriol، والـ combinations"
        quote: "The results of clinical trials of calcitriol in postmenopausal osteoporosis have been mixed. However, calcitriol has been reported to be effective in preventing glucocorticoid-induced and posttransplant-related bone loss."
        text: |
          - **Nasal calcitonin 200 international units (IU)/day**: less popular، تأثير متواضع على الـ BMD.
          - ==Calcitriol==: نتايجه mixed في الـ postmenopausal، بس مفيد في **glucocorticoid-induced** و **post-transplant** bone loss. لازم **low-calcium diet** ومتابعة hypercalcemia و hypercalciuria و renal function.
          - **Estrogen 0.625 + alendronate 10**: نفس التأثير، والاتنين مع بعض **slightly more effective**. Combinations تانية بتزوّد الكثافة بس **مفيش fracture data**.

          ليه الـ calcitonin less popular؟ الكتاب بيقول عشان تأثيره متواضع على الـ BMD وضعيف في منع الكسور مقارنة بالـ bisphosphonates والـ PTH. وليه الـ calcitriol محتاج low-calcium diet؟ عشان هو الـ vitamin D النشط، فبيزوّد امتصاص الكالسيوم جامد، وده اللي بيعمل hypercalcemia و hypercalciuria.
      - kind: reveal
        page: 228
        quote: "Although both bisphosphonates and estrogen inhibit bone resorption, they may act through different mechanisms."
        prompt: "الـ estrogen والـ alendronate الاتنين بيوقفوا السحب. إزاي الاتنين مع بعض يبقوا أحسن؟"
        answer: |
          الكتاب: الاتنين بيمنعوا الـ resorption بس ممكن ==بآليات مختلفة==، فالـ estrogen 0.625 mg/day والـ alendronate 10 mg/day تقريبًا زي بعض، والاتنين مع بعض ==أحسن شوية== من كل واحد لوحده.

          التفسير المقبول (مش في الكتاب): لما تقفل نفس الباب من مكانين مختلفين بتسد اللي فلت من القفل الأول.

          بس خلي بالك: الـ combinations التانية (estrogen + calcitonin، estrogen + androgen، estrogen + etidronate، alendronate + raloxifene) بتزوّد الكثافة، و ==مفيش fracture data==. يعني رقم أحسن في الجهاز، من غير دليل على كسور أقل.
