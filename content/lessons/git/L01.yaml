        title: "المريض بيشتكي من إيه؟"
        text: |
          - ألم **epigastric أو retrosternal**، gnawing أو burning، **بيهدى** بالأكل (ice cream، لبن) أو antacids. والـ DD المهم: ==CAD==.
          - **DU و GU مش بيتفرقوا clinically**، بس الـ **hunger** والـ **nocturnal pain** أكتر مع الـ DU.
          - وكتير بييجي أول مرة بـ **complication**: bleeding، perforation، أو gastric outlet obstruction.
      - kind: match
        page: 28
