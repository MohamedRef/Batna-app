items:
  # ---------- p77-78: tolerance ----------
  - id: rheum.L05.001
    kind: card
    topic: tolerance
    front: Define autoimmunity and autoimmune disease in terms of self/non-self discrimination.
    back: The immune system normally discriminates self from non-self antigens. If this fails, it may attack the individual's own cells and tissues; such reactions are autoimmunity, and the diseases they cause are autoimmune diseases.
    src: { page: 78, quote: "Such reactions are called autoimmunity, and the disease they cause are called autoimmune diseases." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.002
    kind: card
    topic: tolerance
    front: Which two questions does the lecture say must be addressed about autoimmunity?
    back: How the immune system maintains unresponsiveness to self antigens, and what factors may contribute to the development of autoimmunity.
    src: { page: 78, quote: "How does the immune system maintain its unresponsiveness to self antigens?" }
    status: unverified
  - id: rheum.L05.003
    kind: table
    topic: tolerance
    title: "Three possible outcomes when lymphocytes meet their antigen"
    columns: [Outcome, What happens, The antigen is called]
    rows:
      - [Activation, Lymphocytes are activated and an immune response follows, Immunogenic]
      - [Tolerance, Lymphocytes are functionally inactivated or killed, Tolerogenic]
      - [Ignorance, Lymphocytes do not react in any way and ignore the antigen, "-"]
    blanks: [[0, 2], [1, 1], [1, 2], [2, 1]]
    src: { page: 78, quote: "antigens that induce tolerance are said to be tolerogenic" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.004
    kind: cloze
    topic: tolerance
    text: "Antigens that elicit an immune response are {{c1::immunogenic}}; antigens that induce tolerance are {{c2::tolerogenic}}."
    src: { page: 78, quote: "antigens that elicit such a response are said to be immunogenic" }
    status: unverified
  - id: rheum.L05.005
    kind: card
    topic: tolerance
    front: What is immunologic "ignorance"?
    back: Antigen-specific lymphocytes do not react in any way, implying they simply ignore the presence of the antigen.
    src: { page: 78, quote: "implying that the lymphocytes simply ignore the presence of the antigen" }
    status: unverified
  - id: rheum.L05.006
    kind: cloze
    topic: tolerance
    text: "Normally microbes are {{c1::immunogenic}}, and self antigens are either {{c2::tolerogenic}} or {{c3::ignored}}."
    src: { page: 78, quote: "Normally microbes are immunogenic and self antigens are either tolerogenic or are ignored" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.007
    kind: card
    topic: tolerance
    front: Why is immunologic tolerance important?
    back: First, self antigens normally induce tolerance. Second, if we learn to induce tolerance in lymphocytes specific for an antigen, we can prevent or control unwanted immune reactions.
    src: { page: 78, quote: "First: self antigens normally induce tolerance." }
    status: unverified
  - id: rheum.L05.008
    kind: enumerate
    topic: tolerance
    prompt: Strategies for inducing tolerance are being tested for which three uses?
    points: [Treating allergic diseases, Treating autoimmune diseases, Preventing rejection of organ transplants]
    pass: 3
    src: { page: 78, quote: "Strategies for inducing tolerance are being tested to treat allergic and autoimmune diseases and to prevent the rejection of organ transplantation." }
    status: unverified
  # ---------- p79: principles ----------
  - id: rheum.L05.009
    kind: card
    topic: principles
    front: Central versus peripheral tolerance?
    back: Central tolerance is induced when developing lymphocytes meet self antigens in the generative lymphoid organs; peripheral tolerance when mature lymphocytes meet self antigens in peripheral tissues.
    src: { page: 79, quote: "when developing lymphocytes encounter these antigens in the generative lymphoid organs, called central tolerance" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.010
    kind: card
    topic: principles
    front: Define autoimmunity.
    back: An immune response against self (autologous) antigens; it is an important cause of disease.
    src: { page: 79, quote: "Autoimmunity: is defined as an immune response against self (autologous)" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.011
    kind: enumerate
    topic: principles
    prompt: What are the principal factors in the development of autoimmunity?
    points:
      - Inheritance of susceptibility genes that may contribute to failure of self tolerance
      - Environmental triggers such as infections that may activate self-reactive lymphocytes
    pass: 2
    src: { page: 79, quote: "Environmental triggers such as infections which may activate self reactive" }
    status: unverified
    tags: [high-yield]
  # ---------- p79-80: T-cell tolerance ----------
  - id: rheum.L05.012
    kind: card
    topic: t-tolerance
    front: What happens to immature T cells that recognise self antigens with high avidity in the thymus?
    back: They die by apoptosis. This is negative selection, the principal mechanism of central tolerance.
    src: { page: 79, quote: "present in the thymus, the lymphocytes die by apoptosis." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.013
    kind: cloze
    topic: t-tolerance
    text: "{{c1::Negative selection}} in the {{c2::thymus}} is the principal mechanism of central T-cell tolerance."
    src: { page: 79, quote: "process is also termed negative selection and it is the principal mechanism of central tolerance." }
    status: unverified
  - id: rheum.L05.014
    kind: enumerate
    topic: t-tolerance
    prompt: How is peripheral T-cell tolerance induced?
    points:
      - Functional inactivation (anergy)
      - Death (deletion)
      - Suppression of self-reactive lymphocytes by regulatory T cells
    pass: 3
    src: { page: 79, quote: "Peripheral tolerance is induced when mature T cells recognize self antigens in peripheral tissues leading to functional inactivation (anergy) or death" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.015
    kind: card
    topic: t-tolerance
    front: Define anergy.
    back: Functional inactivation of T lymphocytes that occurs when they recognise antigen without adequate levels of the costimulators needed for T-cell activation.
    src: { page: 79, quote: "Anergy is the functional inactivation of T lymphocytes that occurs when these cells recognize antigens with out adequate levels of the co stimulators" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.016
    kind: card
    topic: t-tolerance
    front: Besides missing costimulation, what other route to anergy does the take-home message give?
    back: T cells using inhibitory receptors to recognise costimulators.
    src: { page: 82, quote: "when T cells use inhibitory receptors to recognize co stimulators." }
    status: unverified
  - id: rheum.L05.017
    kind: card
    topic: t-tolerance
    front: What is activation-induced cell death?
    back: Repeated activation of mature T cells by self antigens, or recognition of self antigen without second signals, triggers apoptosis that eliminates (deletes) the self-reactive lymphocytes.
    src: { page: 80, quote: "this process is called activation-induced cell death." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.018
    kind: card
    topic: t-tolerance
    front: What do regulatory T cells do, and where can they develop?
    back: Some self-reactive T cells that meet self antigen become regulatory cells that prevent or suppress activation of other potentially harmful self-reactive lymphocytes. They may develop in the thymus or in peripheral lymphoid organs.
    src: { page: 80, quote: "Regulatory T cells may develop in the thymus or in peripheral lymphoid organ." }
    status: unverified
  - id: rheum.L05.019
    kind: mcq
    topic: t-tolerance
    stem: >-
      A mature T cell in a lymph node recognises a self peptide on an antigen-presenting cell that expresses
      no B7 costimulators. The T cell survives but can no longer respond to that peptide. Which mechanism is this?
    options: [Negative selection, Anergy, Activation-induced cell death, Suppression by regulatory T cells, Ignorance]
    answer: 1
    why:
      - Negative selection is central, in the thymus, and the cell dies.
      - "Correct: recognition without adequate costimulation causes functional inactivation (anergy) (p79)."
      - Activation-induced cell death eliminates the cell; this one survives.
      - Treg suppression acts on the cell from outside; here the missing second signal is the cause.
      - In ignorance the cell does not react; here it has been switched off.
    src: { page: 79, quote: "these cells recognize antigens with out adequate levels of the co stimulators that are needed for T cell activation." }
    status: unverified
  - id: rheum.L05.020
    kind: mcq
    topic: t-tolerance
    stem: Repeated stimulation of a mature self-reactive T cell by an abundant self antigen leads to its apoptosis. What is this process called?
    options: [Anergy, Receptor editing, Activation-induced cell death, Negative selection, Ignorance]
    answer: 2
    why:
      - Anergy inactivates the cell without killing it.
      - Changing receptor specificity is a central B-cell mechanism.
      - "Correct: deletion of mature T cells by repeated activation is activation-induced cell death (p80)."
      - Negative selection happens to immature T cells in the thymus.
      - Ignorance means no reaction at all.
    src: { page: 80, quote: "this process is called activation-induced cell death." }
    status: unverified
  # ---------- p80: B-cell tolerance ----------
  - id: rheum.L05.021
    kind: card
    topic: b-tolerance
    front: What happens to immature B cells that interact strongly with self antigen in the bone marrow?
    back: They are either killed (negative selection) or change their receptor specificity.
    src: { page: 80, quote: "bone marrow, the B cells are either killed (negative selection) or they change receptor specificity." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.022
    kind: card
    topic: b-tolerance
    front: What is peripheral B-cell tolerance?
    back: Mature B cells that meet high concentrations of self antigen in peripheral lymphoid tissues become anergic and cannot respond to that self antigen again.
    src: { page: 80, quote: "in peripheral lymphoid tissues become anergic and can not again respond to that" }
    status: unverified
  - id: rheum.L05.023
    kind: table
    topic: b-tolerance
    title: "Tolerance: where and how"
    columns: [Cell, Central, Peripheral]
    rows:
      - [T cell, "Thymus: high-avidity self recognition → apoptosis (negative selection)", "Anergy, deletion (activation-induced cell death), suppression by Tregs"]
      - [B cell, "Bone marrow: killed (negative selection) or change receptor specificity", "Anergy after high concentrations of self antigen"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 80, quote: "the B cells are either killed (negative selection) or they change receptor specificity." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.024
    kind: mcq
    topic: b-tolerance
    stem: In the bone marrow, an immature B cell binds a self antigen strongly. Besides being killed, what can it do to escape deletion?
    options: [Become a regulatory cell, Change its receptor specificity, Undergo class switching, Migrate to the thymus, Become anergic in the marrow only]
    answer: 1
    why:
      - Regulatory cells in this lecture are T cells.
      - "Correct: central B-cell tolerance = killed (negative selection) or change of receptor specificity (p80)."
      - Class switching is a later, helper-T-dependent event, not a tolerance mechanism here.
      - B cells mature in the bone marrow, not the thymus.
      - The lecture places B-cell anergy in the periphery.
    src: { page: 80, quote: "the B cells are either killed (negative selection) or they change receptor specificity." }
    status: unverified
  # ---------- p80-81: genetics ----------
  - id: rheum.L05.025
    kind: card
    topic: genetics
    front: Which genes are the most important in predisposition to autoimmune disease?
    back: MHC genes (among multiple predisposing genes).
    src: { page: 80, quote: "Multiple genes predispose to autoimmune diseases, the most important of" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.026
    kind: card
    topic: genetics
    front: What twin evidence supports a genetic predisposition to autoimmunity?
    back: If one identical twin develops an autoimmune disease, the other is more likely to develop it than an unrelated person, and incidence is higher among monozygotic than dizygotic twins.
    src: { page: 80, quote: "Increased incidence among monozygotic twins than among dizygotic twins." }
    status: unverified
  - id: rheum.L05.027
    kind: card
    topic: genetics
    front: What is the relative risk of HLA–disease association?
    back: The increased incidence of a particular autoimmune disease in people who inherit a particular HLA allele(s), compared with the general population.
    src: { page: 81, quote: "increased incidence is called relative risk of HLA disease association." }
    status: unverified
  - id: rheum.L05.028
    kind: table
    topic: genetics
    title: "HLA alleles and relative risk (book table)"
    columns: [Disease, HLA allele, Relative risk]
    rows:
      - [Ankylosing spondylitis, B27, "90"]
      - [Rheumatoid arthritis, DR2, "4"]
      - [IDDM, DR3/DR4, "25"]
      - [Pemphigus vulgaris, DR4, "14"]
    blanks: [[0, 1], [0, 2], [2, 1], [2, 2], [3, 2]]
    src: { page: 81, quote: "Ankylosing B27 90" }
    status: unverified
    tags: [numbers, high-yield]
    update:
      text: "The book's table prints DR2 for rheumatoid arthritis; the source table and standard texts give HLA-DR4 (the DRB1 shared epitope) with relative risk 4. DR2 is the classic multiple sclerosis allele."
      ref: "Abbas, Lichtman and Pillai, Basic Immunology, 6th ed., 2020 (MHC–disease table)"
  - id: rheum.L05.029
    kind: cloze
    topic: genetics
    text: "Ankylosing spondylitis is linked to HLA-{{c1::B27}}, with a relative risk of {{c2::90}}."
    src: { page: 81, quote: "Ankylosing B27 90" }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L05.030
    kind: enumerate
    topic: genetics
    prompt: Enumerate the three kinds of evidence linking autoimmune disease to the MHC in the lecture's table.
    points:
      - Relative risk in people who inherit particular HLA alleles
      - Animal breeding studies (IDDM with I-A)
      - Genome scanning methods (IDDM with the DR locus)
    pass: 3
    src: { page: 81, quote: "Animal models: breeding" }
    status: unverified
  - id: rheum.L05.031
    kind: card
    topic: genetics
    front: Which autoimmune diseases have the strongest associations with HLA genes?
    back: T-cell-mediated autoimmune diseases.
    src: { page: 82, quote: "strongest associations are between HLA genes and various T cell" }
    status: unverified
  - id: rheum.L05.032
    kind: mcq
    topic: genetics
    stem: In the lecture's HLA table, which disease has the highest relative risk with its allele?
    options: [Rheumatoid arthritis, IDDM, Ankylosing spondylitis, Pemphigus vulgaris]
    answer: 2
    why:
      - Relative risk 4.
      - Relative risk 25 with DR3/DR4.
      - "Correct: B27 carries a relative risk of 90 (p81)."
      - Relative risk 14 with DR4.
    src: { page: 81, quote: "Ankylosing B27 90" }
    status: unverified
  # ---------- p81-82: infections and summary ----------
  - id: rheum.L05.033
    kind: enumerate
    topic: infections
    prompt: How can infections lead to autoimmunity? (combine p81 and the take-home message)
    points:
      - Activate self-reactive lymphocytes
      - Injure tissues and release normally sequestered antigens
      - Cause inflammation and aberrant expression of costimulators
      - Cross-reaction between microbial and self antigens
    pass: 3
    src: { page: 82, quote: "Infections predispose to autoimmunity, by causing inflammation and inducing the aberrant expression of co stimulators" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.034
    kind: card
    topic: infections
    front: Give two examples of sequestered antigens, and how infection can cause autoimmunity through them.
    back: Eye and testis antigens are normally not seen by the immune system; infection may injure the tissue and release them, starting an autoimmune reaction against that tissue.
    src: { page: 81, quote: "Example of some sequestrated antigens (eye & testis) are normally not seen by the immune system" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.035
    kind: mcq
    topic: infections
    stem: >-
      Weeks after a penetrating injury to one eye, a man develops inflammation in the other, uninjured eye.
      Which mechanism from the lecture best explains it?
    options:
      - Release of a normally sequestered antigen
      - HLA-B27 susceptibility
      - Failure of central B-cell tolerance
      - Ignorance of a microbial antigen
      - Activation-induced cell death
    answer: 0
    why:
      - "Correct: eye antigens are sequestered; tissue injury releases them and can start an autoimmune reaction (p81)."
      - B27 is the ankylosing spondylitis allele, not the explanation here.
      - Central tolerance never saw these hidden antigens; the trigger is their release.
      - Ignorance would mean no response at all.
      - Activation-induced cell death removes self-reactive cells; it protects against autoimmunity.
    src: { page: 81, quote: "release of these antigens may initiate an autoimmune reaction against the tissue." }
    status: unverified
  - id: rheum.L05.036
    kind: card
    topic: tolerance
    front: Define immunologic tolerance (take-home message).
    back: Specific unresponsiveness to an antigen, induced by exposing lymphocytes to that antigen. All individuals are tolerant of their own antigens.
    src: { page: 82, quote: "Immunologic tolerance is specific unresponsiveness to an antigen induced by" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L05.037
    kind: card
    topic: principles
    front: What causes autoimmune diseases, per the take-home message?
    back: Failure of self tolerance; contributing factors are immunologic abnormalities, susceptibility genes and infections.
    src: { page: 82, quote: "Autoimmune diseases result from failure of self tolerance." }
    status: unverified
  - id: rheum.L05.038
    kind: case
    topic: t-tolerance
    stem: A researcher follows a self-reactive T-cell clone from the thymus to the periphery.
    steps:
      - question: In the thymus, the clone binds a self antigen with high avidity. What normally happens?
        options: [Apoptosis (negative selection), Anergy, Becomes a B cell, Nothing until it reaches the periphery]
        answer: 0
        why: "High-avidity self recognition in the thymus kills immature T cells: negative selection, the main central mechanism (p79)."
      - reveal: "A few cells escape to the periphery and meet the self antigen on cells lacking costimulators."
        question: What happens now?
        options: [Anergy, Clonal expansion, Class switching, Receptor editing]
        answer: 0
        why: "Antigen without adequate costimulators = anergy (p79)."
      - question: Which other cell can keep the remaining self-reactive cells quiet?
        options: [Regulatory T cells, Neutrophils, Plasma cells, Mast cells]
        answer: 0
        why: "Some self-reactive T cells become regulatory cells that suppress other self-reactive lymphocytes (p80)."
    src: { page: 79, quote: "If immature T-cells in the thymus recognize with high avidity self antigens" }
    status: unverified
  - id: rheum.L05.039
    kind: essay
    topic: t-tolerance
    prompt: Define anergy and mention other mechanisms of autoimmunity (tolerance).
    outline:
      - "Anergy": ["Functional inactivation of T cells recognising antigen without adequate costimulators", "Or T cells using inhibitory receptors to recognise costimulators", "B cells: high concentrations of self antigen in the periphery"]
      - "Central tolerance": ["T: negative selection in the thymus (apoptosis)", "B: killed or change receptor specificity in the bone marrow"]
      - "Other peripheral mechanisms": ["Deletion: activation-induced cell death", "Suppression by regulatory T cells"]
      - "Why tolerance fails": ["Susceptibility genes, especially MHC/HLA", "Infections: activate self-reactive cells, release sequestered antigens, costimulators, cross-reaction"]
    src: { page: 79, quote: "Anergy is the functional inactivation of T lymphocytes" }
    status: unverified
    tags: [book-question]
