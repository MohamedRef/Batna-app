            <text x="52" y="238" class="t-b t-good">SVR12 = cure</text>
            <text x="52" y="260" class="t-sm">HCV RNA undetectable</text>
            <path d="M120 274L80 310" class="fg-arrow" marker-end="url(#L05e)"/>
            <path d="M240 274L262 310" class="fg-arrow" marker-end="url(#L05e)"/>
