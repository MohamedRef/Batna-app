items:
  # ---------- p447-449: overview and classes ----------
  - id: neph.L14.001
    kind: enumerate
    topic: ln-overview
    prompt: The six systemic diseases on the agenda of Lecture 14 (kidney in systemic diseases)?
    points:
      - Lupus nephritis
      - Thrombotic microangiopathy (TMA)
      - Viral related GN
      - Hepatorenal syndrome
      - Dysproteinemia
      - Sarcoidosis
    pass: 5
    hook: "المحاضرة دي فيها «6 ضيوف على الكلية»: مناعة (lupus nephritis)، جلطات صغيرة (TMA)، فيروس (viral related GN)، كبد (hepatorenal syndrome)، بروتينات غلط (dysproteinemia)، وجرانيولوما (sarcoidosis)."
    src: { page: 447, quote: "Lupus Nephritis. TMA. Viral related GN. Hepatorenal syndrome. Dysproteinemia. Sarcoidosis." }
    status: unverified
  - id: neph.L14.002
    kind: cloze
    topic: ln-overview
    text: "The lifetime incidence of lupus nephritis among patients with SLE is {{c1::20%-60%}}."
    src: { page: 448, quote: "Among patients with systemic lupus erythematosus (SLE), the reported lifetime incidence of lupus nephritis (LN) is 20%–60%." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L14.003
    kind: card
    topic: ln-overview
    front: Which SLE patients have the highest mortality from kidney involvement?
    back: Those progressing to kidney failure.
    src: { page: 448, quote: "Kidney involvement in SLE has been associated with higher mortality, especially for patients progressing to kidney failure." }
    status: unverified
  - id: neph.L14.004
    kind: card
    topic: ln-overview
    front: What is the ultimate goal of treating lupus nephritis?
    back: Preserve kidney function and reduce CKD and kidney-failure morbidity and mortality, while minimizing medication toxicity.
    src: { page: 448, quote: "The ultimate goal of treating LN is to preserve kidney function and reduce the morbidity and mortality associated with chronic kidney disease (CKD) and kidney failure, while minimizing medication- associated toxicities." }
    status: unverified
  - id: neph.L14.005
    kind: card
    topic: ln-overview
    front: Why must SLE patients be monitored actively and regularly for nephritis?
    back: Kidney involvement can stay silent or asymptomatic for a long time.
    src: { page: 448, quote: "Patients with SLE should be actively and regularly monitored, as the clinical presentation of kidney involvement can remain silent or asymptomatic for a significant period of time." }
    status: unverified
  - id: neph.L14.006
    kind: enumerate
    topic: ln-overview
    prompt: In which ethnic groups should a high index of suspicion for lupus nephritis be kept?
    points:
      - Asian
      - African/Caribbean
      - Hispanic
    pass: 3
    hook: "شك في LN بقوة عند «آسيا وأفريقيا وأمريكا اللاتينية»: Asian، African/Caribbean، وHispanic."
    src: { page: 448, quote: "A high index of suspicion should be maintained for patients of Asian, African/Caribbean, and Hispanic descent." }
    status: unverified
  - id: neph.L14.007
    kind: card
    topic: ln-overview
    front: How does childhood-onset SLE differ from adult-onset SLE in the kidney?
    back: Higher incidence of lupus nephritis and more severe disease.
    src: { page: 448, quote: "Childhood-onset SLE is associated with a higher incidence of LN and more severe disease than adult-onset SLE." }
    status: unverified
  - id: neph.L14.008
    kind: card
    topic: ln-overview
    front: What should inform clinical decisions in lupus nephritis, rather than a single test?
    back: A holistic assessment of clinical, urinary and laboratory parameters, repeated over time to follow the trend.
    src: { page: 449, quote: "A holistic assessment including clinical, urinary, and laboratory parameters, and repeated investigations to note the progression of abnormal findings over time, are important in informing clinical management decisions." }
    status: unverified
  - id: neph.L14.009
    kind: table
    topic: ln-classes
    title: ISN/RPS classes of lupus nephritis (Figure 3, p449)
    columns: [Class, Name, Key finding]
    rows:
      - [I, Minimal mesangial, "Normal glomeruli on light microscopy; mesangial immune deposits on IF"]
      - [II, Mesangial proliferative, "Mesangial hypercellularity or matrix expansion with mesangial deposits"]
      - [III, Focal, "Endo/extracapillary GN in <50% of glomeruli; A, C or A/C lesions"]
      - [IV, Diffuse, "≥50% of glomeruli, subendothelial deposits; IV-S or IV-G"]
      - [V, Membranous, "Subepithelial deposits; may combine with class III or IV"]
      - [VI, Advanced sclerosing, "≥90% of glomeruli globally sclerosed"]
    blanks: [[0, 1], [2, 2], [3, 2], [4, 2], [5, 2]]
    src: { page: 449, quote: "Figure 3: Histopathology classification of lupus nephritis according to the criteria established by the International Society of Nephrology and the Renal Pathology Society (ISN/RPS) in 2003 revised in 2018\n| Class | Name | Description |\n| Class I | Minimal Mesangial Lupus Nephritis | Deposition of imune complexes detectable by immunofluorescence techniques. |\n| Class II | Mesangial Proliferative Lupus Nephritis | Mesangial hipercelularity of any degree or mesangial matrix expansion with immune deposits detectable by light microscopy. |\n| Class III | Focal Lupus Nephritis | Active or inactive focal, segmental or global endo/extracapillary glomerulonephritis involving <50% of all glomeruli. |\n| | | Manifestations include active lesions (A), chronic inactive lesions (C) or active and chronic lesions (A/C) |\n| Class IV | Diffuse Lupus Nephritis | Active or inactive diffuse, segmental or global endo/extracapillary glomerulonephritis involving ≥50% of all glomeruli. Subendothelial diffuse immune deposits, with or without mesangial alterations, are common. |\n| | | This class is also divided in: diffuse segmental (IV-S), when ≥ 50% of the involved glomeruli have segmental lesions, and diffuse global (IV-G), when ≥ 50% of the involved glomeruli have global lesions. |\n| | | It can also manifest A, C or A/C lesions. |\n| Class V | Membranous Lupus Nephritis | Global or segmental subepithelial immune deposition or their morphologic sequelae detectable by light, immunofluorescence or electron microscopy, with or without mesangial alterations. |\n| | | It can occur in combination with class III or IV and it can manifest advanced sclerosis. |\n| Class VI | Advanced Sclerosis Lupus Nephritis | Lupus Nephritis with terminal prognosis. |\n| | | ≥90% of the glomeruli in global sclerosis. |" }
    status: unverified
    tags: [high-yield]
