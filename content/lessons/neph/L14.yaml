  - id: neph.L14.lesson7
    title: "TTP: طوارئ، والـ PLASMIC بيساعدك"
    hook: "من غير علاج 9 من كل 10 بيموتوا. ومع العلاج 8 من 10 بيستجيبوا. الفرق كله في السرعة."
    minutes: 9
    pages: [477, 480]
    topics: [ttp]
    goals:
      - "تشرح ليه نقص الـ ADAMTS13 بيعمل جلطات"
      - "تفرّق بين الـ acquired والـ congenital وتعرف الـ triggers"
      - "تعرف الصورة الإكلينيكية بالنسب وليه الـ pentad نادر"
      - "تحسب الـ PLASMIC وتفهم ليه screening، وتقرا الـ ADAMTS13"
    status: unverified
    steps:
      - kind: explain
        page: 477
        title: "اسم طويل، وفكرة واحدة"
        quote: "Thrombotic thrombocytopenic purpura (TTP) is a type of microangiopathic hemolytic anemia that classically has been characterized by the pentad of fever, thrombocytopenia, hemolytic anemia, renal dysfunction, and neurologic dysfunction."
        text: |
          الـ TTP نوع من الـ microangiopathic hemolytic anemia، والكلاسيكي فيه **pentad**: fever، thrombocytopenia، hemolytic anemia، renal dysfunction، و neurologic dysfunction.

          السبب ==congenital or acquired== نقص في الـ **ADAMTS13**، وهو **protease** وظيفته يقطّع الـ von Willebrand factor (VWF).

          التفسير المقبول (مش في الكتاب): خلّي في دماغك إن الاسم بيقولك المشكلة: **thrombotic** (جلطات صغيرة) + **thrombocytopenic** (الصفايح اتصرفت فيها) + **purpura** (فالمريض ينزف تحت الجلد رغم إن عنده جلطات).
      - kind: explain
        page: 478
        title: "الميكانيزم"
        quote: "This is due to the inability of the ADAMTS13 to inactivate the large multimer von Willebrand factor (VWF) that is necessary to prevent spontaneous coagulation."
        text: |
          الـ ==ADAMTS13== بيقطّع الـ **ultra-large von Willebrand factor (VWF) multimers**. لو ناقص، الـ multimers دي بتمسك platelets وتعمل microthrombi.

          - "**Acquired** (أشهر): autoantibodies ضد ADAMTS13. Triggers: antiplatelets، immunosuppressants، **human immunodeficiency virus (HIV)**، **estrogen pills**، **pregnancy**."
          - "**Congenital**: mutation، ومحتاج trigger (infection أو حمل)."
          - الـ **central nervous system (CNS)** والـ **كلية** أكتر عضوين.

          ليه الصفايح بتقل والمريض بيعمل جلطات في نفس الوقت؟ عشان الصفايح بتتصرف كلها في الـ microthrombi، فاللي فاضل في الدم قليل، فينزف من الجلد.
      - kind: explain
        page: 478
        title: "ليه هو طوارئ؟ وليه الـ congenital بيستنى trigger؟"
        quote: "Timely diagnosis is very important because TTP is a medical emergency which, without treatment, has a mortality of about 90%. About 80% of patients respond to initial treatment, and the post-treatment mortality is 10 to 15%."
        text: |
          الأرقام هي السبب: من غير علاج ==mortality of about 90%==. مع العلاج **80%** بيستجيبوا، والوفيات بتنزل لـ **10-15%**. يعني العلاج بيقلب الأرقام، بشرط يبدأ بدري.

          والـ congenital: الكتاب بيقول ==deficiency of ADAMTS13 activity alone does not cause clinically apparent TTP==. المرضى دول ==asymptomatic until a triggering event such as an infection or pregnancy==.

          التفسير المقبول (مش في الكتاب): العدوى والحمل بيعلّوا الـ VWF في الدم، فالـ ADAMTS13 القليل اللي كان مكفّي يبقى مش كفاية. وعشان كده الحمل trigger للنوعين.

          وفي الـ acquired: الكتاب صريح إن **Risk factors for the development of inhibitory autoantibodies to ADAMTS13 are not clearly defined**.
      - kind: aside
        tone: exam
        text: "الـ **pentad** (fever، thrombocytopenia، hemolytic anemia، renal، neuro) موجود كامل في **أقل من 5%** بس. متستناش الخمسة عشان تشخّص."
      - kind: explain
        page: 479
        title: "المريض بييجي إزاي؟ والسبب"
        quote: "Classical pentad comprising of hemolytic anemia, thrombocytopenia, fever, acute kidney injury, and severe neurologic findings less than 5%."
        text: |
          الأعراض اللي في الكتاب بالنسب، ومعاها سببها (التفسير المقبول، مش في الكتاب، إلا الأرقام):

          - **GI 69%:** جلطات صغيرة في أوعية المعدة والأمعاء = ischemia ووجع.
          - **Weakness 63%:** الأنيميا.
          - **Bleeding أو purpura 54%:** الصفايح اتصرفت في الجلطات.
          - **Major neuro 41%** (coma، stroke، seizure) و **minor 26%** (صداع، confusion): الـ **CNS** واحد من أكتر عضوين بيتأثروا.
          - **Fever 10%** بس.

          والـ pentad كامل ==less than 5%==. فلو استنيت الخمسة، هتفوّت أغلب المرضى.

          ليه الـ score محتاج schistocytes الأول؟ لأن من غيرها مفيش microangiopathy أصلًا، فالسؤال عن TTP مالوش لازمة. وليه بنستخدمه أصلًا لو الـ ADAMTS13 موجود؟ التفسير المقبول (مش في الكتاب): نتيجة الـ ADAMTS13 بتاخد أيام في معامل كتير، والـ TTP مش بيستنى، فالـ score بيساعدك تقرر تبدأ PEX النهارده ولا لأ.
      - kind: mnemonic
        page: 479
        quote: "The PLASMIC score is calculated using findings on presentation and predicts the likelihood of ADAMTS13 activity being less than or equal to 10% to help make a presumptive diagnosis of TTP in the appropriate clinical setting. The presence of peripheral schistocytes is required to apply this score. One point is given for each of the following features:"
        word: "PLASMIC"
