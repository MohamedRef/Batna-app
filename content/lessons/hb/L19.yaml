  # ------------------------------------------------------------------
  - id: hb.L19.lesson1
    title: "المرارة والحصوات: مين معرّض؟"
    hook: "مخزن للـ bile، حصوات من أيام الفراعنة، و 20% من المصريين: مين بيجيله ومين أكتر."
    minutes: 7
    pages: [375, 377]
    topics: [anatomy, epidemiology]
    goals:
      - "تعرف المرارة بتعمل إيه وليه الأكل الدسم هو اللي بيحرّكها"
      - "تحفظ أرقام الانتشار في مصر والعالم وعوامل الخطر، وتعرف ليه كل عامل بيعمل حصوة"
    status: unverified
    steps:
      - kind: explain
        page: 375
        title: "المرارة: مخزن مش مصنع"
        quote: "The gallbladder is a sac located under the liver. It stores and concentrates bile produced in the liver. Bile aids in the digestion of fat, and is released from the gallbladder into the upper small intestine(duodenum) in response to food (especially fats)."
        text: |
          الـ **gallbladder** كيس صغير قاعد تحت الكبد. شغلته في جملة واحدة: مخزن مش مصنع.

          - **Liver**: هو اللي بيصنع الـ bile طول اليوم.
          - ==Gallbladder==: بتخزّنها وبتركّزها لحد ما نحتاجها.

          إمتى نحتاجها؟ لما الأكل يوصل الـ duodenum، وخصوصًا الدهون. ساعتها المرارة بتنقبض وتضخ الـ bile، لأن الـ bile هي اللي بتساعد في هضم الدهون.

          اربط الجملة دي بباقي المحاضرة: الأكل الدسم هو الزرار اللي بيشغّل انقباض المرارة. ولو فيه حصوة قاعدة على الباب، الانقباض ده هو اللي بيعمل الوجع.
      - kind: figure
        page: 375
        title: "المرارة وجيرانها"
        image: { file: hb/L19-biliary-anatomy.webp, book: true }
        alt: "Book anatomy drawing of the upper abdomen: the liver with the gallbladder hanging under its lower edge, the cystic duct joining the common hepatic duct to form the common bile duct, which runs behind the duodenum to the major duodenal papilla next to the pancreatic duct. The oesophagus, stomach, pancreas and duodenum are labelled; a small inset body at the bottom left shows where this sits."
        caption: |
          رسمة الكتاب للمكان كله، وامشي فيها مع الـ bile:

          - الـ **liver** الكبيرة فوق، والـ ==gallbladder== الخضرا متعلّقة تحت حافتها على شمال الرسمة.
          - من الكبد نازل الـ **common hepatic duct**، والمرارة بتطلّع الـ **cystic duct**، والاتنين بيتقابلوا فيبقوا الـ ==common bile duct==.
          - الـ common bile duct نازل لتحت ورا الـ duodenum، وبيفتح عند الـ **major duodenal papilla** جنب الـ **pancreatic duct** (تحت في النص).
          - والجسم الصغير تحت على الشمال بيوريك المكان ده فين: الـ right upper quadrant (RUQ) تحت الضلوع.

          ليه ده مهم للمحاضرة كلها؟ الحصوة ممكن تقف في أي محطة من دول: الـ cystic duct (colic و cholecystitis)، الـ common bile duct (jaundice و cholangitis)، أو الـ ==papilla== اللي بيشاركها الـ pancreatic duct (pancreatitis).
