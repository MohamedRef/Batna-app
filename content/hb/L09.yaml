items:
- id: hb.L09.001
  kind: card
  topic: causes
  front: Definition of ascites?
  back: Accumulation of free sterile fluid within the peritoneal cavity.
  src:
    page: 145
    quote: accumulation of free sterile fluid within the peritoneal cavity
  status: unverified
- id: hb.L09.002
  kind: enumerate
  topic: causes
  prompt: Enumerate the causes of ascites with a NORMAL peritoneum (6 groups).
  points:
  - 'Portal hypertension: cirrhosis, pre-sinusoidal and post-sinusoidal'
  - 'Cardiac: right heart failure, constrictive pericarditis'
  - 'Hypoproteinemia: nephrotic syndrome, protein-losing enteropathy'
  - 'Pancreatic: acute pancreatitis, pancreatic pseudocyst'
  - 'Endocrine: marked hypothyroidism, Meigs'' syndrome, ovarian hyperstimulation, struma ovarii'
  - 'Miscellaneous: chylous, bile, nephrogenic and urine ascites'
  pass: 4
  src:
    page: 145
    quote: "I. Ascites with normal peritoneum Portal hypertension: cirrhosis, pre- sinusoidal and post-sinusoidal."
  status: unverified
- id: hb.L09.003
  kind: enumerate
  topic: causes
  prompt: Enumerate the causes of ascites with a DISEASED peritoneum (3 groups).
  points:
  - 'Infections: tuberculosis, Fitz-Hugh-Curtis syndrome, fungal (coccidioidomycosis), HIV-associated peritonitis,
    Whipple''s disease'
  - 'Malignant: primary mesothelioma, pseudomyxoma peritonei, HCC, massive hepatic metastases, intra-abdominal tumors'
  - 'Rare: familial Mediterranean fever, collagen vascular disease, granulomatous peritonitis, eosinophilic peritonitis'
  pass: 3
  src:
    page: 146
    quote: "II. Ascites with diseased peritoneum Infections: Tuberculosis Fitz-Hugh-Curtis syndrome fungal (Coccidioidomycosis)"
  status: unverified
- id: hb.L09.004
  kind: cloze
  topic: causes
  text: 'Endocrine causes of ascites: marked {{c1::hypothyroidism}}, {{c2::Meigs'' syndrome}}, ovarian hyperstimulation
    and {{c3::struma ovarii}}.'
  src:
    page: 145
    quote: "Endocrine disease: marked hypothyroidism, Meig's syndrome, ovarian hyperstimulation, struma ovarii."
  status: unverified
- id: hb.L09.005
  kind: card
  topic: causes
  front: Two families of factors behind ascitic fluid accumulation?
  back: '1. Mechanical forces that drive fluid transudation across the capillary endothelium.

    2. Biochemical factors causing renal sodium and water retention (volume overload).'
  src:
    page: 146
    quote: "alterations in mechanical forces that drive fluid transudation across the capillary endothelial cell membrane as well as biochemical factors"
  status: unverified
- id: hb.L09.006
  kind: enumerate
  topic: causes
  prompt: Mention the MECHANICAL factors of ascites formation.
  points:
  - 'Increased hydrostatic pressure: portal hypertension, IVC narrowing at the diaphragm, hepatic vein block'
  - 'Reduced colloid osmotic pressure (hypoproteinemia): nephrotic syndrome, protein-losing enteropathy, hepatic
    insufficiency'
  - Disturbed capillary permeability
  - Increased lymph formation or insufficient lymphatic drainage
  pass: 3
  src:
    page: 146
    quote: "Mechanical Factors Increase in hydrostatic pressure; portal hypertension, narrowing of inferior vena cava at the level of the diaphragm"
  status: unverified
- id: hb.L09.007
  kind: cloze
  topic: causes
  text: 'Anti-natriuretic factors increased in ascites: {{c1::RAAS}}, {{c1::ADH}}, thromboxane, {{c2::endothelin}},
    catecholamines and endotoxemia.'
  src:
    page: 146
    quote: "Increase in anti-natriuretic factors: Renin-angiotensin-aldosterone system (RAAS), antidiuretic hormone (ADH), thromboxane, endothelin, catecholamines, endotoxemia."
  status: unverified
- id: hb.L09.008
  kind: cloze
  topic: causes
  text: 'Natriuretic factors decreased in ascites: natriuretic peptides (atrial, renal), {{c1::kallikrein-kinin
    system}}, {{c2::prostaglandin E2}} and {{c2::prostacyclin}}.'
  src:
    page: 146
    quote: "Decrease in natriuretic factors: Natriuretic factors (atrial, renal), kallikrein- kinin system, prostaglandin E2, prostacyclin."
  status: unverified
- id: hb.L09.009
  kind: card
  topic: pathophysiology
  front: What is the most frequent first decompensating event in cirrhosis?
  back: Development of ascites.
  src:
    page: 147
    quote: the most frequent first decompensating event
  status: unverified
- id: hb.L09.010
  kind: cloze
  topic: pathophysiology
  text: If untreated, nearly {{c1::60%}} of patients with compensated cirrhosis develop ascites within {{c2::10
    years}}.
  src:
    page: 147
    quote: "Nearly 60% of patients with compensated cirrhosis develop ascites within 10 years of the course of liver disease if untreated."
  status: unverified
  tags:
  - numbers
- id: hb.L09.011
  kind: card
  topic: pathophysiology
  front: The most accepted theory of ascites formation in cirrhosis?
  back: The peripheral arterial vasodilatation hypothesis.
  src:
    page: 147
    quote: "The most accepted theory is the peripheral arterial vasodilatation hypothesis (Figure 1)."
  status: unverified
- id: hb.L09.012
  kind: card
  topic: pathophysiology
  front: Triggering factor of ascites formation in cirrhosis?
  back: Accumulation of endogenous vasodilators (because of portal hypertension), causing splanchnic and systemic
    arterial vasodilatation and arterial underfilling.
  src:
    page: 147
    quote: "The triggering factor of ascites formation in cirrhosis is the accumulation of endogenous vasodilators such as nitric oxide, carbon monoxide"
  status: unverified
- id: hb.L09.013
  kind: enumerate
  topic: pathophysiology
  prompt: Name the endogenous vasodilators that accumulate in cirrhosis and trigger ascites.
  points:
  - Nitric oxide
  - Carbon monoxide
  - Glucagon
  - Vasodilator peptides
  - Prostaglandins
  - Endocannabinoids
  pass: 4
  src:
    page: 147
    quote: "carbon monoxide, glucagon, vasodilators peptides, prostaglandins, endocannabinoids and others as a result of PH"
  status: unverified
- id: hb.L09.014
  kind: order
  topic: pathophysiology
  prompt: 'Peripheral arterial vasodilatation hypothesis: from portal hypertension to ascites.'
  steps:
  - Portal hypertension leads to accumulation of endogenous vasodilators (NO, CO, glucagon, prostaglandins, endocannabinoids)
  - Splanchnic and systemic arterial vasodilatation
  - Underfilling of the circulation (arterial bed too big for the blood volume)
  - Baroreceptor-mediated activation of RAAS, SNS and ADH
  - Renal vasoconstriction with sodium and water retention (hypervolemia)
  - 'Fluid transudates into the peritoneum, localized by portal hypertension: ascites'
  src:
    page: 147
    quote: "as a result of PH, leading to splanchnic and systemic arterial vasodilatation and underfilling of circulatory volume"
  status: unverified
- id: hb.L09.015
  kind: card
  topic: pathophysiology
  front: In ascites formation, what role does portal hypertension play besides triggering vasodilatation?
  back: 'It is the localizing factor: it makes the retained fluid transudate into the peritoneal cavity.'
  src:
    page: 147
    quote: "In the presence of portal hypertension (acting as a localizing factor), fluid transudates into the peritoneal cavity with ascites formation."
  status: unverified
- id: hb.L09.016
  kind: card
  topic: pathophysiology
  front: How do gut bacteria worsen splanchnic vasodilatation in cirrhosis?
  back: Bacterial translocation to mesenteric lymph nodes raises endotoxin, which stimulates pro-inflammatory cytokines
    and nitric oxide production.
  src:
    page: 147
    quote: "Bacterial translocation to mesenteric lymph nodes with increased endotoxin production stimulates secretion of pro- inflammatory cytokines and nitric oxide production."
  status: unverified
- id: hb.L09.017
  kind: cloze
  topic: pathophysiology
  text: ADH activation lowers tubular free water clearance, causing {{c1::dilutional hyponatremia}}, defined as
    serum sodium below {{c2::130 mmol/L}}.
  src:
    page: 147
    quote: serum sodium level of less than 130 mmol/L
  status: unverified
  tags:
  - numbers
- id: hb.L09.018
  kind: cloze
  topic: clinical
  text: At least {{c1::1–2 L}} of fluid must be in the abdomen before ascites is clinically detected.
  src:
    page: 148
    quote: "At least 1-2 Liters of fluid in the abdomen before ascites is clinically detected."
  status: unverified
  tags:
  - numbers
- id: hb.L09.019
  kind: card
  topic: clinical
  front: 'In cirrhosis, which comes first: ascites or peripheral edema?'
  back: Ascites precedes peripheral edema.
  src:
    page: 148
    quote: "Ascites precedes the development of peripheral edema in cirrhosis."
  status: unverified
- id: hb.L09.020
  kind: enumerate
  topic: clinical
  prompt: Mention the clinical signs of ascites on examination.
  points:
  - Increased abdominal circumference and distension
  - Full flanks
  - Wide subcostal angle
  - Divarication of the recti
  - Umbilicus shifted downward and everted, umbilical hernia
  - Other abdominal wall hernias
  - Scrotal swelling
  pass: 5
  src:
    page: 148
    quote: "abdominal distention, full flanks, wide subcostal angle, divarication of the recti, shifted downward, everted umbilicus with umbilical hernia"
  status: unverified
- id: hb.L09.021
  kind: table
  topic: clinical
  title: Grades of ascites
  columns:
  - Grade
  - Amount
  - Finding
  rows:
  - - Grade 1
    - Mild
    - Detectable only by ultrasound
  - - Grade 2
    - Moderate
    - Moderate symmetrical distension with flank bulging and shifting dullness
  - - Grade 3
    - Severe
    - Marked abdominal distension with a fluid thrill
  blanks:
  - - 0
    - 2
  - - 1
    - 2
  - - 2
    - 2
  src:
    page: 148
    quote: "Grade 2 (moderate): ascites causing moderate symmetrical distension of the abdomen with flank bulging and shifting dullness."
  status: unverified
- id: hb.L09.022
  kind: card
  topic: clinical
  front: Define tense ascites.
  back: 'Severe ascites that markedly raises intra-abdominal pressure and causes pressure manifestations: dyspnea,
    early satiety, functional IVC block, congested neck veins, and possible rupture of an umbilical hernia.'
  src:
    page: 149
    quote: "Tense ascites is defined when severe ascites (massive fluid accumulation) causes marked increase in intraabdominal pressure leading to pressure manifestations"
  status: unverified
- id: hb.L09.023
  kind: card
  topic: clinical
  front: What is hepatic hydrothorax and which side is it usually on?
  back: A usually right-sided pleural effusion from ascitic fluid passing through diaphragmatic defects from the
    peritoneum to the pleural space.
  src:
    page: 149
    quote: "Hepatic hydrothorax is usually a right-sided effusion due to ascitic fluid translocating through diaphragmatic defects from the peritoneum to the pleural space."
  status: unverified
- id: hb.L09.024
  kind: cloze
  topic: clinical
  text: Pleural fluid in hepatic hydrothorax is a {{c1::transudate}} (low protein) with a serum-pleural fluid albumin
    gradient of {{c2::≥1.1 g/dL}}.
  src:
    page: 149
    quote: "low protein levels (transudate) and high serum-pleural fluid albumin gradient (≥1.1 g/dl)."
  status: unverified
  tags:
  - numbers
- id: hb.L09.025
  kind: card
  topic: clinical
  front: How is spontaneous bacterial empyema (in hepatic hydrothorax) managed?
  back: Like SBP.
  src:
    page: 149
    quote: "Spontaneous bacterial empyema may be a complication and should be managed similar to SBP."
  status: unverified
- id: hb.L09.026
  kind: card
  topic: clinical
  front: Best option for refractory hepatic hydrothorax, and the bridge to it?
  back: Liver transplantation is the best option. TIPS can bridge persistent hydrothorax to LT. Repeated thoracentesis
    and pleurodesis are tried only if other therapies fail.
  src:
    page: 149
    quote: "Whenever indicated and possible, LT represents the best option for patients with refractory hepatic hydrothorax."
  status: unverified
- id: hb.L09.027
  kind: enumerate
  topic: clinical
  prompt: 'Define complicated ascites: which 4 conditions make ascites ''complicated''?'
  points:
  - Refractoriness to diuretics (refractory ascites)
  - Dilutional hyponatremia
  - Hepatorenal syndrome
  - Spontaneous bacterial peritonitis
  pass: 4
  src:
    page: 149
    quote: "Complicated ascites is defined as ascites associated with refractoriness to diuretic treatment (refractory ascites), dilutional hyponatremia, hepatorenal syndrome (HRS)"
  status: unverified
- id: hb.L09.028
  kind: mcq
  topic: clinical
  stem: 'A man with alcohol-related cirrhosis has a large right pleural effusion and moderate ascites. He has no
    heart or lung disease. Pleural fluid: protein low, serum-pleural fluid albumin gradient 1.4 g/dL, PMN 80/mm³.
    Which statement about his condition is correct according to the lecture?'
  options:
  - It is most likely a malignant effusion because it is unilateral
  - Fluid has crossed diaphragmatic defects; treat it like ascites
  - Pleurodesis is the first-line treatment
  - A gradient of 1.4 g/dL points to an exudate
  - Diuretics are contraindicated in this condition
  answer: 1
  why:
  - A right-sided transudate in a cirrhotic with ascites is hepatic hydrothorax; side alone does not suggest malignancy.
  - 'Correct: hepatic hydrothorax is ascitic fluid crossing diaphragmatic defects, and its therapy corresponds to
    that of ascites.'
  - Pleurodesis and repeated thoracentesis are tried only when other therapies fail.
  - A gradient ≥1.1 g/dL with low protein is a transudate like the ascites.
  - Therapy corresponds to that of ascites, which includes sodium restriction and diuretics.
  src:
    page: 149
    quote: "Hepatic hydrothorax is usually a right-sided effusion due to ascitic fluid translocating through diaphragmatic defects from the peritoneum to the pleural space."
  status: unverified
- id: hb.L09.029
  kind: cloze
  topic: diagnosis
  text: Ultrasound can detect as little as {{c1::100 mL}} of ascites; CT is indicated only for {{c2::problems with
    the differential diagnosis}}.
  src:
    page: 149
    quote: "CT scan is only indicated in problems with the differential diagnosis."
  status: unverified
  tags:
  - numbers
- id: hb.L09.030
  kind: card
  topic: diagnosis
  front: When is a diagnostic paracentesis done in ascites?
  back: At first presentation of grade 2 or 3 ascites, and to look for complications such as SBP.
  src:
    page: 150
    quote: "A diagnostic paracentesis of ascites at the time of first presentation of grades 2 and 3"
  status: unverified
- id: hb.L09.031
  kind: enumerate
  topic: diagnosis
  prompt: Mention the components of ascitic fluid analysis.
  points:
  - Appearance (transparent, yellow-tinged, hemorrhagic, chylous)
  - Cell count with differential
  - Total protein
  - Albumin, to calculate the SAAG
  - LDH
  - 'Culture: 10–20 mL into aerobic and anaerobic blood culture bottles at the bedside'
  - Cytology for malignant cells
  pass: 5
  src:
    page: 150
    quote: "Ascitic fluid analysis includes Biochemical analysis including - The appearance of the ascitic fluid (transparent, tinged yellow, hemorrhagic, or chylous)."
  status: unverified
- id: hb.L09.032
  kind: cloze
  topic: diagnosis
  text: Ascitic PMN count of {{c1::≥250 cells/mm³}} suggests SBP, while predominant {{c2::lymphocytes}} suggest
    TB ascites.
  src:
    page: 150
    quote: "Cell count with differential (increased polymorphonuclear leukocytes (PMN) ≥250 cells/mm3 in SBP, lymphocytes in tuberculous (TB) ascites)."
  status: unverified
