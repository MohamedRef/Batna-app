  - id: res.L03.lesson6
    title: "هدف عام وأهداف خاصة… وتصليح الغلط"
    hook: "هدف واحد كبير بيتقسم لحتت صغيرة، وأي حتة ناقصها مكان أو وقت هتتمسك عليك."
    minutes: 7
    pages: [57, 64]
    topics: [objectives]
    goals:
      - "تفرّق بين الـ general والـ specific objectives"
      - "تكتشف الناقص في أي objective: verb، population، place، time"
    status: unverified
    steps:
      - kind: explain
        page: 57
        quote: "Types of Research Objectives. Commonly, research objectives are classified into:\n  general objectives\n  specific objectives.\nThe general and specific objectives are logically connected to each other and the specific objectives are commonly considered as smaller portions of the general objectives.\nIt is important to ascertain that the general objective is closely related to the statement of the problem."
        title: "General و Specific"
        text: |
          - الـ ==general objective== بيقول **in general terms** البحث هيحقق إيه وليه، ولازم يكون **closely related to the statement of the problem**.
          - الـ ==specific objectives== هي **smaller portions** منه: بتقول **in greater detail** هتعمل إيه، فين، وعلشان إيه، وبتغطي جوانب المشكلة **systematically**.

          في المحاضرة اتقال: كل specific objective لازم يخدم الـ general objective، ويبقى له الـ data والـ analysis اللي تناسبه.
      - kind: explain
        page: 58
        quote: "The General Objective: The general objective or purpose of the research identifies in general terms what is to be accomplished by the research project and why."
        title: "الـ general objective"
        text: |
          الـ **general objective** (أو purpose) بيقول ==بشكل عام== البحث هيحقق **إيه** و**ليه**.

          وده مش زي الـ **hypothesis**: الفرضية بتوجّه البحث، وبتحدد الـ independent والـ dependent variables، ونوع الداتا، ونوع التحليل. الـ general objective بيوصف الغرض بس، ومابيتنبّأش بنتيجة.
      - kind: reveal
        page: 60
        quote: "Examples of General and Specific Objectives:\nExample 1. A study designed to assess the Accessibility and Acceptability\nof the Voluntary Counselling and Testing Services in Assosa Town,\nBenshangul Gumze National Regional State, has the following objectives:\nGeneral Objective:\nTo identify factors that affect the acceptability of VCT services and to\nassess perception of the community towards a comprehensive care and\nsupport activity for HIV/AIDS."
        prompt: "دراسة عن الـ Voluntary Counselling and Testing (VCT) في Assosa. الـ general objective بتاعها بيعمل إيه، والـ specific بتعمل إيه؟"
        answer: |
          الـ **general** (slide 60): ==to identify factors that affect the acceptability of VCT services== ويقيّم إدراك المجتمع لخدمات الرعاية للـ HIV/AIDS. ده الغرض كله في جملة.

          الـ **specific** بتكسّره لأجزاء تتقاس: knowledge وattitude وpractice للمجتمع، الـ barriers، والـ awareness. كل واحد منهم سؤال صغير ليه داتا خاصة بيه.
      - kind: figure
        remind: [res.L03.076]
        page: 62
        quote: "Example:\nGeneral objective: To estimate prevalence of depression among diabetes mellitus patients attending Smouha Health Center in Alexandria.\nSpecific objectives:\n  1- Identify the socio-demographic characteristics of patients with diabetes attending Smouha Health Center\n  2- Determine the prevalence of depression among diabetic patients attending Smouha Health Center\n  3- Identify risk factors that may predispose to development of depression among diabetic patients attending Smouha Health Center."
        title: "مثال سموحة"
        alt: "A tree: the general objective box at the top (estimate prevalence of depression among diabetic patients at Smouha Health Center, Alexandria) branches into three specific objectives: socio-demographic characteristics, prevalence of depression, risk factors for depression."
        caption: "هدف عام واحد فوق، وتحته 3 أهداف خاصة. لاحظ إن كل specific objective بيبدأ بـ action verb وفيه نفس المكان."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="76" rx="8" class="fg-acc"/>
            <text x="165" y="32" text-anchor="middle" class="t-sm t-mut">General objective</text>
            <text x="165" y="52" text-anchor="middle" class="t-sm t-b">Estimate prevalence of depression</text>
            <text x="165" y="70" text-anchor="middle" class="t-sm t-b">among DM patients, Smouha HC</text>
            <path d="M165 86v24M40 110h250M40 110v18M165 110v18M290 110v18" class="fg-ink"/>
            <rect x="10" y="130" width="310" height="60" rx="8" class="fg-good"/>
            <text x="20" y="153" class="t-sm t-b">1. Identify</text>
            <text x="20" y="173" class="t-sm">socio-demographic characteristics</text>
            <rect x="10" y="200" width="310" height="60" rx="8" class="fg-good"/>
            <text x="20" y="223" class="t-sm t-b">2. Determine</text>
            <text x="20" y="243" class="t-sm">prevalence of depression</text>
            <rect x="10" y="270" width="310" height="60" rx="8" class="fg-good"/>
            <text x="20" y="293" class="t-sm t-b">3. Identify</text>
            <text x="20" y="313" class="t-sm">risk factors for depression</text>
            <text x="10" y="350" class="t-sm t-mut">Specific = smaller portions of the general</text>
          </svg>
      - kind: check
        page: 61
        quote: "Example 2. A study looking into factors influencing utilization of maternal health care services in X District has the following objectives:\nGeneral objective: To assess factors influencing utilization of maternal healthcare services in District X.\nSpecific Objectives:\n  To assess the knowledge, attitude and practice of pregnant women regarding antenatal care, and TT vaccination,\n  To identify factors that influence women's attendance at antenatal care (ANC) and institutional delivery care services,\n  To identify the sources of delivery service and mothers' preference of place of delivery,\n  To determine coverage with ANC and TT vaccination among mothers."
        question: "In a study of factors influencing use of maternal health services in District X, \"To determine coverage with antenatal care (ANC) and tetanus toxoid (TT) vaccination among mothers\" is:"
        options:
          - "A specific objective"
          - "The general objective"
          - "A hypothesis"
          - "The research question"
        answer: 0
        why:
          - "صح: حتة صغيرة ومفصّلة من الهدف العام."
          - "الهدف العام كان \"To assess factors influencing utilization of maternal healthcare services in District X\"."
          - "مفيهاش أي تنبؤ."
          - "دي جملة بـ action verb، مش سؤال."
      - kind: aside
        tone: exam
        page: 63
        quote: "Examples of objectives:\n  \"To understand the prevalence of depression\": No action verb (vague), No time, no population, no place\n  \"To estimate prevalence of depression among all school pupils in Egypt\": Not feasible; No time\n  \"To eradicate hepatitis C in Egypt by the year 2022\": Not realistic"
        text: |
          الممتحن بيحب يديك objective ويقولك "What is missing". افحصه بالترتيب ده:

          - **Action verb**؟
          - **Population**؟
          - **Place**؟
          - **Time**؟
          - وبعدين: **feasible**؟ **realistic**؟
      - kind: case
        page: 63
        quote: "Examples of objectives:\n  \"To understand the prevalence of depression\": No action verb (vague), No time, no population, no place\n  \"To estimate prevalence of depression among all school pupils in Egypt\": Not feasible; No time\n  \"To eradicate hepatitis C in Egypt by the year 2022\": Not realistic"
        stem: "المشرف رجّعلك تلات objectives مكتوب جنبهم علامة حمرا. اعرف الغلط في كل واحد."
        steps:
          - question: "\"To understand the prevalence of depression.\""
            options:
              - "No action verb (vague), no time, no population, no place"
              - "Not realistic for one researcher to achieve"
              - "Not feasible in the time and budget available"
            answer: 0
            why: "المحاضرة: **No action verb (vague), No time, no population, no place**."
          - question: "\"To estimate prevalence of depression among all school pupils in Egypt.\""
            options: ["Not feasible, and no time", "No action verb", "No population named"]
            answer: 0
            why: "كل تلاميذ مصر؟ **Not feasible**، ومفيش وقت."
          - question: "\"To eradicate hepatitis C in Egypt by the year 2022.\""
            options: ["Not realistic", "No time", "No action verb"]
            answer: 0
            why: "فيه verb وفيه وقت، بس **not realistic** كهدف لبحث."
      - kind: table
        page: 64
        quote: "Examples:\n  \"To identify the socio-demographic characteristics of patients with diabetes\". What is missing? Place; Time\n  \"To estimate prevalence of depression in Smouha Health Center in Alexandria.\" What is missing? No population, no time"
        title: "What is missing?"
        columns: ["Objective", "Missing"]
        rows:
          - ["To identify the socio-demographic characteristics of patients with diabetes", "Place, time"]
          - ["To estimate prevalence of depression in Smouha Health Center in Alexandria", "Population, time"]
        hide: [[0, 1], [1, 1]]
      - kind: reveal
        page: 59
        quote: "Specific objectives:\n  The specific research objectives identify in greater detail the specific aims of the research project.\n  Specific objectives should systematically address the various aspects of the research problem.\n  They should specify what you would do in your study, where and for what purpose"
        prompt: "ليه مش كفاية هدف عام واحد؟"
        answer: |
          لأن الهدف العام **general terms**: بيقول "هعمل إيه وليه" من بعيد.

          الـ specific objectives بتقول **in greater detail** هتعمل إيه، فين، وعلشان إيه، و**systematically address the various aspects** of the problem. ومنها بتطلع الـ variables والـ questionnaire والـ analysis plan.
      - kind: try
        items: [res.L03.072, res.L03.073, res.L03.075, res.L03.109]
    recap:
      - "General objective: in general terms، إيه وليه، مرتبط بالـ statement of the problem."
      - "Specific objectives: smaller portions، تفاصيل: إيه، فين، علشان إيه."
      - "افحص أي objective: action verb، population، place، time، feasible، realistic."
      - "To understand… = vague. كل تلاميذ مصر = not feasible. نقضي على hepatitis C virus (HCV) في 2022 = not realistic."
    practice: [res.L03.072, res.L03.073, res.L03.074, res.L03.075, res.L03.076, res.L03.077, res.L03.078, res.L03.079, res.L03.080, res.L03.081, res.L03.082, res.L03.109]  # ------------------------------------------------------------------
  - id: res.L03.lesson7
    title: "الفرضية"
    hook: "الفرضية تنبؤ بتراهن عليه، والعنوان هو أول حاجة المراجع هيقراها. الاتنين لازم يبقوا محددين."
    minutes: 9
    pages: [66, 74]
    topics: [hypotheses]
    goals:
      - "تعرّف الـ hypothesis وتعرف إمتى بنحتاجها"
      - "تفرّق بين null و directional و non-directional"
      - "تكتب عنوان 10–12 كلمة من غير كلام زيادة ولا اختصارات"
    status: unverified
    steps:
      - kind: explain
        remind: [res.L03.086]
        page: 66
        quote: "Research hypothesis:\n  A hypothesis can be defined as \"a prediction or explanation of the relationship between two or more variables. A hypothesis, in other words, translates the problem statement into a precise, unambiguous predication of expected outcomes.\"\n  Hypothesis statements are most applicable for analytic and intervention or evaluative studies.\n  Descriptive or exploratory studies do not normally require hypothesis statements because they generally do not test relationships between variables."
        title: "يعني إيه hypothesis؟"
        text: |
          الـ ==hypothesis== هي **a prediction or explanation of the relationship between two or more variables**.

          بتترجم الـ problem statement لتنبؤ **precise, unambiguous** بالنتيجة المتوقعة.

          وبتتكتب **from the research question before the start of the study**، وبتوجّه: الـ study design، الـ population، الـ data اللي هتتجمع، والـ analysis. ومعاييرها هي نفس **PICOT**.

          السلايد فيه سهم: **independent variables** ← cause, determine or influence ← **dependent variable**. الـ dependent هو اللي بيتأثر (الـ outcome). يعني في H. pylori والـ peptic ulcer: الـ infection هي independent والـ ulcer هو dependent.

          ملحوظة: الصوت في فيديو المحاضرة بيخلص بعد الـ general و specific objectives، فالفرضيات والعنوان اتعرضوا سلايدات من غير شرح.
      - kind: reveal
        page: 66
        quote: "Research hypothesis:\n  A hypothesis can be defined as \"a prediction or explanation of the relationship between two or more variables. A hypothesis, in other words, translates the problem statement into a precise, unambiguous predication of expected outcomes.\"\n  Hypothesis statements are most applicable for analytic and intervention or evaluative studies.\n  Descriptive or exploratory studies do not normally require hypothesis statements because they generally do not test relationships between variables."
        prompt: "ليه الـ descriptive study عادةً مش محتاجة hypothesis؟"
        answer: |
          لأن الـ hypothesis بتتنبأ بـ **relationship between variables**، والـ descriptive أو exploratory studies **generally do not test relationships between variables**.

          علشان كده الـ hypotheses ==most applicable for analytic and intervention (evaluative) studies==.
      - kind: explain
        remind: [res.L03.086]
        page: 67
        quote: "Research hypothesis: Developed from the research question before the start of the study.\nA well-designed research hypothesis guides:\n  Decisions on study design\n  Population\n  Data to be collected\n  Data analysis"
        title: "الفرضية بتتعمل إمتى وبتعمل إيه؟"
        text: |
          الـ **research hypothesis** بتتطلع من السؤال ==قبل ما الدراسة تبدأ==. والفرضية الكويسة بتوجّه:

          - قرار الـ **study design**.
          - الـ **population**.
          - الداتا اللي هتتجمع.
          - الـ **data analysis**.

          ليه قبل البداية؟ لأن لو كتبتها بعد ما شفت الداتا، هتكتب اللي الداتا قالته، وده مش اختبار، ده وصف. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 68
        quote: "Criteria for a good research hypothesis: PICOT\n| Letter | Element | Question |\n|---|---|---|\n| P | Population | What specific patient population are you interested in? |\n| I | Intervention | What is your investigational intervention? |\n| C | Comparison Group | What is the main alternative to compare with the intervention? |\n| O | Outcome | What do you intend to accomplish, measure, improve or affect? |\n| T | Time | What is the appropriate follow-up time to assess the outcome? |"
        title: "شروط الفرضية الكويسة: نفس PICOT"
        text: |
          مفيش حاجة جديدة تحفظها: الفرضية الكويسة فيها نفس ==PICOT== بتاع السؤال: **P**opulation، **I**ntervention، **C**omparison group، **O**utcome، **T**ime.

          منطقي، لأن الفرضية هي نفس السؤال متحوّل لجملة بتتوقّع إجابة.
      - kind: explain
        page: 69
        quote: "The research hypotheses could be as follows:\n  Focused research question: Does post-menopausal hormone replacement therapy predispose women to develop endometrial cancer?\n  Hypothesis: Post-menopausal women who received hormone replacement therapy, (of a specified type and duration), are more likely to develop endometrial cancer than post-menopausal women who did not receive such therapy."
        title: "من سؤال لفرضية"
        text: |
          - **Question:** Does post-menopausal hormone replacement therapy (HRT) predispose women to develop endometrial cancer
          - **Hypothesis:** Post-menopausal women who received HRT (of a specified type and duration) are ==more likely to develop endometrial cancer== than those who did not.

          السؤال بيسأل، والفرضية بتراهن على إجابة.
      - kind: reveal
        page: 70
        quote: "The research hypotheses could be as follows:\n  Focused research question: Does smoking of husbands (more than 20 cigarettes a day) predispose their wives to have lower birth weight children?\n  Hypothesis: Children born to women whose husbands smoke more than 20 cigarettes a day are of lower birth weight than children born to women whose husbands do not smoke."
        prompt: "حوّل السؤال ده لفرضية: «Does smoking of husbands (more than 20 cigarettes a day) predispose their wives to have lower birth weight children?»"
        answer: |
          ==Children born to women whose husbands smoke more than 20 cigarettes a day are of lower birth weight than children born to women whose husbands do not smoke.==

          لاحظ اللي اتغير: السؤال بقى **جملة خبرية**، فيها مجموعتين بتتقارن (P وC)، وexposure محدد (أكتر من 20 سيجارة)، وoutcome يتقاس (birth weight).
      - kind: explain
        page: 71
        quote: "Two Types of Research Hypothesis:\n  Non-directional: reflects a difference between groups, but the direction of the difference (unequal) is NOT specified.\n  Directional: reflects a difference between groups and the difference is specified."
        title: "Directional ولا non-directional؟"
        text: |
          النوعين بيقولوا فيه ==فرق بين المجموعات==. الفرق:

          - **Non-directional**: فيه فرق (unequal)، بس ==مش محدد اتجاهه==.
          - **Directional**: محدد الفرق رايح فين (أعلى أو أقل).

          مثال التدخين اللي فات **directional**: قال «lower birth weight»، مش «different».
