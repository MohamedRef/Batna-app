        why: "الأول الأرقام تقولك فيه مشكلة ولا لأ، بعدين المنحنى يقولك الساعة كام، وبعدين الأيام تقولك السبب."
      - kind: explain
        page: 169
        title: "ليه 5% في الـ TIR تفرق؟"
        quote: "Each 5% increase in TIR (70-180mg/dL or 3.9-10.0 mmol/L) is clinically\n   significant."
        text: |
          الكتاب بيقول كل ==5% increase in TIR== (70–180 mg/dL) **clinically significant**.

          يعني إيه 5%؟ اليوم 24 ساعة، فـ 5% حوالي **ساعة وربع** زيادة كل يوم في الـ range. التفسير المقبول (مش في الكتاب): الساعة دي بتتجمع على شهور الحمل، والجنين بيتعرض لسكر أقل طول الفترة، وده اللي بيقلل الـ LGA والـ neonatal hypoglycemia اللي الـ CGM اتعمل عشانهم. فما تستهونش بتحسّن صغير في التقرير.
