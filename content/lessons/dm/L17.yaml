            <text x="205" y="130" text-anchor="middle" class="t-sm t-b t-bad">Crush</text>
            <text x="205" y="146" text-anchor="middle" class="t-sm t-mut">whole body</text>
            <path d="M255 40 Q285 62 315 40 L315 110 Q285 88 255 110 Z" class="fg-acc"/>
            <text x="285" y="130" text-anchor="middle" class="t-sm t-b t-acc">Codfish</text>
            <text x="285" y="146" text-anchor="middle" class="t-sm t-mut">concave plates</text>
            <rect x="15" y="170" width="300" height="70" rx="8" class="fg-box"/>
            <rect x="40" y="182" width="90" height="46" rx="4" class="fg-ink"/>
            <circle cx="85" cy="194" r="9" class="fg-dot-acc"/>
            <path d="M85 172 L85 184" class="fg-arrow-acc"/>
            <text x="225" y="196" text-anchor="middle" class="t-sm t-b">Schmorl's node</text>
            <text x="225" y="214" text-anchor="middle" class="t-sm">common in osteoporosis</text>
            <text x="225" y="230" text-anchor="middle" class="t-sm t-mut">rare in osteomalacia</text>
            <text x="165" y="22" text-anchor="middle" class="t-sm t-mut">Lower thoracic, upper lumbar</text>
          </svg>
      - kind: explain
        page: 221
        title: "الـ codfish والـ Schmorl's node بيتعملوا إزاي؟"
        quote: "Schmorl's nodes form when the nucleus pulposus breaks through the weakened end-plate and herniates into the osteopenic vertebral body."
        text: |
          - **Codfishing**: في المرض المتقدم الـ end-plates بقت ==concave== لأن الـ intervertebral disk ==بينفخ== جوه الفقرة الضعيفة. التفسير المقبول (مش في الكتاب): الـ disk بيفضل بضغطه الطبيعي، والفقرة اللي حواليه هي اللي بقت طرية، فالـ disk بيكسب.
          - **Schmorl's node**: الـ ==nucleus pulposus== بيخرم الـ end-plate الضعيف ويدخل في جسم الفقرة.

          الـ biconcavity والكسور موجودين في كل أمراض العضم الـ metabolic، بس الـ Schmorl's nodes أكتر في الـ **primary osteoporosis** ونادرة في الـ osteomalacia.

          وفين الكسور؟ lower thoracic and upper lumbar غالبًا. التفسير المقبول (مش في الكتاب): ده المكان اللي العمود بيتحرك فيه أكتر وبيشيل أتقل وزن.
