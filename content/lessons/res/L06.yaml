      - kind: order
        page: 46
        quote: "Steps in Planning, Designing and Conduct of a Randomized Controlled Clinical trial:\n  Step 1 - Deciding - Is clinical trial really required? Should it be done? Can it be done?\n  Step 2 - Clearly state the research hypothesis\n  Step 3 - Enumerate the inclusion and exclusion criteria.\n  Step 4 - Defining the populations\n  Step 5 - Sample Size Calculation\n  Step 6 - Detailed Descriptions of Measurement Protocols\n  Step 7 - Enrolling the Participants"
        prompt: "رتّب أول 7 خطوات:"
        steps:
          - "Is a trial really required?"
          - "State the research hypothesis"
          - "Inclusion and exclusion criteria"
          - "Define the populations"
          - "Sample size calculation"
          - "Measurement protocols"
          - "Enrol the participants"
      - kind: explain
        page: 48
        quote: "Step 1 - Deciding - Is clinical trial really required? Should it be done? Can it be done?\n  Firstly, a detailed review of literature should be undertaken\n  Meta-analysis of published and even unpublished papers are also advisable because that may answer the issue"
        title: "Step 1: هو احنا محتاجين؟"
        text: |
          قبل ما تصرف فلوس وتعرّض ناس لدوا: ==detailed review of literature==.

          ويُفضّل كمان **meta-analysis** للـ published وحتى الـ **unpublished** papers، لأن ممكن تلاقي السؤال **اتجاوب خلاص**. مفيش داعي تعيد اختراع العجلة على حساب العيانين.
      - kind: explain
        remind: [res.L06.072]
        page: 49
        quote: "Step 2 - Clearly state the research hypothesis and question and the variables of study:\n  Clearly state hypothesis: We hypothesize that the 2-year mortality risk in patients receiving treatment A is 30% lower than mortality risk among those receiving standard treatment\n  The exposure variable\n  Co-Interventions.\n  The outcome variable\n  Confounding variable"
        title: "Step 2: الـ hypothesis والـ variables"
        text: |
          الـ hypothesis لازم تبقى **محددة**. مثال المحاضرة:

          «We hypothesize that the **2-year mortality risk** in patients receiving **treatment A** is **30% lower** than among those receiving **standard treatment**.»

          شايف؟ فيها الـ outcome، والمدة، والمقارنة، وحجم الفرق.

          وحدد كمان الـ variables: ==exposure variable==، **co-interventions**، **outcome variable**، و **confounding variables**.
      - kind: reveal
        page: 50
        quote: "Clinical Question: In people who take long-haul flights does wearing graduated compression stockings prevent DVT?"
        prompt: "السؤال ده: «In people who take long-haul flights does wearing graduated compression stockings prevent deep vein thrombosis (DVT)?» فكّكه: مين، إيه، قصاد إيه، والنتيجة؟"
        answer: |
          - **Population**: ناس راكبين **long-haul flights**.
          - **Intervention**: **graduated compression stockings**.
          - **Comparison**: من غير stockings.
          - **Outcome**: **DVT**.

          ده نفس الـ PICO اللي خدتها في محاضرة الـ research question. السؤال الواضح بيطلّع trial واضح.
      - kind: explain
        page: 51
        quote: "Types of Outcomes:\n  Disease aspect: Mortality or survival rate, lab tests, complications, major events, side effects\n  Patient aspect: Health-related quality of life, symptoms, activities of daily life\n  Economic aspect: Service utilization (length of hospital stay)"
        title: "الـ outcomes: 3 زوايا"
        text: |
          - ==Disease aspect==: mortality أو survival rate، lab tests، complications، major events، side effects.
          - ==Patient aspect==: health-related **quality of life**، symptoms، activities of daily life.
          - ==Economic aspect==: service utilization زي **length of hospital stay**.
      - kind: sort
        page: 51
        quote: "Types of Outcomes:\n  Disease aspect: Mortality or survival rate, lab tests, complications, major events, side effects\n  Patient aspect: Health-related quality of life, symptoms, activities of daily life\n  Economic aspect: Service utilization (length of hospital stay)"
        prompt: "كل outcome تبع أنهي زاوية؟"
        bins: ["Disease", "Patient", "Economic"]
        cards:
          - { text: "28-day mortality", bin: 0 }
          - { text: "Serum creatinine", bin: 0 }
          - { text: "Variceal bleeding complication", bin: 0 }
          - { text: "Quality-of-life score", bin: 1 }
          - { text: "Can dress and bathe alone", bin: 1 }
          - { text: "Length of hospital stay", bin: 2 }
        why: "Disease: الموت، التحاليل، المضاعفات. Patient: إحساسه وحياته اليومية. Economic: استخدام الخدمة، زي عدد أيام المستشفى."
      - kind: explain
        remind: [res.L06.075]
        page: 52
        quote: "The best outcome measures are:\n  1. Objective\n  2. Clinically relevant end points such as disease rates, death, recovery, complications, or\n  3. Hospital/ER use.\n  4. It is important that all outcomes are measured with accuracy and precision, and,\n  5. Measured in the same manner in both groups or arms."
        title: "أحسن outcome يبقى إزاي؟"
        text: |
          - **Objective**
          - **Clinically relevant end points**: disease rates، death، recovery، complications
          - أو **hospital/ER use**
          - متقاس بـ **accuracy and precision**
          - و ==measured in the same manner in both groups==

          آخر نقطة دي أهم واحدة: لو مجموعة بتتقاس بجهاز والتانية بالعين، الفرق ممكن يبقى من القياس مش من الدوا.
      - kind: explain
        remind: [res.L06.077]
        page: 53
        quote: "Step 3 - Enumerate the inclusion and exclusion criteria:\n  Goal is to identify the sub-population of patients in whom the intervention is feasible, and that will produce the desired effect.\n  The choice of inclusion criteria represents a balance between picking the people who are most likely to benefit without sacrificing the generalizability of the study.\n  Specific inclusion criteria are used to optimize the following:\n    The rate of the primary outcome\n    The expected efficacy of treatment\n    The generalizability of the results\n    The recruitment, follow-up, and compliance of patients"
        title: "Step 3: الـ inclusion criteria"
        text: |
          الهدف: نلاقي الـ **sub-population** اللي الـ intervention **feasible** فيهم وهيعمل التأثير المطلوب.

          والاختيار ده ==balance==: تختار اللي **أغلب ظنك هيستفيدوا** من غير ما تضيّع الـ **generalizability**.

          الـ inclusion criteria بتحسّن 4 حاجات: **rate of the primary outcome**، الـ **expected efficacy**، الـ **generalizability**، والـ **recruitment, follow-up and compliance**.
      - kind: explain
        page: 54
        quote: "Exclusion Criteria:\n  a. When the treatment is unlikely to be effective because the disease is too severe, or too mild, or perhaps the patient has already received (and failed) the treatment.\n  b. When the patient has other conditions (co-morbidities) that would either interfere with the intervention, or the measurement of the outcome, or the expected length of follow-up e.g., terminal cancer.\n  c. When the patient is unlikely to complete follow-up or adhere to the protocol.\n  d. Other practical reasons e.g., language/cognitive barriers/no phone at home etc."
        title: "الـ exclusion criteria"
        text: |
          بنستبعد لما:

          - العلاج **مش متوقع يشتغل**: المرض **too severe** أو **too mild**، أو العيان **جرّب العلاج وفشل** قبل كده.
          - فيه ==co-morbidities== هتبوّظ الـ intervention، أو قياس الـ outcome، أو مدة الـ follow-up (زي **terminal cancer**).
          - العيان **مش هيكمّل الـ follow-up** أو مش هيلتزم بالـ protocol.
          - أسباب عملية: **language/cognitive barriers**، أو **no phone at home**.

          الدكتورة ذكرت في الشرح الـ ==run-in period==: فترة قصيرة **قبل الـ randomization** بنختبر فيها التزام المرشحين (بياخدوا الدوا ولا لأ)، علشان نستبعد اللي مش هيلتزم قبل التوزيع.
      - kind: check
        page: 54
        quote: "Exclusion Criteria:\n  a. When the treatment is unlikely to be effective because the disease is too severe, or too mild, or perhaps the patient has already received (and failed) the treatment.\n  b. When the patient has other conditions (co-morbidities) that would either interfere with the intervention, or the measurement of the outcome, or the expected length of follow-up e.g., terminal cancer.\n  c. When the patient is unlikely to complete follow-up or adhere to the protocol.\n  d. Other practical reasons e.g., language/cognitive barriers/no phone at home etc."
