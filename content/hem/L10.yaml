items:
  # ---------- p156: definitions ----------
  - id: hem.L10.001
    kind: card
    topic: definitions
    front: Define true polycythemia.
    back: An absolute increase in total red cell volume (mass), shown as a raised Hb concentration or packed cell volume (PCV).
    src: { page: 156, quote: "True Polycythemia refers to an absolute increase in total blood cell volume or mass manifested as raised HB concentration or packed cell volume (PCV)." }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.002
    kind: card
    topic: definitions
    front: How is true polycythemia divided?
    back: "Primary: polycythemia vera (clonal). Secondary: raised erythropoietin, with or without hypoxia."
    src: { page: 156, quote: "1) Primary polycythemia vera (clonal), 2) Secondary (increased eythropoietin in the presence or absence of hypoxia,)" }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.003
    kind: card
    topic: definitions
    front: Define relative polycythemia.
    back: A raised Hb concentration due to a reduced plasma volume (red cell mass is not increased).
    src: { page: 156, quote: "Relative polycythemia a raised Hb concentration secondary to reduction in plasma volume." }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.004
    kind: card
    topic: definitions
    front: Define polycythemia rubra vera (PRV).
    back: A neoplastic clonal disorder of the marrow stem cell causing excess proliferation of the erythroid, myeloid and megakaryocytic lineages, with a risk of thrombotic complications.
    src: { page: 156, quote: "Is a neoplastic clonal disorder of the BM stem causing excessive proliferation of erythroid, myeloid and megakaryocytic lineages" }
    status: unverified
    tags: [high-yield]
  # ---------- p156-157: PV pathophysiology ----------
  - id: hem.L10.005
    kind: card
    topic: pv-biology
    front: How does erythropoiesis in PV relate to erythropoietin, and what is the serum EPO?
    back: It is autonomous, independent of erythropoietin; serum EPO is normal or reduced.
    src: { page: 156, quote: "Erythropoiesis is autonomous independent on erythropoietin. Serum erytrpoietin level is normal or reduced." }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.006
    kind: enumerate
    topic: pv-biology
    prompt: To which growth factors are PV erythroid progenitors hypersensitive?
    points: [Insulin-like growth factor, Thrombopoietin, IL-3, GM-CSF]
    pass: 3
    src: { page: 157, quote: "Hypersensetivity of erythroid pogenitors to growth factors as insulin like growth factor, thrombopoietin, IL-3 and GM-CSF." }
    status: unverified
  - id: hem.L10.007
    kind: cloze
    topic: pv-biology
    text: "Chromosomal abnormalities occur in {{c1::20–30%}} of PV, are non-specific, and the commonest is {{c2::del 20q}}."
    src: { page: 157, quote: "Chromosomal abnormalities occur in 20-30%, non specific, the commonest, del 20q, trisomy 20, trisomy8, trisomy 9" }
    status: unverified
    tags: [numbers]
  - id: hem.L10.008
    kind: enumerate
    topic: pv-biology
    prompt: Enumerate the chromosomal abnormalities listed in PV.
    points: [del 20q (commonest), Trisomy 20, Trisomy 8, Trisomy 9, Duplication of part of 1q, Deletion of part of 13q]
    pass: 4
    src: { page: 157, quote: "duplication of part of long arm of ch 1 and deletion of part of long arm of ch13." }
    status: unverified
  - id: hem.L10.009
    kind: enumerate
    topic: pv-biology
    prompt: Enumerate the molecular changes in PV other than JAK2.
    points:
      - "Overexpression of PRV1 in granulocytes (separates primary from secondary)"
      - "Overexpression of anti-apoptotic Bcl-xL in progenitors"
      - "Reduced expression of the TPO receptor c-mpl"
    pass: 3
    src: { page: 157, quote: "Overexpression of PRV1 gene in granulocytes (used in DD between primary and secondary )" }
    status: unverified
  - id: hem.L10.010
    kind: card
    topic: pv-biology
    front: What is PRV1 overexpression in granulocytes used for?
    back: Differentiating primary (PV) from secondary polycythemia.
    src: { page: 157, quote: "Overexpression of PRV1 gene in granulocytes (used in DD between primary and secondary )" }
    status: unverified
  - id: hem.L10.011
    kind: cloze
    topic: pv-biology
    text: "In PV about {{c1::96%}} carry JAK2 V617F (exon {{c2::14}}) and about {{c3::3%}} carry a JAK2 exon 12 mutation."
    src: { page: 157, quote: "approximately 96% and 3% displaying somatic activating mutations in exon 14 (JAK2V617F) and exon 12 of JAK2, respectively." }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L10.012
    kind: card
    topic: pv-biology
    front: Which signalling pathways does JAK2 V617F switch on in cell lines?
    back: Constitutive JAK2–STAT5, PI3K, ERK and Akt, giving cytokine-independent and EPO- or IL-3-hypersensitive growth.
    src: { page: 157, quote: "constitutive activation of JAK2 STAT5 and PI3K, ERK and Akt pathways." }
    status: unverified
  - id: hem.L10.013
    kind: card
    topic: pv-biology
    front: Does JAK2 V617F or its allele burden change survival or leukemic transformation in PV?
    back: No, it does not appear to.
    src: { page: 157, quote: "JAK2V617F presence or increased allele burden does not appear to affect survival or leukemic transformation in PV." }
    status: unverified
  - id: hem.L10.014
    kind: card
    topic: pv-biology
    front: What is a higher JAK2 V617F allele burden associated with in PV?
    back: Pruritus and fibrotic transformation. JAK2 V617F also clusters with older age, higher Hb, leukocytosis and a lower platelet count.
    src: { page: 157, quote: "a higher JAK2V617F mutant allele burden has been associated with pruritus and fibrotic transformation." }
    status: unverified
  - id: hem.L10.015
    kind: card
    topic: pv-biology
    front: How do JAK2 exon 12-positive PV patients present?
    back: Predominantly erythroid myelopoiesis, subnormal serum EPO and younger age at diagnosis; prognosis is similar to JAK2 V617F.
    src: { page: 157, quote: "JAK2 exon 12 mutation-positive patients usually present with predominantly erythroid myelopoiesis, subnormal serum erythropoietin level and younger age at diagnosis" }
    status: unverified
  - id: hem.L10.016
    kind: mcq
    topic: pv-biology
    stem: "A 34-year-old man has Hb 19.2 g/dL with normal WBC and platelets, a low serum EPO and no splenomegaly. JAK2 V617F is negative. Which test is most likely to confirm PV?"
    options:
      - JAK2 exon 12 mutation analysis
      - BCR-ABL1 PCR
      - CALR mutation analysis
      - Hemoglobin electrophoresis only
      - Serum B12
    answer: 0
    why:
      - "Correct: about 3% of PV carry JAK2 exon 12; they are younger, with isolated erythroid expansion and low EPO (p157)."
      - BCR-ABL1 defines CML, not PV.
      - CALR is found in ET and PMF, not PV.
      - A high-affinity Hb would raise, not lower, EPO.
      - B12 is often raised in PV but does not confirm it.
    src: { page: 157, quote: "JAK2 exon 12 mutation-positive patients usually present with predominantly erythroid myelopoiesis, subnormal serum erythropoietin level and younger age at diagnosis" }
    status: unverified
  # ---------- p158-159: PV clinical features ----------
  - id: hem.L10.017
    kind: cloze
    topic: pv-clinical
    text: "PV has an incidence of {{c1::2–3 per 100,000}}, a median age at onset of {{c2::55–60 years}}, and an insidious onset."
    src: { page: 158, quote: "Incidence 2-3 per 100,000 Male to female ratio 0.81.2 Median age at onset 55-60y Symptoms are often insidious in onset." }
    status: unverified
    tags: [numbers]
  - id: hem.L10.018
    kind: card
    topic: pv-clinical
    front: How does hyperviscosity cause symptoms in PV?
    back: The marked rise in blood cells impairs the microcirculation, causes sludging and thrombosis, and reduces oxygen delivery.
    src: { page: 158, quote: "which impairs microcirculation, sludgging of blood flow, and thrombosis, poor oxygen delivery" }
    status: unverified
  - id: hem.L10.019
    kind: enumerate
    topic: pv-clinical
    prompt: Enumerate the hyperviscosity symptoms of PV.
    points: [Headache, Dizziness, Vertigo, Tinnitus, Visual disturbances, Angina pectoris, Intermittent claudication]
    pass: 5
    src: { page: 158, quote: "Headache, Dizziness, Vertigo, Tinnitus, Visual disturbances, angina pectoris, or Intermittent claudication." }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.020
    kind: cloze
    topic: pv-clinical
    text: "Bleeding complications occur in about {{c1::1%}} of PV: epistaxis, gum bleeding, ecchymosis and {{c2::GI bleeding}}."
    src: { page: 158, quote: "Bleeding complications (1%) include epistaxis, gum bleeding, ecchymosis, and GI bleeding." }
    status: unverified
    tags: [numbers]
  - id: hem.L10.021
    kind: table
    topic: pv-clinical
    title: Thrombotic complications of PV
    columns: [Type, Examples]
    rows:
      - [Arterial, "MI, stroke, TIA, scotomata, mesenteric artery occlusion, limb ischemia"]
      - [Venous, "Splanchnic (mesenteric, splenic, hepatoportal), superficial thrombophlebitis, DVT, PE"]
      - [Microvascular, "Erythromelalgia: burning fingers and toes"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 158, quote: "Microvascular occlusions affecting extremities (erythromelalgia) burning sensation of fingers and toes." }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.022
    kind: card
    topic: pv-clinical
    front: What is erythromelalgia?
    back: A microvascular occlusion of the extremities in PV, felt as burning of the fingers and toes.
    src: { page: 158, quote: "Microvascular occlusions affecting extremities (erythromelalgia) burning sensation of fingers and toes." }
    status: unverified
  - id: hem.L10.023
    kind: enumerate
    topic: pv-clinical
    prompt: Enumerate the causes of thrombosis in PV.
    points: [Raised PCV with increased viscosity and abnormal RBC rheology, Abnormal platelet–endothelial contact, Thrombocytosis, Pro-coagulant platelet changes, Pre-existing vascular disease]
    pass: 4
    src: { page: 159, quote: "Abnormal platelet-endothelial contact 3. Thrombocytosis 4. Pro-coagulant changes of the platelet 5. Pre-existing vascular disease" }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.024
    kind: card
    topic: pv-clinical
    front: Why do PV patients get abdominal pain?
    back: Peptic ulcer from raised histamine and gastric acidity, or thrombosis (Budd–Chiari, portal or mesenteric vein).
    src: { page: 159, quote: "PV is associated with increased histamine levels and gastric acidity or possible Budd Chiari (hepatic vein thrombosis), or portal vein or mesenteric vein thrombosis." }
    status: unverified
  - id: hem.L10.025
    kind: card
    topic: pv-clinical
    front: Why do PV patients get early satiety and weight loss?
    back: The enlarged spleen impairs gastric filling; weight loss comes from early satiety or the clone's increased myeloproliferative activity.
    src: { page: 159, quote: "Weight loss may be due to early satiety or from the increased myeloproliferative activity of the abnormal clone." }
    status: unverified
  - id: hem.L10.026
    kind: card
    topic: pv-clinical
    front: "Pruritus in PV: cause, trigger and frequency?"
    back: Histamine released from increased basophils and mast cells; worse after a warm bath or shower and with iron deficiency; up to 40% of patients.
    src: { page: 159, quote: "Pruritus is due to increased histamine levels released from increased basophils and mast cells and usually is exacerbated by a warm bath or shower" }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.027
    kind: cloze
    topic: pv-clinical
    text: "In PV, splenomegaly is present in {{c1::75%}} at diagnosis and hepatomegaly in about {{c2::30%}}; pruritus affects up to {{c3::40%}}."
    src: { page: 159, quote: "Splenomegaly is present in 75% of patients at the time of diagnosis Hepatomegaly is present in approximately 30% of patients with PV." }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L10.028
    kind: card
    topic: pv-clinical
    front: What is plethora in PV, and where is it seen?
    back: A ruddy skin colour from the large red cell mass, seen in the face, palms, nail beds, mucosa and conjunctiva.
    src: { page: 159, quote: "This manifests in the face, palms, and nail beds as well as mucosa and conjunctiva." }
    status: unverified
  - id: hem.L10.029
    kind: card
    topic: pv-clinical
    front: What is Gaisbock syndrome, and how is it told apart from PV?
    back: Hypertension with pseudo-polycythemia (high Hb from a low plasma volume). The red cell mass separates it from PV.
    src: { page: 159, quote: "The red cell mass should differentiate PV from Gaisbock syndrome, which is hypertension and pseudo-polycythemia" }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.030
    kind: mcq
    topic: pv-clinical
    stem: "A 61-year-old man complains of severe itching every time he takes a hot shower. He has a ruddy face and a palpable spleen. Hb 19.5 g/dL. What causes his itching?"
    options:
      - Histamine from increased basophils and mast cells
      - Cholestasis from Budd–Chiari syndrome
      - Uremia
      - Iron overload
      - Allergy to soap
    answer: 0
    why:
      - "Correct: PV pruritus comes from histamine released by increased basophils and mast cells, worse with a warm bath (p159)."
      - Nothing suggests hepatic vein thrombosis or jaundice.
      - Renal failure is not suggested.
      - Iron deficiency, not overload, worsens PV itch.
      - Aquagenic itch with plethora and splenomegaly points to PV.
    src: { page: 159, quote: "Pruritus is due to increased histamine levels released from increased basophils and mast cells and usually is exacerbated by a warm bath or shower" }
    status: unverified
  - id: hem.L10.031
    kind: mcq
    topic: pv-clinical
    stem: "A 48-year-old obese, hypertensive smoker on a thiazide has Hb 17.8 g/dL. Red cell mass is normal and plasma volume is reduced. What is the diagnosis?"
    options:
      - Gaisbock syndrome (apparent polycythemia)
      - Polycythemia vera
      - Secondary polycythemia from hypoxia
      - Chuvash polycythemia
      - Primary familial polycythemia
    answer: 0
    why:
      - "Correct: hypertension with high Hb from low plasma volume and a normal red cell mass is pseudo-polycythemia (p159, p174)."
      - PV has a raised red cell mass.
      - Secondary polycythemia also raises the red cell mass.
      - Chuvash is an inherited, true polycythemia.
      - Primary familial polycythemia raises the red cell mass.
    src: { page: 159, quote: "The red cell mass should differentiate PV from Gaisbock syndrome, which is hypertension and pseudo-polycythemia" }
    status: unverified
  - id: hem.L10.032
    kind: mcq
    topic: pv-clinical
    stem: "A 57-year-old woman with PV describes episodes of burning pain and redness in her toes. What is the most likely cause?"
    options:
      - Erythromelalgia from microvascular occlusion
      - Gout
      - Raynaud phenomenon
      - Peripheral neuropathy from B12 deficiency
      - Hydroxyurea leg ulcers
    answer: 0
    why:
      - "Correct: microvascular occlusion of the extremities in PV causes erythromelalgia (p158)."
      - Gout affects joints, not burning digits with redness.
      - Raynaud causes pallor with cold, not burning redness.
      - B12 is usually raised in PV.
      - Ulcers are a drug effect and would be visible.
    src: { page: 158, quote: "Microvascular occlusions affecting extremities (erythromelalgia) burning sensation of fingers and toes." }
    status: unverified
  # ---------- p160: natural history ----------
  - id: hem.L10.033
    kind: order
    topic: pv-course
    prompt: Order the phases of the natural history of PV.
    steps:
      - "Proliferative phase: control of erythrocytosis and thrombosis prevention are urgent"
      - "Stable phase: normal counts without treatment (falling proliferation, early myelofibrosis)"
      - "Spent phase: extensive myelofibrosis, hepatosplenomegaly, pancytopenia"
    src: { page: 160, quote: "Followed by an advanced or spent phase (extensive myelofibrosis, progressive hepato-slenomegaly and pancytopenia)" }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.034
    kind: cloze
    topic: pv-course
    text: "The spent phase of PV develops in {{c1::10–15% after 10 years}} and {{c2::>30% after 20 years}}; median survival is then {{c3::<18 months}}."
    src: { page: 160, quote: "pancytopenia)10-15% after 10 years and >30% after 20 years , median survival <18 months" }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L10.035
    kind: cloze
    topic: pv-course
    text: "AML transformation in PV is about {{c1::1–3%}} with venesection, rising more than {{c2::10-fold}} with {{c3::32P, chlorambucil or irradiation}}."
    src: { page: 160, quote: "Is estimated 1-3% in patients treated with venesection. Increased to more than 10 folds when radioactive phosphorus (32P), chlorambucil or irradiation are used" }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L10.036
    kind: card
    topic: pv-course
    front: What is the median time to AML after 32P, chlorambucil or irradiation in PV?
    back: 5–8 years.
    src: { page: 160, quote: "chlorambucil or irradiation are used, median time 5-8 years." }
    status: unverified
    tags: [numbers]
  # ---------- p160-162: investigations ----------
  - id: hem.L10.037
    kind: card
    topic: pv-tests
    front: What does the full blood count show in PV, and why can the MCV be low?
    back: Raised red cell count and Hb; MCV low or normal because of iron deficiency. Neutrophils and platelets are raised (rare in secondary erythrocytosis).
    src: { page: 160, quote: "Neutrophil and platelet in PV (rare in 2ry erythrocytosis)" }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.038
    kind: card
    topic: pv-tests
    front: What happens to the NAP score in PV?
    back: It is raised.
    src: { page: 160, quote: "NAP score in PV" }
    status: unverified
  - id: hem.L10.039
    kind: card
    topic: pv-tests
    front: How are red cell mass and plasma volume measured?
    back: Red cell mass with the patient's RBCs labelled with ⁵¹Cr; plasma volume with ¹³¹I-labelled albumin.
    src: { page: 160, quote: "Red cell mass (measured using patient RBC labelled with 51Cr) and plasma volume (using 131 I labelled albumin) ." }
    status: unverified
  - id: hem.L10.040
    kind: cloze
    topic: pv-tests
    text: "A red cell mass raised by more than {{c1::25%}} (above predicted) is diagnostic."
    src: { page: 160, quote: "RCM > 25% is diagnostic." }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L10.041
    kind: table
    topic: pv-tests
    title: Red cell mass and plasma volume
    columns: [Measure, PV, Secondary erythrocytosis, Relative erythrocytosis]
    rows:
      - [Red cell mass, Raised, Raised, "Within normal range or normal"]
      - [Plasma volume, "Normal or raised", Normal, Reduced]
    blanks: [[0, 1], [0, 3], [1, 1], [1, 3]]
    src: { page: 160, quote: "Red cell mass ↑ ↑ ↑ Within NR or N Plasma volume N or ↑ N Reduced" }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.042
    kind: cloze
    topic: pv-tests
    text: "An arterial oxygen saturation (SaO2) below {{c1::92%}} suggests {{c2::secondary erythrocytosis}}."
    src: { page: 160, quote: "SaO2 <92% suggests 2ry erythrocytosis." }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L10.043
    kind: card
    topic: pv-tests
    front: Why is serum B12 often raised in PV?
    back: Raised transcobalamin, reflecting the associated granulocytosis.
    src: { page: 161, quote: "serum vit B12 commonly in PV due to transcobalamin reflecting associated granulocytosis." }
    status: unverified
  - id: hem.L10.044
    kind: enumerate
    topic: pv-tests
    prompt: Enumerate the screening tests in the work-up of polycythemia (besides the blood count).
    points:
      - "Hematinics: ferritin (low or normal), B12 (often raised), folate"
      - Renal function and uric acid (often raised)
      - LFTs
      - "Abdominal ultrasound (spleen, liver, kidneys, pelvis); CT abdomen, MRI brain"
      - "Chest X-ray, pulmonary function, echo when indicated"
      - Serum erythropoietin
      - JAK2 V617F
    pass: 5
    src: { page: 161, quote: "Abdomen U/S for hepatosplenomegaly, renal, pelvic abnormalities." }
    status: unverified
  - id: hem.L10.045
    kind: card
    topic: pv-tests
    front: Serum erythropoietin in PV versus secondary erythrocytosis?
    back: Low or subnormal in PV; normal or high in secondary erythrocytosis.
    src: { page: 161, quote: "Serum erythropoietin is low/subnormal in PRV , while normal/high in 2ry erythrocytosis." }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.046
    kind: cloze
    topic: pv-tests
    text: "JAK2 V617F testing has about {{c1::97%}} sensitivity and is virtually {{c2::100%}} specific for PV against other causes of a raised hematocrit."
    src: { page: 161, quote: "The laboratory detection of JAK2V617F is highly sensitive (97% sensitivity) and virtually 100% specific for distinguishing PV from other causes of increased hematocrit" }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L10.047
    kind: cloze
    topic: pv-tests
    text: "On cytogenetics, {{c1::30%}} of PV have abnormalities, typically 20q−, +8, +9 and 13q−."
    src: { page: 161, quote: "Cytogenetics 30% have abnormalities, typically 20q-, 8+, 9+, 13q-." }
    status: unverified
    tags: [numbers]
  - id: hem.L10.048
    kind: card
    topic: pv-tests
    front: What does a BFU-E culture show in PV?
    back: Progenitors with increased sensitivity to growth factors and endogenous erythroid colonies that grow without erythropoietin.
    src: { page: 161, quote: "development of endogenous erythroid colonies independent on erythrpoietin." }
    status: unverified
  - id: hem.L10.049
    kind: enumerate
    topic: pv-tests
    prompt: Enumerate the typical trephine biopsy features of PV.
    points: [Hypercellularity, Trilineage hyperplasia, "Abnormal megakaryocytes (clusters, giant forms, increased ploidy)", Increased fibrosis may be present, Normal histology does not exclude PV]
    pass: 4
    src: { page: 161, quote: "Abnormal megakaryocytes (clustering with giant forms and increased ploidy)" }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.050
    kind: card
    topic: pv-tests
    front: Why is marrow biopsy mandatory in suspected PV, and when is it repeated?
    back: It separates early PV with thrombocytosis from ET and helps when Hb is raised but below the WHO threshold. Repeat it if post-PV myelofibrosis or acute leukemia is suspected.
    src: { page: 162, quote: "BM biopsy is mandatory because it helps differentiate early PV with concomitant thrombocytosis from ET" }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.051
    kind: mcq
    topic: pv-tests
    stem: "A 55-year-old man has Hb 19 g/dL. Which result best separates PV from secondary erythrocytosis?"
    options:
      - Low serum erythropoietin
      - Raised red cell mass
      - Raised hematocrit
      - Normal MCV
      - Raised plasma volume
    answer: 0
    why:
      - "Correct: EPO is low or subnormal in PV but normal or high in secondary erythrocytosis (p161)."
      - Red cell mass is raised in both PV and secondary erythrocytosis (p160).
      - Both have a raised hematocrit.
      - MCV may be normal in both; it is often low in PV from iron deficiency.
      - Plasma volume may be normal or raised in PV and normal in secondary; it does not separate them.
    src: { page: 161, quote: "Serum erythropoietin is low/subnormal in PRV , while normal/high in 2ry erythrocytosis." }
    status: unverified
  - id: hem.L10.052
    kind: mcq
    topic: pv-tests
    stem: "A heavy smoker with COPD has Hb 18.6 g/dL. Pulse oximetry shows SaO2 88%. Platelets and WBC are normal. What is the most likely cause?"
    options:
      - Secondary erythrocytosis from hypoxia
      - Polycythemia vera
      - Relative polycythemia
      - Primary familial polycythemia
      - Essential thrombocythemia
    answer: 0
    why:
      - "Correct: SaO2 below 92% suggests secondary erythrocytosis; COPD and smoking are listed causes (p160, p170)."
      - PV usually has raised neutrophils and platelets and normal SaO2.
      - Relative polycythemia has a normal red cell mass; hypoxia drives a true rise here.
      - Primary familial polycythemia has normal oxygenation.
      - ET raises platelets, not Hb.
    src: { page: 160, quote: "SaO2 <92% suggests 2ry erythrocytosis." }
