      - kind: reveal
        page: 359
        prompt: "ليه الـ HCC بينوّر في الـ arterial ويطفي في الـ portal، والكبد العادي بيعمل العكس؟"
        answer: |
          الكبد الطبيعي بياخد **أغلب دمه من الـ portal vein**، فبيتملي contrast متأخر (في الـ portal phase).

          الـ HCC وهو بيتطور بيعمل أوعية جديدة من الـ **hepatic artery** (neoangiogenesis) وبيفقد الـ portal supply، فبيتملي **بدري جدًا** في الـ arterial phase (~35 ثانية)، وبعدين الـ contrast يخرج منه بسرعة وقت ما الكبد حواليه بيتملي من الـ portal، فيبان **أغمق** = **washout**. ده الـ **hypervascular pattern** اللي الكتاب بيقول عليه.
      - kind: check
        page: 359
        question: "On triphasic CT, a cirrhotic nodule hyperenhances in the late arterial phase but shows no washout in the portal venous phase. How does the book classify it?"
        options:
          - "Only suspicious for HCC"
          - "Diagnostic of HCC"
          - "Definitely benign"
          - "Cholangiocarcinoma"
        answer: 0
        why:
          - "صح: في مثال الكتاب، الـ lesion اللي نوّرت arterial **ومالهاش washout لسه** اتقالت **only suspicious**. التشخيص محتاج **الاتنين**."
          - "الـ diagnostic محتاج **arterial hyperenhancement + washout** مع بعض."
          - "الـ arterial enhancement في كبد cirrhotic ماينفعش تقول عليه benign وخلاص."
          - "الـ CCA بتاخد الـ contrast **بطيء من بره لجوه** (الدرس اللي فات)، مش wash-in بدري."
      - kind: explain
        page: 359
        title: "CT ولا MRI؟"
        text: |
          - **Triphasic CT:** أحسن من الـ US، و **highly specific**.
          - **MRI:** **T2 high**، **T1 low**. وأحسن من الـ CT في تفريق **dysplastic nodules**، **hemangioma**، و **focal fat** عن الـ HCC. بس **أقل توافرًا**.
          - **Cochrane:** الـ MRI ممكن **يفوّت لحد 16%** من الـ HCC، و **6%** من غير HCC ممكن يتعالجوا على الفاضي.
          - **Staging:** **CT chest** للـ lung mets (nodule بتنوّر = mets). **Bone scan** للـ bone mets، بس الـ **hot spots مش دايمًا mets**، لازم correlation.
      - kind: table
        page: 359
        title: "MRI مقابل CT في الكتاب"
        columns: ["", "Sensitivity", "Specificity"]
        rows:
          - ["MRI", "81%", "85%"]
          - ["CT", "68%", "93%"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2]]
      - kind: aside
        tone: tip
        page: 359
        text: |
          إزاي تفتكر؟ **MRI أحسن في الـ sensitivity** (بيلقط أكتر: 81 مقابل 68)، و **CT أحسن في الـ specificity** (لما يقول HCC غالبًا صح: 93 مقابل 85).

          قول: **«الـ MRI بيلقط، والـ CT بيأكّد»**.
      - kind: explain
        page: 360
        title: "LI-RADS والـ biopsy"
        text: |
          **LI-RADS** = Liver Imaging Reporting and Data System. **مايتطبّقش** على:
          - أقل من **18 سنة**.
          - cirrhosis من **congenital hepatic fibrosis**.
          - cirrhosis من **vascular disorders**: **Budd-Chiari**، **chronic portal vein occlusion**، **cardiac congestion**، **HHT**.

          **Biopsy:** غالبًا الـ HCC بيتشخّص **radiologically** في الـ cirrhosis من غير biopsy. نعملها لو:
          - الـ lesion **indeterminate**.
          - مريض **من غير cirrhosis ولا chronic HBV**.
          - شك في **metastatic disease** أو **cholangiocarcinoma**.

          الطريقة المفضّلة: **core-needle**، **ultrasound-guided percutaneous**.
      - kind: check
        page: 361
        question: "A 45-year-old with no cirrhosis and no HBV has a 4 cm arterial-enhancing liver mass with washout. Next step?"
        options:
          - "Core-needle, ultrasound-guided biopsy"
          - "Diagnose HCC on imaging and treat"
          - "Apply LI-RADS and stop"
          - "Repeat ultrasound in 3-4 months"
        answer: 0
        why:
          - "صح: الكتاب بيقول biopsy علشان نثبت الـ HCC في المرضى **من غير cirrhosis ولا chronic HBV**، والمفضّل **core-needle US-guided**."
          - "التشخيص بالـ imaging لوحده في **الـ cirrhosis**، مش هنا."
          - "الـ LI-RADS معمول لـ at-risk population، والمريض ده مش منهم."
          - "المتابعة كل 3–4 شهور للـ lesion **أقل من 1 cm**، مش mass 4 cm."
      - kind: reveal
        page: 360
        prompt: "ليه LI-RADS ماينفعش في cirrhosis من Budd-Chiari أو cardiac congestion؟"
        answer: |
          الـ LI-RADS مبني على إن «nodule بتنوّر arterial وتعمل washout في كبد cirrhotic = HCC»، وده صح لأن الـ pretest probability عالية والنمط specific.

          بس في الـ **vascular** cirrhosis، اضطراب الدورة الدموية نفسه بيعمل **benign hypervascular nodules** (regenerative / FNH-like) شكلها شبه الـ HCC. فالقاعدة تفقد دقتها ومانقدرش نعتمد عليها. (ده التفسير المعروف؛ القايمة من الكتاب.)
