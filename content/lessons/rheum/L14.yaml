          الكتاب: الـ teriparatide للـ ==severe osteoporosis (T ≤ −3)==، والـ multiple vertebral fractures، واللي فشل أو ما استحملش الـ bisphosphonate. وجدول الاختيار (ص 228) بيقول **start with** teriparatide أو romosozumab.

