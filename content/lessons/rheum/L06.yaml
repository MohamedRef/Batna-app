  - id: rheum.L06.lesson3
    title: "HLA والأمراض، والـ macrophage، والـ lymphocytes"
    hook: "ليه DR3 بيتكرر في SLE و Sjögren و Graves؟ وليه عيان الـ hypogammaglobulinemia بيجيله pneumococcus بالذات؟"
    minutes: 9
    pages: [91, 94]
    topics: [hla-disease, macrophages, lymphocytes]
    goals:
      - "تشرح 4 mechanisms للـ HLA disease association"
      - "تحفظ قائمة الـ HLA associations"
      - "تفرّق بين humoral و cellular immunity"
    status: unverified
    steps:
      - kind: explain
        page: 91
        title: "الـ HLA بيعمل المرض إزاي؟"
        quote: "By what mechanism do MHC genes confer disease susceptibility:"
        text: |
          الـ HLA مش بيعمل المرض لوحده، بس بيهيّئ له. الـ mechanisms:

          1. **T cell maturation**: الـ MHC هو اللي بيقرر أنهي naïve T cell تعيش في الـ thymus.
          2. **بيتحكم في اللي الـ T cell بتشوفه**: الـ amino acids في الـ MHC بتحدد أنهي peptide يمسك فيه.
          3. ==Molecular mimicry==.
          4. **Linkage disequilibrium**: الـ HLA نفسه بريء، بس بيتورث مع الجين الحقيقي.
      - kind: reveal
        page: 91
        quote: "HLA molecule may bear similarity to a certain antigen (pathogen)."
        prompt: "الـ molecular mimicry ليها نتيجتين عكس بعض. إيه هما؟"
        answer: |
          الـ HLA شبه antigen بتاع pathogen، فـ:
          - يا المناعة تعتبر الـ pathogen **self** وما تهاجموش ← **severe unabated disease**.
          - يا تهاجم الـ pathogen وتهاجم معاه الـ **self HLA** ← ==autoimmune disease==.
      - kind: table
        page: 92
        quote: "HLA-DR3: SLE, Sjogren's syndromes Grave's disease, type 1 DM."
        title: "أشهر الـ HLA associations"
        columns: [HLA, Diseases]
        rows:
          - ["A29", "Birdshot choroidoretinitis"]
          - ["B5", "Behçet, UC, polycystic kidney"]
          - ["B27", "Seronegative spondyloarthritis"]
          - ["DR1", "RA"]
          - ["DR2", "MS, Goodpasture"]
          - ["DR3", "SLE, Sjögren, Graves, type 1 DM"]
          - ["DR4", "RA, type 1 DM"]
          - ["DR5", "Pauciarticular JRA, Hashimoto"]
          - ["DQ", "SLE, type 1 DM"]
        hide: [[1, 1], [2, 1], [4, 1], [5, 1], [7, 1]]
      - kind: aside
        tone: joke
        page: 92
        quote: "HLA-DR2: Multiple sclerosis, Good pasture's syndrome."
        text: |
          **DR2** = **2** أمراض بتاكل الـ myelin والـ basement membrane: **multiple sclerosis** و **Goodpasture syndrome**.

          **DR3** = **3** حروف S: **S**LE و **S**jögren و **S**ugar، يعني type 1 DM. وزوّد عليهم Graves علشان ما يزعلش.
      - kind: check
        page: 92
        quote: "HLA-DR2: Multiple sclerosis, Good pasture's syndrome."
        question: "Goodpasture syndrome is associated with which HLA, per the lecture?"
        options: ["DR2", "DR3", "B27", "DR5"]
        answer: 0
        why:
          - "صح: DR2 = MS و Goodpasture."
          - "DR3 = SLE و Sjögren و Graves و T1DM."
          - "B27 = seronegative spondyloarthritis."
          - "DR5 = pauciarticular JRA و Hashimoto."
      - kind: explain
        page: 93
        title: "الـ monocyte–macrophage"
        quote: "Macrophage function as phagocytes (slower than neutrophils)"
        text: |
          الـ **monocyte** بيتعمل في الـ bone marrow، يلف في الدم **يوم واحد**، وبعدين يستقر في الأنسجة كـ **macrophage (histiocyte)**.

          **بيتنشّط** بـ: contact مع الميكروب، endotoxins، breakdown products، complement، coagulation products، و ==IFN-γ من الـ TH1==.

          **وظايفه:**
          1. **Phagocytosis**، أبطأ من الـ neutrophils.
          2. **Secretions**: IL-1 و TNF و IL-6 و IFN و prostaglandins و leukotrienes و enzymes و superoxides.
          3. **يأثر على الـ lymphocytes** بالـ mediators زي IL-1 و TNF، وبإنه **APC**.
      - kind: explain
        page: 93
        title: "T و B"
        quote: "monoclonal antibodies that recognize CD3, a component of T cell receptor."
        text: |
          - **T cells**: من الـ **thymus**، عليها **TCR**، وبنعرفها بالـ ==CD3==. هي **أغلب** الـ lymphocytes في الدم.
          - **B cells**: من الـ **bone marrow**، بتفرز antibodies، وعليها **surface Ig**. ما بتعدّيش على الـ thymus، بتستقر في الـ spleen والـ lymph nodes.
      - kind: table
        page: 93
        quote: "Humoral immunity is most important against bacteria, especially those"
        title: "Humoral ولا cellular؟"
        columns: [Feature, Humoral, Cellular]
        rows:
          - ["By", "B cells, antibody", "T cells, cytokines"]
          - ["Against", "Bacteria, encapsulated", "Virus, parasites, fungi, TB"]
          - ["Deficiency", "Hypogammaglobulinemia", "AIDS"]
        hide: [[1, 1], [1, 2], [2, 1], [2, 2]]
      - kind: case
        page: 93
        quote: "encapsulated organism (e.g pneumococcus, Haemophilus influenza)."
        stem: "24-year-old man: pneumococcal pneumonia twice, recurrent Haemophilus sinusitis. IgG, IgA and IgM very low."
        steps:
          - question: "Which arm is defective?"
            options: ["Humoral", "Cellular", "NK cells"]
            answer: 0
            why: "الـ antibody هو اللي بيعمل **opsonization** للبكتيريا اللي عليها capsule. من غيره ← **recurrent sinopulmonary infection** بالـ encapsulated organisms."
          - question: "Which infections would point to a T-cell defect instead?"
            options: ["Viruses, fungi, parasites, mycobacteria", "Encapsulated bacteria only", "Worms only"]
            answer: 0
            why: "الـ **cellular immunity** هي اللي بتحارب الـ intracellular pathogens، زي عيانين الـ **AIDS**."
      - kind: explain
        page: 94
        title: "حياة الـ B cell"
        quote: "When a B cell is exposed to an antigen it differentiates to antibody secreting"
        text: |
          - الـ mature B cell عليها **sIgM و sIgD** كـ receptors، وكل خلية ==specific for one antigen only==.
          - لما تقابل الـ antigen ← تبقى **plasma cell** (تفرز antibody) أو **memory cell**.
          - الـ **full activation** محتاجة **مساعدة الـ T cell**.
          - الـ plasma cells تعمل **clone** يفرز نفس الـ antibody اللي كان على سطح الخلية الأم.
          - الـ **memory cells** مسؤولة عن الـ **secondary immune response**.
