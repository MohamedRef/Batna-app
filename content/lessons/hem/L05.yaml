          - { key: "2", text: "II" }
        hook: "سنة **1972**: عشرة، تسعة، سبعة، اتنين. ده سهل تفتكره في الامتحان."
      - kind: explain
        remind: [hem.L05.043]
        page: 77
        title: "أسباب النقص"
        quote: "Aetiology (continued)\n  2- Secondary to oral anticoagulants\n  3- Prolonged treatment with broad spectrum antibiotics in association with low dietary intake in severly ill patients.\n  4- Haemorrhagic disese of the new born\nN.B vit K is obtained form green vegetables and bacterial synthesis in the gut"
        text: |
          1. **Impaired absorption**: ==biliary obstruction==، pancreatic disease، steatorrhea (vitamin K fat soluble، محتاج bile).
          2. **Oral anticoagulants** (warfarin).
          3. **Broad-spectrum antibiotics** لفترة طويلة مع أكل قليل في العيان التعبان.
          4. **Hemorrhagic disease of the newborn**.

          مصدرها: **green vegetables** و **bacterial synthesis in the gut**.

          بص للرسمة: كل سبب بيقطع خطوة. الـ bile مش واصل فالـ vitamin (fat soluble) مش بيتمص، والـ warfarin بيوقف الخطوة اللي في الكبد، والـ antibiotics مع الجوع بيقفلوا المصدرين. والمولود؟ التفسير المقبول (مش في الكتاب): أمعاؤه لسه **مفيهاش بكتيريا** ومخزونه قليل، عشان كده بياخد vitamin K بعد الولادة.
      - kind: reveal
        page: 77
        quote: "Aetiology (continued)\n  2- Secondary to oral anticoagulants\n  3- Prolonged treatment with broad spectrum antibiotics in association with low dietary intake in severly ill patients.\n  4- Haemorrhagic disese of the new born\nN.B vit K is obtained form green vegetables and bacterial synthesis in the gut"
        prompt: "ليه عيان الـ ICU اللي بياخد meropenem أسبوعين ومش بياكل بيطوّل الـ PT؟"
        answer: |
          مصدرين بس للـ vitamin K: **الأكل** (green vegetables) و **بكتيريا الأمعاء**.

          العيان ده مش بياكل، والـ antibiotic قتل البكتيريا. المصدرين اتقفلوا مع بعض، والـ II و VII و IX و X ما بقوش بيتعملوا صح.
      - kind: explain
        page: 77
        title: "الصورة والعلاج"
        quote: "Clinical features\n  Bruises, echymoses and mucous membrane bleeding.\nLab findings\n  PT increased\n  APTT increased\nManagement\n  Vitamin K (10-20 mg in adults/6h).\n  Fresh frozen plasma."
        text: |
          - **Clinically**: bruises، ecchymoses، mucous membrane bleeding.
          - **Labs**: ==Prothrombin time (PT) increased== و **activated partial thromboplastin time (APTT) increased**.
          - **العلاج**: **vitamin K** (10–20 mg في الكبار) و **fresh frozen plasma (FFP)**.

          ليه الاتنين طوال؟ لأن الـ factors الأربعة موزعين: **VII** في الـ extrinsic (الـ PT)، و **IX** في الـ intrinsic (الـ APTT)، و **X و II** في الـ common (الاتنين). والـ FFP ليه؟ لأن الـ vitamin K محتاج وقت لحد ما الكبد يعمل factors جديدة، أما الـ FFP فيه الـ factors جاهزة.
      - kind: table
        page: 77
        quote: "PT increased"
        title: "PT و APTT في الأمراض اللي خدناها"
        columns: [Disorder, "PT / APTT"]
        rows:
          - ["Hemophilia A or B", "PT normal, APTT long"]
          - ["Vitamin K deficiency", "Both long"]
          - ["Warfarin", "Both long (II, VII, IX, X)"]
          - ["Liver disease", "Both long, plus low V and fibrinogen"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 77
        title: "Liver disease: أكتر من vitamin K"
        quote: "II. Liver Disease: Pathogenesis\n  1. Imparied synthesis of prothrombin and factors VII, IX and X (vitamin K- dependent).\n  2. Impaired synthesis of factors V and fibrinogen.\n  3. Thrombocytopenia-due to folate depletion, alcoholism and/or hypersplenism.\n  4. Fibrinolysis."
        text: |
          1. نقص تصنيع **II و VII و IX و X**
          2. نقص ==factor V== و **fibrinogen** (مش vitamin K-dependent)
          3. **Thrombocytopenia**: folate depletion، alcohol، hypersplenism
          4. **Fibrinolysis**

          التشخيص زي الـ vitamin K deficiency **مع clotting defects زيادة**. النزيف غالبًا mild، بس ممكن severe من الـ **varices**. العلاج: السبب، و vitamin K (لوحده **ممكن ما ينفعش**)، و FFP.

          ليه الكبد أوسع من الـ vitamin K؟ لأن الكبد **المصنع** نفسه: مش بس الأربعة اللي محتاجين vitamin K، ده كمان **V** و **fibrinogen**. فلو لقيت ==factor V واطي== يبقى العيب في المصنع مش في الـ vitamin. وعشان كده الـ vitamin K لوحده ممكن ما يصلّحش: إنت بتدّي خامة لمصنع واقف. والـ platelets بتقل من الـ **hypersplenism** (الطحال الكبير بيحجزها)، والـ folate الناقص والـ alcohol.
      - kind: check
        page: 78
        quote: "Vitamin K (which alone may be relatively ineffective)± fresh frozen plasma."
        question: "Cirrhotic man, long PT that does not correct with vitamin K, low factor V. Why?"
        options: ["Failed hepatic synthesis", "Hemophilia B", "Vitamin K overdose", "Heparin"]
        answer: 0
        why:
          - "صح: الكبد مش قادر يعمل الـ factors أصلًا، فالـ vitamin K لوحده مش كفاية، والـ V الواطي بيأكد."
          - "الـ hemophilia B وراثية وبتطوّل الـ APTT بس."
          - "الجرعة الزيادة مش هتصلّح تصنيع فاشل."
          - "الـ heparin بيطوّل الـ TT، ومالوش دعوة بالـ V."
      - kind: try
        items: [hem.L05.041, hem.L05.043, hem.L05.048, hem.L05.089, hem.L05.090]
    recap:
      - "Vitamin K factors **1972**: X، IX، VII، II. الـ vitamin بيكمّلهم بـ COOH في الكبد."
      - "الأسباب كل واحد بيقطع خطوة: absorption (biliary، pancreas، steatorrhoea)، warfarin، antibiotics + أكل قليل، newborn."
      - "Vitamin K deficiency: PT و APTT طوال. العلاج vitamin K (10–20 mg) و FFP."
      - "Liver disease = نفس الكلام + V و fibrinogen واطيين + platelets واطية + fibrinolysis؛ الـ vitamin K لوحده ممكن ما ينفعش."
