  # ---------- cases and essays ----------
  - id: neph.L14.194
    kind: case
    topic: hrs
    stem: "A 55-year-old man with HCV cirrhosis and tense ascites, on furosemide, spironolactone and propranolol, has creatinine 1.0 rising to 1.6 mg/dL in 48 h. BP 100/60, no shock."
    steps:
      - question: First step?
        options:
          - Stop diuretics and beta-blocker, give albumin 1 g/kg/day for 2 days
          - Start terlipressin immediately
          - Give furosemide infusion
          - Kidney biopsy
        answer: 0
        why: "Stop diuretics and beta-blockers; volume expansion with albumin 1 g/kg/day (max 100 g) for 2 days (p491-492)."
      - reveal: "After 48 h creatinine is 2.0. Urine protein 120 mg/day, no hematuria, normal ultrasound, FENa 0.1%."
        question: Diagnosis?
        options:
          - HRS-AKI
          - Acute tubular necrosis
          - HCV cryoglobulinemic GN
          - Prerenal AKI responding to fluid
        answer: 0
        why: "No response to albumin, no shock, no parenchymal disease, FENa <0.1% = HRS-AKI (Box 1)."
      - question: Drug treatment?
        options:
          - Terlipressin plus albumin
          - Albumin alone
          - Dopamine
          - Norepinephrine on the ward without a central line
        answer: 0
        why: "Terlipressin + albumin beats albumin alone; noradrenaline needs ICU (p492-493)."
      - question: Definitive treatment?
        options:
          - Liver transplantation
          - Lifelong dialysis
          - TIPS for everyone
          - Kidney transplant alone
        answer: 0
        why: "LT is optimal regardless of drug response (p494)."
    src: { page: 492, quote: "When HRS-AKI is diagnosed, a specific pharmacological treatment should start as soon as possible." }
    status: unverified
  - id: neph.L14.195
    kind: case
    topic: hus
    stem: "A 28-year-old woman 2 weeks postpartum has Hb 7.5, platelets 60,000, schistocytes, LDH 1400, creatinine 4.2 mg/dL. No diarrhea. Coombs negative."
    steps:
      - question: Which test separates TTP from the rest?
        options:
          - ADAMTS13 activity
          - Stool Shiga toxin
          - Anti-dsDNA
          - Serum C3
        answer: 0
        why: "ADAMTS13 <10% = TTP; >10% = non-TTP TMA (p468)."
      - reveal: "ADAMTS13 is 55%. Stool STEC negative. No other disease found."
        question: Most likely diagnosis?
        options:
          - Atypical HUS
          - TTP
          - STEC-HUS
          - DIC
        answer: 0
        why: "ADAMTS13 >10%, no co-existing disease, STEC negative = aHUS; pregnancy can trigger it (p468, p473)."
      - question: First-line treatment?
        options:
          - Eculizumab
          - Antibiotics
          - Platelet transfusion
          - Rituximab
        answer: 0
        why: "aHUS: eculizumab first-line, plasma exchange second-line (p476)."
      - question: Before eculizumab, what must she receive?
        options:
          - Vaccines against encapsulated organisms
          - Iron infusion
          - Hepatitis A vaccine only
          - Nothing
        answer: 0
        why: "Eculizumab raises risk of S. pneumoniae and H. influenzae infection (p477)."
    src: { page: 476, quote: "The cornerstones of treatment for aHUS are first-line treatment with eculizumab and second-line with plasma exchange." }
    status: unverified
  - id: neph.L14.196
    kind: essay
    topic: tma
    prompt: Compare typical HUS, atypical HUS and TTP in cause, diagnosis and treatment.
    outline:
      - "TMA: MAHA + thrombocytopenia (<150,000 or >25% fall) + end-organ damage"
      - "Typical HUS: STEC 90-95%, children <5, bloody diarrhea; supportive, no antibiotics or antimotility"
      - "aHUS: complement mutations (CFH, CFI, MCP), 5-10%; eculizumab first, PEX second; graft recurrence"
      - "TTP: ADAMTS13 <10%, acquired autoantibody; PLASMIC; PEX + steroids, rituximab, caplacizumab; no platelets"
    src: { page: 470, quote: "The triad of thrombocytopenia, hemolytic anemia, and ischemic end-organ damage defines thrombotic microangiopathy." }
    status: unverified
  - id: neph.L14.197
    kind: essay
    topic: hcv
    prompt: Discuss HCV-associated glomerular disease and its management.
    outline:
      - "MPGN (cryoglobulinemic, type II 90%), MGN, FSGS, rare others"
      - "Pathology: subendothelial IgM/IgG, double contours, intraluminal thrombi, vasculitis 30%"
      - "Pathogenesis: immune complexes with HCV, B-cell clone, direct CD81 entry"
      - "KDIGO: biopsy; DAA for all; add immunosuppression ± PEX for flare, NS or RPGN; rituximab first-line"
    src: { page: 488, quote: "We recommend that patients with HCV-associated glomerular disease be treated for HCV (1A)." }
    status: unverified
  - id: neph.L14.198
    kind: essay
    topic: dysprot
    prompt: Outline the kidney in monoclonal gammopathies (MGUS, MGRS, myeloma).
    outline:
      - "MGUS vs MGRS vs myeloma; 20-30% of myeloma present with low GFR"
      - "Cast nephropathy: FLC + Tamm-Horsfall in distal tubule; PTC injury via cubilin-megalin"
      - "Others: AL amyloid, MIDD, Fanconi, PGNMID, C3 glomerulopathy"
      - "Clone-directed therapy: bortezomib-CyDex (94%, VGPR 66-71%), ASCT; VGPR = dFLC <40 mg/L"
    src: { page: 496, quote: "The most common cause of decreased GFR in patients with multiple myeloma is light chain cast nephropathy." }
    status: unverified
