          - بيظهر بعد الولادة بـ ==3-9 شهور==، في **5-10%**.
          - بيمشي في نفس مراحل الـ subacute thyroiditis.
          - بس: ==no pain==، **erythrocyte sedimentation rate (ESR) normal**، و **thyroid antibodies عالية**.
          - **20%** بيفضلوا hypothyroid على طول.
          - الـ thyroid peroxidase (TPO) antibodies العالية = خطر أكبر. و **25%** من الـ type 1 diabetes mellitus (DM) بيعملوه.

          ليه بعد الولادة؟ التفسير المقبول (مش في الكتاب): الحمل بيهدّي المناعة عشان الجسم ميرفضش الجنين، وبعد الولادة المناعة **بترجع بقوة** (rebound)، فاللي عندها antibodies جاهزة (TPO، type 1 DM) تهاجم الغدة. وليه بيمشي زي الـ subacute؟ لأن الاتنين **destructive**: الغدة بتتكسر فالهرمون المخزون ينزل الدم (hyper)، وبعدين المخزون يخلص (hypo)، وبعدين تتعافى أو لأ.
