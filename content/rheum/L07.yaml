    update:
      text: "The p116 figure labels the classical convertase C4b2a (the older name), while the p110 table and p114 text use C4b2b. The larger C2 fragment is now called C2b, so C4b2b is the current name for the same enzyme."
      ref: "Bohlson et al., Complement nomenclature: deconvoluted, Front Immunol 2019"
  - id: rheum.L07.041
    kind: card
    topic: c3-c5
    front: What are the two fragments of C5, and what does each do?
    back: C5a is released into the fluid phase and is a potent anaphylatoxin. C5b binds the cell surface and is the nucleus for binding the terminal components.
    src: { page: 116, quote: "C5b:\n  Binds to the cell surface,\n  Serves as a nucleus for binding the terminal complement components" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.042
    kind: enumerate
    topic: c3-c5
    prompt: Enumerate the biological effects of C5a shown on p117.
    points:
      - Neutrophil activation
      - Neutrophil adhesion
      - Neutrophil emigration and chemotaxis
      - Monocyte activation (IL-1, IL-6)
      - Mast cell degranulation (smooth muscle contraction, increased vascular permeability)
    pass: 4
    hook: "C5a «بيشغّل الـ neutrophil ويلزّقه ويطلّعه، يصحّي الـ monocyte، ويفضّي الـ mast cell»: neutrophil activation، adhesion، emigration/chemotaxis، monocyte activation (IL-1، IL-6)، وmast cell degranulation."
    src: { page: 117, quote: "Biological Effects of C5a\nFigure: C5a causes 1. neutrophil activation; 2. neutrophil adhesion; 3. neutrophil emigration and chemotaxis; 4. monocyte activation (IL-1, IL-6); 5. mast cell degranulation, giving smooth muscle contraction and increased vascular permeability." }
    status: unverified
  - id: rheum.L07.043
    kind: mcq
    topic: c3-c5
    stem: Which complement fragment is the most potent anaphylatoxin and also drives neutrophil chemotaxis and monocyte activation?
    options: [C5a, C5b, C3b, C4b, C2a]
    answer: 0
    why:
      - "Correct: C5a is a potent anaphylatoxin with neutrophil activation, adhesion, chemotaxis and monocyte activation (p116–117)."
      - C5b nucleates the MAC.
      - C3b is the main opsonin.
      - C4b binds the surface and opsonizes.
      - In the lecture's table C2a is the precursor of C2 kinin.
