  # ---------- p35–36: KFRE and risk-based care ----------
  - id: neph.L02.048
    kind: card
    topic: risk
    front: What is the KFRE used for, and in which stages?
    back: To estimate the risk of kidney failure and guide referral in CKD G3–G5. It may not be valid in G1–G2.
    src: { page: 35, quote: "2.2. Risk prediction in people with CKD Use of kidney failure risk equation (KFRE) to estimate risk of kidney failure and to guide referral in CKD G3-5" }
    status: unverified
    tags: [high-yield]
  - id: neph.L02.049
    kind: card
    topic: risk
    front: Which four variables does the KFRE use, and what does it give?
    back: Urine (ACR), sex, age and GFR. It gives the 2- and 5-year probability of treated kidney failure in CKD stage 3–5.
    src: { page: 35, quote: "KIDNEY FAILURE RISK EQUATION\nUsing the patient's Urine, Sex, Age and GFR, the kidney failure risk equation provides the 2 and 5 year probability of treated kidney failure for a potential patient with CKD stage 3 to 5.\nUrine + Sex + Age + GFR (Glomerular filtration rate) = The projected risk of kidney failure" }
    status: unverified
  - id: neph.L02.050
    kind: card
    topic: risk
    front: For which diseases are disease-specific prediction equations used?
    back: IgA nephropathy and ADPKD.
    src: { page: 35, quote: "May not be valid for use in those with CKD G1–G2 Disease-specific prediction equations in patients with IgAN and ADPKD." }
    status: unverified
