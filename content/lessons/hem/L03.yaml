  - id: hem.L03.lesson2
    title: "الثلاسيميا: لما سلسلة تقل والتانية تزيد"
    hook: "مش المشكلة إن الـ β ناقصة بس. المشكلة إن الـ α الزيادة بتترسب وتموّت الكرة وهي لسه في النخاع."
    minutes: 9
    pages: [21, 25]
    topics: [thal-class, beta-major]
    goals:
      - "تعرّف الثلاسيميا وتقسمها بطريقتين"
      - "تشرح pathogenesis الـ β-thalassaemia major خطوة خطوة"
      - "تربط العضم والحديد والطحال بالـ pathogenesis، وتعرف التحاليل"
    status: unverified
    steps:
      - kind: explain
        page: 21
        title: "الثلاسيميا وتقسيمها"
        quote: "The thalassaemias are heterogeneous group of inherited disorders of haemoglobin characterized by reduced or absent production of one of the globin chains."
        text: |
          الـ ==thalassaemias== أمراض وراثية في الـ Hb فيها إنتاج **سلسلة globin** واحدة **قليل أو معدوم**.

          بتتقسم بطريقتين:
          1. **نوع السلسلة الناقصة**: أشهرهم **α** و **β**.
          2. **الشدة الإكلينيكية**: major، intermedia، minor.

          ليه تقسيمين؟ التفسير المقبول (مش في الكتاب): الأول بيقولك **الجين** (مهم للوراثة والـ electrophoresis)، والتاني بيقولك **هتعمل إيه للعيان** النهارده: محتاج نقل منتظم ولا لأ. ونفس الطفرة ممكن تدّي شدة مختلفة في عيانين مختلفين.
      - kind: table
        page: 22
        quote: "Thalassaemia intermedia is characterized by intermediate degree of severity of anaemia that does not require regular blood transfusions."
        title: "Major ولا intermedia ولا minor؟"
        columns: [Type, Transfusion]
        rows:
          - ["Major", "Regular, dependent"]
          - ["Intermedia", "None or intermittent"]
          - ["Minor", "None (mild or no anaemia)"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 22
        title: "Cooley's anaemia: الـ pathogenesis"
        quote: "This causes excessive accumulation of free α. The unbound α chains precipitate within erythroblasts and red cells, leading to the lysis of erythroblasts and red cells in the bone marrow (ineffective erythropoiesis)."
        text: |
          الـ **β-thalassaemia major** (==Cooley's anaemia==) أشد نوع:
          1. الخلية مش قادرة تعمل **β chains** كفاية.
          2. الـ **α chains** الحرة تتراكم.
          3. تترسب جوّه الـ erythroblasts والكرات، فتموت **في النخاع**: ==ineffective erythropoiesis==.
          4. الكرات اللي فيها α aggregates **ناشفة** وتتحبس في الطحال.
          5. Hb قليل = كرات **microcytic hypochromic**.
          6. التكسير برّه = **splenomegaly**.
          7. الـ **fetal haemoglobin (HbF)** هو الغالب، وده بيزوّد الـ tissue hypoxia.

          يعني المشكلة مش **نقص** الـ β بس، المشكلة **الزيادة السامة** من الـ α. وليه الـ HbF بيزوّد الـ hypoxia؟ التفسير المقبول (مش في الكتاب): الـ HbF بيمسك الأكسجين جامد (affinity عالية)، ده مفيد للجنين اللي بيسحب من أمه، بس في الطفل الكبير معناه إن الأنسجة بتاخد أكسجين أقل.
      - kind: reveal
        page: 23
        quote: "Haemoglobin F is the predominant haemoglobin in"
        prompt: "ليه طفل الـ β major بيتولد شكله طبيعي، والأعراض بتبدأ بعد شهور؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الجنين بيعتمد على الـ **HbF** (α2γ2)، والـ HbF ما فيهوش β أصلًا. فطول ما الجنين والمولود شغالين HbF، عيب الـ β مش باين.

          بعد الولادة الجسم بيبدّل الـ γ بالـ β عشان يعمل الـ adult haemoglobin. هنا بس العيب بيظهر: الـ β مش موجودة، والـ α تتراكم، والأنيميا تبدأ في **أول سنة**.

          وده بيفسّر برضه ليه الـ HbF بيفضل **عالي** في الـ Cooley's anaemia: الجسم بيحاول يكمّل بالـ γ اللي يقدر يعملها.
      - kind: figure
        page: 22
        quote: "This causes excessive accumulation of free α. The unbound α chains precipitate within erythroblasts and red cells, leading to the lysis of erythroblasts and red cells in the bone marrow (ineffective erythropoiesis)."
        title: "الحلقة المفرغة"
        alt: "A cycle: low beta chains leave excess alpha chains, which precipitate and kill erythroblasts (ineffective erythropoiesis) and make rigid red cells destroyed in the spleen; severe anaemia and hypoxia drive erythropoietin and marrow expansion (bone deformity), and raise iron absorption; transfusions add iron; iron overload damages organs."
        caption: "كل حاجة في الـ thalassaemia major طالعة من نقطة واحدة: ==α chains زيادة==. هي اللي بتموّت الخلايا، والـ anaemia بتزق النخاع يتمدد، والـ ineffective erythropoiesis بتزوّد امتصاص الحديد."
        svg: |
