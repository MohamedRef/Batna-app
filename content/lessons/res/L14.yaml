      Important Notice
    prompt: ليه الـ NPV بيقل لما الـ prevalence تزيد؟
    answer: لأن العيانين بقوا أكتر، فالـ test بيفوّت منهم عدد أكبر (نفس الـ sensitivity بس على عدد أكبر). يعني الـ false negatives
      بتزيد وسط الـ negatives، فالـ negative بقى يطمّن أقل.
  - kind: explain
    page: 25
    quote: |-
      Effect of prevalence
      If the sensitivity and specificity for a test are known but we wish to use the test on a different population from the one it was developed in, the PPV and NPV can be calculated using the following standard formula
      PPV = sensitivity x prevalence / [sensitivity x prevalence] + [(1-specificity) x (1-prevalence)]
      NPV = specificity x (1-prevalence) / [(1-sensitivity) x prevalence] + [specificity x (1-prevalence)]
    title: معادلة السلايد 25
    text: |-
      لو عارف الـ **sensitivity** والـ **specificity** وعايز تستخدم الـ test في population تانية غير اللي اتعمل فيها:

      - **PPV** = (Se × P) ÷ [(Se × P) + (1 − Sp)(1 − P)]
      - **NPV** = Sp(1 − P) ÷ [(1 − Se)P + Sp(1 − P)]

      حيث **P** = الـ ==prevalence==. البسط = اللي صح، والمقام = كل اللي طلعوا بنفس النتيجة. حاسبة «Predictive values» في Batna بتعملها.
