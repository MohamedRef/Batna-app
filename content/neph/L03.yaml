  # ---------- p68: definition and Table 1 ----------
  - id: neph.L03.001
    kind: card
    topic: definition
    front: Define cardiorenal syndrome (2008 consensus conference).
    back: Disorders of the heart and kidneys in which acute or chronic dysfunction of one organ may induce acute or chronic dysfunction of the other.
    src: { page: 68, quote: "A 2008 consensus conference defined \"disorders of the heart and kidneys where by acute or chronic dysfunction in one organ may induce acute or chronic dysfunction of the other\" as cardiorenal syndrome (CRS)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L03.002
    kind: cloze
    topic: definition
    text: "The definition of cardiorenal syndrome comes from a {{c1::2008}} consensus conference, which split it into {{c2::five}} types."
    src: { page: 68, quote: "A 2008 consensus conference defined \"disorders of the heart and kidneys where by acute or chronic dysfunction in one organ may induce acute or chronic dysfunction of the other\" as cardiorenal syndrome (CRS)." }
    status: unverified
    tags: [numbers]
  - id: neph.L03.003
    kind: table
    topic: definition
    title: "Classification of cardiorenal syndrome (Table 1)"
    columns: [Type, Characteristics, Causes of morbidity]
    rows:
      - ["Type 1 (acute cardiorenal)", "Acute cardiac impairment leading to AKI", "Cardiogenic shock and ADHF resulting in AKI"]
      - ["Type 2 (chronic cardiorenal)", "Chronic cardiac impairment leading to renal impairment", "Chronic heart failure"]
      - ["Type 3 (acute renocardiac)", "AKI leading to cardiac impairment", "HF from AKI volume overload, inflammatory surge and metabolic disturbances"]
      - ["Type 4 (chronic renocardiac)", "CKD leading to cardiac impairment", "Myocardial remodeling and HF from CKD-associated cardiomyopathy"]
      - ["Type 5 (secondary cardiorenal)", "Systemic condition leading to both cardiac and renal impairment", "Diabetes, amyloidosis and sepsis"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 2]]
    src: { page: 68, quote: "Table 1: Classification of Cardiorenal Syndrome with Causes of Morbidity\n| Cardiorenal types | Characteristics | Causes of morbidity |\n| Type 1 (acute cardiorenal) | Acute cardiac impairment leading to acute kidney injury (AKI) | Cardiogenic shock and AKI, acute decompensated heart failure (ADHF) resulting in AKI |\n| Type 2 (chronic cardiorenal) | Chronic cardiac impairment leading to renal impairment | Chronic heart failure |\n| Type 3 (acute renocardiac) | AKI leading to cardiac impairment | Heart failure in the setting of AKI from volume overload, inflammatory surge and accompanying metabolic disturbances |\n| Type 4 (chronic renocardiac) | Chronic kidney disease (CKD) leading to cardiac impairment | Myocardial remodeling and heart failure from CKD-associated cardiomyopathy |\n| Type 5 (secondary cardiorenal) | Systemic condition leading to both cardiac and renal impairment | Diabetes, amyloidosis and sepsis |" }
    status: unverified
    tags: [high-yield]
