  - id: dm.L13.lesson2
    title: "اتجهّزي قبل ما تحملي"
    hook: "أهم شغل في حمل الست السكرية بيحصل قبل ما الحمل يبدأ أصلًا."
    minutes: 9
    pages: [162, 172]
    topics: [preconception, risks]
    goals:
      - "تحفظ الـ 4 main points للـ preconception care"
      - "تعدّ مخاطر السكر غير المنضبط على الأم والجنين"
      - "تعرف جرعة الـ aspirin وأرقام الضغط"
    status: unverified
    steps:
      - kind: mnemonic
        page: 162
        quote: "Provide preconception counseling to keep glycemic control as close to normal as is safely possible, ideally A1C < 6.5%."
        word: "GFTR"
        hook: "الأربع نقط الرئيسية قبل الحمل:"
        parts:
          - { key: "G", text: "Glycemia أقرب للطبيعي بأمان: ideally A1C <6.5%" }
          - { key: "F", text: "Family planning و effective contraception" }
          - { key: "T", text: "Teratogenic drugs: ACE inhibitors و statins" }
          - { key: "R", text: "Retinopathy: خطر إنها تظهر أو تتقدم" }
      - kind: aside
        tone: joke
        page: 163
        quote: "Risks related to certain medications. (Potentially teratogenic medications as ACE inhibitors & statins)."
        text: |
          الـ ==angiotensin-converting enzyme (ACE) inhibitor== والـ **statin** في درج المريضة السكرية زي الحماة في أوضة الفرح: مفيدين جدًا في العادي، بس قبل الحمل لازم حد يقعد معاهم ويراجع وجودهم.
      - kind: explain
        page: 171
        quote: "Table 15.1: Checklist for preconception care for people with prediabetes, diabetes, or a history of gestational diabetes mellitus\nPreconception education should include:\n  Comprehensive nutrition assessment and recommendations for:\n    Overweight and obesity or underweight\n    Meal planning\n    Correction of dietary nutritional deficiencies\n    Caffeine intake\n    Safe food preparation technique\n  Lifestyle recommendations for:\n    Regular moderate exercise\n    Avoidance of hyperthermia (hot tubs)\n    Adequate sleep\n  Comprehensive diabetes self-management education\n  Counseling on diabetes in pregnancy per current standards, including natural history of insulin resistance in pregnancy and postpartum; preconception glycemic goals; avoidance of DKA and severe hyperglycemia; avoidance of severe hypoglycemia; progression of retinopathy in individuals with preexisting diabetes; PCOS (if applicable); fertility in people with diabetes; genetics of diabetes; risks to pregnancy including miscarriage, stillbirth, congenital malformations, macrosomia, preterm labor and delivery, hypertensive disorders in pregnancy\n  Supplementation\n    Folic acid supplement (400–800 µg/day routine)\n    Appropriate use of over-the-counter medications and supplements"
        title: "الـ checklist (Table 15.1)"
        text: |
          الـ American Diabetes Association (ADA) عامل checklist طويل قبل الحمل. أهم حاجاته:

          - **Nutrition**: الوزن، meal planning، النواقص، الـ caffeine، وتحضير الأكل بأمان.
          - **Lifestyle**: رياضة معتدلة، ==avoid hyperthermia== (hot tubs)، ونوم كفاية.
          - **Folic acid** ==400-800 µg/day== روتين.
          - **Counseling**: Diabetic ketoacidosis (DKA)، الـ hypoglycemia الشديدة، الـ retinopathy، والمخاطر: miscarriage، stillbirth، malformations، macrosomia، preterm، hypertensive disorders.
      - kind: explain
        page: 172
        quote: "Table 15.1 (continued): Checklist for preconception care\nScreening should include:\n  Diabetes complications and comorbidities in individuals with preexisting diabetes, including comprehensive foot exam; comprehensive ophthalmologic exam; ECG in individuals starting at age 35 years who have cardiac signs or symptoms or risk factors and, if abnormal, further evaluation; lipid panel; serum creatinine; TSH; and urine albumin-to-creatinine ratio\n  Anemia\n  Genetic carrier status (based on history):\n    Cystic fibrosis\n    Sickle cell anemia\n    Tay-Sachs disease\n    Thalassemia\n    Others if indicated\n  Infectious disease (per ACOG guidelines)"
        title: "الـ screening قبل الحمل"
        text: |
          في السكر الموجود قبل الحمل: **foot exam**، **eye exam**، **electrocardiogram (ECG)** من سن 35 لو فيه أعراض أو risk factors، **lipid panel**، **creatinine**، **thyroid-stimulating hormone (TSH)**، و **urine albumin-to-creatinine ratio (ACR)**.

          كمان **anemia**، والـ **genetic carrier status** حسب التاريخ (cystic fibrosis، sickle cell، Tay-Sachs، thalassemia)، والـ infections والتطعيمات.

          والخطة: ==contraception لحد ما الـ glycemic goals تتحقق==.
      - kind: sort
        page: 165
        quote: "Risks of uncontrolled DM in Pregnancy\n  1. Spontaneous abortion\n  2. Fetal anomalies\n  3. Preeclampsia\n  4. Macrosomia\n  5. Neonatal hypoglycemia\n  6. Neonatal hyperbilirubinemia\n  1. Increase risk of maternal T2DM & CVS morbidity.\n  2. Increase the risk of obesity & T2DM in offspring later in life"
        prompt: "حط كل خطر في مكانه:"
        bins: ["الجنين / المولود", "الأم", "الطفل لما يكبر"]
        cards:
          - { text: "Spontaneous abortion", bin: 0 }
          - { text: "Fetal anomalies", bin: 0 }
          - { text: "Macrosomia", bin: 0 }
          - { text: "Neonatal hypoglycemia", bin: 0 }
          - { text: "Neonatal hyperbilirubinemia", bin: 0 }
          - { text: "Preeclampsia", bin: 1 }
          - { text: "Later T2DM and cardiovascular system (CVS) morbidity", bin: 1 }
          - { text: "Obesity and T2DM", bin: 2 }
        why: "الكتاب بيعدّ 6 مخاطر قريبة (abortion، anomalies، preeclampsia، macrosomia، neonatal hypoglycemia و hyperbilirubinemia)، واتنين بعيدين: type 2 diabetes mellitus (T2DM) و cardiovascular morbidity للأم، و obesity و T2DM للطفل."
      - kind: reveal
        page: 165
        quote: "Pregnancy is a ketogenic state, ↑↑risk for DKA even at lower BG levels than in the non-pregnant state (Euglycemic DKA)."
        prompt: "حامل T1DM عندها DKA والسكر 190 بس. إزاي؟"
        answer: "الحمل **ketogenic state**: الجنين بيسحب جلوكوز طول الوقت، فالأم بتحرق دهون أسرع. فالـ ==DKA== ممكن ييجي على سكر أوطى (**euglycemic DKA**). عشان كده: **ketone strips** في البيت و **sick-day rules**."
      - kind: check
        page: 165
        quote: "Women with preexisting diabetes, especially T1DM, need ketone strips at home & education on DKA prevention (sick day rules) & detection."
        question: "A 27-year-old with T1DM at 22 weeks asks why she has urine ketone strips. Best explanation?"
        options:
          - "Pregnancy is ketogenic; DKA can occur at lower glucose"
          - "DKA in pregnancy occurs only with glucose >350 mg/dL"
          - "Ketone testing is unnecessary with CGM"
          - "DKA risk is lower in pregnancy"
        answer: 0
        why:
          - "صح، ودي إجابة سؤال الكتاب."
          - "بالعكس، بيحصل على أرقام أوطى."
          - "الـ continuous glucose monitoring (CGM) بيقيس جلوكوز مش كيتونات."
          - "الخطر أعلى في الحمل مش أقل."
      - kind: figure
        page: 165
        quote: "Women with T1 or T2DM should be prescribed low-dose aspirin 60–150 mg/day (usual dose 81 mg/day) from the end of the 1st trimester until the baby is born to lower the risk of preeclampsia."
        title: "الأسبرين: من إمتى لإمتى"
        alt: "A horizontal pregnancy timeline from conception to birth split into three trimesters. A bar labelled low-dose aspirin 60 to 150 mg per day, usual 81 mg, starts at the end of the first trimester and runs to delivery, to lower preeclampsia risk in type 1 or type 2 diabetes."
        caption: "Aspirin من آخر الـ 1st trimester لحد الولادة، لكل ست عندها T1 أو T2DM."
        svg: |
          <svg viewBox="0 0 330 150" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="40" width="100" height="30" class="fg-box"/>
            <rect x="110" y="40" width="100" height="30" class="fg-box"/>
            <rect x="210" y="40" width="110" height="30" class="fg-box"/>
            <text x="60" y="60" text-anchor="middle" class="t-sm">1st</text>
            <text x="160" y="60" text-anchor="middle" class="t-sm">2nd</text>
            <text x="265" y="60" text-anchor="middle" class="t-sm">3rd</text>
            <text x="10" y="28" class="t-sm t-mut">Conception</text>
            <text x="320" y="28" text-anchor="end" class="t-sm t-mut">Birth</text>
            <rect x="105" y="85" width="215" height="26" rx="6" class="fg-acc"/>
            <text x="212" y="103" text-anchor="middle" class="t-sm t-b">Aspirin 60-150 mg/day (usual 81)</text>
            <text x="165" y="138" text-anchor="middle" class="t-sm t-mut">Goal: lower preeclampsia risk (T1DM or T2DM)</text>
          </svg>
      - kind: aside
        tone: trap
        page: 166
        quote: "The rapid implementation of tight glycemic control in the setting of retinopathy is associated with a worsening of retinopathy."
        text: |
          **Take care**: لو فيه **retinopathy**، ضبط السكر ==بسرعة== ممكن يخلّيها أسوأ. التحسين مطلوب، بس تابع العين.
      - kind: table
        page: 166
        quote: "In pregnant individuals with diabetes & chronic hypertension, a blood pressure threshold of 140/90 mmHg for initiation or titration of therapy is associated with better pregnancy outcomes than reserving treatment for severe hypertension, with no increase in the risk of small-for-gestational-age birth weight."
        title: "الضغط مع السكر في الحمل (ADA 2025)"
        columns: ["البند", "الرقم"]
        rows:
          - ["ابدأ أو زوّد العلاج", "140/90 mmHg"]
          - ["قلّل العلاج تحت", "90/60 mmHg"]
          - ["الـ target المقترح", "110-135/85 mmHg"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 166
        quote: "In pregnant individuals with diabetes & chronic hypertension, a blood pressure threshold of 140/90 mmHg for initiation or titration of therapy is associated with better pregnancy outcomes than reserving treatment for severe hypertension, with no increase in the risk of small-for-gestational-age birth weight."
        title: "ليه 140/90 مش بس الضغط الشديد؟"
        text: |
          العلاج من **140/90** أحسن للحمل من إنك تستنى الـ **severe hypertension**، و==من غير زيادة في الـ small-for-gestational-age (subjective global assessment)== birth weight. والـ target **110-135/85** عشان يقلل الـ accelerated maternal hypertension.
      - kind: try
        items: [dm.L13.022, dm.L13.035, dm.L13.039, dm.L13.041, dm.L13.040]
    recap:
      - "قبل الحمل: A1C <6.5% بأمان، contraception، راجع ACE inhibitors و statins، والعين."
      - "Folic acid 400-800 µg/day."
      - "الحمل ketogenic: euglycemic DKA، ketone strips في البيت."
      - "Aspirin 60-150 (81) mg/day من آخر الـ 1st trimester للولادة."
      - "الضغط: ابدأ 140/90، قلّل تحت 90/60، target 110-135/85."
    practice: [dm.L13.022, dm.L13.023, dm.L13.024, dm.L13.025, dm.L13.026, dm.L13.027, dm.L13.028, dm.L13.029, dm.L13.030, dm.L13.031, dm.L13.032, dm.L13.033, dm.L13.034, dm.L13.035, dm.L13.036, dm.L13.037, dm.L13.038, dm.L13.039, dm.L13.040, dm.L13.041, dm.L13.042, dm.L13.043, dm.L13.044, dm.L13.099, dm.L13.100]
