        why: |
          - **بيقللوا الـ R**: الـ nitrates بتوسّع جوه الكبد، والـ transjugular intrahepatic portosystemic shunt (TIPS) بيعمل طريق جانبي حوالين الـ resistance.
          - **بيقللوا الـ F**: الـ beta-blockers والـ terlipressin والـ somatostatin بيضيّقوا الـ splanchnic bed فالـ inflow يقل.
          - **الاتنين**: الـ carvedilol، لأنه β + α1.
      - kind: explain
        page: 47
        quote: "Carvedilol leads to a significantly greater decrease in HVPG than propranolol."
        title: "الـ carvedilol: الدور التاني للي ما استجابش"
        text: |
          لو المريض عنده medium/large varices و contraindications أو side-effects للـ beta-blockers، الاختيارات اللي اتدرست: no treatment، **long-acting nitrates**، أو EBL.

          **الـ carvedilol**
          - بيعمل decrease في الـ hepatic venous pressure gradient (HVPG) أكبر بكتير من الـ propranolol.
          - نسبة كبيرة من الـ non-responders للـ propranolol بيحققوا haemodynamic response عليه.
          - والاستجابة دي مرتبطة بنتايج أحسن: variceal bleeding أقل، decompensation أقل، و death أقل.

          ليه أقوى؟ عنده ==additional α-adrenergic blockade==. الـ propranolol بيقلل الـ F بس، والـ carvedilol كمان بيرخّي الأوعية جوه الكبد فيقلل الـ R. بيضرب في الطرفين من P = R × F.

          ==Haemodynamic response==: الـ HVPG ينزل 20% أو أكتر، أو يوصل أقل من 12 mmHg.

          مثال: HVPG كان 18، بقى 14. ده نزول 22%، يبقى استجاب حتى لو لسه فوق 12.

          والكتاب بيقول: NSBBs أو EBL recommended للـ primary prophylaxis في مرضى الـ esophageal varices.
