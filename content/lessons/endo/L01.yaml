      - "Carcinoid 3%: bronchi، GIT، pancreas، thymus؛ غالبًا من غير carcinoid syndrome."
      - "Lipomas لحد الثلث ومبترجعش؛ كمان thyroid benign، ependymoma، collagenoma، angiofibroma."
      - "Mimics: ورم sporadic/familial، hypercalcemia (↑ gastrin)، H2 blockers/metoclopramide (↑ prolactin)."
