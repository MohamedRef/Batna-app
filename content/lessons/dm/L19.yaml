        title: "مين يقيس Lp(a)؟"
        quote: "People with extremely high Lp(a) levels >180 mg/ dL have an increased lifetime risk of ASCVD similar to HeFH."
        text: |
          - Lp(a) أكتر من ==180 mg/dL== = lifetime ASCVD risk زي الـ **HeFH** (heterozygous FH).
          - يتقاس **مرة واحدة على الأقل** في عمر كل إنسان، لو متاح.
          - وفي اللي عندهم **family history of premature CVD**.
      - kind: check
