lessons:
  # ------------------------------------------------------------------
  - id: rheum.L17.lesson1
    title: "عيلة الـ spondyloarthritis وضهر الـ AS"
    hook: "ضهر شاب في العشرينات بيوجعه الصبح ويرتاح لما يتحرك. ده مش ضهر عادي، ده باب عيلة كاملة من الأمراض."
    minutes: 8
    pages: [279, 280]
    topics: [spa, as-history]
    goals:
      - "تعرف صفات الـ SpA المشتركة وتقسيمها وليه الـ enthesis بيفرق"
      - "تلقط الـ AS من الـ history وتعرف ليه الرياضة بتحسّنه"
      - "تعرف ليه الـ AS بيتوه في الستات"
    status: unverified
    steps:
      - kind: explain
        page: 279
        title: "يعني إيه SpA؟"
        quote: "Spondyloarthropathy (SpA) refers to a heterogeneous, interrelated group of rheumatic diseases that present common clinical and genetic features, which are classified as peripheral or axial (axSpA) based on what parts of the body are predominantly affected."
        text: |
          الـ ==spondyloarthropathy== عيلة أمراض روماتيزمية مختلفة بس قرايب: ليهم صفات clinical و genetic مشتركة.

          بنقسمهم حسب المكان اللي أكتر متأثر: **axial** (axSpA: العمود الفقري والـ sacroiliac) أو **peripheral**.
      - kind: figure
        page: 279
        quote: "Spondyloarthropathy (SpA) refers to a heterogeneous, interrelated group of rheumatic diseases that present common clinical and genetic features, which are classified as peripheral or axial (axSpA) based on what parts of the body are predominantly affected."
        title: "العيلة على محورين"
        alt: "A bar from axial to peripheral. On the axial side: ankylosing spondylitis and non-radiographic axial SpA. In the middle: undifferentiated SpA and juvenile-onset AS. Towards the peripheral side: reactive arthritis, SpA with psoriasis, SpA with IBD. Under the bar, shared ground: HLA-B27, enthesitis, eye and family history."
        caption: "كل فرد في العيلة ليه مكان بين **axial** (الضهر والـ sacroiliac) و **peripheral** (مفاصل الأطراف). والأرض المشتركة تحتهم: ==HLA-B27== والـ enthesitis والعين والعيلة."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="20" width="310" height="10" rx="5" class="fg-acc"/>
            <text x="10" y="15" class="t-sm t-b">Axial</text>
            <text x="320" y="15" text-anchor="end" class="t-sm t-b">Peripheral</text>
            <rect x="10" y="45" width="110" height="26" rx="6" class="fg-box"/>
            <text x="65" y="63" text-anchor="middle" class="t-sm">AS</text>
            <rect x="10" y="78" width="110" height="26" rx="6" class="fg-box"/>
            <text x="65" y="96" text-anchor="middle" class="t-sm">nr-axSpA</text>
            <rect x="125" y="45" width="85" height="26" rx="6" class="fg-thin"/>
            <text x="167" y="63" text-anchor="middle" class="t-sm">uSpA</text>
            <rect x="125" y="78" width="85" height="26" rx="6" class="fg-thin"/>
            <text x="167" y="96" text-anchor="middle" class="t-sm">Juvenile AS</text>
            <rect x="215" y="45" width="105" height="26" rx="6" class="fg-box"/>
            <text x="267" y="63" text-anchor="middle" class="t-sm">Reactive</text>
            <rect x="215" y="78" width="105" height="26" rx="6" class="fg-box"/>
            <text x="267" y="96" text-anchor="middle" class="t-sm">Psoriasis SpA</text>
            <rect x="215" y="111" width="105" height="26" rx="6" class="fg-box"/>
            <text x="267" y="129" text-anchor="middle" class="t-sm">IBD SpA</text>
            <rect x="10" y="155" width="310" height="66" rx="8" class="fg-good"/>
            <text x="165" y="175" text-anchor="middle" class="t-sm t-b">Shared ground</text>
            <text x="165" y="193" text-anchor="middle" class="t-sm">HLA-B27, no RF, enthesitis</text>
            <text x="165" y="210" text-anchor="middle" class="t-sm">eye, aortic valve, family, overlap</text>
          </svg>
      - kind: mnemonic
        page: 279
        quote: "They are characterized by:\n  Absence of rheumatoid factor.\n  Axial arthritis including spondylitis and sacroiliitis.\n  Peripheral inflammatory oligoarthritis.\n  Enthesitis rather than synovitis.\n  Extra-articular changes may involve the eye, the aortic valve, the lung parynchema, the skin and the lung.\n  Overlap among the various diseases.\n  Tendency towards familial aggregation.\n  Presence of HLA-B27."
        word: "SPINE"
        parts:
          - { key: "S", text: "Seronegative: no rheumatoid factor" }
          - { key: "P", text: "Peripheral inflammatory oligoarthritis" }
          - { key: "I", text: "Inflammation of the enthesis (enthesitis rather than synovitis)" }
          - { key: "N", text: "Not just joints: eye, aortic valve, lung, skin" }
          - { key: "E", text: "Everybody in the family + HLA-B27 (familial aggregation, overlap)" }
        hook: "صفات الـ SpA كلها في **SPINE**: العمود الفقري نفسه هو اسم العيلة."
      - kind: explain
        remind: [rheum.L17.004]
        page: 279
        title: "أفراد العيلة"
        quote: "Classification of Spondyloarthr it is\n  Ankylosing spondylitis (AS).\n  Non-radiographic axial SpA (nr-axSpA).\n  Undifferentiated spondyloarthritis (UspA).\n  Reactive arthritis (Reiter syndrome).\n  SpA associated with psoriasis."
        text: |
          1. **Ankylosing spondylitis** (AS)
          2. **Non-radiographic axial spondyloarthritis (SpA)** (nr-axSpA)
          3. **Undifferentiated SpA** (uSpA)
          4. **Reactive arthritis** (Reiter)
          5. SpA مع ==psoriasis==
          6. SpA مع ==inflammatory bowel disease (IBD)== (Crohn و ulcerative colitis (UC))
          7. Juvenile-onset AS

          ليه بنجمعهم في عيلة واحدة؟ لأنهم بيشاركوا نفس الصفات (SPINE) ونفس الـ HLA-B27، وفيه overlap بينهم: نفس العيان ممكن تلاقي عنده ملامح من اتنين.
      - kind: reveal
        page: 279
        quote: "Enthesitis rather than synovitis."
        prompt: "الـ RA مرض synovium. الـ SpA مرض enthesis. الفرق ده بيغيّر إيه في شكل المرض؟"
        answer: |
          الـ **enthesis** هو المكان اللي الـ tendon أو الـ ligament بيمسك فيه في العضم (زي الـ Achilles في الكعب، والـ annulus fibrosus في الفقرات).

          التفسير المقبول (مش في الكتاب): لما الـ synovium يلتهب (RA) بيطلع pannus **ياكل** الغضروف والعضم. لما الـ enthesis يلتهب (SpA) بيخف بـ **عضم جديد** يطلع مكان الالتهاب، فبدل ما المفصل يتهدّ، **يلحم**. علشان كده الـ RA = erosions و deformity، والـ SpA = ==ankylosis== و bamboo spine (هتشوفه في ص 282 و 286).

          وكمان: الـ SpA ==seronegative== (مفيش RF)، علشان كده الكتاب بيبدأ بيها أول صفة.
      - kind: check
        page: 279
        quote: "They are characterized by:\n  Absence of rheumatoid factor.\n  Axial arthritis including spondylitis and sacroiliitis.\n  Peripheral inflammatory oligoarthritis.\n  Enthesitis rather than synovitis.\n  Extra-articular changes may involve the eye, the aortic valve, the lung parynchema, the skin and the lung.\n  Overlap among the various diseases.\n  Tendency towards familial aggregation.\n  Presence of HLA-B27."
        question: "إيه الـ lesion الأساسي في الـ SpA اللي بيفرّقها عن الـ RA؟"
        options: ["Enthesitis", "Synovitis", "Vasculitis", "Crystal deposition"]
        answer: 0
        why:
          - "صح: الـ SpA = enthesitis أكتر من synovitis. الـ enthesis هو مكان ما الـ tendon أو الـ ligament بيمسك في العضم."
          - "الـ synovitis هو أساس الـ RA."
          - "الـ vasculitis مش الـ lesion الأساسي هنا."
          - "الـ crystals دي gout و pseudogout."
      - kind: explain
        page: 280
        title: "الـ history اللي يصرخ AS"
        quote: "Key components of the patient history that suggest AS include the following:\n  Insidious onset of low back pain.\n  Onset of symptoms before age 40 years(20-30years).\n  Presence of symptoms for more than 3 months.\n  Symptoms worse in the morning or with inactivity.\n  Improvement of symptoms with exercise."
        text: |
          - Low back pain بيبدأ ==بالراحة== (insidious)
          - قبل **40 سنة** (غالبًا 20-30)
          - أكتر من **3 شهور**
          - ==أوحش الصبح== أو مع قلّة الحركة
          - **بيتحسّن مع الرياضة**

          الـ M:F = **4:1**، والـ prevalence قريب من الـ rheumatoid arthritis (RA).

          التفسير المقبول (مش في الكتاب): كل بند بيفرّق الـ inflammatory عن الـ mechanical. السن الصغير لأن الـ degenerative بييجي متأخر، والـ 3 شهور علشان الشد العادي بيخف قبلها، والصبح والرياضة علشان الالتهاب (الخطوة الجاية).
      - kind: aside
        tone: analogy
        page: 280
        quote: "Key components of the patient history that suggest AS include the following:\n  Insidious onset of low back pain.\n  Onset of symptoms before age 40 years(20-30years).\n  Presence of symptoms for more than 3 months.\n  Symptoms worse in the morning or with inactivity.\n  Improvement of symptoms with exercise."
        text: "الـ mechanical back pain زي العربية اللي بتسخن لما تمشي كتير: الحركة بتوجّعها والراحة بتريّحها. الـ **inflammatory** بالعكس: زي الباب اللي مفصّلاته صدّت، أول ما تفتحه وتقفله كذا مرّة يلين: أسوأ في الـ **morning**، وأحسن مع الـ **exercise**."
      - kind: reveal
        page: 280
        quote: "Improvement of symptoms with exercise."
        prompt: "ليه ضهر الـ AS بيتحسّن مع الرياضة وبيوحش بالراحة، عكس الضهر الميكانيكي؟"
        answer: |
          التفسير المقبول (مش في الكتاب): نفس فكرة الـ morning stiffness في الـ RA: وانت ساكن، الـ **oedema** والـ inflammatory mediators بيتجمّعوا في المكان الملتهب، فالضهر يتيبّس. الحركة بتصرّفهم فالتيبّس يفك.

          الوجع **الميكانيكي** بالعكس: سببه شد أو تآكل، فالحمل بيزوّده والراحة بتريّحه.

          علشان كده الكتاب بيحط **worse in the morning or with inactivity** و **improvement with exercise** في الـ history اللي بتقول AS. ودي هتلاقيها تاني في الـ criteria (ص 287): pain ==improved by exercise, unrelieved by rest==.
      - kind: check
        page: 280
        quote: "Onset of symptoms before age 40 years(20-30years)."
        question: "Which history argues against ankylosing spondylitis?"
        options: ["Back pain that began suddenly at 55 after lifting, better with rest", "Insidious back pain since age 24", "Back pain for more than 3 months", "Back pain worse in the morning, better with exercise"]
        answer: 0
        why:
          - "صح: بداية مفاجئة بعد شيل حاجة، بعد الـ 40، وبتتحسن بالراحة: ده ميكانيكي."
          - "Insidious وقبل 40 (غالبًا 20–30): AS."
          - "أكتر من 3 شهور: من الـ history بتاع الـ AS."
          - "الصبح أوحش والرياضة بتحسّن: inflammatory."
      - kind: reveal
        page: 280
        quote: "Women tend to have more peripheral joint manifestations thus leading to an inappropriate diagnosis of RA."
        prompt: "ليه الـ AS ممكن يتوه في الستات؟"
        answer: "3 أسباب: الأعراض **non-specific** ووجع الستات بيتشخّص أقل، وعندهم **peripheral joints** أكتر فيتقال RA، و **new bone formation أقل** فالـ X-ray مش بيبيّن."
      - kind: try
        items: [rheum.L17.001, rheum.L17.002, rheum.L17.004, rheum.L17.007, rheum.L17.009]
    recap:
      - "SpA: seronegative، axial + peripheral oligoarthritis، enthesitis، extra-articular، عيلة، HLA-B27 (SPINE)."
      - "7 أفراد: AS، nr-axSpA، uSpA، reactive، psoriasis، IBD، juvenile."
      - "Enthesitis بيخف بعضم جديد (ankylosis)؛ synovitis الـ RA بياكل (erosions)."
      - "AS history: insidious، قبل 40، أكتر من 3 شهور، الصبح أوحش، الرياضة بتحسّن. M:F 4:1."
      - "الستات: أعراض non-specific، peripheral أكتر، عضم جديد أقل."
    practice: [rheum.L17.001, rheum.L17.002, rheum.L17.003, rheum.L17.004, rheum.L17.005, rheum.L17.006, rheum.L17.007, rheum.L17.008, rheum.L17.009, rheum.L17.010]
