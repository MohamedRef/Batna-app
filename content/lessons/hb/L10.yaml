lessons:
  # ------------------------------------------------------------------
  - id: hb.L10.lesson1
    title: "الكبد وقع فجأة: يعني إيه ALF؟"
    hook: "مريض كبده كان سليم الشهر اللي فات، والنهارده مش عارف اسمه. الساعة بتحسب من الصفار."
    minutes: 9
    pages: [172, 175]
    topics: [overview, definition, presentation]
    goals:
      - "تعرّف الـ ALF بالتلات features"
      - "تقسم hyperacute و acute و subacute بالأيام وتعرف الفرق في الصورة والـ prognosis"
      - "تعرف الاستثناءات اللي بتتحسب ALF رغم وجود مرض مزمن"
    status: unverified
    steps:
      - kind: explain
        page: 172
        title: "الصورة الكبيرة"
        quote: "The defining features of ALF are hepatic encephalopathy, coagulopathy, and jaundice in patients without underlying liver disease."
        text: |
          **Acute liver failure (ALF)**: syndrome فيه rapidly progressive hepatic dysfunction مع risk عالي للوفاة.

          التلات **defining features**:
          - ==Hepatic encephalopathy==
          - ==Coagulopathy==
          - **Jaundice**

          والشرط إن المريض مكانش عنده liver disease قبل كده. والـ jaundice-to-encephalopathy interval هو اللي بيحدد الـ subtypes.

          **الأسباب الأشهر**:
          - في أمريكا وأوروبا: **DILI** و **acetaminophen**.
          - في الدول النامية زي مصر: **acute viral hepatitis**.

          **أسباب الوفاة**: **cerebral edema** و **sepsis**.

          **أقوى predictor of survival** هو السبب نفسه:
          - الـ acetaminophen والـ acute viral hepatitis: prognosis أحسن.
          - الـ Wilson disease والأدوية غير الـ acetaminophen: prognosis وحش جدًا.

          **العلاج** بيقوم على 3 حاجات: ICU monitoring، specific therapy حسب السبب، و aggressive treatment للمضاعفات. وأي مريض ممكن يحتاج زرع لازم يتحوّل بسرعة لمركز زرع، لأن الـ LT بيحسّن الـ survival جدًا.
      - kind: check
        page: 172
        question: "What does the book name as the strongest predictor of survival in ALF?"
        options:
          - "The cause of ALF"
          - "Peak ALT"
          - "Serum ammonia"
          - "Patient age"
        answer: 0
        why:
          - "صح: **the cause of ALF is the strongest predictor of survival**."
          - "الـ ALT مش reliable، وبينزل مع موت الخلايا كمان."
          - "الـ ammonia >150 مرتبط بالـ ICP، بس مش الأقوى."
          - "السن جزء من الـ King's College، بس مش الأقوى."
      - kind: explain
        page: 173
        title: "من ALI لـ ALF"
        text: |
          **Acute liver injury (ALI)**: أول خطوة في الطريق. فيها:
          - transaminases عالية 2–3 أضعاف.
          - impaired liver function: jaundice و coagulopathy.
          - وده بييجي قبل الـ encephalopathy، في مريض مفيش عنده chronic liver disease.

          لما الـ encephalopathy تظهر، بنعدّي من ALI لـ ALF.

          **Trey and Davidson (1970)** سموها **fulminant liver failure**، وعرّفوها بـ 3 حاجات:
          - ==potentially reversible==: الكبد ممكن يرجع.
          - **HE خلال 8 أسابيع** من أول أعراض.
          - **مفيش pre-existing liver disease**.

          في 1993 التعريف اتعدّل علشان ياخد في اعتباره السبب والمضاعفات والـ prognosis. والساعة بقت تبدأ من الصفار (jaundice as the first symptom) لحد الـ HE. شوف الرسمة.
      - kind: figure
        page: 173
        title: "الساعة بتبدأ من الصفار"
        alt: "A timeline from jaundice at day 0: up to 7 days hyperacute, 8 to 28 days acute, 5 to 12 weeks subacute. Below, two panels. Hyperacute: very high INR and ALT, only mild bilirubin, organ failure common, recovers more often. Subacute: milder ALT, deep jaundice, ascites, spleen, shrinking liver, very poor once HE appears. Notes: IASL 1999 uses under 10 days, 10 to 30 days and 5 to 24 weeks; more than 28 weeks is chronic liver disease."
        caption: "المفارقة: الأسرع (==hyperacute==) هو اللي بيخف أكتر، والأبطأ (==subacute==) أول ما يعمل HE يبقى خطير جدًا."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
          <defs><marker id="L10a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
          <text x="165" y="20" text-anchor="middle" class="t-b">From jaundice to encephalopathy</text>
          <text x="165" y="38" text-anchor="middle" class="t-sm t-mut">1993 classification (book)</text>
          <path d="M20 70H312" class="fg-arrow" marker-end="url(#L10a)"/>
          <circle cx="24" cy="70" r="6" class="fg-dot-acc"/>
          <text x="12" y="104" class="t-sm t-b">day 0: jaundice</text>
          <rect x="30" y="54" width="40" height="32" rx="4" class="fg-bad" opacity="0.9"/>
          <rect x="72" y="54" width="70" height="32" rx="4" class="fg-acc"/>
          <rect x="144" y="54" width="150" height="32" rx="4" class="fg-box"/>
