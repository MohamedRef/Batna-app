  # ------------------------------------------------------------------
  - id: geri.L01.lesson2
    title: "الضغط: رقمين، guidelineين، وحاج عنده 85"
    hook: "130 ولا 140؟ الإجابة بتعتمد على مين بيسأل، وعلى سن العيان، وعلى هو frail ولا لأ."
    minutes: 10
    pages: [4, 7]
    topics: [htn, htn-treatment]
    goals:
      - "تحفظ أرقام الـ key facts"
      - "تقارن ACC/AHA بـ ESC/ESH"
      - "تعالج الضغط في الـ 65–79 والـ 80+ والـ frail"
    status: unverified
    steps:
      - kind: explain
        page: 4
        title: "Key facts"
        quote: "An estimated 1.28 billion adults aged 30–79 years worldwide have hypertension, most (two-thirds) living in low- and middle-income countries"
        text: |
          - **1.28 billion** بالغ (30–79 سنة) عندهم ضغط، **الثلثين** في الدول الفقيرة والمتوسطة.
          - **46%** مش عارفين إن عندهم ضغط.
          - **42%** بس متشخصين وبيتعالجوا.
          - **21%** (واحد من خمسة) الضغط عندهم ==under control==.

          والضغط **major cause of premature death**. وأخطاء قياس الضغط سبب كبير للـ misclassification.
      - kind: aside
        tone: tip
        page: 4
        quote: "Less than half of adults (42%) with hypertension are diagnosed and treated.\nApproximately 1 in 5 adults (21%) with hypertension have it under control."
        text: "افتكرها كده: **46** مش عارفين، **42** بيتعالجوا، **21** متظبطين. كل رقم تقريبًا نص اللي قبله: 42 ← 21."
      - kind: reveal
        page: 4
        quote: "Mr Saied is a 63-year-old male On examination His clinic blood pressures is 176/108 mmHg. Additionally, you have identified left ventricular hypertrophy on ECG. You are unable to confirm the diagnosis of hypertension with ambulatory blood pressure monitoring (ABPM) because he has refused it because he is a bus driver and it would interfere with his driving. What alternative test could you use to diagnose hypertension?"
        prompt: "PS (3): سوّاق أتوبيس، 63 سنة، ضغطه في العيادة 176/108 و LVH على الـ ECG، ورافض الـ ABPM علشان شغله. تأكّد التشخيص بإيه؟"
        answer: |
          بـ **home blood pressure monitoring (HBPM)**: يقيس في البيت بجهاز معتمد، قراءتين الصبح وقراءتين بالليل لمدة كام يوم، وتاخد المتوسط.

          الكتاب ما كتبش الإجابة؛ دي الإجابة المعروفة (NICE). والـ left ventricular hypertrophy (LVH) بيقولك إن الضغط ده قديم وعامل target organ damage.
      - kind: table
        page: 5
        quote: "The Latest ACC/AHA and ESC/ESH Hypertension Guidelines.\n| Parameter | ACC/AHA | ESC/ESH |\n|---|---|---|\n| Definition of hypertension (mm Hg) | >130/80 | > 140/90 |\n| Grading of normal pressure (mm Hg) | Normal <120/80; High normal 120–129/<80 | Normal 120–129/80–84; High normal 130–139/85–89; Optimal <120/80 |\n| Grading of hypertension (mm Hg) | Grade 1, 130–139/80–89; Grade 2, ≥140/90 | Grade 1 140–159/90–99; Grade 2, 160–179/100–109; Grade 3, ≥180/110 |\n| Target blood pressure in various subsets | ≤65 y, <130/80; ≥65 y, <130/80 | <65 y, <130/80; ≥65 y, <140/80 |"
        title: "ACC/AHA 2017 ضد ESC/ESH 2018"
        columns: [Point, ACC/AHA, ESC/ESH]
        rows:
          - [Hypertension, ">130/80", ">140/90"]
          - [Normal, "<120/80", "120–129/80–84"]
          - [High normal, "120–129/<80", "130–139/85–89"]
          - [Grade 1, "130–139/80–89", "140–159/90–99"]
          - [Grade 2, "≥140/90", "160–179/100–109"]
          - [Grade 3, "None", "≥180/110"]
          - [Target <65 y, "<130/80", "<130/80"]
          - [Target ≥65 y, "<130/80", "<140/80"]
        hide: [[0, 1], [0, 2], [3, 1], [3, 2], [7, 2]]
      - kind: aside
        tone: trap
        page: 5
        quote: "The Latest ACC/AHA and ESC/ESH Hypertension Guidelines.\n| Parameter | ACC/AHA | ESC/ESH |\n|---|---|---|\n| Definition of hypertension (mm Hg) | >130/80 | > 140/90 |\n| Grading of normal pressure (mm Hg) | Normal <120/80; High normal 120–129/<80 | Normal 120–129/80–84; High normal 130–139/85–89; Optimal <120/80 |\n| Grading of hypertension (mm Hg) | Grade 1, 130–139/80–89; Grade 2, ≥140/90 | Grade 1 140–159/90–99; Grade 2, 160–179/100–109; Grade 3, ≥180/110 |\n| Target blood pressure in various subsets | ≤65 y, <130/80; ≥65 y, <130/80 | <65 y, <130/80; ≥65 y, <140/80 |"
        text: "الفخ: **الأمريكان أشد**. عندهم الضغط يبدأ من **130/80**، وعندهم **grade 2** بس. الأوروبيين يبدأوا من **140/90** وعندهم **3 grades**، و **optimal <120/80**. والـ target فوق 65 عند الأوروبيين **<140/80**."
      - kind: update
        page: 5
        quote: "The Latest ACC/AHA and ESC/ESH Hypertension Guidelines.\n| Parameter | ACC/AHA | ESC/ESH |\n|---|---|---|\n| Definition of hypertension (mm Hg) | >130/80 | > 140/90 |\n| Grading of normal pressure (mm Hg) | Normal <120/80; High normal 120–129/<80 | Normal 120–129/80–84; High normal 130–139/85–89; Optimal <120/80 |\n| Grading of hypertension (mm Hg) | Grade 1, 130–139/80–89; Grade 2, ≥140/90 | Grade 1 140–159/90–99; Grade 2, 160–179/100–109; Grade 3, ≥180/110 |\n| Target blood pressure in various subsets | ≤65 y, <130/80; ≥65 y, <130/80 | <65 y, <130/80; ≥65 y, <140/80 |"
        text: "الـ European Society of Cardiology (ESC) 2024 عمل category جديدة اسمها **elevated blood pressure (BP)** (120–139/70–89)، والـ target بقى systolic **120–129** لو العيان مستحمل، حتى عند أغلب الكبار، ويتساهل فوق **85** أو في الـ frail. في الامتحان: جدول الكتاب."
        ref: "ESC Guidelines for the management of elevated blood pressure and hypertension, 2024"
      - kind: check
        page: 5
        quote: "The Latest ACC/AHA and ESC/ESH Hypertension Guidelines.\n| Parameter | ACC/AHA | ESC/ESH |\n|---|---|---|\n| Definition of hypertension (mm Hg) | >130/80 | > 140/90 |\n| Grading of normal pressure (mm Hg) | Normal <120/80; High normal 120–129/<80 | Normal 120–129/80–84; High normal 130–139/85–89; Optimal <120/80 |\n| Grading of hypertension (mm Hg) | Grade 1, 130–139/80–89; Grade 2, ≥140/90 | Grade 1 140–159/90–99; Grade 2, 160–179/100–109; Grade 3, ≥180/110 |\n| Target blood pressure in various subsets | ≤65 y, <130/80; ≥65 y, <130/80 | <65 y, <130/80; ≥65 y, <140/80 |"
        question: "Office BP repeatedly 136/86 mmHg. ACC/AHA and ESC/ESH call it:"
        options:
          - "ACC/AHA grade 1; ESC/ESH high normal"
          - "Hypertension in both"
          - "Normal in both"
          - "ACC/AHA high normal; ESC/ESH grade 1"
        answer: 0
        why:
          - "صح: 130–139/80–89 = grade 1 أمريكاني، و 130–139/85–89 = high normal أوروبي."
          - "الأوروبي ما بيقولش hypertension غير فوق 140/90."
          - "الـ normal تحت 120/80 أو 120–129/80–84."
          - "معكوسة: الأمريكي هو اللي بيقول grade 1."
      - kind: figure
        page: 6
        quote: "Non pharmacological Treatment of Hypertension\nAvoid harmful habits, smoking, alcohol\nReduce salt and high fat diets\nLoose weight, if obese\nRegular exercise\nDASH diet"
        title: "سلّم العلاج من غير أدوية"
        alt: "Five ascending stairs: avoid smoking and alcohol at the bottom, then reduce salt and fat, lose weight if obese, regular exercise, and DASH diet at the top."
        caption: "نفس سلّم الكتاب: تطلعه درجة درجة. والـ lifestyle modification لكل عيان ضغط من غير استثنا."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="180" width="300" height="40" class="fg-box"/>
            <text x="20" y="205" class="t-sm t-b">1. Avoid smoking, alcohol</text>
            <rect x="60" y="140" width="250" height="40" class="fg-box"/>
            <text x="70" y="165" class="t-sm t-b">2. Reduce salt and high fat</text>
            <rect x="110" y="100" width="200" height="40" class="fg-box"/>
            <text x="120" y="125" class="t-sm t-b">3. Lose weight if obese</text>
            <rect x="160" y="60" width="150" height="40" class="fg-box"/>
            <text x="170" y="85" class="t-sm t-b">4. Regular exercise</text>
            <rect x="210" y="20" width="100" height="40" class="fg-acc"/>
            <text x="220" y="45" class="t-sm t-b t-acc">5. DASH diet</text>
          </svg>
      - kind: explain
        page: 6
        title: "أول دوا"
        quote: "Treatment of Hypertension\nLifestyle Modifications\nNot at Goal Blood Pressure (<140/90 mmHg) (<130/80 mmHg for those with diabetes or chronic kidney disease)\nInitial Drug Choices\n  Without Compelling Indications\n    Stage 1 Hypertension (SBP 140–159 or DBP 90–99 mmHg): Thiazide-type diuretics for most. May consider ACEI, ARB, BB, CCB, or combination.\n    Stage 2 Hypertension (SBP ≥160 or DBP ≥100 mmHg): 2-drug combination for most (usually thiazide-type diuretic and ACEI, or ARB, or BB, or CCB)\n  With Compelling Indications\n    Drug(s) for the compelling indications. Other antihypertensive drugs (diuretics, ACEI, ARB, BB, CCB) as needed.\nNot at Goal Blood Pressure\n  Optimize dosages or add additional drugs until goal blood pressure is achieved. Consider consultation with hypertension specialist."
        text: |
          الـ algorithm بتاع الكتاب: lifestyle، ولو مش at goal، يعني فوق **140/90** أو فوق **130/80** في **diabetes** و **chronic kidney disease (CKD)**:
          - **Stage 1** (140–159 / 90–99): ==thiazide-type diuretic== لأغلبهم، أو angiotensin-converting enzyme inhibitor (ACEI) أو angiotensin II receptor blocker (ARB) أو beta-blocker (BB) أو calcium channel blocker (CCB).
          - **Stage 2** (≥160 / ≥100): **two-drug combination** ، عادة thiazide + ACEI أو ARB أو BB أو CCB.
          - **Compelling indication**: الدوا بتاع الـ indication نفسها.

          لسه مش at goal؟ ظبّط الجرعات أو زوّد دوا، وفكّر في hypertension specialist.
      - kind: table
        page: 7
