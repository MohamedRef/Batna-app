  - id: endo.L06.lesson2
    title: "عيّان مش عنده غدة: الـ non-thyroidal illness"
    hook: "مريض في الـ ICU بـ T4 واطي وT3 واطي. هل تديله thyroxine؟ لأ، وهنعرف ليه."
    minutes: 8
    pages: [103, 105]
    topics: [nti]
    goals:
      - "تعرف الـ NTI: النمط والأسباب"
      - "تشرح الـ mechanisms وليه هو تكيّف مفيد"
      - "متتخضّش من الـ TSH العالي في فترة النقاهة"
    status: unverified
    steps:
      - kind: explain
        page: 103
        quote: "2. Non-thyroidal illness (sick euthyroid syndrome) A common pitfall is to overlook the confounding effects of NTI. NTI is a common finding following any acute or chronic illness defined by the absence of an intrinsic abnormality of HPT function."
        title: "الـ NTI (sick euthyroid)"
        text: |
          أول قاعدة: اطلب الـ thyroid function tests (TFTs) **بس لو فيه clinical features** لمشكلة في الغدة.

          الـ ==non-thyroidal illness==: بيحصل بعد أي مرض acute أو chronic، **من غير** عيب حقيقي في الـ hypothalamic–pituitary–thyroid (HPT) axis. ده **beneficial adaptive change** بيقلل الـ metabolic rate.
      - kind: table
        page: 104
        quote: "nonthyroidal ↓TT4 ↓TT3 ↑ reverse T3 ↓ or N TSH illness"
        title: "النمط"
        columns: ["Test", "NTI"]
        rows:
          - ["Total T4", "↓"]
          - ["Total T3", "↓"]
          - ["Reverse T3", "↑"]
          - ["TSH", "↓ or normal"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: explain
        remind: [endo.L06.021]
        page: 104
        quote: "Changes in TH may occur 24 h after the onset of nonthyroidal illness in subjects with:\n  Poor nutrition.\n  Starvation.\n  Sepsis.\n  Burns.\n  Malignancy.\n  Myocardial infarction.\n  Post-surgery.\n  Chronic liver and renal disease."
        title: "بيحصل إمتى وليه؟"
        text: |
          بيبدأ بعد **24 ساعة** من المرض في: poor nutrition، starvation، **sepsis**، burns، malignancy، **myocardial infarction (MI)**، بعد العمليات، وأمراض الكبد والكلى المزمنة.

          الـ total hormones بتقع عشان الـ ==binding proteins== بتقل. والـ mechanisms:

          - ↓thyrotropin-releasing hormone (TRH) (paraventricular nuclei) و ↓TSH.
          - ↓binding capacity و ↓cellular uptake.
          - **Altered deiodinase**، وده سبب الـ rT3 العالي.
          - ↓leptin في الـ malnutrition.
          - Cytokines: IL-1، IL-6، TNF-α.
          - Excess endogenous **glucocorticoids**.
      - kind: reveal
        page: 104
        quote: "The reduction in total hormone is due to reduced TH binding capacity secondary to a fall in TH binding protein concentrations."
        prompt: "الـ total T4 واطي في الـ NTI. ليه ده مش معناه إن المريض hypothyroid؟"
        answer: "الكتاب بيدّي السبب: الـ total بيقع عشان **الـ binding proteins نفسها قلت**، مش عشان الغدة بطّلت. ارجع للدرس الأول: الـ total بيتحرك مع البروتين، والـ free ممكن يفضل قريب من الطبيعي. وكمان الـ TSH مش عالي (واطي أو طبيعي)، يعني الـ pituitary مش شايف نقص يستاهل يعوّضه. علشان كده إدّي thyroxine هنا بتعالج رقم، وممكن تشيل من الجسم تكيّف مفيد."
      - kind: aside
        tone: joke
        page: 103
        quote: "It is considered a secondary beneficial adaptive change to reduce metabolic rate."
        text: "الجسم في الـ sepsis عامل زي البيت في انقطاع الكهربا: قافل التكييف (metabolic rate) عشان يوفّر للتلاجة. متجيش أنت تشغّل التكييف بـ thyroxine."
      - kind: check
        page: 104
        quote: "nonthyroidal ↓TT4 ↓TT3 ↑ reverse T3 ↓ or N TSH illness"
        question: "Which finding best separates non-thyroidal illness (NTI) from central hypothyroidism here?"
        options: ["High reverse T3", "Low TSH", "Low total T4", "Low total T3"]
        answer: 0
        why:
          - "صح: الـ rT3 بيعلى في الـ NTI بسبب تغيير الـ deiodinase."
          - "الـ TSH ممكن يبقى واطي أو طبيعي في الاتنين."
          - "الـ total thyroxine (TT4) واطي في الاتنين."
          - "الـ total triiodothyronine (TT3) واطي في الاتنين."
      - kind: explain
        page: 104
        quote: "Pro-inflammatory cytokines (IL-1, IL-6, TNF-a) in infectious, inflammatory and neoplastic states.\n  Excess endogenous glucocorticoids."
        title: "كل ميكانيزم ليه منطق"
        text: |
          الكتاب بيقول إن الميكانيزم الدقيق لسه «debatable». بس كل واحد بيوصّل لنفس النتيجة: **metabolic rate أقل**.
          - **↓TRH و ↓TSH**: المخ نفسه بيوطّي الطلب على الهرمون، علشان كده الـ TSH مش بيعلى رغم الـ T4 الواطي.
          - **↓binding و ↓cellular uptake**: هرمون أقل بيوصل جوه الخلية.
          - **Altered deiodinase**: T4 أقل بيتحول T3 (الفعّال) وأكتر بيروح rT3 (الطافي).
          - **↓leptin** في الـ malnutrition: الجسم بيقرا إن مفيش أكل، فبيوفّر.
          - **Cytokines** (IL-1، IL-6، TNF-α) في العدوى والالتهاب والأورام، و **glucocorticoids** زيادة من الـ stress، والاتنين بيكبتوا المحور.

          يعني كله رسالة واحدة: «الجسم في أزمة، وفّر طاقة».
      - kind: case
        page: 105
        quote: "During recovery from intercurrent illness, TH and TSH return to normal, although in some patients TSH may become overtly elevated for a short period of time, it is important to be aware of this transient phenomenon in order to avoid inappropriate diagnosis and treatment."
        stem: "A 70-year-old man is recovering from a hip fracture repair and pneumonia. A routine panel on day 12 shows TSH 8.5 mU/L, FT4 normal."
        steps:
          - question: "What is the most likely explanation?"
            options: ["Recovery phase of NTI", "New Hashimoto's", "TSHoma", "Levothyroxine non-compliance"]
            answer: 0
            why: "في النقاهة الـ TSH ممكن يعلى شوية لفترة قصيرة. ده transient phenomenon."
          - question: "What should you do?"
            options: ["Repeat TFTs after recovery", "Start levothyroxine", "Pituitary MRI", "Thyroid ultrasound"]
            answer: 0
            why: "الكتاب بيحذّر من inappropriate diagnosis and treatment. استنى وكرر."
