            <rect x="152" y="40" width="168" height="18" rx="4" class="fg-acc"/>
            <text x="236" y="53" text-anchor="middle" class="t-sm">then antiresorptive</text>
            <text x="10" y="94" class="t-sm t-b">IV bisphos.</text>
            <rect x="110" y="82" width="63" height="18" rx="4" class="fg-box"/>
