      - kind: explain
        page: 182
        quote: "Regional: Cancers that have spread through the wall of the colon or rectum"
        title: "SEER: لغة الإحصائيات"
        text: |
          الكتاب: الـ **SEER summary staging** للتحليل الإحصائي وبيانات الـ tumor registry:
          - **In situ**: لسه ما بدأش يغزو الحيطة.
          - **Local**: دخل الحيطة بس ما عدّاهاش.
          - ==Regional==: عدّى الحيطة وغزا اللي جنبه، أو وصل للـ nodes القريبة.
          - **Distant**: انتشر لأماكن تانية زي الكبد أو الرئة.

          التفسير المقبول (مش في الكتاب): ليه نظامين؟ الـ TNM للدكتور اللي بيعالج مريض واحد، فيه تفاصيل بتغيّر العلاج. الـ SEER للي بيعدّ آلاف المرضى في سجل، فمحتاج تقسيم بسيط يتكتب من أي تقرير. وأرقام الـ presentation اللي شفتها (37% localized، 37% regional، 20% metastatic) مكتوبة بلغة شبه دي بالظبط.
      - kind: explain
        page: 182
        quote: "Type of surgery depend on site and stage of the tumor Palliative Chemo ( In Advanced Stages )"
        title: "العلاج"
        text: |
          - **Surgery**: نوعها بيعتمد على الـ site والـ stage.
          - **Surveillance, Epidemiology, and End Results (SEER)**: in situ، local، regional، distant (للإحصائيات).
          - **Palliative chemo** في الـ advanced: thymidylate synthase (TS) inhibitors (raltitrexed)، oral 5-FU prodrugs (==capecitabine==، Tegafur–uracil (UFT)، S-1)، irinotecan، oxaliplatin.
          - **Bevacizumab** (Avastin) ضد vascular endothelial growth factor (VEGF)، و**cetuximab** و**panitumumab** ضد epidermal growth factor receptor (EGFR).
          - **RT**: stage III مع الـ chemo؛ stage IV مع liver spread: ablation، chemo أو RT جوه الكبد، cryotherapy، مع الجراحة.

          التفسير المقبول (مش في الكتاب): ليه أدوية كتير للـ 5-FU؟ الـ 5-FU هو الأساس في علاج القولون، بس لازم يتدّى بالوريد لفترات طويلة. الـ prodrugs زي الـ capecitabine بتتاخد بالبُق وبتتحول لـ 5-FU جوه الجسم، فالمريض يتعالج في البيت.
      - kind: explain
        page: 183
        quote: "Delivering chemotherapy or radiation directly into the liver"
        title: "الأدوية الموجّهة، والـ RT، والكبد"
        text: |
          الكتاب:
          - **Oral 5-FU prodrugs**: ==capecitabine==، UFT (tegafur + uracil)، S-1، emitefur. و **5-FU modulators**: 5-ethynyluracil، trimetrexate. وجديد: **irinotecan**، **oxaliplatin**.
          - **Bevacizumab** (Avastin): monoclonal antibody ضد الـ **VEGF** (anti-angiogenesis). و **cetuximab** و **panitumumab**: EGFR-targeted.
          - **Radiotherapy**: stage III مع الـ chemo. وفي stage IV مع انتشار للكبد: **ablation**، chemo أو radiation **جوه الكبد مباشرة**، **cryotherapy**، أو combined with surgery.

          التفسير المقبول (مش في الكتاب): ليه الكبد بالذات ليه علاجات لوحده؟ لأن دم القولون كله بيروح للكبد الأول عن طريق الـ **portal vein**، فهو أول وأشهر مكان للـ metastasis، وأحيانًا الوحيد. فلو الانتشار في الكبد بس، علاجه محليًا (حرق، تجميد، حقن) ممكن يدّي المريض سنين.
      - kind: check
        page: 183
        quote: "anti-angiogenesis"
        question: "Which drug in the lecture's palliative colon cancer list is an anti-angiogenesis monoclonal antibody?"
        options: ["Bevacizumab", "Cetuximab", "Capecitabine", "Oxaliplatin"]
