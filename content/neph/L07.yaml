    kind: cloze
    topic: adpkd-renal
    text: "Cyst hemorrhage usually resolves in {{c1::2–7}} days. If hematuria or flank pain lasts over {{c2::1 week}}, or the first hematuria occurs after age {{c3::50}}, exclude neoplasm."
