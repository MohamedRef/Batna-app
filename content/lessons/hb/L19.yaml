      - kind: explain
        page: 387
        quote: "Gall stone ileusleading to acute intestinal obstruction."
        title: "الحصوة لما تخرج من المرارة"
        text: |
          **In the bile ducts** (التفسير المقبول، مش في الكتاب):
          - **Obstructive jaundice**: حصوة في الـ CBD قفلت مجرى الـ bile كله، مش المرارة بس، فالـ bilirubin بيرجع للدم.
          - **Cholangitis**: الـ bile الواقفة ورا الحصوة بيدخلها bacteria، فيحصل infection في القنوات. ودي الـ life-threatening cholangitis اللي في صفحة 381.
          - **Acute relapsing pancreatitis**: الحصوة بتعدّي على الـ ampulla اللي الـ pancreatic duct بيفتح فيها، فتقفلها. ولو الحصوات فضلت، النوبات بترجع، علشان كده اسمها relapsing.

          **In the intestine**:
          - ==Gallstone ileus==: الكتاب بيقول بيعمل **acute intestinal obstruction**. التفسير المقبول: مرارة ملتهبة لزقت في الأمعاء وعملت **fistula**، وحصوة كبيرة عدّت منها ووقفت في أضيق حتة، غالبًا الـ terminal ileum.
          - **Bouveret's syndrome**: نفس الـ fistula، بس الحصوة وقفت بدري في الـ duodenum، فالعيان بيرجّع (gastric outlet obstruction).
          - **Mirizzi syndrome** (من قايمة صفحة 386): حصوة في رقبة المرارة بتضغط على الـ common hepatic duct من برّه، فتعمل jaundice وهي مش جوّه القناة.

          واسم "ileus" هنا مضلّل: ده انسداد ميكانيكي بحصوة، مش شلل في الأمعاء.
