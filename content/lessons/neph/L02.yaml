  - id: neph.L02.lesson11
    title: "الـ SGLT2i وأدوية السكر"
    hook: "دوا سكر بقى دوا كلى، حتى في اللي ماعندوش سكر. اعرف ليه، وإمتى يقعد على الدكة."
    minutes: 10
    pages: [49, 53]
    topics: [sglt2i]
    goals:
      - "تعرف مؤشرات الـ SGLT2i وإزاي بيحمي الكلية"
      - "تتعامل مع الـ eGFR dip وتعرف إمتى توقفه مؤقتًا"
      - "تختار أدوية السكر حسب الـ eGFR"
    status: unverified
    steps:
      - kind: table
        page: 49
        quote: "Indication SGLT2i in CKD\nCKD (G1–G4) /min\n| Albuminuria category | Diabetes | No diabetes |\n|---|---|---|\n| A1 | Recommended (1A) | Suggested in eGFR ≥20 to 45 ml/min per 1.73 m2 & urine ACR <200 mg/g (2B). |\n| A2 | Recommended (1A) | Suggested in eGFR ≥20 to 45 ml/min per 1.73 m2 & urine ACR <200 mg/g (2B). |\n| A3 | Recommended (1A) | Recommended in ACR ≥200 mg/g (1A). |"
        title: "مين ياخد SGLT2i؟"
        columns: [Patient, Strength]
        rows:
          - ["Diabetes, any albuminuria (A1–A3)", "1A recommend"]
          - ["No diabetes, ACR ≥ 200", "1A recommend"]
          - ["No diabetes, eGFR 20–45, ACR < 200", "2B suggest"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 49
        quote: "3.6. Sodium-glucose contransporter-2 inhibitors (SGLT2i)"
        title: "الـ SGLT2i بيحمي الكلية إزاي؟"
        text: |
          الكتاب في ص 50–51 بيقول إن الـ SGLT2 inhibition بيعمل ==afferent constriction== فبيقلّل الـ intraglomerular pressure والـ hyperfiltration.

          التفسير المقبول (مش في الكتاب) للي بيحصل قبلها: الـ SGLT2 في الـ proximal tubule بيمص glucose ومعاه Na. لما نقفله، Na أكتر بيكمّل لحد الـ **macula densa**. الـ macula densa تفهم إن الفلترة زيادة، فتضيّق الـ afferent (ده الـ ==tubuloglomerular feedback== اللي كان مقفول في السكر).

          علشان كده الدوا بيحمي الكلية **حتى في مرضى مش عندهم سكر**، وحتى لما الـ eGFR يبقى واطي والدوا مابقاش بينزّل السكر قوي.
      - kind: check
        page: 49
        quote: "3.6. Sodium-glucose contransporter-2 inhibitors (SGLT2i) Continue SGLT2i even if the eGFR falls below 20 ml/min per 1.73 m2, unless it is not tolerated or KRT is initiated."
        question: "A patient on empagliflozin now has eGFR 17, tolerating it, not on dialysis. What now?"
        options:
          - "Continue it until KRT is started"
          - "Stop it: eGFR below 20"
          - "Switch to metformin"
          - "Halve the dose"
        answer: 0
        why:
          - "صح: كمّل تحت 20 لحد ما يبدأ kidney replacement therapy (KRT) أو ميستحملش."
          - "الـ 20 حد **البدء** بس، مش الإيقاف."
          - "الـ metformin يتوقف تحت 30."
          - "الـ dose ثابتة (10 mg)."
      - kind: mnemonic
        page: 49
        quote: "Reasonable to withhold SGLT2i during times of prolonged fasting, surgery, or critical medical illness (when people may be at greater risk for ketosis)."
        word: "FSC"
        parts:
          - { key: "F", text: "Fasting (prolonged)" }
          - { key: "S", text: "Surgery" }
          - { key: "C", text: "Critical illness" }
        hook: "**F-S-C**: صيام، عملية، أو مرض شديد؟ الـ SGLT2i يقعد على الدكة لحد ما الأزمة تعدي، علشان خطر الـ ketosis. ⚽"
      - kind: explain
        page: 49
        quote: "Reasonable to withhold SGLT2i during times of prolonged fasting,"
        title: "ليه نوقفه في الصيام والعمليات؟"
        text: |
          الكتاب: معقول توقفه في **prolonged fasting** و **surgery** و **critical medical illness**، لأن المريض وقتها عنده خطر **ketosis** أكبر.

          التفسير المقبول (مش في الكتاب): الدوا بيرمي glucose في البول، فالـ insulin بيقل والـ glucagon بيعلى، والجسم يحرق دهون ويعمل ketones. ومع الصيام أو العملية أو العدوى، ده بيزيد. والمصيبة إن السكر ممكن يبقى **شبه طبيعي** (==euglycemic ketoacidosis==)، فمحدش بيشك بدري.

          ومرتبط بـ L01: دي high AG metabolic acidosis، والـ ketones هي الـ unmeasured anion.
      - kind: aside
        page: 50
        quote: "SGLT2i initiation or use does not necessitate alteration of frequency of CKD monitoring → the reversible decrease in eGFR on initiation is generally not an indication to discontinue therapy."
        tone: trap
        text: "الـ eGFR بينزل شوية أول ما تبدأ SGLT2i (dip). ده **مش** سبب توقفه، ومش محتاج تغيّر مواعيد المتابعة. ده دليل إن الضغط جوه الـ glomerulus نزل. ✅"
      - kind: explain
        page: 51
        quote: "Delays ESKD by 15 years"
        title: "الاتنين مع بعض"
        text: |
          رسمة ص 51 بتقارن: الـ **RAAS blockade** = efferent dilation، والـ **SGLT2 inhibition** = afferent constriction، ومع بعض = تأثير ممكن يبقى **additive** على الضغط جوه الـ glomerulus.

          والأرقام في نفس الصفحة: بعد الـ initial eGFR dip، الـ eGFR بينزل حوالي ==4.6 mL/min في السنة== على RAASi لوحده، وحوالي ==1.85 mL/min في السنة== على الاتنين، وده **Delays ESKD by 15 years**.

          التفسير المقبول (مش في الكتاب) للـ dip: الضغط جوه الـ glomerulus نزل، فالفلترة تقل شوية **فورًا**. ده زي ما تخفّف الحمل على عربية: بتمشي أبطأ شوية بس بتعيش أطول.

          **يعني** كل دوا بيقلّل الضغط جوه الـ glomerulus من ناحية: واحد بيوسّع اللي خارج، والتاني بيضيّق اللي داخل، **فـ** الأثر بيتجمع.
      - kind: figure
        page: 51
        title: "الـ eGFR مع RAASi لوحده أو مع SGLT2i"
        image: { file: neph/L02-sglt2-raasi-egfr.webp, book: true }
        alt: "Book chart 'SGLT2i and RAASi in CKD', eGFR (y axis, 10 to 60) against years (1 to 25). Three lines fall from an initial eGFR dip: untreated, grey, -12 mL/min per year; RAAS-i only, orange, -4.6 mL/min per year, reaching eGFR under 10 at about 10 years; SGLT2-i + RAAS-i, teal, -1.85 mL/min per year, reaching it at about 25 years. A double arrow between 10 and 25 years: delays ESKD by 15 years. Boxes on top: RAAs kidney failure 10 y; RAASi + SGLT2i kidney failure 25 y."
        caption: |
          - **المحور الرأسي**: الـ **eGFR**، و**الأفقي**: السنين لحد 25. والشريط البرتقاني تحت = **eGFR <10** (kidney failure).
          - **الخط الرمادي (Untreated)**: بينزل **12 mL/min في السنة**، فيوصل للفشل في كام سنة.
          - **الخط البرتقاني (RAAS-i only)**: **-4.6 في السنة** ← فشل بعد حوالي **10 سنين**.
          - **الخط الأزرق (SGLT2-i + RAAS-i)**: **-1.85 في السنة** ← فشل بعد حوالي **25 سنة**.
          - **السهم بين 10 و 25**: **Delays ESKD by 15 years**.
          - **فوق شمال: Initial eGFR dip**: نزلة صغيرة في الأول مع الدوا، وبعدها الخط بيبقى أهدى.

          الرسمة بتثبت إن ==الـ dip الأول مش ضرر== وإن الجمع بين الاتنين ==بيكسب سنين== قبل الغسيل.
      - kind: figure
        page: 51
        quote: "SGLT2 vs RAAS Inhibition or Combined Therapy"
        title: "SGLT2 vs RAAS: رسمة الكتاب"
        image: { file: neph/L02-sglt2-raas-resistances.webp, book: true }
        alt: "Book figure 'SGLT2 vs RAAS inhibition or combined therapy: comparative effect on renal segmental resistances'. Three rows of glomerulus drawings with afferent (blue) and efferent (orange) arterioles. Row 1, RAAS blockade, efferent dilation: decreased intraglomerular pressure due to increased efferent resistance, decreased hyperfiltration, proven renal protection in clinical trials. Row 2, SGLT2 inhibition, afferent constriction: decreased intraglomerular pressure due to increased afferent resistance in T1D-H patients, decreased hyperfiltration. Row 3, RAAS blockade and SGLT2 inhibition, efferent dilation and afferent constriction: normalization of intraglomerular pressure, potential additive pressure reduction, potential long-term renal protection (with question marks)."
        caption: |
          3 صفوف، وكل صف فيه glomerulus قبل وبعد. السهم الأزرق فوق = **Afferent** (الداخل) والبرتقاني = **Efferent** (الخارج):

          - **الصف الأول: RAAS blockade** ← **Efferent dilation** (الخارج يتوسّع) ← الضغط جوه ينزل، hyperfiltration أقل، و**Proven renal protection**.
          - **الصف التاني: SGLT2 inhibition** ← **Afferent constriction** (الداخل يضيق) ← نفس النتيجة من الناحية التانية.
          - **الصف التالت: الاتنين مع بعض** ← efferent dilation + afferent constriction ← **Potential for additive** reduction، وجنب الكلام **علامات استفهام**: لسه مفترض مش مثبت بالكامل.

          يعني كل دوا بيقفل ==حنفية من ناحية==، والاتنين مع بعض ==بيقللوا الضغط جوه الـ glomerulus== أكتر.
      - kind: explain
        page: 52
        quote: "Nephroprotective effects of SGLT2is"
        title: "فوايد تانية غير الضغط جوه الـ glomerulus"
        text: |
          ص 52 (**Nephroprotective effects of SGLT2is**) بتعدّ فوايد تانية: **تحسّن شغل القلب** ويحافظ على الـ **renal perfusion**، يقلّل الـ **arterial stiffness**، يقلّل الـ **albuminuria** وتأثيرها السام على الـ tubules، ==يقلّل الـ hyperkalemia==، **يحسّن الأنيميا**، و**يقلّل الـ uric acid**.

          التفسير المقبول (مش في الكتاب) لكام واحدة:

          - الـ **K** بيقل لأن Na ومية أكتر بيوصلوا للـ distal tubule، فالـ K بيتفرز أكتر. فده بيساعد تكمّل الـ RAASi.
          - الـ **anemia** بتتحسن لأن الـ tubules اللي ارتاحت بتعمل erythropoietin أكتر.
          - الـ **uric acid** بيقل لأن الدوا بيزوّد خروجه في البول.

          وفي نفس الصفحة الـ **practical provider guide**: قيّم الـ **volume** قبل ما تبدأ، و**توقّع** نزول حاد في الـ eGFR.
      - kind: figure
        page: 52
        quote: "Nephroprotective effects of SGLT2is"
        title: "فوايد الـ SGLT2i: صورتين من الكتاب"
        image: { file: neph/L02-sglt2-nephroprotection.webp, book: true }
        alt: "Book wheel: a red centre 'Reduced CKD progression' surrounded by eight pictures with labels: direct cardiovascular effects, improved cardiac function and renal perfusion (top); lower intraglomerular pressure through tubuloglomerular feedback (top right); loop-diuretic-sparing effect with less volume overload (right); less albuminuria and fewer direct toxic effects on tubules (bottom right); lower demand for solute transport, raised haematocrit and oxygen delivery to tubular cells (bottom); less pro-inflammatory/pro-fibrotic pathways (bottom left); improved energy substrate utilization (left); lower blood pressure, endothelial dysfunction and arterial stiffness (top left). Below left: reduce hyperkalemia, improve anemia, decrease uric acid."
        caption: |
          الدايرة الحمرا في النص: **Reduced CKD Progression**، وحواليها 8 صور، كل واحدة طريقة:

          - **فوق**: القلب: **cardioprotection** وتحسين الـ perfusion للكلية.
          - **فوق يمين**: ↓ **intraglomerular pressure** عن طريق الـ **tubuloglomerular feedback** (الحنفية اللي اتكلمنا عليها).
          - **يمين**: تأثير زي الـ diuretic: volume overload أقل.
          - **تحت يمين**: ↓ **albuminuria** وأذى أقل للـ tubules.
          - **تحت**: الـ tubule بيشتغل أقل ← oxygen أحسن وhematocrit أعلى.
          - **تحت شمال**: ↓ inflammation و fibrosis.
          - **شمال**: energy أحسن للخلايا.
          - **فوق شمال**: ↓ الضغط و arterial stiffness.
          - **تحت شمال برة الدايرة**: **Reduce hyperkalemia، Improve anemia، Decrease uric acid**.

          يعني الـ SGLT2i ==مش دوا سكر وبس==: فايدته على الكلية جاية من طرق كتير مع بعض.
      - kind: figure
        page: 52
        quote: "Practical provider guide to initiating SGLT2 inhibitors in patients with type 2 diabetes and CKD"
        title: "إزاي تبدأ SGLT2i في T2D مع CKD"
        image: { file: neph/L02-sglt2-provider-guide.webp, book: true }
        alt: "Book table-picture 'Practical provider guide to initiating SGLT2 inhibitors in patients with type 2 diabetes and CKD', with columns assessment, intervention and follow-up, in three rows. Patient selection: eligible eGFR 20 or more; high priority ACR 200 mg/g or more, heart failure; potential contraindications genital infection risk, diabetic ketoacidosis, foot ulcers, immunosuppression; intervention SGLT2 inhibitor with proven benefits (canagliflozin 100 mg, dapagliflozin 10 mg, empagliflozin 10 mg) with education on sick day protocol, perioperative care and foot care; follow-up assess adverse effects, anticipate an acute eGFR drop that is generally not a reason to stop. Glycemia: hypoglycemia risk (insulin or sulfonylurea, history of severe hypoglycemia, HbA1c at or below goal); if high, educate and consider reducing insulin or sulfonylurea; follow-up ask about hypoglycemia. Volume: depletion risk (diuretics, tenuous volume, history of AKI); if high, educate and consider reducing the diuretic; follow-up reassess volume."
        caption: |
          جدول على شكل أسهم، 3 أعمدة: **Assessment** ← **Intervention** ← **Follow-up**، و3 صفوف:

          - **الصف الأزرق: Patient selection**:
            - مين يستاهل: **eGFR ≥20**، وأولوية لو **ACR ≥200 mg/g** أو **heart failure**.
            - خلي بالك من: genital infection، **diabetic ketoacidosis**، foot ulcers، immunosuppression.
            - الدوا: **Canagliflozin 100**، **Dapagliflozin 10**، **Empagliflozin 10 mg**، مع تعليم المريض الـ **sick day protocol** والـ perioperative care.
            - المتابعة: ==نزول الـ eGFR الأول مش سبب نوقف==.
          - **الصف الأحمر: Glycemia**: لو بياخد **insulin أو sulfonylurea** أو الـ HbA1c عند الهدف ← خطر **hypoglycemia** عالي ← قلّل جرعتهم.
          - **الصف البرتقاني: Volume**: لو على **diuretic** أو عنده AKI قبل كده ← خطر **volume depletion** ← قلّل الـ diuretic.

          الجدول بيحوّل القرار لـ checklist: مين، ==وإيه اللي تقلّله معاه==، وتتابع إيه.
