  # ---------- p233: definition ----------
  - id: dm.L18.001
    kind: card
    topic: definition
    front: Define gout.
    back: A heterogeneous group of congenital and acquired disorders with chronic hyperuricemia and urate deposition in tissues, showing one or more of acute inflammatory arthritis, tophi, urate interstitial nephropathy, and uric acid urolithiasis.
    src: { page: 233, quote: "A term representing a heterogeneous group of congenital and acquired disorders characterized by chronic hyperuricemia" }
    status: unverified
    tags: [high-yield]
  - id: dm.L18.002
    kind: enumerate
    topic: definition
    prompt: Gout manifests as one or more of which four disease entities?
    points:
      - Acute inflammatory arthritis
      - Urate crystal aggregates (tophi)
      - Urate interstitial nephropathy
      - Uric acid urolithiasis
    pass: 4
    src: { page: 233, quote: "manifested by one or more of the following disease entities;" }
    status: unverified
    tags: [high-yield]
  - id: dm.L18.003
    kind: cloze
    topic: definition
    text: "Hyperuricemia is plasma uric acid above {{c1::7 mg/dl}} in males and above {{c2::6 mg/dl}} in females."
    src: { page: 233, quote: "It is defined as plasma uric acid >7mg/dl in males and > 6 mg /dl in females" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L18.004
    kind: card
    topic: definition
    front: Uric acid is the end product of what?
    back: Purine metabolism.
    src: { page: 233, quote: "Uric acid is the end product of purine metabolism" }
    status: unverified
  - id: dm.L18.005
    kind: card
    topic: definition
    front: Hallmark of gout, and its commonest cause?
    back: Hyperuricemia; mostly idiopathic.
    src: { page: 233, quote: "Hyperuricemia is a hallmark of gout." }
    status: unverified
  # ---------- p234: causes ----------
  - id: dm.L18.006
    kind: card
    topic: causes
    front: What does idiopathic hyperuricemia include?
    back: Increased urate production, decreased urinary clearance, or both.
    src: { page: 234, quote: "Idiopathic: including increased urate production or decreased urinary clearance or both" }
    status: unverified
  - id: dm.L18.007
    kind: enumerate
    topic: causes
    prompt: Name the congenital enzyme defects that increase urate production.
    points:
      - HGPRT deficiency
      - PRPP synthetase defects
      - Glucose-6-phosphatase deficiency
    pass: 3
    src: { page: 234, quote: "Congenital Enzyme Defects: a- HGPRT deficiency b- PRP synthase defects c- Glucose 6-phosphatase deficiency" }
    status: unverified
    tags: [high-yield]
  - id: dm.L18.008
    kind: enumerate
    topic: causes
    prompt: Which states of increased nucleic acid turnover cause hyperuricemia?
    points:
      - "RBCs: chemical hemolysis, polycythemia"
      - "WBCs: leukemia"
      - "Lymphocytes: lymphomas"
      - Cytotoxic drugs
      - Disseminated cancer
      - Extensive psoriasis
    pass: 5
    src: { page: 234, quote: "Increased nucleic acid turnover: 1. RBCs; chemical hemolysis, polycythemia 2. WBCs; leukemia 3. Lymphocytes; lymphomas" }
    status: unverified
  - id: dm.L18.009
    kind: enumerate
    topic: causes
    prompt: Name the renal causes of decreased uric acid excretion (other than impaired tubular excretion).
    points:
      - Intrinsic renal disease
      - Renal toxins (chronic lead poisoning)
    pass: 2
    src: { page: 234, quote: "Intrinsic renal disease 2. Renal toxins (Ch. Lead poisoning)" }
    status: unverified
  - id: dm.L18.010
    kind: enumerate
    topic: causes
    prompt: Causes of impaired tubular excretion of uric acid?
    points:
      - "Drugs: salicylates, L-dopa, thiazides"
      - "Metabolic acidosis: alcohol and salicylate intoxication, diabetic and lactic acidosis"
      - Nephrogenic diabetes insipidus (vasopressin resistant)
      - Metabolic syndrome
    pass: 4
    src: { page: 234, quote: "Drugs: salicylates, L-dopa, Thiazides" }
    status: unverified
    tags: [high-yield]
  - id: dm.L18.011
    kind: table
    topic: causes
    title: Secondary hyperuricemia
    columns: [Mechanism, Causes]
    rows:
      - [Congenital enzyme defects, "HGPRT deficiency, PRPP synthetase defects, G6Pase deficiency"]
      - [Increased nucleic acid turnover, "Hemolysis, polycythemia, leukemia, lymphoma, cytotoxics, disseminated cancer, extensive psoriasis"]
      - [Renal disease or toxins, "Intrinsic renal disease, chronic lead poisoning"]
      - [Impaired tubular excretion, "Salicylates, L-dopa, thiazides; metabolic acidosis; nephrogenic DI; metabolic syndrome"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 234, quote: "Secondary: 1. Increased production" }
    status: unverified
    tags: [high-yield]
  - id: dm.L18.012
    kind: mcq
    topic: causes
    stem: A 62-year-old man with hypertension starts a new tablet and two months later has his first attack of podagra. Which drug most likely raised his uric acid by impairing tubular excretion?
    options:
      - Thiazide diuretic
      - Losartan
      - Amlodipine
      - Fenofibrate
      - Allopurinol
    answer: 0
    why:
      - "Correct: thiazides impair tubular excretion of uric acid (p234)."
      - The lecture lists losartan as having a uricosuric action (p242).
      - Amlodipine is also listed as uricosuric (p242).
      - Fenofibrate is listed as uricosuric (p242).
      - Allopurinol lowers uric acid.
    src: { page: 234, quote: "Drugs: salicylates, L-dopa, Thiazides" }
    status: unverified
  - id: dm.L18.013
    kind: mcq
    topic: causes
    stem: A child with self-mutilation, developmental delay and very high uric acid has an X-linked enzyme defect. Which defect does the lecture list as a congenital cause of increased urate production?
    options:
      - HGPRT deficiency
      - Glucose-6-phosphate dehydrogenase deficiency
      - Xanthine oxidase deficiency
      - Adenosine deaminase deficiency
      - Urate oxidase deficiency
    answer: 0
    why:
      - "Correct: HGPRT deficiency (Lesch-Nyhan when complete) is the first congenital enzyme defect on p234."
      - The lecture lists glucose-6-PHOSPHATASE deficiency, not G6PD.
      - Lack of xanthine oxidase would LOWER uric acid.
      - Not on the lecture's list.
      - Humans have no functional urate oxidase; that is why uricase drugs exist, not a disease.
    src: { page: 234, quote: "Congenital Enzyme Defects: a- HGPRT deficiency" }
    status: unverified
