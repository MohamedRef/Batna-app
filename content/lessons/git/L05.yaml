            <text x="185" y="413" class="t-sm">adrenaline 1:10 000</text>
            <text x="185" y="431" class="t-sm">and/or clip, then</text>
            <text x="185" y="449" class="t-sm">hot snare</text>
          </svg>
      - kind: explain
        page: 201
        quote: "Piecemeal EMR if en bloc not feasible or safe."
        title: "20 mm وأكتر، وشك في invasion"
        text: |
          الـ ESGE:
          - **20 mm أو أكتر** non-invasive: ==en bloc EMR== لـ **R0 resection**، و **piecemeal EMR** لو الـ en bloc مش ممكن أو مش آمن. ولو **فوق 40 mm** أو complex: **expert center**.
          - **Suspected superficial submucosal invasion**: **tattoo 3 cm distal** للـ lesion، وحوّل لـ expert center علشان en bloc EMR أو **ESD** أو جراحة.
          - **Suspected deep submucosal invasion**: tattoo 3 cm distal، و **surgical resection**.

          التفسير المقبول (مش في الكتاب): ليه التاتو **distal** و **3 cm**؟ علشان الجراح وهو بيشوف القولون من برّه في العملية ما بيشوفش البوليب، فالحبر بيعلّم المكان. ولو حطيته على البوليب نفسه، الحبر بيعمل تليف تحته فيبوّظ أي محاولة EMR أو ESD بعدين. والـ 3 cm بتسيب مسافة آمنة.
      - kind: explain
        page: 202
        quote: "adrenaline and/or prophylactic mechanical hemostasis, followed by Hot Snare Polypectomy"
        title: "الـ pedunculated: المشكلة في الساق"
        text: |
          الـ ESGE للـ **pedunculated**:
          - **Head أقل من 20 mm** و **stalk أقل من 10 mm**: **hot snare polypectomy**.
          - **Head 20 mm أو أكتر** أو **stalk 10 mm أو أكتر**: ==injection with 1:10 000 adrenaline== و/أو **prophylactic mechanical hemostasis** (clip أو loop)، وبعدين hot snare.

          التفسير المقبول (مش في الكتاب): الساق التخينة جواها شريان بيغذّي راس البوليب. لما تقطعها، الشريان ده ممكن ينزف جامد. الـ adrenaline بيقفل الأوعية، والـ loop أو الـ clip بيخنق الساق قبل القطع. يعني في الـ pedunculated الخطر الأكبر **النزيف**، مش الخرم، لأن القطع بعيد عن الحيطة.
      - kind: check
        page: 202
        quote: "Head size < 20 mm and Stalk width < 10 mm. Hot Snare Polypectomy."
        question: "A pedunculated polyp has a 25 mm head on a 6 mm stalk. What does the ESGE chart add before the hot snare?"
        options: ["1:10 000 adrenaline injection and/or prophylactic mechanical hemostasis", "Nothing; hot snare straight away", "Cold snare instead", "Colonic tattoo and surgery"]
        answer: 0
        why:
