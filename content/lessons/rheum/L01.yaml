  # ------------------------------------------------------------------
  - id: rheum.L01.lesson1
    title: "الـ cytokines: واتساب جهاز المناعة"
    hook: "الخلايا المناعية مش بتتكلم، بتبعت رسايل. الرسالة دي اسمها cytokine."
    minutes: 8
    pages: [1, 5]
    topics: [intro, naming, attributes]
    goals:
      - "تعرّف الـ cytokine ومين أكتر حد بيعمله"
      - "تفرّق autocrine و paracrine و endocrine"
      - "تحفظ الخمس functional attributes بمثال لكل واحدة"
    status: unverified
    steps:
      - kind: explain
        page: 1
        quote: "Cytokines are a large, diverse family of low molecular weight proteins or glycoproteins (usually smaller than 30 kDa)"
        title: "يعني إيه cytokine؟"
        text: |
          عشان جهاز المناعة يشتغل كفريق، الـ lymphocytes والـ inflammatory cells والـ haematopoietic cells لازم يكلموا بعض. اللي بيعمل الشغلانة دي هم الـ ==cytokines==.

          - **التعريف**: عيلة كبيرة من الـ proteins أو glycoproteins صغيرة الوزن (عادة **أقل من 30 kDa**).
          - بتشتغل بإنها تمسك في **receptors على سطح الخلية**.
          - غير المناعة، ليها دور في الـ development: cell differentiation و directed migration.
      - kind: explain
        page: 1
        quote: "the two principal producers of cytokines are T helper cells (Th cells) and macrophages"
        title: "مين بيبعت الرسايل؟"
        text: |
          أكبر اتنين بيعملوا cytokines هم ==Th cells== و ==macrophages==.

          بس أي **nucleated cell** ممكن تعمل cytokines لفترة قصيرة لو اتحفزت. يعني كل الخلايا معاها موبايل، بس الـ Th والـ macrophage هم اللي عاملين الجروبات.
      - kind: figure
        page: 2
        quote: "Autocrine (acts on same cell) manner. Paracrine (acts on nearby cell) manner."
        title: "تلات طرق للرسالة"
        alt: "Three panels stacked. Autocrine: a cell releases a cytokine that loops back to its own receptor. Paracrine: a cell sends a cytokine to a neighbouring cell. Endocrine: a cell sends a cytokine through a blood vessel to a distant cell, marked as not the normal manner."
        caption: "Autocrine = لنفسك، paracrine = للجار، endocrine = لحد بعيد في الدم (ودي مش الطريقة المعتادة للـ cytokines)."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R01a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <text x="10" y="22" class="t-b">Autocrine</text>
            <circle cx="160" cy="55" r="26" class="fg-acc"/>
            <path d="M184 45c40-30 40 40 4 22" class="fg-arrow-acc" marker-end="url(#R01a)"/>
            <text x="230" y="60" class="t-sm t-mut">same cell</text>
            <text x="10" y="118" class="t-b">Paracrine</text>
            <circle cx="90" cy="150" r="26" class="fg-acc"/>
            <circle cx="230" cy="150" r="26" class="fg-box"/>
            <path d="M118 150h80" class="fg-arrow-acc" marker-end="url(#R01a)"/>
            <text x="120" y="140" class="t-sm t-mut">nearby cell</text>
            <text x="10" y="214" class="t-b">Endocrine</text>
            <circle cx="50" cy="255" r="22" class="fg-acc"/>
            <rect x="85" y="245" width="170" height="20" rx="10" class="fg-thin"/>
            <text x="150" y="240" class="t-sm t-mut">blood</text>
            <circle cx="290" cy="255" r="22" class="fg-box"/>
            <path d="M74 255h190" class="fg-arrow-acc" marker-end="url(#R01a)"/>
            <text x="110" y="292" class="t-sm t-bad">distant: not the normal manner</text>
          </svg>
      - kind: check
        page: 2
        quote: "Endocrine (acts on distant cell; not the normal manner for cytokine responses) manner."
        question: "Which action mode is NOT the normal manner for cytokine responses?"
        options: ["Endocrine", "Autocrine", "Paracrine"]
        answer: 0
        why:
          - "صح: الكتاب كاتبها صريحة، الـ cytokines عادة بتشتغل قريب."
          - "الـ autocrine طبيعي جدًا: الخلية بتكلم نفسها (زي IL-2 على الـ T cell)."
          - "الـ paracrine هو الشائع: الخلية بتكلم جارتها."
      - kind: explain
        page: 3
        quote: "The susceptibility of a target cell to a particular cytokine is determined by the presence of specific membrane receptors"
        title: "مين يسمع الرسالة؟"
        text: |
          الخلية بتتأثر بالـ cytokine **بس لو عندها الـ receptor بتاعه**. الـ binding ده **very high affinity**.

          بعد الـ binding: signal transduction ← يتغير الـ enzyme activity والـ ==gene expression==.

          السلسلة في رسمة الكتاب: inducing stimulus ← stimulated cell produces cytokine ← secreted ← receptor on target cell bound ← cell activation ← biological effect.
      - kind: explain
        page: 4
        quote: "Lymphokines – Cytokines such as interleukin-2 (IL-2) and interferon-γ (IFN- γ), produced by lymphocytes."
        title: "الأسامي جاية منين؟"
        text: |
          الكتاب بيعد 8 أسامي: monokine، lymphokine، CSF، interleukin، interferon، TNF، growth factor، chemokine.

          - **على حسب الخلية اللي عملتها**: ==lymphokines== من الـ lymphocytes (IL-2، IFN-γ)، و **monokines** من الـ monocytes (TNF-α).
          - **على حسب أول حاجة اتشافت بيها**: **TNF** عشان قتلت cancer cell lines، و **CSF** عشان خلت الـ leukocytes تكبر in vitro في colonies.
      - kind: mnemonic
        page: 5
        quote: "Pleiotropic action: A given cytokine that has different biological effects on different target cells."
        word: "PRSAC"
        hook: "«Please Remember Some Awesome Cytokines»: الخمس attributes بالترتيب."
        parts:
          - { key: "P", text: "Pleiotropy: cytokine واحد، تأثيرات مختلفة على خلايا مختلفة" }
          - { key: "R", text: "Redundancy: أكتر من cytokine بيعملوا نفس الشغلانة" }
          - { key: "S", text: "Synergism: الاتنين مع بعض أقوى من مجموعهم" }
          - { key: "A", text: "Antagonism: واحد بيلغي تأثير التاني" }
          - { key: "C", text: "Cascade induction: cytokine يخلي الخلية تطلع cytokines تانية، وهكذا" }
      - kind: match
        page: 5
        quote: "PLEIOTROPY Activated TH cells IL-4 B cell Thymocyte Mast cell"
        prompt: "وصّل كل مثال من رسمة الكتاب بالـ attribute بتاعه:"
        pairs:
          - ["IL-4 acts on B cells, thymocytes and mast cells", "Pleiotropy"]
          - ["IL-2, IL-4 and IL-5 all make B cells proliferate", "Redundancy"]
          - ["IL-4 + IL-5 together switch B cells to IgE", "Synergy"]
          - ["IFN-γ blocks the IgE switch induced by IL-4", "Antagonism"]
          - ["IFN-γ → macrophage → IL-12 → Th → more cytokines", "Cascade induction"]
        why: "ده بالظبط Figure 12-2 في صفحة 5. لاحظ إن IFN-γ لوحده بيعمل cascade و synergy (مع TNF-α على الـ macrophage) و antagonism (ضد IL-4)."
      - kind: aside
        tone: analogy
        page: 5
        quote: "Redundancy makes it difficult to ascribe a particular activity to a single cytokine."
        text: "الـ redundancy زي إن خمس أشخاص في الشغل بيعملوا نفس المهمة: لو حصلت غلطة مش هتعرف تلبسها لمين. عشان كده صعب تنسب activity لـ cytokine واحد."
      - kind: try
        items: [rheum.L01.002, rheum.L01.005, rheum.L01.007, rheum.L01.014, rheum.L01.020]
    recap:
      - "Cytokines = proteins صغيرة (أقل من 30 kDa) بتشتغل على surface receptors."
      - "أكبر منتجين: Th cells و macrophages، وأي nucleated cell ممكن."
      - "Autocrine لنفسها، paracrine للجار؛ endocrine مش الطبيعي."
      - "PRSAC: pleiotropy، redundancy، synergism، antagonism، cascade induction."
    practice: [rheum.L01.001, rheum.L01.002, rheum.L01.003, rheum.L01.004, rheum.L01.005, rheum.L01.006, rheum.L01.007, rheum.L01.008, rheum.L01.009, rheum.L01.010, rheum.L01.011, rheum.L01.012, rheum.L01.013, rheum.L01.014, rheum.L01.015, rheum.L01.016, rheum.L01.017, rheum.L01.018, rheum.L01.019, rheum.L01.020, rheum.L01.021, rheum.L01.022, rheum.L01.023, rheum.L01.024, rheum.L01.025, rheum.L01.026, rheum.L01.027, rheum.L01.028, rheum.L01.029]
