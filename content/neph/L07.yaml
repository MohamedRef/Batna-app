  - id: neph.L07.124
    kind: cloze
    topic: tsc
    text: "TSC affects 1 in {{c1::6800}} to 15,000 people; about {{c2::70%}} are sporadic new mutations."
    src: { page: 170, quote: "TSC affects 1 in 6800 to 15,000 individuals.27 The disease penetrance is quite variable. About 70% of patients with TSC are sporadic cases with no family history, and the disease apparently results from new mutational events. In sporadic cases, mutations in TSC2 are approxi-mately five times more common than mutations in TSC1, whereas the ratio is 1:1 in familial cases. TSC1-related disease is milder, apparently because of a reduced rate of \"second hits.\"" }
    status: unverified
    tags: [numbers]
