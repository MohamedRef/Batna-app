        title: "قاعدة الـ 30%"
        quote: "A decrease in pain > 30%: ―Effective‖ therapy."
        text: |
          - ==Be realistic==: الـ **complete disappearance** للألم نادر.
          - نزول الألم **أكتر من 30%** = **effective**.
          - ابدأ بـ **anticonvulsant** أو **antidepressant**، وعلّي الجرعة **تدريجيًا**.
          - **Not effective** (<30%) ← **STOP** وجرّب دوا من **class تاني**.
          - **Effective بس الألم لسه مضايق** ← ==ADD== دوا من class تاني (antidepressant + anticonvulsant).

          ليه 30% بالذات؟ التفسير المقبول (مش في الكتاب): ده تقريبًا أقل فرق العيان نفسه **بيحس** إنه فرق في حياته. وليه **class تاني** مش نفس الـ class؟ لأن الـ anticonvulsant والـ antidepressant بيشتغلوا على حتتين مختلفين في طريق الألم، فالاتنين مع بعض بيكمّلوا بعض، أما دوا من نفس العيلة فهيعمل نفس الشغل ونفس الآثار.
