  - id: dm.L11.lesson3
    title: "بعد الـ basal: prandial ولا premix؟"
    hook: "الصيام بقى تمام والـ HbA1c لسه عالي؟ يبقى المشكلة بعد الأكل. قدامك طريقين."
    minutes: 9
    pages: [136, 139]
    topics: [prandial, premix]
    goals:
      - "تعرف امتى تكثّف بعد الـ basal"
      - "تبدأ وتعمل titration للـ prandial"
      - "تضبط الـ premix بجدول BIAsp 30"
    status: unverified
    steps:
      - kind: explain
        page: 136
        title: "امتى نكثّف؟"
        quote: "If above HbA1c target despite adequately titrated basal insulin OR once basal dose >0.7–1.0 IU/kg OR FPG at target, either/or:\n  Add prandial insulin: usually one dose with the largest meal or meal with greatest PPG excursion\n  Consider twice or three times daily premix insulin regimen: caution higher risk of hypoglycemia and/or weight gain"
        text: |
          لو الـ **glycated haemoglobin (HbA1c) فوق الـ target** و:
          - الـ basal اتعمله titration كويس، **أو**
          - جرعة الـ basal عدّت ==0.7–1.0 international units (IU)/kg==، **أو**
          - الـ **fasting plasma glucose (FPG) at target**

          يبقى زيادة الـ basal مش الحل. الـ basal الزيادة عن اللزوم بيعمل hypo بالليل من غير ما يصلّح سكر الأكل.
      - kind: reveal
        page: 136
        quote: "Usually one dose with the largest meal or meal\nwith greatest PPG excursion"
        prompt: "ليه أول prandial dose بتتاخد مع أكبر وجبة بالذات، مش مع التلات وجبات؟"
        answer: |
          لأن الـ fasting خلاص اتظبط، والمشكلة اللي فاضلة هي **القمة** اللي بعد الأكل، وأكبر قمة بتيجي بعد ==the largest meal== (أو الوجبة اللي فيها أكبر **PPG excursion**).

          التفسير المقبول (مش في الكتاب): حقنة واحدة في المكان الصح بتجيب أكبر نزول في الـ HbA1c بأقل hypoglycemia وأقل حقن، وبعدين لو لزم تزوّد وجبة تانية. ده اسمه **basal-plus**: خطوة خطوة بدل ما تقفز لأربع حقن.
      - kind: figure
        page: 136
        quote: "If above HbA1c target despite adequately titrated basal insulin OR once basal dose >0.7–1.0 IU/kg OR FPG at target, either/or:\n  Add prandial insulin: usually one dose with the largest meal or meal with greatest PPG excursion\n  Consider twice or three times daily premix insulin regimen: caution higher risk of hypoglycemia and/or weight gain"
        title: "Either / Or"
        alt: "A top box: HbA1c above target despite titrated basal, or basal above 0.7 to 1.0 IU per kg, or FPG at target. Two arrows: left to twice or three times daily premix with a caution of more hypoglycemia and weight gain; right, with a tick, to adding prandial insulin, usually one dose with the largest meal."
        caption: "الطريق المفضّل (عليه ✓): ==Add prandial insulin== مع أكبر وجبة. الـ premix ممكن، بس **hypoglycemia** و **weight gain** أكتر."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L11b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="10" y="10" width="310" height="55" rx="10" class="fg-acc"/>
