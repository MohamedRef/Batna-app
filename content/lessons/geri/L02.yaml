      - kind: explain
        page: 31
        title: "كل فحص بيدوّر على إيه؟"
        quote: "Investigations of renal diseases Biochemical investigations Microbiological investigations. Immunological investigations. Histopathological investigations. Radiological investigations"
        text: |
          الكتاب بيدّيك خمس عناوين بس. التفسير المقبول (مش في الكتاب) لترتيبها، من الأسهل للأصعب:
          - **Biochemical**: creatinine و urea و electrolytes و urine analysis. أول حاجة علشان رخيصة وبتقولك الكلية شغالة ولا لأ.
          - **Microbiological**: مزرعة البول، علشان الـ UTI أشهر مشكلة عند الكبار.
          - **Immunological**: لو شاكك في glomerulonephritis أو مرض systemic.
          - **Histopathological**: الـ biopsy، لما الباقي ما يجاوبش.
          - **Radiological**: الـ ultrasound بالذات، لأنه بيقيس الحجم من غير contrast يأذي كلية ضعيفة.
      - kind: figure
        page: 31
        title: "Radiological: صورتين intravenous urogram"
        image: { file: geri/L02-ivu.webp, book: true }
        alt: "Two intravenous urogram films from the book, one above the other. Top: both kidneys' calyces, renal pelves and thin ureters outlined with contrast beside the lumbar spine. Bottom, marked R: both pelvicalyceal systems much fuller and denser with contrast."
        caption: |
          تحت عنوان **Radiological investigations** الكتاب حاطط صورتين من غير labels، الاتنين **intravenous urogram (IVU)**: صبغة في الوريد وبعدين X-ray وهي خارجة من الكلى:

          - **فوق**: الـ calyces والـ renal pelvis والـ **ureters** الرفيعة على جنبي العمود الفقري، شكلهم طبيعي (التفسير المقبول، مش في الكتاب).
          - **تحت** (مكتوب R فوق على الشمال): الـ pelvicalyceal systems في الكليتين مليانة صبغة ومنفوخة، شكل ==dilatation== (التفسير المقبول، مش في الكتاب).

          اللي تاخده: الصبغة دي بتخرج من الكلى، فعند الكبير اللي الـ GFR بتاعه واطي بتبقى ==contrast risk==، وده ليه الـ ultrasound اللي بعدها هو الأول عادة (التفسير المقبول، مش في الكتاب).
