lessons:
  # ------------------------------------------------------------------
  - id: git.L01.lesson1
    title: "حرقان مش بيروح على الـ PPI"
    hook: "شاب عنده heartburn، خد PPI ومتحسّنش. نكمّل علاج ولا نوقف ونبص بالمنظار؟"
    minutes: 9
    pages: [1, 7]
    topics: [overview, gerd, refractory-gerd, eoe]
    goals:
      - "تعرّف GERD بالكلمتين: symptoms و objective evidence"
      - "ترسم الـ algorithm بتاع PPI-refractory GERD من الذاكرة"
      - "تعرف امتى تعمل الـ pH-impedance وانت on PPI وامتى off"
    status: unverified
    steps:
      - kind: explain
        page: 1
        quote: "Gastroesophageal reflux disease • Functional dyspepsia • Gastritis • Peptic ulcer • Zolinger ellisson syndrome"
        title: "المحاضرة دي عن الحمض"
        text: |
          الـ **acid-related disorders** في الكتاب خمسة:

          - **GERD**
          - **Functional dyspepsia**
          - **Gastritis**
          - **Peptic ulcer**
          - **Zollinger-Ellison syndrome**

          كلهم بيرجعوا لنفس البطل: الـ **acid**، يا زيادة، يا في المكان الغلط، يا الغشاء مش قادر يستحمله. ونبدأ بالـ GERD.
      - kind: explain
        page: 1
        quote: "GERD is the condition in which the reflux of gastric contents into the esophagus results in symptoms and/or complications."
        title: "يعني إيه GERD؟"
        text: |
          الكتاب بيقول: الـ ==GERD== هو إن **reflux of gastric contents** للـ esophagus يعمل **symptoms and/or complications**.

          وفيه تعريف **objective** كمان: يا **mucosal injury** باينة في المنظار، يا **abnormal esophageal acid exposure** في الـ reflux monitoring.

          يعني الأعراض لوحدها مش كفاية علشان تقول GERD أكيد، وده هيفرق معانا جدًا بعد شوية.
      - kind: check
        page: 2
        quote: "The Symptoms of GERD are Nonspecific and may Overlap Or Be Confused With Those Of Other Disorders"
        question: "Which of these can mimic GERD symptoms according to the lecture?"
        options:
          - "All of them"
          - "Achalasia only"
          - "Cardiac disease only"
          - "Eosinophilic esophagitis only"
        answer: 0
        why:
          - "صح: الكتاب بيعدّ rumination، achalasia، EoE، reflux hypersensitivity، functional heartburn، وأمراض القلب والصدر."
          - "Achalasia واحدة بس من القايمة."
          - "القلب واحد بس من القايمة، وده سبب إنك متستخفّش بأي heartburn."
          - "EoE واحدة بس من القايمة."
      - kind: explain
        page: 3
        quote: "Escalation of PPI dose was done to double dose for 6 weeks."
        title: "حالة الكتاب خطوة بخطوة"
        text: |
          شاب **28 سنة**: heartburn و regurgitation ونوبات **choking** من 3 شهور. مفيش dysphagia ولا weight loss.

          - أخد **PPI once daily**، قبل الفطار بـ **30-60 minutes**، لمدة 6 أسابيع: تحسّن جزئي.
          - زودوا لـ ==double dose==: الأعراض فضلت.
          - وقفوا الـ PPI **أسبوعين** وعملوا **upper endoscopy off PPI**.

          السؤال المهم: ليه وقفوا الـ PPI قبل المنظار؟
      - kind: reveal
        page: 4
        quote: "To maximize the yield of GERD diagnosis and assess for EE, Because PPIs are highly effective for healing EE, underlying EE clearly can be missed."
        prompt: "ليه بنوقف الـ PPI قبل المنظار؟ (ده سؤال امتحان)"
        answer: |
          سببين:

          - الـ PPI **بيعالج الـ erosive esophagitis (EE) كويس جدًا**، فلو عملت المنظار وهو على العلاج ممكن متشوفش الـ EE اللي تحت. يعني بتوقف علشان ==maximize the yield== للتشخيص.
          - وقف الـ PPI **2-4 weeks** بيسهّل تشخيص **EoE**، ودي احتمال وارد لما الأعراض متروحش على الـ PPI.
      - kind: aside
        tone: analogy
        page: 4
        quote: "Because PPIs are highly effective for healing EE, underlying EE clearly can be missed."
        text: |
          زي ما تروح تكشف على عربية بتطلّع دخان بعد ما الميكانيكي غسل الموتور: هتلاقيه لامع ومش هتعرف الزيت كان بينزل منين. 😄

          الـ PPIs بتغسل الـ esophagus وبتعمل healing للـ EE، فلازم توقفها علشان تشوف الحقيقة.
      - kind: figure
        page: 4
        quote: "Assess for objective GERD despite double dose PPI |"
        title: "الـ algorithm بتاع PPI-refractory GERD"
        alt: "Flow chart: troublesome GERD symptoms on single-dose PPI, then an 8-week double-dose PPI trial, then if no response assess for objective GERD (erosive disease on EGD or raised acid exposure on pH-impedance on PPI), ending in PPI-refractory GERD."
        caption: "ده الـ algorithm زي الكتاب. لاحظ إن الـ refractory لازم يتثبت **objectively**، مش بالأعراض بس."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="G1a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="40" y="10" width="250" height="46" rx="8" class="fg-box"/>
            <text x="165" y="30" text-anchor="middle" class="t-sm t-b">Troublesome GERD symptoms</text>
            <text x="165" y="46" text-anchor="middle" class="t-sm">despite single-dose PPI</text>
            <path d="M165 56v24" class="fg-arrow" marker-end="url(#G1a)"/>
            <rect x="40" y="84" width="250" height="40" rx="8" class="fg-acc"/>
            <text x="165" y="109" text-anchor="middle" class="t-sm t-b">8-week double-dose PPI trial</text>
            <path d="M165 124v30" class="fg-arrow" marker-end="url(#G1a)"/>
            <text x="175" y="144" class="t-sm t-mut">no symptom response</text>
            <rect x="10" y="158" width="310" height="150" rx="8" class="fg-box"/>
            <text x="165" y="178" text-anchor="middle" class="t-sm t-b">Assess for objective GERD on double-dose PPI</text>
            <text x="20" y="204" class="t-sm t-b">1. Erosive disease on EGD</text>
            <text x="32" y="222" class="t-sm">LA grade C or D esophagitis</text>
            <text x="32" y="240" class="t-sm">peptic stricture, Barrett esophagus</text>
            <text x="20" y="266" class="t-sm t-b">2. pH-impedance ON PPI</text>
            <text x="32" y="284" class="t-sm">raised acid exposure time</text>
            <text x="32" y="300" class="t-sm">and/or reflux burden</text>
            <path d="M165 308v30" class="fg-arrow" marker-end="url(#G1a)"/>
            <rect x="70" y="342" width="190" height="40" rx="8" class="fg-bad"/>
            <text x="165" y="367" text-anchor="middle" class="t-b t-bad">PPI-refractory GERD</text>
            <text x="165" y="412" text-anchor="middle" class="t-sm t-mut">AET above 6% on PPI = refractory</text>
          </svg>
      - kind: figure
        page: 4
        title: "LA grade C في المنظار"
        image: { file: git/L01-la-grade-c.webp, book: true }
        alt: "Book slide: Los Angeles classification grade C, mucosal breaks extending between the tops of two or more folds but under 75% of the circumference, with four endoscopic photos."
        caption: |
          **LA grade C**: mucosal breaks بتعدّي بين قمم **فولدتين أو أكتر**، بس أقل من **75%** من محيط الـ esophagus.

          الـ grade C أو D بتتحسب **objective GERD**.
      - kind: table
        page: 5
        quote: "Diagnostic evaluation begins with esophageal pH-impedance monitoring on PPI therapy to assess for PPI refractory acid exposure."
        title: "الـ pH test: on ولا off PPI؟"
        columns: ["الحالة", "الـ test", "ليه"]
        rows:
          - ["No previous objective GERD", "Impedance-pH OFF PPI", "Look for baseline GERD"]
          - ["Proven pathologic GERD (LA C/D, stricture, Barrett, abnormal pH)", "pH-impedance ON PPI", "Look for PPI-refractory acid exposure"]
        hide: [[0, 1], [1, 1]]
      - kind: aside
        tone: exam
        page: 5
        quote: "esophageal acid exposure time greater than 6% on PPI is consistent with PPI refractory GERD."
        text: |
          الرقم اللي هيتسأل: **acid exposure time ==greater than 6%== on PPI** = PPI-refractory GERD (GERD Consensus Group).

          وخلي بالك: كتير الـ pH test off PPI بيطلع **negative**، وده مفيد مش فشل، لأنه بيبعدك عن الـ GERD وتدوّر على سبب تاني.
      - kind: sort
        page: 3
        quote: "Potential mechanisms underlying symptoms suspected due to GERD but refractory to PPI therapy"
        prompt: "أعراض شبه GERD ومش بتروح على PPI. حط كل وصف في مكانه:"
        bins: ["Refractory GERD", "Reflux hypersensitivity", "Not reflux at all"]
        cards:
          - { text: "Abnormal acid reflux persists on PPI", bin: 0 }
          - { text: "Acid normalized, but physiologic reflux triggers symptoms", bin: 1 }
          - { text: "Eosinophilic esophagitis", bin: 2 }
          - { text: "Achalasia", bin: 2 }
          - { text: "Rumination or gastroparesis", bin: 2 }
          - { text: "Functional heartburn", bin: 2 }
        why: "الكتاب: **refractory GERD** = الحمض لسه عالي. **Reflux hypersensitivity** = الحمض اتظبط بس الـ reflux العادي بيوجع. والباقي أمراض تانية: esophageal (EoE، achalasia)، non-esophageal (rumination، gastroparesis)، أو functional."
      - kind: explain
        page: 7
        quote: "Eosinophilic esophagitis is diagnosed with intraepithelial eosinophils ≥15 in ≥2 hpfs or ≥25 in any single hpf."
        title: "المنظار طلع إيه؟"
        text: |
          المنظار عند المريض كان يا **LA grade D** يا **eosinophilic esophagitis**، والفرق **بالـ biopsy**، حتى لو المنظار طبيعي.

          - خد **at least six biopsies** من الـ **distal** والـ **mid/proximal** esophagus.
          - خدها **regardless of the endoscopic appearance**.
          - التشخيص: ==≥15 eosinophils== في **≥2 hpfs**، أو **≥25** في hpf واحد.
      - kind: mnemonic
        page: 7
        quote: "at least six biopsy samples taken from the distal and mid/proximal esophagus are recommended."
        word: "EOE"
        parts:
          - { key: "E", text: "Eight minus two: at least 6 biopsies" }
          - { key: "O", text: "Over two levels: distal and mid/proximal" }
          - { key: "E", text: "Even if normal-looking: ≥15 in ≥2 hpfs or ≥25 in one" }
        hook: "اسم المرض نفسه بيفكّرك بالقاعدة: **ستة، مستويين، ولو شكله سليم**."
      - kind: try
        items: [git.L01.011, git.L01.013, git.L01.019, git.L01.024]
    recap:
      - "GERD = reflux بيعمل symptoms أو complications، والتشخيص الأكيد objective: منظار أو pH monitoring."
      - "PPI مرة قبل الفطار ← double dose ← لو مفيش استجابة: دوّر على objective GERD."
      - "المنظار off PPI علشان الـ PPI بيخبّي الـ EE، وعلشان تلحق الـ EoE."
      - "Proven GERD قبل كده: pH-impedance **on** PPI، والـ AET فوق 6% = refractory."
      - "EoE: ست biopsies من مستويين حتى لو المنظار سليم."
    practice: [git.L01.001, git.L01.002, git.L01.003, git.L01.004, git.L01.005, git.L01.006, git.L01.007, git.L01.008, git.L01.009, git.L01.010, git.L01.011, git.L01.012, git.L01.013, git.L01.014, git.L01.015, git.L01.016, git.L01.017, git.L01.018, git.L01.019, git.L01.020, git.L01.021, git.L01.022, git.L01.023, git.L01.024, git.L01.163, git.L01.164, git.L01.165, git.L01.166, git.L01.167, git.L01.195, git.L01.199, git.L01.200]
  # ------------------------------------------------------------------
  - id: git.L01.lesson2
    title: "الـ dyspepsia: نطمّن ولا نعمل منظار؟"
    hook: "ست عندها انتفاخ بعد الأكل. إمتى ده functional وإمتى لازم المنظار النهارده؟"
    minutes: 8
    pages: [7, 11]
    topics: [dyspepsia]
    goals:
      - "تعدّ الـ alarm features كلها"
      - "تعرف مين يعمل urgent endoscopy ومين non-urgent ومين test and treat"
      - "تعرف الـ criteria بتاعة functional dyspepsia"
    status: unverified
    steps:
      - kind: explain
        page: 7
        quote: "Dyspepsia is an umbrella term used to encompass a number of symptoms thought to originate from the upper gastrointestinal tract."
        title: "الـ dyspepsia شمسية مش تشخيص"
        text: |
          الـ ==dyspepsia== كلمة **umbrella**: أعراض كتير جاية من الـ upper GI tract، وهي **nonspecific**.

          حالة الكتاب: ست **42 سنة** عندها **postprandial bloating**، مش بتقدر تكمّل الأكلة، وألم epigastric colicky من 5 شهور. مفيش NSAIDs ولا weight loss.

          التحدي الأول (ص 8): إنك تلاقي **القلة** اللي عندها حاجة خطيرة زي **gastric cancer** وسط ناس أغلبهم functional.
      - kind: mnemonic
        page: 8
        quote: "Unexplained iron deficiency anemia Persistent vomiting Palpable mass or lymphadenopathy"
        word: "VBAD WOMF"
        parts:
          - { key: "V", text: "Vomiting, persistent" }
          - { key: "B", text: "Bleeding, overt GI (hematemesis, hematochezia, melena)" }
          - { key: "A", text: "Anemia, unexplained iron deficiency" }
          - { key: "D", text: "Dysphagia" }
          - { key: "W", text: "Weight loss: >5% of usual weight over 6-12 months" }
          - { key: "O", text: "Odynophagia" }
          - { key: "M", text: "Mass or lymphadenopathy, palpable" }
          - { key: "F", text: "Family history of upper GI cancer" }
        hook: "**«VBAD WOMF»** بتتقري «في باد ووم»: صوت المعدة وهي بتقولك «فيه حاجة غلط». أي حرف موجود = **organic** لحد ما يثبت العكس."
      - kind: explain
        page: 8
        quote: "If any of the above alarm features is present then the dyspepsia is due to organic cause. If not then it is functional"
        title: "القاعدة البسيطة"
        text: |
          الكتاب بيقسمها كده:

          - فيه **أي alarm feature** ← الـ dyspepsia ==organic==.
          - مفيش ← غالبًا **functional**.

          والـ weight loss المهم = **unintentional**، أكتر من **5%** من الوزن في **6 to 12 months**.
      - kind: figure
        page: 9
        quote: "Not included in the figure: diet and lifestyle factors (eg, tobacco, alcohol, nonsteroidal anti-inflammatory drug use)"
        title: "ليه المعدة بتتعب من غير مرض باين؟"
        alt: "Stomach and duodenum sketch with labels: impaired accommodation and hypersensitivity in the fundus, delayed emptying at the antrum, H. pylori, enteric pathogens entering, intraduodenal acid and lipid, duodenal eosinophilia and immune activation, plus diet, lifestyle and psychosocial factors outside the stomach."
        caption: "الـ functional dyspepsia مش «مفيش حاجة»: فيه مشاكل في الحركة والإحساس والمناعة، بس مفيش structural disease."
        svg: |
          <svg viewBox="0 0 330 380" xmlns="http://www.w3.org/2000/svg">
            <path d="M120 40 C110 90 60 120 70 190 C80 260 170 280 230 250 C280 225 300 170 280 120 C260 70 200 60 170 90 C155 105 140 80 140 40 Z" class="fg-acc"/>
            <path d="M230 250 C250 275 250 300 225 315 C200 330 170 320 165 345" class="fg-ink" fill="none" stroke-width="14" stroke-linecap="round"/>
            <circle cx="215" cy="120" r="40" class="fg-thin" fill="none"/>
            <text x="215" y="116" text-anchor="middle" class="t-sm t-b">Impaired</text>
            <text x="215" y="131" text-anchor="middle" class="t-sm t-b">accommodation</text>
            <text x="325" y="62" text-anchor="end" class="t-sm t-bad">Hypersensitivity</text>
            <text x="10" y="30" class="t-sm">Enteric pathogens</text>
            <text x="20" y="215" class="t-sm t-b">H. pylori</text>
            <text x="140" y="232" class="t-sm t-bad t-b">Delayed emptying</text>
            <text x="180" y="295" class="t-sm">Intraduodenal acid and lipid</text>
            <text x="10" y="355" class="t-sm">Duodenal eosinophilia</text>
            <text x="10" y="372" class="t-sm">Immune activation</text>
            <rect x="200" y="330" width="125" height="46" rx="6" class="fg-box"/>
            <text x="208" y="348" class="t-sm t-mut">Diet, tobacco, NSAIDs</text>
            <text x="208" y="366" class="t-sm t-mut">Stress, anxiety</text>
          </svg>
      - kind: figure
        page: 10
        quote: "urgent endoscopy is warranted in - Patients aged ≥55 years with dyspepsia with weight loss,"
        title: "مين يدخل المنظار؟ سلّم الأعمار"
        alt: "Decision ladder by age: 60 or more with pain and weight loss gets urgent CT for pancreatic cancer; 55 or more with weight loss gets urgent endoscopy; over 40 from a high gastric cancer area or family history of gastro-esophageal cancer gets urgent endoscopy; 55 or more with resistant dyspepsia, high platelets or nausea and vomiting gets non-urgent endoscopy; everyone else gets H. pylori test and treat."
        caption: "BSG 2022 زي ما الكتاب نقلها. **أي حد مش على السلّم = test and treat.**"
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="64" rx="8" class="fg-bad"/>
            <text x="20" y="32" class="t-sm t-b t-bad">Urgent CT abdomen</text>
            <text x="20" y="50" class="t-sm">age ≥60 + abdominal pain + weight loss</text>
            <text x="20" y="66" class="t-sm t-mut">exclude pancreatic cancer</text>
            <rect x="10" y="84" width="310" height="96" rx="8" class="fg-bad"/>
            <text x="20" y="106" class="t-sm t-b t-bad">Urgent endoscopy</text>
            <text x="20" y="126" class="t-sm">age ≥55 + dyspepsia + weight loss</text>
            <text x="20" y="146" class="t-sm">age &gt;40 from a high gastric cancer area</text>
            <text x="20" y="166" class="t-sm">family history of gastro-esophageal cancer</text>
            <rect x="10" y="190" width="310" height="80" rx="8" class="fg-acc"/>
            <text x="20" y="212" class="t-sm t-b t-acc">Non-urgent endoscopy (age ≥55)</text>
            <text x="20" y="232" class="t-sm">treatment-resistant dyspepsia, or</text>
            <text x="20" y="252" class="t-sm">raised platelets, or nausea/vomiting</text>
            <rect x="10" y="280" width="310" height="110" rx="8" class="fg-good"/>
            <text x="20" y="302" class="t-sm t-b t-good">Everyone else</text>
            <text x="20" y="322" class="t-sm">non-invasive H. pylori test and treat</text>
            <text x="20" y="342" class="t-sm">H. pylori negative: empirical acid suppression</text>
            <text x="20" y="362" class="t-sm">confirm eradication only if high</text>
            <text x="20" y="380" class="t-sm">gastric cancer risk</text>
          </svg>
      - kind: check
        page: 10
        quote: "We recommend that non-urgent endoscopy is considered in patients aged ≥55 years with treatment-resistant dyspepsia"
        question: "A 57-year-old man has dyspepsia not helped by a PPI course. No weight loss, no other alarm features. What does the lecture advise?"
        options:
          - "Non-urgent endoscopy"
          - "Urgent endoscopy"
          - "Urgent CT abdomen"
          - "Repeat PPI for another 8 weeks"
        answer: 0
        why:
          - "صح: ≥55 مع **treatment-resistant** dyspepsia = non-urgent endoscopy."
          - "الـ urgent عند ≥55 لازم يبقى فيه **weight loss**."
          - "الـ CT لـ ≥60 مع pain و weight loss (pancreatic cancer)."
          - "هو أصلًا resistant، فلازم نبص."
      - kind: explain
        page: 11
        quote: "patients without H. pylori infection are offered empirical acid suppression therapy"
        title: "Test and treat، وبعدين؟"
        text: |
          - **H. pylori positive** ← eradication. وتتأكد من الـ eradication **بس** في اللي عندهم **increased risk of gastric cancer** (توصية BSG في الكتاب).
          - **H. pylori negative** ← ==empirical acid suppression==.

          والـ test الـ non-invasive في الـ algorithm: **stool antigen** أو **urea breath test**.
      - kind: table
        page: 11
        quote: "Persistent symptoms for the Yes prior 3 months"
        title: "Functional dyspepsia: لازم التلاتة"
        columns: ["الشرط", "الرقم"]
        rows:
          - ["Persistent symptoms", "For the prior 3 months"]
          - ["Symptom onset", "At least 6 months before diagnosis"]
          - ["Structural disease", "No evidence to explain symptoms"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: trap
        page: 11
        quote: "Key causes of organic dyspepsia * Peptic ulcer disease = 4 pylori gastritis Symptomatic gallstone disease"
        text: |
          ما تنساش الـ **organic causes** اللي ممكن تتلبّس functional: **peptic ulcer**، **H. pylori gastritis**، **gallstones**، **NSAIDs**، **pancreatitis**، و**gastric أو esophageal cancer**.

          ولما الست بتاعتنا رجعت بـ **melena** والـ Hb نزل لـ 10.5، بقت organic لحد ما يثبت العكس.
      - kind: case
        page: 11
        quote: "The patient was prescribed proton pump inhibitor for 8 weeks. However one month later she revisited the clinic reporting worsening of symptoms and black stools."
        stem: "The 42-year-old woman: Hb 12 g/dL, H. pylori stool antigen negative, normal thyroid tests, negative celiac serology, normal ECG."
        steps:
          - question: "Best initial treatment?"
            options: ["Empirical PPI", "Urgent endoscopy", "H. pylori eradication", "Abdominal CT"]
            answer: 0
            why: "H. pylori negative ومفيش alarm features: **empirical acid suppression**. وهي أخدت PPI لمدة 8 أسابيع."
          - reveal: "One month later: worse pain, black stools, marked pallor, Hb 10.5 g/dL."
            question: "Now?"
            options: ["Upper endoscopy", "Double the PPI", "Reassure", "Stool antigen again"]
            answer: 0
            why: "**Melena** و**anemia** = alarm features، فالمنظار بقى لازم."
      - kind: try
        items: [git.L01.027, git.L01.033, git.L01.036, git.L01.040]
    recap:
      - "Dyspepsia = umbrella؛ المهم تلاقي القلة اللي عندها cancer."
      - "Alarm features: **VBAD WOMF**. أي واحدة = organic."
