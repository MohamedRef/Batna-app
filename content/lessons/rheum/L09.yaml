  - id: rheum.L09.lesson1
    title: "العضلة الملتهبة: مين مين؟"
    hook: "خمس أمراض بيتقال عليها myositis، وكل واحد فيهم بيجرح العضلة بطريقة مختلفة. لو عرفت الجرح، عرفت المرض."
    minutes: 9
    pages: [164, 165]
    topics: [overview, pathogenesis]
    goals:
      - "تعدّ الخمس subtypes وتعرف ليه الـ PM بقى نادر"
      - "تربط كل subtype بالـ lesion بتاعه في الـ biopsy وتفهم ليه"
      - "تعرف دور الـ MSAs والـ MAAs"
    status: unverified
    steps:
      - kind: explain
        page: 164
        title: "IIM يعني إيه؟"
        quote: "Idiopathic inflammatory myopathies (IIM) are a heterogeneous group of systemic autoimmune diseases primarily affecting skeletal muscle. They are characterized by chronic inflammation and muscle weakness, but they may also involve other organs such as the lungs, joints, heart, and skin. The spectrum of IIM includes polymyositis (PM), dermatomyositis (DM), inclusion body myositis (IBM), immune-mediated necrotizing myopathy (IMNM), and overlap myositis associated with other connective tissue diseases."
        text: |
          الـ **idiopathic inflammatory myopathies (IIM)** أمراض ==systemic autoimmune== بتضرب الـ **skeletal muscle** أساسًا: التهاب مزمن وضعف.

          بس مش عضلة وبس: ممكن **lungs**، **joints**، **heart**، و **skin**.
      - kind: explain
        remind: [rheum.L09.002]
        page: 164
        title: "الخمس أنواع"
        quote: "Idiopathic inflammatory myopathies (IIM) are a heterogeneous group of systemic autoimmune diseases primarily affecting skeletal muscle. They are characterized by chronic inflammation and muscle weakness, but they may also involve other organs such as the lungs, joints, heart, and skin. The spectrum of IIM includes polymyositis (PM), dermatomyositis (DM), inclusion body myositis (IBM), immune-mediated necrotizing myopathy (IMNM), and overlap myositis associated with other connective tissue diseases."
        text: |
          1. ==Dermatomyositis== (DM): classic بالـ rash، و **clinically amyopathic dermatomyositis (CADM)** (rash من غير ضعف)
          2. **Polymyositis** (PM): بقى **نادر** وبيتعاد تصنيفه
          3. **Inclusion body myositis** (IBM): ==asymmetric== و poor response
          4. **Immune-mediated necrotising myopathy (IMNM)**: anti-**signal recognition particle (SRP)** و anti-**HMG-CoA reductase (HMGCR)**
          5. **Overlap**: مع systemic lupus erythematosus (SLE)، systemic sclerosis، mixed connective tissue disease (MCTD)

          الـ incidence **1–10 per million**، الستات ضعف الرجالة تقريبًا (**2:1**)، والـ **juvenile DM** في الأطفال.
      - kind: explain
        page: 164
        title: "ليه التصنيف اتغيّر، وليه الـ PM بقى نادر؟"
        quote: "The classification of IIM has evolved significantly over the years, with"
        text: |
          الكتاب بيقول التصنيف ==evolved significantly==: المعايير الجديدة بتجمع **clinical**، **histological**، **serological** و **imaging** عشان تفرّق الأنواع بدقة. وبيقول الـ **polymyositis (PM)** بقى **rare** و **often reclassified as other subtypes**.

          التفسير المقبول (مش في الكتاب): زمان أي ضعف proximal مع CK عالي ومن غير rash كان بيتسمى PM. لما دخلت الـ **antibodies** والـ **biopsy** الدقيقة في التصنيف، كتير من العيانين دول طلعوا في الحقيقة:
          - **IMNM** (عندهم anti-SRP أو anti-HMGCR و necrosis)،
          - أو **IBM** بدري قبل ما يبان الـ asymmetry،
          - أو **overlap** مع مرض connective tissue تاني.

          فاللي فضل "PM نقي" قليل. يعني لما تشخّص PM، اسأل نفسك: **دوّرت على الـ antibodies والـ biopsy كويس؟**
      - kind: explain
        page: 165
        title: "مين بيجيله؟ وليه الأرقام دي مهمة"
        quote: "There is a clear female predominance (up to 2:1), and some forms"
        text: |
          الكتاب: الـ IIMs **rare**، حوالي **1–10 per million** في السنة، أي سن، وأعلى حاجة في **mid-to-late adulthood**، و ==female predominance (up to 2:1)==، وفيه أنواع زي الـ **juvenile dermatomyositis** أكتر في الأطفال.

          التفسير المقبول (مش في الكتاب) للفايدة العملية:
          - **نادر**: يعني قبل ما تقول myositis، استبعد الأسباب الأشيع للضعف والـ CK العالي (أدوية زي الـ statins، الغدة، المجهود الشديد).
          - **الستات أكتر**: زي معظم الـ autoimmune diseases.
          - **الأطفال = juvenile DM**: فطفل عنده rash وضعف، فكّر فيها قبل أي حاجة تانية.
          - **mid-to-late adulthood**: ده نفس السن اللي الـ cancer بيزيد فيه، وده هيفرق معاك في ص 168.
      - kind: figure
        page: 165
        quote: "The pathogenesis of IIM involves complex immune mechanisms, including both humoral and cell-mediated responses. Each subtype has distinct immunopathologic features:\n  Dermatomyositis (DM): Involves complement-mediated damage to capillaries and perifascicular atrophy.\n  Polymyositis (PM): Dominated by CD8+ T-cell mediated cytotoxicity directed at muscle fibers.\n  Inclusion Body Myositis (IBM): Combines autoimmune inflammation with degenerative features such as rimmed vacuoles and protein aggregates.\n  IMNM: Characterized by muscle fiber necrosis with minimal inflammation, often associated with specific autoantibodies."
        title: "كل نوع وجرحه في الـ biopsy"
        alt: "Four cross-sections of a muscle fascicle. DM: capillaries attacked by complement and atrophic fibres at the fascicle edge. PM: CD8 T cells invading fibres. IBM: fibres with rimmed vacuoles and aggregates. IMNM: necrotic fibres with few inflammatory cells."
        caption: "الـ ==DM== بيضرب الأوعية (فالأطراف تضمر)، الـ **PM** بيضرب الألياف بـ CD8، الـ **IBM** تآكل + التهاب، والـ **IMNM** necrosis من غير التهاب تقريبًا."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <circle cx="80" cy="80" r="60" class="fg-box"/>
            <circle cx="80" cy="80" r="40" class="fg-thin"/>
            <circle cx="35" cy="45" r="8" class="fg-dot-bad"/><circle cx="125" cy="45" r="8" class="fg-dot-bad"/><circle cx="35" cy="115" r="8" class="fg-dot-bad"/><circle cx="125" cy="115" r="8" class="fg-dot-bad"/>
            <text x="80" y="84" text-anchor="middle" class="t-sm t-b">DM</text>
            <text x="80" y="158" text-anchor="middle" class="t-sm t-mut">complement on capillaries</text>
            <circle cx="250" cy="80" r="60" class="fg-box"/>
            <circle cx="235" cy="70" r="7" class="fg-dot-acc"/><circle cx="262" cy="92" r="7" class="fg-dot-acc"/><circle cx="250" cy="55" r="7" class="fg-dot-acc"/>
            <text x="250" y="118" text-anchor="middle" class="t-sm t-b">PM</text>
            <text x="250" y="158" text-anchor="middle" class="t-sm t-mut">CD8+ T cells in fibres</text>
            <circle cx="80" cy="245" r="60" class="fg-box"/>
            <circle cx="65" cy="235" r="9" class="fg-thin"/><circle cx="95" cy="255" r="9" class="fg-thin"/><circle cx="80" cy="220" r="6" class="fg-dot-good"/>
            <text x="80" y="285" text-anchor="middle" class="t-sm t-b">IBM</text>
            <text x="80" y="322" text-anchor="middle" class="t-sm t-mut">rimmed vacuoles, aggregates</text>
            <circle cx="250" cy="245" r="60" class="fg-box"/>
            <path d="M225 225 L275 265 M275 225 L225 265" class="fg-arrow-bad" stroke-width="3"/>
            <text x="250" y="295" text-anchor="middle" class="t-sm t-b">IMNM</text>
            <text x="250" y="322" text-anchor="middle" class="t-sm t-mut">necrosis, little inflammation</text>
          </svg>
      - kind: reveal
        page: 165
        quote: "The pathogenesis of IIM involves complex immune mechanisms, including both humoral and cell-mediated responses. Each subtype has distinct immunopathologic features:\n  Dermatomyositis (DM): Involves complement-mediated damage to capillaries and perifascicular atrophy.\n  Polymyositis (PM): Dominated by CD8+ T-cell mediated cytotoxicity directed at muscle fibers.\n  Inclusion Body Myositis (IBM): Combines autoimmune inflammation with degenerative features such as rimmed vacuoles and protein aggregates.\n  IMNM: Characterized by muscle fiber necrosis with minimal inflammation, often associated with specific autoantibodies."
        prompt: "ليه الضمور في الـ DM بيبقى perifascicular (على حروف الحزمة)؟"
        answer: |
          لأن المشكلة في الـ **capillaries** (complement-mediated). أطراف الحزمة هي آخر حتة بيوصلها الدم، فلما الشعيرات تقل، الحروف هي اللي ==تجوع وتضمر الأول==. (تفسير فسيولوجي؛ الـ lesion نفسها من الكتاب.)
      - kind: explain
        page: 165
        title: "الـ antibodies: ليه الكتاب ختم الـ pathogenesis بيها؟"
        quote: "autoantibodies (MAAs) play a crucial role in defining subsets and predicting"
        text: |
          الكتاب بيقول الـ **myositis-specific autoantibodies (MSAs)** والـ **myositis-associated autoantibodies (MAAs)** ليهم ==crucial role== في **defining subsets** و **predicting prognosis**.

          التفسير المقبول (مش في الكتاب) للفرق بينهم:
          - الـ **MSAs** = **specific**: بتلاقيه في الـ myositis بس، فبيقولك **أنهي نوع** بالظبط (مثلًا anti-SRP = IMNM).
          - الـ **MAAs** = **associated**: بيتلاقي كمان في أمراض تانية زي الـ lupus والـ scleroderma، فبيقولك إن الـ myositis ده **جزء من overlap**.

          وده مربوط بالـ pathogenesis اللي فوق: الـ **humoral** ناحية (antibodies و complement) بتشرح الـ DM والـ IMNM، والـ **cell-mediated** (CD8) بتشرح الـ PM. يعني الـ antibody مش بس marker، ده **بصمة الـ mechanism** اللي شغال. التفاصيل في ص 167.
      - kind: check
        page: 165
        quote: "The pathogenesis of IIM involves complex immune mechanisms, including both humoral and cell-mediated responses. Each subtype has distinct immunopathologic features:\n  Dermatomyositis (DM): Involves complement-mediated damage to capillaries and perifascicular atrophy.\n  Polymyositis (PM): Dominated by CD8+ T-cell mediated cytotoxicity directed at muscle fibers.\n  Inclusion Body Myositis (IBM): Combines autoimmune inflammation with degenerative features such as rimmed vacuoles and protein aggregates.\n  IMNM: Characterized by muscle fiber necrosis with minimal inflammation, often associated with specific autoantibodies."
        question: "Which subtype is dominated by CD8+ T-cell cytotoxicity against muscle fibres?"
        options:
          - "Polymyositis"
          - "Dermatomyositis"
          - "IMNM"
          - "Inclusion body myositis"
        answer: 0
        why:
          - "صح: الـ PM = CD8+ T cells بتهاجم الألياف نفسها."
          - "الـ DM: complement على الـ capillaries."
          - "الـ IMNM: necrosis مع التهاب قليل."
          - "الـ IBM: rimmed vacuoles و protein aggregates."
      - kind: try
        items: [rheum.L09.002, rheum.L09.006, rheum.L09.007, rheum.L09.011, rheum.L09.014]
    recap:
      - "IIM: autoimmune systemic، العضلة أساسًا. الأنواع: DM (و CADM)، PM (بقى نادر)، IBM، IMNM، overlap."
      - "نادر (1–10 per million)، الستات 2:1، juvenile DM في الأطفال."
      - "DM complement على الشعيرات (perifascicular)، PM CD8+، IBM vacuoles + aggregates، IMNM necrosis من غير التهاب."
      - "MSAs تحدد النوع، MAAs تقول overlap، والاتنين بيتنبأوا بالـ prognosis."
