        page: 421
        title: "باقي شروط Table 8: كل شرط بيشيل مين؟"
        quote: "Table 8: Diagnosis of Syndrome of Inappropriate Antidiuresis Plasma serum osmolality <275 mOsmol/kg H2O Presence of euvolemia on physical examination (as defined by the absence of signs of hypovolemia or hypervolemia) Elevated urinary sodium (>20-30 mEq/L or mmol/L) Inappropriate urinary concentration (Uosm >100 mOsmol/kg H2O) Absence of other potential causes of hyponatremia, such as diuretic use, severe hypothyroidism, adrenal insufficiency"
        text: |
          الشروط من الكتاب، والمنطق التفسير المقبول (مش في الكتاب). كل شرط بيشطب تشخيص تاني:

          - **Euvolemia:** بيشيل الـ hypovolemia (ترجيع، إسهال) والـ hypervolemia (heart failure، cirrhosis)، لأن في الاتنين الـ ADH بيطلع **بسبب** الـ volume، فده مش «inappropriate».
          - **Urine Na أكتر من 20-30:** العيان مش ناشف، فالكلية مش بتمسك صوديوم؛ لو كان ناشف كانت هتمسكه ويطلع واطي.
          - ==Absence of other causes==: الـ **diuretics**، والـ **severe hypothyroidism**، والـ **adrenal insufficiency** بيعملوا نفس الصورة بالظبط، فلازم تشيلهم الأول.
      - kind: explain
        page: 421
        title: "Hypernatremia و hypokalemia"
        quote: "The causes of hypokalemia in cancer patients inculde:\n1) Inadequate dietary potassium intake (anorexia, nausea, mucositis, surgery,\n2) Increased extrarenal potassium losses (vomiting and diarrhea)\n3) Increased renal losses (diuretic use, Fanconi syndrome from chemotherapy use [cisplatin, ifosfamide], hypomagnesemia [cetuximab use or platinum compounds], or from excess ACTH production by tumor cells [squamous cell cancers, thyroid medullary cancer, neuroendocrine tumors),"
        text: |
          **Hypernatremia:** من **free water loss** أو قلة تعويض المية. بدري: confusion، lethargy، irritability، polyuria، weakness. متأخر: hyperthermia، seizure، delirium، coma، death.

          ليه بتحصل كتير؟ التفسير المقبول (مش في الكتاب): عيان السرطان ممكن مايقدرش يشرب (mucositis، confusion، ترجيع)، فالمية اللي بتضيع مش بتتعوّض.

          **Hypokalemia** في السرطان، تلات أبواب:
          1. **قلة الأكل:** anorexia، nausea، mucositis، surgery
          2. **extrarenal loss:** vomiting، diarrhea
          3. ==renal loss==: diuretics، **Fanconi** (cisplatin، ifosfamide)، **hypomagnesemia** (cetuximab، platinum)، **ectopic adrenocorticotropic hormone (ACTH)** (squamous، medullary thyroid، neuroendocrine)
      - kind: explain
        page: 421
        title: "كل باب في الـ hypokalemia بيوصل إزاي؟"
        quote: "3) Increased renal losses (diuretic use, Fanconi syndrome from chemotherapy use [cisplatin, ifosfamide], hypomagnesemia [cetuximab use or platinum compounds], or from excess ACTH production by tumor cells [squamous cell cancers, thyroid medullary cancer, neuroendocrine tumors),"
        text: |
          الأبواب التلاتة من الكتاب، والآلية التفسير المقبول (مش في الكتاب):

          - **Fanconi syndrome** (cisplatin، ifosfamide): الـ **proximal tubule** هو اللي بيرجّع K و glucose و phosphate و bicarbonate. لما يتأذي، كله بيتسرّب في البول.
          - **Hypomagnesemia** (cetuximab، platinum): الـ Mg بيقفل قناة بتطلّع K في الـ tubule. لما الـ Mg يقل، القناة بتفتح والـ K يهرب.
          - ==Excess ACTH== (squamous، medullary thyroid، neuroendocrine): الـ ACTH بيطلّع cortisol كتير جدًا، وبيشتغل زي الـ aldosterone: يمسك Na ويرمي K.

          ولذلك الـ hypokalemia مع الـ hypomagnesemia **مش هتتصلح** غير لما تصلّح الـ Mg الأول.
