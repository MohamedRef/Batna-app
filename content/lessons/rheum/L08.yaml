    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L08.161]
        page: 157
        title: "Behçet 1990"
        quote: "Recurrent oral ulceration - Minor aphthous or major aphthous or herpetiform ulceration observed by a physician or reported reliably by a patient that recurs at least 3 times in one 12-month period plus 2 of the following:"
        text: |
          **لازم:** ==recurrent oral ulcers ≥3 مرات في 12 شهر==
          **+ 2 من:**
          - **Genital** ulcers أو scars (خصوصًا الرجالة)
          - **Eye:** anterior/posterior uveitis، vitreous cells، retinal vasculitis
          - **Skin:** erythema nodosum-like، pseudofolliculitis، papulopustular، acneiform nodules (بعد البلوغ ومن غير steroids)
          - ==Positive pathergy==
      - kind: explain
        page: 157
        title: "الـ pathergy test"
        quote: "Positive pathergy test - An erythematous papule larger than 2 mm at the prick site 48 hours after the application of a 20- to 22-gauge sterile needle, which obliquely penetrated avascular skin to a depth of 5 mm as read by a physician at 48 hours."
        text: |
          إبرة **20–22 gauge** معقمة تدخل مايلة في جلد avascular لعمق **5 mm**، وتقرا بعد ==48 hours==: papule حمرا **>2 mm** = positive.

          الفكرة: الـ neutrophils في Behçet "متحمسين زيادة"، فأي جرح بسيط يعمل التهاب أكبر من حجمه.
      - kind: figure
        page: 157
        quote: "The international criteria for Behçet disease scoring system Sign/Symptom Points Ocular lesions 2 Genital aphthosis 2 Oral aphthosis 2 Skin lesions 1 Neurological manifestations 1 Vascular manifestations 1 Positive pathergy testa 1"
