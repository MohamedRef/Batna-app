        title: "ليه الـ MNA بيسأل عن السمانة والدراع؟"
        text: |
          الـ **MNA** فيه حاجات مش متوقعة في استمارة أكل: **calf circumference** (أقل من 31 = 0)، **mid-arm circumference** (أقل من 21 = 0)، **pressure sores**، و **more than 3 prescription drugs**.

          التفسير المقبول (مش في الكتاب):
          - **السمانة والدراع**: مقياس سريع للعضل، وبينفع لما ما تقدرش توزن العيان أو تقيس طوله (نايم في السرير).
          - **Pressure sores**: الجلد مش بيلم من غير بروتين، فالقرحة علامة سوء تغذية ونتيجة ليه.
          - **أكتر من 3 أدوية**: الأدوية بتقلل الشهية وبتغيّر الطعم وبتعمل غثيان.
          - **Neuropsychological problems** و **mobility**: اللي مكتئب أو ناسي أو مش بيخرج مش بيجيب أكل ولا بيطبخ.

          يعني الـ MNA بيسأل عن **أسباب** سوء التغذية مش بس نتيجته، عشان كده بيقول لك تصلّح إيه.
      - kind: explain
        page: 126
        title: "Social history: أكتر من كلمة «متجوز»"
        quote: "How often have you seen a social history comprising one word 'married'?"
        text: |
          أغلب الكشوفات بتحصل **بعيد عن البيت** ومن غير الـ next of kin أو الـ informal carers. والكتاب بيسأل: كام مرة شفت social history كلمة واحدة: ==«married»==؟

          ليه ده مشكلة؟ التفسير المقبول (مش في الكتاب): «متجوز» ما بتقولش إن مراته عندها 85 سنة وعندها dementia وهو اللي بيرعاها، ولا إن البيت دور رابع من غير أسانسير، ولا إن المعاش مش مكفّي الأدوية. والحاجات دي هي اللي بتحدد هل الخطة هتنفع في البيت ولا لأ.

          اسأل: مين بيساعده؟ البيت شكله إيه (سلالم، حمام، إضاءة)؟ بيصرف منين؟ وده شغل الـ **social worker** والـ **OT** في الفريق.
      - kind: explain
        page: 126
        title: "الـ medication review: قلب الـ CGA"
        quote: "Medication review is a core component of CGA. Older patients with multiple comorbidities can have indications for multiple medications, some of which may be based on sound, relevant evidence, but others may do more harm than good, particularly in combination."
        text: |
          - الـ guidelines اتعملت على trials **ما كانش فيها** frail elderly.
          - دوا قديم ممكن يبقى مالوش لازمة: المرض خلص، الـ ==physiology اتغيّرت==، أو كان بيعالج **side effect** لدوا تاني.
          - أدوية **long-term risk reduction** (ضغط، renal disease في السكر، lipid lowering) أقل أهمية مع **limited lifespan**.

          الحل: علاج **individualized** باستخدام ==Screening Tool of Older Persons' Prescriptions (STOPP) & Screening Tool to Alert to Right Treatment (START)==.

          ليه الـ guideline مش دايمًا صح هنا؟ الكتاب بيقول إن الـ frail elderly **unlikely to have been represented in trial participants**. يعني الدوا اتجرب على ناس أصغر وأصح، فالفايدة اللي اتقاست مش مضمونة للعيان اللي قدامك، والضرر عنده ممكن يبقى أكبر.

          وليه الـ **long-term risk reduction** بتقل أهميتها؟ لأن الدوا ده بيمنع حاجة بعد سنين، ولو الـ **lifespan محدود** أو أولويات العيان اتغيرت، يبقى بياخد الضرر من غير ما يلحق الفايدة.
      - kind: reveal
        page: 126
        quote: "The evidence base for guideline-based prescribing may not be directly relevant to frail older people or those with significant comorbidity (as such people are unlikely to have been represented in trial participants). Further, even established medications may no longer be useful as diseases may have run their course, physiology may have changed, or the reason for their prescription may have been to treat another drug's side effect."
        prompt: "عيانة بتاخد amlodipine، وبعدين furosemide لورم الرجل منه، وبعدين potassium علشان الـ furosemide. إيه المشكلة؟"
        answer: "دي **prescribing cascade**: دوا بيعالج **side effect** دوا تاني. الكتاب بيقول إن الدوا ممكن يكون اتكتب «to treat another drug's side effect». الـ review ممكن يشيل التلاتة بدل ما يزوّد رابع. (المثال للتوضيح، والفكرة من الكتاب.)"
      - kind: explain
        page: 126
        title: "QoL والهدف"
        quote: "Quality of life assessment\n  Quality Of Life Scale (QOL).\n  WHO Quality of Life Scale\n  Goals of care, Advance care preferences & Spirituality"
        text: |
          آخر حاجتين: **Quality of life** (QOL scale و ==World Health Organization (WHO) Quality of Life Scale==)، و **goals of care، advance care preferences و spirituality**: العيان نفسه عايز إيه.

          ليه دول في الآخر؟ التفسير المقبول (مش في الكتاب): لأن كل اللي فات (function، cognition، تغذية، أدوية) بيتجمع هنا في سؤال واحد: **إيه اللي يهمه هو؟** واحد عايز يعيش أطول، وواحد عايز يفضل في بيته حتى لو المخاطرة أكبر. والتعريف من الأول قال إن الخطة على **issues which are of concern to the older person**. يعني الـ CGA بيبدأ بالعيان وبيخلص بيه.
