  - id: dm.L18.lesson4
    title: "الـ uricase، الـ tophi، والكلية"
    hook: "إنزيم من فطر بيعمل اللي جسمنا نسيه، وكلية فيها نوعين nephropathy اسمهم شبه بعض وهما عكس بعض."
