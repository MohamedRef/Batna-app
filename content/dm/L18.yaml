    src: { page: 235, quote: "Other joints are affected in frequency order: ankles, heels, knees, wrists, fingers, elbows" }
    status: unverified
  - id: dm.L18.020
    kind: card
    topic: acute
    front: Which sites does gout rarely involve?
    back: Shoulders, hips and soft tissues.
    src: { page: 235, quote: "Rarely, shoulders, hips, and soft tissues are involved" }
    status: unverified
  - id: dm.L18.021
    kind: card
    topic: acute
    front: How severe is the first gout attack, and what does the skin look like?
    back: Usually very severe and incapacitating; the overlying skin is typically dusky red.
    src: { page: 235, quote: "the first attack is usually very severe and incapacitating. The overlying skin is typically dusky red." }
    status: unverified
  - id: dm.L18.022
    kind: card
    topic: acute
    front: Systemic signs that may accompany acute gout?
    back: Fever, malaise and leukocytosis.
    src: { page: 235, quote: "Systemic signs of inflammation may occur, e.g, fever, malaise, and leukocytosis." }
    status: unverified
  - id: dm.L18.023
    kind: enumerate
    topic: acute
    prompt: Mention the precipitating factors of an acute gout attack.
    points:
      - Trauma
      - Surgery
      - Infection
      - Alcohol
      - Dietary overindulgence
      - Exercise
      - Low temperature
    pass: 5
    src: { page: 235, quote: "Precipitating factors include trauma, surgery, infection, alcohol, dietary overindulgence, exercise, and low temperature." }
    status: unverified
    tags: [high-yield]
  - id: dm.L18.024
    kind: card
    topic: acute
    front: How does an untreated acute gout attack end?
    back: It resolves spontaneously within a few hours to a few weeks, and the patient enters the asymptomatic intercritical phase.
    src: { page: 235, quote: "The attack resolves spontaneously, lasting from a few hours to a few weeks." }
    status: unverified
  - id: dm.L18.025
    kind: enumerate
    topic: acute
    prompt: What is the fate after an acute gout attack?
    points:
      - Recurrent acute attacks involving more joints
      - Chronic gouty arthritis (attacks do not resolve completely)
      - No recurrence in some patients
    pass: 3
    src: { page: 236, quote: "Recurrent acute attacks involving more joints 2. Chronic gouty arthritis, where subsequent attacks do not resolve completely" }
    status: unverified
  - id: dm.L18.026
    kind: mcq
    topic: acute
    stem: A 44-year-old man wakes at night with an exquisitely painful, swollen big toe with dusky red skin after a wedding feast. Temperature 38.1 °C, WBC 12,500. What is the most likely diagnosis?
    options:
      - Acute gouty arthritis (podagra)
      - Tophaceous gout
      - Gouty nephropathy
      - Intercritical gout
      - Chronic gouty arthritis
    answer: 0
    why:
      - "Correct: monoarticular first MTP, dusky red skin, dietary overindulgence trigger, fever and leukocytosis (p235)."
      - Tophi are painless chalky deposits, not an acute hot joint.
      - Nephropathy is a renal medullary lesion.
      - The intercritical phase is asymptomatic.
      - Chronic arthritis follows repeated attacks that do not resolve.
    src: { page: 235, quote: "Precipitating factors include trauma, surgery, infection, alcohol, dietary overindulgence, exercise, and low temperature." }
    status: unverified
  # ---------- p236: pathogenesis ----------
  - id: dm.L18.027
    kind: card
    topic: pathogenesis
    front: Initial pathogenic event of an acute gout attack?
    back: Disruption of a subcortical tophus, releasing urate crystals into the synovial fluid.
    src: { page: 236, quote: "Disruption of a subcortical tophus, resulting in the release of urate crystals into the synovial fluid, is the initial pathogenic event" }
    status: unverified
    tags: [high-yield]
  - id: dm.L18.028
    kind: order
    topic: pathogenesis
    prompt: Order the steps of an acute gout attack as the lecture describes them.
    steps:
      - A subcortical tophus disrupts and releases urate crystals into synovial fluid
      - Crystals are coated by IgM and ingested by leukocytes and synovial cells
      - Leukocytes release leukotriene B4 and glycoprotein chemotactic factor
      - More leukocytes come; Hageman factor, kallikrein, kinins, complement and IL-1 beta are released
      - Widespread inflammation with vasodilation, edema, redness, warmth, pain and swelling
    src: { page: 236, quote: "Urate crystals are rapidly coated by IgM, with a subsequent ingestion by leukocytes and synovial lining cells" }
    status: unverified
    tags: [high-yield]
  - id: dm.L18.029
    kind: cloze
    topic: pathogenesis
    text: "Leukocytes that ingest urate crystals release {{c1::leukotriene B4}} and glycoprotein chemotactic factor; this step is blocked by {{c2::colchicine}}."
    src: { page: 236, quote: "Leukocytes release bioactive mediators, such as leukotriene B4 and glycoprotein chemotactic factor. This step is blocked by colchicine." }
    status: unverified
    tags: [high-yield]
  - id: dm.L18.030
    kind: enumerate
    topic: pathogenesis
    prompt: Which later inflammatory mediators amplify the gout attack?
    points:
      - Hageman factor
      - Kallikrein
      - Kinin-like peptides
      - Complement activation
      - Interleukin-1 beta
    pass: 4
    src: { page: 236, quote: "including Hegman factor, kallikrein, kinin-like peptides, and complement activation, as well as interleukin-1 beta." }
    status: unverified
  - id: dm.L18.031
    kind: mcq
    topic: pathogenesis
    stem: Which step of the acute gout cascade does the lecture say colchicine blocks?
    options:
      - Release of leukotriene B4 and chemotactic factor from leukocytes
      - Disruption of the subcortical tophus
      - Coating of crystals by IgM
      - Formation of uric acid from xanthine
      - Renal excretion of urate
    answer: 0
    why:
      - "Correct: the leukocyte mediator step is blocked by colchicine (p236)."
      - The initial event is not drug-blocked in the lecture.
      - The lecture names no drug for this step.
      - That is the xanthine oxidase step, blocked by allopurinol and febuxostat.
      - Uricosurics act on renal excretion.
    src: { page: 236, quote: "Leukocytes release bioactive mediators, such as leukotriene B4 and glycoprotein chemotactic factor. This step is blocked by colchicine." }
    status: unverified
