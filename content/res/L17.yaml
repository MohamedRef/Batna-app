items:
  - id: res.L17.001
    kind: card
    topic: chance
    front: "Why do we need a test of significance after a study?"
    back: "Because no study is perfect, there is always a chance of error: the result may be an extreme one that happened by chance. p < 0.05 means about five chances in 100 that such an extreme result happened by chance."
    src: { page: 2, quote: "Because no study is perfect, there is always a chance for error; perhaps this is one of five chances in 100 (p < 0.05), that such an extreme result has happened by chance" }
    update: { text: "Precisely, P is the probability of a result at least as extreme as the one observed if H0 were true. It is not the probability that the result happened by chance, nor that H0 is true. In the exam, write the slide's wording.", ref: "Wasserstein and Lazar, ASA statement on p-values, 2016" }
    status: unverified
  - id: res.L17.002
    kind: card
    topic: chance
    front: "How do we rule out the effect of chance on a study result?"
    back: "Formulate a hypothesis, then test it appropriately (with the right test of significance)."
    src: { page: 3, quote: "To rule out the effect of chance\nFormulate a hypothesis\nTesting it appropriately" }
    status: unverified
  - id: res.L17.003
    kind: mcq
    topic: chance
    stem: "Investigators study people and their exposures \"in nature\" (they assign nothing) and include a comparison group. Which family of study design is this?"
    options:
      - "Experimental"
      - "Descriptive observational"
      - "Analytic observational"
      - "Community trial"
      - "Case series"
    answer: 2
    why:
      - "Experimental studies randomly allocate subjects and the investigator assigns the exposure."
      - "Descriptive studies have no comparison group."
      - "Observational with a comparison group = analytic: case-control and cohort."
      - "A community trial is experimental."
      - "A case series is descriptive (no comparison group)."
    src: { page: 4, quote: "OBSERVATIONAL\nInvestigators study people and exposures \"in nature\"\nComparison Group?\nNO: DESCRIPTIVE\nCorrelational\nCase Series\nCase Reports\nCross-Sectional\nYES: ANALYTIC\nCase-Control\nCohort" }
    status: unverified
  - id: res.L17.004
    kind: table
    topic: chance
    title: "Overview of epidemiologic study designs"
    columns: ["Family", "Key feature", "Examples"]
    rows:
      - ["Experimental", "Random allocation; the investigator assigns treatment or exposure", "Randomized control trials, community trials, laboratory trials"]
      - ["Observational, descriptive", "People and exposures studied \"in nature\"; no comparison group", "Correlational, case series, case reports, cross-sectional"]
      - ["Observational, analytic", "People and exposures studied \"in nature\"; with a comparison group", "Case-control, cohort"]
    blanks: [[0, 2], [1, 2], [2, 1], [2, 2]]
    src: { page: 4, quote: "Overview of Epidemiologic Study Designs\nEXPERIMENTAL\nRandom allocation of study subjects; Investigator assigns treatment or exposure\nRandomized Control Trials\nCommunity Trials\nLaboratory Trials\nOBSERVATIONAL\nInvestigators study people and exposures \"in nature\"\nComparison Group?\nNO: DESCRIPTIVE\nCorrelational\nCase Series\nCase Reports\nCross-Sectional\nYES: ANALYTIC\nCase-Control\nCohort" }
    status: unverified
  - id: res.L17.005
    kind: card
    topic: steps
    front: "What are the two types of statistical analysis?"
    back: "**Differences**: compare one variable (the dependent) between groups. **Associations**: compare two or more variables within the same group, one dependent and the others independent."
    src: { page: 5, quote: "Types of statistical analysis\nDifferences: Compare one variable (the dependent)\nAssociations: Compare two or more variables, one of them must be dependent and the others are independents within the same group." }
    status: unverified
  - id: res.L17.006
    kind: mcq
    topic: steps
    stem: "In one group of patients, a researcher studies whether smoking (yes/no) is related to lung cancer (yes/no). Which type of statistical analysis is this?"
    options:
      - "Differences"
      - "Associations"
      - "Descriptive only"
      - "Sampling"
      - "Screening"
    answer: 1
    why:
      - "Differences compare one dependent variable between groups."
      - "Two variables in the same group, one dependent (lung cancer) and one independent (smoking): an association."
      - "Testing a relation is analysis, not description only."
      - "Sampling is how subjects are chosen, not a type of analysis."
      - "Screening finds disease early; it is not an analysis type."
    src: { page: 5, quote: "Associations: Compare two or more variables, one of them must be dependent and the others are independents within the same group." }
    status: unverified
  - id: res.L17.007
    kind: order
    topic: steps
    prompt: "Order the steps of statistical analysis."
    steps:
      - "Formulate hypotheses (H0 and H1)"
      - "Determine the type of the statistical test"
      - "Determine the significance"
    src: { page: 6, quote: "Formulate hypotheses\nH0 Null hypothesis: No significant difference/association\nH1 or Ha Alternative hypothesis: Significant difference/association\nDetermine the type of the statistical test.\nDetermine the significance according to:" }
    status: unverified
  - id: res.L17.008
    kind: enumerate
    topic: steps
    prompt: "The significance of a result is determined according to which three things?"
    points:
      - "The calculated value of the test"
      - "The P value"
      - "The confidence interval (CI)"
    pass: 3
    hook: "«حِسبة، P، وفترة»: الـ Calculated value، الـ P value، والـ CI."
    src: { page: 6, quote: "Determine the significance according to:\nCalculated value of the test.\nP value\nConfidence interval (CI)" }
    status: unverified
  - id: res.L17.009
    kind: cloze
    topic: steps
    text: "H0, the {{c1::null}} hypothesis: no significant difference or association. H1 or Ha, the {{c2::alternative}} hypothesis: a significant difference or association."
    src: { page: 6, quote: "H0 Null hypothesis: No significant difference/association\nH1 or Ha Alternative hypothesis: Significant difference/association" }
    status: unverified
  - id: res.L17.010
    kind: enumerate
    topic: steps
    prompt: "Choosing the statistical test depends on which three things?"
    points:
      - "The type of the dependent variable (and, if quantitative, its distribution)"
      - "The number of variables (one, two, more than two)"
      - "The number of groups (one, two, more than two)"
    pass: 3
    hook: "«نوع، وعدد، وعدد»: نوع الـ dependent variable (وتوزيعه لو كمّي)، عدد الـ variables، وعدد الـ groups."
    src: { page: 7, quote: "Determination of the statistical test depends on:\nType of the dependent variable, and the distribution of the quantitative one.\nNumber of variables (one, two and more than two)\nNumber of groups (one, two and more than two)" }
    status: unverified
  - id: res.L17.011
    kind: mcq
    topic: steps
    stem: "Which of the following does NOT decide which statistical test to use?"
    options:
      - "Whether the dependent variable is qualitative or quantitative"
      - "Whether a quantitative dependent variable is normally distributed"
      - "The number of groups compared"
      - "The number of variables"
      - "The P value the researcher hopes to get"
    answer: 4
    why:
      - "The type of the dependent variable is the first thing the test table looks at."
      - "The distribution of a quantitative variable decides parametric or not."
      - "One, two or more than two groups changes the test."
      - "One, two or more variables changes the test."
      - "The P value is the result of the test, never a reason to choose it."
    src: { page: 7, quote: "Determination of the statistical test depends on:\nType of the dependent variable, and the distribution of the quantitative one.\nNumber of variables (one, two and more than two)\nNumber of groups (one, two and more than two)" }
    status: unverified
  - id: res.L17.012
    kind: card
    topic: hypotheses
    front: "What is a statistical hypothesis, and how do H0 and Ha differ?"
    back: "A claim about a population. The null hypothesis H0 holds a statement of equality (≥, = or ≤); the alternative Ha holds a statement of inequality (<, ≠ or >). They are complementary: if one is false, the other is true."
    src: { page: 8, quote: "A statistical hypothesis is a claim about a population.\nNull hypothesis H0 contains a statement of equality such as ≥ , = or ≤.\nAlternative hypothesis Ha contains a statement of inequality such as < , ≠ or >\nComplementary Statements\nIf I am false, you are true\nIf I am false, you are true" }
    status: unverified
  - id: res.L17.013
    kind: mcq
    topic: hypotheses
    stem: "Which sign can a null hypothesis (H0) contain?"
    options:
      - "≠"
      - "<"
      - ">"
      - "≤"
      - "None of them"
    answer: 3
    why:
      - "≠ is inequality: it belongs to the alternative hypothesis."
      - "< is inequality: alternative hypothesis."
      - "> is inequality: alternative hypothesis."
      - "H0 holds a statement of equality: ≥, = or ≤."
      - "H0 always contains one of the equality signs."
    src: { page: 8, quote: "Null hypothesis H0 contains a statement of equality such as ≥ , = or ≤.\nAlternative hypothesis Ha contains a statement of inequality such as < , ≠ or >" }
    status: unverified
  - id: res.L17.014
    kind: card
    topic: hypotheses
    front: "Drug A and drug B both lower blood pressure. Write H0 and HA."
    back: "H0: there is no difference in the reduction of blood pressure achieved by drug A and B; the mean decrease with A (X̄1) equals the mean decrease with B (X̄2). HA: there is a difference; the mean decrease with drug A is different from that of drug B."
    src: { page: 9, quote: "Example:\nHo : There is no difference in the reduction of blood pressure achieved by drug A and B. the mean decrease of blood pressure achieved by drug A ( X1) is equal to the mean decrease in blood pressure achieved by drug B (X 2).\nHA: There is a difference in the reduction of blood pressure achieved by drug A and B. The mean decrease in blood pressure achieved by drug A is different from that of drug B." }
    status: unverified
  - id: res.L17.015
    kind: mcq
    topic: hypotheses
    stem: "A trial compares the mean fall in blood pressure with drug A and drug B. Which is the null hypothesis?"
    options:
      - "Drug A lowers blood pressure more than drug B"
      - "The mean decrease in blood pressure with drug A equals that with drug B"
      - "The mean decrease with drug A is different from that with drug B"
      - "Drug B lowers blood pressure more than drug A"
      - "Both drugs lower blood pressure"
    answer: 1
    why:
      - "That is a one-sided alternative hypothesis."
      - "H0 states no difference: X̄1 = X̄2."
      - "That is HA, the alternative hypothesis."
      - "That is also an alternative (one-sided)."
      - "That is not about a difference between them at all."
    src: { page: 9, quote: "Example:\nHo : There is no difference in the reduction of blood pressure achieved by drug A and B. the mean decrease of blood pressure achieved by drug A ( X1) is equal to the mean decrease in blood pressure achieved by drug B (X 2).\nHA: There is a difference in the reduction of blood pressure achieved by drug A and B. The mean decrease in blood pressure achieved by drug A is different from that of drug B." }
    status: unverified
  - id: res.L17.016
    kind: card
    topic: hypotheses
    front: "Why is the null hypothesis distribution drawn with a rejection region in both tails?"
    back: "We would reject H0 on simple inequality of means: the first mean could be greater than the second, or the second greater than the first. So for α = 0.05 each tail holds 0.025, and the middle 1 − α = 0.95 is the non-rejection region."
    src: { page: 11, quote: "Null hypothesis ( H0 )\nWe would reject the Null Hypothesis based upon simple inequality of means.\nThe first mean could be greater than the second or the second greater than the first.\nOur Null Hypothesis distribution for an α = .05 would look something like this\n1 - α = 0.95\nα = .05" }
    status: unverified
  - id: res.L17.017
    kind: card
    topic: significance
    front: "What is alpha (α), and when is it chosen?"
    back: "Alpha is the level of significance: it sets the rejection region. It is your decision before you conduct the research. In a two-sided test it is split into α/2 in each tail, and the critical values mark where the rejection regions start."
    src: { page: 10, quote: "Alpha : level of significance\nRejection region\nYour decision before you conduct a research\nCritical Value\nCritical Value\nRejection Region\nNonrejection Region\nRejection Region\nα /2\nα /2" }
    status: unverified
  - id: res.L17.018
    kind: mcq
    topic: significance
    stem: "When should the level of significance (α) be fixed?"
    options:
      - "Before conducting the research"
      - "After seeing the P value"
      - "After calculating the test statistic"
      - "When writing the discussion"
      - "Only if the result is not significant"
    answer: 0
    why:
      - "The slide: alpha is your decision before you conduct a research."
      - "Choosing α after seeing P lets the data decide the rule."
      - "The test value is compared with a critical value that α already fixed."
      - "Too late: the decision rule must come first."
      - "α is chosen in advance whatever the result."
    src: { page: 10, quote: "Alpha : level of significance\nRejection region\nYour decision before you conduct a research" }
    status: unverified
  - id: res.L17.019
    kind: cloze
    topic: significance
    text: "Usually a small value for α is chosen, {{c1::0.01}} or {{c2::0.05}}. In medicine, α is {{c3::0.05}} or smaller."
    src: { page: 13, quote: "Usually a small value for α is chosen as 0.01, 0.05. In medicine, α is 0.05 or smaller." }
    status: unverified
    tags: [numbers, high-yield]
  - id: res.L17.020
    kind: card
    topic: significance
    front: "Per the slides, what does choosing α = 0.05 mean?"
    back: "That we are 95% sure that we made the correct decision (α = 0.05 pairs with 95% confidence)."
    src: { page: 13, quote: "Choosing a value for α of 0.05 means that we are 95% sure that we made the correct decision" }
    status: unverified
    update: { text: "Strictly, α is the risk we accept of a type I error: rejecting H0 when it is true. With α = 0.05, a true H0 is wrongly rejected about 5 times in 100. It is not the chance that this particular decision is right. In the exam, write the slide's wording.", ref: "Altman, Practical Statistics for Medical Research, 1991" }
  - id: res.L17.021
    kind: card
    topic: significance
    front: "Define degrees of freedom."
    back: "The number of data values that are free to vary; in other terms, the number of independent pieces of information on which the parameter estimate is based."
    src: { page: 14, quote: "Degree of freedom is the number of data values that are free to vary, in other terms, degree of freedom is a measure of the number of independent pieces of information on which the parameter estimate is based." }
    status: unverified
  - id: res.L17.022
    kind: table
    topic: significance
    title: "Degrees of freedom by test"
    columns: ["Test", "Degrees of freedom"]
    rows:
      - ["One-sample t-test (or paired t on the differences)", "n − 1"]
      - ["Student's t-test, two independent samples", "n1 + n2 − 2"]
      - ["Chi-square test (contingency table)", "(c − 1)(r − 1)"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 14, quote: "D.f = n – 1.\nD.f.= n1 + n2 – 2.\nD.f. = (c-1) (r-1)" }
    status: unverified
  - id: res.L17.023
    kind: mcq
    topic: significance
    stem: "Serum cholesterol is compared between two independent groups of 15 and 12 patients with Student's t-test. How many degrees of freedom does the test have?"
    options:
      - "14"
      - "25"
      - "26"
      - "27"
      - "11"
    answer: 1
    why:
      - "n − 1 of the first group only."
      - "Two independent samples: n1 + n2 − 2 = 15 + 12 − 2 = 25."
      - "n1 + n2 − 1: one too many."
      - "That is the total number of patients, not the df."
      - "n − 1 of the second group only."
    src: { page: 14, quote: "D.f.= n1 + n2 – 2." }
    status: unverified
  - id: res.L17.024
    kind: card
    topic: significance
    front: "What is the critical value?"
    back: "The tabulated value of the test that shows whether the result of the statistical test lies in the non-rejection area of the curve, for the chosen α. It is compared with the value obtained by the test statistic."
    src: { page: 15, quote: "The critical value is the tabulated value of the test that indicates whether the results obtained by the appropriate statistical test lies in the non-rejection area of the curve according to the chosen value of (α).\nThe critical value is compared to the value obtained by the test statistics." }
    status: unverified
