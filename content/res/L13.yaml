  - id: res.L13.038
    kind: mcq
    topic: results
    stem: You want to show how HbA1c changed month by month over a year. Table or graph?
    options:
      - A graph, because the trend matters more than the exact values
      - A table, because graphs are never accepted
      - A table, because trends are best shown as exact values
      - Neither; describe it in the discussion
    answer: 0
    why:
      - When trends and relationships matter more than exact values, a graph is more efficient.
      - Graphs are used to illustrate relationships.
      - A table is preferable when exact values are what matter.
      - Results belong in the results, as a table or a figure.
    src: { page: 34, quote: "@" }
    status: unverified
    tags: [high-yield]
  - id: res.L13.039
    kind: card
    topic: results
    front: When should illustrations be used?
    back: >-
      Only for a specific purpose: as evidence to support the argument ("seeing is believing"). Graphs illustrate
      relationships.
    src: { page: 34, quote: "@" }
    status: unverified
  - id: res.L13.040
    kind: enumerate
    topic: results
    prompt: List the publication rules for illustrations (figures).
    points:
      - Titles and detailed explanations go in the legends, not on the illustrations
      - Figures numbered consecutively in the order first cited in the text
      - A published figure needs its source acknowledged and written permission from the copyright holder
      - Photographs of people need unidentifiable subjects or written permission
      - Legends typed double-spaced, starting on a separate page, with Arabic numerals matching the figures
      - Every symbol, arrow, number or letter on a figure explained in the legend
