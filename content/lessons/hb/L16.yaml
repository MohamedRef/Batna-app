  - id: hb.L16.lesson3
    title: "Hemangioma والباقيين: الطيب والغريب"
    hook: "أشيع ورم benign في الكبد ومبيبقاش malignant أبدًا، وإزاي تشخّصه بالـ CT من غير ما تلمسه."
    minutes: 8
    pages: [315, 317]
    topics: [biliary-cystic, mesenchymal]
    goals:
      - "تعدّ الـ biliary and cystic lesions"
      - "تعرف الـ hemangioma: أرقامه، أعراضه، ومين بيكبّره"
      - "تفرّق peliosis عن hemangioma، وتفتكر مكونات الـ angiomyolipoma"
    status: unverified
    steps:
      - kind: explain
        page: 315
        quote: "Biliary Papillomatosis: benign tumor of the biliary tree associated with thick mucous secretion that may cause biliary obstruction without obvious tumor mass."
        title: "Biliary and cystic lesions"
        text: |
          العيلة التانية: حاجات طالعة من المواسير (bile ducts) أو أكياس. الكتاب بيدّي 5، وتلاتة منهم ليهم وصف:

          من المواسير:
          - **Bile duct adenoma**: الاسم بس في الكتاب.
          - **Biliary adenofibroma**: الاسم بس.
          - **Biliary papillomatosis**: benign tumor في الـ biliary tree بيفرز **thick mucous secretion**. المخاط ده نفسه ممكن يسد الماسورة، فيعمل biliary obstruction ==من غير tumor mass واضحة==. ده الفخ: صفار وانسداد والأشعة مش لاقية ورم.

          أكياس:
          - **Simple hepatic cyst**: solitary، non-parasitic، غالبًا developmental (اتولد بيه). ==Just follow-up==.
          - **Polycystic disease**: multiple cysts ممكن تجيب أكتر من عضو (كلام الكتاب: liver, lung and kidney).
      - kind: update
        page: 315
        quote: "Polycystic disease: multiple cysts may involve liver, lung and kidney."
        ref: "EASL CPG on cystic liver diseases 2022"
        text: |
          الـ **polycystic disease** الكلاسيكي (ADPKD) بيجيب الكلى والكبد (وأحيانًا البنكرياس)، مش الرئة.

          في الامتحان اكتب جملة الكتاب: **liver, lung and kidney**.
      - kind: check
        page: 315
        quote: "Biliary Papillomatosis: benign tumor of the biliary tree associated with thick mucous secretion that may cause biliary obstruction without obvious tumor mass."
        question: "Jaundice from bile duct obstruction with thick mucus, but imaging shows **no obvious tumor mass**. Which benign lesion fits the book's description?"
        options:
          - "Biliary papillomatosis"
          - "Simple hepatic cyst"
          - "Bile duct adenoma"
          - "Cavernous hemangioma"
        answer: 0
        why:
          - "صح: الكتاب: thick mucous secretion ممكن تعمل obstruction **without obvious tumor mass**."
          - "الـ simple cyst solitary و developmental، follow-up بس، ومش بيعمل mucus."
          - "الكتاب بيذكر اسمه بس من غير وصف كده."
          - "الـ hemangioma mesenchymal ومبيعملش mucus ولا obstruction بالشكل ده."
      - kind: explain
        page: 315
        quote: "may present with right hypochondrial pain, mass effect, vascular bruit may be heard, rupture is rare and malignant transformation does not occur."
        title: "Hemangioma: الطيب"
        text: |
          الـ **cavernous hemangioma**: كتلة من أوعية دموية واسعة (caverns) مليانة دم. تخيّلها إسفنجة مشبّعة دم.

          البطاقة:
          - الترتيب: the first most common benign hepatic tumor، في 5–10% من الناس.
          - **Small**: asymptomatic.
          - **Large أو multiple**: right hypochondrial pain، mass effect، وممكن تسمع **vascular bruit** (الدم ماشي جوه الإسفنجة).

          الأمان:
          - **Rupture**: rare.
          - **Malignant transformation**: ==does not occur==. ده الوحيد في الدروس دي اللي الكتاب بيقول عليه كده.

          اللي بيكبّره: ==pregnancy== و ==OCP==. الـ OCP نفس عامل الـ adenoma، بس هنا الخطر أقل بكتير.
      - kind: figure
        page: 316
        title: "Hemangioma على السونار"
        image: { file: hb/L16-hemangioma-us.webp, book: true }
        alt: "Ultrasound of the liver from the book with a small, round, bright lesion circled by a yellow dotted line and labelled Hemangioma."
        caption: "الدايرة الصفرا حوالين ==hemangioma==: نقطة صغيرة مدوّرة و**hyperechoic** (أفتح من الكبد حواليها). ده الشكل اللي بيتلقط بالصدفة في سونار معمول لحاجة تانية."
      - kind: aside
        tone: joke
        page: 315
        quote: "Lesions may be enlarged during pregnancy and medication with OCP."
        text: |
          الـ hemangioma ده الطيب الوحيد في الفيلم: أشهر واحد في الكبد، ومبيقلبش malignant أبدًا، ونادرًا لما يعمل مشكلة. بس متستفزّوش: الحمل والـ OCP ممكن يكبّروه. 😄
      - kind: update
        page: 317
        quote: "How to diagnose live hemangioma by contrast enhanced CT?"
        ref: "EASL CPG on benign liver tumours 2016"
        text: |
          سؤال المحاضرة: **"How to diagnose liver hemangioma by contrast enhanced CT?"** والكتاب مش شارح الـ CT pattern في النص.

          التدريس القياسي:
          - **Arterial phase:** **peripheral, nodular, discontinuous** enhancement.
          - **Portal / delayed:** **centripetal fill-in** تدريجي من البرّه للجوّه.
          - في الـ delayed يفضل **iso- أو hyperdense زي الـ blood pool**، **من غير washout**.
          - وعلى الـ MRI بيبقى **T2 bright جدًا**.
