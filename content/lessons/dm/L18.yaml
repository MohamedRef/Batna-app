        text: |
          الكتاب بيقسّمها **laboratory** و **radiological**. السبب (التفسير المقبول، مش في الكتاب):

          - **Plasma uric acid**: الأساس، بس الهجمة نفسها ممكن تيجي والرقم طبيعي، والـ 80% اللي عندهم hyperuricemia من غير gout موجودين.
          - **Renal function tests**: الكلية سبب (excretion ↓) وضحية (nephropathy)، وكمان بتحدد جرعة الـ allopurinol.
          - **CBC**: الـ leukocytosis في الهجمة، وأورام الدم (leukemia، lymphoma، polycythemia) كسبب.
          - ==Joint aspiration==: الوحيد اللي بيشوف الكريستال نفسه، وبيفرّق عن الـ pyogenic arthritis.
          - **X-ray** المفصل: الـ tophi والـ punched-out lesions.
          - **Ultrasound و X-ray و IVP** للمسالك: الحصوات، والـ uric acid منها ما بيبانش غير بالـ contrast.
