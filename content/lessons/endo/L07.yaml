  - id: endo.L07.lesson5
    title: "الـ adrenal crisis: shock مش راضي يستجيب"
    hook: "مريض في shock والـ fluids والـ pressors مش نافعين؟ اسأل نفسك: فين الـ cortisol؟"
    minutes: 9
    pages: [128, 130]
    topics: [adrenal]
    goals:
      - "تعرف الأسباب وإمتى تشك"
      - "تقرا الـ basal cortisol والـ SST والـ long ACTH test"
      - "تعالج فورًا من غير ما تستنى التحليل"
    status: unverified
    steps:
      - kind: explain
        remind: [endo.L07.066]
        page: 128
        quote: "Causes\n  Undiagnosed addison's disease in patients on steroid replacement with intercurrent infection or acute stress with failure to increase the steroid dose.\n  Rare causes include:\n    Bilateral adrenal infarction/hemorrhages.\n    Secondary adrenal failure, which can present with hypoglycemia.\n  Primary adrenal insufficiency is usually due to:\n    Autoimmune conditions.\n    Tuberculosis.\n    Metastases or even.\n    Drugs like antifungals.\n  Secondary adrenal insufficiency is due to:\n    Pituitary pathology where there is only glucocorticoid deficiency without any mineralocorticoid deficiency; hence, adrenal crisis is rare.\n  Adrenal crisis can also occur in patients who have abruptly stopped their steroid medication."
        title: "مين بيعمل crisis؟"
        text: |
          - **Addison's** مش متشخّص، أو مريض على replacement جاله infection أو stress ==ومزوّدش الجرعة==.
          - مريض **وقّف الـ steroids فجأة**.
          - نادر: bilateral adrenal infarction أو haemorrhage.

          **Primary**: autoimmune، **tuberculosis (TB)**، metastases، أدوية زي الـ antifungals.

          **Secondary** يعني pituitary: glucocorticoid بس، والـ mineralocorticoid سليم، فالـ crisis نادرة، وممكن تيجي بـ **hypoglycaemia**.

          التفسير المقبول (مش في الكتاب): الـ aldosterone تحت تحكم الـ renin مش الـ ACTH، فلو المشكلة في الـ pituitary الملح والـ volume بيفضلوا محفوظين والضغط مش بيقع. والـ steroids الطويلة بتنيّم الـ hypothalamic–pituitary–adrenal (HPA) axis، فلما المريض يوقفها فجأة الغدة مش بتلحق تصحى. يعني أي مريض على steroids لمدة طويلة هو مريض adrenal لحد ما يثبت العكس.
      - kind: explain
        page: 129
        quote: "Clinical Features\n  Acute adrenal insufficiency is a potentially life- threatening emergency that presents with shock and non-specific clinical features such as:\n    Anorexia\n    Nausea.\n    Vomiting\n    Abdominal Pain\n    Fever.\n    General lethargy.\n  Adrenal crisis should be considered in any patient who presents in a state of shock even when there is no prior history of adrenal disease, particularly if there is coexisting unexplained severe hypo- glycemia or hyponatremia."
        title: "إمتى تشك؟"
        text: |
          ==Shock== مع حاجات مش محددة: anorexia، nausea، vomiting، **abdominal pain**، fever، lethargy.

          فكّر فيها في **أي** مريض في shock حتى من غير تاريخ adrenal، خصوصًا لو فيه **severe hypoglycaemia** أو **hyponatraemia** مش مفهومين.

          التفسير المقبول (مش في الكتاب): الـ cortisol بيعمل gluconeogenesis، فلو اختفى السكر يقع. والـ hyponatraemia من نقص الـ aldosterone (في الـ primary) ومن الـ ADH اللي بيعلى لما الـ cortisol يقل. والـ shock لأن الأوعية من غير cortisol مش بتستجيب للـ catecholamines، علشان كده الـ pressors لوحدهم مش بيرفعوا الضغط. والـ abdominal pain والـ fever ممكن يخلّوك تفتكرها surgical abdomen.
      - kind: explain
        page: 129
        quote: "It is useful to take blood for\n– Electrolytes.\n– Cortisol.\n– ACTH.\nBefore initiating steroid treatment"
        title: "اسحب الدم الأول، بس متستناش"
        text: |
          **قبل** أول جرعة steroid، اسحب: **electrolytes**، **cortisol**، و **ACTH**.

          التشخيص المثالي بـ **short ACTH stimulation test**، بس الكتاب واضح: ==مفيش سبب تأخّر العلاج في مريض تعبان==.

          ليه نسحب قبل الـ steroid؟ التفسير المقبول (مش في الكتاب): الـ hydrocortisone هو نفسه cortisol، فبعد ما تدّيه التحليل هيقيس الدوا مش الغدة، والعينة اللي قبله هي الفرصة الوحيدة نعرف الغدة كانت عاملة إيه. وليه منستناش النتيجة؟ لأن التحليل بياخد ساعات، والمريض في shock ممكن يموت في الساعات دي. يعني الدم في أنبوبة، والـ hydrocortisone في الوريد، في نفس الدقيقة.
      - kind: explain
        page: 129
        quote: "Basal plasma cortisol and urinary free cortisol levels are often in the low normal range and cannot be used to exclude the diagnosis. However, a basal cortisol value greater than 400 nmol/l (14.5 mg/dl) invariably indicates an intact HPA axis."
        title: "الأرقام"
        text: |
          - **Basal cortisol** ممكن يطلع low-normal، فميستبعدش. بس لو ==أكتر من 400 nmol/l== يبقى الـ hypothalamic–pituitary–adrenal (HPA) axis سليم.
          - **short Synacthen test (SST)**: 250 µg tetracosactide، cortisol عند 0 و 30 دقيقة؛ الطبيعي peak ==أكتر من 550 nmol/l==.
          - **Long test**: الطبيعي أكتر من 1000 nmol/l عند 4 ساعات، ومفيش زيادة بعدها.
          - **Primary**: الـ adrenocorticotropic hormone (ACTH) عالي جدًا بالنسبة للـ cortisol.

          ليه الـ long test بيفرّق؟ لأن في الـ secondary الغدة موجودة بس **ضامرة** من قلة الـ ACTH، فلما تديها ACTH لمدة 24-48 ساعة بتصحى ببطء ويطلع الـ cortisol عالي متأخر. في الـ primary الغدة نفسها مدمّرة، فمفيش رد في أي وقت.
