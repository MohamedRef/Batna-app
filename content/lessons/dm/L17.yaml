  - id: dm.L17.lesson8
    title: "العلاج شغال؟ إزاي نتابع"
    hook: "الـ BMD نزل شوية: فشل علاج ولا غلطة جهاز؟ ولو مفيش DXA، تحليل بول أو دم يقولك."
    minutes: 8
    pages: [230, 232]
    topics: [monitoring]
    goals:
      - "تعرف تعمل إيه لو الـ BMD وقع"
      - "تحفظ خطة المتابعة: DXA بعد سنة، أو marker بعد 3–6 شهور"
      - "تعرف الـ marker بيتحرك في أنهي اتجاه مع كل دوا"
    status: unverified
    steps:
      - kind: explain
        remind: [dm.L17.122]
        page: 230
        title: "المتابعة: الـ BMD وقع، أعمل إيه؟"
        quote: "BMD that is stable or improving is evidence for a treatment response. The finding of a clinically significant BMD decrease in a treated patient should trigger additional evaluation for contributing factors, which may include poor adherence to therapy, inadequate gastrointestinal absorption, inadequate intake of calcium and vitamin D, or the development of a disease or disorder with adverse skeletal effects."
        text: |
          **Stable or improving bone mineral density (BMD)** = استجابة. لو وقع بشكل واضح، دوّر على:
          - ==poor adherence==
          - **inadequate GI absorption**
          - **inadequate calcium and vitamin D**
          - **مرض جديد** بيأذي العضم

          ليه تدوّر على دول؟ عشان كلهم بيخلّوا الدوا الصح يبان إنه فشل وهو مش داخل الجسم أصلًا.

          لو المريض منتظم والفحص سليم والنزول **أقل من 5%**: كمّل نفس العلاج وكرر الـ BMD بعد **سنة** (ممكن يبقى measurement error).
      - kind: reveal
        page: 230
        quote: "Others believe that the decline in BMD does not necessarily imply inadequate therapy, but could be attributed to measurement error, and would repeat the BMD measurement one year later, taking action only if the decline is reaffirmed."
        prompt: "مريضة منتظمة، الفحص سليم، والـ BMD نزل 3%. ليه ما نغيّرش الدوا على طول؟"
        answer: |
          الكتاب بيقولك فيه رأيين: ناس بتعتبرها ==treatment failure== وتغيّر، وناس بتقول ممكن تبقى ==measurement error== فتكرر بعد سنة وما تتحركش غير لو النزول اتأكد.

          واختيار الكتاب: النزول ==أقل من 5%== + بتاخد الدوا صح + الفحص سليم = كمّل نفس العلاج وكرر بعد سنة.

          التفسير المقبول (مش في الكتاب): الجهاز نفسه ليه هامش خطأ صغير، فالفرق الصغير بين قياسين ممكن يبقى من الجهاز مش من العضم.
      - kind: explain
        page: 231
        title: "الـ markers لو مفيش DXA"
        quote: "In the latter case (unable to perform DXA in one year), we typically measure fasting urinary NTX or serum CTX {serum C-terminal cross-linking telopeptide} before and three to six months after starting bisphosphonate or other antiresorptive therapy. If the marker has not decreased by 50 percent, noncompliance or poor absorption, often related to an insufficient time interval between drug intake and food ingestion, should be considered."
        text: |
          الخطة العادية: **DXA hip and spine بعد سنة**، ولو stable، متابعة أقل.

          لو الـ DXA مش متاح: **urinary N-terminal telopeptide (NTX) أو serum C-terminal telopeptide (CTX)** قبل العلاج وبعد **3–6 شهور**، وبعدين DXA بعد سنتين.
          - لو الـ marker ما نزلش ==50%==: فكّر في **noncompliance** أو **poor absorption** (غالبًا أكل بدري بعد الحباية).
          - ده للـ **antiresorptives** بس، عشان الـ marker ده بيقيس السحب، والدوا بيوقف السحب. مع الـ PTH، الـ **procollagen type 1 N-terminal propeptide (P1NP)** هو اللي بيعلى.
      - kind: figure
        page: 231
        quote: "This approach (with markers of bone resorption) is only useful with antiresorptive therapy, but with recombinant PTH (anabolic therapy), markers of P1NP (Procollagen type 1 N-terminal propeptide would increase."
        title: "الـ marker بيتحرك في أنهي اتجاه؟"
        alt: "Two panels. Left: antiresorptive therapy, the resorption marker CTX or NTX falls from 100 percent at baseline to below a dashed 50 percent line at 3 to 6 months, labelled good response. Right: anabolic PTH therapy, the formation marker P1NP rises."
