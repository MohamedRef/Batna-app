            <path d="M125 98v14" class="fg-arrow" marker-end="url(#L03r1)"/>
            <rect x="10" y="116" width="230" height="44" rx="6" class="fg-good"/>
            <text x="20" y="134" class="t-sm t-b">3. Formulation of research objectives</text>
            <text x="20" y="151" class="t-sm t-mut">general, specific, hypotheses</text>
            <path d="M125 160v14" class="fg-arrow" marker-end="url(#L03r1)"/>
            <rect x="10" y="178" width="230" height="44" rx="6" class="fg-box"/>
