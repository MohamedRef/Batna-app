  # ---------- p155-156: overview ----------
  - id: geri.L09.001
    kind: card
    topic: overview
    front: Why are elderly people more susceptible to infections and cancer?
    back: Ageing brings a decline in immune function, so the immune system responds less well to antigenic stimulation.
    src: { page: 155, quote: "This situation implies increased susceptibility to infections and cancer due to decreased capacity in the immune system to respond to antigenic stimulation." }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.002
    kind: table
    topic: overview
    title: Immunosenescence at a glance, the decline in immune function (book figure)
    columns: [Compartment, Changes with age]
    rows:
      - [Thymic involution, "↓ thymic output, ↑ adiposity in thymus, ↓ thymic epithelial cells, ↓ IL-7"]
      - [T lymphocytes, "↓ naive T cells, ↑ memory T cells, ↓ TCR diversity, ↑ CD8 ↓ CD4"]
      - [B lymphocytes, "↓ naive B cells, ↑ memory B cells, ↓ IgM and IgD, ↑ IgG and IgA"]
      - [Inflamm-aging, "↑ inflammatory mediators, ↑ IL-6 and CRP, ↑ tissue dysfunction"]
      - [Overall, "↓ telomerase, ↑ tumours, ↑ infection, ↑ autoimmune and inflammatory reactions, ↓ vaccine response"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 155, quote: "Aging is associated with a decline in immune function." }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.003
    kind: cloze
    topic: overview
    text: "As immune function declines with age, serum {{c1::IgM and IgD}} fall while {{c2::IgG and IgA}} rise; the CD4 count falls and CD8 rises."
    src: { page: 155, quote: "Aging is associated with a decline in immune function." }
    status: unverified
  - id: geri.L09.004
    kind: enumerate
    topic: overview
    prompt: Name the four hallmarks of immunosenescence drawn in the lecture (Medscape figure).
    points:
      - Changes in lymphocyte subpopulations (↓ naive, ↑ memory)
      - Inflammaging (↑ IL-6, TNF-α, CRP; ↓ IL-10)
      - Accumulation of senescent T cells (CD28 lost; KLRG1, CD57)
      - Telomere shortening and resistance to apoptosis
    pass: 3
    hook: "المناعة لما تكبر «4»: lymphocytes تتغير (naive أقل، memory أكتر)، inflammaging (IL-6 وTNF-α وCRP أعلى، IL-10 أقل)، senescent T cells (CD28 يروح، KLRG1 وCD57)، وtelomeres أقصر ومقاومة للـ apoptosis."
    src: { page: 156, quote: "Figure (Medscape; Source: Immunotherapy © 2013 Future Medicine Ltd): Aging → Immunosenescence (driven also by CMV, Obesity, Stress), with thymic involution, leading to:\n  A. Changes in lymphocyte subpopulations: ↓ Naive, ↑ Memory\n  B. Inflammaging: ↑ IL-6, TNF-α, PCR, ↓ IL-10\n  C. Accumulation of senescent T cells: CD28 lost, KLRG1, CD57\n  D. Telomere shortening and resistance to apoptosis\n  → ↑ Autoimmune diseases, cardiovascular diseases and cancer; ↑ Severity of infections; ↓ Response to vaccines\nImmunosenescence\nFigure: AGING → Immune system dysregulation → Immunosenescence; AGING also acts on Endocrine function, Neural function, Cardiovascular health, Muscle homeostasis, Glucose metabolism, Oxidative stress (two-way with immunosenescence).\n| Immunosenescence | Leads to |\n|---|---|\n| ↓ Naive CD4+ T cells | Infection |\n| ↓ Immunosurveillance | Cancer |\n| Inflam-Aging | Chronic inflammatory diseases |\n| Loss of specificity | Autoimmune disorders |\n| Nutrition | Frailty |\nImmune Risk Phenotype (+): CD8+CD28-CD57+; CD4:CD8 < 1; CMV seropositivity; T-cell proliferation" }
    status: unverified
  - id: geri.L09.005
    kind: card
    topic: overview
    front: Which factors accelerate immunosenescence, per the lecture's figure?
    back: Cytomegalovirus (CMV) infection, obesity and stress.
    src: { page: 156, quote: "Figure (Medscape; Source: Immunotherapy © 2013 Future Medicine Ltd): Aging → Immunosenescence (driven also by CMV, Obesity, Stress), with thymic involution, leading to:\n  A. Changes in lymphocyte subpopulations: ↓ Naive, ↑ Memory\n  B. Inflammaging: ↑ IL-6, TNF-α, PCR, ↓ IL-10\n  C. Accumulation of senescent T cells: CD28 lost, KLRG1, CD57\n  D. Telomere shortening and resistance to apoptosis\n  → ↑ Autoimmune diseases, cardiovascular diseases and cancer; ↑ Severity of infections; ↓ Response to vaccines\nImmunosenescence\nFigure: AGING → Immune system dysregulation → Immunosenescence; AGING also acts on Endocrine function, Neural function, Cardiovascular health, Muscle homeostasis, Glucose metabolism, Oxidative stress (two-way with immunosenescence).\n| Immunosenescence | Leads to |\n|---|---|\n| ↓ Naive CD4+ T cells | Infection |\n| ↓ Immunosurveillance | Cancer |\n| Inflam-Aging | Chronic inflammatory diseases |\n| Loss of specificity | Autoimmune disorders |\n| Nutrition | Frailty |\nImmune Risk Phenotype (+): CD8+CD28-CD57+; CD4:CD8 < 1; CMV seropositivity; T-cell proliferation" }
    status: unverified
