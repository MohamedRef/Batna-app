        title: "Case 13: C4d سلبي بس ABMR"
        quote: "Thrombotic Microangiopathy with Microvascular Inflammation Compatible with Acute/Active Antibody Mediated Rejection, C4d Negative For DSA Levels."
        text: |
          ولد **16 سنة**، end-stage renal disease (ESRD) من **lupus nephritis**، كلية من أبوه. خد CMV واتعالج، وبعدين vomiting و diarrhea و creatinine من 1.9 لـ ==4.3==. الـ cross-match و CMV و BK سلبيين.

          الـ biopsy كفاية (**39 glomeruli، 2 arteries**): glomerulitis، fibrin thrombi، capillaritis، و **C4d 0**. Acute score 5، chronic 0.

          التشخيص: ==thrombotic microangiopathy (TMA) with microvascular inflammation compatible with active ABMR, C4d negative== (اعمل DSA)، و TCMR **borderline**.
      - kind: explain
        page: 290
        title: "Case 14: راجل 78 سنة بـ RPGN"
        quote: "ANCA-associated CGN superimposed on type 3 membrano-proliferative glomerulonephritis (MPGN)."
        text: |
          عنده hypertension (HTN)، و proteinuria و hematuria من سنين، وفجأة creatinine من 1.4 لـ ==8.1== في شهرين. **MPO-ANCA 536**، C3 و C4 طبيعيين، و mild interstitial pneumonia.

          الـ biopsy: **crescents** في 6 من 9، capillary walls تخينة، IgG و IgM و C3 granular، و electron microscopy (EM) فيه **intra- و trans-membranous** deposits، مش في الـ lamina densa زي الـ dense deposit disease.

          التشخيص: ==ANCA-associated crescentic glomerulonephritis (GN) on top of type 3 membranoproliferative glomerulonephritis (MPGN)==.
      - kind: case
        page: 291
        quote: "Algorithm for integrating IM and EM findings when diagnosing some of the pathologic expressions of glomerular disease.\n  Immunohistology for Immunoglobulins and Complement\n    linear GBM staining caused by anti-GBM antibodies with or without C3 (← no dense deposits)\n      with lung hemorrhage → Goodpasture's Syndrome\n      without lung hemorrhage → Anti-GBM GN\n    granular/non-linear glomerular staining for immunoglobulins and/or complement\n      IgA dominant mesangial; no systemic vasculitis → IgA Nephropathy ← predominantly mesangial dense deposits\n      IgA dominant mesangial; systemic vasculitis → H-S Purpura Nephritis ← predominantly mesangial dense deposits\n      variable IgG/IgM/IgA & C3/C1q → Lupus Nephritis ← variable dense deposits & tubuloreticular inclusions\n      coarsely granular capillary C3 +/- Ig → Acute Post-Infectious GN ← subepithelial humps\n      peripheral granular C3 +/- IgG/IgM → Type I MPGN ← subendothelial deposits & mesangial interposition\n      capillary band-like & mesangial spherical C3 → Type II MPGN ← intra-GBM dense deposits\n      granular capillary wall IgG → Membranous GN ← numerous subepithelial dense deposits\n      band-like cap or mes IgG & C3 → Fibrillary GN ← ~20 nm fibrils\n      confluent capillary & mesangial IgG & C3 → Immunotactoid GN ← >30 nm microtubules\n      other features → Many Others ← other features\n    paucity of glomerular staining for immunoglobulin and/or complement (usually with circulating ANCA) (← few or no dense deposits)\n      no systemic vasculitis → Pauci-immune GN\n      vasculitis with no asthma or granulomas → Microscopic Polyangiitis\n      granulomas and no asthma → Wegener's Granulomatosis\n      eosinophilia, asthma and granulomas → Churg-Strauss Syndrome"
        stem: "Use the book's IF/EM algorithm."
        steps:
          - question: "Linear GBM IgG with lung hemorrhage?"
            options: ["Goodpasture syndrome", "Anti-GBM GN without lung", "Lupus nephritis", "Membranous GN"]
            answer: 0
            why: "Linear staining = anti-GBM؛ مع **lung hemorrhage** = Goodpasture."
          - question: "Paucity of staining, ANCA, eosinophilia, asthma and granulomas?"
            options: ["Churg-Strauss syndrome", "Wegener's granulomatosis", "Microscopic polyangiitis", "Pauci-immune GN"]
            answer: 0
            why: "Eosinophilia + asthma + granulomas = **Churg-Strauss** (EGPA). Granulomas من غير asthma = Wegener's."
          - question: "Granular IgG with numerous subepithelial dense deposits?"
            options: ["Membranous GN", "Type I MPGN", "Acute post-infectious GN", "IgA nephropathy"]
            answer: 0
            why: "Granular capillary wall IgG + كتير subepithelial deposits = **membranous**. الـ post-infectious glomerulonephritis (PIGN) فيه humps و C3 coarse."
