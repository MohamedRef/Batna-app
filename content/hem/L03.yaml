items:
  # ---------- p18: definition ----------
  - id: hem.L03.001
    kind: cloze
    topic: haemolysis
    text: "Haemolysis is premature destruction of red cells, and hence a shortened RBC life span (< {{c1::120}} days)."
    src: { page: 18, quote: "Hemolysis is defined as premature destruction and hence a shortened RBC life span (< 120 days)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L03.002
    kind: table
    topic: haemolysis
    title: Intravascular versus extravascular haemolysis
    columns: [Type, Where the red cells are destroyed]
    rows:
      - [Intravascular, Lysis in the circulation; contents released into plasma]
      - [Extravascular, Taken up and digested by cells of the RE system]
    blanks: [[0, 1], [1, 1]]
    src: { page: 18, quote: "Red cells are taken up by the cells of the RE system where they are destroyed and digested." }
    status: unverified
    tags: [high-yield]
  # ---------- p18-21: hereditary spherocytosis ----------
  - id: hem.L03.003
    kind: card
    topic: hs
    front: Define hereditary spherocytosis.
    back: A congenital haemolytic disorder with an inherited defect in the red cell membrane cytoskeleton, leading to spherocytic red cells.
    src: { page: 18, quote: "characterized by an inherited defect in the red cell membrane cytoskeleton leading to the formation of spherocytic red cells" }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.004
    kind: card
    topic: hs
    front: Where are spherocytes destroyed, and why?
    back: In the spleen, because they are less deformable than normal red cells and get trapped.
    src: { page: 18, quote: "Spherocytes, being less deformable than normal red cells, are trapped and destroyed in the spleen." }
    status: unverified
  - id: hem.L03.005
    kind: card
    topic: hs
    front: How is hereditary spherocytosis inherited?
    back: Most commonly autosomal dominant; autosomal recessive in some cases.
    src: { page: 18, quote: "Although most common mode of inheritance is autosomal dominant, autosomal recessive transmission occurs in some cases." }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.006
    kind: table
    topic: hs
    title: The two linkages anchoring the lipid bilayer to the skeleton
    columns: [Linkage, Proteins]
    rows:
      - [First, "Ankyrin with spectrin (skeleton) and band 3 (bilayer)"]
      - [Second, "Glycophorin C and protein 4.1"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 18, quote: "The first linkage involves interaction of ankyrin with spectrin in skeleton and band 3 in the bilayer." }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.007
    kind: order
    topic: hs
    prompt: Order the steps from membrane defect to spherocyte destruction in HS.
    steps:
      - Deficient ankyrin, spectrin, band 3 or protein 4.1 linkage
      - Weak contact between lipid bilayer and skeleton
      - Loss of surface area relative to volume
      - Spherocyte formation
      - Trapping and destruction in the spleen
    src: { page: 19, quote: "This causes decrease in surface area of red cell relative to volume with resultant spherocyte formation." }
    status: unverified
  - id: hem.L03.008
    kind: enumerate
    topic: hs
    prompt: Mention the clinical features of hereditary spherocytosis.
    points:
      - Mild to moderate anaemia
      - Intermittent jaundice
      - Enlarged spleen
      - Gall stones
      - Chronic leg ulcers
    pass: 4
    src: { page: 19, quote: "Mild to moderate anaemia" }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.009
    kind: card
    topic: hs
    front: What do the blood count, film and marrow show in hereditary spherocytosis?
    back: Mild to moderate anaemia with reticulocytosis; spherocytosis is the characteristic film feature; the marrow shows erythroid hyperplasia.
    src: { page: 20, quote: "On blood smear examination, characteristic feature is spherocytosis." }
    status: unverified
  - id: hem.L03.010
    kind: card
    topic: hs
    front: What does the osmotic fragility test measure, and how is it done?
    back: Susceptibility of red cells to haemolysis under osmotic stress; cells are suspended in decreasing concentrations of hypotonic saline and the haemolysis is measured.
    src: { page: 20, quote: "The red cells are suspended in decreasing concentrations of hypotonic saline solutions and the amount of haemolysis is measured." }
    status: unverified
  - id: hem.L03.011
    kind: card
    topic: hs
    front: What is the gold standard confirmatory test for hereditary spherocytosis, and how does it work?
    back: Eosin-5-maleimide (EMA) binding test; the patient's RBCs are stained with a fluorescent dye and the fluorescence is measured by flow cytometry.
    src: { page: 20, quote: "Eosin -5- Maleimide Binding test is the gold standard confirmatory test" }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.012
    kind: card
    topic: hs
    front: What is the treatment of severe hereditary spherocytosis, and why give folate?
    back: Splenectomy. Folate is needed in moderate or severe disease to prevent megaloblastic anaemia from the increased red cell turnover.
    src: { page: 21, quote: "Administration of folate is necessary in moderate or severe disease to prevent megaloblastic anaemia due to increased erythrocyte turnover." }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.013
    kind: mcq
    topic: hs
    stem: A 12-year-old has intermittent jaundice, splenomegaly and gall stones. His father had a splenectomy. The film shows spherocytes and reticulocytosis. Which test confirms the diagnosis?
    options:
      - Eosin-5-maleimide binding by flow cytometry
      - Direct antiglobulin test
      - Hb electrophoresis
      - Fluorescent spot test
      - Flow cytometry for CD55 and CD59
    answer: 0
    why:
      - "Correct: EMA binding is the gold standard confirmatory test for HS (p20)."
      - The DAT separates immune spherocytosis (AIHA); it does not confirm HS.
      - Electrophoresis diagnoses haemoglobinopathies such as thalassaemia and HbS.
      - The fluorescent spot test screens for G6PD deficiency.
      - CD55 and CD59 flow cytometry diagnoses PNH.
    src: { page: 20, quote: "Eosin -5- Maleimide Binding test is the gold standard confirmatory test" }
    status: unverified
  - id: hem.L03.014
    kind: mcq
    topic: hs
    stem: Which membrane interaction is NOT one of the two linkages the book names between the red cell lipid bilayer and its skeleton?
    options:
      - Glycophorin A with band 4.2
      - Ankyrin with spectrin
      - Ankyrin with band 3
      - Glycophorin C with protein 4.1
    answer: 0
    why:
      - "Correct: the book names ankyrin–spectrin–band 3 and glycophorin C–protein 4.1 (p18–19)."
      - Ankyrin–spectrin is part of the first linkage.
      - Band 3 in the bilayer is part of the first linkage.
      - Glycophorin C and protein 4.1 form the second linkage.
    src: { page: 19, quote: "The second attachment between skeleton and bilayer provided by glycophorin C and protein 4.1." }
    status: unverified
  # ---------- p21-22: thalassaemia classification ----------
  - id: hem.L03.015
    kind: card
    topic: thal-class
    front: Define the thalassaemias.
    back: A heterogeneous group of inherited haemoglobin disorders with reduced or absent production of one of the globin chains.
    src: { page: 21, quote: "characterized by reduced or absent production of one of the globin chains" }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.016
    kind: enumerate
    topic: thal-class
    prompt: On what two bases are thalassaemias classified?
    points:
      - The type of globin chain deficiently synthesised (alpha, beta)
      - Clinical expression (major, intermedia, minor)
    pass: 2
    src: { page: 21, quote: "The type of globin chain that is deficiently synthesized, or (2) Clinical expression of the disease." }
    status: unverified
  - id: hem.L03.017
    kind: table
    topic: thal-class
    title: Clinical classification of thalassaemia
    columns: [Type, Severity]
    rows:
      - [Thalassaemia major, Severe transfusion-dependent anaemia]
      - [Thalassaemia intermedia, Intermediate anaemia not needing regular transfusion]
      - [Thalassaemia minor, "Usually asymptomatic, mild or no anaemia, prominent red cell changes"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 22, quote: "Thalassaemia intermedia is characterized by intermediate degree of severity of anaemia that does not require regular blood transfusions." }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.018
    kind: card
    topic: beta-major
    front: What is the other name of beta thalassaemia major?
    back: Cooley's anaemia. It is the most severe beta thalassaemia.
    src: { page: 22, quote: "Is also known as Cooley‘s anaemia." }
    status: unverified
  - id: hem.L03.019
    kind: order
    topic: beta-major
    prompt: Order the pathogenesis of beta thalassaemia major.
    steps:
      - Inadequate beta globin synthesis
      - Excess free alpha chains accumulate
      - Unbound alpha chains precipitate in erythroblasts and red cells
      - Lysis of erythroblasts in the marrow (ineffective erythropoiesis)
      - Rigid red cells trapped in the spleen; splenomegaly
    src: { page: 22, quote: "leading to the lysis of erythroblasts and red cells in the bone marrow (ineffective erythropoiesis)" }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.020
    kind: card
    topic: beta-major
    front: In beta thalassaemia major, why are red cells microcytic and hypochromic, and why does the spleen enlarge?
    back: Reduced Hb synthesis makes microcytic hypochromic cells; red cells with alpha-chain aggregates lose flexibility, are trapped in the spleen, and the excess peripheral destruction causes splenomegaly.
    src: { page: 22, quote: "Reduced synthesis of HB leads to the formation of microcytic hypochromic red cells." }
    status: unverified
  - id: hem.L03.021
    kind: card
    topic: beta-major
    front: Why does HbF worsen hypoxia in beta thalassaemia major?
    back: HbF is the predominant haemoglobin, and it exacerbates tissue hypoxia.
    src: { page: 23, quote: "thalassaemia, thus exacerbates tissue hypoxia" }
    status: unverified
  - id: hem.L03.022
    kind: card
    topic: beta-major
    front: What causes the skeletal changes of thalassaemia major?
    back: Severe anaemia and hypoxia drive extreme marrow hyperplasia; the expanding marrow weakens and deforms the skull and facial bones, and cortical thinning may lead to pathological fractures.
    src: { page: 23, quote: "Expansion of hyperactive bone marrow causes weakening and deformities of skull and of facial bones." }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.023
    kind: card
    topic: beta-major
    front: What is the skull X-ray sign in the book's thalassaemia figure (p23)?
    back: The "hair-on-end" appearance from marrow expansion.
    src: { page: 23, quote: "Hair-on-end" }
    status: unverified
  - id: hem.L03.024
    kind: enumerate
    topic: beta-major
    prompt: Mention the two causes of iron overload in beta thalassaemia major.
    points:
      - Increased intestinal iron absorption due to ineffective erythropoiesis
      - Chronic regular blood transfusion
    pass: 2
    src: { page: 23, quote: "Iron absorption from the intestine is increased in" }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.025
    kind: table
    topic: beta-major
    title: Organ damage from iron overload
    columns: [Organ, Result]
    rows:
      - [Pancreas, Diabetes mellitus]
      - [Liver, Cirrhosis]
      - [Gonads, Infertility]
      - [Parathyroid and thyroid, "Hypoparathyroidism, hypothyroidism"]
      - [Heart, Arrhythmias and heart failure]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 23, quote: "Iron overload may damage parenchymal cells of various organs such as pancreas (diabetes mellitus), liver (cirrhosis), gonads (infertility)" }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.026
    kind: enumerate
    topic: beta-major
    prompt: Mention other complications of beta thalassaemia major (besides bone changes and iron overload).
    points:
      - Hypersplenism
      - Extramedullary haematopoiesis foci compressing vital structures such as the spinal cord
      - Death from anaemia or infection before 5 years if untreated
      - Transfusion-transmitted HIV, HBV and HCV
    pass: 3
    src: { page: 24, quote: "Untreated patients usually die from anaemia or infections before five years of age." }
    status: unverified
  - id: hem.L03.027
    kind: cloze
    topic: beta-major
    text: "In thalassaemia major the Hb is between {{c1::2–6}} g/dL, and the anaemia is {{c2::microcytic hypochromic}}; reticulocytosis is {{c3::modest}}."
    src: { page: 24, quote: "a haemoglobin concentration between 2-6 gm/dl. Anaemia is typically microcytic and hypochromic." }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L03.028
    kind: enumerate
    topic: beta-major
    prompt: Mention the blood film findings in beta thalassaemia major.
    points:
      - Marked anisopoikilocytosis
      - Severe hypochromia
      - Plenty of target cells
      - Basophilic stippling
      - Nucleated red cells
    pass: 4
    src: { page: 24, quote: "red blood cells show marked anisopoikilocytosis severe hypochromia, plenty of target cells, basophilic stippling and nucleated red cells" }
    status: unverified
  - id: hem.L03.029
    kind: cloze
    topic: beta-major
    text: "Hb electrophoresis in thalassaemia major shows elevated {{c1::HbF (10–98%)}}; HbA2 may be {{c2::normal or increased}}."
    src: { page: 25, quote: "this characteristically shows elevated HbF (10- 98%). HbA2 may be normal or increased." }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L03.030
    kind: enumerate
    topic: beta-major
    prompt: Mention other investigations in thalassaemia major and their results.
    points:
      - Bone marrow shows severe erythroid hyperplasia
      - Storage iron (serum ferritin) is increased
      - Unconjugated bilirubin is increased
    pass: 3
    src: { page: 25, quote: "Bone marrow examination shows severe erythroid hyperplasia." }
    status: unverified
  - id: hem.L03.031
    kind: mcq
    topic: beta-major
    stem: A 4-year-old Egyptian boy has severe pallor, frontal bossing, a big spleen and Hb 4.5 g/dL. The film shows target cells and nucleated red cells. Which electrophoresis finding is expected?
    options:
      - Markedly raised HbF
      - HbS band only
      - HbH (beta-4) tetramers
      - Normal pattern with low HbA2
      - Hb Bart's (gamma-4)
    answer: 0
    why:
      - "Correct: thalassaemia major shows elevated HbF (10–98%), HbA2 normal or increased (p25)."
      - HbS is sickle cell disease, which is normocytic.
      - HbH is an alpha thalassaemia with 3 genes deleted.
      - A normal pattern does not fit a transfusion-dependent anaemia.
      - Hb Bart's is the fetal alpha thalassaemia (hydrops).
    src: { page: 25, quote: "this characteristically shows elevated HbF (10- 98%)." }
    status: unverified
  - id: hem.L03.032
    kind: mcq
    topic: beta-major
    stem: Why is iron absorption increased in an untransfused patient with thalassaemia major?
    options:
      - Ineffective erythropoiesis
      - Excess vitamin C intake
      - Hypersplenism
      - Low HbF
      - Liver cirrhosis
    answer: 0
    why:
      - "Correct: intestinal iron absorption increases due to ineffective erythropoiesis (p23)."
      - Diet is not the book's mechanism.
      - Hypersplenism destroys cells; it does not drive iron absorption.
      - HbF is high, not low, in thalassaemia major.
      - Cirrhosis is a result of iron overload, not its cause.
    src: { page: 23, quote: "Iron absorption from the intestine is increased in" }
    status: unverified
  # ---------- p25-26: beta minor ----------
  - id: hem.L03.033
    kind: card
    topic: beta-minor
    front: What is beta thalassaemia minor?
    back: The heterozygous carrier state, with little or no anaemia but prominent red cell morphologic changes.
    src: { page: 25, quote: "This is the heterozygous carrier state of" }
    status: unverified
  - id: hem.L03.034
    kind: card
    topic: beta-minor
    front: When may a beta thalassaemia carrier become anaemic?
    back: During demanding situations such as infection or pregnancy; otherwise usually asymptomatic.
    src: { page: 26, quote: "Patients are usually asymptomatic but may develop anaemia during demanding situations such as infections or pregnancy." }
    status: unverified
  - id: hem.L03.035
    kind: cloze
    topic: beta-minor
    text: "In thalassaemia minor Hb is normal or mildly low, generally not below {{c1::9}} g/dL; MCV and MCH are {{c2::reduced}} while the red cell count is {{c3::increased}}."
    src: { page: 26, quote: "Haemoglobin level is either normal or mildly decreased and is generally not less than 9 gms/dl." }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L03.036
    kind: mcq
    topic: beta-minor
    stem: A pregnant woman has Hb 10.2 g/dL, MCV 63 fL, MCH 20 pg and a red cell count of 5.9 × 10¹²/L. Ferritin is normal. Most likely?
    options:
      - Beta thalassaemia minor
      - Iron deficiency anaemia
      - Thalassaemia major
      - Sickle cell anaemia
      - Physiologic anaemia of pregnancy alone
    answer: 0
    why:
      - "Correct: low MCV and MCH with an increased red cell count and Hb not below 9 g/dL fit thalassaemia minor; pregnancy unmasks it (p26)."
      - Iron deficiency gives a low red cell count and low ferritin.
      - Thalassaemia major has Hb 2–6 g/dL from childhood.
      - Sickle cell anaemia is normocytic.
      - Dilutional anaemia does not cause MCV 63 fL.
    src: { page: 26, quote: "Red cell count is increased." }
    status: unverified
  - id: hem.L03.037
    kind: card
    topic: beta-minor
    front: What are the reticulocyte count and bilirubin in thalassaemia minor?
    back: Both slightly elevated.
    src: { page: 26, quote: "Reticulocytes count and S. bilirubin are slightly elevated." }
    status: unverified
  # ---------- p26-28: alpha thalassaemia ----------
  - id: hem.L03.038
    kind: cloze
    topic: alpha-thal
    text: "Humans have {{c1::four}} alpha globin genes, two on each chromosome {{c2::16}}."
    src: { page: 26, quote: "globin genes, two on each chromosome no. 16" }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L03.039
    kind: table
    topic: alpha-thal
    title: Alpha thalassaemia by number of functional alpha genes (p27 figure)
    columns: [Functional genes, Syndrome]
    rows:
      - ["4", Normal]
      - ["3 (-α/αα)", Silent alpha+ thalassaemia]
      - ["2 (--/αα or -α/-α)", Alpha thalassaemia trait]
      - ["1 (--/-α)", HbH disease]
      - ["0 (--/--)", Hb Bart's hydrops fetalis (lethal)]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 27, quote: "HbH disease" }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.040
    kind: card
    topic: alpha-thal
    front: What causes Hb Bart's hydrops fetalis, and what is Hb Bart's?
    back: Homozygous alpha-0 thalassaemia (--/--); with no alpha chains, excess gamma chains form gamma-4 tetramers (Hb Bart's).
    src: { page: 26, quote: "This is the most severe form of" }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.041
    kind: card
    topic: alpha-thal
    front: What happens to infants with Hb Bart's hydrops fetalis?
    back: They are stillborn or die soon after birth; severely anaemic with massive anasarca and hepatosplenomegaly.
    src: { page: 26, quote: "Infants with this disease are either stillborn or die soon after birth." }
    status: unverified
  - id: hem.L03.042
    kind: card
    topic: alpha-thal
    front: What is the genotype of HbH disease, and what is HbH?
    back: Alpha-0 plus alpha+ thalassaemia (--/-α), i.e. deletion of 3 alpha genes; HbH is beta-4 tetramers.
    src: { page: 27, quote: "thalassaemias are inherited (--/-) i.e. there is deletion of 3" }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.043
    kind: card
    topic: alpha-thal
    front: How are red cells destroyed in HbH disease?
    back: Beta-chain tetramers precipitate in older red cells as inclusions, and these cells are destroyed in the spleen.
    src: { page: 27, quote: "chain tetramers precipitate in older red cells and form red cell inclusions; these red cells are destroyed in spleen" }
    status: unverified
  - id: hem.L03.044
    kind: cloze
    topic: alpha-thal
    text: "HbH disease: Hb {{c1::7–10}} g/dL, icterus and hepatosplenomegaly; transfusions are usually {{c2::not needed}}."
    src: { page: 27, quote: "These patients have anaemia (haemoglobin 7-10 gms/dl), icterus, and hepatosplenomegaly. Transfusions are usually not needed." }
    status: unverified
    tags: [numbers]
  - id: hem.L03.045
    kind: card
    topic: alpha-thal
    front: How is alpha-0 thalassaemia trait (--/αα) usually found, and what does it show?
    back: It is asymptomatic, so it is found on routine blood studies; very mild anaemia with microcytic hypochromic cells and low MCV and MCH.
    src: { page: 28, quote: "Persons with this condition have very mild anaemia, microcytic and hypochromic red cells, and decreased MCV and MCH." }
    status: unverified
  - id: hem.L03.046
    kind: card
    topic: alpha-thal
    front: What do red cells show in silent alpha+ thalassaemia (-α/αα)?
    back: Normal morphology and indices, or a slight fall in MCV or MCH.
    src: { page: 28, quote: "Red cell morphology and indices are normal or there may be a slight decrease in MCV or MCH." }
    status: unverified
  - id: hem.L03.047
    kind: mcq
    topic: alpha-thal
    stem: A 30-year-old Asian man has lifelong mild jaundice, Hb 8.5 g/dL, splenomegaly and a microcytic film with target cells. He has never needed transfusion. Supravital staining shows red cell inclusions. How many functional alpha genes does he have?
    options:
      - One (HbH disease)
      - Zero
      - Two
      - Three
      - Four
    answer: 0
    why:
      - "Correct: HbH disease has 3 genes deleted (--/-α), Hb 7–10 g/dL, icterus, hepatosplenomegaly and beta-4 inclusions; transfusion usually not needed (p27)."
      - Zero genes is Hb Bart's hydrops, lethal at birth.
      - Two genes is alpha thalassaemia trait with very mild anaemia.
      - Three genes is silent, with near-normal indices.
      - Four genes is normal.
    src: { page: 27, quote: "These patients have anaemia (haemoglobin 7-10 gms/dl), icterus, and hepatosplenomegaly." }
    status: unverified
  - id: hem.L03.048
    kind: card
    topic: beta-minor
    front: Define thalassaemia intermedia and its transfusion needs.
    back: Clinical expression between major and minor; patients need no transfusion or only intermittent transfusion.
    src: { page: 28, quote: "These patients do not require transfusions or require only intermittently." }
    status: unverified
  # ---------- p28-29: thalassaemia treatment ----------
  - id: hem.L03.049
    kind: card
    topic: thal-rx
    front: What are the cornerstones of therapy for beta thalassaemia major?
    back: Regular red cell transfusion and iron chelation.
    src: { page: 28, quote: "Regular red cell transfusions and chelation therapy for iron overload are the cornerstones of therapy" }
    status: unverified
    tags: [high-yield]
  - id: hem.L03.050
    kind: cloze
    topic: thal-rx
    text: "Thalassaemia major is transfused regularly to keep Hb above {{c1::9.5–10.0}} g/dL, to prevent anaemia and hypoxia and to {{c2::suppress endogenous erythropoiesis}}."
    src: { page: 28, quote: "maintain the haemoglobin concentration constantly above 9.5 to 10.0 grams/dl" }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L03.051
    kind: cloze
    topic: thal-rx
    text: "Iron chelation usually starts at age {{c1::3}} years. Desferrioxamine is given {{c2::25–60 mg/kg}} subcutaneously by infusion pump over 12 hours, {{c3::5–6}} days a week."
    src: { page: 28, quote: "It is preferably administered by infusion pump 25-60 mg/kg body weight subcutaneously daily over 12 hours for 5-6 days a week." }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L03.052
    kind: table
    topic: thal-rx
    title: Iron chelators and their problems
    columns: [Chelator, Key facts]
    rows:
