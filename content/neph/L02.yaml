  # ---------- p32–33: chronicity, AKI vs CKD ----------
  - id: neph.L02.039
    kind: enumerate
    topic: chronicity
    prompt: How can chronicity (> 3 months) of kidney disease be proven?
    points:
      - Review of past GFR measurements or estimates
      - Review of past albuminuria/proteinuria and urine microscopy
      - Imaging (reduced kidney size, reduced cortical thickness)
      - Kidney pathology (fibrosis and atrophy)
      - Medical history of conditions causing CKD
      - Repeat measurements within and beyond the 3-month point
    pass: 4
    src: { page: 32, quote: "Proof of chronicity (duration of >3 months) can be established by:" }
    status: unverified
    tags: [high-yield]
  - id: neph.L02.040
    kind: enumerate
    topic: chronicity
    prompt: Which symptoms in the history point to CKD rather than AKI?
    points:
      - Easy fatigue
      - Anorexia, nausea, vomiting
      - Itching
      - Bone pain
      - Secondary amenorrhea, infertility
      - Polyuria
    pass: 4
    src: { page: 33, quote: "anorexia, nausea, vomiting, itching, bone pain, 2ry amenorrhea, infertility, polyuria" }
    status: unverified
  - id: neph.L02.041
    kind: card
    topic: chronicity
    front: Which examination findings favour CKD over AKI?
    back: Uremic facies, scratch marks, bone tenderness and neuropathy.
    src: { page: 33, quote: "Examination: Uremic facies, scratch marks, bone tenderness, neuropathy." }
    status: unverified
  - id: neph.L02.042
    kind: card
    topic: chronicity
    front: Which investigations favour CKD over AKI?
    back: Anemia of CKD, CKD-MBD, small kidneys on ultrasound, and biopsy.
    src: { page: 33, quote: "Investigations: anemia of CKD, CKD-MBD, small kidneys by U/S, Biopsy." }
    status: unverified
    tags: [high-yield]
