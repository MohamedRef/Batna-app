  # Split from lesson1 on 2026-11-13 (#828): hyponatremia types,
  # the volume algorithm and symptoms.
  - id: neph.L06.lesson6
    title: "الصوديوم الواطي: حقيقي ولا المعمل بيضحك عليك؟"
    hook: "الصوديوم الواطي مش دايمًا نقص صوديوم. أوقات ميه زيادة، وأوقات سكر، وأوقات المعمل بيضحك عليك."
    minutes: 10
    pages: [128, 129]
    topics: [hypo-types, hypo-volume]
    goals:
      - "تفرّق الـ hypertonic والـ pseudo والـ hypotonic hyponatremia وتعرف ليه كل واحدة بتحصل"
      - "تمشي في الـ algorithm بالـ volume status والـ urine Na وتفهم ليه الـ 20 بتفرّق"
      - "تعرف مين هيعمل أعراض وليه السرعة أهم من الرقم"
    status: unverified
    steps:
      - kind: explain
        page: 128
        title: "Hyponatremia: هادي بس خطيرة"
        quote: "In hospital, symptomatic hyponatraemia is associated with a mortality of 10-50%."
        text: |
          الـ ==hyponatremia== = Na أقل من **135**.

          أغلب العيانين **مفيش عندهم أعراض**، بس الـ perception والمشي بيتلخبطوا كل ما الـ Na ينزل. أما الـ **symptomatic** في المستشفى فـ mortality **10–50%**. يعني ما تستهونش بيها.
      - kind: reveal
        page: 128
        quote: "Most hyponatraemic patients are thought to be asymptomatic but perception and gait disturbances increase as Na falls."
        prompt: "لو أغلب العيانين ما عندهمش أعراض، ليه الكتاب بيقول خد بالك من الـ perception والمشي؟"
        answer: |
          الكتاب بيقول الـ **perception** والـ **gait disturbances** بيزيدوا كل ما الـ Na ينزل، حتى لو العيان شكله كويس.

          التفسير المقبول (مش في الكتاب): "مفيش أعراض" معناها مفيش صداع أو تشنجات، مش إن المخ شغال 100%. التركيز والتوازن بيقلّوا شوية، والكبير في السن بيقع، والوقعة عنده ممكن تبقى كسر. فـ ==asymptomatic== مش معناها "سيبه".
      - kind: reveal
        page: 128
        quote: "Extracellular hypertonicity associated with hyperglycemia favors efflux of water into the extracellular space, in turn decreasing the [Na+]."
        prompt: "عيان DKA سكره 700 والـ Na بتاعه 128. هل عنده نقص صوديوم؟"
        answer: "غالبًا لأ. ده ==translocational (hypertonic) hyponatremia==: السكر العالي بيشد **ميه من جوّه الخلايا** للـ ECF فيخفف الـ Na. الـ tonicity هنا **أكتر من 295**. والقاعدة: الـ Na بينزل **1.6 mEq/L لكل 100 mg/dL** زيادة في السكر."
      - kind: explain
        page: 129
        title: "الحسبة بالأرقام"
        quote: "[Na+] decreases by 1.6 mEq/L for every 100 mg/dL increase in serum glucose level."
        text: |
          القاعدة من الكتاب: الـ Na بينزل ==1.6 mEq/L لكل 100 mg/dL== زيادة في السكر.

          جرّبها على العيان اللي فات (سكر 700، Na 128). نعتبر السكر الطبيعي حوالي 100 (ده رقم مرجعي مقبول، مش في الكتاب):
          - السكر زايد **600** يعني 6 مرات × 1.6 = حوالي **10**.
          - الـ Na "الحقيقي" بعد التصحيح حوالي **138**: طبيعي.

          يعني لو اديت العيان ده ملح علشان الـ 128، هتعلّي الـ Na فوق الطبيعي لما السكر ينزل والميه ترجع الخلايا. عالج **السكر**، والـ Na هيرجع لوحده.
      - kind: aside
        tone: analogy
        page: 129
        quote: "[Na+] decreases by 1.6 mEq/L for every 100 mg/dL increase in serum glucose level."
        text: "زي كوباية شاي سكرها زيادة: تحط ميه عليها، **التركيز** بيقل وكمية السكر زي ما هي. الـ glucose هنا هو اللي بيجيب الميه من الخلايا ويخفف الـ Na."
      - kind: mnemonic
        page: 129
        quote: "Glycine- or sorbitol-containing bladder irrigants may also be absorbed."
        word: "GLIP"
        parts:
          - { key: "G", text: "Glucose high (hyperglycemia)" }
          - { key: "L", text: "Lipids high" }
          - { key: "I", text: "Irrigants (glycine or sorbitol bladder irrigants)" }
          - { key: "P", text: "Proteins high (plasma proteins, myeloma)" }
        hook: "**GLIP** للـ ==pseudohyponatremia==: المعمل بيقرا Na واطي والجسم مش واطي فعلًا (إلا الـ irrigants اللي بتتمص)."
      - kind: explain
        page: 129
        title: "ليه كل حرف في GLIP بيلخبط النتيجة؟"
        quote: "Pseudohyponatraemia: Occurs with increase lipids. Increase plasma proteins (myeloma). Hyperglycaemia. Glycine- or sorbitol-containing bladder irrigants may also be absorbed."
        text: |
          الكتاب بيدّي القايمة، وده السبب لكل واحدة بالتفسير المقبول (مش في الكتاب):

          - **Lipids و proteins** (==myeloma==): الـ plasma فيها حتة كبيرة دهون أو بروتين مش ميه. الجهاز بيقيس الـ Na في اللتر كله، فالرقم يطلع واطي، مع إن الـ Na في **الجزء المائي** طبيعي. العيان ما عندوش مشكلة، المشكلة في القياس.
          - **Glucose**: هنا الميه بتطلع فعلًا من الخلايا (اللي حسبناها فوق)، فالـ Na مخفف بجد بس الجسم مش ناقص Na.
          - **Irrigants** (glycine أو sorbitol): في عمليات البروستاتا والمثانة بيتمص محلول فيه ميه ومادة osmotic مش Na، فالـ Na يتخفف من غير ما الـ osmolality تقع بنفس القدر.

          الخلاصة: قبل ما تعالج Na واطي، اسأل: الـ **osmolality** واطية فعلًا ولا لأ؟
      - kind: figure
        remind: [neph.L06.024]
        page: 129
        quote: "Hyponatremia\n  Assess volume status\n    Hypovolemia: Total body water ↓; Total body Na+ ↓↓\n      Measure urinary [Na+]\n        >20 mmol/l: Renal losses\n          Diuretic excess\n          Mineralocorticoid deficiency\n          Salt-losing nephropathy\n          Bicarbonaturia with renal tubular acidosis and metabolic alkalosis\n          Ketonuria\n          Osmotic diuresis\n          Cerebral salt wasting\n        <20 mmol/l: Extrarenal losses\n          Vomiting\n          Diarrhea\n          Third spacing of fluids in burns, pancreatitis, trauma\n    Euvolemia (no edema): Total body water ↑; No change in total body Na+ (>20 mmol/l urinary Na+)\n      Glucocorticoid deficiency\n      Hypothyroidism\n      Stress\n      Drugs (see Table 8-2)\n      Syndrome of inappropriate ADH secretion (SIADH)\n    Hypervolemia: Total body water ↑↑; Total body Na+ ↑\n      Measure urinary [Na+]\n        >20 mmol/l: Acute or chronic kidney injury\n        <20 mmol/l\n          Nephrotic syndrome\n          Cirrhosis\n          Cardiac failure"
        title: "الـ algorithm: شوف الـ volume الأول"
        alt: "Hyponatremia algorithm. Assess volume status. Hypovolemia: urine Na above 20 means renal losses (diuretics, mineralocorticoid deficiency, salt-losing nephropathy, cerebral salt wasting); below 20 means extrarenal losses (vomiting, diarrhea, third spacing). Euvolemia: glucocorticoid deficiency, hypothyroidism, stress, drugs, syndrome of inappropriate ADH secretion (SIADH). Hypervolemia: urine Na above 20 means kidney injury; below 20 means nephrotic syndrome, cirrhosis, heart failure."
        caption: "سؤالين بس: العيان **ناشف ولا طبيعي ولا وارم**؟ وبعدين الـ ==urine Na== أكتر ولا أقل من **20**؟"
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="85" y="5" width="160" height="28" rx="8" class="fg-ink"/>
            <text x="165" y="24" text-anchor="middle" class="t-b">Assess volume status</text>
            <rect x="5" y="45" width="320" height="95" rx="8" class="fg-bad"/>
            <text x="15" y="64" class="t-b">Hypovolemia (TBW ↓, Na ↓↓)</text>
            <text x="15" y="84" class="t-sm">Urine Na &gt;20: renal losses</text>
            <text x="25" y="100" class="t-sm t-mut">diuretics, mineralocorticoid def., salt-losing</text>
            <text x="25" y="114" class="t-sm t-mut">nephropathy, osmotic diuresis, cerebral salt wasting</text>
            <text x="15" y="132" class="t-sm">Urine Na &lt;20: vomiting, diarrhea, third spacing</text>
            <rect x="5" y="150" width="320" height="75" rx="8" class="fg-box"/>
            <text x="15" y="169" class="t-b">Euvolemia, no edema (TBW ↑, Na =)</text>
            <text x="15" y="189" class="t-sm">Urine Na &gt;20</text>
            <text x="15" y="207" class="t-sm t-mut">glucocorticoid def., hypothyroidism, stress,</text>
            <text x="15" y="221" class="t-sm t-mut">drugs, SIADH</text>
            <rect x="5" y="235" width="320" height="85" rx="8" class="fg-acc"/>
            <text x="15" y="254" class="t-b">Hypervolemia (TBW ↑↑, Na ↑)</text>
            <text x="15" y="276" class="t-sm">Urine Na &gt;20: acute or chronic kidney injury</text>
            <text x="15" y="298" class="t-sm">Urine Na &lt;20: nephrotic syndrome, cirrhosis,</text>
            <text x="25" y="312" class="t-sm">cardiac failure</text>
          </svg>
      - kind: explain
        page: 129
        remind: [neph.L06.024]
        title: "ليه رقم 20 في البول بيفرّق؟"
        quote: "Hypovolemia Euvolemia (no edema)"
        text: |
          الكتاب بيقسّم بالـ volume الأول، وبعدين بالـ ==urine Na== فوق أو تحت **20**. والتفسير المقبول (مش في الكتاب) للمنطق:

          - **Hypovolemia + urine Na تحت 20**: الكلية سليمة وشايفة الجسم ناشف، فبتمسك كل ذرة Na. يبقى الخسارة **برّه الكلية**: ترجيع، إسهال، third spacing في الحروق والـ pancreatitis.
          - **Hypovolemia + urine Na فوق 20**: الجسم ناشف والكلية لسه بتطلّع ملح؟ يبقى **الكلية هي الخرم**: diuretics، نقص mineralocorticoid، salt-losing nephropathy، cerebral salt wasting.
          - **Hypervolemia + تحت 20**: في الـ nephrotic والـ cirrhosis والـ heart failure الدم "الفعّال" اللي الكلية حاسّاه قليل، فبتحبس Na مع إن الجسم وارم.
          - **Hypervolemia + فوق 20**: الكلية نفسها مريضة (AKI أو CKD) ومش قادرة تتحكم.
          - **Euvolemia**: الميه زايدة بس الـ Na الكلي زي ما هو، والعيان بياكل ملح عادي فبيطلّعه: **urine Na فوق 20**. ونقص الـ glucocorticoid والـ hypothyroidism بيعملوا نفس صورة الـ SIADH، علشان كده لازم يتستبعدوا قبل ما تقول SIADH.
      - kind: sort
        page: 129
        quote: "Hyponatremia\n  Assess volume status\n    Hypovolemia: Total body water ↓; Total body Na+ ↓↓\n      Measure urinary [Na+]\n        >20 mmol/l: Renal losses\n          Diuretic excess\n          Mineralocorticoid deficiency\n          Salt-losing nephropathy\n          Bicarbonaturia with renal tubular acidosis and metabolic alkalosis\n          Ketonuria\n          Osmotic diuresis\n          Cerebral salt wasting\n        <20 mmol/l: Extrarenal losses\n          Vomiting\n          Diarrhea\n          Third spacing of fluids in burns, pancreatitis, trauma\n    Euvolemia (no edema): Total body water ↑; No change in total body Na+ (>20 mmol/l urinary Na+)\n      Glucocorticoid deficiency\n      Hypothyroidism\n      Stress\n      Drugs (see Table 8-2)\n      Syndrome of inappropriate ADH secretion (SIADH)\n    Hypervolemia: Total body water ↑↑; Total body Na+ ↑\n      Measure urinary [Na+]\n        >20 mmol/l: Acute or chronic kidney injury\n        <20 mmol/l\n          Nephrotic syndrome\n          Cirrhosis\n          Cardiac failure"
        prompt: "حط كل سبب في الـ volume status بتاعه:"
        bins: ["Hypovolemia", "Euvolemia", "Hypervolemia"]
        cards:
          - { text: "Vomiting", bin: 0 }
          - { text: "Cerebral salt wasting", bin: 0 }
          - { text: "Syndrome of inappropriate ADH secretion (SIADH)", bin: 1 }
          - { text: "Hypothyroidism", bin: 1 }
          - { text: "Glucocorticoid deficiency", bin: 1 }
          - { text: "Cirrhosis", bin: 2 }
          - { text: "Nephrotic syndrome", bin: 2 }
          - { text: "Burns (third spacing)", bin: 0 }
        why: "الناشف خسر Na أكتر من الميه (من الكلية أو برّه). الـ euvolemic زادت ميته من غير ما الـ Na يتغير. الوارم زاد الاتنين والميه أكتر."
      - kind: explain
        page: 129
        title: "الأعراض: المخ بينفخ"
        quote: "Symptoms due to cerebral swelling as osmolality falls: the encephalopathy."
        text: |
          الأعراض جاية من ==cerebral swelling==: الـ osmolality بتنزل فالميه تدخل خلايا المخ.

          - **نادرة** لو chronic أو Na **فوق 125**.
          - **شائعة** لو acute أو Na **تحت 110**: صداع، apathy، confusion (خصوصًا الكبار)، تشنجات و coma.

          وده **السبب** إن الأعراض كلها مخية: المخ محبوس في جمجمة مقفولة، فأي نفخة بتضغط عليه (التفسير المقبول، مش في الكتاب).
      - kind: reveal
        page: 129
        quote: "Rare in chronic hyponatremia or Na >125mmol/L."
        prompt: "عيانين الاتنين Na بتاعهم 120. واحد بيتشنج والتاني قاعد بيتكلم عادي. إزاي؟"
        answer: |
          الفرق في **السرعة**. الكتاب بيقول الأعراض **نادرة في الـ chronic** وشائعة في الـ **acute**.

          التفسير المقبول (مش في الكتاب): خلايا المخ لما الـ Na ينزل بالراحة بتلحق **ترمي organic osmolytes** فما تشربش ميه وما تنفخش. اللي نزل فجأة ما لحقش، فالمخ ينفخ جوّه الجمجمة ويتشنج.

          وده نفس السبب اللي هيخليك بعدين **ما تستعجلش** وانت بتصحّح الـ chronic: الخلية اللي رمت الـ osmolytes ممكن تنكمش لو رفعت الـ Na بسرعة.
      - kind: check
        page: 129
        quote: "Common in acute hyponatremia or Na <110mmol/L"
        question: "Which hyponatremic patient is most likely to have symptoms?"
        options:
          - "Na 112 that fell over 12 hours"
          - "Na 128 for 3 months"
          - "Na 130 with hyperglycemia"
          - "Na 126 for years in heart failure"
        answer: 0
        why:
