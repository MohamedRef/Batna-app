      - "تعرف الـ work-up والعلاج للـ functional dysphagia"
    status: unverified
    steps:
      - kind: explain
        remind: [git.L03.092, git.L03.093]
        page: 96
        quote: "TCAs such as imipramine and trazodone , SSRIs such as citalopram and sertraline, pain receptor (TRPV1) antagonist AZD1386 and theophylline have been found to significantly reduce pain."
        title: "علاج الـ functional chest pain"
        text: |
          - **Psychosomatic and alternative:** ==Cognitive behavioral therapy (CBT)== فعّال، و **hypnotherapy** بتقلل شدة الألم، واتجرّب **Johrei** (energy healing).
          - **Pharmacotherapy:** TCAs زي imipramine و trazodone، SSRIs زي citalopram و sertraline، **TRPV1 antagonist AZD1386**، و **theophylline**، وكمان **venlafaxine** (SNRI).

          الفكرة واحدة: المريء حساس، فبنهدّي الـ ==pain processing== مش الحمض.

          التفسير المقبول (مش في الكتاب): يعني كل الأدوية دي مش «مضادات اكتئاب» هنا، دي **pain modulators** بجرعات صغيرة، والمريض محتاج يعرف كده علشان ما يفتكرش إنك شايفه مريض نفسي ويوقف الدوا.
      - kind: reveal
        page: 96
        quote: "CBT is effective in relieving symptoms of patients with noncardiac chest pain."
        prompt: "ليه علاج نفسي زي الـ CBT بيفيد في ألم جسدي حقيقي؟"
        answer: |
          الكتاب: الـ **CBT** فعّال في الـ noncardiac chest pain، والـ **hypnotherapy** قللت شدة الألم وحسّنت الـ wellbeing.

          التفسير المقبول (مش في الكتاب): افتكر بوابة الألم في المخ (الدرس اللي فات). مريض ألم الصدر غالبًا **خايف إنه قلب**، والخوف بيفتح البوابة، فالألم يزيد، والخوف يزيد. الـ CBT بيكسر الأفكار دي («ده مش قلب، القلب اتفحص»)، فالبوابة تقفل جزئيًا والـ threshold يعلى. يعني الألم حقيقي، بس **مستوى الصوت** بتاعه في المخ هو اللي اتعالج.
      - kind: explain
        page: 97
        quote: "Globus is described as a ‗lump’ in the throat that is experienced without swallowing and may actually get better with swallowing."
        title: "الـ globus: كتلة مش موجودة"
        text: |
          الكتاب: الـ ==globus== إحساس بـ **lump** في الزور، بيحصل **من غير بلع**، وممكن **يتحسن لما يبلع**.

          والـ **history** والـ **physical examination** هما اللي بيوجّهوا الفحوصات علشان نستبعد:
          - أسباب **dysphagia** مصاحبة.
          - أمراض **head and neck**.
          - وأقل: الـ GERD كـ **atypical manifestation**.

          التفسير المقبول (مش في الكتاب) لـ «ليه بيتحسن مع البلع»: ده العكس تمامًا من أي obstruction حقيقي. الكتلة الحقيقية (tumor، web) بتبان **وانت بتبلع** لأن الأكل بيخبط فيها. فلو المريض بيقول «الإحساس بيروح لما أبلع»، ده بيشاور على globus، ولو بيقول «الأكل بيقف»، ده dysphagia ومحتاج شغل تاني.
      - kind: figure
        page: 98
        title: "الـ algorithm بتاع الـ globus"
        image: { file: git/L03-globus-algorithm.webp, book: true }
        alt: "Book flow chart: a nonpainful throat lump gets a comprehensive head and neck directed work-up (looking for coexisting dysphagia, ENT evaluation, extrinsic causes), then EGD; if negative and there are reflux symptoms, a PPI trial; a response means GERD, titrate PPI; no response means globus sensation."
        caption: |
          **Nonpainful throat lump** ← الأول **H+P** موجّه للراس والرقبة (dysphagia مصاحبة؟ ENT؟ سبب من بره؟)، وبعدين **EGD**.

          لو فيه reflux symptoms جرّب **PPI**: استجاب = GERD. ما استجابش = ==globus sensation==.
      - kind: aside
        tone: trap
        page: 97
        quote: "A3. Reflux hypersensitivity\nDiagnostic criteria* - Must include all of the following:\n  1. Retrosternal symptoms including heartburn and chest pain\n  2. Normal endoscopy and absence of evidence that eosinophilic esophagitis is the cause of the symptoms\n  3. Absence of major esophageal motor disorders**\n  4. Evidence of triggering of symptoms by reflux events despite normal acid exposure on pH- or pH-impedance monitoring†\n*Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis with a frequency of at least twice a week\n**Achalasia/EGJ outflow obstruction, diffuse esophageal spasm, jackhammer esophagus, absent peristalsis\n†Response to antisecretory therapy does not exclude the diagnosis"
        text: |
          الفرق كله في **symptom association**: في الـ reflux hypersensitivity الحمض كميته طبيعية، بس كل reflux event عادي بيعمل أعراض (**triggering by reflux events**).

          وخد بالك: في الـ reflux hypersensitivity الـ ==response to antisecretory therapy== **does not exclude the diagnosis**. أما الـ functional heartburn فمن شروطه إن مفيش relief رغم الـ optimal antisecretory therapy.
