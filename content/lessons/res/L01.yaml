        quote: "4 Phases of Clinical trials:\n  Pre-clinical: Pre-clinical trial is designed for assessment of safety, toxicity, pharmacodynamic and pharmacokinetic information\n  Phase 1: Drug or treatment is given to a small group of people (20-100) to evaluate its safety and identify side effects and safe dosage range\n  Phase 2: Drug or treatment is given to a medium group of people (100-500) for further evaluation\n  Phase 3: Drug or treatment is given to a larger group of people (300-3000) to evaluate its safety\n  Phase 4: Post marketing studies delineate additional information including the drug risk, benefits and optimal use"
