      - kind: explain
        page: 468
        title: "ليه السؤال الأول ADAMTS13؟"
        quote: "Thrombotic microangiopathy: Microangiopathic hemolytic anemia: decreased hemoglobin and serum haptoglobin, elevated serum LDH, ±schistocytes on smear; Thrombocytopenia: less than 150,000 /uL or >25% decrease of baseline; End organ damage: kidney, brain, heart, lung, etc\n  ADAMTS13 activity\n    <10% → Thrombotic thrombocytopenic purpura\n    >10% → Non-TTP thrombotic microangiopathy\n      Co-existing diseases\n        Yes → Secondary thrombotic microangiopathy\n          Infections: S. pneumonia, HIV, influenza, others\n          Medications: Calcineurin inhibitors, mTOR inhibitors; Chemotherapeutic agents: mytomycin C, gemcitabine, cisplatin; VEGF and tyrosin inhibitors; Others\n          Malignant hypertension\n          Pregnancy/ HELLP syndrome\n          Autoimmune diseases: Systemic lupus erythematosus; Anti-phospholipid syndrome; Scleroderma; Others\n          Bone marrow/ solid organ transplant\n          Inborn error of metabolism: Methylmalonic acidemia; Vitamin B12 deficiency\n        No → Shiga toxin/ Shiga toxin-producing E. coli (STEC)\n          Yes → STEC-hemolytic uremic syndrome\n          No → Atypical hemolytic uremic syndrome"
        text: |
          الـ algorithm بيبدأ بـ ==ADAMTS13 activity==: لو **<10%** يبقى **TTP**، لو **>10%** يبقى TMA تانية.

          بعدها: فيه ==Co-existing diseases==؟ يبقى **secondary TMA**. مفيش؟ اسأل على الـ **Shiga toxin**: موجود يبقى **STEC-HUS**، مش موجود يبقى **aHUS**.

          ليه الترتيب ده؟ التفسير المقبول (مش في الكتاب): الـ TTP أكتر واحدة بتموّت بسرعة ومحتاجة plasma exchange **النهارده**، فلازم تستبعدها الأول. وبعدها بتدوّر على السبب اللي تقدر **تشيله** (دوا، عدوى، حمل) قبل ما تقول "atypical"، لأن الـ aHUS تشخيص استبعاد وعلاجه غالي وطويل.

          وأسباب الـ secondary في الـ figure متقسّمة: **infections**، **medications** (chemo زي mitomycin C و gemcitabine و cisplatin، الـ VEGF inhibitors، الـ CNI والـ mTOR)، **malignant hypertension**، **pregnancy/HELLP**، **autoimmune** (SLE، APS، scleroderma)، **transplant**، و **inborn errors** (methylmalonic acidemia، B12).
      - kind: explain
        page: 469
        title: "أول episode: الـ workup والعلاج"
        quote: "First episode of TMA\n  Medical history; Physical examination; ADAMTS13; Stool: culture, STEC testing; Bacterial culture; Pneumococcal urinary antigen test; Influenza rapid test; HIV serology; Methylmalonic acidemia test (children); Vitamin B12 test (children); Antinuclear antibody; Anti-dsDNA antibody; Anti-Cardiolipin antibody; Others\n    Secondary TMA → Treat underlying disease\n    Uncertain aHUS → Plasma therapy (Plasma infusion, Plasma exchange)\n    aHUS → First-line Eculizumab therapy (also for Post-transplantation recurrence of aHUS or aHUS replapse)\n      Anti-CFH antibody (+) → Eculizumab or plasma exchange plus Steroid ± Immunosuppresant\n        TMA remission → Steroid ± Immunosuppresant\n          Anti-CFH antibody (-) → ...\n      Anti-CFH antibody (-) → Eculizumab alone"
        text: |
          الـ workup: **ADAMTS13**، stool **Shiga toxin-producing Escherichia coli (STEC)**، pneumococcal urinary antigen، HIV، antinuclear antibodies (ANA) و anti-dsDNA و anticardiolipin، والأطفال: **B12** و **methylmalonic acid**.

          | النتيجة | العلاج |
          |---|---|
          | Secondary TMA | عالج السبب |
          | Uncertain aHUS | **Plasma therapy** |
          | aHUS | ==Eculizumab== first-line |
          | aHUS + **anti-CFH antibody** | Eculizumab أو plasma exchange (PEX) **+ steroid ± immunosuppressant** |
      - kind: reveal
        page: 469
        quote: "Complete blood count: hemoglobin and platelet\nPeripheral blood smear and Coombs' test\nDisseminated intravascular coagulopathy: prothrombin time, activated partial thromboplastin time, D-dimer, fibrinogen degradation products\nSerum haptoglobin, lactate dehydrogenase\nEnd organ damage survey: serum creatinine, blood urea nitrogen, CK-MB, troponin-I, amylase, lipase, alanine transaminase, bilirubin\nExclude thrombotic thrombocytopenic purpura:\n  ADAMTS13 activity\nDifferentiate secondary thrombotic microangiopathy:\n  Autoimmune diseases: C3, C4, anti-nuclear antibody, anti-cardiolipid antibody, anti-Scl70, anti-β2-microglobulin\n  Infectious diseases: stool Shiga-toxin or culture for Shiga toxin-producing E.coli (STEC), urine pneumococcal antigen, serum T-antigen, anti-HIV antibody\n  Inborn error of metabolism: serum homocysteine, vitamin B12, urine organic acids\n  Serum complement assays: Serum CFH, CFI, CFB, C3, C4; Serum C5b-9; Serum CH50/AH50\n  Serum complement auto-antibody: Anti-CFH Antibody\n  Molecular analysis: Complement-associated genes: CFH, CFI, VTR, C3, CFB, MCP, CFHR5, CFH/CFHR1 hybrid allele, CFHR1/CFHR4 deletion, CFHR3/CFHR1 deletion, C8B, C9, MASP1; Coagulation-associated genes: THBD, PLG, CD36, VWF; Others: DGKE, VTN"
        prompt: "طفل عنده TMA من غير إسهال. ليه الـ workup فيه vitamin B12 و methylmalonic acid، وليه anti-CFH antibody؟"
        answer: |
          الـ workup في الكتاب بيدوّر على **كل باب** من أبواب الـ secondary: DIC (PT و aPTT و D-dimer)، end-organ (creatinine، troponin، amylase)، autoimmune (C3 و C4 و ANA و anticardiolipin)، infections (stool Shiga toxin، pneumococcal antigen، HIV)، و **inborn error of metabolism** (homocysteine، **vitamin B12**، urine organic acids).

          الـ B12 والـ methylmalonic في **الأطفال** عشان الـ inborn errors دي بتظهر بدري، وعلاجها مختلف خالص (مش eculizumab).

          والـ **anti-CFH antibody** لأنه بيغيّر العلاج: لو موجود، الـ figure بتقول eculizumab أو plasma exchange **+ steroid ± immunosuppressant**. التفسير المقبول (مش في الكتاب): هنا المشكلة **antibody** بيوقف factor H، فلازم تكبت الـ B cells اللي بتصنعه، مش تقفل الـ complement بس.
      - kind: explain
        page: 470
        title: "aHUS وصل ESRD: نزرع إزاي؟"
        quote: "Figure 3: Management of patients with end-stage renal disease caused by atypical hemolytic uremic syndrome (aHUS). The decisions of renal transplantation could be made according to the molecular results from both recipients and donors. Prophylactic anti-C5 monoclonal antibody is determined by the relapse risk after transplantation by the molecular results."
        text: |
          الكتاب بيقول قرار الزرع ==according to the molecular results from both recipients and donors==، والـ prophylactic **anti-C5** على حسب ==the relapse risk after transplantation==.

          ليه الـ donor كمان؟ لو **living related donor** شايل نفس الـ mutation، الكلية نفسها ممكن تتأذي، والمتبرع نفسه في خطر يعمل aHUS بعد ما يدّي كلية.

          وليه الـ risk بيختلف؟ لأن فيه mutations في بروتينات **في الدم** (زي CFH و CFI، بيتعملوا في الكبد) فالكلية الجديدة هتتعرض لنفس المشكلة، ومشكلة في بروتين **على الـ membrane** نفسها (MCP) فالكلية الجديدة بتيجي ومعاها MCP سليم. هتشوف الأرقام دي في درس الـ aHUS.
      - kind: check
        page: 470
        quote: "Figure 3: Management of patients with end-stage renal disease caused by atypical hemolytic uremic syndrome (aHUS). The decisions of renal transplantation could be made according to the molecular results from both recipients and donors. Prophylactic anti-C5 monoclonal antibody is determined by the relapse risk after transplantation by the molecular results."
        question: "An aHUS patient with ESRD has a CFH mutation. His brother, a willing donor, carries the same mutation. What does the transplant algorithm suggest?"
        options:
          - "Transplantation from this donor is not suggested"
          - "Transplant without prophylaxis"
          - "Transplant with eculizumab prophylaxis from this donor"
          - "Combined transplant from this donor"
        answer: 0
        why:
          - "صح: لو الـ living related donor عنده نفس الـ mutation، الـ transplantation مش مقترحة (Figure 3)."
          - "الـ complement factor H (CFH) = moderate-high risk، فمحتاج prophylaxis لو مع donor تاني."
          - "المشكلة في الـ donor نفسه، مش في الـ prophylaxis."
          - "مش في الشكل."
      - kind: try
        items: [neph.L14.105, neph.L14.107, neph.L14.108, neph.L14.110, neph.L14.114]
    recap:
      - "TMA = microangiopathic hemolytic anemia + thrombocytopenia (<150,000 أو >25% نزول) + end-organ damage."
      - "الأصل: endothelial damage ← thrombi في الأوعية الصغيرة ← RBC بتتقطع (Coombs سلبي)."
      - "ADAMTS13 <10% = TTP؛ غير كده: secondary؟ Shiga toxin؟ وإلا aHUS."
      - "الـ workup بيدوّر على كل باب secondary؛ anti-CFH = ضيف steroid ± immunosuppressant."
      - "aHUS و ESRD: الزرع حسب الـ genetics للمريض والمتبرع؛ prophylaxis حسب الـ risk."
