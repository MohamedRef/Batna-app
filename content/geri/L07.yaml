  # ---------- p107: aims and definition ----------
  - id: geri.L07.005
    kind: enumerate
    topic: cga
    prompt: What are the aims of geriatric medicine?
    points:
      - Maintain health in old age through a high level of engagement and avoidance of disease
      - Early detection and appropriate treatment of disease
      - Maintain maximum independence consistent with irreversible disease and disability
      - Sympathetic care and support during terminal illness
    pass: 3
    hook: "أهداف الـ geriatrics «صحة، كشف بدري، استقلال، وآخر الطريق»: health بـ engagement عالي وتجنب المرض، early detection وعلاج مناسب، أقصى independence مع الإعاقة، ورعاية ودعم في الـ terminal illness."
    src: { page: 107, quote: "Aims of Geriatric Medicine\n  Maintenance of health in old age by high level of engagement and avoidance of diseases.\n  Early detection and appropriate treatment of diseases.\n  Maintenance of maximum independence consistent with irreversible disease and disability.\n  Sympathetic care and support during the terminal illness." }
    status: unverified
    tags: [high-yield]
  - id: geri.L07.006
    kind: card
    topic: cga
    front: What is Comprehensive Geriatric Assessment (CGA)?
    back: A multistep process of care. A multidimensional, holistic assessment of the older person's health and wellbeing leads to a plan for the issues that concern them (and their family or carers); interventions support the plan, and progress is reviewed and the plan reassessed at intervals.
    src: { page: 107, quote: "Comprehensive Geriatric Assessment (CGA) is a process of care comprising a number of steps. Initially, a multidimensional holistic assessment of an older person considers health and wellbeing and leads to the formulation of a plan to address issues which are of concern to the older person (and their family and carers when relevant). Interventions are then arranged in support of the plan. Progress is reviewed and the original plan reassessed at appropriate intervals with the interventions reconsidered accordingly." }
    status: unverified
    tags: [high-yield]
  - id: geri.L07.007
    kind: cloze
    topic: cga
    text: "comprehensive geriatric assessment (CGA) starts with a {{c1::multidimensional holistic}} assessment of the older person, which leads to a {{c2::plan}} addressing the issues that concern the person and their family or carers."
    src: { page: 107, quote: "Comprehensive Geriatric Assessment (CGA) is a process of care comprising a number of steps. Initially, a multidimensional holistic assessment of an older person considers health and wellbeing and leads to the formulation of a plan to address issues which are of concern to the older person (and their family and carers when relevant). Interventions are then arranged in support of the plan. Progress is reviewed and the original plan reassessed at appropriate intervals with the interventions reconsidered accordingly." }
    status: unverified
