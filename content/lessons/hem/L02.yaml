            <path d="M180 310 L244 306" class="fg-thin"/>
            <text x="244" y="302" class="t-sm t-b">Leg ulcers</text>
            <text x="244" y="316" class="t-sm t-mut">sickle cell</text>
          </svg>
      - kind: sort
        page: 12
        quote: "Splenomegaly: AIHA or pyruvate kinase deficiency (soft spleen), myelofibrosis or Gaucher‘s disease (firm)"
        prompt: "الطحال ده soft ولا firm؟"
        bins: ["Soft spleen", "Firm spleen"]
        cards:
          - { text: "AIHA", bin: 0 }
          - { text: "PK deficiency", bin: 0 }
          - { text: "Myelofibrosis", bin: 1 }
          - { text: "Gaucher's disease", bin: 1 }
          - { text: "Hereditary spherocytosis", bin: 1 }
          - { text: "Thalassaemia major", bin: 1 }
        why: "الكتاب: **AIHA** و **PK deficiency** = soft. الـ **myelofibrosis** و **Gaucher** و **chronic haemolytic states** (HS، thalassaemia major) = firm. المزمن والمتليّف بيبقى ناشف."
      - kind: explain
        page: 13
        title: "البطن والعقد والأعصاب"
        quote: "Hepatosplenomegaly in lymphoproliferative or myeloproliferative disorders."
        text: |
          - **Shrunken liver** (cirrhosis): نزيف ==varices==، **hypersplenism**، أو haemolysis من الـ **spur cells**.
          - **Hepatosplenomegaly**: lympho- أو myeloproliferative.
          - **Mass**: intra-abdominal malignancy. **Lymphadenopathy**: lymphoreticular disease أو viral infection.
          - **Bone deformities**: thalassaemia major. **Leg ulcers**: sickle cell.
          - **الأعصاب**: peripheral neuropathy و ==posterior and lateral tracts== في الحبل الشوكي = **cobalamin deficiency**.
      - kind: aside
        tone: exam
        page: 12
        quote: "Loss of the lateral aspects of the eyebrows in hypothyroidism"
        text: "خلي بالك: صفحة 12 بتقول الـ **hypothyroidism** بيعمل **normochromic normocytic** anaemia، وجدول الـ MCV في صفحة 15 حاطه تحت **macrocytic**. لو السؤال عن جدول الـ MCV، الإجابة macrocytic؛ ولو عن علامة الحواجب، normocytic."
      - kind: try
        items: [hem.L02.019, hem.L02.023, hem.L02.028, hem.L02.030, hem.L02.034]
    recap:
      - "Iron = لحمة؛ folate = خضار وفاكهة؛ B12 = لحمة وألبان. الكحول بيبوّظ الـ folate."
      - "Gastrectomy ← iron و B12 بعد سنين. Solvents و hydrocarbons سامة للنخاع."
      - "أدوية: sulfa/trimethoprim/antiepileptics = folate؛ oxidants = haemolysis؛ NSAIDs = نزيف."
      - "Palmar crease pallor = Hb < 75 g/L؛ flow murmur و wide pulse pressure."
      - "Soft spleen: AIHA و PK def.؛ firm: myelofibrosis و Gaucher و HS و thalassaemia major."
      - "Koilonychia = iron؛ vitiligo و posterior-lateral cord = B12؛ leg ulcers = sickle."
    practice: [hem.L02.016, hem.L02.017, hem.L02.018, hem.L02.019, hem.L02.020, hem.L02.021, hem.L02.022, hem.L02.023, hem.L02.024, hem.L02.025, hem.L02.026, hem.L02.027, hem.L02.028, hem.L02.029, hem.L02.030, hem.L02.031, hem.L02.032, hem.L02.033, hem.L02.034, hem.L02.070]
