      - kind: explain
        page: 5
        title: "الحلقة المفرغة"
        quote: "Muscle: ↓ glucose uptake. Two deleterious changes occur:\n  Glucotoxicity: high BG levels further impair β cell function.\n  Lipotoxicity: high circulating FFAs impair β cell function and insulin action"
        text: |
          - ==Glucotoxicity==: السكر العالي نفسه بيبوّظ الـ β-cell أكتر.
          - ==Lipotoxicity==: الـ **free fatty acids (FFAs)** العالية بتبوّظ الـ β-cell **و** الـ insulin action.

          ولو الـ **insulin resistance** هي البداية: الـ β-cells تعوّض بـ **hyperinsulinemia**، لحد ما تتعب ومتقدرش تزوّد، فالـ secretion يقع والسكر يعلى.

          يعني ده **vicious circle**: السكر العالي والدهون العالية بيضربوا نفس الخلية اللي المفروض تنزّلهم. وعشان كده ضبط السكر بدري ممكن يريّح الـ β-cell ويرجّع جزء من شغلها. والـ FFAs جاية من الدهون لأن الـ insulin طبيعيًا بيقفل الـ **lipolysis**، فلما الدهون تبقى resistant الـ lipolysis يزيد (التفسير ده مقبول، مش في الكتاب).
      - kind: aside
        tone: joke
        page: 5
        quote: "If the insulin resistance is the primary defect, the pancreatic beta cells secrete more insulin to compensate for the peripheral defects of insulin action (hyperinsulinemia). This occurs, till the β cells can no longer secrete more insulin → ↓ insulin secretion (stage of hyperglycemia)"
        text: "الـ β-cell في type 2 زي الموظف الوحيد اللي بيشتغل في القسم: كل ما الباقيين (الـ tissues) يطنّشوا، يشتغل overtime (**hyperinsulinemia**)... لحد ما ياخد إجازة مرضي ومحدش يغطّي. وساعتها بس المدير يلاحظ إن في مشكلة (**hyperglycemia**)."
      - kind: reveal
        page: 4
        quote: "Liver: hepatic glucose production (HGP): the major contributor to fasting hyperglycemia."
        prompt: "ليه الكبد بالذات هو اللي بيعمل الـ fasting hyperglycemia، مش العضلات؟"
        answer: |
          وانت صايم مفيش أكل داخل، فالسكر اللي في الدم كله جاي من **hepatic glucose production**. الـ **insulin** طبيعيًا بيقفل الحنفية دي. لو الكبد **resistant**، الحنفية تفضل مفتوحة طول الليل.

          العضلات بتسحب السكر أساسًا **بعد الأكل**، فعيبها بيبان أكتر في سكر ما بعد الأكل. (تفسير فسيولوجي؛ المعلومة إن الـ HGP هو **the major contributor** من الكتاب.)
