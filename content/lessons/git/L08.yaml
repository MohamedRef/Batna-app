      - kind: explain
        page: 242
        title: "تشخيص وعلاج الـ SIBO"
        quote: "Following ingestion of glucose 75 g or lactulose 10 g, a rise in exhaled breath hydrogen or methane within 90 minutes"
        text: |
          **الأعراض** nonspecific: bloating، flatulence، pain، diarrhea، وأحيانًا steatorrhea. فكّر فيه لو فيه سبب زي **GI surgery قديمة**.

          - **Firm diagnosis:** aspirate و culture من الـ distal duodenum: **>10³ organisms/mL**، بس invasive.
          - **Breath test** (hydrogen أو methane): **glucose 75 g** أو **lactulose 10 g**، وارتفاع خلال ==90 minutes==. agreement مع الـ culture **65%**.
          - **Small bowel study** (CTE، MRE، barium) يدوّر على mechanical cause.
          - عمليًا الأفضل: **empiric antibiotic trial** (تشخيص وعلاج).

          **العلاج:** **7–10 days** broad-spectrum antibiotic (ciprofloxacin، norfloxacin، **rifaximin**، metronidazole) بيحسّن **لحد 90%** لأسابيع أو شهور، وعالج السبب.
      - kind: match
        page: 243
        quote: "Treatment: 2 months antibiotics with folic acid and vitamin B12 supplement."
        prompt: "وصّل كل مرض بعلاجه:"
        pairs:
          - ["SIBO", "Broad-spectrum antibiotic for 7–10 days"]
          - ["Tropical sprue", "2 months of antibiotics with folic acid and B12"]
          - ["Whipple disease", "IV ceftriaxone 2 weeks, then TMP-SMX 12 months"]
          - ["Celiac disease", "Lifelong gluten-free diet"]
          - ["Refractory celiac", "Budesonide or steroids, then azathioprine"]
        why: "المدة بتزيد مع عناد المرض: الـ SIBO أسبوع، الـ tropical sprue شهرين، والـ Whipple سنة لأن الـ recurrence عالي."
      - kind: explain
        page: 243
        title: "Tropical sprue و short bowel"
        quote: "The jejunum function can all be performed by ileum if intact but the reverse is not true."
        text: |
          **Tropical sprue:** **coliforms** بتكتر في الـ jejunum وتطلّع **enterotoxin** ← villous atrophy و malabsorption. العلاج: **antibiotics شهرين + folic acid + B12**.

          **Short bowel syndrome:** absolute أو relative، وبيعتمد على **الطول اللي راح**، و **المكان**، وحالة الباقي.
          - ==الـ ileum يقدر يعمل شغل الـ jejunum==، بس العكس **لأ**.
          - ضياع الـ **TI** ← **B12 deficiency** و **bile salt malabsorption** ← steatorrhea، و **calcium oxalate stones** لو الـ colon سليم.
          - **Congenital:** midgut volvulus، omphalocele، jejunoileal atresia، congenital short bowel.
          - **Acquired:** surgical resection، ischemia، radiation enteritis، Crohn enteritis.
      - kind: reveal
        page: 243
        quote: "Calcium oxalate stones occur if the colon is intact (How?)."
        prompt: "الكتاب سأل «How?»: ليه الـ oxalate stones بتحصل بس لو الـ colon سليم؟"
        answer: |
          الدهون اللي ما اتمصتش بتمسك الـ **calcium** في الـ lumen، فالـ **oxalate** يفضل حر. والـ oxalate الحر ده بيتمص من **الـ colon**.

          لو الـ colon مش موجود، مفيش مكان يتمص منه، فمفيش زيادة oxalate في البول. (نفس الآلية في L06 الـ Crohn.)
