          - { text: "Pulmonary fibrosis more common", bin: 1 }
        why: "الـ limited جلده بعيد عن الجذع وأعضاؤه أقل، وبيعمل isolated pulmonary hypertension. الـ diffuse بيمسك الجذع، والـ lung fibrosis والـ renal crisis أكتر فيه."
      - kind: reveal
        page: 346
        quote: "Skin thickening proximal to elbows and knees, involving the trunk."
        prompt: "ليه الـ diffuse بيمسك أعضاء أكتر من الـ limited، مع إن الفرق بينهم «مكان الجلد» بس؟"
        answer: |
          الكتاب بيربطهم مباشرة:
          - **Limited:** الجلد ==تحت الكوع والركبة==، مفيش trunk، و **less organ involvement**؛ بس ممكن **isolated pulmonary hypertension**.
          - **Diffuse:** الجلد **فوق** الكوع والركبة ويمسك الـ **trunk**، و **more likely organ involvement**: **pulmonary fibrosis** و **renal crisis** أكتر.

          التفسير المقبول (مش في الكتاب): مدى الجلد بيعكس قد إيه الـ fibrosis نشيط في الجسم كله. لو الـ fibroblasts شغالة لحد الجذع، غالبًا شغالة في الرئة والكلى كمان. علشان كده **rapidly progressive skin** في أول 2–3 سنين risk factor للـ renal crisis (الدرس الجاي). يعني الجلد «مقياس» تقدر تشوفه بعينك.
      - kind: mnemonic
        page: 347
        quote: "CREST Syndrome:\n  Calcinosis.\n  Raynaud's.\n  Esophageal Dysmotility.\n  Sclerodactyly.\n  Telangiectasisa."
        word: "CREST"
        parts:
          - { key: "C", text: "Calcinosis" }
          - { key: "R", text: "Raynaud phenomenon" }
          - { key: "E", text: "Esophageal dysmotility" }
          - { key: "S", text: "Sclerodactyly" }
          - { key: "T", text: "Telangiectasia" }
        hook: "الـ **crest** هو عُرف الديك: حاجة صغيرة فوق الراس. والـ CREST هو الـ limited: الجلد في الأطراف بس، مش الجسم كله. وسؤال الكتاب: **subcutaneous nodules** مش منه."
      - kind: check
        page: 347
        quote: "CREST Syndrome:\n  Calcinosis.\n  Raynaud‘s.\n  Esophageal Dysmotility.\n  Sclerodactyly.\n  Telangiectasisa."
        question: "CREST syndrome includes all of the following EXCEPT:"
        options: ["Subcutaneous nodules", "Esophageal dysmotility", "Telangiectasia", "Calcinosis"]
        answer: 0
        why:
          - "صح: الـ subcutaneous nodules مش من الخمسة (دي بتاعة الـ RA). الـ calcinosis هي الـ C."
          - "ده الـ E."
          - "ده الـ T."
          - "ده الـ C."
      - kind: explain
        page: 347
        title: "المفاصل والرئة"
        quote: "In > 50% with swelling, stiffness, and pain in the joints of the hands."
        text: |
          - **Constitutional:** mild fever
          - **Arthritis** في ==أكتر من 50%==: swelling وstiffness وألم في مفاصل الإيد
          - **Carpal tunnel syndrome**، **contractures** (من الجلد السميك)، و**polymyositis** (في mixed connective tissue disease (MCTD) أو overlap)
          - **الرئة = leading cause of death** دلوقتي، علشان بقينا نسيطر على الكلى. العرض: **exertional dyspnea**. النوعين: **interstitial lung disease** و**isolated pulmonary hypertension**.

          ليه الـ contractures؟ لأن الجلد السميك فوق المفصل بيشده ومايسيبوش يتفرد. والـ carpal tunnel من التورم والـ fibrosis حوالين الـ median nerve (التفسير المقبول، مش في الكتاب).
      - kind: reveal
        page: 347
        quote: "Leading cause of death:\n  Since we are better at control of renal disease."
        prompt: "زمان الكلى كانت أول سبب وفاة في الـ SSc. إيه اللي غيّر الترتيب؟"
        answer: |
          الـ **ACE inhibitors**. لما بقوا العلاج الأساسي للـ **scleroderma renal crisis**، الوفيات من الكلى قلّت، فالـ **lung disease** طلعت أول سبب.
      - kind: explain
        page: 348
        title: "الرئة: نوعين ومين بيجيله إيه"
        quote: "Types of lung Involvement:\n  Interstitial lung disease.\n  Isolated pulmonary hypertension."
        text: |
          العرض الأساسي: ==exertional dyspnea==.

          النوعين:
          - **Interstitial lung disease (ILD):** الـ fibrosis في نسيج الرئة نفسه. الكتاب بيقول إن الـ **pulmonary fibrosis** أشيع في الـ **diffuse**.
          - **Isolated pulmonary hypertension:** المشكلة في **الأوعية** مش في النسيج، والكتاب بيقول إنها ممكن تحصل في الـ **limited**.

          ليه التفرقة مهمة؟ لأن العلاج مختلف تمامًا (درس العلاج): الـ ILD التهاب و fibrosis ← **immunosuppressives**، والـ pulmonary hypertension مشكلة أوعية ← **vasodilators**. نفس العرض (نهجان مع المجهود)، سببين، وعلاجين.
      - kind: try
        items: [rheum.L21.013, rheum.L21.015, rheum.L21.017, rheum.L21.019, rheum.L21.021]
    recap:
      - "F:M 4:1، العقد الرابع والخامس، insidious؛ نادرًا visceral من غير جلد."
      - "Limited: تحت الكوع والركبة، perioral، CREST، isolated PH. Diffuse: فوقهم والـ trunk، fibrosis و renal crisis أكتر."
      - "CREST: calcinosis، Raynaud، esophageal dysmotility، sclerodactyly، telangiectasia."
      - "Arthritis > 50%، carpal tunnel، contractures، polymyositis (MCTD/overlap)."
      - "الرئة أول سبب وفاة (الكلى اتظبطت)؛ exertional dyspnea؛ ILD أو isolated PH."
