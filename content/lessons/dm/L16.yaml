  - id: dm.L16.lesson2
    title: "شربات الدوا عملت DKA"
    hook: "تلات أدوية برد عادية في طفل عنده T1DM، ويوم 3 جه الطوارئ في DKA. السكر كان متخبي في الشراب."
    minutes: 7
    pages: [200, 202]
    topics: [excipients]
    goals:
      - "تقرا Case 2 وتعرف ليه ده DKA"
      - "تعرف يعني إيه excipients وليه كل نوع موجود"
      - "تفتكر إن الـ sinusitis نفسها ممكن تكون ساعدت"
    status: unverified
    steps:
      - kind: explain
        page: 200
        title: "Case 2: طفل وبرد عادي"
        quote: "On the 3rd day of his treatment, the child was brought to a local hospital‘s emergency department with symptoms of nausea, vomiting, weak & rapid pulse, deep sighing breaths, drowsiness, and unsteady gait."
        text: |
          طفل 6 سنين عنده **T1DM** وماشي على إنسولين يومي. جاله برد: رشح وأنف مسدودة وسخونية خفيفة. الـ GP قال **acute sinusitis** وكتب تلات أدوية **شراب**: paracetamol و chlorpheniramine و amoxicillin/clavulanate.

          يوم 3 جه الطوارئ بـ nausea و vomiting ونبض ==ضعيف وسريع== و ==deep sighing breaths== ونعاس ومشية مش ثابتة. التفسير المقبول (مش في الكتاب) لكل علامة:
          - **Deep sighing breaths**: ده نَفَس الـ **Kussmaul**، الجسم بيطلّع CO2 عشان يعوّض الـ acid.
          - **نبض ضعيف وسريع**: dehydration من الـ osmotic diuresis والترجيع.
          - **النعاس والمشية**: المخ بيتأثر بالـ acidosis والجفاف.
      - kind: explain
        page: 200
        title: "التحاليل: ده DKA ولا سكر عالي بس؟"
        quote: "ABG: pH=7.12, base excess of 7 mmol/L, bicarbonate=12.6 mEq/L."
        text: |
          - **BG 440** mg/dL: عالي.
          - **pH 7.12** و **HCO3 12.6**: ==acidosis==.
          - **Ketones** موجودة في البول.

          سكر عالي + acidosis + كيتونات = DKA، وعشان كده دخل طوارئ واتعالج بـ fluids و insulin.

          - **WBC 15.2**: عالي. التفسير المقبول (مش في الكتاب): يا من العدوى، يا من الـ stress بتاع الـ DKA نفسها، فالرقم ده لوحده مش بيفرّق.
          - **Na 134**: واطي شوية. التفسير المقبول (مش في الكتاب): السكر العالي بيسحب مية من الخلايا للدم فبيخفّف الصوديوم.
      - kind: reveal
        page: 201
        quote: "High sugar base in all 3 formulations went unnoticed by the practitioner & the dispensing pharmacist."
        prompt: "طفل 6 سنين T1DM أخد paracetamol و chlorpheniramine و amoxicillin/clavulanate شراب للـ sinusitis. يوم 3: DKA. إيه السبب؟"
        answer: "الشربات التلاتة فيهم ==sucrose== كـ syrup base، حوالي ==90 g/day== سكر. لا الدكتور ولا الصيدلي خدوا بالهم. والـ **sinusitis** نفسها ممكن تكون ساعدت."
      - kind: explain
        page: 201
        title: "الـ 90 جرام جم منين؟"
        quote: "In the present case, 3 different medications to treat the symptoms of acute sinusitis – paracetamol, chlorpheniramine, & a combination of amoxicillin/clavulanate were given at a dose of 15 mg/kg per dose qid, 0.1 mg/kg per dose qid, & 22.5 mg/kg per dose bid, respectively."
        text: |
          - **Paracetamol**: 15 mg/kg، ==4 مرات== في اليوم.
          - **Chlorpheniramine**: 0.1 mg/kg، ==4 مرات==.
          - **Amoxicillin/clavulanate**: 22.5 mg/kg، مرتين.

          يعني 10 جرعات شراب في اليوم. الجرعة نفسها مش غلط، الغلط في ==اللي شايل الجرعة==. التفسير المقبول (مش في الكتاب): شربات الأطفال بتتحلّى بالسكر عشان الطفل يرضى ياخدها، وكل معلقة فيها سكر. اجمع 10 معالق في اليوم من تلات أدوية توصل لحوالي 90 g.
      - kind: aside
        tone: joke
        page: 201
        quote: "Total sucrose content (including relative sugars) of ~90 g/day in the form of syrup base."
        text: |
          90 جرام سكر في اليوم؟ ده تقريبًا ==كيس حلاوة كامل== متخبي في "ملعقة كل 8 ساعات". الدوا بيعالج البرد وبيعمل diabetic ketoacidosis (DKA) ببلاش.
      - kind: figure
        page: 201
        quote: "This led to the rise in BG level of the child & subsequent DKA state."
        title: "من الشراب للـ DKA"
        alt: "Three syrup bottles, paracetamol, chlorpheniramine and amoxicillin-clavulanate, feed into about 90 g of sucrose a day, which raises blood glucose to 440 and leads to DKA. A dashed arrow from acute sinusitis also points to DKA, labelled cannot be ruled out."
        caption: "السكر الأساسي جه من الشراب؛ والـ sinusitis خط منقّط لأن الكتاب مش قادر يستبعدها."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L16c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
