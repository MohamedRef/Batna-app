  - id: neph.L14.155
    kind: mcq
    topic: ttp
    stem: "A 32-year-old woman on oral contraceptives has confusion, platelets 12,000, schistocytes, MCV 84, INR 1.1, creatinine 1.3 mg/dL, no cancer or transplant: unexplained hemolytic anemia and thrombocytopenia. Which step is right?"
    options:
      - Start plasma exchange and corticosteroids now
      - Transfuse platelets before anything else
      - Wait for the ADAMTS13 result before treating
      - Give fresh frozen plasma infusion as definitive therapy
    answer: 0
    why:
      - "Correct: PLASMIC 7 (high); start PEX with steroids at once (p479-480)."
      - Platelets are contraindicated unless major bleeding.
      - TTP is an emergency; treat on suspicion.
      - Plasma infusion is only temporizing.
    src: { page: 480, quote: "Corticosteroids operate by decreasing the activity of the reticuloendothelial system as well as decreasing autoantibody production. This should be initiated as soon as possible in all patients with unexplained hemolytic anemia and thrombocytopenia with a normal coagulation profile." }
