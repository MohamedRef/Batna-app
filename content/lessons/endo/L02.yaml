      - kind: explain
        page: 27
        quote: "Treatment\n  The natural history of Grave's disease is altered during pregnancy *.\n  Antithyroid drugs are used in the smallest dose *.\n  Iodine should not be used as therapy for any length of time in pregnant women.\n  RAI is absolutely contraindicated.\n  Propranolol whether should be used in pregnant women or not it's a matter of debate*.\n  Grave's disease in the post partum period can be treated with antithyroid drugs *.\n  Frequent monitoring of the baby's serum TSH and thyroxin concentration is considered."
