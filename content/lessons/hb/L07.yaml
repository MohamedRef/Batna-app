            answer: 0
            why: "**> 9 kPa = severe fibrosis**، وهنا الرسمة (صفحة 119) بتقف؛ مفيهاش سهم treat. لو حد سألك هيتعالج؟ ده **استنتاج** من المعايير التلاتة في صفحة 118 (DNA، ALT، و **severity of liver disease**)، مش خانة في الرسمة."
      - kind: explain
