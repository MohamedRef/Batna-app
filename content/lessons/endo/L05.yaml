          **التشخيص**: histopathology (argyrophil، CgA، somatostatin)، و p-CgA و p-somatostatin (ومعاهم gastrin أو glucagon لو mixed)، والـ imaging: CT angiography، MRI، somatostatin receptor scintigraphy، **EUS للـ duodenal**، colonoscopy، و US للـ liver mets.
