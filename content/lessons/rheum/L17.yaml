  - id: rheum.L17.lesson2
    title: "الـ AS في العيادة: من الضهر للقلب"
    hook: "عيان بيقولك صدري بيوجعني زي الـ angina، والـ ECG سليم. اسأله عن ضهره."
    minutes: 8
    pages: [282, 285]
    topics: [clinical, extra, course]
    goals:
      - "توصف الأعراض والمفاصل اللي بتتصاب في الـ AS"
      - "تعدّ الـ extra-articular features بالأرقام"
      - "تعرف الـ prognosis والـ DISH والتحاليل"
    status: unverified
    steps:
      - kind: explain
        page: 283
        title: "الضهر والصدر"
        quote: "Intermittent bouts of back pain that may radiate down the thighs, stiffness that is often worse in early morning hours and after prolonged rest."
        text: |
          الوجع **insidious**، على نوبات، ممكن ينزل على الفخدين، والـ ==stiffness== أوحش الصبح وبعد الراحة الطويلة.

          مع الوقت: حركة الضهر تقل، الـ **lumbar curve يفطس**، والـ thoracic kyphosis يزيد.

          الـ **chest expansion** يقل علشان الـ costovertebral والـ costosternal joints، وده ممكن يعمل وجع صدر ==يقلّد الـ angina==.
      - kind: figure
        page: 283
        quote: "As the disease advances, back motion becomes limited, with flattening of the lumbar curve and exaggeration of the thoracic curvature."
        title: "الوقفة قبل وبعد"
        alt: "Two side-view spine outlines. Left, normal: a gentle S-curve with normal lumbar lordosis and thoracic kyphosis. Right, advanced AS: the lumbar curve is flat and the thoracic curve is exaggerated, the head pushed forward, with a stiff bamboo-like spine."
        caption: "على الشمال ضهر طبيعي بانحناءاته. على اليمين **AS متقدّم**: الـ lumbar ==اتفرد== والـ thoracic ==اتقوّس==، والراس لقدّام."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <text x="80" y="20" text-anchor="middle" class="t-b">Normal</text>
            <circle cx="90" cy="45" r="14" class="fg-box"/>
            <path d="M88 60 C 70 100, 70 120, 85 150 C 100 180, 100 200, 85 235" class="fg-ink" fill="none" stroke-width="8" stroke-linecap="round"/>
            <text x="20" y="125" class="t-sm t-mut">kyphosis</text>
            <text x="100" y="205" class="t-sm t-mut">lordosis</text>
            <text x="250" y="20" text-anchor="middle" class="t-b t-bad">Advanced AS</text>
            <circle cx="290" cy="70" r="14" class="fg-bad"/>
            <path d="M275 78 C 230 95, 215 130, 225 160 L 232 235" class="fg-ink" fill="none" stroke-width="8" stroke-linecap="round"/>
            <text x="210" y="125" text-anchor="end" class="t-sm t-bad">thoracic ↑</text>
            <text x="245" y="205" class="t-sm t-bad">lumbar flat</text>
          </svg>
      - kind: explain
        page: 283
        title: "المفاصل"
        quote: "Costosternal junctions. Manubriosternal joint. Symphysis pubis. Temporomandibular joint."
        text: |
          - **Axial**: الـ SIJs، الـ disc spaces، الـ apophyseal، الـ costovertebral
          - **Shoulder girdle**: glenohumeral، acromioclavicular، sternoclavicular
          - **Costosternal** و **manubriosternal** و **symphysis pubis** و TMJ
          - **Large proximal**: ==hips==، knees، shoulders
          - الـ small peripheral joints ==نادرًا==.
      - kind: check
        page: 283
        quote: "This can lead to anterior chest pain that mimics angina pectoris."
        question: "شاب عنده AS وبيشتكي من ألم في الصدر مع النفس العميق، والـ ECG والـ troponin سليمين. السبب؟"
        options: ["Costovertebral و costosternal involvement", "Pericarditis (الأشهر)", "Pulmonary embolism", "Aortic stenosis"]
        answer: 0
        why:
          - "صح: الـ costovertebral والـ costosternal بيقللوا الـ chest expansion ويعملوا ألم يقلّد الـ angina."
          - "الـ pericarditis نادر في الـ AS."
          - "مفيش حاجة هنا بتقول PE."
          - "الـ AS بيعمل AR مش AS (aortic stenosis)."
      - kind: table
        page: 284
        quote: "Aortitis of the ascending aorta and the resulting fibrosis can cause dilatation of the aortic ring and aortic valve incompetence (AR) in 5% of patients."
        title: "برّه المفاصل في الـ AS"
        columns: ["System", "Lesion", "Number"]
        rows:
          - ["Eye", "Uveitis", "Up to 25%"]
          - ["Lung", "Apical fibrobullous (mimics TB)", "Severe disease"]
          - ["Heart", "Aortitis → AR", "5%"]
          - ["Heart", "Conduction block (His, AV node)", "-"]
          - ["Kidney", "NSAIDs, IgA, amyloid", "-"]
          - ["Neck", "Anterior atlantoaxial subluxation", "2%"]
        hide: [[0, 2], [1, 1], [2, 2], [5, 2]]
      - kind: aside
        tone: exam
        page: 283
        quote: "fibrotic changes in the upper lung field with cavitation and fungal infection that mimic TB (Apical fibrobullous disease)."
        text: "قارن الرئتين: الـ **RA** = fibrosis في الـ **lower lobes**. الـ **AS** = ==apical== fibrobullous disease في الـ **upper** zone مع cavitation و fungal infection، يقلّد الـ TB."
      - kind: explain
        page: 284
        title: "الكلى والعضم والأعصاب"
        quote: "Unlike other CT diseases as SLE, glomerular function is usually unimpaired in AS."
        text: |
          **الكلى**: الـ glomeruli غالبًا ==سليمة== (مش زي الـ SLE). لو اتأثرت: **NSAIDs**، **IgA nephropathy**، أو **amyloidosis**.

          **العضم**: **osteoporosis** من قلّة الحركة، وكسر من خبطة بسيطة. والغريب إن الـ AS بيعمل **new bone** (syndesmophytes) و **bone resorption** مع بعض.

          **الأعصاب**: كسر، instability، أو التهاب الـ nerve roots (radicular، **cauda equina**)، و anterior atlantoaxial subluxation في ==2%==.
      - kind: mnemonic
        page: 284
        quote: "Side effects of NSAIDs. An IgA nephropathy. Amyloidosis."
        word: "NIA"
        parts:
          - { key: "N", text: "NSAIDs side effects" }
          - { key: "I", text: "IgA nephropathy" }
          - { key: "A", text: "Amyloidosis" }
        hook: "كلى الـ AS بتقول **NIA**: مش منه هو، دايمًا من حاجة جنبه."
      - kind: explain
        page: 285
        title: "الـ prognosis"
        quote: "In general the functional prognosis is good unless the hips are seriously involved."
        text: |
          - الكورس متغيّر، و remissions و relapses كتير.
          - أحيانًا الـ spine كله يلحم.
          - **أقل من 10%** بيعجزوا.
          - الـ prognosis كويس ==إلا لو الـ hips اتأثرت جامد==.
      - kind: explain
        page: 285
        title: "الـ DDx والتحاليل"
        quote: "is a proliferative form of osteoarthritis can mimic AS but lacks apophyseal and sacroiliac involvement."
        text: |
          **DDx**: أسباب تانية للـ low back pain، باقي الـ SpA، degenerative disease، **DISH** (Forestier)، وأسباب تانية للـ sacroiliitis.

          الـ ==DISH== = proliferative OA يقلّد الـ AS، بس ==مفيش sacroiliac ولا apophyseal==.

          **التحاليل**: HLA-B27 في 90-95%، ESR و CRP عاليين غالبًا، anaemia خفيفة في الحالات الشديدة، و **calprotectin** يطلّع اللي عندهم risk عالي للـ IBD.
      - kind: try
        items: [rheum.L17.029, rheum.L17.034, rheum.L17.036, rheum.L17.043, rheum.L17.046]
    recap:
      - "الوجع insidious، الصبح أوحش؛ الـ lumbar يفطس والـ thoracic يتقوّس."
      - "Chest expansion يقل (costovertebral، costosternal)؛ ممكن يقلّد angina."
      - "Large proximal joints (hips) أيوه؛ small peripheral نادر."
      - "Uveitis 25%، AR 5%، atlantoaxial 2%، apical fibrobullous."
      - "كلى: NIA (NSAIDs، IgA، amyloid). Osteoporosis + new bone مع بعض."
      - "أقل من 10% يعجزوا؛ الـ hips هي اللي بتحدد. DISH بيسيب الـ SI."
    practice: [rheum.L17.026, rheum.L17.027, rheum.L17.028, rheum.L17.029, rheum.L17.030, rheum.L17.031, rheum.L17.032, rheum.L17.033, rheum.L17.034, rheum.L17.035, rheum.L17.036, rheum.L17.037, rheum.L17.038, rheum.L17.039, rheum.L17.040, rheum.L17.041, rheum.L17.042, rheum.L17.043, rheum.L17.044, rheum.L17.045, rheum.L17.046, rheum.L17.047, rheum.L17.048, rheum.L17.049, rheum.L17.136]
