          </svg>
      - kind: explain
        page: 500
        title: "ليه الـ hematologic response هو المقياس؟"
        quote: "For nephrologists, understanding the concept and definitions of hematologic response are imperative in the management of patients with dysproteinemia-associated kidney disease because achieving hematologic response has been associated with overall survival and organ-specific response in patients with multiple myeloma and AL amyloidosis, as well as renal response in some of the MGRS disorders."
        text: |
          العلاج ==directed at the underlying clonal proliferative disorder==، والهدف إن الـ paraprotein في الدم والبول يقل أو يرجع طبيعي.

          ليه طبيب الكلى لازم يفهم الـ hematologic response؟ لأن الكتاب بيقول إنه مرتبط بـ ==overall survival== و ==organ-specific response== في الـ myeloma والـ AL amyloidosis، و **renal response** في بعض الـ MGRS. يعني رقم الـ light chains هو اللي بيقولك الكلية هتتحسن ولا لأ.

          بس كل مرض كلى ليه احتياجه:
          - **Amyloidosis:** غالبًا **nephrotic** فمحتاج **diuretics**.
          - **Cast nephropathy:** الـ diuretic **not necessary and is potentially contraindicated**. التفسير المقبول (مش في الكتاب): الـ loop diuretic بيزوّد الصوديوم في الـ distal tubule، وده بيساعد الـ light chain يلزق في الـ Tamm-Horsfall ويعمل casts أكتر، وكمان بينشّف المريض.
      - kind: check
        page: 500
        quote: "In addition, each kidney disease may require individual attention. For example, patients with immunoglobulin-related amyloidosis usually have nephrotic syndrome, which requires diuretic management, while diuretic is not necessary and is potentially contraindicated in light chain cast nephropathy."
        question: "A myeloma patient has AKI from light chain cast nephropathy and mild ankle edema. Furosemide?"
        options:
          - "Not needed and potentially contraindicated"
          - "Essential, as in AL amyloidosis"
          - "Give high-dose to flush the casts"
          - "Only with albumin"
        answer: 0
        why:
          - "صح: الكتاب بيقول مش لازم وممكن يكون contraindicated في الـ cast nephropathy."
          - "الـ AL amyloidosis هو اللي بيعمل nephrotic ومحتاج diuretics."
          - "مش مذكور، والـ diuretic ممكن يساعد الـ casts تترسب."
          - "مش مذكور."
      - kind: explain
        page: 501
        title: "العلاج: اضرب الـ clone"
        quote: "Treatment is no longer decided by the renal histology but rather, is decided by the nature of the clone producing the M protein."
        text: |
          - القرار بنوع الـ **clone**، مش بالـ histology.
          - الـ renin–angiotensin system (RAS) blockade والـ immunosuppression التقليدي **مش بيمنعوا end-stage renal disease (ESRD)**.
          - "==Bortezomib== أهم دوا: مع cyclophosphamide و dexamethasone، response **94%** و very good partial response (VGPR) **66-71%**."
          - "**VGPR**: difference between involved and uninvolved free light chains **<40 mg/L** أو نزول **>90%**."
          - **autologous stem cell transplantation** بيحسّن الـ response؛ thalidomide و lenalidomide أضعف.

          ليه الـ bortezomib؟ هتعرف السبب في الخطوة الجاية.
      - kind: explain
        page: 501
        title: "ليه مش RAS blockade ولا immunosuppression عادي؟"
        quote: "Traditional immunosuppressive drugs and renin-angiotensin system blockade are generally ineffective at preventing ESRD. Clone-directed therapy is the key. Thus, clonal identification is extremely important in choosing the right treatment."
        text: |
          - العلاج ==no longer decided by the renal histology== لكن ==by the nature of the clone==. ومش لازم يكون فيه malignancy عشان تبدأ.
          - الـ immunosuppression التقليدي والـ **RAS blockade** ==generally ineffective at preventing ESRD==. التفسير المقبول (مش في الكتاب): مش بيوقفوا المصنع، فالبروتين هيفضل نازل على الكلية.
          - ولذلك **clonal identification is extremely important**: plasma cell ولا B cell؟ ده اللي بيحدد الدوا.

          طب الـ biopsy لسه ليها لازمة؟ أيوه، الكتاب بيقول بتتنبأ بالـ **natural history** والـ **clinical features** والـ **recurrence بعد الزرع**. ومتنساش الـ **extrarenal** في الـ AL amyloidosis والـ MIDD: لو القلب متأثر جامد، الـ chemotherapy بتتعدّل والسوايل بتتظبط بحذر.

          والـ **complete response** = recurrence أقل بعد زرع الكلية.
      - kind: explain
        page: 502
        title: "Bortezomib، والباقي"
        quote: "Bortezomib seems to be the most effective agent in monoclonal Ig deposition disease."
        text: |
          - **Bortezomib** هو ==the most effective agent in monoclonal Ig deposition disease==، وفيه proteasome inhibitors تانية بس هو ==the most robust data==.
          - **Thalidomide و lenalidomide** (immunomodulatory) ==less effective in achieving VGPR or better==.
          - **autologous stem cell transplant** بيحسّن الـ hematologic response.

          التفسير المقبول (مش في الكتاب): الـ plasma cell مصنع بروتين ضخم، والـ proteasome هو اللي بيتخلص من البروتين الغلط جواها. فلما تقفله بالـ bortezomib، الخلية بتتخنق ببروتينها وتموت. وده اللي بيخلّيه قوي بالذات على الـ clones اللي بتطلّع light chains كتير.

          ليه الـ stem cell transplant؟ التفسير المقبول (مش في الكتاب): بيسمح بجرعة chemotherapy عالية جدًا تقضي على الـ clone، وبعدين الخلايا الجذعية بتاعة المريض نفسه ترجّع النخاع.
