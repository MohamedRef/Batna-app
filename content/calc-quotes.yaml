    quote: |-
      Atlanta Revised criteria 2012
      | Grade of severity | Criteria |
      |---|---|
      | Mild | No organ failure; No local or systemic complications |
      | Moderately severe | Organ failure that resolves within 48 h (transient organ failure) and/or Local or systemic complications without persistent organ failure |
      | Severe | Persistent organ failure (> 48 h): Single organ failure, Multiple organ failure |
      Mild = interstitial AP, moderately severe and severe = necrotizing AP.
      Organ failure is defined as any of the followings:
        1. Shock (SBP < 90 mm Hg/mean < 70 mmHg).
        2. Pulmonary insufficiency (PaO2 < 60 mm Hg or need for ventilation),
        3. Renal failure (cr > 2 mg / dl after rehydration or need for dialysis)
        4. GIT bleeding ( > 500 ml of blood loss/ 24 h)
        5. Tachycardia > 90 BPM
