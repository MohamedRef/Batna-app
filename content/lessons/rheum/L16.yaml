  - id: rheum.L16.lesson7
    title: "الـ anti-TNF: خمسة على هدف واحد"
    hook: "الـ TNF هو الراس اللي بتشغّل الهدم. خمس أدوية بتقطعه، واسم كل واحد بيقولك هو معمول من إيه."
    minutes: 9
    pages: [266, 269]
    topics: [anti-tnf]
    goals:
      - "تعرف تركيب كل anti-TNF من اسمه وليه الـ infliximab محتاج MTX"
      - "تحفظ جرعات الـ anti-TNF"
      - "تحفظ الأعراض الجانبية وإزاي تعمل TB screening وليه"
    status: unverified
    steps:
      - kind: figure
