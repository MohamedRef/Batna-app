  - id: res.L13.lesson10
    title: "تكتب مرجع مقالة بالـ Vancouver"
    hook: "اسم المجلة مختصر من غير نقط، والتاريخ والـ volume والصفحات في سطر واحد."
    minutes: 6
    pages: [91, 101]
    topics: [book-article]
    goals:
      - "ترتّب الـ 6 عناصر في مرجع المقالة"
      - "تكتب اسم الـ journal بالـ Medline abbreviation"
      - "تقرا التاريخ والـ volume والـ issue والصفحات"
    status: unverified
    steps:
      - kind: explain
        page: 91
        quote: "Citing a \"Journal article\"\n1. Name/s of author/s of the article\n2. Title of article\n3. Title of journal (ABBREVATIED)\n4. Year (and month/day if necessary/available) of publication.\n5. Volume number (and issue/part -).\n6. Page numbers"
        title: "مرجع المقالة: 6 عناصر"
        text: |
          1. المؤلفين (نفس قواعد الكتاب).
          2. عنوان المقالة (نفس قواعد العنوان).
          3. اسم الجورنال ==مختصر== على طريقة Medline، **من غير أي نقط**: J Mol Biol (مش J. Mol. Biol.).
          4. السنة (والشهر 3 حروف واليوم لو موجودين).
          5. الـ volume (والـ issue بين أقواس).
          6. الصفحات.
      - kind: explain
        page: 94
        quote: "Citing a \"Journal article\"\n3. Title of journal (ABBREVATIED).\nAbbreviate title according to the style used in Medline. A list of abbreviations can be found at:\nhttp://www.ncbi.nlm.nih.gov/entrez/query.fcgi?db=journals\nNote: NO PUNCTATIONS MARKS are used in the abbreviated journal name – just spaces.\nFormat: journal title abbreviation (1 space)\nExample 3.1: J Acad Nutr Diet\nExample 3.2: J Nutr Environ Med"
        title: "اسم الـ journal مختصر"
        text: |
          اسم الـ journal ==بيتختصر== على طريقة ==Medline==، وتلاقي الاختصار في list الـ journals اللي السلايد بتشاور عليها.

          - ==من غير أي punctuation marks==، مسافات بس.
          - أمثلة: J Acad Nutr Diet، J Nutr Environ Med.

          ليه من غير نقط؟ ده شكل Medline نفسه، فكل المراجع تبقى بنفس الشكل والبحث عنها أسهل. التفسير المقبول (مش في الكتاب).
      - kind: check
        page: 96
        quote: "1: Journal of molecular biology\npISSN: 0022-2836\neISSN: 1089-8638\nTitle Abbreviation: J Mol Biol\nISO Abbreviation: J. Mol. Biol.\nNLM ID: 2985088R"
        question: "Which journal abbreviation is correct in Vancouver style?"
        options:
          - "J Mol Biol"
          - "J. Mol. Biol."
          - "Journal of Mol. Biology"
          - "J Molec Biology"
        answer: 0
        why:
          - "صح: اختصار Medline من غير نقط، مسافات بس."
          - "ده الاختصار بالنقط؛ Vancouver من غير punctuation."
          - "لا الاسم الكامل ولا اختصار Medline."
          - "اختصار متألف؛ استخدم اللي في الـ list."
      - kind: explain
        page: 97
        quote: "Citing a \"Journal article\"\n4. Year (and month/day if necessary/available) of publication.\nAbbreviate the month to the first 3 letters.\nFormat: year (1 space) month (1space) day (semi-colon, no space) OR year (semi-colon, no space)\nExample 4.1: 1996 Jun 1;12(5):127-33."
        title: "السنة والشهر واليوم"
        text: |
          الشكل: ==year== مسافة ==month== مسافة ==day== ثم semicolon من غير مسافة، أو السنة بس وبعدها semicolon.

          - الشهر أول 3 حروف.
          - مثال: 1996 Jun 1;12(5):127-33.

          ليه 3 حروف؟ شكل ثابت وقصير لكل الشهور، فمفيش لخبطة بين لغات أو طرق كتابة. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 98
        quote: "Citing a \"Journal article\"\n5. Volume number (and issue/part -).\n*If the journal has continuous page numbering through volume's issues, the month/day and issue information may be omitted.\nFormat: volume number (no space) issue number in brackets (colon, no space) OR volume number (colon, no space)\nExample 5.1: 1996;12(5):127-33. or 1996;12:127-33."
        title: "إمتى تشيل الـ issue؟"
        text: |
          لو الجورنال **بيرقّم الصفحات على طول** في الـ volume كله، ممكن تشيل الشهر واليوم والـ issue: 1996;12:127-33.

          وتاريخ النشر ممكن يكون يوم وشهر وسنة، شهر وسنة، **موسم** وسنة (Autumn 2001)، أو سنة بس. ولو مافيش مؤلف ابدأ بالعنوان: «Coffee drinking and cancer of the pancreas [editorial]. BMJ 1981;283:628.»
      - kind: explain
        page: 100
        quote: "Citing a \"Journal article\"\nExamples of Citing Journals:\nNOTE SOME JOURNALS MAY HAVE:\nA day, month and year\nA month and year\nA season and year eg. Autumn 2001\nOnly a year\nRussell FD, Coppell AL, Davenport AP. In vitro enzymatic processing of radiolabelled big ET-1 in human kidney as a food ingredient. Biochem Pharmacol 1998 Mar 1;55(5):697-701."
        title: "تاريخ النشر ممكن يبقى إيه؟"
        text: |
          بعض الـ journals بيبقى عندها:

          - ==يوم وشهر وسنة==
          - ==شهر وسنة==
          - ==فصل وسنة== (زي Autumn 2001)
          - السنة بس

          ليه نعرف ده؟ علشان تكتب التاريخ زي ما الـ journal كاتباه بالظبط، من غير ما تخترع يوم أو شهر مش موجود. التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 101
        quote: "Citing a \"Journal article\"\nAUTHORS Russell FD, Coppell AL, Davenport AP.\nTITLE OF ARTICLE In vitro enzymatic processing of radiolabelled big ET-1 in human kidney as a food ingredient.\nTITLE OF JOURNAL Biochem Pharmacol\nPUBLICATION YR/MO/DAY 1998 Mar 1;\nVOLUME/ISSUE NO. 55(5):\nPAGE NO.S 697-701."
        title: "اقرا مرجع مقالة"
        alt: "The tail of a journal reference, Biochem Pharmacol 1998 Mar 1;55(5):697-701., with labels pointing to its parts: journal abbreviation, year month day, then a semicolon, volume 55, issue 5 in brackets, a colon, and pages 697-701 ending with a full stop."
        caption: "**1998 Mar 1** = السنة والشهر واليوم، بعدها **;** من غير مسافة، **55** = volume، **(5)** = issue، بعدها **:** والصفحات **697-701.**"
        svg: |
          <svg viewBox="0 0 330 150" xmlns="http://www.w3.org/2000/svg">
