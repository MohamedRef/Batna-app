  - id: git.L10.lesson7
    title: "أسباب الـ dysphagia: فوق ولا تحت؟ حركة ولا سدّة؟"
    hook: "سؤالين بس بيرتّبوا كل أسباب الـ dysphagia في الكتاب، وكل سبب ليه منطق."
    minutes: 7
    pages: [271, 272]
    topics: [classification]
    goals:
      - "تفرّق الـ primary من الـ nonspecific من الـ secondary motility disorders"
      - "تقسّم أسباب الـ dysphagia زي ما المحاضرة بتقسمها"
      - "تعرف ليه كل سبب في مكانه"
    status: unverified
    steps:
      - kind: explain
        page: 271
        title: "الطيف كله: primary، nonspecific، secondary"
        quote: "Secondary motility disorders: esophageal motility disorders may occur as manifestations of systemic diseases."
        text: |
          الكتاب بيقول الـ esophageal motility disorders طيف:
          - **Primary** (primary esophageal motility disorders): المرض في المريء نفسه، زي الـ achalasia.
          - **Nonspecific**: لخبطة بسيطة ممكن تلعب دور غير مباشر في الـ reflux، وغير كده ==asymptomatic==.
          - **Secondary**: المريء ضحية لمرض عام (systemic disease).

          ليه التقسيم ده يفرق معاك؟ لأن الـ secondary علاجه علاج المرض الأصلي (scleroderma مثلًا)، والـ nonspecific غالبًا مش هو سبب الأعراض، فما تتسرعش تعالجه.
      - kind: figure
        page: 271
        title: "شجرة الـ dysphagia"
        quote: "Neuromuscular disorders: as; ALS (amyotrophic Lateral Sclerosis), CNS tumors (benign or malignant), Multiple sclerosis, Muscular dystrophy, Myasthenia gravis, Parkinson disease, Polymyositis or dermatomyositis, Stroke."
        alt: "Tree. Dysphagia splits into oropharyngeal and esophageal. Oropharyngeal splits into neuromuscular (stroke, Parkinson, myasthenia) and structural (Zenker, web, osteophytes). Esophageal splits into neuromuscular motility, primary (achalasia, DES) or secondary (scleroderma, Chagas), and structural, intrinsic (Schatzki ring, EoE, stricture, carcinoma) or extrinsic (mediastinal mass, vascular compression)."
        caption: "أول سؤال: **فوق ولا تحت؟** وتاني سؤال: **أعصاب وعضل ولا سدّة؟** والسدّة يا من ==جوه== (intrinsic) يا من برّه (extrinsic)."
