  - id: geri.L13.lesson3
    title: "سلّم الألم"
    hook: "الألم أكتر عرض في الأمراض المتقدمة. والكتاب مدّيك سلّم من 3 درجات، كل درجة ليها دواء وسرعة titration."
    minutes: 7
    pages: [224, 225]
    topics: [pain]
    goals:
      - "تعرف مبادئ الـ symptom management"
      - "تطلع وتنزل على الـ WHO ladder بالأرقام"
      - "تعرف إمتى تبدأ long-acting opioid والـ adjuvants"
    status: unverified
    steps:
      - kind: explain
        page: 224
        quote: "Effective symptom management requires the evaluation and treatment of underlying etiologies, when possible; therapies specifically targeted at symptoms"
        title: "قاعدة أي عرض"
        text: |
          1. دوّر على **السبب** وعالجه لو ينفع.
          2. علاج ==targeted== على العرض نفسه.
          3. **Reassess** كتير بعد ما تبدأ.

          و ==pain== هو **أكتر عرض** في الأمراض المتقدمة.
      - kind: explain
        page: 224
        quote: "routine and standardized assessment, appropriate analgesic prescribing and use of non- pharmacologic modalities; and expert management of opioid-related side effects."
        title: "تلات مفاتيح للألم"
        text: |
          - **Routine standardized assessment**: الشدة، المكان، الطبيعة، اللي بيزوّده واللي بيريّحه، بـ validated instrument.
          - **Analgesic prescribing** صح + ==nonpharmacologic== modalities.
          - إدارة ==opioid side effects== بخبرة.

          والأدوية تتاخد **standing** (بمواعيد ثابتة)، مع **rescue doses** للـ breakthrough pain.
      - kind: figure
        page: 224
        quote: "patients rate their pain as mild (1-4 on a 10-point scale), moderate (5-6), or severe (7-10)"
        title: "الـ WHO ladder"
        alt: "Three rising steps. Step 1, mild pain 1 to 4: acetaminophen, or an NSAID only with normal kidneys and low GI risk. Step 2, moderate pain 5 to 6: short-acting standing morphine or oxycodone, titrate by 25 to 50 percent every several days. Step 3, severe pain 7 to 10: short-acting opioid, consider parenteral, titrate by 50 to 100 percent every 30 to 60 minutes. An arrow says: not controlled, go up a step."
        caption: "مش متحكم فيه؟ اطلع درجة. وكل درجة titration أسرع من اللي قبلها."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="GL13a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="8" y="228" width="314" height="90" rx="8" class="fg-good"/>
            <text x="18" y="250" class="t-sm t-b">Mild 1-4</text>
            <text x="18" y="270" class="t-sm">Acetaminophen</text>
            <text x="18" y="288" class="t-sm">NSAID only: normal kidneys,</text>
            <text x="18" y="306" class="t-sm">low GI risk</text>
            <rect x="60" y="124" width="262" height="96" rx="8" class="fg-acc"/>
            <text x="70" y="146" class="t-sm t-b">Moderate 5-6</text>
            <text x="70" y="166" class="t-sm">Standing morphine/oxycodone</text>
            <text x="70" y="186" class="t-sm">+25-50% every several days</text>
            <rect x="112" y="16" width="210" height="100" rx="8" class="fg-bad"/>
            <text x="122" y="38" class="t-sm t-b">Severe 7-10</text>
            <text x="122" y="58" class="t-sm">Short-acting opioid,</text>
            <text x="122" y="76" class="t-sm">consider parenteral</text>
            <text x="122" y="96" class="t-sm">+50-100% every 30-60 min</text>
            <path d="M30 220V140" class="fg-arrow" marker-end="url(#GL13a)"/>
            <path d="M80 116V40" class="fg-arrow" marker-end="url(#GL13a)"/>
            <text x="8" y="130" class="t-sm t-mut">up</text>
            <text x="58" y="30" class="t-sm t-mut">up</text>
          </svg>
      - kind: aside
        tone: trap
        page: 224
        quote: "Begin acetaminophen or a nonsteroidal anti-inflammatory agent in select patients (those with normal renal function and minimal risk of gastrointestinal toxicity)."
        text: "الـ NSAID في الكبير مش دواء أول خط لأي حد. ==select patients== بس: **كلى سليمة** و **GI risk قليل**. واحد eGFR بتاعه 28 وعنده GI bleed قديم؟ acetaminophen."
      - kind: explain
        page: 224
        quote: "Do not exceed 3 or 2 g/d for those with hepatic dysfunction."
        title: "سقف الـ acetaminophen"
        text: |
          - ماتعديش ==3 g/day==.
          - ولو فيه **hepatic dysfunction**: ==2 g/day==.
          - لو مانفعش: ابدأ **opioid**.
      - kind: check
        page: 225
        quote: "Begin a short-acting standing opioid (morphine or oxycodone) and titrate every several days by 25%-50% of the current dose"
        question: "Pain 6/10 despite regular acetaminophen. Next step?"
        options: ["Short-acting standing morphine or oxycodone", "Transdermal fentanyl", "IV morphine every 30 min", "Double the acetaminophen to 6 g/day"]
        answer: 0
        why:
          - "صح: 5-6 = moderate، short-acting standing opioid."
          - "الـ long-acting بعد ما الألم يتظبط بس."
          - "الـ parenteral بسرعة دي للـ severe."
          - "السقف 3 g/day."
      - kind: table
        page: 225
        quote: "titrate by 50%-100% of the dose every 30-60 min until pain is controlled."
        title: "سرعة الـ titration"
        columns: ["Pain", "Start", "Titrate"]
        rows:
          - ["Moderate 5-6", "Short-acting standing morphine or oxycodone", "25-50% every several days"]
          - ["Severe 7-10", "Short-acting standing opioid; consider parenteral", "50-100% every 30-60 min"]
        hide: [[0, 2], [1, 2]]
      - kind: explain
        page: 225
        quote: "Long-acting opioids (sustained release morphine/oxycodone and transdermal fentanyl) should typically be started only after pain is well controlled"
        title: "الـ long-acting إمتى؟"
        text: |
          الـ ==sustained-release== morphine أو oxycodone والـ **transdermal fentanyl**: **بعد** ما الألم يتظبط ويوصل لـ steady state، مش في الأول.

          ليه؟ صعب تعمل titration سريع بدوا بطيء.
      - kind: mnemonic
        page: 225
        quote: "Adjuvant agents (corticosteroids, anticonvulsants, tricyclic antidepressants, and bisphosphonates)"
        word: "CATB"
        parts:
          - { key: "C", text: "Corticosteroids" }
          - { key: "A", text: "Anticonvulsants" }
          - { key: "T", text: "Tricyclic antidepressants" }
          - { key: "B", text: "Bisphosphonates" }
        hook: |
          **CAT-B**: قطة اسمها B بتساعد الـ opioid. الـ **B** (bisphosphonates) افتكرها مع ألم العضم من الـ metastases.
      - kind: case
        page: 225
        quote: "Begin a short-acting standing opioid (morphine or oxycodone) and titrate every several days by 25%-50% of the current dose"
        stem: "An 84-year-old woman with breast cancer metastatic to bone has pain 6/10 on regular acetaminophen."
        steps:
          - question: "Where is she on the ladder?"
            options: ["Moderate", "Mild", "Severe", "Not on the ladder"]
            answer: 0
            why: "5-6 = moderate."
          - question: "Plan?"
            options: ["Standing short-acting morphine, titrate 25-50% every several days", "Transdermal fentanyl now", "IV morphine every 30 min", "Ibuprofen"]
            answer: 0
            why: "Moderate = short-acting standing opioid وtitration بطيء. الـ fentanyl بعد التحكم."
          - question: "Which adjuvant fits bone pain?"
            options: ["A bisphosphonate or corticosteroid", "A benzodiazepine", "Megestrol", "Methylphenidate"]
            answer: 0
            why: "الـ bisphosphonates والـ corticosteroids من الـ adjuvants، وبيفيدوا ألم العضم."
      - kind: try
        items: [geri.L13.020, geri.L13.023, geri.L13.025, geri.L13.028, geri.L13.064]
    recap:
      - "أي عرض: السبب، علاج targeted، reassess. والألم أكتر عرض."
      - "Standing doses + rescue للـ breakthrough."
      - "Mild 1-4: acetaminophen (سقف 3، أو 2 مع الكبد)، NSAID لكلى سليمة و GI risk قليل."
      - "Moderate 5-6: short-acting standing، +25-50% كل كام يوم."
      - "Severe 7-10: فكّر parenteral، +50-100% كل 30-60 دقيقة."
      - "Long-acting بعد التحكم بس. Adjuvants: CATB."
    practice: [geri.L13.017, geri.L13.018, geri.L13.019, geri.L13.020, geri.L13.021, geri.L13.022, geri.L13.023, geri.L13.024, geri.L13.025, geri.L13.026, geri.L13.027, geri.L13.028, geri.L13.029, geri.L13.063, geri.L13.064, geri.L13.065, geri.L13.066, geri.L13.075]
  # ------------------------------------------------------------------
  - id: geri.L13.lesson4
    title: "شهية، قلق، إمساك، واكتئاب"
    hook: "مريض على morphine ومش بيدخل الحمام من 5 أيام ومش بيقول. ده مش تفصيلة؛ ده ممكن يبقى perforation."
    minutes: 7
    pages: [225, 227]
    topics: [symptoms]
    goals:
      - "تتعامل مع الـ anorexia والـ anxiety"
      - "تكتب bowel regimen صح لأي مريض على opioid"
      - "تشخّص الاكتئاب في المرض المتقدم وتختار الدوا حسب الـ life expectancy"
    status: unverified
    steps:
      - kind: explain
        page: 225
        quote: "often families, more than patients, are bothered by anorexia."
        title: "Anorexia/cachexia"
        text: |
          قبل ما تعالج، اسأل سؤالين:
          1. هي من **المرض** ولا من عرض تاني (nausea، constipation)؟
          2. المريض نفسه **متضايق**؟ ساعات ==العيلة== هي اللي متضايقة أكتر.

          الأدوية اللي حسّنت الشهية والـ QoL: **corticosteroids**، **megestrol acetate**، **cannabinoids**.
      - kind: explain
        page: 225
        quote: "Dexamethasone is advantageous in that it allows once-a-day dosing, has minimal mineralocorticoid properties, and may improve mood and energy."
        title: "Dexamethasone ولا megestrol؟"
        text: |
          - ==Dexamethasone==: مرة في اليوم، mineralocorticoid effect قليل، وممكن يحسّن المزاج والطاقة.
          - **Megestrol**: الأكثر فعالية وأقل أعراض في RCTs على ==الأصغر سنًا==، **مش الكبار**.
      - kind: explain
        page: 226
        quote: "Supportive counseling and cautious use of benzodiazepines because of increased risk of delirium in older adults."
        title: "Anxiety"
        text: |
          اسأل عن: قلق زيادة، restlessness، agitation، insomnia، hyperventilation، tachycardia.

          العلاج:
          - **Supportive counseling**.
          - Benzodiazepines ==بحذر==: بتزوّد خطر الـ **delirium** في الكبار.
          - **SSRI** لو الـ life expectancy أكتر من **شهرين**.
      - kind: explain
        page: 226
        quote: "With few exceptions, all patients on opioid therapy need an individualized bowel regimen."
        title: "الإمساك"
        text: |
          لازم تسأل عليه **روتيني** في أي حد على opioid: المرضى ==underreport==، والـ **fecal impaction** والـ **perforation** ممكن يحصلوا بسرعة.

          - تقريبًا **كل** مريض على opioid محتاج bowel regimen، **طول** مدة العلاج.
          - أغلبهم: ==stool softener + stimulant==.
          - الـ softener **لوحده مش بيشتغل**.
      - kind: sort
        page: 226
        quote: "Stimulant laxatives: prune juice, senna, and bisacodyl."
        prompt: "حط كل ملين في نوعه:"
        bins: ["Softener", "Stimulant", "Osmotic"]
        cards:
          - { text: "Docusate sodium", bin: 0 }
          - { text: "Calcium docusate", bin: 0 }
          - { text: "Senna", bin: 1 }
          - { text: "Bisacodyl", bin: 1 }
          - { text: "Prune juice", bin: 1 }
          - { text: "Milk of magnesia", bin: 2 }
          - { text: "Magnesium citrate", bin: 2 }
          - { text: "Propylene glycol", bin: 2 }
        why: "الـ prune juice stimulant مش osmotic في الكتاب. والإمساك الشديد: large-volume tap water enemas."
      - kind: aside
        tone: trap
        page: 226
        quote: "Most patients respond to a stool softener plus a stimulant."
        text: "فخ: «docusate لوحده» إجابة غلط دايمًا. الـ softener ==never alone==، لازم معاه stimulant."
      - kind: explain
        page: 227
        quote: "Are the symptoms acute with episodes of inattention? Is there disorganized thinking or an altered level of consciousness?"
        title: "Delirium"
        text: |
          سؤالين screening:
          1. الأعراض **acute** ومعاها نوبات ==inattention==؟
          2. فيه **disorganized thinking** أو تغيّر في مستوى الوعي؟
      - kind: explain
        page: 227
        quote: "Somatic symptoms are not reliable indicators of depression in this population of patients."
        title: "الاكتئاب"
        text: |
          الأعراض الجسدية (وزن، تعب، نوم) ==مش reliable==، المرض نفسه بيعملها.

          الـ reliable: **helplessness**، **hopelessness**، low self-esteem، **worthlessness**، dysphoria مستمرة، و suicidal ideas.

          الـ suicidal ideation: اسأل عليها **صراحة** واستكشف السبب؛ غالبًا علامة **distress شديد**. واكتئاب شديد = psychiatry.
      - kind: table
        page: 227
        quote: "provide rapid treatment of symptoms (within days) with minimal side effects."
        title: "اختار الدوا حسب الوقت اللي فاضل"
        columns: ["Drug", "Onset", "Note"]
        rows:
          - ["Psychostimulants (methylphenidate)", "Within days", "More energy, less fatigue"]
          - ["SSRIs", "3-4 weeks", "Highly effective"]
          - ["Tricyclics", "-", "Sedation, dry mouth, orthostasis: relative contraindication"]
        hide: [[0, 1], [1, 1]]
      - kind: check
        page: 227
        quote: "methylphenidate and dextroamphetamine) provide rapid treatment of symptoms (within days) with minimal side effects."
        question: "Depressed patient with about 3 weeks to live. Best drug?"
        options: ["Methylphenidate", "Sertraline", "Amitriptyline", "No drug works in time"]
        answer: 0
        why:
