      - kind: explain
        page: 201
        quote: "It is well known that most medicines contain both pharmacologically active & inactive ingredients. Therapeutically inactive ingredients of a medicine are known as excipients."
        title: "الـ excipients: مش دايمًا بريئة"
        text: |
          - الـ **excipients** هي المكونات ==therapeutically inactive== في الدوا: binders، fillers، preservatives، و ==sweeteners==.
          - دورها إنها تحوّل المادة الفعالة لـ "elegant pharmaceutical product": حباية تتمسك، شراب يتشرب، دوا يعيش على الرف.
          - المفروض إنها آمنة، بس الكتاب بيقول ==مش صح دايمًا== ومحتاجة ملاحظة.

          يعني الدوا الواحد فيه حاجتين: اللي بيعالج، واللي بيشيل العلاج. ومريض السكر ممكن يتأذي من التاني.
      - kind: match
        page: 201
        quote: "The excipients are divided into various functional classifications, depending on the purpose of use, such as binders, diluents, disintegrants, lubricants, wetting agents, solvents, fillers, emulsifiers, absorption enhancers, sustained release matrices, preservatives, sweeteners, & stabilizing, coloring, or flavoring agents."
        prompt: "وصّل كل excipient بشغلته (الشغلة: التفسير المقبول، مش في الكتاب)"
        pairs:
          - ["Binder", "يمسك مكونات الحباية في بعض"]
          - ["Disintegrant", "يفكّك الحباية في المعدة"]
          - ["Preservative", "يمنع الميكروبات في الشراب"]
          - ["Sweetener", "يخلّي الطفل يرضى يشرب"]
          - ["Sustained release matrix", "يطلّع الدوا بالراحة على ساعات"]
        why: "الكتاب بيدّيك الأسماء والتصنيف حسب الـ purpose؛ الاسم نفسه بيقولك الشغلة. واللي يهم مريض السكر في القايمة هو الـ **sweetener**."
      - kind: explain
        page: 202
        title: "الدرس للعيادة"
        quote: "It becomes crucial while dealing with a patient/guardian to collect a proper patient history for choosing the appropriate drug along with its therapeutic ingredient & pharmaceutical excipient."
        text: |
          الكتاب بيطلع بنقطتين:

          - خد ==history كويس== من المريض أو أهله، واختار الدوا بـ **مادته الفعالة** و **الـ excipient** بتاعه مع بعض.
          - راجع ==شكل الدوا== (dosage formulation) ومكوناته؛ ده جزء من إن العلاج يجيب نتيجة.

          ليه؟ عشان في Case 2 الدكتور والصيدلي بصّوا على الـ active ingredient بس، والسكر عدّى من وراهم.
      - kind: check
        page: 202
        quote: "Although this case highlights the significance of pharmaceutical excipients in therapeutic outcomes, the possibility of involvement of the current underlying disease state (acute infective sinusitis) as a precipitating factor for DKA cannot be ruled out."
        question: "What does the book say about the sinusitis in Case 2?"
        options:
          - "It may also have precipitated the DKA; it cannot be ruled out"
          - "It was the proven sole cause of the DKA"
          - "It played no role; the syrups alone explain everything"
          - "It was misdiagnosed and was really meningitis"
        answer: 0
        why:
          - "صح: الكتاب بيقول الـ excipients مهمة، بس الـ acute infective sinusitis ممكن تكون ساعدت ومش ممكن نستبعدها."
          - "الكتاب ركّز على الشراب، ومقالش إن العدوى لوحدها السبب."
          - "الكتاب صريح إن العدوى مش ممكن تتشال من الحساب."
          - "مفيش أي كلام عن meningitis."
      - kind: aside
        tone: exam
        page: 202
        quote: "Evaluation of medication dosage formulation for its key ingredients is an essential component for improving the efficacy of pharmacologic agents and, hence, achieving therapeutic outcomes in a given clinical condition"
        text: |
          سؤال "What is the cause of DKA in this patient?" جوابه في الكتاب: ==sugar-containing syrup excipients== (~90 g sucrose/day)، والعدوى ممكن تكون عامل مساعد. التفسير المقبول (مش في الكتاب) في الممارسة: لما تكتب لطفل عنده سكر، اسأل عن ==sugar-free== formulation أو حباية لو يقدر يبلعها.
