  - id: res.L03.lesson8
    title: "من فكرة واسعة لسؤال FINER (2): E وR"
    hook: "سؤال ممتاز علميًا ممكن يتشطب من أول يوم: لو مش أخلاقي أو مالوش لازمة."
    minutes: 6
    pages: [29, 44]
    topics: [finer]
    goals:
      - "تعرف إمتى مشكلة أخلاقية بتلغي البحث من أوله"
      - "تعدّ صفات الـ relevant question وأحسن research question"
    status: unverified
    steps:
      - kind: explain
        page: 29
        quote: "(E) Ethical: \"Some ethical problems may indicate that the research should not be considered from the beginning.\""
        title: "E: Ethical، أول بوابة"
        text: |
          slide 29 بيقولها صريحة: ==بعض المشاكل الأخلاقية معناها إن البحث ماينفعش يتفكّر فيه من الأول==.

          يعني الأخلاق مش «نصلّحها في الـ consent بعدين». لو السؤال نفسه مايتجاوبش غير بأذى الناس، السؤال هو اللي يتشال.
      - kind: figure
        page: 29
        quote: "(E) Ethical: \"Some ethical problems may indicate that the research should not be considered from the beginning.\""
        title: "Ethical: البوابات بالترتيب"
        svg: |
          <svg viewBox="0 0 330 252" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L03e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="20" y="8" width="290" height="44" rx="8" class="fg-acc"/>
            <text x="165" y="27" text-anchor="middle" class="t-sm t-b">Ethical problem in the question itself?</text>
            <text x="165" y="43" text-anchor="middle" class="t-sm t-mut">drop it from the beginning</text>
            <path d="M165 54v14" class="fg-arrow" marker-end="url(#L03e)"/>
            <rect x="20" y="72" width="290" height="44" rx="8" class="fg-box"/>
            <text x="165" y="91" text-anchor="middle" class="t-sm t-b">Therapy unlikely to become available here?</text>
            <text x="165" y="107" text-anchor="middle" class="t-sm t-mut">trial unjustifiable</text>
            <path d="M165 118v14" class="fg-arrow" marker-end="url(#L03e)"/>
            <rect x="20" y="136" width="290" height="44" rx="8" class="fg-box"/>
            <text x="165" y="155" text-anchor="middle" class="t-sm t-b">Conflicts with cultural, moral, legal values?</text>
            <text x="165" y="171" text-anchor="middle" class="t-sm t-mut">not acceptable</text>
            <path d="M165 182v14" class="fg-arrow" marker-end="url(#L03e)"/>
            <rect x="20" y="200" width="290" height="44" rx="8" class="fg-box"/>
            <text x="165" y="219" text-anchor="middle" class="t-sm t-b">Volunteers with no benefit?</text>
            <text x="165" y="235" text-anchor="middle" class="t-sm t-mut">only if it advances knowledge + no other way</text>
          </svg>
        caption: "slides 29-32 كأسئلة ورا بعض: أي «أيوه» من غير مبرر بتوقف البحث. الأولى أهمهم لأنها بتشطب الفكرة قبل ما تبدأ."
        alt: "Four stacked ethical questions from slides 29 to 32, each with what happens if the answer is yes."
      - kind: explain
        page: 30
        quote: "(E) Ethical (cont.): If the research topic involves experimentation on human subjects, the following issues should be considered:\n  If the topic is about testing a new therapy or procedure, evidence should already be available to suggest that it can be superior to currently available alternatives.\n  Adequate data must be available from animal studies and from studies on a small number of human subjects to confirm safety and to suggest effectiveness, before subjecting patients to a new drug or procedure. The ethically acceptable practice is to step up clinical trials in successive phases, starting first with a small number of subjects, and only moving to the next phase after the successful completion of the previous phase."
        title: "E: Ethical"
        text: |
          أحيانًا المشكلة الأخلاقية معناها إن البحث **should not be considered from the beginning**.

          لو هتجرّب علاج أو procedure جديد على بني آدمين:
          - لازم يكون فيه evidence إنه ممكن يبقى **superior to currently available alternatives**.
          - لازم داتا كفاية من **animal studies** ومن عدد صغير من البشر تأكد الـ **safety** وتلمّح للـ effectiveness.
          - التجارب بتطلع ==in successive phases==: عدد صغير الأول، ومفيش phase جديدة غير لما اللي قبلها تخلص بنجاح.
      - kind: explain
        page: 31
        quote: "(E) Ethical (cont.):\n  It is unjustifiable to do clinical trials on therapies that are unlikely to become available to people in the country or community.\n  The research should not conflict with the society's cultural, moral, religious and legal values."
        title: "E: باقي القواعد"
        text: |
          - **Unjustifiable** تعمل trial على علاج **unlikely to become available** للناس في البلد.
          - البحث مايتعارضش مع قيم المجتمع **cultural, moral, religious and legal**.
          - لو متطوعين مالهمش فايدة مباشرة: البحث يتعمل بس لو المعلومة هتقدّم العلم والممارسة و==cannot be obtained otherwise== (مثلًا من حيوانات).
          - والتجارب على الحيوانات نفسها لازم **justified**.
      - kind: reveal
        page: 32
        quote: "(E) Ethical (cont.):\n  If the research involves experimentation on volunteer human subjects, for whom the research has no immediate benefit, the research should only be carried out if the information needed is likely to advance scientific knowledge and medical practice, and if the information cannot be obtained otherwise, e.g. through animal experimentation.\n  Research involving experimentation on animals should be justified."
        prompt: "متطوعين أصحاء، والبحث مش هيفيدهم بأي حاجة مباشرة. إمتى يبقى مقبول؟"
        answer: |
          بشرطين (slide 32):

          - المعلومة ==likely to advance scientific knowledge and medical practice==.
          - و**cannot be obtained otherwise**، زي through animal experiments. وحتى بحث الحيوانات نفسه لازم يكون له مبرر.

          ليه؟ لأن المتطوع شايل risk من غير مقابل ليه هو، فلازم المكسب للناس كلها يكون حقيقي ومفيش طريق أأمن. التفسير المقبول (مش في الكتاب).
      - kind: check
        page: 44
        quote: "\"will good environment improve health\"\n  Is this research question: specific or measurable? It is too broad to reach conclusive results\n  Does it specify a population?\n\"will voluntary induced abortion after 3rd month cause increase incidence of maternal mortality\"\n  Limited by ethical and legal issues"
        question: "\"Will voluntary induced abortion after the 3rd month increase maternal mortality?\" What limits this question?"
        options:
          - "Ethical and legal issues"
          - "It is too vague"
          - "It is not novel"
          - "It has no outcome"
        answer: 0
        why:
          - "صح: المحاضرة كاتبة **limited by ethical and legal issues**. الـ E في FINER."
          - "بالعكس، هو محدد: exposure وتوقيت و outcome."
          - "مش دي المشكلة."
          - "الـ outcome موجود: maternal mortality."
      - kind: explain
        remind: [res.L03.044, res.L01.049]
        page: 33
        quote: "(R) Relevant: For the research question to be considered relevant, it must:\n  have the potential to advance scientific knowledge\n  influence clinical management\n  influence health policy\n  guide further research"
        title: "R: Relevant"
        text: |
          السؤال الـ relevant لازم يكون عنده **potential** يعمل واحدة من دول:

          - ==advance scientific knowledge==
          - **influence clinical management**
          - **influence health policy**
          - **guide further research**
      - kind: explain
        remind: [res.L03.045]
        page: 34
        quote: "The best research question is one that:\n  attempts to fill a knowledge gap in the literature\n  is enough to be answerable and researchable\n  should be relevant to the study objective(s)/hypotheses\n  should avoid duplication of previous work\n  should be feasible and cost-effective\n  should be doable within a specified time frame allocated for the research project\n  it needs to meet the minimum ethical standards"
        title: "أحسن research question"
        text: |
          slide 34 بيجمع كل اللي فات في 7 صفات. السؤال الأحسن:

          - بيحاول يسد ==knowledge gap== في الـ literature.
          - **answerable and researchable**.
          - **relevant** للـ objectives/hypotheses.
          - بيتجنب الـ **duplication**.
          - **feasible and cost-effective**.
          - يتعمل في **الوقت** المتاح للمشروع.
          - بيحقق ==minimum ethical standards==.

          لاحظ إنهم هما نفس FINER بكلام تاني: gap وduplication = Novel، feasible ووقت = Feasible، ethical = Ethical، relevant = Relevant. التفسير المقبول (مش في الكتاب).
      - kind: try
        items: [res.L03.039, res.L03.043, res.L03.045]
    recap:
      - "بعض المشاكل الأخلاقية معناها: ماتبدأش البحث أصلًا."
      - "متطوعين أصحاء من غير فايدة مباشرة: بس لو المعلومة هتقدّم العلم ومتجيش بطريقة تانية."
      - "Relevant: advance knowledge، clinical management، health policy، أو further research."
      - "أحسن سؤال: يسد gap، answerable، feasible، في الوقت، وأخلاقي."
    practice: [res.L03.039, res.L03.040, res.L03.041, res.L03.042, res.L03.043, res.L03.044, res.L03.050, res.L03.045]  # ------------------------------------------------------------------
  - id: res.L03.lesson5
    title: "الأهداف: SMART ومن غير فلسفة"
    hook: "\"To understand\" هي أسهل طريقة تخلّي المشرف يرجّعلك الـ protocol."
    minutes: 8
    pages: [47, 56]
    topics: [objectives]
    goals:
      - "تعرّف الـ research objective وتعرف ليه ومتى بنكتبه"
      - "تحفظ SMART وصفات الـ objective الكويس"
      - "تفرّق بين الـ action verbs والأفعال المايعة"
    status: unverified
    steps:
      - kind: explain
        page: 47
        quote: "To answer the research question → Testable objectives and/or hypotheses (Specific, Measurable)"
        title: "السؤال بيتجاوب إزاي؟"
        text: |
          السؤال لوحده مابيتقاسش. علشان تجاوبه بتحوّله لـ ==testable objectives and/or hypotheses==، وشرطهم: **specific** و**measurable**.

          تخيّل السؤال هو «عايز أوصل إسكندرية»، والـ objectives هي الطريق متقسّم لمحطات تقدر تقول عند كل واحدة «وصلت ولا لأ».
      - kind: explain
        page: 48
        quote: "Research Objectives: A research objective is a statement that clearly describes the goal(s) to be achieved by a research project."
        title: "من السؤال للهدف"
        text: |
          علشان تجاوب على الـ research question لازم تحوّله لـ **testable objectives and/or hypotheses** تكون **specific** و **measurable**.

          والـ ==research objective== هو **a statement that clearly describes the goal(s)** اللي البحث عايز يوصلها.
      - kind: explain
        page: 49
        quote: "Why should research objectives be developed? The formulation of objectives will help you to:\n  Focus the study (narrowing it down to essentials);\n  Avoid the collection of data which are not strictly necessary for understanding and solving the problem you have identified (to establish the limits of the study); and\n  Organize the study in clearly defined parts or phases.\nProperly formulated, specific objectives will facilitate the development of your research methodology and will help to orient the collection, analysis, interpretation and utilization of data."
        title: "ليه نكتب أهداف أصلًا؟"
        text: |
          الأهداف بتساعدك:

          - ==Focus the study==: تضيّقها للأساسيات.
          - **Avoid** إنك تجمع data مش محتاجها فعلًا (وده بيحدد حدود الدراسة).
          - **Organize** الدراسة في أجزاء أو phases واضحة.

          والأهداف المكتوبة كويس بتسهّل الـ methodology وبتوجّه الـ collection والـ analysis والـ interpretation.
      - kind: figure
        page: 50
        quote: "When should the objectives of a research project be prepared? The objectives should be written:\n  after the statement of the problem is developed,\n  before the methodology for the study is planned"
        title: "الأهداف بتتكتب إمتى؟"
        alt: "A horizontal-then-down timeline of three boxes: statement of the problem, then objectives (highlighted, with the labels after and before), then methodology."
        caption: "بعد الـ statement of the problem، وقبل ما تخطط الـ methodology. الهدف هو الكوبري بين الاتنين."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03o1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="40" y="10" width="250" height="50" rx="8" class="fg-box"/>
            <text x="165" y="40" text-anchor="middle" class="t-b">Statement of the problem</text>
            <path d="M165 60v26" class="fg-arrow" marker-end="url(#L03o1)"/>
            <text x="175" y="78" class="t-sm t-mut">after</text>
            <rect x="40" y="92" width="250" height="60" rx="8" class="fg-acc"/>
