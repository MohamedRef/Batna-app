  - id: neph.L14.070
    kind: card
    topic: ln-maintenance
    front: Which maintenance option is preferred, and why over azathioprine (Figure 9, p463)?
    back: MPAA, based on high-certainty evidence, with fewer flares than azathioprine. Azathioprine is cheap and safe in pregnancy.
    src: { page: 463, quote: "Figure 9: Maintenance immunosuppressive regimens in patients with lupus nephritis.\n| Maintenance immunosuppressive regimens (Low-dose glucocorticoids AND) | Comments |\n| Mycophenolic acid analogs | Preferred treatment based on high-certainty evidence; lower flare rate than azathioprine maintenance |\n| Azathioprine | Low medication cost; safe in pregnancy |\n| Belimumab and mycophenolic acid analogs or azathioprine | Efficacy and safety of belimumab demonstrated in BLISS-LN (104-wk) and open-label extension trials (28-wk) [Practice Point 10.2.3.2.5] |\n| CNI and mycophenolic acid analogs | Efficacy and safety of voclosporin demonstrated in AURORA 1 (52-wk) and AURORA 2 continuation trials (2-yr); efficacy and safety of tacrolimus demonstrated in 'Multitarget Therapy' trial in Chinese patients in which tacrolimus and reduced-dose MPAA were given for 24 months [Practice Point 10.2.3.2.5] |\n| CNI (such as voclosporin, tacrolimus or cyclosporine) | Tacrolimus and cyclosporine safe in pregnancy; insufficient pregnancy data on voclosporin |\nAURORA, Aurinia Renal Response in Active Lupus with Voclosporin; BLISS-LN, Efficacy and Safety of Belimumab in Patients with Active Lupus Nephritis; CNI, calcineurin inhibitor; MPAA, mycophenolic acid analogs." }
