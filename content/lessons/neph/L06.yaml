      - kind: explain
        page: 131
        title: "ليه 48 ساعة، وليه الـ furosemide؟"
        quote: "Coadministration of furosemide (20 mg IV)"
        text: |
          الكتاب بيقسّم بالمدة: أقل من **48 ساعة** = acute، أكتر أو مش معروفة = chronic. التفسير المقبول (مش في الكتاب):

          - المخ محتاج حوالي **يومين** علشان يرمي الـ organic osmolytes ويتأقلم. قبلها الخلايا لسه منفوخة، فالرفع السريع **بينقذ**. بعدها الخلايا اتأقلمت، فالرفع السريع **بيكسّر** (ODS).
          - علشان كده المدة ==المش معروفة== بتتعامل كـ chronic: الأمان الأول.
          - الـ **furosemide** (loop diuretic) بيخلي البول أخف من الدم، فالجسم يطلّع **ميه حرة** زيادة، وده عكس اللي الـ ADH بيعمله.
          - تحوّل لـ **water restriction** بعد ما الـ Na يعلى **10%** أو الأعراض تروح، لأن الهدف وقف الخطر مش رجوع الرقم طبيعي في يوم.
      - kind: update
        page: 131
        quote: "Symptomatic\n  Acute: Duration <48 h\n    Emergency correction needed\n      Hypertonic saline (3%) at 1–2 ml/kg/h\n      Coadministration of furosemide\n  Chronic: Duration >48 h or unknown\n    Some immediate correction needed\n      Hypertonic saline at 1–2 ml/kg/h (if seizures), otherwise isotonic saline\n      Coadministration of furosemide (20 mg IV)\n      Change to water restriction upon 10% increase of [Na+], or if symptoms resolve\n    Perform frequent measurement of serum and urine electrolytes.\n    Do not correct serum [Na+] >12 mmol/l/24 hours\n    Goal of correction 8 mmol/L in 24 hours\nAsymptomatic\n  Chronic: Rarely <48 h\n    No immediate correction needed\nLong-term management\n  Identification and treatment of reversible etiologies\n  Water restriction\n  Demeclocycline 300–600 mg bid (allow 2 weeks for full effect) or\n  Urea 15–60 g daily\n  V2 receptor antagonist"
        text: "الـ European guideline سنة 2014 بيحط الحد **10 mmol/L في أول 24 ساعة** و 8 في كل 24 ساعة بعدها. وعلى المدى الطويل في الـ SIADH بينصح **ما نستعملش** الـ vasopressin receptor antagonists ولا الـ demeclocycline: water restriction الأول، وبعدها urea أو loop diuretic بجرعة صغيرة مع NaCl بالبُق. في امتحان القسم اكتب رقم الكتاب: **12، والهدف 8**، وقايمة الكتاب."
        ref: "European clinical practice guideline on hyponatraemia (ESE/ESICM/ERBP) 2014"
      - kind: check
        page: 131
        quote: "Hypertonic saline (3%) at 1–2 ml/kg/h"
        question: "A 24-year-old runner drank huge amounts of water during a marathon today. Na 118, now seizing. Best treatment?"
        options:
          - "3% saline at 1–2 mL/kg/h with furosemide"
          - "Isotonic saline only"
          - "Water restriction and observe"
          - "Demeclocycline"
        answer: 0
        why:
          - "صح: acute (أقل من 48 ساعة) و symptomatic، يعني emergency correction بالـ 3% مع furosemide."
          - "الـ isotonic للـ chronic symptomatic من غير seizures."
          - "الـ water restriction للـ chronic وبعد الطوارئ، مش لعيان بيتشنج."
          - "الـ demeclocycline علاج long-term وبياخد أسبوعين."
      - kind: explain
        page: 131
        title: "الـ hypertonic saline بيعمل إيه؟"
        quote: "Both 3% and 5% hypertonic saline (HS) is currently FDA-approved for use in hyponatremia and increased intracranial pressure (ICP)."
        text: |
          الـ **3% و 5%** معتمدين للـ hyponatremia والـ **intracranial pressure (ICP) العالي**.

          بيرفع الـ osmolarity فيسحب ميه من برّه الأوعية لجوّه: ==brain edema== يقل، الـ cerebral blood flow يتحسن، والـ cerebrospinal fluid (CSF) يقل.

          مقارنة بالـ **20% mannitol**: نفس تأثير الـ ICP، بس الـ saline بيرفع الـ Na و **diuresis أقل** (الـ Na بيطلّع ADH)، ومحتاج **حجم أقل**.

          **يعني** الـ saline بيعمل شغل الـ mannitol في الـ ICP بحجم أقل ومن غير ما ينشّف العيان.
      - kind: reveal
        page: 131
        quote: "Hypertonic saline leads to increases in serum sodium and has less of a diuretic effect than mannitol, likely due to the increased serum sodium causing ADH release."
        prompt: "الاتنين بيقللوا الـ ICP بنفس القدر. ليه الـ hypertonic saline بيعمل diuresis أقل من الـ mannitol؟"
        answer: |
          الكتاب بيقول السبب غالبًا إن الـ **Na العالي بيطلّع ADH**، والـ hypertonic saline كمان بيحفّز الـ **vasopressin** من الـ pituitary، فالكلية تحتفظ بالميه.

          والتفسير المقبول (مش في الكتاب) للجانب التاني: الـ ==mannitol== بيترشّح وما بيرجعش، فبيشد ميه معاه في البول (osmotic diuretic). علشان كده الـ mannitol ممكن ينشّف العيان، والـ saline بيحافظ على حجم الدم بحجم أقل.
      - kind: explain
        page: 132
        title: "أرقام لازم تتحفظ"
        quote: "Each 1 ml/kg/h of 3% saline solution administered can be expected to increase [na+] by 1 meq/l/h."
        text: |
          - Severe hyponatremia: صحّح **4–6 mEq/L في اليوم**، بـ **boluses 100 mL** من 3% كل **10 دقايق**، لحد **3 boluses**.
          - كل ==1 mL/kg/h== من 3% بيرفع الـ Na حوالي **1 mEq/L/h**.
          - الأحسن **central line**؛ الـ peripheral ينفع لو مفيش غيره.

          والـ boluses الصغيرة **علشان** تقيس بعد كل واحدة وما تعدّيش الحد (التفسير المقبول، مش في الكتاب).
      - kind: explain
        page: 132
        title: "ليه 1 mL/kg/h بيعلّي 1 mEq/L/h؟"
        quote: "Each 1 ml/kg/h of 3% saline solution administered can be expected to increase [na+] by 1 meq/l/h."
        text: |
          القاعدة من الكتاب: ==1 mL/kg/h== من 3% بيعلّي الـ Na حوالي **1 mEq/L كل ساعة**. الحسبة اللي وراها (التفسير المقبول، مش في الكتاب):

          - الـ 3% saline فيه حوالي **513 mmol Na في اللتر**.
          - عيان 70 kg على 70 mL/h بياخد حوالي **36 mmol Na في الساعة**.
          - الـ Na ده بيتوزع على **total body water** حوالي 60% من الوزن، يعني حوالي **42 لتر**.
          - 36 ÷ 42 = حوالي **0.9**، يعني تقريبًا **1 mEq/L/h**.

          وليه الـ **central line** أحسن؟ المحلول مركّز وبيهيّج الأوردة الصغيرة، وده اللي هتشوفه في المضاعفات: **thrombophlebitis** و extravasation.
      - kind: update
        page: 132
        quote: "In patients with severe hyponatremia, serum sodium should undergo correction by 4 to 6 mEq/L per day, which can be achieved with 100 mL boluses of 3% HS at 10-minute intervals up to three total boluses."
        text: "الـ guidelines بتعتبر الـ **4–6** دي هدف لأول ساعات علشان تلحق الأعراض الشديدة، مش هدف لليوم كله: الـ European guideline سنة 2014 عايز الـ Na يطلع **5 mmol/L في أول ساعة** من الـ 3% saline، وبعدين الإجمالي ما يعدّيش **10 في أول 24 ساعة** و **8** في كل 24 ساعة بعدها. في الامتحان اكتب أرقام الكتاب."
        ref: "European clinical practice guideline on hyponatraemia (ESE/ESICM/ERBP) 2014; US expert panel recommendations on hyponatremia (Verbalis et al.) 2013"
