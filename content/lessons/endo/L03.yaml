  - id: endo.L03.lesson6
    title: "hCG، عضم طري، و GH: آخر التلات متلازمات"
    hook: "راجل عنده ثدي، وعضم بيتكسر من ورم صغير في الأنف، و acromegaly جاية من الرئة."
    minutes: 8
    pages: [40, 41]
    topics: [hcg, osteomalacia, gh]
    goals:
      - "تعرف ليه الـ hCG بيعمل صورة مختلفة حسب السن والجنس"
      - "تفهم إزاي الـ FGF-23 بيطرّي العضم، وتقرا التحاليل"
      - "تعرف علاج الـ ectopic GH/GHRH"
    status: unverified
    steps:
      - kind: explain
        page: 40
        quote: "5) Ectopic Human Chorionic Gonadotropin secretion\nHCG is composed of two subunits with CHOes molecule.\nAlpha subunit is similar to that of LH, FSH, and TSH.\nNormally produced by trophoblastic cell during pregnancy, gestational trophoblastic neoplastic cells and teratoma.\nB-subunit is different in the four glycprotein hormones."
        title: "Ectopic hCG"
        text: |
          - الـ hCG من subunitين. ==Alpha== زي luteinising hormone (LH) و follicle-stimulating hormone (FSH) و thyroid-stimulating hormone (TSH)، والـ **beta** مختلف (بيه بنفرّق ونتابع).
          - **الأسباب:** hydatidiform mole، teratoma، seminoma، و non-gonadal (choriocarcinoma، lung، hepatoma، breast، colon).
          - **الميكانيزم:** steroidogenesis و ==aromatase== ↑ ← E2 عالي.

          ليه بنتابع بالـ **beta**؟ لأن الـ alpha مشترك مع الـ LH والـ FSH والـ TSH، فلو قسته مش هتعرف ده hCG ولا غيره. الـ beta هو البصمة الخاصة بكل هرمون من الأربعة.
      - kind: table
        page: 41
        quote: "Young patient precocious puberty.\nAdult female uterine bleeding.\nAdult male gynecomastia."
        title: "الصورة حسب السن والجنس"
        columns: ["Patient", "Picture"]
        rows:
          - ["Young", "Precocious puberty"]
          - ["Adult female", "Uterine bleeding"]
          - ["Adult male", "Gynecomastia"]
          - ["Any", "Hyperthyroid features possible"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 41
        quote: "There may be manifestations of hyperthyroidism."
        prompt: "ليه الـ hCG ممكن يعمل hyperthyroidism؟"
        answer: "الـ alpha subunit بتاع الـ hCG زي بتاع الـ TSH، والجزيء كله شبهه، فلو الكمية كبيرة جدًا بينبّه الـ TSH receptor. (زي ما شفنا في الحمل في المحاضرة 2: direct effect of hCG on the thyroid.)"
      - kind: explain
        page: 41
        quote: "Clinical picture\n  It depends on the age and sex of the patient.\n  Young patient precocious puberty.\n  Adult female uterine bleeding.\n  Adult male gynecomastia."
        title: "ليه الصورة بتختلف حسب السن والجنس؟"
        text: |
          الكتاب بيقول الصورة ==depends on the age and sex==، والسبب في الميكانيزم: الـ hCG بيزوّد الـ steroidogenesis والـ aromatase، يعني **estrogen** عالي.

          التفسير المقبول (مش في الكتاب):
          - **الطفل**: الـ hCG شبه الـ LH، فبيشغّل الـ gonads بدري ← ==precocious puberty==.
          - **الست الكبيرة**: الـ estrogen الزيادة بيتخّن بطانة الرحم، فتنزف ← **uterine bleeding**.
          - **الراجل الكبير**: نسبة الـ estrogen للـ testosterone تعلى، والـ estrogen بيكبّر نسيج الثدي ← ==gynecomastia==.
      - kind: explain
        page: 41
        quote: "Increased fibroblast growth factor 23 secreted by tumor cells leads to decreased phosphate reabsorption by the kidney with decreased 1,25 Vit.D synthesis by the kidney. Also, known as \" Phosphatonin \"."
        title: "Oncogenic osteomalacia"
        text: |
          - أورام ==mesenchymal غريبة، غالبًا benign==: "strange tumor in strange place"، زي hemangiopericytoma و angiosarcoma و chondrosarcoma في الجلد أو العضلات أو الـ paranasal sinuses.
          - الورم بيفرز ==FGF-23== (phosphatonin): phosphate reabsorption ↓، و 1,25-vit D ↓.
          - **Labs:** phosphate ↓، alkaline phosphatase (ALP) ↑، **calcium normal**، vit D ↓.
          - **الصورة:** bone pain، muscle weakness، fractures، waddling gait.

          وآخر حاجة: **GH و growth hormone-releasing hormone (GHRH)** ectopic نادر جدًا (lung، stomach، breast، ovary)، وعلاجه **octreotide**.

          ليه الكالسيوم **normal** والفوسفات بس اللي واطي؟ لأن الـ FGF-23 بيضرب الفوسفات من ناحيتين: الكلية بتطرده، والـ 1,25-D اللي بيمتصه من الأمعاء بيقل. والـ PTH مش متأثر مباشرة، فالكالسيوم بيفضل في حدوده. ومن غير فوسفات العضم ميعرفش يتكلّس، فيبقى طري (osteomalacia)، والـ **ALP** يعلى لأن الـ osteoblasts بتحاول تبني ومش لاقية مواد. وليه الـ octreotide للـ GH؟ لأنه شبه الـ somatostatin، الفرامل الطبيعية للـ GH.
      - kind: figure
