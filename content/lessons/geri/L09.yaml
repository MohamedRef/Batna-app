        quote: "Vitamin D\n  Probiotics, Prebiotics and Symbiotics\n    Data from supplementation studies with pro- or prebiotics in older adults show a control of inflammatory status because their use is responsible for a lower production of TNF-α, IL-1β, and IL-6 as well as an increase of anti- inflammatory cytokine IL-10, by PBMCs. In addition, these biotics improve the innate immune responses by the modulation of phagocytosis and cytotoxicity against specific bacteria, such as Staphylococcus aureus, increase activity of peripheral blood NK cells, and lower CD25 expression by resting T lymphocytes (123). However, the complexity of randomized controlled trials and lack of specific biomarkers in humans make difficult the reproducibility of the data (124)."
