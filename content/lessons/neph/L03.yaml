        quote: "Dopamine has cardiac inotropic and direct kidney effects that can enhance kidney function and diuresis in some patients, but dopamine has not improved clinical or renal outcomes in patients with AKI."
        text: |
          - **Small-volume hypertonic saline:** ممكن يحسّن الـ diuretic response ووظيفة الكلى، غالبًا بتقليل الـ neurohormonal activation.
          - ==Dopamine==: ليه inotropic و direct kidney effects وممكن يزوّد البول، **بس ما حسّنش الـ clinical ولا الـ renal outcomes في الـ AKI**.
          - **Inotropes:** بس لو فيه **hypotension** أو دليل موضوعي على **low cardiac output**؛ الـ empirical use ممنوع علشان الـ toxicity.
      - kind: explain
        page: 79
        quote: "Dopamine has cardiac inotropic and direct kidney effects that can enhance"
        title: "ليه الـ dopamine خذلنا والـ inotropes ليهم شرط؟"
        text: |
          الكتاب: الـ **hypertonic saline** ممكن يحسّن الاستجابة، الـ **dopamine** ما حسّنش الـ outcomes في الـ AKI، والـ **inotropes** بس مع hypotension أو low cardiac output، والـ empirical use ممنوع **بسبب** الـ toxicity.

          التفسير المقبول (مش في الكتاب):

          - الـ **dopamine** بيزوّد البول فعلًا، **بس** البول الزيادة مش معناه إن الكلية اتحمت. الرقم اتحسّن والعيان لأ.
          - الـ **inotropes** بيخلّوا القلب يشتغل أكتر ويستهلك أكسجين أكتر، **فـ** ممكن يعملوا arrhythmias أو ischemia. لو المشكلة مش ضعف ضخ، الخطر من غير فايدة.
