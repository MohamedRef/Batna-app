  - id: res.L09.004
    kind: mcq
    topic: budget
    stem: "A researcher lists the payment given to each participant for their time. Under which budget heading does it belong?"
    options:
      - "Personnel allowances"
      - "Supplies and equipment"
      - "Other costs"
      - "Communications"
    answer: 2
    why:
      - "Personnel allowances are salaries and benefits of the research team, not payments to subjects."
      - "Supplies and equipment are materials, not payments to people."
      - "The slide lists compensation for subjects under other costs, with transport, medical intervention costs and stationery."
      - "Communications are telephone, fax and postage."
    src: { page: 3, quote: "How should a budget be prepared?\n  It is necessary to use the work plan as a starting point. Specify, for each activity in the work plan, what resources are required. Determine for each resource needed, the unit cost and the total cost.\nYou may include in your project budget:\n  Personnel allowances: salaries and benefits (e.g., researchers, research assistants, secretarial and administrative, drivers)\n  Supplies and equipment\n  Other costs (compensation for subjects, transportation costs, and medical intervention costs, stationery supplies), etc.\n  Communications (e.g., telephone, fax, postage)" }
    status: unverified
  - id: res.L09.005
    kind: card
    topic: budget
    front: "Besides the costs themselves, what should be included for each part of the budget?"
    back: "A justification for each part, if necessary."
    src: { page: 4, quote: "Justification for each of the parts should be included, if necessary." }
    status: unverified
  - id: res.L09.006
    kind: card
    topic: budget
    front: "In the slide's example budget, what line is added after the total (allowances + transport + supplies) to reach the grand total?"
    back: "A 5% contingency (1 310 on a total of 26 170, giving a grand total of 27 480)."
    src: { page: 5, quote: "EXAMPLE OF A BUDGET\n| Category | Unit cost | Multiplying factors | Costs |\n|---|---|---|---|\n| I. ALLOWANCES: a. Researchers (5); b. Research assistants (5); c. Secretary (1); d. Drivers (2); e. Facilitator (1) | per day | persons x days | |\n| SUBTOTAL (I) | | | MK 14 620 |\n| II. TRANSPORT COSTS: field work during pilot study; field work during actual study; travel costs for facilitator; travel costs for feedback in field; travel costs for those who attend meeting | 0.50 per km | km | |\n| SUBTOTAL (II) | | | MK 8 950 |\n| III. SUPPLIES: a. Stationary; b. Lunch for those who attend meeting | | | |\n| SUBTOTAL (III) | | | MK 2 600 |\n| TOTAL (I+II+III) | | | MK 26 170 |\n| 5% CONTINGENCY | | | 1 310 |\n| GRAND TOTAL | | | MK 27 480 |" }
    status: unverified
    tags: [numbers]
  - id: res.L09.007
    kind: table
    topic: budget
    title: "Layout of the example budget (slide 5)"
    columns: ["Part", "What it holds"]
    rows:
      - ["Columns", "Category, unit cost, multiplying factors, costs"]
      - ["I. Allowances", "Researchers, research assistants, secretary, drivers, facilitator (per day x days)"]
      - ["II. Transport costs", "Field work in the pilot and actual study, travel for facilitator, feedback and meetings (per km)"]
      - ["III. Supplies", "Stationery, lunch for those attending the meeting"]
      - ["Bottom lines", "Subtotal of each part, total (I+II+III), 5% contingency, grand total"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
