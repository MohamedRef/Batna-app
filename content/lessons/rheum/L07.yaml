  - id: rheum.L07.lesson3
    title: "الـ alternative والـ lectin: من غير antibody"
    hook: "ولّاعة شغالة طول الوقت، وخلاياك لابسة بدلة ضد الحريق. والميكروب داخل بالبيجامة."
    minutes: 10
    pages: [111, 114]
    topics: [alternative, lectin]
    goals:
      - "تشرح الـ alternative pathway والـ amplification loop"
      - "تعرف اللاعيبة: factor B و D و properdin والـ regulators"
      - "تفهم ليه خلاياك ما بتتحرقش والميكروب بيتحرق"
      - "تشرح الـ lectin pathway وتربطه بالـ classical"
    status: unverified
    steps:
      - kind: explain
        page: 111
        title: "الـ alternative pathway"
        quote: "It was the second to be discovered, hence the name. AP is triggered when breakdown products of C3;C3b, bind with certain antigens on the surface of a pathogen as lipopolysaccharides and endotoxins. It generates an innate immune response and it does not require an Ab for activation (Ab independent mech). C3b is prevented from binding stably to normal host cells by several regulatory proteins, that are present on host cells but absent from microbes."
        text: |
          اسمه **alternative** لأنه **اتكشف تاني** مش لأنه احتياطي.

          - بيبدأ لما **C3b** يمسك في سطح الميكروب، زي الـ **lipopolysaccharides** و **endotoxins**.
          - **innate** و ==Ab independent==: مش محتاج antibody.
          - أول C3b جاي من **spontaneous hydrolysis** للـ C3.

          يعني الـ AP **مش مستني إذن** من حد: C3 بيتكسر لوحده بكميات صغيرة طول الوقت، والـ C3b ده بيقع على أي سطح قريب. لو السطح ده ميكروب، الـ pathway يولّع. ولو خلية من جسمك، الفرامل تطفيه. عشان كده هو أسرع باب في أول العدوى.
      - kind: reveal
        page: 111
        quote: "AP serves as a feedback loop to amplify C3 deposition (regardless of which path deposited C3)."
        prompt: "الكتاب بيقول الـ AP بيضخّم الـ C3b مهما كان الطريق اللي حطّه. ليه ده منطقي؟"
        answer: |
          لأن الـ alternative بيبدأ من **C3b قاعد على سطح**، ومش فارق معاه الـ C3b ده جه منين. فلو الـ **classical** أو الـ **lectin** حطّوا شوية C3b على الميكروب، الـ AP يمسكهم ويعمل منهم convertase تطلّع C3b أكتر، وهكذا.

          الكتاب بيقول ده ممكن يزوّد الـ C3b deposition ==many folds==. يعني الـ classical والـ lectin بيولّعوا الكبريتة، والـ alternative هو اللي بيحوّلها حريقة.
