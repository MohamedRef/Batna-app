  # Split from lesson4 on 2026-11-13 (#828): lesson4 keeps the goal, risk,
  # venesection, hydroxyurea, IFN and 32P (pp164-166); the rest moved to lesson7.
  - id: hem.L10.lesson4
    title: "علاج الـ PV: فصد الأول، وحبة لو لازم"
    hook: "الهدف واحد: تمنع الجلطة من غير ما تعمل نزيف. الفصد أسرع حل، والـ cytoreduction لما الفصد ما يكفيش."
    minutes: 9
    pages: [164, 166]
    topics: [pv-treatment]
    goals:
      - "تعرف هدف العلاج والـ risk groups وليه"
      - "تكتب الـ venesection protocol وتفهم كل رقم فيه"
      - "تعرف الـ hydroxyurea والـ IFN-α والـ 32P، ومين ياخد إيه"
    status: unverified
    steps:
      - kind: explain
        page: 164
        title: "الهدف"
        quote: "The goal of therapy in PV\n  1. Primarily to reduce the risk of thrombosis without increasing the bleeding tendency\n  2. and, secondarily, to ameliorate symptoms, particularly vasomotor manifestations"
        text: |
          1. أولًا: ==reduce the risk of thrombosis without increasing the bleeding tendency==.
          2. تانيًا: تخفيف الأعراض، خصوصًا **vasomotor** (الصداع والدوخة والـ erythromelalgia).

          ليه الترتيب ده؟ لأن الجلطة هي اللي بتموّت مريض الـ PV (serious esp in untreated patient، ص 158)، والنزيف نادر (1%). فأي علاج بيقلل الجلطة بس بيعمل نزيف، زي aspirin مع صفائح عالية جدًا، بيبقى محتاج حساب.
      - kind: explain
        page: 165
        title: "مين low ومين high؟"
        quote: "Risk category Risk variables\nLow Age <60 years old; and no thrombosis history\nHigh Age ≥60 years old and/or thrombosis history"
        text: |
          - **Low risk**: سن ==<60== و **مفيش thrombosis history**.
          - **High risk**: سن **≥60** و/أو **thrombosis history**.

          متغيرين بس، أبسط من الـ ET. ليه هما بالذات؟ التفسير المقبول (مش في الكتاب): هما أقوى اتنين بيتنبأوا بالجلطة الجاية: أوعية كبيرة في السن، وجسم أثبت إنه بيجلّط قبل كده. والـ high risk هو اللي هياخد **cytoreduction** فوق الفصد والـ aspirin.
      - kind: figure
        page: 165
        title: "جدول الكتاب: الـ risk category في الـ PV"
        image: { file: hem/L10-risk-table.webp, book: true }
        alt: "Book table printed as a picture with two columns, risk category and risk variables. Low: age under 60 years old and no thrombosis history. High: age 60 years or older and/or thrombosis history."
        caption: |
          الجدول زي ما الكتاب طابعه، صفين بس:

          - **Low** (فوق، الصف الرمادي): سن ==<60== **و** مفيش thrombosis history. لازم الاتنين.
          - **High** (تحت): سن **≥60** ==و/أو== thrombosis history. واحدة كفاية.

          خد بالك من «and» فوق و«and/or» تحت: عيان عنده 45 سنة بس عمل جلطة قبل كده = **high risk**. نفس الجدول هيرجع في ص 168 ومعاه عمود العلاج.
      - kind: explain
        page: 165
        title: "Venesection، وكل رقم فيه ليه"
        quote: "Venesection\n  Is the quickest way of reducing RCM.\n  450 ml of blood removed (± isovolaemic replacement with normal saline) in adult every 2-3 days, twice weekly in old patients.\n  Target Hct <0.45.\n  Maintenance therapy individual requirement are variable (from 2 procedures/year to monthly venesection)\n  Increased risk of thrombosis in 1st 3 years, add aspirin and cytoreductive treatment."
        text: |
          - ==أسرع طريقة== تنزّل الـ red cell mass (RCM): بتشيل الكرات نفسها في دقايق، والأدوية محتاجة أسابيع.
          - **450 mL** كل **2–3 أيام** في البالغين (± **isovolaemic** normal saline)، و **مرتين في الأسبوع** في الكبار.
          - **Target Hct <0.45**.
          - الـ **maintenance** بتختلف: من مرتين في السنة لمرة كل شهر.
          - أول **3 سنين** خطر التجلط أعلى: زوّد **aspirin** و **cytoreduction**.

          التفسير المقبول (مش في الكتاب): الـ saline بيعوّض الحجم عشان الضغط ما يقعش، والكبار بنبطّأ معاهم لأن قلبهم وأوعيتهم ما بيستحملوش تغيّر الحجم بسرعة.
      - kind: aside
        tone: analogy
        page: 165
        quote: "Is the quickest way of reducing RCM."
        text: "الـ venesection زي ما تفتح حنفية الخزان لما يطفح: أسرع حل يقلل الـ red cell mass (RCM)، بس المصنع (النخاع) لسه شغال، فهتحتاج تفتحها تاني. علشان كده الـ high risk محتاج **cytoreduction** يهدّي المصنع نفسه."
      - kind: reveal
        page: 165
        quote: "Target Hct <0.45.\nMaintenance therapy individual requirement are variable (from 2 procedures/year to monthly venesection)"
        prompt: "ليه بعض المرضى محتاجين فصد كل شهر وغيرهم مرتين في السنة؟"
        answer: |
          الكتاب بيقول إن الـ maintenance ==individual requirement are variable==.

          التفسير المقبول (مش في الكتاب): الفرق في **سرعة المصنع**. نخاع نشيط بيرجّع الـ Hct فوق 0.45 في أسابيع، ونخاع أهدى (أو داخل في الـ stable phase) ياخد شهور. وكل فصدة بتشيل حديد، والـ iron deficiency بتبطّأ تصنيع الكرات، فالمدة بين الفصدات بتطول مع الوقت. بس خلّي بالك: نفس الـ iron deficiency بتزوّد الـ **pruritus** (ص 159).
      - kind: figure
        page: 165
        quote: "450 ml of blood removed (± isovolaemic replacement with normal saline) in adult every 2-3 days, twice weekly in old patients.\nTarget Hct <0.45."
        title: "الفصد: من 0.58 لتحت 0.45"
        alt: "A step chart of haematocrit falling with each 450 mL venesection every 2 to 3 days, from 0.58 down past a dashed target line at 0.45, then a flat maintenance phase with occasional venesections."
        caption: "كل فصدة **450 mL** بتنزّل الـ Hct درجة. الهدف ==<0.45==، وبعدين maintenance حسب المريض."
        svg: |
          <svg viewBox="0 0 330 210" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 15 V175 H320" class="fg-ink"/>
            <path d="M40 120 H320" class="fg-thin"/>
            <text x="316" y="113" text-anchor="end" class="t-sm t-good t-b">target 0.45</text>
            <path d="M45 40 H80 V58 H115 V76 H150 V94 H185 V112 H220 V128 H250 V122 H280 V128 H315" class="fg-arrow-acc" stroke-width="3"/>
            <text x="44" y="32" class="t-sm t-b">Hct 0.58</text>
            <text x="120" y="160" text-anchor="middle" class="t-sm">450 mL every 2–3 days</text>
            <text x="283" y="160" text-anchor="middle" class="t-sm t-mut">maintenance</text>
            <text x="180" y="196" text-anchor="middle" class="t-sm t-mut">time</text>
          </svg>
      - kind: explain
        page: 165
        title: "إمتى نضيف cytoreduction؟"
        quote: "Cytoreductive therapy\n  In patient not tolerated venesection\n  Thrombocytosis with increased risk of thrombosis.\n  1. Hydroxyurea\n  2. Busulphan\n  3. Anagrelide\n  4. INF-"
        text: |
          الـ **cytoreductive therapy** في:
          - مريض ==not tolerated venesection==
          - **Thrombocytosis** مع خطر تجلط عالي

          الأدوية: **hydroxyurea**، **busulphan**، **anagrelide**، **IFN-α**.

          ليه الفصد لوحده مش كفاية هنا؟ التفسير المقبول (مش في الكتاب): الفصد بيشيل **كرات حمرا** بس. الصفائح الكتير والـ neutrophils لسه موجودين وبيجلّطوا. محتاج حاجة **تهدّي المصنع نفسه**.
      - kind: explain
        remind: [hem.L10.074, hem.L09.055]
        page: 166
        title: "Hydroxyurea"
        quote: "Hydroxyurea\n  Antimetabolite, ribonucleotide reductase inhibitor.\n  Onset of myelosuppression is rapid\n  Dose 30mg/kg reduce to 10-20 mg/kg\n  Close monitoring of the dose when 1st used.\n  Not increased risk of malignancy.\n  Side effect, myelosuppression, photosensitivity, leg ulcers, GIT side effects."
        text: |
          - ==Antimetabolite، ribonucleotide reductase inhibitor==.
          - الـ **myelosuppression** بيبدأ **بسرعة**.
          - الجرعة **30 mg/kg** وبعدين **10–20 mg/kg**، ومتابعة قريبة أول ما يبدأ.
          - الكتاب هنا: **not increased risk of malignancy**.
          - أعراضه: **myelosuppression**، **photosensitivity**، **leg ulcers**، GI.

          ليه بيوقّف النخاع بسرعة؟ التفسير المقبول (مش في الكتاب): الـ ribonucleotide reductase هو الإنزيم اللي بيعمل حجارة بناء الـ **DNA**. من غيره الخلية اللي بتنقسم بتقف، والنخاع أسرع نسيج بينقسم في الجسم. وعشان كده الجرعة الأولى عالية وبعدين بتنزل.
      - kind: explain
        page: 166
        title: "IFN-α و 32P"
        quote: "Radioactive phosphorus (32P)\nLong established treatment\n RCM after 12 weeks.\nDose 2.3mCi/m2 IV repeated after 3-6 months if further myelosuppression is needed.\n thrombosis but marked  risk of AML\nNot recommended in patient <65 years for leukemogenic effect."
        text: |
          **IFN-α**:
          - بيظبط الصفائح والـ packed cell volume (PCV).
          - للي **ما استحملوش** غيره، و **الصغيرين**، و **الحمل**، و ==intractable pruritus==.
          - **3–5 mU** تلات مرات في الأسبوع؛ غالي، fatigue، flu-like، depression.

          **Radioactive phosphorus (32P)**:
          - علاج قديم؛ الـ RCM بينزل بعد **12 أسبوع**؛ **2.3 mCi/m²** IV، يتكرر بعد **3–6 شهور** لو محتاج.
          - تجلط **أقل** بس ==AML أكتر بكتير==، فـ **مش تحت 65**.

          ليه 65؟ افتكر: الـ AML بعد الـ 32P بييجي في المتوسط بعد **5–8 سنين** (ص 160). التفسير المقبول (مش في الكتاب): في مريض كبير، المكسب (حقنة كل كام شهر وجلطات أقل) أكبر من خطر بعيد. في الشاب، العمر قدامه طويل والخطر هيلحقه.
      - kind: check
        page: 166
        quote: "Useful in patients intolerant to other treatment, young patient, during pregnancy, intractable pruritus."
        question: "PV, 29-year-old woman planning pregnancy, needs cytoreduction. Best agent?"
        options: ["Interferon-alpha", "Radioactive phosphorus (32P)", "Hydroxyurea", "Busulphan"]
        answer: 0
        why:
          - "صح: الـ IFN-α للصغيرين والحمل والـ intractable pruritus."
          - "الـ 32P مش تحت 65 (leukemogenic)."
          - "الـ hydroxyurea اختيار الكتاب فوق 40، ومش للحمل."
          - "الـ busulphan للكبير اللي مش قادر ييجي العيادة."
      - kind: try
        items: [hem.L10.069, hem.L10.071, hem.L10.073, hem.L10.074, hem.L10.075]
