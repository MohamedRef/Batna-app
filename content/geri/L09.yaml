  # ---------- p157-158: innate ----------
  - id: geri.L09.012
    kind: table
    topic: innate
    title: Innate immunity with age
    columns: [Cell, Change]
    rows:
      - [Monocytes and macrophages, "Reduced phagocytic capacity; enhanced oxidative stress"]
      - [Neutrophils, "Reduced phagocytic activity; impaired free radical production"]
      - [Dendritic cells, "Reduced antigen presentation; impaired clearing of apoptotic cells"]
      - [NK cells, "Increased number; reduced cytotoxicity"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 157, quote: "Innate Immunity\n  Monocyte or macrophage: reduced phagocytic capacity and enhanced oxidative stress.\n  Neutrophils: reduced in phagocytic activity, impaired free radical production.\n  Dendritic cells: reduced antigen presentation, impaired phagocytic capability to clean apoptotic cells.\n  Natural killer cells (NK): increase number of NK, reduced cytotoxicity." }
    status: unverified
    tags: [high-yield, book-question]
  - id: geri.L09.013
    kind: card
    topic: innate
    front: What happens to NK cells with age?
    back: Their number increases but their cytotoxicity falls (antibody-dependent cytotoxicity does not change).
    src: { page: 157, quote: "Innate Immunity\n  Monocyte or macrophage: reduced phagocytic capacity and enhanced oxidative stress.\n  Neutrophils: reduced in phagocytic activity, impaired free radical production.\n  Dendritic cells: reduced antigen presentation, impaired phagocytic capability to clean apoptotic cells.\n  Natural killer cells (NK): increase number of NK, reduced cytotoxicity." }
