  - id: neph.L07.lesson5
    title: "Tuberous sclerosis: الـ hamartomas في كل حتة"
    hook: "صرع، وش فيه angiofibromas، وكلية فيها دهون بتنزف. وأكتر حاجة بتموّت عيان TSC هي الكلية."
    minutes: 9
