      - kind: try
        items: [res.L10.041, res.L10.044, res.L10.048]
    recap:
      - "«Other (please specify)» + قول: اختيار واحد ولا كل اللي ينطبق."
      - "Order bias: الأول بيتختار أكتر؛ غيّر الترتيب بين forms إلا لو ordered categories."
      - "Closed: أسهل، تحليل أسهل، interviewer bias أقل، تعاون أكتر."
      - "Rating scales: Likert (5 categories) و semantic differential."
    practice: [res.L10.041, res.L10.042, res.L10.043, res.L10.044, res.L10.045, res.L10.046, res.L10.047, res.L10.048, res.L10.049, res.L10.050]
