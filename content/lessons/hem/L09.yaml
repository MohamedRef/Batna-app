schema: batna.lesson/v1
lecture: hem.L09
lessons:
  # ------------------------------------------------------------------
  - id: hem.L09.lesson1
    title: "عيلة الـ MPN: تلات إخوات وتلات طفرات"
    hook: "PV و ET و PMF ولاد عم: نفس الـ stem cell، نفس الطفرات، وممكن الواحد يتحول للتاني."
    minutes: 9
    pages: [133, 136]
    topics: [mpn, et-diagnosis]
    goals:
      - "تعرّف الـ MPN وتعدّ الـ classical three (سؤال كتاب)"
      - "تحفظ نسب JAK2 و CALR و MPL"
      - "تكتب WHO criteria بتاعة الـ ET"
    status: unverified
    steps:
      - kind: explain
        page: 133
        title: "يعني إيه MPN؟"
        quote: "clonal disorders of hemopoietic stem cells that lead to an increase in the numbers of one or more mature blood cell progeny."
        text: |
          الـ **myeloproliferative neoplasms** هي ==clonal disorders of hemopoietic stem cells==: خلية جذعية واحدة اتعيّبت، وولادها بقوا **كتير** بس **mature** وشغالين.

          يعني مش زي الـ acute leukemia (blasts مش بتنضج). هنا الإنتاج زيادة في **خط أو أكتر**.
      - kind: explain
        page: 133
        title: "الـ classical three"
        quote: "Polycythemia vera (PV) Essential thrombocythemia (ET) Primary myelofibrosis (PMF)"
        text: |
          الـ **classical BCR/ABL-negative MPNs** تلاتة:
          - **Polycythemia vera (PV)**: كرات حمرا كتير
          - **Essential thrombocythemia (ET)**: صفائح كتير
          - **Primary myelofibrosis (PMF)**: النخاع بيتليّف

          جمّعهم **William Dameshek** سنة **1951**. وكلمة ==BCR/ABL-negative== معناها إننا شلنا الـ CML من القايمة.
      - kind: aside
        tone: exam
        page: 133
        quote: "can transform, in their course, into one another. They also have, to varying degrees, the potential to transform into acute myeloid leukemia (AML)."
        text: |
          التلاتة بيشتركوا في **clinical, morphological and molecular features**، وممكن ==يتحولوا لبعض==، وكمان لـ **AML** بدرجات مختلفة.

          سؤال «disease progression» في آخر المحاضرة بيبدأ من الجملة دي.
      - kind: explain
        page: 133
        title: "الطفرات: مين عنده إيه؟"
        quote: "Approximately half the cases of ET carry the JAK2 V617F mutation (55%), as do half the cases of PMF and nearly all cases of PV."
        text: |
          - ==JAK2 V617F==: **nearly all PV**، و **حوالي النص** في ET (55%) وفي PMF.
          - **CALR** (calreticulin): حوالي **30%**، في الـ ET والـ PMF اللي JAK2 عندهم سليم.
          - **MPL** (الـ **thrombopoietin receptor**): حوالي **5%**.

          والـ **JAK2** gene قاعد على **9p24** (short arm of chromosome 9).
      - kind: figure
        page: 134
        quote: "Distribution of JAK2, MPL, and CALR mutations"
        title: "توزيع الطفرات في التلاتة"
        alt: "Three horizontal stacked bars. PV is almost entirely JAK2 with a thin unmutated sliver. ET is about 55% JAK2, 30% CALR, 5% MPL and the rest unmutated. PMF is about half JAK2, a large CALR block, a small MPL block and a thin unmutated sliver."
        caption: "الأطوال تقريبية من شكل الكتاب (Klampfl 2013). افتكر: ==PV = JAK2== تقريبًا كله، والـ CALR يظهر بس في ET و PMF."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="22" class="t-sm t-b">PV</text>
            <rect x="50" y="10" width="255" height="20" class="fg-dot-acc"/>
            <rect x="305" y="10" width="15" height="20" class="fg-thin"/>
            <text x="150" y="44" text-anchor="middle" class="t-sm">JAK2: nearly all</text>
            <text x="10" y="92" class="t-sm t-b">ET</text>
            <rect x="50" y="80" width="148" height="20" class="fg-dot-acc"/>
            <rect x="198" y="80" width="81" height="20" class="fg-bad"/>
            <rect x="279" y="80" width="14" height="20" class="fg-good"/>
            <rect x="293" y="80" width="27" height="20" class="fg-thin"/>
            <text x="124" y="114" text-anchor="middle" class="t-sm">JAK2 55%</text>
            <text x="238" y="114" text-anchor="middle" class="t-sm">CALR 30%</text>
            <text x="300" y="128" text-anchor="middle" class="t-sm">MPL 5%</text>
            <text x="10" y="172" class="t-sm t-b">PMF</text>
            <rect x="50" y="160" width="140" height="20" class="fg-dot-acc"/>
            <rect x="190" y="160" width="100" height="20" class="fg-bad"/>
            <rect x="290" y="160" width="18" height="20" class="fg-good"/>
            <rect x="308" y="160" width="12" height="20" class="fg-thin"/>
            <text x="120" y="194" text-anchor="middle" class="t-sm">JAK2 ~half</text>
            <text x="240" y="194" text-anchor="middle" class="t-sm">CALR</text>
            <text x="299" y="208" text-anchor="middle" class="t-sm">MPL</text>
            <rect x="50" y="222" width="12" height="12" class="fg-dot-acc"/>
            <text x="66" y="232" class="t-sm">JAK2</text>
            <rect x="110" y="222" width="12" height="12" class="fg-bad"/>
            <text x="126" y="232" class="t-sm">CALR</text>
            <rect x="170" y="222" width="12" height="12" class="fg-good"/>
            <text x="186" y="232" class="t-sm">MPL</text>
            <rect x="225" y="222" width="12" height="12" class="fg-thin"/>
            <text x="241" y="232" class="t-sm t-mut">unmutated</text>
          </svg>
      - kind: mnemonic
        page: 133
        quote: "Many JAK2-unmutated patients with ET or PMF harbor mutations in calreticulin (CALR) (30%) and a small proportion (5%) carry mutations of the thrombopoietin receptor (MPL)."
        word: "JCM"
        parts:
          - { key: "J", text: "JAK2 V617F: nearly all PV, about half of ET (55%) and PMF" }
          - { key: "C", text: "CALR: about 30%, only in JAK2-unmutated ET and PMF" }
          - { key: "M", text: "MPL (thrombopoietin receptor): about 5%" }
        hook: "**J-C-M** بالترتيب من الأكتر للأقل: **55 / 30 / 5**. والـ PV ما بيظهرش غير في الـ J."
      - kind: reveal
        page: 133
        quote: "a small proportion (5%) carry mutations of the thrombopoietin receptor (MPL)."
        prompt: "ليه طفرة في الـ MPL بالذات تعمل صفائح كتير؟"
        answer: |
          الـ **MPL** هو **thrombopoietin receptor**، والـ TPO هو الإشارة الأساسية اللي بتقول للـ megakaryocyte «اكبر واعمل صفائح».

          لو الـ receptor بقى شغال على طول من غير TPO، الـ megakaryocytes تفضل تتكاثر. (ده تفسير فسيولوجي؛ الكتاب بيقول بس إن MPL هو الـ TPO receptor.)
      - kind: check
        page: 133
        quote: "as do half the cases of PMF and nearly all cases of PV."
        question: "Which MPN carries JAK2 V617F in nearly all cases?"
        options: ["Polycythemia vera", "Essential thrombocythemia", "Primary myelofibrosis", "CML"]
        answer: 0
        why:
          - "صح: الـ PV تقريبًا كلها JAK2 V617F."
          - "الـ ET حوالي النص بس (55%)."
          - "الـ PMF كمان حوالي النص."
          - "الـ CML هي BCR-ABL1 ومش من الـ BCR/ABL-negative MPNs أصلًا."
      - kind: explain
        page: 135
        title: "الـ ET: مين وإمتى؟"
        quote: "The median age at onset is 50–55 years, with a small second peak in women of reproductive age"
        text: |
          - الـ incidence حوالي **1.5–2.0 لكل 100,000** في السنة، زي الـ PV.
          - الـ median age **50–55 سنة**، ومعاه ==small second peak in women of reproductive age==.
          - نادر في الأطفال.

          الـ peak التاني ده هو اللي هيخلّي موضوع **ET and pregnancy** سؤال مهم بعدين.
      - kind: table
        page: 135
        quote: "Diagnosis of ET requires meeting all four major criteria or the first three major criteria and one of the minor criteria"
        title: "WHO criteria for ET"
        columns: [Criterion, Content]
        rows:
          - ["Major 1", "Platelets ≥450 × 10⁹/L"]
          - ["Major 2", "Marrow: enlarged mature hyperlobulated megakaryocytes; no left shift; very rarely minor reticulin"]
          - ["Major 3", "Not CML, PV, PMF, MDS or other myeloid neoplasm"]
          - ["Major 4", "JAK2, CALR or MPL mutation"]
          - ["Minor", "Clonal marker, or no evidence of reactive thrombocytosis"]
          - ["Diagnosis", "All 4 major, or first 3 major + minor"]
        hide: [[0, 1], [1, 1], [3, 1], [4, 1], [5, 1]]
      - kind: aside
        tone: trap
        page: 135
        quote: "Presence of a clonal marker or absence of evidence for reactive thrombocytosis"
        text: |
          الفخ: «مفيش طفرة يبقى مش ET». غلط!

          الـ **minor criterion** (==absence of evidence for reactive thrombocytosis==) بيقوم مكان الـ major 4. يعني **triple-negative ET** بتتشخص بالـ **exclusion**.
      - kind: figure
        page: 136
        title: "نخاع الـ ET في الكتاب"
        image: { file: hem/L09-et-megakaryocytes.webp, book: true }
        alt: "Book figure: two bone marrow panels in ET. Left, a cellular trephine with scattered large megakaryocytes among fat spaces. Right, a close view of two giant megakaryocytes with deeply lobulated (staghorn) nuclei."
        caption: |
          الـ **megakaryocytes** كبار و **mature** ونواتهم ==hyperlobulated== (فصوص كتير).

          ومفيش زيادة واضحة في خط الـ granulocytes أو الـ erythroid. ده الـ **major criterion 2**.
      - kind: check
        page: 135
        quote: "Diagnosis of ET requires meeting all four major criteria or the first three major criteria and one of the minor criteria"
        question: "Platelets 780, typical ET marrow, BCR-ABL1/JAK2/CALR/MPL all negative, no reactive cause. Diagnosis?"
        options: ["ET (3 major + minor)", "Not ET: no driver mutation", "Reactive thrombocytosis", "PMF"]
        answer: 0
        why:
          - "صح: أول 3 major + الـ minor (مفيش reactive cause) = ET."
          - "الـ minor criterion بيغني عن الطفرة."
          - "اتشال كل سبب reactive."
          - "الـ PMF محتاج atypia و fibrosis grade 2–3."
      - kind: try
        items: [hem.L09.005, hem.L09.006, hem.L09.009, hem.L09.013, hem.L09.018]
    recap:
      - "MPN = clonal stem cell disorder بيزوّد خلايا mature. التلاتة: PV، ET، PMF (Dameshek 1951)."
      - "بيتحولوا لبعض ولـ AML."
      - "J-C-M: JAK2 (كل الـ PV، نص ET و PMF)، CALR 30%، MPL (TPO receptor) 5%. JAK2 على 9p24."
      - "ET: platelets ≥450، megakaryocytes كبار hyperlobulated، استبعد CML/PV/PMF/MDS، طفرة."
      - "التشخيص: 4 major أو 3 + minor. الـ triple-negative = exclusion."
    practice: [hem.L09.001, hem.L09.002, hem.L09.003, hem.L09.004, hem.L09.005, hem.L09.006, hem.L09.007, hem.L09.008, hem.L09.009, hem.L09.010, hem.L09.011, hem.L09.012, hem.L09.013, hem.L09.014, hem.L09.015, hem.L09.016, hem.L09.017, hem.L09.018, hem.L09.019, hem.L09.175]
  # ------------------------------------------------------------------
  - id: hem.L09.lesson2
    title: "صفائح كتير: تجلط، نزيف، ولا مجرد رد فعل؟"
    hook: "الـ ET بتجلّط وبتنزّف في نفس الوقت، وأغلب الصفائح العالية أصلًا مش ET."
    minutes: 10
    pages: [136, 139]
    topics: [et-complications, thrombocytosis]
    goals:
      - "تعرف مضاعفات الـ ET وعوامل خطر التجلط"
      - "تفهم ليه الصفائح فوق 1000 بتنزّف"
      - "تمشي على algorithm الـ thrombocytosis"
    status: unverified
    steps:
      - kind: explain
        page: 136
        title: "التجلط: العدو رقم 1"
        quote: "Thrombotic complications The main cause of morbidity and mortality in ET."
        text: |
          ==Thrombosis== هو **the main cause of morbidity and mortality in ET**.

          - موجود في **15–20%** وقت التشخيص، **arterial أو venous**.
          - الـ **splanchnic thrombosis** أقل من الـ PV غالبًا، ومرتبط جامد بـ **JAK2 V617F**.
      - kind: mnemonic
        page: 136
        quote: "Age over 60 years Prior history of thrombosis."
        word: "CRAWP"
        parts:
          - { key: "C", text: "Cardiovascular risk factors: diabetes, hyperlipidemia, hypertension, smoking" }
          - { key: "R", text: "Reticulin level at diagnosis" }
          - { key: "A", text: "Age over 60 years" }
          - { key: "W", text: "White cell count at diagnosis" }
          - { key: "P", text: "Prior history of thrombosis" }
        hook: "الجلطة بتـ **crawl** (تزحف) في الأوعية: **CRAWP** = خمس عوامل خطر للتجلط في الـ ET."
      - kind: explain
        page: 137
        title: "والنزيف؟ لما الصفائح تعدّي 1000"
        quote: "platelet counts above 1000 X10⁹/L and, in at least some cases, this is due to an acquired von Willebrand disease"
        text: |
          الـ bleeding بيزيد مع **platelets >1000 × 10⁹/L**، وجزء منه سببه ==acquired von Willebrand disease==.

          يعني كل ما الصفائح تزيد قوي، النزيف يبقى أقرب من التجلط. وده هيرجع معانا في قرار الـ aspirin.
      - kind: reveal
        page: 137
        quote: "a decrease in circulating high-molecular-weight multimers caused by adsorption to the surface of the excessive platelets."
        prompt: "إزاي صفائح أكتر تعمل نزيف أكتر؟ مش المفروض العكس؟"
        answer: |
          الـ **high-molecular-weight vWF multimers** (أهم جزء في الـ vWF) بتلزق على **سطح الصفائح الكتير** وتختفي من الدم.

          فيبقى عندك صفائح كتير بس **مفيش vWF كفاية** يلزّقها في جدار الوعاء. النتيجة: **acquired vWD**.
      - kind: aside
        tone: joke
        page: 137
        quote: "caused by adsorption to the surface of the excessive platelets."
        text: "الـ vWF في الـ ET زي الموظف الوحيد في شباك فيه 1000 platelet واقفين طابور: كله ماسك فيه، ومحدش بيخلّص حاجة."
      - kind: explain
        page: 137
        title: "الطحال: صغير أو بيكبر أو بيضمر"
        quote: "Progressive enlargement of the spleen during the course of ET should raise suspicion of evolving myelofibrosis."
        text: |
          - **Splenomegaly** في **10–20%** وقت التشخيص، ونادرًا أكتر من **mild**.
          - لو الطحال ==بيكبر مع الوقت== ← شك في **evolving myelofibrosis**.
          - بعض المرضى الطحال **بيضمر** من **silent microinfarcts**، بس الـ hyposplenism الصريح نادر.
      - kind: figure
        page: 137
        quote: "occurs in 10% of ET patients while transformation to PV is much less common with an incidence of 1-2% over 10 years"
        title: "الـ ET بتروح فين؟"
        alt: "A central ET box with three arrows. A thick arrow to post-ET myelofibrosis labelled 10%. A thin arrow to PV labelled 1-2% over 10 years. A dashed arrow to MDS or AML labelled rare, more with cytogenetic abnormalities and alkylating agents."
        caption: "التحول الأشهر: ==post-ET myelofibrosis== (**10%**). الـ PV نادرة (**1–2% في 10 سنين**)، والـ MDS/AML نادرة وبتزيد مع الـ **alkylating agents**."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L09b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fg-head"/></marker>
              <marker id="L09bb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="115" y="10" width="100" height="40" rx="10" class="fg-acc"/>
            <text x="165" y="35" text-anchor="middle" class="t-b">ET</text>
            <path d="M140 50 L60 140" class="fg-arrow-bad" stroke-width="5" marker-end="url(#L09bb)"/>
            <path d="M165 50 L165 140" class="fg-arrow" marker-end="url(#L09b)"/>
            <path d="M190 50 L270 140" class="fg-thin" marker-end="url(#L09b)"/>
            <text x="78" y="92" text-anchor="end" class="t-sm t-bad t-b">10%</text>
            <text x="172" y="100" class="t-sm">1–2%</text>
            <text x="172" y="114" class="t-sm t-mut">over 10 y</text>
            <text x="252" y="92" class="t-sm t-mut">rare</text>
            <rect x="10" y="145" width="110" height="50" rx="10" class="fg-bad"/>
            <text x="65" y="166" text-anchor="middle" class="t-sm t-b">Post-ET</text>
            <text x="65" y="182" text-anchor="middle" class="t-sm t-b">myelofibrosis</text>
            <rect x="130" y="145" width="70" height="50" rx="10" class="fg-box"/>
            <text x="165" y="175" text-anchor="middle" class="t-sm t-b">PV</text>
            <rect x="210" y="145" width="110" height="50" rx="10" class="fg-box"/>
            <text x="265" y="175" text-anchor="middle" class="t-sm t-b">MDS / AML</text>
            <text x="65" y="215" text-anchor="middle" class="t-sm t-mut">clue: spleen</text>
            <text x="65" y="230" text-anchor="middle" class="t-sm t-mut">keeps growing</text>
            <text x="265" y="215" text-anchor="middle" class="t-sm t-mut">risk up with</text>
            <text x="265" y="230" text-anchor="middle" class="t-sm t-mut">alkylating agents</text>
          </svg>
      - kind: check
        page: 137
        quote: "Progressive enlargement of the spleen during the course of ET should raise suspicion of evolving myelofibrosis."
        question: "ET for 12 years; the spleen, impalpable before, is now 8 cm; Hb 10.1, teardrop cells. Most likely?"
        options: ["Post-ET myelofibrosis", "Transformation to PV", "Splenic microinfarcts", "Acquired vWD"]
        answer: 0
        why:
          - "صح: طحال بيكبر + أنيميا + teardrops = evolving myelofibrosis."
          - "الـ PV هتعلّي الـ Hb مش تنزّله."
          - "الـ microinfarcts بتصغّر الطحال."
          - "الـ acquired vWD بيعمل نزيف، مش طحال."
      - kind: explain
        page: 138
        title: "أغلب الصفائح العالية مش ET"
        quote: "Thrombocytosis is most commonly reactive and secondary to increased levels of circulating cytokines that stimulate thrombopoiesis."
        text: |
          - الطفرة (JAK2 أو CALR أو MPL) بتدّي **positive criterion** في **80–90%** من الـ ET.
          - الـ **triple-negative** = ==diagnosis of exclusion==.
          - و **thrombocytosis is most commonly reactive**: cytokines بتنشّط الـ thrombopoiesis.

          الـ reactive ممكن يعدّي **1000** أحيانًا، وغالبًا الـ **ESR/CRP** عالي، بس مش دايمًا.
      - kind: sort
        page: 139
        quote: "Rebound thrombocytosis Following treatment of immune thrombocytopenic purpura Recovery from chemotherapy"
        prompt: "صنّف كل سبب أو علامة:"
        bins: ["Reactive", "Clonal (MPN)"]
        cards:
          - { text: "Iron deficiency", bin: 0 }
          - { text: "After splenectomy", bin: 0 }
          - { text: "Recovery from chemotherapy", bin: 0 }
          - { text: "Vincristine", bin: 0 }
          - { text: "Rheumatoid arthritis", bin: 0 }
          - { text: "JAK2 V617F positive", bin: 1 }
          - { text: "Hyperlobulated megakaryocytes in marrow", bin: 1 }
          - { text: "CALR mutation", bin: 1 }
        why: "الـ reactive: iron deficiency، blood loss، hyposplenism/splenectomy، surgery، infection، chronic inflammation (vasculitis، IBD، CTD، RA)، malignancy، rebound (بعد ITP أو chemo)، و vincristine. الـ clonal بتبان بطفرة أو بنخاع شكله ET."
      - kind: figure
        page: 139
        quote: "Is an underlying reactive disorder present?"
        title: "Algorithm: صفائح فوق 450,000"
        alt: "Flowchart. Platelets above 450,000 per microlitre. Life-long or family history? Yes: inherited, test THPO or MPL. No: history, exam, smear, ESR and CRP. Reactive disorder present? Yes: reactive, should normalize. No: BCR-ABL, JAK2, marrow, cytogenetics, leading to CML if BCR-ABL positive, MPN if JAK2 positive, and evaluate for MPN or MDS if both negative."
        caption: "سؤالين بالترتيب: ==life-long/family history؟== وبعدين ==reactive cause؟== لو الاتنين لأ، ادخل على الـ clonal work-up."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L09a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fg-head"/></marker></defs>
            <rect x="85" y="5" width="160" height="30" rx="8" class="fg-acc"/>
            <text x="165" y="25" text-anchor="middle" class="t-sm t-b">Platelets &gt;450,000/µL</text>
            <path d="M165 35 V52" class="fg-arrow" marker-end="url(#L09a)"/>
            <rect x="55" y="55" width="220" height="30" rx="8" class="fg-box"/>
            <text x="165" y="75" text-anchor="middle" class="t-sm">Life-long or family history?</text>
            <path d="M110 85 L60 108" class="fg-arrow" marker-end="url(#L09a)"/>
            <path d="M220 85 L260 108" class="fg-arrow" marker-end="url(#L09a)"/>
            <text x="72" y="100" class="t-sm t-mut">yes</text>
            <text x="250" y="96" class="t-sm t-mut">no</text>
            <rect x="5" y="110" width="120" height="44" rx="8" class="fg-good"/>
            <text x="65" y="128" text-anchor="middle" class="t-sm t-b">Inherited</text>
            <text x="65" y="144" text-anchor="middle" class="t-sm">test THPO/MPL</text>
            <rect x="175" y="110" width="150" height="44" rx="8" class="fg-box"/>
