        quote: "When recognized promptly and the offending agent is discontinued most cases resolve without chronic sequalae. Mortality principally depend on the degree of hepatocelluler injury."
        title: "الـ prognosis"
        text: |
          - **Early recognition**: لو اتعرف بدري والدوا وقف، most cases resolve without chronic sequelae.
          - **What decides mortality**: أساسًا ==degree of hepatocellular injury==.
          - **Worst drugs**: 10% mortality للأدوية اللي بتعمل fulminant hepatitis أو toxic steatosis.
          - **Cholestatic**: rarely, if ever بيعمل acute fatalities.
          - **Worst combination**: الـ prognosis worse لما الـ ==jaundice== ييجي مع الـ hepatocellular injury.

          ليه الصفرا مع الـ hepatocellular وحشة؟ التفسير المقبول: الـ bilirubin هنا عالي علشان الخلايا نفسها ماتت ومش قادرة تشيله، مش علشان قناة مسدودة. يعني ضرر كبير. ده نفس منطق الـ Hy's law.
