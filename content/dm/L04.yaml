    status: unverified
    tags: [high-yield]
  - id: dm.L04.011
    kind: card
    topic: cardiorenal
    front: What heart failure qualifies for the +HF arm?
    back: Current or prior symptoms of HF with documented HFrEF or HFpEF.
    src: { page: 39, quote: "Current or prior symptoms of HF with documented HFrEF or HFpEF" }
    status: unverified
  - id: dm.L04.012
    kind: cloze
    topic: cardiorenal
    text: "+CKD in the ADA algorithm: eGFR {{c1::<60}} mL/min/1.73 m² OR albuminuria ACR {{c2::≥30 mg/g}} (3.0 mg/mmol), confirmed by a {{c3::repeat}} measurement."
