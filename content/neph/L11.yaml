    front: Why is post-obstructive AKI more common in the second and third trimesters?
    back: The growing uterus directly compresses the nearby ureters.
    src: { page: 355, quote: "pregnant woman (Fig1). In the first trimester, due to hormonal variations, women commonly experience \"morning sickness\" with an increase in nausea and vomiting as well as poor appetite. Hyperemesis gravidarum, with the associated volume depletion, can result in AKI. Septic abortion is another common cause of AKI, especially in developing counties, and can lead to acute tubular necrosis. Although rare, women may experience a denovo or a flare of glomerulonephritis such as lupus nephritis during pregnancy. Placental rupture and hemorrhage are other causes of prerenal AKI, while posing a considerable risk for maternal mortality. Due to the hypercoagulable nature of pregnancy, women have a high risk of acute cortical necrosis in the setting of severe hypotension. During the second and third trimesters, the causes of AKI are more specific to an isolated pregnancy-related complication. These include preeclampsia, hemolysis, elevated liver enzymes, low platelet count (HELLP) syndrome, acute fatty liver of pregnancy (AFLP), thrombotic microangiopathies like thrombotic thrombocytopenic purpura (TTP) and atypical hemolytic uremic syndrome (aHUS), and urinary tract infection and pyelonephritis. Post-obstructive AKI is more common in the second and third trimester due to the growing uterus (11) directly compressing the nearby ureters. We describe below the important causes of AKI during pregnancy." }
    status: unverified
