      - kind: explain
        page: 25
        quote: "transforming discoveries made in the laboratory and clinic into interventions that improve public health and well being."
        title: "Translational research"
        text: |
          **Translational research (TR)** = تحويل الاكتشافات اللي بتحصل في ==the laboratory and clinic== لـ **interventions** بتحسّن صحة الناس.

          الـ **3 main pillars**:

          - **Bench**: basic biomedical research (المعمل).
          - **Bedside**: clinical research (العيان).
          - **Community**: improved health (الناس).

          بين bench وbedside فيه **T1**، وبين bedside وcommunity فيه **T2** (في رسمة slide 25).
      - kind: figure
