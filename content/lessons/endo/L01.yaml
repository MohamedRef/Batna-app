        title: "الـ gastrinoma"
        text: |
          - ==Most common==: نص الـ entero-pancreatic tumors في MEN 1 (**50%**).
          - **Small & multiple**، وأغلبها في الـ ==duodenum==.
          - **50%** عاملين metastasis وقت التشخيص.
          - **Poor prognosis** لو: pancreatic (مش duodenal)، metastases، gastrin أعلى.

          **التشخيص:** hypergastrinemia + multiple peptic ulcers + high gastric acid output. Imaging: ultrasound (US)، CT/MRI، و portal venous sampling.

          ليه التلاتة مع بعض؟ الـ **gastrin** بينبّه الـ parietal cells تطلّع حمض، فالـ **acid output** يعلى، والحمض الكتير ده يعمل **multiple ulcers**. التفسير المقبول (مش في الكتاب) لـ **portal venous sampling**: الورم صغير جدًا ومش باين في الأشعة، فبناخد عينات gastrin من فروع الوريد البابي، والمكان اللي الـ gastrin فيه أعلى يدلّك على الورم.
