  - id: rheum.L18.lesson3
    title: "الـ 2016 criteria والتحاليل"
    hook: "تلات نقط للـ biopsy، تلاتة للـ anti-Ro، ونقطة لكل اختبار ناشف. محتاج 4."
    minutes: 8
    pages: [305, 306]
    topics: [criteria, investigations]
    goals:
      - "تحسب الـ 2016 ACR-EULAR score وتعرف ليه الأوزان كده"
      - "تعرف الـ inclusion والـ exclusion"
      - "تعرف كل تحليل بيجاوب على أنهي سؤال"
    status: unverified
    steps:
      - kind: explain
        page: 305
        title: "تلات بوابات"
        quote: "2016 ACR-EULAR Classification Criteria for primary Sjögren's Syndrome The classification of SS applies to any individual who meets the inclusion criteria, 1 does not have any condition listed as exclusion criteria, 2 and who has a score ≥ 4 when summing the weights from the following items:"
        text: |
          علشان تصنّف حد **primary Sjögren** بالـ **2016 ACR-EULAR** لازم يعدّي تلات بوابات:

          1. **Inclusion:** عَرَض جفاف واحد على الأقل
          2. **No exclusion**
          3. ==Score ≥4== من البنود الموزونة
      - kind: figure
        page: 305
        quote: "Labial salivary gland with focal lymphocytic sialadenitis and focus score ≥ 1. (score: 3). • Anti-SSA (Ro) + (score: 3)."
        title: "عدّاد النقط"
        alt: "Point counter for the 2016 ACR-EULAR criteria. Two large tiles worth 3 points each: labial gland biopsy with focus score at least 1, and anti-SSA Ro positive. Three small tiles worth 1 point each: ocular staining score at least 5 or van Bijsterveld at least 4, Schirmer at most 5 mm in 5 minutes, unstimulated saliva flow at most 0.1 ml per minute. A bar at the bottom marks the threshold of 4."
        caption: "الـ **biopsy** والـ **anti-Ro** تقال (3 لكل واحد). الاختبارات الوظيفية خفاف (1 لكل واحد). لو المجموع ==4 أو أكتر== يبقى classified."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="15" y="10" width="145" height="80" rx="12" class="fg-acc"/>
            <text x="87" y="40" text-anchor="middle" class="t-lg t-b t-acc">3</text>
            <text x="87" y="62" text-anchor="middle" class="t-sm">Labial biopsy</text>
            <text x="87" y="78" text-anchor="middle" class="t-sm">focus score ≥1</text>
            <rect x="170" y="10" width="145" height="80" rx="12" class="fg-acc"/>
            <text x="242" y="40" text-anchor="middle" class="t-lg t-b t-acc">3</text>
            <text x="242" y="62" text-anchor="middle" class="t-sm">Anti-SSA (Ro)</text>
            <text x="242" y="78" text-anchor="middle" class="t-sm">positive</text>
            <rect x="15" y="105" width="300" height="44" rx="10" class="fg-box"/>
            <text x="35" y="132" class="t-b">1</text>
            <text x="60" y="125" class="t-sm">Ocular staining ≥5</text>
            <text x="60" y="141" class="t-sm t-mut">or van Bijsterveld ≥4, one eye</text>
            <rect x="15" y="157" width="300" height="44" rx="10" class="fg-box"/>
            <text x="35" y="184" class="t-b">1</text>
            <text x="60" y="184" class="t-sm">Schirmer ≤5 mm / 5 min, one eye</text>
            <rect x="15" y="209" width="300" height="44" rx="10" class="fg-box"/>
            <text x="35" y="236" class="t-b">1</text>
            <text x="60" y="236" class="t-sm">Unstimulated saliva ≤0.1 ml/min</text>
            <rect x="15" y="268" width="300" height="50" rx="12" class="fg-good"/>
            <text x="165" y="292" text-anchor="middle" class="t-b t-good">Total ≥4 = primary Sjögren</text>
            <text x="165" y="309" text-anchor="middle" class="t-sm">(with inclusion, no exclusion)</text>
          </svg>
      - kind: reveal
        page: 305
        quote: "Labial salivary gland with focal lymphocytic sialadenitis and focus score ≥ 1. (score: 3)."
        prompt: "ليه الـ biopsy والـ anti-Ro بـ 3 نقط، واختبارات الجفاف بنقطة بس؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الجفاف ممكن يكون من حاجات كتير: سن، أدوية، تكييف، radiation. يعني الـ Schirmer والـ saliva flow بيقولوا "الغدة مش شغالة" بس مش بيقولوا **ليه**.

          الـ **biopsy** (focal lymphocytic sialadenitis) بيوري الـ ==lymphocytes جوّه الغدة== بعينك، والـ **anti-Ro** بيوري الـ autoimmunity في الدم. الاتنين بيثبتوا **آلية المرض** نفسها (ص 302: infiltration و anti-Ro). علشان كده واحد منهم + أي اختبار جفاف = 4.
      - kind: check
        page: 305
        quote: "Schirmer ≤ 5 mm/5min on at least one eye (score: 1).\nUnstimulated whole saliva flow rate ≤ 0.1 ml/min5 (score: 1). 2016 ACR-EULAR Classification Criteria for primary Sjögren's Syndrome Inclusion criteria These criteria are applicable to any patient with at least one symptom of ocular or oral dryness (defined as a positive response to at least one of the following questions:"
        question: "Anti-Ro negative, no biopsy, Schirmer 3 mm/5 min, saliva 0.05 ml/min, ocular staining 6. Score?"
        options: ["3: not classified", "4: classified", "5: classified", "6: classified"]
        answer: 0
        why:
          - "صح: 1 + 1 + 1 = 3. من غير biopsy أو anti-Ro مستحيل توصل 4."
          - "محتاج نقطة كمان، يعني biopsy أو anti-Ro."
          - "مفيش بند 2 نقط."
          - "ده لو الـ anti-Ro positive."
      - kind: explain
        page: 306
        title: "بوابة الدخول: خمس أسئلة"
        quote: "Do you have a recurrent sensation of sand or gravel in the eyes?\nDo you use tear substitutes more than 3 times a day?"
        text: |
          إجابة **«آه» واحدة** تكفي:

          1. **Dry eyes** يوميًا ومزعجة أكتر من **3 months**؟
          2. إحساس **sand or gravel** في العين بيتكرر؟
          3. **Tear substitutes** أكتر من **3 مرات في اليوم**؟
          4. **Dry mouth** يوميًا أكتر من **3 months**؟
          5. بتشرب سوايل علشان ==تبلع الأكل الناشف==؟
      - kind: aside
        tone: analogy
        page: 306
        quote: "Do you frequently drink liquids to aid in swallowing dry food? 2016 ACR-EULAR Classification Criteria for primary Sjögren's Syndrome Exclusion criteria: Prior diagnosis of any of the following conditions would exclude diagnosis of SS:"
        text: "سؤال «بتشرب مية علشان تبلع الـ dry food؟» هو اختبار **العيش الفينو**: لو مش قادر يعدّي الساندويتش من غير كوباية مية، دي إجابة «آه»."
      - kind: sort
        page: 306
        quote: "History of head and neck radiation treatment. • Active Hepatitis C infection (with positive PCR). • Acquired immunodeficiency syndrome. • Sarcoidosis. • Amyloidosis."
        prompt: "مين بيمنع التشخيص (exclusion) ومين لأ؟"
        bins: ["Exclusion", "Not an exclusion"]
        cards:
          - { text: "Head and neck radiation", bin: 0 }
          - { text: "Active HCV (PCR positive)", bin: 0 }
          - { text: "AIDS", bin: 0 }
          - { text: "Sarcoidosis", bin: 0 }
          - { text: "IgG4-related disease", bin: 0 }
          - { text: "Graft versus host disease", bin: 0 }
          - { text: "Rheumatoid arthritis", bin: 1 }
          - { text: "Raynaud phenomenon", bin: 1 }
        why: "الـ exclusions كلها حاجات بتنشّف الغدد أو بتدخل فيها cells لوحدها: radiation، HCV، AIDS، sarcoid، amyloid، graft-versus-host disease (GVHD)، immunoglobulin G subclass 4 (IgG4). الـ RA بيعمل secondary Sjögren، والـ Raynaud مرتبط بـ DR4."
      - kind: explain
        remind: [rheum.L18.052]
        page: 306
        title: "الـ investigations"
        quote: "Investigations\n  Blood tests:\n    ANA.\n    ANTI-SS-A(RO), ANTI-SS-B(LA) positivity.\n  Schrimer test.\n  Ocular surface staining.\n  Salivary gland function scan (parotid scintigraphy).\n  Labial gland biopsy.\n  Sialometery (salivary glands function test).\n  Ultrasonography of the major salivary gland."
        text: |
          - **Blood:** **Antinuclear antibodies (ANA)**، ==anti-SS-A (Ro)== و **anti-SS-B (La)**
          - **Schirmer test** و **ocular surface staining** للعين
          - **Parotid scintigraphy** و **sialometry** لوظيفة الغدة
          - **Labial gland biopsy**
          - **Ultrasonography** للـ major salivary glands

          ليه كل ده؟ لأن كل مجموعة بتجاوب على سؤال مختلف (الخطوة الجاية)، ومفيش تحليل واحد بيشخّص لوحده.
      - kind: reveal
        page: 306
        quote: "Salivary gland function scan (parotid scintigraphy)."
        prompt: "التحاليل دي كتير. كل مجموعة بتجاوب على سؤال إيه؟"
        answer: |
          - **فيه autoimmunity؟** ANA، ==anti-SS-A (Ro)== و anti-SS-B (La). (وده سؤال الكتاب في ص 308: أهم lab markers هم anti-Ro و anti-La.)
          - **العين ناشفة قد إيه؟** Schirmer و ocular surface staining.
          - **الغدة اللعابية شغالة قد إيه؟** sialometry، parotid scintigraphy، ultrasonography.
          - **جوّه الغدة إيه؟** labial gland biopsy.

          يعني كل سؤال ليه تحليل، وده اللي بيخلّيك تختار قبل ما تطلب كله. والسؤال التالت بالذات مهم للعلاج (الدرس الجاي): درجة وظيفة الغدة بتحدد نوع علاج الريق.
      - kind: try
        items: [rheum.L18.042, rheum.L18.045, rheum.L18.049, rheum.L18.052, rheum.L18.053]
    recap:
      - "Inclusion (سؤال واحد) + no exclusion + score ≥4."
      - "Biopsy focus ≥1 = 3، anti-Ro = 3 (آلية المرض)؛ staining/Schirmer/saliva = 1 لكل واحد."
      - "Exclusions: radiation، HCV، AIDS، sarcoid، amyloid، GVHD، IgG4."
      - "Labs: ANA، anti-Ro/La؛ العين: Schirmer، staining؛ الغدة: sialometry، scintigraphy، US، biopsy."
