  - id: neph.L10.lesson2
    title: "Acute TIN: حساسية وصلت للكلية"
    hook: "مضاد حيوي، وبعد أسبوع سخونية وطفح والكرياتينين بيطلع. تعرف تشخّص ده وتعالجه في دقيقة."
    minutes: 8
    pages: [339, 341]
    topics: [atin-causes, atin-picture, atin-labs, atin-mx]
    goals:
      - "تحفظ أسباب الـ acute TIN بـ RAISIN"
      - "تعرف الصورة الإكلينيكية وتحاليل البول حسب الجزء اللي اتضرب"
      - "تعرف العلاج وجرعة الـ steroids"
    status: unverified
    steps:
      - kind: mnemonic
        page: 339
        quote: "Allergic TIN (antibiotics, NSAIDs, thiazide, cimetidine)"
        word: "RAISIN"
        parts:
          - { key: "R", text: "Rejection: acute cellular rejection" }
          - { key: "A", text: "Allergic: antibiotics, NSAIDs, thiazide, cimetidine" }
          - { key: "I", text: "Infection: viral, bacterial, fungal" }
          - { key: "S", text: "Systemic inflammatory: Sjögren, SLE, Wegener's" }
          - { key: "I", text: "Infiltration: lymphoma, leukaemia, sarcoidosis" }
          - { key: "N", text: "No cause: idiopathic 8%" }
        hook: |
          الكلية في الـ acute TIN بتورم، بس افتكرها **زبيبة (RAISIN)** علشان الأسباب الستة. والـ idiopathic بس ==8%==.
      - kind: explain
        page: 340
        title: "شكلها تحت الميكروسكوب"
        quote: "LM showed there is edema associated with an interstitial lymphoplasmocytic, oesinophils and macrophages infiltration"
        text: |
          **بالعين**: الكلية عادية أو ==كبيرة==، والقطاع فيه medullary congestion و necrosis وخرّاجات كتير.

          **بالميكروسكوب**: **edema** في الـ interstitium، مع خلايا lymphocytes و plasma cells و ==eosinophils== و macrophages. الـ eosinophils دي توقيع الحساسية.
      - kind: figure
        page: 340
        quote: "Symptoms can appear after two to fourteen days."
        title: "الحكاية بالترتيب"
        alt: "A timeline: drug started on day 0, then a box at 2 to 14 days, then two boxes below it: the kidney (haematuria, pyuria, polyuria, nocturia, rising creatinine) and the body (fever, chills, flank pain, arthralgia, itchy maculopapular rash, raised liver enzymes, eosinophilia)."
        caption: "الدوا النهارده، والأعراض بعد ==2 لـ 14 يوم==. علامات في الكلية وعلامات في الجسم كله."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="N10b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="5" y="10" width="130" height="40" rx="8" class="fg-acc"/>
            <text x="70" y="35" text-anchor="middle" class="t-b">Drug, day 0</text>
            <path d="M137 30 L188 30" class="fg-arrow" marker-end="url(#N10b)"/>
            <rect x="190" y="10" width="135" height="40" rx="8" class="fg-bad"/>
            <text x="257" y="35" text-anchor="middle" class="t-b">Day 2 to 14</text>
            <path d="M257 52 L257 70" class="fg-arrow" marker-end="url(#N10b)"/>
            <rect x="5" y="72" width="155" height="170" rx="8" class="fg-box"/>
            <text x="15" y="94" class="t-b">Kidney</text>
            <text x="15" y="116" class="t-sm">Haematuria, pyuria</text>
            <text x="15" y="136" class="t-sm">Polyuria, nocturia</text>
            <text x="15" y="156" class="t-sm">Rising urea, creatinine</text>
            <text x="15" y="176" class="t-sm">Protein under 1 g/day</text>
            <text x="15" y="196" class="t-sm">FENa above 1</text>
            <rect x="170" y="72" width="155" height="170" rx="8" class="fg-acc"/>
            <text x="180" y="94" class="t-b">Whole body</text>
            <text x="180" y="116" class="t-sm">Fever, chills</text>
            <text x="180" y="136" class="t-sm">Flank pain</text>
            <text x="180" y="156" class="t-sm">Arthralgia</text>
            <text x="180" y="176" class="t-sm">Itchy maculopapular rash</text>
            <text x="180" y="196" class="t-sm">Raised liver enzymes</text>
            <text x="180" y="216" class="t-sm t-b">Eosinophilia</text>
          </svg>
      - kind: check
        page: 340
        quote: "Systemic manifestations: Fever, chills, flank pain, arthralgia, erythematous,"
        question: "Ten days into amoxicillin: fever, itchy rash, arthralgia, rising creatinine, eosinophils in urine and blood. Diagnosis?"
        options:
          - "Allergic acute TIN"
          - "Acute pyelonephritis"
          - "Minimal change disease"
          - "Analgesic nephropathy"
        answer: 0
        why:
          - "صح: دوا من 2–14 يوم + سخونية وطفح ومفاصل + eosinophilia = allergic acute TIN."
          - "الـ pyelonephritis فيها loin pain و bacteriuria، مش طفح و eosinophils."
          - "الـ minimal change بيجي nephrotic بـ protein كتير، مش سخونية وطفح."
          - "الـ analgesic nephropathy مزمنة، بعد سنين مسكنات."
      - kind: explain
        page: 340
        title: "البول بيقول إيه؟"
        quote: "Proteinuria is usually modest (<1g/day) of low molecular weight protein"
        text: |
          - ممكن **عادي**، بس غالبًا فيه **pyuria** و RBCs و **eosinophils**.
          - **Protein قليل**: أقل من ==1 g/day==، و **low molecular weight** (tubular): lysozyme و β2-microglobulin.
          - **FENa أكتر من 1**.
          - وظايف الكلية: urea و creatinine بيطلعوا **فجأة**.
      - kind: reveal
        page: 340
        quote: "FE of sodium usually more than 1"
        prompt: "ليه الـ FENa في الـ acute TIN أكتر من 1، مع إن الـ prerenal بيبقى أقل؟"
        answer: "في الـ prerenal الـ tubules **سليمة** وماسكة في الـ Na علشان تحافظ على الحجم. في الـ TIN الـ ==tubules نفسها مضروبة==، مش قادرة ترجّع الـ Na، فيهرب في البول."
      - kind: table
        page: 340
        quote: "Glycouria, bicabituria, phosphaturia, aminoaciduria, hypokalemia"
        title: "مين اتضرب؟ البول يقولك"
        columns: [Segment, Urine finding]
        rows:
          - ["Proximal", "Glycosuria, bicarbonaturia, phosphaturia, aminoaciduria, low K"]
          - ["Distal", "High K, sodium wasting, distal RTA"]
          - ["Medulla", "Cannot concentrate urine"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: exam
        page: 340
        quote: "Hyperkalemia, Sodium wasting, DRTA. (DT defects)."
        text: |
          فخ الـ **potassium**: proximal = ==hypokalaemia== (الـ K بيهرب)، و distal = ==hyperkalaemia== (الـ K مش بيطلع). نفس المرض، والـ K عكس بعض حسب المكان.
      - kind: explain
        page: 341
        title: "الأشعة والعلاج"
        quote: "Identification of the responsible drug and Discontinue."
        text: |
          **Ultrasound**: الكلية عادية أو كبيرة. **Isotope scan**: يفرّق الـ ATIN عن باقي أسباب الـ ARF.

          **العلاج**:
          1. تشخيص بدري.
          2. ==اعرف الدوا ووقّفه== (identify the responsible drug and discontinue).
          3. Acute renal impairment: **prednisone 60 mg/day لمدة 10–14 يوم**، أو **methylprednisolone 1 g/day لـ 3 أيام**.
          4. AKI: علاج supportive.
          5. Dialysis.
          6. Renal biopsy.
      - kind: case
        page: 341
        quote: "prednisone 60 mg/day for 10-14days, or 1g"
        stem: "A 45-year-old man on a penicillin for cellulitis has fever, rash and a creatinine rising from 1.0 to 3.2 mg/dL on day 10."
        steps:
          - question: "First step?"
            options: ["Stop the penicillin", "Add a second antibiotic", "Dialysis now", "Restrict fluids"]
            answer: 0
            why: "اعرف الدوا المسؤول ووقّفه. ده أهم خطوة بعد التشخيص."
          - reveal: "Creatinine keeps rising after stopping it."
            question: "Steroid regimen in the book?"
            options: ["Prednisone 60 mg/day for 10–14 days", "Prednisone 10 mg/day for 6 months", "Hydrocortisone 100 mg once", "No steroids ever"]
            answer: 0
            why: "Prednisone 60 mg/day لمدة 10–14 يوم، أو methylprednisolone 1 g/day لـ 3 أيام."
      - kind: try
        items: [neph.L10.021, neph.L10.031, neph.L10.033, neph.L10.038, neph.L10.039]
    recap:
      - "أسباب الـ acute TIN = RAISIN: rejection، allergic، infection، systemic، infiltration، no cause (8%)."
      - "الأعراض بعد 2–14 يوم: hematuria، pyuria، polyuria، سخونية، طفح، مفاصل، eosinophilia."
      - "Protein أقل من 1 g/day و low molecular weight؛ FENa أكتر من 1."
      - "Proximal = low K؛ distal = high K و dRTA؛ medulla = مفيش تركيز."
      - "وقّف الدوا؛ prednisone 60 mg/day لـ 10–14 يوم أو methylprednisolone 1 g/day لـ 3 أيام."
    practice: [neph.L10.021, neph.L10.022, neph.L10.023, neph.L10.024, neph.L10.025, neph.L10.026, neph.L10.027, neph.L10.028, neph.L10.029, neph.L10.030, neph.L10.031, neph.L10.032, neph.L10.033, neph.L10.034, neph.L10.035, neph.L10.036, neph.L10.037, neph.L10.038, neph.L10.039, neph.L10.040, neph.L10.098, neph.L10.103, neph.L10.104]
