            <text x="165" y="540" text-anchor="middle" class="t-sm t-mut">+ jaundice (late, or superimposed injury)</text>
          </svg>
      - kind: explain
        page: 6
        title: "الهرمونات: الكبد مش بيكسر الـ estrogen"
        text: |
          **Decreased estrogen metabolism → hyperestrogenemia**، وده بيفسّر حاجات كتير مرة واحدة:

          - **Hypogonadism و feminization**: small soft testicles، impotence، loss of libido، infertility.
          - **Gynecomastia** و **loss of secondary sexual hair** (chest، axillary، abdomen).
          - في الستات: **amenorrhea**، irregular menstrual bleeding و infertility.
      - kind: explain
        page: 7
        title: "على الجلد"
        text: |
          - **Spider angiomas**: central arteriole حواليه vessels صغيرة شبه العنكبوت، **invariably on the upper half of the body**.
          - **Palmar erythema**: mottled redness of the **thenar and hypothenar eminences**.

          وكمان: **white nails may be present**.
      - kind: aside
        tone: joke
        page: 7
        text: |
          الـ spider angioma عنكبوت محترم: ساكن في **النص اللي فوق** بس، وعمره ما بينزل تحت. لو لقيت «spider» على الرجل، فكّر في حاجة تانية. 🕷️
      - kind: aside
        tone: trap
        page: 6
        text: |
          **Jaundice alone** (في الأسباب الـ non-cholestatic) **is not an early manifestation**. لو مريض cirrhosis اصفرّ فجأة، فكّر إن فيه **superimposed liver injury**.
      - kind: explain
        page: 7
        title: "عدوى وضعف"
        text: |
          - **Infections** أكتر بسبب **bacterial translocation** و **cirrhosis-associated immune dysfunction**.
          - **Bacterial translocation** = passage of bacteria and their products **from the gut to the circulation**، بسبب **intestinal wall hyperpermeability due to PH**.
          - العدوى: UTI، pneumonia، **tuberculous peritonitis**، **SBP** و fungal infections.

          والأكل: المريض في حالة **accelerated starvation** (impaired adaptive response to short periods of fasting). و **sarcopenia** (loss of muscle mass) مرتبطة بـ morbidity و mortality أعلى. أسبابها: protein turnover، energy disposal، **↑ myostatin و ↓ anabolic hormones**، تغيرات lipid و amino acid metabolism، و **hyperammonemia**.
      - kind: match
        page: 6
        prompt: "وصّل كل علامة بسببها:"
        pairs:
          - ["Easy bruising", "Deficient synthesis of clotting factors"]
          - ["Gynecomastia", "Decreased estrogen metabolism"]
          - ["Bacteremia", "Gut bacteria crossing a leaky gut wall"]
          - ["Sarcopenia", "Myostatin up, anabolic hormones down, hyperammonemia"]
          - ["Ascites", "Endogenous vasodilators; PH localizes the fluid"]
      - kind: update
        page: 7
        text: |
          علشان الـ accelerated starvation، الجايدلاين بتنصح ما يفضلش المريض صايم فترات طويلة، وياخد **late evening snack**. الكتاب في المحاضرة دي بيوصف الحالة بس، فلو اتسألت اكتب كلام الكتاب.
        ref: "EASL Clinical Practice Guidelines on nutrition in chronic liver disease, 2019"
      - kind: explain
        page: 8
        title: "Further decompensation و HCC والباقي"
        text: |
          **Further decompensation** = مرحلة أسوأ: PH و circulatory dysfunction بيزيدوا، و **mortality أعلى من first decompensation**. الأحداث اللي بتعرّفها:
          - recurrent variceal bleeding، recurrent HE، **refractory ascites**
          - **SBP**، **HRS-AKI**، bacterial infections، و **ACLF**

          **HCC** شائع مع كل أنواع الـ cirrhosis **except the biliary and cardiac types**. الكبد الـ malignant: enlarged، **hard**، sharp irregular edge، nodular surface، و **arterial bruit** فوق الكتلة، وممكن **hemorrhagic ascites**.

          **Other manifestations**: digital clubbing، **bilateral parotid enlargement**، **Dupuytren contracture**، **pigment gallstones**، و **relative adrenal insufficiency** (↓ cholesterol synthesis و ↑ proinflammatory cytokines).
      - kind: sort
        page: 8
        prompt: "ده first decompensation عادي، ولا حدث بيعرّف further decompensation؟"
        bins: ["Common first decompensation", "Defines further decompensation"]
        cards:
          - { text: "Ascites", bin: 0 }
          - { text: "Hepatic encephalopathy", bin: 0 }
          - { text: "Coagulopathy", bin: 0 }
          - { text: "Refractory ascites", bin: 1 }
          - { text: "Recurrent HE", bin: 1 }
          - { text: "Recurrent variceal bleeding", bin: 1 }
          - { text: "SBP", bin: 1 }
          - { text: "HRS-AKI", bin: 1 }
          - { text: "ACLF", bin: 1 }
        why: "الكلمة السحرية: **recurrent** و **refractory**. الحاجة لما تتكرر أو ما تستجيبش، أو لما تيجي SBP أو HRS-AKI أو ACLF، يبقى further decompensation."
      - kind: explain
        page: 8
        title: "ACLF: الضربة المفاجئة"
        quote: "acute hepatic decompensation in patients with pre-existing chronic liver disease associated with multiorgan failure and high short-term (28-day) mortality"
        text: |
          **ACLF** = **acute hepatic decompensation** في مريض عنده **pre-existing chronic liver disease**، ومعاها **multiorgan failure** و **28-day mortality ≥ 15%**.

          - ممكن تحصل **at any stage**، من compensated لـ decompensated.
          - **Precipitating factors**: acute alcoholic injury، bacterial infections، **HBV reactivation**، AIH flare، superimposed HAV و HEV، GI bleeding، drug hepatotoxicity.
          - **Pathophysiology**: **intense systemic inflammation** (infections، acute liver damage، وغالبًا translocation).
          - **Extrahepatic organ failures**: renal، coagulation، respiratory، circulatory، brain.
      - kind: check
        page: 8
        question: "What separates **ACLF** from an ordinary acute decompensation?"
        options:
          - "Multiorgan failure with a 28-day mortality ≥ 15%"
          - "Jaundice with bilirubin > 3 mg/dL, no organ failure"
          - "Only patients with a previous decompensation get it"
          - "It is triggered only by alcoholic hepatitis"
        answer: 0
        why:
          - "صح: decompensation + **multiorgan failure** + **28-day mortality ≥ 15%**."
          - "الـ jaundice ممكن تحصل في decompensation عادية، ومن غير organ failure مش ACLF."
          - "غلط: ACLF ممكن تيجي **at any stage**، حتى في compensated."
          - "الـ alcohol واحد بس من precipitants كتير (infection، HBV reactivation، bleeding…)."
      - kind: try
        items: [hb.L01.017, hb.L01.026, hb.L01.030]
    recap:
      - "Decompensated = complication واحدة على الأقل؛ ascites أشهر first event."
      - "Hyperestrogenemia: gynecomastia، hypogonadism، hair loss، spiders (upper half)، palmar erythema."
      - "Bruising = ↓ clotting factors؛ infections = bacterial translocation + immune dysfunction."
      - "Further decompensation: **recurrent / refractory**، SBP، HRS-AKI، ACLF."
      - "ACLF: decompensation + multiorgan failure + 28-day mortality ≥ 15%، في أي مرحلة."
