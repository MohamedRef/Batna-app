items:
  # ---------- p130: indications ----------
  - id: dm.L11.001
    kind: enumerate
    topic: indications
    prompt: Current indications for insulin in type 2 DM (Starting and intensifying insulin lecture)?
    points:
      - Initial stabilization of severe hyperglycemia
      - Hyperglycemic crises
      - Pregnancy
      - Significant liver or kidney disease
      - "Stress: ACS, ICU, major surgery, severe infection, corticosteroids"
      - Failure of oral glucose-lowering therapy
    pass: 5
    src: { page: 130, quote: "Initial stabilization of patients with severe hyperglycemia" }
    status: unverified
    tags: [high-yield]
  - id: dm.L11.002
    kind: card
    topic: indications
    front: Which type 2 indication for insulin does this lecture add to the injectable therapy list?
    back: Initial stabilization of patients with severe hyperglycemia.
    src: { page: 130, quote: "Initial stabilization of patients with severe hyperglycemia" }
    status: unverified
  - id: dm.L11.003
    kind: enumerate
    topic: indications
    prompt: What does "insulin therapy" include, per the lecture's definition?
    points:
      - Starting insulin
      - Dose titration so the patient gets the maximum benefit
      - Modifying the regimen (adding or changing) to keep control
    pass: 3
    src: { page: 130, quote: "Modification of an insulin regimen, e.g., adding or changing the therapy to maintain glycaemic control" }
    status: unverified
  # ---------- p131: facts ----------
  - id: dm.L11.004
    kind: card
    topic: facts
    front: "Fact 1 of insulin initiation?"
    back: Type 2 diabetes is a progressive disease that often needs stepwise intensification to keep good control.
    src: { page: 131, quote: "Type 2 diabetes is a progressive disease that often requires stepwise intensification of treatment to maintain good glycemic control." }
    status: unverified
  - id: dm.L11.005
    kind: order
    topic: facts
    prompt: The conventional stepwise treatment approach in type 2 DM (book figure).
    steps:
      - Diet and exercise
      - OAD monotherapy
      - OAD up-titration
      - OAD combination
      - OAD + basal insulin
      - OAD + multiple daily insulin injections
    src: { page: 131, quote: "Diet and exercise OAD monotherapy OAD up-titration OAD combination OAD + basal insulin" }
    status: unverified
  - id: dm.L11.006
    kind: card
    topic: facts
    front: What is wrong with the conventional stepwise approach shown in the figure?
    back: HbA1c spends long periods above goal (around 8–9%+) before each step is added, so control is lost again and again.
    src: { page: 131, quote: "Conventional stepwise treatment approach" }
    status: unverified
  - id: dm.L11.007
    kind: card
    topic: facts
    front: "Fact 2 of insulin initiation?"
    back: Most people with type 2 diabetes will, in time, need insulin.
    src: { page: 131, quote: "Most people with type 2 diabetes will, in time, need insulin therapy." }
    status: unverified
    tags: [high-yield]
  - id: dm.L11.008
    kind: cloze
    topic: facts
    text: "In the figure (Wright 2002), patients needing additional insulin rise from about {{c1::17%}} at year 1 to about {{c2::53%}} at year 6."
    src: { page: 131, quote: "Patients requiring additional insulin (%)" }
    status: unverified
    tags: [numbers]
  # ---------- p131-132: barriers ----------
