      - kind: explain
        page: 205
        quote: "Middle, steep lower portion of curve -> peripheral tissues can withdraw large amounts of O2 for a small drop in PO2 (assists O2 diffusion into tissue)."
        title: "الجزء المفلطح والجزء المنحدر"
        text: |
          الكتاب بيقسم الـ curve لجزئين، وكل واحد ليه شغلانة:

          - **الجزء المفلطح فوق** (الرئة): لو الـ PO2 في الـ alveoli نزل شوية، الـ **loading** على الهيموجلوبين مش بيتأثر. ده أمان.
          - **الجزء المنحدر تحت** (الأنسجة): نزول صغير في الـ PO2 بيخلي الأنسجة **تسحب أكسجين كتير**. ده بيساعد الأكسجين يدخل الأنسجة.
          - **Right shift**: أكسجين أكتر بيتساب للأنسجة، بس ==الـ binding في الرئة بيصعب==. ولو الـ arterial PO2 واطي جدًا أصلًا، الـ shift ده بيبوّظ الـ tissue oxygenation جامد.

          إمتى الـ curve بتروح يمين؟ التفسير المقبول (مش في الكتاب): مع الـ acidosis والـ CO2 العالي والحرارة، يعني بالظبط مريض الـ exacerbation اللي عنده عدوى و CO2 محبوس.
      - kind: figure
        page: 205
        title: "المنحنى بالـ shifts زي ما الكتاب رسمه"
        image: { file: geri/L11-o2-dissociation.webp, book: true }
        alt: "The book's oxyhaemoglobin dissociation curve: saturation from 0 to 100 percent against PO2 from 0 to 100 mmHg, a solid S-shaped curve with dashed curves on either side; the left shift is labelled decreased temperature, decreased 2,3-DPG, decreased hydrogen ion and CO, and the right shift reduced affinity, increased temperature, increased 2,3-DPG and increased hydrogen ion."
        caption: |
          الأصل اللي الرسمة اللي فوق مبسّطاه، وفيه الـ **shifts** اللي الكتاب بيتكلم عنها:

          - **الخط الأسود**: المنحنى العادي؛ مفلطح فوق بعد حوالي 60 mmHg، ومنحدر تحت.
          - **الخط المتقطع على الشمال** (Left shift): حرارة أقل، 2,3-diphosphoglycerate أقل، H⁺ أقل، و CO: الـ hemoglobin ماسك الأكسجين أكتر.
          - **الخط المتقطع على اليمين** (==Right shift==، reduced affinity): حرارة أعلى، 2,3-diphosphoglycerate أعلى، H⁺ أعلى.

          اللي تاخده: الـ right shift بيدّي الأنسجة أكسجين أكتر، بس لو الـ PaO2 واطي جدًا ==بيصعّب الـ loading في الرئة==، وده اللي الكتاب بيحذّر منه.
      - kind: reveal
        page: 205
        quote: "Other point: target is saturation 88-92 %… Yet if you have saturation 90 %( within target ) yet PaO2 is 60 mmHg or less this is still CRITICAL as it lies on the critical point of starting steep part of the curve."
        prompt: "المريض الـ saturation بتاعه 90%، يعني جوه الـ target. ليه الكتاب بيقول ده لسه ممكن يبقى critical؟"
        answer: "لأن 90% تساوي PaO2 حوالي **60 mmHg**، وده ==أول الجزء المنحدر==. أي نزول بسيط بعدها هيوقع الـ saturation بسرعة. وكمان الـ pulse oximetry مش بيقيس PaO2، وعلى الأوكسجين ممكن الـ PaO2 ينزل من 140 لـ 65 قبل ما الـ saturation يتحرك."
      - kind: check
