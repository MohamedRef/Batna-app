        quote: "Small, hemodynamically insignificant pericardial effusion can be detected by CT scanning in up to 35% of patients with ADPKD.\nOthers Cyst formation has been described in such diverse organs as the pancreas, seminal vesicles, and arachnoid membrane (Fig. 44.7). Seminal vesicle cysts, usually multiple and bilateral, are found in 40% of ADPKD compared with 2% of non affected males. Ovarian cysts are not associated with ADPKD. Pancreas and arachnoid membrane cysts are present in 5% and 8% of patients, respectively. Pancreatic cysts are almost always asymptomatic, with rare occurrences of recurrent pancreatitis tumor or carcinoma. Epididymal and prostate cysts also may occur with increased frequency. Sperm abnormalities with defective motility are common in ADPKD and rarely may be a cause of male infertility.\nSpinal meningeal diverticula may occur with increased frequency and rarely manifest with intracranial hypotension (orthostatic headache, diplopia, hearing loss, ataxia) caused by cerebrospinal fluid leak. The prevalence of colonic and duodenal diverticula also may be increased."
