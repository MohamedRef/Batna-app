  # ---------- p194-197: nail-patella syndrome ----------
  - id: neph.L07.194
    kind: enumerate
    topic: nps
    prompt: Define nail-patella syndrome by its features.
    points:
      - Autosomal dominant
      - Hypoplastic or absent patellae
      - Dystrophic nails
      - Elbow dysplasia
      - Iliac horns
      - Renal disease
    pass: 5
    src: { page: 194, quote: "characterized by hypoplasia or absence of the patellae, dys-trophic nails, dysplasia of the elbows and iliac horns, and renal disease" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.195
    kind: card
    topic: nps
    front: Which gene causes nail-patella syndrome?
    back: LMX1B, a LIM homeodomain transcription factor important for limb and kidney development.
    src: { page: 194, quote: "NPS is caused by mutations in the LIM homeodomain transcription factor LMX1B" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.196
    kind: card
    topic: nps
    front: Describe the kidney disease of nail-patella syndrome.
    back: Clinically apparent in fewer than half; usually benign, with 3–5% risk of ESRD. Appears in adolescence or young adulthood as microhematuria and mild proteinuria (sometimes nephrotic syndrome and mild hypertension).
    src: { page: 195, quote: "The nephropathy is usually benign, with an approximately 3% to 5% risk for progression to ESRD." }
    status: unverified
    tags: [numbers]
  - id: neph.L07.197
    kind: card
    topic: nps
    front: What does EM show in nail-patella syndrome?
    back: Multiple irregular lucencies of the GBM (moth-eaten), sometimes with cross-banded collagen fibrils best seen with phosphotungstic acid. EM is required for diagnosis; light microscopy is nonspecific.
    src: { page: 195, quote: "EM shows multiple irregular lucencies of the GBM, giving it a moth-eaten appearance" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.198
    kind: cloze
    topic: nps
    text: "In nail-patella syndrome, patellae are absent or hypoplastic in over {{c1::90%}}, iliac horns (pathognomonic) occur in about {{c2::80%}}, and nail changes in about {{c3::98%}}."
    src: { page: 196, quote: "In about 80% of patients, osseous processes project posteriorly from the iliac wings (iliac horns), which is pathog-nomonic" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.199
    kind: card
    topic: nps
    front: Describe the nail changes of nail-patella syndrome.
    back: "Bilateral and symmetric, fingernails more than toenails: absent or dystrophic nails with discoloration, koilonychia, longitudinal ridges or triangular lunulae."
    src: { page: 197, quote: "The nails may be absent or dystrophic with discoloration, koil-onychia, longitudinal ridges, or triangular lunulae." }
    status: unverified
  - id: neph.L07.200
    kind: card
    topic: nps
    front: What are the treatment and transplant points in nail-patella syndrome?
    back: No specific therapy. It does not recur in transplanted kidneys, but living related donors must be carefully checked for NPS (autosomal dominant).
    src: { page: 197, quote: "careful evaluation of potential living related kidney donors for features of NPS is essential" }
    status: unverified
  - id: neph.L07.201
    kind: mcq
