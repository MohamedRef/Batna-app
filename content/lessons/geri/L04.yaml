  - id: geri.L04.lesson8
    title: "الـ delirium ولا dementia ولا depression؟ وإزاي تعالجه"
    hook: "تلات Ds شبه بعض من بعيد، والـ attention والـ onset هما اللي بيفرقوهم. والعلاج بيبدأ بالنضارة والسماعة قبل الـ haloperidol."
    minutes: 9
    pages: [74, 76]
    topics: [three-ds, delirium-treatment]
    goals:
      - "تفرّق delirium وdementia وdepression بالـ onset والـ attention"
      - "تطبّق الـ non-pharmacologic measures لكل risk factor"
      - "تكتب جرعة الـ haloperidol صح وتعرف ليه"
    status: unverified
    steps:
      - kind: table
        page: 74
        quote: "Delirium vs. Dementia vs. Depression\n| Features | Delirium | Dementia | Depression |\n|---|---|---|---|\n| Onset | Acute (hours to days) | Insidious (months to years) | Acute or Insidious (wks to months) |\n| Course | Fluctuating | Progressive | May be chronic |\n| Duration | Hours to weeks | Months to years | Months to years |\n| Consciousness | Altered | Usually clear | Clear |\n| Attention | Impaired | Normal except in severe dementia | May be decreased |\n| Psychomotor changes | Increased or decreased | Often normal | May be slowed in severe cases |\n| Reversibility | Usually | Irreversible | Usually |"
        title: "التلات Ds"
        columns: ["", "Delirium", "Dementia"]
        rows:
          - ["Onset", "Hours-days", "Months-years"]
          - ["Course", "Fluctuating", "Progressive"]
          - ["Conscious", "Altered", "Usually clear"]
          - ["Attention", "Impaired", "Normal till severe"]
          - ["Reverse", "Usually", "Irreversible"]
        hide: [[0, 1], [1, 2], [2, 1], [3, 1]]
      - kind: explain
        page: 74
        quote: "Delirium vs. Dementia vs. Depression\n| Features | Delirium | Dementia | Depression |\n|---|---|---|---|\n| Onset | Acute (hours to days) | Insidious (months to years) | Acute or Insidious (wks to months) |\n| Course | Fluctuating | Progressive | May be chronic |\n| Duration | Hours to weeks | Months to years | Months to years |\n| Consciousness | Altered | Usually clear | Clear |\n| Attention | Impaired | Normal except in severe dementia | May be decreased |\n| Psychomotor changes | Increased or decreased | Often normal | May be slowed in severe cases |\n| Reversibility | Usually | Irreversible | Usually |"
        title: "والـ depression فين؟"
        text: |
          الـ ==depression== في نفس الجدول:
          - **Onset** acute أو insidious (أسابيع لشهور)، وممكن تبقى **chronic**.
          - **Consciousness clear**، الـ attention ممكن تقل.
          - **Psychomotor** ممكن يبطأ في الحالات الشديدة.
          - **Usually reversible**.

          ليه ده مهم؟ لأن الاكتئاب عند الكبير ممكن يبان «نسيان» (مش مركّز، بطيء، مش مهتم)، بس الـ **consciousness clear** وغالبًا **reversible** مع العلاج. يعني ماتكتبش dementia قبل ما تستبعد الاكتئاب.
      - kind: aside
        tone: tip
        page: 74
        quote: "Delirium versus Dementia\n| Delirium | Dementia |\n|---|---|\n| Rapid onset | Insidious onset |\n| Primary defect in attention | Primary defect in short term memory |\n| Fluctuates during the course of a day | Attention often normal |\n| Visual hallucinations common | Does not fluctuate during day (Dementia with Lewy bodies does!) |\n| Often cannot attend to MMSE or clock draw | Visual hallucinations less common |\n| Psychomotor activity varied | Can attend to MMSE or clock draw, but cannot perform well |\n| Triggering factor! | |\n| Reversible | |\n(modified from Lipowski 1990 and Mulligan and Fairweather 1997)."
        text: "أسرع فرق على السرير: اديله **clock draw**. الـ delirious **cannot attend** أصلًا (سرحان، مش مركز). الـ dementia **can attend but cannot perform well** (مركز معاك بس الساعة طالعة غلط). والـ **Lewy bodies** هي الـ dementia الوحيدة اللي بتـ fluctuate."
      - kind: explain
        page: 74
        quote: "Visual hallucinations common"
        title: "ليه الـ delirium بيشوف حاجات؟"
        text: |
          جدول **delirium versus dementia** في الكتاب بيضيف فروق مش في جدول التلات Ds:
          - الـ delirium: **rapid onset**، الـ **primary defect in attention**، بيـ fluctuate في اليوم، **visual hallucinations common**، وفيه **triggering factor**، و**reversible**.
          - الـ dementia: insidious، الـ **primary defect in short term memory**، الـ attention غالبًا normal، مش بيـ fluctuate (إلا الـ Lewy bodies)، والـ hallucinations أقل.

          ليه الـ hallucinations بصرية في الـ delirium؟ التفسير المقبول (مش في الكتاب): المخ اللي انتباهه واقع بيفسّر اللي بيشوفه غلط، خصوصًا في الضلمة وبالليل: الهدوم على الشماعة تبقى شخص. وعلشان كده الإضاءة والنضارة جزء من العلاج. وكلمة **triggering factor!** بعلامة تعجب في الكتاب معناها: لو قلت delirium ومالقيتش السبب، لسه ماخلصتش.
      - kind: check
        page: 74
        quote: "Primary defect in attention"
        question: "An 80-year-old is alert and her attention is intact; she attends fully to the clock draw but draws it wrongly. Her decline has been gradual over 2 years. Most likely?"
        options: ["Dementia", "Delirium", "Depression", "Normal ageing"]
        answer: 0
        why:
          - "صح: insidious onset، الـ attention سليمة، can attend but cannot perform well."
          - "الـ delirium: rapid onset والـ primary defect in attention، فمش هتقدر تركز في الاختبار أصلًا."
          - "الاكتئاب ممكن، بس الرسم الغلط مع التدهور التدريجي أقرب للـ dementia."
          - "تدهور على سنتين لحد ما الرسم يبوظ مش طبيعي."
      - kind: explain
        page: 75
        quote: "Treatment\n  i) Non Pharmacologic\n    Should be used in all delirious Patients and usually are successful for symptom management\n  ii) Pharmacologic\n    Should be reversed in patients in whom the delirium symptoms may result in interruption of needed medical therapy"
        title: "العلاج: من غير دوا الأول"
        text: |
          ==Non-pharmacologic== لكل delirious patient، وغالبًا بينجح:
          - **Cognitive impairment**: reality orientation، therapeutic activities.
          - **Sleep**: noise reduction، ونظّم أدوية وإجراءات الليل.
          - **Immobilisation**: early mobilisation، وشيل الـ **bladder catheter**.
          - **Psychoactive drugs**: قلّل الـ as-needed.
          - **Vision/hearing**: النضارة والسماعة.
          - **Dehydration**: volume repletion بدري.

          والدوا بس لو الأعراض هتوقف علاج ضروري.

          ليه كل إجراء؟ الكتاب حاططهم في جدول **risk factor ← intervention**، يعني كل إجراء بيشيل سبب: الـ reorientation للـ **cognitive impairment**، تقليل الدوشة بالليل للـ **sleep deprivation**، الـ early mobilization وشيل الـ catheter للـ **immobilization**، والنضارة والسماعة للـ **vision/hearing impairment** علشان المريض يفهم هو فين. والـ sedatives والـ psychoactive drugs «as needed» بتتقلّل لأنها هي نفسها في جدول أسباب الـ delirium.
      - kind: figure
        page: 75
        quote: "Table 26-3 Delirium risk factors and potential interventions"
        title: "جدول الكتاب: كل risk factor والتدخل بتاعه"
        image: { file: geri/L04-delirium-interventions.webp, book: true }
        alt: "The book's Table 26-3 of delirium risk factors and potential interventions: cognitive impairment, sleep deprivation, immobilization, psychoactive medications, vision impairment, hearing impairment and dehydration, each with its non-drug interventions."
        caption: |
          جدول الكتاب (Table 26-3): العمود الشمال **risk factor** واليمين **interventions**، 7 صفوف:

          - **Cognitive impairment** ← reality orientation وأنشطة.
          - **Sleep deprivation** ← noise reduction، وتظبيط مواعيد الأدوية والإجراءات بالليل.
          - **Immobilization** ← early mobilization وأقل أجهزة تثبيت (زي القسطرة).
          - **Psychoactive medications** ← ==restricted use of "as needed"== sleep and psychoactive medications.
          - **Vision** و **hearing impairment** ← نضارة وإضاءة، وسماعات.
          - **Dehydration** ← early recognition and volume repletion.

          اللي تاخده: كل صف ==non-pharmacologic==، وده ليه الكتاب بيقول تستخدمها مع كل مريض delirium.
      - kind: match
        page: 75
        quote: "Early recognition and volume repletion"
        prompt: "وصّل الـ risk factor بالـ intervention بتاعه:"
        pairs:
          - ["Cognitive impairment", "Reality orientation program"]
          - ["Sleep deprivation", "Noise reduction at night"]
          - ["Immobilization", "Early mobilization"]
          - ["Hearing impairment", "Amplifying devices"]
          - ["Dehydration", "Early recognition and volume repletion"]
        why: "كل intervention بيشيل الـ risk factor اللي قصاده، علشان كده الـ non-pharmacologic بينجح غالبًا من غير دوا."
      - kind: explain
        page: 76
        quote: "ii) Pharmacologic approach\n  Any drug chosen should be given in the lowest dose for the shortest time possible.\n  Neuroleptics are preferred - Haloperidol is the drug of choice.\n  Haloperidol causes less side effects.\n    The recommended starting dose 0.5 to 1 mg of haloperidol orally or parenterally, repeated every 30 min. after the vital signs have been rechecked until sedation has been achieved. The end point should be an awake but manageable patient.\n    A total loading dose of no more than 3 to 5mg of haloperidol."
        title: "الـ haloperidol"
        text: |
          **Lowest dose, shortest time**. الـ ==haloperidol== هو drug of choice (أقل side effects).
          - ابدأ **0.5-1 mg** oral أو parenteral.
          - كرّر كل **30 min** بعد ما تراجع الـ vital signs، لحد sedation.
          - Total loading **3-5 mg** بالكتير.
          - الهدف: **awake but manageable**.
          - Maintenance: **نص الـ loading** مقسوم على 24 ساعة، وبعدين taper.

          ليه الـ haloperidol بالذات؟ الكتاب بيقول **less side effects**. التفسير المقبول (مش في الكتاب): تأثيره الـ anticholinergic قليل ومابيهبطش التنفس، عكس الـ benzodiazepines اللي بتزوّد الـ delirium نفسه. وليه نستنى 30 دقيقة ونراجع الـ vital signs؟ علشان الكبير حساس، والجرعة اللي بتهدّيه ممكن تبقى صغيرة؛ لو اديت كمية كبيرة مرة واحدة هتلاقي مريض نايم مش awake but manageable.
      - kind: reveal
        page: 76
        quote: "Subsequently a maintenance dose consisting of half of the loading dose"
        prompt: "ليه الـ maintenance نص الـ loading مش نفس الجرعة؟"
        answer: "لأن الـ loading هدفه يوصّل المريض لـ **awake but manageable** بسرعة، وبعد كده محتاج تحافظ بس. التفسير المقبول (مش في الكتاب): الـ haloperidol بيتراكم، فلو كرّرت نفس الـ loading كل يوم هيتجمع ويعمل sedation زيادة وside effects. وبعدين **taper** مع ما الـ agitation يخف، لأن السبب نفسه بيتعالج."
      - kind: case
        page: 76
        quote: "ii) Pharmacologic approach\n  Any drug chosen should be given in the lowest dose for the shortest time possible.\n  Neuroleptics are preferred - Haloperidol is the drug of choice.\n  Haloperidol causes less side effects.\n    The recommended starting dose 0.5 to 1 mg of haloperidol orally or parenterally, repeated every 30 min. after the vital signs have been rechecked until sedation has been achieved. The end point should be an awake but manageable patient.\n    A total loading dose of no more than 3 to 5mg of haloperidol."
        stem: "An 84-year-old delirious man keeps pulling out his IV line; he needs IV antibiotics for pneumonia. Non-drug measures are in place."
        steps:
          - question: "First dose?"
            options: ["Haloperidol 0.5-1 mg", "Haloperidol 5 mg IV", "Lorazepam 1 mg", "Restraints"]
            answer: 0
            why: "ابدأ **0.5-1 mg**. الـ benzodiazepines والـ restraints نفسهم بيعملوا delirium."
