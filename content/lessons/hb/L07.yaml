            <text x="170" y="365" text-anchor="middle" class="t-sm">Envelope (HBsAg) from ER, budding</text>
            <path d="M170 376v14" class="fg-arrow" marker-end="url(#L07a)"/>
            <rect x="60" y="392" width="220" height="32" rx="6" class="fg-good"/>
            <text x="170" y="413" text-anchor="middle" class="t-sm t-b">Secretion of new virions</text>
            <path d="M60 300H16V146H56" class="fg-arrow-acc" stroke-dasharray="5 4" marker-end="url(#L07b)"/>
            <text x="20" y="236" class="t-sm t-acc">back</text>
            <text x="20" y="250" class="t-sm t-acc">to</text>
            <text x="20" y="264" class="t-sm t-acc">cccDNA</text>
          </svg>
      - kind: reveal
        page: 113
        prompt: "لو الـ NAs بتوقف الفيروس بالقوة دي، ليه لما نوقفها الـ DNA بيرجع تاني؟"
        answer: |
          بص على الرسمة: الـ NAs بتضرب في **reverse transcription** جوه الـ capsid، يعني بتمنع تصنيع DNA جديد.

          لكن الـ **cccDNA** قاعد في النواة زي نسخة احتياطية، ومش بيتأثر بيها. أول ما الدوا يقف، القالب لسه موجود ويبدأ يطلّع pgRNA من تاني.

          ده المنطق اللي ورا إن علاج كتير من المرضى **long-term** (هتشوفه في درس العلاج).
      - kind: check
        page: 113
        question: "Nucleos(t)ide analogues act on which step of the HBV life cycle?"
        options:
          - "Reverse transcription of pregenomic RNA into DNA"
          - "Formation of cccDNA in the nucleus"
          - "Viral entry through the receptor"
          - "Transcription of cccDNA into RNA"
        answer: 0
        why:
          - "صح: الرسمة بتحط الـ NAs على الـ **negative- and positive-strand DNA synthesis** جوه الـ capsid."
          - "الـ cccDNA بيتكوّن في النواة والـ NAs مش بتمنعه، وعلشان كده الفيروس بيرجع لما العلاج يقف."
          - "الدخول بالـ receptor والـ endocytosis مش ده مكان الـ NAs."
          - "الـ transcription بيحصل من الـ cccDNA في النواة، قبل الخطوة اللي الـ NAs بتوقفها."
      - kind: explain
        page: 114
        title: "بيتنقل إزاي؟"
        text: |
          - **Incubation period: 1 to 4 months**.
          - **Blood borne infection**.
          - **Perinatal transmission** من غير prophylaxis: **85–90%** لو الأم **HBeAg-positive**، و **30%** لو الأم **HBeAg-negative**.
      - kind: reveal
        page: 114
        prompt: "ليه الأم الـ HBeAg-positive بتنقل للطفل أكتر بكتير؟"
        answer: |
          الـ **HBeAg** ماشي مع **replication** عالي، يعني فيروس أكتر في الدم. فيروس أكتر = فرصة انتقال أكبر وقت الولادة.

          وعلشان كده في الحمل هتلاقي القرار كله مبني على **HBV DNA** (هنشوفه في آخر درس).
      - kind: check
        page: 114
        question: "An HBsAg-positive mother asks if she can breastfeed. Per the lecture:"
        options:
          - "Yes: HBsAg is in breast milk, but there is no evidence of transmission by breastfeeding"
          - "No: HBsAg in breast milk transmits the virus"
          - "Only if she is HBeAg-negative"
          - "Only after the baby's third vaccine dose"
        answer: 0
        why:
          - "صح: الكتاب بيقول الـ HBsAg ممكن يتلاقى في اللبن، بس **no evidence** إن الرضاعة بتنقل العدوى."
          - "وجود الـ HBsAg في اللبن مش معناه انتقال؛ الكتاب صريح إن مفيش دليل."
          - "الكتاب مش بيربط الرضاعة بحالة الـ HBeAg."
          - "الكتاب مش بيحط شرط تطعيم قبل الرضاعة."
      - kind: aside
        tone: joke
        page: 114
        text: |
          الـ HBsAg في لبن الأم زي الضيف اللي بييجي الفرح ومش بياكل: **موجود**، بس **مش بيعمل حاجة**. 😄

          فالأم ترضع عادي، والامتحان عايز منك الجملة دي بالظبط.
      - kind: try
        items: [hb.L07.003, hb.L07.004, hb.L07.005, hb.L07.008, hb.L07.009]
    recap:
      - "الـ virion: envelope (**HBsAg**)، capsid (**HBcAg**)، **HBeAg**، **DNA polymerase** والـ DNA."
      - "Genotype **A** = better interferon response. Genotype **C** = late e-seroconversion + more HCC."
      - "الـ **cccDNA** في النواة هو القالب؛ الـ NAs بتوقف الـ reverse transcription بس مش بتشيله."
      - "Incubation **1–4 months**. Perinatal: **85–90%** (HBeAg+) مقابل **30%** (HBeAg−)."
      - "الرضاعة مسموحة: HBsAg في اللبن بس **no evidence** of transmission."
    practice: [hb.L07.001, hb.L07.002, hb.L07.003, hb.L07.004, hb.L07.005, hb.L07.006, hb.L07.007, hb.L07.008, hb.L07.009]

  # ------------------------------------------------------------------
  - id: hb.L07.lesson2
    title: "الـ acute HBV: من دور برد لحد الصفرا"
    hook: "عيان بقى أصفر... وفجأة نفسه اتفتحت وبقى أحسن. ليه؟ وإمتى نخاف ونبدأ antivirals؟"
    minutes: 9
    pages: [114, 116]
    topics: [acute]
    goals:
      - "تعدّ الـ 3 صور الإكلينيكية والـ 3 مراحل للـ classic"
      - "تحفظ الـ 3 علامات اللي بتقول severe acute hepatitis B"
      - "تفهم ليه الـ antivirals مش لكل acute HBV"
    status: unverified
    steps:
      - kind: explain
        page: 114
        title: "تلات صور للمرض"
        text: |
          الـ acute HBV ممكن ييجي بتلات أشكال:

          - **Asymptomatic**: مفيش غير **elevated transaminases**.
          - **Anicteric**: أعراض **GI** وزي الـ **influenza**، ومن غير jaundice.
          - **Classic**: تلات مراحل (prodromal، icteric، convalescent).

          والأهم في الأرقام: حوالي **70%** subclinical أو anicteric، و **30%** بس icteric. يعني اللي بتشوفه أصفر في العيادة هو الأقلية.
      - kind: order
        page: 114
        prompt: "رتّب اللي بيحصل في الـ classic acute hepatitis B:"
        steps:
          - "Prodrome (3–4 days): malaise, fever, anorexia, nausea"
          - "Change of urine colour"
          - "Jaundice and itching (icteric phase, 1–4 weeks)"
          - "Convalescence"
        why: "الكتاب: الـ prodromal **3–4 days**، وبعدين الـ icteric **1–4 weeks** وفيه **change of urine color followed by jaundice and itching**، وآخر حاجة الـ convalescent."
      - kind: aside
        tone: trap
        page: 114
        text: |
          في الـ **icteric phase** العيان **feels generally better** و **appetite returns**، مع إنه أصفر ومعاه **tender hepatomegaly**.

          يعني الصفرا هنا مش معناها إن الحالة بتسوء. لو السؤال وصف إن الصفرا ظهرت والعيان **felt better**، ده الطبيعي في الكتاب.
      - kind: reveal
        page: 114
        prompt: "في الـ prodrome ممكن يطلع **fever، skin rash و arthralgia**. الكتاب بيسميه إيه، وليه بيحصل؟"
        answer: |
          الكتاب بيسميه **serum sickness–like syndrome**.

          التفسير المقبول: الجسم بيعمل antibodies ضد الـ HBsAg وهو لسه كتير في الدم، فيتكوّن **immune complexes** تترسب في الجلد والمفاصل، زي الـ serum sickness بالظبط.
      - kind: explain
        page: 115
        title: "التشخيص بالمعمل"
        text: |
          - **SGOT, SGPT**: بيوصلوا الـ **peak** قبل أو بعد بداية الـ jaundice بـ **1–2 days**، و **> 10 × ULN**.
          - مفيدين في **early diagnosis** وفي اكتشاف الـ **anicteric cases**.
          - **Bilirubin & ALP** عادة عاليين.
          - **PT prolonged**.

          والخبر الحلو: **less than 1%** من الـ acute hepatitis B بيعملوا **acute liver failure**.
      - kind: explain
        page: 115
        title: "العلاج: غالبًا مش هتعمل حاجة"
        text: |
          - **Symptomatic & supportive** هو الأساس.
          - **Antiviral treatment** بس في الـ **severe acute HB**: **lamivudine in double dose**، أو **entecavir**، أو **tenofovir**.

          طب إمتى نسميها severe؟ عندنا 3 علامات.
      - kind: mnemonic
        page: 115
        word: "CPE"
        parts:
          - { key: "C", text: "Coagulopathy: INR > 1.5" }
          - { key: "P", text: "Protracted course: persistent symptoms or marked jaundice for > 4 weeks" }
          - { key: "E", text: "Encephalopathy (hepatic) or ascites" }
        hook: |
          **CPE** زي الـ cytopathic effect في الميكروبيولوجي: لو الفيروس عمل **CPE** في الكبد، يبقى وقت الـ antivirals.
      - kind: case
        page: 115
        stem: "A 29-year-old man has acute hepatitis B. Week 2: ALT 1,600 IU/L, bilirubin 6 mg/dL, INR 1.2, alert, no ascites."
        steps:
          - question: "What is the treatment now?"
            options:
              - "Symptomatic and supportive care"
              - "Entecavir now"
              - "Peginterferon"
              - "Urgent transplant referral"
            answer: 0
            why: "مفيش ولا علامة من **CPE**: الـ INR تحت 1.5، لسه أسبوعين، ومفيش encephalopathy ولا ascites. يبقى supportive."
          - reveal: "Week 5: he is still deeply jaundiced. INR is now 1.7."
            question: "What now?"
            options:
              - "Start an antiviral (entecavir, tenofovir or double-dose lamivudine)"
              - "Keep supportive care only; ALT is falling"
              - "Start corticosteroids"
              - "Give HBIG"
            answer: 0
            why: "بقى **severe**: coagulopathy (INR > 1.5) و protracted (jaundice > 4 weeks). الكتاب بيدي antivirals هنا."
      - kind: reveal
        page: 116
        prompt: "طب ما ندي antivirals لكل acute HBV ونخلص؟ إيه الضرر؟"
        answer: |
          الكتاب بيقول استخدمها **judiciously** لسببين:

          - **Adverse effects**: nephrotoxicity، lactic acidosis، resistance، و withdrawal flare، خصوصًا في **pregnant women، the elderly، and renal impairment**.
          - **المناعة**: نزول الـ HBV proteins بسرعة بدري ممكن يقلل اللي بيتعرض على الجهاز المناعي، فيأثر بالسلب على **immunity against HBV**. يعني إنت كده بتشيل "المدرّب" من قدام المناعة قبل ما تتعلم.
      - kind: explain
        page: 116
        title: "مين بيقلب chronic؟"
        text: |
          - حوالي **90%** من الـ acute infection في **infants** بتبقى chronic.
          - حوالي **10%** بس في **adults**.

          التفسير المقبول: مناعة الطفل لسه **tolerant** وبتتعامل مع الفيروس كأنه من البيت، فمبتطردوش.
      - kind: check
        page: 116
        question: "Roughly what fraction of acute HBV becomes chronic in infants versus adults?"
        options:
          - "90% in infants, 10% in adults"
          - "10% in infants, 90% in adults"
          - "30% in infants, 30% in adults"
          - "85–90% in infants, 30% in adults"
        answer: 0
        why:
          - "صح: الكتاب **90%** للأطفال و **10%** للكبار."
          - "بالعكس: الأطفال هم اللي بيزمنوا."
          - "الـ 30% دي رقم الـ icteric أو انتقال الأم الـ HBeAg-negative، مش الـ chronicity."
          - "الـ 85–90% و 30% دي أرقام **perinatal transmission**، مش التحوّل لـ chronic."
      - kind: try
        items: [hb.L07.011, hb.L07.014, hb.L07.019, hb.L07.021, hb.L07.022]
    recap:
      - "**70%** subclinical/anicteric و **30%** icteric. Classic = prodrome (3–4 days) ثم icteric (1–4 weeks) ثم convalescent."
      - "في الـ icteric phase العيان بيتحسن ونفسه بتتفتح."
      - "Serum sickness–like في الـ prodrome: fever، rash، arthralgia."
      - "Transaminases > 10× ULN، peak حوالين بداية الصفرا. ALF أقل من **1%**."
      - "Severe = **CPE** (INR > 1.5، > 4 weeks، encephalopathy أو ascites) → antivirals."
      - "Chronicity: **90%** infants، **10%** adults."
    practice: [hb.L07.010, hb.L07.011, hb.L07.012, hb.L07.013, hb.L07.014, hb.L07.015, hb.L07.016, hb.L07.017, hb.L07.018, hb.L07.019, hb.L07.020, hb.L07.021, hb.L07.022, hb.L07.079]

  # ------------------------------------------------------------------
  - id: hb.L07.lesson3
    title: "اقرا الـ serology زي جواب"
    hook: "تلات تحاليل بس (HBsAg، anti-HBc، anti-HBs) وتعرف العيان مطعّم ولا خف ولا لسه عيان."
    minutes: 9
    pages: [115, 118]
    topics: [serology, phases]
    goals:
      - "تفهم منحنى الـ acute serology والـ window period"
      - "تحل الـ screening algorithm بتاع الكتاب من غير حفظ أعمى"
      - "تعدّ الـ extrahepatic manifestations"
    status: unverified
    steps:
      - kind: explain
        page: 115
        title: "مين بيظهر الأول؟"
        text: |
          في منحنى الـ acute HBV في الكتاب:

          - **HBsAg** أول واحد يظهر، يعلى، وبعدين ينزل ويختفي.
          - **HBeAg** و **HBV DNA** في الأول، مع فترة الـ replication.
          - **anti-HBc IgM** يطلع مع الأعراض ويفضل لحد ما ينزل بعد شهور.
          - **Total anti-HBc** يطلع ويفضل **مدى الحياة**.
          - **anti-HBs** آخر واحد، بيظهر **بعد** ما الـ HBsAg يختفي.

          الفترة اللي بين اختفاء HBsAg وظهور anti-HBs اسمها **window period**.
      - kind: figure
        page: 115
        title: "خط زمني للـ markers"
        alt: "Schematic timeline over weeks 0 to 36 and beyond. Bars: HBV DNA early, HBsAg from about week 4 to 24, HBeAg early, symptoms in the middle, anti-HBc IgM from about week 8 to 32, total anti-HBc from week 8 continuing for life, anti-HBs from about week 32 continuing. A shaded band between HBsAg disappearance and anti-HBs appearance is labelled window: anti-HBc IgM."
        caption: "رسم تقريبي على منحنى صفحة 115. في الـ **window** الوحيد اللي بيقولك إن فيه عدوى حديثة هو **anti-HBc IgM**."
        svg: |
          <svg viewBox="0 0 330 290" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L07d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
