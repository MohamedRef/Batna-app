        quote: "A value of 100 represents the standard, an equivalent amount of pure glucose."
        text: |
          الـ ==glycemic index (GI)== رقم بيقول الأكل ده بيعلّي السكر قد إيه، مقارنة بالـ **pure glucose = 100**.

          - كارب بيتهضم **بسرعة** ويطلق glucose بسرعة ← **high GI**
          - كارب بيتهضم **ببطء** ← **low GI**

          إيه اللي بيخلي الكارب يتهضم بسرعة أو ببطء؟ التفسير المقبول (مش في الكتاب): الـ **fiber** والـ protein والدهن اللي معاه بيبطّأوه، والطبخ الكتير والطحن (processing) بيسرّعوه لأنهم بيفتحوا النشا للإنزيمات. عشان كده العدس واطي، والبطاطس المشوية عالية، والعصير أعلى من الفاكهة نفسها.
