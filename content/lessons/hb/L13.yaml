          - { text: "Previous biliary surgery", bin: 1 }
          - { text: "Choledocholithiasis", bin: 1 }
          - { text: "Ischemia or trauma", bin: 1 }
          - { text: "Chemotherapy injury of the ducts", bin: 1 }
          - { text: "HIV infection", bin: 1 }
          - { text: "Amyloidosis or Hodgkin's disease", bin: 1 }
        why: "الـ primary: IBD (أو من غيره)، ANCA، والـ ducts intrahepatic و extrahepatic. الـ secondary: سبب واضح من برّه: surgery، stones، trauma، ischemia، chemical/chemotherapy، infection، congenital anomalies، HIV، malignancy، idiopathic adulthood ductopenia، amyloidosis، Hodgkin. وبتمسك perihilar و extrahepatic."
