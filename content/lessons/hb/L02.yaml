      - kind: explain
        page: 26
        quote: "Liver biopsy size, AASLD guidelines:\n  Biopsy of at least 2 – 3 cm in length is recommended\n  Needle of 16-gauge in caliber is recommended\n  Presence of fewer than 11 complete portal tracts may be incorrect in recognition of grading & staging\nEven a 25mm long liver biopsy has 25% rate of discordance for fibrosis staging"
        title: "عيّنة صغيرة من عضو كبير"
        text: |
          الـ **American Association for the Study of Liver Diseases (AASLD)** بتقول الـ biopsy الكويسة:

          - **الطول**: 2–3 cm على الأقل.
          - **الإبرة**: 16-gauge.
          - **Portal tracts**: 11 complete portal tracts على الأقل. أقل من كده ممكن الـ **grading** والـ **staging** يطلعوا غلط.

          ومع ذلك، حتى biopsy طولها 25 mm عندها 25% discordance في الـ fibrosis staging. يعني تقريبًا واحدة من كل أربعة ممكن تدّي stage مختلف عن الحقيقة.

          السبب: التليف مش متوزع بالتساوي، وإنت بتاخد خيط صغير جدًا من كبد وزنه كيلو ونص. زي ما تحكم على بطيخة من لقمة واحدة. ده اللي اسمه ==sampling error==.
