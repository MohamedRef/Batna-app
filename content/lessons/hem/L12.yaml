        page: 199
        quote: "NHL constitutes about 4% of all cancers, and its rate per annum has increased since the 1970's. Incidence increases with age. Male to female ratio is 3:2. The increased incidence is only part due to increased mean age of the population, improvement in diagnosis, the HIV pandemic and immunosuppressive therapy."
        title: "الـ NHL"
        text: |
          مجموعة ==heterogeneous clonal malignant diseases== من الـ lymphoid system.

          - **4%** من كل السرطانات، وبيزيد من السبعينات.
          - بيزيد مع السن؛ M:F **3:2**.
          - الزيادة بس جزء منها من: كبر السن، تحسن التشخيص، الـ **Human immunodeficiency virus (HIV)**، والـ **immunosuppressive therapy**.

          ليه الـ HIV والـ immunosuppression بيزوّدوه؟ لأن المناعة الطبيعية (خصوصًا الـ T cells) هي اللي بتوقف أي B cell بدأت تتكاثر غلط، زي اللي فيها EBV. لما الحارس ينام، الـ clone ده بيكبر. وده الخيط اللي هيربط القايمة اللي جاية كلها.
