  - id: res.L05.041
    kind: card
    topic: risk
    front: Define relative risk (risk ratio) and what it indicates.
    back: >-
      RR = incidence among exposed ÷ incidence among unexposed (Ie/Io). It shows the likelihood of developing
      the disease in the exposed relative to the unexposed.
    src: { page: 52, quote: "Measures of Association in Cohort Study: Risk Ratio (Relative risk), Ratio of the incidence among exposed to the incidence among unexposed. Indicates the likelihood of developing the disease in the exposed group relative to those who are not exposed" }
