- id: hb.L18.206
  kind: mcq
  topic: staging
  stem: Which statement about the ALBI grade is correct?
  options:
  - It uses ascites and encephalopathy
  - It uses bilirubin and albumin only
  - Grade III is <= -2.60
  - It replaces BCLC for treatment choice
  - It needs INR
  answer: 1
  why:
  - That is Child-Pugh; ALBI avoids those subjective items.
  - 'Correct: ALBI = (log10 bilirubin x 0.66) + (albumin x -0.085).'
  - Grade I is <= -2.60; grade III is > -1.39.
  - It refines prognosis and stratifies TACE risk.
  - INR is not in the formula.
  src:
    page: 363
    quote: "The linear predictor was calculated to = (log10 bilirubin x 0.66) + (albumin x -0.085), with bilirubin in micromol/L and albumin in g/L."
  status: unverified
