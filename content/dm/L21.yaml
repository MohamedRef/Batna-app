    topic: digestion
    front: Where do chylomicrons go after leaving the intestinal cell?
    back: Into the lacteals, then via lymph to the veins.
    src: { page: 269, quote: "Chylomicrons are secreted into lacteals and then carried via lymph to the veins" }
    status: unverified
