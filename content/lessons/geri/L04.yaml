      - kind: explain
        remind: [geri.L04.053]
        page: 67
        quote: "Preexisting cognitive impairment or dementia"
        title: "الأرضية: predisposing factors"
        text: |
          الـ ==predisposing factors== في الكتاب:
          - **Preexisting cognitive impairment or dementia**.
          - **Severe underlying illness** و**high co-morbidity**.
          - **Functional impairment** و**advanced age**.
          - **Chronic renal insufficiency**.
          - **Dehydration** و**malnutrition**.
          - **Vision or hearing impairment**.

          والـ delirious patients غالبًا عندهم **chronic brain disease**: Alzheimer's، Parkinson's، cerebrovascular disease، space occupying lesions.

          ليه دي «أرضية»؟ التفسير المقبول (مش في الكتاب): كل واحدة بتقلّل احتياطي المخ. الكلى الضعيفة بتخلي الأدوية تتراكم، والنظر والسمع الضعيف بيخلّوا المريض يفسّر المكان غلط ويتلخبط، والـ dehydration بيقلّل الدم الواصل للمخ. فأقل شرارة تكفي.
      - kind: explain
        page: 68
        quote: "Medications, the most common remediable cause of delirium, contribute to delirium in 40% of cases."
        title: "الأسباب"
        text: |
          - ==Medications==: **the most common remediable cause**، بتشارك في **40%**.
          - **Organ failure** (كلى وكبد بالذات).
          - **Hypoxaemia** و**hypercarbia**، **myocardial infarction (MI)** أو **heart failure (HF)**.
          - **Occult infection**: سبب مهم جدًا.
          - **Metabolic**: Na، Ca، acid-base، glucose، thyroid، adrenal.
          - **Dehydration**، **drug/alcohol withdrawal**، **environment**.

          ليه الأدوية أشهر سبب **remediable**؟ لأنها الحاجة الوحيدة اللي في إيدك توقفها النهارده. وليه الـ **occult infection** مهمة؟ التفسير المقبول (مش في الكتاب): لأن الكبير ممكن مايعملش حرارة ولا يشتكي، فالـ UTI أو الـ pneumonia تبان كـ confusion بس.
      - kind: reveal
        page: 68
        quote: "Occult infection is a particularly notable cause of delirium"
        prompt: "ست عندها 85 سنة اتلخبطت فجأة من يومين، مفيش حرارة ولا كحة. ليه لسه بتدوّر على infection؟"
        answer: "لأن الكتاب بيقول **occult infection is a particularly notable cause of delirium**، وoccult يعني مستخبية. التفسير المقبول (مش في الكتاب): المناعة عند الكبير ردها أضعف، فالحرارة ممكن ماتطلعش، والـ confusion يبقى أول علامة وأحيانًا الوحيدة. فاعمل urine analysis وchest X-ray حتى من غير أعراض."
      - kind: aside
        remind: [geri.L04.059]
        tone: exam
        page: 68
        quote: "Table 1. Classes of Commonly Used Medications that May Cause Delirium\nAntiarrhythmics (i.e., quinidine, disopyramide, amiodarone)\nAnticholinergics\nAntidepressants\nAntiepileptics\nAntiparkinson drugs\nAntihistamines (H1 and H2)\nAspirin\nBarbiturates\nBenzodiazepines\nBeta-blockers\nCalcium channel blockers\nChemotherapeutic agents\nCorticosteroids\nDigitalis glycosides\nNon-steroidal anti-inflammatory medications\nOpiates\nQuinolones"
        text: "جدول الأدوية في الكتاب: **anticholinergics**، **antihistamines** (H1 وH2 كمان، يعني حتى الـ cimetidine)، **benzodiazepines**، **opiates**، **corticosteroids**، **digitalis**، **non-steroidal anti-inflammatory drugs (NSAIDs)**، **quinolones**، **beta-blockers**، antiarrhythmics، antiparkinson. أول سؤال قدام أي delirium: **إيه الدوا الجديد؟**"
      - kind: explain
        remind: [geri.L04.061]
        page: 69
        quote: "Numerous risk factors have been described, a recent study identified 5 important independent risk factors:\n  Use of physical restraints\n  Malnutrition\n  Use of a bladder catheter\n  Any iatrogenic event\n  Use of 3 or more medications"
        title: "الـ 5 independent risk factors"
        text: |
          دراسة حددت 5 ==independent risk factors==، وكلهم إحنا اللي بنعملهم في المستشفى:
          - **Physical restraints**.
          - **Malnutrition**.
          - **Bladder catheter**.
          - **Any iatrogenic event**.
          - **3 or more medications**.

          و**dementia** أقوى risk factor ثابت: موجودة في **25-50%** من مرضى الـ delirium.

          ليه الـ 5 دول؟ لأنهم كلهم **قابلين للتعديل**: فك الـ restraint، أكّل المريض، شيل الـ catheter، قلّل الأدوية. والكتاب كمان بيضيف **psychosocial factors**: depression، psychological stress، pain، وقلة الـ social support. التفسير المقبول (مش في الكتاب): الـ restraint بيزوّد الهياج بدل ما يهدّيه، والـ catheter بيربط المريض في السرير وبيفتح باب للعدوى.
      - kind: explain
        page: 69
        quote: "Common Risk Factors for Delirium"
        title: "الأرضية ولا الشرارة؟"
        text: |
          الكتاب بيقسّم الـ ==risk factors for delirium== في جدول لعمودين:
          - **Predisposing** (المريض جه بيها): advanced age، dementia، stroke قديمة، Parkinson، comorbidities، نظر وسمع ضعاف، functional impairment، male sex، alcohol.
          - **Precipitating** (حصلت دلوقتي): مرض حاد جديد، مرض chronic اتلخبط، surgery/anesthesia، دوا psychoactive جديد، acute stroke، pain، تغيير مكان، urine retention أو fecal impaction، electrolytes، dehydration، sepsis.

          ليه التقسيم ده مفيد؟ لأن الـ predisposing غالبًا مش هتغيّرها، فشغلك على الـ precipitating: دوّر عليها وشيلها. وكل ما الأرضية أضعف، الشرارة المطلوبة أصغر.
      - kind: mnemonic
        page: 69
        quote: "Numerous risk factors have been described, a recent study identified 5 important independent risk factors:\n  Use of physical restraints\n  Malnutrition\n  Use of a bladder catheter\n  Any iatrogenic event\n  Use of 3 or more medications"
        word: "RMCI3"
        parts:
          - { key: "R", text: "Restraints (physical)" }
          - { key: "M", text: "Malnutrition" }
          - { key: "C", text: "Catheter (bladder)" }
          - { key: "I", text: "Iatrogenic event (any)" }
          - { key: "3", text: "3 or more medications" }
        hook: "**«رَمْكي 3»**: كل حرف حاجة احنا اللي عملناها للمريض. يعني الـ delirium ده كتير «صناعة مستشفى»."
      - kind: check
        page: 69
        quote: "Common Risk Factors for Delirium\n| Predisposing | Precipitating |\n|---|---|\n| Advanced age | New acute medical problem |\n| Preexisting dementia | Exacerbation of chronic medical problem |\n| History of stroke | Surgery/anesthesia |\n| Parkinson disease | New psychoactive medication |\n| Multiple comorbid conditions | Acute stroke |\n| Impaired vision | Pain |\n| Impaired hearing | Environmental change |\n| Functional impairment | Urine retention/fecal impaction |\n| Male sex | Electrolyte disturbances |\n| History of alcohol abuse | Dehydration |\n|  | Sepsis |"
