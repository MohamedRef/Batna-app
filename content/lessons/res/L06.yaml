          - ["Schools randomised to a hand-washing campaign", "Cluster"]
          - ["Asthma patients take inhaler A then B after a washout", "Crossover"]
          - ["Aspirin or placebo, then beta-carotene or placebo", "Factorial"]
          - ["Each patient stays on drug A or drug B throughout", "Parallel"]
      - kind: aside
        tone: exam
        page: 33
        quote: "An analysis of the 616 RCTs indexed in PubMed during December 2006 found that:\n  78% were parallel-group trials,\n  16% were crossover,\n  2% were split-body,\n  2% were cluster."
        text: |
          رقم ممكن يجي: من **616 RCT** في PubMed (ديسمبر 2006): **parallel 78%**، **crossover 16%**، **split-body 2%**، **cluster 2%**.

          افتكرها كده: الـ parallel هو «الفول» بتاع الـ RCTs، كل يوم على السفرة. والـ split-body والـ cluster «فسيخ شم النسيم»، مرة في السنة. 😄
