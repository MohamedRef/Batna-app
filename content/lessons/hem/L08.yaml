        quote: "Two micro RNAs, MIR 15 and MR16 are located at 13q 14, a region frequently deleted in CLL, both micro RNAs target BCL2 which is overexpressed in CLL."
        text: "الـ **BCL2** زي درع ضد الموت (apoptosis). الـ MIR-15/16 كانوا الإيد اللي بتشيل الدرع. لما الـ 13q14 يتمسح، الإيد تختفي، والخلايا تعيش وتتراكم. ده بالظبط معنى «CLL = خلايا نسيت تموت»."
      - kind: explain
        page: 131
        title: "micro RNA تالت والجينات اللي بتتورث"
        quote: "Another micro RNA that may be important in CLL is MIR 34 a which has very low expression in cases refractory to chemotherapy."
        text: |
          - **MIR-34a**: ==very low== في الحالات الـ **refractory** للـ chemotherapy.
          - **Genetic predisposition**: ست risk loci، أهمها **6p25.3** = جين **interferon regulatory factor 4 (IRF4)** (اسمه القديم multiple myeloma oncogene 1 (MUM1)). ده ==transcription factor== مهم في نمو الـ lymphocytes وتكاثرها وتنظيم المناعة.

          ليه ده بيفسّر الـ familial clustering؟ التفسير المقبول (مش في الكتاب): لو العيلة بتورّث نسخة من IRF4 بتشتغل غلط، الـ lymphocytes عندهم كلهم بتبدأ من نقطة أضعف، فالـ CLL بتتكرر في العيلة.
