  # ---------- p83, p89: refractory hypertension ----------
  - id: neph.L04.022
    kind: card
    topic: refractory
    front: Define refractory (resistant) hypertension.
    back: BP not reduced to target in a compliant patient on optimal triple therapy that includes a diuretic.
    src: { page: 89, quote: "Refractory or Resistant HT is defined when B. P. is not reduced to target levels in compliant patients with optimal triple therapy including diuretic." }
    status: unverified
    tags: [high-yield]
  - id: neph.L04.023
    kind: enumerate
    topic: refractory
    prompt: Main groups of causes of refractory hypertension (p83 table)?
    points:
      - Pseudoresistance
      - Nonadherence to prescribed therapy
      - Volume overload
      - Drug-related causes
      - Concomitant conditions
      - Secondary causes of hypertension
    pass: 5
    src: { page: 83, quote: "Pseudoresistance Nonadherence to prescribed therapy Volume overload Drug-related causes Concomitant conditions Secondary causes of hypertension" }
    status: unverified
    tags: [high-yield]
  - id: neph.L04.024
    kind: enumerate
    topic: refractory
    prompt: Causes of pseudoresistance?
    points:
      - White-coat hypertension
      - Pseudohypertension in older patients
      - Small cuff in obese patients
    pass: 3
    src: { page: 83, quote: "White-coat hypertension Pseudohypertension in older patients Use of small cuff in patients who are obese" }
    status: unverified
  - id: neph.L04.025
    kind: enumerate
    topic: refractory
    prompt: Prescribing errors that make hypertension look refractory?
    points:
      - Doses too low
      - Wrong type of diuretic
      - Inappropriate combinations
      - Drug actions and interactions
    pass: 3
    src: { page: 83, quote: "Doses too low Wrong type of diuretic Inappropriate combinations Drug actions and interactions" }
    status: unverified
  - id: neph.L04.026
    kind: enumerate
    topic: refractory
    prompt: Drugs and substances that cause refractory hypertension (p83)?
    points:
      - Sympathomimetics, nasal decongestants, appetite suppressants, cocaine
      - Caffeine (?)
      - Oral contraceptives and adrenal steroids
      - Licorice (as in chewing tobacco)
      - Cyclosporine and tacrolimus
      - Erythropoietin
      - Antidepressants
      - NSAIDs
    pass: 6
    src: { page: 83, quote: "Cyclosporine, tacrolimus Erythropoietin Antidepressants Nonsteroidal anti-inflammatory drugs" }
    status: unverified
  - id: neph.L04.027
    kind: enumerate
    topic: refractory
    prompt: Concomitant conditions that cause refractory hypertension?
    points:
      - Obesity
      - Sleep apnea
      - Ethanol over 1 oz (30 ml) per day
      - Anxiety and hyperventilation
    pass: 4
    src: { page: 83, quote: "Obesity Sleep apnea Ethanol intake of more than 1 oz (30 mL) per day Anxiety, hyperventilation" }
    status: unverified
  - id: neph.L04.028
    kind: mcq
    topic: refractory
    stem: A 58-year-old kidney transplant recipient on tacrolimus, darbepoetin and ibuprofen for knee pain has BP 162/96 despite amlodipine, perindopril and indapamide at full doses, taken reliably. Which step comes first?
    options:
      - Add a fourth drug immediately
      - Review drug-related causes such as the NSAID, tacrolimus and erythropoietin
      - Diagnose white-coat hypertension
      - Start dialysis
    answer: 1
    why:
      - Before adding drugs, exclude causes of refractory hypertension.
      - "Correct: NSAIDs, cyclosporine/tacrolimus and erythropoietin are drug-related causes of refractory HT (p83)."
      - White-coat hypertension needs out-of-office readings; there is an obvious drug cause here.
      - Hypertension alone is not an indication for dialysis.
    src: { page: 83, quote: "Cyclosporine, tacrolimus Erythropoietin Antidepressants Nonsteroidal anti-inflammatory drugs" }
    status: unverified
  # ---------- p83-84: pathogenesis of essential hypertension ----------
  - id: neph.L04.029
    kind: cloze
    topic: pathogenesis
    text: "Essential (primary) hypertension makes up {{c1::80–90%}} of hypertensive patients; it links genetic and behavioral factors that raise {{c2::vascular resistance}}."
    src: { page: 83, quote: "It represent 80-90%. of HT patients" }
    status: unverified
    tags: [numbers]
  - id: neph.L04.030
    kind: card
    topic: pathogenesis
    front: Why does hypertension run in families?
    back: Shared genetic and environmental factors.
    src: { page: 83, quote: "HT tends to run in families due Shared genetic and environmental factors" }
    status: unverified
  - id: neph.L04.031
    kind: enumerate
    topic: pathogenesis
    prompt: Why is low birth weight associated with later high blood pressure?
    points:
      - Prolonged malnutrition
      - Long-term changes in blood vessel structure
      - Low nephron number
    pass: 3
    src: { page: 83, quote: "Low birth weight is associated with subsequent high blood pressure due to: Prolonged malnutrition Long term changes in B.V. Structure Low Nephron Number" }
    status: unverified
    tags: [high-yield]
  - id: neph.L04.032
    kind: enumerate
    topic: pathogenesis
    prompt: Environmental factors in essential hypertension?
    points:
      - Obesity (overestimated BP, sleep disturbance)
      - Alcohol (large consumers)
      - Sodium intake (major determinant)
      - Stress and pain
    pass: 4
    src: { page: 84, quote: "Sodium intake: it is a major determinant of blood pressure differences." }
    status: unverified
  - id: neph.L04.033
    kind: card
    topic: pathogenesis
    front: What may protect against a high-sodium diet?
    back: A high-potassium diet (there is some evidence).
    src: { page: 84, quote: "There in some evidence that high potassium diet can protect against high soduim diet." }
    status: unverified
  - id: neph.L04.034
    kind: card
    topic: pathogenesis
    front: Is chronic stress a proven cause of sustained hypertension?
    back: No. Stress and pain can raise BP, but the relation of chronic stress to BP is not known.
    src: { page: 84, quote: "Stress and pain can raise blood pressure, but Chronic stress relation to blood pressure is not known." }
    status: unverified
  - id: neph.L04.035
    kind: card
    topic: pathogenesis
    front: Role of the humoral systems (ANS, RAAS, natriuretic peptide, kallikrein–kinin) in essential hypertension?
    back: They regulate short-term BP and take part in the pathogenesis, but are not directly involved in maintaining hypertension.
    src: { page: 84, quote: "play a role in pathophysiological regulation of short term blood pressure and pathogenesis of essential HT but are not directly involved in maintenance of HT." }
    status: unverified
  - id: neph.L04.036
    kind: card
    topic: pathogenesis
    front: Which vasoactive imbalance is listed in essential hypertension?
    back: Vasoconstrictors (endothelin) over vasodilators (NO).
    src: { page: 84, quote: "Imbalance between vasoconstrictors (Endothelin) and vasodilator (NO)" }
    status: unverified
  - id: neph.L04.037
    kind: enumerate
    topic: pathogenesis
    prompt: Features of insulin resistance that go with essential hypertension and are major CVD risk factors?
    points:
      - Hyperinsulinemia
      - Glucose intolerance
      - Low HDL and high triglycerides
      - Central obesity
    pass: 3
    src: { page: 84, quote: "Insulin Resistance Hyper in sulinemia Glucose intolerance" }
    status: unverified
  - id: neph.L04.038
    kind: card
    topic: pathogenesis
    front: What happens to the baroreceptors in essential hypertension?
    back: Their sensitivity changes so they operate at a higher BP level (they reset).
    src: { page: 85, quote: "Baroreceptor sensitivity change which would then operate at a higher BP level" }
    status: unverified
  - id: neph.L04.039
    kind: card
    topic: pathogenesis
    front: What change in the resistance vessels maintains hypertension?
    back: Small arteries and arterioles have thicker walls and a narrower lumen, which raises vascular resistance.
    src: { page: 85, quote: "have increased wall thicknees and reduction of vessel lumen diameter which leads to increased vascular resistance which maintains HT" }
    status: unverified
    tags: [high-yield]
  - id: neph.L04.040
    kind: card
    topic: pathogenesis
    front: Cardiac output in established essential hypertension?
    back: Normal. The raised BP is carried by raised resistance.
    src: { page: 85, quote: "Normal Cardiac output" }
    status: unverified
  - id: neph.L04.041
    kind: enumerate
    topic: pathogenesis
    prompt: Changes in the large vessels in hypertension?
    points:
      - Thick media
      - Increased collagen
      - Secondary calcium deposition
    pass: 3
    src: { page: 85, quote: "Large vessels Thick media Collagen Secondary calcium deposition" }
    status: unverified
  - id: neph.L04.042
    kind: card
    topic: pathogenesis
    front: What does pulse wave velocity measure?
    back: Arterial stiffness; it is inversely related to distensibility.
    src: { page: 85, quote: "Pulse wave velocity, it measures arterial stiffness and is inversely related to distensibility" }
    status: unverified
  - id: neph.L04.043
    kind: card
    topic: pathogenesis
    front: Why does LVH matter in hypertension?
    back: LVH from raised PVR and LV load is a significant prognostic indicator of cardiovascular events.
    src: { page: 85, quote: "LVH resulting from↑ PVR and↑ L.V. Load is a significant prognostic indicator of C.V. events." }
    status: unverified
  - id: neph.L04.044
    kind: card
    topic: pathogenesis
    front: What does loss of arterial compliance cause?
    back: A pronounced arterial pressure wave. Small vessels also rarefy (lower density).
    src: { page: 85, quote: "Loss of compliance → pronounced arterial presure wave." }
    status: unverified
  # ---------- p85-87: complications ----------
  - id: neph.L04.045
    kind: enumerate
    topic: complications
    prompt: End-organ damage of hypertension (p85 figure)?
    points:
      - "Brain: hemorrhage, stroke"
      - "Heart: LVH, CHD, CHF"
      - "Eye: retinopathy"
      - Peripheral vascular disease
      - "Kidney: renal failure, proteinuria"
    pass: 5
    src: { page: 85, quote: "Complications of Hypertension: End-Organ Damage" }
    status: unverified
  - id: neph.L04.046
    kind: cloze
    topic: complications
    text: "Hypertensive patients have a {{c1::sixfold}} increase in strokes, a {{c2::threefold}} increase in cardiac death, and PVD is {{c3::twice}} as common."
    src: { page: 86, quote: "HT patients have a sixfold increase in strokes There is a threefold increase in cardiac death." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L04.047
    kind: card
    topic: complications
    front: Define malignant (accelerated) hypertension.
    back: BP rises rapidly with diastolic BP >120 mmHg, with fibrinoid necrosis of the vessel wall.
    src: { page: 86, quote: "It occurs when BP rises rapidly with diastolic BP > 120, with fibrinoid necrosis of vessel wall." }
    status: unverified
    tags: [high-yield]
  - id: neph.L04.048
    kind: enumerate
    topic: complications
    prompt: What can untreated malignant hypertension lead to?
    points:
      - Progressive renal failure, proteinuria and hematuria
      - Heart failure
      - Aortic dissection
      - Stroke
      - Cerebral edema and hemorrhage
      - Hypertensive encephalopathy
    pass: 5
    src: { page: 86, quote: "Unless treated it may lead to progressive renal failure, proteinuria and hematuria, heart failure, and aortic dissection, stroke" }
    status: unverified
  - id: neph.L04.049
    kind: table
    topic: complications
    title: "Keith–Wagener grades of hypertensive retinopathy"
    columns: [Grade, Findings]
    rows:
      - ["I", "Tortuous arteries with increased reflectiveness (silver wiring)"]
      - ["II", "Grade I + arteriovenous nipping"]
      - ["III", "Grade II + flame-shaped hemorrhages and soft (cotton wool) exudates from small infarcts"]
      - ["IV", "Grade III + papilledema"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 86, quote: "GII: GI + arteriovenous nipping. GIII: GII + flame shaped hemorrhages, soft exudates" }
    status: unverified
    tags: [high-yield]
  - id: neph.L04.050
    kind: card
    topic: complications
    front: Which Keith–Wagener grades are diagnostic of malignant hypertension?
    back: Grades III and IV.
    src: { page: 86, quote: "GIII and IV are diagnostic of malignant HT" }
    status: unverified
    tags: [high-yield]
  - id: neph.L04.051
    kind: mcq
    topic: complications
    stem: A 38-year-old man presents with headache and blurred vision. BP 230/134. Fundoscopy shows flame-shaped hemorrhages and cotton wool spots without disc swelling. What is the Keith–Wagener grade and what does it mean?
    options:
      - Grade I; benign hypertension
      - Grade II; benign hypertension
      - Grade III; diagnostic of malignant hypertension
      - Grade IV; papilledema
    answer: 2
    why:
      - Grade I is silver wiring only.
      - Grade II adds AV nipping, without hemorrhages.
      - "Correct: flame hemorrhages and soft exudates are grade III, and grades III–IV are diagnostic of malignant HT (p86)."
      - Grade IV needs papilledema, which he does not have.
    src: { page: 86, quote: "GIII and IV are diagnostic of malignant HT" }
    status: unverified
