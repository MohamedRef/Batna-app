          Sepsis، crystal synovitis تانية، traumatic arthritis.

          ==Crystals + Gram stain + culture== على نفس العينة = **الطريقة الوحيدة الأكيدة**. وممكن sepsis و gout مع بعض، فماتكتفيش بالبلورة لو المريض شكله septic.

          التفسير المقبول (مش في الكتاب): ليه مانكتفيش بالبلورة؟ عشان المفصل اللي عنده بلورات قديمة ممكن يتلوّث بميكروب، والصورة الاتنين شبه بعض: سخونية وورم و neutrophils كتير. ولو فوّت الـ septic arthritis المفصل ممكن يتدمر في أيام. يعني قاعدة الأمان: نفس العينة تروح للبلورات والـ Gram stain والـ culture مع بعض.
      - kind: explain
        page: 38
        quote: "DCS: urate crystal deposition on articular cartilage surface."
        title: "الجديد: US و DECT"
        text: |
          - **High-resolution ultrasound (US)**: ==double contour sign (DCS)== = urate مترسب على سطح الـ cartilage (خط فوق خط).
          - **Dual-energy computed tomography (DECT)**: صورة 3D، بيبيّن erosions أكتر بكتير، خصوصًا في الـ midfoot والـ spine.
          - مكانه: **second-line** لما الـ polarizing microscopy ماتأكدش التشخيص.

          التفسير المقبول (مش في الكتاب): ليه ده مفيد؟ الـ US و الـ DECT بيشوفوا الـ urate نفسه من غير إبرة، فينفعوا لو المفصل صعب يتسحب منه (زي الـ midfoot) أو لو السحب طلع سلبي. بس عشان مش بيشوفوا البلورة جوه الـ neutrophil ولا بيستبعدوا الـ sepsis، الكتاب بيحطهم second-line مش بديل للميكروسكوب.
      - kind: figure
        page: 38
        title: "الـ double contour sign"
        image: { file: rheum/L02-us-double-contour.webp, book: true }
        alt: "Ultrasound of the left first metatarsophalangeal joint, dorsal longitudinal view. A yellow arrow at the top left points to a bright line lying on top of the dark cartilage over the curved bone surface."
        caption: |
          صورة **ultrasound** لمفصل الصباع الكبير الشمال (Left first MTP joint dorsal long):

          - **السهم الأصفر فوق شمال**: على خط أبيض لامع **فوق** الـ cartilage، موازي لخط العضمة اللي تحته.

          ده الـ ==double contour sign (DCS)==: خطّين أبيض فوق بعض، الفوقاني urate مترسب على سطح الـ cartilage والتحتاني سطح العضمة.
      - kind: figure
        page: 37
        title: "الـ DECT في الرجلين"
        image: { file: rheum/L02-dect-feet.webp, book: true }
        alt: "Dual-energy CT of both feet seen from above. Yellow rectangles over the midfoot and tarsometatarsal region of each foot frame areas of bone erosion."
        caption: |
          صورة **dual-energy CT** للرجلين من فوق، تحت **DECT: It gives a 3D view**.

          - **المستطيلات الصفرا** في النص على الرجلين: على الـ **midfoot**، المكان اللي الكتاب بيقول إنه صعب يتشاف، وفيه ==erosions== كتير.

          يعني الـ DECT بيكشف تآكل في أماكن الـ X-ray العادي بيفوّتها.
      - kind: case
        page: 36
        quote: "In almost all circumstances, arthrocentesis should be performed Synovial fluid analysis for demonstrating negative birefringent crystals in patients with acute gouty arthritis:\n  Sensitivity: 90%.\n  Specificity: 100%.\n    If there are uric acid crystals, then you have gout."
        stem: "A 58-year-old diabetic man on insulin has a hot, red, swollen left knee for 2 days. WBC 11,300 (76% neutrophils), ESR 78, uric acid 8.2 mg/dL, creatinine 2.0 mg/dL. (Book question 1)"
        steps:
          - question: "Most appropriate next step?"
            options: ["Arthrocentesis", "Prednisone and allopurinol", "Knee X-ray", "Lyme serology"]
            answer: 0
            why: "In almost all circumstances, arthrocentesis. الـ uric acid العالي مش تأكيد، والسكري ممكن يكون عنده septic arthritis، والـ steroid قبل ما تنفيه خطر. الـ X-ray غالبًا طبيعي أو nonspecific."
