  # Split from lesson2 on 2026-11-13 (#828): the workup and the mimics.
  - id: rheum.L08.lesson7
    title: "الـ workup واللي بيقلّد الـ vasculitis"
    hook: "قبل ما تكتب steroids لعيان شكله vasculitis، اسأل: ده ممكن يكون endocarditis؟ الغلطة دي بتموّت."
    minutes: 8
    pages: [130, 130]
    topics: [workup]
    goals:
      - "تعرف الـ workup وليه كل test"
      - "تفرّق c-ANCA من p-ANCA"
      - "تعدّ الـ mimics وتفهم ليه كل واحد بيقلّد"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L08.042]
        page: 130
        title: "الـ workup"
        quote: "Laboratory investigations.\nHaemogram.\nUrinalysis.\nSerum proteins.\nAntineutrophil cytoplasmic autoantibodies (ANCA): i. Cytoplasmic ANCA (c-ANCA). ii. Perinuclear ANCA (p-ANCA). iii. Atypical staining (A or x-ANCA)."
        text: |
          - **Haemogram**، **urinalysis** (ما تنساش casts)، serum proteins
          - ==Antineutrophil cytoplasmic antibodies (ANCA)==: **c-ANCA**، **p-ANCA**، و atypical (A أو x-ANCA)
          - Renal و hepatic function، **echo**، **angiography**
          - والأهم: ==organ biopsy==
      - kind: explain
        page: 130
        title: "كل test بيجاوب سؤال"
        quote: "Antineutrophil cytoplasmic autoantibodies (ANCA):"
        text: |
          الـ workup مش قايمة تحفظها، كل test بيجاوب سؤال:
          - **Haemogram**: anaemia (نزيف رئة أو مرض مزمن)، eosinophils (Churg–Strauss).
          - **Urinalysis**: RBCs و **casts** يعني ==glomerulonephritis==، وده بيقلب الخطة لأنه organ-threatening.
          - **Serum proteins**: الالتهاب المزمن والـ cryoglobulins.
          - **ANCA**: **c-ANCA** (cytoplasmic) و **p-ANCA** (perinuclear) و **atypical (A أو x-ANCA)**: بيوجّهك للـ AAV.
          - **Renal و hepatic function**: الكلية للـ GN، والكبد للـ hepatitis B/C اللي بتعمل PAN و cryoglobulinaemia.
          - **Angiography**: الـ aneurysms في الـ medium vessels (PAN) أو التضييق في الـ large (Takayasu).
          - **Echocardiography**: الـ endocarditis (mimic) والقلب نفسه.
          - **Organ biopsy**: الإثبات.
      - kind: reveal
        page: 130
        quote: "Cytoplasmic ANCA (c-ANCA)."
        prompt: "يعني إيه c-ANCA و p-ANCA؟ الفرق في إيه بالظبط؟"
        answer: |
          الاتنين antibodies ضد حاجات جوه الـ **neutrophil**، والاسم جاي من **شكل الـ staining** تحت الـ immunofluorescence:
          - **c-ANCA** = **cytoplasmic**: لون منتشر في الـ cytoplasm كله. الـ antigen بتاعه **proteinase 3 (PR3)** (الكتاب ص 150)، وده بتاع **GPA**.
          - **p-ANCA** = **perinuclear**: لون حوالين النواة. الـ antigen غالبًا **myeloperoxidase (MPO)**، وده بتاع **MPA** (جدول ص 146).

          التفسير المقبول (مش في الكتاب) للشكل: ساعة تثبيت الشريحة بالـ ethanol، الـ MPO لأنه مشحون بيروح يلزق حوالين النواة، فيبان perinuclear.
      - kind: aside
        tone: trap
        page: 130
        quote: "Mimicks of vasculitis\n  Bacterial endocarditis.\n  Antiphospholipid antibody syndrome.\n  Viral infections like HIV, CMV, HBV, HCV etc.\n  Cholesterol emboli syndrome.\n  Vasoconstrictor drugs (ergot poisoning).\n  Hypertensive arteriopathy.\n  Thoracic outlet syndrome.\n    Sepsis, DIC.\n    Sarcoidosis*.\n    Thrombotic thrombocytopenic purpura (TTP).\n  Lymphoma, hairy cell leukaemia."
        text: |
          قبل ما تبدأ steroids، استبعد اللي بيقلّد:
          **Endocarditis**، **antiphospholipid syndrome (APS)**، viruses (HIV، cytomegalovirus (CMV)، Hepatitis B virus (HBV)، Hepatitis C virus (HCV))، **cholesterol emboli**، ergot، hypertensive arteriopathy، thoracic outlet، sepsis/disseminated intravascular coagulation (DIC)، sarcoid، **thrombotic thrombocytopenic purpura (TTP)**، lymphoma و hairy cell leukaemia.

          أخطرهم إنك تدي steroids لـ **endocarditis**: العيان هيتعب جدًا.
      - kind: reveal
        page: 130
        quote: "Bacterial endocarditis."
        prompt: "ليه الـ bacterial endocarditis بالذات أول mimic في القايمة، وليه غلطته خطيرة؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ endocarditis بيعمل **نفس الصورة** بالظبط: fever، weight loss، **splinter haemorrhages**، purpura، hematuria و GN (immune complexes)، و emboli في المخ والكلية والجلد. وممكن كمان يطلّع ANCA إيجابي.

          الخطورة: لو افتكرته vasculitis وإدّيته **steroids** أو **cyclophosphamide**، إنت كده بتقفل المناعة على عدوى في صمام القلب. عشان كده **blood cultures** و **echo** قبل أي immunosuppression.
      - kind: check
        page: 130
        quote: "Mimicks of vasculitis\n  Bacterial endocarditis.\n  Antiphospholipid antibody syndrome.\n  Viral infections like HIV, CMV, HBV, HCV etc.\n  Cholesterol emboli syndrome.\n  Vasoconstrictor drugs (ergot poisoning).\n  Hypertensive arteriopathy.\n  Thoracic outlet syndrome.\n    Sepsis, DIC.\n    Sarcoidosis*.\n    Thrombotic thrombocytopenic purpura (TTP).\n  Lymphoma, hairy cell leukaemia."
        question: "Painful blue toes, livedo and rising creatinine 2 weeks after coronary angiography. Which mimic?"
        options:
          - "Cholesterol emboli syndrome"
          - "Thoracic outlet syndrome"
          - "Ergot poisoning"
          - "Hairy cell leukaemia"
        answer: 0
        why:
          - "صح: الـ catheter كسر plaques فطلعت cholesterol emboli."
          - "الـ thoracic outlet بيأثر على الدراع من compression."
          - "الـ ergot بيعمل vasospasm بعد دوا، مش بعد قسطرة."
          - "مفيش هنا حاجة تشاور على leukaemia."
      - kind: figure
        page: 130
        quote: "Mimicks of vasculitis"
        title: "الطريق من الشك للتشخيص"
        alt: "Flow chart. Step 1: suspect vasculitis from red flags. Step 2: exclude the mimics: endocarditis, antiphospholipid syndrome, viral infection, cholesterol emboli, drugs, TTP, lymphoma. Step 3: tests: blood count, urinalysis for casts, ANCA, kidney and liver function. Step 4: confirm with biopsy or angiography. Step 5: name it by vessel size and organ pattern."
        caption: "شك ← ==استبعد الـ mimics== ← tests ← biopsy أو angiography ← سمّيه بحجم الوعاء."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L08w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fg-head"/></marker></defs>
