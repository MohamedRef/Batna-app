lecture: rheum.L03
lessons:
  # ------------------------------------------------------------------
  # Book order. Ids are never reused: lesson6 (pp 59-60, type I diagnosis
  # and therapy) was split out of lesson3, lesson7 (pp 65-66, type IV) out
  # of lesson5 (#828, 2026-11-13).
  - id: rheum.L03.lesson1
    title: "المناعة لما تزوّدها: أربع أنواع hypersensitivity"
    hook: "المناعة زي البوّاب: من غيرها البيت يتسرق، بس لو اتعصّب زيادة ممكن يكسّر باب الشقة نفسها."
    minutes: 8
    pages: [52, 53]
    topics: [definition, classification]
    goals:
      - "تعرّف الـ hypersensitivity وتعرف تلات أنواع triggers، وليه كل واحد بيأذي"
      - "تحفظ تقسيم Coombs and Gell والـ mechanism بتاع كل نوع"
      - "تفرّق بين antibody-mediated و cell-mediated، وبين type II و type III"
    status: unverified
    steps:
      - kind: explain
        page: 52
        quote: "Hypersensitivity is an exaggerated or inappropriate immune response that causes tissue damage."
        title: "يعني إيه hypersensitivity؟"
        text: |
          الـ adaptive immunity بتحمينا من الميكروبات، بس نفس الـ immune response ممكن تعمل tissue injury.

          ==Hypersensitivity== = immune response **مبالغ فيها أو في غير محلها** وبتعمل tissue damage. والأمراض اللي بتعملها اسمها **hypersensitivity diseases**.

          التفسير المقبول (مش في الكتاب): ليه نفس الجهاز اللي بيحمينا يأذينا؟ عشان الـ immune response مش بتفرّق بين "ميكروب" و"حاجة شكلها غريب". لما تشتغل على حاجة مش ضارة (حبوب لقاح، دوا) أو أكتر من اللازم، أسلحتها نفسها (antibodies، complement، T cells) بتضرب أنسجتنا. يعني المرض هنا من الدفاع مش من الهجوم.
      - kind: explain
        page: 52
        quote: "An infection that cannot be cleared (TB)."
        title: "ليه التلات triggers دول بالذات؟"
        text: |
          الكتاب بيدّي تلات مواقف، وكل واحد فيهم غلطة مختلفة في المناعة:

          - **Infection مش بتتشال (TB)**: الـ response نفسه مناسب، بس الميكروب قاعد، فالمناعة **مش بتبطّل**. الهجوم المستمر هو اللي بيأذي النسيج.
          - **حاجة بريئة من برّه (pollen)**: الـ response **في غير محله**. الـ pollen مش خطر أصلًا، والمناعة بتعامله كعدو.
          - **Autoantigen (DNA في SLE)**: المناعة بتهاجم **حاجة من الجسم نفسه**، وده مش هيخلص لأن الـ antigen موجود دايمًا.

          يعني ==exaggerated== = رد أكبر من اللازم، و **inappropriate** = رد على حاجة ماكانش لازم يترد عليها.
      - kind: match
        page: 52
        quote: "Hypersensitivity can take place in response to:\n  An infection that cannot be cleared (TB).\n  A normally harmless exogenous substance (pollen).\n  An autoantigen (eg DNA in SLE)."
        prompt: "وصّل كل trigger بمثال الكتاب:"
        pairs:
          - ["An infection that cannot be cleared", "TB"]
          - ["A normally harmless exogenous substance", "Pollen"]
          - ["An autoantigen", "DNA in SLE"]
        why: "دي التلات triggers في صفحة 52. لاحظ إن الـ systemic lupus erythematosus (SLE) هيرجع معانا في type III."
      - kind: explain
        page: 52
        quote: "Hypersensitivity reactions are based on the classification of Coombs and Gell into 4 types I, II, III and IV."
        title: "تقسيم Coombs and Gell"
        text: |
          التقسيم على حسب **نوع الـ immune response** و **الـ effector mechanism** اللي بيأذي الخلايا.

          - ==Types I, II, III== = **antibody mediated**.
          - ==Type IV== = **cell mediated** (T cells).

          التفسير المقبول (مش في الكتاب): ليه التقسيم ده مفيد؟ عشان كل نوع بيقولك العلاج بيستهدف إيه: في الـ type I بتقفل الـ mast cell والـ IgE، وفي الـ II و III بتقلل الـ antibody والـ complement، وفي الـ IV بتقفل الـ T cells. وكمان التوقيت بيفرق: الـ antibody الجاهز بيشتغل في دقايق، والـ T cells محتاجة أيام عشان تتجمع.
      - kind: explain
        page: 52
        quote: "Hypersensitivity diseases are commonly classified according to the type of immune response and the effector mechanism responsible for cell and tissue injury."
        title: "ليه نقسّم بالـ mechanism؟"
        text: |
          الكتاب بيقسّم على حسب **نوع الـ immune response** و **الـ effector mechanism** اللي بيأذي.

          التفسير المقبول (مش في الكتاب) لفايدة التقسيم ده: لما تعرف الـ mechanism، بتعرف حاجتين على طول:
          - **التوقيت**: الـ IgE جاهز على الـ mast cell فـ type I بيحصل في **دقايق**، والـ T cells محتاجة تتجمع فـ type IV بياخد **24-72 ساعة** (صفحة 65).
          - **العلاج**: type I بنقفل الـ mediators (antihistamine، adrenaline)، وفي الأنواع التانية بنقلل الـ antibody أو الـ T cell نفسه.

          وأهم تقسيمة: ==I و II و III antibody== و **IV cells**.
      - kind: figure
        page: 53
        quote: "Type I - Immediate hypersensitivity caused by IgE antibodies and mast cells, which is also called type I hypersensitivity."
        title: "الأربع أنواع في صورة واحدة"
        alt: "Four columns. Type I: an allergen bridges two IgE on a mast cell, which degranulates. Type II: IgG bound to a target cell surface antigen, with complement and an NK cell attacking it. Type III: small antigen-antibody complexes stuck to a vessel wall, with neutrophils arriving. Type IV: a T cell meets antigen and releases cytokines that activate a macrophage."
        caption: "I: IgE على الـ mast cell. II: antibody على سطح خلية. III: complexes بتترسب في الأوعية. IV: T cell بتشغّل macrophage."
        svg: |
