  # ---------- p127: basal regimens ----------
  - id: dm.L10.019
    kind: order
    topic: basal
    prompt: Steps of insulin intensification in the basal-based regimens.
    steps:
      - "Basal only: add basal insulin and titrate"
      - "Basal plus: add prandial insulin at the main meal"
      - "Basal-bolus: add prandial insulin as doses required"
    src: { page: 127, quote: "Add prandial insulin at main meal" }
    status: unverified
    tags: [high-yield]
  - id: dm.L10.020
    kind: card
    topic: basal
    front: When do you move from basal only to basal plus?
    back: When HbA1c is still above target although fasting glucose has reached target.
    src: { page: 127, quote: "HbA1c: Above target FBG: Target" }
    status: unverified
  - id: dm.L10.021
    kind: enumerate
    topic: basal
    prompt: How do you start basal-only insulin?
    points:
