  - id: neph.L09.lesson2
    title: "الوصلة والفيزيا: fistula و diffusion و convection"
    hook: "الـ radial artery بيجيب 64 mL/min بس، والفلتر عايز 400. الحل وريد اتعلّم يبقى شريان."
    minutes: 9
    pages: [295, 299]
    topics: [access, transport]
    goals:
      - "تعرف ليه الـ fistula، وامتى graft، وترتيب أماكن الـ catheter"
      - "تفرّق diffusion و convection و adsorption و ultrafiltration"
      - "تصنّف الـ solutes بالحجم، وتعرف الـ low flux من الـ high flux"
    status: unverified
    steps:
      - kind: reveal
        page: 295
        quote: "to give adequate blood flow for the dialyser 250-400ml /min"
        prompt: "ليه مش بنغسل من وريد عادي في الدراع؟"
        answer: "الفلتر محتاج **250–400 mL/min**، والوريد العادي ما يستحملش **إبر 15 gauge** 3 مرات في الأسبوع. الـ ==arterialised vein== بيجيب الـ flow وجداره بيتقل فيستحمل الشك."
      - kind: explain
        page: 296
        title: "الـ fistula والـ graft"
        quote: "radial A to cephalic vein :BresciaCimino fistula, (radiocephalic)"
        text: |
          الـ ==Brescia–Cimino== = **radial artery** متوصل بالـ **cephalic vein** (radiocephalic). الـ radial بيجيب 64 mL/min قبل العملية، وبعد النضج ممكن يتضاعف **10 مرات**. والأوعية الأكبر (upper arm) بتنضج أحسن.

          بتتعمل ==6 شهور قبل الاستخدام== (stage 4).

          **AV graft** (PTFE) لو: الـ fistula ما نضجتش، الـ arterial inflow ضعيف، أو الأوردة رفيعة.

          المتابعة: الضغوط على الغسيل والـ access flow، و **Doppler** لو شاكك في stenosis أو thrombosis.
      - kind: figure
        page: 296
        quote: "radial A to cephalic vein :BresciaCimino fistula, (radiocephalic)"
        title: "الـ radiocephalic fistula"
        alt: "Forearm sketch: the radial artery runs along the thumb side and the cephalic vein beside it; near the wrist they are joined side to end. Above the joint the vein is drawn thicker and labelled arterialised vein, needles go here; blood flow rises from 64 to several hundred mL/min."
        caption: "الشريان بيصب في الوريد عند الرسغ، فالوريد ==يتشرين== (يتخن ويوسع) ويبقى مكان الإبر."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 40 L310 40 L310 180 L20 180 Z" class="fg-thin"/>
            <text x="24" y="30" class="t-sm t-mut">Forearm</text>
            <text x="270" y="30" class="t-sm t-mut">Wrist</text>
            <path d="M30 150 L280 150" class="fg-arrow-bad" stroke-width="5"/>
            <text x="40" y="170" class="t-sm t-bad">Radial artery</text>
            <path d="M30 80 L250 80 Q280 80 280 150" class="fg-arrow-acc" stroke-width="12"/>
            <text x="40" y="66" class="t-sm t-acc t-b">Cephalic vein, arterialised</text>
            <circle cx="280" cy="150" r="7" class="fg-dot-good"/>
            <text x="226" y="200" class="t-sm t-good t-b">Anastomosis</text>
            <path d="M110 110 L120 86" class="fg-ink"/>
            <path d="M160 110 L170 86" class="fg-ink"/>
            <text x="100" y="125" class="t-sm">Needles (15 G)</text>
          </svg>
      - kind: order
        page: 297
        quote: "the right jugular vein, the femoral vein, the left jugular vein or the subclavian vein"
        prompt: "AKI محتاج catheter. رتّب الأوردة من الأحسن للأوحش:"
        steps:
          - "Right jugular"
          - "Femoral"
          - "Left jugular"
          - "Subclavian"
        why: "Right jugular أقصر وأقل مشاكل. الـ femoral فيه infection ويتجنب لو هيزرع. والـ subclavian آخر واحد لأنه بيعمل ==stenosis== تمنع أي fistula في الدراع ده. وكل ده تحت ultrasound (2A)."
      - kind: mnemonic
        page: 297
        quote: "the right jugular vein, the femoral vein, the left jugular vein or the subclavian vein"
        word: "RFLS"
        parts:
          - { key: "R", text: "Right jugular" }
          - { key: "F", text: "Femoral" }
          - { key: "L", text: "Left jugular" }
          - { key: "S", text: "Subclavian: last, stenosis" }
        hook: |
          "**R**eally **F**ast, **L**ast **S**ubclavian": الـ subclavian آخر واحد، لأنه بيقفل طريق الـ fistula.
      - kind: table
        page: 297
        quote: "Diffusion provides efficient clearance of low-molecular-weight solutes (< 500-1,500"
        title: "إزاي الحاجة بتعدّي الغشا؟"
        columns: [Mechanism, How, Best for]
        rows:
          - ["Diffusion", "Concentration gradient", "Small (<500–1,500 D)"]
          - ["Convection", "Dragged with water (UF)", "Larger, faster"]
          - ["Adsorption", "Sticks to membrane", "Hydrophobic"]
        hide: [[0, 2], [1, 1], [2, 2]]
      - kind: aside
        tone: analogy
        page: 297
        quote: "Convection is the process whereby solutes pass through membrane pores, dragged by fluid movement"
        text: |
          الـ **diffusion** زي نقطة شاي في كوباية مية: بتنتشر لوحدها من الكتير للقليل، وده بيمشي مع الحاجات الصغيرة.

          الـ ==convection== زي السيل: المية بتجري وبتشد معاها أي حاجة قدها، حتى الكبيرة.
      - kind: explain
        page: 298
        title: "UF وأحجام الـ solutes"
        quote: "Middle molecules MW 500-15000 B12(1355). B2 microglobulin (11800)"
        text: |
          الـ ==ultrafiltration== = مية البلازما بتعدّي الغشا بسبب فرق الضغط (TMP). الـ **KUF** = نفاذية الغشا للمية لكل mmHg ولكل m²، والـ **DKUF** = KUF × مساحة الفلتر.

          **الأحجام**:
          - **Small** (<500 D): Na، P، K، urea 60، creatinine 113، uric acid 186، glucose 180.
          - ==Middle== (500–15,000): B12 1355، **β2-microglobulin 11,800**.
          - **Large** (>15,000): myoglobin 17,800، albumin 68,000.

          **Low flux**: UF coefficient 2–10. **High flux**: 20–50، cut-off حوالي 20 kD، وبيعمل convection كبير.
      - kind: check
        page: 298
        quote: "Middle molecules MW 500-15000 B12(1355). B2 microglobulin (11800)"
        question: "Which solute is a middle molecule?"
        options:
          - "Beta-2 microglobulin"
          - "Urea"
          - "Albumin"
          - "Potassium"
        answer: 0
        why:
          - "صح: 11,800 D، بين 500 و 15,000."
          - "الـ urea 60 D: small."
          - "الـ albumin 68,000: large."
          - "الـ K small."
      - kind: explain
        page: 299
        title: "الـ HD بيشتغل بإيه أساسًا؟"
        quote: "A counter-current configuration is preferred because the average concentration gradient is kept higher"
        text: |
          الـ HD أساسه ==diffusion==، وده قوي مع الـ **small solutes**. والـ **counter-current** أحسن من الـ co-current لأنه بيخلي الـ gradient عالي على طول الفلتر. الـ **high-flux filters** بتضيف convection مهم.
      - kind: try
        items: [neph.L09.024, neph.L09.028, neph.L09.032, neph.L09.037, neph.L09.041]
    recap:
      - "Radial artery 64 mL/min، الفلتر عايز 250–400؛ الـ fistula بتتعمل 6 شهور قبل."
      - "Brescia–Cimino = radial + cephalic. Graft (PTFE) لو الـ fistula فشلت أو الأوعية وحشة."
      - "Catheter: right jugular ← femoral ← left jugular ← subclavian (آخر واحد، stenosis)، بالـ ultrasound."
      - "Diffusion للصغير، convection للكبير، adsorption للـ hydrophobic."
      - "Small <500، middle 500–15,000 (β2m)، large >15,000؛ high flux UF 20–50."
    practice: [neph.L09.024, neph.L09.025, neph.L09.026, neph.L09.027, neph.L09.028, neph.L09.029, neph.L09.030, neph.L09.031, neph.L09.032, neph.L09.033, neph.L09.034, neph.L09.035, neph.L09.036, neph.L09.037, neph.L09.038, neph.L09.039, neph.L09.040, neph.L09.041, neph.L09.042, neph.L09.043, neph.L09.044]
