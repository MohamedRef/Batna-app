            <text x="195" y="281" text-anchor="middle" class="t-sm t-b">STEC-HUS</text>
            <rect x="256" y="258" width="70" height="36" rx="8" class="fg-good"/>
            <text x="291" y="281" text-anchor="middle" class="t-sm t-b">aHUS</text>
          </svg>
      - kind: sort
        page: 468
        quote: "Secondary thrombotic microangiopathy"
        prompt: "صنّف: ده سبب secondary TMA ولا لأ؟"
        bins: ["Secondary TMA cause", "Not a cause listed"]
        cards:
          - text: "Calcineurin inhibitors"
            bin: 0
          - text: "Gemcitabine or mitomycin C"
            bin: 0
          - text: "Malignant hypertension"
            bin: 0
          - text: "HELLP syndrome"
            bin: 0
          - text: "Methylmalonic acidemia"
            bin: 0
          - text: "Iron deficiency"
            bin: 1
          - text: "Hypothyroidism"
            bin: 1
        why: "الأسباب: infections (S. pneumoniae، HIV، influenza)، أدوية (CNI، mTOR، chemo، VEGF inhibitors)، malignant HTN، الحمل و HELLP، autoimmune (SLE، APS، scleroderma)، transplant، و inborn errors (B12، methylmalonic acidemia)."
      - kind: explain
        page: 469
        title: "أول episode: الـ workup والعلاج"
