  - id: res.L06.046
    kind: mcq
    topic: allocation
    stem: >-
      Forty villages in Sohag are randomly chosen: twenty get a community health programme on safe water, twenty do
      not, and diarrhoea rates are compared. What is the design?
    options:
      - Parallel-group individual randomized controlled trial (RCT)
      - Cluster randomised trial
      - Crossover trial
      - Split-body trial
    answer: 1
    why:
      - Individuals were not randomised one by one; whole villages were.
      - Pre-existing groups (villages) were randomised, so it is a cluster trial.
      - No village switched from programme to no programme.
      - Split-body randomises parts of one person's body.
    src: { page: 32, quote: "Split-body: separate parts of the body of each participant (e.g., the left and right sides of the face) are randomized to receive (or not receive) an intervention\nCluster: pre-existing groups of participants (e.g., villages, schools) are randomly selected to receive (or not receive) an intervention" }
