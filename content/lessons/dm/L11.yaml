  - id: dm.L11.lesson2
    title: "Basal-oral: صلّح الصيام الأول"
    hook: "حقنة واحدة بالليل مع الأقراص، وأرقام بسيطة كل 3 أيام. ده أسهل باب للـ insulin."
    minutes: 10
    pages: [133, 135]
    topics: [basal-oral, titration]
    goals:
      - "تقرا رسمة الـ insulin profiles وتعرف مين بيعمل peak ومين flat"
      - "تفهم ليه نبدأ بالـ fasting"
      - "تعدّ مزايا الـ basal والـ ideal basal insulin (سؤال كتاب)، وليه كل واحدة"
      - "تبدأ وتعمل titration بجدول Nathan"
    status: unverified
    steps:
      - kind: figure
        page: 133
        title: "أنواع الـ insulin على رسمة واحدة"
        image: { file: dm/L11-insulin-profiles.webp, book: true }
        caption: "الـ rapid analogues بتطلع وتنزل في 4 ساعات، والـ regular بعدها، والـ NPH قمته حوالي 6 ساعات، والـ detemir أعرض، والـ ==glargine== خط مستقيم لحد 24 ساعة."
        alt: "Book figure of plasma insulin levels over 24 hours: aspart, lispro and glulisine peak earliest and end by about 4 hours; regular peaks at about 2 hours and ends by about 9; NPH peaks at about 5 to 6 hours and fades by about 18; detemir rises to a broad peak at about 12 hours and ends by about 20; glargine rises to a flat line that stays level through 24 hours."
      - kind: explain
        page: 133
        title: "اقرا الـ curves: الـ peak هو الخطر"
        quote: "Types of insulin:\n    a. Basal-oral regimen:\n           Fix Fasting First"
        text: |
          الرسمة دي هي اللي بتشرح الـ **types of insulin** قبل ما الكتاب يدخل في الـ **basal-oral regimen**. اقراها كده:

          - **Aspart, lispro, glulisine**: أسرع واحدين، بيطلعوا وينزلوا قبل 4 ساعات. عشان كده بيتاخدوا **مع الأكل**: يغطّوا قمة السكر اللي بعد الوجبة وبعدين يمشوا.
          - **Regular**: أبطأ شوية وأطول، فلازم يتاخد قبل الأكل بوقت.
          - **NPH**: ليه ==peak== واضح بعد كام ساعة. لو اتاخد بالليل، القمة دي بتيجي وانت نايم وما بتاكلش، يعني hypoglycemia بالليل.
          - **Detemir**: أعرض وأهدى من NPH.
          - **Glargine**: خط مستقيم **flat** طول الـ 24 ساعة، يعني بيقلّد الـ basal الطبيعي اللي شفناه في الـ physiological profile.

          الفكرة اللي هتتكرر في الدرس: كل ما الـ insulin يبقى من غير peak، كل ما يبقى أأمن كـ basal.
