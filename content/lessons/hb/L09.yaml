          <text x="165" y="405" text-anchor="middle" class="t-sm">often an umbilical hernia</text>
          <rect x="12" y="418" width="306" height="38" rx="7" class="fg-box"/>
          <text x="165" y="434" text-anchor="middle" class="t-b">Other hernias, scrotal swelling</text>
          <text x="165" y="449" text-anchor="middle" class="t-sm">fluid tracks down</text>
          </svg>
      - kind: reveal
        page: 148
        quote: "Ascites precedes the development of peripheral edema in cirrhosis."
        prompt: "ليه في الـ cirrhosis البطن بتتملي قبل الرجلين، عكس الـ heart failure؟"
        answer: |
          لأن الـ **portal hypertension** هي الـ **localizing factor**: المية الزيادة بتتسرب من الـ splanchnic bed الأول، فتنزل البطن قبل ما تلحق الـ peripheral tissues.

          (الشرح ده من الـ physiology اللي في الدرس اللي فات؛ الكتاب بيكتفي بإن الـ ascites بتسبق الـ edema.)
      - kind: mnemonic
        page: 148
        quote: "Grade 2 (moderate): ascites causing moderate symmetrical distension of the abdomen with flank bulging and shifting dullness."
        word: "UST"
        parts:
          - { key: "U", text: "Grade 1 (mild): seen on Ultrasound only" }
          - { key: "S", text: "Grade 2 (moderate): symmetrical distension, flank bulging, Shifting dullness" }
          - { key: "T", text: "Grade 3 (severe): marked distension with a fluid Thrill" }
        hook: |
          اقراها «أُسطى» 😄: يا أسطى، الـ grade 1 بالـ **U**ltrasound، الـ 2 بالـ **S**hifting dullness، والـ 3 بالـ fluid **T**hrill. حرف لكل درجة وبالترتيب.
      - kind: check
        page: 148
        quote: "Grade 2 (moderate): ascites causing moderate symmetrical distension of the abdomen with flank bulging and shifting dullness."
        question: "A cirrhotic has symmetrical abdominal distension with flank bulging and shifting dullness, but no fluid thrill. Grade?"
        options:
          - "Grade 1"
          - "Grade 2"
          - "Grade 3"
          - "Tense ascites"
        answer: 1
        why:
          - "Grade 1 مش بتبان غير بالـ ultrasound، ودي باينة بالكشف."
          - "صح: moderate symmetrical distension + flank bulging + shifting dullness = **grade 2**."
          - "Grade 3 محتاجة **fluid thrill** و marked distension."
          - "الـ tense محتاجة **pressure manifestations** (dyspnea، early satiety…)."
      - kind: explain
        page: 149
        quote: "Tense ascites is defined when severe ascites (massive fluid accumulation) causes marked increase in intraabdominal pressure leading to pressure manifestations"
        title: "Tense ascites"
        text: |
          **Tense ascites**: severe ascites كمية المية فيها كبيرة لدرجة إن الـ intra-abdominal pressure بيعلى جامد ويعمل ==pressure manifestations==.

          الضغط ده بيزق على كل اللي حواليه، وكل عرض ليه سبب:
          - **Dyspnea**: الـ diaphragm مزقوق لفوق ومش لاقي مكان يتحرك.
          - **Early satiety**: المعدة متزنوقة، فبتتملي بسرعة.
          - **Functional IVC block** و congested neck veins: الضغط بيكبس على الـ IVC فالدم بيرجع بالعافية.
          - احتمال **rupture of umbilical hernia**: الجلد فوق الـ hernia بيترقق من الشد لحد ما ممكن يتقطع.
      - kind: aside
        tone: joke
        text: |
          الـ tense ascites زي أتوبيس النقل العام الساعة 8 الصبح: الكل مزنوق، الحجاب الحاجز مش لاقي مكان يتنفس، والمعدة بتقولك «شبعت» من أول لقمة. 🚌
      - kind: explain
        page: 149
        quote: "Hepatic hydrothorax is usually a right-sided effusion due to ascitic fluid translocating through diaphragmatic defects from the peritoneum to the pleural space."
        title: "Hepatic hydrothorax: المية طلعت الدور اللي فوق"
        text: |
          **Hepatic hydrothorax**: pleural effusion في مريض cirrhosis، سببه إن الـ ascitic fluid بيعدّي من البطن للصدر.

          إزاي بيعدّي؟ من خلال ==diaphragmatic defects==، يعني خروم صغيرة في الـ diaphragm. والتفسير المقبول (مش في الكتاب): ضغط الصدر السالب مع كل نفس بيشفط المية لفوق.

          صفاته في الكتاب:
          - غالبًا ==right-sided==.
          - ممكن يعمل pulmonary complaints زي **dyspnea**.
          - السائل شبه الـ ascites بالظبط: **transudate** (low protein)، و **serum-pleural albumin gradient** عالي (≥1.1 g/dl). منطقي، لأنه هو نفس المية.

          مضاعفته: ==spontaneous bacterial empyema==، يعني المية في الصدر اتلوّثت، وبتتعالج زي الـ **SBP**.

          العلاج:
          - الأساس نفس علاج الـ ascites (ملح و diuretics).
          - لو refractory: **TIPS** كـ bridge to LT.
          - **LT** هي الـ best option لو ينفع.
          - الـ repetitive thoracentesis والـ **pleurodesis** تتجرّب بس لو كل ده فشل.
      - kind: figure
        page: 149
        quote: "Pleural fluid analysis has similar characteristics to abdominal ascites with low protein levels (transudate) and high serum-pleural fluid albumin gradient"
