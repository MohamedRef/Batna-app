        title: "اعتبارات الـ allopurinol: ليه كل واحدة؟"
        quote: "Considerations during allopurinol therapy:"
        text: |
          الكتاب بيعدّ أربعة، والسبب (التفسير المقبول، مش في الكتاب):
          - ==Induction of an acute attack==: الـ uric acid بينزل فيفكّك الـ tophi الصغيرة (شوف الدرس اللي فات). عشان كده الدوا ما بيبدأش وسط هجمة.
          - **GIT side effects**.
          - **Bone marrow suppression**: خصوصًا مع الأدوية اللي بيتكسّرها نفس الإنزيم (azathioprine، 6-mercaptopurine).
          - **Renal impairment**: الـ allopurinol بيخرج من الكلية، فلو الكلية ضعيفة بيتراكم.

          والـ ==interactions== كلها نفس الفكرة: الـ allopurinol بيقفل إنزيم بيكسّر أدوية تانية (azathioprine، 6-MP، theophylline)، فمستواها بيعلى وتعمل toxicity؛ أو دوا تاني بيغيّر مستوى الـ allopurinol نفسه (salicylates الجرعة الكبيرة، phenytoin).
