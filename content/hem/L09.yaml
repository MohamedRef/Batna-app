        options: ["Leukoerythroblastic film; PMF most likely", "Reactive neutrophilia from infection", "Iron deficiency", "Essential thrombocythemia"]
        answer: 0
        why: "Myeloid and erythroid precursors with dacryocytes are the PMF film (p149), with near-universal splenomegaly (p147). Infection would not give teardrops and a huge spleen. Iron deficiency gives microcytosis and thrombocytosis. ET has high platelets and a small spleen."
      - reveal: "Marrow aspiration is a dry tap."
