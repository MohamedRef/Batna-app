    tags: [numbers, high-yield]
  - id: git.L03.244
    kind: card
    topic: biliary
    front: What reduces post-ERCP pancreatitis in SOD, and who should get ERCP with manometry?
    back: A temporary prophylactic pancreatic stent and rectal nonsteroidal anti-inflammatory drugs (NSAIDs). Endoscopic retrograde cholangiopancreatography (ERCP) with manometry is reserved for severe or debilitating symptoms.
    src: { page: 133, quote: "Therefore, ERCP with manometry should be reserved for persons who have severe or debilitating symptoms." }
