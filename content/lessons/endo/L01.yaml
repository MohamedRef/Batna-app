        quote: "Insulinoma\n  Patient develop hypoglycemia after fasting or exertion; improve with glucose intake & inappropriately elevated insulin.\n  90% solitary and benign.\n  Head, body and tail pancreas.\n  Malignancy - size > 6cm or liver/nodal mets."
        title: "Insulinoma"
        text: |
          **Hypoglycemia after fasting or exertion**، بتتحسن بالـ glucose، مع ==inappropriately elevated insulin==.

          - **90%** solitary و benign.
          - في الـ head أو body أو tail.
          - **Malignancy** لو الحجم أكبر من **6 cm** أو في liver/nodal mets.

          ليه بعد **fasting أو exertion** بالذات؟ لأن الاتنين بيستهلكوا السكر: الصيام بيوقف الداخل، والمجهود بيصرف الموجود. الجسم الطبيعي يقفل الـ insulin ساعتها، لكن الورم شغال لوحده، فالسكر يقع. وليه الحجم والـ mets هما علامة الـ malignancy؟ لأن شكل الخلايا تحت الميكروسكوب مش بيفرّق كويس بين الحميد والخبيث في الأورام دي، فبنحكم بالسلوك: كبر قوي أو انتشر.
      - kind: reveal
        page: 5
        quote: "Insulinoma\n  Patient develop hypoglycemia after fasting or exertion; improve with glucose intake & inappropriately elevated insulin.\n  90% solitary and benign.\n  Head, body and tail pancreas.\n  Malignancy - size > 6cm or liver/nodal mets."
        prompt: "ليه كلمة inappropriately هي مفتاح التشخيص؟"
        answer: "الطبيعي إن الـ insulin يقفل خالص لما السكر يقع. لو السكر واطي والـ insulin لسه عالي (أو حتى normal)، يبقى في حد بيفرزه غصب عن الجسم: ورم."
