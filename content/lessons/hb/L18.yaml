        page: 352
        title: "PAGE-B: Platelet, Age, GEnder"
        alt: "A points chart. Age by decade: 16 to 29 is 0, 30 to 39 is 2, 40 to 49 is 4, 50 to 59 is 6, 60 to 69 is 8, 70 or more is 10. Gender: male 6, female 0. Platelets: 200 or more is 0, 100 to 199 is 1, under 100 is 2. Below, a scale: 9 or less is low risk with almost 0 percent HCC at 5 years; 10 to 17 is intermediate, 3 percent; 18 or more is high, 17 percent. Only intermediate and high are screened."
