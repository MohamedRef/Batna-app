  - id: hb.L06.lesson5
    title: "العلاج الأول: الوزن، والقهوة، والمكمّلات"
    hook: "أقوى دوا للكبد الدهني مش في الصيدلية. وبعدين نفتح صينية المكمّلات: مين recommended ومين مجرد مذكور."
    minutes: 8
    pages: [105, 106]
    topics: [lifestyle]
    goals:
      - "تعرف إن نزول الوزن بأي طريقة حسّن الـ ALT في كل الدراسات تقريبًا، والـ histology في أغلب الدراسات اللي قاستها"
      - "تحفظ مين ياخد vitamin E بالظبط"
      - "تقسّم المكمّلات على مجموعاتها الثلاثة"
    status: unverified
    steps:
      - kind: explain
        page: 105
        quote: "Treatment: Weight Loss\n| Study | N | Intervention | Duration (months) | Design | ALT | Histology |\n|---|---|---|---|---|---|---|\n| Hickman | 31 | Diet | 15 | Open label | + | N/A |\n| Huang | 16 | Diet | 12 | Open label | - | + |\n| Palmer | 39 | Diet | 2-111 | Case series | + | N/A |\n| Andersen | 41 | Diet | 4-23 | Open label | + | +/-* |\n| Kugelmas | 8 | Diet/Ex | 3 | Open label | + | N/A |\n| Ueno | 15 | Diet/Ex | 3 | Open label | + | + |\n| Zhu | 34 | Diet/Ex | 12 | Open label | + | N/A |\n| Suzuki | 348 | Diet/Ex | 12-24 | Open label | + | N/A |\n| Harrison | 10 | Orlistat | | Open label | + | + |\n| Sabuncu | 13/12 | Sibutramine/Orlistat | 6 | Open label | | N/A |\n| Luyckx | 69 | Surgery | 27 | Case series | + | +/-* |\n| Silverman | 91 | Surgery | 2-61 | Case series | + | + |\n| Kral | 104 | Surgery | 41 | Case series | + | + |\n| Dixon | 36 | Surgery | 26 | Case series | + | + |"
        title: "Treatment: weight loss"
        text: |
          جدول الكتاب جمع دراسات بـ 4 طرق مختلفة لنزول الوزن:

          - **Diet** لوحده
          - **Diet + exercise**
          - **Orlistat** (و sibutramine/orlistat)
          - **Surgery**

          النتيجة: الـ alanine aminotransferase (ALT) اتحسّن في كل الدراسات تقريبًا، والـ histology اتحسّنت في أغلب الدراسات اللي قاستها.

          يعني الطريقة مش هي المهمة، المهم إن ==weight loss== يحصل فعلًا. والكتاب في الـ conclusions بيسمي الـ diet والـ lifestyle modification الـ main options.
      - kind: figure
        page: 105
        quote: "Treatment: Weight Loss"
        title: "Treatment: weight loss: الجدول الأصلي"
        image: { file: hb/L06-weight-loss-studies.webp, book: true }
        alt: "Book table on a dark blue slide with columns Study, N, Intervention, Duration (months), Design, ALT, Histology. Rows: Hickman, Huang, Palmer, Andersen (diet); Kugelmas, Ueno, Zhu, Suzuki (diet and exercise, boxed in red); Harrison (orlistat); Sabuncu (sibutramine/orlistat); Luyckx, Silverman, Kral, Dixon (surgery). ALT is + in almost every row (Huang -); histology is + in Huang, Ueno, Harrison, Silverman, Kral, Dixon, +/- in Andersen and Luyckx, N/A in the rest."
        caption: |
          جدول على شريحة زرقا، 7 أعمدة: **Study**، **N** (عدد المرضى)، **Intervention**، **Duration (months)**، **Design**، **ALT**، **Histology**. الصفوف متقسمة بالتدخل:

          - **فوق: Diet** (Hickman، Huang، Palmer، Andersen).
          - **في المربع الأحمر: Diet/Ex** (Kugelmas، Ueno، Zhu، **Suzuki 348 مريض**): المربع بيشاور على إن الأكل + الرياضة هي أكبر مجموعة وأكبر دراسة.
          - **بعدها: أدوية** (Harrison: orlistat، Sabuncu: sibutramine/orlistat).
          - **تحت: Surgery** (Luyckx، Silverman، Kral، Dixon).

          بص على عمود **ALT**: "+" في كل الصفوف تقريبًا (Huang بس "-"). وعمود **Histology**: "+" في كل الجراحات تقريبًا، و**N/A** (not available، ماتقاسش) في كتير من الـ diet. والـ **Design** كله open label أو case series، مفيش RCT.

          الرسالة: ==أي طريق لنزول الوزن== بيحسّن الإنزيمات، والدليل على الـ histology ==أقوى في الجراحة==، بس الدراسات صغيرة ومش randomized.
