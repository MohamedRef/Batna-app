  - id: dm.L21.lesson2
    title: "Familial hypercholesterolemia: الـ receptor البايظ"
    hook: "طفل عنده 9 سنين وعنده جلطة في القلب. السبب: باب واحد في الكبد مقفول."
    minutes: 10
    pages: [262, 264]
    topics: [fh]
    goals:
      - "تفهم ليه الـ LDL بيعلى لما الـ receptor يبوظ"
      - "تفرّق الـ homozygous من الـ heterozygous"
      - "تعرف العلامات والتشخيص والعلاج، وليه كل علاج بيشتغل"
    status: unverified
    steps:
      - kind: explain
        remind: [dm.L21.016]
        page: 262
        title: "3 مجموعات primary"
        quote: "Lipid Disorders Associated with Elevated LDL-C and Normal Triglycerides (Familial hypercholesterolemia)"
        text: |
          الـ primary disorders of apolipoprotein B (ApoB) lipoproteins:
          1. **Low-density lipoprotein (LDL) عالي و triglycerides (TG) طبيعي** ← ==familial hypercholesterolemia==.
          2. **TG عالي** ← familial hypertriglyceridemia.
          3. **الاتنين** ← familial combined dyslipidemia.

          التقسيم ده بيمشي على **أنهي lipid عالي**: LDL لوحده، TG لوحده، ولا الاتنين. يعني نفس منطق جدول Fredrickson، بس بأسماء أمراض.
      - kind: explain
        remind: [dm.L21.018]
        page: 262
        title: "FH في سطرين"
        quote: "6. FH is an autosomal dominant disorder characterized by:\n  1. Elevated plasma levels of LDL-C with\n  7. Normal triglycerides,\n  8. Tendon xanthomas, and"
        text: |
          - Fredrickson ==Type II== (a و b)، **relatively common**، **autosomal dominant**.
          - Low-density lipoprotein cholesterol (LDL-C) عالي، **TG طبيعي**، **tendon xanthomas**، و **premature coronary atherosclerosis**.

          ليه الـ TG طبيعي؟ التفسير المقبول (مش في الكتاب): العيب في **تنضيف** الـ LDL، والكبد بيطلّع الـ VLDL (شايل الـ TG) بمعدل عادي. فالزحمة كلها في آخر الطريق، عند الـ LDL.
      - kind: figure
