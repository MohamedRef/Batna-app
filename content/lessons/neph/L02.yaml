  - id: neph.L02.lesson5
    title: "الحموضة، البوتاسيوم، اليوريك، والأدوية"
    hook: "مريض الـ CKD بيتأذي من حاجات صغيرة: بيكربونات واطية، بوتاسيوم في أكل جاهز، أو مسكّن من الصيدلية."
    minutes: 10
    pages: [53, 62]
    topics: [acidosis, potassium, uric-acid, cvd, drugs]
    goals:
      - "تعرف هدف البيكربونات وخطوات علاج الـ hyperkalemia"
      - "تعرف مين يتعالج من الـ hyperuricemia وبإيه"
      - "تختار البديل الآمن للأدوية الـ nephrotoxic وتطبق الـ sick-day rules"
    status: unverified
    steps:
      - kind: explain
        page: 53
        quote: "Aim for serum bicarbonate > 22 mmol/L. Decreases progression and improves nitrogen balance."
        title: "الـ metabolic acidosis"
        text: |
          الحموضة نفسها بتليّف الكلى (ammonium و endothelin و renin–angiotensin system (RAS) ← ==tubulointerstitial fibrosis==) وبتكسّر العضلات.

          - امنع الـ severe acidosis: ==bicarbonate < 16==
          - علشان تبطّأ الـ progression: **sodium bicarbonate** وهدف ==> 22 mmol/L==
          - راقب إن العلاج مايعليش الـ HCO3 فوق الطبيعي، ومايبوّظش الضغط أو الـ K أو الـ fluid status
      - kind: order
        page: 54
        quote: "Figure 27: Actions to manage hyperkalemia (potassium >5.5 mmol/l) in chronic kidney disease\n1st line: Correctable factors\n  Optimize serum bicarbonate levels\n  Optimize glycemic control\n  Consider loop diuretics and SGLT-2i as adjuncts\n2nd line: Dietary restriction\n  Assess dietary K+ intake and consider lowering (dietetic referral)\n3rd line: Medications\n  Dose adjust (or stop) K+ elevating or K+ sparing medication if necessary (signpost to restart disease modifying therapy, such as RAASi/MRA, at a later date if possible)\n  Licensed exchange resins are available to lower potassium"
        prompt: "K 5.9 في CKD: رتّب الخطوات زي الكتاب:"
        steps:
          - "Optimize bicarbonate and glucose control"
          - "Loop diuretic and SGLT2i as adjuncts"
          - "Assess dietary K (dietitian)"
          - "Adjust or stop K-raising drugs, licensed binder"
          - "Plan to restart RAASi/MRA later"
