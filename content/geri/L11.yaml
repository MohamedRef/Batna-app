  # ---------- p189-191: aging ----------
  - id: geri.L11.004
    kind: card
    topic: aging
    front: Where do the age-related changes of the respiratory system mainly occur?
    back: In the alveoli rather than the large airways.
    src: { page: 190, quote: "Changes associated with age occur in the alveoli rather than the large airways alveoli lose their elastic recoil and enlarge with age, a phenomenon referred to as \"senile emphysema.\"" }
    status: unverified
  - id: geri.L11.005
    kind: card
    topic: aging
    front: What is "senile emphysema"?
    back: Age-related loss of alveolar elastic recoil and enlargement, with alveolar dilatation but no destruction of alveolar walls, from degeneration of elastic fibres around the alveolar duct.
    src: { page: 190, quote: "―Senile Emphysema‖ results in alveolar dilatation without any destructive changes to the alveolar walls but due to degeneration of elastic fibers around the alveolar duct." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.006
    kind: card
    topic: aging
    front: How do the chest wall and respiratory muscles change with age?
    back: The chest wall stiffens and muscle strength declines; inspiration depends mostly on the diaphragm.
    src: { page: 190, quote: "Chest wall stiffer and age-related decline in muscle strength.\nInspiration depends mostly on the diaphragm." }
    status: unverified
  - id: geri.L11.007
    kind: cloze
    topic: aging
    text: "Healthy older persons have about {{c1::25%}} lower diaphragmatic strength, and vital capacity is {{c2::reduced}} when the diaphragm is weak."
    src: { page: 190, quote: "Healthy older persons have approximately 25% lower diaphragmatic strength." }
    status: unverified
    tags: [numbers]
  - id: geri.L11.008
    kind: card
    topic: aging
    front: Why does TLC stay almost unchanged with age?
    back: Lower lung elastic recoil makes expansion easier (raises total lung capacity (TLC)), while the stiffer chest wall lowers it; the two cancel out.
    src: { page: 190, quote: "Thus, the two together result in an almost unchanged TLC with age." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.009
    kind: card
    topic: aging
    front: Why does RV rise with age, and what is hyperinflation?
    back: Lower recoil lets alveoli collapse and trap air, raising residual volume (RV). An abnormally high RV/TLC is hyperinflation, often seen on chest X-ray.
    src: { page: 190, quote: "Collapse of the alveoli with aging, results in air trapping, contributes to the increase in RV. Abnormally high RV/TLC is called hyperinflation, which can often be seen on a chest x-ray Hyperinflation occurs in asthma ,COPD and advanced age." }
    status: unverified
  - id: geri.L11.010
    kind: enumerate
    topic: aging
    prompt: In which conditions does hyperinflation occur?
    points: [Asthma, COPD, Advanced age]
    pass: 3
    hook: "الـ hyperinflation في «ربو، COPD، وسن»: asthma، COPD، وadvanced age."
    src: { page: 190, quote: "Collapse of the alveoli with aging, results in air trapping, contributes to the increase in RV. Abnormally high RV/TLC is called hyperinflation, which can often be seen on a chest x-ray Hyperinflation occurs in asthma ,COPD and advanced age." }
    status: unverified
  - id: geri.L11.011
    kind: cloze
    topic: aging
    text: "Adults lose about {{c1::one-third of a litre}} of forced expiratory volume in 1 second (FEV1) per decade; FEV1 falls {{c2::more}} than forced vital capacity (FVC), so FEV1/FVC also {{c3::declines}} with age."
    src: { page: 191, quote: "Adults normally experience declinein FEV1 with age (about one-third liter per decade)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L11.012
    kind: card
    topic: aging
    front: Why are age-related airflow limits not evident in healthy older adults?
    back: The lungs have a large physiologic reserve; limitation shows only with a pathologic process.
    src: { page: 191, quote: "The lungs have a large physiologic reserve and therefore these airflow limitations are not evident in older adults unless they are affected by a pathologic process." }
    status: unverified
  - id: geri.L11.013
    kind: card
    topic: aging
    front: Why may FEV1/FVC overestimate obstructive disease in old age?
    back: Values below 0.65 usually indicate obstruction, but the ratio falls normally with age.
    src: { page: 191, quote: "Since FEV1/FVC values below 0.65 are typically indicative of airway obstruction, this parameter may overestimate obstructive disease in old age." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.014
    kind: enumerate
    topic: aging
    prompt: Sum up the respiratory changes of aging.
    points:
      - Senile emphysema in the alveoli
      - Reduced lung recoil
      - TLC does not change
      - VC falls with a matching rise in RV
      - FEV1 declines, more than FVC
      - FEV1/FVC may overestimate obstruction
      - Closing capacity rises
    pass: 5
    hook: "الرئة لما تكبر «7»: senile emphysema، recoil أقل، TLC ثابت، VC بينزل والـ RV بيطلع قده، FEV1 بينزل أكتر من FVC، FEV1/FVC ممكن يبالغ في الـ obstruction، وclosing capacity بيعلى."
    src: { page: 191, quote: "To Sum Up\n  Age-related changes within alveoli \"senile emphysema\".\n  Reduced lung recoil.\n  TLC does not change with age.\n  Decreased VC with a corresponding increase in RV.\n  Aging results in a decline in FEV1.\n  Decline in FEV1 with aging is greater than the decline in (FVC).\n  Since FEV1/FVC values below 0.65 are typically indicative of airway obstruction, this parameter may overestimate obstructive disease in old age." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.015
    kind: cloze
    topic: aging
    text: "Closing capacity (closing volume + residual volume (RV)) rises linearly from about {{c1::10%}} of total lung capacity (TLC) in young adults to about {{c2::30%}} of TLC by age {{c3::70}}."
    src: { page: 191, quote: "This volume combined with RV form closing capacity (CC),which increases linearly with age from approximately 10% of TLC in young adults to approximately 30% of TLC by the age of 70." }
    status: unverified
    tags: [numbers]
  - id: geri.L11.016
    kind: card
    topic: aging
    front: Define closing volume, and why does it increase with age?
    back: The volume at which basal airways close during normal expiration. It rises because reduced elastic recoil lets small airways collapse.
    src: { page: 192, quote: "Increased CV is likely a result of reduced elastic recoil in the lung, which results in the collapse of the small airways." }
    status: unverified
  # ---------- p192-193: obstruction ----------
  - id: geri.L11.017
    kind: card
    topic: obstruction
    front: What establishes airflow obstruction, and what must its threshold account for in the elderly?
    back: A reduced FEV1/FVC; the threshold must account for normal aging, including more variable spirometric performance.
    src: { page: 192, quote: "However, given that age related airflow limitation is also characterized by a reduced FEV1/FVC, the threshold that establishes airflow obstruction must account for normal aging, including increased variability in spirometric performance." }
    status: unverified
  - id: geri.L11.018
    kind: card
    topic: obstruction
    front: How does ATS/ERS define the LLN for FEV1/FVC?
    back: The fifth percentile of reference values in healthy never-smokers matched for age, height, sex and ethnicity (NHANES III equations).
    src: { page: 192, quote: "1) The ATS/ERS recommend that airflow obstruction be established by a lower limit of normal (LLN) threshold for FEV1/FVC. The ATS/ERS currently defines the LLN as the fifth percentile distribution of reference values, calculated in a population of healthy never-smokers matched for age, height, sex, and ethnicity." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.019
    kind: card
    topic: obstruction
    front: First flaw of GOLD in older adults?
    back: It uses a fixed FEV1/FVC below 0.70, so it cannot separate age-related airflow limitation from chronic obstructive pulmonary disease (COPD); healthy asymptomatic never-smokers aged 65 or more often fall below 0.70.
    src: { page: 192, quote: "Global Initiative for Obstructive Lung Disease (GOLD)\n  2) GOLD guidelines:\n    The mostoften used spirometric criteria for airflow obstruction is based on GOLD guidelines.\n    The age-related limitations of the GOLD guidelines include two fundamental flaws.\n    First, GOLD defines areduced FEV1/FVC by a fixed ratio less than 0.70, thus failing to distinguish between age-related airflow limitation and COPD-related airflow obstruction." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.020
    kind: card
    topic: obstruction
    front: Second flaw of GOLD in older adults?
    back: It expresses forced expiratory volume in 1 second (FEV1) as % predicted, which ignores age-related variability in spirometric performance.
    src: { page: 193, quote: "Second, GOLD expresses the FEV1 as%Pred, thus failing to account for age-related variability in spirometricperformance. It is therefore not surprising that the prevalence of airflow obstruction in older persons is more than twofold higher when defined by GOLD versus a Zscoreapproach (37.7% vs 15.4%, respectively)." }
    status: unverified
  - id: geri.L11.021
    kind: cloze
    topic: obstruction
    text: "Prevalence of airflow obstruction in older persons: {{c1::37.7%}} by Global Initiative for Chronic Obstructive Lung Disease (GOLD) versus {{c2::15.4%}} by a Z-score approach."
    src: { page: 193, quote: "Second, GOLD expresses the FEV1 as%Pred, thus failing to account for age-related variability in spirometricperformance. It is therefore not surprising that the prevalence of airflow obstruction in older persons is more than twofold higher when defined by GOLD versus a Zscoreapproach (37.7% vs 15.4%, respectively)." }
    status: unverified
    tags: [numbers]
  - id: geri.L11.022
    kind: card
    topic: obstruction
    front: Is the extra obstruction diagnosed by GOLD in old age clinically meaningful?
    back: No. Global Initiative for Chronic Obstructive Lung Disease (GOLD) overdiagnosis is not associated with symptoms, exercise intolerance, impaired mobility, chronic obstructive pulmonary disease (COPD) hospitalization or mortality.
    src: { page: 193, quote: "Overdiagnosis of airflow obstruction by GOLD is not associated with respiratory symptoms, exercise intolerance, impaired mobility, COPD hospitalization, or mortality." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.023
    kind: card
    topic: obstruction
    front: Two limits of the NHANES III equations?
    back: Limited to age 80 or less, and they ignore variability in spirometric performance.
    src: { page: 193, quote: "The NHANES III equations are limited to those aged less than or equal to 80 and do not consider variability in spirometric performance." }
    status: unverified
  - id: geri.L11.024
    kind: cloze
    topic: obstruction
    text: "Global Lung Function Initiative (GLI) defines the lower limit of normal (LLN) as the fifth percentile of Z-scores, a Z-score of {{c1::-1.64}}; its equations cover many ethnicities and ages up to {{c2::95}}."
    src: { page: 193, quote: "Hence, the GLI has recommended that the LLN be instead defined as the fifth percentile distribution of Z-scores (Z-score of –1.64)." }
    status: unverified
    tags: [high-yield, numbers]
  - id: geri.L11.025
    kind: card
    topic: obstruction
    front: Which outcomes are linked to obstruction defined by FEV1/FVC Z-score below -1.64?
    back: Respiratory symptoms, impaired mobility, frailty, chronic obstructive pulmonary disease (COPD) hospitalization and mortality.
    src: { page: 193, quote: "Airflow obstruction defined by an FEV1/FVC Z-score less than –1.64is associated with respiratory symptoms, impaired mobility, frailty status, COPD hospitalization, and mortality." }
    status: unverified
  # ---------- p193-197: staging, reversibility, Z ----------
  - id: geri.L11.026
    kind: card
    topic: staging
    front: How does GOLD stage airflow obstruction?
    back: By forced expiratory volume in 1 second (FEV1) % predicted (measured/predicted x 100), with thresholds of 80 and 50 % predicted.
    src: { page: 193, quote: "GOLD recommend thresholds for FEV1 of 80and 50 % Pred when staging airflow obstruction." }
    status: unverified
  - id: geri.L11.027
    kind: card
    topic: staging
    front: Why is % predicted a poor staging tool in older adults, and what should replace it?
    back: It wrongly assumes spirometric variability is equal across the lifespan; use GLI-calculated forced expiratory volume in 1 second (FEV1) Z-scores.
    src: { page: 194, quote: "To address this limitation, GLI-calculated FEV1 Z-scores should be used to stagethe severity of airflow obstruction." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.028
    kind: table
    topic: staging
    title: Defining and staging COPD, GLI vs GOLD (book table, p195)
    columns: [Scheme, Obstruction, Mild, Moderate, Severe]
    rows:
      - [GLI (Z-scores), "FEV1/FVC Z < -1.64", "FEV1 Z ≥ -1.64", "FEV1 Z < -1.64 but ≥ -2.55", "FEV1 Z < -2.55"]
      - [GOLD (fixed), "FEV1/FVC < 0.70", "FEV1 ≥ 80 %Pred", "50-79 %Pred", "< 50 %Pred"]
    blanks: [[0, 1], [0, 3], [0, 4], [1, 1], [1, 3]]
    src: { page: 195, quote: "Defining and staging COPD\nGlobal Lung Initiative (GLI)\n| Measure | Criterion | | |\n|---|---|---|---|\n| FEV1/FVC | Z-score < -1.64 | | |\n| FEV1 (Z-score) | ≥ -1.64 | < -1.64 but ≥ -2.55 | < -2.55 |\nGlobal Initiative for Obstructive Lung Disease (GOLD)\n| Measure | Criterion | | |\n|---|---|---|---|\n| FEV1/FVC | < 0.70 | | |\n| FEV1 | ≥ 80 %Pred | 50-79 %Pred | < 50 %Pred |" }
    status: unverified
    tags: [high-yield, numbers]
  - id: geri.L11.029
    kind: card
    topic: staging
    front: How is COPD defined in terms of reversibility?
    back: Chronic airflow obstruction that is not fully reversible.
    src: { page: 194, quote: "COPDis defined as chronic airflow obstruction, meaning Not fully reversible." }
    status: unverified
  - id: geri.L11.030
    kind: card
    topic: staging
    front: Why do guidelines do spirometry before and after a bronchodilator, and which values diagnose COPD?
    back: To establish reversibility (pre- vs post-BD) and diagnose chronic obstructive pulmonary disease (COPD) using post-BD values.
    src: { page: 194, quote: "Clinical guidelines recommend that spirometry should be performed before and after an inhaled bronchodilator in order to establish. (1) Reversibility (pre-vs post-BD values).\n  (2) Diagnosis ofCOPD (using post-BD values)." }
    status: unverified
  - id: geri.L11.031
    kind: card
    topic: staging
    front: Disadvantages of pre/post-bronchodilator spirometry in older persons?
    back: Limited capacity to perform multiple forced vital capacity (FVC) maneuvers, and possible adverse response to the inhaled bronchodilator.
    src: { page: 194, quote: "Older persons have limited capacity to perform multiple FVC maneuvers, and may have an adverse response to an inhaledBD." }
    status: unverified
  - id: geri.L11.032
    kind: cloze
    topic: staging
    text: "In a normal distribution, {{c1::68%}} of values lie within 1 standard deviation (SD), {{c2::95%}} within 2 SD and {{c3::99.7%}} within 3 SD of the mean."
    src: { page: 195, quote: "Normal Distribution Curve\n| Range | Share of values |\n|---|---|\n| Within 1 standard deviation | 68% of all values are within 1 standard deviation of mean value |\n| Within 2 standard deviations | 95% of all values are within 2 standard deviations of mean value |\n| Within 3 standard deviations | 99% of all values are within 3 standard deviations of mean value (99.7%) |" }
    status: unverified
    tags: [numbers]
  - id: geri.L11.033
    kind: card
    topic: staging
    front: What does a Z-score represent, and how is it calculated?
    back: How many SDs the measured value lies from the mean predicted value; z = (x - mean) / standard deviation (SD). Positive is above the mean, negative below.
    src: { page: 196, quote: "Z -score\n  The Z-score represents how many SD the measured value is away from the mean predicted value.\n  If a Z score is 0 it indicates that the data point score is identical to the mean score.\n  Z scores may be positive or negative.\n  Positive value indicates the score is above the mean.\n  Negative value indicates the score is below the mean.\n  Z-score of −1 would be one SD below the mean predicted value." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.034
    kind: card
    topic: staging
    front: On a Z-score display, what do the shaded zones and the dot show?
    back: White = normal range, light shading = near the limits, heavy shading = outside normal. The dot or arrow shows the patient; more negative = more severe.
    src: { page: 197, quote: "The location of the arrow or dot also allows to assess how severe any deficit is, with a more negative Z-score indicating more severe abnormality." }
    status: unverified
  - id: geri.L11.035
    kind: card
    topic: staging
    front: With an LLN at Z = -1.64, how many healthy people fall below normal?
    back: 5%, one in 20 pulmonary function tests (PFTs); so relying on a number alone will misdiagnose. Treat the patient, not the numbers.
    src: { page: 197, quote: "By definition, when using a LLN of -1.64 Z-scores or (the 5thcentile) 5% of healthy individuals (one in 20 PFTs) will have results below the lower limit of normal." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.036
    kind: card
    topic: staging
    front: Can a lung function test alone define disease severity and prognosis?
    back: No. Neither % predicted nor Z-scores alone can; other factors, including quality of life, contribute.
    src: { page: 197, quote: "A lung function test must never be used in isolation to define disease severity and prognosis; a number of factors, including quality of life, are likely to contribute." }
    status: unverified
  # ---------- p197-199: pathogenesis ----------
  - id: geri.L11.037
    kind: enumerate
    topic: pathogenesis
    prompt: The two categories of early initiating phases of COPD.
    points: [Antioxidant / oxidant imbalance, Antiprotease / protease imbalance]
    pass: 2
    hook: "بداية الـCOPD «ميزانين مختلين»: antioxidant/oxidant وantiprotease/protease. 2."
    src: { page: 197, quote: "Earlyinitiating phases of COPD fall into two categories: (1) Antioxidant / oxidant.\n  (2) Antiprotease / protease imbalance." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.038
    kind: card
    topic: pathogenesis
    front: Why does COPD keep progressing over decades despite smoking cessation?
    back: Thought to be "progression" and "consolidation" phases of disease in genetically susceptible hosts.
    src: { page: 197, quote: "COPD develops over decades despite smoking cessation, thought to be due to \"progression\" and \"consolidation\" phases of disease in genetically susceptible hosts." }
    status: unverified
  - id: geri.L11.039
    kind: card
    topic: pathogenesis
    front: How do telomeres link aging and COPD?
    back: Lung-cell telomeres are shorter in chronic obstructive pulmonary disease (COPD) than in age-matched controls; shortening raises apoptosis, and an apoptosis-repair imbalance may underlie emphysema.
    src: { page: 198, quote: "Telomere shortening: leads to increased apoptosis in the lungs of patients with COPD and imbalance between apoptosis and tissue repair may underlie the development of emphysema." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.040
    kind: card
    topic: pathogenesis
    front: How does immunosenescence contribute to COPD?
    back: Age-related loss of protective molecules such as macrophage migration inhibitory factor (MIF) and other growth factors may lead to destruction of alveoli and terminal airways.
    src: { page: 198, quote: "Immunosenescence: Age-related loss of protective immune molecules such as macrophage migration inhibitory factor (MIF) and other growth factors thought to lead to destruction of alveoli and terminal airways in COPD." }
    status: unverified
  - id: geri.L11.041
    kind: table
    topic: pathogenesis
    title: Chronic bronchitis vs emphysema (book figure, p198)
    columns: [Feature, Chronic bronchitis, Emphysema]
    rows:
      - [Site, Larger airways, Terminal airways]
      - [Main change, Airway remodeling, Loss of alveoli]
      - [Second change, Mucus secretion, Loss of elastin]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 198, quote: "| Chronic Bronchitis | Emphysema |\n|---|---|\n| Larger airways | Terminal airways |\n| Airway remodeling | Loss of alveoli |\n| Mucus secretion | Loss of elastin |\nThe balance between them is set by: Apoptosis; Inflammation; Growth Factors; Immune Reponses; Oxidants/Anti-oxidants" }
    status: unverified
  - id: geri.L11.042
    kind: enumerate
    topic: pathogenesis
    prompt: COPD-based respiratory impairments.
    points: [Mucus hypersecretion, Chronic airflow obstruction, Air trapping and hyperinflation, Gas exchange abnormalities (V/Q mismatch)]
    pass: 4
    hook: "رئة الـCOPD «مخاط، سدة، حبسة، وتبادل بايظ»: mucus hypersecretion، chronic airflow obstruction، air trapping وhyperinflation، وgas exchange abnormalities (V/Q mismatch). 4."
    src: { page: 199, quote: "COPD-based respiratory impairments include\n  (1) Mucus hyper secretion.\n  (2) Chronic airflow obstruction.\n  (3) Air trapping and hyperinflation,\n  (4) Gas exchange abnormalities. (V / Q mismatch)." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.043
    kind: cloze
    topic: pathogenesis
    text: "Chronic bronchitis = chronic cough and sputum for at least {{c1::3 months}} per year for {{c2::2 consecutive years}}; its hallmark is {{c3::mucus hypersecretion}}."
    src: { page: 199, quote: "CHRONIC BRONCHITIS ……. Mucus hyper secretion is the hallmark of chronic bronchitis, defined as chronic cough and sputum production for at least 3 months per year for 2 consecutive years." }
    status: unverified
    tags: [high-yield, numbers]
  - id: geri.L11.044
    kind: card
    topic: pathogenesis
    front: Major site of airway resistance in COPD?
    back: Airways less than 2 mm in diameter.
    src: { page: 199, quote: "These clinical features result from persistent airway inflammation COPD : ….. major site of airway resistance (obstruction) the airways less than 2 mm in diameter." }
    status: unverified
    tags: [numbers]
  # ---------- p199-201: clinical, phenotypes, course ----------
  - id: geri.L11.045
    kind: card
    topic: phenotypes
    front: Gas exchange in advanced COPD and its cardiovascular result?
    back: Hypoxemia and hypercapnia (acute or chronic respiratory acidosis); hypoxic pulmonary vasoconstriction leads to pulmonary hypertension and cor pulmonale.
    src: { page: 199, quote: "Clinical picture (some notes)\n  Exercise intolerance, symptom-limiting dyspnea.\n  Increased risk of respiratory failure.\n  GAS exchange abnormalities\n  In advanced COPD hypoxemia and hypercapnia, yieldingacute/chronic respiratory acidosis (resp. failure).\n  Hypoxic pulmonary vasoconstriction, pulmonary hypertension and cor pulmonale.\n  Marked intrathoracic pressure swings can decrease left ventricular preload and increase left ventricular diastolic dysfunction, ultimately reducing the cardiac output.\n  The systemic inflammation, immune response, anorexia, and severe deconditioning of COPD most often seen with the emphysema phenotype, can lead to osteoporosis and sarcopenia." }
    status: unverified
  - id: geri.L11.046
    kind: card
    topic: phenotypes
    front: How can COPD reduce cardiac output?
    back: Marked intrathoracic pressure swings lower left ventricle (LV) preload and increase LV diastolic dysfunction.
    src: { page: 199, quote: "Clinical picture (some notes)\n  Exercise intolerance, symptom-limiting dyspnea.\n  Increased risk of respiratory failure.\n  GAS exchange abnormalities\n  In advanced COPD hypoxemia and hypercapnia, yieldingacute/chronic respiratory acidosis (resp. failure).\n  Hypoxic pulmonary vasoconstriction, pulmonary hypertension and cor pulmonale.\n  Marked intrathoracic pressure swings can decrease left ventricular preload and increase left ventricular diastolic dysfunction, ultimately reducing the cardiac output.\n  The systemic inflammation, immune response, anorexia, and severe deconditioning of COPD most often seen with the emphysema phenotype, can lead to osteoporosis and sarcopenia." }
    status: unverified
  - id: geri.L11.047
    kind: card
    topic: phenotypes
    front: Which COPD phenotype most often leads to osteoporosis and sarcopenia, and why?
    back: The emphysema phenotype, through systemic inflammation, immune response, anorexia and severe deconditioning.
    src: { page: 199, quote: "Clinical picture (some notes)\n  Exercise intolerance, symptom-limiting dyspnea.\n  Increased risk of respiratory failure.\n  GAS exchange abnormalities\n  In advanced COPD hypoxemia and hypercapnia, yieldingacute/chronic respiratory acidosis (resp. failure).\n  Hypoxic pulmonary vasoconstriction, pulmonary hypertension and cor pulmonale.\n  Marked intrathoracic pressure swings can decrease left ventricular preload and increase left ventricular diastolic dysfunction, ultimately reducing the cardiac output.\n  The systemic inflammation, immune response, anorexia, and severe deconditioning of COPD most often seen with the emphysema phenotype, can lead to osteoporosis and sarcopenia." }
