schema: batna.lesson/v1
lecture: dm.L14
lessons:
  # ------------------------------------------------------------------
  - id: dm.L14.lesson1
    title: "السكر وقع: مين بيلحقه؟"
    hook: "خمس هرمونات بتجري تنقذ السكر لما يوقع. ولو ما لحقوش، الدرجة بتتحدد بمين اللي بيلحقك."
    minutes: 9
    pages: [179, 180]
    topics: [basics, causes]
    goals:
      - "تعدّ الـ counter-regulatory hormones"
      - "تعرف تعريف الكتاب ودرجاته الـ 3"
      - "تقسم الأسباب fasting و postprandial"
    status: unverified
    steps:
      - kind: mnemonic
        page: 179
        quote: "Counter-regulatory hormones:\n  1. GH\n  2. Thyroid hormones\n  3. Epinephrine and Nor\n  4. Cortisol\n  5. Glucagon."
        word: "GTECG"
        hook: "الـ counter-regulatory hormones اللي بترفع السكر:"
        parts:
          - { key: "G", text: "GH" }
          - { key: "T", text: "Thyroid hormones" }
          - { key: "E", text: "Epinephrine و norepinephrine" }
          - { key: "C", text: "Cortisol" }
          - { key: "G", text: "Glucagon" }
      - kind: aside
        tone: analogy
        page: 179
        quote: "Counter-regulatory hormones:\n  1. GH\n  2. Thyroid hormones\n  3. Epinephrine and Nor\n  4. Cortisol\n  5. Glucagon."
        text: |
          الإنسولين لوحده هو اللي بينزّل السكر، وخمس **counter-regulatory hormones** ضده بيرفعوه. زي فريق كورة فيه مهاجم واحد وخمس مدافعين: لو المهاجم شاط جامد (insulinoma أو جرعة زيادة)، أو مدافع غاب (Addison، hypopituitarism)، السكر بيدخل جون.
      - kind: explain
        page: 179
        title: "كل هرمون بيرفع السكر إزاي؟"
        quote: "Counter-regulatory hormones:"
        text: |
          الكتاب بيعدّ الخمسة بس. التفسير المقبول (مش في الكتاب) إنهم بيشتغلوا على **سرعتين**:

          - **السريعين (دقايق)**: الـ ==glucagon== بيكسّر الـ **glycogen** في الكبد فورًا، والـ **epinephrine** بيعمل نفس الشغل وبيوقف إفراز الـ insulin.
          - **البطيئين (ساعات)**: الـ **cortisol** والـ **GH** بيشغّلوا الـ **gluconeogenesis** وبيعملوا insulin resistance، والـ **thyroid hormones** بتزوّد امتصاص الـ glucose وحرقه بشكل عام.

          عشان كده نقص أي واحد منهم (Addison، hypopituitarism، myxedema) بيبان كسبب **secondary** للـ fasting hypoglycemia: الجسم فقد مدافع.
      - kind: explain
        page: 179
        quote: "Blood glucose levels below 70 mg/dL are accompanied by adrenergic or gastrointestinal manifestations."
        title: "التعريف والصورة"
        text: |
          الـ ==hypoglycemia== عند الكتاب = سكر **أقل من 70 mg/dL** ومعاه أعراض **adrenergic** أو **gastrointestinal tract (GIT)**.

          - **GIT**: epigastric pain، nausea و vomiting.
          - **Adrenergic**: palpitation، sweating، tremors، numbness، ولحد الـ coma.

          ليه الأعراض دي بالذات؟ التفسير المقبول (مش في الكتاب): لما السكر يوقع الجسم بيضرب جرس الـ **epinephrine** (أحد الـ counter-regulatory hormones)، والـ epinephrine نفسه هو اللي بيعمل الرعشة والعرق ودقات القلب. يعني الأعراض الـ adrenergic هي **صوت الإنذار**، مش المرض. ولو السكر فضل واطي، المخ نفسه بيجوع فتيجي اللخبطة والـ coma.
      - kind: figure
        page: 179
        quote: "Grade III: Severe, go to the hospital to receive glucose infusion and glucagon."
        title: "التلات درجات"
        alt: "Three stacked boxes: grade I mild, the patient helps himself; grade II moderate, needs someone's help to reach glucose; grade III severe, hospital glucose infusion and glucagon."
        caption: "الدرجة بتتحدد بمين اللي بيعالج: انت، حد جنبك، ولا المستشفى."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="62" rx="8" class="fg-good"/>
            <text x="20" y="34" class="t-b">Grade I · Mild</text>
            <text x="20" y="56" class="t-sm">Helps himself (takes glucose)</text>
            <rect x="10" y="84" width="310" height="62" rx="8" class="fg-acc"/>
            <text x="20" y="108" class="t-b">Grade II · Moderate</text>
            <text x="20" y="130" class="t-sm">Needs help to reach the glucose</text>
            <rect x="10" y="158" width="310" height="62" rx="8" class="fg-bad"/>
            <text x="20" y="182" class="t-b">Grade III · Severe</text>
            <text x="20" y="204" class="t-sm">Hospital: glucose infusion + glucagon</text>
          </svg>
      - kind: update
        ref: "ADA Standards of Care 2025, section 6"
        text: "الـ American Diabetes Association (ADA) بيقسم بالرقم: level 1 أقل من 70، level 2 أقل من 54، و level 3 حدث شديد محتاج مساعدة. في الامتحان: درجات الكتاب."
      - kind: check
        page: 179
        quote: "Grade II: Moderate needs help to reach the glucose."
        question: "A patient with T1DM is confused and his wife has to give him juice. Book grade?"
        options:
          - "Grade II (moderate)"
          - "Grade I (mild)"
          - "Grade III (severe)"
          - "Not hypoglycemia"
        answer: 0
        why:
          - "صح: محتاج حد يساعده يوصل للجلوكوز."
          - "الـ mild لما يلحق نفسه بنفسه."
          - "الـ severe = مستشفى، glucose infusion و glucagon."
          - "فيه أعراض والسكر واطي."
      - kind: figure
        remind: [dm.L14.007]
        page: 180
        quote: "Common Causes of Hypoglycemia in Adults:\n  1-Fasting Hypoglycemia"
        title: "خريطة الأسباب"
        alt: "A tree: fasting hypoglycaemia splits into primary (hyperinsulinism from B-cell tumour or surreptitious insulin or OHA, and non-insulin-secreting tumour) and secondary (endocrine: hypopituitarism, Addison, myxoedema; liver: acute alcoholism, liver failure; renal failure). Postprandial splits into early (post-gastrectomy, vagal tone) and late (occult DM, counter-regulatory deficiency, idiopathic, alcohol, immunopathogenic)."
        caption: "صايم ولا واكل؟ ده أول سؤال. وبعدين: الإنسولين عالي (primary) ولا عضو تاني بايظ (secondary)؟"
        svg: |
          <svg viewBox="0 0 330 404" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="28" rx="6" class="fg-ink"/>
            <text x="165" y="29" text-anchor="middle" class="t-b">Fasting hypoglycemia</text>
            <rect x="10" y="46" width="310" height="66" rx="6" class="fg-acc"/>
            <text x="20" y="66" class="t-sm t-b">Primary</text>
            <text x="20" y="84" class="t-sm">Hyperinsulinism: B-cell tumor,</text>
            <text x="20" y="102" class="t-sm">surreptitious insulin/OHA · non-insulin tumor</text>
            <rect x="10" y="120" width="310" height="84" rx="6" class="fg-box"/>
            <text x="20" y="140" class="t-sm t-b">Secondary</text>
            <text x="20" y="158" class="t-sm">Endocrine: hypopituitarism, Addison, myxedema</text>
            <text x="20" y="176" class="t-sm">Liver: acute alcoholism, liver failure</text>
            <text x="20" y="194" class="t-sm">Renal failure</text>
            <rect x="10" y="222" width="310" height="28" rx="6" class="fg-ink"/>
            <text x="165" y="241" text-anchor="middle" class="t-b">Postprandial hypoglycemia</text>
            <rect x="10" y="258" width="310" height="48" rx="6" class="fg-acc"/>
            <text x="20" y="278" class="t-sm t-b">Early (alimentary)</text>
            <text x="20" y="296" class="t-sm">Post gastrectomy · functional vagal tone</text>
            <rect x="10" y="314" width="310" height="80" rx="6" class="fg-box"/>
            <text x="20" y="334" class="t-sm t-b">Late</text>
            <text x="20" y="352" class="t-sm">Occult DM · counter-regulatory deficiency</text>
            <text x="20" y="370" class="t-sm">Idiopathic · alcohol</text>
            <text x="20" y="388" class="t-sm">Immunopathogenic</text>
          </svg>
      - kind: sort
        page: 180
        quote: "Endocrine (hypopituitrism – Addison – Myxedema)"
        prompt: "صنّف كل سبب:"
        bins: ["Fasting, primary", "Fasting, secondary", "Postprandial"]
        cards:
          - { text: "Insulinoma", bin: 0 }
          - { text: "Surreptitious insulin", bin: 0 }
          - { text: "Addison's disease", bin: 1 }
          - { text: "Liver failure", bin: 1 }
          - { text: "Renal failure", bin: 1 }
          - { text: "Post gastrectomy", bin: 2 }
          - { text: "Occult DM", bin: 2 }
        why: "الـ primary = hyperinsulinism أو tumor. الـ secondary = غدد، كبد، كلى. والـ gastrectomy (early) والـ occult diabetes mellitus (DM) (late) postprandial."
      - kind: explain
        page: 180
        title: "ليه الـ secondary causes دي بتوقع السكر؟"
        quote: "b-2ry causes\n       4. Endocrine (hypopituitrism – Addison – Myxedema)\n       5. Liver (Acute alcoholism - liver failure)\n       6. Renal failure."
        text: |
          في الـ **primary** المشكلة إن فيه **insulin زيادة** (ورم أو حقنة). في الـ **secondary** الـ insulin طبيعي، بس المصنع أو المدافعين بايظين. التفسير المقبول (مش في الكتاب):

          - **Endocrine** (hypopituitarism، Addison، myxedema): غاب الـ cortisol والـ GH أو الـ thyroid، يعني مدافعين ناقصين.
          - **Liver** (acute alcoholism، liver failure): الكبد هو مخزن الـ glycogen ومصنع الـ gluconeogenesis، فلو بايظ مفيش سكر وقت الصيام.
          - **Renal failure**: الكلية بتعمل جزء من الـ gluconeogenesis وبتكسّر الـ insulin، فلما تقع السكر بيقل والـ insulin بيقعد أطول.

          وده بيفسّر ليه كلهم **fasting**: المشكلة بتبان لما الأكل يقف والجسم يعتمد على مخزونه.
      - kind: try
        items: [dm.L14.001, dm.L14.002, dm.L14.004, dm.L14.007, dm.L14.010]
    recap:
      - "Counter-regulation: GH، thyroid، epinephrine/NE، cortisol، glucagon."
      - "Hypoglycemia (الكتاب) = <70 mg/dL مع أعراض adrenergic أو GIT."
      - "Grade I يلحق نفسه، II محتاج مساعدة، III مستشفى."
      - "Fasting: primary (insulin زيادة) و secondary (مدافعين أو مصنع ناقص: غدد، كبد، كلى). Postprandial: early و late."
      - "الأعراض الـ adrenergic = جرس الـ epinephrine؛ الـ neuroglycopenia = المخ جعان."
    practice: [dm.L14.001, dm.L14.002, dm.L14.003, dm.L14.004, dm.L14.005, dm.L14.006, dm.L14.007, dm.L14.008, dm.L14.009, dm.L14.010, dm.L14.011]
  # ------------------------------------------------------------------
  - id: dm.L14.lesson2
    title: "بعد الأكل، بعد الكاس، وبالحقنة"
    hook: "تلات أنواع hypoglycemia ملهاش علاقة بورم: معدة مستعجلة، كبد سكران، وحقنة متخبية."
    minutes: 9
    pages: [180, 183]
    topics: [reactive, autoimmune]
    goals:
      - "تشرح ميكانيزم الـ alimentary hypoglycemia وعلاجها"
      - "تشرح الـ alcohol-induced hypoglycemia"
      - "تشخّص الـ factitious و autoimmune hypoglycemia"
    status: unverified
    steps:
      - kind: figure
        page: 181
        quote: "Rapid discharge of ingested CHO into the small bowel followed by rapid glucose absorption and hyperinsulinism, e.g., after gastric surgery (dumping syndrome), after gastotomy"
        title: "ليه السكر بيوقع بعد الأكل؟"
        alt: "A vertical chain: gastric surgery leads to rapid discharge of carbohydrate into the small bowel, then rapid glucose absorption and a glucose spike, then excessive insulin release, then hypoglycaemia 1-2 hours later. Treatment: frequent small meals."
        caption: "المعدة بتفضي بسرعة، السكر يطلع فجأة، الإنسولين يرد بزيادة، والسكر يقع."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L14a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker></defs>
            <rect x="40" y="10" width="250" height="40" rx="8" class="fg-box"/>
            <text x="165" y="35" text-anchor="middle" class="t-sm">Gastric surgery (fast emptying)</text>
            <path d="M165 50v16" class="fg-arrow-acc" marker-end="url(#L14a)"/>
            <rect x="40" y="70" width="250" height="40" rx="8" class="fg-box"/>
            <text x="165" y="95" text-anchor="middle" class="t-sm">CHO rushes into small bowel</text>
            <path d="M165 110v16" class="fg-arrow-acc" marker-end="url(#L14a)"/>
            <rect x="40" y="130" width="250" height="40" rx="8" class="fg-box"/>
            <text x="165" y="155" text-anchor="middle" class="t-sm">Rapid absorption: glucose spike</text>
            <path d="M165 170v16" class="fg-arrow-acc" marker-end="url(#L14a)"/>
            <rect x="40" y="190" width="250" height="40" rx="8" class="fg-acc"/>
            <text x="165" y="215" text-anchor="middle" class="t-sm t-b">Hyperinsulinism</text>
            <path d="M165 230v16" class="fg-arrow-acc" marker-end="url(#L14a)"/>
            <rect x="40" y="250" width="250" height="40" rx="8" class="fg-bad"/>
            <text x="165" y="275" text-anchor="middle" class="t-sm t-b">Early reactive hypoglycemia</text>
            <text x="165" y="318" text-anchor="middle" class="t-sm t-good">Rx: frequent small meals</text>
          </svg>
      - kind: explain
        page: 181
        quote: "It might be functional: as it may represent over activity of parasympathetic nervous system"
        title: "الـ early من غير عملية"
        text: |
          ممكن تكون ==functional==: **parasympathetic overactivity** (vagal tone). وممكن يكون فيه **defective counter-regulation** (GH، cortisol، glucagon).

          والعلاج في الـ alimentary: ==frequent feeding== بوجبات صغيرة.

          ليه الوجبات الصغيرة بتعالج؟ التفسير المقبول (مش في الكتاب): المشكلة إن كمية carbohydrate كبيرة بتوصل الأمعاء **مرة واحدة**، فالسكر يطلع فجأة والـ insulin يرد بزيادة. لو الكمية صغيرة، القمة صغيرة، والـ insulin يرد على قدها، فمفيش وقعة بعدها.

          وفي الـ **late** postprandial (الـ **occult DM**): التفسير المقبول (مش في الكتاب) إن البنكرياس بيتأخر في الرد الأول (first-phase)، فالسكر يعلى، وبعدين يطلّع insulin كتير متأخر، فيقع السكر بعد 3–5 ساعات من الأكل.
      - kind: reveal
        page: 181
        quote: "Alcohol induced hypoglycemia\n  1. Due to hepatic glycogen depletion combined with alcohol mediated inhibition of gluconeogenesis"
        prompt: "واحد شرب كتير وما أكلش من امبارح. ليه سكره يوقع؟"
        answer: "ضربتين على الكبد: الـ ==glycogen== خلص من الجوع، والـ alcohol ==بيمنع الـ gluconeogenesis==. فمفيش مصدر للسكر. وبعدها بييجي **gastritis** و **vomiting**."
      - kind: aside
        tone: joke
        page: 181
        quote: "Alcohol induced hypoglycemia\n  1. Due to hepatic glycogen depletion combined with alcohol mediated inhibition of gluconeogenesis"
        text: |
          الكبد في الحالة دي زي مخبز المخزن بتاعه فاضي (glycogen) والفرّان مشغول في حاجة تانية خالص (بيكسّر الـ alcohol). فالزباين (المخ) يقفوا في الطابور ومفيش عيش.
      - kind: table
        page: 183
        quote: "Diagnosis\n  3. High immuno-reactive insulin\n  4. Suppressed C-peptide"
        title: "Factitious: إزاي تمسكها؟"
        columns: ["التحليل", "النتيجة"]
        rows:
          - ["Immunoreactive insulin", "High"]
          - ["C-peptide", "Suppressed"]
          - ["Insulin antibodies", "High"]
        hide: [[1, 1], [2, 1]]
      - kind: reveal
        page: 183
        quote: "Diagnosis\n  3. High immuno-reactive insulin\n  4. Suppressed C-peptide"
        prompt: "ليه الـ C-peptide بيبقى suppressed في الـ factitious insulin، وعالي في الـ insulinoma؟"
        answer: "البنكرياس بيقطع الـ proinsulin لـ ==insulin + C-peptide== بنفس العدد. الإنسولين اللي في الحقنة ملوش C-peptide، والإنسولين العالي بيكبس على البنكرياس فيقل. الـ insulinoma بيفرز الاتنين."
      - kind: check
        page: 183
        quote: "Diagnosis\n  3. High immuno-reactive insulin\n  4. Suppressed C-peptide"
        question: "Glucose 38 mg/dL, insulin very high, C-peptide suppressed, insulin antibodies high. Diagnosis?"
        options:
          - "Factitious hypoglycemia (injected insulin)"
          - "Insulinoma"
          - "Alcohol-induced hypoglycemia"
          - "Addison's disease"
        answer: 0
        why:
          - "صح: الـ triad بتاع الـ factitious."
          - "الـ insulinoma الـ C-peptide بتاعه عالي."
          - "الـ alcohol الإنسولين واطي."
          - "الـ Addison الإنسولين مش عالي."
      - kind: match
        page: 180
        quote: "Idiopathic anti-insulin antibodies (release bound insulin)"
        prompt: "وصّل كل نوع immunopathogenic بالميكانيزم:"
        pairs:
          - ["Anti-insulin antibodies", "Bind insulin, then release it"]
          - ["Insulin-receptor antibodies", "Act as agonists"]
          - ["Pentamidine", "Drug-induced hypoglycemia"]
        why: "الـ anti-insulin antibodies بتحجز الإنسولين وتسيبه بعدين، والـ receptor antibodies بتشغّل الـ receptor كأنها إنسولين، والـ pentamidine دوا."
      - kind: explain
        page: 180
        title: "الـ autoimmune hypoglycemia: إزاي جسمك يوقع سكره؟"
        quote: "Immuno-pathogenic hypoglycemia"
        text: |
          الكتاب بيحط تحت الـ **immuno-pathogenic hypoglycemia** تلات حاجات، وكل واحدة ليها منطق:

          - **Idiopathic anti-insulin antibodies** ==release bound insulin==: الـ antibody بيمسك الـ insulin بعد الأكل (فالسكر يعلى شوية لأن الـ insulin محجوز)، وبعدين يسيبه مرة واحدة بعد ساعات، فيقع السكر.
          - **Antibodies to insulin receptors** (==agonist==): الـ antibody بيقعد على الـ receptor ويشغّله كأنه insulin، ومفيش حاجة توقفه.
          - **Pentamidine**: التفسير المقبول (مش في الكتاب) إنه بيسمّم الـ beta cells، فبتفرّغ الـ insulin اللي فيها مرة واحدة، وبعدين ممكن يحصل سكر بعدها.

          في الاتنين الأولانيين الـ insulin مش من ورم، فالـ imaging ما هيلاقيش حاجة، والتحليل اللي بيكشف هو الـ antibodies.
      - kind: try
        items: [dm.L14.012, dm.L14.016, dm.L14.018, dm.L14.036, dm.L14.043]
    recap:
      - "Alimentary: تفريغ سريع → امتصاص سريع → hyperinsulinism. العلاج وجبات صغيرة متكررة."
      - "Alcohol: glycogen خلص + gluconeogenesis متوقف، وبعده gastritis و vomiting."
      - "Factitious: insulin عالي، C-peptide واطي، antibodies عالية."
      - "Autoimmune: anti-insulin Ab (بتمسك الـ insulin وتسيبه)، receptor Ab (agonist)، pentamidine."
      - "Occult DM: رد insulin متأخر وزيادة ← late postprandial hypo."
    practice: [dm.L14.012, dm.L14.013, dm.L14.014, dm.L14.015, dm.L14.016, dm.L14.017, dm.L14.018, dm.L14.019, dm.L14.036, dm.L14.037, dm.L14.038, dm.L14.040, dm.L14.043]
