      - kind: sort
        page: 168
        quote: "ascitic fluid total protein concentration is >1.5 g/dL, ascitic fluid PMN is >5,000 cells/mm3, ascitic culture is polymicrobial"
        prompt: "ده SBP ولا secondary bacterial peritonitis؟"
        bins: ["Suggests secondary", "Fits SBP"]
        cards:
          - { text: "Ascitic protein 2.4 g/dL", bin: 0 }
          - { text: "PMN 7,000/mm³", bin: 0 }
