  # Split from lesson1 and lesson2 on 2026-11-13 (#828): the lineage figure,
  # the stem cell and lymphopoiesis.
  - id: hem.L01.lesson4
    title: "شجرة العيلة: من stem cell واحدة لكل خلايا الدم"
    hook: "خلية واحدة بتعمل نسخة من نفسها وفي نفس الوقت بتطلّع خمس عائلات. اعرف مين ابن مين، ومين بيتعلم فين."
    minutes: 9
    pages: [2, 4]
    topics: [lineages, stem-cells]
    goals:
      - "تعرف كل blast بيطلّع أنهي خلية ناضجة، وتقرا السن من الاسم"
      - "تعرف قدرات الـ stem cell الثلاثة وليه الـ self-renewal أهمهم"
      - "تفرّق الـ B cells (بتنضج في النخاع) من الـ T cells (في الـ thymus)"
    status: unverified
    steps:
      - kind: figure
        page: 2
        quote: "Uncommitted stem cell gives rise to committed cells"
        title: "شكل الكتاب ص 2: شجرة العيلة، كل blast وخليته"
        image: { file: hem/L01-lineage-tree.webp, book: true }
        alt: "Book drawing of blood cell lineages. Top centre: one uncommitted stem cell. Five columns below it. Left: proerythroblast, basophilic erythroblast, erythroblast, normoblast with a small dark nucleus, reticulocyte, erythrocyte. Next: monoblast to monocyte. Centre: myeloblast to promyelocyte, which branches into three columns through stages [a] and [b] to neutrophil, basophil and eosinophil. Then lymphoblast to lymphocyte. Right: megakaryoblast to a large megakaryocyte that breaks into platelets."
        caption: |
          دي رسمة الكتاب نفسها. فوق في النص الـ **uncommitted stem cell**، وتحتها 5 أعمدة، كل عمود عيلة، ومن فوق لتحت = من الصغير للناضج:

          - **أول عمود شمال (الأحمر)**: proerythroblast ← basophilic erythroblast ← erythroblast ← **normoblast** (النواة بقت نقطة غامقة صغيرة على الجنب) ← ==reticulocyte== (النواة راحت) ← erythrocyte على شكل قرص.
          - **العمود التاني**: monoblast ← monocyte، سهم واحد طويل.
          - **العمود اللي في النص**: myeloblast ← ==promyelocyte==، وهنا الخط بيتفرّع لتلاتة. الصفين [a] و [b] مراحل وسط الكتاب ما سمّاهاش (المعروف إنهم myelocyte ثم metamyelocyte). شوف الـ granules: **زرقا غامقة** في عمود الـ **basophil**، **حمرا برتقاني** في الـ **eosinophil**، و**فاتحة** في الـ **neutrophil**، والنواة بتتفصّص وانت نازل.
          - **قبل الأخير**: lymphoblast ← lymphocyte صغير نواته مالية الخلية.
          - **أقصى اليمين**: megakaryoblast ← ==megakaryocyte== كبير ← حتت صغيرة متناثرة تحته هي الـ **platelets**.

          الخلاصة: اللي يخلّص بـ **-blast** صغير ولسه بيتعلم، واللي يخلّص بـ **-cyte** ناضج؛ وكل الخطوط طالعة من خلية واحدة فوق.
      - kind: explain
        page: 2
        title: "اقرا الاسم تعرف السن"
        quote: "Uncommitted stem cell gives rise to committed cells"
        text: |
          الشكل بيبدأ بـ **uncommitted stem cell** واحدة وبيخلّص بخمس خطوط من الـ **committed cells**. اللي يساعدك تحفظ من غير ما تصمّ:

          - **-blast** = خلية صغيرة السن، نواتها كبيرة ولسه بتتقسم.
          - **-cyte** = خلية ناضجة جاهزة تشتغل.
          - **pro-** = قبل الـ blast أو بعده على طول، أول خطوة في السلسلة.

          والتفسير المقبول (مش في الكتاب) للي بيحصل وانت نازل في العمود: الخلية **بتصغر**، و**نواتها بتتكثف**، والسيتوبلازم بيتملي بشغلتها: haemoglobin في الأحمر، و granules في الـ granulocytes. عشان كده الـ ==reticulocyte== فقد النواة خلاص، والـ ==promyelocyte== هو اللي الـ granules بتظهر فيه وبعده الخط بيتفرّع لتلاتة.
      - kind: order
        page: 2
        quote: "proerythroblast"
        prompt: "رتّب مراحل الـ red cell من أصغر لأنضج:"
        steps:
          - "Proerythroblast"
          - "Basophilic erythroblast"
          - "Erythroblast"
          - "Normoblast"
          - "Reticulocyte"
          - "Erythrocyte"
        why: "الـ **pro-** هو الأول دايمًا. والـ **reticulocyte** آخر محطة قبل الـ red blood cell (RBC): لسه فيه بقايا ribonucleic acid (RNA) وما بقاش فيه نواة. عشان كده الـ reticulocyte count بيقيس النخاع شغال قد إيه."
      - kind: match
        page: 2
        quote: "proerythroblast monoblast myeloblast lymphoblast megakaryoblast"
        prompt: "وصّل كل blast بالخلية الناضجة اللي بيطلّعها:"
        pairs:
          - ["Proerythroblast", "Erythrocyte"]
          - ["Monoblast", "Monocyte"]
          - ["Myeloblast", "Neutrophil, basophil, eosinophil"]
          - ["Lymphoblast", "Lymphocyte"]
          - ["Megakaryoblast", "Platelets"]
        why: "الاسم بيقولك: **erythro** = أحمر، **mono** = monocyte، **myelo** = الـ granulocytes، **lympho** = lymphocyte، **megakaryo** = الخلية العملاقة اللي بتتفتت platelets."
      - kind: figure
        page: 2
        quote: "Bone Marrow and Peripheral Blood"
        title: "النخاع والدم تحت الميكروسكوب (صور الكتاب ص 2)"
        image: { file: hem/L01-marrow-blood-photos.webp, book: true }
        alt: "Three light-microscope photos under the heading Bone Marrow and Peripheral Blood. Top left: a low-power section of a bone marrow biopsy, pink bone trabeculae with marrow between them, partly cellular and partly white fat spaces. Top right: a high-power bone marrow smear crowded with nucleated precursor cells of many sizes and stages. Bottom: a normal peripheral blood film, many pale pink red cells and a single white cell with a lobed nucleus."
        caption: |
          الكتاب حاطط 3 صور تحت عنوان **Bone Marrow and Peripheral Blood** من غير أسماء عليها، فدي قراءتها (الأسماء مش مكتوبة في الكتاب):

          - **فوق شمال**: قطاع من **bone marrow biopsy** بتكبير صغير. الحتت **الوردي الغامق** هي العضم (trabeculae)، وبينها النخاع: جزء مليان خلايا وجزء **أبيض مخرّم** ده الدهن (fat spaces).
          - **فوق يمين**: **bone marrow smear** بتكبير كبير. زحمة خلايا **ليها نواة** في مراحل مختلفة، كبيرة وصغيرة، نواتها مدورة أو مفصّصة: ده المصنع وهو شغال.
          - **تحت**: **peripheral blood film** طبيعي. كرات حمرا كتير **من غير نواة** ونصها فاتح، وخلية بيضا واحدة نواتها مفصّصة.

          قارن فوق يمين بتحت: في النخاع كل المراحل اللي في الشجرة اللي فوق، وفي الدم بيطلع ==الناضج بس==. ده معنى إن النخاع هو المصنع والدم هو السوق.
      - kind: explain
        page: 3
        title: "الـ pluripotential stem cell"
        quote: "The pluripotential stem cell is the first in a sequence of steps of hematopoietic cell generation and maturation. Stem cells carry out the ultimate burden of generating multi-lineage mature blood cells over the life time of the organism. These cells have the capacity for self-renewal as well as proliferation and differentiation into committed progenitor cells. This group of committed progenitors is destined to develop into distinct cell lines."
        text: |
          أول خطوة في السلسلة هي الـ ==pluripotential stem cell==. هي اللي شايلة حِمل تصنيع **كل** خلايا الدم طول العمر.

          عندها 3 قدرات:
          - **Self-renewal**: تعمل نسخة من نفسها فما تخلصش.
          - **Proliferation**: تتكاثر.
          - **Differentiation**: تتحول لـ ==committed progenitors==، وكل مجموعة منهم مكتوب لها تبقى cell line معينة.

          الكتاب بيقول إنها شايلة **ultimate burden**، عشان كل خلية دم في جسمك طول عمرك أصلها منها.
      - kind: aside
        tone: analogy
        page: 3
        quote: "The pluripotential stem cell is the first in a sequence of steps of hematopoietic cell generation and maturation. Stem cells carry out the ultimate burden of generating multi-lineage mature blood cells over the life time of the organism. These cells have the capacity for self-renewal as well as proliferation and differentiation into committed progenitor cells. This group of committed progenitors is destined to develop into distinct cell lines."
        text: "الـ stem cell زي الست اللي عندها **عجينة أم** للعيش: كل مرة تاخد حتة تخبزها (differentiation) وتسيب حتة تكبر تاني (self-renewal). لو خبزت العجينة كلها، خلاص مفيش عيش بكرة."
      - kind: reveal
        page: 3
        quote: "The pluripotential stem cell is the first in a sequence of steps of hematopoietic cell generation and maturation. Stem cells carry out the ultimate burden of generating multi-lineage mature blood cells over the life time of the organism. These cells have the capacity for self-renewal as well as proliferation and differentiation into committed progenitor cells. This group of committed progenitors is destined to develop into distinct cell lines."
        prompt: "ليه الـ self-renewal أهم قدرة في الـ stem cell؟"
        answer: "من غير **self-renewal** الـ stem cells هتخلص وهي بتتمايز، والنخاع يفضى. هي اللي بتخلّي مصدر صغير يكفي **طول العمر**، وهي نفس الخاصية اللي بتخلي الـ bone marrow transplant ينفع."
      - kind: figure
        page: 3
        quote: "GM-CSF"
        title: "شكل الكتاب ص 3: مين بيزق كل سهم؟"
        image: { file: hem/L01-growth-factor-arrows.webp, book: true }
        alt: "Book drawing: a pluripotent stem cell in the centre. Arrows: EPO up-left to red blood cells; TPO and IL-11 up to a megakaryocyte and then platelets; IL-7 up-right to a lymphoid cell that gives a T lymphocyte, and with IL-6 a B lymphocyte; GM-CSF left to a myeloid cell that gives a monocyte with M-CSF, and below, the granulocytes: neutrophil with G-CSF, basophil with IL-3 and eosinophil with IL-5."
        caption: |
          في النص الـ ==pluripotent stem cell==، وكل سهم طالع منها مكتوب عليه الـ **growth factor** اللي بيزقّه:

          - **فوق شمال**: سهم **Erythropoietin (EPO)** للـ **red blood cells**.
          - **فوق في النص**: **thrombopoietin (TPO) + IL-11** ← **megakaryocyte** ← **platelets**.
          - **فوق يمين**: **IL-7** ← خلية lymphoid ← **T lymphocyte**، ومنها بـ **IL-6** ← **B lymphocyte**.
          - **شمال**: ==GM-CSF== ← خلية myeloid، ومنها **M-CSF** ← **monocyte**.
          - **تحت (Granulocytes)**: من نفس الخلية الـ myeloid، **G-CSF** ← neutrophil، **IL-3** ← basophil، **IL-5** ← eosinophil.

          يعني الـ stem cell نفسها مش بتقرر لوحدها: كل خط بيتفتح بـ ==factor== معين، وده اللي هيتفصّل في جدول ص 6.
      - kind: check
        page: 3
        quote: "Pluripotent stem cell → TPO, IL-11 → Megakaryocyte → Platelets"
