            <text x="252" y="142" text-anchor="middle" class="t-sm">chronic (&gt;6 months)</text>
            <path d="M252 156v30" class="fg-arrow-bad" marker-end="url(#L05b)"/>
            <rect x="152" y="190" width="170" height="40" rx="8" class="fg-box"/>
            <text x="237" y="215" text-anchor="middle" class="t-sm t-b">Chronic hepatitis</text>
            <path d="M237 230v30" class="fg-arrow-bad" marker-end="url(#L05b)"/>
            <text x="230" y="250" text-anchor="end" class="t-sm t-mut">~20 years</text>
            <rect x="122" y="264" width="200" height="56" rx="8" class="fg-bad"/>
            <text x="222" y="286" text-anchor="middle" class="t-b t-bad">Cirrhosis ~15–30%</text>
            <text x="222" y="306" text-anchor="middle" class="t-sm">over 20 years</text>
            <path d="M222 320v30" class="fg-arrow-bad" marker-end="url(#L05b)"/>
            <rect x="122" y="354" width="200" height="56" rx="8" class="fg-bad"/>
            <text x="222" y="377" text-anchor="middle" class="t-b t-bad">HCC</text>
            <text x="222" y="397" text-anchor="middle" class="t-sm">mainly with cirrhosis</text>
            <text x="10" y="190" class="t-sm t-good">no chronic</text>
            <text x="10" y="206" class="t-sm t-good">disease</text>
          </svg>
      - kind: aside
        tone: exam
        page: 91
        text: |
          ركّز في الأرقام كأزواج: **15–45** يخفّوا و **55–85** يزمنوا. الاتنين بيكمّلوا بعض لـ 100 (45 + 55 = 100، و 15 + 85 = 100).

          والـ cirrhosis رقمين برضه: **15–30%** في **20 سنة**.
      - kind: check
        page: 91
        question: "A nurse develops acute HCV after a needlestick injury. Which statement is most accurate?"
        options:
          - "Most patients (55–85%) stay infected beyond 6 months"
          - "Almost all patients clear the virus spontaneously"
          - "Cirrhosis develops in most patients within 5 years"
          - "HCC usually arises in a non-cirrhotic liver"
        answer: 0
        why:
          - "صح: الـ chronicity **55–85%**، والـ clearance بس **15–45%**."
          - "بالعكس: الأقلية هي اللي بتخف لوحدها (15–45%)."
          - "الـ cirrhosis في **15–30%** وعلى مدى **20 سنة**، مش أغلبهم في 5."
          - "الكتاب: HCC **mainly with cirrhosis**."
      - kind: explain
        page: 92
        title: "الأعراض: الساكت اللي بيتكلم أحيانًا"
        text: |
          - **Acute HCV**: غالبًا asymptomatic، أو أعراض nonspecific زي fatigue و anorexia و nausea و jaundice. يعني ممكن يعدّي على إنه «دور برد وتعب».
          - **Chronic HCV**: غالبًا ==silent for years==. أحيانًا fatigue أو RUQ discomfort أو arthralgia، وكلها حاجات مابتخليش حد يجري على دكتور.

          وده بيشرح ليه ناس كتير بتكتشفه بالصدفة، في تحليل قبل عملية أو قبل التبرع بالدم.

          وفيه وش تاني برة الكبد خالص، اسمه ==extrahepatic manifestations==: cryoglobulinemia و glomerulonephritis و lymphoma و insulin resistance. أحيانًا ده أول حاجة تخلي الفيروس يبان.
      - kind: mnemonic
        page: 92
        word: "CLING"
        parts:
          - { key: "C", text: "Cryoglobulinemia" }
          - { key: "L", text: "Lymphoma" }
          - { key: "I", text: "Insulin resistance" }
          - { key: "NG", text: "Nephritis: Glomerulonephritis" }
        hook: |
          فيروس C **بيلزق (CLING)** في الجسم كله مش في الكبد بس. الأربعة اللي في الكتاب: Cryoglobulinemia، Lymphoma، Insulin resistance، و GlomeruloNephritis (الـ NG).
      - kind: aside
        tone: analogy
        text: |
          ليه الكلى والجلد والـ lymph nodes؟ الشرح المقبول (مش من نص الكتاب): الفيروس بيحفّز الـ **B cells** باستمرار، فتطلّع **cryoglobulins** (immune complexes) تترسب في الأوعية الصغيرة: في الجلد (purpura)، في المفاصل، وفي الـ **glomeruli** (GN). ونفس التحفيز المزمن للـ B cells ممكن يوصل لـ **B-cell lymphoma**.

          تخيّلها زي ماسورة بتنقّط **غِرا** في كل أوضة في البيت.
      - kind: explain
        page: 92
        title: "التشخيص: اختبارين ولكل واحد شغلانة"
        text: |
          كل اختبار بيجاوب على سؤال مختلف:

          - **Screening test**: ==HCV Ab (anti-HCV)==. بيسأل «الجسم شاف الفيروس قبل كده؟». رخيص وسهل، فبيتعمل للكل.
          - **Confirmatory test**: ==HCV RNA (PCR)== أو HCV core antigen. بيسأل «الفيروس موجود دلوقتي؟». ده اللي بيقرر العلاج.
          - **Genotyping**: for treatment planning. بس بقى less critical now، لأن الـ pangenotypic DAAs بتشتغل على كل الـ genotypes.
          - **Fibrosis assessment**: بيسأل «الكبد اتأذى قد إيه؟». بيتعمل non-invasive بـ FibroScan أو APRI أو FIB-4، والـ liver biopsy rarely used now.

          ليه الـ fibrosis مهمة؟ لأنها اللي بتقولك المريض محتاج متابعة HCC بعد الشفا ولا لأ، زي ما هنشوف في درس 4.
      - kind: reveal
        page: 92
        prompt: "واحد عنده **anti-HCV positive** بس **HCV RNA negative**. ده معناه إيه؟ وليه مانكتفيش بالـ antibody؟"
        answer: |
          الـ antibody زي **الندبة**: بتقول إن الجسم شاف الفيروس قبل كده، مش إن الفيروس لسه موجود.

          افتكر إن **15–45%** بيعملوا **spontaneous clearance**، وكمان اللي اتعالجوا: الاتنين بيفضل عندهم anti-HCV positive. علشان كده لازم **RNA (أو core antigen)** يثبت إن العدوى **active**. وللسبب ده برضه الـ cure بيتقاس بالـ **RNA** مش بالـ antibody.
      - kind: figure
        page: 92
        title: "خطوات التشخيص"
        alt: "Flow chart. Anti-HCV screening. If negative, no infection. If positive, test HCV RNA by PCR or core antigen. If RNA negative, past or cleared infection. If RNA positive, active infection: assess fibrosis with FibroScan, APRI or FIB-4 and plan DAAs; genotype is less critical with pangenotypic DAAs."
        caption: "الـ antibody بيفرز، والـ RNA بيأكد. بعد التأكيد: قيّم الـ fibrosis (FibroScan، APRI، FIB-4) واختار العلاج."
