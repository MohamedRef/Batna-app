            <text x="20" y="255" class="t-sm t-b">If ineffective: sphincter repair, sacral nerve</text>
            <text x="20" y="271" class="t-sm">stimulation, artificial sphincter, colostomy</text>
          </svg>
      - kind: check
        page: 139
        quote: "Sacral nerve stimulation"
        question: "A woman with urge incontinence has a weak, intact sphincter and did not improve with neuromuscular training. What does the algorithm offer next"
        options:
          - "Sacral nerve stimulation"
          - "More loperamide only"
          - "Botulinum toxin to the puborectalis"
          - "No further options"
        answer: 0
        why:
          - "صح: لو الـ training فشل، يبقى sacral nerve stimulation أو sphincter repair، وبعدهم artificial sphincter أو colostomy."
          - "الـ loperamide بدري في المسار لو فيه diarrhea، مش بعد ما الـ training يفشل."
          - "ده مش في الـ algorithm بتاع الكتاب."
          - "فيه خطوات جراحية كتير بعد الـ training."
      - kind: explain
        page: 140
        quote: "Recurrent uncontrolled passage of fecal material in an individual with a developmental age of at least 4 years."
        title: "Rome IV: F1 و F2"
        text: |
          **F1. Fecal incontinence:** نزول براز متكرر من غير تحكم، في حد ==developmental age== لا يقل عن **4 years**، آخر 3 شهور.

          **F2. Functional anorectal pain** تلات أنواع، والفرق في **مدة النوبة** و **tenderness on puborectalis traction**:
          - **Levator ani syndrome:** ألم مزمن، نوبات ==30 minutes or longer==، و tenderness موجودة.
          - **Unspecified functional anorectal pain:** نفس الأعراض، **من غير** tenderness.
          - **Proctalgia fugax:** ألم مفاجئ ثواني لدقايق (**max 30 minutes**)، ومفيش ألم بين النوبات.

          والكل لازم تستبعد IBD، abscess، fissure، thrombosed hemorrhoids، prostatitis، و coccygodynia.
      - kind: table
        page: 141
        quote: "Episodes last from seconds to minutes with a maximum duration of 30 minutes"
        title: "Functional anorectal pain"
        columns: ["Disorder", "Episodes", "Puborectalis tenderness"]
        rows:
          - ["Levator ani syndrome", "Chronic aching, 30 minutes or longer", "Present"]
          - ["Unspecified functional anorectal pain", "Chronic aching, 30 minutes or longer", "Absent"]
          - ["Proctalgia fugax", "Seconds to minutes, max 30 minutes; none between", "Not required"]
        hide: [[0, 2], [1, 2], [2, 1]]
      - kind: aside
        tone: tip
        page: 141
        quote: "Recurrent episodes of pain localized to the rectum and unrelated to defecation"
        text: |
          كلمة **fugax** لاتيني معناها "هربان" أو "عابر" (زي fugitive): ألم بييجي فجأة ويهرب في ثواني أو دقايق، و ==unrelated to defecation==.

          أما الـ **levator** فمرتبط بعضلة: لما تشد الـ puborectalis في الكشف، المريض يوجعه.
      - kind: check
        page: 140
        quote: "Tenderness during traction on the puborectalis"
        question: "A 50-year-old has rectal aching for months, with episodes lasting about an hour. Posterior traction on the puborectalis is tender. Fissure, abscess and IBD are excluded. Diagnosis"
        options:
          - "Levator ani syndrome"
          - "Proctalgia fugax"
          - "Unspecified functional anorectal pain"
          - "Dyssynergic defecation"
        answer: 0
        why:
          - "صح: نوبات 30 دقيقة أو أكتر + tenderness = levator ani."
          - "الـ fugax نوباته max 30 دقيقة، ومالوش tenderness شرط."
          - "ده نفس الصورة بس من غير tenderness."
          - "ده defecation disorder في واحد عنده constipation، مش ألم."
      - kind: figure
        page: 141
        quote: "Inappropriate contraction of the pelvic floor as measured with anal surface EMG or manometry with adequate propulsive forces"
        title: "F3: الزقة والباب"
        alt: "Three columns, each with a downward push arrow above a rectum and two sphincter blocks below. Normal: thick push arrow and the sphincter blocks apart (anus relaxes). F3a inadequate defecatory propulsion: thin push arrow and neutral blocks (anus may or may not tighten). F3b dyssynergic defecation: thick push arrow and red blocks pressed together (pelvic floor contracts). Footer: F3 needs functional constipation or IBS-C plus 2 of 3 abnormal tests: balloon expulsion, manometry or EMG, imaging."
        caption: "التبرّز محتاج حاجتين مع بعض: زقّة كفاية من البطن، وباب بيفتح. F3a الزقة ضعيفة. F3b الزقة كويسة بس الباب بيتقفل."
        svg: |
