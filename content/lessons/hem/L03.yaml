  - id: hem.L03.lesson3
    title: "الـ minor والـ alpha: عدّ الجينات"
    hook: "حامل الـ β شكل كراته بيخوّف وهو كويس. وفي الـ α، كل جين بيقع بيغيّر المرض درجة."
