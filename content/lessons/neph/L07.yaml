        title: "الفكرة: الـ cAMP هو البنزين"
        quote: "The effect of vasopressin, through V2 receptors, on cAMP levels in the collecting duct, the major site of cyst development in ADPKD, and the role of cAMP in cystogenesis provided the rationale for successful pre-clinical trials of vasopressin V2 receptor antagonists."
        text: |
          الكتاب بيبني الفكرة على 3 حاجات:

          - الـ **vasopressin** على الـ **V2** بيرفع الـ ==cAMP== في الـ **collecting duct**.
          - الـ collecting duct هو ==المكان الأساسي== اللي الأكياس بتطلع منه في الـ ADPKD.
          - الـ cAMP بيشغّل الـ **cystogenesis** (افتكر الـ signal pathway في أول درس).

          يعني لو قفلت الـ V2، الـ cAMP يقل والأكياس تبطّأ. وعلشان كده كمان **الميه الكتير** نفسها كانت protective في الحيوانات: بتوقف الـ vasopressin من الأساس.

          تخيّل الكيس كأنه بالونة جوّه الـ collecting duct: الـ cAMP بيعمل حاجتين في نفس الوقت: بيخلّي الخلايا تتكاثر (البالونة تكبر)، وبيفتح الـ chloride channels اللي بتصب سوائل جوّه الكيس (البالونة تتملي). التفسير المقبول (مش في الكتاب): علشان كده كل الأدوية الجاية بتحاول تقلل الـ cAMP بطريقة أو بتانية: الـ tolvaptan بيقفل الـ V2، والـ somatostatin analogues بتقلل إنتاجه.
      - kind: explain
        page: 162
        title: "الـ tolvaptan: اقفل الـ V2"
        quote: "In a large, phase III parallel-arm RCT in patients with ADPKD with estimated creatinine clearance above 60 ml/min, a split daily dose of the V₂ receptor antagonist tolvaptan administered over 3 years slowed the increase in kidney volume and decline in kidney function and lowered the frequency of ADPKD-related adverse events (kidney pain, hematu-ria, UTI).37 However, tolvaptan was associated with a higher frequency of aquaresis-related adverse events (polyuria, thirst, urinary frequency, nocturia) that led to drug discontinuation in 8.3% of tolvaptan-treated patients. In addition, clinically significant increases in liver enzymes (>2.5 times the upper limit of normal) were seen in 4.9% of tolvaptan-treated Moderate increases in serum sodium and uric acid levels were also seen."
        text: |
          الـ vasopressin على **V2** بيرفع الـ cAMP في الـ collecting duct (مكان الأكياس). الـ ==tolvaptan== بيقفل الـ V2.

          - **TEMPO** (CrCl فوق 60، 3 سنين): بطّأ نمو الكلية والتدهور، وقلل الألم والـ hematuria والـ urinary tract infection (UTI).
          - **REPRISE** (eGFR 25–65): eGFR نزل أبطأ في سنة.
          - العيوب: **aquaresis** (polyuria، عطش، nocturia) خلّت **8.3%** يوقفوا، و ==liver enzymes فوق 2.5× في 4.9%==، والـ Na والـ uric acid يعلوا شوية.

          ليه العيوب دي؟ التفسير المقبول (مش في الكتاب): الـ V2 هو اللي بيخلّي الكلية ترجّع الميه، فلما تقفله المريض يبول ميه كتير (aquaresis) ويعطش، وده نفس سبب الـ nocturia. والـ Na بيعلى شوية لأن الميه بتطلع من غير ملح. والـ liver enzymes تأثير على الكبد مش مرتبط بالـ V2، علشان كده لازم نتابعها بانتظام.
      - kind: reveal
        page: 162
        quote: "However, tolvaptan was associated with a higher frequency of aquaresis-related adverse events (polyuria, thirst, urinary frequency, nocturia) that led to drug discontinuation in 8.3% of tolvaptan-treated patients."
        prompt: "ليه العيان على tolvaptan بيعطش ويقوم بالليل، وليه الـ Na بيعلى شوية؟"
        answer: |
          التفسير المقبول (مش في الكتاب): قفل الـ V2 = الـ aquaporins ما بتطلعش على الـ apical (افتكر درس الـ electrolytes). يعني إنت عملت للعيان ==nephrogenic DI بالعمد==.

          النتيجة اللي الكتاب بيعدّها: **polyuria، thirst، urinary frequency، nocturia** (aquaresis)، و **8.3%** وقفوا الدوا بسببها. والـ **serum Na** بيعلى شوية لأن الكلية بتطلّع ميه حرة من غير Na.
