        alt: "Decision tree for aspirin in acute upper GI bleeding. Primary prophylaxis, no prior cardiac event: stop temporarily and restart after re-evaluating the indication. Secondary prophylaxis after MI, stent or stroke: do not interrupt; if stopped, restart within 3 to 5 days. Dual antiplatelet therapy: keep aspirin, stop the second agent and restart it within 5 days."
        caption: |
          - **الشمال (primary)**: ==وقّفه مؤقتًا== وارجع له بعد مراجعة الـ indication.
          - **النص (secondary)**: ==ما توقفوش==، ولو اتوقف رجّعه خلال **3–5 أيام**.
          - **اليمين (DAPT)**: خلّي الأسبرين ووقّف التاني، ورجّعه خلال **5 أيام**.
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
