  # ---------- p483-490: viral GN ----------
  - id: neph.L14.156
    kind: card
    topic: hcv
    front: Which glomerular lesions are most often described with HCV?
    back: MPGN (most frequent, mainly cryoglobulinemic) and membranous GN.
    src: { page: 484, quote: "The frequently described lesions were membranoproliferative glomerulonephritis (MPGN) and membranous glomerulonephritis (MGN)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.157
    kind: cloze
    topic: hcv
    text: "Type II cryoglobulinemia is linked to HCV in {{c1::90%}} and type III in {{c2::70%}}."
    src: { page: 484, quote: "Type II cryoglobulinemia is more significantly associated with HCV than type III (90% and 70% respectively)." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.158
    kind: enumerate
    topic: hcv
    prompt: Light and electron microscopic features of HCV cryoglobulinemic MPGN?
    points:
      - Subendothelial IgM and IgG deposits, sometimes intraluminal thrombi
      - Hypercellularity from leukocyte infiltration
      - Lobular tuft accentuation with mesangial increase
      - GBM double contours from monocyte interposition
      - Large subendothelial deposits on EM
      - Small-artery vasculitis in 30%
    pass: 4
    hook: "Cryo MPGN في HCV = «ودايع، زحمة، فصوص، وسكة مزدوجة»: IgM وIgG deposits تحت الـ endothelium (وأحيانًا intraluminal thrombi)، hypercellularity من leukocytes، lobular accentuation مع mesangium زايد، GBM double contours من monocyte interposition، deposits subendothelial كبيرة على الـ EM، وsmall-artery vasculitis في 30%."
    src: { page: 485, quote: "The glomerular basement membrane often shows double contours. which are caused by the interposition of monocytes between the basement membrane and the endothelium." }
    status: unverified
  - id: neph.L14.159
    kind: card
    topic: hcv
    front: What evidence supports a direct link between HCV and membranous GN?
    back: Egyptian series with MGN alone and no cryoglobulins; HCV proteins in the capillary wall; 8.3% of MGN patients had anti-HCV or HCV RNA (Yamabe).
    src: { page: 486, quote: "MGN occurs in HCV-infected patients and can present with histological and clinical features similar to primary MGN. According to Yamabe et Al. 8.3% of patients with MGN had anti-HCV antibodies or detectable HCV RNA. HCV-infected people are developing MGN due to immune complexes containing particles such as HCV proteins that accumulate in the glomeruli, which are detectable by electron microscopy." }
    status: unverified
  - id: neph.L14.160
    kind: card
    topic: hcv
    front: How might HCV cause FSGS?
    back: By directly damaging podocytes, like HIV.
    src: { page: 486, quote: "The fundamental pathogenic mechanisms are unknown: however. HCV is suspected to damage podocytes directly. just like HIV-associated kidney injuries. causing segmental glomerulosclerosis" }
    status: unverified
  - id: neph.L14.161
    kind: card
    topic: hcv
    front: Which receptor may let HCV directly infect kidney cells?
    back: CD81, the receptor used for B cells and hepatocytes; infected endothelium undergoes apoptosis, and podocytes and Bowman capsule cells are damaged.
    src: { page: 487, quote: "Besides the indirect effects of HCV infection on the kidney via the formation of immune complexes, it is tempting to speculate that the virus can directly affect and damage the nephron, negatively altering kidney function parameters. HCV can promote endothelium and tubules epithelial cell damage and enhance the migration of leukocytes and infiltration of the insulted tissues. Kidney tissue may express CD81, which is believed to be the receptor" }
    status: unverified
  - id: neph.L14.162
    kind: table
    topic: hcv
    title: KDIGO recommendations for HCV glomerular disease (p488)
    columns: [Situation, Recommendation]
    rows:
      - [Clinical glomerular disease, Kidney biopsy]
      - [Stable function and/or non-nephrotic proteinuria, DAA first]
      - ["Cryoglobulinemic flare, nephrotic syndrome or RPGN", "DAA + immunosuppression ± plasma exchange"]
      - [Active disease not responding to antivirals, "Immunosuppression; rituximab first-line"]
    blanks: [[1, 1], [2, 1], [3, 1]]
    src: { page: 488, quote: "5.2: We recommend that patients with HCV-associated glomerular disease be treated for HCV (1A)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.163
    kind: card
    topic: hbv-hiv
    front: What is the most common glomerular lesion in HBV?
    back: Membranous nephropathy. Less often IgAN, MPGN, FSGS and crescentic GN; rarely MCD.
    src: { page: 489, quote: "The most common pattern of glomerular injury seen in HBV infection is MN." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.164
    kind: card
    topic: hbv-hiv
    front: How is replicative HBV infection with GN treated?
    back: "Nucleos(t)ide analogues as for the general HBV population (replicative = HBV DNA ≥2000 IU/mL)."
    src: { page: 489, quote: "07/2/2/301:We recommend that patients with replicative HBV infection (as denoted by HBV DNA levels (2000 IU/ml) and GN receive treatment with nucleos(t)ide analogues as recommended for the general population by standard clinical practice guidelines for HBV infection (1C)." }
    status: unverified
  - id: neph.L14.165
    kind: card
    topic: hbv-hiv
    front: Which vasculitis is a classic extrahepatic manifestation of chronic HBV?
    back: Polyarteritis nodosa (Kussmaul-Maier disease); also type II and III cryoglobulinemia.
    src: { page: 489, quote: "The extrahepatic manifestations of chronic HBV infection also include systemic vasculitis (especially polyarteritis nodosa/Kussmaul-Maier disease). Type II (monoclonal IgM k antipolyclonal IgG). And Type III (polyclonal IgM. IgA. IgG) cryoglobulinemia." }
    status: unverified
  - id: neph.L14.166
    kind: card
    topic: hbv-hiv
    front: When should antiretroviral therapy start in HIV with CKD or HIVAN?
    back: In all patients, regardless of CD4 count, with doses adjusted to kidney function; CKD is not a contraindication (START and TEMPRANO trials).
    src: { page: 491, quote: "The presence of CKD is not a contraindication for antiretroviral therapy (ART) of HIV infection. Current consensus data based on large RCTs on the time to initiate ART ،namely Strategic Timing of AntiRetroviral Treatment (START) and Early Anti- retroviral Treatment and/or Early Isoniazid Prophylaxis Against Tuberculosis in HIV-infected Adults (TEMPRANO) demonstrate benefit of early initiation of ART at the time of diagnosis regardless of CD & count." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.167
    kind: card
    topic: hbv-hiv
    front: Which diagnoses appear on kidney biopsy in HIV (Figure, p490)?
    back: Immune-complex GN, diabetic nephropathy, HIVAN, tenofovir toxicity, FSGS, global sclerosis, acute tubular injury and others; 17% had dual diagnoses.
    src: { page: 490, quote: "Breakdown of diagnoses (n):\nImmune complex GN\nDiabetic nephropathy\nHIVAN\nTenofovir toxicity\nFocal segmental glomerulosclerosis (NOS)\nGlobal sclerosis (NOS)\nAcute tubular injury\nOther tubulointerstitial disease\nOther glomerular disease\nOther vascular disease\nDual diagnoses were present in 17% of cases" }
    status: unverified
  # ---------- p491-494: HRS ----------
  - id: neph.L14.168
    kind: card
    topic: hrs
    front: What is hepatorenal syndrome?
    back: A functional disease with marked renal vasoconstriction from vasoconstrictor systems compensating for splanchnic and systemic vasodilation; always with ascites.
    src: { page: 491, quote: "HRS is a functional disease characterised by marked vasoconstriction of the renal arteries secondary to the effect of hyper activation of different vasoconstrictor systems aimed at compensating the systemic vasodilation caused by the initial splanchnic vasodilation." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.169
    kind: enumerate
    topic: hrs
    prompt: New diagnostic criteria for HRS-AKI (Box 1, p491)?
    points:
      - "Cirrhosis, acute liver failure or acute-on-chronic liver failure"
      - "Creatinine rise ≥0.3 mg/dL in 48 h or ≥50% from baseline, and/or urine ≤0.5 mL/kg/h for ≥6 h"
      - "No response after 2 days of diuretic withdrawal and albumin 1 g/kg/day (max 100 g)"
      - Absence of shock
      - No current or recent nephrotoxic drugs
      - "No parenchymal disease (proteinuria >500 mg/day, >50 RBC/HPF, abnormal ultrasound)"
    pass: 5
    hook: "HRS-AKI = «كبد + AKI + 4 لأ»: cirrhosis أو acute liver failure أو ACLF؛ creatinine زاد 0.3 mg/dL أو أكتر في 48 h أو 50% أو أكتر من الـ baseline، و/أو بول 0.5 mL/kg/h أو أقل لمدة 6 h أو أكتر؛ ولأ response بعد يومين من وقف الـ diuretics وalbumin 1 g/kg/day (max 100 g)، لأ shock، لأ nephrotoxic drugs حالية أو قريبة، ولأ parenchymal disease (proteinuria فوق 500 mg/day، أكتر من 50 RBC/HPF، ultrasound غير طبيعي)."
    src: { page: 491, quote: "Box 1: New diagnostic criteria for HRS-AKI.\nDiagnostic criteria:\n  Cirrhosis; acute liver failure; acute-on-chronic liver failure\n  Increase in serum creatinine ≥0.3 mg/dl within 48 h or ≥50% from baseline value according to ICA consensus document and/or Urinary output ≤0.5 ml/kg B.W. ≥6 h*\n  No full or partial response, according to the ICA consensus document, after at least 2 days of diuretic withdrawal and volume expansion with albumin. The recommended dose of albumin is 1 g/kg of body weight per day to a maximum of 100 g/day\n  Absence of shock\n  No current or recent treatment with nephrotoxic drugs\n  Absence of parenchymal disease as indicated by proteinuria >500 mg/day, microhaematuria (>50 red blood cells per high power field), urinary injury biomarkers (if available) and/or abnormal renal ultrasonography**.\n  Suggestion of renal vasoconstriction with FENa of <0.2% (with levels <0.1% being highly predictive)\n*The evaluation of this parameter requires a urinary catheter. **This criterion would not be included in cases of known pre-existing structural chronic kidney disease (e.g. diabetic or hypertensive nephropathy). AKI, acute kidney injury; FENa, fractional excretion of sodium; HRS, hepatorenal syndrome; ICA, International Club of Ascites." }
    status: unverified
    tags: [high-yield]
