    status: unverified
    steps:
      - kind: explain
        remind: [git.L10.lesson5:DHWI]
        page: 146
        quote: "Clinical Features\n  Dysphagia, Odynophagia (severe pain on swallowing) Obstruction progressive weight loss, Anorexia, Fatigue, Weakness, hematemesis, chest pain, Cough vomiting. frequent choking hiccups\n  Manifestation of metastasis"
        title: "المريض بييجي إزاي"
        text: |
          - ==Dysphagia== progressive، وبعدها **obstruction**.
          - **Odynophagia**: ألم شديد مع البلع.
          - **Weight loss** و anorexia و fatigue.
          - Hematemesis، chest pain، cough، vomiting، choking، hiccups.
          - وأعراض الـ **metastasis**.

          التفسير المقبول (مش في الكتاب): الترتيب ده منطقي: الأكل الناشف بيقف الأول لأن الورم لسه ضيّق جزء بس من الـ lumen، وبعد ما يقفل أكتر حتى السوايل بتقف. وده بيفرق عن الـ achalasia اللي فيها الناشف والسايل بيقفوا من الأول مع بعض.
      - kind: reveal
        page: 146
        quote: "By the time symptoms appear, the tumor has usually spread to submucosal lymphatic vessels. As a result of the advanced stage at diagnosis, overall 5year survival is less than 25%(15%) with most patients dying within the first year of diagnosis."
        prompt: "ليه الـ prognosis وحش كده؟"
        answer: "عشان لما الأعراض تظهر يكون الورم غالبًا انتشر في الـ submucosal lymphatic vessels. الـ 5-year survival أقل من 25% (15%) وأغلبهم بيموتوا في أول سنة. بس لو adenocarcinoma لسه في الـ mucosa أو submucosa، الـ survival حوالي 80%."
      - kind: explain
        page: 147
        quote: "Overexpression or ampliﬁcation of the HER2 gene has been implicated in the development of esophageal and EGJ cancers"
        title: "الـ HER2: علامة وحشة، بس ليها علاج"
        text: |
          الكتاب:
          - دلوقتي بنعمل **molecular testing** لـ **HER2**، و **microsatellite instability**، و **PD-L1** في الـ locally advanced، والـ unresectable، والـ metastatic.
          - الـ **HER2 overexpression أو amplification** داخل في نشأة الـ esophageal والـ EGJ cancers.
          - بعض الدراسات: الـ HER2 positivity مرتبطة بـ **invasion** و **lymph node metastasis**، يعني ==poor prognosis==.
          - إضافة **HER2 monoclonal antibodies** للـ chemotherapy ==promising== في الـ HER2-positive metastatic disease.

          التفسير المقبول (مش في الكتاب): ده نوع من المفارقة المفيدة: نفس العلامة اللي بتقول إن الورم أشرس، هي اللي بتدّيك **هدف** تضربه. علشان كده بنطلبها في المرضى اللي محتاجين علاج systemic، لأن نتيجتها بتغيّر الدوا.
      - kind: reveal
        page: 148
        quote: "HER2 testing is recommended for all patients with esophageal or EGJ cancer at the time of diagnosis if metastatic disease is documented or suspected"
        prompt: "ليه بنطلب الـ HER2 والـ MSI بس لما يكون فيه metastasis؟"
        answer: |
          الكتاب: الـ **HER2 testing** لكل مريض esophageal أو EGJ cancer **وقت التشخيص** ==if metastatic disease is documented or suspected==. والـ HER2 positivity بتختلف (**2–45%**)، أكتر في الـ **adenocarcinoma (15–30%)** من الـ **SCC (5–13%)**، وأعلى في الـ EGJ من المعدة. وكمان الـ **MSI-H/dMMR** يتعمل في كل الـ adenocarcinoma لو فيه metastasis، لأن الـ FDA وافق على **pembrolizumab** للـ MSI-H أو dMMR solid tumors في الـ second-line أو بعدها.

          التفسير المقبول (مش في الكتاب): الاختبارين دول بيختاروا **دوا systemic** (antibody أو immunotherapy). المريض اللي هيتعالج بجراحة أو chemoradiation للشفاء النتيجة مش هتغيّر خطته دلوقتي، لكن المريض الـ metastatic علاجه كله systemic، فالنتيجة بتفرق معاه على طول.
      - kind: check
        page: 148
        quote: "is more frequently seen in adenocarcinoma of the esophagus (15%–30%) than in SCC (5%–13%)."
        question: "In which esophageal cancer is HER2 positivity more common, according to the lecture?"
        options:
          - "Adenocarcinoma (15–30%)"
          - "SCC (15–30%)"
