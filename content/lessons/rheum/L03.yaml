  - id: rheum.L03.lesson5
    title: "Type III: الزبالة في المواسير"
    hook: "Type III زي زبالة بتسد مواسير ضيقة: الـ complexes بتلف في الدم وتتحشر في المفصل والوعاء والكلية."
    minutes: 9
    pages: [63, 65]
    topics: [type3]
    goals:
      - "تشرح ليه الـ immune complexes بتترسب، وفين، وليه"
      - "تفرّق Arthus عن serum sickness"
      - "تحل سؤالي الكتاب عن type III"
    status: unverified
    steps:
      - kind: explain
        page: 63
        quote: "The damaging inflammatory reaction is triggered by a soluble antigen capable of forming large insoluble immune complexes with IgM or IgG antibodies in the circulation."
        title: "Immune complex-mediated injury"
        text: |
          - **Soluble antigen** + Immunoglobulin G (IgG) أو Immunoglobulin M (IgM) ← ==large insoluble immune complexes== في الدم.
          - كبيرة على الـ phagocytosis ← بدل ما تتشال **بتترسب**، غالبًا في **جدار الأوعية**.
          - Complement و Fc receptors ← neutrophils ← granule enzymes و reactive oxygen ← ==vasculitis== و tissue necrosis.

          التفسير المقبول (مش في الكتاب): ليه الـ complexes الكبيرة بتترسب؟ عشان الصغيرة بتفضل دايبة وبتخرج، والكبيرة جدًا بيبلعها الـ macrophage بسهولة، أما الوسط (مع antigen زيادة شوية) بيلف في الدم ويتحشر في الأوعية. يعني المرض مش مكان الـ antigen، المرض مكان الترسيب: الكلى والمفاصل والجلد، وده سبب إن الـ type III بيبقى systemic.
      - kind: explain
        page: 63
        quote: "These complexes are too large to phagocytose so rather than be cleared the ICs are deposited either at a single site or in various locations in the body (often in the walls of vessels)."
        title: "ليه بتترسب بدل ما تتشال؟"
        text: |
          الكتاب بيدّي السبب: الـ complexes **too large to phagocytose**. فبدل ما تتشال، بتترسب في مكان واحد أو في أماكن كتير، **غالبًا في جدار الأوعية**.

          التفسير المقبول (مش في الكتاب) للصورة الكاملة: في العادي، الـ complexes الصغيرة بتتشال بسرعة من الدم. المشكلة بتحصل لما الـ **antigen كتير** وبيفضل موجود (دوا، antitoxin، أو self antigen زي الـ DNA)، فبيفضل يعمل complexes بكمية أكبر من قدرة الشيل.

          ولما تترسب: ==complement== و Fc receptors بينادوا الـ neutrophils، والـ neutrophils بتطلّع enzymes و reactive oxygen على **جدار الوعاء نفسه** ← vasculitis.
      - kind: figure
        page: 64
        quote: "(B) Immune complex–mediated tissue injury\nCirculating immune complexes → Site of deposition of immune complexes (Blood vessel)\nComplement- and Fc receptor–mediated recruitment and activation of inflammatory cells (Neutrophils)\nNeutrophil granule enzymes, reactive oxygen intermediates → Vasculitis\nThe immune responses of type III HS reactions."
        title: "من الدم لجدار الوعاء"
        image: { file: rheum/L03-immune-complex-injury.webp, book: true }
        alt: "Panel B, Immune complex-mediated tissue injury. Left: a blood vessel with circulating immune complexes in its lumen and some deposited on the wall, labelled site of deposition of immune complexes. A middle arrow reads complement- and Fc receptor-mediated recruitment and activation of inflammatory cells. Right: the same vessel with neutrophils on the deposits releasing neutrophil granule enzymes and reactive oxygen intermediates, labelled vasculitis."
        caption: |
          رسمة الكتاب في صفحة 64:

          - **شمال**: وعاء دموي، فيه **circulating immune complexes** في النص، وتحت كام واحد **اترسّب على الجدار** (site of deposition).
          - **السهم في النص**: الـ complement والـ Fc receptors بينادوا الخلايا الالتهابية وينشّطوها.
          - **يمين**: نفس الوعاء، والـ ==neutrophils== قاعدة على الترسيب وبتطلّع granule enzymes و reactive oxygen intermediates ← جدار الوعاء بيتحرق = ==vasculitis==.

          يعني الـ antigen مش على خلية ولا على نسيج، هو متعلّق في الدم، والمكان اللي يترسّب فيه هو اللي بيتأذي.
      - kind: table
        page: 65
        quote: "Localized Type III HS: ICs involved are deposited only where antibody and antigen first encounter one another the ICs do not circulate systemically. Only local tissue damage characterized by pain, redness and swelling = Arthus reaction."
        title: "Localized ضد systemic"
        columns: ["", "Arthus", "Serum sickness"]
        rows:
          - ["Complexes", "Stay where Ag meets Ab", "Circulate, trapped in narrow vessels"]
          - ["Damage", "Local pain, redness, swelling", "Fever, weakness, rash, arthritis, GN"]
          - ["Cause", "Local antigen", "Anti-tetanus antitoxin, drugs"]
        hide: [[1, 2], [2, 2]]
      - kind: mnemonic
        page: 65
        quote: "Joints arteries and the renal glomeruli are susceptible to IC deposition."
        word: "JAG"
        hook: "الـ complexes بتتحشر في «JAG»: زي ما الشوكة بتتحشر في الزور."
        parts:
          - { key: "J", text: "Joints → arthritis" }
          - { key: "A", text: "Arteries → vasculitis" }
          - { key: "G", text: "Glomeruli → nephritis" }
      - kind: explain
        page: 65
        quote: "Occurs often in site where the local blood vessels have a narrow diameter, or where there is circulatory turbulence due to change in the direction of blood flow at that site."
        title: "ليه المفصل والشرايين والكلية؟"
        text: |
          الكتاب بيقول الـ systemic type III بيحصل في الأماكن اللي **بتصطاد** الـ complexes الكبيرة:
          - **أوعية قطرها ضيق**.
          - أماكن فيها ==turbulence== لأن الدم بيغيّر اتجاهه.

          التفسير المقبول (مش في الكتاب) لكل مكان في JAG:
          - **Glomeruli**: الكلية بتفلتر الدم تحت ضغط عالي في شعيرات ضيقة جدًا، فالـ complexes بتتحشر في الفلتر ← **nephritis** (dark urine في سؤال الكتاب).
          - **Joints**: الـ synovium فيه شعيرات كتير بتعمل السايل ← **arthritis**.
          - **Arteries**: عند التفرعات الدم بيلف ← الـ complexes بتلزق في الجدار ← **vasculitis** (palpable purpura على الرجل).
      - kind: explain
        page: 65
        quote: "As well as proved by foreign antigens systemic type II HS can result from accumulation of ICs involving auto-antibodies recognizing soluble self antigens =SLE."
        title: "مش بس antigen غريب"
        text: |
          - المكان: **أوعية ضيقة** أو **turbulence** لما الدم يغيّر اتجاهه.
          - ==Serum sickness== هو الـ **prototype** للـ systemic type III.
          - ومن غير antigen غريب: autoantibodies ضد **soluble self antigens** ← ==systemic lupus erythematosus (SLE)==.

          التفسير المقبول (مش في الكتاب): ليه الأماكن دي؟ في الأوعية الضيقة (glomeruli، synovium) والضغط العالي بيدفع الـ complexes في الجدار، والـ turbulence بيبطّأ الدم فتلحق تترسب. والـ SLE مثال إن الـ antigen ممكن يبقى جزء مننا (DNA)، فالـ complexes بتفضل تتعمل طول ما المرض شغال، عكس الـ serum sickness اللي بيخلص لما الـ antigen الغريب يتشال.
      - kind: case
        page: 65
        quote: "Serum sickness is the prototypical systemic type III HS."
        stem: "A 35-year-old woman has joint pain, swelling and rash two weeks after a new antibiotic for sinusitis. Fever, fatigue, dark urine, palpable purpura on the legs, low complement. (Book question 1, p67)"
        steps:
          - question: "Which type of hypersensitivity?"
            options: ["Type III", "Type I", "Type II", "Type IV"]
            answer: 0
            why: "Drug antigen + أسبوعين + vasculitis (purpura) + arthritis + GN (dark urine) + complement واطي (اتستهلك في الـ complexes) = type III زي serum sickness. الكتاب مش طابع الإجابة؛ دي من صفحة 65."
          - question: "Which does NOT belong to type III? (Book question 2, p67)"
            options: ["Drug allergy", "Acute hypersensitivity pneumonitis", "Drug-induced vasculitis", "Serum sickness"]
            answer: 0
            why: "الـ drug allergy المعتاد (زي penicillin anaphylaxis) هو type I. الباقي immune complex."
      - kind: explain
        page: 65
        quote: "Clinical sign: fever, weakness, rash and swelling, arthritic pain and GN."
        title: "ليه الـ serum sickness بتاخد أيام؟"
        text: |
          الـ serum sickness هو الـ **prototype**، والكتاب بيقول بتحصل بعد كميات كبيرة من **anti-tetanus antitoxin** (serum من حيوان)، أو drug أو antigen من البيئة. علاماتها: fever، weakness، rash و swelling، arthritic pain، و **GN**.

          ليه بتتأخر؟ التفسير المقبول (مش في الكتاب): أول مرة الجسم بيشوف الـ antigen، محتاج **حوالي أسبوع أو اتنين** يعمل antibodies. والـ antigen لسه في الدم (الكمية كبيرة)، فأول ما الـ antibodies تطلع بتعمل complexes مع الـ antigen الموجود.

          عشان كده الفرق اللي يحسم الامتحان: type I في ==دقايق==، و serum sickness بعد **أيام لأسبوعين**، ومعاها **complement واطي**.
      - kind: aside
        tone: trap
        page: 65
        quote: "Drug antigen or environmental."
        text: "نفس الـ drug antigen ممكن يعمل type I (anaphylaxis في دقايق) أو type III (serum sickness بعد أيام). السؤال بيفرّقهم بالـ **توقيت** و **الـ complement الواطي**."
      - kind: try
        items: [rheum.L03.076, rheum.L03.078, rheum.L03.080, rheum.L03.082, rheum.L03.086]
    recap:
      - "Type III: soluble Ag + IgG/IgM ← complexes كبيرة على الـ phagocytosis ← تترسب في الأوعية ← neutrophils ← vasculitis."
      - "Systemic: أوعية ضيقة و turbulence؛ JAG: joints، arteries، glomeruli."
      - "Arthus = local. Serum sickness = systemic prototype (antitoxin، drugs)، بعد أيام، complement واطي. SLE = self antigen."
      - "Drug allergy المعتاد = type I، مش type III."
    practice: [rheum.L03.075, rheum.L03.076, rheum.L03.077, rheum.L03.078, rheum.L03.079, rheum.L03.080, rheum.L03.081, rheum.L03.082, rheum.L03.083, rheum.L03.084, rheum.L03.085, rheum.L03.086, rheum.L03.096, rheum.L03.098, rheum.L03.101, rheum.L03.103, rheum.L03.104]
