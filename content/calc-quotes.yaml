    quote: |-
      WHO criteria for essential thrombocythemia (ET)
      Major criteria:
        1. Platelet count equal to or greater than 450 x 10⁹/uL
        2. Bone marrow biopsy showing proliferation mainly of the megakaryocyte lineage with increased numbers of enlarged, mature megakaryocytes with hyperlobulated nuclei. No significant increase or left-shift of neutrophil granulopoiesis or erythropoiesis and very rarely minor increase in reticulin fibers.
        3. Not meeting WHO criteria for BCR-ABL1+ CML, PV, PMF, myelodysplastic syndromes, or other myeloid neoplasms
        4. Presence of JAK2, CALR or MPL mutation
      Minor criteria:
        Presence of a clonal marker or absence of evidence for reactive thrombocytosis
      Diagnosis of ET requires meeting all four major criteria or the first three major criteria and one of the minor criteria
      Arber et al., Blood (2016) 127:2391-2405
  - calculator: who_pmf
    lecture: hem.L09
    page: 145
    quote: |-
      WHO criteria for PMF in advanced stage
      Major criteria:
        1. Presence of megakaryocytic proliferation and atypia, usually accompanied by either reticulin and/or collagen fibrosis grades 2 or 3
        2. Not meeting WHO criteria for ET, PV, BCR-ABL1+ CML, myelodysplastic syndromes, or other myeloid neoplasms
        3. Presence of JAK2, CALR or MPL mutation or in the absence of these mutations, presence of an other clonal marker* or absence of reactive myelofibrosis**
      * in the absence of any of the 3 major clonal mutations, the search for the most frequent accompanying mutations (ASXL1, EZH2, TET2, IDH1/IDH2, SRSF2, SF3B1) are of help in determining the clonal nature of the disease.
      ** bone marrow fibrosis secondary to infection, autoimmune disorder or other chronic inflammatory condition, hairy cell leukemia or other lymphoid neoplasm, metastatic malignancy, or toxic (chronic) myelopathies.
      Arber et al., Blood (2016) 127:2391-2405
