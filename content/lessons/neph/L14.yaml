  - id: neph.L14.lesson5
    title: "TMA: خريطة بسؤالين"
    hook: "نفس الصورة (أنيميا وصفايح واطية وكلية واقعة) وراها أمراض علاجها عكس بعض."
    minutes: 9
    pages: [467, 470]
    topics: [tma]
    goals:
      - "تعرف تعريف الـ TMA الـ clinical والـ histological وليه كل جزء فيه"
      - "تمشي على الـ algorithm بسؤال الـ ADAMTS13 وبعدين المرض المصاحب"
      - "تعرف الـ workup بعد أول episode وليه كل تحليل"
      - "تعرف امتى الـ transplant مش مقترح في الـ aHUS"
    status: unverified
    steps:
      - kind: explain
        page: 467
        title: "Table 1: التعريف بالسبب"
        quote: "Table 1: Definition of thrombotic microangiopathy.\nClinical diagnosis or:\n  Presence of microangiopathic hemolytic anemia, AND: Anemia: Hemoglobin level less than the low limit of age; Elevated serum LDH level above the upper limit of age; Decreased serum haptoglobin level; and/or the presence of schistocyte on peripheral blood smear\n  Thrombocytopenia, AND: Platelet count <150,000/L or >25% decrease of the baseline value\n  End-organ damage: Clinical or laboratory evidence of damage to the kidney, heart, gastrointestinal tract, brain, and lungs, among others\nHistological diagnosis:\n  Thickened and swollen walls of arterioles and capillaries with detached endothelial cells and the presence of platelet thrombi that occlude the vascular lumen\nLDH, lactate dehydrogenase."
        text: |
          الـ Table 1 بيدّيك طريقين للتشخيص: **clinical** أو **histological**.

          الـ clinical محتاج التلاتة مع بعض، وكل واحد بيقيس حاجة:
          - **Microangiopathic hemolytic anemia:** Hb واطي، **LDH** عالي، **haptoglobin** واطي، و/أو **schistocytes**. يعني الكرات الحمرا **بتتكسر جوه الأوعية**: الـ LDH بيطلع منها، والـ haptoglobin بيتاكل وهو بيلم الـ hemoglobin الحر.
          - **Thrombocytopenia:** <**150,000** أو نزول ==>25% decrease of the baseline value==. والسبب إن الصفايح ==consumptive==: بتتصرف في الجلطات الصغيرة.
          - **End-organ damage:** كلية، قلب، GI، مخ، رئة.

          والـ histological: جدران الـ arterioles والـ capillaries **سميكة ومنفوخة**، والـ endothelial cells منفصلة، و **platelet thrombi** قافلة الـ lumen.

          ليه الـ >25% مهمة؟ التفسير المقبول (مش في الكتاب): مريض صفايحه كانت 400,000 ونزلت لـ 250,000 لسه "طبيعي" بالرقم، بس هو بيستهلكها.
      - kind: explain
        page: 470
        title: "التعريف"
        quote: "The triad of thrombocytopenia, hemolytic anemia, and ischemic end-organ damage defines thrombotic microangiopathy."
        text: |
          ==thrombotic microangiopathy (TMA)== = تلاتة مع بعض:
          - "**Microangiopathic hemolytic anemia**: Hb واطي، lactate dehydrogenase (LDH) عالي، haptoglobin واطي، **schistocytes**"
          - "**Thrombocytopenia**: أقل من **150,000** أو نزول **>25%** من الـ baseline"
          - "**End-organ damage**: كلية، مخ، قلب، رئة، gastrointestinal (GI)"

          الأصل: endothelial damage ← thrombi في الـ microvasculature ← الكرات الحمرا بتتقطع (Coombs **negative**).

          ليه Coombs negative؟ لأن الكرات الحمرا بتتكسر ميكانيكيًا وهي بتعدّي في أوعية مليانة جلطات، مش بسبب antibodies عليها. وده اللي بيفرّقها عن الـ autoimmune hemolytic anemia.
      - kind: explain
        page: 470
        title: "ليه لازم تعرف أنهي TMA؟"
        quote: "Some of the more common TMAs from which HUS must be differentiated are thrombotic thrombocytopenic purpura (TTP); syndrome of hemolysis, elevated liver enzymes and low platelets (HELLP); and disseminated intravascular coagulation (DIC). Despite similar pathogeneses, the treatments of these entities differ significantly."
        text: |
          الكتاب بيقولك الـ HUS لازم يتفرّق عن **TTP** و **HELLP** و **DIC**، وبيدّيك السبب في جملة واحدة: ==Despite similar pathogeneses, the treatments of these entities differ significantly==.

          التفسير المقبول (مش في الكتاب)، عشان تشوف قد إيه العلاج مختلف:
          - **TTP:** plasma exchange فورًا (زي ما هتشوف في درس الـ TTP).
          - **STEC-HUS:** supportive، ومن غير antibiotics.
          - **aHUS:** eculizumab.
          - **HELLP:** الولادة (درس الحمل والكلية).
          - **DIC:** عالج السبب، والـ coagulation tests بتبقى مضروبة.

          فالغلط في التشخيص هنا مش غلط ورق: ده علاج غلط.
      - kind: figure
        page: 468
        quote: "Thrombotic microangiopathy: Microangiopathic hemolytic anemia: decreased hemoglobin and serum haptoglobin, elevated serum LDH, ±schistocytes on smear; Thrombocytopenia: less than 150,000 /uL or >25% decrease of baseline; End organ damage: kidney, brain, heart, lung, etc\n  ADAMTS13 activity\n    <10% → Thrombotic thrombocytopenic purpura\n    >10% → Non-TTP thrombotic microangiopathy\n      Co-existing diseases\n        Yes → Secondary thrombotic microangiopathy\n          Infections: S. pneumonia, HIV, influenza, others\n          Medications: Calcineurin inhibitors, mTOR inhibitors; Chemotherapeutic agents: mytomycin C, gemcitabine, cisplatin; VEGF and tyrosin inhibitors; Others\n          Malignant hypertension\n          Pregnancy/ HELLP syndrome\n          Autoimmune diseases: Systemic lupus erythematosus; Anti-phospholipid syndrome; Scleroderma; Others\n          Bone marrow/ solid organ transplant\n          Inborn error of metabolism: Methylmalonic acidemia; Vitamin B12 deficiency\n        No → Shiga toxin/ Shiga toxin-producing E. coli (STEC)\n          Yes → STEC-hemolytic uremic syndrome\n          No → Atypical hemolytic uremic syndrome"
        title: "الـ algorithm"
