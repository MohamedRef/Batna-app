- id: res.L19.lesson2
  title: يعني إيه EBM؟ الـ 3 Es
  hook: دوا كان بيظبط الـ arrhythmia «تمام»، وبعد RCT اتضح إنه بيزوّد الوفيات. إزاي ده حصل؟
  minutes: 9
  pages: [21, 31]
  topics: [concept]
  goals:
  - تحفظ تعريف Sackett
  - تعرف الـ 3 Es وهدف الـ EBM
  - تفهم ليه محتاجين RCT
  status: unverified
  steps:
  - kind: explain
    page: 21
    quote: |-
      Evidence Based Medicine
      Conscientious, explicit and judicious use of current best available evidence in making decisions about the care of an individual patient
      DAVID SACKETT
      In other words
      EBM encourages utilization of evidence from clinical research to support clinical decision making for individual patients (Sackett et al. 2000).
    title: تعريف Sackett
    text: |-
      **EBM** = الاستخدام الـ **conscientious** والـ **explicit** والـ **judicious** لـ ==current best available evidence== في قرارات رعاية ==individual patient==.

      بكلام تاني: نستخدم evidence من الـ **clinical research** عشان ندعم القرار لمريض بعينه (Sackett et al. 2000).
  - kind: reveal
    page: 21
    quote: |-
      Evidence Based Medicine
      Conscientious, explicit and judicious use of current best available evidence in making decisions about the care of an individual patient
      DAVID SACKETT
      In other words
      EBM encourages utilization of evidence from clinical research to support clinical decision making for individual patients (Sackett et al. 2000).
    prompt: الكلمة الأخيرة في التعريف «individual patient». ليه مهمة؟
    answer: لأن الـ EBM مش «إحصائيات للناس كلها»؛ هو قرار لمريض واحد قدامك، بالـ evidence اللي يناسبه هو.
  - kind: explain
    page: 22
    quote: |-
      What is Evidence based health care (EBHC) ?
      EBHC requires the integration of the best available research evidence with our clinical expertise and our patient's unique values and circumstances .
    title: EBHC
    text: |-
      الـ **evidence-based health care** بيطلب ==integration== (دمج) لـ 3 حاجات:

      - أحسن research evidence متاح.
      - الـ **clinical expertise** بتاعتنا.
      - قيم المريض وظروفه الـ **unique**.
  - kind: figure
    page: 24
    quote: |-
      Three (Es)- EBM Components
      EVIDENCE
      EXPERIENCE
      EXPECTATION
      The best evidence is usually found in clinically relevant research that has been conducted using sound methodology.
      Clinical expertise refers to the clinician's cumulated experience, education and clinical skills.
      The patient brings to the encounter his or her own personal and unique concerns, expectations, and values.
    title: الـ 3 Es
    svg: |-
      <svg viewBox="0 0 320 230" xmlns="http://www.w3.org/2000/svg">
        <circle cx="160" cy="78" r="62" class="fg-acc"/>
        <circle cx="114" cy="150" r="62" class="fg-good"/>
