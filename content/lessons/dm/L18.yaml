        title: "سلّم العلاج"
        alt: "A staircase of seven steps for urate-lowering strategy: non-drug measures; drugs with uricosuric action; allopurinol for normal kidneys; febuxostat for mild to moderate renal impairment; add uricosuric for poor responders; pegloticase for non-responders; rasburicase for selected acute cases."
        caption: "كل درجة للي فشل في اللي قبلها. والـ **rasburicase** على جنب، للحالات الحادة مع الـ chemotherapy."
        svg: |
