    src: { page: 25, quote: "Prevalence of CKD\n  12-14% General pop\n  40% Diabetes\n  40% Cardio-vascular diseases\n  33% Age ≥ 65 years\n  22% HTN" }
    status: unverified
  # ---------- p26: screening ----------
  - id: neph.L02.017
    kind: enumerate
    topic: screening
    prompt: List the risk-factor conditions that call for CKD screening.
    points:
      - Hypertension
      - Diabetes
      - Cardiovascular disease
      - AKI or hospitalization history
      - Family history of kidney disease
      - Obesity
      - "Other high-risk comorbidities (SLE, environmental exposures, nephrotoxic drugs, genetic factors, preeclampsia, low birth weight)"
    pass: 5
    hook: "اعمل CKD screening في «ضغط، سكر، قلب، كلية وقعت قبل كده، عيلة، وزن، والباقي»: HT، diabetes، CVD، AKI أو hospitalization قبل كده، family history، obesity، وhigh-risk تانية (SLE، environmental exposures، nephrotoxic drugs، genetic factors، preeclampsia، low birth weight)."
    src: { page: 26, quote: "Hypertension; diabetes; Cardiovascular disease; AKI/hospitalization history; FH kidney disease; obesity; other high-risk comorbidities (e.g., SLE, environmental exposures, nephrotoxic drugs, genetic factors, preeclampsia, low birth weight)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L02.018
    kind: order
    topic: screening
    prompt: Put the CKD screening algorithm in order (Figure 2).
    steps:
      - Test GFR and ACR in a person with a risk factor
      - "GFR < 60 or ACR ≥ 30 mg/g found: exclude AKI"
      - Confirm after 3 months (or earlier if evidence of chronicity)
      - Measure eGFRcr-cys if not done and available
      - Stage by GFR and ACR
      - Establish the cause, estimate risk of progression, start treatment
    src: { page: 26, quote: "Figure 2: Screening algorithm for diagnosis and staging of chronic kidney disease (CKD)." }
    status: unverified
  - id: neph.L02.019
    kind: card
    topic: screening
    front: A first screen shows GFR 50 or ACR 40 mg/g. What must be done before calling it CKD?
    back: Exclude AKI and confirm that GFR < 60 and/or ACR ≥ 30 mg/g persists after 3 months (or earlier if there is evidence of chronicity).
    src: { page: 26, quote: "Figure 2: Screening algorithm for diagnosis and staging of chronic kidney disease (CKD)." }
    status: unverified
  # ---------- p27: prevention, eGFR ----------
  - id: neph.L02.020
    kind: enumerate
    topic: screening
    prompt: List the 8 golden rules for healthy kidneys shown in the lecture.
    points:
      - Keep fit and active
      - Keep regular control of your blood sugar level
      - Monitor your blood pressure
      - Eat healthy and keep your weight in check
      - Maintain a healthy fluid intake
      - Do not smoke
      - Do not take over-the-counter pills on a regular basis
      - Get your kidney function checked if you have one or more high-risk factors
    pass: 6
    hook: "الـ 8 قواعد = 5 «اعمل» + 3 «متعملش/اتأكد»: اتحرك (keep fit and active)، ظبّط السكر (blood sugar)، قيس الضغط (blood pressure)، كُل صح ووزنك مظبوط (eat healthy, weight)، اشرب على قدك (healthy fluid intake)؛ وبعدين متدخنش (do not smoke)، متاخدش over-the-counter pills بانتظام، ولو عندك high-risk factor اكشف على kidney function. 5 + 3 = 8."
    src: { page: 27, quote: "8 Golden Rules for healthy kidneys\n1. Keep fit and active\n2. Keep regular control of your blood sugar level\n3. Monitor your blood pressure\n4. Eat healthy and keep your weight in check\n5. Maintain a healthy fluid intake\n6. Do not smoke\n7. Do not take over-the-counter pills on a regular basis\n8. Get your kidney function checked if you have one or more of the 'high risk' factors" }
    status: unverified
  - id: neph.L02.021
    kind: card
    topic: egfr
    front: Which eGFR equation showed more linear associations with long-term outcomes?
    back: eGFRcr-cys (creatinine plus cystatin C).
    src: { page: 27, quote: "eGFRcr-cys demonstrated much more linear associations with log term outcome measures." }
    status: unverified
  - id: neph.L02.022
    kind: card
    topic: egfr
    front: In the approach to GFR evaluation (Figure 8), what do you do if the creatinine-based eGFR is not thought to be accurate?
    back: Consider sources of error and measure cystatin C (eGFRcr-cys); if a more accurate assessment is still needed, measure GFR.
    src: { page: 27, quote: "Figure 8: Approach to glomerular filtration rate (GFR) evaluation using initial and supportive tests.\nInitial test – eGFRcr\n  Consider sources of error and need for more accurate assessment. Is eGFR thought to be accurate?\n    Yes: Use eGFRcr\n    No: Measure cystatin C\n      Consider potential sources of error in eGFRcr-cys and need for an even more accurate assessment. Is a more accurate assessment needed?\n        No: Use eGFRcr-cys\n        Yes: Measure GFR\nEvaluation of GFR for clinical application (15, 30, 45, 60, 90, 120)" }
    status: unverified
