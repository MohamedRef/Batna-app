  - id: res.L04.lesson3
    title: "الـ correlation coefficient (r)"
    hook: "r = −1 أقوى ولا +0.9؟ وليه عم الحاج اللي بياكل 25 بيضة في اليوم يستاهل case report؟"
    minutes: 6
    pages: [28, 32]
    topics: [correlation]
    goals:
      - "تقرا قيمة r وتعرف إنها مش causation"
      - "تفرّق بين case report و case series"
      - "تعرف الـ merits والـ limitations والـ publication bias"
    status: unverified
    steps:
      - kind: explain
        page: 28
        quote: "Correlation: The strength and direction of the association between two variables. Correlation DOES NOT mean causation.\nCorrelation coefficient (r): A statistic designed to measure the direction and strength of association between two variables."
        title: "يعني إيه correlation؟"
        text: |
          - **Correlation**: ==strength and direction== of the association بين متغيرين. وCorrelation **does not mean causation**.
          - **Correlation coefficient (r)**: الـ statistic اللي بيقيس الاتجاه والقوة دول.

          ليه بنقول «strength and direction» مع بعض؟ لأن رقم واحد بيقول الاتنين: الإشارة (+ أو −) هي الاتجاه، وقربه من 1 هو القوة. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 29
        quote: "Correlation Coefficient: The correlation coefficient (r) measures the strength of the association between two variables (Pearson correlation). The value of r ranges between +1 and -1.\n  +1 = A positive or direct correlation, eg, smoking and lung cancer\n  -1 = A negative or inverse correlation, eg, exercise and the risk of heart disease\n  0 = A zero correlation (no relationship), eg, color of the skin and intelligence\nNOTE: Even with a perfect correlation (r) of +1 or -1, a causal relationship may not necessarily exist between the two variables."
        title: "الـ correlation coefficient"
        text: |
          الـ **correlation** هي قوة واتجاه العلاقة بين متغيرين. والـ ==r== (Pearson) هو الرقم اللي بيقيسها.

          - **r بين −1 و +1**.
          - **+1**: positive (direct)، زي smoking و lung cancer.
          - **−1**: negative (inverse)، زي exercise وخطر أمراض القلب.
          - **0**: مفيش علاقة، زي لون البشرة والذكاء.

          والقوة = ==حجم الرقم== بغض النظر عن الإشارة.

          في المحاضرة والمراجعة اتقال بوضوح: ==الإشارة = الاتجاه، والرقم المطلق = القوة==. يعني −1 مش «أضعف» من +0.5؛ −1 ده inverse correlation كامل. والـ r = 0 معناها مفيش **linear** correlation، مش لازم يبقى مفيش أي علاقة خالص. والقوة مش بميل الخط في الرسم (الميل بيتغير بمقياس المحاور).
      - kind: figure
        page: 30
        quote: "The relationship between two correlated variables is presented graphically by Scatter Diagram:\n  A. No correlation, r = 0\n  B. Perfect positive correlation, r = +1\n  C. Perfect negative correlation, r = -1\n  D. Positive correlation coefficient of low magnitude"
        title: "شكل الـ r على الـ scatter diagram"
        alt: "Three scatter panels stacked. r = +1: dots on a rising straight line. r = 0: dots scattered with no pattern. r = -1: dots on a falling straight line."
        caption: "العلاقة بين متغيرين بتترسم بـ **scatter diagram**. خط طالع = +، خط نازل = −، سحابة = صفر."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="100" height="100" class="fg-box"/>
            <g class="fg-dot-good"><circle cx="22" cy="98" r="4"/><circle cx="40" cy="80" r="4"/><circle cx="58" cy="62" r="4"/><circle cx="76" cy="44" r="4"/><circle cx="96" cy="24" r="4"/></g>
            <text x="60" y="130" text-anchor="middle" class="t-b t-good">r = +1</text>
            <rect x="115" y="10" width="100" height="100" class="fg-box"/>
            <g class="fg-dot-acc"><circle cx="130" cy="40" r="4"/><circle cx="150" cy="90" r="4"/><circle cx="170" cy="30" r="4"/><circle cx="190" cy="70" r="4"/><circle cx="200" cy="96" r="4"/><circle cx="140" cy="66" r="4"/><circle cx="180" cy="52" r="4"/></g>
            <text x="165" y="130" text-anchor="middle" class="t-b">r = 0</text>
            <rect x="220" y="10" width="100" height="100" class="fg-box"/>
            <g class="fg-dot-bad"><circle cx="232" cy="22" r="4"/><circle cx="250" cy="40" r="4"/><circle cx="268" cy="58" r="4"/><circle cx="286" cy="76" r="4"/><circle cx="306" cy="96" r="4"/></g>
            <text x="270" y="130" text-anchor="middle" class="t-b t-bad">r = −1</text>
            <rect x="10" y="160" width="310" height="160" rx="8" class="fg-thin"/>
            <text x="165" y="186" text-anchor="middle" class="t-b">Strength = size of r, sign = direction</text>
            <text x="30" y="216" class="t-sm">+0.10 → very weak</text>
            <text x="30" y="240" class="t-sm">+0.90 → strong, positive</text>
            <text x="30" y="264" class="t-sm">−0.95 → stronger, negative</text>
            <text x="30" y="288" class="t-sm t-b">−1.00 → perfect (strongest)</text>
            <text x="30" y="310" class="t-sm t-mut">even r = ±1 does not prove cause</text>
          </svg>
      - kind: check
        page: 29
        quote: "Correlation Coefficient: The correlation coefficient (r) measures the strength of the association between two variables (Pearson correlation). The value of r ranges between +1 and -1.\n  +1 = A positive or direct correlation, eg, smoking and lung cancer\n  -1 = A negative or inverse correlation, eg, exercise and the risk of heart disease\n  0 = A zero correlation (no relationship), eg, color of the skin and intelligence\nNOTE: Even with a perfect correlation (r) of +1 or -1, a causal relationship may not necessarily exist between the two variables."
        question: "Which correlation coefficient shows the strongest association?"
        options: ["+0.10", "−0.95", "+0.90", "−1.00"]
        answer: 3
        why:
          - "قريب من الصفر، يعني ضعيف جدًا."
          - "قوي، بس 0.95 أقل من 1."
          - "قوي، بس أضعف من 0.95 ومن 1."
          - "صح: القوة بالحجم، و **1.00** = perfect correlation. الإشارة السالبة اتجاه بس."
      - kind: check
        page: 32
        quote: "In what range does correlation coefficient lie?\nA. 0 to +1\nB. -1 to 0\nC. -1 to +1\nD. > 1"
        question: "In what range does the correlation coefficient lie? (slide 32)"
        options:
          - "-1 to +1"
          - "0 to +1"
          - "-1 to 0"
          - "> 1"
        answer: 0
        why:
          - "صح: من −1 (عكسي تام) لـ +1 (طردي تام)، والـ 0 = مفيش علاقة خطية."
          - "ده بينسى العلاقة العكسية: r ممكن يبقى سالب."
          - "ده بينسى العلاقة الطردية."
          - "الـ r عمره ما يعدّي 1 في القيمة المطلقة."
      - kind: aside
        tone: trap
        page: 29
        quote: "Correlation Coefficient: The correlation coefficient (r) measures the strength of the association between two variables (Pearson correlation). The value of r ranges between +1 and -1.\n  +1 = A positive or direct correlation, eg, smoking and lung cancer\n  -1 = A negative or inverse correlation, eg, exercise and the risk of heart disease\n  0 = A zero correlation (no relationship), eg, color of the skin and intelligence\nNOTE: Even with a perfect correlation (r) of +1 or -1, a causal relationship may not necessarily exist between the two variables."
        text: |
          **Correlation does NOT mean causation.** حتى لو r = +1 أو −1، ده مش معناه إن في **causal relationship** بين الـ two variables.

          مبيعات الآيس كريم والغرق في الصيف بيطلعوا مع بعض. الآيس كريم مش بيغرّق حد، الصيف هو اللي بيعمل الاتنين.

          الدكتورة قالت في الشرح: قبل ما تصدّق أي r، بص على الـ **scatter diagram** والـ outliers وفكّر في الـ confounders. ورقم الـ 30 في السلايد مش حد سحري: فوقه مش معناه إن أي correlation بقى موثوق.
      - kind: reveal
        page: 31
        quote: "Limitations of the Correlation Coefficient: Although correlation analysis is very helpful in determining the degree to which two variables are associated, it becomes very ineffective when the total number of observations in the study are small (n < 30). When small sample scattergrams are plotted, the outliers (observations that lie outside the normal range) have a marked effect on the correlation coefficient and often produce misleading results."
        prompt: "إمتى الـ r يضحك عليك؟"
        answer: |
          لما الـ observations تكون قليلة: المحاضرة بتقول ==n < 80==.

          في العينة الصغيرة نقطة شاذة واحدة (**outlier**) بتشد الخط كله وتطلع r مضلّل.
      - kind: try
        items: [res.L04.029, res.L04.030, res.L04.033]
    recap:
      - "**r** من −1 لـ +1. القوة = حجم الرقم، والإشارة = الاتجاه. −1.00 أقوى من +0.90."
      - "**Correlation ≠ causation** حتى لو r = ±1. والـ r بيضلل لو n < 80 (outliers)."
    practice: [res.L04.029, res.L04.030, res.L04.031, res.L04.032, res.L04.033, res.L04.034, res.L04.035, res.L04.063]

