      - kind: aside
        tone: analogy
        page: 150
        quote: "If SAAG is ≥ 1.1 g/dl (High SAAG), ascites is most likely due to portal hypertension"
        text: |
          الـ SAAG زي فرق الضغط بين الشارع والبدروم. لو الفرق كبير (≥1.1)، يبقى فيه ضغط عالي بيزق المية لتحت: **portal hypertension**.

          لو الفرق صغير (<1.1)، يبقى المشكلة مش ضغط، الحيطة نفسها مخرومة: غشاء ملتهب أو ورم.
