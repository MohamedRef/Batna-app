  - id: git.L03.lesson2
    title: "حرقان والحمض طبيعي: functional heartburn"
    hook: "PPI مرتين في اليوم، والمنظار سليم، والحرقان لسه موجود. الحمض مش هو المشكلة، يبقى إيه؟"
    minutes: 9
    pages: [88, 91]
    topics: [heartburn]
    goals:
      - "تعرف الـ functional esophageal disorders الأربعة وإنها تشخيص بالاستبعاد"
      - "ترتّب الـ work-up لحد الـ functional heartburn وتفرّقه عن الـ reflux hypersensitivity"
      - "تعرف مين المريض وإيه الآلية وليه العلاج pain modulators"
    status: unverified
    steps:
      - kind: explain
        remind: [git.L03.051]
        page: 88
        quote: "The diagnosis is typically made after the exclusion of gastroesophageal reflux disease and a primary esophageal motility abnormality such as achalasia or diffuse esophageal spasm."
        title: "تشخيص بالاستبعاد"
        text: |
          الـ **functional esophageal disorders** أعراض مفروض جاية من المريء، بس الفحوصات المتاحة مش بتلاقي سبب.

          فالتشخيص بييجي بعد ما تستبعد حاجتين: ==gastro-esophageal reflux disease (GERD)== و **primary motility abnormality** زي achalasia أو diffuse esophageal spasm.

          الـ domain A فيه: **functional chest pain**، **functional heartburn**، **reflux hypersensitivity**، **globus** و **functional dysphagia**.

          التفسير المقبول (مش في الكتاب): ليه دول بالذات؟ لأنهم الاتنين بيعملوا نفس الأعراض (حرقان، ألم صدر، صعوبة بلع) وليهم علاج مختلف تمامًا: الـ GERD بيتعالج بالـ PPI، والـ achalasia بالتوسيع أو الـ myotomy. فلو فوّتهم وقلت functional، المريض هيفضل بيتعب من حاجة ليها علاج.
      - kind: explain
        page: 89
        quote: "Functional heartburn, functional chest pain of presumed esophageal origin, functional dysphagia and globus are the four functional esophageal disorders as defend in the ROME IV consensus criteria."
        title: "أربعة في المريء، والأدلة قليلة"
        text: |
          الكتاب: الـ functional esophageal disorders في Rome IV أربعة:
          - **Functional heartburn**
          - **Functional chest pain** of presumed esophageal origin
          - **Functional dysphagia**
          - **Globus**

          والعلاجات (dietary، pharmacological، psychological) لهم مبنية على ==limited evidence== لحد دلوقتي.

          التفسير المقبول (مش في الكتاب) للرابط بينهم: الأربعة أعراض المريء الكلاسيكية (حرقان، ألم صدر، صعوبة بلع، كتلة في الزور)، بس **من غير** reflux ولا motility disorder ولا structural lesion. يعني كل واحد فيهم بيتشخص بنفس الطريقة: نستبعد الـ GERD الأول، وبعدين الـ achalasia والـ spasm، واللي يفضل هو الـ functional. وعلشان الأدلة قليلة، الامتحان بيسأل عن **الـ work-up** أكتر من العلاج.
      - kind: explain
        page: 89
        quote: "Heartburn has been defined as a burning retrosternal discomfort that may radiate toward the neck and is typically worse postprandial, during exercise or while lying recumbent."
        title: "الحرقان والـ PPI trial"
        text: |
          الكتاب: الـ ==heartburn== حرقان **retrosternal** ممكن يطلع للرقبة، وبيزيد **بعد الأكل**، مع **المجهود**، أو لما ينام على ضهره.

          وهو من الأعراض الـ **typical** للـ GERD، فناس كتير بتبدأ بـ **PPI trial** لو مفيش alarm symptoms: ==optimally dosed PPI مرة أو مرتين في اليوم لمدة 4 أسابيع==.

          التفسير المقبول (مش في الكتاب) لـ «ليه بيزيد كده»: بعد الأكل المعدة مليانة والـ LES بيرتخي، والمجهود بيزوّد ضغط البطن، والنوم بيشيل الجاذبية اللي بترجّع الحمض لتحت. فالحرقان اللي بيمشي على القواعد دي بيشاور على الحمض، وعلشان كده الـ PPI هو أول خطوة منطقية.
      - kind: figure
        page: 89
        quote: "With a normal endoscopy, an ambulatory or an impedance pH test is undertaken after keeping the patient off a PPI for at least 7 days."
        title: "الـ algorithm بتاع الحرقان"
        alt: "Flowchart down the left: heartburn without alarm symptoms, then a 4-week optimal-dose PPI trial (response means GERD), then EGD if no response (abnormal means treat the cause), then pH-impedance off PPI for at least 7 days if EGD is normal (high acid exposure means GERD), then symptom association with normal acid exposure (positive means reflux hypersensitivity), then manometry if negative (achalasia or DES means a motor disorder), and finally a normal manometry means functional heartburn. A note says alarm symptoms skip the PPI trial and go to EGD first."
        caption: "كل خطوة بتشيل سبب. اللي يفضل في الآخر بعد ما الـ pH والـ manometry يطلعوا نضاف هو الـ functional heartburn."
