  - id: res.L07.lesson4
    title: "NNT: كام عيان نعالج علشان ننقذ واحد؟"
    hook: "دوا بيقلل الوفيات 50%... بس ده ممكن يعني ٤ عيانين أو ٤٠٠٠ عيان. الفرق كله في الـ NNT."
    minutes: 9
    pages: [52, 63]
    topics: [effect-measures]
    goals:
      - "تحسب control event rate (CER) و experimental event rate (EER) و relative risk reduction (RRR) و absolute risk reduction (ARR) و number needed to treat (NNT) من 2x2 table"
      - "تفهم ليه الـ RRR لوحده بيخدع"
      - "تحل تمرين الـ INH وتمرين الـ zidovudine وتلاقي غلطة الشريحة"
    status: unverified
    steps:
      - kind: explain
        remind: [res.L07.052]
        page: 52
        quote: "Measures used in Intervention Trials: When comparing 2 groups of participants in a RCT, the control group and the intervention group, you can use the following measures to help you judge the size of the effect of the intervention:\n  The relative risk reduction (RRR)\n  The absolute risk reduction (ARR)\n  The numbers needed to treat (NNT)"
        title: "Step 12: حجم الأثر بـ 3 أرقام"
        text: |
          في الـ analysis: أول حاجة **baseline table** يقارن الجروبين، وبعدين **2x2 table** بخانات a و b و c و d.

          وعلشان تحكم على حجم الأثر عندك 3 مقاييس:
          - ==Relative risk reduction (RRR)==
          - ==Absolute risk reduction (ARR)==
          - ==Number needed to treat (NNT)==
      - kind: table
        page: 53
        quote: "Are the results Clinically Significant?\n| | Outcome Present | Outcome Absent | Totals |\n|---|---|---|---|\n| Experimental group | a | b | a+b |\n| Control group | c | d | c+d |\n| Totals | a+c | b+d | a+b+c+d |\n  Control Event Rate: CER = c / c+d\n  Experimental Event Rate: EER = a / a+b\n  Relative Risk Reduction = CER - EER / CER\n  Absolute Risk Reduction: ARR = CER - EER\n  Number Needed to Treat: NNT = 1 / ARR"
        title: "المعادلات"
        columns: ["Measure", "Formula"]
        rows:
          - ["CER (control)", "c / (c + d)"]
          - ["EER (experimental)", "a / (a + b)"]
          - ["RRR", "(CER - EER) / CER"]
          - ["ARR", "CER - EER"]
          - ["NNT", "1 / ARR"]
        hide: [[2, 1], [3, 1], [4, 1]]
      - kind: figure
        page: 54
        quote: "Example: mortality rate control 17%, intervention 12%\n  RRR = 17-12 / 17 = 29%\n  ARR = 17% - 12% = 5%\n  NNT = 1 / 5% = 100 / 5 = 20\nWe need to treat 20 people to prevent one death"
        title: "مثال المحاضرة: 17% ضد 12%"
        alt: "Bar chart. Control mortality 17 percent, intervention 12 percent. The gap between the bars is the absolute risk reduction, 5 percent. The relative risk reduction is 5 divided by 17, 29 percent. The number needed to treat is 100 divided by 5, 20."
        caption: "الفرق بين العمودين هو الـ **ARR = 5%**. اقسمه على عمود الـ control تاخد **RRR = 29%**. و **NNT = 100 / 5 = 20**."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 210H300" class="fg-thin"/>
            <rect x="70" y="40" width="70" height="170" rx="4" class="fg-bad"/>
