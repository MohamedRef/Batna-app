  - id: neph.L11.106
    kind: mcq
    topic: dialysis-contraception
    stem: "A 26-year-old on CAPD for lupus nephritis has positive antiphospholipid antibodies and asks for contraception. Which option is least suitable per Fig 2?"
    options:
      - Combined estrogen-progestin pill
      - Male condom combined with another method
      - Sterilization if she wants no more children
      - Counseling about transplantation before any planned pregnancy
    answer: 0
    why:
      - "Correct: estrogen combinations are contraindicated with antiphospholipid syndrome because of thrombotic risk."
      - Condoms are fine if paired with another method.
      - Sterilization is permanent but allowed for those who want no more children.
      - Transplant counseling is recommended for all.
