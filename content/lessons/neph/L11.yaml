      - kind: explain
        page: 383
        title: "الـ graft يستحمل؟"
        quote: "The impact of pregnancy on allograft survival Based on many published data, pregnancy does not negatively impact long-term allograft function or survival as long as the baseline function of the allograft is excellent. For women with a serum creatinine of 1.5 mg/dl or lesser, 90% of pregnancies were reported to be successful. In contrast, when a baseline creatinine is 1.8–2 mg/dl or higher, allograft loss is more likely to occur typically within 2 years after conception.(90)"
        text: |
          - Creatinine ==≤1.5==: **90%** من الحمل ناجح، والـ graft مش بيتأثر.
          - **>1.5 + proteinuria >500 mg/24 h** (Davison): predictors لفقد الـ graft.
          - **1.8-2 أو أكتر**: فقد الـ graft أرجح خلال **سنتين**.
          - **>1.9** (Fischer): تدهور سريع ممكن لـ end-stage renal disease (ESRD).

          الكلية التعبانة أصلًا بتعمل hyperfiltration، فمفيش ==reserve== للحمل.
      - kind: figure
        page: 383
        quote: "Several factors predicting adverse outcomes and graft loss during pregnancy are, hereby. A history of previous rejections and significant proteinuria can also negatively impact allograft function. According to Davison et al.(95) a baseline serum creatinine level of more than 1.5 mg/dl and proteinuria of more than 500 mg/24 h were strong predictors of irreversible graft loss during pregnancy. Fischer(92) reported that patients with a baseline serum creatinine of more than 1.9 mg/dl are more likely to suffer a rapid deterioration in kidney function during pregnancy that could progress to ESRD, consistent with expert consensus opinion. Predamaged kidneys with fewer functioning nephrons already exhibiting hyper filtration do not have sufficient reserves, thereby, accelerating allograft failure. (93)"
