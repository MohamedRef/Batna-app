  - id: rheum.L16.lesson6
    title: "العلاج: treat to target بالـ methotrexate"
    hook: "سنتين أول المرض هما اللي بيتهدّ فيهم المفصل. يعني الوقت هنا عضم وغضروف."
    minutes: 10
    pages: [260, 266]
    topics: [strategy, nsaids, steroids, csdmards]
    goals:
      - "تمشي في الـ EULAR algorithm بمراحله التلاتة"
      - "تعرف دور الـ NSAIDs والـ steroids وحدودهم"
      - "تحفظ جدول الـ csDMARDs: الجرعة، الأعراض، المتابعة"
    status: unverified
    steps:
      - kind: explain
        page: 260
        title: "ليه بدري؟"
        quote: "Early diagnosis and early treatment are needed as joint destruction occurs in the first 2 years of onset."
        text: |
          الـ joint destruction بيحصل في ==أول سنتين==. والـ DMARDs لازم تبدأ في أول **12 أسبوع**.

          وفيه ناس محتاجة علاج **aggressive** علشان عندها poor prognostic features.
      - kind: mnemonic
        page: 260
        quote: "Joint erosions. Extra — articular manifestations. Rheumatoid factor positivity. Family history of severe RA."
        word: "FEARS"
        parts:
          - { key: "F", text: "Family history of severe RA" }
          - { key: "E", text: "Erosions on X-ray" }
          - { key: "A", text: "Activity high early: severe synovitis with functional limitation" }
          - { key: "R", text: "RF positive" }
          - { key: "S", text: "Systemic (extra-articular) features" }
        hook: "الـ poor prognostic features هي الحاجات اللي بتخلّي الروماتولوجيست عنده **FEARS**، فيضرب بعلاج أقوى."
      - kind: figure
        page: 261
        quote: "Improved at 3 months and achieved target at 6 months?"
        title: "الـ EULAR algorithm في 3 مراحل"
        alt: "Vertical flowchart. Phase I: methotrexate plus short-term glucocorticoids, or leflunomide or sulfasalazine if methotrexate is contraindicated. Decision: improved at 3 months and target at 6 months? Yes leads to continue and taper in sustained remission. No leads to phase II: with poor prognostic factors add a bDMARD or consider a JAK inhibitor after risk assessment; without them change to or add a second csDMARD. Same decision. No leads to phase III: change the bDMARD or JAK inhibitor."
        caption: "كل مرحلة ليها نفس السؤال: **اتحسّن في 3 شهور ووصل للـ target في 6؟** آه = كمّل وقلّل الجرعة في الـ remission. لأ = المرحلة اللي بعدها."
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R16c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="310" height="62" rx="8" class="fg-acc"/>
            <text x="20" y="30" class="t-b">Phase I</text>
            <text x="20" y="48" class="t-sm">MTX + short-term glucocorticoids</text>
            <text x="20" y="64" class="t-sm t-mut">MTX contraindicated: leflunomide or SSZ</text>
            <path d="M165 72 L165 92" class="fg-arrow" marker-end="url(#R16c)"/>
            <rect x="40" y="94" width="250" height="40" rx="20" class="fg-thin"/>
            <text x="165" y="112" text-anchor="middle" class="t-sm">Better at 3 mo + target at 6 mo?</text>
            <text x="165" y="127" text-anchor="middle" class="t-sm t-good">Yes: continue, taper in remission</text>
            <path d="M165 134 L165 154" class="fg-arrow" marker-end="url(#R16c)"/>
            <text x="175" y="149" class="t-sm t-bad">No</text>
            <rect x="10" y="156" width="310" height="90" rx="8" class="fg-box"/>
            <text x="20" y="176" class="t-b">Phase II</text>
            <text x="20" y="195" class="t-sm t-bad">Poor prognosis (RF/ACPA high, erosions,</text>
            <text x="20" y="210" class="t-sm t-bad">high activity, failed 2 csDMARDs):</text>
            <text x="30" y="225" class="t-sm">add bDMARD, or JAKi after risk check</text>
            <text x="20" y="240" class="t-sm"><tspan class="t-good">No poor prognosis:</tspan> 2nd csDMARD</text>
            <path d="M165 246 L165 266" class="fg-arrow" marker-end="url(#R16c)"/>
            <rect x="40" y="268" width="250" height="40" rx="20" class="fg-thin"/>
            <text x="165" y="286" text-anchor="middle" class="t-sm">Better at 3 mo + target at 6 mo?</text>
            <text x="165" y="301" text-anchor="middle" class="t-sm t-good">Yes: continue, taper</text>
            <path d="M165 308 L165 328" class="fg-arrow" marker-end="url(#R16c)"/>
            <text x="175" y="323" class="t-sm t-bad">No</text>
            <rect x="10" y="330" width="310" height="60" rx="8" class="fg-bad"/>
            <text x="20" y="352" class="t-b">Phase III</text>
            <text x="20" y="372" class="t-sm">change the bDMARD or JAKi (same or other class)</text>
          </svg>
      - kind: explain
        page: 262
        title: "الـ footnotes اللي بتيجي في الامتحان"
        quote: "therapy should be adapted or changed if insufficient improvement (less than 50% of disease activity) is seen after 3 months"
        text: |
          - الـ **target**: clinical remission، ولو صعب يبقى على الأقل low disease activity، في **6 شهور**. لو التحسّن ==أقل من 50%== في 3 شهور غيّر.
          - **Sustained remission** = 6 شهور أو أكتر.
          - أشهر combination: **MTX + sulfasalazine + hydroxychloroquine**.
          - الـ bDMARD/tsDMARD ممكن تقلّل جرعته أو تبعّد المسافة بأمان، بس **الإيقاف** بيعمل flares كتير، والـ steroids لازم تقف الأول.
      - kind: aside
        tone: exam
        page: 262
        quote: "Age over 65 years, history of current or past smoking, other cardiovascular risk factors"
        text: "قبل الـ **JAK inhibitor** اسأل عن: سن **فوق 65**، **التدخين** (حالي أو قديم)، CV risk، malignancy risk، و thromboembolic risk. ده سؤال امتحان أكيد."
      - kind: check
        page: 261
        quote: "Poor prognostic factors present"
        question: "عيانة ACPA عالي و erosions بدري، ما وصلتش للـ target بعد 6 شهور methotrexate. الخطوة الجاية؟"
        options: ["Add a bDMARD", "Hydroxychloroquine لوحده", "كمّل MTX سنة كمان", "Steroids جرعة عالية على طول"]
        answer: 0
        why:
          - "صح: poor prognostic factors في الـ phase II = add a bDMARD (أو JAKi بعد risk assessment)."
          - "الـ HCQ دوا ضعيف للـ mild RA."
          - "فشل الـ target في 6 شهور = غيّر، متكمّلش."
          - "الـ steroids الطويلة أعراضها الجانبية مش مقبولة."
      - kind: explain
        page: 263
        title: "الـ NSAIDs: مسكّن مش علاج"
        quote: "They control inflammation and pain (analgesic effect). They do not prevent the structural damage."
        text: |
          بتهدّي الألم والالتهاب، بس ==مش بتمنع الـ damage==.

          - **COX-1** constitutive: بيحمي الـ gastric mucosa، والـ renal blood flow، والـ platelets.
          - **COX-2** induced في الالتهاب: وقفه هو اللي بيدّي الـ analgesic و anti-inflammatory و antipyretic.
          - الـ selective COX-2 (celecoxib، rofecoxib): مفيش ulcer risk زيادة، بس باقي الأعراض موجودة.
      - kind: update
        page: 263
        quote: "Selective COX-2 inhibitors (Celecoxib and rofecoxib)"
        text: "الـ rofecoxib اتسحب من السوق في العالم كله سنة 2004 علشان الـ cardiovascular events. الـ celecoxib لسه موجود. في الامتحان الكتاب بيكسب."
        ref: "Merck voluntary worldwide withdrawal of Vioxx (rofecoxib), 2004"
      - kind: sort
        page: 263
        quote: "Low - risk: Ibuprofen, Etodolac, Meloxicam. High risk: Piroxicam, Indomethacin. Moderate: Naproxen, Diclofenac."
        prompt: "حط كل NSAID في خانة الـ GI risk بتاعته:"
        bins: ["Low", "Moderate", "High"]
        cards:
          - { text: "Ibuprofen", bin: 0 }
          - { text: "Etodolac", bin: 0 }
          - { text: "Meloxicam", bin: 0 }
          - { text: "Naproxen", bin: 1 }
          - { text: "Diclofenac", bin: 1 }
          - { text: "Piroxicam", bin: 2 }
          - { text: "Indomethacin", bin: 2 }
        why: "Low: ibuprofen، etodolac، meloxicam. Moderate: naproxen، diclofenac. High: piroxicam و indomethacin (الـ P و الـ I هما الخطر)."
      - kind: explain
        page: 263
        title: "الأعراض الجانبية للـ NSAIDs"
        quote: "May affect renal function by suppressing vasodilator PGE2 or induce interstitial nephritis."
        text: |
          1. **GI**: نزيف و perforation في الـ ulcers
          2. **Fluid retention** ← circulatory overload ← القلب يتعب
          3. **الكلى**: بيوقف الـ ==vasodilator PGE2== أو interstitial nephritis
          4. **CNS**: دوخة، صداع، confusion
          5. Asthma و anaphylaxis نادر
          6. الاستخدام الطويل ممكن يسرّع تلف الغضروف والعضم.
      - kind: explain
        page: 264
        title: "الـ steroids: كوبري مش بيت"
        quote: "Use low dose (7.5 mg) of prednisolone or equivalent."
        text: |
          مفعولها سريع وجامد، بس الجرعات اللي تكفي على المدى الطويل أعراضها **مش مقبولة** (Cushingoid، osteoporosis، سكر، IHD، ضغط، ulcer، glaucoma، cataract).

          الـ indications:
          1. ==Bridge therapy==: **1-3 شهور**، **7.5 mg prednisolone**، لحد ما الـ DMARD يشتغل.
          2. Vasculitis، العين، الرئة.
          3. الحمل لما الـ DMARDs ممنوعة.

          **Intra-articular**: لمفصل أو اتنين، بتقعد **2-8 أسابيع**، ومش أكتر من **4 في السنة** في المفصل الكبير، و asepsis صارم.
      - kind: table
        page: 265
        quote: "Folic acid (1mg/d) reduce side effects."
        title: "الـ csDMARDs"
        columns: ["Drug", "Dose", "Watch and monitor"]
        rows:
          - ["MTX", "5-25 mg/wk", "Liver, lung, marrow: CBC, LFT monthly"]
          - ["Folic acid", "1 mg/day", "Reduces MTX side effects"]
          - ["SSZ", "2-3 g/day", "Neutropenia, hepatitis: CBC, LFT"]
          - ["LEF", "20 mg/day", "Hepatitis, high BP: CBC, LFT, BP"]
          - ["HCQ", "200-400 mg/day", "Retinopathy: eyes, Amsler chart"]
          - ["AZA", "50-150 mg/day", "Marrow, liver: CBC, LFT"]
          - ["CsA", "2.5-4 mg/kg/day", "Kidney, BP: creatinine, BP"]
        hide: [[0, 1], [3, 2], [4, 2], [6, 2]]
      - kind: explain
        page: 265
        title: "الـ methotrexate شغّال إزاي؟"
        quote: "Adenosine is a potent inhibitor of neutrophil function and has potent anti inflammatory properties."
        text: |
          ==First choice==. بيوقف الـ **dihydrofolate reductase** (purine synthesis).

          وكمان بيوقف الـ **AICAR transformylase**، فالـ AICAR يتجمع ويطلّع ==adenosine==، وده anti-inflammatory جامد وبيوقف الـ neutrophils.

          **Folic acid 1 mg/day** بيقلّل الأعراض الجانبية.
      - kind: match
        page: 265
        quote: "leflunomide inhibits dihydroorotate dehydrogenase leading to decrease in de novo."
        prompt: "وصّل الدوا بالـ mechanism:"
        pairs:
          - ["Methotrexate", "DHFR and AICAR transformylase"]
          - ["Leflunomide", "Dihydroorotate dehydrogenase (pyrimidines)"]
          - ["Hydroxychloroquine", "Blocks HLA antigen presentation"]
          - ["Cyclosporine", "Blocks resting lymphocytes in G0/G1"]
          - ["Azathioprine", "Inhibits purine metabolism"]
        why: "MTX على الـ folate والـ adenosine. LEF على الـ pyrimidines فيوقف الـ lymphocytes في G1. HCQ على الـ antigen presentation. CsA على الـ lymphokines. AZA على الـ purines."
      - kind: aside
        tone: tip
        page: 266
        quote: "Now not first choice for RA because of toxicity and very slow onset of action."
        text: "الـ **gold** والـ **D-penicillamine** خلاص اتقاعدوا: toxic (marrow، nephritis، rash، mouth ulcers) وبطيئين جدًا. الـ **azathioprine** والـ **cyclosporine** = 2nd choice."
      - kind: try
        items: [rheum.L16.105, rheum.L16.110, rheum.L16.125, rheum.L16.129, rheum.L16.137]
    recap:
