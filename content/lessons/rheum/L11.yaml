  - id: rheum.L11.lesson4
    title: "HIV: بيتنقل إزاي وبيعمل إيه"
    hook: "ممرضة اتشكت بإبرة: الخطر 0.3%، والفحص الأول ممكن يطلع سلبي وهي مصابة. ليه؟"
    minutes: 8
    pages: [191, 192]
    topics: [hiv]
    goals:
      - "تعرف طرق العدوى ونسبها وليه بعضها أكفأ"
      - "تشرح الـ pathogenesis من الـ CD4 لحد الـ infections"
      - "تعرف الـ antibodies اللي بنشخص بيها والـ window period"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L11.067]
        page: 191
        title: "العدوى بتيجي منين؟"
        quote: "Heterosexual intercourse accounts for the vast majority of infections. Passage of HIV appears to be more efficient form men to women, and to the passive partner in anal intercourse, than vice versa."
        text: |
          الكتاب بيدّي أربع طرق:
          1. **Sexual:** الـ heterosexual هو ==الأغلبية الساحقة==، وأكفأ من **men to women** وللـ passive partner في الـ anal intercourse. (في الـ UK أغلب الحالات homosexual)
          2. **Mother to child:** قبل الولادة، أثناءها، والرضاعة
          3. **Blood، blood products، organ donation:** علشان كده ==screening== الدم ضروري
          4. **Needles:** حقن مخدرات، حقن، و needle stick

          ليه من الراجل للست أكفأ؟ التفسير المقبول (مش في الكتاب): السائل المنوي فيه فيروس كتير، وبيقعد مدة على مساحة غشاء أكبر. والـ rectum غشاؤه طبقة واحدة رقيقة بتتجرح بسهولة.
      - kind: explain
        remind: [rheum.L11.069]
        page: 191
        title: "الأم والطفل"
        quote: "Vertical transmission is the most common route of HIV infection in children.\nFactors associated with increased vertical transmission include advanced disease in the mother, prolonged and premature rupture f the membranes, & chorioamnionitis."
        text: |
          - الـ ==vertical transmission== أشهر طريق في الأطفال
          - بيزيد مع: **advanced disease** في الأم، **prolonged and premature rupture of membranes**، و **chorioamnionitis**
          - الـ **breastfeeding** بيزوّد الخطر لحد ==20%==، و **zidovudine** بيقلله

          ليه العوامل دي بالذات؟ التفسير المقبول (مش في الكتاب): المرض المتقدم = فيروس أكتر في دم الأم. الأغشية المفتوحة مدة طويلة = الطفل قاعد في سوائل فيها فيروس وقت أطول. والالتهاب بيخلي المشيمة والأغشية أسهل في العبور.
      - kind: sort
        page: 192
        quote: "There is no evidence that HIV is spread by social or household contact nor by blood-sucking insects such as mosquitoes and bed bugs."
        prompt: "الكتاب: بيتنقل ولا مش بيتنقل؟"
        bins: ["Transmits HIV", "No evidence"]
        cards:
          - { text: "Vaginal or anal intercourse", bin: 0 }
          - { text: "Breastfeeding", bin: 0 }
          - { text: "Needle-stick injury", bin: 0 }
          - { text: "Organ donation", bin: 0 }
          - { text: "Household contact", bin: 1 }
          - { text: "Mosquitoes", bin: 1 }
          - { text: "Bed bugs", bin: 1 }
        why: "الكتاب: sexual، mother to child (منها الرضاعة)، blood و organ donation، والإبر. ومفيش evidence للـ social أو household contact ولا الحشرات اللي بتمص الدم. التفسير المقبول (مش في الكتاب): الفيروس ما بيعيشش ولا بيتكاثر جوه الحشرة."
      - kind: case
        page: 191
        quote: "Health care workers have a risk of 0.3% following a single needle stick injury with known HIV infected blood."
        stem: "A 28-year-old nurse has a needle-stick injury from a patient with known HIV. Her baseline anti-HIV ELISA is negative."
        steps:
          - question: "Her risk of infection after one needle-stick?"
            options: ["About 0.3%", "About 3%", "About 30%", "Nearly zero"]
            answer: 0
            why: "الكتاب: 0.3% بعد needle stick واحدة بدم HIV معروف."
          - question: "Why does a negative antibody test now not exclude infection later?"
            options: ["Antibodies take up to 3 months (window period)", "ELISA cannot detect HIV-1", "Antibodies are protective and clear the virus", "She is immune"]
            answer: 0
            why: "الـ anti-HIV بيظهر بعد window period لحد 3 شهور، فالـ baseline السلبي بيوثّق إنها كانت سليمة قبل الحادثة بس. والـ antibodies دي مش protective."
      - kind: figure
        page: 192
        quote: "The host cellular receptor that is recognized by HIV surface glycoprotein is CD4 molecule which defines the population that are susceptible to infection. The interaction between CD4 and HIV surface glycoprotein is responsible for HIV entry to the cells."
        title: "من الـ CD4 للـ infections"
        alt: "HIV surface glycoprotein binds the CD4 molecule on a helper T cell and enters it. The infected cell makes virus for about two days and dies; virus in blood has a half-life of about six hours. CD4 cells fall progressively. Two results: cell-mediated immunodeficiency leading to intracellular pathogens, and antibody abnormalities leading to capsulated bacteria."
        caption: "الفيروس بيمسك ==CD4== ويدخل. الخلية بتطلّع فيروس يومين وتموت، والـ CD4 بيقل. النتيجة: **cell mediated** ← intracellular، و **antibody abnormalities** ← ==capsulated bacteria==."
        svg: |
          <svg viewBox="0 0 330 270" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L11p" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="fg-head"/></marker></defs>
            <circle cx="50" cy="40" r="22" class="fg-bad"/>
            <text x="50" y="45" text-anchor="middle" class="t-sm t-b">HIV</text>
            <path d="M72 40 L120 40" class="fg-arrow" marker-end="url(#L11p)"/>
            <text x="96" y="30" text-anchor="middle" class="t-sm t-mut">gp120</text>
            <rect x="122" y="20" width="110" height="40" rx="20" class="fg-acc"/>
            <text x="177" y="45" text-anchor="middle" class="t-sm t-b">CD4 T helper</text>
            <text x="280" y="36" text-anchor="middle" class="t-sm t-mut">virus ~2 days</text>
            <text x="280" y="52" text-anchor="middle" class="t-sm t-mut">then cell dies</text>
            <path d="M177 60 L177 90" class="fg-arrow" marker-end="url(#L11p)"/>
            <rect x="92" y="92" width="170" height="34" rx="8" class="fg-bad"/>
            <text x="177" y="114" text-anchor="middle" class="t-sm t-b">progressive CD4 depletion</text>
            <path d="M140 126 L80 166" class="fg-arrow" marker-end="url(#L11p)"/>
            <path d="M214 126 L254 166" class="fg-arrow" marker-end="url(#L11p)"/>
            <rect x="8" y="168" width="148" height="34" rx="8" class="fg-box"/>
            <text x="82" y="190" text-anchor="middle" class="t-sm">cell-mediated defect</text>
            <rect x="176" y="168" width="148" height="34" rx="8" class="fg-thin"/>
            <text x="250" y="190" text-anchor="middle" class="t-sm">antibody abnormalities</text>
            <text x="82" y="228" text-anchor="middle" class="t-sm t-b">intracellular pathogens</text>
            <text x="250" y="228" text-anchor="middle" class="t-sm t-b">capsulated bacteria</text>
            <text x="165" y="258" text-anchor="middle" class="t-sm t-mut">free virus half-life ~6 hours</text>
          </svg>
      - kind: explain
        page: 192
        title: "ليه الاتنين: intracellular و capsulated؟"
        quote: "Cell mediated immunodeficiency which is the major consequence leaves the host open to infections with intra cellular pathogens, whilst the coexisting antibody abnormalities predispose to infections with capsulated bacteria."
        text: |
          الـ human immunodeficiency virus (HIV) بيدخل عن طريق ==CD4== molecule، والـ CD4 هو اللي بيحدد مين يتصاب. والفيروس سريع: half-life في الدم حوالي **six hours**، والخلية المصابة بتطلّع فيروس حوالي **يومين** وبعدين بتموت من الفيروس نفسه.

          والكتاب بيقول المرض نفسه من **defective T-cell homeostasis** ← ==progressive severe depletion== للـ CD4 helper cells.

          النتيجة الأساسية **cell mediated immunodeficiency** ← intracellular pathogens. ومعاها antibody abnormalities ← **capsulated bacteria** كمان. ليه الـ antibody بيتأثر؟ التفسير المقبول (مش في الكتاب): الـ B cell محتاج الـ helper T عشان يعمل antibody كويس ومتخصص، فلما الـ helper يقع، الـ antibodies تبقى كتير بس مش متظبطة (افتكر الـ hypergammaglobulinaemia في ص 185).
      - kind: explain
        page: 192
        title: "بنشخص بإيه؟"
        quote: "By detection of virus specific antibodies (anti-HIV) or direct detection of viral material.\nDetection of Ig antibodies to envelope components (gp 120 and its subunits).\nThe most common used marker for infection, detected by ELISA & confirmed by western blot assays.\n3 months of latency (serological latency or window period).\nThese antibodies are not protective & persist for life."
        text: |
          التشخيص بطريقتين: ==antibodies== ضد الفيروس، أو الفيروس نفسه.
          - الـ antibodies ضد الـ **envelope (gp120)** هي ==most common used marker==: **ELISA** وتأكيد بـ **western blot**
          - فيه **window period** لحد **3 شهور** قبل ما تظهر
          - **not protective** و **persist for life**

          ليه فيه window؟ التفسير المقبول (مش في الكتاب): الـ B cells محتاجة أسابيع عشان تتعرف على الفيروس وتعمل IgG بكمية التحليل يشوفها. وليه مش protective؟ لأن الفيروس بيستخبى جوه الخلايا وبيغيّر غلافه، فالـ antibody مش بيلحقه.
      - kind: update
        page: 192
        quote: "The most common used marker for infection, detected by ELISA & confirmed by western blot assays.\n3 months of latency (serological latency or window period)."
        text: "الكتاب: Enzyme-linked immunosorbent assay (ELISA) وبعدين western blot، و window لحد 3 شهور. النهاردة بيبدأوا بـ 4th-generation HIV-1/2 antigen/antibody combination (p24 + antibody) بـ window حوالي 2–6 أسابيع، والتأكيد بـ differentiation immunoassay مش western blot، ولو مش متطابقين: HIV RNA."
        ref: "CDC/APHL HIV laboratory testing algorithm 2014 (updated 2018)"
      - kind: check
        page: 192
        quote: "Cell mediated immunodeficiency which is the major consequence leaves the host open to infections with intra cellular pathogens, whilst the coexisting antibody abnormalities predispose to infections with capsulated bacteria."
        question: "Why does an HIV patient get pneumococcal pneumonia as well as intracellular infections?"
        options:
          - "Coexisting antibody abnormalities"
          - "HIV infects neutrophils directly"
          - "Complement is consumed by the virus"
          - "Anti-HIV antibodies block opsonisation"
        answer: 0
        why:
          - "صح: الكتاب: الـ cell mediated defect للـ intracellular، والـ coexisting antibody abnormalities للـ capsulated bacteria."
          - "الكتاب بيقول الفيروس بيدخل الخلايا اللي عليها CD4، مش بيتكلم عن الـ neutrophils."
          - "الكتاب ما قالش إن الـ complement بيتستهلك."
          - "الـ anti-HIV antibodies مش protective، بس الكتاب ما قالش إنها بتمنع الـ opsonisation."
      - kind: try
        items: [rheum.L11.067, rheum.L11.068, rheum.L11.071, rheum.L11.072, rheum.L11.074]
    recap:
      - "Heterosexual الأغلبية، وأكفأ من الراجل للست. Vertical أشهر في الأطفال، والرضاعة لحد 20% (zidovudine بيقلل). Needle stick 0.3%. مفيش household ولا ناموس."
      - "CD4 receptor. Half-life 6 ساعات، الخلية يومين. CD4 بيقع ← intracellular، و antibody abnormalities ← capsulated."
      - "Anti-gp120: ELISA + western blot، window لحد 3 شهور، مش protective وطول العمر."
