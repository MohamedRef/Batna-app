  - id: res.L05.045
    kind: card
    topic: risk
    front: How does the lecture interpret RR = 1.59 for low bone mineral density and hip fracture?
    back: Over 5 years of follow-up, the risk of hip fracture was 1.59 times higher with low BMD than with normal BMD.
    src: { page: 56, quote: "Example: Risk of hip fracture among those with low BMD in 5 years of follow-up\n| Low BMD | Hip Fracture: Yes | Hip Fracture: No | Total |\n|---|---|---|---|\n| Yes | 230 | 400 | 630 |\n| No | 110 | 369 | 479 |\n| Total | 340 | 769 | 1,109 |\nRisk Ratio (Relative Risk) = CIe / CIu = (230/630) / (110/479) = 1.59\nThe risk of developing hip fractures was 1.59 times higher in those with low bone mineral density compared to those with normal bone mineral density during this 5-year follow-up study." }
    status: unverified
  - id: res.L05.046
    kind: card
    topic: risk
    front: Define attributable risk (AR) and what it quantifies.
    back: >-
      AR = incidence in exposed − incidence in unexposed. It quantifies the "excess risk" in the exposed group
      that is attributable to the exposure.
    src: { page: 57, quote: "Attributable Risk (AR):\n  AR is the difference in the incidence of a disease between an exposed population and an unexposed population.\n  AR is calculated as follows: AR = I exp – I unexp\n  AR is used to quantify \"excess risk\" in the exposed group that is attributable to the exposure." }
    status: unverified
    tags: [high-yield]
  - id: res.L05.047
    kind: card
    topic: risk
    front: Smoking and stroke cohort, incidence 0.30 in smokers and 0.10 in non-smokers. AR and its interpretation?
    back: AR = 0.30 − 0.10 = 0.20; the risk of stroke is increased by 0.20 in smokers compared with non-smokers.
    src: { page: 58, quote: "Example: In a cohort study that investigated the association between smoking and stroke\n  AR = I exp (smokers) – I unexp (non-smokers) = 0.30 – 0.10 = 0.20\nInterpretation: The risk of stroke is increased by 0.20 for smokers compared to non-smokers." }
    status: unverified
    tags: [numbers]
  - id: res.L05.048
    kind: card
    topic: risk
    front: Define the attributable risk percent (ARP) and its formula.
    back: >-
      The percent of the incidence in the exposed that is due to the exposure, i.e. would be eliminated if the
      exposure were eliminated. ARP = (Ie − Io)/Ie × 100.
    src: { page: 59, quote: "Attributable Risk Percent (ARP):\n  AR% is the percent of the incidence of a disease in the exposed that is due to the exposure.\n  It is the % of the incidence of a disease in the exposed that would be eliminated if exposure were eliminated.\n  The risk difference is expressed as a percentage of the total risk experienced by the exposed group: AR% = (Ie – Iu) / Ie × 100, or AR% = AR / Ie × 100" }
    status: unverified
    tags: [high-yield]
  - id: res.L05.049
    kind: mcq
    topic: risk
    stem: >-
      Infants ≥2500 g: first-year death rate 34.4% with 10-minute Apgar 0–3 and 12.5% with Apgar 4–6. What is
      the attributable risk percent?
    options: ["21.9%", "36.3%", "63.7%", "275%"]
    answer: 2
    why:
      - "21.9 is the AR (34.4 − 12.5) in percentage points, not the ARP."
      - "36.3% is Io/Ie, the share NOT due to the exposure."
      - "ARP = (0.344 − 0.125)/0.344 × 100 = 63.7%."
      - "That is the RR (2.75) shown as a percent."
    src: { page: 61, quote: "For the Apgar score–infant mortality data, the attributable risk percent is ARP = (0.344 - 0.125) / 0.344 X 100 = 63.7%\nAlmost two thirds of the total risk of infant mortality for newborns who weigh more than 2500 g and have 10-minute Apgar scores of 0–3 (exposed) is related to an Apgar score below the 4–6 level.\nThe attributable risk percent typically is used as an indicator of the public health impact of exposure.\nThese data suggest that birth asphyxia is a major contributor (63.7%) to, but not the sole cause of, infant mortality among severely asphyxiated children." }
    status: unverified
    tags: [numbers]
