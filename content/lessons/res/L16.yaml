  - kind: mnemonic
    page: 11
    quote: |-
      3 Approximately,
      68% of the scores fall between ± 1 SD
      95% of the scores fall between ± 2 SD
      99% of the scores fall between ± 3 SD
    word: 68 · 95 · 99.7
    parts:
    - key: '68'
      text: ±1 SD = 34.1 + 34.1 ≈ 68%
    - key: '95'
      text: ±2 SD = 68 + 13.6 + 13.6 ≈ 95%
    - key: '99.7'
      text: ±3 SD ≈ 99.7% (السلايد 11 بيقرّبها لـ 99%)
    hook: '«ستة وتمانين؟ لأ: **68**، **95**، **99.7**»: كل خطوة SD بتزوّد المساحة لحد ما تقريبًا كله يبقى جوه.'
  - kind: check
    page: 4
    quote: |-
      2.2% | 13.6% | 34.1% | 34.1% | 13.6% | 2.2%
      μ - 3σ | μ - 2σ | μ - σ | μ | μ + σ | μ + 2σ | μ + 3σ
    question: What share of values lies between −1 SD and +2 SD?
    options:
    - About 81.8% (34.1 + 34.1 + 13.6)
    - About 95%
    - About 68%
    - About 47.7%
    answer: 0
    why:
    - 'صح: اجمع الـ bands: 34.1 + 34.1 + 13.6 = 81.8%.'
    - الـ 95% من −2 لـ +2 SD.
    - الـ 68% من −1 لـ +1 SD بس.
    - 47.7% من الـ mean لـ +2 SD بس (ناحية واحدة).
  - kind: check
    page: 9
    quote: |-
      2.2% | 13.6% | 34.1% | 34.1% | 13.6% | 2.2%
      X- 3SD | X-2SD | X - 1SD | X | X+1SD | X+2SD | X+3SD
      68%
      95%
      99%
    question: In a normal distribution, what share of values lies between +1 SD and +2 SD?
    options:
    - 13.6%
    - 34.1%
    - 27.2%
    - 2.2%
    answer: 0
    why:
    - 'صح: بين 1 و 2 SD في كل ناحية 13.6%.'
    - 34.1% بين الـ mean و 1 SD.
    - 27.2% ده الشريطين مع بعض (الناحيتين).
    - 2.2% بعد 2 SD في ناحية واحدة.
  - kind: explain
    page: 11
    quote: |-
      Normal distribution curve
      1 It is a theoretically perfect frequency polygon in which the mean, median and mode all coincide in the center.
      2 It takes the form of a symmetrical bell-shaped curve of infinite range.
      3 Approximately,
      68% of the scores fall between ± 1 SD
      95% of the scores fall between ± 2 SD
      99% of the scores fall between ± 3 SD
    title: 3 صفات لازم تحفظها
    text: |-
      1. ==Theoretically perfect frequency polygon==: الـ **mean** والـ **median** والـ **mode** كلهم في **النص** بالظبط (سلايد 7).
      2. ==Symmetrical bell-shaped curve of infinite range==: متماثل، والأطراف بتقرب من الخط بس **مبتلمسوش أبدًا**.
      3. تقريبًا **68%** بين ±1 SD، و**95%** بين ±2 SD، و**99%** بين ±3 SD.
    remind: [res.L16.008]
  - kind: aside
    page: 11
    quote: |-
      3 Approximately,
      68% of the scores fall between ± 1 SD
      95% of the scores fall between ± 2 SD
      99% of the scores fall between ± 3 SD
    tone: exam
    text: |-
      السلايدات بتقرّب الأرقام بطرق مختلفة، فمتتلخبطش:

      - سلايد 4 و11: tail = **2.2%** و±3 SD = **99%**.
      - سلايد 15 و28: ±3 SD = **99.7%** (بالتفصيل 99.74%)، والـ tail = **2.15%**، وبعد 3 SD = **0.13%**.

      في الامتحان: الرقم المعروف هو **99.7%**. لو الاختيارات فيها 99 بس من غير 99.7، يبقى هو ده.
  - kind: explain
    page: 28
    quote: |-
      .13% | 2.15% | 13.59% | 34.13% | 34.13% | 13.59% | 2.15% | .13%
      68.26%
      95.44%
      99.74%
    title: الأرقام الأدق تحت المنحنى
    text: |
      سلايد 28 بتدّي الأرقام بدقة أكتر (في كل ناحية):

      | المسافة | النسبة |
      |---|---|
      | mean لـ 1 SD | ==34.13%== |
      | 1 لـ 2 SD | ==13.59%== |
      | 2 لـ 3 SD | 2.15% |
      | بعد 3 SD | 0.13% |

      فالـ ±1 SD = ==68.26%==، ±2 SD = 95.44%، ±3 SD = 99.74%.

      ليه الأرقام بتقل بسرعة كده؟ لأن أغلب القيم متجمعة حوالين المتوسط، وكل ما تبعد القيم بتبقى نادرة أكتر. التفسير المقبول (مش في الكتاب).
  - kind: try
    page: null
    quote: null
    items: [res.L16.002, res.L16.007, res.L16.009, res.L16.011, res.L16.013]
  recap:
  - Normal = منحنى جرس (Gaussian) بيوصف continuous quantitative variables.
  - هو أساس الـ analytic statistical tests.
  - الـ mean = median = mode في النص، والمنحنى متماثل وملوش آخر.
  - 34.1 / 13.6 / 2.2 في كل ناحية، و68 / 95 / 99.7 على ±1 / ±2 / ±3 SD.
