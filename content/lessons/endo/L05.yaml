        text: "كورس الجهاز الهضمي (git.L01) كاتب rise ≥120 pg في 15 دقيقة ووقف الـ PPI أسبوع. هنا في الـ endocrinology الكتاب كاتب **≥50%** و **14 يوم**. كل محاضرة إجابتها من كتابها."
