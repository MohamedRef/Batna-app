    steps:
      - kind: table
        page: 157
        quote: "|  | Elimination route | Mild to moderate HI | Severe HI |\n|---|---|---|---|\n| Sitagliptin (Januvia) | 87% renal | No dose adjustment | No dose recommendation. Use with caution |\n| Vildagliptin (Galvus) | 85% renal | No dose adjustment | No dose recommendation. Use with caution |\n| Saxagliptin (Onglyza) | 75% renal | No dose adjustment | No dose recommendation. Use with caution |\n| Alogliptin (Nesina) | > 70% renal | No dose adjustment | No dose recommendation. Use with caution |\n| Linagliptin (Tradjenta) | Mainly billiary, <7% renal | NO DOSSE adjustment | Unknown |"
