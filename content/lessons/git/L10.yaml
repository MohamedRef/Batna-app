      - kind: explain
        page: 294
        quote: "Reflux symptoms relapse in 10-30% of the patients, after 5 years most of the patients require acid suppressive therapy."
        title: "الجراحة والمنظار"
        text: |
          - ==Laparoscopic fundoplication==: healing و relief كويسين، بس الأعراض بترجع في **10-30%**، وبعد **5 سنين** أغلبهم بيرجعوا للدوا. لمين؟ severe disease ومش عايز دوا طول عمره، refractory GERD، و regurgitation مش متحكّم فيها.
          - **Transoral incisionless fundoplication (TIF)**: regurgitation-predominant **من غير hernia أكبر من 2 cm** ولا advanced esophagitis.
          - **Stretta**: radiofrequency بتعمل LES hypertrophy وتقلل الـ TLESRs.

          ليه الـ fundoplication للناس دي بالذات؟ لأن الدوا بيغيّر **نوع** اللي راجع (أقل حمض) بس ما بيقفلش الباب، فاللي مشكلته regurgitation أو مش عايز دوا طول عمره محتاج حاجز ميكانيكي. وقبل أي جراحة لازم تتأكد بالـ pH إن فيه reflux فعلًا.
      - kind: reveal
        page: 294
        quote: "Laparoscopic Fundoplication: gives good healing effect and symptom relief. Reflux symptoms relapse in 10-30% of the patients, after 5 years most of the patients require acid suppressive therapy."
        prompt: "الـ fundoplication بتلف قاع المعدة حوالين المريء. ليه بتنفع، وليه الأعراض بترجع عند كتير؟"
        answer: |
          الكتاب: healing و relief كويسين، بس **relapse في 10-30%**، وبعد **5 سنين** أغلبهم بيرجعوا لـ acid suppression. ولمين؟ severe disease ومش عايز دوا طول عمره، refractory GERD، و regurgitation مش متحكّم فيها.

          التفسير المقبول (مش في الكتاب): اللفة بتعمل **صمام**: لما المعدة تتملي، القاع الملفوف يضغط على المريء فيقفله. ومع السنين اللفة ممكن ترتخي أو تتزحلق أو الـ hernia ترجع، فالحاجز يضعف تاني.
      - kind: explain
        page: 295
        title: "حلقة مغناطيس، وتحويل مسار للسمنة"
        quote: "Roux-en-Y gastric bypass (RYGB) may be considered in morbidly obese patients with refractory GERD."
        text: |
          - **Magnetic sphincter augmentation**: حلقة ==magnets== بتتزرع بالمنظار الجراحي حوالين الـ EGJ، بتقوّي الـ LES وتقلل رجوع محتويات المعدة.
          - **Roux-en-Y gastric bypass (RYGB)**: للـ ==morbidly obese== مع refractory GERD.

          ليه بيشتغلوا؟ التفسير المقبول (مش في الكتاب): المغناطيس بيمسك الباب مقفول في الراحة، ولما اللقمة تيجي ضغطها أكبر من شد المغناطيس فالخرز يتفرّق وتعدّي. والـ RYGB بيعمل معدة صغيرة **ما فيهاش حمض تقريبًا** وبيحوّل الـ bile بعيد، وفي نفس الوقت بيعالج السمنة اللي هي أصلًا سبب الـ reflux.
      - kind: explain
        page: 297
        title: "المناظير: TIF و Stretta و ARMA و ARMS"
        quote: "ARMA (anti-reflux mucosal ablation)"
        text: |
          - **Transoral incisionless fundoplication (TIF)**: ==regurgitation-predominant== من غير hiatal hernia أكبر من **2 cm** ولا advanced esophagitis.
          - **Stretta**: radiofrequency على الـ distal esophagus بتعمل **LES hypertrophy**، فممكن تعلّي الضغط وتقلل الـ TLESRs.
          - صفحة 297: **ARMA** (anti-reflux mucosal ablation) و **ARMS** (anti-reflux mucosal surgery).

          ليه الـ TIF بس للـ hernia الصغيرة؟ التفسير المقبول (مش في الكتاب): الـ TIF بيتعمل من جوه وبيبني صمام صغير، فلو فيه hernia كبيرة محتاجة تتصلّح جراحيًا، الصمام لوحده مش هيقف. والـ ARMA و ARMS فكرتهم إنهم يشيلوا أو يكووا الـ mucosa عند الـ cardia، فلما تلم بتعمل **ندبة** تضيّق الفتحة شوية.
