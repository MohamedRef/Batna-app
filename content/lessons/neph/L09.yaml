    steps:
      - kind: reveal
        page: 295
        quote: "Why we need an arterialysed vein? ;to give adequate blood flow for the dialyser 250-400ml /min (mean blood flow in the radial artery is only 64"
        prompt: "ليه مش بنغسل من وريد عادي في الدراع؟"
        answer: "الفلتر محتاج **250–400 mL/min**، والوريد العادي ما يستحملش **إبر 15 gauge** 3 مرات في الأسبوع. الـ ==arterialised vein== بيجيب الـ flow وجداره بيتقل فيستحمل الشك."
      - kind: explain
        page: 296
        title: "الـ fistula والـ graft"
        quote: "Native fistula created by anastomosis of an artery to vein radial A to cephalic vein :BresciaCimino fistula, (radiocephalic).Upper rm versus forearm fistula the idea that AVFs created with larger vessels have superior maturation rates. Fistula created 6 months before used (stage 4 CKD) to allow for maturation and and arterialysed vein to be dilated, thickened. AV graft chosen in case of: native fistula fail to mature, poor arterial inflow vasculature, inadequate or poor caliber of patient veins. It is of aprothetic material usually polyetrafluorethylene interposed between A,V."
        text: |
          الـ ==Brescia–Cimino== = **radial artery** متوصل بالـ **cephalic vein** (radiocephalic). الـ radial بيجيب 64 mL/min قبل العملية، وبعد النضج ممكن يتضاعف **10 مرات**. والأوعية الأكبر (upper arm) بتنضج أحسن.

          بتتعمل ==6 شهور قبل الاستخدام== (stage 4).

          **arteriovenous (AV) graft** (PTFE) لو: الـ fistula ما نضجتش، الـ arterial inflow ضعيف، أو الأوردة رفيعة.

          المتابعة: الضغوط على الغسيل والـ access flow، و **Doppler** لو شاكك في stenosis أو thrombosis.

          ليه الـ fistula أحسن من الـ graft والـ catheter؟ التفسير المقبول (مش في الكتاب): الـ fistula **أنسجة العيان نفسه**، فالعدوى قليلة جدًا والـ thrombosis أقل، وبتعيش سنين. الـ graft بلاستيك، فالبكتيريا بتلزق فيه والـ stenosis بتحصل عند الوصلة مع الوريد. والـ catheter في وريد كبير جوّه الصدر، فالعدوى ممكن تبقى sepsis، والـ flow أقل. عشان كده الترتيب: fistula، وبعدين graft، والـ catheter آخر حل أو مؤقت.
          وليه 6 شهور؟ لأن جدار الوريد محتاج وقت يتخن ويوسع تحت ضغط الشريان، وإبرة في وريد مش ناضج بتعمل hematoma وتبوّظ الـ fistula.

          وليه الـ Doppler لما تشك في stenosis؟ التفسير المقبول (مش في الكتاب): الـ stenosis بيبان الأول في الأرقام قبل ما الـ fistula تتقفل: الـ venous pressure على الماكينة بيعلى، الـ access flow بيقل، النزيف بعد شيل الإبر بيطول، والـ clearance بيقل. لو اتمسك بدري، الـ angioplasty بيفتحه والـ fistula تفضل شغالة. لو اتساب، الـ thrombosis بتقفلها، والعيان يرجع لـ catheter لحد ما تتعمل وصلة جديدة تنضج شهور. يعني المتابعة بتحمي «شريان حياة» العيان.
