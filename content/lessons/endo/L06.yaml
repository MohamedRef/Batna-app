  - id: endo.L06.lesson3
    title: "الحمل والـ thyroxine: لما المريضة نفسها تلخبط التحليل"
    hook: "الـ hCG بيتنكّر في هيئة TSH، والقهوة الصبح بتسرق نص جرعة الـ thyroxine."
    minutes: 9
    pages: [105, 106]
    topics: [pregnancy, levothyroxine]
    goals:
      - "تفسر تغيرات الـ TFTs في الحمل"
      - "تفرّق gestational من Graves'"
      - "تحل لغز المريض اللي على thyroxine والـ TSH مش راضي ينزل"
    status: unverified
    steps:
      - kind: explain
        page: 105
        quote: "3. Pregnancy:\n  Pregnancy has a significant impact on hpt physiology.\n  Tbg ↑as a consequence of oestrogen-induced increased hepatic synthesis, together with reduced degradation.\n  Total t4 and t3 ↑ to 150% of non-pregnant values during the first half of pregnancy and maintained until parturition.\n  Transient ↑ in ft4 in first trimester is due to the stimulatory effects of ↑ hcg acting on the tsh receptor.\n  In hyperemesis gravidarum women become overtly thyrotoxic with a fully suppressed tsh.\n  In this setting, it is important to distinguish gestational hyperthyroidism from other causes of thyrotoxicosis (e.g. Graves' disease) & (trab) measurement is helpful."
        title: "الحمل بيعمل إيه؟"
        text: |
          - ==thyroxine-binding globulin (TBG)== بيعلى: الـ oestrogen بيزوّد تصنيعه في الكبد وبيقلل تكسيره.
          - **Total T4 و T3** بيوصلوا **150%** في النص الأول من الحمل ويفضلوا كده للولادة.
          - **free thyroxine (FT4)** بيعلى مؤقتًا في الـ first trimester عشان الـ **human chorionic gonadotropin (hCG)** بيشتغل على الـ thyroid-stimulating hormone (TSH) receptor.
          - كمان: زيادة الـ plasma volume، وزيادة الـ **type 3 deiodinase (DIO3)** من الـ placenta، و زيادة الـ urinary iodine clearance، ودي بتعمل goitre في المناطق الفقيرة في اليود.

          يعني الـ total العالي في الحمل سببه البروتين مش الغدة، علشان كده ما تشخّصش thyrotoxicosis من الـ total T4. وفي الـ **hyperemesis gravidarum** الست بتبقى thyrotoxic فعلًا بـ TSH suppressed خالص، وهنا لازم تفرّق الـ gestational من Graves' بالـ TRAb.
