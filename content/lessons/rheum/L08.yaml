  - id: rheum.L08.lesson2
    title: "امتى تشك؟ وإزاي تتأكد؟"
    hook: "شاب عنده جلطة، أو ست كبيرة فقدت النظر فجأة: الاتنين ممكن يبقوا vasculitis."
    minutes: 8
    pages: [126, 130]
    topics: [clues, organs, workup]
    goals:
      - "تحفظ الـ red flags اللي تخليك تفكر في vasculitis"
      - "تفرّق بين cutaneous و systemic"
      - "تعرف الـ workup والـ mimics"
    status: unverified
    steps:
      - kind: explain
        page: 126
        title: "الـ red flags"
        quote: "Occlusive arterial disease or hypertension in youngadults Unexplained fever, weight loss. Unexplained proteinuria with or without casts."
        text: |
          فكّر في vasculitis لما تلاقي حاجة ==مش مفسّرة== أو في سن مش سنها:
          - **Occlusive arterial disease** أو **hypertension** في شاب
          - **Unexplained fever** و weight loss
          - **Proteinuria** مع أو من غير casts
          - **Splinter haemorrhages**، palpable purpura، erythema، nodules، urticaria
      - kind: explain
        page: 127
        title: "وكمان..."
        quote: "Persistent headache with sudden visual impairment (monocular blindness) in elderly."
        text: |
          - **Retinal vascular disease** فجأة من غير ضغط أو سكر
          - كبير في السن عنده **headache** و ==monocular blindness== فجأة، و **jaw claudication**
          - **Wrist drop** أو **foot drop** فجأة (mononeuritis)
          - **Stroke** أو **MI** في شاب
          - **Pulmonary nodules** أو cavities مش مفسّرة
      - kind: check
        page: 127
        quote: "Systemic vasculitis usually presents in individuals of 2-5th decade, the exceptions being HSP and Kawasaki disease which are common in children"
        question: "Systemic vasculitis usually presents in the 2nd–5th decade. Which is NOT one of the book's exceptions?"
        options:
          - "PAN"
          - "HSP"
          - "Kawasaki disease"
          - "Takayasu arteritis"
        answer: 0
        why:
          - "صح: PAN مش من الاستثناءات."
          - "الـ HSP شائع في الأطفال: استثناء."
          - "الـ Kawasaki في الأطفال: استثناء."
          - "الـ Takayasu أكتر في الـ young females: استثناء."
      - kind: table
        page: 127
        quote: "Absence of systemic involvement. Negative serology. Small vessel leucocytoclastic vasculitis. Better prognosis."
        title: "Cutaneous ضد systemic"
        columns: [Feature, Cutaneous, Systemic]
        rows:
          - ["Organs", "Skin only, legs", "Many systems"]
          - ["Serology", "Negative", "Often positive"]
          - ["Vessel", "Small, leucocytoclastic", "Any size"]
          - ["Prognosis", "Better", "Poor in general"]
        hide: [[1, 1], [2, 1], [3, 1], [3, 2]]
      - kind: figure
        page: 128
        quote: "Kidney -Affected in most of the vasculitis except PAN and TA: - Glomerulonephritis (absent in classical PAN)."
        title: "خريطة الأعضاء"
        alt: "A body outline as boxes from head to legs. ENT: epistaxis, otitis in WG. Eye: scleritis, uveitis, proptosis. Lung: alveolar haemorrhage, nodules, asthma in CSS. Kidney: GN except PAN and Takayasu. Gut: ischaemic necrosis, infarction. Nerves: mononeuritis multiplex. Skin: purpura, livedo, Raynaud."
        caption: "الكلية متصابة في أغلبهم ==except PAN and TA==. الرئة: **WG، CSS، MPA**. والـ asthma علامة **CSS**."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <circle cx="165" cy="40" r="28" class="fg-box"/>
            <text x="165" y="45" text-anchor="middle" class="t-sm t-b">Head</text>
            <text x="20" y="25" class="t-sm t-b">ENT</text>
            <text x="20" y="41" class="t-sm t-mut">epistaxis, otitis (WG)</text>
            <text x="230" y="25" class="t-sm t-b">Eye</text>
            <text x="230" y="41" class="t-sm t-mut">scleritis, uveitis</text>
            <rect x="110" y="80" width="110" height="140" rx="16" class="fg-box"/>
            <text x="20" y="100" class="t-sm t-b">Lung</text>
            <text x="20" y="116" class="t-sm t-mut">haemorrhage, nodules</text>
            <text x="20" y="132" class="t-sm t-mut">asthma (CSS)</text>
            <text x="235" y="100" class="t-sm t-b">Heart</text>
            <text x="235" y="116" class="t-sm t-mut">MI, CHF</text>
            <text x="235" y="160" class="t-sm t-b t-bad">Kidney</text>
            <text x="235" y="176" class="t-sm t-mut">GN, not PAN/TA</text>
            <text x="20" y="180" class="t-sm t-b">Gut</text>
            <text x="20" y="196" class="t-sm t-mut">ischaemia, infarct</text>
            <rect x="125" y="230" width="35" height="85" rx="10" class="fg-box"/>
            <rect x="170" y="230" width="35" height="85" rx="10" class="fg-box"/>
            <text x="20" y="260" class="t-sm t-b">Nerves</text>
            <text x="20" y="276" class="t-sm t-mut">mononeuritis multiplex</text>
            <text x="225" y="260" class="t-sm t-b">Skin</text>
            <text x="225" y="276" class="t-sm t-mut">purpura, livedo</text>
            <text x="225" y="292" class="t-sm t-mut">Raynaud</text>
          </svg>
      - kind: aside
        tone: exam
        page: 128
        quote: "Glomerulonephritis (absent in classical PAN). Renal failure. Hypertension usually (not seen in WG). Renal infarction."
        text: |
          فخ مشهور: **classical PAN** = ==no glomerulonephritis== (بيعمل renal infarction و hypertension).
          والعكس: **WG** بيعمل GN بس الكتاب بيقول **hypertension not seen in WG**.
      - kind: match
        page: 129
        quote: "Jaw claudication as in GCA. Myalgia. Arm claudication as in TA."
        prompt: "وصّل العلامة بالمرض اللي الكتاب ربطها بيه:"
        pairs:
          - ["Jaw claudication", "GCA"]
          - ["Arm claudication", "Takayasu"]
          - ["Asthma", "Churg–Strauss"]
          - ["Epistaxis, otitis media", "Wegener (GPA)"]
        why: "الـ GCA بيمسك الـ temporal و maxillary arteries فالمضغ يوجع. الـ Takayasu بيضيّق الـ subclavian فالدراع يتعب. الـ CSS = asthma + eosinophils. والـ WG بيبدأ من الأنف والودن."
      - kind: explain
        page: 130
        title: "الـ workup"
        quote: "Laboratory investigations. Haemogram. Urinalysis. Serum proteins. Antineutrophil cytoplasmic autoantibodies (ANCA):"
        text: |
          - **Haemogram**، **urinalysis** (ما تنساش casts)، serum proteins
          - ==ANCA==: **c-ANCA**، **p-ANCA**، و atypical (A أو x-ANCA)
          - Renal و hepatic function، **echo**، **angiography**
          - والأهم: ==organ biopsy==
      - kind: aside
        tone: trap
        page: 130
        quote: "Mimicks of vasculitis Bacterial endocarditis. Antiphospholipid antibody syndrome. Viral infections like HIV, CMV, HBV, HCV etc. Cholesterol emboli syndrome."
        text: |
          قبل ما تبدأ steroids، استبعد اللي بيقلّد:
          **Endocarditis**، **APS**، viruses (HIV، CMV، HBV، HCV)، **cholesterol emboli**، ergot، hypertensive arteriopathy، thoracic outlet، sepsis/DIC، sarcoid، **TTP**، lymphoma و hairy cell leukaemia.

          أخطرهم إنك تدي steroids لـ **endocarditis**: العيان هيتعب جدًا.
      - kind: check
        page: 130
        quote: "Cholesterol emboli syndrome. Vasoconstrictor drugs (ergot poisoning). Hypertensive arteriopathy. Thoracic outlet syndrome."
        question: "Painful blue toes, livedo and rising creatinine 2 weeks after coronary angiography. Which mimic?"
        options:
          - "Cholesterol emboli syndrome"
          - "Thoracic outlet syndrome"
          - "Ergot poisoning"
          - "Hairy cell leukaemia"
        answer: 0
        why:
          - "صح: الـ catheter كسر plaques فطلعت cholesterol emboli."
          - "الـ thoracic outlet بيأثر على الدراع من compression."
          - "الـ ergot بيعمل vasospasm بعد دوا، مش بعد قسطرة."
          - "مفيش هنا حاجة تشاور على leukaemia."
      - kind: try
        items: [rheum.L08.024, rheum.L08.029, rheum.L08.033, rheum.L08.037, rheum.L08.044]
    recap:
      - "شك في vasculitis مع: انسداد أو ضغط في شاب، fever، proteinuria، purpura، mononeuritis، nodules، عمى مفاجئ في كبير."
      - "Cutaneous: جلد بس، serology سلبي، small vessel، prognosis أحسن."
      - "الكلية متصابة في أغلبهم إلا PAN و Takayasu. الرئة: WG، CSS، MPA."
      - "Workup: CBC، urine، ANCA، organ tests، echo، angio، biopsy. واستبعد الـ mimics."
    practice: [rheum.L08.024, rheum.L08.025, rheum.L08.026, rheum.L08.027, rheum.L08.028, rheum.L08.029, rheum.L08.030, rheum.L08.031, rheum.L08.032, rheum.L08.033, rheum.L08.034, rheum.L08.035, rheum.L08.036, rheum.L08.037, rheum.L08.038, rheum.L08.039, rheum.L08.040, rheum.L08.041, rheum.L08.042, rheum.L08.043, rheum.L08.044, rheum.L08.045, rheum.L08.192, rheum.L08.194]
