      - kind: explain
        page: 147
        title: "علاج الـ pseudogout"
        quote: "Chondrocalcinosis which produces no symptoms does not need any treatment."
        text: |
          - الاتنين: **steroid injections**، anti-inflammatories، **colchicine**. والـ gout يزيد عليهم urate-lowering و low-purine diet.
          - ==Chondrocalcinosis== من غير أعراض: **ما يتعالجش**.
