        text: |
          عمود الـ F4 بسهولة: الـ C والـ NAFLD والـ human immunodeficiency virus (HIV)/HCV = 14. وبعدين الكبار: cholestatic 17، hepatitis B virus (HBV) 18، alcohol 19.

          وليه الـ alcohol والـ cholestasis أعلى؟ لأن الالتهاب والـ cholestasis نفسهم بيرفعوا الـ stiffness من غير تليف (هتشوفها في الجدول اللي جاي)، فلازم رقم أعلى علشان تقول cirrhosis. والـ F0–F1 ثابتة في الكل: 2–7.
      - kind: explain
        page: 32
        quote: "Table 1: Limitations of transient elastography with controlled attenuation parameter\n| Limitations | Explanation |\n|---|---|\n| Ascites | Elastic waves do not travel through liquids |\n| Obesity | BMI > 30 kg/m² is associated with TE failure. With the development of the XL probe, the failure rate in obese patients has decreased |\n| Acute hepatitis | Tissue changes in acute hepatitis may increase LSM |\n| Chronic hepatitis with transaminases flare | At ALT levels greater than 5 × the upper normal limit, there is a risk of overestimating the fibrosis stage. LSM interpretations in patients with high ALT levels must be made with caution |\n| Extrahepatic cholestasis | Increases LSM independently of fibrosis stage |\n| Congestive heart failure | May lead to increased LSM because of an increased blood volume in the liver |\n| Narrow intercostal spaces | Associated with a lower success rate or failed acquisition of LSM. Reduced failure rate with the development of the S probe |\nBMI: Body mass index; LSM: Liver stiffness measurement; ALT: Alanine-aminotransferase."
        title: "الـ FibroScan بيكدب إمتى؟"
        text: |
          الـ transient elastography (TE) بيبعت موجة ويقيس سرعتها. فيه نوعين من المشاكل بيبوّظوا النتيجة، ومهم تفرّق بينهم لأن الامتحان بيسأل عليهم كده.

          **1. الموجة مش عارفة توصل، فالقياس failed أو unreliable**
          - ==Ascites==: الـ elastic waves ما بتمشيش في السوائل، زي ما تزق جيلي في كيس مية.
          - **Obesity**: لو الـ body mass index (BMI) أكتر من 30 بتعمل TE failure، لأن الدهن بيبعّد الـ probe عن الكبد. الـ **extra-large (XL) probe** قلّل الفشل.
          - **Narrow intercostal spaces**: success أقل، والـ **S probe** قلّل الفشل.

          **2. الكبد ناشف لسبب تاني غير التليف، فالرقم false high**
          - **Acute hepatitis**: التغيرات في النسيج (تورم والتهاب) بترفع الـ LSM.
          - **Chronic hepatitis flare**: لو alanine aminotransferase (ALT) أكتر من 5× upper limit of normal (ULN) ممكن تعمل overestimation للـ stage.
          - **Extrahepatic cholestasis**: الصفرا المحبوسة بترفع الـ LSM independently of fibrosis.
          - ==Congestive heart failure==: increased blood volume in the liver بيرفع الـ LSM.

          القاعدة اللي تجمعهم: أي حاجة بتملا الكبد (التهاب، صفرا، دم) بتشدّه زي البالونة، فالموجة تجري أسرع من غير تليف.
      - kind: figure
        page: 32
        quote: "Table 1: Limitations of transient elastography with controlled attenuation parameter\n| Limitations | Explanation |\n|---|---|\n| Ascites | Elastic waves do not travel through liquids |\n| Obesity | BMI > 30 kg/m² is associated with TE failure. With the development of the XL probe, the failure rate in obese patients has decreased |\n| Acute hepatitis | Tissue changes in acute hepatitis may increase LSM |\n| Chronic hepatitis with transaminases flare | At ALT levels greater than 5 × the upper normal limit, there is a risk of overestimating the fibrosis stage. LSM interpretations in patients with high ALT levels must be made with caution |\n| Extrahepatic cholestasis | Increases LSM independently of fibrosis stage |\n| Congestive heart failure | May lead to increased LSM because of an increased blood volume in the liver |\n| Narrow intercostal spaces | Associated with a lower success rate or failed acquisition of LSM. Reduced failure rate with the development of the S probe |\nBMI: Body mass index; LSM: Liver stiffness measurement; ALT: Alanine-aminotransferase."
        title: "جدول حدود الـ FibroScan في الكتاب"
        image: { file: hb/L02-te-limitations.webp, book: true }
        alt: "Book table with an orange title bar: 'Table 1 Limitations of transient elastography with controlled attenuation parameter'. Two columns, Limitations and Explanation, with rows for ascites, obesity, acute hepatitis, chronic hepatitis with transaminases flare, extrahepatic cholestasis, congestive heart failure and narrow intercostal spaces. A footnote defines BMI, LSM and ALT."
        caption: |
          ده الجدول زي ما هو مطبوع في الكتاب (متصوّر كصورة). عمودين: **Limitations** على الشمال و **Explanation** على اليمين، وسبع صفوف من فوق لتحت:

          - **Ascites** و **Obesity**: أول صفين، والتفسير عن إن الموجة ==ما بتوصلش== (السوائل، والـ BMI > 30 مع الـ XL probe).
          - **Acute hepatitis**، **Chronic hepatitis with transaminases flare**، **Extrahepatic cholestasis**، **Congestive heart failure**: الصفوف اللي في النص، وكلهم بيقولوا نفس الكلمة في التفسير: ==increase LSM== (أو overestimating).
          - **Narrow intercostal spaces**: آخر صف، failed acquisition والـ **S probe**.
          - **تحت الجدول**: الـ footnote بيفك الـ BMI والـ LSM والـ ALT.

          لو بصّيت على عمود الـ Explanation بس هتلاقي التقسيمة اللي فوق جاهزة: صفوف بتقول failure وصفوف بتقول increase. وده اللي التمرين الجاي بيختبره.
