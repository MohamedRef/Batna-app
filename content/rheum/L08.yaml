    pass: 3
    hook: "الكلية في الـ vasculitis «تلتهب، تفشل، تضغط، أو تموت حتة منها»: glomerulonephritis (مش في PAN الكلاسيكي)، renal failure، hypertension (عادة؛ مش في WG)، وrenal infarction."
    src: { page: 128, quote: "Table 2: Manifestations of systemic vasculitis in different organs/systems\nKidney - Affected in most of the vasculitis except PAN and TA:\n  Glomerulonephritis (absent in classical PAN).\n  Renal failure.\n  Hypertension usually (not seen in WG).\n  Renal infarction.\nLungs – Involved in WG, CSS, MPA:\n  Alveolar haemorrhage, characterized by haemoptysis, anaemia and bilateral evanescent lung opacities.\n  Nodules with/without cavities.\n  Infarction.\n  Asthma (CSS).\nCardiovascular:\n  Myocardial infarction.\n  Ischaemic cardiomyopathy, CHF.\n  Pulselessness/diminished arterial pulsation.\nMusculoskeletal:\n  Arthralgia system.\n  Arthritis.\n  Myalgia.\nAbdomen:\n  Ischaemic mucosal necrosis with haemetmesis and melaena.\n  Bowel infarction." }
    status: unverified
  - id: rheum.L08.034
    kind: card
    topic: organs
