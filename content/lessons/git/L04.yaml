          التفسير المقبول (مش في الكتاب): الست قبل سن اليأس عندها سبب طبيعي لنقص الحديد (الدورة والحمل). أما الراجل والست بعد اليأس فمفيش عندهم مصدر نزيف طبيعي، فنقص الحديد عندهم معناه إن فيه **نزيف خفي** لحد ما يثبت العكس، والقولون اليمين أشهر مكان. وليه «القولون كله»؟ لأن الـ sigmoidoscopy بتشوف الشمال بس، والورم اللي بينزف بهدوء غالبًا في اليمين.
      - kind: case
        page: 176
        quote: "These lesions often ulcerate and cause chronic blood loss; patients commonly present with complaints of fatigue, palpitations, or even angina pectoris."
