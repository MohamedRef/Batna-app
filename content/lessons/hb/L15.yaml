  # ------------------------------------------------------------------
  - id: hb.L15.lesson7
    title: "الأورام والأكياس: painless jaundice وعيلة أكياس"
    hook: "ليه سرطان الرأس بيصفّر من غير وجع، وإزاي تحفظ الأكياس كأنها عيلة: جدة، وأم، وبنت، وجد."
    minutes: 10
    pages: [298, 310]
    topics: [tumors, cysts]
    goals:
      - "تعرف ductal adenocarcinoma: مين، أعراض، وعلاج حسب المكان والـ stage"
      - "تفرّق insulinoma عن gastrinoma"
      - "تميّز الأكياس الخمسة وتمشي في خطة الـ cyst (MD)"
    status: unverified
    steps:
      - kind: explain
        page: 298
        title: "الأورام: الخريطة"
        text: |
          زي ما البنكرياس مصنعين (exocrine و endocrine)، أورامه نوعين برضه.

          **Non-endocrine:**
          - **Benign** (adenoma، lipoma، fibroma): نادرة جدًا وملهاش أهمية إلا لو بتضغط.
          - **Malignant**: الأشهر **ductal adenocarcinoma** و cyst-adenocarcinoma.
          - **Peri-ampullary carcinoma**: أي ورم في حدود 2 cm من الـ papilla: ampullary، lower CBD، duodenal. بيتجمعوا مع بعض لأن الأعراض والعملية واحدة (صفار + Whipple).

          **Ductal adenocarcinoma**: النجم.
          - منين: الـ exocrine part.
          - قد إيه: 90% من أورام البنكرياس.
          - مين: peak في العقد 6 و 7.

          **Risk factors:**
          - **Lifestyle**: high protein & high fat diet، **smoking**.
          - شغل: industrial carcinogens.
          - **Late onset diabetes**: سكر جديد في راجل كبير ممكن يكون أول علامة، لأن الورم بيبوّظ الـ islets.
      - kind: explain
        page: 299
        title: "الأعراض والجراحة"
        text: |
          الأعراض، وكل واحد بيقولك الورم وصل لفين:
          - **Painless jaundice**: الـ classical presentation، ورم الرأس سد الـ CBD.
          - **Weight loss و pain**: الورم كبر أو وصل للأعصاب.
          - **Steatorrhea و diabetes**: الغدة نفسها اتبوّظت.
          - **Acute pancreatitis**: الورم سد الـ pancreatic duct (فاكر سن الـ 40؟).
          - **Malignant ascites، gastric outlet obstruction**: مرض متقدم.

          مكانه صعب (retroperitoneal)، فكل أدوات التشخيص بتتستخدم: US، CT، MRI، EUS، PET CT، وحتى **laparoscopy** في حالات مختارة.

          الجراحة في الكتاب، على حسب مكان الورم:
          - **Head**: **Whipple**، pylorus-preserving pancreatico-duodenectomy، أو total pancreatectomy.
          - **Tail**: **distal pancreatectomy**.
          - **Body**: distal + removal of the body.

          خلي بالك: الكتاب كاتب العمليات دي تحت عنوان "Surgical (palliative)"، والـ distal pancreatectomy تحت "Surgical Bypass". في الامتحان انقل عناوين الكتاب زي ما هي.
      - kind: reveal
        page: 299
        prompt: "ليه سرطان الرأس بيجي بـ **painless jaundice**، وسرطان الـ body/tail بيجي متأخر؟"
        answer: |
          الكتاب بيدّيك الأعراض، والمنطق التشريحي:

          الـ **head** قاعدة في حضن الـ duodenum وحواليها **الـ distal CBD**. ورم صغير بيضغط على الـ CBD بالتدريج، فالصفار يظهر بدري وقبل الوجع.

          الـ **body والـ tail** في مكان واسع، فالورم بيكبر في صمت لحد ما يوصل للـ celiac plexus (وجع) أو ينتشر (weight loss).
      - kind: table
        page: 300
        title: "Resectability (Dutch Pancreatic Cancer Group)"
        columns: ["Feature", "Resectable", "Borderline", "Irresectable"]
        rows:
          - ["Arteries (CA, SMA, CHA)", "No contact", "≤ 90°", "> 90°"]
          - ["Veins (SMV, PV)", "≤ 90° contact", "90–270°, no occlusion", "> 270° or occlusion"]
          - ["Metastases", "No", "No", "Yes"]
        hide: [[0, 2], [0, 3], [1, 2], [1, 3]]
      - kind: check
        page: 300
        question: "CT shows a pancreatic head cancer with **120° contact with the SMA**, no venous involvement and no metastases. Category?"
        options:
          - "Irresectable"
          - "Borderline resectable"
          - "Resectable"
        answer: 0
        why:
          - "صح: الـ **arteries** أي contact > 90° = irresectable."
          - "الـ borderline للشرايين ≤ 90° بس. الـ 90–270° دي للـ **veins**."
          - "الـ resectable مفيهوش أي contact مع الشرايين."
      - kind: explain
        page: 300
        title: "بعد التصنيف، والـ palliation"
        text: |
          التصنيف بيحدد الترتيب بين الجراحة والكيماوي:
          - **Resectable**: surgery الأول، ثم **adjuvant chemotherapy** (adjuvant = بعد).
          - **Borderline**: **neoadjuvant** chemo أو chemoradio الأول (neoadjuvant = قبل)، علشان الورم يصغر ويبعد عن الأوعية، وبعدين surgery لو ينفع.
          - **Locally advanced / metastatic**: **palliative chemotherapy**.

          **Palliative non-surgical**: لما مش هنقدر نشيله، بنعالج اللي بيتعبه.
          - الوجع: percutaneous **coeliac ganglion blockade**.
          - الصفار: **stent** في الـ bile duct، أو **PTD**.
          - المستقبل: chemoradiotherapy ممكن تبقى بديل.
      - kind: explain
        page: 301
        title: "الأورام الـ endocrine"
        text: |
          الأورام دي من الـ islets، وكل واحد بيفرز هرمون زيادة. فالأعراض = الهرمون الزيادة.

          **Insulinoma**: insulin زيادة = سكر واطي.
          - **The commonest**، من الـ **B-cells**، في أي حتة في البنكرياس.
          - طبيعته: أغلبها benign adenomas، و 15% low-grade carcinomas.
          - الصورة: **Whipple's triad**: hypoglycemia بأعراض، glucose واطي وقت النوبة، وبيتحسن بالـ glucose.

          **Gastrinoma**: gastrin زيادة = حمض زيادة.
          - طبيعته: 60% malignant، مرتبط بـ **MEN 1**.
          - الصورة: **ZE syndrome**: gastric acid hypersecretion، severe peptic ulceration، و non-beta cell tumor. ومعاه diarrhea (الحمض بيبوّظ إنزيمات الأمعاء) و skin lesions.

          وغيرهم: glucagonoma، somatostatinoma، VIPoma.
      - kind: aside
        tone: trap
        page: 301
        text: |
          الدكتور **Whipple** كان شغّال في كل حتة:
          - **Whipple's triad** = insulinoma.
          - **Whipple operation** = pancreatico-duodenectomy لسرطان الرأس.

          لو السؤال فيه **hypoglycemia** يبقى الـ triad. لو فيه **painless jaundice** يبقى العملية. 😄
      - kind: explain
        page: 301
        title: "الأكياس (الكتاب: للـ MD بس)"
        text: |
          الجزء ده الكتاب بيقول إنه **for MD candidates only**. لو امتحانك MSc عدّي عليه بسرعة، بس سؤال **"treatment algorithms for pancreatic cyst"** موجود في أسئلة المحاضرة.

          أهميتها إن بعضها ليه **malignant potential**، فالسؤال دايمًا: نشيله ولا نراقبه؟

          **Classification:**
          - مش أورام: simple retention cysts، **pseudocysts**.
          - **Cystic neoplasms**: **SCN**، **IPMN**، **MCN**، **SPEN**، و cystic degeneration of solid tumors.

          **Imaging:**
          - **Multiphasic CT**: بيفوّت الصغيرين.
          - **MRI**: أوضح، و ACG endorsed، فهو اللي بنتابع بيه.
          - **EUS**: أحسن detection، ومعاه نسحب fluid أو tissue، فهو اللي بيجاوب "ده إيه بالظبط".
      - kind: aside
        tone: analogy
        page: 303
        text: |
          احفظ الأكياس كأنها عيلة:
          - **SCN = الجدة الطيبة:** ست في العقد الخامس، شكلها **honeycomb** بـ **central scar**، وطيبة جدًا (malignant 0.1%).
          - **MCN = الأم:** ستات بس، middle age، قاعدة في الـ **body/tail**، ومبتكلمش الـ duct (no communication)، ومليانة **mucin**.
          - **SPEN = البنت:** بنت في العقد 2–3، incidental، ومهما كانت بنشيلها كلها (all resected).
          - **IPMN = الجد:** 60–70، رجالة وستات زي بعض، **ساكن جوه الـ duct** في الـ head، وأخطرهم (MD-IPMN 40–70%).
          - **Pseudocyst = الضيف:** مش من العيلة أصلًا: **non-neoplastic** بعد pancreatitis.
      - kind: table
        page: 303
        title: "الأكياس الخمسة"
        columns: ["Cyst", "Who and clue", "Malignancy"]
        rows:
          - ["Pseudocyst", "After acute pancreatitis; granulation-tissue wall, no endothelium (book); may communicate with PD", "None"]
          - ["SCN", "Women, 5th decade (book p. 303); microcystic honeycomb, central scar", "0.1%"]
          - ["MCN", "Almost only women, middle age; body or tail; no PD communication; thick mucin", "Yes, less than IPMN (p304; the p306 table says High for MCN, Moderate to high for IPMN); > 3 cm + high CA 19.9 worst"]
          - ["IPMN", "Equal sex; head, 40% multifocal; fish-mouth papilla (MD)", "BD 20%, MD 40–70%"]
          - ["SPEN", "Young women, 2nd–3rd decade; small solid, large mixed", "10–15%, survival > 98%"]
        hide: [[1, 1], [2, 2], [3, 2], [4, 1]]
      - kind: match
        page: 306
        prompt: "Cyst fluid: وصّل كل نتيجة بالكيس بتاعها:"
        pairs:
          - ["High amylase, low CEA", "Pseudocyst"]
          - ["Low CEA, low amylase", "SCN"]
          - ["High CEA, KRAS +, GNAS −", "MCN"]
          - ["High CEA, KRAS + and GNAS +", "IPMN"]
        why: "الـ **CEA العالي = mucinous** (MCN و IPMN). الـ **amylase العالي** = فيه اتصال بالـ duct (pseudocyst و IPMN). والـ **GNAS** بيفرّق الـ IPMN عن الـ MCN."
      - kind: explain
        page: 305
        title: "مين نشيله ومين نراقبه"
        text: |
          القاعدة العامة: كل ما الخطر يزيد، نميل للجراحة. وكل ما الكيس يبقى طيب وساكت، نراقب.

          - **SPEN**: كله يتشال (malignant potential). التشخيص بـ EUS-guided biopsy من أكتر من مكان.
          - **Cystic NETs** (13–17% من الـ pNETs، MEN-1، 20% malignant): أكبر من 20 mm (functional أو لأ) = surgery. Non-functional asymptomatic، 20 mm أو أقل = surveillance.
          - **SCN** (الجدة الطيبة): surgery بس لو **symptomatic**. المتابعة حسب الحجم: أقل من 2 cm و 2–4 cm متابعة، أكبر من 4 cm أو أعراض فكّر في جراحة. Re-evaluate لو كبر أكتر من 5 mm/year.
          - **Pseudocyst**: asymptomatic = follow up. Symptomatic/complicated = **EUS-guided cystogastrostomy** (فتحة من الكيس للمعدة، فيصرّف جواها).
