        caption: "النقطة الحمرا على الدالية (1): دي الـ red colour sign، يعني الجدار رفيع وخطر النزيف أعلى."
      - kind: figure
        page: 45
        quote: "The diagnosis of PHG is made endoscopically"
        title: "الـ PHG في المنظار في الكتاب"
        image: { file: hb/L03-phg-endoscopy.webp, book: true }
        marks:
          - { at: [0.30, 0.25], label: "Mosaic (snakeskin) pattern" }
          - { at: [0.14, 0.47], label: "Red spots", kind: arrow }
          - { at: [0.77, 0.68], label: "Endoscope (retroflexed)", kind: arrow }
        alt: "Two book endoscopy photos of the stomach. Left: reddened gastric mucosa with a fine white network pattern and a few red spots. Right: a retroflexed view with the dark endoscope shaft in the middle and the same mosaic network pattern on the surrounding mucosa."
        caption: |
          صورتين منظار للمعدة:

          - **الشمال**: الـ mucosa حمرا وعليها ==شبكة بيضا رفيعة== زي جلد التعبان (1، mosaic / snakeskin)، وعليها نقط حمرا صغيرة (2).
          - **اليمين**: منظار راجع على نفسه (retroflexed)، والأسود (3) هو جسم المنظار نفسه، وحواليه نفس الشبكة.

          ده شكل الـ **portal hypertensive gastropathy (PHG)**، وعلشان كده الكتاب بيقول التشخيص **endoscopic**: الشكل ده هو التشخيص. وهي في الـ fundus والـ body، مش خطوط في الـ antrum (دي GAVE في الحالة اللي جاية).
      - kind: case
        stem: "Two women with HCV cirrhosis and iron-deficiency anaemia have endoscopy. (The lecture shows PHG on p45 but gives no treatment; book questions 14 and 15 ask about it, so the answers below follow standard guidance.)"
