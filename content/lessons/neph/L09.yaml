      - kind: explain
        page: 301
        title: "الـ intradialytic hypotension"
        quote: "Intradialytic hypotension mostly associated with increased UF"
        text: |
          سببها الأساسي ==UF كتير==. نتايجها: severe metabolic acidosis، myocardial ischaemia و stunning، ischaemic stroke، venous thrombosis (retinal vein)، intestinal ischaemia، arteritis الرجلين بتسوء، الجلسة تتقفل بدري (inadequate dialysis)، الـ access يتجلّط، والوفيات تزيد.
      - kind: aside
