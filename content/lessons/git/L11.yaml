            <text x="272" y="132" text-anchor="middle" class="t-sm t-b">Keep aspirin</text>
            <text x="272" y="156" text-anchor="middle" class="t-sm">Stop the 2nd,</text>
            <text x="272" y="172" text-anchor="middle" class="t-sm">restart within</text>
            <text x="272" y="188" text-anchor="middle" class="t-sm">5 days</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 303
        quote: "If for any reason it is interrupted, aspirin should be restarted as soon as possible, preferably within 3–5 days. In patients with acute UGIH who are taking dual antiplatelet therapy (DAPT) for secondary cardiovascular prophylaxis, aspirin should not be interrupted. The second antiplatelet agent should be interrupted, but restarted as soon as possible, preferably within 5 days."
        text: |
          الـ stent زي جسر جديد لسه الخرسانة طرية. شيل الأسبرين = تقفل الجسر وتستنى الجلطة. علشان كده في الـ secondary prophylaxis القرحة بتتعالج بالمنظار والـ PPI، والأسبرين يفضل.
      - kind: explain
        page: 304
        quote: "in patients with acute UGIH taking direct oral anticoagulants (DOACs), the anticoagulant should be withheld and endoscopy not delayed. In patients with severe ongoing bleeding, use of a DOAC reversal agent or intravenous PCC should be considered."
        title: "الـ anticoagulants"
        text: |
          - ==Vitamin K antagonist (VKA)== (warfarin): وقّفه. لو المريض **unstable**: **low-dose vitamin K** + **IV prothrombin complex concentrate (PCC)**، أو **fresh frozen plasma (FFP)** لو مفيش PCC.
          - ==direct oral anticoagulant (DOAC)==: وقّفه، و**ما تأخرش المنظار**. لو النزيف شديد ومستمر: **reversal agent** أو **IV PCC**.
          - الرجوع: بعد ما النزيف يتحكم، **within or soon after 7 days** حسب الـ thromboembolic risk. وافتكر إن الـ DOAC بيشتغل أسرع من الـ VKA.

          ليه PCC قبل FFP؟ التفسير المقبول (مش في الكتاب): الـ PCC فيه الـ clotting factors مركزة في حجم صغير وبيصلّح بسرعة، أما الـ FFP محتاج حجم كبير وبياخد وقت، وده حمل على القلب. والـ vitamin K بطيء بس بيمنع الـ INR يرجع يعلى. وليه الـ DOAC بنوقفه بس؟ لأن مفعوله قصير (ساعات)، فمجرد الوقف بيخلّصه بسرعة. وعلشان نفس السبب لما ترجّعه بيشتغل كامل في ساعات، وده اللي الكتاب قصده بالـ **rapid onset**: اتأكد إن النزيف وقف.
