      - kind: explain
        page: 63
        quote: "| Case Control Studies | Cohort Studies |\n|---|---|\n| Proceeds from effect to cause | Proceeds from cause to effect |\n| Starts with the disease | Starts with people exposed to the risk factor or suspected cause |\n| Tests whether the suspected cause occurs more frequently in those with disease than those without disease | Tests whether disease occurs more frequently in those exposed than in those not exposed |\n| Usually the 1st approach to the testing of hypothesis, but also useful for exploratory studies | Reserved for the testing of precisely formulated hypothesis |\n| Involves fewer study subjects | Involves larger number of subjects |\n| Yields results relatively quickly | Long follow-up, delayed results |\n| Suitable for study of rare diseases | Inappropriate when disease or exposure under investigation is rare |\n| Generally, yields only estimate of relative risk (Odds ratio) | Yields incidence rates, relative risk, attributable risk |\n| Cannot yield information about disease other than that under study | Can give information about more than one disease outcome |\n| Relatively inexpensive | Expensive |"
        title: "الاتنين جنب بعض"
        text: |
          - **الاتجاه**: case-control من ==effect to cause==، الـ cohort من ==cause to effect==.
          - **بيبدأ بـ**: المرض ↔ الناس اللي اتعرضوا.
          - **العدد**: أقل ↔ أكبر.
          - **النتيجة**: سريعة ↔ follow-up طويل.
          - **المقياس**: odds ratio (OR) (تقدير لـ RR) ↔ incidence و RR و AR.
          - **الأمراض**: المرض اللي بندرسه بس ↔ أكتر من مرض.
          - **التكلفة**: رخيص ↔ غالي.
