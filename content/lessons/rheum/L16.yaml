      - kind: explain
        page: 276
        title: "ORAL Surveillance: التحذير"
        quote: "Major adverse cardiovascular events (MACE)."
        text: |
          الـ tofacitinib (5 و 10 mg BID) قصاد الـ TNF inhibitors. طلع فيه أكتر:
          - ==MACE== (MI، stroke، CV death)
          - **Malignancy**
          - ==VTE==
          - All-cause mortality
          - Serious infections

          والـ **baricitinib** (دراسة B023 observational): MACE و VTE أكتر.

          غير كده: URTI، صداع، إسهال، **herpes zoster** زيادة، lipids و liver enzymes، تغيّرات في الـ lymphocytes والـ neutrophils والـ Hb، GI perforation، و **ممنوع live vaccines**.
