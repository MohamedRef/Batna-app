    front: How common is thin membrane disease among renal clinic hematuria, and what is rare in it?
    back: About 25% of microscopic hematuria in a renal clinic; macroscopic hematuria in about 20%. Proteinuria, raised BP and renal impairment are rare, and there are no extrarenal features.
