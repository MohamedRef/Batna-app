      - kind: reveal
        page: 46
        quote: "The number of ß-adrenergic receptors is decreased, leading to increased alpha-adrenergic responses, which may explain the increase in hypertension of hypothyroidism (Hypothyroidism & CVS)."
        prompt: "ليه قلة الـ β receptors بتعلّي الضغط؟"
        answer: "الكتاب: الـ β receptors بتقل، فالـ **α-adrenergic responses** بتزيد، وده ممكن يفسّر الـ hypertension. التفسير المقبول (مش في الكتاب): الـ β2 في الأوعية بيعمل vasodilation، فلما يقل، الـ α (vasoconstriction) بيبقى هو الغالب، والـ peripheral resistance تعلى، وده بيرفع الـ **diastolic** أكتر لأنه الضغط اللي بيفضل في الشرايين بين النبضات."
      - kind: aside
        tone: exam
        page: 46
        quote: "3- Diastolic hypertension may result from extra cellular volume expansion (SIAD) and increased systemic vascular resistance. In 32% of hypertensive hypothyroid patients, replacement therapy with thyroxine leads to a fall in diastolic blood pressure to 90 mm Hg or less (Hypothyroidism & CVS)."
        text: "رقمين بيتسألوا: النبض بيقل **10-20**، والـ thyroxine بيرجّع الـ diastolic blood pressure (DBP) لـ 90 أو أقل في **32%**."
      - kind: explain
        page: 47
        quote: "Worsening of heart failure, or the new onset of heart failure Hypothyroidism can make well- controlled heart failure worsen, and can produce heart failure for the first time in patients with relatively mild underlying heart disease."
        title: "والـ heart failure؟ الدرسين بيتقابلوا هنا"
        text: |
          الـ hypothyroidism ممكن:
          - **يبوّظ heart failure كانت متظبطة**.
          - **يعمل heart failure لأول مرة** عند حد عنده heart disease بسيط.

          ليه؟ اجمع اللي فات: عضلة ضعيفة في الانقباض (systolic) والارتخاء (diastolic)، وضغط diastolic عالي بيزوّد الحمل عليها، و SIAD بيزوّد الحجم. يعني القلب الضعيف بياخد ضربتين: قوة أقل وشغل أكتر.

          (الكتاب كرر الكلام ده كله في ص 71-72، وتاني في أول ص 73.)
      - kind: case
        page: 46
        quote: "3- Diastolic hypertension may result from extra cellular volume expansion (SIAD) and increased systemic vascular resistance. In 32% of hypertensive hypothyroid patients, replacement therapy with thyroxine leads to a fall in diastolic blood pressure to 90 mm Hg or less (Hypothyroidism & CVS)."
        stem: "A 58-year-old woman with fatigue and weight gain: pulse 54, BP 135/98, thyroid-stimulating hormone (TSH) 40 mIU/L."
