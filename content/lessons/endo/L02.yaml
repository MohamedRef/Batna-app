      - kind: explain
        page: 20
        quote: "Surgery is the treatment of choice for pregnant women with CD during the second trimester."
        title: "ليه التاني هو شباك الجراحة؟"
        text: |
          الكتاب بيقول: ==early diagnosis and treatment== بيحسّنوا نتيجة الأم والجنين، والجراحة هي treatment of choice في الـ **second trimester**.

          التفسير المقبول (مش في الكتاب) لاختيار التاني: في **الأول** الجنين بيكوّن أعضاءه وخطر الإجهاض أعلى، فبنهدّي الـ cortisol بالأدوية لحد ما يعدّي. في **التالت** الرحم كبير وخطر الولادة المبكرة أعلى، فبنستنى للولادة. التاني هو الفترة اللي الاتنين فيها أقل.

          وليه الـ ==metyrapone==؟ لأنه بيقفل تصنيع الـ cortisol نفسه في الـ adrenal (بيمنع خطوة الـ 11β-hydroxylase)، وده الدوا اللي الكتاب سماه drug of choice. وليه نخاف من الـ **adrenal insufficiency** بعدها؟ لأن الـ cortisol العالي كان كابت الـ axis الطبيعي، فلما المصدر يتشال الغدد الطبيعية تكون نايمة.
