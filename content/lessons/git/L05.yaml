          </svg>
      - kind: figure
        page: 195
        title: "NICE: أمثلة من الكتاب"
        image: { file: git/L05-nice-examples.webp, book: true }
        alt: "Book narrow-band imaging examples in three columns, two pictures each: Type 1 hyperplastic, a lesion the same colour as the background with no clear vessels; Type 2 adenoma, a browner polyp with branched white structures surrounded by brown vessels; Type 3 deep submucosal invasive cancer, a dark area with disrupted surface and vessels."
        caption: |
          العمدان من الشمال لليمين: **Type 1**، **Type 2**، **Type 3**.

          - Type 1: نفس لون الخلفية، مفيش vessels واضحة = **hyperplastic**.
          - Type 2: ==بني، و surface زي المتاهة== = **adenoma**.
          - Type 3: غامق ومكسّر، الـ pattern ضايع = **deep submucosal invasive cancer**.
      - kind: explain
        page: 196
        quote: "Type 1 — characteristic for hyperplastic polyp"
        title: "Type 1 و Type 2 بالتفصيل"
        text: |
          جدول الكتاب:
          - **Type 1** (==hyperplastic==): اللون **same or lighter** من الخلفية، والـ vessels **none** أو أوعية معزولة معدّية على البوليب، والسطح **dark or white spots of uniform size** أو مفيش pattern خالص.
          - **Type 2** (==adenoma==): اللون **darker (browner)**، والـ vessels: منطقة فاتحة في النص حواليها **brown vessels** أتخن، والسطح **oval، tubular، أو branched white structures** حواليها brown vessels.
          - الـ type 2 بيشمل كل الـ adenomas بـ low أو high grade dysplasia، أو بـ superficial submucosal carcinoma.

          التفسير المقبول (مش في الكتاب): ليه الـ type 2 بيشمل الـ superficial carcinoma؟ لأن الـ NBI بيشوف السطح بس، والسرطان اللي لسه سطحي ما غيّرش شكل الأوعية لدرجة كبيرة. علشان كده أي type 2 يتشال كله، والـ pathology هي اللي تقول هل فيه سرطان سطحي.
      - kind: match
        page: 195
        quote: "NBI International Colorectal Endoscopic (NICE) Classification*\n|  | Type 1 | Type 2 | Type 3 |\n|---|---|---|---|\n| Color | Same or lighter than background | Browner relative to background (verify color arises from vessels) | Brown to dark brown relative to background; sometimes patchy whiter areas |\n| Vessels | None, or isolated lacy vessels coursing across the lesion | Brown vessels surrounding white structures** | Has area(s) of disrupted or missing vessels |\n| Surface Pattern | Dark or white spots of uniform size, or homogeneous absence of pattern | Oval, tubular or branched white structure surrounded by brown vessels** | Amorphous or absent surface pattern |\n| Most likely pathology | Hyperplastic | Adenoma*** | Deep submucosal invasive cancer |\n* Can be applied using colonoscopes with or without optical (zoom) magnification\n** These structures (regular or irregular) may represent the pits and the epithelium of the crypt opening.\n*** Type 2 consists of Vienna classification types 3, 4 and superficial 5 (all adenomas with either low or high grade dysplasia, or with superficial submucosal carcinoma). The presence of high grade dysplasia or superficial submucosal carcinoma may be suggested by an irregular vessel or surface pattern, and is often associated with atypical morphology (e.g., depressed area)."
        prompt: "وصّل الوصف بالـ NICE type:"
        pairs:
          - ["Same or lighter colour, uniform spots", "Type 1 (hyperplastic)"]
          - ["Brown vessels around white structures", "Type 2 (adenoma)"]
          - ["Missing vessels, amorphous surface", "Type 3 (deep submucosal cancer)"]
        why: "الـ type 2 بيشمل Vienna 3، 4 و superficial 5، يعني adenoma بـ low أو high grade dysplasia أو superficial submucosal carcinoma. لو الـ vessels أو الـ surface irregular أو في depressed area، فكّر في high-grade أو superficial cancer."
      - kind: reveal
        page: 195
        quote: "Has area(s) of disrupted or missing vessels"
        prompt: "لقيت NICE type 3. ليه ما تحاولش تشيله بالـ snare؟"
        answer: |
          جدول الكتاب: الـ **type 3** فيه ==area(s) of disrupted or missing vessels== وسطح **amorphous** أو مفيش pattern، وأقرب pathology له **deep submucosal invasive cancer**.

          التفسير المقبول (مش في الكتاب): الورم اللي غزا عميق في الـ submucosa بيدمّر الأوعية والغدد اللي فوقه، فبيبان سطح «مكسّر» مالوش شكل. والسرطان العميق ده وصل لمكان فيه lymphatics، يعني ممكن يكون في الـ nodes، والـ snare مش هيشيل الـ nodes ولا هيوصل لحافة آمنة. علشان كده الـ ESGE (الجزء الجاي) بيقول: tattoo وجراحة.
      - kind: case
        page: 196
        quote: "Most likely pathology: adenoma"
        stem: "During colonoscopy, NBI shows a 7 mm sigmoid polyp."
