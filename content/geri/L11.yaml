  # ---------- p189-191: aging ----------
  - id: geri.L11.004
    kind: card
    topic: aging
    front: Where do the age-related changes of the respiratory system mainly occur?
    back: In the alveoli rather than the large airways.
    src: { page: 190, quote: "Changes associated with age occur in the alveoli rather than the large airways" }
    status: unverified
  - id: geri.L11.005
    kind: card
    topic: aging
    front: What is "senile emphysema"?
    back: Age-related loss of alveolar elastic recoil and enlargement, with alveolar dilatation but no destruction of alveolar walls, from degeneration of elastic fibres around the alveolar duct.
    src: { page: 190, quote: "―Senile Emphysema‖ results in alveolar dilatation without any destructive changes to the alveolar walls but due to degeneration of elastic fibers around the alveolar duct." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.006
    kind: card
    topic: aging
    front: How do the chest wall and respiratory muscles change with age?
    back: The chest wall stiffens and muscle strength declines; inspiration depends mostly on the diaphragm.
    src: { page: 190, quote: "Chest wall stiffer and age-related decline in muscle strength. Inspiration depends mostly on the diaphragm." }
    status: unverified
  - id: geri.L11.007
    kind: cloze
    topic: aging
    text: "Healthy older persons have about {{c1::25%}} lower diaphragmatic strength, and vital capacity is {{c2::reduced}} when the diaphragm is weak."
    src: { page: 190, quote: "Healthy older persons have approximately 25% lower diaphragmatic strength." }
    status: unverified
    tags: [numbers]
  - id: geri.L11.008
    kind: card
    topic: aging
    front: Why does TLC stay almost unchanged with age?
    back: Lower lung elastic recoil makes expansion easier (raises TLC), while the stiffer chest wall lowers it; the two cancel out.
    src: { page: 190, quote: "Thus, the two together result in an almost unchanged TLC with age." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.009
    kind: card
    topic: aging
    front: Why does RV rise with age, and what is hyperinflation?
    back: Lower recoil lets alveoli collapse and trap air, raising RV. An abnormally high RV/TLC is hyperinflation, often seen on chest X-ray.
    src: { page: 190, quote: "Abnormally high RV/TLC is called hyperinflation, which can often be seen on a chest x-ray" }
    status: unverified
  - id: geri.L11.010
    kind: enumerate
    topic: aging
    prompt: In which conditions does hyperinflation occur?
    points: [Asthma, COPD, Advanced age]
    pass: 3
    src: { page: 190, quote: "Hyperinflation occurs in asthma ,COPD and advanced age." }
    status: unverified
  - id: geri.L11.011
    kind: cloze
    topic: aging
    text: "Adults lose about {{c1::one-third of a litre}} of FEV1 per decade; FEV1 falls {{c2::more}} than FVC, so FEV1/FVC also {{c3::declines}} with age."
    src: { page: 191, quote: "Adults normally experience declinein FEV1 with age (about one-third liter per decade)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L11.012
    kind: card
    topic: aging
    front: Why are age-related airflow limits not evident in healthy older adults?
    back: The lungs have a large physiologic reserve; limitation shows only with a pathologic process.
    src: { page: 191, quote: "The lungs have a large physiologic reserve and therefore these airflow limitations are not evident in older adults" }
    status: unverified
  - id: geri.L11.013
    kind: card
    topic: aging
    front: Why may FEV1/FVC overestimate obstructive disease in old age?
    back: Values below 0.65 usually indicate obstruction, but the ratio falls normally with age.
    src: { page: 191, quote: "Since FEV1/FVC values below 0.65 are typically indicative of airway obstruction, this parameter may overestimate obstructive disease in old age." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.014
    kind: enumerate
    topic: aging
    prompt: Sum up the respiratory changes of aging.
    points:
      - Senile emphysema in the alveoli
      - Reduced lung recoil
      - TLC does not change
      - VC falls with a matching rise in RV
      - FEV1 declines, more than FVC
      - FEV1/FVC may overestimate obstruction
      - Closing capacity rises
    pass: 5
    src: { page: 191, quote: "Age-related changes within alveoli ―senile emphysema‖. Reduced lung recoil. TLC does not change with age." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.015
    kind: cloze
    topic: aging
    text: "Closing capacity (closing volume + RV) rises linearly from about {{c1::10%}} of TLC in young adults to about {{c2::30%}} of TLC by age {{c3::70}}."
    src: { page: 191, quote: "increases linearly with age from approximately 10% of TLC inyoung adults to approximately 30% of TLC by the age of 70." }
    status: unverified
    tags: [numbers]
  - id: geri.L11.016
    kind: card
    topic: aging
    front: Define closing volume, and why does it increase with age?
    back: The volume at which basal airways close during normal expiration. It rises because reduced elastic recoil lets small airways collapse.
    src: { page: 192, quote: "Increased CV is likely a result of reduced elastic recoil in the lung, which results in the collapse of the small airways." }
    status: unverified
  # ---------- p192-193: obstruction ----------
  - id: geri.L11.017
    kind: card
    topic: obstruction
    front: What establishes airflow obstruction, and what must its threshold account for in the elderly?
    back: A reduced FEV1/FVC; the threshold must account for normal aging, including more variable spirometric performance.
    src: { page: 192, quote: "the threshold that establishes airflow obstruction must account for normal aging, including increased variability in spirometric performance." }
    status: unverified
  - id: geri.L11.018
    kind: card
    topic: obstruction
    front: How does ATS/ERS define the LLN for FEV1/FVC?
    back: The fifth percentile of reference values in healthy never-smokers matched for age, height, sex and ethnicity (NHANES III equations).
    src: { page: 192, quote: "The ATS/ERS currently defines the LLN as the fifth percentile distribution of reference values" }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.019
    kind: card
    topic: obstruction
    front: First flaw of GOLD in older adults?
    back: It uses a fixed FEV1/FVC below 0.70, so it cannot separate age-related airflow limitation from COPD; healthy asymptomatic never-smokers aged 65 or more often fall below 0.70.
    src: { page: 192, quote: "GOLD defines areduced FEV1/FVC by a fixed ratio less than 0.70, thus failing to distinguish between age-related airflow limitationand" }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.020
    kind: card
    topic: obstruction
    front: Second flaw of GOLD in older adults?
    back: It expresses FEV1 as % predicted, which ignores age-related variability in spirometric performance.
    src: { page: 193, quote: "Second, GOLD expresses the FEV1 as%Pred, thus failing to account for age-related variability in spirometricperformance." }
    status: unverified
  - id: geri.L11.021
    kind: cloze
    topic: obstruction
    text: "Prevalence of airflow obstruction in older persons: {{c1::37.7%}} by GOLD versus {{c2::15.4%}} by a Z-score approach."
    src: { page: 193, quote: "Zscoreapproach (37.7% vs 15.4%, respectively)." }
    status: unverified
    tags: [numbers]
  - id: geri.L11.022
    kind: card
    topic: obstruction
    front: Is the extra obstruction diagnosed by GOLD in old age clinically meaningful?
    back: No. GOLD overdiagnosis is not associated with symptoms, exercise intolerance, impaired mobility, COPD hospitalization or mortality.
    src: { page: 193, quote: "Overdiagnosis of airflow obstruction by GOLD is not associated with respiratory symptoms, exercise intolerance, impaired mobility, COPD hospitalization, or mortality." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.023
    kind: card
    topic: obstruction
    front: Two limits of the NHANES III equations?
    back: Limited to age 80 or less, and they ignore variability in spirometric performance.
    src: { page: 193, quote: "The NHANES III equations are limited to those aged less than or equal to 80 and do not consider variability in spirometric performance." }
    status: unverified
  - id: geri.L11.024
    kind: cloze
    topic: obstruction
    text: "GLI defines the LLN as the fifth percentile of Z-scores, a Z-score of {{c1::-1.64}}; its equations cover many ethnicities and ages up to {{c2::95}}."
    src: { page: 193, quote: "GLI has recommended that the LLN be instead defined as the fifth percentile distribution of Z-scores (Z-score of –1.64)." }
    status: unverified
    tags: [high-yield, numbers]
  - id: geri.L11.025
    kind: card
    topic: obstruction
    front: Which outcomes are linked to obstruction defined by FEV1/FVC Z-score below -1.64?
    back: Respiratory symptoms, impaired mobility, frailty, COPD hospitalization and mortality.
    src: { page: 193, quote: "is associated with respiratory symptoms, impaired mobility, frailty status, COPD hospitalization, and mortality." }
    status: unverified
  # ---------- p193-197: staging, reversibility, Z ----------
  - id: geri.L11.026
    kind: card
    topic: staging
    front: How does GOLD stage airflow obstruction?
    back: By FEV1 % predicted (measured/predicted x 100), with thresholds of 80 and 50 % predicted.
    src: { page: 193, quote: "GOLD recommend thresholds for FEV1 of 80and 50 % Pred when staging airflow obstruction." }
    status: unverified
  - id: geri.L11.027
    kind: card
    topic: staging
    front: Why is % predicted a poor staging tool in older adults, and what should replace it?
    back: It wrongly assumes spirometric variability is equal across the lifespan; use GLI-calculated FEV1 Z-scores.
    src: { page: 194, quote: "To address this limitation, GLI-calculated FEV1 Z-scores should be used to stagethe severity of airflow obstruction." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.028
    kind: table
    topic: staging
    title: Defining and staging COPD, GLI vs GOLD (book table, p195)
    columns: [Scheme, Obstruction, Mild, Moderate, Severe]
    rows:
      - [GLI (Z-scores), "FEV1/FVC Z < -1.64", "FEV1 Z ≥ -1.64", "FEV1 Z < -1.64 but ≥ -2.55", "FEV1 Z < -2.55"]
      - [GOLD (fixed), "FEV1/FVC < 0.70", "FEV1 ≥ 80 %Pred", "50-79 %Pred", "< 50 %Pred"]
    blanks: [[0, 1], [0, 3], [0, 4], [1, 1], [1, 3]]
    src: { page: 195, quote: "Global Lung Initiative (GLI) FEV1/FVC Z-score < -1.64" }
    status: unverified
    tags: [high-yield, numbers]
  - id: geri.L11.029
    kind: card
    topic: staging
    front: How is COPD defined in terms of reversibility?
    back: Chronic airflow obstruction that is not fully reversible.
    src: { page: 194, quote: "COPDis defined as chronic airflow obstruction, meaning Not fully reversible." }
    status: unverified
  - id: geri.L11.030
    kind: card
    topic: staging
    front: Why do guidelines do spirometry before and after a bronchodilator, and which values diagnose COPD?
    back: To establish reversibility (pre- vs post-BD) and diagnose COPD using post-BD values.
    src: { page: 194, quote: "(1) Reversibility (pre-vs post-BD values). (2) Diagnosis ofCOPD (using post-BD values)." }
    status: unverified
  - id: geri.L11.031
    kind: card
    topic: staging
    front: Disadvantages of pre/post-bronchodilator spirometry in older persons?
    back: Limited capacity to perform multiple FVC maneuvers, and possible adverse response to the inhaled bronchodilator.
    src: { page: 194, quote: "Older persons have limited capacity to perform multiple FVC maneuvers, and may have an adverse response to an inhaledBD." }
    status: unverified
  - id: geri.L11.032
    kind: cloze
    topic: staging
    text: "In a normal distribution, {{c1::68%}} of values lie within 1 SD, {{c2::95%}} within 2 SD and {{c3::99.7%}} within 3 SD of the mean."
    src: { page: 195, quote: "68% of all values are within 1 standard deviation of mean value" }
    status: unverified
    tags: [numbers]
  - id: geri.L11.033
    kind: card
    topic: staging
    front: What does a Z-score represent, and how is it calculated?
    back: How many SDs the measured value lies from the mean predicted value; z = (x - mean) / SD. Positive is above the mean, negative below.
    src: { page: 196, quote: "The Z-score represents how many SD the measuredvalue is away from the mean predicted value." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.034
    kind: card
    topic: staging
    front: On a Z-score display, what do the shaded zones and the dot show?
    back: White = normal range, light shading = near the limits, heavy shading = outside normal. The dot or arrow shows the patient; more negative = more severe.
    src: { page: 197, quote: "The location of the arrow or dot also allows to assess how severe any deficit is, with a more negative Z-score indicating more severe abnormality." }
    status: unverified
  - id: geri.L11.035
    kind: card
    topic: staging
    front: With an LLN at Z = -1.64, how many healthy people fall below normal?
    back: 5%, one in 20 PFTs; so relying on a number alone will misdiagnose. Treat the patient, not the numbers.
    src: { page: 197, quote: "5% of healthy individuals (one in 20 PFTs) will have results below the lower limit of normal." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.036
    kind: card
    topic: staging
    front: Can a lung function test alone define disease severity and prognosis?
    back: No. Neither % predicted nor Z-scores alone can; other factors, including quality of life, contribute.
    src: { page: 197, quote: "A lung function test must never be used in isolation to define disease severity and prognosis" }
    status: unverified
  # ---------- p197-199: pathogenesis ----------
  - id: geri.L11.037
    kind: enumerate
    topic: pathogenesis
    prompt: The two categories of early initiating phases of COPD.
    points: [Antioxidant / oxidant imbalance, Antiprotease / protease imbalance]
    pass: 2
    src: { page: 197, quote: "Earlyinitiating phases of COPD fall into two categories: (1) Antioxidant / oxidant. (2) Antiprotease / protease imbalance." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.038
    kind: card
    topic: pathogenesis
    front: Why does COPD keep progressing over decades despite smoking cessation?
    back: Thought to be "progression" and "consolidation" phases of disease in genetically susceptible hosts.
    src: { page: 197, quote: "COPD develops over decades despite smoking cessation, thought to be due to ―progression‖ and ―consolidation‖ phases of disease" }
    status: unverified
  - id: geri.L11.039
    kind: card
    topic: pathogenesis
    front: How do telomeres link aging and COPD?
    back: Lung-cell telomeres are shorter in COPD than in age-matched controls; shortening raises apoptosis, and an apoptosis-repair imbalance may underlie emphysema.
    src: { page: 198, quote: "Telomere shortening: leads to increased apoptosis in the lungs of patients with COPD" }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.040
    kind: card
    topic: pathogenesis
    front: How does immunosenescence contribute to COPD?
    back: Age-related loss of protective molecules such as macrophage migration inhibitory factor (MIF) and other growth factors may lead to destruction of alveoli and terminal airways.
    src: { page: 198, quote: "Age-related loss of protective immune molecules such as macrophage migration inhibitory factor (MIF)" }
    status: unverified
  - id: geri.L11.041
    kind: table
    topic: pathogenesis
    title: Chronic bronchitis vs emphysema (book figure, p198)
    columns: [Feature, Chronic bronchitis, Emphysema]
    rows:
      - [Site, Larger airways, Terminal airways]
      - [Main change, Airway remodeling, Loss of alveoli]
      - [Second change, Mucus secretion, Loss of elastin]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 198, quote: "Chronic Bronchitis Emphysema Larger airways Terminal airways Airway remodeling Loss of alveoli Mucus secretion Loss of elastin" }
    status: unverified
  - id: geri.L11.042
    kind: enumerate
    topic: pathogenesis
    prompt: COPD-based respiratory impairments.
    points: [Mucus hypersecretion, Chronic airflow obstruction, Air trapping and hyperinflation, Gas exchange abnormalities (V/Q mismatch)]
    pass: 4
    src: { page: 199, quote: "(1) Mucus hypersecretion. (2) Chronic airflow obstruction. (3) Air trapping and hyperinflation, (4) Gas exchange abnormalities." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.043
    kind: cloze
    topic: pathogenesis
    text: "Chronic bronchitis = chronic cough and sputum for at least {{c1::3 months}} per year for {{c2::2 consecutive years}}; its hallmark is {{c3::mucus hypersecretion}}."
    src: { page: 199, quote: "chronic cough and sputum production for at least 3 months per year for 2 consecutive years." }
    status: unverified
    tags: [high-yield, numbers]
  - id: geri.L11.044
    kind: card
    topic: pathogenesis
    front: Major site of airway resistance in COPD?
    back: Airways less than 2 mm in diameter.
    src: { page: 199, quote: "major site of airway resistance (obstruction) the airways less than 2 mm in diameter." }
    status: unverified
    tags: [numbers]
  # ---------- p199-201: clinical, phenotypes, course ----------
  - id: geri.L11.045
    kind: card
    topic: phenotypes
    front: Gas exchange in advanced COPD and its cardiovascular result?
    back: Hypoxemia and hypercapnia (acute or chronic respiratory acidosis); hypoxic pulmonary vasoconstriction leads to pulmonary hypertension and cor pulmonale.
    src: { page: 199, quote: "Hypoxic pulmonary vasoconstriction, pulmonary hypertension and cor pulmonale." }
    status: unverified
  - id: geri.L11.046
    kind: card
    topic: phenotypes
    front: How can COPD reduce cardiac output?
    back: Marked intrathoracic pressure swings lower LV preload and increase LV diastolic dysfunction.
    src: { page: 199, quote: "Marked intrathoracic pressure swings can decrease left ventricular preload and increase left ventricular diastolic dysfunction, ultimately reducing the cardiac output." }
    status: unverified
  - id: geri.L11.047
    kind: card
    topic: phenotypes
    front: Which COPD phenotype most often leads to osteoporosis and sarcopenia, and why?
    back: The emphysema phenotype, through systemic inflammation, immune response, anorexia and severe deconditioning.
    src: { page: 199, quote: "most often seen with the emphysema phenotype, can lead to osteoporosis and sarcopenia." }
    status: unverified
  - id: geri.L11.048
    kind: table
    topic: phenotypes
    title: COPD clinical phenotypes (book, pp200-201)
    columns: [Phenotype, Key features]
    rows:
      - [Airflow obstruction, "Without chronic bronchitis, bronchiectasis or emphysema"]
      - [Chronic bronchitis, "Cough and sputum 3 mo/y for 2 years, airway inflammation, colonization/infection"]
      - [Bronchiectasis, "Usually severe obstruction, bacteria in sputum (especially Pseudomonas), 1 or more exacerbations last year, bronchiectasis on CT"]
      - [COPD-asthma overlap, "Better ICS response (not fully reversible), eosinophils in secretions, high IgE, 10 pack-years, asthma or atopy"]
      - [Emphysema, "Alveolar-capillary destruction, hyperinflation, emphysema on CT, severe dyspnea, low BMI"]
      - [Frequent exacerbator, "2 or more exacerbations a year, worse quality of life, faster decline"]
      - [Combined pulmonary fibrosis emphysema, "Upper-lobe emphysema + lower-lobe fibrosis, male smokers, PH, lung injury, lung cancer"]
      - [COPD-OSA overlap, "Worse nocturnal hypoxemia/hypercapnia than either alone"]
    blanks: [[2, 1], [3, 1], [4, 1], [5, 1], [6, 1]]
    src: { page: 200, quote: "(A) Airway Predominant" }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.049
    kind: card
    topic: phenotypes
    front: Features of the COPD-asthma overlap phenotype?
    back: Airflow obstruction with an enhanced (but not fully reversible) response to ICS, eosinophils in respiratory secretions, high IgE, 10 pack-years of smoking, asthma and/or atopy.
    src: { page: 200, quote: "Airflow obstruction, with enhanced response to inhaled corticosteroids (but not fully reversible), eosinophilia in respiratory secretions, high IgE" }
    status: unverified
  - id: geri.L11.050
    kind: card
    topic: phenotypes
    front: Which pathogen is typical in the bronchiectasis phenotype of COPD?
    back: Pseudomonas, isolated from sputum.
    src: { page: 200, quote: "isolation of bacteria from sputum (especially pseudomonas)" }
    status: unverified
  - id: geri.L11.051
    kind: card
    topic: phenotypes
    front: Define the frequent exacerbator phenotype.
    back: Two or more symptom-defined exacerbations per year, with worse health-related quality of life and faster decline in lung function.
    src: { page: 201, quote: "Two or moresymptom-defined exacerbations per year ↓ health-related quality of life and accelerated decline in lung function." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.052
    kind: card
    topic: phenotypes
    front: "Combined pulmonary fibrosis-emphysema syndrome (CPFE): pattern, who, and associations?"
    back: Upper-lobe emphysema with lower-lobe fibrosis, usually in male smokers; associated with pulmonary hypertension, acute lung injury and lung cancer.
    src: { page: 201, quote: "Includes both upper-lobe emphysema and lower-lobe fibrosis. Usually occurs in male smokers" }
    status: unverified
  - id: geri.L11.053
    kind: card
    topic: phenotypes
    front: "COPD-OSA overlap: what is special about it?"
    back: Worse nocturnal hypoxemia and hypercapnia than either alone; the severity of obstruction and hyperinflation correlates with OSA severity.
    src: { page: 201, quote: "Worse nocturnal hypoxemia / hypercapnia than COPD and OSA alone" }
    status: unverified
  - id: geri.L11.054
    kind: table
    topic: phenotypes
    title: The BODE index
    columns: [Letter, Measure, Measured by]
    rows:
      - [B, Body mass index, Nutritional status]
      - [O, Airflow obstruction, FEV1]
      - [D, Dyspnoea, Medical Research Council score]
      - [E, Exercise capacity, 6-minute walk distance]
    blanks: [[0, 1], [1, 2], [2, 2], [3, 2]]
    src: { page: 201, quote: "Severity of Dyspnoea (D) ……. Measured by Medical Research Council score." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.055
    kind: card
    topic: phenotypes
    front: How do exacerbations shape the clinical course of COPD?
    back: They cycle between chronic and acute care settings and accelerate the decline in lung function.
    src: { page: 201, quote: "exacerbationsthat cycle between chronic and acute care settings leading to accelerated declines in lung function." }
    status: unverified
  # ---------- p202-204: exacerbation ----------
  - id: geri.L11.056
    kind: card
    topic: exacerbation
    front: Define an acute exacerbation of COPD.
    back: An acute change in sputum volume or purulence and/or more dyspnea beyond usual day-to-day variation that warrants a change in therapy.
    src: { page: 202, quote: "an acute change in sputumvolumeor purulence, and/or an increase in dyspnea beyond usual day-to-day variation that warrants a change in therapy." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.057
    kind: cloze
    topic: exacerbation
