        page: 156
        quote: "TIPS is contraindicated in severe liver failure, concomitant active infection, progressive renal failure, and severe cardiopulmonary disease."
        question: "Which of these contraindicates TIPS for refractory ascites?"
        options:
          - "Severe cardiopulmonary disease"
          - "Needing paracentesis 4 times a month"
