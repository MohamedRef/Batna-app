title: "Autosomal dominant polycystic kidney disease"
author: "Dr. Mohamed Mamdouh Elsayed"
# The lecture also covers ARPKD, nephronophthisis, ADTKD, medullary sponge kidney,
# tuberous sclerosis, Alport and thin basement membrane disease, Fabry disease and nail-patella syndrome.
book: { chapter: 8, pages: [145, 197] }
topics:
  - { id: adpkd-genetics, title: "ADPKD: definition and genetics" }
  - { id: adpkd-path, title: "ADPKD: polycystins and the signal pathway" }
  - { id: adpkd-renal, title: "ADPKD: renal manifestations and progression" }
  - { id: adpkd-extrarenal, title: "ADPKD: liver, aneurysms, heart and other organs" }
  - { id: adpkd-dx, title: "ADPKD: screening, ultrasound criteria and genetic testing" }
  - { id: adpkd-tx, title: "ADPKD: treating pain, bleeding, infection, stones and BP" }
  - { id: adpkd-ckd, title: "ADPKD: CKD, dialysis, liver cysts and aneurysm treatment" }
  - { id: adpkd-novel, title: "ADPKD: tolvaptan, somatostatin analogues, mTOR and others" }
  - { id: adpkd-tx-ttx, title: "ADPKD: transplantation" }
  - { id: cystic-other, title: "ARPKD, nephronophthisis, ADTKD and medullary sponge kidney" }
  - { id: tsc, title: "Tuberous sclerosis complex" }
  - { id: alport, title: "Alport syndrome" }
  - { id: tbm, title: "Thin basement membrane disease" }
  - { id: fabry, title: "Fabry disease" }
