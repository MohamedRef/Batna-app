  kind: case
  topic: etiology
  stem: 'A 17-year-old girl has 2 weeks of jaundice and now confusion. Exam: splenomegaly. ALT 210 U/L, ALP 18 U/L,
    bilirubin 28 mg/dL, INR 3.5, hemoglobin 8.9 g/dL.'
  steps:
  - question: Most likely cause?
    options:
    - Hepatitis A
    - Fulminant Wilson disease
    - Acetaminophen
    - Ischemic hepatitis
    answer: 1
    why: Modest transaminases, low ALP and splenomegaly point to fulminant Wilson.
  - question: She has splenomegaly suggesting chronic disease. Can this still be called ALF?
    options:
    - No, chronic disease excludes ALF
    - Yes, Wilson disease is an accepted exception
    - Only if biopsy shows no fibrosis
    - Only if HE is grade 4
    answer: 1
    why: Wilson disease is counted as ALF because it shares the poor prognosis and picture of acute failure.
    reveal: Slit-lamp examination shows Kayser-Fleischer rings.
  - question: Prognosis and plan?
    options:
    - Good spontaneous recovery; observe
    - 'Spontaneous recovery is unusual: plan emergency LT; plasmapheresis with D-penicillamine meanwhile'
    - NAC only
    - Steroids
    answer: 1
    why: Wilson ALF rarely recovers; King's (book) lists Wilson ALF as a criterion. Plasmapheresis with D-penicillamine
      has been used.
  src:
    page: 176
    quote: "In comparison, spontaneous recovery from ALF due to Wilson disease is unusual and emergency liver transplantation would be recommended."
  status: unverified
  tags:
  - high-yield
