            <text x="10" y="196" class="t-sm t-mut">Bowel diagnoses can change over time.</text>
          </svg>
      - kind: explain
        remind: [git.L03.214]
        page: 127
        quote: "C2. Functional constipation\nDiagnostic criteria*\n  1. Must include two or more of the following:**\n    a. Straining during more than 1/4 (25%) of defecations\n    b. Lumpy or hard stools (Bristol Stool Form Scale 1-2) more than 1/4 (25%) of defecations\n    c. Sensation of incomplete evacuation more than 1/4 (25%) of defecations\n    d. Sensation of anorectal obstruction/blockage more than 1/4 (25%) of defecations\n    e. Manual maneuvers to facilitate more than 1/4 (25%) of defecations (e.g., digital evacuation, support of the pelvic floor)\n    f. Fewer than three SBM per week\n  2. Loose stools are rarely present without the use of laxatives\n  3. Insufficient criteria for irritable bowel syndrome\n*Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis\n**For research studies, patients meeting criteria for opioid-induced constipation (OIC) should not be given a diagnosis of FC because it is difficult to distinguish between opioid side effects and other causes of constipation. However, clinicians recognize that these two conditions may overlap."
        title: "C2. Functional constipation"
        text: |
          لازم **2 أو أكتر** من دول في أكتر من ==25%== من مرات التبرّز:
          - Straining، أو lumpy/hard stools (**Bristol 1–2**).
          - إحساس بـ incomplete evacuation، أو anorectal obstruction.
          - **Manual maneuvers** (digital evacuation، support of the pelvic floor).
          - أو **fewer than three spontaneous bowel movements (SBM) per week**.

          ومعاهم: loose stools نادرة من غير laxatives، و ==insufficient criteria for IBS==.

          في الأبحاث، مريض الـ **opioid-induced constipation** ما ياخدش تشخيص fecal calprotectin (FC)، لأن صعب تفرّق أثر الـ opioid.
      - kind: reveal
        page: 127
        quote: "For research studies, patients meeting criteria for opioid-induced constipation (OIC) should not be given a diagnosis of FC because it is difficult to distinguish between opioid side effects and other causes of constipation."
        prompt: "ليه مريض على opioids ما ناخدوش كـ functional constipation في الأبحاث؟"
        answer: |
          الكتاب: في الأبحاث، اللي بيحقق معايير الـ **opioid-induced constipation (OIC)** ما ياخدش تشخيص FC، لأن ==it is difficult to distinguish== بين أثر الـ opioid وأي سبب تاني. بس الإكلينيكيين عارفين إن الاتنين ممكن يتداخلوا.

          وكمان من معايير الـ FC: **loose stools rarely present** من غير laxatives، و **insufficient criteria for IBS**.

          التفسير المقبول (مش في الكتاب): الـ opioid بيقلّل حركة الأمعاء بشكل مباشر، فلو المريض عنده إمساك، مش هتعرف هل ده functional ولا الدوا. والفرق مع الـ IBS-C هو **الألم**: لو الألم هو العرض الأساسي ومرتبط بالحمام، يبقى IBS-C؛ لو الإمساك لوحده، يبقى FC.
      - kind: sort
        page: 128
        quote: "C3. Functional diarrhea\nDiagnostic criterion*\n  Loose or watery stools, without predominant abdominal pain or bothersome bloating, occurring in more than 25% of stools.**\n*Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis\n**Patients meeting criteria for IBS-D (diarrhea-predominant IBS) should be excluded."
        prompt: "التشخيص إيه؟"
        bins: ["Functional constipation", "Functional diarrhea", "Functional bloating", "Opioid-induced constipation"]
        cards:
          - { text: "Two hard stools a week and straining; mild pain that does not meet IBS", bin: 0 }
          - { text: "Loose stools in 40% of bowel movements, no predominant pain", bin: 1 }
          - { text: "Bloating 2 days a week that outweighs every other symptom", bin: 2 }
          - { text: "Straining and hard stools since the morphine dose went up", bin: 3 }
        why: "الـ FC والـ functional diarrhea (FDr) والـ bloating كلهم بشرط **insufficient criteria for IBS**. الـ functional diarrhea لازم تستبعد IBS-D. والـ opioid-induced constipation (OIC) بيبدأ أو يزيد لما الـ opioid يبدأ أو يتغيّر أو يزيد."
      - kind: explain
        page: 128
        quote: "Recurrent bloating and/or distension occurring on average at least 1 day/week; abdominal bloating and/or distension predominates over other symptoms"
        title: "C3 لحد C6: كل واحد بشرطه"
        text: |
          الكتاب:
          - **C3. Functional diarrhea**: loose أو watery في أكتر من **25%** من المرات، ==without predominant abdominal pain or bothersome bloating==، ونستبعد الـ IBS-D.
          - **C4. Functional bloating/distension**: انتفاخ يوم في الأسبوع على الأقل، و**هو العرض الغالب**، ومفيش معايير كفاية لـ IBS أو FC أو functional diarrhea أو PDS. وممكن ألم خفيف مرتبط بالانتفاخ.
          - **C5. Unspecified functional bowel disorder**: أعراض مصران مش organic وما تحققش معايير أي واحد من اللي فوق.
          - **C6. Opioid-induced constipation**: أعراض إمساك **جديدة أو بتزيد** لما تبدأ أو تغيّر أو تزوّد الـ opioid، مع اتنين أو أكتر من نفس قايمة الـ FC.

          التفسير المقبول (مش في الكتاب): لاحظ إن كلهم بيتعرّفوا **بالاستبعاد من بعض**. الترتيب في الذهن: فيه ألم مرتبط بالحمام؟ IBS. مفيش ألم؟ شوف العرض الغالب: إمساك (FC)، إسهال (C3)، انتفاخ (C4). مفيش حاجة مظبوطة؟ C5. وأي إمساك بدأ مع opioid؟ C6.
      - kind: explain
        page: 129
        quote: "D1. Centrally mediated abdominal pain syndrome (CAPS)*\nDiagnostic criteria* - Must include all of the following:\n  1. Continuous or nearly continuous abdominal pain\n  2. No or only occasional relationship of pain with physiological events (e.g., eating, defecation or menses)†\n  3. Pain limits some aspect of daily functioning††\n  4. The pain is not feigned\n  5. Pain is not explained by another structural or functional gastrointestinal disorder or other medical condition\n*CAPS is typically associated with psychosocial comorbidity, but there is no specific profile that can be used for diagnosis\n**Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis\n†Some degree of gastrointestinal dysfunction may be present\n††Daily function could include impairments in work, intimacy, social/leisure, family life, and caregiving for self or others"
        title: "D: الألم اللي مصدره المخ"
        text: |
          **D1. CAPS** (centrally mediated abdominal pain syndrome):
          - ألم ==continuous or nearly continuous==.
          - مالوش علاقة (أو علاقة نادرة) بالأكل أو التبرّز أو الـ menses.
          - بيحدّ من حياته اليومية، ومش متصنّع، ومفيش مرض تاني يفسّره.
          - غالبًا معاه psychosocial comorbidity، بس مفيش profile معيّن تشخّص بيه.

          **D2. Narcotic bowel syndrome** (opioid-induced GI hyperalgesia): ألم مزمن بيتعالج بـ narcotics، والألم ==بيزيد أو ما بيخفش== مع زيادة الجرعة.

          التفسير المقبول (مش في الكتاب): ليه الـ opioid بيزوّد الألم في الـ narcotic bowel؟ لأن الجرعات الكبيرة لفترة طويلة بتخلّي الجهاز العصبي نفسه أحسّ بالألم (hyperalgesia)، فكل ما تزوّد الجرعة الألم يرجع أشد. يعني الحل هو تقليل الـ opioid بالتدريج مش زيادته.
      - kind: aside
        tone: analogy
        page: 129
        quote: "D2. Narcotic bowel syndrome/Opioid-induced GI hyperalgesia\nDiagnostic criteria* - Must include all of the following:\n  1. Chronic or frequently recurring abdominal pain* that is treated with acute high-dose or chronic narcotics\n  2. The nature and intensity of the pain is not explained by a current or previous GI diagnosis**\n  3. Two or more of the following:\n    a. The pain worsens or incompletely resolves with continued or escalating dosages of narcotics\n    b. There is marked worsening of pain when the narcotic dose wanes and improvement when narcotics are re-instituted (soar and crash)\n    c. There is a progression of the frequency, duration, and intensity of pain episodes\n*Pain must occur most days\n**A patient may have a structural diagnosis (e.g., inflammatory bowel disease, chronic pancreatitis), but the character or activity of the disease process is not sufficient to explain the pain"
        text: |
          الـ **soar and crash** زي المراجيح: الجرعة تيجي فالألم يهدى (soar)، الجرعة تخلص فالألم يرجع أوحش (crash)، فالمريض ياخد تاني.

          ومع الوقت النوبات بتزيد في الـ frequency والمدة والشدة. يعني الدوا نفسه بقى جزء من المشكلة: ==opioid-induced hyperalgesia==.
      - kind: case
        page: 128
        quote: "New,or worsening, symptoms of constipation when initiating, changing, or increasing opioid therapy"
        stem: "A 60-year-old started tramadol for knee pain 3 weeks ago. Since then she strains at most stools, passes hard lumps and goes twice a week. She had no constipation before."
        steps:
          - question: "Which Rome IV diagnosis fits?"
            options: ["Opioid-induced constipation", "Functional constipation", "IBS-C", "Functional defecation disorder"]
            answer: 0
            why: "الكتاب: **new or worsening** constipation لما تبدأ أو تزوّد الـ opioid، مع اتنين أو أكتر من القايمة (straining، hard، أقل من 3 مرات)."
          - question: "Why would a researcher not label her functional constipation?"
            options: ["Opioid effects cannot be told apart from other causes", "She is over 50", "She has no pain", "Hard stools exclude FC"]
            answer: 0
            why: "الكتاب: صعب نفرّق بين الـ **opioid side effects** والأسباب التانية، فمرضى الـ OIC ما ياخدوش FC في الأبحاث."
      - kind: explain
        page: 127
        quote: "Bowel diagnoses can change over time"
        title: "التشخيص بيتنقل مع الوقت"
        text: |
          الكتاب (ص 127): ==bowel diagnoses can change over time==، والرسمة بتحط الـ functional constipation، والـ IBS بأنواعه، والـ functional diarrhea، والـ bloating/distension، جنب بعض على محور واحد.

          وفي نفس الصفحة سؤال البداية: هل فيه **recurrent abdominal pain** يوم في الأسبوع على الأقل في آخر 3 شهور، مرتبط باتنين من (defecation، تغيّر الـ frequency، تغيّر الـ form)؟ لو أيوه = IBS. لو لأ = شوف العرض الغالب.

          التفسير المقبول (مش في الكتاب): يعني مريض النهارده functional constipation، ممكن بعد سنة الألم يزيد فيبقى IBS-C. فالتشخيص مش لقب ثابت، هو وصف للمرحلة الحالية، وعلشان كده العلاج بيتغيّر مع الأعراض.
      - kind: figure
        page: 127
        title: "Rome IV للـ IBS في رسمة"
        image: { file: git/L03-ibs-rome-flowchart.webp, book: true }
        alt: "Book flow chart: recurrent abdominal pain at least 1 day per week in the last 3 months with two of three features (related to defecation, change in stool frequency, change in stool form); criteria fulfilled for 3 months with onset at least 6 months before; then the predominant stool form decides IBS-D (Bristol 5 or 6), IBS-C (Bristol 1 or 2) or IBS-M (both)."
        caption: |
          سؤالين وبعدين النوع:
          - ألم **مرة في الأسبوع** على الأقل آخر 3 شهور، ومعاه **2 من 3** (defecation، frequency، form)؟
          - من **3 شهور** وبدأ من **6 شهور** على الأقل؟

          بعدها ==predominant stool form==: Bristol 5-6 = **IBS-D**، 1-2 = **IBS-C**، الاتنين = **IBS-M**.
      - kind: try
        items: [git.L03.208, git.L03.215, git.L03.219, git.L03.224, git.L03.282]
    recap:
      - "Bowel diagnoses بتتغيّر مع الوقت؛ طيف من FC للـ IBS للـ functional diarrhea."
      - "FC: اتنين من (straining، hard، incomplete، blockage، manual، أقل من 3 مرات) في أكتر من 25%؛ loose نادر من غير laxatives؛ مش IBS."
      - "Functional diarrhea: أكتر من 25% loose من غير ألم غالب. Bloating: يوم في الأسبوع وهو الغالب. Unspecified: مش بيحقق أي واحد."
      - "OIC: إمساك جديد أو بيزيد مع بداية أو زيادة الـ opioid."
      - "CAPS والـ narcotic bowel: ألم مصدره المخ؛ زيادة الـ opioid بتزوّد الألم."
    practice: [git.L03.208, git.L03.214, git.L03.215, git.L03.216, git.L03.217, git.L03.218, git.L03.219, git.L03.220, git.L03.221, git.L03.222, git.L03.223, git.L03.224, git.L03.225, git.L03.226, git.L03.281, git.L03.282]
