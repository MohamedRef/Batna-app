      - kind: explain
        page: 231
        quote: "This characteristic allows norUDCA to be passively absorbed by liver cholangiocytes, move through the cholehepatic shunt, and stimulate bicarbonate-rich choleresis. Additionally, norUDCA has been found to have antilipotoxic, antiproliferative, antifibrotic, and anti-inflammatory properties, and it is less toxic to hepatocytes and cholangiocytes in vitro compared to UDCA, due to its hydrophilicity."
        title: "الأدوية الجديدة في جمل قصيرة"
        text: |
          **على الـ bile acids**:

          - 24-norUDCA: ناقصه methylene group، فمبيتعملوش conjugation. ده بيخليه يدخل الـ **cholehepatic shunt** ويعمل bicarbonate-rich choleresis. Phase II (161 مريض): الـ ALP نزل مع الجرعة. القلق: progression في الـ dominant strictures.
          - ==Obeticholic acid (OCA)== (AESOP): جرعة 5–10 mg/day نزّلت الـ ALP. أهم side effect: dose-dependent pruritus.
          - **Cilofexor**: Farnesoid X receptor (FXR) agonist مش steroid. نزّل الـ ALP والـ gamma-glutamyl transferase (GGT)، و well tolerated.
          - NGM282 (fibroblast growth factor 19 (FGF19) analog): الـ ALP ما اتغيرش، بس الـ fibrosis biomarkers اتحسنت.
          - **All-trans retinoic acid (ATRA)**: بيمنع الـ bile acid synthesis عن طريق FXR/RXR.
          - **Maralixibat** (apical sodium-dependent bile acid transporter (ASBT) inhibitor): مفيش تغيير مهم.
          - ==Fibrates== (PPAR): الـ ALP نزل 40% والهرش اتحسن، بس الـ liver stiffness زادت، والـ ALP رجع بعد الإيقاف.

          **Antifibrotic**: **simtuzumab** (anti-LOXL2) فشل في الـ fibrosis.

          **Immune**:

          - **Timolumab** (anti-VAP-1)، و **cenicriviroc** (ALP نزل 18%)، و **vedolizumab** (نتايج mixed)، و **vidofludimus** (ALP طبيعي في 27.7%).
          - الـ immunosuppressants التقليدية: فايدتها مش واضحة. والـ budesonide زوّد الـ osteoporosis، والـ infliximab ما نفعش.

          **Microbiome**:

          - **Vancomycin**: نزّل الـ ALP والـ Mayo score.
          - **Minocycline** نفع، و **rifaximin** لأ.
          - **Faecal microbiota transplantation (FMT)** واعد، والـ probiotics لأ.

          **Others**: curcumin لأ، و **docosahexaenoic acid (DHA)** نزّل الـ ALP، و **bexotegrast** (αvβ6/αvβ1 → TGF-β)، و hymecromone، و Orbcel-C.
      - kind: explain
        page: 233
        quote: "ASBT plays a crucial role in the reabsorption of conjugated bile acids in\n the terminal ileum. As mentioned earlier, the FXR exerts its effects, in part, by\n downregulating ASBT, thereby reducing the enterohepatic circulation of bile\n acids and the bile acid pool."
        title: "ليه نضرب في الـ FXR والـ ASBT؟"
        text: |
          الفكرة كلها: الـ bile acids نفسها سامة للقنوات المتعبة، فقلّل **كميتها** أو خليها **أقل ضرر**.

          - الـ ==FXR== بيقفل الـ **CYP7A1** (الـ rate-limiting enzyme لتصنيع الـ bile acids)، وبيقلل الـ **ASBT** في المصران، وبيطلّع **FGF19** يكلّم الكبد عن طريق الـ portal blood.
          - الـ ==ASBT== بيسحب الـ conjugated bile acids تاني في الـ **terminal ileum**. لو قفلته، الـ **enterohepatic circulation** والـ **bile acid pool** بيقلّوا.

          والنتايج في الكتاب:

          - **Cilofexor** (FXR agonist مش steroid): 52 مريض non-cirrhotic، الـ ALP والـ GGT والـ primary bile acid secretion نزلوا، و well tolerated. بس العيّنة كانت large-duct بس، ومن غير cirrhosis، والـ IBD قليل فيها.
          - **NGM282** (FGF19 analog): الـ ALP ما اتغيرش، بس الـ fibrosis markers (ELF و Pro-C3) اتحسنت.
          - **ATRA** + UDCA (15 مريض): الـ ALP نزل 30%، ونزل الـ C4 كمان؛ بس تجربة الجرعة الأقل اتقفلت بعد مريضين.
          - **Maralixibat** (ASBT inhibitor، 27 مريض): مفيش تغيير مهم في التحاليل.

          يعني المنطق سليم على الورق، والنتايج لحد دلوقتي على التحاليل بس.
      - kind: sort
        page: 234
        quote: "PPARs, especially PPAR-α, play a critical role in regulating liver transporters involved in bile homeostasis, making them promising targets for the treatment of cholestatic liver diseases. PPAR agonists have demonstrated anti- cholestatic effects, such as enhancing biliary phospholipid secretion, promoting mixed micelle formation through upregulation of MDR3, inhibiting bile acid synthesis, and upregulating bile acid detoxification. These receptors are activated by a variety of lipophilic acids, including essential fatty acids, eicosanoids, phytanic acid, and palmitoylethanolamide. Like the FXR, PPARs have pleiotropic effects and interact with bile acid nuclear receptors, leading to anti-inflammatory and antifibrotic effects."
        prompt: "صنّف الأدوية حسب الـ mechanism:"
