  # ---------- MCQs ----------
  - id: hem.L08.100
    kind: mcq
    topic: bcr-abl
    stem: A 47-year-old man has WBC 180,000/µL with basophilia and massive splenomegaly. Which molecular product drives his disease?
    options:
      - "P210 BCR/ABL tyrosine kinase"
      - "PML–RARα from t(15;17)"
      - "JAK2 V617F"
      - "BCL2 overexpression from t(14;18)"
      - "P230 from chronic neutrophilic leukemia"
    answer: 0
    why:
      - "Correct: the 9;22 translocation makes the BCR/ABL hybrid gene coding P210, a tyrosine kinase (p117)."
      - t(15;17) is acute promyelocytic leukemia (lecture 7).
      - JAK2 belongs to other myeloproliferative neoplasms, not CML.
      - t(14;18) is follicular lymphoma; BCL2 overexpression in CLL comes from 13q14 loss of MIR-15/16.
      - P230 is the rare BCR/ABL of chronic neutrophilic leukemia, which lacks basophilia.
    src: { page: 117, quote: "The P210 protein is a tyrosine kinase may play a role in triggering the uncontrolled proliferation of (CML cells)." }
    status: unverified
  - id: hem.L08.101
    kind: mcq
    topic: cml-clinical
    stem: A 52-year-old man with CML and a WBC of 450,000/µL becomes drowsy and short of breath and has a transient right arm weakness. What is the mechanism?
    options:
      - Leukostasis from sludging in cerebral and pulmonary vessels
      - High histamine from the basophil mass
      - Splenic infarction
      - Pulmonary fibrosis from busulfan
      - Hyperviscosity from IgM paraprotein
    answer: 0
    why:
      - "Correct: dyspnea, drowsiness and TIA are leukostatic symptoms from sludging in pulmonary or cerebral vessels (p118)."
      - Histamine from basophils causes upper GIT bleeding.
      - Splenic infarction causes left upper quadrant pain.
      - Busulfan fibrosis is gradual and not neurological.
      - IgM hyperviscosity belongs to Waldenström, not CML.
    src: { page: 118, quote: "Leuckostatic symptoms such as dyppnea, drowsiness, TIA, which are due to sludging in the pulmonary or cerebral vessels" }
    status: unverified
  - id: hem.L08.102
    kind: mcq
    topic: cml-clinical
    stem: A patient with typical Ph-positive chronic-phase CML is examined. Which finding is most expected?
    options:
      - Marked splenomegaly
      - Generalised lymphadenopathy
      - Skin infiltration
      - Gum hypertrophy
      - Massive hepatomegaly without splenomegaly
    answer: 0
    why:
      - "Correct: splenomegaly is the most consistent sign, in more than 60% (p118)."
      - Lymphadenopathy is very uncommon and suggests Ph-negative CML or transformation (p119).
      - Skin infiltration also suggests Ph-negative CML or transformation.
      - Gum hypertrophy is a monocytic acute leukemia sign, not CML.
      - Hepatomegaly is less common than splenomegaly.
    src: { page: 118, quote: "Splenomegaly is the most consistent physical sign in CML occurs in more than 60% of cases." }
    status: unverified
  - id: hem.L08.103
    kind: mcq
    topic: cml-course
    stem: A 55-year-old with CML for 4 years now needs rising drug doses to keep WBC below 20,000/µL. Blood shows 17% blasts and 22% basophils. Which phase is this, and what is the median survival per the book?
    options:
      - Accelerated phase; about 12 months
      - Blast crisis; about 3 months
      - Chronic phase; years
      - Blast crisis; about 12 months
      - Accelerated phase; about 3 months
    answer: 0
    why:
      - "Correct: blasts 15–19% and basophils ≥20% define the accelerated phase; median survival 12 months (p120, p121)."
      - Blast crisis resembles acute leukemia; its survival is 3 months.
      - Rising doses, blasts and basophilia are not chronic phase.
      - 12 months is the accelerated-phase figure, not blast crisis.
      - 3 months is the blast-crisis figure.
    src: { page: 121, quote: "blast crisis of CML is only 3 months. The survival after development of the accelerated phase of CML is 12 months." }
    status: unverified
  - id: hem.L08.104
    kind: mcq
    topic: cml-treatment
    stem: A 40-year-old woman with chronic-phase CML on busulfan presents with dry cough and progressive dyspnea; her skin has darkened and her periods stopped. Which side effect explains the breathlessness?
    options:
      - Pulmonary fibrosis
      - Pleural effusion
      - Leukostasis
      - Pneumocystis infection
      - Pulmonary embolism
    answer: 0
    why:
      - "Correct: busulfan causes pulmonary fibrosis, hyperpigmentation and premature menopause (p122)."
      - Pleural effusion is a dasatinib side effect.
      - Leukostasis needs a very high count; busulfan lowers the count.
      - Pneumocystis is not a listed busulfan effect.
      - Nothing in the story points to embolism.
    src: { page: 122, quote: "Premature menopause." }
    status: unverified
  - id: hem.L08.105
    kind: mcq
    topic: tki
    stem: A CML patient on imatinib loses response. Mutation analysis shows threonine replaced by isoleucine at position 315 of the ABL kinase. What does the book say about this mutation?
    options:
      - It resists imatinib and all other TKIs
      - It responds to dasatinib 100 mg daily
