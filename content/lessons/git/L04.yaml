  - id: git.L04.lesson3
    title: "المعدة: بوليب صغير وخطر كبير"
    hook: "الفسيخ والرنجة والـ H. pylori و الجينات: مين بيحضّر لسرطان المعدة؟"
    minutes: 9
    pages: [152, 156]
    topics: [gastric-polyps, gastric-risk, gastric-path]
    goals:
      - "تعرف أرقام الـ gastric adenomatous polyps وإمتى تشيله بالمنظار وإمتى بالجراحة"
      - "تقسم عوامل خطر سرطان المعدة لـ nutritional, environmental, medical, hereditary"
      - "تحفظ الـ precursors والـ histological types بالنسب"
    status: unverified
    steps:
      - kind: explain
        page: 152
        quote: "They are usually an incidental finding on endoscopy detected in 2-4% of gastroscopic evaluation."
        title: "الـ gastric polyps"
        text: |
          الـ gastric tumors: **benign** (epithelial و mesenchymal) و**malignant**: primary (adenocarcinoma، GIST، lymphoma) أو secondary.

          الـ ==gastric polyps== غالبًا **incidental finding** في 2-4% من المناظير، وشكلها **2-3 mm sessile** في الـ body والـ fundus.

          وبتظهر في 53% من مرضى FAP و Gardner، وممكن تكون معاها colorectal neoplasms في 60%.
      - kind: explain
        page: 153
        quote: "Polyps > 4cms in diameter may harbour carcinoma in 40% of the time."
        title: "الـ adenomatous polyp: الأرقام"
        text: |
          - 10% من الـ gastric polyps، غالبًا **solitary, sessile, antral**.
          - 3 أنواع: tubular، tubulovillous، villous.
          - **Adenocarcinoma** بيتلاقي في ==21%==، والخطر بيزيد مع الحجم والـ villous.
          - البوليب فوق **4 cm**: carcinoma في **40%**.
          - Focal carcinoma: 6% في الـ flat tubular، و33% في الـ villous والـ tubulovillous.
      - kind: check
        page: 153
        quote: "Operative excision - sessile lesions more than 2 cms. Polyps found to have areas of invasive tumor or -polyps symptomatic to pain or bleeding."
        question: "Which gastric adenoma needs operative excision?"
        options:
          - "A 3 cm sessile adenoma"
          - "A 1 cm polyp fully removed, no invasive cancer"
          - "A 3 mm fundic polyp found by chance"
          - "Any tubular adenoma"
        answer: 0
        why:
          - "صح: sessile lesions more than 2 cm تتشال جراحيًا، زي البوليب اللي فيه invasion أو بيعمل pain أو bleeding."
          - "Endoscopic polypectomy كفاية لو اتشال كله ومفيش invasive cancer."
          - "دي الـ incidental 2-3 mm اللي بنشوفها كتير."
          - "النوع لوحده مش indication."
      - kind: aside
        tone: tip
        page: 153
        quote: "Because of increased risk for coincident gastric carcinoma these patients are to be followed closely by serial endoscopies."
        text: "شلت البوليب؟ خلاص؟ لأ. عنده خطر coincident gastric carcinoma في حتة تانية في المعدة، فلازم serial endoscopies."
      - kind: explain
        page: 153
        quote: "Only treatment modality that is able to cure the disease is resectional surgery"
        title: "سرطان المعدة في سطرين"
        text: |
          الـ **carcinoma stomach** curable لو اتلقط بدري، و**early diagnosis is the key**. العلاج الوحيد اللي بيشفي هو ==resectional surgery==.

          هو الرابع في الرجالة، الخامس في الستات، والتاني في وفيات السرطان. وحوالي 45-50% بييجوا **inoperable**.
      - kind: sort
        page: 154
        quote: "Salted/smoked meat or fish (nitrate N-nitroso compounds)"
        prompt: "صنّف عوامل خطر سرطان المعدة:"
        bins: ["Nutritional", "Environmental", "Medical"]
        cards:
          - { text: "Salted or smoked fish", bin: 0 }
          - { text: "Low fresh fruit and vegetables", bin: 0 }
          - { text: "Lack of refrigeration", bin: 1 }
          - { text: "Contaminated well water", bin: 1 }
          - { text: "Smoking", bin: 1 }
          - { text: "H. pylori infection", bin: 2 }
          - { text: "Prior gastric surgery (bile gastritis)", bin: 2 }
          - { text: "Gastric atrophy and gastritis", bin: 2 }
        why: "الملح والتدخين بيعملوا nitrate → N-nitroso compounds، وقلة الخضار يعني قلة ascorbic acid اللي بيحمي. التلاجة بتقلل الحاجة للتمليح. والـ H. pylori طبي، بس مش مرتبط بالـ cardia."
      - kind: aside
        tone: joke
        page: 154
        quote: "Salted/smoked meat or fish (nitrate N-nitroso compounds)"
        text: "شم النسيم بالفسيخ مرة في السنة مش هو المشكلة. المشكلة اللي بياكل salted fish كل يوم: الـ nitrate بيتحول N-nitroso compounds. قول للمريض كده وهو بيضحك."
      - kind: aside
