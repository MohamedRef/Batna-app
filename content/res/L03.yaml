  - id: res.L03.067
    kind: card
    topic: objectives
    front: In what three formats can research objectives be stated, and which one is usual?
    back: >-
      As questions, as positive sentences ("The objectives of this study are to determine…") or as a
      hypothesis to verify. The usual way is the positive sentence.
    src: { page: 54, quote: "What formats can be used for stating research objectives? Research objectives can be stated as:\n  Questions: \"The objectives of this study are to answer the following questions …\"\n  Positive sentence: \"The objectives of this study are to determine …\"\n  Hypothesis: \"The objective of this study is to verify the following hypothesis…\"\nThe format chosen depends on the type of study that will be undertaken. If the study is descriptive or exploratory in nature, then objectives are stated in the form of questions or positive sentences. If the researcher knows enough to make predictions concerning what s/he is studying, then hypotheses may be proposed.\nUsually in our case we use the positive sentence way to formulate objectives" }
    status: unverified
