        title: "الأسباب"
        quote: "Table 1: Causes of Focal Segmental Glomerulosclerosis.\n| Type of Disease | Cause |\n| Primary (idiopathic) form | Specific cause unknown; mediated by circulating permeability factors |\n| Secondary forms | |\n| Familial or genetic | Mutations in specific podocyte genes* |\n| Virus-associated | Human immunodeficiency virus type 1, parvovirus B19, simian virus 40, cytomegalovirus, Epstein–Barr virus |\n| Drug-induced | Heroin; interferons alfa, beta, and gamma; lithium; pamidronate; sirolimus; calcineurin-inhibitor nephrotoxicity; anabolic steroids |\n| Adaptive† | Conditions with reduced renal mass: oligomeganephronia, very low birth weight, unilateral renal agenesis, renal dysplasia, reflux nephropathy, sequela to cortical necrosis, surgical renal ablation, renal allograft, aging kidney, any advanced renal disease with reduced functioning nephrons |\n| | Conditions with initially normal renal mass: systemic hypertension, acute or chronic vaso-occlusive processes (atheroembolization, thrombotic microangiopathy, renal-artery stenosis), elevated body-mass index (obesity, increased lean body mass [e.g., bodybuilding]), cyanotic congenital heart disease, sickle cell anemia |\n* For details regarding genetic mutations associated with focal segmental glomerulosclerosis, see the table in the Supplementary Appendix.\n† The adaptive form is mediated by adaptive structural–functional responses to glomerular hypertension caused by elevated glomerular capillary pressures and flows."
        text: |
          - **Primary**: ==circulating permeability factors==
          - **Genetic**: podocyte gene mutations
          - **Viruses**: HIV-1، parvovirus B19، Simian virus 40 (SV40)، cytomegalovirus (CMV)، Epstein–Barr virus (EBV)
          - **Drugs**: heroin، interferons، lithium، pamidronate، sirolimus، calcineurin inhibitor (CNI)، anabolic steroids
          - **Adaptive**: reduced renal mass (agenesis، reflux، allograft، aging) أو normal mass (HTN، obesity، bodybuilding، sickle cell)

          ليه القايمة دي كلها بتوصل لنفس الندبة؟ التفسير المقبول (مش في الكتاب): الـ podocyte خلية **ما بتتكاثرش**، فأي ضرر بيقلل عددها. لما الـ podocytes تقل في حتة من الـ tuft، الـ GBM بيبقى عريان وبيلزق في Bowman's capsule، والحتة دي تتليّف.
          - الـ **permeability factor** و الـ **genes** بيضربوا الـ podocyte مباشرة، فالـ proteinuria كبيرة والـ effacement diffuse.
          - الـ **viruses** والـ **drugs** بيسمّموا الـ podocyte.
          - الـ **adaptive**: nephrons قليلة أو جسم كبير، فكل glomerulus بيشتغل زيادة ويتمدد، والـ podocytes ما تقدرش تغطي المساحة الجديدة. عشان كده هنا الـ effacement segmental والـ albumin غالبًا طبيعي.
