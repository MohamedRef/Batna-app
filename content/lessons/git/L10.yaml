  - id: git.L10.lesson2
    title: "الـ achalasia: البوابة اللي نسيت تفتح"
    hook: "الأكل والمية الاتنين بيقفوا، والمريض بينام قاعد. ليه؟"
    minutes: 8
    pages: [272, 274]
    topics: [achalasia, achalasia-dx]
    goals:
      - "تشرح الـ achalasia من فقدان الأعصاب المثبّطة"
      - "تعرف أعراضها والـ red flags بتاعة الـ pseudoachalasia"
      - "تعرف كل test بيوري إيه، وأنهي أكثرهم sensitive"
    status: unverified
    steps:
      - kind: explain
        page: 272
        quote: "Loss of the inhibitory nerves at the sphincter →failure of the LES to completely relax and → relative obstruction."
        title: "اللي حصل بالظبط"
        text: |
          الـ ==achalasia== هي **the best defined primary motility disorder**.

          - في الـ lower esophageal sphincter (LES): الأعصاب الـ **inhibitory** بتموت، فالـ sphincter ما بيعرفش **يرتخي** كويس، فيبقى فيه relative obstruction.
          - في الـ body: الأعصاب بتروح كمان، فتحصل ==aperistalsis==، الأكل يقعد (stasis)، والمريء يوسع.

          ممكن الـ manometry تلاقي الـ LES pressure أكتر من **40 mm Hg** (الصفحة دي).

          ليه موت الأعصاب **المثبّطة** بالذات بيقفل الباب؟ التفسير المقبول (مش في الكتاب): الـ LES طبيعي مشدود لوحده، والبلعة بتبعت إشارة **inhibitory** (nitric oxide و VIP) تقوله «ارتخي». لو الأعصاب دي ماتت، مفيش حد يقوله يرتخي، والأعصاب المنشّطة لسه شغالة، فيفضل مقفول. ونفس الأعصاب هي اللي بتعمل الموجة في الـ body، فالـ peristalsis بتروح كمان.
      - kind: aside
        tone: analogy
        page: 272
        quote: "The loss of nerves along the esophageal body causes aperistalsis, leading to stasis of ingested food and subsequent dilation of the esophagus."
        text: |
          تخيّل باب جراج أوتوماتيك، الحساس بتاعه اتحرق. الباب واقف مقفول نُصّه، والعربيات (اللقم) متكدسة في الشارع (المريء) لحد ما الشارع نفسه يوسع. ده بالظبط الـ **dilated esophagus** في الـ achalasia.
      - kind: figure
        page: 273
        quote: "Barium swallow: which show dilatation of the esophagus with tapering smooth lower end (Beak deformity) due to failure of the sphincter to relax."
        title: "شكل الـ bird's beak"
        alt: "Sketch of a barium swallow in achalasia: a wide dilated esophagus holding barium with a horizontal fluid level, narrowing smoothly at the bottom into a thin pointed beak at the gastroesophageal junction above the stomach."
        caption: "مريء واسع فيه fluid level، وتحت بيضيق بنعومة زي منقار العصفورة (bird's beak) علشان الـ LES مش بيرتخي. النعومة دي مهمة: الـ cancer بيدي حافة irregular."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <path d="M140 10v40c-40 10-60 50-60 100s20 80 50 100l25 20l25-20c30-20 50-50 50-100s-20-90-60-100v-40" class="fg-acc"/>
            <path d="M84 120h162" class="fg-ink"/>
            <text x="252" y="124" class="t-sm t-b">Fluid level</text>
            <text x="252" y="180" class="t-sm">Dilated</text>
            <text x="252" y="195" class="t-sm">esophagus</text>
            <path d="M170 272h60" class="fg-thin"/>
            <text x="236" y="268" class="t-sm t-acc t-b">Smooth beak</text>
            <text x="236" y="283" class="t-sm t-mut">LES fails</text>
            <text x="236" y="298" class="t-sm t-mut">to relax</text>
            <path d="M165 280c-50 5-80 25-60 45h120c20-20-10-40-60-45" class="fg-box"/>
            <text x="165" y="318" text-anchor="middle" class="t-sm t-mut">Stomach</text>
          </svg>
      - kind: figure
        page: 274
        title: "الـ bird's beak في الـ barium الحقيقي"
        image: { file: git/L10-achalasia-barium.webp, book: true }
        marks:
          - { at: [0.17, 0.50], label: "Smooth beak-like narrowing", kind: arrow }
          - { at: [0.86, 0.76], label: "Smooth beak-like narrowing", kind: arrow }
        alt: "Two book barium swallow films in achalasia: a dilated esophagus full of barium that narrows smoothly to a thin beak at the gastroesophageal junction."
        caption: |
          نفس الرسمة اللي فوق، بس في المريض: مريء **واسع** مليان barium، وفي آخره بيضيق ==بنعومة== زي المنقار (1، 2).
      - kind: explain
        page: 272
        quote: "Dysphagia for both solids and liquids is the hallmark of achalasia."
        title: "الأعراض"
        text: |
          - ==Dysphagia for both solids and liquids==: ده الـ hallmark.
          - **Regurgitation** للأكل اللي قاعد في المريء، خصوصًا بالليل، فالمريض بينام على مخدات كتير أو قاعد على كرسي.
          - **Chest pain**: squeezing retrosternal، بيطلع للرقبة والفك والدراع والضهر، ممكن يزيد مع الأكل ويصحّيه من النوم.
          - **Heartburn** في 30%، من تخمّر الأكل المحبوس و lactic acid، مش reflux حقيقي.
          - الـ stress والأكل بسرعة بيزوّدوا كل ده. والـ **weight loss** موجود بس **slight**.

          ليه كل عَرَض؟ التفسير المقبول (مش في الكتاب):
          - **أكل وسوايل من الأول**: مفيش موجة تزق، فحتى المية بتقف (عكس الـ stricture اللي بتبدأ بالناشف).
          - **Regurgitation بالليل**: المريء بيتملي طول اليوم، ولما ينام بيضيع مساعدة الجاذبية فالأكل يرجع للبُق، وده خطر aspiration.
          - **Weight loss خفيف**: الجاذبية وتقل عمود الأكل بيفتحوا الباب شوية، فجزء من الأكل بيعدّي.
      - kind: check
        page: 273
        quote: "A sensation of heartburn may be reported by 30% of patients and is assumed to be related to retained food fermentation and lactic acid."
        question: "Why do about 30% of achalasia patients feel heartburn?"
        options:
          - "Fermentation of retained food and lactic acid"
          - "Reflux of gastric acid through a weak LES"
          - "Infectious esophagitis from Candida"
          - "Barrett esophagus with acid injury"
        answer: 0
        why:
          - "صح: الأكل المحبوس بيتخمّر ويعمل lactic acid."
          - "بالعكس: الـ LES في الـ achalasia مقفول مش ضعيف."
          - "مش ده التفسير اللي في المحاضرة."
          - "الـ Barrett مضاعفة gastroesophageal reflux disease (GERD)، مش سبب الـ heartburn هنا."
      - kind: explain
        remind: [git.L10.031]
        page: 273
        quote: "Pseudoachalasia. accounts for up to 5% of suspected cases and is more likely with advanced age, abrupt onset of symptoms (<1 year), and weight loss."
        title: "الـ differential، والـ pseudoachalasia أخطرهم"
        text: |
          الـ differential: **carcinoma of the gastric cardia**، **diffuse esophageal spasm (DES)**، و **megaesophagus** في الـ amyloid.

          الـ ==pseudoachalasia== حوالي **5%** من الحالات المشتبه فيها، وغالبًا tumor. اشتبه فيها لما تلاقي:
          - **Advanced age**
          - **Abrupt onset** (أقل من سنة)
          - **Weight loss** واضح

          علشان كده **endoscopy** جزء أساسي من الـ evaluation. ولو مش واضحة: **Computed tomography (CT)** أو **endoscopic ultrasound (EUS)**. ونادرًا بتيجي من **paraneoplastic** antineuronal antibodies.

          ليه الـ tumor يقلّد الـ achalasia؟ التفسير المقبول (مش في الكتاب): ورم في الـ cardia بيلف حوالين الـ LES ويضيّقه أو يدخل في أعصابه، فالـ barium والـ manometry يطلعوا شبه الـ achalasia. الفرق في الـ **OLD** والمنظار.
      - kind: mnemonic
        page: 273
        quote: "Pseudoachalasia. accounts for up to 5% of suspected cases and is more likely with advanced age, abrupt onset of symptoms (<1 year), and weight loss."
        word: "OLD"
        parts:
          - { key: "O", text: "Old age (advanced age)" }
          - { key: "L", text: "Loss of weight" }
          - { key: "D", text: "Duration short: abrupt onset, under 1 year" }
        hook: |
          الـ pseudoachalasia بتحب الـ **OLD**: عجوز، خسّ، والأعراض جديدة. شوفت التلاتة؟ منظار قبل أي balloon.
      - kind: reveal
        page: 273
        quote: "Esophageal manometry: Aperistalsis of the body of the esophagus, increased pressure of LES. Manometry identifies early disease before esophageal dilatation and food retention, it is the most sensitive diagnostic test."
        prompt: "ليه الـ manometry أكثر test sensitive للـ achalasia، والـ barium ممكن يطلع طبيعي في الأول؟"
        answer: |
          الكتاب: الـ manometry بيلقط المرض **early**، **before esophageal dilatation and food retention**، وهو **the most sensitive diagnostic test**.

          يعني: الـ barium بيشوف **النتيجة** (مريء وسع وأكل متكوّم)، ودي بتاخد شهور لسنين. الـ manometry بيقيس **العطل نفسه** (LES ما بيرتخيش، ومفيش peristalsis) من أول يوم، حتى قبل ما الشكل يتغير.
      - kind: table
        page: 273
        quote: "Esophageal manometry: Aperistalsis of the body of the esophagus, increased pressure of LES. Manometry identifies early disease before esophageal dilatation and food retention, it is the most sensitive diagnostic test."
        title: "كل test بيوري إيه"
        columns: ["Test", "What it shows", "Why"]
        rows:
          - ["Barium swallow", "Dilated esophagus, fluid level, bird's beak", "Sphincter fails to relax"]
          - ["Manometry", "Aperistalsis, high LES pressure", "Most sensitive; catches early disease"]
          - ["Upper endoscopy", "Dilated esophagus; scope passes easily", "Essential to exclude carcinoma"]
          - ["EUS", "Tumor or infiltration", "Pseudoachalasia work-up; guides botox"]
        hide: [[0, 1], [1, 2], [2, 2], [3, 2]]
      - kind: reveal
        page: 274
        quote: "Upper endoscopy: Essential to exclude carcinoma of the esophagus. Dilated esophagus and the endoscope can pass the narrow sphincter to the stomach easily."
        prompt: "في المنظار، الـ endoscope بيعدّي الـ sphincter الضيق في الـ achalasia **بسهولة**. ليه ده مهم؟"
        answer: |
          الكتاب: upper endoscopy **essential to exclude carcinoma**، والمريء واسع، والـ scope **can pass the narrow sphincter to the stomach easily**.

          التفسير المقبول (مش في الكتاب): الـ LES في الـ achalasia **عضلة مشدودة** مش نسيج صلب، فبتفتح بالضغط الخفيف. أما الورم فبيبقى **جامد** والـ scope يقف عنده أو يحتاج ضغط. يعني لو عدّيت بصعوبة، فكّر في pseudoachalasia وخد biopsy من الـ cardia (وبص عليها من جوه المعدة بالـ retroflexion).
      - kind: check
        page: 273
        quote: "Hence, endoscopy should be part of the evaluation of achalasia. When the clinical suspicion for pseudoachalasia is high and endoscopy nondiagnostic, CT scanning or endoscopic ultrasonography may be of value."
        question: "A 72-year-old man has 5 months of dysphagia and lost 10 kg. Barium shows a bird's beak. Best next step?"
        options:
          - "Upper endoscopy to exclude carcinoma"
