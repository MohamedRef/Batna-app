  - id: neph.L09.lesson6
    title: "الزراعة: مين ينفع يزرع، ومين ينفع يتبرع"
    hook: "الزراعة أحسن علاج، بس مش لأي حد. وأخوه اللي عايز يتبرع محتاج فحص أدق من العيان نفسه."
    minutes: 9
    pages: [318, 325]
    topics: [tx-outcome, tx-recipient, tx-donor]
    goals:
      - "تعرف نتايج الزراعة وأسباب الوفاة مع كلية شغالة"
      - "تحفظ الـ absolute والـ relative contraindications والأمراض اللي بترجع"
      - "تعرف أنواع المتبرعين وفحص المتبرع الحي"
    status: unverified
    steps:
      - kind: explain
        page: 319
        title: "الأرقام"
        quote: "half life expectancy for living or deceased donor graft is around 14,10y respectively"
        text: |
          الزراعة ==treatment of choice== للـ CKD المتقدم: حياة أحسن وعمر أطول.

          - **One-year graft survival** أكتر من 90%.
          - **Half-life**: ==14 سنة living==، **10 سنين deceased**.
          - الوفيات أعلى في **أول سنة**، حوالي 7% في سن 50–60.
          - الوفاة مع كلية شغالة: **CVD، infection، malignancy**.
          - الـ chronic graft dysfunction (fibrosis، tubular atrophy، vasculopathy، glomerulopathy) أساسًا من الـ **chronic rejection**.

          ودلوقتي بنزرع ناس high-risk: HIV، highly sensitised، T-cell positive cross-match، و ABO-incompatible.
      - kind: explain
        page: 320
        title: "الـ absolute contraindications"
        quote: "Severe chronic pulmonary disease. Cardiac failure resistant to treatment"
        text: |
          الكلية بتتحط **extraperitoneal في الـ inguinal fossa**، والعيان ممكن يخرج بعد أسبوع.

          **Absolute**:
          - ==Malignancy== (إلا لو خالي من رجوع سنين، أو prostate Gleason ≤6، أو renal tumour ≤1 cm بالصدفة).
          - Severe chronic lung disease، heart failure مقاوم، severe PVD، neuropathy بـ trophic ulcer.
          - Advanced liver disease.
          - Active infection أو active GN أو vasculitis.
          - Lower urinary tract مش بيتصلّح.
          - ==Positive CDC cross-match== وقت الزراعة.

          **Relative**: morbid obesity، atherosclerosis، قلب، HTN مش منضبط، تدخين، مشاكل نفسية، systemic disease نشط (lupus، sickle cell).
      - kind: sort
        page: 320
        quote: "Relative contraindications: morbid obesity, atherosclerosis, cardiac disease, uncontrolled hypertension, smoking"
        prompt: "Absolute ولا relative؟"
        bins: ["Absolute", "Relative"]
        cards:
          - { text: "Positive CDC cross-match", bin: 0 }
          - { text: "Active infection", bin: 0 }
          - { text: "Advanced liver disease", bin: 0 }
          - { text: "Smoking", bin: 1 }
          - { text: "Morbid obesity", bin: 1 }
          - { text: "Uncontrolled hypertension", bin: 1 }
        why: "الـ absolute: CDC موجب، عدوى نشطة، كبد متقدم، سرطان نشط، قلب أو رئة متقدمة. الـ relative حاجات ممكن تتظبط: تدخين، وزن، ضغط."
      - kind: explain
        page: 321
        title: "الأمراض اللي بترجع"
        quote: "Focal segmental glomerulosclerosis (FSG), membranous nephropathy (MN), IGA nephropathy and vasculitis"
        text: |
          بترجع في الكلية الجديدة: ==FSGS==، membranous، **IgA**، vasculitis، IC-MPGN، و C3 glomerulopathy.

          ولازم تكون **هادية قبل الزراعة**: SLE، ANCA vasculitis، و antiphospholipid syndrome.

          **Urology (KDIGO 2020)**: اتأكد لو فيه urologic malignancy، UTI متكرر، voiding dysfunction، bladder augmentation، ileal conduit، أو حصوات. و **cystoscopy** للي عنده خطر bladder cancer (cyclophosphamide أو تدخين ≥30 pack-years).
      - kind: mnemonic
        page: 321
        quote: "Focal segmental glomerulosclerosis (FSG), membranous nephropathy (MN), IGA nephropathy and vasculitis"
        word: "FIMVC"
        parts:
          - { key: "F", text: "FSGS" }
          - { key: "I", text: "IgA nephropathy" }
          - { key: "M", text: "Membranous and MPGN (immune complex)" }
          - { key: "V", text: "Vasculitis" }
          - { key: "C", text: "C3 glomerulopathy" }
        hook: |
          "**F**ine, **I** **M**ay **V**isit **C**airo": الأمراض دي بتزور الكلية الجديدة تاني.
      - kind: explain
        page: 322
        title: "أنواع المتبرعين"
        quote: "Commercially motivated (the latter is forbidden)."
        text: |
          **Living**: قريب بالدم، أو غير قريب بدافع عاطفي. أما ==commercially motivated فممنوع==.

          **Cadaveric**: beating heart (brain-stem death) أو non-beating heart.

          الـ living donor مميزاته: **متاح فورًا**، ==cold ischaemia قصير==، ووظيفة الكلية ممتازة. والـ living unrelated بيعيش زي الـ cadaver اللي HLA بتاعه متطابق تمامًا.

          المتبرع لازم يكون سليم من أي حاجة تأذيه (سمنة شديدة، prediabetes، تاريخ عائلي لمرض كلى وراثي). على المدى البعيد ممكن hyperfiltration: HTN، proteinuria، FSGS.
      - kind: explain
        page: 323
        title: "فحص المتبرع الحي"
        quote: "GFRof 90mL/minper1.73m2 or greater should be considered acceptable level of kidney function for donation"
        text: |
          - **GFR**: eGFR وتأكيد بـ measured GFR (مثلًا 99mTc-DTPA) أو CrCl أو creatinine + cystatin C. المقبول ==90 mL/min/1.73 m² أو أكتر== (KDIGO 2017).
          - **Albuminuria**: ACR وتأكيد بـ AER.
          - Microscopic haematuria مستمرة؟ دوّر على السبب. حصوات؟ gout؟
          - **BP** مرتين على الأقل.
          - BMI، سكر (شخصي و gestational وعائلي)، fasting glucose أو HbA1c، lipids، تدخين.
          - **Infections**: HIV، HBV، HCV، CMV، EBV، syphilis، UTI.
          - Cancer screening، تاريخ عائلي لمرض كلى، **β-hCG** قبل التبرع على طول، وتقييم نفسي وجهًا لوجه.
      - kind: check
        page: 325
        quote: "In general the left kidney should be procured because of the relative technical ease associated with a longer venous pedicle"
        question: "Which donor kidney is usually taken, and why?"
        options:
          - "Left: longer renal vein"
          - "Right: easier to reach"
          - "The smaller one"
          - "Always the one with two arteries"
        answer: 0
        why:
          - "صح: الـ left renal vein أطول، فالعملية أسهل. الـ right لو فيه مشكلة vascular أو urological."
          - "الـ right vein قصير، وده بيصعّب الزراعة."
          - "الكتاب ما قالش كده."
          - "الشرايين الكتير بتصعّب، مش بتسهّل."
      - kind: aside
        tone: tip
        page: 325
        quote: "Perform annual postdonation follow-up care including"
        text: |
          المتبرع ما بيتنساش بعد العملية: ==annual postdonation follow-up== (BP، BMI، creatinine و eGFR، albuminuria، ونمط حياة صحي). والجراحة: mini-open أو laparoscopic أو hand-assisted، بجراح متمرّس.
      - kind: try
        items: [neph.L09.113, neph.L09.118, neph.L09.123, neph.L09.128, neph.L09.130]
