        page: 137
        quote: "Treatment of PMR\n  Prednisone 15 mg.\n  Slow taper over 12 to 18 months.\n  Possible mtx use as 2nd line agent.\n  GIOP prophylaxis.\n  Look for temporal arteritis.\n  Concept of benign outcome challengeable."
