        quote: "Advantages and disadvantages of case-control studies\n| Advantages | Disadvantages |\n|---|---|\n| Cheap, easy and quick studies | Subject to bias (selection, recall, misclassification) |\n| Multiple exposures can be examined | Direct incidence estimation is not possible |\n| Rare diseases and diseases with long latency can be studied | Temporal relationship is not clear |\n| Suitable when randomization is unethical (e.g., alcohol and pregnancy outcome) | Multiple outcomes cannot be studied |\n| | If the incidence of exposure is high, it is difficult to show the difference between cases and controls |\n| | Relative and attributable risk cannot be estimated |"
