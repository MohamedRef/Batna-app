    goals:
      - "تشخّص الـ β-thalassaemia minor من الـ indices وتفرقها عن نقص الحديد"
      - "ترتّب الـ α-thalassaemias حسب عدد الجينات وتعرف ليه كل درجة شكلها كده"
      - "تعرف الـ thalassaemia intermedia ومين محتاج نقل"
    status: unverified
    steps:
      - kind: explain
        page: 26
        title: "β-thalassaemia minor"
        quote: "Laboratory features: Haemoglobin level is either normal or mildly decreased and is generally not less than 9 gms/dl."
        text: |
          الـ ==carrier state== (heterozygous): anaemia قليلة أو مفيش، بس شكل الكرات متغير جدًا.

          - غالبًا **asymptomatic**، بس ممكن تظهر الأنيميا في **العدوى** أو **الحمل**.
          - Hb طبيعي أو قليل شوية، ==مش أقل من 9 g/dL== غالبًا.
          - **Mean corpuscular volume (MCV) و mean corpuscular haemoglobin (MCH) قليلين**، بس ==red blood cell (RBC) count عالي==.
          - الـ reticulocytes والـ bilirubin عاليين شوية.
      - kind: aside
        tone: exam
        page: 26
        quote: "Red blood cells characteristically show reduced MCV and reduced MCH.. Red cell count is increased."
        text: "الفخ المشهور: microcytic hypochromic زي الـ **iron deficiency**. الفرق في الكتاب: الـ thalassaemia minor ==RBC count عالي== والأنيميا خفيفة، أما نقص الحديد فالـ RBC count قليل. وطبعًا الـ ferritin هيفصل."
      - kind: reveal
        page: 25
        quote: "This is the heterozygous carrier state of"
        prompt: "الـ carrier عنده جين β واحد سليم. ليه الـ RBC count عنده أعلى من الطبيعي؟"
        answer: |
          الـ **heterozygous carrier** عنده جين سليم. التفسير المقبول (مش في الكتاب): الجين السليم بيعمل نص الـ β تقريبًا، فكل كرة فيها Hb أقل (**MCV و MCH قليلين**). النخاع بيعوّض بإنه يطلّع **كرات أكتر وأصغر**، فالـ ==RBC count يعلى== والـ Hb الكلي يفضل قريب من الطبيعي.

          ده بالظبط اللي بيفرّقه عن نقص الحديد: في نقص الحديد المصنع ناقصه خامة، فبيطلّع كرات أقل **وأصغر**، والـ RBC count بينزل.
      - kind: explain
        page: 26
        title: "α-thalassaemia: عدّ الجينات"
        quote: "Human have four α globin genes, two on each chromosome no. 16"
        text: |
          عندنا ==4 جينات α==: اتنين على كل **chromosome 16**. التفسير المقبول (مش في الكتاب): كل جين بيعمل حوالي ربع الـ α، عشان كده كل ما جين يروح، المرض يزيد درجة:
          - **3 شغالين** (-α/αα): **silent**؛ indices طبيعية أو MCV/MCH أقل شوية.
          - **2 شغالين** (--/αα أو -α/-α): **α trait**؛ asymptomatic، anaemia خفيفة جدًا، microcytic.
          - **1 شغال** (--/-α): ==Haemoglobin H (HbH) disease==.
          - **0** (--/--): ==Hb Bart's hydrops fetalis==، قاتل.

          وليه الـ α أخطر من الـ β في الجنين؟ التفسير المقبول (مش في الكتاب): عشان الـ α داخلة في **كل** الـ Hb، حتى الـ HbF بتاع الجنين (α2γ2). أما الـ β فما بتبانش إلا بعد الولادة لما الـ adult haemoglobin يحل محل الـ HbF.
      - kind: figure
        page: 27
        quote: "Hb H disease most commonly develops when both α0 and α+ thalassaemias are inherited (--/-α) i.e. there is deletion of 3α genes."
        title: "سلّم الـ α-thalassaemia"
        alt: "A ladder of five rows with four gene boxes each: four filled is normal; three filled is silent alpha+ thalassaemia; two filled is alpha thalassaemia trait; one filled is HbH disease with beta-4 tetramers; none filled is Hb Bart's hydrops fetalis with gamma-4 tetramers, lethal."
        caption: "كل ما تنزل درجة، جين بيقع. في الـ **HbH** الـ β الزيادة بتعمل **β4**، وفي الـ **Bart's** الجنين ما عندوش α خالص فالـ γ بتعمل **γ4**."
