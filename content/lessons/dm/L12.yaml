  - id: dm.L12.lesson6
    title: "أدوية السكر مع الكبد، والـ insulin الأأمن"
    hook: "دوا دوا: metformin لحد إمتى، الـ SU ليه بيطوّل، الـ pioglitazone للـ NASH، وليه الـ insulin هو الملك هنا."
    minutes: 7
    pages: [154, 160]
    topics: [cld-drugs, cld-insulin]
    goals:
      - "تعرف حدود الـ metformin والـ SU والـ pioglitazone في الـ CLD"
      - "تعرف الـ DPP-4i والـ GLP-1 RA والـ SGLT2i في الكبد"
      - "تعرف احتياج الـ insulin في الـ compensated والـ decompensated (سؤال الـ NAFLD)"
    status: unverified
    steps:
      - kind: explain
        page: 155
        title: "الـ metformin"
        quote: "the dose should be decreased to a maximum of 1500 mg daily"
        text: |
          الخطر: ==lactic acidosis== لو فيه tissue hypoxia أو comorbidities (كلى، كبد، قلب)، خصوصًا مع acute deterioration.

          - **Compensated** ← غالبًا آمن، بس ==max 1500 mg/day==.
          - **وقّفه** لو الكبد أو الكلى بيسوءوا، أو acute illness، أو decompensation.
          - **Contraindications**: creatinine ≥1.5 (رجالة) / ≥1.4 (ستات)، CrCl <30، hepatic impairment، CHF، والصبغة (ارجعله بعد 48 h والـ creatinine طبيعي).
      - kind: explain
        page: 155
        title: "الـ SU والـ pioglitazone"
        quote: "The liver metabolizes these drugs .So, their duration of action may be prolonged in patients with CLD."
        text: |
          - **SU**: الكبد بيكسّره (liver metabolizes) ← ==duration of action prolonged==. في الـ decompensated ==avoid== لأن الجسم مش قادر يقاوم الـ hypoglycemia.
          - **Pioglitazone**: ليه دور في **NAFLD/NASH** (insulin sensitivity، وبيحسّن الـ histology والـ biochemistry). بس avoid في الـ decompensated وأي hepatic impairment، وما تبدأوش لو **ALT >2.5 × ULN**.
      - kind: check
        page: 156
        quote: "Therapy should not be initiated if there is evidence of active liver disease or if the serum ALT level exceeds 2.5 times ULN."
        question: "Diabetic with NASH, ALT 3 × ULN. Start pioglitazone?"
        options:
          - "No: ALT exceeds 2.5 × ULN"
          - "Yes: it treats NASH"
          - "Yes, at double dose"
          - "Only with metformin 3 g"
        answer: 0
        why:
          - "صح: الكتاب بيقول ما تبدأش لو ALT >2.5 × ULN أو active liver disease."
          - "دوره في الـ NASH ما يلغيش الـ ALT limit."
          - "مفيش double dose."
          - "والـ metformin max 1500 في الـ CLD."
      - kind: explain
        page: 156
        title: "الـ DPP-4i والـ GLP-1 RA والـ SGLT2i"
        quote: "no dose recommendation is available for patients with advanced cirrhosis"
        text: |
          - **DPP-4i**: mild–moderate HI ← no dose adjustment. ==Severe== ← no recommendation، caution (الـ linagliptin biliary ← unknown).
          - **GLP-1 RA**: appetite ↓، gastric emptying أبطأ، وزن ↓، قلب أحسن، وتأثير على الكبد. الـ ==liraglutide== ممكن يحسّن الـ NASH histology والـ fibrosis. بس لسه بدري تستخدمه للـ NASH من غير سكر.
          - **SGLT2i**: شغال independent من الـ insulin. الـ cana والـ empa حسّنوا الـ steatosis (animal studies)، بيشيلوا الـ lipid overload ويقللوا الـ oxidative والـ inflammatory response.
      - kind: update
        page: 158
        quote: "It is still premature to consider these agents as a specific treatment for patients with NASH without diabetes, due to inadequate evidence."
        text: "من بعد الكتاب: الـ FDA وافقت (accelerated) على semaglutide 2.4 mg للـ MASH مع fibrosis F2–F3، بسكر أو من غيره. في الامتحان: كلام الكتاب (premature)."
