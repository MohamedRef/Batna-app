          </svg>
      - kind: mnemonic
        page: 53
        quote: "Other antibodies may form immune complexes in the circulation and the complexes are subsequently deposited in tissues (blood vessels) and cause injury. Immune complex diseases are called type III hypersensitivity."
        word: "ACID"
        hook: "الأربع أنواع بالترتيب «ACID»: الحساسية زي الحمض، بتحرق الأنسجة."
        parts:
          - { key: "A", text: "Anaphylactic / Allergic (type I, IgE)" }
          - { key: "C", text: "Cytotoxic (type II, antibody on cells)" }
          - { key: "I", text: "Immune complex (type III)" }
          - { key: "D", text: "Delayed (type IV, T cells)" }
      - kind: explain
        page: 53
        quote: "Other antibodies may form immune complexes in the circulation and the complexes are subsequently deposited in tissues (blood vessels) and cause injury. Immune complex diseases are called type III hypersensitivity."
        title: "Type II ولا III؟ الفرق في مكان الـ antigen"
        text: |
          الاتنين IgG أو IgM، فإزاي تفرّقهم؟ اسأل: **الـ antigen فين؟**

          - **Type II**: الـ antigen **ثابت** على سطح خلية معينة أو في الـ ==ECM==. الـ antibody بيروح له مكانه، فالضرر في **النسيج ده بس** (كرات الدم الحمرا في الـ haemolysis مثلًا).
          - **Type III**: الـ antigen **سايب في الدم** (soluble)، بيعمل مع الـ antibody ==immune complexes== بتلف وتترسب في **الأوعية** في أي حتة.

          عشان كده type II بيعمل مرض في عضو واحد غالبًا، و type III بيعمل vasculitis و arthritis و nephritis مع بعض (صفحة 65).
      - kind: table
        page: 53
        quote: "Classification of Immunologic Diseases"
        title: "Classification of immunologic diseases"
        columns: ["Type", "Via", "Injury by"]
        rows:
          - ["I", "IgE", "Mast cell mediators"]
          - ["II", "IgG, IgM on cells/ECM", "Opsonization, complement, Fc receptors"]
          - ["III", "Immune complexes", "Complement, neutrophils"]
          - ["IV", "CD4 / CD8 T cells", "Macrophages, cytokines, cell killing"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: check
        page: 53
        quote: "Tissue injury may be due to T lymphocytes that activate the effect or mechanisms of delayed-type hypersensitivity or directly kill target cells such conditions are called type IV hypersensitivity disorders."
        question: "Which type is caused by T lymphocytes rather than antibodies?"
        options: ["Type IV", "Type I", "Type II", "Type III"]
        answer: 0
        why:
          - "صح: type IV هو الوحيد الـ cell mediated."
          - "Type I = IgE والـ mast cells."
          - "Type II = immunoglobulin G (IgG)/IgM على سطح الخلية."
          - "Type III = immune complexes."
      - kind: aside
        tone: joke
        page: 52
        quote: "Disorders caused by immune responses are called hypersensitivity diseases."
        text: "الجهاز المناعي في الـ hypersensitivity زي الأم المصرية: نيتها خير ١٠٠٪، بس لما تخاف عليك زيادة، اللي بيتأذي هو إنت."
      - kind: try
        items: [rheum.L03.002, rheum.L03.003, rheum.L03.007, rheum.L03.009, rheum.L03.012]
    recap:
      - "Hypersensitivity = immune response زيادة (exaggerated) أو غلط (inappropriate) بتعمل tissue damage."
      - "Triggers: infection مش بتتشال (TB)، حاجة بريئة (pollen)، autoantigen (DNA في SLE)."
      - "ACID: I anaphylactic، II cytotoxic، III immune complex، IV delayed."
      - "I-III antibody mediated، IV cell mediated. II = antigen ثابت على خلية، III = antigen soluble بيعمل complexes."
    practice: [rheum.L03.001, rheum.L03.002, rheum.L03.003, rheum.L03.004, rheum.L03.005, rheum.L03.006, rheum.L03.007, rheum.L03.008, rheum.L03.009, rheum.L03.010, rheum.L03.011, rheum.L03.012, rheum.L03.013, rheum.L03.014]
  # ------------------------------------------------------------------
  - id: rheum.L03.lesson2
    title: "Type I: الـ mast cell المتسلّح"
    hook: "أول مرة الجسم بيشوف الـ pollen بيسلّح الـ mast cells بس. التانية بيضغط على الزناد."
    minutes: 9
    pages: [54, 57]
    topics: [type1, mediators]
    goals:
      - "ترتّب مراحل الـ sensitization والـ effector stage، وتعرف ليه أول مرة مفيش أعراض"
      - "تعرف الـ mediators وتفسّر كل عرض بالـ mediator بتاعه"
      - "تفرّق بين الـ immediate والـ late-phase reaction"
    status: unverified
    steps:
      - kind: explain
        page: 54
        quote: "The most prevalent type of hypersensitivity disease."
        title: "أشهر نوع"
        text: |
          ==Type I== هو **أشهر** نوع hypersensitivity.

          - الـ allergen بيعمل **humoral Immunoglobulin E (IgE) response**.
          - أول تعرّض: الجسم يعمل **specific IgE**.
          - الـ IgE يقعد على **high-affinity FcεRI** على الـ ==mast cells والـ basophils==.
          - التعرّض اللي بعده: الـ allergen يعمل **cross-linking** للـ IgE ← الحبيبات تتفرّغ.
          - التأثير ممكن **localized** أو **systemic**.

          التفسير المقبول (مش في الكتاب): ليه أول تعرّض مابيعملش حاجة؟ عشان الجسم لسه بيعمل الـ IgE ويحطه على الـ mast cells (الـ sensitization). يعني أول مرة تحميل للسلاح، والمرة التانية الضرب. وعشان الـ IgE قاعد جاهز على الخلية، التعرّض التاني بيعمل رد فعل في **دقايق**، وده سبب إن الـ anaphylaxis بتيجي بسرعة كده.
      - kind: explain
        page: 54
        quote: "On first exposure to the allergen, an individual produces specific IgE."
        title: "ليه أول مرة بتعدّي على خير؟"
        text: |
          الكتاب بيقسّم الحكاية لمرتين:

          - **أول تعرّض**: الجسم بيعمل **specific IgE** بس. الـ IgE ده بيروح يقعد على الـ ==FcεRI== على الـ mast cells والـ basophils، وبيستنى. مفيش أعراض لأن مفيش حاجة اتفرزت لسه.
          - **التعرّض اللي بعده**: الـ allergen بيمسك **اتنين IgE جنب بعض** (cross-linking)، وده الزناد اللي بيفرّغ الحبيبات.

          التفسير المقبول (مش في الكتاب) للتشبيه: أول مرة الـ mast cell **بيتعمّر** زي المسدس، والمرة التانية **بيضرب**. عشان كده الحساسية لأي حاجة محتاجة إنك تكون اتعرضت لها قبل كده، حتى لو مش فاكر.
      - kind: order
        page: 55
        quote: "Sensitization stage: initiated when an allergen penetrates a skin or mucosal barrier, is collected by an immature DC or other APC in the immediate vicinity and is conveyed to local LN."
        prompt: "رتّب مراحل الـ sensitization والـ effector:"
        steps:
          - "Allergen crosses skin or mucosa"
          - "Immature DC collects it and carries it to the lymph node"
          - "Mature DC presents it to a naive Th cell"
          - "Allergen-specific B cells activated, IgE made"
          - "IgE arms mast cells"
          - "Second exposure triggers the effector stage"
        why: "ده صفحة 55: sensitization الأول (DC ← lymph node ← Th و B)، والـ effector stage بس لو الـ allergen رجع والـ mast cells لسه متسلّحة."
      - kind: explain
        page: 55
        quote: "Modified TH2 response (figure): a dendritic cell presents MHC-peptide to a TH0 cell, which becomes a TH2 helper cell and a TH2 effector cell (IL-5 etc. → eosinophils). B cells switch (Bμδ → Bγ4 → Bε); IL-4 from the TH2 cell drives the switch to Bγ4 and Bε. IL-10 promotes IgG4 (+) and inhibits IgE (−). IgE arms the mast cell, which releases leukotrienes, histamine, and IL-4, IL-5, TNFα → eosinophils."
        title: "الـ Th2 response"
        text: |
          في رسمة صفحة 55:

          - الـ Th2 بيفرز ==IL-4== ← الـ B cell تعمل switch لـ **IgE**.
          - الـ **IL-10** بيوجّه ناحية **immunoglobulin G subclass 4 (IgG4)** وبيقفل الـ IgE.
          - الـ mast cell بتطلّع **leukotrienes** و **histamine** و IL-4 و IL-5 و TNF-α اللي بيجيبوا **eosinophils**.

          التفسير المقبول (مش في الكتاب): ليه الـ IL-4 مهم؟ عشان هو المفتاح اللي بيحوّل الـ B cell من IgG لـ IgE، يعني من غيره مفيش سلاح للـ allergy. وعشان كده الـ IL-10 والـ IgG4 هما الفرامل: الـ IgG4 بيمسك الـ allergen قبل ما يوصل للـ IgE. وده نفس منطق الـ immunotherapy في صفحة 60: بتعلّم الجسم يعمل IgG4 بدل IgE.
      - kind: figure
        page: 55
        title: "الـ Th2 response في رسمة الكتاب"
        image: { file: rheum/L03-th2-response.webp, book: true }
        alt: "Diagram titled Modified TH2 response. Top: a dendritic cell presents MHC-peptide to a TH0 cell, which becomes a TH2 helper cell and a TH2 effector cell that releases IL-5 and recruits eosinophils. Middle: a B cell switches through B mu delta to B gamma 4 and B epsilon; green IL-4 arrows from the helper cell drive both switches. IL-10 promotes IgG4 (green plus) and blocks IgE (red minus). Bottom: IgE binds a mast cell, which releases leukotrienes, histamine, and IL-4, IL-5 and TNF-alpha that bring eosinophils."
        caption: |
          رسمة الكتاب في صفحة 55 (**Modified Th2 response**)، من فوق لتحت:

          - **فوق شمال**: الـ dendritic cell بتعرض الـ antigen (MHC-peptide) على Th0 ← يبقى **Th2 helper** ← و **Th2 effector** (فوق يمين) بيطلّع IL-5 وبيجيب الـ eosinophils.
          - **في النص**: الـ B cell بتتحوّل خطوة خطوة (Bμδ ← Bγ4 ← Bε)، والسهمين الخضر التخان هما ==IL-4== اللي بيدفع الـ switch.
          - **تحت الـ B cells**: الـ **IL-10** عليه علامة خضرا (+) ناحية **IgG4**، وعلامة حمرا (−) ناحية **IgE**، يعني بيشجّع الأولاني ويقفل التاني.
          - **تحت خالص**: الـ IgE بيقعد على الـ **mast cell**، فتطلّع leukotrienes و histamine و IL-4 و IL-5 و TNF-α ← eosinophils.

          يعني الـ allergy محتاجة الـ Th2 والـ IL-4 عشان يتعمل IgE من الأول، وده الـ ==sensitization stage==.
      - kind: figure
        page: 56
        quote: "Activation of mast cells by IgE produced by plasma cells binds via Fc domain to receptors on mast cell -cross linking of these receptors by Ag causing influx of calcium ions and degranulation of mast cells."
        title: "الـ mast cell بتنفجر إمتى؟"
        image: { file: rheum/L03-mast-cell-release.webp, book: true }
        alt: "Two panels. Left, Mast cell mediator release: triggering mechanisms are allergen plus specific IgE on the cell surface and direct triggers such as opiates, contrast media and vancomycin. Mediators leave in two groups: pre-formed granule mediators within 5 minutes (histamine, heparin, tryptase) and newly generated arachidonic acid products within 5 to 30 minutes (leukotriene D4, prostaglandin D2) and cytokines over hours (TNF-alpha, IL-4). Right: a large mast cell with IgE on Fc epsilon RI receptors; an antigen cross-links them, calcium enters, and an arrow shows degranulation."
        caption: |
          رسمة الكتاب في صفحة 56، جزئين:

          - **شمال (mast cell mediator release)**: طريقتين يشغّلوا الخلية: **allergen + specific IgE** (السهم الأخضر فوق)، و **direct triggers** من غير IgE زي الـ opiates والـ contrast media والـ vancomycin (السهم الأخضر يمين). وتحت الـ mediators على تلات مواعيد:
            - **pre-formed** في الحبيبات (خلال 5 دقايق): histamine و heparin و tryptase.
            - **newly generated** من الـ arachidonic acid (5-30 دقيقة): leukotriene D4 و prostaglandin D2.
            - **cytokines** (ساعات): TNF-α و IL-4.
          - **يمين**: الـ IgE قاعد على الـ **FcεRI receptors**، والـ antigen بيربط اتنين ببعض (==cross-linking==)، فيدخل **Ca²⁺** (السهم في النص) ويحصل ==degranulation== (السهم تحت).

          يعني الـ cross-linking هو الزرار، والـ calcium هو اللي بيفضّي الحبيبات.
      - kind: explain
        page: 56
        quote: "Activation of mast cells by IgE produced by plasma cells binds via Fc domain to receptors on mast cell -cross linking of these receptors by Ag causing influx of calcium ions and degranulation of mast cells."
        title: "فسّر كل عرض بالـ mediator بتاعه"
        text: |
          جدول الحبيبات في صفحة 56 بيشرح الأعراض اللي بتشوفها في العيادة:

          - **Histamine**: increased capillary permeability ← ==وَرَم== و wheals؛ vasodilation ← احمرار؛ smooth muscle contraction ← ضيق الشُّعب والمغص.
          - **Leukotrienes و prostaglandins** (secondary، بتتصنع جديد): نفس الـ vasodilation والـ smooth muscle contraction، وكمان **mucus** و chemotaxis للـ neutrophils.
          - **Bradykinin**: بيحفّز **pain nerve endings** ← الألم.
          - **Eosinophil و neutrophil chemotactic factors**: بينادوا الخلايا ← دي بداية الـ late phase.

          والزناد كله: ==calcium influx== جوه الـ mast cell بعد الـ cross-linking، ويليه الـ degranulation.
      - kind: table
        page: 56
