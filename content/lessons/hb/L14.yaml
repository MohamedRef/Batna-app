  # ------------------------------------------------------------------
  - id: hb.L14.lesson1
    title: "القلب والكبد: جيران بيتخانقوا"
    hook: "القلب لما يتعب الكبد يتخنق، والكبد لما يتليّف القلب يتعب. نفهم الاتجاهين."
    minutes: 8
    pages: [252, 256]
    topics: [overview, heart]
    goals:
      - "تعرف إمتى تلوم مرض systemic على LFTs بايظة"
      - "تفرّق hypoxic من congestive hepatopathy"
      - "تعرّف الـ cirrhotic cardiomyopathy وتعدّ الـ criteria"
    status: unverified
    steps:
      - kind: explain
        page: 252
        title: "الكبد ضحية أمراض غيره"
        text: |
          الأسباب المعتادة لـ LFTs بايظة: viral، alcohol، NAFLD، autoimmune، hereditary، malignancy أو infection، gallstones، و DILI.

          بس الكبد ممكن يتأذي من **systemic diseases** أساسها في أعضاء تانية. فلو الـ **screening serology** والـ **imaging** مطلعوش سبب، والمريض عنده systemic disease، يبقى غالبًا **هي** السبب، و **تعالج الـ systemic disease الأول**.

          الكتاب بيعدّ **6 مجموعات**: cardiovascular، collagen vascular، hematolymphoid، systemic infection و sepsis، chronic IBD، و granuloma formation.
      - kind: mnemonic
        page: 252
        word: "CHIC GI"
        parts:
          - { key: "C", text: "Cardiovascular diseases" }
          - { key: "H", text: "Hematolymphoid diseases" }
          - { key: "I", text: "Infection and sepsis" }
          - { key: "C", text: "Collagen vascular diseases" }
          - { key: "G", text: "Granuloma formation" }
          - { key: "I", text: "Inflammatory bowel disease" }
        hook: |
          الكبد **CHIC** ولابس **GI**: الـ 6 مجموعات اللي بتجرّه في أمراضها.
      - kind: explain
        page: 253
        title: "التلات اتجاهات"
        text: |
          - **القلب بيعمل مرض كبد:** heart failure → **hypoxic hepatopathy** و **congestive hepatopathy**.
          - **الكبد بيعمل مرض قلب:** cirrhosis → **cirrhotic cardiomyopathy**؛ و NAFLD → cardiovascular disease و ventricular dysfunction.
          - **حاجات بتضرب الاتنين:** chronic alcoholism، infections (HCV، HIV، CMV، malaria، dengue، amebiasis، sepsis)، و systemic diseases (sarcoidosis، SLE، Graves، **hemochromatosis**، Wilson، **amyloidosis**).
      - kind: figure
        page: 254
        title: "Forward ولا backward؟"
        alt: "Two stacked panels. Top, acute heart failure: forward failure, arterial inflow to the liver drops sharply, causing hypoxic hepatopathy with a transaminase spike. Bottom, chronic heart failure: backward failure, raised systemic venous pressure congests the hepatic veins, causing congestive hepatopathy with a cholestatic pattern of raised GGT, ALP and bilirubin."
        caption: "فوق: **acute HF**: الدم الداخل بيقل → **hypoxic**. تحت: **chronic HF**: الدم الخارج متزنّق → **congestive**، والـ labs **cholestatic**."
        svg: |
          <svg viewBox="0 0 330 470" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L14a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
              <marker id="L14b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="5" y="6" width="320" height="214" rx="8" class="fg-bad"/>
            <text x="14" y="28" class="t-b t-bad">Acute HF: forward failure</text>
            <path d="M120 70q50-30 110-6q24 18 0 40q-60 26-110 6q-24-18 0-40z" class="fg-box"/>
            <text x="175" y="92" text-anchor="middle" class="t-sm t-b">Liver</text>
            <path d="M150 156v-30" class="fg-arrow-bad" style="stroke-width:1.2;stroke-dasharray:3 3" marker-end="url(#L14a)"/>
            <text x="138" y="146" text-anchor="end" class="t-sm">Arterial inflow</text>
            <text x="138" y="160" text-anchor="end" class="t-sm t-bad t-b">↓↓↓</text>
            <text x="14" y="184" class="t-sm t-b">→ Hypoxic hepatopathy: transaminases spike</text>
            <text x="14" y="196" class="t-sm t-mut">Hypoperfusion predominates in acute HF</text>
            <rect x="5" y="236" width="320" height="226" rx="8" class="fg-acc"/>
            <text x="14" y="258" class="t-b t-acc">Chronic HF: backward failure</text>
            <path d="M150 266v20" class="fg-arrow-acc" marker-end="url(#L14b)"/>
            <path d="M200 266v20" class="fg-arrow-acc" marker-end="url(#L14b)"/>
            <text x="214" y="284" class="t-sm">blood backs up</text>
            <path d="M120 300q50-30 110-6q24 18 0 40q-60 26-110 6q-24-18 0-40z" class="fg-box"/>
            <text x="175" y="322" text-anchor="middle" class="t-sm t-b">Liver</text>
            <text x="14" y="278" class="t-sm">Venous</text>
            <text x="14" y="292" class="t-sm">pressure ↑</text>
            <text x="14" y="376" class="t-sm t-b">Congestive hepatopathy</text>
            <text x="14" y="394" class="t-sm">Cholestatic: GGT, ALP, bilirubin ↑</text>
            <text x="14" y="410" class="t-sm">Transaminases normal or moderate</text>
            <text x="14" y="436" class="t-sm t-mut">Hepatojugular reflux · pulsatile liver</text>
            <text x="14" y="452" class="t-sm t-mut">Often asymptomatic</text>
          </svg>
      - kind: explain
        page: 255
        title: "الـ congestive hepatopathy"
        text: |
          الـ mechanisms الأساسية: **reduced arterial perfusion** (forward failure: hypoxic) اللي بتزيد مع الـ hypoxia، و **passive congestion** (backward failure: congestive) من الـ **systemic venous pressure** العالي.

          الـ congestive hepatopathy **غالبًا asymptomatic**، وأحيانًا: jaundice، ascites، **hepatomegaly مع hepatojugular reflux**، و **pulsatile liver**.

          الـ labs **cholestatic** أساسًا (GGT، ALP، bilirubin)، والـ transaminases **normal أو moderate**، **إلا لو** فيه forward component شديد معاها.
      - kind: check
        page: 255
        question: "A man with long-standing heart failure has tender hepatomegaly, hepatojugular reflux and raised GGT, ALP and bilirubin; transaminases are near normal. What is the likely mechanism?"
        options:
          - "Passive congestion (backward failure)"
          - "Acute arterial hypoperfusion (forward failure)"
          - "Cirrhotic cardiomyopathy"
          - "Drug-induced autoimmune hepatitis"
        answer: 0
        why:
          - "صح: chronic HF + pattern **cholestatic** + hepatojugular reflux = **congestive hepatopathy**."
          - "الـ forward failure بيعمل **transaminase spike** في الـ **acute** HF."
          - "دي عكس الاتجاه: الكبد هو اللي بيأذي القلب."
          - "مفيش drug ولا pattern hepatocellular هنا."
      - kind: explain
        page: 256
        title: "الـ cirrhotic cardiomyopathy"
        text: |
          الـ cirrhosis بتأثر على القلب **حتى من غير** مرض قلب تاني: systolic و diastolic dysfunction و electrophysiological abnormalities.

          **التعريف:** clinical syndrome في الـ cirrhosis فيه **abnormal, blunted response** للـ stress (physiologic أو pathologic أو pharmacologic)، بس الـ **cardiac output والـ contractility at rest normal أو زيادة**.

          - لحد **50%** من اللي بيعملوا transplant عندهم cardiac dysfunction، و **7–21%** من الوفيات بعد الـ OLT من **overt heart failure**.

          **الـ criteria:**

          1. **Systolic dysfunction:** blunted زيادة في الـ cardiac output مع exercise أو volume أو drugs، و/أو **resting LVEF < 55%**.
          2. **Diastolic dysfunction.**
          3. **Supportive:** electrophysiological abnormalities، abnormal chronotropic response، electromechanical dyssynchrony، **prolonged QT**، enlarged LA، increased myocardial mass، **BNP** و **troponins** مرتفعين.
      - kind: aside
        tone: analogy
        page: 256
        text: |
          الـ cirrhotic cardiomyopathy زي **عربية قديمة** شغّالة كويس في الركنة (**normal at rest**)، بس أول ما تدوس بنزين على الطريق الصحراوي (**stress**: exercise، نزيف، transplant) ما بتسحبش. علشان كده بتتكشف بعد الـ TIPS أو الـ transplant.
      - kind: check
        page: 256
        question: "Which finding is part of the systolic criterion for cirrhotic cardiomyopathy?"
        options:
          - "Resting LVEF < 55%"
          - "Prolonged QT interval"
          - "Raised BNP"
          - "Low cardiac output at rest"
        answer: 0
        why:
          - "صح: الـ systolic criterion = blunted response للـ stress و/أو **resting LVEF < 55%**."
          - "الـ prolonged QT من الـ **supportive** criteria."
          - "الـ BNP برضه **supportive**."
          - "بالعكس: الـ cardiac output at rest **normal أو زيادة**."
      - kind: try
        items: [hb.L14.003, hb.L14.004, hb.L14.007, hb.L14.010]
    recap:
      - "لو مفيش سبب واضح للـ LFTs والمريض عنده systemic disease، عالج الـ systemic disease الأول. الـ 6 مجموعات: **CHIC GI**."
      - "Acute HF → forward failure → hypoxic hepatopathy (transaminases)."
      - "Chronic HF → backward failure → congestive hepatopathy (cholestatic pattern، hepatojugular reflux، pulsatile liver)."
      - "Cirrhotic cardiomyopathy: normal at rest بس blunted مع الـ stress. Systolic (LVEF < 55%) + diastolic + supportive."
    practice: [hb.L14.001, hb.L14.002, hb.L14.003, hb.L14.004, hb.L14.005, hb.L14.006, hb.L14.007, hb.L14.008, hb.L14.009, hb.L14.010, hb.L14.011, hb.L14.012, hb.L14.095, hb.L14.097, hb.L14.118]

