            <rect x="10" y="240" width="310" height="70" rx="8" class="fg-thin"/>
            <text x="20" y="262" class="t-sm">CT: T accuracy 64%, N sensitivity 24-43%</text>
            <text x="20" y="282" class="t-sm">CT finds about 85% of abdominal mets</text>
            <text x="20" y="300" class="t-sm">EUS sees each layer of the gastric wall</text>
            <rect x="10" y="320" width="310" height="70" rx="8" class="fg-thin"/>
