  - id: git.L03.lesson4
    title: "تكريع، ترجيع، و rumination"
    hook: "مش كل تكريع زي بعض، ومش كل حاجة طالعة من البُق تبقى vomiting. هنفرّق بالآلية."
    minutes: 10
    pages: [106, 113]
    topics: [belching, nausea-vomiting]
    goals:
      - "تفرّق supragastric عن gastric belching بالآلية وبالـ impedance"
      - "تعرّف nausea و vomiting و retching و rumination"
      - "تعرف criteria الـ CNVS و CHS وعلاج CVS"
      - "تعرف functional vomiting و rumination و chronic idiopathic nausea وعلاجهم"
    status: unverified
    steps:
      - kind: explain
        page: 106
        quote: "There are two different types of belching: supragastric belching and gastric belching."
        title: "التكريع الطبيعي والزيادة"
        text: |
          الـ **belching (eructation)**: هوا بيطلع فجأة من المريء للـ pharynx، بصوت أو من غير صوت.

          وهو **physiologic**: بيحصل لحد ==30 times a day==. بيبقى مشكلة لما يتكرر ويأثر على اليوم والـ quality of life.

          وفيه نوعين: ==supragastric== و **gastric**.
      - kind: figure
        page: 106
        quote: "In air suction, patients subconsciously contract the skeletal muscle part in the diaphragm which results in negative pressure in the esophagus."
        title: "الهوا جاي منين؟"
        alt: "Two panels. Left, supragastric belching: the diaphragm contracts, pressure in the esophagus becomes negative, the upper sphincter opens and air rushes down into the esophagus, then is pushed straight back out; the lower sphincter stays shut so air never reaches the stomach. Right, gastric belching: swallowed air distends the stomach, a transient lower esophageal sphincter relaxation opens the sphincter and the gas vents upward; this is physiological, about 30 times a day."
        caption: "الـ supragastric: الهوا بيدخل المريء ويطلع على طول ومش بيوصل المعدة. الـ gastric: الهوا جاي من المعدة نفسها عن طريق الـ TLESR."
        svg: |
          <svg viewBox="0 0 330 322" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03ba" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
              <marker id="L03bb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <text x="80" y="18" class="t-b t-acc" text-anchor="middle">Supragastric</text>
            <text x="80" y="36" class="t-sm t-mut" text-anchor="middle">pharynx</text>
            <rect x="65" y="44" width="30" height="112" rx="4" class="fg-box"/>
            <path d="M58 156H102" class="fg-ink" stroke-width="5"/>
            <text x="108" y="160" class="t-sm t-mut">LES shut</text>
            <path d="M20 140Q80 120 140 140" class="fg-thin"/>
            <ellipse cx="80" cy="192" rx="46" ry="26" class="fg-box"/>
            <text x="80" y="196" class="t-sm t-mut" text-anchor="middle">stomach</text>
            <path d="M75 48V118" class="fg-arrow-acc" marker-end="url(#L03ba)"/>
            <path d="M86 118V48" class="fg-arrow-bad" marker-end="url(#L03bb)"/>
            <text x="10" y="238" class="t-sm">1 Diaphragm contracts,</text>
            <text x="22" y="252" class="t-sm">negative pressure</text>
            <text x="10" y="268" class="t-sm t-acc">2 UES opens, air rushes in</text>
            <text x="10" y="284" class="t-sm t-bad">3 Air pushed straight out</text>
            <text x="10" y="300" class="t-sm t-mut">Never reaches the stomach</text>
            <path d="M165 10V310" class="fg-thin"/>
            <text x="250" y="18" class="t-b t-acc" text-anchor="middle">Gastric</text>
            <text x="250" y="36" class="t-sm t-mut" text-anchor="middle">pharynx</text>
            <rect x="235" y="44" width="30" height="112" rx="4" class="fg-box"/>
            <path d="M228 156H240M260 156H272" class="fg-ink" stroke-width="5"/>
            <text x="276" y="160" class="t-sm t-acc">TLESR</text>
            <ellipse cx="250" cy="192" rx="46" ry="26" class="fg-box"/>
            <ellipse cx="250" cy="178" rx="26" ry="10" class="fg-acc"/>
            <text x="250" y="182" class="t-sm" text-anchor="middle">gas</text>
            <path d="M250 166V50" class="fg-arrow-acc" marker-end="url(#L03ba)"/>
            <text x="178" y="238" class="t-sm">1 Swallowed air fills</text>
            <text x="190" y="252" class="t-sm">distends the stomach</text>
            <text x="178" y="268" class="t-sm t-acc">2 TLESR opens the LES</text>
            <text x="178" y="284" class="t-sm">3 Gas vents upward</text>
            <text x="178" y="300" class="t-sm t-mut">Physiological, ~30 a day</text>
          </svg>
      - kind: explain
        page: 106
        quote: "Supragastric belching is considered as an unintentional reaction to unpleasant feeling in the abdomen and/or retrosternal region"
        title: "الـ supragastric: سلوك من غير قصد"
        text: |
          الـ ==supragastric belching== **unintentional reaction** لإحساس مزعج في البطن أو ورا القص، وعلشان كده **مش بيحصل** في النوم أو الكلام أو لما المريض يتلهي.

          آليتين: **air suction** (الحجاب الحاجز بيعمل negative pressure، والـ UES يفتح، فالهوا يتشفط) و **air injection**.

          أما الـ ==gastric belching== فهو **gastric venting**: الـ TLESR بتطلّع الهوا اللي اتبلع علشان البطن ما تنتفخش، وبيزيد بعد الـ carbonated beverages.
      - kind: sort
        page: 108
        quote: "Criteria for diagnosis of supragastric belching is a rapid antegrade movement of gas (impedance of 1000 Ω)"
        prompt: "Supragastric ولا gastric؟"
        bins: ["Supragastric", "Gastric"]
        cards:
          - { text: "Air sucked in by diaphragm contraction", bin: 0 }
          - { text: "Stops during sleep, speech or distraction", bin: 0 }
          - { text: "Impedance: rapid antegrade gas, then retrograde expulsion", bin: 0 }
          - { text: "Released through TLESR", bin: 1 }
          - { text: "More after fizzy drinks", bin: 1 }
          - { text: "Impedance rise from the distal to the proximal channel", bin: 1 }
        why: "الـ supragastric الهوا **داخل** للمريء الأول (antegrade) وبعدين يطلع، والسلوك بيختفي لما المريض يتلهي. الـ gastric الهوا **طالع** من المعدة لفوق، فالـ impedance بتعلى من تحت لفوق."
      - kind: explain
        page: 108
        quote: "Psychoeducation is considered as the most effective strategy for treatment of supragastric belching"
        title: "التشخيص والعلاج"
        text: |
          - الأول **history and examination**: تتأكد مفيش red flags زي weight loss أو dysphagia.
          - ==Impedance monitoring== هو **the gold standard**، وهو اللي بيفرق النوعين.
          - الـ **PPIs** بتقلل التكريع في الـ GERD، غالبًا لأنها بتشيل الإحساس المزعج اللي بيشغّل الـ supragastric behavior.

          العلاج: ==psychoeducation== هو الأنجح، وهو **speech pathology** + **CBT**. والـ **baclofen** بس لو كل حاجة فشلت.

          والـ Rome IV بيطلب belching مزعج **more than 3 days a week**.
      - kind: table
        page: 109
        quote: "Retching - abdominal muscle contractions with laboured rhythmic respiration"
        title: "المصطلحات"
        columns: ["Term", "Meaning"]
        rows:
          - ["Nausea", "Painless, unpleasant, subjective feeling of wanting to vomit"]
          - ["Vomiting", "Forceful expulsion of gastric or intestinal contents"]
          - ["Retching", "Abdominal muscle contractions with laboured rhythmic respiration"]
          - ["Rumination", "Effortless regurgitation of recently eaten food, usually without nausea"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 109
        quote: "Relief of vomiting episodes by sustained cessation of cannabis use"
        title: "CNVS و CHS"
        text: |
          - **CNVS:** nausea مزعجة **at least 1 day per week** و/أو vomiting مرة أو أكتر في الأسبوع، بعد استبعاد self-induced vomiting و eating disorders و rumination والـ organic disease.
          - ==CHS== (cannabinoid hyperemesis): vomiting episodic شبه الـ CVS، **after prolonged use of cannabis**، و ==relief by sustained cessation==. وممكن معاه **pathologic bathing**: دش سخن طويل.

          والكل بالـ Rome rule: آخر 3 شهور، و onset من 6 شهور.
      - kind: case
        page: 110
        quote: "A triptan such as sumatriptan (a 5HT1 agonist) can be effective for acute migraine and for CVS."
        stem: "A 24-year-old has stereotyped bouts of vomiting lasting days, with well weeks between them. His mother has migraine. He has never used cannabis."
        steps:
          - question: "Gastric emptying is tested. What does the lecture say is found in a subset of CVS patients?"
            options: ["Accelerated emptying", "Delayed emptying in every patient", "Absent emptying (gastric outlet obstruction)", "Emptying is never abnormal"]
            answer: 0
            why: "الكتاب: في الـ CVS الـ gastric emptying ممكن يبقى **accelerated** في subset من المرضى، مش delayed. وطبعًا تعمل endoscopy و electrolytes و calcium و thyroid، وتفكّر في Addison."
          - question: "He presents at the start of a bout. Which drug can abort it?"
            options: ["Sumatriptan", "Metoclopramide long term", "Cannabis", "Loperamide"]
            answer: 0
            why: "الـ **triptan** (5HT1 agonist) بينفع للـ migraine وللـ CVS، خصوصًا مع family history لـ migraine. ولو النوبة جامدة: admission و IV fluids و IV antiemetics."
          - question: "Before giving a triptan, what must you check?"
            options: ["Ischemic heart disease, stroke or uncontrolled hypertension", "Liver enzymes only", "Stool culture", "H. pylori status"]
            answer: 0
            why: "الـ triptans بتعمل vasoconstriction، فخطر الـ vascular problems في IHD و ischemic stroke و uncontrolled hypertension."
      - kind: explain
        page: 111
        quote: "Habit reversal using a breathing technique to halt regurgitation can be easily taught to patients (diaphragmatic breathing) and can be curative."
        title: "Functional vomiting ولا rumination؟"
        text: |
          الـ **functional vomiting** نادر: vomiting **at least once per week** ومش cyclical.

          الـ ==rumination== حاجة تانية خالص: الأكل بيرجع للبُق، والمريض يتفّه أو يمضغه ويبلعه تاني. **no preceding retching** وغالبًا **no nausea**، والطعم ساعات حلو!

          آليتها: **habitual contraction** لعضلات البطن بتعلّي الضغط جوه المعدة فتزق الأكل لفوق. وهي **acquired habit**، علشان كده ==diaphragmatic breathing== ممكن يعالجها خالص.

          ولازم تسأل بلطف عن الـ body image والـ self-induced vomiting، لأن **bulimia** و **anorexia nervosa** محتاجين psychiatrist.
      - kind: sort
        page: 111
        quote: "There is no preceding retching and typically no nausea."
        prompt: "Rumination ولا vomiting؟"
        bins: ["Rumination", "Vomiting"]
        cards:
          - { text: "Effortless, with no retching", bin: 0 }
          - { text: "Food often tastes good and is re-swallowed", bin: 0 }
          - { text: "Cured by diaphragmatic breathing", bin: 0 }
          - { text: "Forceful expulsion", bin: 1 }
          - { text: "Preceded by nausea and retching", bin: 1 }
        why: "الـ rumination **effortless** ومن غير nausea، والأكل لسه طازة وطعمه كويس. الـ vomiting قوي، وقبله nausea و retching."
      - kind: explain
        page: 113
        quote: "It is particularly important to exclude gastroesophageal reflux in this setting, which is easily treated but may be overlooked."
        title: "Chronic idiopathic nausea"
        text: |
          الـ ==CIN==: nausea هي العرض الأساسي، **several times per week**، من غير organic cause. مختلفة عن الـ FD اللي فيها الألم أو أعراض الأكل هي الغالبة.

          - أهم حاجة تستبعد **GERD**: ممكن يكون من غير heartburn خالص، والـ pH testing بيشخّصه.
          - EGD تستبعد السبب الـ structural، و gastric scintigraphy للـ **gastroparesis**.
          - الـ H. pylori **مش سبب رئيسي** للـ nausea، بس علاجه لو موجود مش غلط.

          العلاج: ابدأ بـ ==domperidone== (antinausea + prokinetic). Metoclopramide بديل بس الـ side effects بتحدّه. TCAs، prochlorperazine أو promethazine، والـ ondansetron غالي فبيتساب للـ refractory.
      - kind: check
        page: 113
        quote: "A prokinetic drug such as domperidone is worth trying initially; it has antinausea as well as prokinetic properties."
        question: "Chronic idiopathic nausea: normal EGD, normal pH study, no gastroparesis. Which drug does the lecture try first"
        options:
          - "Domperidone"
          - "Ondansetron"
          - "Metoclopramide"
          - "H. pylori eradication"
        answer: 0
        why:
          - "صح: domperidone الأول، لأنه antinausea و prokinetic في نفس الوقت."
          - "الـ 5HT3 antagonists غالية، بنسيبها للـ refractory."
          - "بديل، بس الـ side effects بتحدّ استعماله."
          - "الـ H. pylori مش سبب رئيسي للـ nausea."
      - kind: try
        items: [git.L03.132, git.L03.140, git.L03.144, git.L03.155, git.L03.164]
    recap:
      - "Belching طبيعي لحد 30 مرة في اليوم. Supragastric = هوا داخل وطالع من المريء. Gastric = TLESR."
      - "Impedance هو الـ gold standard. علاج الـ supragastric: speech pathology + CBT، و baclofen آخر حاجة."
      - "Rumination: effortless، no retching، no nausea، وعلاجها diaphragmatic breathing."
      - "CHS: vomiting شبه CVS بعد cannabis طويل، ويخف لما يبطّله، ومعاه hot baths."
      - "CVS: gastric emptying ممكن accelerated. النوبة: IV fluids، antiemetics، sumatriptan (احذر IHD و stroke و HTN)."
      - "CIN: استبعد GERD حتى من غير heartburn، وابدأ domperidone."
    practice: [git.L03.131, git.L03.132, git.L03.133, git.L03.134, git.L03.135, git.L03.136, git.L03.137, git.L03.138, git.L03.139, git.L03.140, git.L03.141, git.L03.142, git.L03.143, git.L03.144, git.L03.145, git.L03.146, git.L03.147, git.L03.148, git.L03.149, git.L03.150, git.L03.151, git.L03.152, git.L03.153, git.L03.154, git.L03.155, git.L03.156, git.L03.157, git.L03.158, git.L03.159, git.L03.160, git.L03.161, git.L03.162, git.L03.163, git.L03.164, git.L03.165, git.L03.166, git.L03.167, git.L03.279, git.L03.280]
