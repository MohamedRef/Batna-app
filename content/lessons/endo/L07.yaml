      - kind: explain
        page: 120
        quote: "Primary hyperparathyroidism [parathyroid hormone (pth) mediated] which is long standing. – Malignancy (more severe and symptomatic)."
        title: "الـ hypercalcaemia: مين السبب؟"
        text: |
          أكتر من **90%**: ==primary hyperparathyroidism== اللي long standing، و ==malignancy== وده أشد وبأعراض.

          - **PTH-related تاني**: tertiary في الـ ESRD، جزء من MEN، و familial hypocalciuric hypercalcaemia.
          - **Non-PTH**: osteolytic mets و PTHrP، calcitriol من extrarenal conversion، vitamin D زيادة، granulomas.
