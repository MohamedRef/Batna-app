      - kind: explain
        remind: [rheum.L12.027]
        page: 200
        quote: "Joint swelling rather than pain, two thirds of patients present with single joint disease there may be associated juxta- articular muscle atrophy."
        title: "الصورة الإكلينيكية"
        text: |
          - **Swelling أكتر من الألم**، وتلتين المرضى بيبدأوا بمفصل واحد، وممكن juxta-articular muscle atrophy.
          - وجود ==constitutional manifestations== **يلغي** تشخيص الـ oligoarthritis.
          - أحيانًا temporomandibular joint (TMJ) و cervical spine.
          - **العين**: iridocyclitis، band keratopathy، glaucoma، cataract، وممكن blindness.
          - لو فضل pauciarticular **5 سنين**، احتمال يقلب poly أقل.

          ليه الـ constitutional manifestations بتلغي الـ oligo؟ التفسير المقبول (مش في الكتاب): الحمى وفقدان الوزن معناهم التهاب في الجسم كله، وده بيشاور على systemic أو سبب تاني زي infection أو malignancy، مش مرض محصور في مفاصل قليلة.
      - kind: aside
        tone: trap
        page: 199
        quote: "Chronic anterior uveitis Presence of ANA with a greater risk of complicating eye disease (iridocyclitis)."
        text: "الطفل مش بيشتكي من عينه. الـ chronic anterior uveitis ساكت، و الـ antinuclear antibodies (ANA) الإيجابي بيرفع الخطر. عشان كده بنعمل slit lamp دوري حتى لو العين شكلها سليم."
      - kind: reveal
        page: 200
        quote: "Joint swelling rather than pain, two thirds of patients present with single joint disease there may be associated juxta- articular muscle atrophy."
        prompt: "ليه الطفل اللي عنده oligo ممكن ما يشتكيش من ألم، والعضلة جنب المفصل تضمر؟"
        answer: |
          الكتاب بيقول ==swelling rather than pain== وممكن **juxta-articular muscle atrophy**. السبب مش مكتوب.

          التفسير المقبول (مش في الكتاب): الطفل الصغير مش بيعرف يوصف الألم، فبيحمي المفصل بإنه ما يستعملهوش: يعرج أو يمشي على طراطيف صوابعه. والعضلة اللي ما بتشتغلش بتضمر، والالتهاب جنبها بيزود الضمور. علشان كده الأهل بيلاحظوا ورم أو عرج، مش شكوى ألم.
      - kind: check
        page: 200
        quote: "Constitutional manifestations if present excludes the diagnosis of oligoarthritis."
        question: "A child with 2 swollen joints also has daily fever and weight loss. Oligoarticular JIA?"
        options: ["No: constitutional features exclude it", "Yes: ≤ 4 joints", "Yes, if ANA positive", "Only if hips are spared"]
        answer: 0
        why:
          - "صح: الـ constitutional manifestations بتلغي الـ oligo؛ فكّر في systemic."
          - "العدد لوحده مش كفاية."
          - "الـ ANA مش بيعمل التشخيص."
          - "المفاصل مش هي المشكلة هنا، المشكلة الحمى."
      - kind: explain
        remind: [rheum.L12.029]
        page: 200
        quote: "Complications\n  Leg length discrepancy with flexion contracture of the affected knee.\n  Acute lower limb pain and swelling due to ruptured synovial cysts."
        title: "مضاعفات الـ oligo"
        text: |
          - **Leg length discrepancy** مع flexion contracture في الركبة المصابة. التفسير المقبول (مش في الكتاب): الالتهاب بيزوّد الدم لـ growth plate جنب الركبة، فالرجل دي بتطول عن التانية. والطفل بيريّح الركبة وهي مثنية لأن ده الوضع الأقل وجعًا، فتتقفل على كده
          - **ألم وتورم حاد** في الرجل من ==ruptured synovial cyst==: الكيس بيتملي سائل التهابي ولما ينفجر السائل بيسيح بين العضلات، فممكن يتلخبط مع DVT
          - والكتاب بيقول: لو فضل **pauciarticular 5 سنين**، احتمال يقلب poly أقل
      - kind: explain
        page: 200
        quote: "Adolescent girls with typical adult rheumatoid arthritis RF positive group occurs on at least two occasions 3 months apart RF negative group with at least 5 joints involved during the first 6 months of the disease onset."
        title: "الـ Polyarticular"
        text: |
          - **Rheumatoid factor (RF)+ve**: بنات مراهقات، شكل ==adult rheumatoid arthritis== بالظبط. الـ RF لازم يطلع موجب **مرتين بينهم 3 شهور**
          - **RF-ve**: **5 مفاصل على الأقل** في أول 6 شهور
          - Extra-articular ممكن. Low-grade fever و rash عابر يوم أو اتنين في الأول، بس **مفيش** lymphadenopathy ولا hepatomegaly ولا splenomegaly ولا visceral involvement
          - ==Rapidly progressive joint disease== هي اللي مسيطرة
          - **Boutonniere و swan neck** في الإيد، والكتاب بيقول السبب: carpal fusion و tendinopathies

          ليه الـ RF لازم مرتين؟ التفسير المقبول (مش في الكتاب): الـ RF ممكن يطلع موجب مؤقتًا بعد أي infection، فالتكرار بعد 3 شهور بيأكد إنه ثابت مش عابر.
      - kind: explain
        page: 201
        quote: "Shoulders are commonly involved and flexion contracture occur in elbow involvement."
        title: "باقي مفاصل الـ poly"
        text: |
          - **Shoulders** شائعة (عكس الـ oligo)، و flexion contracture في الكوع.
          - Tarsal fusion، tenosynovitis، bursitis، flexion deformities في الركبة والحوض.
          - ==Aseptic necrosis of the hip== ممكن تحصل.
          - Cervical spine و TMJ شائعين، زي الـ RA.
