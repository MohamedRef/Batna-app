        text: "الكتاب بيقول وقّف الـ PPI **14 يوم** من غير تحذير، بس في الـ gastrinoma وقف الـ PPI فجأة ممكن يعمل مضاعفات بسرعة: ==ulcer bleeding==، perforation، أو oesophagitis شديدة. الـ European Neuroendocrine Tumor Society (ENETS) 2016: اعمله بس في مركز عنده خبرة، وغطّي بـ **H2 blocker** وتابع عن قرب، وممكن متحتاجوش أصلًا لو الـ fasting gastrin أكتر من **10 أضعاف** الـ upper limit of normal (ULN) والـ gastric pH أقل من **2**. في الامتحان اكتب washout الكتاب."
