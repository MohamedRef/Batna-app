[package]
name = "batna-app"
description = "Batna: the Dioxus app for the Mac, the S24 Ultra and the Tab S11."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "batna"
path = "src/main.rs"

[dependencies]
batna-anki.workspace = true
batna-core.workspace = true
batna-protocol.workspace = true
dioxus = { version = "0.7.10", features = [] }
serde_yaml_ng.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Oral mode's think timer and speech waits (Dioxus already runs on tokio),
# and Batna Cloud's sync thread (crates/app/src/cloud).
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
# Batna Cloud client and updates over the air (src/update/: the feed, SHA-256
# per download): TLS is rustls + ring with webpki roots everywhere, so the
# Android build needs no Java trust-store glue.
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
keyring-core = "1"
sha2 = "0.10"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

# Android TextToSpeech (src/platform/tts_android.rs) and «export to Anki»
# (src/anki/android.rs) through JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
android-native-keyring-store = "1"
ndk-context = "0.1"
# Only for `#[manganis::ffi]`, which tells dx to build android/ into the APK.
# Keep in lockstep with the dioxus version.
manganis = "=0.7.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
directories = "6"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# Study reminders as native notifications (bundled Batna.app only).
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSCalendar", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[dev-dependencies]
tempfile = "3"
# Signing test feeds in src/update/mod.rs.
ed25519-dalek = "2"

[build-dependencies]
batna-core.workspace = true
serde_yaml_ng.workspace = true

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[lints]
workspace = true
