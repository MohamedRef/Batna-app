    blanks: [[0, 1], [1, 1], [1, 2]]
    src: { page: 5, quote: "Advantages and disadvantages of various data collection techniques\n| Technique | Advantages | disadvantages |\n|---|---|---|\n| Interviewing | Suitable for illiterates; Permits clarification of questions; Higher response rate than written questionnaires | Presence of interviewer can influence responses; Information on events may be less complete than gained by observation |\n| Administering written questionnaires | Less expensive; Permits anonymity and may result in more honest responses; Eliminates bias due to phrasing questions differently with different respondents | cannot be used with illiterates; Low response rate; Questions may be misunderstood |" }
    status: unverified
    tags: [high-yield]
  - id: res.L10.006
    kind: mcq
    topic: techniques
    stem: >-
      A study in a rural village where many adults cannot read needs a high response rate and the chance to clarify questions.
      Which data collection technique suits it best?
    options: [Interviewing (face-to-face), Administering written questionnaires, Using available information, Observing]
    answer: 0
    why:
      - Interviewing is suitable for illiterates, permits clarification of questions and has a higher response rate than written questionnaires.
      - Written questionnaires cannot be used with illiterates and have a low response rate.
      - Records cannot be clarified and may be imprecise or incomplete.
      - Observation gives context, but you cannot clarify a question by watching.
    src: { page: 5, quote: "Interviewing | Suitable for illiterates; Permits clarification of questions; Higher response rate than written questionnaires" }
    status: unverified
  - id: res.L10.007
    kind: mcq
    topic: techniques
    stem: >-
      A survey on illicit drug use among students wants the most honest answers and no bias from questions being phrased
      differently for each respondent. Which technique fits?
    options:
      - Administering written questionnaires
      - Interviewing (face-to-face, structured)
      - Focus group discussion
      - Observing
    answer: 0
    why:
      - Written questionnaires permit anonymity, may give more honest responses and eliminate bias from phrasing questions differently.
      - The interviewer's presence can influence responses on a sensitive topic.
      - A group discussion removes anonymity in front of peers.
      - Drug use is not easily observed, and observation raises privacy issues.
    src: { page: 5, quote: "Administering written questionnaires | Less expensive; Permits anonymity and may result in more honest responses; Eliminates bias due to phrasing questions differently with different respondents" }
    status: unverified
  - id: res.L10.008
    kind: mcq
    topic: techniques
    stem: Observer bias, and the data collector's presence influencing the situation observed, are disadvantages of which technique?
    options: [Observing, Using available information, Administering written questionnaires, Interviewing]
    answer: 0
    why:
      - Both are listed under observing on the slide.
      - Records' problems are access, confidentiality and incomplete data.
      - Written questionnaires fail with illiterates and have low response rates.
      - The interviewer influences responses, but observer bias is the observation one.
    src: { page: 4, quote: "Observing | Gives more detailed and context-related information; Permits tests of reliability of responses to questionnaires | Ethical issues concerning confidentiality or privacy; Observer bias; Presence of data collector can influence the situation observed" }
    status: unverified
  - id: res.L10.009
    kind: card
    topic: techniques
    front: Define a focus group discussion (FGD).
    back: >-
      A group discussion of about 6-12 persons guided by a facilitator, in which the members talk freely and spontaneously about a
      certain topic.
    src: { page: 7, quote: "Focus group discussion (FGD)\n  A group discussion of approximately 6 - 12 persons guided by a facilitator, during which group members talk freely and spontaneously about a certain topic." }
    status: unverified
    tags: [high-yield]
  - id: res.L10.010
    kind: cloze
    topic: techniques
    text: >-
      A focus group discussion (FGD) is a {{c1::qualitative}} method of about {{c2::6-12}} persons; its purpose is to obtain
      {{c3::in-depth}} information on concepts, perceptions and ideas of a group.
    src: { page: 8, quote: "A FGD is a qualitative method. Its purpose is to obtain in-depth information on concepts, perceptions and ideas of a group.\n  A FGD aims to be more than a question-answer interaction. The idea is that group members discuss the topic among themselves, with guidance from facilitator." }
    status: unverified
    tags: [numbers]
  - id: res.L10.011
    kind: mcq
    topic: techniques
    stem: What makes a focus group discussion (FGD) more than a group interview?
    options:
      - Group members discuss the topic among themselves, with guidance from a facilitator
      - The facilitator reads a fixed questionnaire to each member in turn
      - It always includes more than 20 participants
      - It gives quantitative data for statistical tests
    answer: 0
    why:
      - The slide says an FGD aims to be more than a question-answer interaction; members discuss among themselves.
      - That is a question-answer interaction, which the FGD tries to go beyond.
      - The group is about 6-12 persons.
      - An FGD is a qualitative method.
    src: { page: 8, quote: "A FGD aims to be more than a question-answer interaction. The idea is that group members discuss the topic among themselves, with guidance from facilitator." }
    status: unverified
  # ---------------- questionnaire (slides 9-15, 70-71) ----------------
  - id: res.L10.012
    kind: card
    topic: questionnaire
    front: What is a questionnaire, and what is its objective?
    back: >-
      A formalized set of questions for obtaining information from respondents. Its objective is to translate the researcher's
      information needs into a set of specific questions that respondents are able to answer.
    src: { page: 11, quote: "What is a Questionnaire?\n  A questionnaire is a formalized set of questions for obtaining information from respondents.\n  The objective is to translate the researcher’s information needs into a set of specific questions that respondents are able to answer." }
    status: unverified
    tags: [high-yield]
  - id: res.L10.013
    kind: enumerate
    topic: questionnaire
    prompt: Why is a questionnaire important?
    points:
      - It ensures standardization and comparability of the data across interviewers
      - It increases the speed and accuracy of recording
      - It facilitates data processing
    pass: 3
    hook: "الـ questionnaire بيدّيك 3: «زي بعض، أسرع وأدق، وأسهل في الحسبة» = standardization وcomparability، speed وaccuracy of recording، وdata processing."
    src: { page: 12, quote: "Why Is a Questionnaire Important?\n  A questionnaire ensures standardization and comparability of the data across interviewers,\n  increases speed and accuracy of recording, and\n  facilitates data processing." }
    status: unverified
  - id: res.L10.014
    kind: card
    topic: questionnaire
    front: Is there a scientific principle that guarantees an ideal questionnaire?
    back: >-
      No. Questionnaire design is as much an art as a science: the creativity, skill and experience of the researcher play a major
      role. Guidelines, shown as a series of steps, help avoid major mistakes.
    src: { page: 13, quote: "Questionnaire Design Process\n  No scientific principles guarantee an optimal or ideal questionnaire.\n  Questionnaire design is as much an art as it is a science.\n  The creativity, skill, and experience of the researcher play a major role in the end design." }
    status: unverified
