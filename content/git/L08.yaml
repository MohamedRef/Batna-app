      - Decreased enterocyte height
      - Villous atrophy
      - Crypt hyperplasia
    pass: 4
    src: { page: 238, quote: "Increased numbers of intraepithelial lymphocytes (IELs). 2. Decreased enterocyte height, 3. Villous atrophy. 4. Crypt hyperplasia." }
    status: unverified
    tags: [high-yield]
  - id: git.L08.037
    kind: table
    topic: celiac-biopsy
    title: Marsh classification of celiac disease
    columns: [Stage, Duodenal biopsy]
    rows:
      - ["0", Normal]
      - ["1", "Increased intraepithelial lymphocytes (>30%)"]
      - ["2", "More inflammatory cells and crypt cell proliferation, villi preserved"]
      - ["3", "Villous atrophy: mild (A), moderate (B), subtotal to total (C)"]
      - ["4", Total mucosal hypoplasia]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 238, quote: "Stage 1 - Increased percentage of intraepithelial lymphocytes (>30%)" }
    status: unverified
    tags: [high-yield, book-question]
  - id: git.L08.038
    kind: cloze
    topic: celiac-biopsy
    text: "Marsh stage 1 = intraepithelial lymphocytes above {{c1::30%}}; stage 3 = {{c2::villous atrophy}} (A, B, C); stage 4 = {{c3::total mucosal hypoplasia}}."
    src: { page: 238, quote: "Stage 3 - Mild (A), moderate (B), and subtotal to total (C) villous atrophy o Stage 4 - Total mucosal hypoplasia." }
    status: unverified
    tags: [numbers]
  - id: git.L08.039
    kind: card
    topic: celiac-biopsy
    front: What is Marsh classification used for?
    back: The most widespread histological classification of celiac disease, for diagnosis and for re-evaluation after a gluten-free diet.
    src: { page: 238, quote: "Marsh‘s classification is the histological classification system of CD most widespread and used worldwide" }
    status: unverified
    tags: [book-question]
  - id: git.L08.040
    kind: card
    topic: celiac-biopsy
    front: Does histologic severity in celiac disease match clinical severity?
    back: Not necessarily. Damage is worse proximally, matching the higher proximal gluten load.
    src: { page: 238, quote: "The severity of histologic changes in the small bowel does not necessarily correlate with the severity of clinical manifestations." }
    status: unverified
  - id: git.L08.041
    kind: card
    topic: celiac-biopsy
    front: Most sensitive and accurate way to monitor celiac activity over time?
    back: Quantitative histology (villous height, crypt depth, IELs per 100 enterocytes).
    src: { page: 238, quote: "Quantitative histology (villous height, crypt depth, density of IELs per 100 enterocytes) provides the most sensitive and accurate method" }
    status: unverified
  - id: git.L08.042
    kind: enumerate
    topic: celiac-biopsy
    prompt: Enumerate causes of small intestinal villous atrophy other than celiac disease (book table).
    points:
      - Small intestinal bacterial overgrowth
      - Crohn disease
      - Cow's milk or soy protein intolerance (children)
      - Eosinophilic gastroenteritis
      - Giardiasis
      - Intestinal lymphoma
      - Tropical sprue
      - Zollinger-Ellison syndrome
      - Immunodeficiency (CVID, AIDS enteropathy)
      - Autoimmune enteropathy
      - Medications (olmesartan)
      - Whipple disease
      - Intestinal tuberculosis, GVHD, malnutrition, peptic duodenitis, post-gastroenteritis
    pass: 8
    src: { page: 245, quote: "Causes of small intestinal villous atrophy other than celiac disease" }
    status: unverified
  - id: git.L08.043
    kind: mcq
    topic: celiac-biopsy
    stem: "Duodenal biopsies from a patient with positive tTG IgA show IELs of 45 per 100 enterocytes, crypt hyperplasia and moderate villous atrophy. Marsh stage?"
    options:
      - Marsh 3B
      - Marsh 1
      - Marsh 2
      - Marsh 3C
      - Marsh 4
    answer: 0
    why:
      - "Correct: villous atrophy puts it in stage 3; moderate atrophy is B (p238)."
      - Stage 1 has raised IELs only, with normal villi and crypts.
      - Stage 2 has crypt proliferation but preserved villi.
      - 3C is subtotal to total atrophy.
      - Stage 4 is total mucosal hypoplasia.
    src: { page: 238, quote: "Stage 3 - Mild (A), moderate (B), and subtotal to total (C) villous atrophy" }
    status: unverified
