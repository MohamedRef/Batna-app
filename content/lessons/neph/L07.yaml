        why: "الجين، بعدين الحساس اللي في الـ cilia، بعدين الخلايا تتكاثر من غير ضابط، فالكيس يتقفل على نفسه ويفضل يكبر."
      - kind: check
        page: 146
        quote: "body. Pkd-1 mutations are seven times more com-mon than pkd-2 and associated with more aggressive disease (onset of esrd, on average, 15 years earlier). Mutations in a third gene, ganab, have been identified in families with mild polycystic kidney and more variable polycystic liver disease."
        question: "Compared with PKD2 mutations, PKD1 mutations are:"
        options:
          - "Commoner and reaches ESRD about 15 years earlier"
          - "Rarer and milder"
          - "Commoner but milder"
          - "Linked to chromosome 4"
        answer: 0
        why:
          - "صح: 7 أضعاف و end-stage renal disease (ESRD) بدري بـ 15 سنة."
          - "العكس بالظبط."
          - "أشهر، بس أوحش مش أخف."
          - "الـ PKD2 هو اللي على chromosome 4."
      - kind: try
        items: [neph.L07.002, neph.L07.004, neph.L07.007, neph.L07.009, neph.L07.014]
    recap:
      - "ADPKD = multisystem: أكياس bilateral في الكلى، ومعاها كبد و pancreas و arachnoid."
      - "PKD1 (chromosome 16، polycystin-1) و PKD2 (chromosome 4، polycystin-2). PKD1 أشهر 7 مرات و ESRD بدري بـ 15 سنة؛ GANAB أخف."
