  - id: dm.L01.lesson1
    title: "السكر: وقود الجسم وإزاي بيبوظ"
    hook: "السكر مش عدو: ده البنزين الوحيد. المشكلة لما يتصرف غلط ويتعمل زيادة في نفس الوقت."
    minutes: 8
    pages: [1, 2]
    topics: [definition, epidemiology]
    goals:
      - "تعرّف الـ DM تعريف الكتاب وتفهم ليه السكر ناقص في الخلية وزيادة في الدم في نفس الوقت"
      - "تعرف ليه الـ microvascular complications specific للسكر"
      - "تحفظ أرقام مصر ونسبة type 1 لـ type 2 وتعرف ليه الـ DM مشكلة صحة عامة"
    status: unverified
    steps:
      - kind: explain
        page: 1
        title: "الجلوكوز: البنزين الوحيد"
        quote: "The only source of energy for every organism in the body Essential to fuel both aerobic and anaerobic cellular respiration."
        text: |
          الكتاب بيبدأ من الأساس: ==glucose== هو **the only source of energy** لكل عضو، وبيشغّل الـ **aerobic** والـ **anaerobic respiration**.

          - بيدخل الجسم كـ **galactose / fructose** (mono)، أو **lactose / sucrose** (di)، أو **starch** (poly).
          - الزيادة بتتخزن **glycogen**، وتطلع وقت الصيام.
          - ولو مفيش، الكبد يعمله من الدهون والبروتين بالـ **gluconeogenesis**.
          - المايسترو: **insulin** و **glucagon**.

          ليه الكتاب بيحكي ده في محاضرة السكر؟ عشان كل عَرَض هتشوفه بعد كده هو عطل في واحدة من الخطوات دي: الدخول، التخزين، أو التصنيع. والتفسير المقبول (مش في الكتاب) لأشكال الأكل الكتير: الأمعاء بتكسّر الـ di والـ poly لـ monosaccharides، والكبد بيحوّل الـ galactose والـ fructose لـ glucose، فكله في الآخر بيبقى نفس الوقود.
      - kind: explain
        remind: [dm.L01.016]
        page: 1
        title: "تعريف الـ DM: مش مستخدم وبيتعمل زيادة"
        quote: "It is a group of chronic metabolic disorders of carbohydrate metabolism in which glucose is both underutilized as an energy source and overproduced due to inappropriate gluconeogenesis and glycogenolysis, resulting in hyperglycemia. It results from defects of insulin secretion, insulin action or both."
        text: |
          الـ **Diabetes mellitus** = group of chronic metabolic disorders of carbohydrate metabolism فيها الجلوكوز:
          - ==underutilized== كمصدر طاقة،
          - و ==overproduced== بسبب **inappropriate gluconeogenesis and glycogenolysis**،
          - والنتيجة **hyperglycemia**.

          السبب: defects of **insulin secretion**، **insulin action**، أو الاتنين.

          يعني التعريف فيه عيبين مش عيب واحد: السكر مش داخل الخلية، **و** في نفس الوقت الكبد بيصنّع زيادة. عشان كده العلاج بيستهدف الاتنين: حاجة تدخّل السكر العضلات، وحاجة تقفل حنفية الكبد.
      - kind: aside
        tone: analogy
        page: 1
        quote: "It is a group of chronic metabolic disorders of carbohydrate metabolism in which glucose is both underutilized as an energy source and overproduced due to inappropriate gluconeogenesis and glycogenolysis, resulting in hyperglycemia. It results from defects of insulin secretion, insulin action or both."
        text: "تخيّل محطة بنزين: العربيات (الخلايا) مش عارفة تفوّل لأن المفتاح (**insulin**) ضايع أو الخزان مقفول (**resistance**)، وفي نفس الوقت المصنع (الكبد) فاكر إن في أزمة فبيضخ بنزين زيادة. الشارع (الدم) يغرق بنزين والعربيات واقفة."
      - kind: reveal
        page: 1
        quote: "Insulin and glucagon play a pivotal role in its metabolism"
        prompt: "طب ليه الكبد يصنّع سكر زيادة والدم مليان سكر أصلًا؟ مين اللي مفروض يوقّفه؟"
        answer: |
          الكتاب بيقول إن **insulin** و **glucagon** هما الـ pivotal hormones، وإن الـ gluconeogenesis والـ glycogenolysis في السكري **inappropriate**.

          التفسير المقبول (مش في الكتاب): الـ **insulin** هو إشارة «إحنا شبعانين»: بيقفل الـ glycogenolysis والـ gluconeogenesis في الكبد. لما الـ insulin يقل أو الكبد ما يسمعهوش، الكبد يقرا الموقف على إنه **صيام**، والـ **glucagon** يشتغل من غير حد يوقفه. فالكبد يضخ سكر وهو فاكر إن الجسم جعان، مع إن الدم مليان.
      - kind: figure
        remind: [dm.L01.008]
        page: 1
        quote: "It is often accompanied by specific microvascular (retina, renal, peripheral nerves), and non-specific macrovascular (coronary, cerebral, peripheral blood vessels) complications."
        title: "المضاعفات: صغيرة ومخصوصة، وكبيرة ومش مخصوصة"
        alt: "Two columns. Left: microvascular, specific: retina, kidney, peripheral nerves. Right: macrovascular, non-specific: coronary, cerebral, peripheral vessels."
        caption: "الـ ==microvascular== **specific** للسكر (مش هتلاقي diabetic retinopathy من غير سكر)، والـ **macrovascular** **non-specific** لأن الـ atherosclerosis بيحصل من غير سكر كمان."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="150" height="180" rx="12" class="fg-acc"/>
            <text x="85" y="34" text-anchor="middle" class="t-b t-acc">Microvascular</text>
            <text x="85" y="52" text-anchor="middle" class="t-sm t-mut">specific</text>
            <text x="85" y="88" text-anchor="middle">Retina</text>
            <text x="85" y="118" text-anchor="middle">Kidney</text>
            <text x="85" y="148" text-anchor="middle">Peripheral nerves</text>
            <rect x="170" y="10" width="150" height="180" rx="12" class="fg-bad"/>
            <text x="245" y="34" text-anchor="middle" class="t-b t-bad">Macrovascular</text>
            <text x="245" y="52" text-anchor="middle" class="t-sm t-mut">non-specific</text>
            <text x="245" y="88" text-anchor="middle">Coronary</text>
            <text x="245" y="118" text-anchor="middle">Cerebral</text>
            <text x="245" y="148" text-anchor="middle">Peripheral vessels</text>
          </svg>
      - kind: reveal
        page: 1
        quote: "It is often accompanied by specific microvascular (retina, renal, peripheral nerves), and non-specific macrovascular (coronary, cerebral, peripheral blood vessels) complications."
        prompt: "ليه الشبكية والكلية والأعصاب بالذات هما اللي بيتضربوا؟"
        answer: |
          الكتاب بيسمّيهم **specific microvascular** complications: retina، renal، peripheral nerves.

          التفسير المقبول (مش في الكتاب): الخلايا دي بتدخّل السكر **من غير ما تستنى insulin**، فلما سكر الدم يعلى، السكر جواها يعلى بنفس القدر وبيأذيها من جوه (sorbitol، glycation). العضلة والدهن بيقفلوا بابهم لو مفيش insulin، فبيتحموا. عشان كده الـ triad دي بصمة السكر، أما القلب والمخ فبيتضربوا من الـ atherosclerosis اللي ليه أسباب كتير غير السكر، يعني **non-specific**.
      - kind: explain
        page: 2
        title: "ليه السكر مشكلة صحة عامة؟"
        quote: "It is a major public health problem worldwide due to: Increased number of persons affected (Epidemic) The associated morbidity and mortality."
        text: |
          الكتاب بيدّي سببين: ==Increased number== of persons affected (يعني **epidemic**)، والـ **associated morbidity and mortality**.

          - **Prevalence in Egypt:** **9.5%** في سن **20–79**.
          - **Incidence** (حالات جديدة في السنة): type 1 **very low**، و type 2 **very high**.
          - **Type 1 : type 2 = 1 : 9**.
          - **Type 2** في الستات أكتر من الرجالة.

          التفسير المقبول (مش في الكتاب) للفرق في الـ incidence: type 2 بيمشي ورا الـ obesity وقلة الحركة، ودول بيزيدوا كل سنة، فالحالات الجديدة كتير. أما type 1 فـ autoimmune ومحتاج جينات معينة، فرقمه ثابت تقريبًا وقليل. ونسبة الستات للرجالة الكتاب ما بيقولش سببها، فاحفظها زي ما هي.
      - kind: table
        page: 2
        quote: "Prevalence rate in Egypt: 9.5% in the age group 20-79years."
        title: "أرقام الوبائيات"
        columns: [Fact, Number]
        rows:
          - ["Prevalence in Egypt", "9.5% (age 20–79)"]
          - ["Type 1 : type 2", "1 : 9"]
          - ["Incidence", "Type 1 very low, type 2 very high"]
          - ["Sex (type 2)", "Females > males"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: check
        page: 2
        quote: "The ratio between type 1 to type 2 diabetes is 1:9."
        question: "Out of 100 diabetics, about how many have type 1 by the lecture's ratio?"
        options: ["10", "50", "30", "1"]
        answer: 0
        why:
          - "صح: النسبة **1:9**، يعني 1 من كل 10."
          - "لا، type 2 هو الغالب بفرق كبير."
          - "أكتر من الحقيقة بكتير."
          - "ده قليل أوي؛ النسبة 1 لـ 9 مش 1 لـ 99."
      - kind: check
        page: 2
        quote: "It is a major public health problem worldwide due to: Increased number of persons affected (Epidemic) The associated morbidity and mortality."
        question: "Why does the lecture call diabetes a major public health problem worldwide?"
        options:
          - "More people affected (an epidemic) and its morbidity and mortality"
          - "Its high incidence of type 1 diabetes"
          - "It affects males more than females"
          - "Its acute complications only"
        answer: 0
        why:
          - "صح: الكتاب بيقول السببين دول بالظبط."
          - "بالعكس، incidence الـ type 1 **very low**."
          - "الكتاب بيقول الستات أكتر في type 2."
          - "المشكلة الأكبر في الـ chronic complications، والكتاب بيقول morbidity and mortality عمومًا."
      - kind: try
        items: [dm.L01.002, dm.L01.005, dm.L01.008, dm.L01.009, dm.L01.010]
    recap:
      - "Glucose البنزين الوحيد: بيدخل mono/di/poly، يتخزن glycogen، ويتصنع بالـ gluconeogenesis؛ insulin و glucagon المايسترو."
      - "DM = glucose underutilized + overproduced ← hyperglycemia؛ defect في الـ secretion أو الـ action أو الاتنين."
      - "من غير insulin الكبد فاكر إنه صيام فبيضخ سكر."
      - "Microvascular specific (عين، كلية، أعصاب: بتدخّل السكر من غير insulin)؛ macrovascular non-specific."
      - "مصر 9.5% (20–79 سنة). Type 1 : type 2 = 1 : 9. الستات أكتر في type 2. مشكلة صحة عامة: epidemic + morbidity/mortality."
    practice: [dm.L01.001, dm.L01.002, dm.L01.003, dm.L01.004, dm.L01.005, dm.L01.006, dm.L01.007, dm.L01.008, dm.L01.009, dm.L01.010, dm.L01.011, dm.L01.012]
