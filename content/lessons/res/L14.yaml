- id: res.L14.lesson2
  title: 'الـ test الكويس: sensitivity و specificity'
  hook: test بيمسك كل العيانين بس بيخوّف نص الأصحاء، وتاني مبيغلطش في سليم بس بيفوّت عيانين. مين أحسن؟
  minutes: 9
  pages: [10, 16]
  topics: [good_test, validity]
  goals:
  - تفرّق بين الـ reliability والـ validity
  - تحسب الـ sensitivity والـ specificity من الجدول
  - تستخدم SpPin و SnNout صح
  status: unverified
  steps:
  - kind: explain
    page: 10
    quote: |-
      Characteristics of a Good Screening Test
      Inexpensive
      Easy to administer
      Minimal discomfort
      Reliable (consistent)
      Valid (distinguishes diseased & non-diseased people)
    title: مواصفات الـ screening test الكويس
    text: |-
      5 حاجات:

      - **Inexpensive**.
      - **Easy to administer**.
      - **Minimal discomfort**.
      - ==Reliable==: نتيجته **consistent**.
      - ==Valid==: بيفرّق بين الـ **diseased** والـ **non-diseased**.
  - kind: figure
    page: 11
    quote: |-
      DEFINITION
      RELIABILITY is the extent to which the outcomes are consistent when the experiment is repeated more than once.
      DEFINITION
      VALIDITY is the extent to which the instruments that are used in the experiment measure exactly what you want them to measure.
    title: Reliable ≠ valid
    alt: 'Three targets. In the first, four shots cluster tightly but away from the bullseye: reliable, not valid. In the
      second, shots are scattered and off target: neither. In the third, shots cluster on the bullseye: reliable and valid.'
    caption: الـ **reliability** = الطلقات قريبة من بعض لما تكرر. الـ **validity** = الطلقات في النص، يعني بيقيس الحاجة اللي
      انت عايزها فعلًا.
    svg: |-
      <svg viewBox="0 0 330 160" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="70" r="50" class="fg-box"/><circle cx="60" cy="70" r="32" class="fg-box"/><circle cx="60" cy="70" r="12" class="fg-acc"/>
        <circle cx="88" cy="40" r="4" class="fg-dot-bad"/><circle cx="94" cy="44" r="4" class="fg-dot-bad"/><circle cx="90" cy="49" r="4" class="fg-dot-bad"/><circle cx="96" cy="38" r="4" class="fg-dot-bad"/>
        <text x="60" y="140" text-anchor="middle" class="t-sm t-b">Reliable</text>
        <text x="60" y="154" text-anchor="middle" class="t-sm t-mut">not valid</text>
        <circle cx="165" cy="70" r="50" class="fg-box"/><circle cx="165" cy="70" r="32" class="fg-box"/><circle cx="165" cy="70" r="12" class="fg-acc"/>
        <circle cx="140" cy="52" r="4" class="fg-dot-bad"/><circle cx="190" cy="60" r="4" class="fg-dot-bad"/><circle cx="160" cy="104" r="4" class="fg-dot-bad"/><circle cx="182" cy="96" r="4" class="fg-dot-bad"/>
        <text x="165" y="140" text-anchor="middle" class="t-sm t-b">Neither</text>
        <text x="165" y="154" text-anchor="middle" class="t-sm t-mut">scattered, off target</text>
        <circle cx="270" cy="70" r="50" class="fg-box"/><circle cx="270" cy="70" r="32" class="fg-box"/><circle cx="270" cy="70" r="12" class="fg-acc"/>
        <circle cx="266" cy="68" r="4" class="fg-dot-good"/><circle cx="274" cy="72" r="4" class="fg-dot-good"/><circle cx="269" cy="75" r="4" class="fg-dot-good"/><circle cx="273" cy="65" r="4" class="fg-dot-good"/>
        <text x="270" y="140" text-anchor="middle" class="t-sm t-b">Reliable</text>
        <text x="270" y="154" text-anchor="middle" class="t-sm t-mut">and valid</text>
      </svg>
  - kind: check
    page: 11
    quote: |-
      DEFINITION
      RELIABILITY is the extent to which the outcomes are consistent when the experiment is repeated more than once.
      DEFINITION
      VALIDITY is the extent to which the instruments that are used in the experiment measure exactly what you want them to measure.
    question: 'A scale always reads exactly 2 kg above the true weight, every time. It is:'
    options:
    - Reliable but not valid
    - Valid but not reliable
    - Reliable and valid
    - Neither
    answer: 0
    why:
    - 'صح: نفس الرقم كل مرة (reliable)، بس مش الوزن الحقيقي (not valid).'
    - لأ، هو consistent جدًا؛ اللي ناقصه الـ validity.
    - هو مش بيقيس الوزن الحقيقي، فمش valid.
    - هو reliable، لأن النتيجة بتتكرر.
  - kind: explain
    page: 12
    quote: |-
      Screening test validity
      the extent to which the test distinguishes between persons with and without the disease
      Sensitivity
      Ability to avoid false negatives; accuracy in including all who have the problem
      False negative- Subjects have problem, incorrectly identified as not having the problem
      Specificity
      Ability to avoid false positive; accuracy in not including non affected persons
      False positive - subjects doesn't have the problem, incorrectly identified as having the problem
    title: الـ validity = sensitivity + specificity
    text: |-
      الـ **validity** للـ screening test = قد إيه بيفرّق بين اللي عنده المرض واللي معندوش. وليها رجلين:

      **Sensitivity**: إنه ==يتجنب الـ false negatives==، يعني يدخّل كل اللي عندهم المشكلة.
      - **False negative**: عنده المرض، والـ test قاله «انت سليم».

      **Specificity**: إنه ==يتجنب الـ false positives==، يعني ميدخّلش السليمين.
      - **False positive**: سليم، والـ test قاله «انت عيان».
  - kind: figure
    page: 14
    quote: |-
      Calculations of sensitivity and specificity
      | Screening Results | Disease | No Disease | Total |
      |---|---|---|---|
      | Positive | 80 | 100 | 180 |
      | Negative | 20 | 800 | 820 |
      | Total | 100 | 900 | 1,000 |
      Sensitivity = 80/100 = 80%
      Specificity = 800/900 = 89%
