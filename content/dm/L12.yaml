  - id: dm.L12.046
    kind: card
    topic: kdigo
    front: Which DPP-4 inhibitor needs no dose change in kidney disease, and why?
    back: Linagliptin; only about 5% is excreted by the kidney.
    src: { page: 149, quote: "Linagliptin and/or no additional drug monitoring required" }
    status: unverified
    tags: [high-yield]
