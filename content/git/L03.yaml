    stem: >-
      A 27-year-old man has 3-day bouts of intense vomiting every few weeks, well in between. He smokes cannabis
      daily for 5 years and spends hours in hot showers during attacks. What confirms the diagnosis?
    options:
      - Relief of episodes after sustained cessation of cannabis
      - Accelerated gastric emptying on scintigraphy
      - Response to sumatriptan
      - A normal upper endoscopy
      - Positive urine cannabinoid screen
    answer: 0
    why:
      - "Correct: a Rome IV criterion for cannabinoid hyperemesis syndrome (CHS) is relief of vomiting by sustained cessation of cannabis."
      - Accelerated emptying is seen in a subset of cyclic vomiting syndrome (CVS) patients; it does not confirm CHS.
      - Triptans help CVS with a migraine background, not CHS.
      - A normal esophagogastroduodenoscopy (EGD) excludes organic disease but does not separate CHS from CVS.
      - A positive screen shows use, not that cannabis causes the vomiting.
    src: { page: 109, quote: "B3c. Cannabinoid hyperemesis syndrome (CHS)\nDiagnostic criteria* - Must include all of the following:\n  1. Stereotypical episodic vomiting resembling cyclic vomiting syndrome (CVS) in terms of onset, duration, and frequency\n  2. Presentation after prolonged use of cannabis\n  3. Relief of vomiting episodes by sustained cessation of cannabis use\n*Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis\nSupportive remark\n  May be associated with pathologic bathing behavior (prolonged hot baths or showers)" }
