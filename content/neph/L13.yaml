  # ---------- p441-443: SGLT2 and GLP-1 ----------
  - id: neph.L13.089
    kind: card
    topic: sglt2
    front: How does diabetes cause hyperfiltration at the tubule (Figure, p441)?
    back: More SGLT2 reabsorption of glucose and sodium, so less distal Na reaches the macula densa, tubuloglomerular feedback falls and GFR rises.
    src: { page: 441, quote: "Normal:\n  100%\nDiabetes:\n  120%; TGF ↓\n  Diminshed distal Na delivery and hyperfiltration\nDiabetes + SGLT2i:\n  90%; TGF ↑\n  Enhanced distal Na delivery and diminished GFR" }
    status: unverified
    tags: [high-yield]
  - id: neph.L13.090
    kind: card
    topic: sglt2
    front: How do SGLT2 inhibitors lower intraglomerular pressure?
    back: More distal Na delivery restores tubuloglomerular feedback, causing afferent arteriolar vasoconstriction, so glomerular hypertension and albuminuria fall.
    src: { page: 441, quote: "Analysis from the EMPA-REG OUTCOME trial indicate empagliflozin may assist in preventing the progression of chronic kidney disease in patients with type 2 diabetes irrespective of medications that alter intrarenal hemodynamics.\nSGLT2 inhibitors induce renal arteriolar vasoconstriction: ↓glomerular hypertension, ↓albuminuria\nEMPA-REG OUTCOME: N = 7020; 1° endpoint: ↓CV risk; Prespecified 2° kidney outcomes: ↓renal risk\nDoes empagliflozin interact with other drugs that may affect renal hemodynamics? (ACE inhibitors (ACEi), Angiotensin-receptor blockers (ARB), Diuretics, Calcium channel blockers (CCB), NSAIDs)\nThis analysis: Consistent ↓nephropathy with empagliflozin regardless of these drugs\nConclusion: Empagliflozin's renoprotective effects are independent of concomitant medications that may also alter renal hemodynamics" }
    status: unverified
