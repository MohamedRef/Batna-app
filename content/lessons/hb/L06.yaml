    status: unverified
    steps:
      - kind: explain
        page: 107
        quote: "Treatment: Insulin Sensitizing Agents\n| Study | N | Drug | Duration (months) | Design | ALT | Histology |\n|---|---|---|---|---|---|---|\n| Caldwell | 10 | Troglitazone | 3-6 | Open label | + | + |\n| Acosta | 8 | Pioglitazone | 2-12 | Open label | + | N/A |\n| Shadid | 5 | Pioglitazone | 4.5 | Open label | + | N/A |\n| Sanyal | 21 | Pioglitazone + Vit E | 6 | RCT | + | + |\n| Promrat | 18 | Pioglitazone | 12 | Open label | + | + |\n| Tetri | 30 | Rosiglitazone | 12 | Open label | + | + |\n| Belfort | 55 | Pioglitazone ± Diet | 6 | RCT | + | + |\n| Marchesini | 14 | Metformin | 4 | Open label | + | N/A |\n| Nair | 15 | Metformin | 12 | Open label | + | N/A |\n| Bugianesi | 55 | Metformin | 6 | RCT | + | + |\n| Uygun | 17 | Metformin | 6 | RCT | + | - |\n| Duseja | 7 | Metformin | 6 | Open label | + | N/A |\n| Schwimmer | 10 | Metformin | 6 | Open label | + | N/A |"
        title: "Insulin sensitizing agents"
        text: |
          الفكرة: لو الـ insulin resistance هي الجذر المشترك، يبقى الدوا اللي بيحسّنها لازم يفيد الكبد. جدول الكتاب جرّب ده على thiazolidinediones (TZDs) و metformin:

          - ==Pioglitazone== (لوحده، أو مع vitamin E، أو ± diet): الـ alanine aminotransferase (ALT) اتحسّن، والـ histology اتحسّنت في الدراسات اللي قاستها، ومنهم randomised controlled trials (RCTs) (Sanyal و Belfort).
          - ==Metformin==: الـ ALT اتحسّن، بس الـ histology بياناتها قليلة ومتضاربة: randomized controlled trial (RCT) إيجابي (Bugianesi) و RCT سلبي (Uygun).

          الدرس: تحسّن الـ ALT لوحده مش كفاية. السؤال الحقيقي: الـ histology اتحسّنت ولا لأ؟
      - kind: figure
        page: 107
        quote: "Treatment: Insulin Sensitizing Agents"
        title: "دراسات الـ insulin sensitizers: الجدول الأصلي"
        image: { file: hb/L06-insulin-sensitizer-studies.webp, book: true }
