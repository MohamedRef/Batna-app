        page: 161
        quote: "Locoregional (stage I-III) disease :Potentially curable"
        title: "أول قرار: الـ stage"
        alt: "A split by stage for gastric cancer. Stage I to III, locoregional: potentially curable, a multidisciplinary team considers surgery, with the extent of resection set by size, location and depth, plus perioperative or postoperative chemoradiation. Stage IV: palliative; systemic treatment gives longer survival and better quality of life, partial response 30 to 50 percent and short-lived; supportive care keeps the lumen open."
        caption: |
          - **الشمال (Stage I–III)**: ==potentially curable==: جراحة بحجم على قد الـ size والـ location والـ depth، ومعاها perioperative/postoperative chemoradiation.
          - **اليمين (Stage IV)**: ==palliative==: systemic treatment بيطوّل العمر ويحسّن الحياة، والـ partial response **30–50%** ومؤقتة.
