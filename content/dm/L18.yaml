  - id: dm.L18.037
    kind: table
    topic: chronic-tx
    title: Drugs for chronic gout (lecture groups)
    columns: [Group, Drugs]
    rows:
      - [Uricosuric, "Probenecid, sulfinpyrazone, benzbromarone, lesinurad"]
      - [Urine alkalinizing, "Sodium bicarbonate, sodium citrate, acetazolamide"]
      - [Uricostatic (xanthine oxidase inhibitors), "Allopurinol, febuxostat"]
      - [Urate oxidase, "Rasburicase, pegloticase"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 238, quote: "Uricostatic drugs (Xanthine oxidase inhibitors)" }
    status: unverified
    tags: [high-yield]
  - id: dm.L18.038
    kind: card
    topic: chronic-tx
    front: How does lesinurad work?
    back: A selective uric acid reabsorption inhibitor (SURI) that blocks URAT1, the main renal urate reabsorption transporter, and also OAT4 (linked to diuretic-induced hyperuricemia).
    src: { page: 237, quote: "It acts by inhibiting the urate transporter, URAT1, which is primarily responsible for reabsorbing uric acid in the kidneys." }
    status: unverified
    tags: [high-yield]
    update:
      text: "Lesinurad (Zurampic, Duzallo) was withdrawn from the US market by its maker in 2019 for business reasons."
      ref: "Ironwood Pharmaceuticals market withdrawal, 2019"
  - id: dm.L18.039
    kind: card
    topic: chronic-tx
    front: How must lesinurad be used, and why?
    back: 200 mg together with a xanthine oxidase inhibitor, in gout not at target on the XO inhibitor alone; monotherapy or higher doses raise serum creatinine.
    src: { page: 237, quote: "Lesinurad (200mg) must be coadministered with a xanthine oxidase inhibitor" }
    status: unverified
  - id: dm.L18.040
    kind: mcq
    topic: chronic-tx
    stem: A man with gout is not at target on allopurinol alone. His doctor wants to add lesinurad. Which statement fits the lecture?
    options:
      - "It must be given with the xanthine oxidase inhibitor; alone or at high dose it raises creatinine"
      - It replaces allopurinol as monotherapy
      - It works by blocking xanthine oxidase
      - It is a urate oxidase given IV
      - Higher-than-recommended doses improve renal function
    answer: 0
    why:
      - "Correct: lesinurad 200 mg must be coadministered with an XO inhibitor; monotherapy or higher doses raise creatinine (p237)."
      - Monotherapy is what raises creatinine.
      - It blocks URAT1 and OAT4, a uricosuric action.
      - Urate oxidases are rasburicase and pegloticase.
      - "The opposite: higher doses raise creatinine."
    src: { page: 237, quote: "Monotherapy or higher-than-recommended doses are associated with an increased serum creatinine level." }
    status: unverified
  - id: dm.L18.041
    kind: enumerate
    topic: chronic-tx
    prompt: Name the urine alkalinizing drugs used in gout.
    points:
      - Sodium bicarbonate
      - Sodium citrate
      - Acetazolamide
    pass: 3
    src: { page: 238, quote: "Urine alkalinizing drugs 1. Sodium Bicarbonat 2. Sodium Citrate 3. Acetazolamide" }
    status: unverified
  # ---------- p238-241: XO inhibitors ----------
  - id: dm.L18.042
    kind: card
    topic: xo
    front: How does allopurinol lower uric acid?
    back: It inhibits xanthine oxidase, blocking hypoxanthine to xanthine and xanthine to uric acid.
    src: { page: 238, quote: "Xanthine oxidase inhibitors that inhibit the conversion of xanthine and hypoxanthine to uric acid" }
    status: unverified
    tags: [high-yield]
  - id: dm.L18.043
    kind: card
    topic: xo
    front: Gold standard uricostatic drug?
    back: Allopurinol; it fits most hyperuricemic patients with an acceptable side-effect profile.
    src: { page: 238, quote: "Till now, allopurinol remains the gold standard uricostatic drug" }
    status: unverified
    tags: [high-yield]
  - id: dm.L18.044
    kind: cloze
    topic: xo
    text: "Allopurinol is approved at {{c1::100–800 mg/day}}, but the common dose of {{c2::300 mg/day}} fails to reach urate below 6 mg/dl in {{c3::50%}} of cases."
    src: { page: 238, quote: "the most common dose of 300 mg/ day failed to achieve a serum urate level of < 6 mg/ dl in 50%" }
    status: unverified
    tags: [numbers, high-yield]
    update:
      text: "Start allopurinol at no more than 100 mg/day (lower in CKD stage 4 and above) and titrate to the urate target, rather than a fixed 300 mg; test for HLA-B*5801 before starting in Southeast Asian and African American patients."
      ref: "ACR Guideline for the Management of Gout 2020"
  - id: dm.L18.045
    kind: card
    topic: xo
    front: "Purine catabolism (p239 figure): where do the urate-lowering drugs act?"
    back: "Purines → hypoxanthine → (XO) xanthine → (XO) uric acid → (uricase) allantoin. XO inhibitors (allopurinol, oxipurinol, febuxostat) block both XO steps; uric oxidase (rasburicase, PEG-uricase) turns uric acid into allantoin."
    src: { page: 239, quote: "Purine Nucleotide Catabolism" }
    status: unverified
  - id: dm.L18.046
    kind: enumerate
    topic: xo
    prompt: Mention the considerations during allopurinol therapy.
    points:
      - Induction of an acute attack of gout
      - GIT side effects
      - Bone marrow suppression
      - Renal impairment
    pass: 4
    src: { page: 239, quote: "Considerations during allopurinol therapy: Induction of an acute attack of gout GIT side effects Bone marrow suppression Renal impairment" }
    status: unverified
  - id: dm.L18.047
    kind: table
    topic: xo
    title: Allopurinol drug interactions
    columns: [Drug, Interaction]
    rows:
      - [Azathioprine and 6-mercaptopurine, Metabolized by XO (allopurinol raises their levels)]
      - [Large doses of salicylates, Increase oxipurinol excretion and reduce allopurinol's effect]
      - [Phenytoin, Reduces hepatic oxidation of allopurinol]
      - [Theophylline, Allopurinol reduces its metabolism and induces toxicity]
      - [Ampicillin and related drugs, More skin reactions]
    blanks: [[0, 1], [1, 1], [3, 1], [4, 1]]
    src: { page: 239, quote: "Azathioprine and 6-mercaptopurine are metabolized by XO" }
    status: unverified
    tags: [high-yield]
  - id: dm.L18.048
    kind: mcq
    topic: xo
    stem: A renal transplant patient on azathioprine develops gout and is started on allopurinol at the usual dose. Two weeks later he has severe pancytopenia. Why?
    options:
      - Azathioprine is metabolized by xanthine oxidase, so allopurinol raises its levels
      - Allopurinol increases azathioprine excretion
      - Salicylates reduced the effect of allopurinol
      - Phenytoin reduced hepatic oxidation of allopurinol
      - Ampicillin rash
    answer: 0
    why:
      - "Correct: azathioprine and 6-MP are metabolized by XO (p239); blocking XO lets them accumulate and suppress the marrow."
      - "The opposite: XO inhibition reduces their breakdown."
      - Salicylates are not in the story.
      - Phenytoin is not in the story.
      - Skin reactions with ampicillin do not cause pancytopenia.
    src: { page: 239, quote: "Azathioprine and 6-mercaptopurine are metabolized by XO" }
    status: unverified
  - id: dm.L18.049
    kind: card
    topic: xo
    front: Why is allopurinol difficult in renal impairment?
    back: Its dose must be reduced as GFR falls, which makes the urate target hard to reach.
    src: { page: 240, quote: "allopurinol dose should be reduced with a reduction of GFR. This imposes difficulty in achieving the target serum urate values" }
    status: unverified
  - id: dm.L18.050
    kind: card
    topic: xo
