  kind: essay
  topic: definition
  prompt: Mention the definition and clinical presentations of ALF.
  outline:
  - Definition:
    - HE + coagulopathy (INR usually >1.5) + jaundice without prior cirrhosis
    - 'Trey & Davidson: HE within 8 weeks; 1993: hyperacute ≤7 d, acute 8–28 d, subacute 5–12 weeks'
    - 'Exceptions: de novo AIH, Budd-Chiari, Wilson'
  - Presentations:
    - 'Hyperacute: severe coagulopathy, very high transaminases, mild jaundice; better recovery'
    - 'Subacute: deep jaundice, milder enzymes, ascites, splenomegaly, shrinking liver; poor once HE'
  - Clinical features:
    - Malaise, nausea, jaundice, HE → cerebral edema
    - Infection, hypoglycemia, hyperdynamic circulation, renal failure, acidosis
  src:
    page: 173
    quote: "In contrast, subacute presentations often have a milder increase in serum transaminases, deep jaundice and mild to moderate coagulopathy."
