        quote: "Consider intestinal infarction in patients with persisting severe abdominal pain, rectal bleeding, moderate or massive ascites, or multiorgan dysfunction."
        text: |
          علامات الخطر: ==intestinal infarction==. لو العيان عنده واحدة من دول، فكّر إن الجلطة نزلت على الـ mesenteric veins والأمعاء بتموت:

          - **Persisting severe abdominal pain**
          - **Rectal bleeding**
          - **Moderate or massive ascites**
          - **Multiorgan dysfunction**

          وتابعه عن قرب لأي deterioration.
      - kind: explain
        page: 74
        quote: "Acute portal vein thrombosis: Aims of therapy: Prevent extension of thrombosis to mesenteric veins. Achieve portal vein recanalization."
        title: "العلاج: هدفين بس"
        text: |
          للعلاج هدفين بس (p74):

          1. امنع الجلطة تمتد للـ **mesenteric veins**، علشان الأمعاء ماتموتش.
          2. افتح الـ portal vein (**recanalization**)، علشان ماتتحولش لـ cavernoma.

          **Recommendations (p75):**

          - ==Immediate LMWH==: لو مفيش major contraindication.
          - ==Oral VKA==: للمدى الطويل، والـ target **INR 2–3**.
          - **Duration**: 6 شهور على الأقل.
          - ==Anti-Xa monitoring==: في الـ overweight والـ pregnancy والـ poor kidney function، والـ target 0.5–0.8 IU/mL. ليه دول بالذات؟ لأن الـ LMWH بيطلع من الكلى وجرعته بالوزن، فالجرعة المحسوبة ممكن تطلع أكتر أو أقل من اللازم.
          - **HIT screen**: لو الـ platelets نزلت فجأة ≥ 50% أو لأقل من 150 × 10⁹/L.
