        title: "Residual risk والـ EPA"
        quote: "the addition of icosapent ethyl EPA 4gm can be considered to reduce cardiovascular risk."
        text: |
          الـ **non-HDL-C** = كل الـ atherogenic: remnants و VLDL و IDL و LDL و Lp(a). يعني الـ LDL مش كل الحكاية.

          ==REDUCE-IT==: عيان **ASCVD** أو risk factors، على **statin** والـ **LDL مظبوط**، بس الـ **TG 135-499** mg/dL ← زوّد **icosapent ethyl (EPA) 4 g** يوميًا.
