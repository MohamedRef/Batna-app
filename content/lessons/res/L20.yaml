  - kind: explain
    page: 64
    quote: |-
      Case control study
      Were the cases clearly defined (standard case definition)?
      Were the cases representative of a defined population?
      How were the controls selected and were they drawn from the same population as the cases?
      Were study measures (exposure) identical for cases and controls?
      Were study measures objective or subjective and is recall bias likely if they were subjective?
    title: 'Case-control: الحالات والـ controls والذاكرة'
    text: |-
      - الـ cases متعرّفة واضح (==standard case definition==)؟ وبتمثّل population محددة؟
      - الـ controls اتختاروا إزاي؟ ومن **نفس الـ population**؟
      - الـ exposure اتقاس **بنفس الطريقة** للاتنين؟
      - القياس objective ولا subjective؟ ولو subjective، فيه **recall bias**؟
    remind:
    - res.L20.090
  - kind: explain
    page: 65
    quote: |-
      Cross sectional study
      Was the study sample clearly defined?
      Was a representative sample achieved (e.g. was the response rate sufficiently high)?
      Were all relevant exposures, potential confounding factors and outcomes measured accurately?
      Were patients with a wide range of severity of disease assessed?
    title: Cross-sectional checklist
    text: |-
      - العينة محددة بوضوح؟
      - ممثلة؟ (مثلًا الـ ==response rate== عالي كفاية؟)
      - الـ exposures والـ confounders والـ outcomes اتقاست بدقة؟
      - دخلت **كل درجات شدة المرض** (wide range of severity)؟
    remind:
    - res.L20.092
  - kind: explain
    page: 66
    quote: |-
      Case series study
      Were cases identified prospectively or retrospectively?
      Are the cases a representative sample (e.g. a consecutive series of individuals recruited from multiple centers) and similar to patients in your practice?
      Were all relevant exposures, potential confounding factors and outcomes measured accurately?
    title: Case series checklist
    text: |-
      - الحالات اتجمعت ==prospectively or retrospectively==؟
      - ممثلة (مثلًا **consecutive series** من كذا مركز) وشبه العيانين عندك؟
      - الـ exposures والـ confounders والـ outcomes اتقاست بدقة؟
    remind:
    - res.L20.094
  - kind: explain
    page: 67
    quote: |-
      Study of diagnostic accuracy
      Does the sample of patients represent the full spectrum of patients with and without the diagnosis of interest?
      Was there a comparison with an appropriate 'gold-standard' test?
      Did all patients receive both the test under evaluation and the same 'gold-standard' test?
      Were the tests performed independently with blinding of assessors to the results of the 'gold-standard' test?
      Were the cut-offs that were used to classify patients as having a positive test result clearly described?
    title: Diagnostic accuracy
    text: |-
      - العينة بتمثل ==full spectrum== المرضى (معاهم وبدون المرض)؟
      - اتقارن بـ **gold standard** مناسب؟
      - **كل** المرضى خدوا الـ test والـ gold standard نفسه؟
      - الـ tests اتعملت مستقلة والمقيّم **blinded** لنتيجة الـ gold standard؟
      - الـ **cut-offs** متوصفة بوضوح؟
    remind:
    - res.L20.095
  - kind: match
    page: 62
    quote: CONSORT...Consolidated standards of reporting trials diagram detailing patient flow-through within the RCT.
    prompt: وصّل كل نوع دراسة بالـ reporting diagram بتاعه
    pairs:
    - - Systematic review / meta-analysis
      - PRISMA
    - - Randomized controlled trial
      - CONSORT
    - - Diagnostic accuracy study
      - STARD
    why: PRISMA للـ search واختيار المقالات، CONSORT لمسار المرضى في الـ RCT، STARD لدراسات دقة الاختبار.
  - kind: explain
    page: 69
    quote: |-
      Key points
      Critical appraisal is a systematic process used to identify the strengths and weaknesses of a research article
      Critical appraisal provides a basis for decisions on whether to use the results of a study in clinical practice
      Different study designs are prone to various sources of systematic bias
      Design-specific, critical-appraisal checklists are useful tools to help assess study quality
      Other factors are an important part of the critical appraisal process. these include:
      the importance of the research question
      the appropriateness of statistical analysis
      the validity of conclusions
      potential conflicts of interest
    title: الخلاصة
    text: |-
      - الـ critical appraisal = ==systematic process== لنقاط القوة والضعف، وأساس قرار تستخدم النتايج في الـ **clinical practice** ولا لأ.
      - كل تصميم ليه مصادر **systematic bias** بتاعته، فالـ **design-specific checklists** بتساعد.
      - وكمان: أهمية السؤال، ملاءمة التحليل، صحة الاستنتاج، والـ **conflicts of interest**.
    remind:
    - res.L20.099
