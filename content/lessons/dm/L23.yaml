schema: batna.lesson/v1
lecture: dm.L23
lessons:
  # ------------------------------------------------------------------
  - id: dm.L23.lesson1
    title: "ESC 2019: الخطر الأول، وبعدين الرقم"
    hook: "قبل ما تكتب statin، اسأل سؤال واحد: العيان ده في أنهي درجة من السلم؟ الدرجة هي اللي بتحدد الـ LDL لازم ينزل لكام."
    minutes: 8
    pages: [283, 285]
    topics: [risk, goals, diabetes]
    goals:
      - "تصنّف العيان في 4 درجات خطر حسب ESC/EAS 2019"
      - "تحفظ الـ LDL-C goal لكل درجة ومعاها شرط الـ 50%"
      - "تعرف توصيات الـ statin في السكر، ومين ما ياخدش"
    status: unverified
    steps:
      - kind: explain
        page: 283
        title: "Very high: خمس بوابات"
        quote: "Documented ASCVD, either clinical or unequivocal on imaging."
        text: |
          الكتاب ماشي على ==ESC/EAS 2019==. العيان يبقى **very high** لو عنده واحدة من دول:
          - **ASCVD** موثّق: MI، angina، revascularization، stroke أو TIA، PAD، أو plaque واضح على الـ imaging.
          - **DM** مع target organ damage، أو **3 risk factors** أو أكتر، أو T1DM بدأ بدري وبقاله **أكتر من 20 سنة**.
          - **Severe CKD**: eGFR أقل من 30.
          - **SCORE ≥ 10%**.
          - **FH** ومعاه ASCVD أو risk factor تاني.
      - kind: explain
        page: 284
        title: "High، moderate، low"
        quote: "Markedly elevated single risk factors, in particular TC >8 mmol/L (>310 mg/dL), LDL-C >4.9 mmol/L (>190 mg/dL)"
        text: |
          - ==High==: risk factor واحد عالي جدًا (TC أكتر من **310**، LDL-C أكتر من **190**، BP **180/110** أو أكتر)، أو **FH لوحده**، أو DM من غير organ damage بس بقاله **10 سنين** أو معاه risk factor، أو eGFR **30-59**، أو SCORE **5 لـ أقل من 10%**.
          - **Moderate**: سكري صغير (T1DM أقل من 35، T2DM أقل من 50) بقاله أقل من 10 سنين ومن غير risk factors، أو SCORE **1 لـ أقل من 5%**.
          - **Low**: SCORE أقل من **1%**.
      - kind: sort
        page: 284
        quote: "Patients with FH without other major risk factors."
        prompt: "Very high ولا high؟"
        bins: ["Very high", "High"]
        cards:
          - { text: "Previous MI", bin: 0 }
          - { text: "eGFR 25", bin: 0 }
          - { text: "FH plus smoking", bin: 0 }
          - { text: "FH alone", bin: 1 }
          - { text: "eGFR 45", bin: 1 }
          - { text: "LDL-C 200, nothing else", bin: 1 }
          - { text: "DM with retinopathy", bin: 0 }
          - { text: "DM 12 years, no organ damage", bin: 1 }
        why: "ASCVD و eGFR أقل من 30 و FH + risk factor و DM + organ damage = very high. FH لوحده و eGFR 30-59 و LDL أكتر من 190 لوحده و DM طويل من غير damage = high."
      - kind: figure
        page: 285
        quote: "Treatment goal for LDL-C"
        title: "السلم: كل ما الخطر يعلى، الرقم ينزل"
        alt: "A staircase going down from left to right. Low risk: LDL-C goal under 116 mg/dL (3.0 mmol/L). Moderate: under 100 (2.6). High: under 70 (1.8) and at least 50 percent reduction. Very high: under 55 (1.4) and at least 50 percent reduction. A side note: a second event within 2 years may aim under 40 (1.0)."
        caption: "**116 ← 100 ← 70 ← 55**. في الـ high والـ very high لازم كمان ==≥ 50% reduction== من الـ baseline."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="20" width="72" height="50" rx="8" class="fg-box"/>
            <text x="46" y="40" text-anchor="middle" class="t-sm t-b">Low</text>
            <text x="46" y="60" text-anchor="middle" class="t-b">&lt; 116</text>
            <rect x="88" y="70" width="72" height="50" rx="8" class="fg-acc"/>
            <text x="124" y="90" text-anchor="middle" class="t-sm t-b">Moderate</text>
            <text x="124" y="110" text-anchor="middle" class="t-b">&lt; 100</text>
            <rect x="166" y="120" width="72" height="50" rx="8" class="fg-bad"/>
            <text x="202" y="140" text-anchor="middle" class="t-sm t-b">High</text>
            <text x="202" y="160" text-anchor="middle" class="t-b">&lt; 70</text>
            <rect x="244" y="170" width="76" height="50" rx="8" class="fg-bad"/>
            <text x="282" y="190" text-anchor="middle" class="t-sm t-b">Very high</text>
            <text x="282" y="210" text-anchor="middle" class="t-b">&lt; 55</text>
            <rect x="166" y="20" width="154" height="44" rx="8" class="fg-good"/>
            <text x="243" y="38" text-anchor="middle" class="t-sm">High + very high:</text>
            <text x="243" y="56" text-anchor="middle" class="t-sm t-b">also ≥ 50% fall</text>
            <text x="10" y="200" class="t-sm t-mut">LDL-C mg/dL</text>
            <text x="10" y="240" class="t-sm t-mut">2nd event &lt; 2 y: &lt; 40 may be considered</text>
          </svg>
      - kind: mnemonic
        page: 284
        quote: "In individuals at moderate risk, an LDL-C goal of <2.6 mmol/L (<100 mg/dL) should be considered."
        word: "LMHV"
        parts:
          - { key: "L", text: "Low: < 116 mg/dL (3.0 mmol/L)" }
          - { key: "M", text: "Moderate: < 100 mg/dL (2.6)" }
          - { key: "H", text: "High: < 70 mg/dL (1.8) + ≥ 50%" }
          - { key: "V", text: "Very high: < 55 mg/dL (1.4) + ≥ 50%" }
        hook: "اطلع السلم بالعكس: **116، 100، 70، 55**، وآخر درجة سرية: **40** لو جاله event تاني في سنتين."
      - kind: check
        page: 284
        quote: "experience a second vascular event within 2 years"
        question: "A patient with ASCVD has a second MI 18 months after the first, while on maximal statin. Which LDL-C goal may be considered?"
        options:
          - "< 40 mg/dL (1.0 mmol/L)"
          - "< 55 mg/dL"
          - "< 70 mg/dL"
          - "< 100 mg/dL"
        answer: 0
        why:
          - "صح: event تاني خلال سنتين على statin = أقل من 40 (IIb)."
          - "ده الـ goal العادي للـ very high."
          - "ده الـ high."
          - "ده الـ moderate."
      - kind: explain
        page: 285
        title: "السكر في ESC 2019"
        quote: "Statin therapy is not recommended in premenopausal patients with diabetes who are considering pregnancy"
        text: |
          - **T2DM very high**: ≥ 50% و أقل من **55**. **T2DM high**: ≥ 50% و أقل من **70** (I A).
          - **T1DM** في high أو very high risk: statin (I A).
          - ==Intensify== الـ statin الأول، وبعدين لو الـ goal ماتحققش زوّد **ezetimibe**.
          - **ممنوع** (III): ست سكرية قبل الـ menopause **بتخطط للحمل** أو مش بتستخدم وسيلة منع حمل كويسة.
          - ممكن (IIb): سكري **30 سنة أو أصغر** عنده end-organ damage و/أو LDL-C أكتر من 2.5 mmol/L، طالما مفيش حمل.
      - kind: case
        page: 285
        quote: "Intensification of statin therapy should be considered before the introduction of combination therapy."
        stem: "ست عندها 34 سنة، T1DM من 22 سنة، مفيش مضاعفات، LDL-C 150 mg/dL، ومش بتخطط للحمل وبتستخدم IUD."
        steps:
          - question: "Her ESC/EAS 2019 risk category?"
            options: ["Very high", "High", "Moderate", "Low"]
            answer: 0
            why: "T1DM بدأ بدري وبقاله أكتر من 20 سنة = very high."
          - question: "Her LDL-C plan?"
            options: ["≥ 50% fall and < 55 mg/dL", "< 70 only", "< 100", "No statin: she is premenopausal"]
            answer: 0
            why: "Very high: الاتنين مع بعض. الـ III بتاعة الـ premenopausal بس لو بتخطط للحمل أو من غير contraception."
          - reveal: "على atorvastatin 20 mg الـ LDL بقى 95."
            question: "Next step?"
            options: ["Increase to high-intensity statin", "Add ezetimibe straight away", "Add fenofibrate", "Stop the statin"]
            answer: 0
            why: "زوّد الـ statin الأول (IIa)، وبعدين ezetimibe لو لسه فوق الـ goal."
      - kind: update
        page: 283
        quote: "2019 ESC/EAS Guidelines for the management of dyslipidaemias: lipid modification to reduce cardiovascular risk"
        text: "الـ **SCORE** القديم (fatal CVD بس) اتغيّر من 2021 لـ **SCORE2 / SCORE2-OP** (fatal و non-fatal)، وفيه **2025 focused update** للـ guideline. في الامتحان جاوب بأرقام الكتاب (2019)."
        ref: "ESC CVD prevention guidelines 2021; ESC/EAS dyslipidaemia focused update 2025"
      - kind: try
        items: [dm.L23.002, dm.L23.007, dm.L23.009, dm.L23.013, dm.L23.015]
    recap:
      - "Very high: ASCVD، DM + organ damage أو 3 RF أو T1DM أكتر من 20 سنة، eGFR أقل من 30، SCORE ≥ 10%، FH + ASCVD/RF."
      - "High: TC أكتر من 310 أو LDL أكتر من 190 أو BP ≥ 180/110، FH لوحده، DM ≥ 10 سنين، eGFR 30-59، SCORE 5-10%."
      - "Goals: 116، 100، 70، 55 (والـ high/very high + ≥ 50%)، و 40 لو event تاني في سنتين."
      - "السكر: زوّد الـ statin الأول ثم ezetimibe؛ لا statin لو بتخطط للحمل."
    practice: [dm.L23.001, dm.L23.002, dm.L23.003, dm.L23.004, dm.L23.005, dm.L23.006, dm.L23.007, dm.L23.008, dm.L23.009, dm.L23.010, dm.L23.011, dm.L23.012, dm.L23.013, dm.L23.014, dm.L23.015, dm.L23.016, dm.L23.017, dm.L23.060]
  # ------------------------------------------------------------------
  - id: dm.L23.lesson2
    title: "الـ statin: مين، قد إيه، وليه مش كفاية؟"
    hook: "الـ statin هو العمود. بس 4 من كل 10 لسه بيجيلهم CVD حتى والـ LDL مظبوط. نبدأ بالعمود ونشوف فين بيقصّر."
    minutes: 8
    pages: [286, 290]
    topics: [ada, intensity, lower, unmet]
    goals:
      - "تمشي في الـ ADA statin algorithm حسب السن والوقاية"
      - "تفرق بين high و moderate و low intensity بالجرعات"
      - "تعرف ليه lower is better، وإيه الـ unmet need والـ residual risk"
    status: unverified
    steps:
      - kind: figure
        page: 286
        quote: "High risk High intensity"
        title: "شجرة الـ ADA"
        alt: "Decision tree. Statin splits into primary and secondary prevention. Primary: age 20 to 39, no risk means no statin, risk means initiate; age 40 to 75, high risk means high intensity aiming LDL under 70 and over 50 percent fall, otherwise add ezetimibe or PCSK9 inhibitor, no risk means moderate intensity; over 75, continue if on statin, otherwise initiate. Secondary: high intensity, LDL under 55 and over 50 percent fall, if not at target add ezetimibe or PCSK9 inhibitor."
        caption: "**1ry**: السن بيقسم (20-39، 40-75، فوق 75). **2ry**: ==high intensity== على طول، والهدف أقل من **55**."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L23a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="115" y="8" width="100" height="30" rx="8" class="fg-acc"/>
            <text x="165" y="28" text-anchor="middle" class="t-b">Statin</text>
            <path d="M140 38 L95 58" class="fg-arrow" marker-end="url(#L23a)"/>
            <path d="M190 38 L262 58" class="fg-arrow" marker-end="url(#L23a)"/>
            <rect x="10" y="60" width="200" height="26" rx="8" class="fg-box"/>
            <text x="110" y="78" text-anchor="middle" class="t-sm t-b">Primary prevention</text>
            <rect x="218" y="60" width="102" height="26" rx="8" class="fg-bad"/>
            <text x="269" y="78" text-anchor="middle" class="t-sm t-b">Secondary</text>
            <rect x="10" y="96" width="62" height="78" rx="8" class="fg-box"/>
            <text x="41" y="114" text-anchor="middle" class="t-sm t-b">20-39</text>
            <text x="41" y="136" text-anchor="middle" class="t-sm">No RF: none</text>
            <text x="41" y="156" text-anchor="middle" class="t-sm">RF: start</text>
            <rect x="78" y="96" width="70" height="78" rx="8" class="fg-box"/>
            <text x="113" y="114" text-anchor="middle" class="t-sm t-b">40-75</text>
            <text x="113" y="136" text-anchor="middle" class="t-sm">High RF: high</text>
            <text x="113" y="156" text-anchor="middle" class="t-sm">No RF: mod.</text>
            <rect x="154" y="96" width="56" height="78" rx="8" class="fg-box"/>
            <text x="182" y="114" text-anchor="middle" class="t-sm t-b">&gt; 75</text>
            <text x="182" y="136" text-anchor="middle" class="t-sm">On it: keep</text>
            <text x="182" y="156" text-anchor="middle" class="t-sm">Not: start</text>
            <rect x="218" y="96" width="102" height="78" rx="8" class="fg-bad"/>
            <text x="269" y="114" text-anchor="middle" class="t-sm t-b">High intensity</text>
            <text x="269" y="136" text-anchor="middle" class="t-sm">LDL &lt; 55</text>
            <text x="269" y="156" text-anchor="middle" class="t-sm">and &gt; 50% fall</text>
            <rect x="78" y="186" width="70" height="44" rx="8" class="fg-acc"/>
            <text x="113" y="204" text-anchor="middle" class="t-sm">LDL &lt; 70</text>
            <text x="113" y="222" text-anchor="middle" class="t-sm">&gt; 50% fall</text>
            <path d="M113 230 L113 250" class="fg-arrow" marker-end="url(#L23a)"/>
            <path d="M269 174 L269 250" class="fg-arrow" marker-end="url(#L23a)"/>
            <rect x="60" y="252" width="260" height="38" rx="8" class="fg-good"/>
            <text x="190" y="276" text-anchor="middle" class="t-sm t-b">Not at target: add ezetimibe or PCSK9i</text>
          </svg>
      - kind: check
        page: 286
        quote: "LDL<55 >50% If not target Add Ezitimibe or PCSK9I"
        question: "A 70-year-old diabetic with a previous stroke. According to the ADA algorithm, which statin intensity?"
        options:
          - "High intensity, LDL-C < 55 and > 50% fall"
          - "Moderate intensity"
          - "Only if already on a statin"
          - "No statin over 65"
        answer: 0
        why:
          - "صح: stroke = secondary prevention = high intensity على طول."
          - "الـ moderate للـ 40-75 من غير risk factors."
          - "قاعدة 'لو بياخده كمّل' دي للـ primary فوق 75."
          - "مفيش حد سن بيمنع الـ statin في الـ secondary."
      - kind: table
        page: 287
        quote: "Daily dose lowers LDL-C on average, by approximately ≥50%"
        title: "الجرعات اللي لازم تحفظها"
        columns: [Intensity, LDL-C fall, Doses]
        rows:
          - ["High", "≥ 50%", "Atorva 40-80, rosuva 20-40"]
          - ["Moderate", "30-49%", "Atorva 10-20, rosuva 5-10, simva 20-40"]
          - ["Low", "< 30%", "Simva 10, prava 10-20"]
        hide: [[0, 2], [1, 1]]
      - kind: mnemonic
        page: 287
        quote: "Rosuvastatin 20-40 mg"
        word: "RA"
        parts:
          - { key: "R", text: "Rosuvastatin: 20-40 high, 5-10 moderate" }
          - { key: "A", text: "Atorvastatin: 40-80 high, 10-20 moderate" }
        hook: "**الـ high = ضعف الـ moderate**: rosuva **20** مقابل 10، atorva **40** مقابل 20. والـ ==simvastatin 80== ممنوع يتبدأ (myopathy و rhabdo)."
      - kind: explain
        page: 288
        title: "Lower is better"
        quote: "No level of LDL-C below which benefit ceases or harm occurs has been defined."
        text: |
          - **مفيش رقم** تحت منه الفايدة بتقف أو الضرر يبدأ.
          - كل ما الـ LDL-C يوصل أوطى، الـ CV events تقل، ومن غير ==J-curve==.
          - دراسات الأمان على الـ LDL الواطي جدًا مطمّنة، بس محتاجة متابعة أطول.
          - وفوق كده للـ statin **pleiotropic effects**: ↓ platelet activation، ↓ coagulation، ↓ inflammation، ↓ oxidative stress، endothelium أحسن.
      - kind: explain
        page: 289
        title: "فين الـ statin بيقصّر؟"
        quote: "Statins side effects"
        text: |
          **Side effects** في صورة الكتاب: ==SAMS== (ألم وضعف عضلات)، صداع، أرق، دوخة ونعاس، مشاكل جلد وهضم، **سكر عالي**، وصفايح قليلة.

          **Unmet need** في 3 مجموعات:
          - **FH**: 1 من كل 200-250، LDL من غير علاج **200-400**، و 79% مش واصلين للـ goal.
          - **High / very high risk**: 59% من الـ very high مش تحت 70.
          - **Statin intolerant**: 10-15% على الـ high intensity.
      - kind: reveal
        page: 290
        quote: "Despite well-controlled LDL-C levels through statin administration, up to 40% patients still experience CV disease. (residual risk)"
        prompt: "الـ LDL مظبوط على الـ statin. يبقى العيان في أمان؟"
        answer: "لأ: لحد **40%** لسه بيجيلهم CVD. ده اسمه ==residual risk==، وجزء كبير منه من الـ **TG-rich lipoproteins** (هنشوفه في آخر درس)."
      - kind: table
        page: 290
        quote: "High-intensity statin is not enough; what comes next?"
        title: "ADA: اتنين ممنوع يتجمعوا مع الـ statin"
        columns: [Combination, Problem, Grade]
        rows:
          - ["Statin + fibrate", "No better ASCVD outcomes", "A"]
          - ["Statin + niacin", "No benefit, may raise stroke", "A"]
        hide: [[0, 1], [1, 1]]
      - kind: try
        items: [dm.L23.018, dm.L23.021, dm.L23.023, dm.L23.026, dm.L23.030]
    recap:
      - "ADA: 20-39 بالـ risk بس، 40-75 high لو فيه risk (أقل من 70) و moderate لو مفيش، فوق 75 كمّل أو ابدأ."
      - "Secondary: high intensity، أقل من 55 و أكتر من 50%، وإلا ezetimibe أو PCSK9i."
      - "High: atorva 40-80، rosuva 20-40 (≥ 50%). Moderate: 30-49%. Simva 80 ممنوع يتبدأ."
      - "Lower is better، مفيش J-curve. Residual risk لحد 40%. Fibrate أو niacin مع الـ statin: لأ."
    practice: [dm.L23.018, dm.L23.019, dm.L23.020, dm.L23.021, dm.L23.022, dm.L23.023, dm.L23.026, dm.L23.027, dm.L23.028, dm.L23.029, dm.L23.030, dm.L23.031]
