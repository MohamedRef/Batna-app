lecture: rheum.L11
lessons:
  # ------------------------------------------------------------------
  - id: rheum.L11.lesson1
    title: "المناعة جيش: مين اللي وقع؟"
    hook: "طفل كل شهر بالتهاب جديد: الميكروب نفسه هيقولك أنهي سلاح في الجيش مكسور."
    minutes: 8
    pages: [180, 184]
    topics: [types, evaluation, clues]
    goals:
      - "تعدّ أنواع الـ primary immunodeficiency حسب الذراع"
      - "تربط نوع الميكروب بالذراع الواقع"
      - "تفرق بين immunodeficiency وسبب تشريحي"
    status: unverified
    steps:
      - kind: explain
        page: 180
        title: "ستة أبواب"
        quote: "B cell deficiencies. T cell deficiencies. Combined T cell & B cell abnormalities. Complement Deficiencies. Phagocyte deficiencies. Various unknown."
        text: |
          الكتاب بيقسم الـ primary immunodeficiency على ==ستة أبواب==:
          1. **B cell deficiencies**: XLA، selective Ig deficiency
          2. **T cell deficiencies**: DiGeorge، chronic mucocutaneous candidiasis، hyper-IgM (الكتاب حاطه هنا)
          3. **Combined T & B**: ==SCID==، Wiskott-Aldrich، ataxia-telangiectasia
          4. **Complement deficiencies**
          5. **Phagocyte deficiencies**: LAD، CGD، Chédiak-Higashi، Job's (hyper-IgE)، cyclic neutropenia
          6. **Various unknown**
      - kind: sort
        page: 180
        quote: "Severe Combined Immunodeficiency Disease (SCID). Wiskott-Aldrich syndrome. Ataxia-telangiectasia."
        prompt: "حط كل مرض في الباب بتاعه زي ما الكتاب قسمه:"
        bins: ["B cell", "T cell", "Combined", "Phagocyte"]
        cards:
          - { text: "X-linked agammaglobulinemia", bin: 0 }
          - { text: "Selective IgA deficiency", bin: 0 }
          - { text: "DiGeorge syndrome", bin: 1 }
          - { text: "Chronic mucocutaneous candidiasis", bin: 1 }
          - { text: "SCID", bin: 2 }
          - { text: "Wiskott-Aldrich syndrome", bin: 2 }
          - { text: "Ataxia-telangiectasia", bin: 2 }
          - { text: "Chronic granulomatous disease", bin: 3 }
          - { text: "Chédiak-Higashi syndrome", bin: 3 }
        why: "الـ XLA والـ IgA = B. الـ DiGeorge (thymic aplasia) والـ candidiasis = T. الـ SCID و Wiskott-Aldrich و ataxia-telangiectasia = combined. الـ CGD و Chédiak-Higashi = phagocytes."
      - kind: explain
        page: 181
        title: "التاريخ والكشف"
        quote: "Types of infections - location, frequency, and response to therapy. Immunizations, especially live virus vaccines. Family history. Social and sexual history."
        text: |
          **History:** نوع الـ infections (مكانها، تكرارها، ==response to therapy==)، الـ **immunizations** خصوصًا ==live virus vaccines==، الـ **family history**، والـ **social and sexual history**.

          **Examination:** الـ **lymphoid tissue** (لوز، غدد، thymus)، الـ **growth**، أي **congenital abnormalities** تانية، والـ infections نفسها.
      - kind: figure
        page: 182
        quote: "Opportunistic infections (viruses, protozoa, fungi) suggest a defect in the T cell arm of the immune response"
        title: "الميكروب بيشاور على الذراع"
        alt: "Two columns. Left: opportunistic organisms (viruses, protozoa, fungi such as Candida and Pneumocystis) with an arrow to the T cell arm. Right: encapsulated pyogenic bacteria (pneumococci, meningococci, H. influenzae, group A streptococci) with arrows to B cells (antibody), phagocytes and complement."
        caption: "==Opportunistic== (فيروس، protozoa، fungi) ← **T cell**. ==Encapsulated pyogenic== bacteria ← **B cell** أو phagocytes أو complement."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L11o" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="fg-head"/></marker></defs>
            <rect x="10" y="10" width="145" height="90" rx="10" class="fg-acc"/>
            <text x="82" y="34" text-anchor="middle" class="t-sm t-b">Opportunistic</text>
            <text x="82" y="54" text-anchor="middle" class="t-sm">viruses, protozoa</text>
            <text x="82" y="72" text-anchor="middle" class="t-sm">fungi (Candida,</text>
            <text x="82" y="90" text-anchor="middle" class="t-sm">Pneumocystis)</text>
            <rect x="175" y="10" width="145" height="90" rx="10" class="fg-bad"/>
            <text x="247" y="34" text-anchor="middle" class="t-sm t-b">Encapsulated</text>
            <text x="247" y="54" text-anchor="middle" class="t-sm">pneumococci</text>
            <text x="247" y="72" text-anchor="middle" class="t-sm">meningococci, Hib</text>
            <text x="247" y="90" text-anchor="middle" class="t-sm">group A strep</text>
            <path d="M82 100 L82 165" class="fg-arrow" marker-end="url(#L11o)"/>
            <path d="M190 100 L190 248" class="fg-thin"/>
            <path d="M190 132 L202 132" class="fg-arrow" marker-end="url(#L11o)"/>
            <path d="M190 182 L202 182" class="fg-arrow" marker-end="url(#L11o)"/>
            <path d="M190 232 L202 232" class="fg-arrow" marker-end="url(#L11o)"/>
            <rect x="22" y="172" width="120" height="40" rx="8" class="fg-box"/>
            <text x="82" y="197" text-anchor="middle" class="t-sm t-b">T cell arm</text>
            <rect x="207" y="114" width="115" height="36" rx="8" class="fg-box"/>
            <text x="264" y="137" text-anchor="middle" class="t-sm t-b">B cell (antibody)</text>
            <rect x="207" y="164" width="115" height="36" rx="8" class="fg-thin"/>
            <text x="264" y="187" text-anchor="middle" class="t-sm">Phagocytes</text>
            <rect x="207" y="214" width="115" height="36" rx="8" class="fg-thin"/>
            <text x="264" y="237" text-anchor="middle" class="t-sm">Complement</text>
            <text x="82" y="232" text-anchor="middle" class="t-sm t-mut">present at 3–6 months</text>
            <text x="165" y="285" text-anchor="middle" class="t-sm t-mut">B defects present late in year 1 (maternal IgG)</text>
          </svg>
      - kind: reveal
        page: 183
        quote: "Since maternal IgG crosses the placenta, infants with B cell defects tend to present late in the first year of life."
        prompt: "ليه طفل الـ B cell defect بيبان متأخر (آخر السنة الأولى) وطفل الـ T cell بيبان في أول 3–6 شهور؟"
        answer: |
          لأن ==maternal IgG== بيعدي الـ placenta ويحمي الطفل شهور لحد ما يخلص، فالـ **B cell defect** مستخبي. أما الـ **T cell** فمفيش حاجة من الأم بتعوضه، فالـ infections بتبدأ ==early in life==، غالبًا **first 3-6 months**.
      - kind: check
        page: 183
        quote: "anatomical abnormalities should be suspected if the infections occur repeatedly in one specific anatomic site (e.g. pneumonia in the right middle lobe of the lung)."
        question: "A child has had four pneumonias, all in the right middle lobe. What should you suspect first?"
        options:
          - "An anatomical abnormality in that site"
          - "Severe combined immunodeficiency"
          - "Complement deficiency"
          - "DiGeorge syndrome"
        answer: 0
        why:
          - "صح: نفس المكان كل مرة = anatomical abnormality. الـ immunodeficiency بتعمل infections generalized في organ systems كتير."
          - "الـ SCID بيعمل opportunistic infections وفشل نمو، مش فص واحد."
          - "الـ complement بيعمل encapsulated infections في أماكن مختلفة (زي Neisseria)."
          - "الـ DiGeorge = T cell، يعني opportunistic infections بدري."
      - kind: aside
        tone: trap
        page: 184
        quote: "In children with recurrent pneumonia a sweat chloride test for cystic fibrosis is indicated prior to further laboratory evaluation"
        text: |
          قبل ما تطلب immunology panel لطفل عنده **recurrent pneumonia**: اعمل ==sweat chloride test== للـ **cystic fibrosis** الأول. الكتاب صريح: **prior to further laboratory evaluation**.
      - kind: aside
        tone: analogy
        page: 184
        quote: "Patients with T cell defects will often lack identifiable lymphoid tissue such as lymph nodes, tonsils, and adenoids even at sites draining active infections."
        text: |
          الـ **T cell defect** زي معسكر فاضي: حتى والحرب شغالة جنبه، مفيش ==lymph nodes ولا tonsils== تتنفخ. ومعاه **thymus shadow** غايب في الـ chest X-ray.

          والعكس الغريب: بعض الـ **B cell** abnormalities (فشل التحول لـ plasma cells) بتعمل ==lymphoid hyperplasia== واضحة.
      - kind: try
        items: [rheum.L11.001, rheum.L11.010, rheum.L11.013, rheum.L11.014, rheum.L11.022]
    recap:
      - "ستة أبواب: B، T، combined، complement، phagocyte، unknown. الكتاب حاطط hyper-IgM تحت T."
      - "Opportunistic = T. Encapsulated pyogenic = B أو phagocytes أو complement."
      - "B يبان آخر السنة الأولى (IgG الأم)، T يبان في 3–6 شهور. نفس المكان كل مرة = anatomy، و recurrent pneumonia = sweat chloride الأول."
    practice: [rheum.L11.001, rheum.L11.002, rheum.L11.003, rheum.L11.004, rheum.L11.005, rheum.L11.006, rheum.L11.009, rheum.L11.010, rheum.L11.011, rheum.L11.012, rheum.L11.013, rheum.L11.014, rheum.L11.015, rheum.L11.016, rheum.L11.017, rheum.L11.018, rheum.L11.022, rheum.L11.023, rheum.L11.086, rheum.L11.087, rheum.L11.088]
