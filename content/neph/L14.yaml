  # ---------- p451-452: class I/II and podocytopathy ----------
  - id: neph.L14.026
    kind: card
    topic: ln-class12
    front: How are class I or II lupus nephritis with low-grade proteinuria treated?
    back: No specific immunosuppression beyond what the nonrenal (extrarenal) lupus needs.
    src: { page: 451, quote: "Patients with Class I or Class II LN generally have normal kidney function, or at most, low- grade proteinuria that is well below the nephrotic-range, and sometimes microscopic hematuria. For these patients, no specific immunosuppressive therapy beyond what is being given for nonrenal lupus is needed." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.027
    kind: card
    topic: ln-class12
    front: What is the usual clinical picture of class I or II lupus nephritis?
    back: Normal kidney function, or at most low-grade sub-nephrotic proteinuria, sometimes with microscopic hematuria.
    src: { page: 451, quote: "Patients with Class I or Class II LN generally have normal kidney function, or at most, low- grade proteinuria that is well below the nephrotic-range, and sometimes microscopic hematuria. For these patients, no specific immunosuppressive therapy beyond what is being given for nonrenal lupus is needed." }
    status: unverified
  - id: neph.L14.028
    kind: card
    topic: ln-class12
    front: What is lupus podocytopathy?
    back: Class I or II histology with nephrotic-range proteinuria or nephrotic syndrome; diffuse podocyte effacement on EM.
    src: { page: 452, quote: "Patients with Class I or II histology but with nephrotic-range proteinuria or NS are considered to have lupus podocytopathy. This diagnosis may be confirmed by demonstrating diffuse podocyte effacement on EM. Clinically and histologically, these patients are similar to those MCD or FSGS , often showing a good response to glucocorticoid treatment." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.029
    kind: card
    topic: ln-class12
    front: Which primary glomerular diseases does lupus podocytopathy resemble?
    back: Minimal change disease (MCD) or FSGS, clinically and histologically.
    src: { page: 452, quote: "Patients with Class I or II histology but with nephrotic-range proteinuria or NS are considered to have lupus podocytopathy. This diagnosis may be confirmed by demonstrating diffuse podocyte effacement on EM. Clinically and histologically, these patients are similar to those MCD or FSGS , often showing a good response to glucocorticoid treatment." }
    status: unverified
  - id: neph.L14.030
    kind: cloze
    topic: ln-class12
    text: "In lupus podocytopathy, over {{c1::90%}} of patients remit on glucocorticoid monotherapy, within a median of {{c2::4 weeks}}."
    src: { page: 452, quote: "Although there have been no RCTs, observational data showed that over 90% of patients given glucocorticoid monotherapy achieved remission within a median time of 4 weeks." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.031
    kind: card
    topic: ln-class12
    front: What maintenance is suggested for lupus podocytopathy, especially after relapses?
    back: Low-dose glucocorticoid plus another agent such as an MPAA, azathioprine or a CNI.
    src: { page: 452, quote: "Although optimal duration is not known, maintenance with low-dose glucocorticoid plus an additional agent such as mycophenolic acid analogues (MPAA), azathioprine, or a CNI is suggested, especially in patients with a history of relapse." }
    status: unverified
  # ---------- p452-454: initial therapy of class III/IV ----------
  - id: neph.L14.032
    kind: enumerate
    topic: ln-initial
    prompt: "Recommendation 10.2.3.1.1: glucocorticoids plus any one of which four options for active class III or IV lupus nephritis?"
    points:
      - Mycophenolic acid analogs (MPAA)
      - Low-dose intravenous cyclophosphamide
      - Belimumab with either MPAA or low-dose IV cyclophosphamide
      - MPAA plus a calcineurin inhibitor, if eGFR is not severely impaired
    pass: 4
    hook: "ستيرويد + «واحد من 4» = 2 لوحدهم + 2 بزيادة: MPAA، أو low-dose IV cyclophosphamide؛ أو belimumab فوق MPAA أو low-dose IV cyclophosphamide، أو MPAA + CNI لو eGFR مش واطي قوي."
    src: { page: 452, quote: "Recommendation 10.2.3.1.1: We recommend that patients with active Class III or IV LN, with or without a membranous component, be treated initially with glucocorticoids plus any one of the following:\ni. Mycophenolic acid analogs (MPAAs) (1B); or\nii. Low-dose intravenous cyclophosphamide (1B); or\niii. Belimumab and either MPAA or low-dose intravenous cyclophosphamide (1B); or\niv. MPAA and a calcineurin inhibitor (CNI) when kidney function is not severely impaired (i.e., estimated glomerular filtration rate [eGFR] <45" }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.033
    kind: card
    topic: ln-initial
    front: What eGFR limit applies to adding a CNI to MPAA for initial class III/IV therapy?
    back: Kidney function must not be severely impaired (the book quotes eGFR <45 as severe impairment).
    src: { page: 452, quote: "Recommendation 10.2.3.1.1: We recommend that patients with active Class III or IV LN, with or without a membranous component, be treated initially with glucocorticoids plus any one of the following:\ni. Mycophenolic acid analogs (MPAAs) (1B); or\nii. Low-dose intravenous cyclophosphamide (1B); or\niii. Belimumab and either MPAA or low-dose intravenous cyclophosphamide (1B); or\niv. MPAA and a calcineurin inhibitor (CNI) when kidney function is not severely impaired (i.e., estimated glomerular filtration rate [eGFR] <45" }
    status: unverified
  - id: neph.L14.034
    kind: card
    topic: ln-initial
    front: What is the starting dose of hydroxychloroquine in lupus nephritis?
    back: 4-5 mg/kg/day, maximum 400 mg daily; no more than 200 mg daily if eGFR <30.
    src: { page: 453, quote: "Figure 4: Initial treatment for classes III/IV ± V.\nInitial treatment: Active classes III, IV, III o IV ± V (ISN/RPS)\n  Hydroxychloroquine + Corticosteroids: IV bolus of methylprednisolone (250-500 mg) during 3 consecutive days, followed by oral prednisone (or equivalent), preferably using a reduced initial dose schedule (0.5-0.6 mg/kg/day) (Table 3)\n  + Double Therapy:\n    MPAA (dose ~ 2 g/day of MMF): Clinical profile: Proteinuria <3 g/24-hours; Fertility concerns; Contraindications/intolerance to cyclophosphamide; Good therapeutic compliance\n    Cyclophosphamide (Eurolupus regimen): Clinical profile: Proteinuria < 3 g/24-hours; High risk of non-adherence or therapeutic noncompliance; MPAA intolerance\n    If no reduction of proteinuria ≥25% after 2-3 months, add belimumab or CNI (e.g., cyclosporine, tacrolimus, voclosporine) according with the clinical profile (see triple therapy)\n  + Triple Therapy:\n    MPAA + Belimumab: Clinical profile: The same as for double therapy, in addition to: Extrarenal manifestations; Intense serological activity; Need to reduce corticosteroids; Previous relapses\n    MPAA + CNI (cyclosporine, tacrolimus or voclosporine): Clinical profile: The same as for double therapy, in addition to: Proteinuria ≥ 3g /24-hours o complete nephrotic syndrome; eGFR ≥ 45mL/min/1.73m2; Need to reduce corticosteroids; MPAA intolerance\n  Treatment duration:\n    MPAA: maintenance treatment for 3-5 years.\n    Cyclophosphamide: 3 months (Eurolupus regimen), followed by MPAA as maintenance treatment.\n    Belimumab: individualization.\n    CNI: 12-18 months, followed by 6-12 months of gradual tapering.\nHCQ: initial dose 4-5 mg/kg/day (maximum 400 mg daily). If eGFR 30 ml/min/1.73 m2, do not exceed 200 mg daily MPAA dose equivalent to 2 g of MMF. Cyclophosphamide: Eurolupus regimen preferred (6 biweekly i.v. pulses of 500 mg each, cumulative dose 3 g). CNI: cyclosporine (initial dose 100-200 mg daily, blood target level 60-100 ng/mL), tacrolimus (initial dose 0.05-0.07 mg/kg/day, blood target level 4-7 ng/ml), voclosporine (23.7 mg twice daily for 1-2 years, no blood target level required). Belimumab: 10 mg/kg i.v. on days 1, 15 and 29, then every 28 days. i.v.: intravenous." }
    status: unverified
    tags: [numbers, high-yield]
