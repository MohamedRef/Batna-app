      - kind: figure
        page: 202
        quote: "Classification of NHL (WHO)"
        title: "صورة الكتاب: تصنيف الـ NHL"
        image: { file: hem/L12-nhl-who-classification.webp, book: true }
        alt: "Book slide on a grey background titled Classification of NHL (WHO). It splits into B-cell lymphoma (85 percent) and T-cell lymphoma (15 percent). B-cell splits into indolent NHL (small lymphocyte lymphoma, follicular lymphoma, marginal zone B-cell lymphoma with MALT-type, splenic and nodal), aggressive NHL (diffuse large B-cell lymphoma, mantle cell lymphoma) and highly aggressive NHL (lymphoblastic lymphoma, Burkitt's lymphoma)."
        caption: |
          الـ slide اللي السلم اللي فوق متبني عليها. من فوق لتحت:

          - **العنوان**، وتحته فرعين: ==B-cell (85%)== على الشمال و **T-cell (15%)** على اليمين.
          - الـ B-cell بيتقسم تلات صناديق زرقا: **Indolent** (شمال)، **Aggressive** (النص)، **Highly aggressive** (يمين).
          - **تحت الـ indolent**: small lymphocyte، **follicular**، و marginal zone، وتحتها تلات صناديق: **MALT-type**، **splenic**، **nodal**.
          - **تحت الـ aggressive**: **diffuse large B-cell** و **mantle cell**.
          - **تحت الـ highly aggressive**: **lymphoblastic** و ==Burkitt==.

          الـ T-cell مالوش فروع في الـ slide دي؛ الكتاب بيركّز على الـ B-cell لأنه الأغلبية.
      - kind: explain
        page: 202
        quote: "Classification of NHL (WHO)\nB-cell Lymphoma (85 %)\n  Indolent NHL: small Lymphocyte Lymphoma, Follicular Lymphoma, Marginal Zone B-cell Lymphoma (MALT-Type, Splenic, Nodal)\n  Aggressive NHL: Diffuse Large B-cell Lymphoma, Mantle Cell Lymphoma\n  Highly Aggressive NHL: Lymphoblastic Lymphoma, Burkitt's Lymphoma\nT-cell Lymphoma (15%)"
        title: "اقرا السلم"
        text: |
          - **B-cell 85%**، و **T-cell 15%**.
          - ==Indolent==: small lymphocytic، follicular، marginal zone (MALT-type، splenic، nodal).
          - **Aggressive**: diffuse large B-cell (DLBCL)، mantle cell.
          - **Highly aggressive**: lymphoblastic، Burkitt.

          السلم ده مش حفظ، ده نفس اللي اتعلمته قبل كده: الـ follicular مكانه في الـ indolent **لأن** الـ BCL-2 بيمنع الموت بس (ص 191)، والـ Burkitt فوق خالص **لأن** الـ MYC بيعمل proliferation و failure of apoptosis مع بعض (ص 190). والـ MALT جه من الـ H. pylori (ص 199).
      - kind: aside
        tone: trap
        page: 202
        quote: "Classification of NHL (WHO)\nB-cell Lymphoma (85 %)\n  Indolent NHL: small Lymphocyte Lymphoma, Follicular Lymphoma, Marginal Zone B-cell Lymphoma (MALT-Type, Splenic, Nodal)\n  Aggressive NHL: Diffuse Large B-cell Lymphoma, Mantle Cell Lymphoma\n  Highly Aggressive NHL: Lymphoblastic Lymphoma, Burkitt's Lymphoma\nT-cell Lymphoma (15%)"
        text: "الـ mantle cell شكله small/intermediate، بس الـ World Health Organization (WHO) slide حاطه مع الـ aggressive جنب الـ Diffuse large B-cell lymphoma (DLBCL). ماتحطوش مع الـ indolent."
      - kind: explain
        page: 202
        quote: "Mantle cell lymphoma and a proportion of B-CLL cases have unmutated immunoglobulin genes whereas marginal zone lymphoma, diffuse large cell lymphoma, follicle cell lymphoma, lymphoplasmacytoid lymphoma and some B-CLL cases have mutated immunoglobulin genes"
        title: "الـ lymphoma جه من أنهي محطة؟"
        text: |
          الرسمة في الكتاب بتمشي مع الـ B cell: بتطلع من النخاع، تدخل الغدة، تقابل antigen فيتعمل **germinal centre** والـ B cells تعمل ==somatic hypermutation== للـ Ig genes، وبعدين تطلع **memory B cell** أو **plasma cell**.

          - **Unmutated** Ig genes: الـ **mantle cell** وجزء من الـ B-CLL.
          - **Mutated**: الـ marginal zone، الـ diffuse large cell، الـ follicle cell، الـ lymphoplasmacytoid، وبعض الـ B-CLL.

          يعني الـ mutation زي **ختم** في الباسبور: لو الـ Ig genes متغيرة، الخلية **عدّت** على الـ germinal centre قبل ما تبقى خبيثة؛ لو لأ، اتحولت **قبل** ما توصله. وعشان كده الكتاب بيقول إن الـ cellular origin بيتعرف من الـ gene rearrangement status والـ membrane phenotype.
      - kind: figure
        page: 202
        quote: "Proposed cellular origin of B-lymphoid malignancies."
        title: "صورة الكتاب: كل lymphoma جه من أنهي محطة"
        image: { file: hem/L12-b-cell-origin.webp, book: true }
        alt: "Book diagram of a lymph node follicle drawn as an orange oval inside yellow and green rings labelled germinal follicle, mantle zone and marginal zone. Naive B cells enter from the bone marrow on the left, pass through the mantle zone into the germinal centre marked Ig isotype switch with Ig mutations, and leave as a plasma cell or memory cell on the right. Arrows from each stage point to boxes: mantle cell lymphoma and B-cell chronic lymphocytic leukaemia from the mantle zone; follicular lymphoma and diffuse large cell lymphoma from the germinal centre; marginal zone lymphoma and lymphoplasmacytoid lymphoma near the exit; myeloma from the plasma cell."
        caption: |
          الرسمة اللي الخطوة اللي فوق بتحكيها: الـ **proposed cellular origin** لكل الـ B-lymphoid malignancies. امشي مع الـ B cell **من الشمال لليمين**:

          - **الشمال**: **naive B cells** جاية من الـ **bone marrow**.
          - **الحلقات**: الأخضر برّه = **marginal zone**، الأصفر = **mantle zone**، والبرتقاني جوه = ==germinal centre== («Ig isotype switch with Ig mutations»).
          - **من الـ mantle** (الشمال): سهم لفوق لـ **mantle cell lymphoma**، وسهم لتحت لـ **B-cell CLL**.
          - **من جوه الـ germinal centre**: **follicular lymphoma** (فوق) و **diffuse large cell lymphoma** (تحت في النص).
          - **عند الخروج** (اليمين): **marginal zone lymphoma**، **lymphoplasmacytoid lymphoma**، وفوق على اليمين plasma cell ← ==myeloma==.

          يعني اللي طالع **قبل** الـ germinal centre (mantle cell وجزء من الـ CLL) الـ Ig genes بتاعته unmutated، واللي **بعده** mutated.
      - kind: table
        page: 203
        quote: "Comparison of Non-Hodgkin's Lymphoma and Hodgkin's Lymphoma\n| Feature | NHL | Hodgkin's Lymphoma |\n| B- symptoms | 20% | 40% |\n| Presentation | Often extranodal | Predominantly nodal |\n| Nodal distribution | Centrifugal i.e. peripheral | Centripetal i.e. cervical, axial nodal distribution |\n| Involvement | Rarely localized | Usually localized |\n| Peripheral blood | Affected in 10-40% | Not affected |"
        title: "Hodgkin ضد NHL"
        columns: ["", "Hodgkin", "NHL"]
        rows:
          - ["B symptoms", "40%", "20%"]
          - ["Spread", "Centripetal", "Centrifugal"]
          - ["Extent", "Localized", "Rarely localized"]
          - ["Blood, marrow", "Rare", "Frequent"]
          - ["Mediastinum", "Common", "Uncommon"]
          - ["GIT, skin", "Extremely rare", "Common"]
        hide: [[0, 1], [1, 1], [3, 2], [5, 2]]
      - kind: explain
        page: 203
        quote: "Comparison of Non-Hodgkin's Lymphoma and Hodgkin's Lymphoma"
        title: "ليه الفروق دي؟"
        text: |
          - Hodgkin: ==centripetal== (cervical، axial)، predominantly **nodal**، usually **localized**، والدم **not affected**.
          - NHL: **centrifugal** (peripheral)، often **extranodal**، rarely localized، والدم affected في **10–40%**.
          - الـ B symptoms: Hodgkin **40%** و NHL **20%**.

          التفسير المقبول (مش في الكتاب): الـ Hodgkin بيمشي من غدة **للي جنبها** بالترتيب، فبيفضل محصور ونقدر نعمله staging دقيق. الـ NHL خلاياه بتلف في الدم زي الـ lymphocytes العادية، فبتلاقيه في أماكن **بعيدة** ومش مترتبة، وفي النخاع والدم. وعشان كده الـ bone marrow biopsy مهم في الـ NHL بالذات (ص 192).
      - kind: check
        page: 204
        quote: "Comparison of Non-Hodgkin's Lymphoma and Hodgkin's Lymphoma (continued)\n| Feature | NHL | Hodgkin's Lymphoma |\n| Bone marrow involvement | Frequent | Uncommon |\n| Mediastinal involvement | Uncommon except in Lymphoblastic and mediastinal Large B-cell Lymphoma | Common |\n| GIT involvement | Common | Extremely rare |\n| Skin involvement | Common | Extremely rare |\n| CNS involvement | Occasional | Extremely rare |"
        question: "A mediastinal mass in NHL suggests which types?"
