      - kind: explain
        page: 64
        quote: "EUS is primarily used to detect and stage suspected cancer of the esophagus, stomach, pancreas and rectum, by the imaging and fine-needle aspiration."
        title: "دواعي الـ EUS (سؤال امتحان)"
        text: |
          **أساسًا**: يكتشف ويعمل ==staging== لـ cancer الـ **esophagus**، **stomach**، **pancreas**، **rectum** بالـ imaging والـ **fine-needle aspiration (FNA)**.

          وكمان:
          - **Cytoimplant immunotherapy**: الإبرة بتوصل للـ tumor بدقة عالية.
          - **Fecal incontinence**، **staging lung cancer**، والأوعية بالـ **Doppler**.

          ويُنصح بيه في:
          - **Biopsy** من الـ LN المشكوك فيها، pancreatic masses، extra-intestinal masses.
          - علاج **achalasia**، و**hemostasis** لـ bleeding ulcers.
          - **Drainage** للـ cysts والـ **pseudocysts**.
          - **Celiac plexus neurolysis**.
          - **RF tumorectomy**.

          يعني القايمة كلها بتتلخّص في تلات أفعال: **نشوف** (staging، Doppler، incontinence)، **نغرز** (FNA، biopsy، immunotherapy)، و**نصرّف أو نعالج** (drainage، neurolysis، hemostasis، tumorectomy). ودي آخر سؤال في المحاضرة: «illustrate indications of EUS».
      - kind: explain
        page: 64
        quote: "With the capability of placing a needle into a primary site of the tumour with great accuracy, EUS is considered as a superior for local cytoimplant immunotherapy."
        title: "الإبرة هي اللي فرّقت"
        text: |
          الكتاب بيربط أهم ميزة في الـ EUS بالإبرة: يقدر يحط **needle** في الـ primary site بتاع الـ tumor ==with great accuracy==.

          التفسير المقبول (مش في الكتاب) لمنطق القايمة كلها: أول ما بقى عندك صورة دقيقة **و** إبرة بتوصل لنفس المكان، كل الدواعي التانية بتيجي لوحدها:
          - تاخد **biopsy** (FNA) من node أو pancreatic mass ← **staging** بالـ cytology مش بالشكل بس.
          - تحقن جوه الـ tumor ← **cytoimplant immunotherapy**.
          - تحقن جوه الـ **celiac plexus** ← **neurolysis** للألم.
          - تعدّي wire و stent من المعدة للـ **pseudocyst** ← **drainage**.
          - تحط RF probe ← **tumorectomy**.

          يعني الـ EUS = **عين + إبرة**، وكل دلالة هي استخدام للإبرة دي في مكان مختلف.
