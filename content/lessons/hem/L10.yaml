  - id: hem.L10.lesson3
    title: "تشخيص الـ PV: الـ EPO والـ JAK2 والنخاع"
    hook: "سؤالين بيحلّوا أغلب الحالات: الـ JAK2 إيه؟ والـ EPO قد إيه؟"
    minutes: 10
    pages: [160, 164]
    topics: [pv-tests, pv-criteria]
    goals:
      - "تقرأ الـ CBC والـ red cell mass والـ SaO2"
      - "تكتب الـ A/B criteria و 2016 WHO criteria"
      - "تمشي على algorithm الـ erythrocytosis"
    status: unverified
    steps:
      - kind: explain
        page: 160
        title: "الـ CBC والـ red cell mass"
        quote: "Red cell mass (measured using patient RBC labelled with 51Cr) and plasma volume (using 131 I labelled albumin) ."
        text: |
          - **CBC**: RBC و Hb عاليين، و **MCV واطي أو normal** (من الـ iron deficiency).
          - **Neutrophils و platelets** عاليين في الـ PV، ونادر ده في الـ secondary.
          - **NAP score** عالي.
          - **Red cell mass** بـ ⁵¹Cr، و **plasma volume** بـ ¹³¹I-albumin. لو ==RCM >25%== فوق المتوقع = diagnostic.
          - **SaO2 <92%** = فكّر في **secondary**.
      - kind: table
        page: 160
        quote: "Red cell mass ↑ ↑ ↑ Within NR or N Plasma volume N or ↑ N Reduced"
        title: "مين عالي ومين واطي؟"
        columns: [Measure, PV, Secondary, Relative]
        rows:
          - ["Red cell mass", "↑", "↑", "Normal range"]
          - ["Plasma volume", "N or ↑", "N", "Reduced"]
        hide: [[0, 3], [1, 1], [1, 3]]
      - kind: explain
        page: 161
        title: "باقي الـ work-up"
        quote: "Serum erythropoietin is low/subnormal in PRV , while normal/high in 2ry erythrocytosis."
        text: |
          - **Ferritin** واطي أو normal، **B12** غالبًا عالي (transcobalamin من الـ granulocytes)، وممكن folate deficiency.
          - Renal function، **uric acid** (غالبًا عالي)، LFTs.
          - **U/S بطن**، CT بطن، MRI مخ، chest X-ray، PFTs، echo حسب الحالة.
          - ==Serum EPO==: **low/subnormal** في الـ PV، **normal/high** في الـ secondary.
          - **JAK2 V617F**: sensitivity **97%**، specificity تقريبًا **100%**.
          - **Cytogenetics**: 30% (20q−، +8، +9، 13q−). **BFU-E**: endogenous erythroid colonies من غير EPO.
      - kind: explain
        page: 161
        title: "النخاع"
        quote: "Abnormal megakaryocytes (clustering with giant forms and increased ploidy)"
        text: |
          الـ **trephine** في الـ PV:
          1. Hypercellularity
          2. **Trilineage hyperplasia**
          3. ==Abnormal megakaryocytes==: clusters، giant، و ploidy أعلى
          4. Fibrosis ممكن
          5. نخاع طبيعي **ما يستبعدش** PV

          وهو **mandatory**: بيفرّق **early PV مع thrombocytosis** من الـ **ET**، وبيساعد لو الـ Hb عالي بس تحت الـ WHO threshold. ويتعاد لو شاكك في post-PV MF أو leukemia.
      - kind: check
        page: 161
        quote: "Serum erythropoietin is low/subnormal in PRV , while normal/high in 2ry erythrocytosis."
        question: "Hb 19 g/dL. Which result best separates PV from secondary erythrocytosis?"
        options: ["Low serum EPO", "Raised red cell mass", "Raised hematocrit", "Normal MCV"]
        answer: 0
