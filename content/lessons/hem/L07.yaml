      - kind: explain
        page: 111
        title: "الـ DD: مين يشبه الـ leukemia؟"
        quote: "Myelodysplastic syndrome MDS, Leukemoid reactions to infection can results in outpouring of large number of young myeloid cells. Infections mononucleosis and other viral illnesses can sometimes resemble ALL."
        text: |
          - ==Aplastic anemia==: pancytopenia زيها، بس النخاع **hypoplastic من غير blasts**. ده الفرق الحاسم في الكتاب.
          - **Myelodysplastic syndrome (MDS)**.
          - **Leukemoid reaction** لـ infection: النخاع بيطلّع **young myeloid cells كتير** في الدم، فممكن تتلخبط. التفسير المقبول (مش في الكتاب): الخلايا هنا بتنضج طبيعي وبتختفي لما الـ infection يتعالج.
          - **Infectious mononucleosis** وفيروسات تانية: ممكن **تشبه ALL**، لأن الـ lymphocytes المتنشطة بتبقى كبيرة وشكلها غريب على الـ film (التفسير المقبول).
      - kind: check
        page: 110
        quote: "Leukemia and aplastic anemia can both manifest with peripheral pancytopenia but hypoplastic BM without blasts usually distinguishes aplastic anemia."
