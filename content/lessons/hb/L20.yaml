      - kind: check
        page: 404
        question: "Malnutrition in which setting is linked to **increased waiting-list mortality**?"
        options:
          - "Liver transplantation candidates"
          - "Compensated cirrhosis only"
          - "Patients after cholecystectomy"
          - "Patients with HCC on surveillance only"
        answer: 0
        why:
          - "صح: في الـ **LT**: increased waiting list mortality و post-operative complications."
          - "الـ malnutrition بتبقى أقل وضوحًا في الـ compensated، ومفيش waiting list هنا."
          - "مش موضوع المحاضرة دي خالص. 😄"
          - "في الـ **HCC** الكتاب بيقول increased complications and reduced survival، مش waiting list."
      - kind: explain
        page: 404
        title: "الـ screening: معيارين وبس"
        text: |
          كل عيان cirrhosis أو advanced CLD، وخصوصًا الـ decompensated، ياخد **rapid nutritional screen**.

          واعتبره **high risk** على طول، من غير أي أداة، لو عنده واحد من دول:
          - ==BMI < 18.5== (underweight)
          - ==Child–Pugh C==

          ليه الـ Child C لوحده كفاية؟ لأن الـ malnutrition بتمشي مع شدة الـ liver failure، فالـ decompensation الشديدة نفسها علامة خطر.

          غير كده استخدم **nutritional screening tools** علشان تقسّمه high أو medium أو low. وأي حد at risk ياخد **detailed assessment** عند registered dietician or nutrition expert.
      - kind: aside
        tone: trap
        page: 404
        text: |
          عيان Child C والـ BMI بتاعه 24؟ برضه **high risk**.

          - الـ Child C لوحده كفاية.
          - والـ BMI الطبيعي ممكن يكون كدب: مية **ascites**، أو دهون مدارية العضل.
      - kind: figure
        page: 406
        title: "خريطة الـ screening (ملخص EASL في الكتاب)"
        alt: "Flow chart. Cirrhosis or advanced chronic liver disease. Three columns by dry-weight BMI: under 18.5 or Child-Pugh C is high risk; 18.5 to 29.9 uses a screening tool to grade high, medium or low risk; 30 or more is obesity, managed with nutritional assessment, lifestyle change and a look for sarcopenia. High and medium risk go to detailed assessment by a dietician: SGA or RFH-GA, dietary intake, and sarcopenia by CT at L3, or DEXA or BIA if there is no fluid retention. Malnutrition or sarcopenia is treated with supplementation and reassessed every 1 to 3 months in the first year. Low risk is re-screened at least once a year."
        caption: "الـ BMI يتحسب على الـ ==dry weight==. الـ high والـ medium يروحوا للـ dietician، والـ low يتعمله re-screen مرة في السنة على الأقل."
