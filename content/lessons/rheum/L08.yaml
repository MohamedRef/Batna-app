  - id: rheum.L08.lesson4
    title: "الوعاء المتوسط: Kawasaki و PAN"
    hook: "طفل سخن 5 أيام بعين حمرا ولسان فراولة، وراجل عنده foot drop وخصيته بتوجعه: نفس حجم الوعاء."
    minutes: 10
    pages: [137, 144]
    topics: [kawasaki, polychondritis, pan]
    goals:
      - "تشخّص Kawasaki وتعالجه"
      - "تعرف الـ relapsing polychondritis"
      - "تشخّص PAN وتختار علاجه حسب الـ severity"
    status: unverified
    steps:
      - kind: explain
        page: 137
        title: "Kawasaki: القاعدة"
        quote: "Fever lasting at least 5 days without any other explanation with at least 4 of the 5 following principal clinical findings"
        text: |
          ==Fever ≥5 days== مالهاش تفسير + ==≥4 من 5== principal findings.

          ولو فيه **≥4 findings** ممكن تشخّص من **اليوم الرابع**.
      - kind: mnemonic
        page: 138
        quote: "Erythema and cracking of lips, strawberry tongue, and/or erythema of oral and pharyngeal mucosa"
        word: "CRASH"
        parts:
          - { key: "C", text: "Conjunctival injection, bilateral, bulbar, no exudate" }
          - { key: "R", text: "Rash: maculopapular, erythroderma or erythema multiforme-like" }
          - { key: "A", text: "Adenopathy: cervical, ≥1 node >1.5 cm, usually unilateral" }
          - { key: "S", text: "Strawberry tongue, cracked red lips, oral erythema" }
          - { key: "H", text: "Hands and feet: erythema and oedema, then periungual peeling" }
        hook: "**CRASH and burn**: الـ burn هو الـ fever ≥5 أيام."
      - kind: explain
        page: 138
        title: "Incomplete KD"
        quote: "Incomplete KD Prolonged unexplained fever in an infant or child with <4 of the principal clinical findings of KD."
        text: |
          طفل بـ **fever طويلة** و ==<4 findings== + labs متوافقة (**ESR/CRP** عالي، transaminases عالية، urine فيها WBCs **esterase-negative**) أو echo فيه **coronary dilatation**.

          العلاج: **IVIG فورًا** عند التشخيص، مش نستنى لليوم 10.
      - kind: table
        page: 138
        quote: "IVIG Single dose of 2 gm/kg (no defined maximum dose, but the reasonable maximum range is 100–140 gm)."
        title: "جرعات Kawasaki"
        columns: [Drug, Dose]
        rows:
          - ["IVIG", "2 g/kg single dose"]
          - ["Prednisone", "2 mg/kg/day (max 60), taper 15 days"]
          - ["Aspirin high", "80–100 mg/kg/day"]
          - ["Aspirin moderate", "30–50 mg/kg/day"]
          - ["Aspirin low", "3–5 mg/kg/day"]
        hide: [[0, 1], [2, 1], [4, 1]]
      - kind: order
        page: 139
        quote: "persistent fevers after initial treatment with IVIG, a second course of IVIG is conditionally recommended over the use of glucocorticoids."
        prompt: "رتّب خطة الـ acute KD لو السخونية مش راضية تنزل:"
        steps:
          - "IVIG (+ aspirin) as initial therapy"
          - "Persistent fever: second IVIG course"
          - "Still febrile after repeated IVIG: non-GC immunosuppressive or glucocorticoids"
        why: "الـ IVIG هو الـ standard of care، والكورس التاني مفضّل على الـ steroids. بعد كذا كورس ممكن non-GC immunosuppressive أو steroids."
      - kind: check
        page: 139
        quote: "use of IVIG with adjunctive glucocorticoids as initial therapy is conditionally recommended over treatment with IVIG alone."
        question: "Acute KD at high risk of IVIG resistance or coronary aneurysm. Initial therapy?"
        options:
          - "IVIG plus adjunctive glucocorticoids"
          - "IVIG alone"
          - "Glucocorticoids alone"
          - "Aspirin alone"
        answer: 0
        why:
          - "صح: الـ high risk ياخد IVIG + steroids (أو non-GC immunomodulator)."
          - "الـ IVIG لوحده للـ standard risk."
          - "الـ steroids مش بديل للـ IVIG."
          - "الـ aspirin مساعد مش علاج لوحده."
      - kind: explain
        page: 140
        title: "Relapsing polychondritis"
        quote: "Uncommon, cartilage inflammation. Episodic. Auricular and nasal chondritis. Saddle-nose deformity."
        text: |
          التهاب ==cartilage== **episodic** ونادر: **الودن** (auricular) و **الأنف** (saddle nose)، arthritis، hearing loss، vertigo، أعراض **laryngotracheobronchial**، و vasculitis. العلاج **prednisone**.
      - kind: aside
        tone: joke
        page: 140
        quote: "Auricular and nasal chondritis. Saddle-nose deformity."
        text: |
          الـ polychondritis بتمسك أي غضروف: **auricular chondritis** تحمّر الودن، و **nasal chondritis** توقّع الأنف (**saddle-nose deformity**). الفرق إن **فص الودن** (lobule) مافيهوش غضروف، فبيفضل سليم وكأنه عامل نفسه مش من العيلة. (معلومة تشريح، مش من الكتاب.)
      - kind: explain
        page: 141
        title: "PAN: ACR 1990"
        quote: "Weight loss of more than 4 kg which is not related with diet or other factors from the beginning of the disease."
        text: |
          10 criteria:
          - **Weight loss >4 kg**، **livedo reticularis**، ==testicular pain==
          - Myalgia، **mono- أو polyneuropathy**، diastolic **>90**
          - Urea/creatinine عالي، ==HBsAg أو anti-HBs==
          - **Abnormal coeliac أو renal angiography** (aneurysms)، و biopsy فيها PMNs في الشرايين

          المعيار التاني (p141): biopsy أو angiography **mandatory** + ≥2 من 7، ولو MRA سلبي اعمل **conventional angiography**.
      - kind: figure
        page: 144
        quote: "Key recommendations for the treatment of polyarteritis nodosa (PAN)"
        title: "علاج PAN: severe ولا لأ؟"
        alt: "Algorithm. Active PAN splits into non-severe and severe. Non-severe: GC plus MTX or AZA, then remission maintenance with a non-GC agent for 18 months. Severe: high-dose oral or pulse IV GC with cyclophosphamide, then maintenance with a non-GC non-CYC agent for 18 months. No remission: consider other agents or CYC."
        caption: "الـ ==severe== (كلية، mononeuritis، mesenteric، coronary، limb ischaemia) ياخد **GC + CYC**. الـ non-severe ياخد **GC + MTX/AZA**. والاتنين maintenance **18 شهر**."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L08p" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="fg-head"/></marker></defs>
