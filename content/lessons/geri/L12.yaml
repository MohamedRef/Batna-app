        quote: "Posting and opening your own mail.\nNot giving personal information over the phone.\nUsing direct deposit for all checks.\nHaving your own phone."
        title: "نصايح للكبير"
        text: |
          الـ ==education== للكل هو أساس المنع. ولو انت الكبير:

          - خلي بالك من صحتك، واطلب مساعدة للـ drugs والكحول والاكتئاب (ليك ولعيلتك).
          - Support groups، وخطط لمستقبلك: **power of attorney** أو **living will**.
          - استشير حد مستقل تثق فيه **قبل ما تمضي** أي ورقة.
          - خليك active ومتواصل: الـ **isolation** مرتبط بالإساءة.
          - ابعت وافتح جواباتك بنفسك، ومتديش بياناتك في التليفون.
          - **Direct deposit**، وتليفون خاص بيك، وراجع الوصية كل فترة.

          ليه النصايح دي بالذات؟ كل واحدة بتقفل باب شفناه في العلامات: الـ direct deposit والجوابات والتليفون بيخلّوا الفلوس والتواصل في إيده هو (ضد الـ financial abuse والعزل)، والاستشارة قبل التوقيع ضد تغيير الـ wills والـ power of attorney.
          - اعرف حقوقك؛ في دار المسنين اتصل بالـ **Long Term Care Ombudsman**.
