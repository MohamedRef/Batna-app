            <text x="20" y="300" class="t-sm t-bad t-b">So: least to gain from ERCP</text>
          </svg>
      - kind: explain
        page: 132
        quote: "Pancreatic SOD is most commonly suspected in the setting of unexplained recurrent acute pancreatitis."
        title: "الـ pancreatic SOD"
        text: |
          الكتاب، تصنيف مشابه للـ **pancreatic SOD**:
          - **Type I**: pancreatic-type pain، و **amylase أو lipase 1.1 مرة** فوق الطبيعي (مرة واحدة كفاية)، و **pancreatic duct dilatation** (أكتر من **6 mm في الـ head** و **5 mm في الـ body**).
          - **Type II**: الألم + واحد من الاتنين.
          - **Type III**: الألم بس.

          وبيتشك فيه أكتر في ==unexplained recurrent acute pancreatitis==. والدراسات: **SO hypertension** في **30–65%** من الحالات دي، و **50–87%** في الـ **chronic pancreatitis**.

          التفسير المقبول (مش في الكتاب): نفس منطق الـ biliary Milwaukee: كل ما الأدلة الموضوعية تزيد (إنزيمات، قناة واسعة)، كل ما الـ type يبقى أقل رقمًا، وكل ما احتمال إن الـ sphincter فعلًا هو السبب يزيد.
      - kind: explain
        page: 132
        quote: "Evaluation of patients in whom SOD is suspected is initiated with liver biochemical testing, serum amylase and lipase measurements, and often abdominal imaging with either abdominal US, CT, or MRCP."
        title: "نبدأ بالسهل"
        text: |
          الكتاب، الـ **noninvasive** الأول:
          - **Liver biochemistry**، **amylase** و **lipase**، وتصوير بالـ **US** أو **CT** أو **MRCP**.
          - الـ **aminotransferases** لو عالية بتبقى **خفيفة**: أقل من **3–4 مرات** الطبيعي.
          - الكشف عادةً طبيعي، أو tenderness خفيفة في الـ RUQ أو الـ epigastrium.
          - غالبًا المريض اتعمله قبل كده منظار وأشعة وعلاج تجريبي لأسباب أشهر (**GERD**، **NAFLD**، **IBS**).
          - اختبارات الـ SOD الـ noninvasive: **biliary scintigraphy**، الـ US بعد **fatty meal** أو **CCK** أو **secretin**، و **secretin-stimulated MRI** أو **EUS**.

          التفسير المقبول (مش في الكتاب): الإنزيمات العالية **جدًا** بتشاور على حصوة أو مرض كبد، مش sphincter. والـ secretin بيزوّد إفراز البنكرياس: لو الـ duct اتنفخ ومافضّش بسرعة، يبقى فيه حاجة قافلة في المخرج.

          يعني الترتيب هنا من الآمن للخطر: تحاليل، ثم صورة، ثم اختبارات تحفيز، والـ ERCP في الآخر خالص علشان مضاعفاته عالية في المرضى دول بالذات.
      - kind: explain
        remind: [git.L03.242]
        page: 133
        quote: "Patients in whom SOD is suspected have the highest complication rates for ERCP. Such patients have a 3-fold increase in the risk of post-ERCP pancreatitis, with absolute rates exceeding 25% if no prophylactic interventions are implemented."
        title: "ERCP: خطر عالي، فاختار صح"
        text: |
          - الـ evaluation بتبدأ بـ **liver tests**، amylase و lipase، و US أو computed tomography (CT) أو MRCP. الـ transaminases لو عالية تبقى بسيطة (**less than 3–4× upper limit of normal (ULN)**).
          - Noninvasive: biliary scintigraphy، fatty meal أو CCK أو secretin-stimulated US، secretin magnetic resonance imaging (MRI) أو EUS.
          - مرضى SOD عندهم ==3-fold== خطر **post-ERCP pancreatitis**، يعني **أكتر من 25%** من غير وقاية.
          - الوقاية: ==temporary pancreatic stent== و **rectal NSAIDs**.
          - علشان كده endoscopic retrograde cholangiopancreatography (ERCP) بالـ manometry للأعراض **severe or debilitating** بس.

          الـ medical therapy (nifedipine، nitrates، octreotide، antispasmodics، phosphodiesterase 5 (PDE5) inhibitors) بتقلل الضغط بس الـ outcome data ناقصة.
      - kind: reveal
        page: 133
        quote: "Although alternative biliary imaging methods, such as MRCP and EUS, are safer than ERCP for excluding stones, tumors, and pancreas divisum, they cannot diagnose (or be used to treat) SOD."
        prompt: "ليه الـ MRCP مش كفاية، مع إنه أأمن؟"
        answer: |
          الكتاب: الـ **cholangiography** أساسية علشان تستبعد **stones** أو **tumors**. والـ **MRCP** والـ **EUS** ==safer== من الـ ERCP في استبعاد الحصوات والأورام والـ **pancreas divisum**، لكن ==cannot diagnose (or be used to treat) SOD==.

          التفسير المقبول (مش في الكتاب): الـ SOD مشكلة **ضغط** وحركة، مش شكل. الـ MRCP صورة، والصورة ما بتقيسش ضغط. اللي بيقيس هو الـ **manometry** جوه الـ sphincter، ودي محتاجة ERCP، واللي بيعالج هو الـ **sphincterotomy**، ودي كمان ERCP. علشان كده نستخدم الأمن للاستبعاد، ونسيب الـ ERCP للي هيستفيد فعلًا.
      - kind: case
        page: 133
        quote: "Although prophylactic placement of a temporary pancreatic stent and administration of rectal NSAIDs reduce the risk of post-ERCP pancreatitis, substantial morbidity and occasional mortality still occur in patients who undergo ERCP for SOD."
        stem: "A 42-year-old woman had her gallbladder removed 2 years ago. She now has recurrent steady RUQ pain lasting hours. ALT was 1.5 times normal once; the bile duct is 7 mm; MRCP shows no stones."
        steps:
          - question: "Which Milwaukee type is this?"
            options: ["Type II", "Type I", "Type III", "Not SOD"]
            answer: 0
            why: "Biliary pain + enzymes عالية بس الـ duct مش أكبر من 10 mm، يعني معيار واحد بس من التانيين: **type II**."
          - question: "Her pain is debilitating. What is the best next step?"
            options: ["ERCP with sphincter of Oddi manometry", "Empirical sphincterotomy without manometry", "Reassure; type II never benefits", "Long-term opioids"]
            answer: 0
            why: "في type II الـ relief **85%** لو الـ manometry abnormal و **35%** بس لو normal، فالـ manometry هي اللي بتقرر."
          - question: "How do you lower her risk of post-ERCP pancreatitis?"
            options: ["Temporary pancreatic stent and rectal NSAIDs", "IV antibiotics only, before the ERCP", "Skip sedation to shorten the procedure", "Nothing works; the risk is fixed"]
            answer: 0
            why: "الكتاب: **pancreatic stent** + **rectal nonsteroidal anti-inflammatory drugs (NSAIDs)** بيقللوا الخطر، بس الـ morbidity لسه موجودة، فـ endoscopic retrograde cholangiopancreatography (ERCP) للأعراض الشديدة بس."
      - kind: check
        page: 134
        quote: "Because SOM findings may be misleading in these cases (they are normal in 14% to 35% of patients), SOM is not clinically indicated for patients with type I biliary SOD. Rather, endoscopic sphincterotomy can be performed empirically."
        question: "Post-cholecystectomy biliary pain, ALT twice normal on two visits, CBD 12 mm, no stones on MRCP. Next step"
        options:
          - "Empirical endoscopic sphincterotomy"
          - "Sphincter of Oddi manometry first"
          - "Nifedipine and review in 3 months"
          - "Repeat MRCP to diagnose SOD"
        answer: 0
        why:
          - "صح: ده type I، والـ relief 90–95% حتى لو الـ sphincter of Oddi manometry (SOM) طبيعية، فبنعمل sphincterotomy من غير manometry."
          - "الـ SOM ممكن تطلع normal في 14–35% من type I وتضلّلك، فمش indicated."
          - "الـ medical therapy بتقلل الضغط بس من غير outcome data ثابتة."
          - "الـ magnetic resonance cholangiopancreatography (MRCP) والـ endoscopic ultrasound (EUS) بيستبعدوا stones و tumors، بس **cannot diagnose** SOD."
      - kind: explain
        page: 134
        quote: "Because SOM findings may be misleading in these cases (they are normal in 14% to 35% of patients), SOM is not clinically indicated for patients with type I biliary SOD."
        title: "العلاج: دوا ولا sphincterotomy؟"
        text: |
          الكتاب:
          - **Medical**: اتدرس قليل. فيه اللي بينصح بـ **low-fat diet** (من غير بيانات). و **nifedipine**، **nitrates**، **octreotide**، **antispasmodics**، **PDE5 inhibitors**، **transcutaneous nerve stimulation**، و **electroacupuncture** بيقلّلوا الـ basal SO pressure، بس مفيش outcomes ثابتة.
          - **Sphincterotomy**: أشهر سبب للـ **SOM** هو biliary-type pain بعد cholecystectomy. لو الـ SOM abnormal: الألم بيروح في **90–95%** من type I و **85%** من type II.
          - لو الـ SOM **normal**: الألم برضه بيروح في **90–95%** من type I.
          - علشان الـ SOM ممكن **يضلّل** (normal في **14–35%**)، ==SOM is not clinically indicated== في type I، والـ **sphincterotomy** بتتعمل empirically.

          التفسير المقبول (مش في الكتاب): ليه نعمل اختبار مش هيغيّر القرار؟ في type I الأدلة الموضوعية قوية (إنزيمات وقناة واسعة)، والـ sphincterotomy بتنجح سواء الـ SOM طلع إيه، فالاختبار بيضيف خطر بس. وده بيفكّرك بقاعدة عامة: الاختبار ليه لازمة لو نتيجته هتغيّر اللي هتعمله.
      - kind: table
        page: 135
        quote: "E1. Biliary pain\nDiagnostic criteria\nPain located in the epigastrium and/or right upper quadrant and all of the following:\n  1. Builds up to a steady level and lasts 30 minutes or longer\n  2. Occurring at different intervals (not daily)\n  3. Severe enough to interrupt daily activities or lead to an emergency department visit\n  4. Not significantly (<20%) related to bowel movements\n  5. Not significantly (<20%) relieved by postural change or acid suppression\nSupportive criteria\nThe pain may be associated with:\n  1. Nausea and vomiting\n  2. Radiation to the back and/or right infra subscapular region\n  3. Waking from sleep"
        title: "Rome IV: domain E"
        columns: ["Disorder", "Core criterion", "Also needed"]
        rows:
          - ["E1 Biliary pain", "Epigastric or RUQ pain, steady, 30 minutes or longer, not daily", "Disabling; under 20% linked to bowel movements, posture or acid suppression"]
          - ["E1b Functional biliary SO disorder", "Biliary pain + raised enzymes OR dilated duct, not both", "No duct stones or structural cause"]
          - ["E2 Functional pancreatic SO disorder", "Recurrent pancreatitis (enzymes >3× normal and/or imaging)", "Other causes excluded, negative EUS, abnormal manometry"]
        hide: [[0, 1], [1, 1], [2, 2]]
      - kind: try
        items: [git.L03.227, git.L03.233, git.L03.236, git.L03.243, git.L03.283]
