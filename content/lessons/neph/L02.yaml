        prompt: "مريض eGFR 50 و ACR 150 mg/g، ثابتين 6 شهور. خانته فين؟ وتشوفه كام مرة في السنة؟"
        answer: "eGFR 45–59 = **G3a**، و ACR 30–299 = **A2**، يعني **G3aA2**: moderately to high risk، والمتابعة **مرتين في السنة** حسب جدول الـ monitoring."
      - kind: explain
        page: 32
        quote: "Levels exceeding the expected variability and warrant evaluation\nChange in eGFR of >20% on a subsequent test.\nGFR reductions of >30% in CKD patients after initiating hemodynamically active therapies.\nDoubling of the ACR."
        title: "إمتى التغيير يقلق؟"
        text: |
          الأرقام بتتهز طبيعي. اللي يستاهل تقييم:

          - تغيير في الـ eGFR ==> 20%== في التحليل اللي بعده
          - نزول ==> 30%== بعد ما تبدأ دوا hemodynamically active (زي ACE inhibitor (ACEi)/angiotensin II receptor blocker (ARB) أو SGLT2 inhibitor (SGLT2i))
          - الـ albumin-to-creatinine ratio (ACR) ==يتضاعف==

          التفسير المقبول (مش في الكتاب): الحدود دي موجودة **لأن** الـ creatinine بيتهز من يوم ليوم (أكل، مية، مجهود)، فالتغيير الصغير غالبًا noise، والكبير **يعني** حاجة حصلت فعلًا.
      - kind: explain
        page: 32
        quote: "Change in eGFR of >20% on a subsequent test."
        title: "ليه 20% و 30% وضعف؟"
        text: |
          الكتاب بيحدد إمتى التغيير **أكبر من الـ variability المتوقعة**: eGFR يتغير **> 20%**، أو ينزل **> 30%** بعد دوا hemodynamically active، أو الـ ACR ==يتضاعف==.

          التفسير المقبول (مش في الكتاب) للأرقام:

          - الـ creatinine بيتهز من يوم ليوم (أكل، مية، معمل)، فتغيير صغير مالوش معنى. فوق ==20%== صعب يبقى صدفة.
          - الـ ACEi و ARB و SGLT2i بيقلّلوا الضغط **جوه الـ glomerulus** عن قصد، فالـ eGFR بينزل شوية وده علامة إن الدوا اشتغل. علشان كده الحد أوسع: **30%**.
          - الـ ACR متقلب جدًا (رياضة، infection، الدورة)، فمحتاج **ضعف** علشان نصدق إنه زاد فعلًا.
      - kind: check
        page: 32
        quote: "Levels exceeding the expected variability and warrant evaluation\nChange in eGFR of >20% on a subsequent test.\nGFR reductions of >30% in CKD patients after initiating hemodynamically active therapies.\nDoubling of the ACR."
