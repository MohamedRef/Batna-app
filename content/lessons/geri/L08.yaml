            <text x="10" y="105" class="t-sm t-mut">T-score (SD from young peak bone mass)</text>
            <text x="10" y="125" class="t-sm t-mut">measured by DXA</text>
          </svg>
      - kind: match
        page: 150
        quote: "Bisphosphonates: These are antiresorptive drugs that slow bone loss and reduce a person‘s fracture risk."
        prompt: "وصّل الدوا بميزته في الكتاب:"
        pairs:
          - ["Bisphosphonates", "Antiresorptive, slow bone loss"]
          - ["Raloxifene", "Fewer spine fractures after menopause"]
          - ["Calcitonin", "Pain relief after a fracture"]
          - ["Teriparatide", "Stimulates bone formation"]
          - ["Romosozumab", "FDA black box warning"]
        why: "الـ **teriparatide** (PTH) الوحيد هنا اللي **بيبني** عضم؛ والـ denosumab و romosozumab monoclonal antibodies بعد الـ menopause."
      - kind: explain
        page: 150
        quote: "Bisphosphonates: These are antiresorptive drugs that slow bone loss and reduce a person‘s fracture risk."
        title: "كل دوا بيشتغل إزاي؟"
        text: |
          القايمة في الكتاب، وكل دوا من ناحية من الميزان:
          - **Bisphosphonates**: ==antiresorptive==، يعني بيبطّأ **الهدم** ويقلل خطر الكسر.
          - **SERMs** (raloxifene): بيقللوا كسور **العمود الفقري** في الستات بعد الـ menopause. التفسير المقبول (مش في الكتاب): بيشتغلوا زي الـ estrogen على العضم، فبيرجّعوا الفرامل اللي راحت.
          - **Calcitonin**: بيمنع كسور العمود الفقري في الـ postmenopausal، وبيساعد في **ألم ما بعد الكسر**.
          - **Teriparatide** (PTH): الوحيد في القايمة اللي بيـ **stimulate bone formation**، يعني بيبني مش بس بيوقف الهدم، عشان كده للـ **high fracture risk**.
          - **Denosumab** و **romosozumab**: monoclonal antibodies بعد الـ menopause، والـ romosozumab عليه **FDA black box warning**.
      - kind: explain
        remind: [geri.L08.105]
        page: 150
        title: "Fibromyalgia"
        quote: "Fibromyalgia (fi·bro·my·al·gi·a) is a condition that causes pain all over the body, also called widespread pain. Fibromyalgia also causes sleep problems, fatigue, and emotional and mental distress. People with fibromyalgia may be more sensitive to pain than people without fibromyalgia."
        text: |
          ==Widespread pain== مع **sleep problems**، fatigue، و distress نفسي؛ وحساسية أعلى للألم.

          - جسدي: muscle tenderness، temporomandibular joint (TMJ) pain، headache/migraine، إسهال وإمساك، **bladder** issues.
          - نفسي: ==fibro fog== (ذاكرة)، anxiety، depression، insomnia.

          ليه «more sensitive to pain»؟ التفسير المقبول (مش في الكتاب): ده نفس الـ **central sensitization** اللي شفناه في الـ OA: الجهاز العصبي بيكبّر الإشارة، فلمسة عادية تتحس ألم. وعشان كده الأعراض منتشرة في أجهزة كتير (الأمعاء، المثانة، الراس) من غير مرض في أي واحد فيهم، ومعاها نوم بايظ ومزاج واقع.
      - kind: aside
        tone: joke
        page: 151
        quote: "Fibromyalgia can cause mental and emotional symptoms, including:\n  Memory problems (sometimes called \"fibro fog\" or \"brain fog\").\n  Anxiety.\n  Depression.\n  Insomniaand other sleep disorders."
        text: "الـ **fibro fog** ده لما تدخل المطبخ وتنسى دخلت ليه... بس كل يوم، ومع وجع في كل حتة."
      - kind: explain
        page: 151
        title: "مين ويقلب امتى؟"
        quote: "Risk Factors\n  Sex. Women are twice as likely to have fibromyalgia as men.\n  Stressful or traumatic events, such as adverse childhood experiences, car accidents, or post-traumatic stress disorder (PTSD).\n  Repetitive injuries. Injury from repetitive stress on a joint, such as frequent knee bending.\n  Illness (such as viral infections).\n  Family history.\n  Obesity."
        text: |
          **Risk:** الستات (**women**) ==ضعف== الرجالة، traumatic events (PTSD، حوادث، طفولة صعبة)، repetitive injuries، viral illness، family history، obesity.

          **Flare:** stress (شغل، فلوس، علاقات)، تغيير الروتين أو الأكل، hormones، **قلة النوم أو تغيير مواعيده**، وتغيّر الجو.

          المنطق (التفسير المقبول، مش في الكتاب): أغلب الـ risk factors والـ triggers هي **stress** على الجهاز العصبي (صدمة، ضغط نفسي، قلة نوم، تغيير روتين)، فبتزوّد الحساسية. والنوم بالذات: النوم العميق هو اللي بيريّح الجهاز ده، عشان كده أي تغيير في مواعيد النوم بيقلب الحالة.
      - kind: check
        page: 151
        quote: "There‘s no test that can diagnose fibromyalgia. Usually, diagnosing it is part of a differential diagnosis."
        question: "How is fibromyalgia diagnosed, per the lecture?"
        options:
          - "No specific test; exclude others such as anemia or thyroid disease"
          - "A positive anti-CCP"
          - "Raised ESR above 50"
          - "Muscle biopsy"
        answer: 0
        why:
          - "صح: مفيش test؛ التشخيص جزء من differential، والدم يستبعد anemia والـ thyroid."
          - "الـ anti-CCP للـ RA."
          - "الـ erythrocyte sedimentation rate (ESR) العالي يخليك تفكر في PMR أو giant cell arteritis (GCA)."
          - "مش بيتعمل biopsy."
      - kind: explain
        page: 152
        title: "العلاج 4 محاور"
        quote: "Treatment\n  Non-pharmacological treatments: physical therapy to relax and strengthen muscles and joints.\n  Psychological treatments: to maintain a healthy self-image, to manage symptoms that affect the mental and emotional health.\n  Pharmacological treatment: Taking medicine to manage the symptoms.\n  Daily functioning: An occupational therapist can help in maintaining regular activities."
        text: |
          1. **Physical therapy** يرخّي ويقوّي.
          2. **Psychological** treatment.
          3. **Medicines** للأعراض.
          4. ==Occupational therapist== للأنشطة اليومية.

          ليه 4 محاور مش دوا وخلاص؟ لأن الكتاب بيقول مفيش test ولا سبب واحد، والأعراض جسدية ونفسية ووظيفية. التفسير المقبول (مش في الكتاب): كل محور بيمسك جزء: الـ physical therapy للعضل، الـ psychological للمزاج والـ stress اللي بيقلّبها، الدوا للأعراض، والـ OT عشان العيان يفضل شغال ومستقل. ده نفس فكرة الـ multidisciplinary team في محاضرة الـ CGA.
