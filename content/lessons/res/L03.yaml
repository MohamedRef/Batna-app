  - id: res.L03.lesson5
    title: "الأهداف: SMART ومن غير فلسفة"
    hook: "\"To understand\" هي أسهل طريقة تخلّي المشرف يرجّعلك الـ protocol."
    minutes: 8
    pages: [46, 56]
    topics: [objectives]
    goals:
      - "تعرّف الـ research objective وتعرف ليه ومتى بنكتبه"
      - "تحفظ SMART وصفات الـ objective الكويس"
      - "تفرّق بين الـ action verbs والأفعال المايعة"
    status: unverified
    steps:
      - kind: explain
        page: 48
        quote: "A research objective is a statement that clearly describes the goal(s) to be achieved by a research project."
        title: "من السؤال للهدف"
        text: |
          علشان تجاوب على الـ research question لازم تحوّله لـ **testable objectives and/or hypotheses** تكون **specific** و **measurable**.

          والـ ==research objective== هو **a statement that clearly describes the goal(s)** اللي البحث عايز يوصلها.
      - kind: explain
        page: 49
        quote: "Focus the study (narrowing it down to essentials)"
        title: "ليه نكتب أهداف أصلًا؟"
        text: |
          الأهداف بتساعدك:

          - ==Focus the study==: تضيّقها للأساسيات.
          - **Avoid** إنك تجمع data مش محتاجها فعلًا (وده بيحدد حدود الدراسة).
          - **Organize** الدراسة في أجزاء أو phases واضحة.

          والأهداف المكتوبة كويس بتسهّل الـ methodology وبتوجّه الـ collection والـ analysis والـ interpretation.
      - kind: figure
        page: 50
        quote: "after the statement of the problem is developed, before the methodology for the study is planned"
        title: "الأهداف بتتكتب إمتى؟"
        alt: "A horizontal-then-down timeline of three boxes: statement of the problem, then objectives (highlighted, with the labels after and before), then methodology."
        caption: "بعد الـ statement of the problem، وقبل ما تخطط الـ methodology. الهدف هو الكوبري بين الاتنين."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03o1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="40" y="10" width="250" height="50" rx="8" class="fg-box"/>
            <text x="165" y="40" text-anchor="middle" class="t-b">Statement of the problem</text>
            <path d="M165 60v26" class="fg-arrow" marker-end="url(#L03o1)"/>
            <text x="175" y="78" class="t-sm t-mut">after</text>
            <rect x="40" y="92" width="250" height="60" rx="8" class="fg-acc"/>
            <text x="165" y="118" text-anchor="middle" class="t-lg t-b">Objectives</text>
            <text x="165" y="140" text-anchor="middle" class="t-sm">general and specific</text>
            <path d="M165 152v26" class="fg-arrow" marker-end="url(#L03o1)"/>
            <text x="175" y="170" class="t-sm t-mut">before</text>
            <rect x="40" y="184" width="250" height="50" rx="8" class="fg-box"/>
            <text x="165" y="214" text-anchor="middle" class="t-b">Methodology</text>
          </svg>
      - kind: explain
        page: 52
        quote: "Defined in operational terms that can be measured (e.g. action verbs)"
        title: "صفات الهدف الكويس"
        text: |
          - **Feasible** (عملي)
          - **Realistic** considering local conditions (واقعي في ظروفنا)
          - ==Defined in operational terms that can be measured==، يعني **action verbs**
          - **Phrased to clearly meet the purpose of the study**
      - kind: mnemonic
        page: 53
        quote: "Attainable/Achievable—Can we get it done in the proposed time frame with the resources and support we have available?"
        word: "SMART"
        parts:
          - { key: "S", text: "Specific: what exactly are we going to do, for whom?" }
          - { key: "M", text: "Measurable: is it quantifiable, can we measure it?" }
          - { key: "A", text: "Attainable/Achievable: can we do it in the time, with the resources we have?" }
          - { key: "R", text: "Relevant: will it affect the desired goal or strategy?" }
          - { key: "T", text: "Time bound: when will it be accomplished?" }
        hook: |
          الهدف الـ **SMART** زي الموبايل الـ smart: لو ناقصه حرف واحد بيبقى "تليفون أرضي" ومحدش عايزه.
      - kind: check
        page: 50
        quote: "after the statement of the problem is developed, before the methodology for the study is planned"
        question: "When should the objectives of a research project be written?"
        options:
          - "After the statement of the problem, before planning the methodology"
          - "After data collection"
          - "Before identifying the problem"
          - "After the budget"
        answer: 0
        why:
          - "صح: بعد المشكلة وقبل الـ methodology."
          - "متأخر جدًا: الأهداف هي اللي بتقولك تجمع إيه."
          - "مينفعش تكتب هدف لمشكلة لسه ماعرفتهاش."
          - "الـ budget بييجي بعد الـ methodology والـ work plan."
      - kind: explain
        page: 54
        quote: "Usually in our case we use the positive sentence way to formulate objectives"
        title: "تكتب الهدف إزاي؟"
        text: |
          تلات أشكال:

          - **Question:** "The objectives of this study are to answer the following questions…"
          - **Positive sentence:** "The objectives of this study are to determine…"
          - **Hypothesis:** "The objective of this study is to verify the following hypothesis…"

          الشكل بيعتمد على نوع الدراسة: الـ descriptive/exploratory بأسئلة أو جمل، ولو تقدر تتنبأ تكتب hypotheses. وعندنا ==usually we use the positive sentence==.
      - kind: sort
        page: 56
        quote: "Do not use vague non-action verbs such as: To appreciate ... To understand... To believe"
        prompt: "الفعل ده ينفع يبدأ بيه objective؟"
        bins: ["Action verb", "Vague: avoid"]
        cards:
          - { text: "To determine", bin: 0 }
          - { text: "To compare", bin: 0 }
          - { text: "To verify", bin: 0 }
          - { text: "To calculate", bin: 0 }
          - { text: "To describe", bin: 0 }
          - { text: "To appreciate", bin: 1 }
          - { text: "To understand", bin: 1 }
          - { text: "To believe", bin: 1 }
        why: "الـ objective لازم يتكتب بـ **action verbs** specific enough to be measured. To appreciate و to understand و to believe مايتقاسوش."
      - kind: aside
        tone: joke
        page: 56
        quote: "Do not use vague non-action verbs such as: To appreciate ... To understand... To believe"
        text: |
          كتبت "To understand depression among diabetics"؟ المشرف هيبصلك ويقول: "هتقيس الـ understanding بإيه يا دكتور؟ بالترمومتر؟" 🌡️

          غيّرها لـ "To **determine** the prevalence of depression among…" وخلاص.
      - kind: try
        items: [res.L03.061, res.L03.064, res.L03.066, res.L03.070]
    recap:
      - "Objective = statement بيوصف الأهداف بوضوح؛ هو اللي بيخلي السؤال testable."
      - "ليه؟ focus، avoid unnecessary data، organize in phases."
      - "إمتى؟ بعد الـ statement of the problem، قبل الـ methodology."
      - "SMART: Specific، Measurable، Attainable، Relevant، Time bound."
      - "Action verbs: determine, compare, verify, calculate, describe. ممنوع: appreciate, understand, believe."
    practice: [res.L03.061, res.L03.062, res.L03.063, res.L03.064, res.L03.065, res.L03.066, res.L03.067, res.L03.068, res.L03.069, res.L03.070, res.L03.071]
