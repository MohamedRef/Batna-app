lecture: git.L03
lessons:
  # ------------------------------------------------------------------
  - id: git.L03.lesson1
    title: "يعني إيه functional؟"
    hook: "أشهر تشخيص في الجهاز الهضمي: أعراض حقيقية جدًا، والمنظار والأشعة نضاف. السر في الكلام بين المخ والمصران."
    minutes: 10
    pages: [76, 87]
    topics: [concept, psychosocial, physiology, classification]
    goals:
      - "تعرّف الـ FGIDs كـ disorders of gut–brain interaction وتفرّقها عن الـ organic والـ motility disorders"
      - "تعدّ الآليات الخمسة اللي بتعمل الأعراض وتشرح الـ visceral hypersensitivity"
      - "تحفظ الـ 6 domains بتوع Rome IV بالحروف A إلى F"
    status: unverified
    steps:
      - kind: explain
        page: 76
        quote: "recurring gastrointestinal (GI) symptoms that cannot be attributed to organic disease, structural, or biochemical causes"
        title: "أعراض حقيقية، والفحوصات سليمة"
        text: |
          الـ ==FGIDs== هي **the most common diagnoses in gastroenterology**: نص عيادة الجهاز الهضمي تقريبًا.

          التعريف: **recurring GI symptoms** ما ينفعش ترجّعها لـ organic disease ولا structural ولا biochemical cause.

          الاسم الأحدث بيقول الفكرة كلها: ==disorders of gut–brain interaction==. المشكلة مش في شكل العضو، المشكلة في الكلام اللي رايح جاي بين المخ والمصران.
      - kind: mnemonic
        page: 76
        quote: "Motility disturbance Visceral hypersensitivity Altered mucosal and immune function Altered gut microbiota Altered central nervous system (CNS) process"
        word: "MIMIC"
        parts:
          - { key: "M", text: "Motility disturbance" }
          - { key: "I", text: "Immune and mucosal function altered" }
          - { key: "M", text: "Microbiota altered" }
          - { key: "I", text: "Increased visceral sensitivity (visceral hypersensitivity)" }
          - { key: "C", text: "CNS processing altered" }
        hook: |
          الـ FGID بيعمل **MIMIC** للمرض العضوي: نفس الأعراض، من غير pathology. والحروف الخمسة هي الأسباب الخمسة اللي الكتاب بيعدّها بأي combination.
      - kind: explain
        page: 79
        quote: "A functional GI disorder is a syndrome based on symptoms that cluster together and are diagnosed by Rome criteria."
        title: "تلات طرق نصنّف بيها المرض"
        text: |
          الكتاب بيحط تلات أنواع جنب بعض:

          - **Organic (structural):** بيتصنّف بـ ==organ morphology==، والدليل pathology تشوفها بالعين أو الميكروسكوب. مثال: esophagitis، IBD.
          - **Motility disorder:** بيتصنّف بـ organ function، يعني altered motility مستمرة أو متكررة. مثال: gastroparesis، intestinal pseudo-obstruction.
          - **Functional GI disorder:** بيتصنّف بـ ==symptoms==، يعني إحساس المريض وحكايته عن المرض. مثال: IBS، functional dyspepsia.

          والـ FGID هو **syndrome**: أعراض بتيجي مع بعض، وبنشخصها بـ **Rome criteria**.
      - kind: sort
        page: 78
        quote: "classified in terms of organ morphology and the criterion for a disease is pathology at a macro- or microlevel"
        prompt: "كل تشخيص من دول بيتصنّف إزاي؟"
        bins: ["Organic", "Motility", "Functional"]
        cards:
          - { text: "Esophagitis", bin: 0 }
          - { text: "Inflammatory bowel disease", bin: 0 }
          - { text: "Gastroparesis", bin: 1 }
          - { text: "Intestinal pseudo-obstruction", bin: 1 }
          - { text: "Irritable bowel syndrome", bin: 2 }
          - { text: "Functional dyspepsia", bin: 2 }
        why: "الـ organic ليه pathology تشوفها. الـ motility ليه وظيفة حركة غلط ممكن تقيسها (وممكن تيجي وتروح مع تكرار الاختبار). الـ functional بيتشخص من الأعراض بـ Rome criteria."
      - kind: explain
        page: 79
        quote: "Although psychosocial factors are not required for diagnosis, they influence physiological functioning of the GI tract via the brain–gut axis"
        title: "النفسية مش شرط، بس بتلعب في كل حاجة"
        text: |
          الـ ==psychosocial factors== **not required for diagnosis**، بس بتأثر على الـ motility والـ sensitivity والـ barrier عن طريق الـ brain–gut axis، وبتأثر على اختيار العلاج والنتيجة.

          الكتاب بيقول خد بالك من أربع ملاحظات:

          - **Stress** بيزوّد الأعراض وممكن يساعد إن المرض يبدأ، زي **postinfection IBS** أو dyspepsia.
          - فيه association عالي مع psychosocial comorbidities و life stress و abuse، ودول معناهم **poorer outcomes**.
          - العوامل دي بتغيّر تجربة المرض وسلوكه، زي إنه يدوّر على دكاترة كتير.
          - والعكس كمان: المرض المزمن نفسه بيعمل distress بيرجع يزوّد الأعراض.
      - kind: reveal
        page: 80
        quote: "psychosocial trauma (e.g., sexual or physical abuse history) is more common in referral centers than in primary care"
        prompt: "ليه تاريخ الـ sexual أو physical abuse أكتر في الـ referral centers منه في الـ primary care؟"
        answer: |
          لأن الـ psychosocial factors **modify the experience of illness** وسلوك المريض:

          - بتقلّل الـ **pain threshold** وبتزوّد الـ symptom reporting.
          - فالمريض بيدوّر أكتر على health care، وبيتحوّل أكتر، ونتيجته أسوأ.

          يعني الـ referral center بيتجمّع فيه المرضى الأصعب. والحاجة اللي بتخفف ده: **adaptive coping skills** و **social support**.
      - kind: explain
        page: 81
        quote: "These patients have a lower pain threshold with balloon distension of the bowel (visceral hyperalgesia)"
        title: "المصران حساس زيادة عن اللزوم"
        text: |
          الـ **abnormal motility** بتعمل nausea و vomiting و diarrhea و pain، بس بترتبط بالأعراض جزئيًا بس، وما تكفيش تفسر الألم المزمن.

          اللي بيفسّر الألم هو ==visceral hypersensitivity==، وليها شكلين:

          - **Visceral hyperalgesia:** الـ pain threshold واطي، فالبالونة في المصران بتوجع بدري.
          - ==Allodynia==: حساسية لـ **normal intestinal function** نفسها، يعني الحركة الطبيعية بتوجع.

          ولما تنفخ البالونة كذا مرة، الألم بيزيد مؤقتًا عند الأصحاء، وبيطوّل أكتر عند مرضى الـ FGIDs.
      - kind: check
        page: 81
        quote: "or they have increased sensitivity even to normal intestinal function (allodynia)"
        question: "A patient with IBS feels pain with a normal amount of gas and normal bowel contractions. What is this called?"
        options:
          - "Allodynia"
          - "Visceral hyperalgesia"
          - "Dysmotility"
          - "Catastrophizing"
        answer: 0
        why:
          - "صح: ألم من **normal intestinal function** = allodynia."
          - "الـ hyperalgesia = threshold واطي لمنبّه مؤلم أصلًا زي البالونة، مش للحركة الطبيعية."
          - "الحركة هنا طبيعية، فمفيش dysmotility."
          - "ده سلوك نفسي (morbid pessimism و hypervigilance)، مش اسم للإحساس نفسه."
      - kind: order
        page: 82
        quote: "These actions alter receptor sensitivity at the gut mucosa and myenteric plexus, producing visceral hypersensitivity."
        prompt: "بعد infection، رتّب إزاي المصران بيبقى حساس:"
        steps:
          - "Increased mucosal permeability (tight junctions)"
          - "Luminal antigens reach the submucosa"
          - "Low-grade mast cell activation and cytokine release"
          - "Altered receptor sensitivity at mucosa and myenteric plexus"
          - "Visceral hypersensitivity"
        why: "دي حكاية الـ **postinfection IBS**: الحاجز بيسرّب، الـ antigens بتدخل، الـ mast cells بتولّع التهاب خفيف، والـ receptors بتتظبط على حساسية أعلى. والـ stress بيزوّدها عن طريق الـ mast cells برضه."
      - kind: explain
        page: 83
        quote: "increased firmicutes and reduced Bacteroidetes and Bifdobacteria"
        title: "البكتيريا والأكل"
        text: |
          في مرضى الـ IBS الـ microbiome متغيّر:

          - **Firmicutes** أكتر، و **Bacteroidetes** و **Bifidobacteria** أقل.
          - والـ fecal microbial ==diversity== أقل من الأصحاء.

          الدليل إنها ليها دور: الـ probiotics ليها **modest effect**، والـ periodic antibiotic treatment فايدته أوضح.

          والأكل هو اللي بيأكّل البكتيريا (**substrates for fermentation**). علشان كده الـ low FODMAP أو تقليل الـ gluten بيفيد بعض المرضى، بس **no one diet** ينفع للكل، والعلاج لازم يكون individualized.
      - kind: figure
        page: 84
        quote: "emotions such as fear, anger, anxiety, painful stimuli, and physical stress can delay gastric emptying and intestinal transit"
        title: "الـ brain–gut axis: طريق في الاتجاهين"
        alt: "Brain box at the top and gut box at the bottom. A red arrow down the left side lists top-down effects: stress, fear and anger slow gastric emptying, speed colonic transit and weaken the mucosal barrier. A dark arrow up the right side lists bottom-up effects: inflammation and dysmotility amplify visceral signals, giving more pain, anxiety and depression. The brain box notes that the anterior cingulate cortex works as the pain gate."
        caption: "من فوق لتحت: المشاعر بتغيّر الحركة والحاجز. ومن تحت لفوق: الالتهاب والحركة بيعلّوا الإشارة للمخ. والبوابة في النص هي الـ ACC."
        svg: |
          <svg viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03ga" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
              <marker id="L03gb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="310" height="62" rx="8" class="fg-acc"/>
            <text x="22" y="32" class="t-b">Brain (CNS)</text>
            <text x="22" y="48" class="t-sm t-mut">emotion, memory, thoughts, pain control</text>
            <text x="22" y="63" class="t-sm t-acc t-b">ACC = the pain gate (filter)</text>
            <path d="M34 78V244" class="fg-arrow-bad" marker-end="url(#L03ga)"/>
            <text x="48" y="100" class="t-sm t-b t-bad">Top-down</text>
            <text x="48" y="116" class="t-sm">Stress, fear, anger</text>
            <text x="48" y="131" class="t-sm">Slower gastric emptying</text>
            <text x="48" y="146" class="t-sm">Faster colonic transit</text>
            <text x="48" y="161" class="t-sm">Weaker mucosal barrier</text>
            <path d="M296 244V78" class="fg-arrow" marker-end="url(#L03gb)"/>
