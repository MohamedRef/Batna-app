  - id: git.L04.lesson4
    title: "المعدة: شكل الورم ورحلة التشخيص"
    hook: "خاتم في الخلية، معدة زي الجلد، وعقدة فوق الترقوة. وبعدين: CT ولا EUS الأول؟"
    minutes: 10
    pages: [156, 161]
    topics: [gastric-path, gastric-dx]
    goals:
      - "تعرف الـ signet ring cell carcinoma وليه الـ linitis plastica بتخدع الـ biopsy"
      - "ترتب الـ Borrmann types والـ named signs"
      - "تعرف دور كل tumor marker والـ staging sequence"
    status: unverified
    steps:
      - kind: explain
        page: 156
        quote: "Cells contain abundant mucin in the cytoplasm. So nucleus is shifted to periphery to produce ―signet ring‖ shape."
        title: "الـ signet ring cell"
        text: |
          نوع **highly malignant** من الـ adenocarcinoma. الخلية مليانة **mucin**، فالـ nucleus بيتزق على الجنب، فتبان زي ==signet ring== (خاتم الختم).

          - أشهر مكان: المعدة (وأقل: breast، gallbladder، bladder، pancreas).
          - عكس باقي سرطانات المعدة: الـ incidence بتاعه **بيزيد**.
          - بيكبر في **sheets**، فالـ CT والـ PET أضعف في تشخيصه.
          - السبب: **CDH1** (E-cadherin) أو **APC**. لما الخلية تفقد الـ E-cadherin بتبقى أسهل في الحركة.
      - kind: reveal
        page: 157
        quote: "Advanced SRCC – poor than non-SRCC and lower chemosensitivity and peritoneal carcinomatosis is the most frequent metastatic site"
        prompt: "الـ SRCC الـ prognosis بتاعه أحسن ولا أوحش؟"
        answer: "حسب المرحلة: الـ early SRCC أحسن أو زي الـ non-SRCC. الـ advanced SRCC أوحش، والـ chemosensitivity أقل، وأشهر مكان metastasis هو peritoneal carcinomatosis."
      - kind: order
        page: 157
        quote: "Phymatoid/polypoid (protruded type) Ulcerative Infiltrative ulcerative Diffuse infiltrative Can‘t be classified"
        prompt: "رتّب الـ Borrmann types (I → V):"
        steps:
          - "Polypoid (protruded)"
          - "Ulcerative"
          - "Infiltrative ulcerative"
          - "Diffuse infiltrative"
          - "Cannot be classified"
        why: "الترتيب ماشي من الورم اللي طالع لبرّه (polypoid) لحد اللي غاطس في الحيطة كلها (diffuse infiltrative). الـ Borrmann macroscopic ومفيد كـ endoscopic finding."
      - kind: figure
        page: 157
        quote: "Phymatoid/polypoid (protruded type) Ulcerative Infiltrative ulcerative Diffuse infiltrative Can‘t be classified"
        title: "Borrmann كسلّم"
        alt: "Four cross-sections of the gastric wall. Type I polypoid: a mass bulging into the lumen. Type II ulcerative: an ulcer with raised sharp edges. Type III infiltrative ulcerative: an ulcer whose base spreads into the wall. Type IV diffuse infiltrative: the whole wall thickened, linitis plastica. Type V cannot be classified."
        caption: "من I لـ IV الورم بيدخل في الحيطة أكتر. Type IV هو الـ linitis plastica."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="18" class="t-sm t-mut">lumen above, wall below</text>
            <rect x="10" y="50" width="310" height="22" class="fg-box"/>
            <path d="M60 50c0-30 50-30 50 0z" class="fg-acc"/>
            <text x="130" y="44" class="t-b">I Polypoid (protruded)</text>
            <rect x="10" y="120" width="310" height="22" class="fg-box"/>
            <path d="M50 120l15-12l10 12h30l10-12l15 12" class="fg-ink"/>
            <text x="150" y="112" class="t-b">II Ulcerative</text>
            <rect x="10" y="190" width="310" height="22" class="fg-box"/>
            <path d="M50 190l15-10l10 10h30l10-10l15 10" class="fg-ink"/>
            <rect x="60" y="190" width="80" height="22" class="fg-bad"/>
            <text x="150" y="182" class="t-b">III Infiltrative ulcerative</text>
            <rect x="10" y="260" width="310" height="40" class="fg-bad"/>
            <text x="20" y="252" class="t-b">IV Diffuse infiltrative</text>
            <text x="20" y="285" class="t-sm">whole wall thick: linitis plastica</text>
            <text x="10" y="322" class="t-sm t-mut">V Cannot be classified</text>
          </svg>
      - kind: explain
        page: 157
        quote: "Superficial biopsies may be falsely negative Combination of strip and bite biopsy needed if suspicious for linitis plastic"
        title: "Linitis plastica: المعدة الجلد"
        text: |
          ده **diffuse-type gastric cancer**: الورم بيمشي في الـ ==submucosa== والـ muscularis propria، والـ mucosa فوقه ممكن تبان سليمة.

          عشان كده **superficial biopsies may be falsely negative**. لو شاكك: **strip and bite biopsy** مع بعض.
      - kind: explain
        page: 158
        quote: "Most patients present with advanced stage.. why? They are often asymptomatic in early stages."
        title: "بيجيلك بإيه؟"
        text: |
          أغلبهم **advanced stage** لأنهم **asymptomatic** في الأول.

          - Symptoms: epigastric pain، bloating، **early satiety**، nausea و vomiting، dysphagia، anorexia، **weight loss**، upper GI bleeding.
          - Signs: anemia، cachexia، epigastric mass، hepatomegaly، ascites، jaundice، والعلامات اللي ليها أسامي.
      - kind: match
        page: 158
        quote: "Blumers shelf -Virchows node -Sister mary joseph node -Krukenberg tumor -Irish node"
        prompt: "وصّل كل علامة بمكانها:"
        pairs:
          - ["Virchow's node", "Left supraclavicular node"]
          - ["Sister Mary Joseph node", "Umbilicus"]
          - ["Blumer's shelf", "Rectal shelf (felt on PR)"]
          - ["Krukenberg tumor", "Ovary"]
          - ["Irish node", "Left axilla"]
        why: "الأسامي في الكتاب في صفحة 158، والأماكن دي معروفة في الـ clinical exam (الكتاب ذكر الأسامي بس)."
      - kind: explain
        page: 158
        quote: "A low serum pepsinogen I/I I ratioused to better select patients .It increased risk for atrophic gastritis and gastric cancer."
        title: "Screening و markers"
        text: |
          - **Screening** بينجح في الـ high-risk areas. في اليابان sensitivity و specificity حوالي 90%، بالـ double-contrast barium أو المنظار.
          - ==Low pepsinogen I/II ratio== بيختار المرضى: معناه risk أعلى لـ atrophic gastritis و gastric cancer.
          - **CEA** و**CA19-9** بيرتبطوا بالعمق والـ nodes والـ stage والـ survival. الـ CEA sensitivity واطية، بس لو عالي بيمشي مع الـ stage.
          - **Beta-HCG** و**CA 125** ممكن يعكسوا aggressive biology، بس فايدتهم في الـ staging محدودة.
      - kind: check
        page: 158
        quote: "EGD esophagogastroduodenoscopy Diagnostic accuracy is 98% if up to 7 biopsies is taken."
        question: "EGD reaches 98% diagnostic accuracy for gastric cancer when:"
        options:
          - "Up to 7 biopsies are taken"
          - "A single deep biopsy is taken"
          - "It is combined with CEA"
          - "It is done after a barium meal"
        answer: 0
        why:
          - "صح: diagnostic accuracy 98% if up to 7 biopsies."
          - "عينة واحدة مش كفاية، وفي الـ linitis كمان محتاج strip and bite."
          - "الـ CEA sensitivity واطية."
          - "الـ barium ممكن يفوّت early lesions ومش بيفرّق benign ulcer من ulcerating adenocarcinoma."
      - kind: figure
        page: 160
        quote: "CT scanning is used first to stage the gastric carcinoma; if no metastases and no invasion of local organs are found, EUS is used"
        title: "الـ staging بالترتيب"
        alt: "Flowchart: gastric cancer diagnosed by EGD and biopsy, then CT first. If CT shows metastases or local organ invasion, stage IV or advanced. If not, EUS refines the local stage (depth, layers). Side notes: CT T-staging accuracy 64 percent, N sensitivity 24 to 43 percent, detects 85 percent of intra-abdominal metastases; PET not primary, only 50 percent PET-avid."
        caption: "CT الأول للانتشار، ولو نضيف يبقى EUS للعمق. والـ PET مش primary staging."
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="G04s1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
