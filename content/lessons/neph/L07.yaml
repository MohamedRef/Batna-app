        why: "الـ ADPKD والـ sponge الاتنين **any age**، بس الـ ADPKD عنده ==family history قوي== والـ sponge لأ."
      - kind: check
        page: 167
        quote: "Consider the diagnosis in young patients presenting with calcium stones."
        question: "Young man, recurrent calcium stones, UTI, normal creatinine, no family history. Most likely?"
        options:
          - "Medullary sponge kidney"
          - "ADTKD"
          - "Nephronophthisis"
          - "ARPKD"
        answer: 0
