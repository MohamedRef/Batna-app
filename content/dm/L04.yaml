    pass: 5
    src: { page: 38, quote: "Individuals with established CVD (e.g., MI, stroke, any revascularization procedure)." }
    status: unverified
    tags: [high-yield]
  - id: dm.L04.007
    kind: card
    topic: cardiorenal
    front: Define "indicators of high risk" in the ADA algorithm.
    back: Age ≥55 years with two or more additional risk factors - obesity, hypertension, smoking, dyslipidemia or albuminuria.
    src: { page: 38, quote: "55 years of age with two or more additional risk factors, including: Obesity Hypertension Smoking Dyslipidemia, or albuminuria" }
    status: unverified
    tags: [high-yield]
  - id: dm.L04.008
    kind: mcq
    topic: cardiorenal
    stem: A 60-year-old with type 2 diabetes and a stent last year. A1C 7.8% on metformin. What does the ADA algorithm add, regardless of A1C?
    options: [GLP-1 RA or SGLT2i with proven CVD benefit, Sulfonylurea, DPP-4 inhibitor, Basal insulin]
    answer: 0
    why:
      - "Correct: +ASCVD means either a GLP-1 RA or an SGLT2i with proven CVD benefit (p39)."
      - No CV benefit; hypoglycemia risk.
      - Intermediate glucose efficacy, no proven CV benefit.
      - Not the cardiorenal choice.
    src: { page: 39, quote: "GLP-1 RA with proven CVD benefit EITHER/ OR SGLT2i with proven CVD benefit" }
    status: unverified
    tags: [high-yield]
  - id: dm.L04.009
    kind: card
    topic: cardiorenal
    front: In the +ASCVD arm, what if A1C stays above target?
    back: On a GLP-1 RA, consider adding an SGLT2i with proven CVD benefit, or vice versa. A TZD is another option.
    src: { page: 39, quote: "For patients on a GLP-1 RA consider adding SGLT2i with proven CVD benefit or vice versa" }
    status: unverified
  - id: dm.L04.010
    kind: card
    topic: cardiorenal
    front: Which drug does the ADA algorithm choose for type 2 diabetes with heart failure?
    back: An SGLT2 inhibitor with proven HF benefit in this population.
