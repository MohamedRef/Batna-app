      - kind: explain
        page: 265
        title: "الـ methotrexate شغّال إزاي؟"
        quote: "Adenosine is a potent inhibitor of neutrophil function and has potent anti inflammatory properties."
        text: |
          ==First choice==. بيوقف الـ **dihydrofolate reductase** (purine synthesis).

          وكمان بيوقف الـ **aminoimidazole carboxamide ribonucleotide (AICAR) transformylase**، فالـ AICAR يتجمع ويطلّع ==adenosine==، وده anti-inflammatory جامد وبيوقف الـ neutrophils.

          **Folic acid 1 mg/day** بيقلّل الأعراض الجانبية.

          التفسير المقبول (مش في الكتاب): أعراض زي الـ stomatitis والـ marrow toxicity سببها نقص الـ folate في الخلايا اللي بتتقسم بسرعة، فالـ folic acid بيعوّضها من غير ما يلغي الـ adenosine اللي بيعمل الـ anti-inflammatory effect.
      - kind: explain
        page: 265
        title: "باقي الـ csDMARDs: كل متابعة ليها سبب"
        quote: "leflunomide inhibits dihydroorotate dehydrogenase leading to decrease in de novo. Synthesis of pyrimidines and arrest activated lymphocyte cell division in G1 stage"
        text: |
          - **Sulfasalazine**: first choice، **almost as effective as methotrexate**، immunomodulator. ممكن يعمل **neutropenia و pancytopenia** و hepatitis، فالمتابعة CBC و LFT كل شهر لـ 3 شهور وبعدين كل 3.
          - **Leflunomide**: زي الاتنين في الفعالية بس غالي؛ لما الـ MTX ما ينفعش أو معاه. بيوقف ==dihydroorotate dehydrogenase== فالـ **de novo pyrimidines** تقل والـ lymphocyte المتنشّط يقف في **G1**. التفسير المقبول (مش في الكتاب): الخلية الهادية تكفيها الـ pyrimidines المعاد استخدامها، بس الـ lymphocyte اللي بيتكاثر بسرعة محتاج يصنع جديد، فهو اللي بيقع. وبيعمل **hypertension**، علشان كده الـ **BP** في متابعته.
          - **Hydroxychloroquine**: weak، للـ **mild RA** أو combination، و slower onset. بيوقف الـ antigen presentation بالـ HLA وكمان الـ platelet aggregation. وبيعمل **corneal deposits و retinopathy**، علشان كده متابعته ==visual acuity و Amsler chart و fundoscopy== مش تحاليل دم.
