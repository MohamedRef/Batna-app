        page: 307
        quote: "TIPS is indicated in patients in whom hemorrhage from esophageal varices cannot be controlled"
        stem: "A 49-year-old with alcohol-related cirrhosis and ascites vomits a large amount of fresh blood."
        steps:
          - question: "Which drug starts now, before endoscopy?"
            options: ["Terlipressin or octreotide", "Pantoprazole alone", "Propranolol", "Tranexamic acid"]
            answer: 0
            why: "الـ vasoactive أول ما تشك، ويكمل 3-5 أيام."
          - question: "Antibiotic?"
            options: ["IV ceftriaxone 1 g/day, up to 7 days", "None unless febrile", "Rifaximin long term", "Norfloxacin for 6 months"]
            answer: 0
            why: "كل cirrhosis بينزف ياخد antibiotic لحد 7 أيام، والـ ceftriaxone أحسن في الـ advanced."
          - reveal: "Endoscopy within 12 h: bleeding esophageal varices, banded. He rebleeds 2 days later despite terlipressin."
            question: "Definitive rescue?"
            options: ["TIPS", "Balloon tamponade for 3 days", "Sclerotherapy", "Surgery"]
            answer: 0
            why: "رجوع النزيف رغم الـ drug + endoscopy = TIPS. الـ balloon كوبري 24 ساعة بس."
