        quote: "Myocardial In fraction (Cont.)\n  The presenting symptoms of (MI) can be quite atypical, specially in patients over age 80 or Silent MI\n  Dyspnea is very common early manifestation,\n  Mental confusion, syncope\n  Gastrointestinal complaints\n  Many patients have conduction defects."
        text: |
          **Cardinal signs:** pain >30 min، electrocardiogram (ECG)، enzymes عالية.

          بس عند الكبار، خصوصًا ==فوق 80==، الـ MI ممكن يبقى **atypical** أو ==silent==:
