  - id: rheum.L17.lesson4
    title: "علاج الـ AS: NSAIDs الأول، وبعدين اختار الـ biologic صح"
    hook: "في الـ RA الـ methotrexate ملك. في الـ AS الـ csDMARDs ما بتعملش حاجة للضهر خالص."
    minutes: 9
    pages: [290, 294]
    topics: [drugs, guidelines]
    goals:
      - "تعرف دور الـ NSAIDs والـ csDMARDs والـ steroids في الـ AS"
      - "تختار بين TNFi و IL-17i و JAKi حسب العيان"
      - "تمشي في الـ ASAS-EULAR algorithm"
    status: unverified
    steps:
      - kind: explain
        page: 290
        title: "الهدف والبداية"
        quote: "Treatment is aimed at maintaining normal upright posture & spinal mobility and reducing pain and stiffness."
        text: |
          ==مفيش cure==. الهدف: **وقفة مفرودة**، ضهر بيتحرك، وألم و stiffness أقل.

          **لكل العيانين**: education، ==وقف التدخين==، depression screening، دعم نفسي، وتظبيط الـ comorbidities.

          **Physical therapy** مهم جدًا: تمارين في البيت، breathing، **swimming** و hydrotherapy.
      - kind: explain
        page: 290
        title: "الـ NSAIDs: أول سلاح"
        quote: "NSAIDs are to be given in full anti-inflammatory doses (trial of 2 NSAIDs for 4 weeks)."
        text: |
          - ==Full anti-inflammatory dose==، وجرّب **2 NSAIDs على 4 أسابيع**.
          - مفيش NSAID أحسن من التاني.
          - الاستخدام ==المستمر== شكله بيقلّل الـ radiographic progression.
          - الأعراض الجانبية: GIT، الكلى، الـ CNS.
      - kind: sort
        page: 290
        quote: "has little symptomatic effect on spinal and sacroiliac disease."
        prompt: "الدوا ده بيفيد الـ AS ولا لأ؟"
        bins: ["Helps", "Little or no use"]
        cards:
          - { text: "Full-dose NSAIDs", bin: 0 }
          - { text: "SSZ for peripheral arthritis", bin: 0 }
          - { text: "Local steroid for sacroiliitis or enthesitis", bin: 0 }
          - { text: "TNF inhibitor after 2 NSAIDs fail", bin: 0 }
          - { text: "SSZ for spinal disease", bin: 1 }
          - { text: "Methotrexate for axial AS", bin: 1 }
          - { text: "Systemic glucocorticoids", bin: 1 }
          - { text: "Leflunomide", bin: 1 }
        why: "الـ NSAIDs والـ biologics هما أساس الـ axial. الـ SSZ للـ peripheral بس، والـ MTX مشكوك فيه، والـ leflunomide مالوش فايدة تقريبًا، والـ systemic steroids ممنوعة. الـ local injection مفيد."
      - kind: explain
        page: 291
        title: "الـ TNF inhibitors"
        quote: "Treatment with TNFi monoclonal antibodies is strongly recommended over. Treatment with etanercept."
        text: |
          بعد ما ==2 NSAIDs يفشلوا==: biologic. الخمسة: etanercept، infliximab، adalimumab، golimumab، certolizumab.

          لو فيه ==IBD أو uveitis==: **monoclonal antibody** أحسن من الـ **etanercept** (الـ etanercept مش بيحمي منهم).

          **قبل ما تبدأ**: اعمل screening لـ ==latent TB، HBV، HIV==. ممنوع في الـ **active HBV**، وشكله آمن في الـ chronic HCV.
      - kind: mnemonic
        page: 291
        quote: "Increased risk of malignancy (lymphoma and non melanotic skin cancers). Increased risk for new-onset congestive heart failure."
        word: "TIMBER"
        parts:
          - { key: "T", text: "TB and fungal reactivation" }
          - { key: "I", text: "Infections (bacterial) and Injection or infusion reactions" }
          - { key: "M", text: "Malignancy: lymphoma, non-melanoma skin cancer" }
          - { key: "B", text: "Blood: cytopenias" }
          - { key: "E", text: "Exacerbated heart: new-onset congestive heart failure" }
          - { key: "R", text: "Rogue immunity: lupus-like illness and demyelination (MS)" }
        hook: "الـ TNF inhibitor بيقطع الـ **TIMBER** (الخشب) اللي المناعة واقفة عليه."
      - kind: table
        page: 292
        quote: "Ustekinumab (Anti-IL-12/IL-23) (Stelara) not approved owing to lack of efficacy."
        title: "الـ interleukin والـ JAK"
        columns: ["Drug", "Target", "In AS"]
        rows:
          - ["Secukinumab", "IL-17A", "Approved 2016"]
          - ["Ixekizumab", "IL-17A", "Used"]
          - ["Ustekinumab", "IL-12/23", "Not approved"]
          - ["Tofacitinib", "JAK", "Oral, approved"]
          - ["Upadacitinib", "JAK", "Oral, approved"]
        hide: [[0, 1], [2, 2], [3, 1]]
      - kind: aside
        tone: trap
        page: 292
        quote: "It can be used both as first line biologic drug after NSAIDs and as second line drug after failure of a TNF blocker."
        text: "الـ **IL-23** مهم في الـ pathogenesis، بس الـ **ustekinumab** (anti-IL-12/23) ==فشل== في الـ AS واتقال \"not approved\". الـ **IL-17A** (secukinumab) هو اللي اشتغل، first line بعد الـ NSAIDs أو second line بعد الـ TNFi."
      - kind: figure
        page: 294
        quote: "Start NSAID and titrate up to the maximum tolerated dose"
        title: "الـ ASAS-EULAR algorithm"
        alt: "Vertical flowchart in three phases. Phase I: all patients get education, exercise, stop smoking and physiotherapy; start an NSAID to the maximum tolerated dose; sufficient response at 2 to 4 weeks after at least 2 NSAID courses? Yes continue. No leads to phase II: mainly peripheral symptoms get local glucocorticoid and consider sulfasalazine; purely axial disease starts TNFi, IL-17i or JAKi, with a TNF monoclonal antibody preferred for uveitis or IBD and IL-17i for significant psoriasis. Check ASDAS improvement of 1.1 or more after 12 weeks. No leads to phase III: re-evaluate the diagnosis and comorbidities and switch to another bDMARD or a JAKi."
        caption: "كل مرحلة ليها checkpoint: الأولى **2-4 أسابيع** على الـ NSAID، والتانية والتالتة ==ASDAS يقل 1.1 بعد 12 أسبوع==."
        svg: |
          <svg viewBox="0 0 330 390" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R17c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="310" height="70" rx="8" class="fg-acc"/>
            <text x="20" y="30" class="t-b">Phase I (all)</text>
            <text x="20" y="48" class="t-sm">education, exercise, stop smoking, physio</text>
            <text x="20" y="66" class="t-sm">NSAID to max dose, ≥ 2 courses</text>
            <path d="M165 80 L165 98" class="fg-arrow" marker-end="url(#R17c)"/>
            <rect x="40" y="100" width="250" height="34" rx="17" class="fg-thin"/>
            <text x="165" y="122" text-anchor="middle" class="t-sm">Enough at 2-4 weeks? No ↓</text>
            <path d="M165 134 L165 152" class="fg-arrow" marker-end="url(#R17c)"/>
            <rect x="10" y="154" width="150" height="88" rx="8" class="fg-box"/>
            <text x="20" y="174" class="t-b">Peripheral</text>
            <text x="20" y="194" class="t-sm">local steroid</text>
            <text x="20" y="212" class="t-sm">consider SSZ</text>
            <rect x="170" y="154" width="150" height="88" rx="8" class="fg-bad"/>
            <text x="180" y="174" class="t-b">Purely axial</text>
            <text x="180" y="194" class="t-sm">TNFi, IL-17i or JAKi</text>
            <text x="180" y="212" class="t-sm">uveitis/IBD: TNF mAb</text>
            <text x="180" y="230" class="t-sm">psoriasis: IL-17i</text>
            <path d="M165 242 L165 260" class="fg-arrow" marker-end="url(#R17c)"/>
            <rect x="40" y="262" width="250" height="34" rx="17" class="fg-thin"/>
            <text x="165" y="284" text-anchor="middle" class="t-sm">ΔASDAS ≥ 1.1 at 12 weeks? No ↓</text>
            <path d="M165 296 L165 314" class="fg-arrow" marker-end="url(#R17c)"/>
            <rect x="10" y="316" width="310" height="64" rx="8" class="fg-box"/>
            <text x="20" y="336" class="t-b">Phase III</text>
            <text x="20" y="354" class="t-sm">re-check diagnosis and comorbidities</text>
            <text x="20" y="372" class="t-sm">switch bDMARD (TNFi or IL-17i) or JAKi</text>
          </svg>
      - kind: match
        page: 293
        quote: "For patients with inadequate response to the first TNFi, use of an anti-IL-17i is recommended over use of a different TNFi."
        prompt: "وصّل كل عيان بالخطوة الجاية:"
        pairs:
          - ["2 NSAIDs failed, nothing else", "Add a TNFi"]
          - ["2 NSAIDs failed + big psoriasis", "IL-17i is reasonable first"]
          - ["Never responded to first TNFi", "Switch to an IL-17i"]
          - ["Responded to TNFi, then lost it", "Second TNFi"]
          - ["IL-17i failed after 3 months", "Switch to a TNFi"]
        why: "الـ TNFi هو الأول. psoriasis = IL-17i بديل معقول. primary failure للـ TNFi = IL-17i. secondary loss = TNFi تاني. IL-17i فشل = TNFi."
      - kind: check
        page: 293
        quote: "A TNF inhibitor (except etanercept) would be preferred in patients with uveitis or IBD (it may be exacerbated by anti-IL-17 agents)."
        question: "شاب عنده AS و Crohn، فشل في 2 NSAIDs. تختار إيه؟"
        options: ["Adalimumab", "Secukinumab", "Etanercept", "Methotrexate"]
        answer: 0
        why:
          - "صح: مع الـ IBD، TNFi monoclonal antibody هو الأفضل."
          - "الـ anti-IL-17 ممكن يزوّد الـ IBD."
          - "الـ etanercept مستثنى في الـ IBD والـ uveitis."
          - "الـ csDMARDs ما بتفيدش الـ axial."
      - kind: explain
        page: 294
        title: "الـ peripheral والـ enthesitis"
        quote: "It should be avoided in the area of the Achilles tendon, as they might induce tendon rupture."
        text: |
          **Mono أو oligoarthritis**: NSAIDs، بعدين aspiration و IA steroid لو المفصل متاح، وبعدين **SSZ**.

          **Peripheral مع axial متظبط**: csDMARD (SSZ 2-3 g أو MTX 15-25 mg/أسبوع)، ولو فشل TNFi. الـ leflunomide مالوش فايدة تقريبًا.

          **Axial مش متظبط**: ==biologic== على طول، لأن الـ csDMARDs ==ما بتشتغلش على الـ axial==.

          **Enthesitis**: NSAIDs، بعدين local steroid، بس ==مش جنب الـ Achilles== (ممكن يتقطع)، وبعدين bDMARD.
      - kind: try
        items: [rheum.L17.079, rheum.L17.084, rheum.L17.087, rheum.L17.093, rheum.L17.098]
    recap:
      - "مفيش cure. وقف تدخين، physio، swimming."
      - "NSAIDs full dose، 2 NSAIDs على 4 أسابيع؛ المستمر بيقلّل الـ progression."
      - "SSZ للـ peripheral بس؛ MTX مشكوك فيه؛ systemic steroids ممنوعة."
      - "TNFi بعد 2 NSAIDs؛ IBD/uveitis = mAb مش etanercept؛ screen TB/HBV/HIV."
      - "Secukinumab (IL-17A) أيوه؛ ustekinumab لأ. JAKi بعد الـ TNFi."
      - "Primary TNFi failure → IL-17i؛ secondary loss → TNFi تاني. ممنوع حقن جنب الـ Achilles."
