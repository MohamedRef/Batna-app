  - id: neph.L08.lesson3
    title: "Case 2: الـ lupus والـ classes"
    hook: "بنت 14 سنة بـ creatinine 7.3 والتشخيص اتعمل من الدم. طب ليه الـ biopsy؟ علشان الـ class هو اللي بيختار العلاج."
    minutes: 10
    pages: [227, 230]
    topics: [lupus]
    goals:
      - "تقرا labs الـ lupus وتعرف ليه الـ biopsy لازم حتى بعد التشخيص"
      - "تحفظ classes الـ ISN/RPS وتفهم ليه مكان الـ deposit بيحدد الـ class"
      - "تحسب الـ activity والـ chronicity من تقرير case 2"
    status: unverified
    steps:
      - kind: explain
        page: 227
        title: "Case 2"
        quote: "S.L.E was diagnosed, and cellcept and hydroquine were started. In your opinion, should we proceed to a renal biopsy? Why?"
        text: |
          بنت **14 سنة** بتاخد **non-steroidal anti-inflammatory drugs (NSAIDs)** لركبتها، جاية بـ fatigue و vomiting، **Hb 5.8**، **white blood cell (WBC) 2.6**، و ==creatinine 7.3==.

          الـ labs: **anti-dsDNA 321**، antinuclear antibodies (ANA) 7.9، urine فيها 80 red blood cell (RBC)، **urine protein-to-creatinine ratio (uPCR) 6.7**، erythrocyte sedimentation rate (ESR) 140. اتشخّصت ==systemic lupus erythematosus (SLE)== وبدأت **CellCept** و **hydroxychloroquine**.

          ليه الكتاب ذاكر الـ NSAIDs؟ التفسير المقبول (مش في الكتاب): الـ NSAIDs نفسها ممكن تعمل AKI أو interstitial nephritis، فهي فخ: ممكن تقول «ده من المسكنات» وتفوّت الـ lupus. بس الصورة كلها بتقول مرض جسم كله:
          - **Hb 5.8** و **WBC 2.6**: الـ lupus بيضرب الـ blood cells بالـ antibodies.
          - **anti-dsDNA 321** عالي جدًا: ده الـ antibody اللي بيمشي مع الـ lupus nephritis النشط.
          - **80 RBC** في البول و **uPCR 6.7**: nephritic و nephrotic مع بعض، يعني التهاب في الـ capillary و podocyte متعوّر.
          - **creatinine 7.3** في بنت 14 سنة: كلية بتقع بسرعة، فالـ biopsy لازم يتعمل بسرعة عشان يحدد الـ class.
      - kind: explain
        page: 227
        title: "الـ labs بتقول إيه؟"
        quote: "Pending results, I.V Dexamethasone 1 cm/12 hrs was started."
        text: |
          الكتاب بيقول إنهم بدأوا **I.V dexamethasone** وهم مستنيين النتايج، وبعدين جت:
          - **ANA 7.9** و ==anti-dsDNA 321==.
          - البول: **protein 2+**، **RBCs 80–82**، pus 6–7؛ و **uACR 5980** و **uPCR 6.7**.
          - **Albumin 2.2**، **K 5.1**، **phosphate 7.8**، **ESR 140**، **LDH 224**، و faecal occult blood سلبي.

          ليه كل رقم؟ التفسير المقبول (مش في الكتاب):
          - الـ **anti-dsDNA** العالي جدًا مع **anemia** و **leukopenia** بيقفلوا تشخيص الـ SLE النشط.
          - الـ **RBCs** الكتير مع protein بالجرامات = ==active nephritis== (nephritic) فوق nephrotic-range proteinuria.
          - الـ **phosphate** والـ **K** العاليين = الكلية مش قادرة تطلّعهم، يعني failure حقيقي.
          - ليه **LDH** و **faecal occult blood**؟ علشان يستبعدوا إن الـ anemia من **hemolysis** أو **نزيف**، يعني مش لازم كل الـ anemia تكون من الـ lupus أو الكلية.
          - وليه بدأوا الـ steroid قبل النتايج؟ لأن creatinine 7.3 مع active sediment ما يستناش.

          إزاي تفرّق lupus نشيط من lupus هادي في الـ labs؟ التفسير المقبول (مش في الكتاب): الـ ANA بيفضل موجب طول العمر، فمش بيقيس النشاط. اللي بيتحرك مع النشاط هو الـ **anti-dsDNA** (بيطلع) والـ **C3 و C4** (بيقعوا لأن الـ immune complexes بتستهلكهم). والـ ESR العالي مع CRP مش عالي قوي صورة مشهورة في الـ lupus. فلو عايز تتابع الكلية بعد العلاج، تابع الـ dsDNA والـ complement والـ uPCR، مش الـ ANA.
      - kind: reveal
        page: 227
        quote: "S.L.E was diagnosed, and cellcept and hydroquine were started. In your opinion, should we proceed to a renal biopsy? Why?"
        prompt: "التشخيص اتعمل. نعمل biopsy ليه؟"
        answer: "علشان الـ **class** هو اللي بيحدد العلاج، والـ biopsy بيوري **activity** و **chronicity**، وممكن يكشف حاجة تانية؛ وفعلًا لقى **toxic acute tubular injury** (غالبًا من الـ NSAIDs)."
      - kind: table
        page: 228
