lessons:
  # ------------------------------------------------------------------
  - id: endo.L07.lesson1
    title: "الـ apoplexy: صداع زي الرعد في الغدة النخامية"
    hook: "أول قاعدة في طوارئ الغدد: الـ cortisol قبل أي حاجة تانية."
    minutes: 8
    pages: [111, 113]
    topics: [overview, apoplexy]
    goals:
      - "تعرف السبع طوارئ"
      - "تشخّص الـ pituitary apoplexy وتفرّقه عن الـ SAH"
      - "ترتّب العلاج: hydrocortisone الأول، والـ thyroxine بعده"
    status: unverified
    steps:
      - kind: explain
        remind: [endo.L07.001]
        page: 111
        quote: "Endocrine Emergencies include\n  1. Pituitary apoplexy.\n  2. Myxedema coma.\n  3. Thyroid storm.\n  4. Acute hypocalcemia.\n  5. Acute hypercalcemia.\n  6. Acute adrenal insufficiency.\n  7. Pheochromocytoma crisis."
        title: "السبع طوارئ"
        text: |
          الكتاب بيعدّ سبع ==endocrine emergencies==:

          1. Pituitary apoplexy
          2. Myxedema coma
          3. Thyroid storm
          4. Acute hypocalcemia
          5. Acute hypercalcemia
          6. Acute adrenal insufficiency
          7. Pheochromocytoma crisis

          التفسير المقبول (مش في الكتاب): هتلاقي الـ hydrocortisone راجع في أغلبهم (الـ apoplexy، الـ myxedema coma، الـ storm، والـ adrenal crisis)، لأن نقص الـ cortisol هو اللي بيقتل بسرعة وعلاجه سهل. يعني لو شاكك في أي واحدة فيهم ومش متأكد، الـ hydrocortisone نادرًا ما يضر.
      - kind: explain
        remind: [endo.L07.004]
        page: 111
        quote: "It results in hypopituitarism, but cortisol deficiency is the most serious amongst all hormone deficiencies because it can cause life-threatening hypotension."
        title: "يعني إيه apoplexy؟"
        text: |
          ==Haemorrhage into a pituitary adenoma==. نادر، بس اتوصف في **0.6% لـ 25%** من الـ treated adenomas.

          النتيجة **hypopituitarism**، وأخطر نقص فيهم هو ==cortisol== لأنه بيعمل **life-threatening hypotension**.

          مرتبط بـ trauma، hypertension، cardiac surgery، dynamic pituitary function tests، وحاجات تانية كتير.
      - kind: explain
        page: 111
        quote: "Pathophysiology\nThe precise pathophysiology remains uncertain but is associated with:\n– Trauma.\n– Hypertension."
        title: "إيه اللي بيفجّر النزيف؟"
        text: |
          الكتاب بيقول إن الـ pathophysiology بالظبط **مش معروفة**، بس الـ apoplexy مرتبطة بـ:

          - **Trauma**.
          - **Hypertension**.
          - **Cardiac surgery**.
          - **Dynamic pituitary function tests**.
          - وحاجات تانية كتير.

          التفسير المقبول (مش في الكتاب): الـ adenoma الكبير بيكبر أسرع من الأوعية اللي بتغذيه، فبيعيش على حافة الـ ischaemia. علشان كده أي حاجة بتغيّر الدم الواصل له فجأة ممكن تفجّر نزيف أو infarction جواه: الخبطة، الضغط العالي، الـ cardiac surgery بتقلبات الضغط والـ anticoagulation، والـ dynamic tests اللي بتنشّط الغدة فتزوّد احتياجها للدم. يعني لو مريض عنده adenoma معروف وجاله صداع فجأة بعد واحدة من دول، فكّر في الـ apoplexy الأول.
      - kind: mnemonic
        page: 112
        quote: "The usual triad for apoplexy is:\n  Sudden severe headache.\n  Diplopia.\n  Features of hypopituitarism."
        word: "HDH"
        hook: "التلاتية: \"Head, Double, Hormones\"."
        parts:
          - { key: "H", text: "Sudden severe Headache" }
          - { key: "D", text: "Diplopia" }
          - { key: "H", text: "Features of Hypopituitarism" }
      - kind: explain
        remind: [endo.L07.006]
        page: 112
        quote: "Symptoms and signs may evolve over several hours or days and include:\n  Sudden onset of severe headache.\n  Visual field defects and visual loss.\n  Nausea and vomiting.\n  Focal neurological deficit.\n  Altered conscious level, confusion and even coma.\n  Shock."
        title: "الصورة الكاملة"
        text: |
          ممكن تبقى خفيفة، وممكن **adrenal crisis**، coma، أو sudden death. بتتطور على ساعات أو أيام:

          - Sudden severe headache.
          - **Visual field defects** و visual loss.
          - Nausea و vomiting.
          - Focal neurological deficit.
          - Altered consciousness لحد الـ coma.
          - ==Shock==.

          التفسير المقبول (مش في الكتاب): الـ visual defects لأن الـ adenoma بيكبر فجأة بالنزيف ويضغط على الـ optic chiasm اللي فوقه، والـ diplopia من ضغطه على الـ cavernous sinus جنبه وفيه أعصاب حركة العين. والـ shock من نقص الـ cortisol زي ما الكتاب قال.
      - kind: check
        page: 112
        quote: "Differential Diagnosis\n  Subarachnoid hemorrhage and\n  Bacterial meningitis This will require imaging of the brain and should identify a pituitary problem."
        question: "Sudden severe headache with vomiting and confusion. Which two diagnoses must be separated from apoplexy?"
        options: ["Subarachnoid haemorrhage and bacterial meningitis", "Migraine and tension headache", "Hypoglycaemia and stroke", "Sinusitis and glaucoma"]
        answer: 0
        why:
          - "صح: والـ brain imaging هو اللي بيفرّق وبيبيّن الـ pituitary."
          - "مش الـ differential اللي في الكتاب، ومش بالخطورة دي."
          - "مش المذكورين في الكتاب."
          - "مش المذكورين في الكتاب."
      - kind: reveal
        page: 112
        quote: "Differential Diagnosis\n• Subarachnoid hemorrhage and\n• Bacterial meningitis\nThis will require imaging of the brain and should identify a pituitary problem."
        prompt: "ليه الـ SAH والـ meningitis بالذات هما الـ differential؟ وإيه اللي بيحسم؟"
        answer: "لأن التلاتة بيبدأوا بنفس الشكل: **صداع شديد مفاجئ**، vomiting، و altered consciousness لحد الـ coma. التفسير المقبول (مش في الكتاب): النزيف في الـ apoplexy ممكن يطلع للـ subarachnoid space فيعمل neck stiffness و photophobia زي الـ meningitis بالظبط، فمن الكشف لوحده صعب تفرّق. الحاسم في الكتاب هو ==brain imaging==: هيبيّن النزيف جوه الـ pituitary adenoma. والفرق ده مهم لأن علاج الـ apoplexy بيبدأ بالـ hydrocortisone، مش بالـ antibiotics ولا بالـ neurosurgery للـ aneurysm."
      - kind: figure
        page: 113
        quote: "Treatment of cardiovascular collapse by giving hydrocortisone 100 mg iv every six hours in normal saline."
        title: "الخطوات"
        alt: "A vertical flowchart: suspect apoplexy; vital signs and glucose every 1 to 2 hours; hydrocortisone 100 mg IV six-hourly in saline; brain imaging; thyroxine only after steroids; surgery if visual deficit, conservative if none or resolving; full endocrine work-up and lifelong follow-up."
        caption: "الـ steroid الأول دايمًا. الـ thyroxine قبله بيعلّي الـ metabolic rate والقلب مش مستحمل."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
