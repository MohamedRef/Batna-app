    steps:
      - kind: explain
        page: 33
        quote: "1.1.4. Evaluation of cause"
        title: "تدوّر على السبب إزاي؟"
        text: |
          الكتاب (**Evaluation of cause**) بيدوّر على السبب من: **nephrotoxic medications**، الـ **medical history**، **symptoms and signs of systemic diseases**، وبعدين **urinalysis**، **ultrasound**، **urine albumin-to-creatinine ratio**، و **kidney biopsy**.

          التفسير المقبول (مش في الكتاب) لكل أداة:

          - **الأدوية**: أسهل سبب يتصلح (NSAIDs، lithium، PPI)، فبيتسأل عنه الأول.
          - **العلامات الـ systemic**: rash أو arthritis ممكن تقولك lupus أو vasculitis قبل أي تحليل.
          - **Urinalysis**: الـ RBCs والـ casts بتشاور على الـ glomerulus، والـ pyuria على الـ interstitium.
          - **Ultrasound**: الحجم، الـ cysts، الـ obstruction.
          - **Biopsy**: لما السبب مش واضح والنتيجة هتغيّر العلاج.
