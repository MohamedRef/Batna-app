  - id: neph.L08.208
    kind: mcq
    topic: anca-mpgn
    stem: A crescentic GN biopsy shows paucity of immunohistology staining for immunoglobulins and complement, with few or no deposits on EM. The patient has vasculitis with granulomas but no asthma. Diagnosis by the book's algorithm?
    options:
      - Wegener's granulomatosis
      - Microscopic polyangiitis
      - Churg-Strauss syndrome
      - Goodpasture syndrome
      - Renal-limited pauci-immune GN
    answer: 0
    why:
      - Correct. Pauci-immune with granulomas and no asthma = Wegener's granulomatosis (GPA).
      - Microscopic polyangiitis has vasculitis with no asthma and no granulomas.
      - Churg-Strauss has eosinophilia, asthma and granulomas.
      - Goodpasture has linear GBM IgG with lung hemorrhage.
      - Pauci-immune GN without systemic vasculitis is renal-limited.
    src: { page: 291, quote: "Immunohistology for Immunoglobulins and Complement" }
    status: unverified
