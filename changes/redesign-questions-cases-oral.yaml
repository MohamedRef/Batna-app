# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: improved
  ar_eg: بنك الأسئلة بقى فيه 3 طرق واضحة (تدريب بشرح، تدريب بالوقت، امتحان تجريبي)، والعدد الحقيقي للأسئلة والوقت، والتخصيص في زرار واحد
  en: The question bank has three clear modes (practice with explanations, timed practice, mock), real question and time counts, and filters behind one button
- kind: improved
  ar_eg: البنك بيفتح على آخر طريقة ونطاق اخترتهم، ولو الفلتر مفيهوش أسئلة بيقولك ليه ويرجّعها بدوسة
  en: The bank opens on your last mode and scope; an empty filter says why and widens back in one tap
- kind: improved
  ar_eg: في التدريب بشرح بتختار الأول وبعدين تدوس "صحّح الإجابة"، فالاختيار الغلط بالصدفة مبقاش بيتحسب
  en: Practice questions are select then "check", so a stray tap is no longer graded
- kind: improved
  ar_eg: الحالات فيها شريط خطوات، وتختار وبعدين تصحّح، ومراجعة لتفكيرك في الآخر، والحالة بتستناك لو خرجت في نصها
  en: Cases show a step bar, use select then check, end with a step-by-step reasoning recap, and wait for you if you leave mid-case
- kind: new
  ar_eg: في الشفوي تقدر توقّف مؤقت التفكير وتكمّله، وتعلّم على نقط الإجابة اللي قلتها، وتكتب نقطك لو حابب (بتفضل على الجهاز)
  en: Oral mode can pause and resume the think timer, tick the answer points you said, and take optional typed notes (kept on the device)
