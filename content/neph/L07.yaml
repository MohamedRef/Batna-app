    front: Why can a skin biopsy diagnose X-linked Alport but not autosomal recessive Alport?
    back: The epidermal basement membrane contains α5(IV) but not α3 or α4. X-linked disease removes α5 (absent in men, mosaic in women); in AR disease α5 is still present in skin.
