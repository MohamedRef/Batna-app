  - id: dm.L23.lesson3
    title: "بعد الـ statin: ezetimibe و PCSK9 و inclisiran و bempedoic"
    hook: "الـ statin وصل لآخره والـ LDL لسه فوق. عندك 4 أبواب: من الأمعاء، من الـ receptor، من الـ mRNA، ومن مصنع الكوليسترول نفسه."
    minutes: 9
    pages: [290, 295]
    topics: [ezetimibe, pcsk9, bempedoic, intensity]
    goals:
      - "تفهم ezetimibe وليه بيكمّل الـ statin"
      - "تشرح الـ PCSK9 وتعرف indications الـ inhibitors"
      - "تفرق inclisiran عن الـ antibodies، وتعرف bempedoic acid"
    status: unverified
    steps:
      - kind: explain
        page: 291
        title: "Ezetimibe: نقفل الباب التاني"
        quote: "NPC1L1 = Niemann-Pick C1-like 1; HMG-CoA = 3-hydroxy-3-methylglutaryl acetyl coenzyme A"
        text: |
          الكوليسترول له مصدرين: **الكبد بيصنعه** (الـ statin بيقفل ==HMG-CoA reductase==) و**الأمعاء بتمتصه** (الـ ezetimibe بيقفل ==NPC1L1==).

          الاتنين مع بعض: كوليسترول أقل في الكبد ← **LDL receptors أكتر** ← الـ LDL-C بيتشال من الدم أكتر.
          ومع الـ statin، الـ ezetimibe بيقلل الـ **hsCRP** والـ LDL-C لحد 3 أضعاف مقارنة بالـ statin لوحده.
      - kind: figure
        page: 292
        quote: "PCSK9 binds to LDL receptor (LDLR) on hepatocytes"
        title: "الـ PCSK9: الحرامي اللي بياخد الـ receptor"
        alt: "Two panels. Left, without inhibition: PCSK9 binds the LDL receptor with its LDL particle, the whole complex is taken in and degraded in a lysosome, so fewer receptors return and blood LDL rises. Right, with an antibody: the antibody grabs PCSK9, the receptor releases LDL inside and recycles to the surface, so more receptors clear LDL."
        caption: "من غير علاج: الـ PCSK9 بيسحب الـ receptor **للـ degradation**. مع الـ ==antibody==: الـ receptor بيرجع (recycles) ويشيل LDL أكتر."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L23b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <text x="82" y="18" text-anchor="middle" class="t-sm t-b">Without inhibitor</text>
            <text x="248" y="18" text-anchor="middle" class="t-sm t-b">With antibody</text>
            <path d="M165 26 L165 240" class="fg-line"/>
            <rect x="10" y="150" width="145" height="90" rx="10" class="fg-box"/>
            <rect x="175" y="150" width="145" height="90" rx="10" class="fg-box"/>
            <text x="82" y="232" text-anchor="middle" class="t-sm t-mut">Hepatocyte</text>
            <text x="248" y="232" text-anchor="middle" class="t-sm t-mut">Hepatocyte</text>
            <circle cx="60" cy="60" r="14" class="fg-bad"/>
            <text x="60" y="64" text-anchor="middle" class="t-sm">LDL</text>
            <circle cx="105" cy="70" r="10" class="fg-acc"/>
            <text x="105" y="95" text-anchor="middle" class="t-sm">PCSK9</text>
