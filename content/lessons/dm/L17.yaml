      - kind: explain
        page: 218
        title: "وعوامل تانية"
        quote: "Other risk factors include nulliparity, protein-calorie malnutrition, gastrectomy, alcohol abuse, cigarette smoking, and a history of drug use or illness that predisposes a person to increased bone loss (eg, corticosteroid use, thyrotoxicosis)."
        text: |
          **Other risk factors**: nulliparity، protein-calorie malnutrition، gastrectomy، alcohol، **smoking**، وأي دوا أو مرض بيزوّد الـ bone loss (corticosteroids، thyrotoxicosis).

          و ==Age== هو **the chief single predictor**.

          التفسير المقبول (مش في الكتاب): الـ alcohol والسجاير والـ malnutrition والـ gastrectomy كلهم بيقللوا اللي داخل للعضم (كالسيوم وبروتين) أو بيسرّعوا تكسير الـ estrogen، والـ nulliparity معناها سنين حمل أقل بهرمونات عالية.
      - kind: reveal
        page: 218
        quote: "Body weight: Low body weight increases the risk of osteoporosis through unidentified mechanisms, which are thought to include decreased availability of biologically active estrogen in thin postmenopausal women and lower peak bone mass in thin young women. Obesity may protect because higher estrogen levels in obese men and women and increased skeletal weight bearing may stimulate bone formation."
        prompt: "ليه الست الرفيعة في خطر والتخينة محمية؟"
        answer: |
          - الرفيعة: **less biologically active estrogen** بعد سن اليأس، و **lower peak bone mass** وهي صغيرة.
          - التخينة: ==higher estrogen levels== (الدهون بتعمل estrogen)، و **weight bearing** أكتر بيحفّز الـ bone formation.

          وبالمرة: الـ blacks عندهم **greater peak bone mass**، علشان كده أقل.
      - kind: explain
        page: 218
        title: "الـ FRAX"
        quote: "Fracture risk assessment tool [FRAX] developed by WHO to predict your\n10-year likelihood of having a minimal trauma fracture (breaking a bone after falling from standing height or less)."
        text: |
          ==Fracture Risk Assessment Tool (FRAX)== أداة من الـ **World Health Organization (WHO)** بتحسب احتمال **minimal trauma fracture** في **10 سنين**.

          **Minimal trauma** = كسر من وقعة من طولك أو أقل. والنتيجة بتبقى أدق لو حطيت **dual-energy X-ray absorptiometry (DEXA) results**.
      - kind: check
        page: 218
        quote: "(before age 45), oophorectomy, secondary amenorrhea, lifelong low calcium intake (including lactose intolerance), sedentary lifestyle, and immobilization."
        question: "Woman at high risk of osteoporosis is the following except:"
        options:
          - "Active"
          - "Caucasian"
          - "Smoker"
          - "Thin habitus"
        answer: 0
        why:
          - "صح (سؤال الكتاب): الـ risk factor هو **sedentary lifestyle**، النشاط بيحمي."
          - "White race = major risk factor."
          - "Smoking = risk factor."
          - "Thin habitus = major risk factor."
      - kind: explain
        page: 219
        title: "صامت لحد الكسر"
        quote: "Individuals with osteoporosis often remain asymptomatic until a fracture occurs. The precipitating event may be as seemingly innocuous as turning over in bed, although falling and lifting are more common."
        text: |
          المريض ==asymptomatic until a fracture occurs==. والسبب ممكن يبقى تافه زي إنه **اتقلب في السرير**، وإن كان الـ falling والـ lifting أشهر.

          على العكس، الـ **osteomalacia** بتعمل **diffuse bony tenderness and pain** حتى من غير كسر في الأشعة.
      - kind: reveal
        page: 219
        quote: "The precipitating event may be as seemingly innocuous as turning over in bed, although falling and lifting are more common."
        prompt: "ست اتقلبت في السرير وجالها ألم مفاجئ في نص ضهرها. إزاي حركة تافهة تكسر فقرة؟"
        answer: |
          الكتاب بيقول إن الـ precipitating event ممكن يبقى ==تافه كده==، وإن الوقعة والشيل أشهر، وفيه ناس مش فاكرة أي سبب.

          التفسير المقبول (مش في الكتاب): الفقرة عضم ==trabecular== بالأساس، ولما الـ trabeculae الأفقية تروح (ص 220) العمود بيبقى زي سقف من غير عوارض. أي ضغط عادي من وزن الجسم ممكن يخسفه، وده الـ vertebral crush بتاع type 1.
      - kind: aside
        tone: exam
        page: 219
        quote: "Some patients cannot recall any precipitating event. In contrast, osteomalacia often causes diffuse bony tenderness and pain, even in the absence of radiographically evident fractures."
        text: "سؤال المقارنة المحبوب: **عضم بيوجع من غير كسر = osteomalacia**. **ساكت لحد ما يتكسر = osteoporosis**."
      - kind: explain
        remind: [dm.L17.041, dm.L17.043]
        page: 219
        title: "الـ history والكشف"
        quote: "The patient with a fracture or radiographic evidence of osteopenia should be questioned about the hallmarks of metabolic bone disease (eg, fractures, loss of height, bone pain, and muscle weakness) and specifically about drugs and disorders associated with vitamin D deficiency and osteomalacia."
        text: |
          التشخيص ==requires excluding== الـ osteomalacia والـ malignancy والـ secondary osteoporosis.

          اسأل عن الـ hallmarks: **fractures، loss of height، bone pain، muscle weakness**، وعن أدوية وأمراض الـ **vitamin D deficiency**.

          ليه الـ vitamin D بالذات؟ عشان الـ osteomalacia هي أكتر حاجة بتتلخبط مع الـ osteoporosis، وعلاجها مختلف. والـ loss of height علامة إن فيه فقرات اتخسفت من غير ما يحس.

          ودوّر على: alcohol، malabsorption، **hypercortisolism**، endocrinopathy، malignancy.
