        title: "العلاج والـ prognosis"
        quote: "Antibiotics: appropriate short term antibiotic therapy should be administered if the infection remains active."
        text: |
          - **NSAIDs**، intra-articular (IA) steroids، **sulfasalazine (SSZ) 1-3 g/day**، methotrexate (MTX).
          - الـ biologics ==ما اتدرستش==.
