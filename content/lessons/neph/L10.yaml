  # ------------------------------------------------------------------
  - id: neph.L10.lesson1
    title: "الدوا بيضرب الكلية فين؟"
    hook: "نفس الدوا ممكن يضرب الأوعية، أو الـ glomerulus، أو الـ tubule. لو عرفت الخريطة، الأسئلة هتبقى سهلة."
    minutes: 8
    pages: [337, 339]
    topics: [defs, drug-vessels, drug-tubules]
    goals:
      - "تعرف يعني إيه interstitium وليه إصابته بتوقّع وظيفة الكلية"
      - "توزّع الأدوية على أماكن الضرر: أوعية، glomerulus، proximal، loop، distal"
      - "تربط كل مكان بالـ syndrome بتاعه (Fanconi، nephrogenic DI، dRTA)"
    status: unverified
    steps:
      - kind: explain
        page: 337
        title: "الـ interstitium يعني إيه؟"
        quote: "Interstitium comprises of everything of renal component except glomeruli"
        text: |
          الكتاب بيقولها ببساطة: الـ ==interstitium== هو **كل حاجة في الكلية ما عدا الـ glomeruli**.

          علشان كده الالتهاب المستمر فيه بيدمّر **حتة كبيرة من نسيج الكلية**، والنتيجة نزول واضح في وظيفتها.
      - kind: figure
        page: 337
        quote: "Sites of Renal Damage by Drugs"
        title: "خريطة الضرر بالأدوية"
        alt: "Six stacked boxes from top to bottom: renal vessels (ACEI, ARB, NSAIDs, contrast, ciclosporin; vasculitis with allopurinol and penicillins; TMA with mithramycin), glomerulus (membranous with gold, penicillamine, captopril; minimal change with NSAIDs and lithium), proximal tubule (aminoglycosides, amphotericin, cisplatin, heavy metals; Fanconi), loop and papilla (NSAIDs, lithium, fluoride; concentrating defect), distal tubule (lithium, amphotericin, NSAIDs; nephrogenic DI and distal RTA), interstitium (NSAIDs, methicillin, rifampicin, allopurinol, diuretics; acute and chronic TIN)."
        caption: "امشي مع الدم: الأوعية الأول، بعدين الـ glomerulus، بعدين الـ tubule من أوله لآخره. كل محطة ليها أدويتها والـ ==syndrome== بتاعها."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="N10a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="5" y="5" width="320" height="60" rx="8" class="fg-acc"/>
            <text x="15" y="25" class="t-b">Renal vessels</text>
            <text x="15" y="43" class="t-sm">Low RBF: ACEI, ARB, NSAIDs, contrast, CysA</text>
            <text x="15" y="58" class="t-sm t-mut">Vasculitis: allopurinol, penicillins · TMA: mithramycin</text>
            <path d="M165 65 L165 75" class="fg-arrow" marker-end="url(#N10a)"/>
            <rect x="5" y="77" width="320" height="60" rx="8" class="fg-box"/>
            <text x="15" y="97" class="t-b">Glomerulus</text>
            <text x="15" y="115" class="t-sm">Membranous: gold, penicillamine, captopril</text>
            <text x="15" y="130" class="t-sm t-mut">Minimal change: NSAIDs, lithium, antibiotics</text>
            <path d="M165 137 L165 147" class="fg-arrow" marker-end="url(#N10a)"/>
            <rect x="5" y="149" width="320" height="60" rx="8" class="fg-bad"/>
            <text x="15" y="169" class="t-b">Proximal tubule</text>
            <text x="15" y="187" class="t-sm">Aminoglycosides, amphotericin B, cisplatin, Hg, Cd</text>
            <text x="15" y="202" class="t-sm t-mut">Fanconi syndrome, tubular necrosis</text>
            <path d="M165 209 L165 219" class="fg-arrow" marker-end="url(#N10a)"/>
            <rect x="5" y="221" width="320" height="60" rx="8" class="fg-box"/>
            <text x="15" y="241" class="t-b">Loop of Henle and papilla</text>
            <text x="15" y="259" class="t-sm">NSAIDs, lithium, tetracycline, fluoride</text>
            <text x="15" y="274" class="t-sm t-mut">Low Na reabsorption, cannot concentrate urine</text>
            <path d="M165 281 L165 291" class="fg-arrow" marker-end="url(#N10a)"/>
            <rect x="5" y="293" width="320" height="60" rx="8" class="fg-acc"/>
            <text x="15" y="313" class="t-b">Distal tubule</text>
            <text x="15" y="331" class="t-sm">Lithium, amphotericin B, NSAIDs, K-sparing</text>
            <text x="15" y="346" class="t-sm t-mut">Nephrogenic DI, distal RTA (I, IV)</text>
            <rect x="5" y="365" width="320" height="60" rx="8" class="fg-good"/>
            <text x="15" y="385" class="t-b">Whole tubulointerstitium</text>
            <text x="15" y="403" class="t-sm">NSAIDs, methicillin, rifampicin, allopurinol</text>
            <text x="15" y="418" class="t-sm t-mut">AKI (acute TIN) or CKD (chronic TIN)</text>
          </svg>
      - kind: explain
        page: 337
        title: "المحطة الأولى: الأوعية"
        quote: "Reduced RBF:(diminish resistance or constriction); ACEI, ARA, CysA, radiocontrast, NSAIDS"
        text: |
          الدوا ممكن يأذي الكلية **قبل ما الدم يوصلها أصلًا** (prerenal):
          - **Antianabolic**: الـ tetracyclines.
          - ==Reduced RBF==: ACEI، ARA، CysA (ciclosporin)، radiocontrast، NSAIDs. بيغيّروا مقاومة الأوعية أو يقفلوها.

          وممكن يعمل **vasculitis**، أو **thrombotic microangiopathy** (mithramycin و CysA).
      - kind: mnemonic
        page: 337
        quote: "Allopurinol, procainamide, Penicillins, sulphonamides"
        word: "PAPS"
        parts:
          - { key: "P", text: "Procainamide" }
          - { key: "A", text: "Allopurinol" }
          - { key: "P", text: "Penicillins" }
          - { key: "S", text: "Sulphonamides" }
        hook: |
          الـ vasculitis من الأدوية = **PAPS**. أربع أدوية، وكلهم بيعملوا التهاب في الأوعية.
      - kind: check
        page: 338
        quote: "Gold, Penicillamine, Captopril"
        question: "A patient on penicillamine develops nephrotic syndrome. Which lesion does the book link to this drug?"
        options:
          - "Membranous glomerulonephritis"
          - "Minimal change disease"
          - "Thrombotic microangiopathy"
          - "Fanconi syndrome"
        answer: 0
        why:
          - "صح: gold و penicillamine و captopril = membranous."
          - "الـ minimal change مع NSAIDs و lithium والمضادات الحيوية."
          - "الـ TMA مع mithramycin و CysA."
          - "الـ Fanconi ده proximal tubule، مش glomerulus."
      - kind: explain
        page: 338
        title: "الـ proximal tubule: الشغّيل الأكبر"
        quote: "Deceased reabsorption of Sodium, Glucosuria, Aminoaciduria"
        text: |
          الـ ==proximal tubule== بيرجّع معظم اللي الـ glomerulus فلتره. لو اتضرب، كل حاجة تهرب في البول: **Na، glucose، amino acids، β2-microglobulin، phosphate، K، uric acid، bicarbonate**. ده الـ ==Fanconi syndrome==.

          الأدوية: **aminoglycosides**، cephalosporins، acetaminophen، **amphotericin B**، mercuric chloride، cadmium، **outdated tetracyclines**، **cisplatin**.
      - kind: aside
        tone: trap
        page: 338
        quote: "Mercuric chloride, Cadmium, Outdated tetracyclins, Cisplatinum"
        text: |
          الـ **tetracycline** طالع في **3 أماكن**: prerenal (antianabolic)، الـ **outdated** منها في الـ proximal tubule، والـ loop والـ papilla. السؤال ممكن يلعب على كلمة "outdated".
      - kind: sort
        page: 339
        quote: "Drugs: Cyclophosphamide, Chlorpropamide, NSAIDS, Lithium"
        prompt: "كل دوا بيضرب فين أساسًا في الكتاب؟"
        bins: ["Proximal tubule", "Loop and papilla", "Distal: ADH resistance"]
        cards:
          - { text: "Aminoglycosides", bin: 0 }
          - { text: "Cisplatin", bin: 0 }
          - { text: "Cadmium", bin: 0 }
          - { text: "Fluoride", bin: 1 }
          - { text: "Chlorpropamide", bin: 2 }
          - { text: "Cyclophosphamide", bin: 2 }
        why: "الـ proximal: aminoglycosides و cisplatin والمعادن التقيلة. الـ loop: NSAIDs و lithium و tetracycline و fluoride. الـ ADH resistance: cyclophosphamide و chlorpropamide و NSAIDs و lithium."
      - kind: explain
        page: 339
        title: "الـ distal tubule"
        quote: "Clinical presentation: Nephrogenic diabetes insipidus, DRTA (Type I, IV)"
        text: |
          3 أنواع ضرر:
          - **Tubular necrosis**: gentamicin، amphotericin B، phenacetin، toluene، lithium.
          - **K و H مش بيطلعوا**: amphotericin B، NSAIDs، K-sparing diuretics. النتيجة hyperkalaemia و acidosis.
          - ==ADH resistance==: cyclophosphamide، chlorpropamide، NSAIDs، lithium.

          الصورة: ==nephrogenic diabetes insipidus== و **distal RTA** (type I و IV).
      - kind: aside
        tone: joke
        page: 339
        quote: "Drugs: Gentamycin, Amphotericin B, Phenacetin, Toleune, Lithium"
        text: |
          الـ **lithium** زي الضيف اللي بيدخل كل أوضة في الشقة: الـ glomerulus (minimal change)، الـ loop، والـ distal (necrosis و ADH resistance). لو مش فاكر الدوا في سؤال، lithium غالبًا موجود 😄
      - kind: check
        page: 339
        quote: "Clinical presentation: Nephrogenic diabetes insipidus, DRTA (Type I, IV)"
        question: "On lithium, a man passes litres of dilute urine that desmopressin does not correct. Mechanism?"
        options:
          - "Distal ADH resistance"
          - "Proximal Fanconi syndrome"
          - "Reduced renal blood flow"
          - "Membranous GN"
        answer: 0
        why:
          - "صح: lithium بيعمل ADH resistance = nephrogenic DI، فالـ desmopressin مش بيفرق."
          - "الـ Fanconi بيعمل glucosuria و aminoaciduria، مش بول مخفف مقاوم للـ ADH."
          - "دي prerenal (ACEI، NSAIDs)، بتقلل البول مش بتكتّره."
          - "الـ membranous بيعمل protein، ومش من أدوية الـ lithium."
      - kind: explain
        page: 339
        title: "الـ interstitium كله، والأورام"
        quote: "Drugs: Gentamycin, Phenacetin, NSAIDS, Cisplatinum, Methicellin,"
        text: |
          أدوية بتضرب الـ **tubulointerstitium** كله: gentamicin، phenacetin، **NSAIDs**، cisplatin، **methicillin**، rifampicin، allopurinol، diuretics.

          النتيجة: ==AKI== (acute TIN) أو **CKD** (chronic TIN)، مع نقص امتصاص الـ Na وعدم تركيز البول.

          والكتاب بيحط كمان **malignancy**: transitional cell carcinoma، hypernephroma، sarcoma، chorionepithelioma.
      - kind: try
        items: [neph.L10.003, neph.L10.006, neph.L10.009, neph.L10.015, neph.L10.018]
    recap:
      - "Interstitium = كل الكلية ما عدا الـ glomeruli."
      - "الأوعية: low RBF (ACEI، ARA، CysA، contrast، NSAIDs)، vasculitis (PAPS)، TMA (mithramycin، CysA)."
      - "Membranous: gold، penicillamine، captopril. Minimal change: NSAIDs، lithium، antibiotics."
      - "Proximal = Fanconi: aminoglycosides، amphotericin، cisplatin، Hg، Cd، outdated tetracyclines."
      - "Distal: ADH resistance (lithium) = nephrogenic DI، و dRTA I و IV."
    practice: [neph.L10.001, neph.L10.002, neph.L10.003, neph.L10.004, neph.L10.005, neph.L10.006, neph.L10.007, neph.L10.008, neph.L10.009, neph.L10.010, neph.L10.011, neph.L10.012, neph.L10.013, neph.L10.014, neph.L10.015, neph.L10.016, neph.L10.017, neph.L10.018, neph.L10.019, neph.L10.020, neph.L10.102]
