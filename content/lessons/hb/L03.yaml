      - kind: explain
        page: 54
        title: "الـ rescue: بالونة ولا stent؟"
        text: |
          - **10–15% do not respond.** والـ **rebleed** = **hematemesis > 2 hrs after therapy** أو **Hb drop > 3 g/dL**.
          - **Severe bleed → balloon tamponade as a bridge.** الـ side effects **15–20%**: **perforation، pneumonia، pain**.
          - استخدامها **بيقل** لأن فيه **high risk of rebleeding following deflation** و **major complications**.
          - **Expandable completely covered metallic stents**: نوعين (**nitinol أو plastic**)، **بتتركب من غير endoscopy**، بتعمل hemostasis بالـ **direct compression**، **seem safe**، و **oral intake can be offered afterwards**.
          - ومع ذلك البالونة **فعّالة مؤقتًا** في أغلب الحالات، ومكانها في الأماكن اللي **الـ TIPS مش متاح فيها**: بتكسب وقت لحد ما توصل للـ TIPS.
      - kind: sort
        page: 54
        prompt: "دي ميزة/عيب البالونة ولا الـ stent؟"
        bins: ["Balloon tamponade", "Covered metal stent"]
        cards:
          - { text: "Side effects 15–20%: perforation, pneumonia, pain", bin: 0 }
          - { text: "High rebleeding after deflation", bin: 0 }
          - { text: "Useful where TIPS is not available", bin: 0 }
          - { text: "Nitinol or plastic", bin: 1 }
          - { text: "Placed without endoscopy", bin: 1 }
          - { text: "Oral intake can be offered afterwards", bin: 1 }
        why: "الاتنين **bridge**. البالونة قديمة ومضاعفاتها كتير وبتنزف تاني لما تفضّيها، بس لسه مفيدة لو مفيش TIPS. الـ stent جديد، safe، ويسمح بالأكل."
      - kind: update
        page: 54
        text: "Baveno VII بيفضّل الـ **self-expanding metal stent** على الـ balloon tamponade كـ bridge في الـ refractory oesophageal variceal bleeding."
        ref: "Baveno VII consensus, 2021"
      - kind: figure
        page: 55
        title: "الـ TIPS: ماسورة جوه الكبد"
        alt: "Sketch of the liver. The portal vein enters from below and the hepatic vein leaves at the top into the inferior vena cava on the right, which goes up to the right heart. A metal stent runs inside the liver from a branch of the portal vein to the hepatic vein, so portal blood bypasses the sinusoids. Note: lower portal pressure, but gut blood reaches the brain without passing the liver, so hepatic encephalopathy is the main complication."
        caption: "الـ stent بيوصّل **intrahepatic portal vein** بالـ **hepatic vein**: **nonselective portocaval shunt**. الضغط بينزل، بس دم الأمعاء بيعدّي من غير ما الكبد ينضفه، فالـ **HE** هي المشكلة."
        svg: |
