  - id: git.L01.lesson3
    title: "الـ chronic gastritis: Sydney و type A و type B"
    hook: "تلات أنواع gastritis شبه بعض في المنظار، بس واحد منهم بيعمل B12 deficiency وواحد بيعمل cancer. هتفرّقهم من مكان الالتهاب."
    minutes: 9
    pages: [12, 15]
    topics: [gastritis, kyoto]
    goals:
      - "تعرّف الـ chronic gastritis وتعرف Sydney بيعمل إيه و OLGA بيعمل إيه"
      - "تفرّق بين autoimmune gastritis و multifocal atrophic gastritis من المكان والسبب"
      - "تعرف الـ Kyoto classification اتعملت ليه"
    status: unverified
    steps:
      - kind: explain
        page: 12
        quote: "Defined as the presence of chronic inflammatory mucosal changes leading eventually to mucosal atrophy and intestinal metaplasia in absence of erosions"
        title: "Chronic gastritis يعني إيه؟"
        text: |
          ==Chronic gastritis==: **chronic inflammatory mucosal changes** بتوصل في الآخر لـ **atrophy** و **intestinal metaplasia**، **من غير erosions**.

          الملمحين الأساسيين:
          - **Inflammatory cells** بتملا الـ lamina propria.
          - **Atrophy** في الـ glandular epithelium.

          ليه الالتهاب بيوصل لـ atrophy؟ التفسير المقبول (مش في الكتاب): الالتهاب لما يطوّل بيموّت الغدد أسرع ما بتتجدد، فتختفي (atrophy)، وأحيانًا الخلايا تتحول لشكل خلايا الأمعاء اللي بتستحمل أكتر (intestinal metaplasia). وده أول السلّم ناحية الـ cancer.
      - kind: explain
        page: 13
        quote: "In clinical practice, gastritis staging is done using the OLGA (Operative Link on Gastritis Assessment) staging system for reporting gastric histology."
        title: "Sydney بيصنّف، OLGA بيعمل staging"
        text: |
          - **Updated Sydney System**: بيصنّف ويعمل grading بدمج **topographical** و **morphological** و **etiological** information.
          - **OLGA** (Operative Link on Gastritis Assessment): بيعمل ==staging== بدمج **atrophy score** (من الـ biopsy) و **atrophy topography** (من الـ biopsy mapping).

          علشان كده في حالة الـ dyspepsia أخدوا biopsies من **antrum, incisura, fundus and body**: محتاجين خريطة.
      - kind: table
        page: 13
        quote: "Type of Gastritis | Etiology | Gastritis synonyms\nNon-atrophic | Helicobacter pylori; Other factors | Superficial; Diffuse antral gastritis (DAG); Chronic antral gastritis (CAG); Interstitial - follicular; Hypersecretory; Type B\nAtrophic: Autoimmune | Autoimmunity | Type A; Diffuse corporal; Pernicious anemia-associated\nAtrophic: Multifocal atrophic | Helicobacter pylori; Dietary; Environmental factors | Type B, type AB; Environmental; Metaplastic\nSpecial forms: Chemical | Chemical irritation; Bile; NSAIDs; Other agents | Reactive; Reflux; NSAID; Type C\nSpecial forms: Radiation | Radiation injury\nSpecial forms: Lymphocytic | Idiopathic? Immune mechanisms; Gluten; Drug (ticlopidine); Helicobacter pylori | Varioliform (endoscopic); Celiac disease-associated\nSpecial forms: Noninfectious granulomatous | Crohn's disease; Sarcoidosis; Granulomatosis with polyangiitis and other vasculitides; Foreign substances; Idiopathic | Isolated granulomatous\nSpecial forms: Eosinophilic | Food sensitivity; Other allergies | Allergic\nSpecial forms: Other infectious gastritides | Bacteria (other than Helicobacter pylori); Viruses; Fungi | Phlegmonous"
        title: "جدول Sydney: النوع والسبب"
        columns: ["Type", "Main etiology", "Also called"]
        rows:
          - ["Non-atrophic", "Helicobacter pylori", "Type B, diffuse antral"]
          - ["Atrophic autoimmune", "Autoimmunity", "Type A, pernicious anemia-associated"]
          - ["Multifocal atrophic", "H. pylori, dietary, environmental", "Type B, type AB, metaplastic"]
          - ["Chemical", "Bile, NSAIDs", "Reactive, type C"]
          - ["Lymphocytic", "Gluten, ticlopidine, H. pylori", "Celiac-associated, varioliform"]
          - ["Granulomatous", "Crohn's, sarcoidosis, vasculitis", "Isolated granulomatous"]
        hide: [[0, 1], [1, 1], [3, 1], [3, 2]]
      - kind: explain
        page: 14
        quote: "The inflammation is restricted to the corpus and fundus, sparing the antrum, which distinguishes AIG from other conditions leading to atrophic gastritis (such as Helicobacter pylori infection)."
        title: "Type A: المناعة بتضرب مصنع الحمض"
        text: |
          الـ ==autoimmune gastritis (AIG)== = chronic inflammatory disorder بيضرب الـ **oxyntic mucosa** (الجزء اللي بيفرز الحمض)، ويوصل لـ **progressive atrophy**.

          الالتهاب **محصور في الـ corpus والـ fundus** و ==sparing the antrum==، وده بالظبط اللي بيفرقه عن الـ H. pylori.

          ليه الـ antrum بيسلم؟ التفسير المقبول (مش في الكتاب): الهدف بتاع الـ antibodies موجود في الـ **parietal cells**، والـ parietal cells ساكنة في الـ corpus والـ fundus. الـ antrum فيه **G cells** بتعمل gastrin، فمفيش حاجة للمناعة تضربها هناك.
      - kind: sort
        page: 14
        quote: "The inflammation is restricted to the corpus and fundus, sparing the antrum, which distinguishes AIG from other conditions leading to atrophic gastritis (such as Helicobacter pylori infection)."
        prompt: "Autoimmune (type A) ولا multifocal atrophic (type B)؟"
        bins: ["Type A (autoimmune)", "Type B (multifocal atrophic)"]
        cards:
          - { text: "Corpus and fundus only, antrum spared", bin: 0 }
          - { text: "Anti-parietal cell antibodies", bin: 0 }
          - { text: "B12 deficiency, megaloblastic anemia", bin: 0 }
          - { text: "Hashimoto, type 1 DM, Addison, vitiligo", bin: 0 }
          - { text: "Mostly H. pylori", bin: 1 }
          - { text: "Starts in body and antrum, then spreads", bin: 1 }
          - { text: "Pepsinogen 1/2 ratio predicts extensive atrophy", bin: 1 }
        why: "الـ autoimmune gastritis (AIG) بيضرب الـ **oxyntic mucosa** بس (corpus و fundus) ويسيب الـ antrum، وده اللي بيفرقه عن الـ H. pylori. الـ multifocal atrophic gastritis (MAG) من H. pylori بيبدأ في الـ body والـ antrum وينتشر."
      - kind: reveal
        page: 14
        quote: "Parietal cells (oxyntic cells) have two main functions: HCL secretion and intrinsic factor (vitamin B12-binding glycoprotein) production."
        prompt: "ليه الـ autoimmune gastritis بيعمل megaloblastic anemia؟"
        answer: |
          الـ **parietal cells** بتعمل حاجتين: **HCl** و **intrinsic factor**.

          الـ **APCA** بتدمرها، فيقل الـ intrinsic factor (يعني B12 مش هيتمتص) ويقل الحمض (فالـ iron كمان امتصاصه بيقل). النتيجة **megaloblastic anemia**.

          وكمان **hyposplenism** (pitted RBCs أكتر من 4%) في **55%** منهم.
      - kind: explain
        page: 14
        quote: "Defective spleen function (hyposplenism), defined by a pitted RBC count of >4%, has been found in 55% of patients with AIG"
        title: "الطحال والغدد: AIG مش لوحده"
        text: |
          - **Hyposplenism** (pitted RBCs أكتر من **4%**) في ==55%== من مرضى الـ AIG.
          - مرتبط بـ **Hashimoto thyroiditis**، **type 1 DM**، **Addison**، و **vitiligo**.

          ليه الأمراض دي بتيجي مع بعض؟ التفسير المقبول (مش في الكتاب): نفس الاستعداد المناعي (autoimmune tendency) بيضرب أكتر من عضو. فلو عندك مريض Hashimoto وجاله B12 deficiency، فكّر في الـ AIG.
      - kind: figure
        page: 14
        title: "الـ AIG في المنظار"
        image: { file: git/L01-aig-endoscopy.webp, book: true }
        alt: "Book endoscopic photos: (a) gastric corpus with a clearly visible network of vessels over the lesser and greater curvature; (b) normal corpus with thick red folds and no visible vessels."
        caption: |
          **(a)** corpus الأوعية فيه **باينة جدًا** على الـ lesser والـ greater curvature، وده atrophy. **(b)** corpus طبيعي: folds حمرا تخينة ومفيش أوعية باينة.

          الأوعية بتبان لأن الغشاء **رق** بعد ما الغدد ماتت.
      - kind: explain
        page: 15
        quote: "Pepsinogen levels and pepsinogen 1/pepsinogen 2 ratio can predict extensive atrophic gastritis."
        title: "Type B: الـ H. pylori بيمشي في المعدة كلها"
        text: |
          الـ ==multifocal atrophic gastritis (MAG)== أو **type B**: التهاب طويل، **mostly H. pylori**، بيموّت الـ oxyntic mucosa بالتدريج، **يبدأ في الـ body والـ antrum** وبعدين **ينتشر في المعدة كلها**.

          والـ ==pepsinogen 1/pepsinogen 2 ratio== بيتنبأ بالـ extensive atrophy.

          ليه الـ ratio بالذات؟ التفسير المقبول (مش في الكتاب): الـ **pepsinogen 1** بيطلع أغلبه من غدد الـ corpus، والـ **pepsinogen 2** من المعدة كلها. لما الـ corpus يضمر، الـ 1 يقل والـ 2 يفضل، فالـ ratio ينزل. يعني تحليل دم بيقولك الـ atrophy واسعة ولا لأ.
      - kind: explain
        remind: [git.L01.061]
        page: 15
        quote: "Was developed with the aim of endoscopically diagnosing H. pylori infection and assessing the risk factors for gastric cancer"
        title: "Kyoto classification: اتعملت ليه؟"
        text: |
          الـ **Kyoto classification of gastritis** اتعملت سنة **2013** في Kyoto، في الـ **85th Congress of the Japan Gastroenterological Endoscopy Society**.

          هدفها حاجتين: ==endoscopically diagnosing H. pylori== و **assessing the risk factors for gastric cancer**.

          فيها **19 endoscopic finding**، منهم: atrophy، intestinal metaplasia، enlarged (tortuous) folds، nodularity، diffuse redness، regular arrangement of collecting venules (RAC)، map-like redness، xanthoma، fundic gland polyp، وغيرهم.

          ليه ده مفيد؟ لأن المنظار بقى بيدّيك تشخيص الـ H. pylori **وانت شايف**، قبل ما الـ biopsy ترجع.
      - kind: check
        page: 14
        quote: "The inflammation is restricted to the corpus and fundus, sparing the antrum, which distinguishes AIG from other conditions leading to atrophic gastritis (such as Helicobacter pylori infection)."
        question: "Atrophic gastritis that spares the antrum, with anti-parietal cell antibodies and B12 deficiency. Which type?"
        options:
          - "Autoimmune (type A)"
          - "Multifocal atrophic (type B)"
          - "Chemical (type C)"
          - "Lymphocytic gastritis"
        answer: 0
        why:
          - "صح: corpus و fundus بس، **sparing the antrum**، و APCA."
          - "الـ MAG بيبدأ في الـ body **والـ antrum**، فمش بيسيبه."
          - "الـ chemical من bile أو NSAIDs."
          - "الـ lymphocytic مع gluten أو ticlopidine أو H. pylori."
      - kind: try
        items: [git.L01.045, git.L01.051, git.L01.055, git.L01.058]
    recap:
      - "Chronic gastritis = inflammation ← atrophy و intestinal metaplasia، من غير erosions."
      - "Sydney بيصنّف (topography + morphology + etiology)؛ OLGA بيعمل staging."
      - "Type A: corpus/fundus، يسيب الـ antrum، APCA، B12، hyposplenism في 55%."
