schema: batna.content/v1
lecture: geri.L06
title: Thyroid diseases in the elderly
author: Prof. Marwa Ahmed Saad
book: { chapter: 7, pages: [91, 105] }
topics:
  - { id: aging, title: "Thyroid changes with age" }
  - { id: epidemiology, title: "Epidemiology" }
  - { id: hypo, title: "Hypothyroidism: definitions, causes and clinical picture" }
  - { id: hypo-treatment, title: "Hypothyroidism: who and how to treat" }
  - { id: hyper, title: "Hyperthyroidism: causes, T3/T4 toxicosis and clinical picture" }
  - { id: hyper-diagnosis, title: "Hyperthyroidism: diagnosis" }
  - { id: hyper-treatment, title: "Hyperthyroidism: management" }
  - { id: subclinical-hyper, title: "Subclinical hyperthyroidism" }
  - { id: storm, title: "Thyroid storm" }
items:
  # ---------- p91-93: aging ----------
  - id: geri.L06.001
    kind: card
    topic: aging
    front: What histological changes does the thyroid undergo with age?
    back: "Moderate atrophy with nonspecific changes: fibrosis, more interfollicular connective tissue, less colloid, and some lymphocytic infiltration."
    src: { page: 91, quote: "the thyroid gland undergoes moderate atrophy and develops nonspecific histo-pathologic abnormalities: fibrosis, increase interfollicular connective tissues" }
    status: unverified
  - id: geri.L06.002
    kind: cloze
    topic: aging
    text: Thyroid auto-antibodies reach up to {{c1::20%}} in women over 60 years, and thyroid hormones fall by about {{c2::30%}} with age.
    src: { page: 91, quote: "which reaching up to 20% in the women over 60 years. Thyroid hormones decrease by about 30%." }
    status: unverified
    tags: [numbers]
  - id: geri.L06.003
    kind: table
    topic: aging
    title: Gender-specific thyroid changes with ageing
    columns: [Sex, Free thyroid hormones, TSH]
    rows:
      - [Old men, Decrease, No change]
      - [Old women, No change, Increase]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 91, quote: "In the old women the free thyroid hormones do not change but the TSH" }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.004
    kind: card
    topic: aging
    front: What does serum TSH tell you about thyroid function?
    back: It is a sensitive marker; a raised TSH means reduced function and a low TSH means increased function.
    src: { page: 91, quote: "serum TSH is a sensitive marker of thyroid function, with increased values indicating a reduced function and vice versa." }
    status: unverified
  - id: geri.L06.005
    kind: card
    topic: aging
    front: Why does thyroid hormone production fall with ageing?
    back: Reduced iodine absorption and organification and a lower response to TSH.
    src: { page: 92, quote: "Aging is characterized by a reduced iodine absorption and organification and a lower response to TSH, leading to reduced thyroid hormone production." }
    status: unverified
  - id: geri.L06.006
    kind: card
    topic: aging
    front: What happens to the nocturnal TSH surge in the oldest old?
    back: It is partially or completely lost.
    src: { page: 92, quote: "in the oldest olds, the nocturnal surge of TSH is partially or completely lost." }
    status: unverified
  - id: geri.L06.007
    kind: cloze
    topic: aging
    text: Population studies show TSH rises with age; above 80 years the upper 95% limit is over {{c1::6.0}} mIU/L, reaching {{c2::8.0}} mIU/L in over-90s.
    src: { page: 92, quote: "in the population >80 years of age, the upper limit at the 95% interval of confidence was >6.0 mIU/L, reaching 8.0 mIU/L in over-90s." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L06.008
    kind: card
    topic: aging
    front: How were low TSH levels in centenarians first interpreted?
    back: As a centrally mediated way to avoid excessive catabolism and promote "physiological aging".
    src: { page: 92, quote: "centrally mediated way to avoid excessive catabolism and promote \"physiological aging.\"" }
    status: unverified
  - id: geri.L06.009
    kind: card
    topic: aging
    front: How does euthyroid sick syndrome differ from age-related low TSH?
    back: In euthyroid sick syndrome TSH and T3 are low and reverse T3 is high, as a response to acute and systemic disease.
    src: { page: 92, quote: "euthyroid sick syndrome\", where circulating levels of TSH and T3 are reduced, whereas reverse T3 is increased" }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.010
    kind: card
    topic: aging
    front: What did the Ashkenazi cohorts and the Rotterdam study show about TSH with age?
    back: "Large cohorts: TSH tends to rise with age, and extreme longevity goes with even higher TSH (Ashkenazi). Rotterdam (over 9000 healthy people) found the opposite: mean TSH fell while TPOAb rose with age."
    src: { page: 93, quote: "showing instead a progressive reduction of mean serum TSH and a concomitant rising of TPOAb values with increasing age" }
    status: unverified
  - id: geri.L06.011
    kind: enumerate
    topic: aging
    prompt: Enumerate the age changes in thyroid physiology that TSH alone may not reflect.
    points:
      - TSH bioactivity
      - Thyrocyte sensitivity to TSH
      - Thyroid hormone metabolism
      - Receptors and cofactors for T3
      - Reduced response to TRH
      - Reduced TSH circadian variation
      - Less iodine capture and T4 secretion
      - Reduced hormone clearance
    pass: 5
    src: { page: 93, quote: "the elderly presents a reduced response to TRH, as well as a reduced TSH circadian variation." }
    status: unverified
  - id: geri.L06.012
    kind: card
    topic: aging
    front: When may TSH variability in an older person reflect real thyroid disease rather than ageing?
    back: Especially when TPO and TBG antibody titres are positive.
    src: { page: 93, quote: "could be the expression of actual thyroid pathology, especially in the case of positive TΡΟ Ab and TBG Ab titters." }
    status: unverified
  - id: geri.L06.013
    kind: card
    topic: aging
    front: When is treating subclinical hypothyroidism in the elderly most debated?
    back: When the TSH rise is slight (under 10 mIU/L).
    src: { page: 93, quote: "treatment of subclinical hypothyroidism is still under debate, especially in the case of a slight serum TSH increase (<10 mIU/L)." }
    status: unverified
  # ---------- p93-94: epidemiology ----------
  - id: geri.L06.014
    kind: cloze
    topic: epidemiology
    text: In Egypt, primary hypothyroidism occurs in {{c1::10%}} of females and {{c2::2%}} of males above 60 years.
    src: { page: 93, quote: "In Egypt; the primary hypothyroidism occurs in 10% of the females and 2% of the males above 60 years." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L06.015
    kind: cloze
    topic: epidemiology
    text: "{{c1::10-15%}} of patients with hyperthyroidism are older than 60 years."
    src: { page: 94, quote: "10% to 15% of the patients with hyperthyroidism are older than 60 years." }
    status: unverified
    tags: [numbers]
  - id: geri.L06.016
    kind: cloze
    topic: epidemiology
    text: "NHANES III: overall hypothyroidism {{c1::4.6%}} ({{c2::0.3%}} overt, {{c3::4.3%}} subclinical); the most frequent thyroid disease in older people, commoner in women."
    src: { page: 94, quote: "the overall prevalence of hypothyroidism is 4.6%, with 0.3% for the overt and 4.3% for the subclinical type." }
    status: unverified
    tags: [numbers]
  - id: geri.L06.017
    kind: card
    topic: epidemiology
    front: What is the prevalence of hypothyroidism in iodine-sufficient countries, and in whom is it commoner?
    back: 1-2%, commoner in elderly women and higher in community-dwelling elders.
    src: { page: 94, quote: "In the countries with sufficient iodine, the prevalence of hypothyroidism is between 1-2%, and is more common in the elderly women." }
    status: unverified
  # ---------- p94-96: hypothyroidism ----------
  - id: geri.L06.018
    kind: table
    topic: hypo
    title: Overt vs subclinical hypothyroidism
    columns: [Type, TSH, FT3 and FT4]
    rows:
      - [Overt, Raised, Reduced]
      - [Subclinical, Raised, Normal]
    blanks: [[0, 2], [1, 2]]
    src: { page: 94, quote: "Subclinical hypothyroidism is characterized by increased TSH values with normal FT3 and FT4 values." }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.019
    kind: card
    topic: hypo
    front: What risks are associated with overt hypothyroidism?
    back: Increased global mortality and more cardiovascular events.
    src: { page: 94, quote: "Overt Hypothyroidism is associated with a global mortality increase and an increased incidence of cardiovascular events." }
    status: unverified
  - id: geri.L06.020
    kind: card
    topic: hypo
    front: How did the 2013 ETA guideline split subclinical hypothyroidism?
    back: Into two categories by TSH, 4-10 mIU/L and over 10 mIU/L.
    src: { page: 94, quote: "the 2013 European Thyroid Association guideline split sHT into two distinct categories, based on cutoffs of circulating TSH values" }
    status: unverified
  - id: geri.L06.021
    kind: card
    topic: hypo
    front: What is the most frequent cause of subclinical hypothyroidism in the elderly?
    back: Chronic autoimmune (Hashimoto) thyroiditis.
    src: { page: 95, quote: "Chronic autoimmune thyroiditis (Hashimoto thyroiditis) is the most frequent cause of subclinical hypothyroidism in the elderly." }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.022
    kind: enumerate
    topic: hypo
    prompt: Enumerate the drugs that cause iatrogenic hypothyroidism (reversible on withdrawal).
    points: [Methimazole, Propylthiouracil, Tyrosine-kinase inhibitors, Beta-blockers, Interferon-alpha, IL-2, Lithium]
    pass: 5
    src: { page: 95, quote: "Methimazole, Propylthiouracil, Tyrosin-kinase inhibitors, ẞ- blockers, Interferon-a, IL-2, lithium." }
    status: unverified
  - id: geri.L06.023
    kind: enumerate
    topic: hypo
    prompt: Enumerate the drugs that interfere with L-T4 absorption.
    points: [Bile acid sequestrants, Ferrous sulphate, Sucralfate, Calcium carbonate, Aluminium antacids, Phosphate binders, Raloxifene, Proton-pump inhibitors]
    pass: 6
    src: { page: 95, quote: "bile acid sequestrates, ferrous sulphate, sucralfate, calcium carbonate, aluminium-containing antacids, phosphate binders, raloxifene and proton-pump inhibitors" }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.024
    kind: card
    topic: hypo
    front: Name a procedural cause of hypothyroidism in the elderly.
    back: Thyroidectomy or radioiodine treatment with suboptimal L-T4 replacement.
    src: { page: 95, quote: "Secondary to surgical and medical procedures (thyroidectomy or radioiodine treatment) with suboptimal L-T4 replacement therapy." }
    status: unverified
  - id: geri.L06.025
    kind: card
    topic: hypo
    front: Which classic symptoms are hypothyroid patients 70 or older less likely to report than those under 50?
    back: Weight gain, muscle cramps and cold intolerance.
    src: { page: 95, quote: "Hypothyroid patients ≥70 years are significantly less likely to report weight gain, muscle cramps or cold intolerance" }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.026
    kind: enumerate
    topic: hypo
    prompt: Enumerate the non-specific geriatric syndromes with which hypothyroidism may present.
    points: [Confusion, Anorexia, Weight loss, Falling, Incontinence, Decreased mobility, Arthralgias and muscle aches]
    pass: 5
    src: { page: 95, quote: "Confusion, anorexia, weight loss, falling, incontinence, and decreased mobility, arthralgias and muscular aches." }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.027
    kind: card
    topic: hypo
    front: Where can noninflammatory effusions occur in hypothyroidism?
    back: Joints, and the pleural, pericardial and peritoneal cavities.
    src: { page: 96, quote: "noninflammatory effusions may occur in the joints and in pleural, pericardial, and peritoneal cavities." }
    status: unverified
  - id: geri.L06.028
    kind: card
    topic: hypo
    front: Which cardiac diseases are linked with hypothyroidism, and what did the Cardiovascular Health Study find in people over 65?
    back: "More IHD and heart failure. In the CHS, those over 65 with subclinical or overt hypothyroidism did not have worse risk factors (BMI, LDL, hypertension, DM)."
    src: { page: 96, quote: "Hypothyroidism is associated with increase incidence of IHD and heart failure." }
    status: unverified
  - id: geri.L06.029
    kind: card
    topic: hypo
    front: What is "myxoedema madness"?
    back: Confusion, disorientation and psychosis occasionally accompanying profound hypothyroidism.
    src: { page: 96, quote: "Myxoedema madness'; confusion, disorientation and psychosis that was observed to occasionally accompany profound hypothyroidism." }
    status: unverified
  - id: geri.L06.030
    kind: card
    topic: hypo
    front: Is hypothyroid cognitive impairment fully reversible with treatment?
    back: "Not proven. Though classed as a 'reversible dementia', evidence lacks for complete resolution of deficits, and two large RCTs (incl. the Birmingham elderly thyroid study) showed no cognitive gain with treatment."
    src: { page: 96, quote: "there is a lack of evidence to show that there is complete resolution of neurocognitive deficits following treatment of hypothyroidism." }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.031
    kind: card
    topic: hypo
    front: What did the PAQUID survey link raised TSH with in people 65 and older?
    back: Symptoms of depression, but not impaired cognitive function.
    src: { page: 97, quote: "increased TSH levels were significantly linked with the presence of symptoms of depression but not with impairment of cognitive function." }
    status: unverified
  - id: geri.L06.032
    kind: card
    topic: hypo
    front: How does a large powered study describe the link between depression, dementia and thyroid dysfunction in the elderly?
    back: Coincidental rather than causal.
    src: { page: 97, quote: "the relationship appears coincidental rather than causal." }
    status: unverified
  - id: geri.L06.033
    kind: card
    topic: hypo
    front: Is overt hypothyroidism clearly linked with reduced mobility or frailty?
    back: No, there is little evidence.
    src: { page: 97, quote: "There is little evidence to clearly link overt hypothyroidism with reduced mobility or increased frailty." }
    status: unverified
  # ---------- p97-100: treatment ----------
  - id: geri.L06.034
    kind: card
    topic: hypo-treatment
    front: Are minor TSH elevations in older people linked with poor outcomes?
    back: No. They are not associated with impaired quality of life, symptoms, cognition, cardiovascular events or mortality, and treating mild subclinical hypothyroidism may not help.
    src: { page: 97, quote: "minor TSH elevations are NOT associated with important outcomes such as impaired quality of life, symptoms, cognition, cardiovascular events and mortality" }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.035
    kind: card
    topic: hypo-treatment
    front: Why is the levothyroxine dose that normalises TSH lower in older patients?
    back: Thyroxine turnover falls with the age-related loss of lean body mass.
    src: { page: 97, quote: "The dose of levothyroxine that normalises serum TSH level is lower in older patients due to changes in thyroxine turnover" }
    status: unverified
  - id: geri.L06.036
    kind: card
    topic: hypo-treatment
    front: Which side effects of thyroid hormone excess are the elderly more susceptible to?
    back: AF and osteoporotic fractures.
    src: { page: 98, quote: "The elderly are more susceptible to the side effects of thyroid hormone excess such as AF, and osteoporotic fractures." }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.037
    kind: card
    topic: hypo-treatment
    front: What did the trial of 737 people over 65 with subclinical hypothyroidism show?
    back: Low-dose levothyroxine gave no significant improvement in the ThyPRO quality-of-life score, so a higher TSH target (6-7 mU/L) is reasonable above 70-80 years, especially with arrhythmia or fracture risk.
    src: { page: 98, quote: "demonstrated no significant improvement in the 100-point ThyPRO score" }
    status: unverified
  - id: geri.L06.038
    kind: card
    topic: hypo-treatment
    front: What should a newly diagnosed hypothyroid patient be told about levothyroxine?
    back: It must be maintained for life; repeat this at follow-up at least once a year.
    src: { page: 98, quote: "treatment with levothyroxine must be maintained for life." }
    status: unverified
  - id: geri.L06.039
    kind: table
    topic: hypo-treatment
    title: Treatment strategy for subclinical hypothyroidism by TSH and age
    columns: [Serum TSH, 65-75 years, Over 75 years]
    rows:
      - [Over 10 mIU/L, Treat, Treat / observe]
      - [6-10 mIU/L, Observe / treat, Observe / treat]
      - [4-6 mIU/L, Observe / treat, Observe]
    blanks: [[0, 1], [0, 2], [2, 2]]
    src: { page: 98, quote: "Treatment strategy" }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.040
    kind: card
    topic: hypo-treatment
    front: How should a raised TSH be confirmed before treating?
    back: By at least a second measurement at 3-6 months.
    src: { page: 98, quote: "Elevation of serum TSH value should be confirmed by at least a second measurement at 3- to 6-mo follow-up." }
    status: unverified
  - id: geri.L06.041
    kind: cloze
    topic: hypo-treatment
    text: "Treatment table footnote: L-T4 starts at {{c1::0.3-0.4}} µg/kg/day, increased by 10-15% after 6-8 weeks; TSH target over 75 years is {{c2::2.5-3.5}} mIU/L."
    src: { page: 98, quote: "Optimal TSH target value for patients >75 y receiving L-T4 therapy: 2.5 to 3.5 mIU/L." }
    status: unverified
    tags: [numbers]
  - id: geri.L06.042
    kind: card
    topic: hypo-treatment
    front: Which factors favour treating ("treat") in the observe/treat boxes of the strategy table?
    back: "Positive antithyroid antibodies, hypothyroid symptoms, diseases that mild thyroid failure may worsen (e.g. HF), the patient's wish, or TSH rising progressively to 10 mIU/L or more."
    src: { page: 99, quote: "In the presence of positive antithyroid autoantibody titres, symptoms of hypothyroidism, concomitant diseases potentially impaired by mild thyroid failure" }
    status: unverified
  - id: geri.L06.043
    kind: card
    topic: hypo-treatment
    front: For whom is L-T4 replacement generally recommended?
    back: Older patients in good health with TSH over 10 mIU/L.
    src: { page: 99, quote: "L-T4 replacement therapy is recommended for older patients in good health status with serum TSH values >10 mIU/L." }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.044
    kind: card
    topic: hypo-treatment
    front: What is the approach to a frail patient with TSH over 10 mIU/L?
    back: More caution, whatever the age; a wait-and-see strategy.
    src: { page: 99, quote: "in frail patients with serum TSH levels >10 mIU/L, more caution is recommended regardless of the age, and a wait-and-see strategy is recommended." }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.045
    kind: card
    topic: hypo-treatment
    front: Fit patient, TSH 6-10 mIU/L. What does the lecture advise?
    back: "If risk factors for progression (women, positive antibodies), consider a low-dose L-T4 trial; otherwise monitor thyroid function every 3-6 months and treat if TSH rises to 10 or more."
    src: { page: 99, quote: "the possibility of a low-dose L-T4 replacement trial could be considered; otherwise, close monitoring of thyroid function every 3 to 6 months is recommended" }
    status: unverified
  - id: geri.L06.046
    kind: cloze
    topic: hypo-treatment
    text: "Usual L-T4 starting dose in the elderly: {{c1::25}} µg/day without cardiac disease, {{c2::12.5}} µg/day with cardiac comorbidity; increase by {{c3::12.5-25}} µg every 4 weeks."
    src: { page: 99, quote: "Usual starting doses in elderly patients without cardiac morbidities is 25 mg/day and with cardiac comorbidities is 12.5 ug/day." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L06.047
    kind: card
    topic: hypo-treatment
    front: A treated elderly patient has a slightly high TSH with normal free T4. Increase the dose?
    back: No. TSH may take longer to normalise in the elderly (long latent period before diagnosis); a slight TSH elevation with normal FT4 is not an indication to increase.
    src: { page: 99, quote: "a slight elevation in TSH with normal free T4 is not an indication of increasing the dose of thyroxin." }
    status: unverified
  - id: geri.L06.048
    kind: card
    topic: hypo-treatment
    front: What if the patient becomes cardiac unstable on thyroid replacement?
    back: Withhold thyroid hormone for a few days or weeks and restart once stable.
    src: { page: 100, quote: "thyroid hormones can be withheld for a few days or weeks and replacement can be restarted once stable." }
    status: unverified
  # ---------- p100-102: hyperthyroidism ----------
  - id: geri.L06.049
    kind: card
    topic: hyper
    front: What is the most common cause of hyperthyroidism in all ages, and which cause rises with age?
    back: Graves' disease is commonest at all ages; toxic multinodular goitre rises with age, especially where iodine intake is low.
    src: { page: 100, quote: "Graves' disease is the most common cause of hyperthyroidism in all age groups, but the incidence of toxic multinodular goitre increases with age" }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.050
    kind: card
    topic: hyper
    front: What is the Jod-Basedow phenomenon and why is it commoner in the elderly?
    back: Iodine-induced thyrotoxicosis, commoner because of iodine-containing drugs (amiodarone, mucolytics) and radiocontrast dyes.
    src: { page: 100, quote: "Iodine-induced thyrotoxicosis (Jod-Basedow disease) is of a higher incidence in the elderly due to iodine- containing drugs like amiodarone" }
    status: unverified
  - id: geri.L06.051
    kind: card
    topic: hyper
    front: Which two thyroid diseases does amiodarone cause?
    back: Multinodular goitre and destructive thyroiditis.
    src: { page: 100, quote: "Amiodarone causes two types of thyroid disease; multinodular goitre and destructive thyroiditis." }
    status: unverified
  - id: geri.L06.052
    kind: card
    topic: hyper
    front: Why doesn't stopping amiodarone quickly cure amiodarone-induced thyrotoxicosis?
    back: The drug's long half-life; stopping may also not be feasible because of the cardiac disease. Severe forms may need high-dose glucocorticoids, antithyroid drugs or surgery.
    src: { page: 100, quote: "Discontinuation of amiodarone will not immediately improve the condition due to the prolonged T½ of the drug" }
    status: unverified
  - id: geri.L06.053
    kind: card
    topic: hyper
    front: Define T3 toxicosis, its cause and frequency in the elderly.
    back: Isolated raised T3 with suppressed TSH, from excess T3 secretion by a solitary toxic nodule or toxic MNG; up to 10% of elderly thyrotoxic patients, almost entirely in the elderly.
    src: { page: 101, quote: "T3 toxicosis is an isolated elevation of T3 with suppressed TSH, which is seen in up to 10% of the elderly thyrotoxic patients." }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.054
    kind: card
    topic: hyper
    front: Explain T4 toxicosis.
    back: Isolated raised T4 in elderly hyperthyroid patients with nonthyroidal illness, which inhibits 5'-deiodinase so T3 is normal or low.
    src: { page: 101, quote: "This is due to the inhibition of 5' deiodinase by the non-thyroid illness leading to normal or low T3." }
    status: unverified
  - id: geri.L06.055
    kind: card
    topic: hyper
    front: What is apathetic thyrotoxicosis?
    back: Elderly hyperthyroidism presenting with depression, lethargy and weight loss instead of the classic hyperadrenergic picture.
    src: { page: 101, quote: "The term \"apathetic thyrotoxicosis\" is used to describe the symptoms of elderly hyperthyroidism who present with depression, lethargy and weight loss." }
    status: unverified
    tags: [high-yield]
  - id: geri.L06.056
    kind: enumerate
    topic: hyper
    prompt: Enumerate the presentations of hyperthyroidism in the elderly.
    points:
      - "Apathetic thyrotoxicosis: depression, lethargy, weight loss"
      - "Thyrotoxic encephalopathy: agitation, confusion"
      - Anorexia and weight loss mistaken for malignancy
      - Worse postmenopausal osteoporosis
      - AF with slow ventricular rate (up to 20%)
      - Angina or heart failure
      - Fatigue, weakness, dementia, myopathy
    pass: 5
    src: { page: 101, quote: "Most thyrotoxic patients have decreased appetite and weight loss and may be mistaken for an underlying malignancy." }
    status: unverified
  - id: geri.L06.057
    kind: cloze
    topic: hyper
    text: Atrial fibrillation with a {{c1::slow}} ventricular rate is seen in up to {{c2::20%}} of hyperthyroid patients.
    src: { page: 101, quote: "Atrial fibrillation with a slow ventricular rate is seen in up to 20% of the hyperthyroid patients." }
    status: unverified
    tags: [numbers]
  - id: geri.L06.058
    kind: card
    topic: hyper
    front: How does Graves' ophthalmopathy behave in the elderly?
    back: Less frequent, but when present more severe than in the young and often hard to manage.
    src: { page: 102, quote: "Graves' ophthalmopathy is less frequently seen in the elderly patients, when present, it is more severe than in the young" }
    status: unverified
  # ---------- p102: diagnosis ----------
  - id: geri.L06.059
    kind: card
    topic: hyper-diagnosis
    front: How useful is palpating the thyroid in elderly hyperthyroidism?
    back: Less useful; the gland is often impalpable. If palpable, diffuse enlargement suggests Graves' and a large nodular gland suggests toxic MNG.
    src: { page: 102, quote: "If palpable, a diffusely enlarged gland suggests Graves' disease and a large nodular gland suggests toxic multinodular goitre." }
    status: unverified
  - id: geri.L06.060
    kind: card
    topic: hyper-diagnosis
    front: Suppressed TSH with normal free T4. Next test?
    back: Free T3, to rule out T3 toxicosis.
