            <text x="60" y="293" class="t-sm">lytic lesions, high calcium</text>
          </svg>
      - kind: explain
        page: 178
        quote: "Proposed osteoclast-activating factors include lymphotoxin, TNF-α, hepatocyte growth factor, IL-6, IL-1, metalloproteinases 1, 2, 9, RANKL, insulin-like growth factor binding protein 4 (IGF4) and macrophage inflammatory protein-1α"
        title: "الـ osteoclast-activating factors"
        text: |
          الكتاب بيعدّ **osteoclast-activating factors**: lymphotoxin، **TNF-α**، hepatocyte growth factor، **IL-6**، **IL-1**، metalloproteinases 1 و 2 و 9، ==RANKL==، IGF binding protein 4، و **MIP-1α**. ومستوى **RANKL/OPGL** بيتغيّر.

          التفسير المقبول (مش في الكتاب) لأهمهم: الـ **RANKL** هو الزرار اللي بيشغّل الـ osteoclast، والـ **osteoprotegerin** هو اللي بيطفيه. الـ myeloma بيزوّد الـ RANKL ويقلّل الـ osteoprotegerin، فالـ osteoclasts تفضل شغالة. وده نفس الزرار اللي الـ **denosumab** (RANKL inhibitor) بيقفله في جدول العلاج (ص 186).
      - kind: reveal
        page: 178
        quote: "The levels of RANKL/osteoprotegrin ligand (OPGL),"
        prompt: "في الـ osteoporosis العادية العضم بيتهد ويتبني. ليه في الـ myeloma بيتهد بس، والـ lesion بتفضل «مخرومة»؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ myeloma **بيشغّل الـ osteoclasts** (الهدم) عن طريق الـ RANKL والـ factors اللي فاتت وفي نفس الوقت **بيكتم الـ osteoblasts** (البناء). فالحفرة بتتعمل وما حدش بيملاها، وتطلع **punched-out** في الأشعة.

          ودي بتشرح معلومتين في الكتاب هتشوفهم في التحاليل: الـ **alkaline phosphatase** (بتاع الـ osteoblasts) بيبقى ==usually normal==، والـ X-ray بيبيّن **lytic lesions** مش sclerosis.
      - kind: explain
        page: 178
        quote: "Abnormalities of 14 q (the location of IgH) (most common). Specific chromosome changes involve 14q32 in the majority of cases"
        title: "الـ chromosome"
        text: |
          أشهر cytogenetic abnormality في ==14q==، مكان الـ **immunoglobulin heavy chain (IgH)** gene، وتحديدًا **14q32** في معظم الحالات.

          منطقي: الخلية دي بتعمل immunoglobulin، فالـ translocation بيحصل جنب الجين اللي شغّال طول الوقت.
      - kind: try
        items: [hem.L11.015, hem.L11.016, hem.L11.017, hem.L11.021, hem.L11.022]
    recap:
      - "السبب largely unknown؛ أقوى risk factor: radiation قبلها بـ 10–15 سنة. benzene possible. familial established."
      - "أمراض قبله: PM/DM، SSc، AIHA، pernicious anaemia، AS؛ الـ RA مختلف عليه."
      - "Adhesion molecules ← النخاع؛ الـ stroma بتفرز IL-6 = وقود ومقاومة للعلاج."
      - "RANKL ↑ وأصحابه بيشغلوا الـ osteoclasts؛ الـ osteoblasts مكتومة (تفسير مقبول) ← lytic و ALP طبيعي."
      - "14q32 (IgH) أشهر cytogenetic abnormality."
    practice: [hem.L11.015, hem.L11.016, hem.L11.017, hem.L11.018, hem.L11.019, hem.L11.020, hem.L11.021, hem.L11.022]
