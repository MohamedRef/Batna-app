  - id: hem.L07.lesson3
    title: "العيان جالك: شكله إيه وهتشخصه إزاي؟"
    hook: "أنيميا وحرارة ونزيف في نفس الوقت؟ النخاع بيستغيث."
    minutes: 9
    pages: [109, 111]
    topics: [clinical, lab, ddx, supportive]
    goals:
      - "تربط كل عرض بـ marrow failure أو infiltration"
      - "تحفظ أرقام الـ lab وطريقة التشخيص والـ DD"
      - "تعدّ الـ supportive measures"
    status: unverified
    steps:
      - kind: explain
        page: 109
        title: "مصدرين لكل الأعراض"
        quote: "result from decreased normal marrow function and invasion of normal organs by leukemic blasts"
        text: |
          كل أعراض الـ acute leukemia جاية من حاجتين:
          1. ==Marrow failure==: النخاع مش بيعمل خلايا طبيعية.
          2. ==Infiltration==: الـ blasts بتغزو الأعضاء.
      - kind: figure
        page: 109
        quote: "Anemia is present at diagnosis in most patients, causing fatigue, pallor and headache."
        title: "تلات خطوط مقطوعة"
        alt: "A marrow box at the top with three arrows down to three boxes: low red cells giving fatigue, pallor and headache; low platelets giving petechiae, ecchymoses, gum bleeding and epistaxis; low granulocytes giving serious infections."
        caption: "كل سلالة بتقع بتدي عرض: ==anemia== تعب، thrombocytopenia نزيف، granulocytopenia infection."
        svg: |
          <svg viewBox="0 0 330 270" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L07b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head-bad"/></marker></defs>
            <rect x="85" y="10" width="160" height="40" rx="10" class="fg-bad"/>
            <text x="165" y="35" text-anchor="middle" class="t-sm t-b">Marrow full of blasts</text>
            <path d="M120 50 L60 90" class="fg-arrow-bad" marker-end="url(#L07b)"/>
            <path d="M165 50 L165 90" class="fg-arrow-bad" marker-end="url(#L07b)"/>
            <path d="M210 50 L270 90" class="fg-arrow-bad" marker-end="url(#L07b)"/>
            <rect x="10" y="95" width="100" height="40" rx="8" class="fg-box"/>
            <text x="60" y="120" text-anchor="middle" class="t-sm t-b">↓ RBC</text>
            <rect x="115" y="95" width="100" height="40" rx="8" class="fg-box"/>
            <text x="165" y="120" text-anchor="middle" class="t-sm t-b">↓ Platelets</text>
            <rect x="220" y="95" width="100" height="40" rx="8" class="fg-box"/>
            <text x="270" y="120" text-anchor="middle" class="t-sm t-b">↓ Granulocytes</text>
            <text x="60" y="160" text-anchor="middle" class="t-sm">Fatigue</text>
            <text x="60" y="178" text-anchor="middle" class="t-sm">Pallor</text>
            <text x="60" y="196" text-anchor="middle" class="t-sm">Headache</text>
            <text x="165" y="160" text-anchor="middle" class="t-sm">Petechiae</text>
            <text x="165" y="178" text-anchor="middle" class="t-sm">Ecchymoses</text>
            <text x="165" y="196" text-anchor="middle" class="t-sm">Gum bleeding</text>
            <text x="165" y="214" text-anchor="middle" class="t-sm">Epistaxis</text>
            <text x="270" y="160" text-anchor="middle" class="t-sm">Serious</text>
            <text x="270" y="178" text-anchor="middle" class="t-sm">infections</text>
            <text x="165" y="255" text-anchor="middle" class="t-sm t-mut">platelets often below 20,000/µL</text>
          </svg>
      - kind: explain
        page: 110
        title: "الـ infiltration: ALL أشطر"
        quote: "ALL tends to infiltrate normal organs more often than AML."
        text: |
          الـ ==ALL== بتـ infiltrate الأعضاء **أكتر من AML**:
          - **Lymph nodes** و **liver** و **spleen** كبار وقت التشخيص.
          - **Bone pain**: من infiltration الـ **periosteum** أو تمدد الـ **medullary cavity**، خصوصًا في الأطفال.
          - **Leukemic meningitis** (leptomeninges): headache، nausea، **nerve palsies**، seizures.
      - kind: aside
        tone: trap
        page: 110
        quote: "particularly in children with ALL, in many of whom the original diagnosis was juvenile rheumatoid arthritis"
        text: "طفل عنده **ألم عضم ومفاصل** واتشخص ==juvenile rheumatoid arthritis==؟ اعمل CBC وبص على الـ film. كتير من أطفال الـ ALL اتشخصوا JRA الأول."
      - kind: reveal
        page: 110
        quote: "patients with acute promyelocytic leukemia (M3) commonly have subclincial or clinical DIC, coaused by tissue thromboplastins present in the leukemic cells."
        prompt: "ليه الـ APL (M3) بالذات بتجيب DIC؟"
        answer: |
          لأن الـ promyelocytes بتاعتها مليانة granules فيها ==tissue thromboplastins==.

          لما تتكسر بتطلّق الـ thromboplastin في الدم، فتشغّل الـ coagulation في كل حتة وتستهلك الـ platelets والـ factors: ==DIC== (subclinical أو clinical).
      - kind: table
        page: 110
        quote: "25% of patients having very high white counts (> 50,000 per dl), 50%, having WBCs between 5000 to 50,000"
        title: "الـ WBC وقت التشخيص"
        columns: [WBC per µL, Patients]
        rows:
          - [">50,000", "25%"]
          - ["5,000–50,000", "50%"]
          - ["<5,000", "25%"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: tip
        page: 110
        quote: "25% of patients having very high white counts (> 50,000 per dl), 50%, having WBCs between 5000 to 50,000"
        text: "**25 / 50 / 25**: ربع عالي، نص في النص، ربع واطي. يعني WBC طبيعي أو واطي **ما يستبعدش** leukemia. أغلبهم **granulocytopenic** مهما كان الـ total."
      - kind: explain
        page: 110
        title: "التشخيص والـ DD"
        quote: "The diagnosis of acute leukemia is generally established by BM aspiration and biopsy which are usually hypercllular and contain 20 to 100% blast cells."
        text: |
          - الـ **blasts** موجودة في الـ peripheral blood في أغلب الحالات.
          - التشخيص بـ ==BM aspiration and biopsy==: غالبًا **hypercellular** و **20–100% blasts**.
          - **Hyperuricemia** و **↑LDH** (خلايا بتتكسر كتير).

          الـ **DD**: **aplastic anemia** (نخاع hypoplastic ==من غير blasts==)، **MDS**، **leukemoid reaction** للـ infection، و **infectious mononucleosis** (بتشبه ALL).
      - kind: update
        page: 110
        quote: "The diagnosis of acute leukemia is generally established by BM aspiration and biopsy which are usually hypercllular and contain 20 to 100% blast cells."
        text: "الـ WHO 2022 لغى شرط الـ 20% blasts في معظم الـ AML اللي ليها genetic abnormality مميزة، والـ ICC 2022 خلاه 10%. في الامتحان: **20–100%** زي الكتاب."
        ref: "WHO Classification 5th ed. 2022; International Consensus Classification 2022"
      - kind: case
        page: 111
        quote: "Platlet transfusion for thrombocytopenia, over hydration and allopurinal in cases of hyperuricemia."
        stem: "A 50-year-old with new AML: Hb 6.8 g/dL, platelets 9,000/µL, temperature 39 °C, uric acid 11 mg/dL."
        steps:
          - question: "Which supportive set fits the book?"
            options:
              - "Packed RBCs, platelets, hydration + allopurinol, antibiotics"
              - "Packed RBCs only, then wait for chemotherapy"
              - "Heparin for everyone"
              - "Steroids for the fever"
            answer: 0
            why: "الكتاب: packed RBCs للأنيميا، platelets للـ thrombocytopenia، overhydration + allopurinol للـ hyperuricemia، و antibiotics للحرارة. الـ heparin بس لـ DIC في M3."
      - kind: try
        items: [hem.L07.044, hem.L07.047, hem.L07.049, hem.L07.053, hem.L07.058]
    recap:
      - "الأعراض = marrow failure (أنيميا، نزيف، infection) + infiltration."
      - "ALL بتـ infiltrate أكتر: nodes، liver، spleen، bone pain (فخ الـ JRA)، meningitis."
      - "M3 = DIC من tissue thromboplastins."
      - "WBC: 25% فوق 50,000، 50% بين 5,000 و50,000، 25% تحت 5,000. Marrow 20–100% blasts."
      - "Aplastic anemia: hypoplastic من غير blasts."
