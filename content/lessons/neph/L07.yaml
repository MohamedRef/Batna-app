      - "البداية في الولد: paresthesias وألم في الأطراف و pain crises؛ ESRD العقد 3–6؛ الموت MI أو stroke."
      - "الكلية: proteinuria خفيفة لمتوسطة من العقد التالت، oval fat bodies بـ Maltese cross، podocytes بـ vacuoles، zebra bodies على الـ EM. ستات لحد 10% ESRD."
      - "مرض أوعية: coronaries، LVH بدري، arrhythmias، vertebrobasilar، dementia. Autonomic: hypohidrosis، acral pain، motility."
