  - id: hem.L11.lesson2
    title: "الكابوريا: CRAB"
    hook: "عجوز جاي بوجع ضهر وأنيميا وكرياتينين عالي؟ ماتكتبش osteoporosis وتروّح. فكّر في الكابوريا."
    minutes: 9
    pages: [176, 180]
    topics: [clinical, diagnosis]
    goals:
      - "تحفظ الـ CRAB بالأرقام"
      - "تفهم ليه الكلية بتقع، وليه العدوى، وليه الـ radiculopathy"
      - "تقرا التحاليل: rouleaux، ESR، ALP، electrophoresis"
    status: unverified
    steps:
      - kind: explain
        page: 178
        quote: "The effects of dysproteinemia, bone marrow failure, and destruction of cortical bone"
        title: "تلات حاجات بتعمل كل الصورة"
        text: |
          كل أعراض الـ myeloma جاية من تلات حاجات:

          - **Dysproteinemia**: البروتين الغلط (كلية، viscosity، مناعة).
          - **Bone marrow failure**: أنيميا ونقص platelets.
          - ==Destruction of cortical bone==: وجع وكسور و calcium.
      - kind: mnemonic
        page: 176
        quote: "C: Calcium elevation (> 11 mg/dL or > 1 mg/dL higher than ULN)"
        word: "CRAB"
        parts:
          - { key: "C", text: "Calcium > 11 mg/dL (or > 1 above ULN)" }
          - { key: "R", text: "Renal: CrCl < 40 mL/min or creatinine > 2 mg/dL" }
          - { key: "A", text: "Anaemia: Hb < 10 g/dL or 2 g/dL below normal" }
          - { key: "B", text: "Bone: ≥ 1 lytic lesion on X-ray, CT or PET/CT" }
        hook: "الكابوريا بتمشي بالعرض وبتقرص في العضم والكلية والدم."
      - kind: figure
        page: 176
        quote: "R: Renal insufficiency (creatinine clearance < 40 mL/min or serum creatinine > 2 mg/dL)"
        title: "الكابوريا بالأرقام"
        alt: "A crab drawn with four legs, each labelled: C calcium over 11 mg/dL, R creatinine clearance under 40 or creatinine over 2, A haemoglobin under 10, B one or more lytic lesions."
        caption: "تخيل الكابوريا ماسكة في كل رجل رقم: 11، 40 أو 2، 10، و lesion واحدة كفاية."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="165" cy="120" rx="70" ry="45" class="fg-bad"/>
            <circle cx="140" cy="88" r="7" class="fg-dot-bad"/>
            <circle cx="190" cy="88" r="7" class="fg-dot-bad"/>
            <text x="138" y="128" class="t-lg t-b">CRAB</text>
            <path d="M100 100L50 60" class="fg-ink"/>
            <path d="M230 100L280 60" class="fg-ink"/>
            <path d="M100 145L50 185" class="fg-ink"/>
            <path d="M230 145L280 185" class="fg-ink"/>
            <rect x="5" y="20" width="110" height="40" rx="6" class="fg-box"/>
            <text x="12" y="37" class="t-sm t-b">C: Ca &gt; 11</text>
            <text x="12" y="53" class="t-sm t-mut">or &gt; 1 above ULN</text>
            <rect x="215" y="20" width="110" height="40" rx="6" class="fg-box"/>
            <text x="222" y="37" class="t-sm t-b">R: CrCl &lt; 40</text>
            <text x="222" y="53" class="t-sm t-mut">or Cr &gt; 2 mg/dL</text>
            <rect x="5" y="185" width="110" height="40" rx="6" class="fg-box"/>
            <text x="12" y="202" class="t-sm t-b">A: Hb &lt; 10</text>
            <text x="12" y="218" class="t-sm t-mut">or 2 below normal</text>
            <rect x="215" y="185" width="110" height="40" rx="6" class="fg-box"/>
            <text x="222" y="202" class="t-sm t-b">B: ≥ 1 lytic</text>
            <text x="222" y="218" class="t-sm t-mut">X-ray, CT, PET/CT</text>
          </svg>
      - kind: explain
        page: 178
        quote: "In the back or chest In more than two thirds of patients. Usually worsened by movement"
        title: "B: العضم"
        text: |
          - ==Bone pain== في **الضهر أو الصدر** (back or chest)، عند **أكتر من تلتين** المرضى، و**بيزيد مع الحركة**.
          - Pathological fracture، و vertebral compression fractures بتعمل **kyphosis** ونقص في الطول.
          - **A**: الـ **pallor** أشهر علامة في الكشف، ومعاها weakness و fatigue.
      - kind: explain
        page: 179
        quote: "results from impairment of antibody response, reduction of normal immunoglobulins (immune paresis), neutropenia, and treatment with glucocorticoids"
        title: "الحرارة: ليه العدوى؟"
        text: |
          المفارقة: الـ immunoglobulin عالي جدًا، بس المريض ==immune paresis==. الـ clone واخد المكان، والـ antibodies الطبيعية قليلة.

          - أشهر حاجة: **upper respiratory tract و sinus infections**.
          - الـ **encapsulated organisms** (زي Streptococcus pneumoniae) بتغلب، لأن الـ capsule محتاجة antibodies علشان تتشال.
          - كمان neutropenia و glucocorticoids.
      - kind: check
        page: 179
        quote: "encapsulated organisms such as Streptococcus pneumoniae predominate"
        question: "Why do myeloma patients get pneumococcal infections despite a very high total immunoglobulin?"
        options: ["Normal polyclonal antibodies are reduced (immune paresis)", "The paraprotein attacks neutrophils", "Complement is consumed by amyloid", "T cells are destroyed by IL-6"]
        answer: 0
        why:
          - "صح: البروتين العالي كله من clone واحد، والـ antibodies الطبيعية قليلة."
          - "الـ paraprotein مش بيهاجم الـ neutrophils؛ الـ neutropenia من فشل النخاع."
          - "الكتاب مذكرش complement consumption."
          - "الـ IL-6 بيغذي الـ myeloma، مش بيقتل T cells."
      - kind: explain
        page: 179
        quote: "The major causes of renal failure are dehydration, and hypercalcemia, precipitated monoclonal light chains in the distal and collecting tubules."
        title: "R: الكلية"
        text: |
          الـ **myeloma kidney** (light-chain nephropathy). الأسباب الأساسية:

          - **Dehydration** و ==hypercalcemia==.
          - الـ **light chains** بتترسب في الـ ==distal and collecting tubules== وتسدها (casts).
          - **Hyperuricemia** بتساعد.
          - **Amyloidosis**: nephrotic syndrome أو renal insufficiency أو الاتنين.
          - **Acquired Fanconi's syndrome**.
      - kind: aside
        tone: trap
        page: 180
        quote: "Patients with light-chain (Bence Jones) and IgD myeloma have a higher incidence of renal failure, amyloidosis and greater light-chain protein excretion."
        text: "مين أكتر واحد بيبوّظ الكلية؟ الـ light-chain (Bence Jones) myeloma والـ IgD myeloma. أكتر light chains في البول = أكتر casts."
      - kind: explain
        page: 179
        quote: "Radiculopathy (the most frequent neurologic complication). It results from compression of the nerve by the expansion of the vertebral lesion"
        title: "الأعصاب والـ viscosity"
        text: |
          - ==Radiculopathy== أشهر neurologic complication: الـ vertebral lesion بتكبر أو العضمة بتقع وتضغط على العصب، غالبًا thoracic أو lumbosacral.
          - **Peripheral neuropathy** من الـ amyloidosis.
          - **Hyperviscosity** نادر جدًا: mental slowing، visual upset، purpura، haemorrhage. الكتاب بيقول مع IgA و IgG4.
      - kind: update
        page: 179
        quote: "Symptomatic hyperviscosity (mental slowing, visual upset, purpura, haemorrhage), in (IgA and IgG4)."
        text: "معظم المراجع بتقول IgG3 (مش IgG4) هو الـ subclass اللي بيعمل hyperviscosity، مع IgA و IgM. في الامتحان اكتب إجابة الكتاب: IgA و IgG4."
        ref: "Hoffbrand's Essential Haematology, 8th ed. (2019)"
      - kind: table
        page: 180
        quote: "Hypercalcemia in 30% of cases Serum alkaline phosphatase is usually normal."
        title: "التحاليل بالأرقام"
        columns: ["Test", "Result"]
        rows:
          - ["Anaemia", "Normocytic normochromic, 70%"]
          - ["Platelets", "Low in ~15%"]
          - ["Film / ESR", "Rouleaux; ESR almost always high"]
          - ["Calcium", "High in 30%"]
          - ["ALP", "Usually normal"]
          - ["Electrophoresis", "Peak in 80%"]
          - ["Marrow", "Plasma cells > 10%"]
        hide: [[0, 1], [3, 1], [4, 1], [5, 1], [6, 1]]
      - kind: reveal
        page: 180
        quote: "Serum alkaline phosphatase is usually normal."
        prompt: "عضم متآكل كله lytic lesions، والـ ALP طبيعي؟ إزاي؟"
        answer: "الـ ALP (alkaline phosphatase) بيطلع من الـ osteoblasts وهي بتبني. في الـ myeloma الشغل كله osteoclast (هدم) والـ osteoblasts مكبوتة، فمفيش بناء يرفع الـ ALP. (الكتاب ذكر المعلومة؛ السبب physiology معروفة.) ولنفس السبب الـ bone scan ممكن يطلع طبيعي."
      - kind: explain
        page: 180
        quote: "Conventional radiographs- punched-out lytic lesions, osteoporosis or fractures."
        title: "الأشعة"
        text: |
          - X-ray: ==punched-out lytic lesions==، osteoporosis أو كسور.
          - الأماكن: vertebrae، skull، thoracic cage، pelvis، proximal humeri و femora.
          - وجع عضم والأشعة سليمة؟ اعمل **CT أو MRI**.
      - kind: try
        items: [hem.L11.004, hem.L11.029, hem.L11.035, hem.L11.038, hem.L11.044]
    recap:
      - "CRAB: Ca > 11، CrCl < 40 أو Cr > 2، Hb < 10، ≥ 1 lytic lesion."
      - "وجع ضهر/صدر > تلتين المرضى، بيزيد بالحركة؛ pallor أشهر علامة."
      - "Immune paresis ← encapsulated organisms."
      - "الكلية: dehydration، hypercalcemia، light-chain casts في distal/collecting tubules."
      - "Radiculopathy أشهر neuro complication."
      - "Rouleaux، ESR عالي، Ca عالي 30%، ALP طبيعي، peak 80%، plasma cells > 10%."
    practice: [hem.L11.004, hem.L11.005, hem.L11.006, hem.L11.007, hem.L11.023, hem.L11.024, hem.L11.025, hem.L11.026, hem.L11.027, hem.L11.028, hem.L11.029, hem.L11.030, hem.L11.031, hem.L11.032, hem.L11.033, hem.L11.034, hem.L11.035, hem.L11.036, hem.L11.037, hem.L11.038, hem.L11.039, hem.L11.040, hem.L11.041, hem.L11.042, hem.L11.043, hem.L11.044, hem.L11.045, hem.L11.102, hem.L11.103, hem.L11.105, hem.L11.106, hem.L11.120]
