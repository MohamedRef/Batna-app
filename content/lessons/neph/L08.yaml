        page: 236
        quote: "Expansion of the specificity of anti-PLA2R antibody to include additional epitopes (epitope spreading) correlates with a worse prognosis.\nPatients with IgG4 antibody directed only at the cysteine-rich epitope of PLA2R have a higher rate of spontaneous remission.\nAnti-PLA2R levels go down in remission and return with relapse.\nElevated anti-PLA2R levels after treatment predict relapse.\nElevated anti-PLA2R levels at the time of transplantation predict recurrence (especially if DQA1*05:01/05 positive).\nDisappearance of anti-PLA2R antibodies (immunologic remission) precedes renal remission (disappearance of proteinuria) by weeks to months.\nPatients previously positive for anti-PLA2R/THSD7A who become negative will exhibit positive glomerular staining for weeks to months.\n>50% of cases of pediatric PMN are PLA2R-positive."
        text: |
          الـ anti-PLA2R زي **الدخان**، والـ proteinuria زي **الحريقة**. الدخان بيطلع قبل ما تشوف النار، وبيروح قبل ما الرماد يبرد.

          فلو الـ antibody راح، استنّى: الـ proteinuria هتنزل بعده بأسابيع لشهور.

          ليه التأخير ده؟ التفسير المقبول (مش في الكتاب): الـ deposits اللي قعدت تحت الـ podocyte لازم تتشال، والـ GBM لازم يتصلّح، والـ podocytes تفرد رجليها تاني. كل ده بياخد وقت بعد ما المصنع (الـ antibody) يقفل. يعني ما تزوّدش العلاج لمجرد إن الـ proteinuria لسه موجودة لو الـ antibody راح.
      - kind: explain
        page: 236
        title: "Epitope spreading والجدول"
        quote: "Expansion of the specificity of anti-PLA2R antibody to include additional epitopes (epitope spreading) correlates with a worse prognosis."
        text: |
          الكتاب بيكمّل الـ anti-PLA2R:
          - ==Epitope spreading== (الـ antibody بيمسك epitopes زيادة) = **prognosis أوحش**.
          - **IgG4** على الـ **cysteine-rich epitope** بس = ==spontaneous remission== أكتر.
          - الـ levels بتنزل مع الـ remission وترجع مع الـ relapse، و **أكتر من 50%** من الـ pediatric PMN بيبقوا PLA2R-positive.

          وجدول الـ **serum antibody** مع الـ **glomerular antigen**:
          - Serum **+** و tissue **+** = PLA2R-mediated **active**.
          - Serum **−** و tissue **+** = PLA2R-mediated **inactive** (عيانتنا).
          - نفس الكلام للـ **THSD7A**.
          - الاتنين **−** = **non-PLA2R/THSD7A-mediated**: غالبًا antibody تاني لسه ما اتعرفش.

          ليه الـ epitope spreading وحش؟ التفسير المقبول (مش في الكتاب): لما الجهاز المناعي يوسّع هجومه على أجزاء أكتر من نفس البروتين، يبقى الرد المناعي أقوى وأثبت، والـ deposits أكتر، فالمرض أصعب يهدى لوحده. وليه الـ tissue بيفضل موجب؟ لأن الـ deposits بتاخد شهور علشان تتشال، حتى بعد ما الـ antibody يختفي من الدم.

          ليه الـ epitope spreading مهم للعلاج؟ التفسير المقبول (مش في الكتاب): في الأول الـ antibody بيمسك حتة واحدة من الـ PLA2R. مع الوقت المناعة «بتتعلم» حتت تانية من نفس البروتين، فالـ antibodies بتزيد وبتنوّع، والمرض بيبقى أشرس وأصعب يتطفي. يعني العلاج **بدري** وهو لسه على epitope واحد أسهل، وده سبب إن الـ titer العالي بيحتاج IS أطول.
