  # ---------- essays (book questions) ----------
  - id: geri.L02.064
    kind: essay
    topic: overview
    prompt: What are the common renal disorders in the elderly?
    outline:
      - Age-related changes:
        - Glomeruli down 30–50%, sclerosis, fibrosis
        - GFR down about 10 ml per decade after 40
        - Impaired Na conservation, water excretion and concentration; reduced thirst
        - Low renin and aldosterone with hyperkalemia
      - CKD and ESRD:
        - ESRD rising, mostly in the aged
        - Higher risk with DM, CVD, hyperuricemia
        - Serum creatinine misleads; use CrCl (Cockcroft-Gault) or cystatin C
      - Drug-related kidney problems:
        - Longer half-life and toxicity of renally cleared drugs
        - Hyperkalemia with K-sparing diuretics, RAAS blockers, NSAIDs, BBs
      - Infections:
        - UTI very common; asymptomatic bacteriuria rarely treated
        - Catheter UTI (40% of nosocomial infections)
        - Prostatitis in men
    src: { page: 25, quote: "UTI is a very common problem in elderly." }
    status: unverified
    tags: [book-question]
  - id: geri.L02.065
    kind: essay
    topic: uti
    prompt: What is the management of recurrent UTI in the elderly?
    outline:
      - Confirm it is symptomatic UTI:
        - Do not treat asymptomatic bacteriuria unless a urinary procedure is planned
      - Look for and correct risk factors:
        - Stones, obstruction (stricture, BPH, neurogenic bladder)
        - Anticholinergic drugs
        - Vesicoureteric reflux, congenital anomalies, instrumentation
        - In women, prolapse, senile vaginitis and estrogen deficiency
      - Culture-guided treatment:
        - Know the likely organisms (E. coli in women, Enterococcus in men, Pseudomonas or Klebsiella after catheters, fungi)
        - Remove or replace catheters
      - Prevention (general practice, beyond the book):
        - Vaginal estrogen in postmenopausal women
        - Prophylactic antibiotics only for selected patients
    src: { page: 36, quote: "2- Stones: Persistant infection ± obstruction. 3- Obstruction: - Urethral strictures - SPH - Neurogenic bladder" }
    status: unverified
    tags: [book-question]
