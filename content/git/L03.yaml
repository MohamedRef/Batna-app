    src: { page: 128, quote: "C4. Functional abdominal bloating/distension\nDiagnostic criteria* - Must include both of the following:\n  1. Recurrent bloating and/or distension occurring on average at least 1 day/week; abdominal bloating and/or distension predominates over other symptoms.**\n  2. There are insufficient criteria for a diagnosis of irritable bowel syndrome, functional constipation, functional diarrhea, or post-prandial distress syndrome.\n*Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis\n**Mild pain related to bloating may be present as well as minor bowel movement abnormalities" }
