              - "56 kg"
              - "59.5 kg"
              - "63 kg"
              - "70 kg"
            answer: 0
            why: "اطرح **15%** للـ severe ascites + **5%** للـ bilateral pedal oedema = **20%**. يعني dry weight = 70 × 0.8 = 56 kg. (mild 5%, moderate 10%, severe 15%)."
          - question: "His dry-weight BMI is 56 ÷ 1.75² ≈ 18.3 kg/m². What is his malnutrition risk?"
