        text: |
          الـ osteoarthritis (OA) دلوقتي ==complex multifactorial joint pathology== سببها **inflammatory و metabolic factors**:
          - **Low-grade chronic synovitis**
          - مناعة **innate و adaptive**
          - **Neuroinflammation و central sensitization**: علشان كده الألم بيبقى chronic حتى لو المفصل «مش وحش أوي».
      - kind: figure
        page: 140
        quote: "When an imbalance exists in the structure or functioning of the extra cellular matrix of the cartilage, additional inflammatory mediators and mechanical stress create a \"vicious cycle\" of cartilage degeneration. Over time this \"low-grade\" inflammation and mechanical stress limit chondrocyte production of functional collagen (collagen type I), reduce space-occupying proteoglycans, and increase inflammatory mediators. While mechanical stress can occur over time and increase with age, there is likely an inherent age-associated change in the chondrocyte phenotype that also impairs cartilage homeostasis. This change leads to multiple molecular events and consequences (including altered gene expression related to senescence, DNA and telomere dysfunction, altered protein secretion, oxidative damage, decreased growth factor response, and apoptosis), precipitating cartilage destruction and susceptibility for osteoarthritis in the elderly."
