  - id: neph.L09.lesson3
    title: "امتى نغسل، وإيه اللي ممكن يحصل في الجلسة"
    hook: "عيان أول جلسة، كبير في السن، والـ BUN عالي. لو نضّفته بسرعة، مخه هيورم."
    minutes: 10
    pages: [299, 302]
    topics: [prescription, hd-complications]
    goals:
      - "تعرف دواعي الغسيل الكلوية وغير الكلوية والسموم اللي بتتغسل"
      - "تظبط أول جلسة (BUN ratio) والـ isolated UF مع الـ hyperkalaemia"
      - "تفهم الـ disequilibrium والـ intradialytic hypotension وليه بيحصلوا"
    status: unverified
    steps:
      - kind: explain
        page: 299
        title: "الـ prescription بيتفصّل"
        quote: "High-flux filters permit achievement of significant convective transport. Dialysis schedules are individually tailored: session length, Blood flow rate, Dialysis solution composition, Dialysate solution flow rate, Fluid removal orders, anticoagulation orders."
        text: |
          كل عيان ليه: مدة الجلسة، blood flow، تركيب المحلول، dialysate flow، كام هنسحب مية، والـ anticoagulation.

          بتفرق: **acute ولا chronic**، **أول جلسة**، الـ residual renal function، الأمراض التانية (hypotension، قلب، كبد)، والـ acid–base والـ electrolytes.

          أول جلسات الـ acute أو لو خطر الـ disequilibrium عالي: الـ ==post/pre blood urea nitrogen (BUN) ratio 0.65–0.75== (يعني ما تنزّلش الـ urea أكتر من 25–35%).

          ليه الـ 0.65–0.75 بالذات؟ التفسير المقبول (مش في الكتاب): الرقم معناه إنك تنزّل الـ urea **25–35% بس** في الجلسة الأولى. لو نزّلت 70% مرة واحدة، الدم يبقى نضيف والمخ لسه مليان urea، والمية تجري على المخ. فالجلسات الأولى قصيرة و blood flow أقل، وبعد كام جلسة الجسم يتعود ونزوّد. وليه الـ residual function بتفرق؟ لأن العيان اللي لسه بيطلّع بول محتاج جرعة أقل، وده أساس الـ incremental dialysis.
      - kind: mnemonic
        page: 300
        quote: "Electrolyte abnormalities not responding to medical treatment"
        word: "AEIOU"
        parts:
          - { key: "A", text: "Acidosis not responding (or with oliguria/anuria)" }
          - { key: "E", text: "Electrolytes: hyperkalaemia, hyponatraemia, hyperphosphataemia" }
          - { key: "I", text: "Intoxication: dialysable drugs and toxins" }
          - { key: "O", text: "Overload of volume not responding" }
          - { key: "U", text: "Uraemia: encephalopathy, pericarditis" }
        hook: |
          دواعي الغسيل = **AEIOU**. وزوّد عليهم من الكتاب: ESRD بأعراض أو malnutrition، و AKI مستمر أو بيزيد.
