  - id: geri.L06.lesson3
    title: "نعالج ولا نستنى؟ TSH والسن والـ frailty"
    hook: "الـ levothyroxine حباية صغيرة، بس الجرعة الزيادة عند الكبير = AF وكسور. علشان كده الكتاب بيقول: هدّي."
    minutes: 9
    pages: [97, 100]
    topics: [hypo-treatment]
    goals:
      - "تعرف إمتى الـ TSH العالي شوية مش محتاج علاج"
      - "تقرا جدول الـ treatment strategy بالسن"
      - "تكتب جرعة البداية والزيادة والـ target"
    status: unverified
    steps:
      - kind: explain
        page: 97
        quote: "minor TSH elevations are NOT associated with important outcomes such as impaired quality of life, symptoms, cognition, cardiovascular events and mortality"
        title: "الارتفاع البسيط مش كارثة"
        text: |
          - ==minor TSH elevations== **مش** مرتبطة بـ quality of life ولا symptoms ولا cognition ولا cardiovascular events ولا mortality عند الكبار.
          - علاج الـ mild subclinical ممكن **ما يفيدش**.
          - وممكن **يأذي**: كبار بأعراض غير محددة ياخدوا هرمون مالوش لازمة.
      - kind: explain
        page: 98
        quote: "The elderly are more susceptible to the side effects of thyroid hormone excess such as AF, and osteoporotic fractures."
        title: "ليه نخاف من الزيادة؟"
        text: |
          - الجرعة اللي بتظبط الـ TSH **أقل** عند الكبير، لأن الـ **lean body mass** قلّ فالـ thyroxine turnover قلّ.
          - امتصاص أقل، أدوية تانية، وأمراض كتير.
          - الكبير **more susceptible** للـ excess: ==AF== و==osteoporotic fractures==.
          - تجربة **737** مريض فوق 65: الـ low-dose levothyroxine ماحسّنش الـ **ThyPRO** score. علشان كده target TSH ممكن يطلع لـ 6-7 فوق 70-80.
      - kind: table
        page: 98
        quote: "Treatment strategy"
        title: "جدول الـ treatment strategy"
        columns: ["TSH", "65-75 y", "Over 75 y"]
        rows:
          - ["Over 10", "Treat", "Treat / observe"]
          - ["6-10", "Observe / treat", "Observe / treat"]
          - ["4-6", "Observe / treat", "Observe"]
        hide: [[0, 1], [2, 2]]
      - kind: explain
        page: 99
        quote: "In the presence of positive antithyroid autoantibody titres, symptoms of hypothyroidism, concomitant diseases potentially impaired by mild thyroid failure"
        title: "إيه اللي يرجّح treat؟"
        text: |
          قبل أي حاجة: ==confirm== الـ TSH بقياس تاني بعد **3-6 months**.

          يرجّح العلاج:
          - **positive antithyroid antibodies**.
          - **symptoms** of hypothyroidism.
          - مرض ممكن يسوء بالـ mild failure زي **HF**.
          - رغبة المريض.
          - TSH بيطلع لحد **10 أو أكتر**.
      - kind: case
        page: 99
        quote: "in frail patients with serum TSH levels >10 mIU/L, more caution is recommended regardless of the age, and a wait-and-see strategy is recommended."
        stem: "Three patients, each with a confirmed raised TSH and normal FT4."
        steps:
          - reveal: "A: 70-year-old, fit, active, TSH 12."
            question: "A?"
            options: ["Treat with L-T4", "Observe only", "Radioiodine", "Repeat in 5 years"]
            answer: 0
            why: "**Good health** و TSH أكتر من 10 = L-T4 recommended."
          - reveal: "B: 88-year-old, bed-bound, frail, TSH 12."
            question: "B?"
            options: ["Wait and see", "Treat to TSH 1", "Full replacement dose", "Thyroidectomy"]
            answer: 0
            why: "**Frail** مع TSH أكتر من 10: caution بغض النظر عن السن، **wait-and-see**."
          - reveal: "C: 72-year-old woman, fit, TSH 7.5, anti-TPO positive."
            question: "C?"
            options: ["Consider a low-dose L-T4 trial, or monitor every 3-6 months", "Always treat", "Ignore it", "Methimazole"]
            answer: 0
            why: "Fit، TSH بين 6 و10، ومعاها risk factors (ست + antibodies): ممكن **low-dose trial**؛ وإلا monitor كل 3-6 شهور."
      - kind: explain
        page: 99
        quote: "Usual starting doses in elderly patients without cardiac morbidities is 25 mg/day and with cardiac comorbidities is 12.5 ug/day."
        title: "الجرعة"
        text: |
          - Starting dose: ==25 µg/day== من غير قلب، و==12.5 µg/day== مع cardiac comorbidity.
          - زوّد **12.5-25 µg كل 4 weeks** بالـ TSH.
          - Target فوق 75: **TSH 2.5-3.5 mIU/L**.
          - الـ TSH بياخد وقت أطول ينزل عند الكبار، فالـ **slight TSH elevation** مع FT4 normal مش سبب تزوّد الجرعة.
          - لو حصل **cardiac instability**: وقّف الهرمون أيام أو أسابيع وارجع لما يستقر.
      - kind: aside
        tone: trap
        page: 99
        quote: "Usual starting doses in elderly patients without cardiac morbidities is 25 mg/day and with cardiac comorbidities is 12.5 ug/day."
        text: "الكتاب كاتب «25 **mg**/day» وده typo أكيد: المقصود **25 µg/day** (الـ 12.5 اللي جنبها مكتوبة ug). اكتبها **µg** في الامتحان."
      - kind: mnemonic
        page: 98
        quote: "treatment with levothyroxine must be maintained for life."
        word: "SLOW"
        parts:
          - { key: "S", text: "Start 25 µg (12.5 µg if cardiac)" }
          - { key: "L", text: "Life-long: tell him at least once a year" }
          - { key: "O", text: "Observe if frail or TSH just mildly up" }
          - { key: "W", text: "Wait 4 weeks between 12.5-25 µg steps" }
        hook: "الـ levothyroxine عند الكبير **SLOW**: «ابدأ قليل، وامشي براحة»."
      - kind: try
        items: [geri.L06.039, geri.L06.043, geri.L06.044, geri.L06.046]
    recap:
      - "Minor TSH elevations مش مرتبطة بـ outcomes؛ العلاج ممكن يأذي."
      - "الكبير حساس للزيادة: AF وosteoporotic fractures."
      - "أكد الـ TSH بعد 3-6 شهور؛ أكتر من 10 وبصحة كويسة = treat؛ frail = wait and see."
      - "ابدأ 25 µg (12.5 مع قلب)، زوّد 12.5-25 كل 4 أسابيع؛ target فوق 75 = 2.5-3.5."
      - "العلاج مدى الحياة."
    practice: [geri.L06.034, geri.L06.035, geri.L06.036, geri.L06.037, geri.L06.038, geri.L06.039, geri.L06.040, geri.L06.041, geri.L06.042, geri.L06.043, geri.L06.044, geri.L06.045, geri.L06.046, geri.L06.047, geri.L06.048, geri.L06.084, geri.L06.085, geri.L06.092]
