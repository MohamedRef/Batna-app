  - id: git.L11.lesson4
    title: "نزيف الدوالي الحاد: BAVE وبعدين TIPS"
    hook: "النزيف الـ variceal أخطر، مش علشان الدوالي، علشان الكبد اللي وراها."
    minutes: 9
    pages: [305, 312]
    topics: [variceal]
    goals:
      - "تطبّق الـ bundle بتاع النزيف الحاد وتعرف ليه كل حتة"
      - "تختار endoscopic variceal ligation (EVL) ولا cyanoacrylate"
      - "تعرف إمتى transjugular intrahepatic portosystemic shunt (TIPS) وإمتى الـ balloon"
    status: unverified
    steps:
      - kind: explain
        page: 305
        quote: "Patients with variceal bleeding have a higher mortality than those with nonvariceal bleeding, and this is largely related to the severity of underlying liver disease."
        title: "ليه أخطر؟"
        text: |
          الـ ==variceal bleeding== الـ mortality بتاعه أعلى من الـ non-variceal، وده بالأساس من **شدة مرض الكبد**.

          - الـ **esophagogastroduodenoscopy (EGD) screening** في الـ cirrhosis **mandatory**: يكتشف الدوالي ويوصفها ويصنّفها.
          - الدوالي سبب **5-11%** من الـ gastrointestinal (GI) bleeding.

          (المحاضرات hb.L03 و hb.L04 فيها الـ portal hypertension بالتفصيل.)

          ليه أخطر؟ الكتاب: بسبب **severity of underlying liver disease**. التفسير المقبول (مش في الكتاب): المريض مش بينزف بس؛ الكبد مش بيعمل clotting factors كفاية، والصفايح قليلة، والنزيف نفسه بيقلب الـ encephalopathy والـ infections والكلى. فالموت جاي من الكبد اللي اتهز، مش من الدم اللي ضاع بس.
      - kind: explain
        page: 306
        quote: "Acute GI hemorrhage in a patient with cirrhosis is an emergency that requires prompt attention with intravascular volume support and blood transfusions, being careful to maintain a hemoglobin of ~8 g/dL. Short-term (maximum 7 days) antibiotic prophylaxis should be instituted in any patient with cirrhosis and GI hemorrhage, Oral norfloxacin(400 mg BID) or intravenous ciprofloxacin (in patients in whom oral administration is not possible) is the recommended antibiotic. In patients with advanced cirrhosis intravenous ceftriaxone (1 g/day) may be preferable particularly in centers with a high prevalence of quinolone-resistant organisms. the use of PPI in cirrhotic patients favors bacterial infections including spontaneous peritonitis. Initiation of PPI before endoscopy is debated but commonly practiced in cirrhotic patients."
        title: "الـ bundle في النزيف الحاد"
        text: |
          نزيف عند مريض cirrhosis = **emergency**:
          - **Volume support** ونقل دم، مع ==Hb حوالي 8== (ما تزوّدش).
          - ==Antibiotics== **max 7 days** لكل مريض cirrhosis بينزف: **norfloxacin 400 mg twice daily (BID)** أو **IV ciprofloxacin**، و**IV ceftriaxone 1 g/day** أفضل في الـ advanced cirrhosis أو لو الـ quinolone resistance عالية.
          - ==Vasoactive drug== (somatostatin، octreotide، vapreotide، terlipressin) **أول ما تشك**، ويكمل **3-5 days**.
          - الـ **proton pump inhibitor (PPI)** في الـ cirrhosis بيزوّد الـ infections والـ spontaneous bacterial peritonitis (SBP). البداية قبل المنظار debated بس شائعة.

          ليه Hb حوالي 8 مش أكتر؟ التفسير المقبول (مش في الكتاب): الدم الزيادة بيرفع الـ portal pressure، فالدوالي اللي وقفت ترجع تنزف. وليه antibiotics لكل واحد حتى من غير سخونية؟ لأن بكتيريا الأمعاء عند مريض الـ cirrhosis اللي بينزف بتعدّي للدم بسهولة، والـ infection بتزوّد الـ rebleeding والوفاة. وليه الـ PPI مشكلة؟ لأن الحمض كان بيقتل البكتيريا قبل ما توصل للأمعاء.
      - kind: mnemonic
        page: 306
        quote: "somatostatin or its analoguesoctreotide and vapreotide; terlipressin) should be initiated as soon as variceal hemorrhage is suspected and continued for 3–5 days after diagnosis is confirmed."
        word: "BAVE"
        parts:
          - { key: "B", text: "Blood: restrictive, Hb about 8 g/dL" }
          - { key: "A", text: "Antibiotics: max 7 days (ceftriaxone 1 g/day in advanced cirrhosis)" }
          - { key: "V", text: "Vasoactive drug as soon as suspected, for 3-5 days" }
          - { key: "E", text: "Endoscopy within 12 h: band ligation" }
        hook: |
          **BAVE** زي **Baveno** من غير "no" 😄. أربع حاجات قبل ما تفكر في أي حاجة تانية.
      - kind: update
        page: 306
        quote: "Acute GI hemorrhage in a patient with cirrhosis is an emergency that requires prompt attention with intravascular volume support and blood transfusions, being careful to maintain a hemoglobin of ~8 g/dL. Short-term (maximum 7 days) antibiotic prophylaxis should be instituted in any patient with cirrhosis and GI hemorrhage, Oral norfloxacin(400 mg BID) or intravenous ciprofloxacin (in patients in whom oral administration is not possible) is the recommended antibiotic. In patients with advanced cirrhosis intravenous ceftriaxone (1 g/day) may be preferable particularly in centers with a high prevalence of quinolone-resistant organisms. the use of PPI in cirrhotic patients favors bacterial infections including spontaneous peritonitis. Initiation of PPI before endoscopy is debated but commonly practiced in cirrhotic patients."
