        quote: "In inflammatory arthritis:\n  Turbid.\n  WBC's 2000 - 50.000 % polymorph 20-70%.\n  Mucin. clot is poor: hyaluronic acid is degraded.\n  Synovial fluid / blood glucose difference: 30.\n  No crystals.\n  Decreased complement."
        prompt: "ليه الـ mucin clot ضعيف؟"
        answer: "الـ mucin clot معمول من الـ **hyaluronic acid**. الالتهاب والإنزيمات بيكسّروه، فالسائل يبقى أخف ومابيعملش clot كويس."
      - kind: explain
        page: 259
        title: "اقرا السائل: كل رقم بيقول حاجة"
        quote: "Differentiates inflammatory arthritis (as RA) from degenerative as (O.A) or septic arthritis."
        text: |
          الكتاب بيقول تحليل الـ synovial fluid هدفه يفرّق ==inflammatory== (زي الـ RA) من **degenerative** (OA) ومن **septic**. يعني كل خانة في الجدول بتجاوب على سؤال:

          - **Turbid** و **WBC 2,000–50,000** و **polymorphs 20–70%**: فيه التهاب (خلايا كتير تعكّر السائل). التفسير المقبول (مش في الكتاب): الـ OA أقل من كده بكتير، والـ septic غالبًا أعلى بكتير ومعظمه polymorphs.
          - **Glucose gap حوالي 30**: الخلايا الملتهبة بتاكل السكر.
          - **No crystals**: يستبعد الـ gout والـ pseudogout.
          - **Complement واطي**: التفسير المقبول (مش في الكتاب): الـ immune complexes جوّه المفصل بتستهلك الـ complement.
