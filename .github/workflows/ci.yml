name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests, content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: No build output, book text or huge files in git
        run: scripts/check-tracked-files.sh
      - name: System libraries for the desktop WebView
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Content checks (schema, ids, pages, approvals)
        run: cargo run -q -p batna-tools -- validate
      - name: Offline content pack builds and round-trips
        run: cargo run -q -p batna-tools -- packs build --check
      # Advisory: a pull request Mohamed will notice says so in
      # changes/<topic>.yaml (docs/RELEASE.md §5, "What's new"); without one
      # the update shows its title, in English. The files must parse.
      - name: What's new file (advisory)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          files="$(git diff --name-only --diff-filter=AM FETCH_HEAD HEAD)"
          if grep -qE '^(crates/(app|core)/|android/|content/)' <<<"$files" \
            && ! grep -qE '^changes/.+\.yaml$' <<<"$files"; then
            echo "::warning::No changes/*.yaml: the app will show this PR's title (English) as what's new. Add one line per visible change, or a file holding [] when there is nothing to tell."
          fi
          cargo run -q -p batna-tools -- update changes >/dev/null

  android:
    name: Android arm64 compiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy for aarch64-linux-android with the runner's NDK
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android28-clang"
          cargo clippy -p batna-app --target aarch64-linux-android --no-default-features --features mobile -- -D warnings

  worker:
    name: Batna Cloud Worker compiles (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p batna-server --target wasm32-unknown-unknown -- -D warnings
