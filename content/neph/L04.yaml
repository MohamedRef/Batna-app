    title: "BP thresholds for hypertension by type of measurement (mmHg)"
    columns: [Measurement, SBP, DBP]
    rows:
      - ["Office or clinic", "140", "90"]
      - ["24-hour", "125–130", "80"]
      - ["Day", "130–135", "85"]
