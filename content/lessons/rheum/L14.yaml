          التفسير المقبول (مش في الكتاب): اتنين بنفس الـ T-score، واحدة 50 سنة ما بتدخنش، وواحدة 75 سنة بتدخن وأمها اتكسر حوضها: الخطر مختلف جدًا. الـ FRAX بيحط السن والـ risk factors مع الكثافة. علشان كده الكتاب بيعالج **osteopenia + high FRAX** (ص 224).
