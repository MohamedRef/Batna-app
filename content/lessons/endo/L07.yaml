        prompt: "ليه عينة الـ ACTH لازم على تلج وتوصل المعمل في 30 دقيقة؟"
        answer: "التفسير المقبول (مش في الكتاب): الـ **ACTH** هرمون بروتيني بيتكسّر بسرعة بالإنزيمات اللي في البلازما في درجة حرارة الأوضة، فلو العينة اتأخرت هيطلع واطي غلط. وده خطير لأن الـ ACTH هو اللي بيفرّق: في الـ **primary** بيبقى عالي جدًا بالنسبة للـ cortisol، وفي الـ **secondary** واطي. يعني عينة اتأخرت ممكن تخلّيك تفتكر المشكلة pituitary وهي في الـ adrenal."
