        why: "الـ **secondary** (abscess أو perforation) بتدي: protein **>1.5**، PMN **>5,000**، **polymicrobial**، PMN مش بينزل بعد **48 h**، glucose **<50** (الكتاب كاتبها mg/l والمقصود mg/dL)، و **LDH ascitic > serum**. الـ SBP: monomicrobial و protein واطي."
      - kind: aside
        tone: analogy
        page: 168
        text: |
          الـ SBP زي **تسريب صغير من الماسورة**: بكتيريا واحدة، عدد قليل، والمية فقيرة في البروتين.

          الـ secondary زي **الماسورة اتكسرت**: كل أنواع البكتيريا (polymicrobial)، صديد بالآلاف، والجراح لازم ييجي.
      - kind: explain
        page: 168
        title: "ليه نستعجل؟"
        text: |
          - من غير prophylaxis: **30–50%** يموتوا في نفس الـ admission، **69%** ترجعلهم في سنة، و **50%** يموتوا تاني.
          - الـ predictors: severe liver disease، **renal impairment**، severe sepsis، و GI bleeding قريب.
          - **Early paracentesis (خلال أول 11 ساعة)** + antibiotics بدري = mortality أقل.
      - kind: explain
        page: 169
        title: "العلاج"
        text: |
          - **Empirical antibiotics فورًا** مع مجرد الشك.
          - First-line: **cefotaxime 2 g IV كل 8–12 h** أو **ceftriaxone 2 g كل 24 h**.
          - بدائل بنفس الكفاءة: **amoxicillin-clavulanic acid** أو **ciprofloxacin / ofloxacin**.
          - عدّل حسب الـ culture؛ وفي الـ culture-negative neutrocytic كمّل الـ empirical.
          - المدة **5–7 أيام على الأقل**.
          - **Albumin 1.5 g/kg يوم التشخيص، و 1 g/kg يوم 3**، خصوصًا لو فيه AKI أو hepatic dysfunction.
          - **Response:** الـ PMN يقل **أكتر من 25%** بعد **48 h** (الكتاب كاتبها بصيغة ملخبطة شوية، والمعنى نزول أكتر من 25%). لو مفيش: وسّع الـ coverage ودوّر على **secondary peritonitis**.
          - اللي يخف من SBP وتوقعه طويل المدى وحش: **فكّر في LT**.
      - kind: reveal
        page: 169
        prompt: "مريض SBP والـ creatinine كويس. ليه نديله albumin؟ مش ده دور الـ antibiotic؟"
        answer: |
          الـ SBP هي **أشهر trigger للـ HRS-AKI**. العدوى بتزوّد الـ vasodilatation والـ underfilling، والـ albumin بيحمي الـ effective circulating volume، فبيمنع الكلية تقع.

          علشان كده الكتاب بيقول الـ albumin بعد الـ SBP **mandatory** في الـ HRS prevention.
