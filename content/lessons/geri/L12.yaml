            <text x="296" y="160" class="t-sm">pos</text>
            <rect x="120" y="174" width="110" height="40" rx="8" class="fg-good"/>
            <text x="138" y="199" class="t-sm t-b">EASI</text>
            <rect x="238" y="174" width="88" height="60" rx="8" class="fg-bad"/>
            <text x="244" y="194" class="t-sm">Clarify</text>
            <text x="244" y="210" class="t-sm">cognition</text>
            <text x="244" y="226" class="t-sm">first</text>
            <path d="M76 134V260M175 214V260" class="fg-thin"/>
            <rect x="20" y="262" width="290" height="50" rx="8" class="fg-box"/>
            <text x="32" y="284" class="t-sm t-b">1 or more yes to Q2-Q6</text>
            <text x="32" y="302" class="t-sm">= further assessment</text>
            <text x="20" y="346" class="t-sm t-mut">Sensitivity 0.47, specificity 0.75</text>
            <text x="20" y="366" class="t-sm t-mut">Mini-Cog: under 5 min, like MMSE</text>
          </svg>
      - kind: check
        page: 212
        quote: "Screening older patients for mistreatment may follow a one- or two-step process, depending on the patient's level of cognitive function. When the physician has known a normally functioning, cognitively intact patient over time, one-step screening using the EASI is recommended. When the physician does not know the patient or suspects dementia, the two-step process begins with screening for cognitive impairment with the Mini-Cog."
        question: "A new patient, 82, seems forgetful. First step in screening for abuse?"
        options: ["Mini-Cog", "EASI", "Ask the caregiver", "MMSE then EASI the same day"]
        answer: 0
        why:
          - "صح: مريض جديد وشاكك في dementia = two-step، أوله Mini-Cog."
          - "الـ EASI لوحده لمريض تعرفه وسليم ذهنيًا."
          - "الـ caregiver ممكن يكون هو اللي بيأذي."
          - "الكتاب بيقول Mini-Cog (أقل من 5 دقايق وكفاءته زي الـ Mini-Mental State Examination (MMSE))."
      - kind: aside
        tone: trap
        page: 212
        quote: "It has a sensitivity of 0.47 and a specificity of 0.75. The EASI includes five patient-answered items, plus one physician question that can identify patients who are at risk. At least one \"yes\" response to questions 2 through 6 indicates a need for further assessment."
        text: "الـ EASI sensitivity بتاعته **0.47** بس. يعني أكتر من نص المرضى المتأذيين ممكن يطلعوا negative. الـ screen السلبي مش براءة؛ عينك تفضل مفتوحة على العلامات."
      - kind: explain
        page: 212
        quote: "If the Mini-Cog is positive, further assessment should clarify cognitive impairment before screening for abuse. Cognitive deficits may be limited to specific domains, and a patient may retain memory and capacity in others."
        title: "الـ Mini-Cog إيجابي؟ ما تقفلش الملف"
        text: |
          لو الـ **Mini-Cog** طلع positive، الكتاب ما بيقولش «خلاص مش هنسأل». بيقول: **وضّح الـ cognitive impairment الأول**، وبعدين اعمل الـ screening.

          ليه؟ لأن الـ ==cognitive deficits may be limited to specific domains==: ممكن المريض ذاكرته ضعيفة بس لسه فاهم ومحتفظ بـ **capacity** في حاجات تانية.

          يعني تشخيص الـ dementia مش معناه إن كلامه عن الإساءة مالوش قيمة. وده مهم أكتر لأن الـ dementia نفسها من أكبر الـ risk factors.
      - kind: explain
        page: 213
        quote: "Elder abuse is largely a hidden problem and tends to be committed in the privacy of the elderly person's home, mostly by his or her family members"
        title: "ليه الأرقام أقل من الحقيقة؟"
        text: |
          1. مشكلة ==hidden==: في البيت، وغالبًا من العيلة.
          2. الضحية **مش عايز يبلّغ**: خايف محدش يصدقه، يفقد استقلاله، يتحط في دار، يخسر السند الوحيد اللي ليه (لو المؤذي قريب)، أو ينتقم منه.
          3. الضحية **مش قادر يبلّغ**: cognitive decline ومرض.
          4. **قلة تدريب** الـ social workers والشرطة والتمريض.
          5. الإساءة **subjective**، بتعتمد على تفسير كل واحد.
          6. خلاف: نحسب الـ **self-neglect** ولا لأ؟ (مفيهوش مؤذي تاني).

          لاحظ إن السبب الأول هو مفتاح الباقي: الإساءة بتحصل **جوه البيت ومن العيلة**، عشان كده الضحية بيخاف يبلّغ (هيخسر مين؟)، ومحدش برّه البيت شايف.
      - kind: mnemonic
        page: 213
        quote: "Elder abuse victims are often unwilling to report their abuse for fear of others' disbelief, fear of loss of independence, fear of being institutionalized, fear of losing their only social support (especially if the per pet rat or is a relative), and fear of being subject to future retaliation by the per pet rat or(s)"
        word: "DIIRS"
        parts:
          - { key: "D", text: "Disbelief: nobody will believe me" }
          - { key: "I", text: "Independence: I'll lose it" }
          - { key: "I", text: "Institution: they'll put me in a home" }
          - { key: "R", text: "Retaliation by the abuser" }
          - { key: "S", text: "Support: losing my only social support" }
        hook: |
          خمس مخاوف بتسكّت الضحية. لو المؤذي ابنه، الخوف الأكبر غالبًا الـ **S**: «لو بلّغت، مين هيرعاني؟»
      - kind: reveal
        page: 213
        quote: "Another reason why there is a lack of accurate statistics is the debate of whether to include self-neglect or not. Many are unsure if it should be included since it does not involve another person as an abuser."
        prompt: "راجل عايش لوحده وما بقاش بياكل ولا بيستحمى ولا بياخد دواه. ده elder abuse ولا لأ؟"
        answer: |
          ده **self-neglect**، والكتاب بيقول إن فيه **خلاف** هل يتحسب في الإحصائيات ولا لأ.

          اللي ضده بيقولوا: مفيش **شخص تاني** مؤذي، فده نوع مختلف. وده بالظبط واحد من أسباب إن الأرقام مش دقيقة: كل دراسة بتعدّ حاجة مختلفة.

          بس كدكتور، علامات الـ neglect واحدة سواء من caregiver أو من نفسه (bed sores، وزن نازل، بيت وسخ)، وفي الحالتين محتاج تدخّل.
      - kind: try
