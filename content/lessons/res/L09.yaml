  # ------------------------------------------------------------------
  - id: res.L09.lesson3
    title: "Respect و beneficence: احترام المشارك ووزن الخطر"
    hook: "دراسة بتسأل عن الـ HIV بالاسم من غير أي حقنة: الخطر minimal ولا لأ؟"
    minutes: 6
    pages: [35, 42]
    topics: [principles]
    goals:
      - "تشرح respect for persons وحمايتها"
      - "تحلل الـ risks (magnitude و probability) ومستوياتها"
      - "تفهم ليه الـ benefit بتتقاس بالـ opportunity"
    status: unverified
    steps:
      - kind: explain
        page: 35
        quote: "RESPECT FOR PERSONS\n  Means respecting their personality, culture and traditions [Autonomy].\n  Requires we respect privacy & confidentiality.\n  Requires we go through the process of informed consent.\n  Requires we conduct research is a convenient environment."
        title: "Respect for persons"
        text: |
          يعني تحترم **شخصيته وثقافته وتقاليده** (==autonomy==)، وده بيتطلب:

          - احترام الـ **privacy and confidentiality**.
          - المرور بالـ **informed consent process**.
          - البحث يتعمل في **مكان مريح**.

          الدكتورة فرّقت في الشرح بين الاتنين:

          - **Privacy**: ظروف المقابلة أو الكشف نفسها، وإن الشخص يتحكم في اللي بيقوله وبيكشفه.
          - **Confidentiality**: حماية المعلومات اللي جمعتها: متخزنة فين، متأمنة إزاي، مين يقدر يشوفها، وهتتخلص منها إزاي. ولجنة الأخلاقيات بتسأل عن ده كله.

          وقالت كمان إن الاحترام يعني تراعي ثقافته وعاداته من غير سخرية ولا ضغط، وإنه يوافق لأنه **فهم**، مش لأنه بيثق في الدكتور وخلاص.
      - kind: table
        page: 36
        quote: "Respect for persons: the right to choose\n| What it asks | Protection |\n|---|---|\n| Allow people to choose for themselves | Informed Consent |\n| Respect for privacy; Protect sensitive data | Privacy & Confidentiality Protections |\n| Extra Protections for individuals with limited autonomy | Family Consent |"
        title: "الاحترام بيتحمي إزاي؟"
        columns: ["المطلوب", "الحماية"]
        rows:
          - ["Allow people to choose for themselves", "Informed consent"]
          - ["Respect privacy, protect sensitive data", "Privacy and confidentiality protections"]
          - ["Limited autonomy", "Extra protection: family consent"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 37
        quote: "Beneficence/Non-Maleficence\nFirst do no harm (Non-Maleficence)"
        title: "First do no harm"
        text: |
          الـ **beneficence** ماشية مع الـ ==non-maleficence==، وقلب الـ non-maleficence جملة واحدة: ==«First do no harm»==.

          - Beneficence: كبّر الفايدة.
          - Non-maleficence: ماتأذيش، ولو فيه خطر صغّره.

          ليه الاتنين مع بعض؟ لأن أي بحث فيه خطر ما، فالسؤال مش «فيه ضرر ولا لأ» بس «الفايدة تستاهل الضرر الصغير ده؟». التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 39
        quote: "Risks: Components\n  Magnitude of harm\n    Death\n    Slight discomfort\n  Probability of harm\n    1/ 1,000,000\n    1/ 10"
        title: "Beneficence: الـ risk ليه مكونين"
        text: |
          ==Non-maleficence== = **first do no harm**، وبعدها توازن: **maximize benefits** و **minimize risks** (slides 37-38).

          والـ risk ليه مكونين:

          - **Magnitude of harm**: من slight discomfort لحد death.
          - **Probability of harm**: من واحد في المليون لحد واحد في العشرة.

          الدكتورة شرحتها بمثال **الأرض المبلولة**: البلل نفسه مصدر خطر (hazard)، واحتمال إنك تتزحلق وقد إيه هتتأذي ده الـ **risk**، والكسر لو حصل فعلًا ده الـ **harm**. وحدث احتماله قليل بس شديد (زي الموت) مايتعاملش كإزعاج بسيط.

          وفي الفيديو سلايد **Analysis of risks** (slide 40) فيها ٣ مستويات: **minimal**، و **above minimal**، و **too risky**.
      - kind: explain
        page: 40
        quote: "Analysis Of Risks\nRisk Level:\n  Minimal\n  Above Minimal\n  Too RISKY"
        title: "٣ مستويات للخطر"
        text: |
          في الـ **analysis of risks** الدراسة بتقع في مستوى من ٣:

          1. ==Minimal==
          2. ==Above minimal==
          3. ==Too risky==

          ليه التقسيم؟ لأن المستوى هو اللي بيحدد هتعمل إيه: الـ minimal ممكن مراجعة أبسط، والـ above minimal محتاج حماية أكتر، والـ too risky مايتعملش. التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 39
        quote: "Risks: Components Magnitude of harm Death Slight discomfort Probability of harm"
        title: "الخطر = حجم الضرر × احتماله"
        alt: "A chart with probability of harm on the horizontal axis, from 1 in a million to 1 in 10, and magnitude of harm on the vertical axis, from slight discomfort to death. The lower right area is minimal risk, a middle diagonal band is above minimal, and the top left corner, severe harm, is too risky."
        caption: |
          الرسمة بتحط مكوّنين الـ risk من slide 39 على محورين:

          - **تحت**: الـ ==probability== من واحد في المليون لواحد في العشرة.
          - **على الجنب**: الـ ==magnitude== من إزعاج بسيط لحد الموت.

          والمستويات التلاتة بتاعة slide 40 بقت مناطق: الخطر بيكبر كل ما تطلع لفوق **أو** تروح يمين. الضرر البسيط النادر تحت = **minimal**، والنص **above minimal**، وفوق خالص **too risky**: الموت عند الطرف الشمال كمان، يعني حتى لو احتماله صغير. ده اللي قالته الدكتورة: حدث نادر بس شديد مايتعاملش كإزعاج بسيط. الحدود بين المناطق تقريبية للشرح، والتفسير المقبول (مش في الكتاب).
        svg: |
          <svg viewBox="0 0 330 290" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L09b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <path d="M40 20L310 20L310 110L40 50Z" class="fg-bad"/>
            <path d="M40 50L310 110L310 190L40 150Z" class="fg-acc"/>
            <path d="M40 150L310 190L310 230L40 230Z" class="fg-good"/>
            <path d="M40 232V12" class="fg-arrow" marker-end="url(#L09b)"/>
            <path d="M38 230H318" class="fg-arrow" marker-end="url(#L09b)"/>
            <text x="120" y="48" class="t-sm t-b">Too risky</text>
            <text x="175" y="132" text-anchor="middle" class="t-sm t-b">Above minimal</text>
            <text x="175" y="214" text-anchor="middle" class="t-sm t-b">Minimal</text>
            <text x="44" y="252" class="t-sm t-mut">1/1,000,000</text>
            <text x="310" y="252" text-anchor="end" class="t-sm t-mut">1/10</text>
            <text x="175" y="276" text-anchor="middle" class="t-sm t-b">Probability of harm</text>
            <text x="30" y="226" class="t-sm t-mut" transform="rotate(-90 30 226)">slight discomfort</text>
            <text x="30" y="20" text-anchor="end" class="t-sm t-mut" transform="rotate(-90 30 20)">death</text>
            <text x="14" y="125" text-anchor="middle" class="t-sm t-b" transform="rotate(-90 14 125)">Magnitude</text>
          </svg>
      - kind: explain
        page: 41
        quote: "LEVELS OF RISKS\n  Minimal risk: may be age dependent: blood draw may be minimal risk for an adult but not for a young child !!!\n  Remember: The risks need not be \"physical\" only in order to be \"greater than minimal risk\" e.g., privacy & confidentiality risks push the study into \"greater than minimal risk\""
        title: "Minimal risk مش رقم ثابت"
        text: |
          - **Minimal risk** بيعتمد على السن: سحب دم ممكن يبقى minimal risk للكبير، **بس مش للطفل الصغير**.
          - والـ risk **مش لازم يكون physical** عشان يبقى «greater than minimal risk»: الـ ==privacy and confidentiality risks== لوحدها بتطلّع الدراسة فوق الـ minimal.
      - kind: check
        page: 41
        quote: "LEVELS OF RISKS\n  Minimal risk: may be age dependent: blood draw may be minimal risk for an adult but not for a young child !!!\n  Remember: The risks need not be \"physical\" only in order to be \"greater than minimal risk\" e.g., privacy & confidentiality risks push the study into \"greater than minimal risk\""
        question: "A questionnaire study records names with HIV status. There is no physical procedure. Its risk is:"
        options: ["Greater than minimal risk", "Minimal risk", "No risk"]
        answer: 0
        why:
          - "صح: privacy and confidentiality risks بتطلّعها فوق الـ minimal (slide 41)."
          - "الاستبيان شكله غلبان، بس تسريب الـ HIV status ضرر حقيقي."
          - "الـ risk مش لازم يكون physical."
      - kind: explain
        page: 42
        quote: "Benefits\n  Benefits conceptually are a function of \"opportunity\" rather than probability.\n  Ex: A study with a small probability of a great benefit (cure from a fatal illness) is considered more beneficial than another one with a high probability of a minimal benefit."
        title: "الفايدة = فرصة مش احتمال"
        text: |
          الـ benefits بتتقاس بـ ==«opportunity»== مش بالـ probability.

          مثال السلايد: دراسة فيها ==احتمال صغير لفايدة كبيرة== (شفا من مرض قاتل) أفيد من دراسة فيها ==احتمال كبير لفايدة بسيطة==.

          ليه؟ لأن حجم الفايدة لو حصلت هو اللي بيبرّر إن الناس تدخل الدراسة، مش بس فرصة إنها تحصل. التفسير المقبول (مش في الكتاب).
      - kind: try
        items: [res.L09.037, res.L09.041, res.L09.115]
    recap:
      - "Respect for persons = autonomy، privacy and confidentiality، informed consent، ومكان مريح."
      - "Beneficence + non-maleficence: first do no harm."
      - "Risk = magnitude × probability: minimal، above minimal، too risky. والـ privacy risk لوحده بيطلّع الدراسة فوق minimal."
      - "الـ benefit = opportunity مش probability."
    practice: [res.L09.035, res.L09.036, res.L09.037, res.L09.038, res.L09.039, res.L09.040, res.L09.041, res.L09.115, res.L09.116]
