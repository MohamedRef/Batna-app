          - { text: "One-third of lymphomas", bin: 1 }
          - { text: "R-CHOP x 6-8", bin: 1 }
        why: "Follicular: indolent، BCL-2، small cleaved، سنين، CVP/chlorambucil/rituximab. DLBCL: high-grade، large cells، BCL-6، تلت الـ lymphomas، R-CHOP."
      - kind: try
