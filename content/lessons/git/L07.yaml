          - "الـ fissure **بيوجع** (في قايمة with pain)، والدم فيه قليل."
          - "الـ ischemic colitis بيجي بألم وإسهال دموي."
          - "الـ infectious colitis = bloody diarrhea مع cramps وسخونية."
