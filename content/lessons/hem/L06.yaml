schema: batna.lesson/v1
lecture: hem.L06
lessons:
  # ------------------------------------------------------------------
  - id: hem.L06.lesson1
    title: "ABO: مين يدّي مين؟"
    hook: "كيس دم واحد غلط ممكن يموّت. الفكرة كلها: الـ antibodies اللي في مين، ضد الـ antigens اللي على مين."
    minutes: 8
    pages: [84, 87]
    topics: [antigens, antibodies, compatibility]
    goals:
      - "تعرف الـ antigens والـ antibodies في كل blood group"
      - "تفرّق naturally occurring عن immune antibodies، و IgM عن IgG"
      - "تفرّق major عن minor incompatibility"
    status: unverified
    steps:
      - kind: explain
        page: 84
        title: "الـ antigens على كرة الدم"
        quote: "there are several clinically important blood group system: ABO, Rh, Kell, Kidd, and Duffy."
        text: |
          الـ systems المهمة إكلينيكيًا: ==ABO== و **Rh** و **Kell** و **Kidd** و **Duffy**.

          الـ membrane حوالي **40% lipids** و **10% carbohydrates** والباقي protein. الـ antigen ممكن يبقى protein أو glycoprotein أو glycolipid:
          - في **Rh** و **Kell** الفرق في الـ **amino acid sequence**.
          - في **ABO** الفرق في الـ **oligosaccharide (sugar) sequence**.
      - kind: explain
        page: 85
        title: "Naturally occurring ولا immune؟"
        quote: "Antibodies are naturally occurring when they are produced without any obvious immunizing stimulus, such as pregnancy or transfusion."
        text: |
          - ==Naturally occurring==: بتطلع من غير pregnancy ولا transfusion، زي **anti-A** و **anti-B**. مش موجودة وقت الولادة، وبتظهر حوالي **3–6 months**، غالبًا ردًا على antigens بكتيريا وفيروسات بنتنفسها أو بناكلها.
          - **Immune (allo-) antibodies**: بس بعد **pregnancy** أو **transfusion**. ده حال أغلب الـ systems غير ABO.
      - kind: reveal
        page: 86
        quote: "they have ‗naturally occurring‘ antibodies to those ABO antigens they lack."
        prompt: "ليه أي شخص group A عنده anti-B من غير ما يكون اتنقله دم قبل كده؟"
        answer: |
          لأن الـ ABO antibodies ==naturally occurring==: الجسم بيقابل sugars شبه B على البكتيريا والأكل من وهو صغير، وطالما B مش موجود على كراته، بيعمل **antibody ضد الـ antigen اللي ناقصه**.

          ده سبب إن أول transfusion غلط في الـ ABO ممكن يعمل AHTR فورًا.
      - kind: table
        page: 86
        quote: "IgM antibodies will directly agglutinate antigen-positive red cells in a saline medium, whereas most IgG antibodies require potentiators or anti-human globulin"
        title: "IgM مقابل IgG"
        columns: [Feature, IgM, IgG]
        rows:
          - ["Saline agglutination", "Yes, directly", "Usually not"]
          - ["Needs to show it", "Nothing", "AHG (Coombs)"]
        hide: [[0, 1], [1, 2]]
      - kind: aside
        tone: analogy
        page: 86
        quote: "IgM antibodies agglutinate red cells suspended in saline. They are often called saline or directly agglutinating antibodies."
        text: |
          الـ **IgM** خماسي (pentamer)، دراعاته كتير وطويلة فبيمسك كذا كرة مع بعض لوحده، زي شبكة صيد. الـ **IgG** صغير (dimer)، بيلزق على الكرة بس ما يقدرش يلم كرتين، فمحتاج **anti-human globulin** يعمل الكوبري.

          (تفسير الشكل من الـ immunology، والمعلومة من الكتاب.)
      - kind: explain
        page: 86
        title: "قد إيه blood group؟"
        quote: "The International Society of Blood Transfusion (ISBT) recognizes 339 blood group antigens; 297 of these are classified into 1 of 33 blood group systems"
        text: |
          الـ **ISBT** بتعرف **339 antigens**، منهم **297** في **33 systems**. كل system = **gene واحد** أو cluster من 2–3 genes قريبين، فكل system ==genetically discrete==.
      - kind: figure
        page: 87
        quote: "Group AB Group O Red blood cell type Antibodies in Plasma None Anti-A and Anti-B"
        title: "الـ ABO في لوحة واحدة"
        alt: "Four columns for groups A, B, AB and O. A has A antigen and anti-B; B has B antigen and anti-A; AB has both antigens and no antibodies; O has no antigens and both anti-A and anti-B."
        caption: "الـ antibodies دايمًا ضد اللي **مش موجود**. **O** معاه anti-A و anti-B، و ==AB== مفيش antibodies خالص."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="70" class="t-sm t-mut">Antigen</text>
            <text x="10" y="150" class="t-sm t-mut">Plasma</text>
            <text x="10" y="166" class="t-sm t-mut">antibody</text>
            <text x="105" y="25" text-anchor="middle" class="t-b">A</text>
            <text x="165" y="25" text-anchor="middle" class="t-b">B</text>
            <text x="225" y="25" text-anchor="middle" class="t-b">AB</text>
            <text x="290" y="25" text-anchor="middle" class="t-b">O</text>
            <circle cx="105" cy="70" r="22" class="fg-acc"/><text x="105" y="75" text-anchor="middle" class="t-sm t-b">A</text>
            <circle cx="165" cy="70" r="22" class="fg-good"/><text x="165" y="75" text-anchor="middle" class="t-sm t-b">B</text>
            <circle cx="225" cy="70" r="22" class="fg-bad"/><text x="225" y="75" text-anchor="middle" class="t-sm t-b">A+B</text>
            <circle cx="290" cy="70" r="22" class="fg-box"/><text x="290" y="75" text-anchor="middle" class="t-sm t-b">none</text>
            <rect x="75" y="130" width="60" height="40" rx="8" class="fg-box"/><text x="105" y="155" text-anchor="middle" class="t-sm">anti-B</text>
            <rect x="135" y="130" width="60" height="40" rx="8" class="fg-box"/><text x="165" y="155" text-anchor="middle" class="t-sm">anti-A</text>
            <rect x="195" y="130" width="60" height="40" rx="8" class="fg-thin"/><text x="225" y="155" text-anchor="middle" class="t-sm">none</text>
            <rect x="260" y="130" width="62" height="40" rx="8" class="fg-box"/><text x="291" y="148" text-anchor="middle" class="t-sm">anti-A</text><text x="291" y="163" text-anchor="middle" class="t-sm">anti-B</text>
            <text x="165" y="210" text-anchor="middle" class="t-sm t-mut">Components with &gt;2 ml RBC must match the plasma</text>
          </svg>
      - kind: explain
        page: 87
        title: "Major ولا minor؟"
        quote: "Major incompatibility, where antibodies in the recipient will destroy transfused red cells (e.g. A to O, B to O, A to B, B to A)."
        text: |
          أي component فيه **أكتر من 2 ml RBCs** لازم يبقى compatible مع **plasma العيان**.

          - ==Major==: antibodies **العيان** بتكسّر كرات **المتبرع** (A ← O يعني A لعيان O، B لـ O، A لـ B، B لـ A). ده الخطر الكبير.
          - **Minor**: antibodies **في كيس المتبرع** بتكسّر كرات **العيان** (O لـ A، O لـ B).
      - kind: aside
        tone: trap
        page: 87
        quote: "Minor incompatibility, where antibodies in the donated blood will destroy the recipient‘s red cells (e.g. O to A, O to B)."
        text: |
          الـ **O** مش "universal donor" بريء 100%: الـ plasma بتاعته فيها **anti-A و anti-B**، فلو اديت **whole blood O** لعيان A ممكن تعمل ==minor incompatibility==. علشان كده بنفضّل **packed RBCs** (plasma قليلة).
      - kind: check
        page: 87
        quote: "Major incompatibility, where antibodies in the recipient will destroy transfused red cells (e.g. A to O, B to O, A to B, B to A)."
        question: "Group A red cells given to a group O patient. What happens?"
        options: ["Major incompatibility", "Minor incompatibility", "No reaction", "Only Rh reaction"]
        answer: 0
        why:
          - "صح: الـ anti-A بتاع العيان O بيكسّر كرات A اللي اتنقلتله."
          - "الـ minor لما antibodies المتبرع هي اللي بتهاجم (O لـ A)."
          - "فيه reaction أكيد: anti-A ضد A cells."
          - "الـ Rh مش في السؤال؛ الـ ABO لوحده كفاية يعمل hemolysis."
      - kind: try
        items: [hem.L06.006, hem.L06.013, hem.L06.018, hem.L06.019, hem.L06.020]
    recap:
      - "Systems مهمة: ABO، Rh، Kell، Kidd، Duffy. ABO = sugar، Rh و Kell = amino acids."
      - "Anti-A و anti-B naturally occurring، بتظهر 3–6 months. الباقي immune بعد transfusion أو pregnancy."
      - "IgM بيعمل agglutination في saline. IgG محتاج AHG."
      - "Major: antibodies العيان ضد كرات المتبرع. Minor: antibodies المتبرع ضد كرات العيان."
    practice: [hem.L06.001, hem.L06.002, hem.L06.003, hem.L06.004, hem.L06.005, hem.L06.006, hem.L06.007, hem.L06.008, hem.L06.009, hem.L06.010, hem.L06.011, hem.L06.012, hem.L06.013, hem.L06.014, hem.L06.015, hem.L06.016, hem.L06.017, hem.L06.018, hem.L06.019, hem.L06.020, hem.L06.021, hem.L06.022]
