  - id: res.L04.045
    kind: mcq
    topic: case-reports
    stem: >-
      A journal advertisement says 2000 people with sore throat were treated with a new medicine and 94% were
      symptom-free within 4 days, so the medicine works. What is your view of the claim?
    options:
      - It is correct
      - It may be incorrect because the conclusion is not based on a rate
      - It may be incorrect because of a long-term cohort effect
      - It is incorrect because there was no control or comparison group
    answer: 3
    why:
      - Without a comparison group we can't tell whether the drug did anything.
      - 94% is a rate (a proportion), so that is not the flaw.
      - There is no cohort here; it is a treated case series.
      - Most sore throats settle within days anyway; only a comparison group shows what the drug added.
