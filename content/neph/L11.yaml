  - id: neph.L11.131
    kind: order
    topic: dialysis-htn
    prompt: Order the angiogenic pathway to endothelial dysfunction in preeclampsia.
    steps:
      - Abnormal placental perfusion and failed spiral artery remodeling
      - The placenta secretes sFlt-1
      - sFlt-1 binds circulating placental growth factor and VEGF
      - placental growth factor and VEGF can no longer maintain vascular homeostasis
      - Endothelial dysfunction
    src: { page: 376, quote: "Two promising biomarkers, soluble fms-like tyrosine kinase 1 (sFlt-1) and placental growth factor (P1GF), are being studied in the general population to help early detection and management of preeclampsia in pregnant women at risk. During normal pregnancy, P1GF and vascular endothelial growth factor help maintain vascular homeostasis. In patients with preeclampsia, the placenta secretes sFLT1, which binds to circulating P1GF and vascular endothelial growth factor, inhibiting their action and leading to endothelial dysfunction. Measuring SFlt-1 and P1GF can be useful in managing preeclampsia. The Prediction of Short-Term Outcome in Pregnant Women with Suspected Preeclampsia Study was designed to assess the role of SFlt-1/P1GF ratio in predicting the presence or absence of preeclampsia in the short term. The study showed that SFlt-1/P1GF ratio of 38 or less has a high negative predictive value of 99.3% (95% CI, 97.9-99.9) for ruling out preeclampsia within 1 week during the second or third trimester.(73) These studies support the role of using these biomarkers in diagnosing preeclampsia, which may minimize adverse outcomes associated with it, however, the data in the dialysis population are limited. A multicenter randomized clinical trial in the general population, the control of hypertension in pregnancy study, compared tight BP control (diastolic BP of 85mm Hg) to less tight BP control (diastolic BP>100mm Hg), and found" }
