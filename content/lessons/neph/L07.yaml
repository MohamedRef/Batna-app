  - id: neph.L07.lesson2
    title: "برّه الكلية: كبد وأنيوريزم وتشخيص بالسونار"
    hook: "عيان ADPKD بيموت أحيانًا من المخ مش من الكلية. ومين نعمله MRA؟ ومين نقوله عندك المرض من السونار؟"
    minutes: 9
    pages: [151, 156]
    topics: [adpkd-extrarenal, adpkd-dx]
    goals:
      - "تعرف الـ PLD والـ aneurysms والقلب والأكياس التانية بالأرقام"
      - "تعرف مين يتعمله screening للـ aneurysm وبإيه"
      - "تطبّق الـ ultrasound criteria حسب السن"
    status: unverified
    steps:
      - kind: explain
        page: 151
        title: "الكبد: أشهر حاجة برّه الكلية"
        quote: "Polycystic Liver Disease PLD is the most common extrarenal manifestation of ADPKD."
        text: |
          الـ ==polycystic liver disease== هو **أشهر extrarenal manifestation**، مع PKD1 و PKD2.

          نادر جدًا في الأطفال ويزيد مع السن. أوحش في الستات اللي حملوا كتير أو خدوا **OCs أو ERT** (الـ estrogen بيكبّر الأكياس).

          غالبًا asymptomatic، ولما يكبر: **dyspnea، early satiety، GERD، ألم ضهر**، وكمان ضغط على الـ hepatic veins والـ IVC والـ portal vein والـ bile duct (**obstructive jaundice**).
      - kind: explain
        page: 151
        title: "الـ intracranial aneurysm بالأرقام"
        quote: "intracranial aneurysms occur in 6% of patients with a negative family history and 16% of those with a positive family history"
        text: |
          - موجودة في حوالي ==8%==: **6%** من غير family history و **16%** لو فيه.
          - أغلبها asymptomatic؛ اللي بتكبر ممكن تعمل **cranial nerve palsy أو seizure**.
          - الـ rupture السنوي: أقل من **0.5%** لو أقل من 5 mm، و **4%** لو أكبر من 10 mm. والـ rupture = **35–55%** morbidity و mortality.
          - متوسط السن عند الـ rupture ==39 سنة== (مقابل 51 في الناس العادية)، و **29%** ضغطهم طبيعي!
      - kind: mnemonic
        page: 152
        quote: "Indications for screening in patients with a good life expectancy include family history of intracranial aneurysm or subarachnoid hemorrhage"
        word: "FRESH"
        parts:
          - { key: "F", text: "Family history of aneurysm or SAH" }
          - { key: "R", text: "Rupture before (previous aneurysmal rupture)" }
          - { key: "E", text: "Elective surgery with possible hemodynamic instability" }
          - { key: "S", text: "Scary job: high-risk occupation (airline pilot)" }
          - { key: "H", text: "Huge anxiety despite good information" }
        hook: "**FRESH**: مين يتعمله ==screening==؟ ومش للكل. والفحص **MRA** (من غير contrast)، والـ CTA بديل."
      - kind: check
        page: 152
        quote: "Magnetic resonance angiography is the diagnostic imaging modality of choice for presymptomatic screening"
        question: "Why is MRA the screening test of choice for aneurysms in ADPKD?"
        options:
          - "Noninvasive and needs no IV contrast"
          - "It is cheaper than ultrasound"
          - "It also treats the aneurysm"
          - "It is the only test that sees aneurysms"
        answer: 0
        why:
          - "صح: noninvasive ومن غير contrast، ودي ميزة كبيرة لعيان كلى."
          - "مش هو السبب."
          - "التشخيص بس."
          - "الـ CT angiography بديل مرضي."
      - kind: sort
        page: 153
        quote: "Ovarian cysts are not associated with ADPKD."
        prompt: "ADPKD: إيه اللي ليه علاقة وإيه لأ؟"
        bins: ["Associated", "Not associated"]
        cards:
          - { text: "Mitral valve prolapse (25%)", bin: 0 }
          - { text: "Seminal vesicle cysts (40%)", bin: 0 }
          - { text: "Arachnoid cysts (8%)", bin: 0 }
          - { text: "Pancreatic cysts (5%)", bin: 0 }
          - { text: "Thoracic aortic dissection", bin: 0 }
          - { text: "Ovarian cysts", bin: 1 }
        why: "الكتاب صريح: ==ovarian cysts مش مرتبطة== بالـ ADPKD. والـ echo بيتعمل **بس لو فيه murmur**."
      - kind: explain
        page: 153
        title: "حاجات تانية"
        quote: "Spinal meningeal diverticula may occur with increased frequency and rarely manifest with intracranial hypotension"
        text: |
          - **Pericardial effusion** صغير في لحد **35%** على الـ CT.
          - **Sperm** حركته ضعيفة، ونادرًا infertility.
          - **Spinal meningeal diverticula**: نادرًا CSF leak و ==intracranial hypotension== (صداع وهو واقف، diplopia، ataxia).
          - **Colonic و duodenal diverticula** ممكن تزيد.
      - kind: explain
        page: 154
        title: "نعمل screening؟"
        quote: "Presymptomatic screening of children is not recommended until more effective therapy for the disease becomes available."
        text: |
          الـ screening بس للي **فاهم مميزاته وعيوبه**:
          - لو موجود: **genetic counseling**، ونعالج الضغط بدري.
          - لو مش موجود: نطمّنه.
          - العيوب: ==insurability و employability==.

          **الأطفال**: مش بنعملهم screening لحد ما يبقى فيه علاج أحسن. والأداة **ultrasound** علشان رخيص وآمن.
      - kind: table
        page: 155
        quote: "Different criteria have therefore been proposed to exclude a diagnosis of ADPKD in an indi-vidual at risk from a family with an unknown genotype."
        title: "Revised unified criteria (للتشخيص)"
        columns: [Age, Cysts on ultrasound]
        rows:
          - ["15–39", "≥3, one or both kidneys"]
          - ["40–59", "≥2 in each kidney"]
          - ["≥60", "≥4 in each kidney"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: mnemonic
        page: 154
        quote: "At least three (uni-lateral or bilateral) renal cysts are sufficient for diagnosis of at-risk individuals 15 to 39 years of age"
        word: "324"
        parts:
          - { key: "3", text: "Age 15–39: 3 cysts anywhere" }
          - { key: "2", text: "Age 40–59: 2 in each kidney" }
          - { key: "4", text: "Age 60+: 4 in each kidney" }
        hook: "الرقم **3 2 4**: الشاب عايز **3** في أي حتة، الكبير عايز **2 في كل كلية**، والعجوز **4 في كل كلية** (لأن الـ simple cysts بتزيد مع السن)."
      - kind: explain
        page: 155
        title: "المتبرع: محتاجين نستبعد"
        quote: "finding fewer than five cysts by magnetic resonance imaging (MRI) is sufficient to exclude the diagnosis of ADPKD in potential living related kidney donors"
        text: |
          الـ ultrasound **specificity و PPV عالية**، بس الـ ==sensitivity والـ NPV واطيين في PKD2== من 15 لـ 59 سنة. ده مشكلة في **المتبرع القريب**: عايزين نستبعد المرض.

          الحل: **MRI**. لو فيه ==أقل من 5 cysts== على الـ MRI، المرض مستبعد في المتبرع.

          **Genetic testing** لما الـ imaging مش حاسم. الـ PKD1 **duplicated** فصعب على الـ exome؛ الـ sequencing المباشر بيجيب نتيجة في حوالي **90%**. وفيه **PGD** مع الـ IVF لاختيار embryo سليم.
      - kind: try
        items: [neph.L07.043, neph.L07.047, neph.L07.054, neph.L07.060, neph.L07.064]
    recap:
      - "PLD أشهر extrarenal؛ أوحش مع الحمل المتكرر والـ estrogen."
      - "Aneurysm 8% (6% أو 16% حسب الـ family history)؛ الـ rupture عند 39 سنة."
      - "Screening = FRESH، والأداة MRA؛ إعادة بعد 5–10 سنين لو family history قوي."
      - "MVP 25%، seminal vesicle cysts 40%، ovarian cysts مش مرتبطة."
      - "Ultrasound 3-2-4 حسب السن؛ ما نعملش screening للأطفال."
      - "المتبرع: MRI أقل من 5 cysts يستبعد؛ genetic testing لما الصورة مش حاسمة."
    practice: [neph.L07.039, neph.L07.040, neph.L07.041, neph.L07.042, neph.L07.043, neph.L07.044, neph.L07.045, neph.L07.046, neph.L07.047, neph.L07.048, neph.L07.049, neph.L07.050, neph.L07.051, neph.L07.052, neph.L07.053, neph.L07.054, neph.L07.055, neph.L07.056, neph.L07.057, neph.L07.058, neph.L07.059, neph.L07.060, neph.L07.061, neph.L07.062, neph.L07.063, neph.L07.064, neph.L07.065, neph.L07.066, neph.L07.067]
