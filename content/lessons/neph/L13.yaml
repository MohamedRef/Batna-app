            <text x="20" y="90" class="t-sm">Little Na reaches macula densa</text>
            <path d="M30 98 V112" class="fg-arrow" marker-end="url(#L13b)"/>
            <text x="20" y="130" class="t-sm">Afferent dilates → GFR <tspan class="t-b t-bad">120%</tspan></text>
            <rect x="10" y="156" width="310" height="132" rx="10" class="fg-good"/>
            <text x="20" y="176" class="t-sm t-b t-good">Diabetes + SGLT2 inhibitor</text>
            <text x="20" y="198" class="t-sm">SGLT2 blocked: more Na stays in tubule</text>
            <path d="M30 206 V220" class="fg-arrow" marker-end="url(#L13b)"/>
            <text x="20" y="236" class="t-sm">Na reaches macula densa: feedback on</text>
            <path d="M30 244 V258" class="fg-arrow" marker-end="url(#L13b)"/>
            <text x="20" y="276" class="t-sm">Afferent constricts → GFR <tspan class="t-b t-good">90%</tspan></text>
          </svg>
      - kind: check
        page: 441
        quote: "Analysis from the EMPA-REG OUTCOME trial indicate empagliflozin may assist in preventing the progression of chronic kidney disease in patients with type 2 diabetes irrespective of medications that alter intrarenal hemodynamics.\nSGLT2 inhibitors induce renal arteriolar vasoconstriction: ↓glomerular hypertension, ↓albuminuria\nEMPA-REG OUTCOME: N = 7020; 1° endpoint: ↓CV risk; Prespecified 2° kidney outcomes: ↓renal risk\nDoes empagliflozin interact with other drugs that may affect renal hemodynamics? (ACE inhibitors (ACEi), Angiotensin-receptor blockers (ARB), Diuretics, Calcium channel blockers (CCB), NSAIDs)\nThis analysis: Consistent ↓nephropathy with empagliflozin regardless of these drugs\nConclusion: Empagliflozin's renoprotective effects are independent of concomitant medications that may also alter renal hemodynamics"
        question: "A patient's eGFR falls slightly 2 weeks after starting dapagliflozin. Best explanation?"
        options:
          - "Afferent vasoconstriction from restored tubuloglomerular feedback"
          - "Acute tubular necrosis from the drug"
          - "Efferent arteriolar dilation"
          - "Volume overload"
        answer: 0
        why:
          - "صح: ده الـ mechanism اللي بيحمي الكلية (ص 441)."
          - "مش toxic؛ الـ effect hemodynamic."
          - "ده mechanism الـ ACEi/ARB."
          - "الـ SGLT2i بيعمل natriuresis."
      - kind: table
        page: 442
        quote: "Could dapagliflozin improve kidney and cardiovascular outcomes in patients with CKD?\nRandomized, Double-blind, Placebo-controlled, Multicenter; 386 sites in 21 countries; N= 4304; GFR 25-75 ml/min; 67.5% diabetes type 2; ACR 200-5000mg/g\nOutcomes: Kidney (Decline in GFR at least 50%, ESKD, Death from renal causes); Cardiovascular (Hospitalization for heart failure, Death from cardiovascular causes)\n| | Primary composite outcome | Composite kidney outcome | Composite cardiovascular outcome | Death from any cause |\n| Placebo (N= 2152) | 14.5% | 11.3% | 6.4% | 6.8% |\n| Dapagliflozin 10mg/d (N= 2152) | 9.2% | 6.6% | 4.6% | 4.7% |\n| P | P<0.001 | P<0.001 | P=0.009 | P=0.004 |\nConclusion: Among patients with chronic kidney disease, the risk of any composite kidney or cardiovascular outcomes or death was significantly lower with dapagliflozin than with placebo."
        title: "التجارب اللي في المحاضرة"
        columns: [Trial, Drug, Message]
        rows:
          - ["EMPA-REG", "Empagliflozin", "Renoprotection regardless of ACEi, diuretics, CCB, NSAIDs"]
          - ["CANVAS", "Canagliflozin", "Benefit at all albuminuria levels; biggest absolute benefit with severe albuminuria"]
          - ["DAPA-CKD", "Dapagliflozin", "CKD ± diabetes: fewer kidney, CV events and deaths (9.2% vs 14.5%)"]
          - ["FIDELIO-DKD", "Finerenone", "T2D + CKD: less CKD progression (HR 0.82) and CV events"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 443
        title: "الـ GLP-1 والـ KDIGO algorithm"
        quote: "Figure 23: Treatment algorithm for selecting glucose-lowering drugs for patients with type 2 diabetes (T2D) and chronic kidney disease (CKD).\nLifestyle therapy:\n  Physical activity, Nutrition, Weight loss\nFirst-line therapy:\n  Metformin: eGFR < 45 Reduce dose; eGFR < 30 Discontinue; Dialysis Discontinue\n  + SGLT2 inhibitor: eGFR < 20 Do not initiate; Dialysis Discontinue\nAdditional drug therapy as needed for glycemic control:\n  GLP-1 receptor agonist (preferred)\n  DPP-4 inhibitor, Insulin, Sulfonylurea, TZD, Alpha-glucosidase inhibitor\n  Guided by patient preferences, comorbidities, eGFR, and cost\n  Includes patients with eGFR < 30 ml/min per 1.73 m2 or treated with dialysis\n  See Figure 25\nKidney icon indicates estimated glomerular filtration rate (eGFR; ml/min per 1.73 m2); dialysis machine icon indicates dialysis. DPP-4, dipeptidyl peptidase-4; GLP-1, glucagon-like peptide-1; SGLT2, sodium–glucose cotransporter-2; TZD, thiazolidinedione."
        text: |
          الـ **GLP-1** بيحمي الكلية: أقل free radicals، **vasodilation**، أقل **inflammation**، وأقل **apoptosis** فأقل **fibrosis**.

          الـ KDIGO (Figure 23):
          1. **Lifestyle:** activity، nutrition، weight loss
          2. **First-line:** ==metformin + sodium–glucose cotransporter 2 (SGLT2) inhibitor==
          3. **Add-on:** **GLP-1 RA (preferred)**، بعدين DPP-4i، insulin، sulfonylurea (SU)، thiazolidinedione (TZD)، alpha-glucosidase inhibitor
      - kind: sort
        page: 443
        quote: "Figure 23: Treatment algorithm for selecting glucose-lowering drugs for patients with type 2 diabetes (T2D) and chronic kidney disease (CKD).\nLifestyle therapy:\n  Physical activity, Nutrition, Weight loss\nFirst-line therapy:\n  Metformin: eGFR < 45 Reduce dose; eGFR < 30 Discontinue; Dialysis Discontinue\n  + SGLT2 inhibitor: eGFR < 20 Do not initiate; Dialysis Discontinue\nAdditional drug therapy as needed for glycemic control:\n  GLP-1 receptor agonist (preferred)\n  DPP-4 inhibitor, Insulin, Sulfonylurea, TZD, Alpha-glucosidase inhibitor\n  Guided by patient preferences, comorbidities, eGFR, and cost\n  Includes patients with eGFR < 30 ml/min per 1.73 m2 or treated with dialysis\n  See Figure 25\nKidney icon indicates estimated glomerular filtration rate (eGFR; ml/min per 1.73 m2); dialysis machine icon indicates dialysis. DPP-4, dipeptidyl peptidase-4; GLP-1, glucagon-like peptide-1; SGLT2, sodium–glucose cotransporter-2; TZD, thiazolidinedione."
        prompt: "حسب Figure 23 و 27 (glucose-lowering drugs in T2D and CKD): إيه اللي يحصل للدوا؟"
