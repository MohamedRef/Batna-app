            <text x="165" y="244" text-anchor="middle" class="t-sm t-mut">No fever, no peritoneal signs, well between attacks</text>
          </svg>
      - kind: order
        page: 381
        quote: "and then gradually disappear over 30 to 90 min, leaving a dull ache."
        prompt: "رتّب نوبة الـ biliary colic زي ما الكتاب حاكيها:"
        steps:
          - "Sudden onset, often after fatty food"
          - "Becomes intense within 15 min to 1 h"
          - "Steady intensity for up to 12 h (usually < 6 h)"
          - "Gradually disappears over 30–90 min"
          - "A dull ache is left behind"
        why: "Sudden → intense في 15 دقيقة لساعة → ثابت لحد 12 ساعة (غالبًا أقل من 6) → يختفي تدريجيًا في 30–90 دقيقة → يسيب dull ache."
      - kind: explain
        page: 381
        quote: "Mild right upper quadrant or epigastric tenderness may be present; peritoneal findings are absent."
        title: "الوجع بيروح فين؟"
        text: |
          **Site**: بيبدأ عادةً في الـ **RUQ**، بس ممكن يبقى في أي حتة في الـ upper abdomen.

          **Localisation**: غالبًا ==poorly localized==، وخصوصًا في الـ **diabetics** والـ **elderly**. ودول بالذات اللي ممكن نفوّت عندهم التشخيص.

          **Radiation**: ممكن للـ **back** أو **down the arm**. والدراع دي اللي بتلخبطه مع القلب، وده سبب إن الـ MI في الـ differential diagnosis.

          **Associated**: nausea شائعة، وأحيانًا vomiting.

          **Fever and chills**: مش بيحصلوا إلا لو حصل **cholecystitis**.

          **Exam**: ممكن mild RUQ or epigastric tenderness، بس ==no peritoneal findings==. وبين النوبات العيان كويس خالص.
      - kind: figure
        page: 390
        title: "الوجع بيبان فين؟"
        image: { file: hb/L19-colic-pain-sites.webp, book: true }
        alt: "Book drawing of biliary colic: a stone stuck in Hartmann's pouch of a distended gallbladder and another stone in the common duct; small figures mark the sites of pain in the upper abdomen and the back below the right shoulder blade; a man bends forward holding his upper abdomen in steady pain."
        caption: |
          - الحصوة واقفة في ==Hartmann's pouch== أو في الـ common duct، والمرارة بتتمدد وراها.
          - النقط على الجسم: الـ RUQ والـ epigastrium، ولورا تحت لوح الكتف اليمين.
          - العيان مايل لقدّام وبيتحرك: الوجع ==steady== مش بيروح ويرجع كل دقيقة.
      - kind: aside
        tone: joke
        page: 382
        quote: "Although biliary-type pain can follow a heavy meal, fatty food is usually a precipitating factor."
        text: |
          عزومة الجمعة: فتة بالسمنة البلدي، وبعدها رقاق، وبعدها "حتة كنافة صغيرة بس".

          الساعة 1 بالليل المرارة بتقولك: «أنا قلتلك **fatty food** is usually a precipitating factor، صفحة 382». 😅

          والسبب مش هزار: الدهون هي اللي بتخلي المرارة تنقبض (أول درس)، والانقباض على حصوة قاعدة في الـ cystic duct هو المغص.
      - kind: reveal
        page: 381
        quote: "Nausea and sometimes vomiting are common, but fever and chills do not occur unless cholecystitishas developed."
        prompt: "ليه الـ **fever** مش جزء من الـ simple biliary colic؟"
        answer: |
          لأن الـ colic انسداد مؤقت بس:
          - المرارة بتنقبض على cystic duct مقفول فبتوجع.
          - لكن مفيش **inflammation** ولا **bacterial infection**.

          الكتاب صريح: fever and chills ==do not occur unless cholecystitis has developed==.

          فاتنين يقولولك إنك خرجت من الـ colic:
          - حرارة
          - الوجع يعدّي 12 ساعة، خصوصًا مع vomiting
      - kind: table
        page: 381
        quote: "Mild right upper quadrant or epigastric tenderness may be present; peritoneal findings are absent."
        title: "Colic ولا cholecystitis؟"
        columns: ["", "Biliary colic", "Acute cholecystitis"]
        rows:
          - ["Duration", "Up to 12 h, usually < 6 h", "> 12 h"]
          - ["Fever, chills", "Absent", "Present with bacterial infection"]
          - ["Abdomen", "Mild tenderness, no peritoneal signs", "Murphy's sign +, tender GB mass"]
          - ["WBC", "—", "High"]
        hide: [[0, 2], [1, 1], [2, 2]]
      - kind: explain
        page: 382
        quote: "Little correlation exists between the severity and frequency of biliary pain and pathologic changes in the gallbladder."
        title: "حاجتين الممتحن بيحب يسألهم"
        text: |
          **Correlation**: فيه ==little correlation== بين شدة وتكرار الوجع وبين الـ pathologic changes في المرارة. يعني وجع شديد مش معناه مرارة بايظة أكتر، والعكس.

          **Pain without inflammation**: **biliary pain can occur in the absence of cholecystitis**.

          **Vague symptoms**: الـ gas والـ bloating والـ nausea كتير بتتربط بأمراض المرارة، بس مش specific.

          وعلامات الالتهاب اللي الكتاب عدّها في صفحة 381:
          - **Shallow respiration**: العيان بيخاف ياخد نفس عميق لأن الحجاب الحاجز بيدوس على المرارة الملتهبة.
          - **Fever**
          - **Jaundice**
          - ==Murphy's sign== positive
          - **Tender mass** at the GB region
          - **High WBC**
