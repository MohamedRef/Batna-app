  status: unverified
- id: res.L20.015
  kind: mcq
  topic: structure
  stem: 'In critical appraisal of a research article, the main article identifiers are all of the following EXCEPT:'
  options:
  - The article title
  - The name and affiliation of the author(s)
  - The year of publication
  - The objective of the study
  answer: 3
  why:
  - The title is the first identifier.
  - The author(s) are an identifier.
  - The year is part of the title of publication.
  - 'Right: the objective belongs to the study type / PICO part, not the identifiers.'
  src:
    page: 11
    quote: "In critical appraisal of a research article, the main article identifiers are all of the following EXCEPT:\nA. The article title\nB. The name and affiliation of the author(s)\nC. The year of\
      \ publication\nD. The objective of the study\nD"
  status: unverified
- id: res.L20.016
  kind: card
  topic: studytype
  front: Why state the type of study right after introducing the article?
  back: Because it sets the stage for determining the quality, reliability and validity of the study as it applies to the clinical domain.
  src:
