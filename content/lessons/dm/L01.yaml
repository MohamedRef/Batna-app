  - id: dm.L01.lesson3
    title: "العيان جالك بإيه؟ بأعراض ولا من غير"
    hook: "رقم 180 هو الحد: فوقه الكلية تستسلم والسكر ينزل في البول وياخد معاه الميه."
    minutes: 8
    pages: [6, 8]
    topics: [hyperglycemia]
    goals:
      - "تفهم ليه الـ renal threshold بيعمل الأعراض"
      - "تشرح الـ 4 Ps (polyuria، polydipsia، polyphagia، weight loss) بالـ mechanism"
      - "تعرف علامات الـ type 2 اللي جاي من غير أعراض"
    status: unverified
    steps:
      - kind: explain
        page: 6
        title: "Hyperglycemia: نوعين"
        quote: "When the blood glucose level reaches above the renal threshold of the individual, which is on average 180mg/dl"
        text: |
          الـ **hyperglycemia** = سكر الدم فوق الطبيعي. وهي يا إما **symptomatic** يا إما **asymptomatic**.

          بتبقى **symptomatic** لما السكر يعدّي ==renal threshold== (في المتوسط **180 mg/dl**)، فيبدأ **polyuria** و **polydipsia**.

          أشهر سبب: **DM، خصوصًا type 1**.
      - kind: figure
        page: 7
        quote: "Polyuria: urine output >2.5 liters/day due to osmotic diuresis."
        title: "من السكر للعطش"
        alt: "Flow: blood glucose above 180 spills into urine, drags water by osmotic diuresis causing polyuria over 2.5 L a day, cells dehydrate causing polydipsia; cells starve of glucose causing polyphagia; fluid loss plus catabolism cause weight loss."
        caption: "سلسلة واحدة بتفسّر الأربع أعراض. الـ ==osmotic diuresis== هو أول حجر."
        svg: |
          <svg viewBox="0 0 330 290" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L01c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="80" y="8" width="170" height="34" rx="10" class="fg-acc"/>
            <text x="165" y="30" text-anchor="middle" class="t-b">BG &gt; 180 mg/dl</text>
            <path d="M165 42 V62" class="fg-arrow" marker-end="url(#L01c)"/>
            <rect x="60" y="64" width="210" height="34" rx="10" class="fg-box"/>
            <text x="165" y="86" text-anchor="middle">Glucose drags water</text>
            <path d="M165 98 V118" class="fg-arrow" marker-end="url(#L01c)"/>
            <rect x="40" y="120" width="250" height="34" rx="10" class="fg-bad"/>
            <text x="165" y="142" text-anchor="middle" class="t-b">Polyuria &gt;2.5 L/day</text>
            <path d="M120 154 L80 182" class="fg-arrow" marker-end="url(#L01c)"/>
            <rect x="10" y="184" width="140" height="44" rx="10" class="fg-box"/>
            <text x="80" y="203" text-anchor="middle" class="t-b">Polydipsia</text>
            <text x="80" y="220" text-anchor="middle" class="t-sm t-mut">cell dehydration</text>
