      - kind: aside
        tone: tip
        page: 190
        quote: "Hepatic malignancy(other than HCC): Hepatoblastoma, hepatic carcinoid. within accepted criteria and without extra hepatic spread, nor vascular invasion."
        text: |
          المحاضرة دي ذكرت Milan بالاسم من غير أرقام. الأرقام موجودة في محاضرة الـ HCC، L18 صفحة 368:

          - ورم واحد 5 cm أو أقل
          - أو من 2 لـ 3 أورام، كل واحد 3 cm أو أقل
          - من غير gross vascular invasion، ولا lymph node، ولا distant metastasis
          - و performance status من 0 لـ 1

          افتكرها ==«5 أو 3×3»==.
      - kind: reveal
        page: 190
        quote: "No extra hepatic spread with normal CT chest and bone scan"
        prompt: "ليه بالذات CT chest و bone scan؟ وليه نهتم بالـ AFP لو الورم صغير؟"
        answer: |
          - الـ HCC لما يطلع برّه الكبد بيروح أكتر حاجة للرئة والعضم، فدول اللي بنصورهم قبل ما نقرر.
          - الحجم مش كل حاجة. الـ AFP العالي بيعني إن **tumour biology** عدوانية: الورم ممكن يبان صغير، بس خلاياه سريعة ومستعدة تنتشر.
          - وبعد الزرع المريض بياخد immunosuppression، ودي بتساعد أي خلية ورم فاضلة إنها تكبر. علشان كده الكتاب حاطط حد: **AFP < 400 ng/ml**.

          التفسير ده منطق مقبول؛ الكتاب كاتب الفحوص والرقم بس.
      - kind: explain
        page: 190
        title: "Bridging therapy: نمسك الورم مكانه"
        quote: "Locoregional Bridging therapy, if possible, is one of options used to manage patients on waiting list till a donor becomes available."
        text: |
          - **Locoregional therapy**: علاج بيتوجّه للورم نفسه جوه الكبد، زي ablation أو chemoembolization، من غير ما نشيل الكبد.
          - ==Bridging therapy==: نفس العلاج ده، بس هدفه إنه «يعدّي» المريض لحد الزرع.

          المريض بيستنى donor، والورم مش بيستنى. لو الورم كبر وهو في الطابور، ممكن يطلع برّه Milan ويخسر مكانه. فبنعالجه موضعيًا علشان يفضل جوه الـ criteria لحد ما الكبد يتوفر.

          الـ bridging زي ما تحط الأكل في التلاجة لحد ما الضيوف يوصلوا: مش بيعالج، بس بيمنع إنه يبوظ.
      - kind: check
        page: 190
        quote: "No extra hepatic spread with normal CT chest and bone scan"
        question: "A cirrhotic has a single 4 cm HCC, normal CT chest and bone scan, no macrovascular invasion, and AFP 650 ng/ml. Can he be listed under the book's criteria?"
        options:
          - "No: AFP must be below 400 ng/ml"
          - "Yes: he is within Milan criteria"
          - "No: a 4 cm tumour is beyond Milan"
          - "Yes, but only after a negative PET scan"
        answer: 0
        why:
          - "صح: الأربع بوابات كلهم لازم يتعدّوا، والـ AFP هنا فوق 400."
          - "الـ Milan بوابة واحدة بس من أربعة؛ الـ AFP وقّعه."
          - "ورم واحد 4 cm جوه Milan (الحد 5 cm لورم واحد)."
          - "الكتاب مش بيطلب PET؛ بيطلب CT chest و bone scan، والـ AFP هو المشكلة."
      - kind: explain
        page: 190
        quote: "Hepatic malignancy(other than HCC): Hepatoblastoma, hepatic carcinoid. within accepted criteria and without extra hepatic spread, nor vascular invasion."
        title: "أمراض تانية بتتعالج بالزرع"
        text: |
          الكتاب بيقسمهم أربع مجموعات:

          - **Cholestatic**: PBC و PSC.
          - **Metabolic**: Hemochromatosis، Alpha1-antitrypsin deficiency، Wilson's disease، Tyrosinemia، Cystic fibrosis.
          - ==Hepatic malignancy other than HCC==: Hepatoblastoma و hepatic carcinoid. بنفس شروط الـ HCC: within accepted criteria، ومن غير extrahepatic spread ولا vascular invasion.
          - **Miscellaneous**: Cryptogenic cirrhosis، Polycystic liver disease، Budd-Chiari syndrome، Amyloidosis.

          تعريف واحد مهم: **Cryptogenic cirrhosis** يعني cirrhosis دورنا على سببها وملقيناش.

          الـ metabolic دي بالذات هتقابلها تاني في L12. الزرع فيها مش بس بيغيّر كبد بايظ، ده بيغيّر المصنع اللي فيه العيب الجيني نفسه، فالمرض غالبًا ميرجعش في الكبد الجديد.
      - kind: match
        page: 190
        quote: "Hepatic malignancy(other than HCC): Hepatoblastoma, hepatic carcinoid. within accepted criteria and without extra hepatic spread, nor vascular invasion."
        prompt: "وصّل كل مرض بالمجموعة بتاعته في الكتاب:"
        pairs:
          - ["PSC", "Cholestatic disorders"]
          - ["Tyrosinemia", "Metabolic diseases"]
          - ["Hepatic carcinoid", "Malignancy other than HCC"]
          - ["Polycystic liver disease", "Miscellaneous"]
        why: "الـ hepatic carcinoid و hepatoblastoma هما الـ malignancy غير الـ HCC، بنفس الشروط: within criteria ومن غير spread ولا vascular invasion."
      - kind: explain
        page: 190
        quote: "Pediatric Indication of LDLT: EHBA 50-60% of cases"
        title: "الأطفال: قايمة لوحدها"
        text: |
          Pediatric indications of LDLT:

          - ==EHBA==: من 50 لـ 60% من الحالات، يعني تقريبًا نص زراعات الأطفال.
          - Familial Intrahepatic Cholestasis، واختصارها FIHC
          - Alagille's syndrome
          - Budd-Chiari syndrome
          - AIH
          - ونادرًا viral hepatitis leading to ESLD

          التعريفات:

          - **EHBA**: extrahepatic biliary atresia، القنوات المرارية برّه الكبد مقفولة أو مش موجودة من الولادة.
          - **FIHC**: عيب وراثي في طلوع الـ bile من خلايا الكبد نفسها، فالـ bile بيتحبس جوه.
          - **Alagille's syndrome**: مرض وراثي فيه القنوات المرارية الصغيرة جوه الكبد قليلة، ومعاه غالبًا مشاكل في القلب.
          - **ESLD**: end-stage liver disease، الكبد وصل لآخر المشوار.

          وفيه كمان metabolic خاصة بالأطفال، صفحة 191: Alpha one antitrypsin deficiency، Tyrosinemia، Hyperoxaluria، Amyloidosis.

          لاحظ إن معظم قايمة الأطفال عيوب خلقية أو وراثية. الطفل ملحقش يشرب ولا ياخد فيروس سنين، فالسبب غالبًا اتولد معاه.
      - kind: aside
        tone: analogy
        page: 190
        quote: "Miscellaneous: Cryptogenic cirrhosis, Polycystic liver disease, Budd-Chiari syndrome, Amyloidosis."
        text: |
          الـ ==biliary atresia== زي شقة جديدة اتسلّمت من غير مواسير صرف.

          الكبد بيعمل bile عادي، بس مفيش طريق يخرج منه. فالـ bile بيرجع يحرق الكبد من جوه، وبيوصل لـ cirrhosis بدري جدًا.

          علشان كده هي أشهر سبب لزرع الكبد في العيال.
      - kind: mnemonic
        page: 191
        quote: "Alpha one antitrypsin deficiency"
        word: "A HAT"
        parts:
          - { key: "A", text: "Alpha one antitrypsin deficiency" }
          - { key: "H", text: "Hyperoxaluria" }
          - { key: "A", text: "Amyloidosis" }
          - { key: "T", text: "Tyrosinemia" }
        hook: |
          العيل الصغير رايح الزرع لابس **A HAT** (طاقية): دي الـ metabolic indications بتاعة الأطفال.
