  - id: hb.L04.lesson6
    title: "منظار وعيان على سيولة: سؤالين وبس"
    hook: "المنظار ده هينزّف قد إيه؟ والعيان ده هيتجلّط قد إيه؟ جاوب على دول، والباقي كله جدول."
    minutes: 10
    pages: [84, 89]
    topics: [endoscopy-antithrombotics]
    goals:
      - "تقسّم الـ endoscopic procedures لـ low وhigh bleeding risk"
      - "تقسّم العيانين لـ low وhigh thrombotic risk"
      - "تعرف تعمل إيه مع aspirin وclopidogrel وwarfarin والـ DOACs قبل وبعد المنظار"
    status: unverified
    steps:
      - kind: explain
        page: 84
        quote: "Inhibiting platelet aggregation (antiplatelet agents) (APA) OR inhibition of coagulation pathway (anticoagulants)."
        title: "القاعدة"
        text: |
          عيانين كتير بيعملوا منظار وهم على **antiplatelets** (بتمنع الـ platelet aggregation) أو **anticoagulants** (بتمنع الـ coagulation pathway)، كـ primary أو secondary prophylaxis.

          الـ **bleeding risk** بتاع المنظار بيعتمد على 3 حاجات:

          - نوع الـ **procedure**.
          - نوع الـ **antiplatelet** أو الـ **anticoagulant**.
          - **Comorbidities** العيان.

          وكل القرار بيتلخص في سؤالين: المنظار ده ==high bleeding risk==؟ والعيان ده ==high thrombotic risk==؟
      - kind: explain
        page: 85
        quote: "Low risk procedures (30-d risk of major bleed ≤ 2%) … High risk procedures (30-d risk of major bleed >2%)"
        title: "السؤال الأول: المنظار هينزّف قد إيه؟"
        text: |
          الحد الفاصل: ==30-day risk of major bleed==:

          - **Low risk: ≤ 2%**: التشخيصي (EGD، colonoscopy ± biopsy، capsule، EUS without FNA)، وكمان شوية حاجات علاجية صغيرة: **APC**، **clipping**، **polypectomy < 1 cm**، و**ERCP with stent or balloon dilation without sphincterotomy**.
          - **High risk: > 2%**: القطع الكبير أو الاستئصال (polypectomy ≥ 1 cm، EMR/ESD/POEM، ampullary resection)، **sphincterotomy**، إبرة (EUS with FNA)، **variceal therapy**، hemostasis، tumour ablation، gastrostomy.

          خلي بالك: مش كل كيّ أو قطع high risk. الـ APC والـ clipping والـ polyp الصغير **low risk** في الجدول.
      - kind: sort
        page: 85
        quote: "Low risk procedures (30-d risk of major bleed ≤ 2%) … High risk procedures (30-d risk of major bleed >2%)"
        prompt: "صنّف حسب **ASGE/ACG 2022**. الـ low risk نسبة الـ major bleed فيه **≤ 2%**، والـ high risk **> 2%**:"
        bins: ["Low risk (≤ 2%)", "High risk (> 2%)"]
        cards:
          - { text: "Diagnostic EGD ± biopsy", bin: 0 }
          - { text: "Capsule endoscopy", bin: 0 }
          - { text: "EUS without FNA", bin: 0 }
          - { text: "Polypectomy < 1 cm", bin: 0 }
          - { text: "Variceal band ligation", bin: 1 }
          - { text: "ERCP with sphincterotomy", bin: 1 }
          - { text: "EUS with FNA", bin: 1 }
          - { text: "Polypectomy ≥ 1 cm", bin: 1 }
          - { text: "Gastrostomy (PEG)", bin: 1 }
          - { text: "EMR / ESD / POEM", bin: 1 }
        why: "الـ high risk: قطع كبير أو استئصال (polypectomy ≥ 1 cm، EMR/ESD)، sphincterotomy، إبرة (FNA)، variceal therapy، أو gastrostomy. والـ polypectomy < 1 cm والـ APC والـ clipping والـ ERCP بـ stent أو balloon من غير sphincterotomy كلهم low risk."
      - kind: aside
        tone: exam
        page: 85
        quote: "High risk: Polypectomy ≥ 1cm, ERCP with sphincterotomy, Treatment of varices, EUS with FNA, Endoscopic hemostasis, Tumor ablation, Gastrostomy, Ampullary resection, EMR; ESD, POEM"
        text: |
          سؤال المحاضرة الرسمي: **Enumerate the high risk endoscopic procedures** (ASGE/ACG 2022):

          polypectomy ≥ 1 cm، ERCP with sphincterotomy، **treatment of varices**، EUS with FNA، endoscopic hemostasis، tumour ablation (including Barrett's)، gastrostomy، ampullary resection، EMR/ESD/POEM.

          والـ ESGE/BSG 2021 بتزوّد: **dilation of strictures** و**RFA for mucosal lesions**.
      - kind: explain
        page: 86
        quote: "May be complicated by Intra-procedural bleeding (self limited, controllable), or delayed post-procedure bleeding (0.07% to 2.2%) (more dangerous)."
        title: "الـ polypectomy بالذات"
        text: |
          فيه نوعين نزيف:

          - **Intra-procedural bleeding**: بيقف لوحده أو بيتسيطر عليه في نفس المنظار.
          - ==Delayed post-procedure bleeding== (0.07–2.2%): الأخطر، لأن العيان بيبقى روّح البيت.

          الـ risk factors للـ delayed bleeding:

          - Age ≥ 65.
          - Cardiovascular أو chronic renal disease.
          - Anticoagulants.
          - Polyp > 1 cm، أو **pedunculated polyp**.
          - Poor bowel preparation.
          - **Pure cutting current**.

          والأدوية: الـ risk قليل مع **aspirin** والـ **NSAIDs**، وأعلى مع **ticlopidine** و**clopidogrel** و**prasugrel** و**ticagrelor** و**warfarin**. ولا واحد فيهم بيأثر على الـ immediate bleeding.
