          - { key: "L", text: "Low ascitic protein (< 1 g/dL)" }
          - { key: "P", text: "Previous SBP episode" }
        hook: |
          اقراها **«BLeeP»** زي صوت المونيتور في العناية: تلات risk factors بس في الكتاب. وزوّد عليهم إن الـ prevalence عالية في **Child-Pugh C**، والـ **long-term PPI** بيزوّد الـ risk لأنه بيكثّر البكتيريا في الأمعاء ويسهّل الـ translocation.
      - kind: aside
        tone: trap
        page: 167
        quote: "SBP is frequently asymptomatic."
        text: |
          الـ SBP **frequently asymptomatic**. ممكن تيجي بـ low-grade fever وألم وقيء وإسهال، بس كتير جدًا بتيجي بس بـ hepatic encephalopathy مش مفهومة أو renal dysfunction جديدة (HRS-AKI).

          علشان كده: كل مريض cirrhosis + ascites داخل المستشفى يتعمله **diagnostic paracentesis**، وكل واحد حالته تسوء.
      - kind: explain
        page: 167
        quote: "elevated absolute polymorphonuclear leukocyte (PMN) count ≥250 cells/mm3 in the ascitic fluid (neutrocytic ascites) with or without a positive ascitic fluid culture"
        title: "التشخيص"
        text: |
          **Who to tap**: كل مريض cirrhosis و ascites داخل المستشفى، وكل مريض حالته بتسوء.

          **الشرط الأساسي**:
          - ==Neutrocytic ascites==: absolute PMN count ≥250 cells/mm³ في الـ ascitic fluid، سواء الـ culture positive أو لأ. يعني مش هتستنى الـ culture علشان تبدأ علاج.

          **صفات تانية**:
          - الـ ascitic protein أقل من 1 g/dl.
          - الـ culture غالبًا ==monomicrobial== و Gram-negative (E. coli و Klebsiella pneumoniae). أقل من كده: Gram-positive زي Streptococcus و Staphylococcus و Enterococci.

          **اختبارات سريعة**:
          - **Leukocyte esterase dipstick**: بيلقط الـ PMN العالي جنب السرير، وحساسيته 100%.
          - **Ascitic procalcitonin** و **calprotectin**: لسه تحت الدراسة.
