  - id: dm.L11.039
    kind: card
    topic: premix
    front: The book's premix curves show what typical problems?
    back: Nocturnal hypoglycemia after the evening dose (helped by a bedtime snack), hypoglycemia before or after a late lunch, and afternoon hyperglycemia; adding a separate lunchtime dose fixes the gap. (The book draws these under the basal-bolus regimen heading.)
