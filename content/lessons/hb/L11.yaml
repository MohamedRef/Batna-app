  - id: hb.L11.lesson2
    title: "مين كمان يستاهل كبد جديد؟"
    hook: "الـ HCC لازم يعدّي 4 بوابات، والعيال ليهم قايمة لوحدهم أولها biliary atresia."
    minutes: 9
    pages: [190, 191]
    topics: [hcc, indications, pediatric]
    goals:
      - "تعدّ الـ 4 شروط علشان مريض HCC يتقبل للـ LDLT"
      - "تعرف يعني إيه bridging therapy وليه"
      - "تقسّم باقي الأمراض اللي بتتعالج بالزرع لمجموعاتها"
      - "تعدّ الـ pediatric indications ومين أشهرهم"
    status: unverified
    steps:
      - kind: explain
        page: 190
        quote: "Within accepted criteria (Milan & San Francisco criteria)"
        title: "الـ HCC: أهم exception"
        text: |
          علشان مريض الـ HCC يدخل الزرع لازم الأربعة دول، مش واحدة منهم:

          - Within accepted criteria: **Milan** و **San Francisco** criteria.
          - No extrahepatic spread: بـ normal CT chest و bone scan.
          - ==No macrovascular invasion== في radiological work up كامل.
          - ==AFP < 400 ng/ml==.

          تعريفين:

          - **Extrahepatic spread**: الورم وصل لمكان برّه الكبد، زي الرئة أو العضم.
          - **Macrovascular invasion**: الورم دخل جوه وريد كبير تقدر تشوفه في الأشعة، زي الـ portal vein. ده معناه إن خلايا الورم بقت في الدم.

          والمنطق: الزرع بيشيل الكبد كله. لو الورم جوه الكبد بس، شلته معاه وخلصت. لو برّه الكبد، أو خلاياه في الدم، الكبد الجديد مش هيعالجه، وممكن الورم يزرع نفسه فيه.
      - kind: figure
