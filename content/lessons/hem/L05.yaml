  - id: hem.L05.lesson6
    title: "الولد اللي ركبته بتورم: hemophilia A و B"
    hook: "ولد بيقع وقعة صغيرة وركبته تتنفخ، وخاله كان زيه. الجين على الـ X، والعلاج تديله اللي ناقصه."
    minutes: 10
    pages: [74, 76]
    topics: [hemophilia]
    goals:
      - "تعرف وراثة الـ hemophilia A ودرجاتها على قد الـ VIII"
      - "تشرح المضاعفات وليه حصلت"
      - "تجاوب سؤال الكتاب: management of hemophilia"
    status: unverified
    steps:
      - kind: explain
        page: 74
        title: "Hemophilia A"
        quote: "Genetics:\n  1. Haemophilia A is inherited as X-linbed recessive disorder affecting males and transmitted by female.\n  2. Deficiency of factor VIII results from an abnormality in factor VIII gene which lies at the tip of the long arm of the x-chromosome (xq2.6 region).\n  3. The plasma level of factor VIII clotting activity (F VIII C) is low or absent, VWF and VWF Ag normal."
        text: |
          - ==X-linked recessive==: بتصيب الرجالة وبتنقلها الستات.
          - الـ **factor VIII gene** على طرف الـ long arm من الـ X.
          - **Factor VIII (FVIII):C** واطي أو مش موجود، و **von Willebrand factor (VWF)** و **VWF Ag** طبيعيين.

          النقطة الأخيرة دي هي اللي بتفرقها عن الـ **von Willebrand disease**: في الاتنين الـ VIII ممكن يبقى واطي، بس في الـ hemophilia A الـ VWF سليم، يعني العيب في جين الـ VIII نفسه.
      - kind: table
        page: 74
        quote: "Clinical features\n  1- Variable according to (VIII activity)\n    VIII activity < 1% - sever bleeds after trival trauma.\n    VIII activity 1-5% - moderate to sever post-traumatic bleeds.\n    Activity 5-25% - mild bleeding tendency, though excessive blood loss may follow surgery.\n  2- Common bleeds:\n    Into-synovial join.\n    Into muscle (especially in sever cases)\n    From gums and teeth sockets\n    Epistaxis"
        title: "الدرجة على قد الـ VIII"
        columns: [Bleeding, "VIII"]
        rows:
          - ["Severe after trivial trauma", "<1%"]
          - ["Moderate–severe after trauma", "1–5%"]
          - ["Mild; bleeds after surgery", "5–25%"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 74
        quote: "Genetics:\n  1. Haemophilia A is inherited as X-linbed recessive disorder affecting males and transmitted by female.\n  2. Deficiency of factor VIII results from an abnormality in factor VIII gene which lies at the tip of the long arm of the x-chromosome (xq2.6 region).\n  3. The plasma level of factor VIII clotting activity (F VIII C) is low or absent, VWF and VWF Ag normal."
        prompt: "الـ hemophilia A ==X-linked recessive==: ليه الـ males بيتصابوا والـ female لأ في الغالب، مع إن الأم هي اللي شايلة الجين؟"
        answer: |
          الولد عنده **X واحد** بس (من أمه). لو فيه الجين المعطوب مفيش X تاني يعوّض.

          البنت عندها **اتنين X**: الطبيعي بيعمل VIII كفاية، فبتبقى ==carrier== وتنقله لنص ولادها الذكور. علشان كده الـ family history بتلاقيه في **خال** الولد.
      - kind: explain
        page: 75
        title: "فين بينزف وإيه المضاعفات؟"
        quote: "Complication\n  1. Arthritis, secondary to repeated haemorrhages\n  2. Peripheral nerve compression and pseudotumour.\n  3. FVIII antibodies/inhibitors in 5-10% of patients.\n  4. Chronic liver disease, related to previous exposure to hepatitis B or C.\n  5. Acquired immunodeficiency syndrome (AIDS) – due to retroviral contamination of FVIII in the early 1980s."
        text: |
          **النزيف**: في الـ ==synovial joints== (hemarthrosis، زي صورة الركبة في الكتاب)، في العضلات (في الـ severe)، من اللثة وخلع الأسنان، و epistaxis.

          ليه المفاصل بالذات؟ التفسير المقبول (مش في الكتاب): الركبة والكوع بيتحركوا ويشيلوا وزن طول اليوم، والـ synovium مليان أوعية رقيقة، فأي إصابة صغيرة تنزف. والدم جوه المفصل بيهيّج الـ synovium فيتورّم وأوعيته تزيد، فينزف تاني بسهولة: دايرة بتخلص بـ **arthritis**.

          **المضاعفات**:
          - **Arthritis** من النزيف المتكرر
          - **Nerve compression** و **pseudotumor**
          - **FVIII inhibitors** في **5–10%**
          - **Chronic liver disease** (HBV، Hepatitis C virus (HCV)) و **acquired immunodeficiency syndrome (AIDS)** من concentrates أوائل الثمانينات

          كل مضاعفة ليها سبب واضح:

          - الـ **arthritis**: من النزيف المتكرر في نفس المفصل.
          - الـ **nerve compression** والـ **pseudotumour**: دم متجمع بيضغط على اللي جنبه.
          - الـ ==inhibitors==: التفسير المقبول (مش في الكتاب): الجسم اللي عمره ما عمل VIII بيشوف الـ VIII اللي بندّيهوله **غريب**، فيعمل antibodies ضده.
          - الـ **hepatitis** والـ **AIDS**: الـ concentrate كان بيتعمل من plasma متبرعين كتير، وقبل ما الفيروسات دي تتفحص كان بينقلها، وده اللي الكتاب بيقوله: retroviral contamination أوائل الثمانينات.
      - kind: figure
        page: 75
        title: "صورة الكتاب: hemarthrosis في الركبة"
        image: { file: hem/L05-haemarthrosis-knee.webp, book: true }
        alt: "Book photograph of a boy's legs: the right knee is large and swollen from a haemarthrosis, the left knee is normal."
        caption: "ركبة يمين منفوخة جنب ركبة شمال طبيعية: ==haemarthrosis== في ولد عنده hemophilia A. ده أشهر مكان للنزيف."
      - kind: check
        page: 75
        quote: "3. FVIII antibodies/inhibitors in 5-10% of patients."
        question: "A man with severe hemophilia A stops responding to his usual factor VIII doses. Most likely cause?"
        options: ["FVIII antibodies (inhibitors)", "Vitamin K deficiency", "Arthritis", "Low VWF"]
        answer: 0
        why:
          - "صح: **5–10%** بيعملوا antibodies ضد الـ VIII، فالجرعة بتتكتّف."
          - "الـ vitamin K مالوش دعوة بالـ VIII."
          - "الـ arthritis مضاعفة، مش سبب إن العلاج يفشل."
          - "الـ VWF طبيعي في الـ hemophilia A."
      - kind: explain
        page: 76
        title: "العلاج"
        quote: "3. Treatment consists of I.V injection of factor VIII in a concentrated form to maintain plasma factor VIII activity between 5 and 100% according to the severity of injury or extent of surgical procedure."
        text: |
          - قبل **أي عملية** (prophylactic)، ومع **أول علامة** نزيف.
          - **IV factor VIII concentrate** يخلّي الـ activity بين **5 و 100%** على حسب الإصابة أو العملية.
          - ==Desmopressin== في الـ **mild**: بيطلّع FVIII من الـ endothelial cells.

          ليه الـ desmopressin للـ mild بس؟ لأنه **مش بيعمل** VIII جديد، هو بيطلّع المخزون من الـ endothelium. الـ mild عنده مخزون (5–25%) يطلع، أما الـ severe (<1%) فمخزونه فاضي.

          **Hemophilia B (Christmas)**: عيب في **factor IX**، زي A في كل حاجة حتى الوراثة، بس أقل بكتير. العلاج **fresh frozen plasma (FFP)** أو **factor IX concentrate**.
      - kind: update
        page: 76
        quote: "3. Treatment consists of I.V injection of factor VIII in a concentrated form to maintain plasma factor VIII activity between 5 and 100% according to the severity of injury or extent of surgical procedure."
        ref: "WFH Guidelines for the Management of Hemophilia, 3rd ed. 2020"
        text: "الكتاب بيدّي **factor VIII concentrate** وقت الحاجة. دلوقتي الـ **regular prophylaxis** هو الـ standard في الـ severe hemophilia (مش on demand بس)، و **emicizumab** (bispecific antibody بيقلّد Activated factor VIII (FVIIIa)) بيتاخد كل أسبوع لشهر، مع أو من غير inhibitors."
