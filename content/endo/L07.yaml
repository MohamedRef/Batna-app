items:
  # ---------- p111: overview, apoplexy ----------
  - id: endo.L07.001
    kind: enumerate
    topic: overview
    prompt: Enumerate the endocrine emergencies covered in the lecture.
    points: [Pituitary apoplexy, Myxedema coma, Thyroid storm, Acute hypocalcemia, Acute hypercalcemia, Acute adrenal insufficiency, Pheochromocytoma crisis]
    pass: 6
    src: { page: 111, quote: "Endocrine Emergencies include" }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.002
    kind: card
    topic: apoplexy
    front: What is pituitary apoplexy, and how common is it in treated adenomas?
    back: Haemorrhage into a pituitary adenoma; rare, but reported in 0.6% to 25% of treated adenomas.
    src: { page: 111, quote: "Pituitary apoplexy results from hemorrhage into a pituitary adenoma." }
    status: unverified
  - id: endo.L07.003
    kind: card
    topic: apoplexy
    front: Which hormone deficiency is the most serious in pituitary apoplexy, and why?
    back: Cortisol deficiency, because it can cause life-threatening hypotension.
    src: { page: 111, quote: "cortisol deficiency is the most serious amongst all hormone deficiencies because it can cause life-threatening hypotension." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.004
    kind: enumerate
    topic: apoplexy
    prompt: Which conditions are associated with pituitary apoplexy?
    points: [Trauma, Hypertension, Cardiac surgery, Dynamic pituitary function tests, Many other conditions]
    pass: 4
    src: { page: 112, quote: "Dynamic pituitary function tests." }
    status: unverified
  # ---------- p112-113: apoplexy clinical and treatment ----------
  - id: endo.L07.005
    kind: enumerate
    topic: apoplexy
    prompt: The usual triad of pituitary apoplexy.
    points: [Sudden severe headache, Diplopia, Features of hypopituitarism]
    pass: 3
    src: { page: 112, quote: "The usual triad for apoplexy is: – Sudden severe headache. – Diplopia. – Features of hypopituitarism." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.006
    kind: enumerate
    topic: apoplexy
    prompt: Symptoms and signs of pituitary apoplexy, evolving over hours or days.
    points: [Sudden severe headache, Visual field defects and visual loss, Nausea and vomiting, Focal neurological deficit, "Altered consciousness, confusion, coma", Shock]
    pass: 5
    src: { page: 112, quote: "Altered conscious level, confusion and even coma." }
    status: unverified
  - id: endo.L07.007
    kind: card
    topic: apoplexy
    front: What is the differential diagnosis of pituitary apoplexy, and how is it settled?
    back: Subarachnoid haemorrhage and bacterial meningitis; brain imaging identifies the pituitary problem.
    src: { page: 112, quote: "This will require imaging of the brain and should identify a pituitary problem." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.008
    kind: card
    topic: apoplexy
    front: Supportive treatment in pituitary apoplexy?
    back: Close observation of vital functions and blood glucose every 1-2 hours; treat cardiovascular collapse with hydrocortisone 100 mg IV every 6 hours in normal saline.
    src: { page: 113, quote: "Treatment of cardiovascular collapse by giving hydrocortisone 100 mg iv every six hours in normal saline." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L07.009
    kind: card
    topic: apoplexy
    front: In hypopituitarism after apoplexy, why must glucocorticoid come before thyroxine?
    back: Thyroxine raises the metabolic rate and would worsen the cardiovascular collapse if cortisol is still lacking.
    src: { page: 113, quote: "it must be given after the administration of glucorticoids, to avoid exacerbation of the cardiovascular collapse" }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.010
    kind: card
    topic: apoplexy
    front: When is early transsphenoidal surgery favoured in apoplexy, and when may it add nothing?
    back: Favoured with visual acuity or field abnormalities (better recovery). With no visual deficit, or one resolving spontaneously, early surgery may not improve neuro-ophthalmic or endocrine outcome over conservative care.
    src: { page: 113, quote: "Routine early transsphenoidal surgery, especially when there are visual acuity or visual field abnormalities, as recovery is greater." }
    status: unverified
  - id: endo.L07.011
    kind: card
    topic: apoplexy
    front: What follow-up do apoplexy patients need once stable?
    back: Full endocrine investigation for hormone replacement, and lifelong follow-up.
    src: { page: 113, quote: "they will require a full endocrine investigation to assess the requirement of hormone replacement, and life- long follow-up will be required." }
    status: unverified
  - id: endo.L07.012
    kind: order
    topic: apoplexy
    prompt: Order the emergency steps in pituitary apoplexy (per the lecture).
    steps: [Observe vital functions and glucose every 1-2 h, Hydrocortisone 100 mg IV 6-hourly in saline, Brain imaging to confirm the pituitary cause, "Thyroxine only after glucocorticoids", Transsphenoidal surgery if visual deficit, Full endocrine work-up and lifelong follow-up]
    src: { page: 113, quote: "Treatment of cardiovascular collapse by giving hydrocortisone 100 mg iv every six hours in normal saline." }
    status: unverified
  - id: endo.L07.013
    kind: mcq
    topic: apoplexy
    stem: A 52-year-old man with a known macroadenoma has a sudden thunderclap headache, diplopia and BP 82/50 mmHg. What should you give first?
    options: [Hydrocortisone 100 mg IV, Levothyroxine IV, Bromocriptine, Nimodipine]
    answer: 0
    why:
      - "Correct: cortisol deficiency causes the life-threatening hypotension; hydrocortisone 100 mg IV 6-hourly."
      - "Thyroxine before steroids can worsen the collapse."
      - "Not part of the lecture's emergency treatment."
      - "That is subarachnoid haemorrhage treatment; imaging will show the pituitary cause."
    src: { page: 113, quote: "Treatment of cardiovascular collapse by giving hydrocortisone 100 mg iv every six hours in normal saline." }
    status: unverified
  # ---------- p113-115: myxedema coma ----------
  - id: endo.L07.014
    kind: card
    topic: myxedema
    front: Define myxedema coma.
    back: Severe hypothyroidism with depressed mental status, hypothermia and reduced function of other organs; an emergency with high mortality.
    src: { page: 113, quote: "It is defined as severe hypothyroidism with: – Depressed mental status. – Hypothermia. – Reduced function of other organs." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.015
    kind: card
    topic: myxedema
    front: What does "myxedema" mean?
    back: Puffiness of the limbs and face from abnormal mucin deposits in the skin and other tissues.
    src: { page: 113, quote: "Myxedema means puffiness of the limbs and face which is due to abnormal deposits of mucin in the skin and other tissues." }
    status: unverified
  - id: endo.L07.016
    kind: enumerate
    topic: myxedema
    prompt: Historical clues to myxedema coma.
    points: [Thyroid surgery, Radioactive iodine, Poor compliance with thyroid hormone]
    pass: 3
    src: { page: 114, quote: "Poor compliance to treatment with thyroid hormone." }
    status: unverified
  - id: endo.L07.017
    kind: enumerate
    topic: myxedema
    prompt: Clinical features of myxedema coma.
    points: [Depressed mental state, Bradycardia, Hypothermia, "Hypotension (prognostic)", "Type 2 respiratory failure (↓O2, ↑CO2)"]
    pass: 5
    src: { page: 114, quote: "Hypotension (has prognostic significance)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.018
    kind: card
    topic: myxedema
    front: Are patients with "myxedema coma" usually comatose?
    back: No; they usually have reduced consciousness, confusion or psychosis rather than coma.
    src: { page: 114, quote: "Rather than a comatose state." }
    status: unverified
  - id: endo.L07.019
    kind: cloze
    topic: myxedema
    text: "In myxedema coma, {{c1::hyponatraemia}} is seen in at least {{c2::50%}}; {{c3::hypoglycaemia}} is another common feature."
    src: { page: 114, quote: "Hyponatremia is common and seen in at least 50% of the patients." }
    status: unverified
    tags: [numbers]
  - id: endo.L07.020
    kind: card
    topic: myxedema
    front: Which patients with hyponatraemia should make you suspect hypothyroidism?
    back: Any patient with a low serum sodium and normal volume status.
    src: { page: 114, quote: "Any patient with a low serum sodium and normal volume status should be suspected of having an underactive thyroid." }
    status: unverified
  - id: endo.L07.021
    kind: card
    topic: myxedema
    front: Which bloods are drawn in suspected myxedema coma, and which extra test is considered?
    back: TSH, free T4 and cortisol; a short synacthen test if possible, since hypoadrenalism may coexist, especially with secondary (pituitary) hypothyroidism.
    src: { page: 115, quote: "a short synacthen test should be considered, as coexisting hypoadrenalism is a possibility" }
    status: unverified
  - id: endo.L07.022
    kind: table
    topic: myxedema
    title: Treatment of myxedema coma
    columns: [Element, Detail]
    rows:
      - [Start, Quickly when suspicion is high]
      - [Thyroid hormone, "T4 200-400 µg/day IV + T3 10 µg three times a day IV"]
      - [Dose adjustment, "Higher for the young, obese and low cardiac risk"]
      - [Steroid cover, "Hydrocortisone 100 mg 8-hourly until hypoadrenalism is excluded"]
      - [Supportive, "Careful warming, correct bradycardia, hypotension (BP and respiration), hyponatraemia; treat the cause"]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 115, quote: "The dose of T4 is between 200 μg and 400 μg per day iv" }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L07.023
    kind: card
    topic: myxedema
    front: What is the crucial aspect of managing myxedema coma, according to the lecture?
    back: Supportive treatment, correcting hypothermia (careful warming), bradycardia, hypotension (BP and respiratory support) and hyponatraemia, and treating the underlying disease.
    src: { page: 115, quote: "The crucial aspect of the management of this condition is supportive treatment by correction of:" }
    status: unverified
  - id: endo.L07.024
    kind: cloze
    topic: myxedema
    text: "Despite aggressive treatment, around {{c1::a third}} of patients with myxedema coma die."
    src: { page: 115, quote: "around a third may succumb to the illness." }
    status: unverified
    tags: [numbers]
  - id: endo.L07.025
    kind: mcq
    topic: myxedema
    stem: A 74-year-old woman who stopped levothyroxine after radioiodine is brought in drowsy with temperature 34°C, pulse 46, BP 85/50, Na 122 mmol/L and PaCO2 62 mmHg. Besides IV T4 and T3, what must be given until adrenal insufficiency is excluded?
    options: [Hydrocortisone 100 mg 8-hourly, Fludrocortisone, Hypertonic saline 3%, Rapid active external rewarming]
    answer: 0
    why:
      - "Correct: steroid cover until hypoadrenalism is excluded."
      - "Mineralocorticoid is not the lecture's cover."
      - "The book corrects hyponatraemia as supportive care but names no hypertonic saline."
      - "The book says careful warming, not rapid."
    src: { page: 115, quote: "Give steroid cover in the form of hydrocortisone 100 mg every eight hours until hypoadrenalism is excluded." }
    status: unverified
  - id: endo.L07.026
    kind: mcq
    topic: myxedema
    stem: Which feature of myxedema coma has prognostic significance?
    options: [Hypotension, Hyponatraemia, Hypoglycaemia, Facial puffiness]
    answer: 0
    why:
      - "Correct, as stated in the lecture."
      - "Common (50%) but not named as prognostic."
      - "Common, not named as prognostic."
      - "That is what myxedema means, not a prognostic sign."
    src: { page: 114, quote: "Hypotension (has prognostic significance)." }
    status: unverified
  # ---------- p115-118: thyroid storm ----------
  - id: endo.L07.027
    kind: enumerate
    topic: storm
    prompt: Enumerate the precipitating events of thyroid storm.
    points: [Surgery, Sepsis, Burns, Diabetic ketoacidosis, Cardiovascular accident, Parturition, Status epilepticus, I-131 treatment, Iodinated contrast]
    pass: 7
    src: { page: 116, quote: "Diabetic ketoacidosis. Cardiovascular accident. Parturition. Status epilepticus. I131 treatment. Iodinated contrast dyes." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.028
    kind: card
    topic: storm
    front: Does thyroxine overdose cause thyroid storm? What is the proposed pathogenesis?
    back: No. Pathogenesis is unclear; acute discharge of T4 and T3 from the gland and inhibition of their binding to globulin are implicated.
    src: { page: 116, quote: "Thyroxine overdose does not cause thyroid storm." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.029
    kind: enumerate
    topic: storm
    prompt: Clinical features of thyroid storm.
    points: ["Fever (38.5°C)", Tachycardia out of proportion to the fever, Confusion, Agitation, Nausea and vomiting, Hypertension, Congestive cardiac failure]
    pass: 6
    src: { page: 116, quote: "Tachycardia out of proportion to the fever." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.030
    kind: card
    topic: storm
    front: Which investigations support thyroid storm?
    back: Thyrotoxic biochemistry (↓TSH, ↑T3, ↑T4) plus raised ALT, alkaline phosphatase and bilirubin.
    src: { page: 117, quote: "Increased alanine transaminase, Increased alkaline phosphatase and Increased bilirubin." }
    status: unverified
  - id: endo.L07.031
    kind: enumerate
    topic: storm
    prompt: The three treatment principles in thyroid storm.
    points: [Decrease production and release of thyroid hormones, Block the effects of circulating T4 and T3, Deal with the precipitant]
    pass: 3
    src: { page: 117, quote: "Decrease the production and release of thyroid hormones, – Block the effects of circulating t4 and t3." }
    status: unverified
  - id: endo.L07.032
    kind: table
    topic: storm
    title: Drugs in thyroid storm (book doses)
    columns: [Aim, Drug and dose]
    rows:
      - [Block synthesis, "Methimazole 20 mg IV 4-6-hourly, then carbimazole 30 mg twice daily; or PTU 200 mg 4-hourly (oral/NG)"]
      - [Block T4 to T3 / release, "Lugol's iodine 0.3 ml in 50 ml 8-hourly for 5 days"]
      - [If iodine allergy, "Lithium carbonate 300 mg 6-hourly, target 1 mmol/l"]
      - [Steroids, "Dexamethasone 4 mg or hydrocortisone 100 mg four times daily IV"]
      - [β-blocker, "Propranolol 80 mg three times daily, or 1 mg/min IV to pulse 100"]
      - [If β-blocker contraindicated, "Calcium-channel blockers or digoxin"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 117, quote: "Lugol‘s iodine: 0.3 ml diluted to 50 ml every 8 hours given orally or via nasogastric tube for 5 days." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L07.033
    kind: card
    topic: storm
    front: Why is PTU an option in thyroid storm, and how else can antithyroid drugs be given?
    back: Besides blocking synthesis, PTU also blocks T4 to T3 conversion. Both methimazole and PTU can be given per rectum.
    src: { page: 117, quote: "Propylthiouracil 200 mg every 4 hours (orally or via nasogastric tube) as it will also block T4 to T3 conversion." }
    status: unverified
  - id: endo.L07.034
    kind: card
    topic: storm
    front: Why is IV sodium iodide not used now in thyroid storm?
    back: Sterile forms are no longer available.
    src: { page: 117, quote: "Sodium iodide was used previously intravenously, but sterile forms are no longer available." }
    status: unverified
  - id: endo.L07.035
    kind: card
    topic: storm
    front: Supportive treatment in thyroid storm, and which antipyretic is avoided?
    back: Vigorous fluids if appropriate, external cooling, paracetamol, HDU care (consider ICU). Avoid salicylates; they inhibit thyroid hormone binding and can worsen the storm.
    src: { page: 118, quote: "Salicylates should be avoided as they inhibit thyroid hormone binding and can worsen the thyroid storm." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.036
    kind: mcq
    topic: storm
    stem: A woman with untreated Graves' disease has an emergency caesarean section. Six hours later she has temperature 39.6°C, pulse 160, agitation and vomiting. For fever, which drug should be avoided?
    options: [Aspirin, Paracetamol, External cooling, Propranolol]
    answer: 0
    why:
      - "Correct: salicylates displace thyroid hormone from binding proteins and worsen the storm."
      - "Paracetamol is the lecture's antipyretic."
      - "External cooling is recommended."
      - "Propranolol is the β-blocker of choice."
    src: { page: 118, quote: "Paracetamol for pyrexia. – Salicylates should be avoided as they inhibit thyroid hormone binding and can worsen the thyroid storm." }
    status: unverified
  - id: endo.L07.037
    kind: mcq
    topic: storm
    stem: In thyroid storm, a patient is allergic to iodine. What can replace Lugol's iodine?
    options: [Lithium carbonate 300 mg 6-hourly, IV sodium iodide, Aspirin, Levothyroxine]
    answer: 0
    why:
      - "Correct, with twice-daily levels until 1 mmol/l."
      - "Also iodine, and sterile forms are no longer available."
      - "Salicylates worsen the storm."
      - "Thyroxine is the wrong direction."
    src: { page: 117, quote: "If patients are allergic to iodine, use instead lithium carbonate 300 mg every 6 hours" }
    status: unverified
  - id: endo.L07.038
    kind: mcq
    topic: storm
    stem: A patient in thyroid storm has severe asthma. Propranolol is contraindicated. What does the lecture suggest for rate control?
    options: [Calcium-channel blockers or digoxin, Higher-dose propranolol IV, Amiodarone, No rate control]
    answer: 0
    why:
      - "Correct."
      - "A β-blocker is contraindicated here."
      - "Not named in the lecture, and an iodine load."
      - "Rate control is part of blocking the hormone's effects."
    src: { page: 118, quote: "If β-blockers are contraindicated, the possible alternatives would include calcium channel blockers or digoxin." }
    status: unverified
  # ---------- p118-120: hypocalcemia ----------
  - id: endo.L07.039
    kind: enumerate
    topic: hypocalcemia
    prompt: Causes of acute hypocalcaemia in the lecture.
    points: ["Low PTH after thyroid, parathyroid or neck surgery", Autoimmune conditions, Renal disease, "Vitamin D deficiency (most common)", "Low magnesium (diuretics, chronic diarrhoea, malabsorption)"]
    pass: 4
    src: { page: 118, quote: "More commonly due to vitamin d deficiency." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.040
    kind: enumerate
    topic: hypocalcemia
    prompt: Clinical features of acute hypocalcaemia.
    points: ["Perioral and peripheral paraesthesia and numbness", "Muscle spasms, especially hands and feet", "Laryngeal spasm: stridor, respiratory failure, death", "Tonic-clonic spasm: convulsions"]
    pass: 3
    src: { page: 119, quote: "Paresthesia and numbness around the mouth and in the extremities." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.041
    kind: table
    topic: hypocalcemia
    title: Lab work-up of hypocalcaemia (per the lecture)
    columns: [Test, Finding]
    rows:
      - [Serum and ionized calcium, Low]
      - [Phosphate, High]
      - [PTH, Low]
      - [Vitamin D, Low]
      - [Renal function, Disturbed]
      - [Magnesium, Low]
    blanks: [[1, 1], [2, 1], [5, 1]]
    src: { page: 119, quote: "High serum phosphate levels," }
    status: unverified
  - id: endo.L07.042
    kind: cloze
    topic: hypocalcemia
    text: "IV calcium may be needed when calcium is below {{c1::7.5 mg/dl}}: {{c2::20 ml of 10% Ca gluconate}} IV at {{c3::2 ml/min}}, repeatable every 4 hours."
    src: { page: 120, quote: "Immediate IV injection of 20 ml of 10% Ca gluconate at a rate of 2 ml/min." }
    status: unverified
    tags: [numbers, high-yield]
  - id: endo.L07.043
    kind: card
    topic: hypocalcemia
    front: How is intractable hypocalcaemia treated IV?
    back: 100 ml of 10% calcium gluconate in 1 litre of 5% dextrose every 4 hours.
    src: { page: 120, quote: "In intractable cases 100 ml of 10% Ca gluconate in 1 liter of 5% dextrose every 4 hours." }
    status: unverified
    tags: [numbers]
  - id: endo.L07.044
    kind: card
    topic: hypocalcemia
    front: Oral maintenance therapy for hypocalcaemia?
    back: "Ca gluconate 1.5-3 g three times daily + vitamin D 50,000-100,000 IU/day, or 1,25(OH)2 vitamin D 4 µg/day."
    src: { page: 120, quote: "Oral therapy with Ca gluconate 1.5-3 g t.d.s. + vitamin D 50,000-100,000 IU/day." }
    status: unverified
  - id: endo.L07.045
    kind: cloze
    topic: hypocalcemia
    text: "In hypoparathyroidism keep serum Ca at {{c1::8-9 mg/dl}} (the lower limit of normal), check it every {{c2::3 months}}, and check urinary Ca."
    src: { page: 120, quote: "Serum Ca should be checked every 3 months and serum Ca should be maintained between 8-9 mg/dl." }
    status: unverified
    tags: [numbers]
  - id: endo.L07.046
    kind: card
    topic: hypocalcemia
    front: How is vitamin D deficiency typically treated?
    back: 50,000 IU of vitamin D2 or D3 weekly for 6-8 weeks.
    src: { page: 120, quote: "Vitamin D deficiency is typically treated with 50,000 IU of vitamin D2 or D3 weekly for 6–8 weeks." }
    status: unverified
  - id: endo.L07.047
    kind: mcq
    topic: hypocalcemia
    stem: A man with chronic diarrhoea and on diuretics has tetany. Calcium is low and magnesium is 0.4 mmol/L. IV calcium gives only a brief response. What should be done?
    options: [Correct hypomagnesaemia first, Give more calcium only, Start calcitriol alone, Give bisphosphonate]
    answer: 0
    why:
      - "Correct: with magnesium deficiency, correct hypomagnesaemia first."
      - "Calcium will not hold while magnesium is low."
      - "Vitamin D does not fix the magnesium problem."
      - "Bisphosphonates lower calcium."
    src: { page: 120, quote: "In patients with hypocalcemia with magnesium deficiency, hypomagnesemia should be corrected first." }
    status: unverified
  - id: endo.L07.048
    kind: mcq
    topic: hypocalcemia
    stem: The day after total thyroidectomy a woman has perioral tingling, carpopedal spasm and stridor. Calcium is 6.8 mg/dl. First step?
    options: [20 ml of 10% calcium gluconate IV at 2 ml/min, Oral calcium 1.5 g, "Vitamin D 50,000 IU weekly", Recheck calcium in 3 months]
    answer: 0
    why:
      - "Correct: symptomatic, calcium below 7.5 mg/dl, laryngeal spasm: immediate IV calcium."
      - "Oral therapy is maintenance, not for stridor."
      - "Too slow for laryngospasm."
      - "That is follow-up for hypoparathyroidism."
    src: { page: 120, quote: "Intravenous calcium replacement may be needed if calcium levels are below 7.5 mg/dl." }
    status: unverified
  # ---------- p120-128: hypercalcemia ----------
  - id: endo.L07.049
    kind: card
    topic: hypercalcemia
    front: Which two causes account for over 90% of hypercalcaemia, and how do they differ?
    back: Primary hyperparathyroidism (PTH-mediated, long-standing) and malignancy (more severe and symptomatic).
    src: { page: 120, quote: "Primary hyperparathyroidism [parathyroid hormone (pth) mediated] which is long standing. – Malignancy (more severe and symptomatic)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.050
    kind: enumerate
    topic: hypercalcemia
    prompt: Other PTH-related causes of hypercalcaemia listed with primary hyperparathyroidism.
    points: ["Tertiary hyperparathyroidism (end-stage renal disease)", Part of MEN, Familial hypocalciuric hypercalcaemia]
    pass: 3
    src: { page: 121, quote: "Familial hypocalciuric hypercalcemia." }
    status: unverified
  - id: endo.L07.051
    kind: enumerate
    topic: hypercalcemia
    prompt: Non-PTH-mediated causes of hypercalcaemia.
    points: [Osteolytic bone metastases and PTHrP, Increased calcitriol by extrarenal conversion, "Increased vitamin D (over-replacement, granulomatous disease)", "Drugs: thiazides, lithium, excess vitamin A", Hyperthyroidism, Acromegaly, Phaeochromocytoma]
    pass: 5
    src: { page: 121, quote: "Osteolytic bone metastases and related to pth- related peptide (pthrp)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.052
    kind: enumerate
    topic: hypercalcemia
    prompt: General manifestations of hypercalcaemia.
    points: [Weakness, Easy fatigue, Weight loss, Generalized bone pain, Renal colics, Dry scaly skin, Pruritus]
    pass: 5
    src: { page: 121, quote: "Weakness. Easy fatigue. Weight loss. Generalized bone pain. Renal colics. Dry and scaly skin. Pruritus." }
    status: unverified
  - id: endo.L07.053
    kind: table
    topic: hypercalcemia
    title: Systemic manifestations of hypercalcaemia
