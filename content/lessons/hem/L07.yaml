  - id: hem.L07.lesson3
    title: "التحاليل والتشخيص: النخاع بيحسم"
    hook: "الـ WBC ممكن يكون عالي أو طبيعي أو واطي، بس النخاع ما بيكدبش."
    minutes: 8
    pages: [110, 111]
    topics: [lab, ddx]
    goals:
      - "تحفظ أرقام الـ lab وقت التشخيص وتعرف ليه الـ WBC الطبيعي ما يستبعدش"
      - "تعرف التشخيص بالنخاع (20–100% blasts)"
      - "تفرّق الـ leukemia عن الـ aplastic anemia والـ leukemoid reaction والـ IM"
    status: unverified
    steps:
      - kind: table
        page: 110
        quote: "Anemia is present in most patients, thrombocytopenia < 20.000 dl. Although most patients are granulocytopenic at diagnosis the total peripheral white cell count is more variable, 25% of patients having very high white counts (> 50,000 per dl), 50%, having WBCs between 5000 to 50,000, and 25% having a low white cell count < 5000."
        title: "الـ WBC وقت التشخيص"
        columns: [WBC per µL, Patients]
        rows:
          - [">50,000", "25%"]
          - ["5,000–50,000", "50%"]
          - ["<5,000", "25%"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: tip
        page: 110
        quote: "Anemia is present in most patients, thrombocytopenia < 20.000 dl. Although most patients are granulocytopenic at diagnosis the total peripheral white cell count is more variable, 25% of patients having very high white counts (> 50,000 per dl), 50%, having WBCs between 5000 to 50,000, and 25% having a low white cell count < 5000."
        text: "**25 / 50 / 25**: ربع عالي، نص في النص، ربع واطي. يعني white blood cell (WBC) طبيعي أو واطي **ما يستبعدش** leukemia. أغلبهم **granulocytopenic** مهما كان الـ total. والـ platelets غالبًا تحت 20,000."
      - kind: explain
        remind: [hem.L07.056]
        page: 110
        title: "التشخيص والـ DD"
        quote: "The diagnosis of acute leukemia is generally established by BM aspiration and biopsy which are usually hypercllular and contain 20 to 100% blast cells."
        text: |
          - الـ **blasts** موجودة في الـ peripheral blood في أغلب الحالات.
          - التشخيص بـ ==bone marrow (BM) aspiration and biopsy==: غالبًا **hypercellular** و **20–100% blasts**.
          - **Hyperuricemia** و **↑lactate dehydrogenase (LDH)**، عشان الخلايا كتير وبتتجدد وبتتكسر بسرعة، فالـ nucleic acids تتكسر لـ uric acid والـ LDH يطلع من جواها (التفسير المقبول، مش في الكتاب).

          ليه النخاع ومش الدم بس؟ لأن 25% من العيانين الـ WBC بتاعهم تحت 5,000، وفيه حالات من غير blasts كتير في الدم. النخاع هو اللي بيدّيك النسبة: ==20–100% blasts==.
      - kind: update
        page: 110
        quote: "The diagnosis of acute leukemia is generally established by BM aspiration and biopsy which are usually hypercllular and contain 20 to 100% blast cells."
        text: "الـ World Health Organization (WHO) 2022 لغى شرط الـ 20% blasts في معظم الـ AML اللي ليها genetic abnormality مميزة، والـ International Consensus Classification (ICC) 2022 خلاه 10%. في الامتحان: **20–100%** زي الكتاب."
        ref: "WHO Classification 5th ed. 2022; International Consensus Classification 2022"
      - kind: figure
        page: 110
        quote: "Leukemia and aplastic anemia can both manifest with peripheral pancytopenia but hypoplastic BM without blasts usually distinguishes aplastic anemia."
