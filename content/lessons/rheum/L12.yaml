            <text x="251" y="204" text-anchor="middle" class="t-sm t-bad">anti-TNF much less effective</text>
          </svg>
      - kind: explain
        page: 209
        title: "الـ IL-6 والـ IVIg"
        quote: "Two open series of 29 patients with systemic arthritis given intravenous tocilizumab, an anti-IL6 receptor antibody, reported significant improvements in the majority of the patients as soon as after the second dose."
        text: |
          - **Tocilizumab** (anti-IL-6 receptor): الكتاب بيقول الـ ==IL-6== مهم في الـ **systemic**، وفي سلسلتين (29 عيان) أغلبهم اتحسنوا **من تاني جرعة**
          - **IVIg**: دراستين controlled ==ما لقوهوش فعال== للـ arthritis في الـ systemic ولا الـ poly، ويمكن يفيد في الـ **systemic features**
          - **Anti-TNF + MTX**: لسه مش واضح إن الاتنين أحسن من واحد، بس الداتا الأولية بتأيد الـ combination. والـ anti-TNF ممكن يبطّأ الـ radiologic damage ويزوّد الـ bone density

          ليه الـ anti-TNF ضعيف في الـ systemic والـ tocilizumab نافع؟ التفسير المقبول (مش في الكتاب): الحمى والـ anaemia والـ thrombocytosis في الـ systemic جايين أساسًا من الـ IL-6 (ومعاه IL-1)، مش من الـ TNF، فاللي يوقف الـ IL-6 بيوقف المحرك.
      - kind: sort
        page: 209
        quote: "Interleukin 6 is also an important cytokine in the pathogenesis of systemic arthritis."
        prompt: "أنهي اختيار للحالة دي؟"
        bins: ["Good choice", "Poor choice"]
        cards:
