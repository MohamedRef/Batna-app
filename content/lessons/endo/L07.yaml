        tone: tip
        page: 135
        quote: "T2-Weighted MRI of the Adrenal Gland in Pheochromocytoma"
        text: "في صور الكتاب: الـ pheo في الـ **T2 MRI** بيبان bright يعني increased signal، والـ **MIBG** بيلقط الـ focus حتى برّه الـ adrenal زي الـ paraganglioma."
      - kind: order
        page: 137
        quote: "it must always be given after the α- blocker to prevent unopposed α-mediated vasoconstriction which may worsen the hypertension."
        prompt: "رتّب علاج الـ pheo hypertensive crisis:"
