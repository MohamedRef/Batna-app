  - id: rheum.L11.lesson3
    title: "Bruton والـ IgA والـ DiGeorge"
    hook: "ولد عنده 7 شهور ولوزه شبه مش موجودة: مصنع الـ antibodies قافل من أول الخط."
    minutes: 8
    pages: [187, 188]
    topics: [bcell, tcell]
    goals:
      - "تعرف XLA وليه بيبان في 5–9 شهور ولوزه صغيرة"
      - "تعرف selective IgA و hyper-IgM وباقي الـ dysgammaglobulinaemias"
      - "تعرف ليه الـ DiGeorge خطر عليه الـ live vaccine"
    status: unverified
    steps:
      - kind: explain
        page: 187
        title: "Bruton (XLA)"
        quote: "Absence or deficiency of a specific enzyme needed for B cell maturation (Bruton's tyrosine kinase) results in no mature B lymphocytes or plasma cells in blood, spleen, lymph nodes, gut, or bone marrow."
        text: |
          نقص ==Bruton's tyrosine kinase== (إنزيم محتاجه الـ B cell عشان ينضج) ← مفيش **mature B cells** ولا plasma cells في أي حتة: دم، طحال، غدد، gut، نخاع.
          - Immunoglobulin M (IgM) و Immunoglobulin A (IgA) و Immunoglobulin D (IgD) و Immunoglobulin E (IgE) مش موجودين، و **Immunoglobulin G (IgG) <10%**
          - الـ **thymus** والـ T cell areas ==طبيعيين==

          ليه "X-linked" بيخليه في الولاد؟ التفسير المقبول (مش في الكتاب): الجين على الـ X، والولد عنده X واحدة، فلو بايظة مفيش نسخة تانية تعوّض. البنت غالبًا carrier.
