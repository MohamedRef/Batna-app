      - kind: case
        page: 175
        quote: "Insulin Regimens for GDM & Pregnancy in Patients with T2DM"
        stem: "A woman with T2DM at 24 weeks weighs 90 kg and is above target on diet and metformin."
        steps:
          - question: "Trimester + weight-based TDD?"
            options: ["72 units (0.8 × 90)", "63 units (0.7 × 90)", "90 units (1 × 90)", "40 units"]
            answer: 0
            why: "الـ 2nd trimester = 0.8 units/kg، يعني 72."
          - question: "How much in the morning?"
            options: ["48 units (2/3)", "24 units (1/3)", "36 units (1/2)", "72 units"]
            answer: 0
            why: "تلتين الـ total daily dose (TDD) الصبح: 48 (منهم 16 سريع و 32 neutral protamine Hagedorn (NPH))."
      - kind: mnemonic
        page: 175
        quote: "Insulin management during labor\n  1. Patients with T1DM require exogenous insulin (injection or infusion) at all times\n  2. Patients in active labor require less insulin per hour than before they were in labor"
        word: "ALL"
        hook: "الإنسولين في الولادة:"
        parts:
          - { key: "A", text: "Always: الـ T1DM محتاجة exogenous insulin طول الوقت" }
          - { key: "L", text: "Less per hour في الـ active labor" }
          - { key: "L", text: "Long-acting الأخيرة لسه شغالة على السكر" }
      - kind: order
        page: 175
        quote: "Bedtime detemir insulin doses should be halved the night before intervention."
        prompt: "رتّب خطوات الإنسولين لقيصرية متحددة:"
        steps:
          - "Pre-supper و bedtime insulins (regular، aspart، lispro، NPH) زي العادي"
          - "Bedtime detemir بالنص الليلة اللي قبلها"
          - "دخول المستشفى قبل الفطار"
          - "Capillary glucose كل ساعة لحد 80-100 mg/dL ثابت"
          - "Infusion ≥0.5 units/h لو السكر >100، وتتعدل كل ساعة"
        why: "الـ detemir بالنص عشان الـ long-acting بيفضل شغال أثناء الولادة. وبعدين نراقب كل ساعة ونبدأ infusion فوق 100."
      - kind: explain
        page: 176
        quote: "Most patients with GDM or T2DM have significant insulin resistance during pregnancy, which immediately decreases following delivery."
        title: "بعد الولادة: الحكاية بتتقلب"
        text: |
          الـ **insulin resistance** بتاعة الحمل ==بتقع فورًا== بعد الولادة (المشيمة خرجت). فالـ infusion يتقفل أو يقل حسب احتياج ما قبل الحمل.

          وممكن الاحتياج يبقى **أقل** من قبل الحمل كمان: لأنها كانت **euglycemic** قريب، وبسبب الـ ==lactation==.

          التفسير المقبول (مش في الكتاب) للتلات أسباب: الـ resistance كانت جاية من **هرمونات المشيمة**، فلما المشيمة تخرج الهرمونات تقع في ساعات. والرضاعة بتسحب glucose كتير لعمل اللبن. ولو كمّلت على جرعات آخر الحمل هتقع في hypoglycemia شديدة بعد الولادة على طول.
      - kind: explain
        page: 175
        title: "ليه الولادة بتقلل الـ insulin؟"
        quote: "Patients in active labor require less insulin per hour than before they were in labor"
        text: |
          الكتاب بيقول تلات حاجات عن الولادة: الـ **T1DM** محتاجة insulin ==at all times==، الـ **active labor** محتاج insulin أقل في الساعة، والـ **long-acting** اللي اتاخد قريب لسه شغال.

          التفسير المقبول (مش في الكتاب):
          - **ليه دايمًا في الـ T1DM**: مفيش insulin من البنكرياس خالص، فلو وقفته ولو ساعات ممكن تدخل **DKA**، والحمل أصلًا ketogenic.
          - **ليه أقل**: الطلق مجهود عضلي جامد زي الرياضة، والعضلات بتسحب glucose من غير insulin كتير، وكمان مفيش أكل.
          - **ليه الـ detemir بالنص**: لأنه long-acting وهيفضل شغال طول يوم العملية والعيانة صايمة، فلو كامل هيعمل hypo.
      - kind: check
        page: 175
        quote: "An insulin infusion of at least 0.5 units per hour should be initiated if blood\n   glucose levels exceed 100 mg/dL, and the dose should be adjusted every hour."
        question: "A woman with T1DM is admitted before a scheduled caesarean. Hourly capillary glucose reads 118 mg/dL. Next step?"
        options:
          - "Start an insulin infusion of at least 0.5 units/h and adjust hourly"
          - "Give her full usual morning detemir dose"
          - "Wait until glucose exceeds 200 mg/dL"
          - "Give oral glucose"
        answer: 0
        why:
          - "صح: فوق 100 ابدأ infusion ≥0.5 units/h، وعدّل كل ساعة لحد 80–100."
          - "الـ detemir اتنصّص الليلة اللي قبلها، والصبح هي صايمة."
          - "الحد في الكتاب 100، مش 200."
          - "هي فوق الهدف، مش تحته."
      - kind: try
        items: [dm.L13.077, dm.L13.080, dm.L13.082, dm.L13.084]
    recap:
      - "TDD: 0.7-1 units/kg أو 0.7/0.8/0.9-1 حسب الـ trimester؛ 2/3 الصبح و 1/3 بالليل."
      - "الولادة: T1DM إنسولين دايمًا (من غيره DKA)، أقل في الساعة (العضلات بتشتغل)؛ detemir بالنص قبل القيصرية؛ infusion ≥0.5 units/h فوق 100."
      - "بعد الولادة الـ resistance بتقع فورًا (المشيمة خرجت)، والـ lactation بتقلل الاحتياج كمان."
