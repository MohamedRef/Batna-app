        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: trap
        page: 348
        quote: "Can occur also with lower blood pressures < 140/90 and this confers worse prognosis."
        text: "الـ **normotensive renal crisis** فخ: الضغط مش عالي قوي، فالدكتور يطمّن، والـ prognosis أوحش. لو عيان diffuse systemic sclerosis (SSc) الـ creatinine بتاعه بيطلع، فكّر في الـ crisis حتى لو الضغط 135/85."
      - kind: mnemonic
        page: 348
        quote: "Rapidly progressive skin thickening within the first 2-3 years.\nSteroid use (prednisone > 15 mg).\nAnti-polymerase III Ab."
        word: "SPAP"
        parts:
          - { key: "S", text: "Skin thickening, rapidly progressive, first 2–3 years" }
          - { key: "P", text: "Prednisone > 15 mg" }
          - { key: "A", text: "Anti-RNA polymerase III antibody" }
          - { key: "P", text: "Pericardial effusion" }
        hook: "**SPAP**: الكلى بتـ «تسبّ» لما يجيلها **S**kin سريع، **P**rednisone عالي، **A**nti-pol III، و**P**ericardial effusion. علشان كده الـ steroids في الـ SSc بجرعة قليلة."
      - kind: case
        page: 348
        quote: "Steroid use (prednisone > 15 mg).\nAnti-polymerase III Ab."
        stem: "42-year-old woman, diffuse SSc for 18 months, anti-RNA polymerase III positive, on prednisone 30 mg for arthritis."
        steps:
          - question: "Which of her features raise the risk of renal crisis?"
            options: ["All three: early diffuse skin, anti-pol III, prednisone > 15 mg", "Only the antibody", "Only the steroid dose", "None; renal crisis is limited-SSc disease"]
            answer: 0
            why: "التلاتة في قائمة الـ risk factors: skin سريع في أول 2–3 سنين، anti-polymerase III، و **prednisone > 15 mg**. والـ renal crisis أكتر في الـ diffuse."
          - reveal: "She now has headache, BP 190/110 (was 120/80) and creatinine has doubled."
            question: "Best first treatment?"
            options: ["ACE inhibitor", "Pulse methylprednisolone", "Cyclophosphamide with plasma exchange", "Stop all antihypertensives"]
            answer: 0
            why: "الـ ACE inhibitors أول حاجة في علاج الـ renal crisis في الكتاب، وبعدها antihypertensives وdialysis وtransplant. الـ steroids عالية الجرعة بتزوّد المشكلة."
      - kind: check
        page: 348
        quote: "Scleroderma Renal Crisis."
        question: "In systemic sclerosis, which is NOT true?"
        options: ["Glomerulonephritis is the main renal complication", "Dysphagia and reflux are recognised features", "Patients may develop pulmonary hypertension and/or fibrosis", "Raynaud phenomenon is a common feature"]
        answer: 0
        why:
          - "صح: الـ renal manifestation الأساسي في الكتاب هو الـ **scleroderma renal crisis** (ضغط فجأة)، مش glomerulonephritis."
          - "الـ esophagus: dysphagia و LES ضعيف ← reflux."
          - "الاتنين نوعين الرئة في الكتاب."
          - "من الـ CREST ومن الـ criteria."
      - kind: explain
        remind: [rheum.L21.030]
        page: 349
        title: "الـ GI"
        quote: "Disordered peristalsis of the lower two thirds of the esophagus presents as dysphagia."
        text: |
          - **Esophagus:** peristalsis بايظ في ==الـ lower two thirds== ← **dysphagia**، و**LES** ضعيف ← reflux
          - **مضاعفات الـ reflux:** erosive esophagitis بنزيف، **Barrett's**، stricture
          - **Stomach:** early satiety، أحياناً gastric outlet obstruction أو acute dilatation
          - **Small bowel:** bloating وcramps وdiarrhea، **malabsorption**، و**bacterial overgrowth** في أماكن الـ stasis

          السبب في الخطوة الجاية: كله من حركة بطيئة.
      - kind: reveal
        page: 349
        quote: "Bacterial overgrowth in areas of intestinal stasis occurs frequently."
        prompt: "عيانة SSc عندها diarrhea و malabsorption. ليه، مع إن المرض «بيحجّر» الأمعاء مش بيسرّعها؟"
        answer: |
          بالظبط علشان بيحجّرها. الـ fibrosis بيخلّي الحركة **بطيئة** (dysmotility)، فيحصل ==stasis==، والكتاب بيقول إن الـ **bacterial overgrowth in areas of intestinal stasis** شائع.

          البكتيريا الزيادة بتعمل:
          - **Bloating** و cramps.
          - **Diarrhea** و **malabsorption** (التفسير المقبول، مش في الكتاب: البكتيريا بتبوّظ الـ bile salts فالدهون ماتتمصّش).

          ونفس المنطق فوق: الـ esophagus مش بيدفع الأكل (**dysphagia**)، والـ **LES** مش بيقفل (**reflux**)، والمعدة بتفضى ببطء (**early satiety**). عضو واحد، مشكلة واحدة: العضلة الملساء اتحجّرت.
      - kind: match
        page: 349
        quote: "Microvascular CAD:\n  Recurrent vasospasm of coronary arteries.\n  Necrosis.\n  Patchy myocardial fibrosis; leads to diastolic > systolic dysfunction."
        prompt: "وصّل شكل القلب بالآلية:"
        pairs:
          - ["Pericardial effusion", "Symptomatic pericarditis in 20%"]
          - ["Microvascular CAD", "Recurrent coronary vasospasm"]
          - ["Patchy myocardial fibrosis", "Diastolic > systolic dysfunction"]
          - ["Myocarditis", "Inflammation then fibrosis"]
          - ["Conduction disease", "Fibrosis of the conduction system"]
        why: "كله في الآخر fibrosis أو vasospasm: نفس مرض الجلد بس جوه القلب."
