lecture: hb.L06
lessons:
  # ------------------------------------------------------------------
  - id: hb.L06.lesson1
    title: "من NAFLD لـ MASLD: الأسامي الجديدة"
    hook: "الكبد الدهني غيّر اسمه. اعرف الشجرة الجديدة، وحسبة الـ alcohol اللي بتفرّق MASLD عن MetALD عن ALD."
    minutes: 9
    pages: [97, 98]
    topics: [nomenclature]
    goals:
      - "تعدّ الـ 3 pathological aspects والـ 5 فروع تحت SLD"
      - "تفرّق MASLD و MetALD و ALD بأرقام الـ alcohol"
      - "تعرف إن معيار واحد من 5 cardiometabolic criteria كفاية"
    status: unverified
    steps:
      - kind: explain
        page: 97
        title: "3 حاجات بتحصل في الكبد"
        text: |
          الكتاب بيبدأ بالـ pathological aspects التلاتة، وكل واحدة خطوة أوحش من اللي قبلها:

          - ==Steatosis==: دهون متخزنة جوه الـ hepatocytes. لوحدها غالبًا هادية.
          - ==Inflammation==: الخلايا المليانة دهون بتتأذي وبتلتهب. ده اللي بيحوّل steatosis لـ NASH.
          - ==Fibrosis==: الالتهاب المستمر بيسيب ندبات (collagen). ودي اللي بتحدد المريض رايح فين.

          والـ spectrum في صورة الكتاب: normal liver، بعدين simple steatosis، بعدين NASH.

          والـ fibrosis نفسها ليها خريطة: بتبدأ حوالين الـ central veins والـ portal tracts، وبعدين الندبات تتوصل ببعض وتعمل **bridges**، وفي الآخر الكبد يتقسم **nodules**، ودي F4 = cirrhosis.
      - kind: figure
        page: 97
        title: "التليف من F1 لـ F4، وتحت الميكروسكوب"
        image: { file: hb/L06-fibrosis-stages.webp, book: true }
        alt: "Book figure. Top: four panels F1 to F4 showing scar tissue laid down around central veins and portal tracts, spreading as strands in F2, bridging in F3 and surrounding nodules in F4. Bottom: three histology slides labelled normal, simple steatosis with many fat vacuoles, and NASH with fat, inflammation and fibrous strands, above an arrow labelled NAFLD spectrum."
        caption: "فوق: الندبات بتبدأ حوالين الـ central vein والـ portal tract (F1–F2)، وبعدين **bridges** (F3)، وبعدين **nodules** (F4). تحت: البقع البيضا في الـ simple steatosis دي دهون، وفي الـ NASH بيزيد عليها التهاب وألياف."
      - kind: reveal
        page: 97
        prompt: "ليه غيّروا اسم NAFLD أصلًا؟ ما كان ماشي!"
        answer: |
          سببين (الكتاب بيقولهم في الـ conclusions):

          - الاسم الجديد بيساعد الدكتور **يحدد السبب بدقة**، أو يعترف إن فيه **أسباب مختلطة** (metabolic + alcohol مثلًا).
          - وبيتجنب الـ **stigmatization**: كلمة «non-alcoholic» بتعرّف المرض باللي هو مش هو، وكلمة «fatty» فيها وصمة.
      - kind: figure
        page: 98
        title: "شجرة الـ SLD"
        alt: "A tree. Steatotic liver disease (SLD) at the top branches into five: MASLD with its steatohepatitis form MASH; MetALD, MASLD with increased alcohol intake; ALD, alcohol-associated liver disease; specific aetiology SLD with DILI, monogenic diseases and miscellaneous; and cryptogenic SLD."
        caption: "SLD هي المظلة. تحتها 5 فروع: **MASLD** (وجواها MASH)، **MetALD**، **ALD**، **Specific aetiology** (DILI، monogenic، misc)، و **Cryptogenic**."
        svg: |
          <svg viewBox="0 0 330 470" xmlns="http://www.w3.org/2000/svg">
            <rect x="40" y="8" width="250" height="44" rx="8" class="fg-good"/>
            <text x="165" y="28" text-anchor="middle" class="t-b">Steatotic Liver Disease</text>
            <text x="165" y="45" text-anchor="middle" class="t-sm t-mut">SLD: the umbrella</text>
            <path d="M24 52V436" class="fg-ink"/>
            <path d="M24 90h20M24 172h20M24 246h20M24 320h20M24 412h20" class="fg-ink"/>
            <rect x="44" y="66" width="280" height="76" rx="8" class="fg-acc"/>
            <text x="54" y="86" class="t-b">MASLD</text>
            <text x="54" y="104" class="t-sm">metabolic dysfunction-associated SLD</text>
            <rect x="64" y="112" width="250" height="24" rx="12" class="fg-thin"/>
            <text x="74" y="129" class="t-sm">MASH = its steatohepatitis form</text>
            <rect x="44" y="152" width="280" height="44" rx="8" class="fg-acc"/>
            <text x="54" y="171" class="t-b">MetALD</text>
            <text x="54" y="188" class="t-sm">MASLD + increased alcohol intake</text>
            <rect x="44" y="226" width="280" height="44" rx="8" class="fg-bad"/>
            <text x="54" y="245" class="t-b t-bad">ALD</text>
            <text x="54" y="262" class="t-sm">alcohol-associated liver disease</text>
            <rect x="44" y="290" width="280" height="76" rx="8" class="fg-box"/>
            <text x="54" y="310" class="t-b">Specific aetiology SLD</text>
            <text x="54" y="330" class="t-sm">DILI (drug-induced liver injury)</text>
            <text x="54" y="348" class="t-sm">monogenic diseases, miscellaneous</text>
            <rect x="44" y="392" width="280" height="44" rx="8" class="fg-thin"/>
            <text x="54" y="411" class="t-b">Cryptogenic SLD</text>
            <text x="54" y="428" class="t-sm t-mut">no criteria, no cause found</text>
            <text x="165" y="462" text-anchor="middle" class="t-sm t-mut">NAFLD → MASLD, NASH → MASH</text>
          </svg>
      - kind: match
        page: 98
        prompt: "وصّل كل وصف بالاسم الجديد:"
        pairs:
          - ["Old name NAFLD", "MASLD"]
          - ["Old name NASH", "MASH"]
          - ["Metabolic criteria plus moderate-heavy alcohol", "MetALD"]
          - ["Steatosis, no criteria, no cause", "Cryptogenic SLD"]
        why: "NAFLD بقت **MASLD** و NASH بقت **MASH**. لو فيه metabolic criteria + alcohol في الـ range المتوسط يبقى **MetALD**. ومن غير criteria ولا سبب: **cryptogenic**."
      - kind: explain
        page: 98
        title: "الـ alcohol: فين الحدود؟"
        text: |
          تخيّل مسطرة الـ alcohol، والـ ==MetALD== في نصها:

          - **تحت الحد التحتاني**: المريض عنده criteria وبيشرب قليل، يبقى **MASLD**.
          - **جوه الـ range**: يبقى MetALD. أوله «MASLD predominant» وآخره «ALD predominant»، يعني كل ما يشرب أكتر الكفة بتميل ناحية الـ alcohol.
          - **فوق الحد الفوقاني**: الـ alcohol هو السبب الأساسي، يبقى **ALD**.

          الفكرة إن الاسم بيقولك السببين موجودين مع بعض، بدل ما تختار واحد وتتجاهل التاني.
      - kind: table
        page: 98
        title: "MetALD alcohol range"
        columns: ["Alcohol intake", "Women", "Men"]
        rows:
          - ["Average daily", "20–50 g", "30–60 g"]
          - ["Weekly", "140–350 g", "210–420 g"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2]]
      - kind: aside
        tone: exam
        page: 98
        text: |
          ماتحفظش 8 أرقام. احفظ الـ **daily** بس واضرب في **7**:

          - Women: 20 × 7 = **140**، و 50 × 7 = **350**.
          - Men: 30 × 7 = **210**، و 60 × 7 = **420**.

          والستات دايمًا الحد أقل (20/50 مقابل 30/60).
      - kind: check
        page: 98
        question: "A 46-year-old man with steatosis, BMI 31 and TG 2.1 mmol/L drinks about 280 g of alcohol a week. Classification?"
        options:
          - "MetALD"
          - "MASLD"
          - "ALD"
          - "Cryptogenic SLD"
        answer: 0
        why:
          - "صح: عنده cardiometabolic criteria، و 280 g/week بين **210 و 420** للرجالة = MetALD (280 ÷ 7 = 40 g/day)."
          - "الـ MASLD الصرف للرجالة تحت **210 g/week**."
          - "الـ ALD فوق **420 g/week** للرجالة."
          - "عنده criteria (BMI و TG)، فمش cryptogenic."
      - kind: explain
        page: 98
        title: "الـ cardiometabolic criteria: واحد من 5 يكفي"
        text: |
          علشان steatosis تتسمّى **MASLD** لازم ==at least 1 out of 5== من الـ adult criteria.

          الخمسة هم مكونات الـ metabolic syndrome المعروفة:

          - الوزن أو الوسط
          - السكر
          - الضغط
          - الـ TG
          - الـ HDL

          وأي واحد منهم يتحسب كمان لو المريض بياخد علاجه (antihypertensive أو lipid-lowering أو علاج سكر). منطقي: الضغط المظبوط بالدوا لسه ضغط.

          الجدول الجاي فيه الأرقام. حاول تفتكرها قبل ما تكشف.
      - kind: table
        page: 98
        title: "Adult cardiometabolic criteria (any 1 of 5)"
        columns: ["Criterion", "Cut-off"]
        rows:
          - ["BMI", "≥ 25 kg/m² (≥ 23 in Asians)"]
          - ["Waist", "> 94 cm men, > 80 cm women"]
          - ["Fasting glucose", "≥ 5.6 mmol/L (100 mg/dL)"]
          - ["HbA1c", "≥ 5.7%"]
          - ["Blood pressure", "≥ 130/85 mmHg or treatment"]
          - ["Triglycerides", "≥ 1.70 mmol/L (150 mg/dL)"]
          - ["HDL", "≤ 1.0 mmol/L men, ≤ 1.3 mmol/L women"]
        hide: [[0, 1], [1, 1], [3, 1], [5, 1], [6, 1]]
      - kind: aside
        tone: analogy
        text: |
          فكّر في الـ criteria زي **كارنيه النادي**: معاك أي كارنيه من الخمسة (وزن، سكر، ضغط، TG، HDL) تدخل نادي **MASLD**. مش محتاج الخمسة، ومش محتاج تبقى metabolic syndrome كاملة.

          ومعاكش ولا كارنيه، ومفيش سبب تاني؟ يبقى **cryptogenic SLD**.
      - kind: check
        page: 98
        question: "Which of these is NOT an adult cardiometabolic criterion for MASLD?"
        options:
          - "Serum ferritin 600 ng/mL"
          - "HbA1c 5.8%"
          - "Waist 96 cm in a man"
          - "HDL 1.2 mmol/L in a woman"
        answer: 0
        why:
          - "صح: الـ ferritin مش من الخمسة."
          - "HbA1c ≥ **5.7%** معيار سكر."
          - "Waist > **94 cm** في الرجالة معيار."
          - "HDL ≤ **1.3 mmol/L** في الستات معيار."
      - kind: try
        items: [hb.L06.004, hb.L06.005, hb.L06.006, hb.L06.009, hb.L06.013]
    recap:
      - "Pathology: **steatosis، inflammation، fibrosis**."
      - "SLD = مظلة لـ **MASLD (MASH)، MetALD، ALD، specific aetiology (DILI، monogenic، misc)، cryptogenic**."
      - "الاسم الجديد: سبب أدق (أو مختلط) ومن غير **stigmatization**."
      - "MetALD daily: **20–50 g** ستات، **30–60 g** رجالة؛ اضرب × 7 تطلع الأسبوعي (140–350، 210–420)."
      - "MASLD = steatosis + **1 من 5** cardiometabolic criteria."
    practice: [hb.L06.001, hb.L06.002, hb.L06.003, hb.L06.004, hb.L06.005, hb.L06.006, hb.L06.007, hb.L06.008, hb.L06.009, hb.L06.010, hb.L06.011, hb.L06.012, hb.L06.013, hb.L06.071, hb.L06.072, hb.L06.082]

  # ------------------------------------------------------------------
  - id: hb.L06.lesson2
    title: "السكر والكبد: الفرخة ولا البيضة؟"
    hook: "مريض سكر الـ ALT بتاعه نضيف... يبقى كبده كويس؟ الكتاب بيقولك: ماتثقش في الإنزيمات."
    minutes: 8
    pages: [99, 103]
    topics: [t2dm, progression]
    goals:
      - "تعرف ليه الـ normal ALT مابيستبعدش NASH في السكر"
      - "ترتّب مسار MASLD من steatosis لـ HCC وتعرف إيه اللي بيرجع"
      - "تشرح العلاقة الـ bidirectional بين MASLD و T2DM"
    status: unverified
    steps:
      - kind: explain
        page: 99
        title: "ماتثقش في الإنزيمات"
        quote: "Hunting for Progressive NAFLD in Type 2 Diabetes: Do Not Trust Liver Enzymes!"
        text: |
          السؤال اللي الكتاب بيسأله: هل الـ normal transaminases بتستبعد مرض في كبد مريض ==T2DM==؟

          الإجابة من دراسة Diabetes Care 2023: مرضى سكر اتعملهم biopsy رغم إن إنزيماتهم واطية (63% منهم ALT أقل من 30 IU/L). والنتيجة: ==NASH== في حوالي 58%، والـ advanced fibrosis كانت موجودة برضه.

          يعني الـ ALT ممكن يبقى «نضيف» والكبد بيتليف في صمت. علشان كده ماتطمّنش مريض السكر من الإنزيمات لوحدها.

          طب نعتمد على إيه؟ الدراسة طلّعت clinical predictors of advanced fibrosis (F3–F4):

          - **GGT** عالي
          - **Waist** كبير: رجالة > 102، ستات > 88 cm
          - **Low HDL**: رجالة < 1.03، ستات < 1.29 mmol/L
          - **FIB-4**، وده هنفصّله في الدرس الجاي
      - kind: check
        page: 99
        question: "A 55-year-old man with type 2 diabetes has ALT 24 IU/L and a bright liver on ultrasound. What does the lecture teach?"
        options:
          - "Normal ALT does not exclude NASH or advanced fibrosis in T2DM"
          - "ALT under 30 IU/L excludes NASH"
          - "Normal ALT means simple steatosis only"
          - "Only biopsy is useful in diabetics"
        answer: 0
        why:
          - "صح: **Do not trust liver enzymes**: NASH كان في حوالي 58% من مرضى سكر إنزيماتهم واطية."
          - "دي بالظبط الغلطة اللي الدراسة بتحذّر منها."
          - "الـ ALT مابيفرقش بين steatosis و NASH و fibrosis هنا."
          - "فيه predictors زي **FIB-4** و GGT و waist؛ مش لازم biopsy للكل."
      - kind: explain
        page: 100
        title: "MASLD: الكبد بتاع الـ metabolic syndrome"
        quote: "MASLD is the hepatic manifestation of metabolic syndrome."
        text: |
          الجملة اللي تفتح بيها أي essay: ==MASLD is the hepatic manifestation of metabolic syndrome==. يعني هي نفس المرض اللي بيعمل سكر وضغط وكوليسترول، بس ظاهر في الكبد.

          ومنها تطلع حاجتين:

          - ==T2DM و obesity== هما أقوى risk factors للـ fibrosis والـ cirrhosis والـ HCC والـ mortality. لو مريضك عنده الاتنين، ده اللي محتاج تدوّر عنده أكتر.
          - والـ MASLD ممكن تسبق و/أو تزوّد الـ T2DM، وتزوّد مضاعفاته كمان. يعني الكبد مش ضحية بس، ده شريك.
      - kind: figure
        page: 100
        title: "مسار MASLD"
        alt: "A vertical pathway. Obesity, insulin resistance and free fatty acids drive normal liver to steatosis. Normal liver, steatosis, MASH and fibrosis are joined by two-headed arrows. Activation of hepatic stellate cells drives MASH to fibrosis. Fibrosis goes one way to cirrhosis and then HCC. MASH also points out to type 2 diabetes and cardiovascular disease."
        caption: "الأسهم اللي بوشين (لحد الـ fibrosis) معناها إن المرحلة **ممكن ترجع**. من الـ cirrhosis للـ HCC السهم في اتجاه واحد. والـ MASH بيطلّع برة الكبد: **T2DM** و **cardiovascular disease**."
        svg: |
          <svg viewBox="0 0 330 560" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L06a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
