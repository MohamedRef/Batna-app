      - kind: explain
        page: 73
        title: "ليه كل تحليل بيشوف حتة مختلفة؟"
        quote: "Hemophilia, christinas"
        text: |
          التفسير المقبول (مش في الكتاب) لفكرة التحاليل التلاتة: المعمل بيبدأ السلسلة من **نقطة مختلفة** في كل أنبوبة، ويقيس الوقت لحد ما الجلطة تتعمل.

          - **PT**: بنضيف **tissue factor**، فالسلسلة تبدأ من الـ extrinsic (VII) وتعدّي على الـ common. يعني الـ PT بيطول لو VII أو X أو V أو II أو fibrinogen ناقص، وده اللي في جدول الكتاب: ==liver disease== و **warfarin**.
          - **APTT**: بنضيف activator للـ contact system، فتبدأ من XII وتعدّي على XI و IX و VIII وبعدين الـ common. عشان كده الـ **hemophilia** (VIII أو IX) بتطوّل الـ APTT لوحده.
          - **Thrombin time**: بنضيف **thrombin** جاهز، فبنقيس آخر خطوة بس. بيطول لو الـ fibrinogen واطي أو مش طبيعي، أو لو فيه حاجة بتوقف الـ thrombin زي الـ ==heparin==، أو الـ DIC.

          الخلاصة: العيب في الـ **common pathway** بيطوّل الـ PT والـ APTT مع بعض.
