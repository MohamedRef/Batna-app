      - kind: check
        page: 6
        quote: "It increases red-cell production mainly by stimulating the rate of conversion of CFU-E to pronormoblasts."
        question: "Where does erythropoietin mainly act?"
        options:
          - "Conversion of CFU-E to pronormoblasts"
          - "Conversion of reticulocyte to erythrocyte"
          - "Self-renewal of the pluripotent stem cell"
          - "Release of platelets into the sinusoids"
        answer: 0
        why:
          - "صح: الكتاب بيقول mainly بيسرّع CFU-E ← pronormoblast."
          - "دي آخر خطوة، والـ EPO بيشتغل قبلها بكتير."
          - "الـ SCF هو اللي على الـ pluripotential cells."
          - "ده شغل الـ megakaryocytes، والـ TPO و IL-11 هما اللي بيزقوه."
      - kind: aside
        tone: exam
        page: 7
        quote: "Each heme group consists of a porphyrin ring with an iron atom in the center."
        text: "شكل ص 7: الـ **haemoglobin** = **4 globin chains**، كل واحدة حوالين **heme**. في الكبار غالبًا **2 alpha + 2 beta**. والـ heme = **porphyrin ring** وفي نصه **ذرة حديد**. هتحتاج الكلام ده جامد في الـ thalassaemia والـ iron deficiency."
      - kind: explain
        page: 7
        title: "الـ platelets بتطلع إزاي؟"
        quote: "The residual \"bare\" megakaryocyte nucleus is phagocytosed by macrophages."
        text: |
          الـ ==megakaryocyte== الناضج **سيتوبلازمه** بيتفتت لعدد كبير من الـ **platelets**، اللي بتنزل على طول في الـ **marrow sinusoids**.

          النواة اللي بتفضل لوحدها (**bare nucleus**) بتاكلها الـ **macrophages**.
      - kind: explain
        page: 7
        title: "Extramedullary haematopoiesis: المصنع القديم يرجع يشتغل"
        quote: "the spleen, liver and lymph nodes revert back to producing immature blood cells"
        text: |
          في ظروف معينة الـ **spleen** والـ **liver** والـ **lymph nodes** بيرجعوا يعملوا خلايا دم صغيرة، فتلاقي ==hepatosplenomegaly== في الكشف.

          ده بيحصل في حالتين:
          1. **نخاع بايظ**: ==myelofibrosis==، أو **infiltration by malignant cells**.
          2. **نخاع مش ملاحق**: زي الـ **severe haemolytic anaemias**.
      - kind: aside
        tone: joke
        page: 7
        quote: "When the bone marrow is unable to meet the demands placed on it, as in severe hemolytic anemias."
        text: "الطحال زي الموظف اللي طلع معاش: أول ما المصنع يقع، بيرجع يلبس البدلة ويشتغل تاني. والنتيجة؟ بيتنفخ من الشغل. 😄"
      - kind: case
        page: 7
        quote: "When the bone marrow becomes dysfunctional in cases such as: myelofibrosis, infiltration by malignant cells."
        stem: "A 58-year-old woman has a huge spleen and a palpable liver. Her marrow aspirate is a dry tap."
        steps:
          - question: "Why are her spleen and liver big?"
            options: ["Extramedullary haematopoiesis", "Portal hypertension only", "Thymic hyperplasia", "Excess EPO"]
            answer: 0
            why: "الطحال والكبد رجعوا يعملوا دم لأن النخاع مش شغال، فكبروا."
          - reveal: "The trephine biopsy shows marrow fibrosis."
            question: "Which of the book's two mechanisms is this?"
            options: ["Dysfunctional marrow", "Marrow unable to meet demand"]
            answer: 0
            why: "الـ **myelofibrosis** مثال الكتاب للنخاع الـ dysfunctional. الـ severe haemolysis هي مثال النخاع اللي مش ملاحق."
      - kind: explain
        page: 8
        title: "ليه الـ HSCs حلوة للـ gene therapy؟"
        quote: "Extensive clinical experience with bone marrow transplantation"
        text: |
          1. **Self-renewal + multilineage differentiation**: خلية واحدة متعدلة تفضل تطلّع الـ transgene لمدة طويلة وفي كل الـ lineages.
          2. **أمراض كتير** (وراثية ومكتسبة) بتبوّظ الـ HSC وولادها، فإصلاح الأصل يصلح الكل.
          3. **خبرة طويلة** في الـ ==bone marrow transplantation==.
          4. (لسه سؤال) ممكن تطلّع **خلايا مش دموية** تروح للأماكن الصح.
      - kind: try
        items: [hem.L01.038, hem.L01.044, hem.L01.048, hem.L01.051, hem.L01.053]
