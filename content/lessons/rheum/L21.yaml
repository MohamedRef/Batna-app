        quote: "D-penicillamine. • Interferon alpha. • Relaxin. • Prostacyclin analouge (Aloprost). • Anticytokine therapy (CAT-192 = anti TGF-β1)."
        text: |
          **Antifibrotic:** **D-penicillamine**، interferon alpha، **relaxin**، prostacyclin analogue (**iloprost**؛ الكتاب كاتبها «Aloprost»)، و==anti TGF-β1== (CAT-192).

          **Under investigation:** **imatinib**، rituximab، IVIG، epigenetic (deacetylase inhibitor)، و oral bovine type 1 collagen للـ tolerance.

          **Biologics تانية:** **tocilizumab** (IL-6R) و**abatacept**.
