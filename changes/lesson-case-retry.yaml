  ar_eg: "في الحالة الصغيرة بقى فيه زرار ↻ تحت كل جزء تحله تاني للتدريب، وأول إجابة بس اللي بتتحسب في الاسكور."
  en: "Mini cases: a ↻ under every answered part lets you re-solve it for practice; only your first answer counts."
- kind: improved
  ar_eg: "السيناريو اللي بعد كل جزء في الحالة بقى في صندوق زي أول الحالة، والتفسير بقى في كارت ملوّن لوحده."
  en: "Follow-up case scenarios now sit in the same box as the case stem, and explanations get their own tinted card."
