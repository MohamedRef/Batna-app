items:
- id: hb.L18.001
  kind: card
  topic: epidemiology
  front: Define hepatocellular carcinoma.
  back: A primary cancer arising from hepatocytes, mostly in a cirrhotic liver (also called hepatoma). Some patients,
    especially with chronic HBV or MASLD, develop it without cirrhosis.
  src:
    page: 340
    quote: a primary cancer arising from hepatocytes in predominantly cirrhotic liver
  status: unverified
- id: hb.L18.002
  kind: card
  topic: epidemiology
  front: Which two patient groups may develop HCC without prior cirrhosis?
  back: Chronic hepatitis B and MASLD (metabolic dysfunction-associated steatotic liver disease).
  src:
    page: 340
    quote: "some patients may not have cirrhosis before developing HCC, especially patients with chronic hepatitis B virus or metabolic dysfunction-associated steatotic"
  status: unverified
- id: hb.L18.003
  kind: cloze
  topic: epidemiology
  text: Worldwide, HCC is the {{c1::sixth}} most common cancer and the {{c2::second}} leading cause of cancer-related
    death.
  src:
    page: 340
    quote: HCC is the sixth most common cause of cancer and the second leading cause of cancer-related death
  status: unverified
- id: hb.L18.004
  kind: cloze
  topic: epidemiology
  text: About {{c1::44%}} of HCC cases worldwide are attributable to chronic {{c2::HBV}} infection, mostly in Asia.
  src:
    page: 340
    quote: 44% of HCC cases worldwide are attributable to chronic HBV infection
  status: unverified
- id: hb.L18.005
  kind: cloze
  topic: epidemiology
  text: HCC is the most common type of liver cancer, accounting for {{c1::75% to 86%}} of cases.
  src:
    page: 340
    quote: HCC is the most common type of liver cancer and accounts for 75% to 86% of cases.
  status: unverified
- id: hb.L18.006
  kind: card
  topic: epidemiology
  front: US liver cancer trend by sex since 2015?
  back: Incidence has stabilised in men but keeps rising in women by about 2% a year (it more than tripled over
    four decades).
  src:
    page: 340
    quote: "the incidence has stabilized in men since 2015 but continues to increase in women by 2% every year."
  status: unverified
- id: hb.L18.007
  kind: card
  topic: epidemiology
  front: Why is HCC more common in men?
  back: Sex-specific prevalence of risk factors, including the trophic effects of androgens.
  src:
    page: 341
    quote: "The increased incidence in men may be due to sex-specific prevalence of risk factors, including the trophic effects of androgens."
  status: unverified
- id: hb.L18.008
  kind: cloze
  topic: epidemiology
  text: 'Mean age at HCC diagnosis: {{c1::60}} years in the US and Europe, 50-60 in Asia, and {{c2::46}} years in
    Africa.'
  src:
    page: 341
    quote: Mean age at diagnosis of HCC is 60 years in the US and Europe, 50-60 years in Asia, and 46 years in Africa
  status: unverified
- id: hb.L18.009
  kind: card
  topic: pathogenesis
  front: What is the major predisposing risk factor for HCC?
  back: Cirrhosis.
  src:
    page: 341
    quote: Cirrhosis is the major predisposing risk factor
  status: unverified
- id: hb.L18.010
  kind: enumerate
  topic: pathogenesis
  prompt: Name the four leading causes of HCC worldwide (the key causes of cirrhosis).
  points:
  - Chronic HBV infection
  - Chronic HCV infection
  - MASLD
  - Alcohol-related liver disease
  pass: 3
  src:
    page: 341
    quote: "the leading causes of HCC worldwide are chronic HBV and HCV infections, MASLD, and alcohol-related liver disease."
  status: unverified
- id: hb.L18.011
  kind: card
  topic: pathogenesis
  front: Fastest growing cause of HCC in the US, the UK and France?
  back: MASLD.
  src:
    page: 341
    quote: MASLD is the fastest growing cause of HCC in the US, the UK, and France
  status: unverified
- id: hb.L18.012
  kind: card
  topic: pathogenesis
  front: Which three factors act synergistically in HCC development?
  back: Heavy alcohol use, viral hepatitis infection and diabetes mellitus.
  src:
    page: 341
    quote: "There is a significant synergistic effect among heavy alcohol consumption, viral hepatitis infection, and diabetes mellitus in the development of HCC."
  status: unverified
- id: hb.L18.013
  kind: card
  topic: pathogenesis
  front: In a patient with no viral hepatitis or heavy alcohol use, what mechanism links diabetes and obesity to
    HCC?
  back: Insulin resistance causing metabolic dysfunction-associated steatohepatitis (MASH, formerly NASH).
  src:
    page: 341
    quote: "Insulin resistance leading to metabolic dysfunction-associated steatohepatitis (previously known as non-alcoholic steatohepatitis) associated with diabetes mellitus, obesity"
  status: unverified
- id: hb.L18.014
  kind: cloze
  topic: pathogenesis
  text: About {{c1::one quarter}} of patients with HCC have no known risk factor.
  src:
    page: 342
    quote: approximately one quarter of patients with HCC have no known risk factors
  status: unverified
- id: hb.L18.015
  kind: card
  topic: pathogenesis
  front: Two HBV-specific carcinogenic mechanisms named in the book?
  back: 'HBV is a direct carcinogen: it may methylate the P16 gene, and mutation of the HBV X gene also plays a
    role.'
  src:
    page: 342
    quote: "HBV is a direct carcinogen and it may cause methylation of the P16 gene"
  status: unverified
- id: hb.L18.016
  kind: card
  topic: pathogenesis
  front: Proposed mechanism of HCV-related HCC?
  back: High estrogen levels and lipid peroxidation. HCV-related HCC almost always arises on cirrhosis.
  src:
    page: 342
    quote: "high levels of estrogen and lipid peroxidation in patients with chronic hepatitis C virus (HCV) may result in the development of the carcinoma."
  status: unverified
- id: hb.L18.017
  kind: card
  topic: pathogenesis
  front: How do chronic viral hepatitis plus metabolic disorders damage DNA?
  back: Oxidative stress generates reactive oxygen species that damage DNA and mutate cancer genes such as p53.
  src:
    page: 342
    quote: "Chronic HBV and HCV infection with metabolic disorders may lead to the generation of reactive oxygen species from oxidative stress"
  status: unverified
- id: hb.L18.018
  kind: cloze
  topic: pathogenesis
  text: Aflatoxin is a mycotoxin from {{c1::Aspergillus}} species; long exposure causes mutations in the {{c2::p53}}
    tumor-suppressor gene.
  src:
    page: 342
    quote: "In patients who have had long-term exposure to aflatoxin, it has been found to cause mutations in the p53 tumor-suppressor gene."
  status: unverified
- id: hb.L18.019
  kind: card
  topic: pathogenesis
  front: Usual first step in HCC pathogenesis?
  back: Development of dysplastic nodules, graded as low-grade or high-grade dysplasia on microscopy.
  src:
    page: 343
    quote: "The pathogenesis of HCC usually begins with the development of dysplastic nodules, which can be classified as high-grade or low-grade dysplasia"
  status: unverified
- id: hb.L18.020
  kind: cloze
  topic: pathogenesis
  text: Almost {{c1::one third}} of high-grade dysplastic nodules become HCC within {{c2::2 years}}; more than {{c3::80%}}
    of dysplastic nodules do so within 5 years.
  src:
    page: 343
    quote: Almost one third of high-grade dysplastic nodules can develop into HCC in a period of 2 years
  status: unverified
- id: hb.L18.021
  kind: enumerate
  topic: risk-factors
  prompt: Enumerate the strong risk factors for HCC.
  points:
  - Cirrhosis
  - Chronic HBV infection
  - Chronic HCV infection
  - Chronic heavy alcohol use
  - Diabetes
  - Obesity
  - Family history of liver cancer
  pass: 5
  src:
    page: 343
    quote: "Strong risk factors Cirrhosis Chronic hepatitis B (HBV) infection Chronic hepatitis C (HCV) infection CHRONIC heavy alcohol use Diabetes Obesity Family history of liver cancer"
  status: unverified
- id: hb.L18.022
  kind: cloze
  topic: risk-factors
  text: More than {{c1::80%}} of patients with HCC have cirrhosis.
  src:
    page: 343
    quote: More than 80% of patients with HCC have cirrhosis
  status: unverified
- id: hb.L18.023
  kind: card
  topic: risk-factors
  front: Which HBV features in the history raise HCC risk (age and carrier state)?
  back: Infection at an early age and the HBV carrier stage.
  src:
    page: 343
    quote: "HBV infection at an early age and HBV carrier stage increases the risk of HCC."
  status: unverified
- id: hb.L18.024
  kind: enumerate
  topic: risk-factors
  prompt: Mention the factors that increase HCC risk in chronic HBV.
  points:
  - HBeAg positivity
  - High HBV DNA level
  - Pre-core / basal core promoter mutation
  - Older age
  - Cirrhosis
  - Elevated aminotransferases
  - High alcohol consumption
  - Co-infection with HCV
  pass: 5
  src:
    page: 344
    quote: "pre-core/basal core promoter mutation, older age, cirrhosis, elevated aminotransferase levels, high alcohol consumption, and co-infection with HCV."
  status: unverified
- id: hb.L18.025
  kind: card
  topic: risk-factors
  front: Key difference between HBV and HCV in the path to HCC?
  back: With HCV, patients almost always develop cirrhosis before HCC; with HBV, HCC can arise without cirrhosis.
  src:
    page: 344
    quote: "Unlike HBV, patients with HCV infection almost always develop cirrhosis before developing HCC."
  status: unverified
- id: hb.L18.026
  kind: cloze
  topic: risk-factors
  text: '{{c1::2% to 20%}} of people with chronic HCV develop cirrhosis, usually over about {{c2::20-25 years}}.'
  src:
    page: 344
    quote: 2% to 20% of people with chronic HCV infection develop cirrhosis, usually over a period of approximately
      20-25 years
  status: unverified
- id: hb.L18.027
  kind: card
  topic: risk-factors
  front: Three things that increase cirrhosis and HCC risk in HCV?
  back: Viral co-infection (HBV or HIV), longer duration of infection, and high alcohol consumption.
  src:
    page: 344
    quote: "Viral co-infection (e.g., HBV or HIV), duration of infection and high alcohol consumption increase the risk of development of cirrhosis"
  status: unverified
- id: hb.L18.028
  kind: cloze
  topic: risk-factors
  text: Alcohol intake of more than {{c1::80 g/day}} for more than {{c2::10 years}} may raise HCC risk {{c3::fivefold}}.
  src:
    page: 344
    quote: Alcohol use >80 g/day for more than 10 years may increase the risk of HCC development fivefold
  status: unverified
- id: hb.L18.029
  kind: cloze
  topic: risk-factors
  text: Diabetes and obesity each cause insulin resistance, which may {{c1::double}} the risk of HCC.
  src:
    page: 344
    quote: "Strong risk factors: Obesity A major cause of insulin resistance, which may double the risk of HCC."
  status: unverified
- id: hb.L18.030
  kind: enumerate
  topic: risk-factors
  prompt: Enumerate the weak risk factors for HCC.
  points:
  - Aflatoxin
  - Thorium dioxide (Thorotrast) contrast
  - Haemochromatosis
  - Cigarette smoking
  - Alpha-1-antitrypsin deficiency
  - Porphyria cutanea tarda
  - PBC
  - PSC
  - Androgenic steroids
  - Oral contraceptives
  - Male sex
  pass: 7
  src:
    page: 345
    quote: "Weak risk factors Aflatoxin Thorium dioxide radioactive contrast Haemochromatosis Cigarette smoking Alpha-1-antitrypsin deficiency Porphyria cutanea tarda Primary biliary cholangitis (PBC) Primary sclerosing cholangitis (PSC)"
  status: unverified
- id: hb.L18.031
  kind: card
  topic: risk-factors
  front: Foods that aflatoxin usually contaminates?
  back: Corn, soya beans and peanuts.
  src:
    page: 345
    quote: "aflatoxin The toxin usually contaminates corn, soya beans, and peanuts and causes mutation of the p53 tumor-suppressor gene"
  status: unverified
- id: hb.L18.032
  kind: cloze
  topic: risk-factors
  text: Thorotrast (thorium dioxide) contrast, used from the 1920s to 1950s, causes HCC after a latent period of
    {{c1::15-25 years}}.
  src:
    page: 345
    quote: causes HCC with a latent period of 15-25 years
  status: unverified
- id: hb.L18.033
  kind: card
  topic: risk-factors
  front: Which organs take up Thorotrast?
  back: Liver, spleen and bone marrow (it has a prolonged half-life).
  src:
    page: 345
    quote: "It has a prolonged half-life and is taken up by liver, spleen, and bone marrow"
  status: unverified
- id: hb.L18.034
  kind: card
  topic: risk-factors
  front: In hepatitis C, which co-existing factor increases HCC risk on the haemochromatosis page?
  back: Iron overload.
  src:
    page: 346
    quote: "Weak risk factors: haemochromatosis Iron overload in patients with hepatitis C virus increases the risk for HCC."
  status: unverified
- id: hb.L18.035
  kind: card
  topic: risk-factors
  front: How does cigarette smoking cause iron overload in the liver?
  back: Through secondary polycythemia.
  src:
    page: 346
    quote: "can also cause iron overload in the liver by secondary polycythemia."
  status: unverified
- id: hb.L18.036
  kind: card
  topic: risk-factors
  front: Gene mutated in alpha-1-antitrypsin deficiency, and how the tissue damage happens?
  back: SERPINA1. Deficient or abnormal alpha-1 antitrypsin lets neutrophil elastase destroy lung and liver cells
    (cirrhosis plus emphysema).
  src:
    page: 346
    quote: "An inherited disorder caused by mutation in the SERPINA1 gene, which results in destruction of lung and liver cells by neutrophil elastase"
  status: unverified
- id: hb.L18.037
  kind: card
  topic: risk-factors
  front: Enzyme deficiency in porphyria cutanea tarda?
  back: Hepatic uroporphyrinogen decarboxylase.
  src:
    page: 346
    quote: "Weak risk factors: porphyria cutanea tarda A blistering skin condition caused by a deficiency of hepatic uroporphyrinogen decarboxylase."
  status: unverified
- id: hb.L18.038
  kind: card
  topic: risk-factors
  front: Which associated factors probably drive the HCC risk in porphyria cutanea tarda?
  back: Hepatitis C, chronic alcohol misuse and iron overload.
  src:
    page: 346
    quote: "This is likely to be influenced by associated risk factors such as hepatitis C infection, chronic alcohol misuse, and iron overload."
  status: unverified
- id: hb.L18.039
  kind: card
  topic: risk-factors
  front: Clinical predictors of HCC in PBC?
  back: Older age, male sex and portal hypertension.
  src:
    page: 346
    quote: "Older age, male sex, and portal hypertension are the clinical predictors for HCC in patients with PBC."
  status: unverified
- id: hb.L18.040
  kind: cloze
  topic: risk-factors
  text: Limited data suggest a lifetime HCC incidence in PSC of {{c1::0.3% to 2.8%}}.
  src:
    page: 347
    quote: a lifetime incidence of 0.3% to 2.8%
  status: unverified
- id: hb.L18.041
  kind: card
  topic: risk-factors
  front: Why do long-term androgenic steroids and oral contraceptives raise liver tumour risk?
  back: Hepatocytes express androgen and estrogen receptors; both hormones stimulate hepatocyte proliferation and
    may induce or promote benign and malignant liver tumours.
  src:
    page: 347
    quote: "Hepatocytes express androgen and estrogen receptors."
  status: unverified
- id: hb.L18.042
  kind: mcq
  topic: risk-factors
  stem: A 58-year-old man with HBV is reviewed in a liver clinic. Which feature listed in the book is a WEAK, not
    a strong, risk factor for HCC?
  options:
  - Type 2 diabetes
  - Obesity
  - Male sex
  - Family history of liver cancer in a first-degree relative
  - Chronic heavy alcohol use
  answer: 2
  why:
  - Diabetes is a strong risk factor (may double HCC risk).
  - Obesity is a strong risk factor (insulin resistance).
  - 'Correct: male sex is on the weak list, probably via androgens.'
  - Family history in a first-degree relative is a strong risk factor.
  - Chronic heavy alcohol use is a strong, independent risk factor.
  src:
    page: 345
    quote: "Haemochromatosis Cigarette smoking Alpha-1-antitrypsin deficiency Porphyria cutanea tarda Primary biliary cholangitis (PBC) Primary sclerosing cholangitis (PSC) Androgenic steroids Oral contraceptives Male sex"
  status: unverified
- id: hb.L18.043
  kind: enumerate
  topic: protective
  prompt: Enumerate the protective factors against HCC.
  points:
  - HBV vaccination
  - Treatment of viral hepatitis
  - Statins
  - Aspirin and other NSAIDs
  - Metformin
  - Coffee
  - Diet (white meat, fish, omega-3, vegetables, vitamin E)
  - Physical activity
  pass: 5
  src:
    page: 347
    quote: "Vaccination for hepatitis B virus (HBV) prevention Treatment for viral hepatitis Medications (Statins, Aspirin and other NSAIDs, Metformin) Lifestyle factors (Coffee, Diet, Physical activity)"
  status: unverified
- id: hb.L18.044
  kind: cloze
  topic: protective
  text: In a meta-analysis of 1.6 million patients, statin users had a {{c1::37%}} lower HCC risk (OR 0.63).
  src:
    page: 348
    quote: statin users had a 37 percent decrease in the risk of developing HCC
  status: unverified
- id: hb.L18.045
  kind: card
  topic: protective
  front: What extra benefit may aspirin for cardiovascular prevention give a patient with chronic liver disease?
  back: A lower risk of HCC (and lower liver-related mortality).
  src:
    page: 348
    quote: "These data suggest that patients with chronic liver disease who take aspirin for cardiovascular prevention may have an additional benefit of reducing HCC risk."
  status: unverified
- id: hb.L18.046
  kind: table
  topic: protective
  title: Protective factors and their effect size in the book (pp. 348-350)
  columns:
  - Factor
  - Effect on HCC risk
  rows:
  - - Statins
    - OR 0.63 (37% lower)
  - - NSAID or antiplatelet use
    - HR 0.51
  - - Metformin (in diabetes)
    - OR 0.50
  - - Regular coffee
    - RR 0.66
  - - Physical activity
    - HR 0.55
  blanks:
  - [0, 1]
  - [1, 1]
  - [2, 1]
  - [3, 1]
  - [4, 1]
  src:
    page: 348
    quote: "statin users had a 37 percent decrease in the risk of developing HCC (odds ratio [OR] 0.63)."
  status: unverified
  tags:
  - numbers
- id: hb.L18.047
  kind: card
  topic: protective
  front: Why is the protective effect of coffee biologically plausible?
  back: Coffee contains large amounts of antioxidants.
  src:
    page: 349
    quote: "Coffee contains large amounts of antioxidants, suggesting biologic plausibility for the protective effect."
  status: unverified
- id: hb.L18.048
  kind: card
  topic: protective
  front: Dietary factors linked to lower HCC risk?
  back: White meat, fish, omega-3 fatty acids, vegetables, and vitamin E intake.
  src:
    page: 349
    quote: "For example, consumption of white meat, fish, omega-3 fatty acids, or vegetables was associated with a reduced HCC risk."
  status: unverified
- id: hb.L18.049
  kind: card
  topic: protective
  front: Possible mechanisms by which exercise lowers HCC risk?
  back: Effects on hepatic glucose and lipid metabolism, and improvement of fatty liver disease.
  src:
    page: 350
    quote: "Possible mechanisms for risk reduction include the effect of exercise on glucose or lipid metabolism in the liver or on improving nonalcoholic fatty liver disease."
  status: unverified
- id: hb.L18.050
  kind: card
  topic: surveillance
  front: Why screen for HCC at all?
  back: The therapeutic window is very narrow and prognosis is poor once symptoms appear; surveillance finds HCC
    at the earliest stage, when cure is most likely.
  src:
    page: 350
    quote: "There is a very narrow therapeutic time frame for patients with HCC, as the prognosis is poor by the time patients have developed symptoms."
  status: unverified
- id: hb.L18.051
  kind: card
  topic: surveillance
  front: What outcomes did one systematic review link to HCC surveillance in cirrhosis?
  back: Better tumour detection, more curative therapy received, and better overall survival.
  src:
    page: 350
    quote: "One systematic review found that HCC surveillance is associated with improved tumor detection, receipt of curative therapy, and overall survival"
  status: unverified
- id: hb.L18.052
  kind: enumerate
  topic: surveillance
  prompt: Whom to screen for HCC (populations in the book)?
  points:
  - Cirrhosis of any etiology
  - Chronic HBV without cirrhosis in the PAGE-B intermediate or high-risk category
  - 'Some societies: non-cirrhotic HCV with bridging fibrosis (F3)'
  pass: 2
  src:
    page: 351
    quote: "Additionally, some societies recommend screening non-cirrhotic patients with HCV who have bridging fibrosis (stage F3, numerous septa without cirrhosis)."
  status: unverified
  tags:
  - high-yield
- id: hb.L18.053
  kind: card
  topic: surveillance
  front: Per EASL and AASLD, which cirrhotic patients should be screened, and what is the exception?
  back: 'Only Child-Pugh A or B. Exception: Child-Pugh C awaiting liver transplantation.'
  src:
    page: 350
    quote: "EASL and AASLD specify that among patients with cirrhosis, only those with Child-Pugh class A or B disease should be screened."
  status: unverified
  tags:
  - high-yield
- id: hb.L18.054
  kind: card
  topic: surveillance
  front: How often does AASLD screen patients listed for transplant, and why?
  back: Twice a year, because finding an early HCC can change their transplant priority.
  src:
    page: 350
    quote: "AASLD specifies that all patients listed for liver transplantation should undergo HCC screening twice a year"
  status: unverified
- id: hb.L18.055
  kind: card
  topic: surveillance
  front: When is HCC surveillance NOT recommended?
  back: In patients with life-limiting comorbid conditions that transplantation cannot cure.
  src:
    page: 351
    quote: "Surveillance is not recommended in patients with life-limiting comorbid conditions that cannot be cured by transplantation."
  status: unverified
- id: hb.L18.056
  kind: cloze
  topic: surveillance
  text: All guidelines recommend {{c1::abdominal ultrasound}} every {{c2::6 months}} as the screening modality of
    choice.
  src:
    page: 351
    quote: abdominal ultrasound is the screening modality of choice and should be performed every 6 months
  status: unverified
  tags:
  - high-yield
- id: hb.L18.057
  kind: card
  topic: surveillance
  front: Can AFP be used alone for HCC surveillance?
  back: No. It may be added to ultrasound to raise sensitivity, but alone it has poor sensitivity and specificity.
  src:
    page: 351
    quote: "but it should not be used alone for surveillance because of its poor sensitivity and specificity."
  status: unverified
- id: hb.L18.058
  kind: card
  topic: surveillance
  front: 'NICE: which patients should have AFP included in surveillance?'
  back: Adults with cirrhosis and concomitant hepatitis B.
  src:
    page: 351
    quote: "NICE specifies that AFP testing should be included for adults with cirrhosis and concomitant hepatitis B."
  status: unverified
- id: hb.L18.059
  kind: card
  topic: surveillance
  front: Name the newer biomarkers being validated for HCC screening.
  back: Des-gamma carboxyprothrombin (DCP), AFP-L3 and human growth factors.
  src:
    page: 351
    quote: "Proteomic technology has led to the development of new molecular biomarkers, including des-gamma carboxyprothrombin (DCP), AFP-L3, and human growth factors."
  status: unverified
- id: hb.L18.060
  kind: card
  topic: surveillance
  front: Which HCV patients without cirrhosis do some societies screen?
  back: Those with bridging fibrosis (F3, numerous septa without cirrhosis).
  src:
    page: 351
    quote: "Additionally, some societies recommend screening non-cirrhotic patients with HCV who have bridging fibrosis (stage F3, numerous septa without cirrhosis)."
  status: unverified
- id: hb.L18.061
  kind: card
  topic: surveillance
  front: What does PAGE-B stand for?
  back: Platelet, Age, GEnder - hepatitis B.
  src:
    page: 352
    quote: "PAGE-B (Platelet, Age, GEnder-hepatitis B) score is based on"
  status: unverified
- id: hb.L18.062
  kind: table
  topic: surveillance
  title: PAGE-B score points
  columns:
  - Item
  - 0 points
  - Other points
  rows:
  - - Age
    - 16-29 y
    - 30-39 = 2, 40-49 = 4, 50-59 = 6, 60-69 = 8, >=70 = 10
  - - Gender
    - Female
    - Male = 6
  - - Platelets (x10^9/L)
    - '>=200'
    - 100-199 = 1, <100 = 2
  blanks:
  - [0, 2]
  - [1, 2]
  - [2, 2]
  src:
    page: 352
    quote: "30-39 years = 2 points, 40-49 years = 4 points, 50-59 years = 6 points, 60-69 years = 8 points"
  status: unverified
  tags:
  - numbers
- id: hb.L18.063
  kind: table
  topic: surveillance
  title: PAGE-B risk categories
  columns:
  - Category
  - Score
  - 5-year HCC incidence
  rows:
  - - Low
    - <=9
    - Almost 0%
  - - Intermediate
    - 10-17
    - 3%
  - - High
    - '>=18'
    - 17%
  blanks:
  - [0, 1]
  - [1, 1]
  - [2, 1]
  - [1, 2]
  - [2, 2]
