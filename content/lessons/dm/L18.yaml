    status: unverified
    steps:
      - kind: explain
        page: 243
        title: "الـ tophaceous gout"
        quote: "Tophi appear as white, yellowish deposits commonly in the external ear, subcutaneous deposits, especially of the finger tips, palms, soles, and around different joints."
        text: |
          قبل العلاج الفعال، **50%** كانوا بيعملوا tophi؛ دلوقتي أقل.
          - **White-yellow deposits:** ==external ear==، fingertips، palms، soles، حوالين المفاصل.
          - بعدين: **Achilles tendon** (fusiform/nodular) و **olecranon bursa** (saccular).
          - **Painless**، بس بتحدد الحركة وهي بتكبر. الجلد **tense، shiny**، وممكن يتقرح ويطلع **chalky material**.
          - **Pathology:** monosodium urate needles + mononuclear و **giant multinucleated cells**.
          - **X-ray:** **punched-out lesions** بـ **overhanging margins**.

          ليه الـ tophi بقت أقل؟ عشان العلاج اللي بينزّل الـ uric acid بقى موجود، فالمخزن ما بيكبرش لحد ما يبان.
      - kind: reveal
        page: 243
        quote: "Tophi appear as white, yellowish deposits commonly in the external ear, subcutaneous deposits, especially of the finger tips, palms, soles, and around different joints."
        prompt: "ليه الـ tophi بتحب الودن وأطراف الصوابع؟ وليه الـ X-ray فيه «overhanging margins»؟"
        answer: |
          - الكتاب بيدّيك الأماكن: ==external ear== و fingertips و palms و soles وحوالين المفاصل.
          - التفسير المقبول (مش في الكتاب): دي أبرد أماكن في الجسم وأقلها دم، والـ urate بيدوب أقل في البرد (زي الـ podagra).
          - **Overhanging margins**: الكتاب بيوصف الـ tophus في الأشعة كـ punched-out lesion بحافة طالعة. التفسير المقبول (مش في الكتاب): الـ tophus بياكل العضم ببطء من بره، والعضم بيحاول يبني حواليه، فالحافة بتطلع زي الشفة فوق الحفرة.

          وليه painless؟ التفسير المقبول (مش في الكتاب): الكريستال جوه الـ tophus متغلّف بخلايا (giant cells)، فمفيش التهاب حاد إلا لو اتكسر.
