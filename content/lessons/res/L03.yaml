            <text x="165" y="228" text-anchor="middle" class="t-sm t-b">Does HRT predispose to</text>
            <text x="165" y="244" text-anchor="middle" class="t-sm t-b">endometrial cancer?</text>
            <path d="M165 254v20" class="fg-arrow-acc" marker-end="url(#L03f1)"/>
            <rect x="60" y="280" width="210" height="40" rx="6" class="fg-ink"/>
            <text x="165" y="305" text-anchor="middle" class="t-sm t-b">How will variables be measured?</text>
          </svg>
      - kind: reveal
        page: 22
        quote: "Examples for research questions:\n  Topic of interest: Physical activity and Cardiovascular disease\n  Narrowed topic: Is there a link between lack of physical activity and hypertension?\n  Focused researchable question: Will 30 minutes of moderate activity daily reduce hypertension in office workers?\nHow variables will be measured??"
        prompt: "جرّب إنت: الموضوع \"Physical activity and cardiovascular disease\". ضيّقه لـ narrowed topic وبعدين focused question."
        answer: |
          - **Narrowed topic:** Is there a link between lack of physical activity and hypertension
          - **Focused researchable question:** ==Will 30 minutes of moderate activity daily reduce hypertension in office workers==

          لاحظ إنه حدد المدة (30 minutes)، الشدة (moderate)، التكرار (daily)، الـ outcome (hypertension) والناس (office workers).
      - kind: mnemonic
        page: 35
        quote: "Key features of well-built questions:\n  FINER Criteria:\n    F: Feasible\n    I: Interesting\n    N: Novel\n    E: Ethical\n    R: Relevant\n  PICO:\n    P: Population\n    I: Intervention\n    C: Comparison\n    O: Outcome Measured"
        word: "FINER"
        parts:
          - { key: "F", text: "Feasible: subjects, time, equipment, expertise, resources" }
          - { key: "I", text: "Interesting: to you and to the scientific community" }
          - { key: "N", text: "Novel: confirms, refutes or extends previous findings" }
          - { key: "E", text: "Ethical: an ethics board would approve it" }
          - { key: "R", text: "Relevant: to knowledge, clinical management, policy, future research" }
        hook: |
          السؤال الكويس **أفْيَن** (FINER = أحسن): كل حرف فلتر، ولو وقع في واحد بس ارجع صلّحه.
      - kind: explain
        page: 25
        quote: "FINER criteria outline the important aspects of the question in general:\n  Intrigues: arouses the curiosity or interest\n  Manageable: not too many or too ambitious"
        title: "صندوق FINER: Intrigues وManageable"
        text: |
          الـ **FINER criteria** بتحدد ==الجوانب المهمة في السؤال ككل==، والصندوق في slide 25 بيلخّص حرفين بكلمة:

          - **Intrigues**: السؤال بيثير الفضول والاهتمام (ده الـ **I**nteresting).
          - **Manageable**: مش أهداف كتير ولا طموح زيادة (ده جزء من الـ **F**easible).

          ليه «manageable» مهمة كده؟ لأن أكتر رسايل بتقف في النص بسبب سؤال أكبر من الوقت والفلوس اللي معاك، مش بسبب سؤال وحش. التفسير المقبول (مش في الكتاب).
      - kind: explain
        remind: [res.L03.034, res.L03.035]
        page: 26
        quote: "Criteria for a good research topic/question: (F) Feasible\n  recruit the number of subjects\n  timeframe\n  equipment, supplies and other\n  required expertise.\n  resources"
        title: "F: Feasible (عملي)"
        text: |
          قبل ما تتحمس، اسأل: هقدر أعمله؟

          - هقدر **recruit the number of subjects**؟
          - الـ **timeframe** يكفي؟
          - الـ **equipment, supplies** موجودة؟
          - عندي الـ **required expertise**؟ والـ **resources**؟

          وفي البوكس بتاع feasible, interesting, novel, ethical, relevant (FINER): ==Manageable== يعني **not too many or too ambitious**.

          الدكتور قال في الشرح: سؤال جذاب بس مش feasible مش بيترمي، بيتضيّق أو يتعدّل لحد ما يبقى قابل للتنفيذ.
      - kind: case
        page: 26
        quote: "Criteria for a good research topic/question: (F) Feasible\n  recruit the number of subjects\n  timeframe\n  equipment, supplies and other\n  required expertise.\n  resources"
        stem: "نائب سنة أولى عايز يعمل recruit لـ 3,000 subjects عندهم hepatic encephalopathy لوحده، والـ timeframe شهرين، والـ equipment (بروتوكول MRI) مش موجودة في المستشفى."
        steps:
          - question: "Which FINER letter fails first?"
            options: ["Feasible", "Interesting", "Novel", "Relevant"]
            answer: 0
            why: "عدد المرضى، الوقت، الجهاز والخبرة: كلها بنود **Feasible**."
          - question: "What should he do?"
            options:
              - "Narrow it: fewer patients, a test he has, a realistic time"
              - "Keep the plan as it is and hope for the best"
              - "Drop the topic and choose an unrelated one"
            answer: 0
            why: "الحل إنك تضيّق السؤال لحد ما يبقى **manageable**، مش إنك ترمي الفكرة."
      - kind: check
        page: 27
        quote: "(I) Interesting: The research topic must be of interest to the investigators & to the scientific community."
        question: "FINER 'Interesting': the topic must be of interest to whom?"
        options:
          - "The investigators and the scientific community"
          - "The funding agency only"
          - "The patients only"
          - "The media"
        answer: 0
        why:
          - "صح: slide 27، to the investigators & to the scientific community. الباحث لازم يكون مهتم علشان يكمّل، والمجتمع العلمي علشان النتيجة تفرق."
          - "الـ funding مهم بس ده تحت الـ feasibility، مش الـ interest."
          - "الـ relevance للمرضى والسياسة حرف تاني: R."
          - "مش مذكور في السلايد."
      - kind: explain
        page: 28
        quote: "(N) Novel: Novel does not necessarily mean that the research has not been done before. The prefix \"re\" in the word research implies searching again."
        title: "I و N: Interesting و Novel"
        text: |
          - **Interesting:** لازم يهم ==the investigators & the scientific community==، مش بس إنت.
          - **Novel:** مش شرط حد ماعملوش قبل كده! البادئة **"re"** في research معناها **searching again**. البحث الجديد ممكن **confirms, refutes or extends previous findings**.

          الدكتور وضّح في الشرح: المهم تبيّن إنت هتضيف إيه أو هتعالج ضعف في الدراسات اللي قبلك. التكرار من غير مبرر مش هو المقصود.
      - kind: aside
        tone: joke
        page: 28
        quote: "(N) Novel: Novel does not necessarily mean that the research has not been done before. The prefix \"re\" in the word research implies searching again."
        text: |
          Research = بندوّر تاني. زي أمك وهي بتدوّر على الريموت في نفس الكنبة للمرة العاشرة، وفي العاشرة بتلاقيه. التكرار مش عيب، المهم تضيف حاجة.
      - kind: try
        items: [res.L03.030, res.L03.034, res.L03.036, res.L03.037]
    recap:
      - "Topic of interest ← narrowed topic ← focused topic ← focused question ← how variables will be measured."
      - "FINER: Feasible، Interesting، Novel، Ethical، Relevant."
      - "Novel مش معناه أول مرة: re-search = searching again (confirm, refute, extend)."
    practice: [res.L03.030, res.L03.031, res.L03.032, res.L03.035, res.L03.036, res.L03.037, res.L03.038, res.L03.051, res.L03.111, res.L03.034]  # ------------------------------------------------------------------
  - id: res.L03.lesson4
    title: "PICOT: السؤال في خمس حروف"
    hook: "مين، عملت فيهم إيه، قارنت بإيه، قست إيه، وفي قد إيه؟ لو جاوبت دول، سؤالك جاهز."
    minutes: 9
    pages: [21, 44]
    topics: [pico, finer]
    goals:
      - "تفكّ أي سؤال لـ P و I و C و O و T"
      - "تعرف إن الـ C هو العنصر الوحيد الاختياري"
      - "تعرف السؤال الوحش من أول قراية"
    status: unverified
    steps:
      - kind: explain
        page: 36
        quote: "Elements of a clinical research question: A \"well-built\" research question should include four elements; referred to as PICO"
        title: "FINER للسؤال كله، و PICO لجسمه"
        text: |
          الـ FINER بتحكم على **the question in general**. أما الـ ==population, intervention, comparison, outcome (PICO)== فهي الـ **elements** اللي لازم تكون جوه أي **well-built** clinical question.

          ولما تضيف الوقت تبقى **population, intervention, comparison, outcome, time (PICOT)**.
      - kind: mnemonic
        page: 39
        quote: "Box 2: PICOT criteria\n| Letter | Element | Question |\n|---|---|---|\n| P | Population (patients) | What specific patient population are you interested in? |\n| I | Intervention (for intervention studies only) | What is your investigational intervention? |\n| C | Comparison group | What is the main alternative to compare with the intervention? |\n| O | Outcome of interest | What do you intend to accomplish, measure, improve or affect? |\n| T | Time | What is the appropriate follow-up time to assess outcome |"
        word: "PICOT"
        parts:
          - { key: "P", text: "Population/patients: what specific patient population? (age, gender, disease status)" }
          - { key: "I", text: "Intervention/exposure: test, treatment, adjunctive therapy, medication" }
          - { key: "C", text: "Comparison: standard of care or placebo (the only optional one)" }
          - { key: "O", text: "Outcome: what you intend to accomplish, measure, improve or affect" }
          - { key: "T", text: "Time: the follow-up time to assess the outcome" }
        hook: |
          اقرأها "**بيكوت**": زي البسكوت اللي بتاكله في النبطشية. خمس حروف، وكل حرف سؤال.
      - kind: explain
        page: 37
        quote: "PICO letters stand for:\n  P: Patient or population. The first step in the PICO process is to identify the patients or population to be studied. More specifically, it describes patients' characteristics, such as age, gender, disease status, or any other patient-related characteristic.\n  I: Intervention to be tested. Identifying the intervention is the second step in the PICO process. It is important to identify the exposure intended to be studied in the research project. This may include the use of a specific diagnostic test, treatment, adjunctive therapy, medication, etc."
        title: "P و I"
        text: |
          - **P** هي أول خطوة: مين المرضى؟ تقدر توصفهم بالـ **age** والـ **gender** والـ **disease status**، أو أي صفة تانية.
          - **I** تاني خطوة: الـ ==exposure== اللي هتدرسه: **diagnostic test, treatment, adjunctive therapy, medication**.

          ملاحظة: في الدراسات اللي مش تجريبية الـ I بتبقى exposure (زي التدخين)، مش علاج إنت بتديه.

          الدكتور أكّد في الشرح: كلمة intervention في PICO ماتخليش كل دراسة trial. ممكن تبقى risk factor بتلاحظه بس، والـ C ساعات بتبقى **no exposure** (في مثال الستات المدخنات: C = No smoking).
      - kind: aside
        tone: exam
        page: 38
        quote: "C: Comparison used in the research project. It is the alternative exposure to which the intervention will be compared, which might be the standard of care or a placebo. The comparison component is the only optional one in the PICO question, since the researcher might study the intervention alone because either due to no interest in comparison or the lack of a comparable group.\nO: Outcome to be measured as a result of the intervention. It is the evaluation of the intervention's effect. This may include cure or level of control of a disease, efficacy of a medication or a diagnostic test, etc."
        text: |
          ==C is the only optional element==. الباحث ممكن يدرس الـ intervention لوحده لسببين: **no interest in comparison** أو **lack of a comparable group**.

          الـ C لما يكون موجود بيبقى **standard of care** أو **placebo**.
      - kind: explain
        page: 38
        quote: "C: Comparison used in the research project. It is the alternative exposure to which the intervention will be compared, which might be the standard of care or a placebo. The comparison component is the only optional one in the PICO question, since the researcher might study the intervention alone because either due to no interest in comparison or the lack of a comparable group.\nO: Outcome to be measured as a result of the intervention. It is the evaluation of the intervention's effect. This may include cure or level of control of a disease, efficacy of a medication or a diagnostic test, etc."
        title: "O و T"
        text: |
          - **O** هو ==the evaluation of the intervention's effect==: cure، level of control of a disease، efficacy of a medication or a diagnostic test.
          - **T** هو الـ **appropriate follow-up time** اللي تقيس فيه الـ outcome.
      - kind: figure
        page: 40
        quote: "Finding the right research question is the first step to successful publication. Using PICOT to build the research question:\n  P: Age (adult patients)\n  I: Multimodal treatment (epidural analgesia in combination with acetaminophen and NSAIDs)\n  C: Single-modal treatment (e.g. epidural alone)\n  O: Pain score (and nausea or vomiting)\n  T: Over 24 hours following surgery\nResearch Question: In adult patients undergoing elective surgery, does treatment with epidural analgesia in combination with acetaminophen and NSAIDs (multi-modal analgesia) compared with epidural alone (single-modal) lead to better pain scores and less side-effects (i.e. nausea or moving) over 24 hours following surgery?"
