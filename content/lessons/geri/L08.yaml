          - الـ **obesity** بتزوّد الحِمل على أوتار الرجل، وكمان بتعمل **inflammation** و metabolic changes بتضعف الوتر (افتكر نفس الكلام في الـ sarcopenia).
          - **السن** بيقلل قدرة الوتر على الإصلاح.
          - والـ **extrinsic**: الرجل بتتعب من **الوزن** (weight bearing)، والإيد من **الحركة الزيادة** (overload movements) زي الشيل فوق الراس. يعني اسأل العيان عن شغله وحركته، مش بس عن وزنه.
