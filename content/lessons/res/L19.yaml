    quote: |-
      EBM - What is it?
      Clinical Expertise
      Research Evidence
      Patient Preferences
    question: 'In the EBM Venn diagram, EBM sits at the overlap of research evidence, patient preferences and:'
    options:
    - Clinical expertise
