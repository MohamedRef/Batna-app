      - kind: explain
        remind: [hb.L06.046]
        page: 106
        quote: "1- Vitamin E and vitamin C: vitamin E is only recommended in adults with NASH who do not have diabetes or cirrhosis."
        title: "Antioxidants"
        text: |
          ليه antioxidants أصلًا؟ الخلية المليانة دهون بتطلّع oxidative stress، وده جزء من اللي بيحوّل steatosis لـ non-alcoholic steatohepatitis (NASH). (ربط physiology مقبول.) الكتاب بيعدّ:

          - **Vitamin E و vitamin C**: والـ vitamin E بالذات ==only recommended in adults with NASH who do not have diabetes or cirrhosis==.
          - **Resveratrol**: natural phenol موجود في قشر العنب الأحمر.
          - **Green tea extract**: قلّل زيادة الوزن، والدهون الكلية والـ visceral، والـ insulin resistance (IR)، والـ steatosis، والـ cholesterol.
          - **Coffee**: بيقلل خطر type 2 diabetes mellitus (T2DM)، ومرتبط بـ less fibrosis in NASH.
          - **Garlic**: فيه S-allylmercaptocysteine (SAMC)، وليه دور في diabetes mellitus (DM) و NASH.
          - **Ginger**: مذكور في القايمة من غير تفاصيل.
      - kind: aside
        tone: trap
        page: 106
        quote: "1- Vitamin E and vitamin C: vitamin E is only recommended in adults with NASH who do not have diabetes or cirrhosis"
        text: |
          الـ **vitamin E** هو الوحيد في القايمة اللي الكتاب قال عليه **recommended**، وبشروط تلاتة:

          **adult** + **NASH** + **مفيش diabetes ولا cirrhosis**.

          لو المريض في السؤال عنده سكر أو cirrhosis، الـ vitamin E غلط.
