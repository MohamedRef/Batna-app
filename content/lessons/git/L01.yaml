        text: |
          - ==DU : GU = 4:1==.
          - أكتر من **90%** من الـ DU في **first part of the duodenum**.
          - الـ GU أكتر حاجة على الـ **lesser curvature** جنب الـ **incisura angularis**.
          - الـ prevalence: **0.12% to 4.7%** physician-diagnosed، و **0.1% to 2.6%** hospital-diagnosed.

          ليه الـ first part بالذات؟ التفسير المقبول (مش في الكتاب): ده أول مكان الحمض بيخبط فيه وهو خارج من الـ pylorus، قبل ما الـ bicarbonate بتاع البنكرياس يوصل ويعادله تحت.
      - kind: table
