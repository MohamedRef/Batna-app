    kind: cloze
    topic: aki-epi
    text: "In pregnancy GFR rises by {{c1::40-60%}}, so the normal serum creatinine is about {{c2::0.4-0.6 mg/dL}}."
    src: { page: 354, quote: "While AKI in the general population is well defined by the RIFLE (Risk, Injury, Failure, Loss and End stage) criteria, the KDIGO (Kidney Disease Improving Outcomes) guidelines and the AKI Network (AKIN) criteria, pregnancy-related AKI is difficult to determine due to non-validation of these AKI diagnostic criteria in the pregnant population.(9) Pregnancy results in an increase in blood volume, a decrease in systemic vascular resistance, and an increase in cardiac output. In the setting of hyper filtration, intra renal vasodilation and an increase in effective plasma flow, glomerular filtration rate increases by 40–60%, resulting in a physiological reduction in serum creatinine.(10) The normal level of serum creatinine in pregnancy is lower than the baseline usually ranging between 0.4 and 0.6 mg/dL range. Due to the lower baseline creatinine in pregnancy, the detection of AKI is further confounded.(11) Often, a serum creatinine value is unavailable prior to pregnancy. This, along with limited accuracy of the current AKI diagnostic criteria in the general population, makes the early and accurate diagnosis of AKI in pregnancy challenging. Since routine monitoring of kidney function is not a standard of care in pregnant women, a comprehensive assessment of AKI, including differentials, is warranted." }
