  # ------------------------------------------------------------------
  - id: geri.L04.lesson1
    title: "الـ dementia: مش كل نسيان زهايمر"
    hook: "جدك بينسى فين حط النضارة؟ عادي. نسي إزاي يستخدم القلم؟ ده موضوع تاني خالص."
    minutes: 9
    pages: [54, 55]
    topics: [definitions, ad-types]
    goals:
      - "تفرّق الـ dementia عن الـ age-associated memory impairment وتعرف ليه"
      - "تحفظ نسب أنواع الـ dementia"
      - "تقرا الـ atypical features وتعرف هي بتشاور على إيه وليه"
    status: unverified
    steps:
      - kind: explain
        page: 54
        quote: "Dementia = a progressive, global decline in cognitive and behavioural functioning that interferes with daily living activities and social relationships"
        title: "التعريف"
        text: |
          الـ ==dementia== هي **progressive, global decline** في الـ cognitive والـ behavioural functioning، لدرجة إنها **interferes with daily living activities** والعلاقات.

          الكلمة المهمة: **interferes**. لو النسيان مش مأثّر على حياته، يبقى مش dementia.

          ليه الكلمة دي مهمة؟ لأن التشخيص هنا مبني على **الوظيفة**، مش على رقم في اختبار بس. التفسير المقبول (مش في الكتاب): اتنين ممكن ياخدوا نفس الـ score، واحد لسه بيدير بيته وفلوسه والتاني مابقاش يعرف، والتاني بس هو اللي عنده dementia.

          وكلمة **global** معناها إن أكتر من وظيفة واقعة (ذاكرة، لغة، حكم على الأمور)، مش حاجة واحدة. وكلمة **progressive** معناها إنها بتزيد مع الوقت، مش حدث ووقف.
      - kind: explain
        page: 54
        quote: "Age-associated memory impairment = A decline in short-term memory that sometimes accompanies aging- \"benign senescent forgetfulness\"."
        title: "النسيان الطبيعي"
        text: |
          الـ ==age-associated memory impairment== هو decline في الـ **short-term memory** بيحصل أحيانًا مع السن، واسمه الحلو: **benign senescent forgetfulness**.

          يعني نسيان benign، مش progressive ومش بيوقف حياته.

          ليه بنسمّيه benign؟ التفسير المقبول (مش في الكتاب): لأن الحاجة اللي اتنسيت بترجع لما تفكّره بيها، والشخص نفسه واخد باله إنه بينسى وبيشتكي. في الـ dementia العكس غالبًا: العيلة هي اللي بتشتكي، والمريض مش شايف المشكلة. يعني اسأل الأول: مين اللي جايبه ومين اللي بيشتكي؟
      - kind: aside
        tone: analogy
        page: 54
        quote: "Age-associated memory impairment = A decline in short-term memory that sometimes accompanies aging- \"benign senescent forgetfulness\"."
        text: "الفرق زي الفرق بين إنك **تنسى فين ركنت العربية** (benign forgetfulness في الـ short-term memory، كلنا بنعملها) وإنك **تنسى إن عندك عربية** أو إزاي تسوقها (dementia)."
      - kind: explain
        page: 54
        quote: "Alzheimer's Disease = an age-related disease(primary degenerative brain disease) commonest cause of dementia among older people marked by progressive irreversible declines in memory,performance of routine tasks, language and communication skills, abstract thinking and the ability to learn and carry out calculations."
        title: "الـ Alzheimer's disease"
        text: |
          الـ ==Alzheimer's disease== هو **primary degenerative brain disease**، وهو **commonest cause of dementia** عند الكبار.

          بيعمل **progressive irreversible** decline في:
          - الـ memory والـ routine tasks.
          - الـ language والـ communication.
          - الـ abstract thinking.
          - القدرة على التعلّم والـ calculations.

          ليه «primary degenerative»؟ لأن مفيش سبب بره المخ (جلطة، دوا، thyroid) هو اللي عمله؛ الخلايا نفسها هي اللي بتموت. وكلمة **irreversible** هي اللي بتفرقه عن الـ delirium والـ depression اللي في نفس المحاضرة، لأن دول غالبًا بيرجعوا مع العلاج.
      - kind: explain
        page: 54
        quote: "Pseudodementia"
        title: "الـ DAT والباقي"
        text: |
          الكتاب في التعريفات بيقسّم الـ dementia لتلاتة:
          - **Dementia of the Alzheimer's Type (DAT)**.
          - **Non-Alzheimer's dementias**: vascular، Lewy bodies، frontotemporal (نسبهم في الرسمة الجاية).
          - ==Pseudodementia==: اكتئاب شكله dementia.

          ليه الكلمة الأخيرة مهمة؟ لأن الكتاب نفسه في آخر المحاضرة بيقول **ابعد عن كلمة pseudodementia**، علشان الاكتئاب المتأخر مع cognitive dysfunction ممكن يتحول dementia بجد. يعني اعرفها هنا كتعريف، وفي درس الاكتئاب هتفهم ليه ماينفعش نطمّن بيها.
      - kind: figure
        page: 55
        quote: "Alzheimer's Disease\n  A condition that damages several parts of the brain\n  Accounts for the majority of dementia cases\n  Alzheimer's Type Dementia (50-75 % of cases)\n  Vascular dementia (10 to 20 %)\n  Dementia with Lewy bodies (10 to 15 %)\n  Frontotemporal dementia (5 to 15 %)"
        title: "مين بيعمل الـ dementia؟"
        alt: "Four horizontal bars showing ranges: Alzheimer's type 50 to 75 percent, vascular 10 to 20 percent, Lewy bodies 10 to 15 percent, frontotemporal 5 to 15 percent."
        caption: "الزهايمر لوحده نص لتلات أرباع الحالات. الـ vascular والـ Lewy bodies والـ frontotemporal بيتقسموا الباقي."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="20" class="t-sm t-mut">% of dementia cases</text>
            <rect x="10" y="32" width="225" height="30" class="fg-acc"/>
