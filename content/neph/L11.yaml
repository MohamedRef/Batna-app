  - id: neph.L11.125
    kind: mcq
    topic: dialysis-care
    stem: "A 30-year-old on hemodialysis for lupus nephritis is 7 weeks pregnant. She takes mycophenolate, lisinopril, warfarin, sevelamer and atorvastatin. Which drug is on the book's safe list?"
    options:
      - Mycophenolate
      - Lisinopril
      - Warfarin
      - Hydroxychloroquine
      - Sevelamer
    answer: 3
    why:
      - Teratogenic; swap to azathioprine.
      - RAS inhibitors are teratogenic; switch to labetalol, nifedipine, methyldopa or hydralazine.
      - Warfarin is unsafe; use heparin or low-molecular-weight heparin.
      - "Correct: hydroxychloroquine is listed as safe immunosuppression in Fig 3."
      - Non-calcium binders have little pregnancy data; calcium-based binders are preferred.
    src: { page: 374, quote: "Figure 3: Safety of medications during pregnancy among patients receiving maintenance dialysis." }
