  - id: neph.L14.lesson3
    title: "علاج class III و IV: أربع طرق للبداية"
    hook: "Steroid + واحد من أربعة. السؤال الحقيقي: مين يناسب المريض ده؟"
    minutes: 8
    pages: [452, 458]
    topics: [ln-initial, ln-steroids, ln-cyc, ln-mpaa-cni]
    goals:
      - "تحفظ الأربع اختيارات للـ initial therapy"
      - "تحفظ جرعات HCQ و Euro-Lupus و CNI و belimumab"
      - "تختار الـ regimen حسب المريض"
    status: unverified
    steps:
      - kind: explain
        page: 452
        title: "Glucocorticoids + واحد من دول"
        quote: "be treated initially with glucocorticoids plus any one of the following"
        text: |
          1. ==MPAA== (mycophenolate)
          2. **Low-dose IV cyclophosphamide** (Euro-Lupus)
          3. **Belimumab** + MPAA أو low-dose IV cyclophosphamide
          4. **MPAA + CNI** لو الـ kidney function مش واقعة جامد

          ومع الكل: **hydroxychloroquine** و الـ general measures.
      - kind: table
        page: 453
        quote: "tacrolimus (initial dose 0.05-0.07 mg/kg/day, blood target level 4-7 ng/ml)"
        title: "الجرعات"
        columns: [Drug, Dose, Target]
        rows:
          - [HCQ, "4-5 mg/kg/day, max 400 (200 if eGFR <30)", "—"]
          - [MPAA, "= MMF 2 g/day", "—"]
          - [Euro-Lupus CYC, "500 mg IV every 2 weeks × 6 (3 g)", "—"]
          - [Cyclosporine, "100-200 mg/day", "60-100 ng/mL"]
          - [Tacrolimus, "0.05-0.07 mg/kg/day", "4-7 ng/mL"]
          - [Voclosporin, "23.7 mg twice daily, 1-2 years", "Not needed"]
          - [Belimumab, "10 mg/kg IV days 1, 15, 29, then every 28 days", "—"]
        hide: [[0, 1], [2, 1], [4, 2], [5, 1]]
      - kind: sort
        page: 457
        quote: "An MPAA-based regimen is the preferred initial therapy"
        prompt: "صنّف: المريض ده يناسبه إيه أكتر؟"
        bins: ["MPAA-based", "IV cyclophosphamide", "CNI-based"]
        cards:
          - text: "Young woman worried about fertility"
            bin: 0
          - text: "Moderate-to-high prior cyclophosphamide exposure"
            bin: 0
          - text: "Unlikely to adhere to oral pills"
            bin: 1
          - text: "Preserved GFR with heavy nephrotic proteinuria"
            bin: 2
          - text: "Cannot tolerate standard-dose MPAA"
            bin: 2
        why: "الـ MPAA أحسن للخصوبة. الـ IV CYC للي مش بياخد البرشام بانتظام. الـ CNI بيثبّت الـ podocyte فبينزّل الـ proteinuria بسرعة، ومحتاج GFR كويس."
      - kind: table
        page: 455
        quote: "Examples of glucocorticoid regimens for lupus nephritis."
        title: "Glucocorticoid regimens for lupus nephritis"
        columns: [Scheme, "Weeks 0-2", "After week 25"]
        rows:
          - [High-dose, "0.8-1.0 mg/kg (max 80)", "<5 mg"]
          - [Moderate-dose, "0.6-0.7 mg/kg (max 50)", "<5 mg"]
          - [Reduced-dose, "0.5-0.6 mg/kg (max 40)", "<2.5 mg"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: tip
        text: "أرقام الـ max بتنزل **80 - 50 - 40**، والـ mg/kg بتنزل **1 - 0.7 - 0.6**. الـ reduced-dose بييجي بعد **methylprednisolone pulses** (0.25-0.5 g/day لحد 3 أيام) ولما الكلية والـ extrarenal يتحسنوا."
      - kind: match
        page: 456
        quote: "Cyclophosphamide dosing regimens, combined with glucocorticoids, in initial treatment for active Class III/IV lupus nephritis."
        prompt: "وصّل الـ cyclophosphamide regimen بجرعته:"
        pairs:
          - ["Modified NIH (standard-dose IV)", "0.5-1 g/m² monthly for 6 months"]
          - ["Euro-Lupus (low-dose IV)", "500 mg every 2 weeks for 3 months"]
          - ["Oral", "1.0-1.5 mg/kg/day (max 150 mg) for 2-6 months"]
        why: "الـ Euro-Lupus أقل immediate toxicity، بس اتجرب أساساً في White patients. الـ IV أقل bladder toxicity من الـ oral."
      - kind: explain
        page: 457
        title: "سُمّية الـ cyclophosphamide بالأرقام"
        quote: "The risk of future hematologic malignancy is related to total lifetime exposure (>36 g), as is myelofibrosis (>80 g)."
        text: |
          - "**Hematologic malignancy**: lifetime dose **>36 g**"
          - "**Myelofibrosis**: **>80 g**"
          - "**Premature ovarian failure**: **300 mg/kg** في الكبار (7.5-15 g/m² في الأطفال)"

          عشان كده الـ ovarian protection بـ **GnRH agonist** (leuprolide).
      - kind: check
        page: 453
        quote: "If no reduction in proteinuria ≥25% after 2-3 months add"
        question: "After 3 months of steroids + MPAA, proteinuria fell only 10%. What does the initial-therapy figure suggest?"
        options:
          - "Add belimumab or a CNI"
          - "Stop MPAA and observe"
          - "Switch to azathioprine"
          - "Repeat the same regimen for 3 more months"
        answer: 0
        why:
          - "صح: لو الـ proteinuria منزلتش ≥25% بعد 2-3 شهور، ضيف belimumab أو CNI."
          - "مفيش حاجة في الشكل بتقول وقّف."
          - "الـ azathioprine للـ maintenance مش للإنقاذ."
          - "الشكل بيقول ضيف، مش استنى."
      - kind: try
        items: [neph.L14.032, neph.L14.034, neph.L14.049, neph.L14.052, neph.L14.059]
    recap:
      - "Steroid + (MPAA أو Euro-Lupus CYC أو belimumab triple أو MPAA+CNI)."
      - "HCQ 4-5 mg/kg (max 400، 200 لو eGFR <30)؛ Euro-Lupus 500 mg × 6 = 3 g."
      - "Steroid max: 80 / 50 / 40 mg."
      - "CYC: malignancy >36 g، myelofibrosis >80 g، ovarian failure 300 mg/kg."
      - "مفيش ≥25% نزول بعد 2-3 شهور: ضيف belimumab أو CNI."
    practice: [neph.L14.032, neph.L14.033, neph.L14.034, neph.L14.035, neph.L14.036, neph.L14.037, neph.L14.038, neph.L14.039, neph.L14.040, neph.L14.041, neph.L14.042, neph.L14.043, neph.L14.044, neph.L14.045, neph.L14.046, neph.L14.047, neph.L14.048, neph.L14.049, neph.L14.050, neph.L14.051, neph.L14.052, neph.L14.053, neph.L14.054, neph.L14.055, neph.L14.056, neph.L14.057, neph.L14.058, neph.L14.059, neph.L14.060, neph.L14.091, neph.L14.093]
