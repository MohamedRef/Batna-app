      - FDG-PET/CT
      - X-ray
      - Mammography
    answer: 2
    why:
      - MRI/MRA shows wall thickening but does not show metabolic activity across the whole aorta as well.
      - Ultrasound (halo sign) is first-line for cranial GCA but sees less of the aorta and its branches.
      - "Correct: FDG-PET/CT shows vessel wall inflammation across the whole aorta and its branches; the book only says to confirm LVV by imaging or histology (p136)."
      - Plain X-ray cannot show vessel wall inflammation.
      - Mammography may show breast arterial calcification but is not a vasculitis test.
    src: { page: 136, quote: "A suspected diagnosis of LVV should be confirmed by imaging or histology." }
