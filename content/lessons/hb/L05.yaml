  - id: hb.L05.lesson5
    title: "الوقاية والـ screening: إزاي مصر كسبت"
    hook: "مرض ساكت وعلاجه بيشفي: يبقى السلاح الحقيقي إنك تدوّر عليه. ونختم بخطة الـ essays."
    minutes: 7
