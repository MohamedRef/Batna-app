        title: "شالوا المرارة والوجع لسه موجود؟"
        text: |
          ==Post-cholecystectomy problems== في الكتاب:

          - ==Wrong diagnosis==: الوجع من الأول ماكانش من المرارة.
          - **Papillary dysfunction, stenosis**
          - **Psychosomatic disorders** و **irritable bowel syndrome (IBS)**
          - **Biliary stricture**: ممكن من إصابة الـ common bile duct (CBD) في العملية.
          - **Biliary stones**: retained أو اتكوّنت جديد.
          - **Amputation neuroma**
          - **Pancreatitis**

          الصور: صفحة 399 فيها **CBD injury with bile leakage**، وصفحة 400 فيها العلاج بالـ **endoscopic sphincterotomy with stone extraction** (ERCP).

          ليه بيحصلوا؟ التفسير المقبول (مش في الكتاب) لأهمهم:
          - **Papillary dysfunction, stenosis**: الـ sphincter of Oddi بيتقلّص زيادة أو بيضيق، فالـ bile بتتزنق في القناة وتعمل وجع شبه الـ colic بالظبط.
          - **Amputation neuroma**: عصب اتقطع في العملية عند جذر الـ cystic duct، ونما ككتلة صغيرة بتوجع.
          - **Biliary stones**: حصوة نزلت الـ CBD قبل العملية وماحدش شافها، أو brown stone اتكوّنت ورا stricture (صفحة 380).

          القاعدة: لو الوجع رجع، دوّر الأول على حاجة في القنوات (stones، stricture، papilla)، وبعدين فكّر في الـ IBS والـ psychosomatic.
      - kind: figure
        page: 399
        quote: "CBD Injury After Cholecystectomy with Bile Leakage"
        title: "CBD injury بعد الـ cholecystectomy"
        image: { file: hb/L19-cbd-injury.webp, book: true }
        marks:
          - { at: [0.18, 0.15], label: "Thin irregular duct" }
          - { at: [0.72, 0.33], label: "Contrast leaking out of the ducts" }
        alt: "Two book cholangiograms under the heading CBD injury after cholecystectomy with bile leakage. Top: two frames side by side with handwritten green marks; the left shows a narrow, irregular duct, the right shows contrast spreading out of the ducts into a large cloudy collection. Bottom: a cholangiogram over the spine showing the hepatic ducts and the common bile duct, with a row of surgical clips crossing it."
        caption: |
          صورتين تحت عنوان **CBD injury after cholecystectomy with bile leakage**، مثال حي لـ **biliary stricture** في قايمة مشاكل ما بعد العملية:

          - **(1)**: القناة رفيعة ومش منتظمة، وعليها كتابة باليد بالأخضر.
          - **(2)**: الصبغة ==خارجة برّه القنوات== في بقعة كبيرة مش محددة: ده الـ **bile leakage**.
          - **تحت**: القنوات فوق العمود الفقري، وصف ==clips== جراحية معدن معدّي على القناة.

          التفسير المقبول (مش في الكتاب): الـ clips بتتحط على الـ cystic duct في العملية، ولو اتحطت غلط أو القناة اتعوّرت، الـ common bile duct هو اللي بيدفع التمن: تسريب أو stricture. علشان كده الوجع أو الصفار بعد العملية بيتدوّر على سببه في القنوات الأول.
