      - kind: order
        page: 3
        quote: "How will the research proposal be developed?\n| Questions you must ask | Steps you will take | Important elements of each step |\n|---|---|---|\n| What is the problem and why should it be studied? | Selection, analysis and statement of the research problem | problem identification; prioritising problems; analysis; justification |\n| What information is available? | Literature review | literature and other available information |\n| Why do we want to carry out the research? What do we hope to achieve? | Formulation of research objectives | general and specific objectives; hypotheses |\n| What additional data do we need to meet our research objectives? How are we going to collect this information? | Research methodology | variables; types of study; data collection techniques; sampling; plan for data collection; plan for data processing and analysis; ethical considerations; pre-test or pilot study |\n| Who will do what, and when? | Work plan | human resources; timetable |\n| What resources do we need to carry out the study? What resources do we have? | Budget | material support and equipment; money |\n| How will the project be administered? How will utilisation of results be ensured? | Plan for project administration and utilisation of results | administration; monitoring; identification of potential users |\n| How will we present our proposal to relevant authorities, community and the funding agencies? | Proposal summary | briefing sessions and lobbying |"
        prompt: "رتّب خطوات الـ research proposal:"
        steps:
          - "Statement of the research problem"
          - "Literature review"
          - "Formulation of research objectives"
          - "Research methodology"
          - "Work plan"
          - "Budget"
        why: "المشكلة الأول، وبعدين تقرا اللي اتعمل قبلك، وبعدين تكتب أهدافك، وبعدها بس تقرر الـ methodology. الـ work plan والـ budget بييجوا لما تعرف هتعمل إيه."
      - kind: explain
        remind: [res.L03.003]
        page: 10
        quote: "Research Question: It focuses the study, determines the methodology and guides all stages of inquiry, data analysis, and reporting.\nMethodology:\n  variables\n  types of study\n  data collection techniques\n  sampling\n  plan for data collection\n  plan for data processing and analysis\n  ethical considerations\n  pre-test or pilot study"
        title: "السؤال بيعمل إيه للبحث؟"
        text: |
          تلات حاجات، احفظهم بالترتيب:

          - ==Focuses the study==: بيقفل الباب على أي حاجة برّه السؤال.
          - **Determines the methodology**: الـ variables، نوع الدراسة، الـ sampling، الـ data collection.
          - **Guides all stages** of inquiry، data analysis و reporting.
      - kind: aside
        tone: analogy
        page: 10
        quote: "Research Question: It focuses the study, determines the methodology and guides all stages of inquiry, data analysis, and reporting.\nMethodology:\n  variables\n  types of study\n  data collection techniques\n  sampling\n  plan for data collection\n  plan for data processing and analysis\n  ethical considerations\n  pre-test or pilot study"
        text: |
          الـ research question زي العنوان اللي بتقوله لسوّاق الأوبر. لو قلتله "ودّيني إسكندرية" هيلف بيك ساعتين. لو قلتله "مستشفى الميري، باب الطوارئ" هيروح على طول.

          السؤال الواضح هو اللي بيحدد الطريق (**methodology**)، والطريق مش بيحدد السؤال.
      - kind: table
        page: 11
        quote: "How clinical research questions determines study type (design)\n| Type of Question | Study Design |\n|---|---|\n| Therapy | RCT > Cohort > Case Control > Case Series/Reports |\n| Diagnosis | Prospective, blind comparison to a gold standard or Cross-Sectional |\n| Harm/Etiology | RCT > Cohort > Case Control > Case Series/Reports |\n| Prognosis | Cohort > Case Control > Case Series/Reports |\n| Prevention | RCT > Cohort > Case Control > Case Series/Reports |\n| Clinical Exam | Prospective, blind comparison to a gold standard |\n| Cost-Analysis | Economic analysis |\nQuestions on therapy, etiology and prevention that can best be answered by an RCT, can also be answered by a systematic review or meta-analysis.\nHarm/Etiology studies can be answered by RCTs if ethical issues allow it. (Schardt, 2013)"
        title: "نوع السؤال بيختار الـ design"
        columns: ["Type of question", "Study design (best first)"]
        rows:
          - ["Therapy", "randomized controlled trial (RCT) > Cohort > Case control > Case series"]
          - ["Diagnosis", "Prospective, blind comparison to a gold standard, or cross-sectional"]
          - ["Harm/Etiology", "RCT > Cohort > Case control > Case series"]
          - ["Prognosis", "Cohort > Case control > Case series"]
          - ["Prevention", "RCT > Cohort > Case control > Case series"]
          - ["Clinical exam", "Prospective, blind comparison to a gold standard"]
          - ["Cost analysis", "Economic analysis"]
        hide: [[1, 1], [3, 1], [6, 1]]
      - kind: check
        page: 11
        quote: "How clinical research questions determines study type (design)\n| Type of Question | Study Design |\n|---|---|\n| Therapy | RCT > Cohort > Case Control > Case Series/Reports |\n| Diagnosis | Prospective, blind comparison to a gold standard or Cross-Sectional |\n| Harm/Etiology | RCT > Cohort > Case Control > Case Series/Reports |\n| Prognosis | Cohort > Case Control > Case Series/Reports |\n| Prevention | RCT > Cohort > Case Control > Case Series/Reports |\n| Clinical Exam | Prospective, blind comparison to a gold standard |\n| Cost-Analysis | Economic analysis |\nQuestions on therapy, etiology and prevention that can best be answered by an RCT, can also be answered by a systematic review or meta-analysis.\nHarm/Etiology studies can be answered by RCTs if ethical issues allow it. (Schardt, 2013)"
        question: "You want to know how many patients with compensated cirrhosis decompensate within 5 years. Which design tops the list?"
        options:
          - "Cohort study"
          - "Randomised controlled trial"
          - "Economic analysis"
          - "Blind comparison to a gold standard"
        answer: 0
        why:
          - "صح: ده سؤال **prognosis**، والـ prognosis بيبدأ بـ Cohort > Case control > Case series."
          - "مفيش RCT في صف الـ prognosis: مش هتعمل randomization لمرض."
          - "دي لأسئلة الـ cost analysis."
          - "دي لأسئلة الـ diagnosis والـ clinical exam."
      - kind: aside
        tone: exam
        page: 11
        quote: "How clinical research questions determines study type (design)\n| Type of Question | Study Design |\n|---|---|\n| Therapy | RCT > Cohort > Case Control > Case Series/Reports |\n| Diagnosis | Prospective, blind comparison to a gold standard or Cross-Sectional |\n| Harm/Etiology | RCT > Cohort > Case Control > Case Series/Reports |\n| Prognosis | Cohort > Case Control > Case Series/Reports |\n| Prevention | RCT > Cohort > Case Control > Case Series/Reports |\n| Clinical Exam | Prospective, blind comparison to a gold standard |\n| Cost-Analysis | Economic analysis |\nQuestions on therapy, etiology and prevention that can best be answered by an RCT, can also be answered by a systematic review or meta-analysis.\nHarm/Etiology studies can be answered by RCTs if ethical issues allow it. (Schardt, 2013)"
        text: |
          نقطتين تحت الجدول بيحبوا يتسألوا:

          - أسئلة **therapy, etiology and prevention** اللي أحسن إجابة ليها RCT، ينفع كمان يجاوب عليها **systematic review or meta-analysis**.
          - أسئلة **harm/etiology** ينفع تتجاوب بـ RCT **if ethical issues allow it**. يعني مش هتدّي ناس سجاير عشوائيًا علشان تشوف هيجيلهم cancer ولا لأ.
      - kind: try
        items: [res.L03.002, res.L03.003, res.L03.005, res.L03.009]
    recap:
      - "أول خطوة في أي بحث: **define the research question** بوضوح."
      - "الـ research question: clear and concise، بيقول البحث عايز يجاوب على إيه، ومنه بييجي الـ justification."
      - "بيعمل 3 حاجات: focuses the study، determines the methodology، guides all stages."
      - "الـ proposal: problem ← literature ← objectives ← methodology ← work plan ← budget ← administration ← summary."
      - "Prognosis = Cohort أولًا. Therapy/Harm/Prevention = RCT أولًا. Diagnosis = blind comparison to a gold standard."
    practice: [res.L03.001, res.L03.002, res.L03.003, res.L03.004, res.L03.005, res.L03.006, res.L03.007, res.L03.008, res.L03.009, res.L03.010, res.L03.011, res.L03.012, res.L03.013, res.L03.114]
  # ------------------------------------------------------------------
  - id: res.L03.lesson2
    title: "كام؟ فيه فرق؟ ولا فيه علاقة؟"
    hook: "تلات أنواع أسئلة، وكل نوع بيكشف نفسه من أول كلمتين."
    minutes: 9
    pages: [12, 76]
    topics: [types]
    goals:
      - "تفرّق بين descriptive و comparative و causal من صياغة السؤال"
      - "تعرف إمتى السؤال qualitative وإمتى quantitative"
    status: unverified
    steps:
      - kind: explain
        page: 13
        quote: "1- Descriptive Questions: Seek to describe a phenomena and often study \"how much\", \"how often\", or \"what is the change/clinical picture/consequences\".\n  How much tobacco smoking is prevalent among different segments of population?\n  Why they smoke?\n  What they know about the risks of smoking?\n  What was their experience in trying to stop smoking?\n  How often do medical students use computer-assisted learning?\n  What is the pattern of occurrence of disease X in terms of person, place and time?\n  What is the prevalence of depression among medical students?"
        title: "1. Descriptive: بيوصف"
        text: |
          السؤال الـ ==descriptive== بيوصف ظاهرة: **how much**، **how often**، أو إيه الـ clinical picture والـ consequences.

          أمثلة المحاضرة:
          - What is the prevalence of depression among medical students
          - How often do medical students use computer-assisted learning
          - What is the pattern of disease X in terms of person, place and time

          جماعة واحدة، وبتعدّ أو بتوصف.

          خلي بالك: **"Why they smoke?"** موجود في أمثلة الـ descriptive على السلايد. الدكتور قال في الشرح إن كلمة **why** لوحدها ماتخليش السؤال causal: إنت بتوصف أسباب جماعة واحدة.
      - kind: explain
        page: 14
        quote: "2- Comparative Questions: Aim to examine the difference between two or more groups in relation to one or more variables. The questions often begin with \"What is the difference…\".\n  What is the difference in growth pattern of breast-fed and bottle-fed infants?\n  What is the difference in maternal mortality in an urban compared to a rural community?\n  What is the difference between prevalence of depression among medical students and tourism students?"
        title: "2. Comparative: بيقارن"
        text: |
          السؤال الـ ==comparative== بيشوف **the difference between two or more groups** في variable أو أكتر، وغالبًا بيبدأ بـ **"What is the difference…"**.

          - What is the difference in growth pattern of breast-fed and bottle-fed infants
          - What is the difference in maternal mortality in an urban compared to a rural community

          الدكتور فكّها في الشرح: في مثال الرضاعة الـ **variable** هو growth pattern، والـ **groups** هما نوعين التغذية (breast-fed و bottle-fed). وفي مثال الوفيات بنقارن الريف بالحضر.
      - kind: explain
        page: 15
        quote: "3- Causal Questions: Compares two or more phenomena and determines if a relationship exists. Often called relationship research questions.\n  Does the number of cigarettes smoked per day affect the severity of obstructive pulmonary disease COPD?\n  Does the time of moderate daily exercise affect the extent of improvement in blood pressure?"
        title: "3. Causal: بيدوّر على علاقة"
        text: |
          السؤال الـ ==causal== بيقارن ظاهرتين أو أكتر وبيشوف **if a relationship exists**، واسمه التاني **relationship research question**.

          - Does the number of cigarettes smoked per day affect the severity of chronic obstructive pulmonary disease (COPD)
          - Does the time of moderate daily exercise affect the improvement in blood pressure

          علامته: **"Does X affect Y"**

          الدكتور قال في الشرح: في مثال السجاير، عدد السجاير هو الـ **independent variable** وشدة الـ COPD هي الـ **dependent variable**. وفي مثال الرياضة، مدة الرياضة independent والتحسن في الضغط dependent. وتسمية السؤال causal مش معناها إن أي design هيثبت السببية.
      - kind: figure
        page: 12
        quote: "Three main types of research questions:\n  1- Descriptive Questions\n  2- Comparative Questions\n  3- Causal Questions"
        title: "التلاتة في صورة واحدة"
        alt: "Three stacked panels. Descriptive: one group with a single bar labelled how much or how often. Comparative: two groups with two bars and a question about the difference. Causal: X with an arrow to Y labelled does X affect Y."
        caption: "Descriptive = جماعة واحدة وبتعدّ. Comparative = جماعتين وبتقارن. Causal = سهم من X لـ Y."
        svg: |
          <svg viewBox="0 0 330 420" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03t1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <text x="10" y="20" class="t-b">1. Descriptive</text>
            <rect x="10" y="30" width="310" height="100" rx="8" class="fg-box"/>
            <rect x="40" y="70" width="50" height="50" class="fg-acc"/>
            <text x="65" y="62" text-anchor="middle" class="t-sm">One group</text>
            <text x="110" y="85" class="t-sm t-b">How much? How often?</text>
            <text x="110" y="105" class="t-sm t-mut">prevalence, pattern, picture</text>
            <text x="10" y="160" class="t-b">2. Comparative</text>
            <rect x="10" y="170" width="310" height="100" rx="8" class="fg-box"/>
            <rect x="40" y="215" width="40" height="45" class="fg-acc"/>
            <rect x="95" y="195" width="40" height="65" class="fg-good"/>
            <text x="60" y="210" text-anchor="middle" class="t-sm">A</text>
            <text x="115" y="190" text-anchor="middle" class="t-sm">B</text>
            <text x="150" y="225" class="t-sm t-b">What is the difference</text>
            <text x="150" y="243" class="t-sm t-b">between A and B?</text>
            <text x="10" y="300" class="t-b">3. Causal (relationship)</text>
            <rect x="10" y="310" width="310" height="100" rx="8" class="fg-box"/>
            <circle cx="60" cy="355" r="24" class="fg-acc"/>
            <text x="60" y="360" text-anchor="middle" class="t-b">X</text>
            <circle cx="190" cy="355" r="24" class="fg-bad"/>
            <text x="190" y="360" text-anchor="middle" class="t-b">Y</text>
            <path d="M88 355h70" class="fg-arrow-acc" marker-end="url(#L03t1)"/>
            <text x="225" y="350" class="t-sm t-b">Does X</text>
            <text x="225" y="368" class="t-sm t-b">affect Y?</text>
            <text x="20" y="400" class="t-sm t-mut">cigarettes/day → COPD severity</text>
          </svg>
      - kind: aside
        tone: tip
        page: 12
        quote: "Three main types of research questions:\n  1- Descriptive Questions\n  2- Comparative Questions\n  3- Causal Questions"
        text: |
          اسأل نفسك تلات أسئلة مصري:

          - "**كام؟**" ← descriptive
          - "**فيه فرق؟**" ← comparative
          - "**ده بيأثر على ده؟**" ← causal
      - kind: sort
        page: 14
        quote: "2- Comparative Questions: Aim to examine the difference between two or more groups in relation to one or more variables. The questions often begin with \"What is the difference…\".\n  What is the difference in growth pattern of breast-fed and bottle-fed infants?\n  What is the difference in maternal mortality in an urban compared to a rural community?\n  What is the difference between prevalence of depression among medical students and tourism students?"
        prompt: "كل سؤال من دول نوعه إيه؟"
        bins: ["Descriptive", "Comparative", "Causal"]
        cards:
          - { text: "How much tobacco smoking is prevalent among different segments of population?", bin: 0 }
          - { text: "What do smokers know about the risks of smoking?", bin: 0 }
          - { text: "What is the difference in depression between medical and tourism students?", bin: 1 }
          - { text: "What is the difference in growth of breast-fed and bottle-fed infants?", bin: 1 }
          - { text: "Does the number of cigarettes per day affect COPD severity?", bin: 2 }
          - { text: "Does daily shisha smoking affect forced expiratory volume in 1 second (FEV1) in Alexandria café workers?", bin: 2 }
        why: "اللي بيعدّ أو بيوصف جماعة واحدة descriptive. اللي فيه \"What is the difference\" بين جماعتين comparative. اللي فيه \"Does X affect Y\" causal."
      - kind: check
        page: 74
        quote: "Quiz:\n1) What type of research question is the following: How often do college students change majors?\n  A. Causal Question\n  B. Descriptive Question\n  C. Comparative Question\n  D. None of these\n2) A hypothesis is commonly used in quantitative studies, but is not appropriate for qualitative studies.\n  A. True\n  B. False\n3) Would the following be an example of a research question or a research hypothesis: Motorcycle riders who wear helmets sustain fewer injuries.\n  A. Research Hypothesis\n  B. Research Question\n  C. Neither of these\n  D. Both of these"
        question: "(Lecture quiz) What type of research question is: \"How often do college students change majors?\""
        options:
          - "Descriptive"
          - "Causal"
          - "Comparative"
          - "None of these"
        answer: 0
        why:
          - "صح: **how often** = descriptive. ودي إجابة الـ quiz."
          - "مفيش X بيأثر على Y هنا."
          - "مفيش جماعتين بنقارنهم."
          - "هو descriptive صريح."
      - kind: check
        page: 76
        quote: "4) Causal research questions are used when wanting to compare a variable between two or more groups.\n  A. True\n  B. False\n5) If you were making a predictive statement about your research topic, which of the following would you use?\n  A. Research Question\n  B. Descriptive Question\n  C. Hypothesis\n  D. None of these"
        question: "The quiz says: \"___ research questions are used when wanting to compare a variable between two or more groups.\" Which type fills the blank correctly?"
        options:
          - "Comparative"
          - "Causal"
          - "Descriptive"
        answer: 0
        why:
          - "صح: مقارنة variable بين جماعتين = comparative. الـ quiz كاتبها Causal وإجابتها **False**، وده الفخ."
          - "ده الفخ: الـ causal بيدوّر على علاقة، مش مقارنة جماعات."
          - "الـ descriptive بيوصف جماعة واحدة."
      - kind: explain
        remind: [res.L03.026]
        page: 18
        quote: "Qualitative research questions tend to be open and descriptive, unlike Quantitative research questions which should remain fixed.\nWords such as: 'seek to understand', 'describe', 'explore' give clues to the methodology to be used.\nOne general open question may be followed by a number of sub-questions."
        title: "Qualitative ولا Quantitative؟"
        text: |
          - **Qualitative** questions بتبقى ==open and descriptive==، وممكن سؤال عام مفتوح يتبعه كذا **sub-question**.
          - **Quantitative** questions لازم ==remain fixed==: بتحددها من الأول وماتغيّرهاش.

          كلمات زي **seek to understand**، **describe**، **explore** بتقولك إن الـ methodology qualitative.

          وليه نحتاج qualitative أصلًا؟ لأنها بتقفل الفجوة بين الاكتشاف والتطبيق، وبتعرّفنا **why research results are often not translated into practice**.

          في المحاضرة اتقال: الـ knowledge والـ attitudes ممكن تتقاس quantitative كمان (بـ questionnaire وأرقام). الفرق بين النوعين في السؤال والطريقة ونوع الـ data، مش في اسم الموضوع.
      - kind: explain
        page: 17
        quote: "Qualitative research can help in closing the gap between the science of discovery and the implementation of results. Qualitative research is often needed to find out why research results are often not translated into practice."
        title: "الـ qualitative بتسد فجوة"
        text: |
          الـ **qualitative research** بتساعد تقفل ==الفجوة بين الاكتشاف والتطبيق==: كتير بنلاقي علاج أثبت فايدته، ومع ذلك مابيتطبقش.

          هنا الـ qualitative بتسأل **ليه** النتايج ماتترجمتش لممارسة: الدكاترة مقتنعين؟ العيانين بيخافوا؟ النظام نفسه معطّل؟

          ليه الأرقام لوحدها ماتكفيش؟ لأن الـ quantitative بتقولك «كام واحد مابياخدش العلاج»، لكن السبب جوه دماغ الناس، ومحتاج تسمعه بكلامهم. التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 16
        quote: "Quantitative vs. Qualitative Research: Ql (qualitative) and Qt (quantitative)\nQualitative chain: Knowledge → Belief → Attitude → Value → Behavior"
        title: "السلم اللي جنب الـ qualitative"
        alt: "A vertical ladder of five steps from top to bottom: Knowledge, Belief, Attitude, Value, Behavior, with arrows between them, beside a box labelled Qualitative explores why."
        caption: "السلايد بيحط السلم ده جنب الـ qualitative: من المعرفة لحد السلوك. الـ qualitative بيدخل جوه السلم ده ويسأل \"ليه؟\"، والـ quantitative بيعدّ."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03t2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
