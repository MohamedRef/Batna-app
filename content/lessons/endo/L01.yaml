        title: "الـ VIPoma: ليه WDHA؟"
        text: |
          الـ **vasoactive intestinal peptide (VIP)** بيأمر الأمعاء **تفرز** مية وأملاح بدل ما تمتصها. التفسير المقبول (مش في الكتاب) لكل حرف:
          - **Watery diarrhoea**: إسهال إفرازي، يعني مش بيقف بالصيام، ويوصل لـ ==5–10 لتر في اليوم==.
          - **Hypokalaemia**: البوتاسيوم بيخرج مع المية دي، وكمان الـ hypovolaemia بتشغّل الـ aldosterone فيطرد بوتاسيوم أكتر في البول.
          - **Achlorhydria**: الـ VIP بيقفل الـ acid في المعدة.

          النتيجة الطبيعية لـ 10 لتر بره الجسم: **hypovolaemia و dehydration**. علشان كده الكتاب بيبدأ العلاج بـ ==correct dehydration== قبل أي عملية، والعملية **distal pancreatectomy**.
