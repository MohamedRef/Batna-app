lecture: geri.L05
lessons:
  # ------------------------------------------------------------------
  - id: geri.L05.lesson1
    title: "الـ stroke عند الكبير: جلطة ولا نزيف؟"
    hook: "تمانين في المية من الـ strokes جلطات. بس الجلطة نفسها جاية منين؟ من مكانها ولا مسافرة؟"
    minutes: 8
    pages: [84, 86]
    topics: [definition, tia, ischemic, risk]
    goals:
      - "تعرّف الـ stroke والـ TIA وتحفظ نسب الأنواع"
      - "تفرّق الـ thrombosis من الـ embolism ومين بيروح فين"
      - "تعدّ الـ risk factors بقسميها"
    status: unverified
    steps:
      - kind: explain
        page: 84
        quote: "Stroke is a syndrome characterized by the acute onset of neurologic deficit that persists for at least 24 hours"
        title: "التعريف"
        text: |
          الـ CVD من أكبر أسباب المرض والوفاة عند الكبار، وأشهر طريقة بيظهر بيها هي الـ ==stroke==.

          تعريف الكتاب فيه أربع حتت، احفظها كده:
          - **acute onset**: فجأة.
          - **neurologic deficit** بيفضل **at least 24 hours**.
          - **focal**: جزء معيّن من الـ CNS.
          - سببه **disturbance of cerebral circulation**.
      - kind: figure
        page: 84
        quote: "Thromboembolic infarction 80% - Cerebral & cerebellar Hge 10% - Subarachnoid Hge 5%"
        title: "الـ stroke جاي منين؟"
        alt: "Three horizontal bars. Thromboembolic infarction is a long bar at 80 percent, cerebral and cerebellar hemorrhage a short bar at 10 percent, subarachnoid hemorrhage the shortest at 5 percent."
        caption: "الجلطة بتكسب بفرق كبير: 80% thromboembolic، 10% نزيف في المخ أو المخيخ، 5% subarachnoid."
        svg: |
          <svg viewBox="0 0 330 170" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="22" class="t-sm t-mut">Causes of stroke</text>
            <rect x="10" y="35" width="240" height="30" class="fg-acc"/>
            <text x="18" y="55" class="t-sm t-b">Thromboembolic infarction</text>
            <text x="260" y="55" class="t-lg t-b t-acc">80%</text>
            <rect x="10" y="80" width="30" height="30" class="fg-bad"/>
            <text x="50" y="100" class="t-sm">Cerebral + cerebellar Hge</text>
            <text x="260" y="100" class="t-lg t-b t-bad">10%</text>
            <rect x="10" y="125" width="15" height="30" class="fg-bad"/>
            <text x="50" y="145" class="t-sm">Subarachnoid Hge</text>
            <text x="260" y="145" class="t-lg t-b t-bad">5%</text>
          </svg>
      - kind: explain
        page: 84
        quote: "Sudden loss of function for seconds lasts for minutes or hours."
        title: "والـ TIA؟"
        text: |
          الـ ==TIA== في الكتاب: **sudden loss of function** بيبدأ في ثواني ويقعد دقايق أو ساعات، ويروح.

          والـ **recurrent TIAs** سببها غالبًا **thrombosis or embolism** جوه الـ cerebral circulation نفسها. يعني الـ TIA إنذار: نفس العملية اللي هتعمل الـ stroke بعدين.
      - kind: update
        page: 84
        quote: "Sudden loss of function for seconds lasts for minutes or hours."
        text: "الكتاب بيعرّف الـ TIA بالوقت (sudden loss of function لدقايق أو ساعات). دلوقتي بيتعرّف بالـ tissue مش بالوقت: أعراض عابرة من غير acute infarction على الأشعة، وأغلبها بيخلص في أقل من ساعة. في الامتحان اكتب تعريف الكتاب."
        ref: "AHA/ASA TIA definition statement, 2009"
      - kind: explain
        page: 85
        quote: "About 2/3 are due to thrombosis, 1/3 due to embolism."
        title: "الـ ischemic stroke: محلي ولا مسافر؟"
        text: |
          الـ ischemic stroke: حوالي ==2/3 thrombosis== و**1/3 embolism**.

          **الـ thrombosis** (الجلطة اتعملت مكانها) بتسد:
          - **large arteries**: internal carotid، middle cerebral، basilar.
          - **small penetrating arteries**: دي الـ lacunar.
          - **cerebral veins or venous sinuses**.

          وبيسبقها TIAs، وأكتر عند الكبير اللي عنده **atherosclerosis**.
      - kind: order
        page: 85
        quote: "Atherosclerosis results from dysfunction of the vascular endothelial cells, subintimal deposition of lipoprotein, formation of an atheromatous plaque."
        prompt: "رتّب الـ atherosclerosis بتتكوّن إزاي:"
        steps:
          - "Endothelial cell dysfunction"
          - "Subintimal lipoprotein deposition"
          - "Atheromatous plaque"
        why: "الـ endothelium بيبوظ الأول، فالـ lipoprotein يعدّي ويترسّب تحت الـ intima، وبعدين يتكوّن الـ plaque."
      - kind: figure
        page: 85
        quote: "Emboli in anterior cerebral circulation often occlude the middle cerebral artery (85% of hemispheric blood flow)"
        title: "الـ embolus بيروح فين؟"
        alt: "Diagram: the heart, aortic arch and neck arteries send an embolus upward. In the anterior circulation the arrow goes to the middle cerebral artery, labelled 85 percent of hemispheric flow. In the posterior circulation the arrow goes to the apex of the basilar artery."
        caption: "الـ embolus بيمشي مع أكبر تيار: في الـ anterior بيروح الـ MCA (85% من الدم)، وفي الـ posterior بيقف عند الـ apex بتاع الـ basilar."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R05a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
              <marker id="R05b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="95" y="200" width="140" height="38" rx="8" class="fg-box"/>
            <text x="108" y="215" class="t-sm t-b">Sources of emboli</text>
            <text x="102" y="231" class="t-sm">heart · aortic arch · neck</text>
            <path d="M140 198L80 120" class="fg-arrow-acc" marker-end="url(#R05a)"/>
            <path d="M190 198L250 120" class="fg-arrow-bad" marker-end="url(#R05b)"/>
            <rect x="10" y="50" width="145" height="66" rx="8" class="fg-acc"/>
            <text x="18" y="70" class="t-sm t-mut">Anterior circulation</text>
            <text x="18" y="90" class="t-b">Middle cerebral a.</text>
            <text x="18" y="108" class="t-sm t-acc">85% of hemisphere flow</text>
            <rect x="175" y="50" width="145" height="66" rx="8" class="fg-bad"/>
            <text x="183" y="70" class="t-sm t-mut">Posterior circulation</text>
            <text x="183" y="90" class="t-b">Apex of basilar a.</text>
            <text x="20" y="30" class="t-sm t-b">Embolic stroke: maximal at onset</text>
          </svg>
      - kind: check
        page: 85
        quote: "Embolic strokes are usually maximal at the onset."
        question: "ست عندها AF صحيت بـ hemiplegia كاملة من أول لحظة. ده يرجّح إيه؟"
        options: ["Embolism", "Thrombosis preceded by TIAs", "Lacunar infarct", "Subdural haematoma"]
        answer: 0
        why:
          - "صح: الـ embolic stroke بيبقى maximal at onset، والـ AF مصدر من القلب."
          - "الـ thrombosis غالبًا بيسبقها TIAs والكتاب ما قالش إنها maximal من الأول."
          - "الـ lacune من small penetrating artery، مش من القلب."
          - "الـ subdural بييجي بعد head injury بأيام أو شهور."
      - kind: explain
        page: 86
        quote: "Granulomatous arteritis of large arteries, in association with polymyolgia rheumatica (in the elderly), headache, tender scalp, claudication of the jaw"
        title: "وفيه سبب مايتنسيش عند الكبير: GCA"
        text: |
          الـ ==giant cell arteritis== هي **granulomatous arteritis of large arteries**، ومعاها **polymyalgia rheumatica** عند الكبار.

          - **headache** و**tender scalp** (المشط بيوجعه).
          - **jaw claudication**: فكه بيتعب وهو بياكل.
          - الخطر: **sudden loss of vision**، مؤقت أو دايم.
      - kind: aside
        tone: joke
        page: 86
        quote: "headache, tender scalp, claudication of the jaw, sudden temporary or permanent loss of vision."
        text: "جدّك اشتكى إن **الفتة** بتتعب فكّه (**claudication of the jaw**) وراسه بتوجعه لما يسرّح شعره (**tender scalp**)؟ ده مش دلع: دي **GCA** لحد ما يثبت العكس، والعين في خطر (**loss of vision**)."
      - kind: explain
        page: 86
        quote: "Compression of brain tissue & vascular structure leads to secondary ischemia & edema according to its location"
        title: "والنزيف بيأذي إزاي؟"
        text: |
          الـ ==hemorrhage== بيضغط على **brain tissue** والأوعية، فيعمل **secondary ischemia** و**edema** حسب مكانه: intracerebral، subarachnoid، subdural، أو epidural (traumatic).
      - kind: sort
        page: 86
        quote: "Risk factors for atherosclerosis:- - Hypertension, - D.M., - Hyperlipidemia, - Hyperhomocysteinemia, - Cigarette smoking."
        prompt: "صنّف الـ risk factors زي الكتاب:"
        bins: ["Atherosclerosis risk factors", "Other risk factors"]
        cards:
          - { text: "Hypertension", bin: 0 }
          - { text: "Diabetes", bin: 0 }
          - { text: "Hyperlipidemia", bin: 0 }
          - { text: "Hyperhomocysteinemia", bin: 0 }
          - { text: "Smoking", bin: 0 }
          - { text: "Polycythaemia", bin: 1 }
          - { text: "Endocarditis", bin: 1 }
          - { text: "Migraine", bin: 1 }
          - { text: "Chronic COX-2 inhibitors", bin: 1 }
          - { text: "Anticardiolipin", bin: 1 }
        why: "الخمسة الأولانيين بيعملوا atherosclerosis. الباقي (ومعاهم vasculitis زي GCA وPAN وSLE، والـ thrombocythemia والـ thrombophilia) بيعملوا stroke بطرق تانية."
      - kind: aside
        tone: trap
        page: 86
        quote: "Thrombocythemia & thrombophilia (protein c deficiency, factor V --- Venous thrombosis rather than arterial)."
        text: "فخ: الـ **thrombophilia** (protein C deficiency، factor V) بتعمل **venous thrombosis rather than arterial**. يعني فكّر فيها مع الـ venous sinus thrombosis، مش مع جلطة الـ MCA."
      - kind: try
        items: [geri.L05.002, geri.L05.003, geri.L05.013, geri.L05.017]
    recap:
      - "Stroke: acute، focal، at least 24 hours، من الدورة الدموية للمخ."
      - "80% thromboembolic، 10% cerebral/cerebellar Hge، 5% SAH."
      - "Ischemic: 2/3 thrombosis (بيسبقها TIAs)، 1/3 embolism (maximal at onset)."
      - "Embolus: anterior ← MCA (85% flow)، posterior ← apex of basilar."
      - "GCA: headache، tender scalp، jaw claudication، فقد بصر مفاجئ."
    practice: [geri.L05.001, geri.L05.002, geri.L05.003, geri.L05.004, geri.L05.005, geri.L05.006, geri.L05.007, geri.L05.008, geri.L05.009, geri.L05.010, geri.L05.011, geri.L05.012, geri.L05.013, geri.L05.014, geri.L05.015, geri.L05.016, geri.L05.017, geri.L05.018, geri.L05.019, geri.L05.044, geri.L05.045, geri.L05.046, geri.L05.047]
