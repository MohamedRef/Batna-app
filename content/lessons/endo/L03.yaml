  # Split from lesson1 on 2026-11-13 (#828): the criteria and the nature of ectopic hormones.
  - id: endo.L03.lesson5
    title: "إزاي تثبت إن الورم هو اللي بيعمل الهرمون؟"
    hook: "هرمون عالي وورم في نفس المريض. صدفة ولا الورم هو الفاعل؟ سبع معايير زي تحقيق جنائي."
    minutes: 8
    pages: [32, 34]
    topics: [criteria, ectopic-nature]
    goals:
      - "تعدّ معايير الـ endocrine PNS وتعرف كل واحد بيثبت إيه"
      - "تفهم ليه الـ ectopic hormone هو في الحقيقة eutopic"
      - "تعرف ليه الـ immunoassay ممكن يطلع عالي والـ bioassay واطي"
    status: unverified
    steps:
      - kind: mnemonic
        page: 32
        quote: "Criteria for diagnosing Endocrinal Paraneoplastic Syndrome\n  1) Association of neoplastic disease with manifestations of excess hormone secretion.\n  2) Demonstration of mRNA in neoplastic tissue.\n  3) Demonstration of high hormone level in the circulation.\n  4) Failure of plasma or urinary hormone level to respond to normal suppression."
        word: "AMHFSER"
        parts:
          - { key: "A", text: "Association: tumour + hormone-excess picture" }
          - { key: "M", text: "mRNA of the hormone in tumour tissue" }
          - { key: "H", text: "High circulating hormone" }
          - { key: "F", text: "Fails normal suppression" }
          - { key: "S", text: "Step-up AV gradient across the tumour (>10)" }
          - { key: "E", text: "Exclude other causes" }
          - { key: "R", text: "Response: improves after tumour treatment" }
        hook: "السبع معايير بالترتيب بتاع الكتاب. أهم اتنين في الامتحان: الـ **step-up gradient** والـ **response بعد العلاج**."
      - kind: explain
        page: 33
        quote: "5) Arteriovenous step-up gradient more than ten if the hormone level across the tumor.\n  6) Exclusion of other causes of excess hormone secretion.\n  7) Biochemical and clinical improvement after neoplasm Rx."
        title: "كل معيار بيثبت إيه؟"
        text: |
          المعايير زي تحقيق: كل واحد بيقفل باب شك.
          - **Association + high hormone**: في جريمة (هرمون زيادة) وفي متهم (ورم) في نفس المكان.
          - **mRNA في الورم**: يعني الخلايا دي فعلًا بتقرا الجين، مش بس بتمتص الهرمون من الدم.
          - **Failure to suppress**: الغدة الطبيعية بتسمع الـ feedback، الورم لأ. يعني اللي مش بيتكبت جاي من حد مش بيسمع.
          - ==AV step-up gradient أكتر من 10==: الدم الخارج من الورم فيه هرمون أكتر بكتير من الداخل له، فالورم بيضيف الهرمون بإيده.
          - **Exclusion**: نشيل باقي المتهمين.
          - ==Improvement after treatment==: أقوى دليل، شلنا المتهم والجريمة وقفت.
      - kind: figure
        page: 33
        quote: "5) Arteriovenous step-up gradient more than ten if the hormone level across the tumor.\n  6) Exclusion of other causes of excess hormone secretion.\n  7) Biochemical and clinical improvement after neoplasm Rx."
        title: "الـ step-up gradient: الوريد أعلى من الشريان"
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="x03a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <path d="M10 82H112" class="fg-ink"/>
            <path d="M10 108H112" class="fg-ink"/>
            <path d="M218 82H320" class="fg-ink"/>
            <path d="M218 108H320" class="fg-ink"/>
            <path d="M40 95H100" class="fg-arrow" marker-end="url(#x03a)"/>
            <path d="M230 95H312" class="fg-arrow" marker-end="url(#x03a)"/>
            <ellipse cx="165" cy="95" rx="56" ry="42" class="fg-acc"/>
            <text x="165" y="92" text-anchor="middle" class="t-b">Tumour</text>
            <text x="165" y="108" text-anchor="middle" class="t-sm">makes hormone</text>
            <circle cx="24" cy="90" r="3" class="fg-dot-bad"/>
            <circle cx="70" cy="101" r="3" class="fg-dot-bad"/>
            <circle cx="236" cy="88" r="3" class="fg-dot-bad"/>
            <circle cx="248" cy="101" r="3" class="fg-dot-bad"/>
            <circle cx="262" cy="89" r="3" class="fg-dot-bad"/>
            <circle cx="274" cy="102" r="3" class="fg-dot-bad"/>
            <circle cx="288" cy="88" r="3" class="fg-dot-bad"/>
            <circle cx="300" cy="101" r="3" class="fg-dot-bad"/>
            <circle cx="314" cy="89" r="3" class="fg-dot-bad"/>
            <text x="10" y="70" class="t-sm t-b">Artery in</text>
            <text x="10" y="126" class="t-sm">hormone: 1×</text>
            <text x="320" y="70" text-anchor="end" class="t-sm t-b">Vein out</text>
            <text x="320" y="126" text-anchor="end" class="t-sm t-bad t-b">hormone: &gt; 10×</text>
            <text x="165" y="168" text-anchor="middle" class="t-sm">Step-up gradient &gt; 10: the tumour adds it</text>
            <text x="165" y="186" text-anchor="middle" class="t-sm t-mut">criterion 5 of 7</text>
          </svg>
        caption: |-
          الشريان على الشمال داخل الورم ومعاه شوية هرمون (نقط قليلة)، والوريد على اليمين خارج منه ومليان هرمون (نقط كتير). لو اللي في الوريد ==أكتر من 10 أضعاف== اللي في الشريان، يبقى الورم نفسه هو اللي **بيضيف** الهرمون للدم، مش بس بيمتصه أو بيخزّنه.

          ده المعيار الخامس من السبعة (حرف **S** في الـ mnemonic)، وهو أقرب دليل "بالإيد" بعد الـ improvement بعد العلاج.
        alt: "Diagram: blood enters a tumour through an artery with a low hormone level and leaves through a vein with more than ten times as much hormone; a step-up gradient above ten shows the tumour adds the hormone."
      - kind: reveal
        page: 33
        quote: "It represents increased expression of genes normally expressed in low amounts by non-neoplastic cells."
        prompt: "الكتاب بيقول إن الـ ectopic hormone مش ectopic، هو eutopic. يعني إيه؟"
        answer: "يعني الجين ده **موجود أصلًا وشغال بكمية قليلة** في الخلايا الطبيعية. الورم مش اخترع حاجة جديدة، هو بس علّى الـ expression بتاعه. يعني الهرمون في مكانه (eutopic)، بس بكمية مش طبيعية."
      - kind: table
        page: 33
        quote: "The gene expression products of undifferentiated neoplastic cells are usually physiologically active, and it includes:\n  1) Hormones - ACTH.\n  2) Hormone precursor - Proopiomelanocortin.\n  3) Enzymes - Alkaline phosphatase.\n  4) Fetal protein - Alpha-Fetoprotein.\n  5) Cytokine - Colony stimulating F."
        title: "منتجات الورم"
        columns: ["Class", "Example"]
        rows:
          - ["Hormone", "ACTH"]
          - ["Precursor", "Pro-opiomelanocortin"]
          - ["Enzyme", "Alkaline phosphatase"]
          - ["Fetal protein", "Alpha-fetoprotein"]
          - ["Cytokine", "Colony stimulating factor"]
        hide: [[1, 1], [3, 1], [4, 1]]
      - kind: explain
        page: 33
        quote: "These products have many clinical implications\n  1) It is used as a tumor marker.\n  2) It is important for follow up of patients.\n  3) It is important for detection of recurrence.\n  4) It may be responsible for serious manifestations like PTHRP causing hypercalcemia.\n  5) It may promote the growth of the tumor by autocrine effect."
        title: "ليه نهتم؟"
        text: |
          المنتجات دي:
          - ==Tumor marker==.
          - مهمة في الـ **follow up** وكشف الـ **recurrence**.
          - ممكن تعمل مضاعفات خطيرة (زي الـ parathyroid hormone-related protein (PTHrP) والـ hypercalcemia).
          - ممكن تكبّر الورم نفسه بـ **autocrine effect**.

          ليه تنفع **tumor marker** وفي الـ **recurrence**؟ لأن كميتها ماشية مع كمية الخلايا: الورم يصغر بالعلاج فالـ marker ينزل، ولو رجع يعلى يبقى الورم رجع، أحيانًا قبل ما يبان في الأشعة. وليه **autocrine**؟ يعني الخلية بتفرز growth factor وعلى سطحها receptor ليه، فبتنبّه نفسها تكبر.
      - kind: explain
        page: 34
        quote: "The sequence of AA in poly-peptide ectopic hormone is identical to that of the native hormone."
        title: "شكل الـ ectopic hormone"
        text: |
          الـ amino acid sequence ==identical== للهرمون الطبيعي. الفرق كله من الـ **processing** الغلط للـ precursor، فممكن الـ immunoassay يطلع عالي والـ bioassay واطي:
          - **High molecular weight (MW)**: الـ precursor ما اتقطعش (POMC).
          - **Low MW**: fragment (GHRH fragment).
          - **Altered glycosylation**: glycosylated adrenocorticotropic hormone (ACTH)، أو alpha subunit بتاع human chorionic gonadotropin (hCG).

          والـ ectopic hormone ممكن يبقى polypeptide (ACTH)، monoamine (adrenaline)، أو steroid (1,25-dihydroxy vit D).

          ليه الـ immunoassay بيكدب؟ الـ immunoassay بيدوّر على **شكل** حتة من الجزيء (antibody بيمسك epitope)، أما الـ bioassay بيقيس **الشغل**. الـ precursor الكبير أو الـ fragment ممكن يكون شايل الـ epitope فيتعدّ، بس مش عارف يركب على الـ receptor فمش بيشتغل. يعني رقم عالي في المعمل وتأثير ضعيف في المريض.
      - kind: check
        page: 34
        quote: "Accordingly, Immunoassay of ectopic hormone may show high level with low bioassay level:"
        question: "A tumour's ACTH reads very high on immunoassay but its biological effect is weak. The likely reason:"
        options: ["Abnormal processing of the precursor, e.g. uncleaved POMC", "A different amino-acid sequence from native ACTH", "The assay detects cortisol", "The tumour makes a steroid instead"]
        answer: 0
        why:
          - "صح: الـ sequence زي الطبيعي، والفرق في الـ processing: high MW (POMC) أو fragment أو glycosylation غلط."
          - "الكتاب بيقول الـ sequence **identical**."
          - "الـ immunoassay بيقيس الـ ACTH مش الـ cortisol."
          - "الـ steroids نادرًا ما بتتعمل في الأورام."
      - kind: match
        page: 34
        quote: "The Endocrine Paraneoplastic Syndrome\n  1) Ectopic PTHRP Hypercalcemia.\n  2) Ectopic ACTH Cushing Syndrome.\n  3) Ectopic IGFII Hypoglycemia.\n  4) Ectopic ADH SIAD Syndrome.\n  5) Ectopic HCG Gynecomastia.\n  6) Fibroblast growth factor 23 Oncgenic osteomalcia.\n  7) Ectopic GH and GHRH Acromegaly."
        prompt: "وصّل المنتج بالمتلازمة:"
        pairs:
          - ["PTHrP", "Hypercalcaemia"]
          - ["ACTH", "Cushing's syndrome"]
          - ["IGF-II", "Hypoglycaemia"]
          - ["ADH", "SIADH"]
          - ["hCG", "Gynaecomastia"]
          - ["FGF-23", "Oncogenic osteomalacia"]
        why: "والسابعة: growth hormone (GH) و growth hormone-releasing hormone (GHRH) بيعملوا acromegaly."
      - kind: try
        items: [endo.L03.008, endo.L03.009, endo.L03.011, endo.L03.013, endo.L03.015]
    recap:
      - "7 criteria: association، mRNA، high level، no suppression، AV step-up >10، exclusion، improvement بعد العلاج."
      - "Ectopic = eutopic: جين طبيعي بيشتغل بكمية قليلة واتعلّى."
      - "المنتجات: hormone، precursor، enzyme، fetal protein، cytokine؛ marker، follow up، recurrence، مضاعفات، autocrine."
      - "الـ sequence زي الطبيعي والفرق في الـ processing: immunoassay عالي و bioassay واطي."
      - "7 متلازمات: PTHrP، ACTH، IGF-II، ADH، hCG، FGF-23، GH/GHRH."
    practice: [endo.L03.008, endo.L03.077, endo.L03.009, endo.L03.010, endo.L03.011, endo.L03.012, endo.L03.013, endo.L03.014, endo.L03.015, endo.L03.016, endo.L03.017, endo.L03.018, endo.L03.056, endo.L03.057, endo.L03.072, endo.L03.073]
  # ------------------------------------------------------------------
  - id: endo.L03.lesson2
    title: "الكالسيوم العالي في السرطان"
    hook: "مريض سرطان رئة مش مركّز، إمساك، وبيشرب مية كتير. الكالسيوم 15. ومين السبب؟"
    minutes: 8
    pages: [35, 36]
    topics: [pthrp]
    goals:
      - "تعرف التلات ميكانيزمات للـ hypercalcemia في الأورام"
      - "تفرّقها عن الـ primary hyperparathyroidism بالتحاليل"
      - "تعالج حسب مستوى الكالسيوم"
    status: unverified
    steps:
      - kind: explain
        page: 35
        quote: "Etiology:\n  1. T cell lymphoma 50%.\n  2. Multiple myeloma 40%.\n  3. Bronchogenic Ca.12%.\n  4. Others, Ca. bladder, GIT, ovary, head and neck."
        title: "الأسباب حسب الكتاب"
        text: |
          أول حالة اتسجلت سنة **1924**. الأسباب:
          - ==T cell lymphoma 50%==.
          - **Multiple myeloma 40%**.
          - **Bronchogenic carcinoma 12%**.
          - وغيرهم: bladder، gastrointestinal tract (GIT)، ovary، head and neck.

          ليه الأورام الدموية فوق القايمة؟ لأنها عايشة **جوه العضم**: الـ lymphoma والـ myeloma خلاياها في النخاع جنب الـ osteoclasts، فالـ cytokines اللي بتفرزها بتشغّل الـ osteoclasts على طول (ده الـ LOH في الرسمة الجاية). أما الـ bronchogenic فبيعمل الكالسيوم من بعيد بهرمون في الدم (HHM).
