          التفسير المقبول (مش في الكتاب): البنكرياس الطبيعي لما السكر يوطى بيقفل الـ insulin خالص. الـ insulinoma **مش بيسمع الكلام**، بيفضل يفرز وهو السكر واطي. فالصيام بيوصّل السكر للأرض، وساعتها لو لقيت insulin عالي (أو حتى طبيعي) يبقى ده غلط. وعشان كده لازم **في المستشفى**: الـ hypo ممكن يبقى شديد ومحتاج glucose فورًا.

          والـ **proinsulin** بيتقاس لأن الورم بيطلّع insulin مش متشطّب كويس، فنسبة الـ proinsulin بتعلى.
