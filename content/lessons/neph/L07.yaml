  - id: neph.L07.lesson3
    title: "علاج الـ ADPKD: الألم والنزيف والـ infection والضغط"
    hook: "الكيس المتلوّث أوضة مقفولة، ومش أي antibiotic يدخلها. والضغط في الـ ADPKD مش رقم، ده سرعة الكلية للـ dialysis."
    minutes: 10
    pages: [157, 161]
    topics: [adpkd-tx, adpkd-ckd]
    goals:
      - "تعالج الـ flank pain درجة درجة وتعرف ليه بلاش NSAIDs"
      - "تختار الـ antibiotic اللي بيدخل الكيس وتعرف ليه"
      - "تعرف ليه الـ potassium citrate والـ ACEI/ARB والميه الكتير"
      - "تعرف نتايج الـ dialysis وعلاج الكبد والـ aneurysm"
    status: unverified
    steps:
      - kind: order
        page: 157
        quote: "Causes of flank pain that may require intervention, such as infection, stone, and tumor, should be excluded. Care should be taken to avoid long-term administration of nephrotoxic agents, such as combination analgesics and nonsteroidal antiinflammatory drugs. Narcotic analgesics cian are essential. Reassurance, lifestyle modification, and avoidance of aggravating activities may be helpful. Tricyclic antidepressants are helpful as in other chronic pain syndromes, with a generally well-tolerated side effect profile. Splanchnic nerve blockade with local anesthesia or corticosteroids results in pain relief prolonged beyond the duration of the local anesthetic. For the pain and conservative measures fail, cyst decompression should be considered. Cyst aspiration, under ultrasound or CT guidance, is a relatively simple procedure. To prevent the reaccumulation of cyst fluid, sclerosing agents such as 95% ethanol, acidic solutions of minocycline, or sodium tetradecyl sulfate may be used. Minor complications include."
        prompt: "رتّب علاج الـ flank pain المزمن:"
        steps:
          - "Exclude infection, stone, tumor"
          - "Simple analgesia, reassurance, tricyclics"
          - "Splanchnic nerve block"
          - "Cyst aspiration + sclerosant"
          - "Laparoscopic or surgical fenestration"
        why: "استبعد الأسباب اللي محتاجة تدخّل الأول، وبعدين اطلع درجة درجة. وابعد عن الـ **non-steroidal anti-inflammatory drugs (NSAIDs)** والـ combination analgesics على المدى الطويل (nephrotoxic)."
      - kind: explain
        page: 157
        title: "ليه بلاش NSAIDs، وليه tricyclics؟"
        quote: "Care should be taken to avoid long-term administration of nephrotoxic agents, such as combination analgesics and nonsteroidal antiinflammatory drugs."
        text: |
          الكتاب بيقول تجنّب الاستعمال الطويل للـ ==nephrotoxic agents== زي الـ combination analgesics والـ NSAIDs. ليه؟ لأن الكلية دي أصلًا بتخسر nephrons كل سنة، وأي ضربة زيادة بتقرّب الـ dialysis.

          والـ **tricyclic antidepressants** بتساعد زي ما بتساعد في أي **chronic pain syndrome**، وآثارها الجانبية متحمّلة.

          ولو الألم من **كيس واحد كبير**: aspiration بالسونار أو الـ CT، ومعاه **sclerosing agent** (95% ethanol، minocycline، أو sodium tetradecyl sulfate) **علشان** الكيس ما يتملاش تاني. ولو أكياس كتير: **fenestration**، اللي بتريّح **80–90%** في سنة، وما بتسرّعش ولا بتحمي الـ renal function.
      - kind: explain
        remind: [neph.L07.031]
        page: 158
        title: "النزيف والـ infection"
        quote: "Therapeutic agents of choice include trimethoprim-sulfamethoxazole and fluoroquinolones, both of which have favorable intra cystic thera-peutic concentration gradients at physiologic pH in gradient and non-gradient cysts. If fever persists after 1 to 2 weeks of appropriate antimicrobial therapy, infected cysts should be drained percutaneously or surgically. In the case of end- stage polycystic kidneys, nephrectomy should be considered. If fever recurs after stopping antibiotics, complicating features such as obstruction, perinephric abscess, and stone should be excluded. If no"
        text: |
          **Cyst hemorrhage**: بيخلص لوحده: **bed rest، analgesics، ميه كتير** علشان الـ clots ما تسدّش. الشديد: transfusion، tranexamic acid، **segmental embolization**، وآخر حل جراحة.

          **Cyst infection**: عالج الـ cystitis والـ asymptomatic bacteriuria بسرعة. المضاد لازم يدخل الكيس: ==TMP-SMX أو fluoroquinolones== (lipophilic).

          لسه سخن بعد **1–2 أسبوع**؟ **Drainage**. ولو رجعت الحرارة بعد ما وقفت: دوّر على obstruction أو perinephric abscess أو stone.

          ليه TMP-SMX والـ fluoroquinolones بالذات؟ التفسير المقبول (مش في الكتاب): جدار الكيس مش متصل بالدم كويس، والمضادات اللي بتدوب في الميه (زي الـ beta-lactams والـ aminoglycosides) ما بتعدّيهوش. الـ lipophilic بتعدّي الأغشية فتوصل جوّه الكيس بتركيز كفاية. علشان كده عدوى الكيس ممكن تفضل رغم "مضاد مناسب" في البول: المضاد قتل البكتيريا في البول بس ما وصلش الكيس.
      - kind: explain
        page: 158
        title: "ليه الـ TMP-SMX والـ fluoroquinolones بالذات؟"
        quote: "Lipophilic agents have been shown to penetrate cysts reliably and have an acid dissociation constant (pK₂) that allows favorable electrochemical gradients into acidic cyst fluid."
        text: |
          الكتاب بيقول إن الـ treatment failure بيحصل لما المضاد ما يوصلش لتركيز كفاية **جوّه الكيس**. والدوا الناجح لازم يبقى:

          - ==Lipophilic==: علشان يعدّي جدار الكيس، اللي متصرّف كأنه غشا خلايا مقفول.
