  - id: neph.L14.lesson13
    title: "علاج الـ TTP: كل دوا بيضرب حتة"
    hook: "الـ PEX بيشيل، والـ plasma بيعوّض، والـ steroid بيوقف المصنع، والـ caplacizumab بيفصل الصفايح."
