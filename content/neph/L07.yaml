  - id: neph.L07.065
    kind: card
    topic: adpkd-dx
    front: When is genetic testing used in ADPKD, and why is PKD1 hard to sequence?
    back: When a precise diagnosis is needed and imaging is indeterminate. PKD1 is duplicated (pseudogenes), so whole-exome sequencing may miss it.
    src: { page: 155, quote: "Genetic Testing Genetic testing can be performed when a precise diagnosis is needed and the results of imaging are indeterminate. Molecular diagnosis of ADPKD is complicated by duplication of the PKDI gene, which means it may not be" }
    status: unverified
  - id: neph.L07.066
    kind: card
    topic: adpkd-dx
    front: How is ADPKD genetic testing done, and how often is it informative?
    back: Direct Sanger or next-generation sequencing of PKD1 and PKD2 with multiplex probe amplification for large rearrangements (NGS panels increasingly). It is informative in about 90%.
    src: { page: 156, quote: "efficiently screened by whole-exome sequencing. For diagnostic purposes, direct mutation screening by Sanger or next generation sequencing of the PKD1 and PKD2 genes is generally performed with multiplex-dependent probe amplification to identify larger rearrangements. However, next-generation sequencing panels of PKD genes are increasingly being employed that have the potential for higher throughput screening and lower costs.21 Molecular testing by direct DNA sequencing is now informative in about 90% of patients. However, in preimplantation genetic diagnosis (PGD), genetic analysis is per- formed on single blastomeres from preimplantation embryo biopsy specimens obtained after in vitro fertilization (IVF), and only embryos unaffected by the disease are selected for transfer. PGD for ADPKD is." }
    status: unverified
    tags: [numbers]
