      - kind: explain
        remind: [dm.L07.039, dm.L07.036]
        page: 81
        title: "7 و 8: الموت المفاجئ والقلب نفسه"
        quote: "CAN may be associated with abnormalities in LV systolic and particularly diastolic function in the absence of cardiac disease."
        text: |
          **ليه الـ mortality أعلى؟** **prolonged QT** و malignant ventricular arrhythmias (**torsades de pointes**)، cardiovascular disease (CVD) مصاحب، renal failure، و **maldistribution of sympathetic innervation**.

          ==Autonomic cardiopathy==: خلل في الـ left ventricle (LV) systolic و**خصوصًا diastolic** function من غير cardiac disease:
          - **delayed relaxation**، **impaired LV filling**، **increased stiffness**
          - ممكن يوصل لـ **diastolic heart failure**
          - والسكر لوحده ممكن يعمل **heart failure (HF) with normal LV systolic function**

          ليه كده؟ التفسير المقبول (مش في الكتاب): الـ **maldistribution of sympathetic innervation** معناها إن حتت من القلب واصلها sympathetic وحتت لأ، فالكهربا بتخلص في أوقات مختلفة؛ ده بيطوّل الـ QT ويفتح الباب للـ torsades. والـ **relaxation** نفسه شغل محتاج طاقة، فهو أول حاجة تتعب في عضلة تعبانة؛ ده ليه الـ diastolic بيقع قبل الـ systolic.
