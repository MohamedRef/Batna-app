      - kind: order
        page: 89
        quote: "Absence of response to a properly administered PPI trial typically prompts an endoscopic evaluation."
        prompt: "رتّب الـ work-up لحد ما توصل لـ functional heartburn:"
        steps:
          - "Optimal-dose PPI trial for 4 weeks"
          - "Upper endoscopy"
          - "pH or impedance-pH test off PPI for 7 days"
          - "Esophageal manometry"
          - "Diagnose functional heartburn"
        why: "الـ proton pump inhibitor (PPI) trial الأول لأنه أرخص وأسهل. لو فشل يبقى esophagogastroduodenoscopy (EGD). لو نضيف يبقى pH test (والـ PPI متوقف 7 أيام علشان ما يخبيش الحمض). وفي الآخر manometry تستبعد achalasia و DES."
      - kind: table
        page: 89
        quote: "Unlike functional heartburn, where patients have normal acid exposure time and negative symptom association, patients with a hyper sensitive esophagus have normal acid exposure time and a positive symptom association."
        title: "Functional heartburn ولا reflux hypersensitivity؟"
        columns: ["Finding", "Functional heartburn", "Reflux hypersensitivity"]
        rows:
          - ["Acid exposure time", "Normal", "Normal"]
          - ["Symptom association", "Negative", "Positive"]
          - ["Endoscopy", "Normal", "Normal"]
        hide: [[1, 1], [1, 2]]
      - kind: reveal
        page: 89
        quote: "With a normal endoscopy, an ambulatory or an impedance pH test is undertaken after keeping the patient off a PPI for at least 7 days."
        prompt: "ليه نوقف الـ PPI أسبوع على الأقل قبل الـ pH test؟"
        answer: |
          الكتاب: لو المنظار طبيعي، بنعمل **ambulatory** أو **impedance pH test** بعد ما المريض يبطّل الـ PPI ==7 أيام على الأقل==.

          التفسير المقبول (مش في الكتاب): السؤال اللي الـ pH test بيجاوبه هو «هل فيه حمض زيادة طبيعيًا؟». لو المريض لسه على PPI، الحمض هيبقى مكبوت، فالنتيجة هتطلع طبيعية حتى لو هو عنده GERD، وهتشخّص functional heartburn غلط. والأسبوع كفاية علشان أثر الـ PPI على الـ proton pumps يروح.
      - kind: explain
        remind: [git.L03.051]
        page: 90
        quote: "Visceral hyperalgesia is the main mechanism underlying functional heartburn"
        title: "مين المريض، وإيه السبب؟"
        text: |
          مريض الـ ==functional heartburn== غالبًا **young**، **nonobese**، و **women** أكتر.

          الجروب ده هو **most of the patients with GERD who are refractory to PPI therapy**: يعني أغلب "الـ GERD اللي مش بيرد على PPI" هو أصلًا مش GERD.

          السبب الأساسي ==visceral hyperalgesia==، علشان كده العلاج بـ **pain modulators** زي tricyclic antidepressants (TCAs) و selective serotonin reuptake inhibitors (SSRIs)، مش بزيادة الـ PPI.

          والـ Rome IV criteria بتطلب الأعراض **at least twice a week**، وباقي الـ domain A (chest pain، globus، dysphagia) **once a week**.
      - kind: check
        page: 90
        quote: "They need treatment with pain modulators such as Tricyclic antidepressants and selective serotonin reuptake inhibitors."
        question: "A slim 28-year-old woman has heartburn despite twice-daily PPI. EGD is normal, acid exposure off PPI is normal, symptom association is negative, and manometry is normal. Best next step"
        options:
          - "A pain modulator such as a tricyclic antidepressant"
          - "Increase the PPI to four times daily"
          - "Laparoscopic fundoplication"
          - "Heller myotomy"
        answer: 0
        why:
          - "صح: ده functional heartburn، والآلية visceral hyperalgesia، فالعلاج pain modulators (TCAs أو SSRIs)."
          - "مفيش reflux زيادة أصلًا، فزيادة الـ PPI مش هتفرق."
          - "الجراحة للـ reflux الحقيقي، والـ acid exposure time (AET) هنا طبيعي."
          - "الـ myotomy للـ achalasia، والـ manometry هنا طبيعية."
      - kind: reveal
        page: 90
        quote: "The functional heartburn group, therefore, accounts for most of the patients with GERD who are refractory to PPI therapy."
        prompt: "ليه أغلب الـ refractory GERD طلعوا functional heartburn؟"
        answer: |
          الكتاب: الـ functional heartburn ==accounts for most== of the patients with GERD who are refractory to PPI therapy، والآلية الأساسية **visceral hyperalgesia**.

          التفسير المقبول (مش في الكتاب): الـ PPI بيعالج **الحمض**. لو المشكلة في **الإحساس** (المريء بيترجم أي حاجة كحرقان)، تقليل الحمض مش هيفرق. فلما مريض ما يتحسنش على PPI مضبوط، ما تزوّدش الجرعة على طول، فكّر إن السبب ممكن يكون مش حمض أصلًا، وكمّل الـ work-up (منظار، pH، manometry).
      - kind: aside
        tone: joke
        page: 91
        quote: "Capsaicin, the active ingredient in red chili, on acute (<1 week) exposure may induce more reflux episodes , but on chronic (5–6 weeks) exposure may desensitize the esophagus and modulate the TRPV1 receptors."
        text: |
          علاج غريب في الكتاب: **red chili** لمدة 5–6 أسابيع حسّن الـ heartburn والـ functional dyspepsia!

          السر في الـ ==capsaicin==: في الأول (**<1 week**) ممكن يزوّد الـ reflux، بس على المدى الطويل (**5–6 weeks**) بيعمل desensitization للمريء عن طريق الـ **transient receptor potential vanilloid 1 (TRPV1) receptors**. الشطة بتحرق الأول، وبعدين المريء "بيتعوّد" ويبطّل يشتكي.

          وباقي النصايح: بلاش الأكل الدسم، وخس الوزن لو فيه overweight.
      - kind: explain
        page: 91
        quote: "Since patients with functional heartburn have heightened esophageal sensitivity, therapies used for functional chest pain may also be useful in patients with functional heartburn"
        title: "الأكل والنفسية في العلاج"
        text: |
          الكتاب:
          - الـ **red chili** 5–6 أسابيع حسّن الـ functional dyspepsia والـ heartburn. والـ **capsaicin** على المدى القصير (أقل من أسبوع) ممكن **يزوّد** الـ reflux، وعلى المدى الطويل بيعمل ==desensitization== للمريء ويعدّل الـ **TRPV1 receptors**.
          - تجنّب الأكل الدسم وتنزيل الوزن في الـ overweight: بيتنصح بيهم في الممارسة، **مع إنهم مش مدعومين بأدلة قوية**.
          - **Psychosomatic factors**: لأن المريء ==heightened sensitivity==، العلاجات اللي بتتستخدم في الـ functional chest pain ممكن تفيد هنا كمان.

          التفسير المقبول (مش في الكتاب) للـ capsaicin: الـ TRPV1 هو نفس الـ receptor اللي بيحس بالحرقان. لو ضربته بالمنبّه كتير، بيتعب ويبطّل يبعت إشارة، زي اللي بياكل شطة كل يوم وبطّل يحس بيها.
      - kind: check
        page: 89
        quote: "Optimally dosed PPI taken once or twice daily for 4 weeks is generally accepted as an empiric PPI trial."
        question: "What is generally accepted as an empiric PPI trial for heartburn in the lecture?"
        options:
          - "Optimally dosed PPI once or twice daily for 4 weeks"
          - "Half-dose PPI for 1 week"
          - "PPI three times daily for 6 months"
          - "A single PPI dose before endoscopy"
        answer: 0
        why:
          - "صح: الكتاب: **optimally dosed**، مرة أو مرتين، **4 أسابيع**."
          - "التفسير المقبول (مش في الكتاب): أسبوع بنص الجرعة مش كفاية تحكم إن الـ PPI فشل."
          - "مش مذكور، والمدة الطويلة دي مش «trial»."
          - "جرعة واحدة ما بتختبرش حاجة."
      - kind: try
        items: [git.L03.057, git.L03.061, git.L03.064, git.L03.065, git.L03.068]
    recap:
      - "الـ functional esophageal disorders أربعة: heartburn، chest pain، dysphagia، globus؛ تشخيص بالاستبعاد، والعلاج بأدلة قليلة."
      - "Heartburn بيزيد بعد الأكل والمجهود والنوم؛ PPI trial 4 أسابيع مرة أو مرتين."
      - "مفيش response ← EGD ← pH off PPI 7 أيام ← manometry ← functional heartburn."
      - "Functional heartburn: AET طبيعي و symptom association سلبي. Reflux hypersensitivity: AET طبيعي و symptom association إيجابي."
      - "شابة، نحيفة، ست؛ visceral hyperalgesia؛ أغلب الـ refractory GERD؛ TCAs و SSRIs؛ chili 5–6 أسابيع (TRPV1)."
    practice: [git.L03.056, git.L03.057, git.L03.060, git.L03.061, git.L03.062, git.L03.063, git.L03.064, git.L03.065, git.L03.066, git.L03.067, git.L03.068, git.L03.069, git.L03.072, git.L03.073, git.L03.074, git.L03.075, git.L03.076, git.L03.079, git.L03.080, git.L03.081, git.L03.269]
